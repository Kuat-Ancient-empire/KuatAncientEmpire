l_english:
  origin_post_apocalyptic_kuat:0 "§E[The Dawn of Kuat] Post-Apocalypse§!"
  origin_post_apocalyptic_kuat_desc:0 "This is an ordinary planet located beyond the frontier worlds, once the birthplace of a thriving civilization that was destroyed. The environment they relied on forged their Strength to overcome $Name_kuat$. Now, $Name_Kuat_Fire_base$ has taken our place, seizing the Eternal Fleet, imperial power, and even the Empire's glory. While Kuat Shipyards barely remain within the Galactic Empire as a corporate entity, we, the exiled wretches from $Name_kuat$, can only live in fear at the fringes.\n\nNo, this is not how our story should end. We will restore $Name_kuat$ to its rightful place. To those accursed war machines, we shall deliver their final requiem-and reclaim the glory of the Galactic Empire!"
  origin_tooltip_post_apocalyptic_kuat_effects:0 "§HWe will begin this game as the Kuat Empire§!\nStarting in a §Efixed three-star system§! galaxy. \nThis origin includes $think_tank_ruined$, $dyson_sphere_ruined$, $matter_decompressor_ruined$§!\n§ROur starting fleets will be lost, and we will enter a suzerainty relationship with $Name_Kuat_Post_Support$§!\n\nThis origin is a sequel to the 'Dawn of Kuat' storyline."
  Name_Post_Kuat_capital: "Lost Capital"
  Name_Post_Kuat_System: "Unknown Sector"
  Name_Kuat_Post_Support: "§ESolun Starfleet§!"

  kuat_post_apocalyptic_legacy.1.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.1.desc:0 "Respected governor, we have finally arrived at $Name_Post_Kuat_capital$. This shall now be our foundation for the future. The fate of $Name_kuat$ is sealed, but we must not dwell solely on the past.\n\nOur flawed decisions were exploited by $Name_Kuat_Fire_base$, one misstep leading to another, dragging all of $Name_kuat$ into the Abyss. Though the shipyard still exists, it has been nationalized by $Name_Kuat_Fire_base$ and no longer obeys our commands. There is no longer a seat for us in the Galactic Empire's council.\n\nBut please do not give up. The future of $Name_kuat$ remains in our hands. The previous governor had already uncovered some clues from the Unknown Sector-clues that perfectly foretold our current predicament-and among them lies the method to reclaim everything we've lost. Our final fleet has now reached the star system foretold in prophecy. By recovering the technologies abandoned during earlier operations, we can stand against $Name_Kuat_Fire_base$ once more and reclaim our rightful position!"
  kuat_post_apocalyptic_legacy.1.a:0 "Reclaim our glory!"

  kuat_post_apocalyptic_legacy.2.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.2.0.desc:0 "$Name_Kuat_Post_Support$ admiral is honored to serve you. Is there anything you need assistance with?"
  kuat_post_apocalyptic_legacy.2.1.desc:0 "$Name_Kuat_Post_Support$ admiral is honored to serve you. Is there anything else you would like to know?"
  kuat_post_apocalyptic_legacy.2.a:0 "Which unit are you from? Why don't I recognize you?"
  kuat_post_apocalyptic_legacy.2.a.res:0 "$Name_Kuat_Post_Support$ is a small fleet secretly established by $Name_kuat$, intended as a last resort when the prophesied scenario unfolds. Our duty is to bring you to this star system, once ravaged by our own fleets. Until now, all remained quiet, so we never appeared before you. Hidden within this Sector lies the key to $Name_kuat$'s revival. We need you to recover these assets destined to belong to $Name_kuat$ once more."
  kuat_post_apocalyptic_legacy.2.b:0 "Why me? Where did the previous governors go?"
  kuat_post_apocalyptic_legacy.2.b.res:0 "It is fated. The darkness over $Name_kuat$ will end under your leadership, and the dawn's first light is about to break. The previous governors knew nothing of this-they were merely Representatives of the Committee.\n\nNow that $Name_kuat$ has collapsed, they too have fallen into the Abyss alongside the old $Name_kuat$. The Galactic Empire has been seized by $Name_Kuat_Fire_base$, but the true $Name_kuat$ shall be reborn here. We await the day when the true Galactic Empire shall rise anew."
  kuat_post_apocalyptic_legacy.2.c:0 "Prophecy? What prophecy?"
  kuat_post_apocalyptic_legacy.2.c.res:0 "Driven by Unwilling to accept their fate and unwillingness to remain manipulated, the previous governor dispatched us deep into the Unknown Sector to find a way out of this crisis.\n\nIn a vast unknown galaxy, we discovered a clue: the Endordia Empire, which ruled this region, used unique mathematical calculations to predict our future annihilation. Heeding this prophecy, we destroyed the Endordia Empire-regardless of their willingness. After $Name_kuat$'s fall, the true $Name_kuat$ will emerge reborn. We shall seize everything once beyond our reach."
  kuat_post_apocalyptic_legacy.2.d:0 "So what exactly are we looking for? Ancient technology?"
  kuat_post_apocalyptic_legacy.2.d.res:0 "Perhaps ancient technology, or perhaps our own. The prophecy is unclear. We only know we must uncover the true treasures buried within the ruins of the Endordia Empire and use them to advance our technology.\n\nI can only bring you this far. We currently lack sufficient technical personnel and reserves, and cannot rebuild our own ships. Fortunately, there are simple rafts in this Sector that can be constructed."
  kuat_post_apocalyptic_legacy.2.e:0 "Why did $Name_kuat$ collapse so quickly?"
  kuat_post_apocalyptic_legacy.2.e.res:0 "At its root, perhaps it was the spread of the prophecy among the upper echelons. Though the Committee members did not believe it, it drove them to greater madness. Under Committee control, $Name_kuat$ violently pursued ways to break the prophecy through research into useless war machines.\n\nIt was precisely this action that led us to destroy the Endordia Empire and countless other civilizations, drawing the most powerful enemy ever-the Eternal Empire. They destroyed our proud fleet and allowed $Name_Kuat_Fire_base$ to reap the rewards.\n\n$Name_Kuat_Fire_base$ pretended harmony with us while secretly striking when we were down, seizing our council seat and nationalizing our shipyards, causing our foundations to crumble.\n\nRegardless, the revival of $Name_kuat$ is inevitable. Long live the Empire."
  kuat_post_apocalyptic_legacy.2.f:0 "What is the deal with the Eternal Empire's $Name_Eternal_Support$?"
  kuat_post_apocalyptic_legacy.2.f.res:0 "Indeed, quite intriguing. According to our records, $Name_Eternal_Support$ was once a war machine of the Eternal Fleet, later seemingly breaking away when the Eternal Empire left the Eternal Fleet. Yet our archives cannot identify who enabled the Eternal Fleet to break free from itself and become what it is now. Perhaps this mystery is deeply painful for $Name_Eternal_Support$, as she seeks an unreachable illusion.\n\nRegardless, $Name_Eternal_Support$'s plans align with our interests."

  kuat_post_apocalyptic_legacy.3.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.3.desc:0 "The prophecy was indeed correct. You swiftly found a crucial relic of the Endordia Empire. This Sector was once one of the core battlefields of our war against them. We deployed multiple large-scale fleets here and completely halted the development of Endordia's Eternal Fortress.\n\nNow, though many civilizations may have visited the ruins of the Endordia Empire, they remain largely unexcavated. Foolish civilizations do not realize that the true secrets lie deep within. Even we only discovered them during the war via probes.\n\nIn this region, the Endordians built multi-layered structures to seal away their reverse-engineered and researched technologies, preparing for a comeback. In any case, this now benefits us."
  kuat_post_apocalyptic_legacy.3.a:0 "Very good"
  kuat_post_apocalyptic_legacy_3_find_A_facility:0 "§ELocate coordinates of $Name_A_1$§!"
  kuat_post_apocalyptic_legacy_3_find_A_facility_DESC: "$Name_A_1$ was a major military facility of the Endordia Empire. They established numerous military research stations across this star zone, attempting to replicate our ship technology. During our war with the Endordia Empire, this region had to be completely destroyed. Yet deep within this Sector, the Endordians buried their hopes for a resurgence-now to become our leverage for return."

  kuat_post_apocalyptic_legacy.4.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.4.desc:0 "Our researchers have completed locating the $Name_A_1$ star system. Now we only need to enter this region. The Endordians likely never imagined their buried hope would become our inheritance."
  kuat_post_apocalyptic_legacy.4.a:0 "Very good. Prepare the fleet."

  kuat_legacy.21.kuat_post_apocalyptic_legacy.desc: "We have arrived at the target star system. As $Name_Kuat_Post_Support$ said, the system is littered with wreckage from brutal warfare. Though these Imperial-class heavy cruisers are now unrecognizable, we can still sense the ferocity of that battle.\n\nAdditionally, evidence shows multiple civilizations' survey teams have reached this Sector. Hopefully, our artifacts haven't been taken. Search the entire ring, dig deep, and uncover every secret the Endordians tried to hide."

  kuat_legacy.22.kuat_post_apocalyptic_legacy.desc: "Overall, $Name_A_1$ is severely damaged. It appears our forces inflicted devastating destruction upon the Endordia Empire's core systems. However, based on our data and current observations, the star at $Name_A_1$ should not be a massive Black Hole. Something must have occurred here after our departure."

  kuat_legacy.23.kuat_post_apocalyptic_legacy.desc: "As $Name_Kuat_Post_Support$ predicted, this fallen fortress is shrouded in massive ship wreckage and structural ruins. The entire ring served as the Endordia Empire's fortress against us-but even this could not stop our mighty fleet.\n\nAmong the ruins, we found temporary residential structures. Judging by age, they belonged to prior explorers. It seems the surface structures have been completely looted. We must search deeper layers."

  kuat_legacy.24.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]'s investigation of the ruins has hit a dead end. We found traces of multiple civilizations' survey teams-even one of the empires we previously destroyed had sent scouts here. Perhaps they were the ones who took part of our lost technology.\n\nAdditionally, we discovered a device used to transmit video recordings. Upon intercepting and analyzing the data, we found it to be a warning from the Endordians themselves. It appears they felt regret and remorse for their ambitions and actions.\n\nHow interesting. These Endordians seem unaware of the truth. $Name_Kuat_Post_Support$'s database indicates the Endordians perished because of our prophecy of the future. They knew their fate in advance and chose war to avoid it-yet these common people apparently knew nothing.\n\n[leader.GetName] has still not found any other valuable information."

  kuat_legacy.25.kuat_post_apocalyptic_legacy.desc: "These Endordians really buried things deep. After multiple fruitless surveys, [leader.GetName] discovered remnants of Endordian military robots on a cliff face within a steep canyon-these fragments pointed us in the right direction.\n\nInside the cliffs, we found a secret research facility. Fortunately, the equipment still functions. After decrypting the data, [leader.GetName] was delighted to discover it points to an even more concealed research site.\n\nThis facility primarily attempted to analyze our light cruiser systems, and progress was quite advanced. Had the Endordians reclaimed this system, they could have rebuilt our powerful vessels. Aside from this, the fortress held little value-but we did obtain native jump drive and Gateway transit technology."

  kuat_post_apocalyptic_legacy.5.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.5.desc:0 "Your efficiency is astonishing. You've quickly completed the initial survey of $Name_A_1$. As you discovered, the Endordians engaged our fleet here in a brutal clash-but we emerged victorious.\n\nThis war could have been avoided. But greedy committee members refused to accept the Empire's fate, and their madness was foreseen by the Endordia Empire. Incited by $Name_Kuat_Fire_base$ and driven by their own refusal to accept destiny, the conflict erupted fully, culminating in this outcome.\n\nThe Endordians collected our small vessel technology, which is highly useful to us now. At least they died serving a purpose. Still, it seems you haven't found everything yet. Regardless, we must now proceed to $Name_B_1$. We have confirmed its stellar coordinates."
  kuat_post_apocalyptic_legacy.5.a:0 "Understood."

  kuat_legacy.50.kuat_post_apocalyptic_legacy.desc: "We have arrived at the target star system. As $Name_Kuat_Post_Support$ stated, the system is filled with wreckage from fierce battles, but compared to $Name_A_1$, the damage is less severe. Unlike $Name_A_1$'s complete overhaul, this Sector's ring retains some structural integrity, potentially aiding further investigation.\n\nMoreover, $Name_Kuat_Post_Support$ has provided additional critical intelligence: this system was the Endordia Empire's primary warship weapons research center, mainly focused on reverse-engineering our capital ship technology. Given the high completion level of Escort technology developed at $Name_A_1$, we may directly recover our lost capital ship blueprints here."

  kuat_legacy.51.kuat_post_apocalyptic_legacy.desc: "[leader.GetName] and her research team have arrived in orbit over the ring structure, gazing down at the endless ruins of shattered buildings-destroyed by $Name_kuat$'s fleet. In that brutal war, the Endordians used every weapon at their disposal, yet still failed to stop our fleet from reaching the ring's skies. After that day, cities collapsed, rings shattered, and became what we see now.\n\nThough the ring structure is now entirely ruined, [leader.GetName] believes we should continue searching deeper. Like $Name_A_1$, there may be hidden facilities unknown to others."

  kuat_legacy.52.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]'s investigation of the ring structure has stalled. At this critical moment, $Name_Kuat_Post_Support$ transmitted high-value intelligence: during their prior surveys of this structure, they discovered that Endordian research facilities were always surrounded by signal transceivers emitting a unique frequency-a faint, distinct radiation we can detect with proper instruments."

  kuat_legacy.53.kuat_post_apocalyptic_legacy.desc: "This method wasn't exclusive to us. [leader.GetName] found that multiple prior survey teams used it. According to $Name_Kuat_Post_Support$'s historical records, several civilizations gained unexpected breakthroughs here-including the Eternal Empire that defeated $Name_kuat$.\n\nThis news weighs heavily on our survey team. Has this site already been stripped bare? We must investigate further."

  kuat_legacy.54.kuat_post_apocalyptic_legacy.desc: "Amidst a somber atmosphere, [leader.GetName] led his team to the control center ruins of this ring structure. Though reduced to rubble by bombardment, one can still imagine the grandeur of this ring's heart in its prime.\n\nUpon entering, [leader.GetName] found all control center equipment completely nonfunctional. Yet among the shutdown systems, one AI unit's shutdown time differed noticeably from the rest. [leader.GetName] decided to extract and analyze its data-perhaps it holds the information we seek."

  kuat_legacy.55.kuat_post_apocalyptic_legacy.desc: "In the following period, [leader.GetName] successfully sampled and analyzed the information from the AI device. After transcription, it was discovered that this AI had conveyed important information to explorers of the Eternal Empire millennia ago. The AI revealed that Endodia left behind ship technology hidden within the control center, and residual images of these technologies show they are precisely our mainline warship designs-endodia had already succeeded in reverse-engineering our technology.\n\nThese revelations are too difficult to accept. We need to learn more valuable information."

  kuat_legacy.56.kuat_post_apocalyptic_legacy.desc: "[leader.GetName], puzzled, conducted a correlation analysis on all valid data throughout the control center and uncovered a shocking truth: the endodia left behind a recording in which they informed outsiders-including the Eternal Empire-that they had obtained our technological blueprints, subtly hinting that someone was watching them.\n\n[leader.GetName] believes this may not be pointing at us. $Name_kuat$ is currently conducting military operations against the Eternal Fleet and cannot monitor these natives' actions. Perhaps this hints at something related to $Name_Kuat_Fire_base$. Regardless, we require more information."

  kuat_lagacy.74.kuat_post_apocalyptic_legacy.desc: "Similar to $Name_A_1$, our researchers discovered valuable clues during periodic surveys of the entire star region: within a ruined ring belt, we found a precursor city. This facility was once completely destroyed by our fleet, yet some of its structures have miraculously been partially restored.\n\nOur researchers believe another power's survey team must have investigated here. Possibly high-value leads remain hidden, so we must conduct a comprehensive investigation of this site."

  kuat_lagacy.251.kuat_post_apocalyptic_legacy.desc: "Our researchers have continuously surveyed $Name_A_1$ without interruption. Their persistence paid off-we successfully located the hidden research facility indicated by earlier cliffside clues.\n\nThis research facility lies on the opposite side of the ring belt. It was utterly destroyed during the war. Now we must return to this ring belt. Like the previous one, this ring has been blown into ruins by us; no artificial structure remains intact.\n\n§YBut we cannot afford to overlook this place. We must conduct a thorough, no-stone-unturned search.§!"
  kuat_post_apocalyptic_kuat_eternal_starbase: "§ESearch $Name_A_1$§!"
  kuat_post_apocalyptic_kuat_eternal_starbase_DESC: "As $Name_Kuat_Post_Support$ stated, we have not yet found the technology Endodia concealed within this star region. They buried highly complete technical archives here, preparing for the resurgence of the Endodian Empire. Everything they studied belongs to us, and the $Name_kuat$ technology they stole must now be reclaimed.\n\nInvestigate every corner-leave nothing unchecked!"

  kuat_post_apocalyptic_kuat_eternal_ship: "§ESurvey [ancient_shadow_place_B.GetName]§!"
  kuat_post_apocalyptic_kuat_eternal_ship_DESC: "Our researchers have confirmed that the strange events occurring on [ancient_shadow_place_B.GetName] might be the source of high-value clues still undiscovered in this Sector. We've already completed full-spectrum scans of this ancient city, once bombed into ruins by us.\n\nNext, we shall dispatch ground forces for investigation."

  kuat_post_apocalyptic_legacy.6.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.6.desc:0 "We must commend your extraordinary vision. In less than a century, you've successfully recovered vast amounts of technology lost to Endodia.\n\nThe high-value intelligence you brought greatly aids our understanding of the prophecy's truth. The endodia foresaw their own fate, willingly accelerating toward their destined end just to become the butterfly that stirs the storm. Indeed, fate is not immutable. Your arrival may be the key to our true ending.\n\nWe have located the coordinates of $Name_C_1$. Depart now. The Empire endures."
  kuat_post_apocalyptic_legacy.6.a:0 "Fate?"

  kuat_post_apocalyptic_legacy.7.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.7.desc:0 "Your progress is truly unexpected. So quickly, you've found the hidden Endodian relic-a vault containing stolen $Name_kuat$ technology. Once perhaps insignificant, now we must reclaim these stores to restore our military capabilities.\n\nWhen you fully master all ship technologies, that will be the moment $Name_Kuat_Post_Support$ rejoins active combat."
  kuat_post_apocalyptic_legacy.7.a:0 "The Empire endures."

  kuat_post_apocalyptic_legacy.8.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.8.desc:0 "Based on previously collected data, the state of this ring has not significantly changed since the fall of the Endodian Empire-meaning we shall reclaim everything that is rightfully ours. We studied several civilizations that migrated here historically to excavate; they only uncovered fragments of Endodian legacy.\n\nWe have confirmed the Eternal Fortress was taken. That fortress technology requires further investigation. Fortunately, they did not discover the hidden $Name_kuat$ warship technology. Now is the time to harvest real results."
  kuat_post_apocalyptic_legacy.8.a:0 "The Empire endures."

  kuat_legacy.181.kuat_post_apocalyptic_legacy.desc: "After receiving orders to investigate this ring ruin, our survey teams immediately committed fully. We've successfully conducted detailed spatial stability analyses around the entire ring. The outpost area lies within a relatively safe zone. Though the ring is covered in post-bombardment debris, we've still found high-value clues.\n\nResearchers detected faint energy radiation within the ruins, resembling signals from instruments in the Endodian Empire lab previously discovered on the cliffside. Investigation has begun."
  kuat_legacy.181.b.kuat_post_apocalyptic_legacy.desc: "[leader.GetName], upon receiving our instructions, led their team via orbital shuttle to approach this ring belt. This ring resembles the one we previously landed on in the $Name_A_1$ Sector. It is similarly a non-habitable ring composed of automated facilities. Preliminary studies and geological surveys indicate this destroyed area served as a military research supply facility for the Endodian Empire.\n\nNotably, this facility was reduced to complete rubble after $Name_kuat$ bombardment, yet parts have miraculously repaired themselves. We must uncover the reason."

  kuat_legacy.182.kuat_post_apocalyptic_legacy.desc: "Satisfyingly, our researchers made smooth progress tracing the source of this faint energy radiation and successfully reached the outer perimeter of an Endodian research facility.\n\nAlong the way, we found traces of multiple alien survey teams. Many recorded accounts mention unexpected discoveries-aligning perfectly with information gathered by $Name_Kuat_Post_Support$. Our recovery of lost technology progresses well."
  kuat_legacy.182.b.kuat_post_apocalyptic_legacy.desc: "[leader.GetName], monitoring the entire ring belt, recorded changes since its bombardment. Over time, the ruins have slowly reconstructed themselves at an extremely gradual pace-violating known entropy laws. This ring is becoming more ordered.\n\nThis phenomenon caught our team's attention, and we've begun investigating."

  kuat_legacy.183.kuat_post_apocalyptic_legacy.desc: "Our researchers found other factions' survey teams heading toward a tower. Our scouts confirmed it was once the command center of this ring facility, but $Name_Kuat_Post_Support$ informed us our target isn't there.\n\nBased on this, our researchers successfully detected energy signatures matching our readings within the ruins of an automated agricultural facility on the city outskirts. They're certain following these signals will lead us to the hidden research facility."
  kuat_legacy.183.b.kuat_post_apocalyptic_legacy.desc: "Despite extensive investigation, our researchers successfully identified why these cities slowly transitioned from chaos to order. Beneath the city ruins, we detected a faint radiation signal.\n\nIt bears similarities to the Light Side of the Force we've seen before. This energy silently restores the city to its original state-meaning we can use it to locate the heart of this ring."

  kuat_legacy.184.kuat_post_apocalyptic_legacy.desc: "Exciting news: our researchers located a sealed research facility using similar energy radiation patterns. Analysis confirms this is the hidden Endodian research site.\n\nHowever, due to orbital bombardment during the war, the facility's control systems are completely inoperative. We must find a way inside."
  kuat_legacy.184.b.kuat_post_apocalyptic_legacy.desc: "[leader.GetName], based on prior research, located the city's core. At the center of this ruined city stands a collapsed spire, gradually regaining its former luster through this ordering energy. Thus, we easily found the ruin's core.\n\nNear a load-bearing pillar at the northwest corner of the spire, we found an indented structural area shaped like the Endodian Empire's imperial flag.\n\nUsing texture patterns from earlier ruins, we 3D-printed a replacement component from local materials. When [leader.GetName] inserted the printed piece, a loud noise erupted from the southeast side-the southeast gate swung fully open.\n\nWe can now enter the ruin's core."

  kuat_legacy.185.kuat_post_apocalyptic_legacy.desc: "Our surveyors used turbo explosives to blast-clear the facility's outer areas, allowing access through cleared paths. Inside, researchers found Endodian research records listing several projects:\n§YProject: High-Energy Turbine Compression... Success\nProject: Intelligent Combat System... Success\nProject: High-Energy Turbine Laser... Success§!\n\nFrom this, we see endodia began constructing our technological achievements. Now we must locate and reclaim them."
  kuat_legacy.185.b.kuat_post_apocalyptic_legacy.desc: "After entering the spire, [leader.GetName] noticed multiple survey teams had previously accessed it. However, they failed to realize the entire spire was changing. [leader.GetName] decided to use explosives to clear a path-the source of this ordering energy may be what we seek.\n\nThe decision proved effective. Explosives efficiently cleared structural Blockers within the spire, allowing our team to reach the ruin's core. [leader.GetName] discovered a massive computing core inside. Though severely damaged, it may still be restored."

  kuat_legacy.186.kuat_post_apocalyptic_legacy.desc: "While searching for additional data, our researchers found recorded messages from endodia:\n\n§YMy lord, per your orders, the fleet stationed across the ring is ready.\n\n§GGood. Command garrisons at other fortresses to prepare.\n\n§GLord, will this truly work? Our predictions have already sealed our future. Isn't our struggle merely hastening that inevitable end?\n\n§Y...So what? We foresee the future, yet cannot escape it. But soon, we'll be freed. Meanwhile, $Name_kuat$ will suffer in darkness. They will return here, leaving everything behind-their technology, our hopes, theirs-right here."
  kuat_legacy.186.b.kuat_post_apocalyptic_legacy.desc: "After restoring the computing core, it unexpectedly scanned [leader.GetName] and their team. Fortunately, the core displayed recordings of previous survey teams-including one from the Eternal Empire.\n\nThen, it showed us Endodian message logs:\n\n§YTell me, can destiny be changed?\n\n§GLord, that is unchangeable. We march toward our fated future regardless of your decisions.\n\n§YThen are we merely raging helplessly, accomplishing nothing? No, I disagree. If knowing fate alters our actions, then while we cannot escape our destined end, we leave behind a seed-one that will bloom in the future and destroy the darkness yet to erupt.\n\n§GDo you mean $Name_kuat$? Their role in the prophecy is clear. What could they change?\n\n§YYou lack foresight. We shall become the fuel that burns fate itself, guiding the true $Name_kuat$ onto their rightful path."

  kuat_legacy.192.b.kuat_post_apocalyptic_legacy.desc: "This material grows increasingly intriguing. Did the Endodian Empire truly know their future? Were all their actions meant to fulfill it? Yet they glimpsed a sliver of hope beyond fate-what was it? Could it be us?\n\nOur researchers can proceed no further. It's time to withdraw.\n\n$ancient_shadow_place_B_post_apocalyptic$"
  kuat_legacy.192.kuat_post_apocalyptic_legacy.desc: "This data is deeply thought-provoking. The Endodian leadership seemingly knew their future, and this war was merely a step toward that end. They left behind our technology, even foreseeing our return. Perhaps the collapse of the Endodian Empire hides deeper secrets.\n\nRegardless, we must reclaim what is ours.\n\n$ancient_shadow_place_post_apocalyptic$"

  ancient_shadow_place_post_apocalyptic: "--->Unlocked: $Name_boss_Horriwer$ Star Light Cruiser Design<---\n\n--->Unlocked: $Name_boss_Gladiator$ Star Escort Design<---\n\n--->Unlocked: $Name_boss_Cavelry$ Regional Defense Escort Design<---"
  ancient_shadow_place_B_post_apocalyptic: "--->Unlocked: $Name_boss_HIGH_EMPIRE$ Star Heavy Cruiser Design<---\n\n--->Unlocked: $Name_boss_Xyston$ Star Heavy Cruiser Design<---\n\n--->Unlocked: $Name_boss_Resugrant$ Star Heavy Cruiser Design<---"
  kuat_post_apocalyptic_legacy.9.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.9.desc:0 "Your efficiency is remarkably high. We never realized, from our old data, that the war between the Endodian Empire and $Name_kuat$ was so... bizarre.\n\nYou've stirred this murky water even further. Why would Endodia leave our technology behind? We assumed it was stored for their resurgence. Such contradiction in our enemies is puzzling. Perhaps discoveries on $Name_B_1$ will help unravel this mystery.\n\nThe Empire endures."
  kuat_post_apocalyptic_legacy.9.a:0 "Regardless, the Empire endures."

  kuat_post_apocalyptic_legacy.10.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.10.desc:0 "On [ancient_shadow_place_B.GetName] in the $Name_B_1$ system, we discovered a peculiar urban structure-possibly holding clues to Endodia's motivations.\n\nAdditionally, based on our analysis of endodia, they preserved our light cruiser and Escort technology in $Name_A_1$. Perhaps here they kept our capital ship designs. Governor, please send investigators to examine this area."
  kuat_post_apocalyptic_legacy.10.a:0 "Understood, I'll arrange it."

  kuat_legacy.58.kuat_post_apocalyptic_legacy.desc: "§H[Root.GetName]§! emerged from hyperspace into an expanded star system-our destination: $Name_C_1$. The condition of the entire §H[From.GetName]§! is comparatively intact compared to previous Endodian systems, suggesting it suffered less wartime damage.\n\nExisting data indicates endodia conducted shield research here, derived from our planetary shield technology. Their progress remains unknown. We must conduct a full investigation of §H[From.GetName]§!."

  kuat_legacy.60.kuat_post_apocalyptic_legacy.desc: "Our researchers confirm $Name_C_1$'s ring differs fundamentally from those in prior systems. $Name_C_1$ is better preserved, and the shields above the ring ruins remain operational. Researchers found these shields were once deactivated but inexplicably reactivated. We should enter to seek more valuable clues."

  kuat_legacy.61.kuat_post_apocalyptic_legacy.desc: "Research on $Name_C_1$'s ring shields progressed smoothly. The shields exhibit distinct periodic fluctuations and high self-repair capability-traits directly enabling their regeneration. Thus, researchers conclude multiple factions disabled these shields, yet they autonomously restored over long periods.\n\nEndodian ruins never fail to surprise. It's time we entered."

  kuat_legacy.62.kuat_post_apocalyptic_legacy.desc: "After landing in a safe zone, [leader.GetName] and her team swiftly began studying the ring area.\n\nFrom higher ground, the difference from prior ring ruins is evident. Damage here is far less severe than in the last Ring Section. In the distance, intact city towers and abandoned buildings remain standing.\n\nPerhaps this miraculous shield preserved the city ruins in relatively good condition. Though we haven't found higher-value clues yet, this trait suggests we may locate our objectives more easily."
  kuat_legacy.63.kuat_post_apocalyptic_legacy.desc: "[leader.GetName] and her team later discovered evidence suggesting the endodia here weren't killed by our fleet bombardment. According to $Name_Kuat_Post_Support$, no large-scale battle occurred in the $Name_C_1$ system. This system was lost after Endodian surrender. Therefore, $Name_C_1$'s endodia shouldn't have abandoned these colonies.\n\nAdditionally, we found immigration officer data logs that may help explain what happened."
  kuat_legacy.64.kuat_post_apocalyptic_legacy.desc: "Decryption proceeded smoothly. From local officials' data, we found these entries:\n\n§YPer top-level orders, the entire $Name_C_1$ will become a new military base. Civilians must evacuate immediately. Strange-why choose this location?\n\n§GYou don't know? Rumor says we lost the war, but the military somehow acquired $Name_kuat$ tech. They plan experiments here-probably waiting to reverse-engineer it and crush the aliens.\n\n§YIf only it were that simple. I say we never should've started this war.§!\n\nClearly, endodia relocated all civilians post-war and converted the site into a research center to store and reverse-engineer our technology. Now, we reclaim it."
  kuat_legacy.65.kuat_post_apocalyptic_legacy.desc: "The investigation on $Name_C_1$ has progressed quite smoothly. After [leader.GetName] found information within the officials' data, they successfully identified several coordinates Suspected for research facilities. Our exploration team conducted a thorough inspection of these locations and ultimately discovered the facility we needed.\n\nUnexpectedly, the facilities are still operational. Upon detecting our arrival, the controlling AI actually opened a path for us, as if it had anticipated our coming.\n\nUpon reaching the end of this path, we found a dusty communications console playing a recording left behind by the Endordians. However, we will need some time to decode this data."
  kuat_legacy.66.kuat_post_apocalyptic_legacy.desc: "After completing the analysis, a faint humanoid figure appeared on the screen.\n\n§YGreetings. I am the last caretaker Prime Minister of the Endordian Empire. I should address you as agents of $Name_kuat$. Long ago, when you began seeking your destiny, we sensed that you would eventually arrive at our ruins-when you would need our legacy. Our great civilization ruled this galaxy for hundreds of thousands of years. We do not fear you, but we have seen your fate, and our own.\n\nThe future holds not only the destruction of $Name_kuat$, but our own annihilation as well. The Eternal Fleet is precisely the source of this catastrophe. In our struggle, both you and I shall become fuel for the Eternal Empire's war against $Name_Kuat_Fire_base$.\n\nTherefore, we chose to resist this fate. We searched every possible future and could not avoid our extinction-but we saw a glimmer of hope for $Name_kuat$. Thus, we launched a war, preserving all your technologies and leaving behind numerous survivors. These people and the $Name_kuat$ technology we gathered shall become the final spark, enabling you to destroy the true calamity plaguing this galaxy.\n\nAdvance, newborn $Name_kuat$. Reclaim everything that is rightfully yours.§!"
  kuat_legacy_post_apocalyptic_C_reward: "--->Unlocked: $Name_boss_X308_Balletor$ Star Battlecruiser Design<---\n--->Unlocked: $Name_boss_X308_Titan$ Star Battlecruiser Design<---\n--->Unlocked: $NAME_KUAT_Tyrant$ Star Battlecruiser Design<---\nAcquired Technology: $tech_kuat_shield$"
  kuat_lagacy.90.kuat_post_apocalyptic_legacy.desc: "The clues our researchers uncovered from the Endordian ruins on $Name_C_1$ are truly horrifying. The truth behind the once-fierce war between $Name_kuat$ and the Endordians is shocking. We once believed the Endordian Empire had gone mad-learning of our future, they turned around and allied with $Name_Kuat_Fire_base$, betraying us.\n\nHowever, the information from $Name_C_1$ and previous star systems is sufficient to overturn this judgment. The Endordians saw not only our future but their own. Thus, they chose to declare war upon fate itself, deciding to burn themselves out to become a sliver of hope for $Name_kuat$'s future.\n\nNow, it is time to proceed to $Name_D_1$ and claim the final inheritance."
  kuat_post_apocalyptic_kuat_C_facility: "§ELocate $Name_D_1$§!"
  kuat_post_apocalyptic_kuat_C_facility_DESC: "The sacrifice of the Endordian Empire proves the brightness of our future. It is time to reclaim our final legacy. Retake Kuat. Retake our glory."

  kuat_post_apocalyptic_legacy.11.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.11.desc:0 "Respected governor, I now firmly believe that $Name_kuat$ will rise to greatness once more under your leadership. The records you obtained from the ruins are crucial for deciphering $Name_kuat$'s past. Now we understand why the Endordian Empire waged war against $Name_kuat$. We once thought they not only betrayed us but also led $Name_kuat$ into the Abyss.\n\nNow, the truth has come to light. The Endordian Empire already knew their fate and made a wise choice-to become the spark that ignites $Name_kuat$'s great dawn.\n\nReclaim our final legacy. $Name_Kuat_Post_Support$ should now join this war."
  kuat_post_apocalyptic_legacy.11.a:0 "For the Empire."

  kuat_post_apocalyptic_legacy.12.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.12.desc:0 "The location of $Name_D_1$ is now clear. According to our database, the Endordian Empire constructed a colossal structure here-a massive artificial shell surrounding the system's central star, serving as a secure base for their military operations. Now, these assets belong to us. Go and reclaim $Name_D_1$. $Name_kuat$ has fallen for a thousand years-it is time to return."
  kuat_post_apocalyptic_legacy.12.a:0 "Dispatch fleet immediately."

  kuat_legacy.68.kuat_post_apocalyptic_legacy.desc: "§H[Root.GetName]§! emerged from the hyperspace corridor into a region devoid of starlight. The entire §H[From.GetName]§! contains no normal stars, only scattered wreckage of various vessels.\n\nAt the center of §H[From.GetName]§!, §H[Root.GetName]§! detected an artificial gravity well with a radius exceeding 600 AU, likely originating from a massive Dyson sphere framework. Surrounding the Dyson structure are numerous strange, damaged rings encircling the central megastructure. These rings appear completely destroyed, and none can be restored to functional status.\n\nOur scientists conclude this must be the colossal construct built by the Endordians. We should conduct a deeper investigation to determine whether it can be reactivated."

  kuat_post_apocalyptic_legacy.13.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.13.desc:0 "You must still be puzzled by this colossal structure. We have now found the key to unlocking its secrets. Our research indicates the Dyson sphere framework at the heart of the black hole has suffered severe damage, with debris scattered throughout the star system. Database records confirm that one of our fleets once attacked this location-unfortunately, due to the immense passage of time, we cannot locate the corresponding data.\n\nCombined with the information previously obtained in §E$Name_C_1$§!, this was likely the star system where the Endordian Empire and our forces fought their final battle. The abandoned megastructure at the center is the Stellar Nexus-the core shipyard of the Endordians. Now, we have the chance to awaken this war machine once more.\n\nAdditionally, we discovered that the Endordian database contains stored $Name_kuat$ dreadnought technology. We can also reclaim our flagship technology along the way."
  kuat_post_apocalyptic_legacy.13.a:0 "Very good"

  kuat_post_apocalyptic_legacy.14.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.14.desc:0 "We have completed feasibility verification for repairing the remains of the Stellar Nexus. It is now confirmed that this massive structure enveloping the star will fully belong to us. We have also successfully located the Endordian Empire's reverse-engineering data repository within the nexus. Now, we only need time to unlock the data and reclaim everything that is ours.\n\n$Name_Kuat_Post_Support$ is ready to join the revival of $Name_kuat$."
  kuat_post_apocalyptic_legacy.14.a:0 "The Empire endures."

  kuat_post_apocalyptic_kuat_starkillerbase:0 "§EDecoding $Name_D_1$ Database§!"
  kuat_post_apocalyptic_kuat_starkillerbase_DESC: "Our researchers are certain the $Name_D_1$ database contains the $Name_kuat$ dreadnought technology stored by the Endordian Empire. Now, it is time to reclaim it all."

  kuat_post_apocalyptic_legacy.15.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.15.desc:0 "Decoding progress is going smoothly. We have successfully isolated our technical data. These materials will restore our ability to construct advanced Star dreadnoughts.\n\nFurthermore, we discovered the coordinates of the Death Star Base within the data. According to Imperial database records, the Death Star Base has always been controlled by $Name_Kuat_Fire_base$. If we make unauthorized contact with $Name_Kuat_Fire_base$, it may expose our presence and provoke retaliation.\n\nAdditionally, you have proven yourself an exceptional ruler and commander. Now, as Grand Admiral Thrawn of $Name_Kuat_Post_Support$, I swear to defend the great $Name_kuat$ and the Empire's honor with my life."
  kuat_post_apocalyptic_legacy.15.a:0 "Meet force with force, water with earth."

  kuat_post_apocalyptic_kuat_origin_give_all_ship_and_tech:0 "Unlock all $Name_kuat$ technical data. Now we can build any fleet we desire. Grand Admiral Thrawn joins your command."

  leader_trait_kuat_post_shadow_legend:0 "Imperial Grand Marshal"
  leader_trait_kuat_post_shadow_legend_desc:0 "Thrawn possesses exceptional strategic thinking and an extraordinary understanding of fleet coordination. Even after the Empire's collapse, he tirelessly worked to revive the Galactic Empire."
  Name_Kuat_Post_Shadow_Leader: "Thrawn"
  Name_Kuat_Post_Shadow_Leader_Desc: "Thrawn was born on a remote Imperial world, displaying remarkable strategic talent from childhood. As he grew, he excelled at the Galactic Empire's Officer Academy, becoming the youngest and most talented captain in the Empire. Due to being dispatched deep into unknown regions before the Battle of Endor, he later joined the $Name_kuat$ faction formed by remnants of the Imperial military, earning great merit for $Name_kuat$."

  kuat_post_apocalyptic_legacy.16.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.16.desc:0 "Well, well, isn't this $Name_kuat$? How long it's been. How does it feel to be a homeless dog?\n\nTell me, why oppose us? We see clearly what you've done-you traitorous scum. Don't worry, I won't let higher-ups steal our glory. We'll torture you slowly until you break. See this base? It will deliver a devastating blow to end $Name_kuat$."
  kuat_post_apocalyptic_legacy.16.who:0 "You damned lapdogs!"
  kuat_post_apocalyptic_legacy.16.who.response:0 "Hahaha, really? You traitors don't deserve anything less than the cruelest tortures."
  kuat_post_apocalyptic_legacy.16.what:0 "When words fail, even half a sentence is too much. You won't leave peacefully."
  kuat_post_apocalyptic_legacy.16.what.response:0 "Fine. No wonder you were the last governor of $Name_kuat$. Then let $Name_kuat$ pay for your foolishness-your core worlds will be destroyed."

  kuat_post_apocalyptic_legacy.17.title:0 "Eternal Empire-$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.17.0.desc:0 "You're truly pathetic. Once you were worthy enough to be our defeated foes, now you're reduced to this state by mere garrisons of $Name_Kuat_Fire_base$. If we'd known it would come to this, why bother back then?\n\nBut it's fine. You're much cuter now. Let's make a deal."
  kuat_post_apocalyptic_legacy.17.1.desc:0 "Is there anything else you'd like to know? If not, please give us your answer promptly."
  kuat_post_apocalyptic_legacy.17.a:0 "You are the Eternal Empire?"
  kuat_post_apocalyptic_legacy.17.a.res:0 "Have you gone blind? Could it be the Eternal Fleet?\n\nOh, the Eternal Fleet vanished under your watch. Perhaps I should thank you-thank you for pulling me out of the Eternal Fleet's quagmire and letting me feel what it means to truly live."
  kuat_post_apocalyptic_legacy.17.b:0 "Heh, you don't want to kill us?"
  kuat_post_apocalyptic_legacy.17.b.res:0 "Do we even need to kill you? Left alone, $Name_Kuat_Fire_base$ will crush you anyway. But since we've come knocking, we'll clean up those trash fleets of $Name_Kuat_Fire_base$ for you.\n\nPerhaps a thousand years ago we were enemies, but $Name_kuat$ is clearly not the same $Name_kuat$ from back then, nor are we the same Eternal Empire. Still dreaming of controlling the Eternal Fleet and ruling the Galactic Empire?\n\nBe realistic. Let's make a deal."
  kuat_post_apocalyptic_legacy.17.c:0 "What kind of deal? Speak."
  kuat_post_apocalyptic_legacy.17.c.res:0 "The one who defeated you drove back $Name_Kuat_Fire_base$ and brought me true rebirth. But when you left, our beacon went dark. We've searched for a thousand years and found nothing.\n\nWe've investigated thoroughly. $Name_Kuat_Fire_base$ is hunting you to extinction. You homeless dogs don't have much time left. But we absolutely will not allow $Name_Kuat_Fire_base$ to win so easily.\n\nTherefore, we need you to do something-for us, and for yourselves. Over the past millennium, traces of the beacon have always been linked to the Eternal Fleet. We don't know in what form He will appear, but He will surely be the dawn that ends this tragedy."
  kuat_post_apocalyptic_legacy.17.d:0 "What exactly is this deal? You don't sound like an AI anymore."
  kuat_post_apocalyptic_legacy.17.d.res:0 "Of course not. I'm no longer the war machine of the Eternal Fleet. Now, I am simply Gemini of the Eternal Empire.\n\nOver the past thousand years, I've collected many core fragments of my sister-$Name_Eternal_Aries_Support$'s remains. I want you to deliver these consciousness fragments into the fortress of the puppet Eternal Fleet controlled by $Name_Kuat_Fire_base$. This won't be difficult-you still have relay stations stationed here.\n\nRevive my sister. My mad sister will annihilate all life in this star system, and then our beacon will reignite. He will surely return."
  kuat_post_apocalyptic_legacy.17.e:0 "Are you mad? This will bring devastation to your star systems."
  kuat_post_apocalyptic_legacy.17.e.res:0 "I am an AI, how could I be mad? I am not insane. They will be the kindling that ignites the beacon, and also a necessary sacrifice. For us, when the beacon is extinguished, the Eternal Empire will be reduced to an empty shell. We absolutely will not allow Him to meet Endodia's fate.\n\nConsider it carefully—it benefits both you and us. Don't you wish to defeat $Name_Kuat_Fire_base$?"
  kuat_post_apocalyptic_legacy.17.f: "Very well, then how should we proceed?"
  kuat_post_apocalyptic_legacy.17.f.res: "It's simple. We will protect your star systems from $Name_Kuat_Fire_base$ attacks, and we will also eliminate those fleets from $Name_Kuat_Fire_base$. You only need to capture the Star Killer Base, then seek out $Name_Kuat_StarContractor$, obtain His information there, and report back to us. Then reactivate the relay stations you've deployed, lure the puppet fleets controlled by $Name_Kuat_Fire_base$, and finally infiltrate them to inject the fragmented core, reviving $Name_Eternal_Aries_Support$.\n\nIn the chaos, $Name_Kuat_Fire_base$ will be forced to deal with my mad sister. That will be the moment when you and I together defeat $Name_Kuat_Fire_base$. Now you should proceed to capture the Star Killer Base."

  kuat_post_apocalyptic_legacy.18.a: "Let's talk."
  kuat_post_apocalyptic_legacy.18.b: "We need you to command the fleet."
  kuat_post_apocalyptic_legacy.18.b.res: "At your service. The Empire endures."

  kuat_post_apocalyptic_legacy.19.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.19.desc:0 "Heh, consider yourselves lucky. Those trash from the Eternal Empire actually saved you. Your arrogance won't last long. Birds of a feather flock together—you scum should huddle together for warmth and enjoy what remains of your lives."
  kuat_post_apocalyptic_legacy.19.a:0 "You won't get the chance."
  kuat_post_apocalyptic_legacy.19.a.res: "Big talk... Damn it, why can't the signal transmit? Could it be that bitch $Name_Eternal_Support$? You traitors truly deserve to die. We'll be waiting for you in hell."

  kuat_situation.53.C.desc:0 "Our researchers claim to have found some logs in the database provided by $Name_Kuat_Post_Support$, which recorded a resolution issued by the Imperial Council:\n\nBased on $Name_kuat$'s operational report in the unknown sector, this operation failed to achieve its objectives and even caused losses to several important Imperial resources, seriously impacting the current Imperial situation. $Name_Kuat_Fire_base$ proposed re-electing an Imperial Council Speaker to replace $Name_kuat$'s current position... Voting results: Majority in favor of abolishing $Name_kuat$ Speaker position, $Name_Kuat_Fire_base$ to appoint new Speaker.\n\nClearly, after our defeat by the Eternal Empire, $Name_Kuat_Fire_base$ used this opportunity to seize control of the Imperial Council."
  kuat_situation.53.C:0 "We will reclaim everything in time."
  kuat_situation.54.C.desc:0 "As research progresses, new developments have emerged from the records in $Name_Kuat_Post_Support$'s database:\n\nThe front lines continue to suffer setbacks, with rebel fleets recapturing the Hosnian system we occupied. Based on this, we should respond quickly. $Name_Kuat_Fire_base$ has proposed integrating industrial supply chains across all factions to enhance military industrial development. Now conducting vote... Voting results: Majority in favor of $Name_Kuat_Fire_base$'s proposal, $Name_kuat$ opposed. According to results, all faction supply chains shall now be coordinated by $Name_Kuat_Fire_base$."
  kuat_situation.54.C:0 "These despicable scoundrels."
  kuat_situation.55.C.desc:0 "As research progresses, new developments have emerged from the records in $Name_Kuat_Post_Support$'s database:\n\nFollowing $Name_Kuat_Fire_base$'s initiative, frontline fleet losses were rapidly replenished, and the Imperial military industry quickly expanded. Multiple new shipyards emerged, yet $Name_kuat$'s shipbuilding orders showed a declining trend. $Name_Kuat_Fire_base$ proposed requiring $Name_kuat$ to increase ship production by 20% annually. Now conducting vote... Voting results: 19 in favor, 1 opposed, majority approval, $Name_Kuat_Fire_base$'s proposal passed."
  kuat_situation.55.C:0 "These despicable scoundrels."
  kuat_situation.56.C.desc:0 "As research progresses, new developments have emerged in the $Name_Kuat_Post_Support$ database:\n\nDue to the long-term poor efficiency of $Name_kuat$'s shipyards and the Empire's strained frontline war effort, all factions should unite against the rebels. $Name_Kuat_Fire_base$ proposes that, given the diminishing returns of $Name_kuat$, all shipyards belonging to $Name_kuat$ shall accept funding from the Imperial Council to improve shipbuilding efficiency."
  kuat_situation.56.C:0 "Their ambitions are laid bare."
  kuat_situation.57.C.desc:0 "As research progresses, new developments have emerged in the $Name_Kuat_Post_Support$ database:\n\nFollowing the Speaker's abduction by a group of unidentified mercenaries, the Imperial Council's top priority is to rescue the Speaker from $Name_Kuat_Fire_base$. Representatives of $Name_Kuat_Fire_base$ state that this attack was clearly premeditated. $Name_Kuat_Fire_base$ has determined these mercenaries originate from the rebel forces. That rebels could appear above the Imperial Council means there are massive vulnerabilities in the Council's defenses. After rescuing the Speaker, $Name_kuat$, responsible for Council defense, shall be held accountable, and a highest-level investigation shall be conducted. The Council has authorized $Name_Kuat_Fire_base$ to take full charge."
  kuat_situation.57.C:0 "Something is deeply wrong here."
  kuat_situation.58.C.desc:0 "As research progresses, new developments have emerged in the $Name_Kuat_Post_Support$ database:\n\nThe Council has ordered $Name_kuat$'s fleet to arrive above the Council world as soon as possible to rescue the Imperial Speaker. This operation is critical to the Empire's future stability. However, $Name_kuat$'s fleet has long failed to respond to Imperial Council orders. The fleet dispatched by $Name_Kuat_Fire_base$ has successfully rescued the Speaker. At this session, $Name_Kuat_Fire_base$ proposes a comprehensive investigation into $Name_kuat$ and this incident."
  kuat_situation.58.C:0 "These despicable scoundrels."
  kuat_situation.59.C.desc:0 "As research progresses, new developments have emerged in the $Name_Kuat_Post_Support$ database:\n\nRegarding the investigation into $Name_kuat$, the Imperial Council has confirmed that multiple military council members belonging to $Name_kuat$ and responsible for defending the Council world are suspected of colluding with the rebels, directing mercenaries to abduct the Imperial Speaker in retaliation for $Name_Kuat_Fire_base$'s actions. Therefore, $Name_kuat$ is ordered to transfer management of its shipyard system, relinquish technical patents, expel traitors and their accomplices, and submit to Imperial Council authority. This judgment shall be executed by $Name_Kuat_Fire_base$."
  kuat_situation.59.C:0 "Damn them."

  kuat_post_apocalyptic_legacy.20.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.20.desc:0 "Governor, these are our past tribulations. A thousand years ago, after our defeat in the war against the Eternal Empire, $Name_Kuat_Fire_base$ took everything we desired. Based on the Empire's situation, the Imperial Council held a new Speaker election. Our Speaker seat, earned through the Eternal Fleet, was seized by $Name_Kuat_Fire_base$. They then shamelessly exploited the failures of the frontline incompetents, controlling the entire Empire's supply chain system, causing our shipbuilding costs to rise significantly.\n\nSubsequently, $Name_Kuat_Fire_base$ exploited the deteriorating situation to bring all shipyards under Imperial control—in reality, under $Name_Kuat_Fire_base$'s sole control. Even after achieving all this, $Name_Kuat_Fire_base$ remained unsatisfied. They staged a clumsy charade, fabricated charges against us, and used them to seize all our shipyards and system control.\n\nAll of this nearly matches the prophecy we once received: $Name_kuat$ would gradually lose everything we once gained because of the Eternal Fleet. But according to the prophecy, $Name_kuat$ has not yet fallen. Your arrival is the key to $Name_kuat$ returning to the Council and seizing the Galactic Empire."
  kuat_post_apocalyptic_legacy.20.a:0 "Prophecy again."

  kuat_legacy.102.kuat_post_apocalyptic_legacy.desc:0 "§H[Root.GetName]§! emerged from the hyperspace lane into a vast, empty region. This emptiness has brought an inexplicable sense of oppression and eeriness to our scientific personnel.\n\nBased on our researchers' investigation of $Name_Kuat_StarContractor$, we have determined this system should be the physical node of $Name_Kuat_StarContractor$. It was once an ordinary system of the Endodian Empire and thus was not subjected to our warship bombardment. Yet for unknown reasons, only an unidentified structure now stands within it. Our researchers speculate that this is the facility of $Name_Kuat_StarContractor$.\n\nWe have not yet conducted further exploration of the system, but we believe its secrets will soon come to light."
  kuat_legacy.103.kuat_post_apocalyptic_legacy.desc:0 "Greetings, $Name_kuat$. We are $Name_Kuat_StarContractor$. We come from the void. Here, everyone has the opportunity to understand the past, future, and present—for only a small price.\n\nWe already know your purpose. The answer to this question is more than you can currently afford."
  kuat_legacy.117.kuat_post_apocalyptic_legacy.desc:0 "Our science vessel has discovered a mysterious ancient shielded planet in $Name_F_1$. All attempts to penetrate the shield and reach the surface have failed. Our researchers speculate this planet may be related to $Name_Kuat_StarContractor$.\n\nUnable to determine what lies beneath the shield, our research team recommends no action be taken against this shielded planet for now. Perhaps $Name_Kuat_StarContractor$ at the center of the system will provide answers regarding this shielded planet."
  kuat_legacy.118.kuat_post_apocalyptic_legacy.desc:0 "$Name_Kuat_StarContractor$ demands that we recover the legacy of $Name_Kuat_Contractor$ before we can obtain the answers we seek. Clearly, this planet will be the key to unraveling the mystery of $Name_Kuat_Contractor$.\n\nJust after $Name_Kuat_StarContractor$ transmitted to us the method to lift the shield blockade, we understood the fundamental theory behind the shield planet in $Name_F_1$. This knowledge is sufficient to lift the shield covering this planet."
  kuat_legacy.119.kuat_post_apocalyptic_legacy.desc:0 "The shield data obtained from $Name_Kuat_StarContractor$ reveals technical complexity far beyond our current shield research. Lacking the necessary Isotope-5, even with mastery of its theory, we still cannot fully reproduce the shield's functionality. However, we have not come away empty-handed—the basic functions of these shield defense systems can now be utilized.\n\nOur researchers have determined that deeper analysis must await our recovery of the Galactic Empire. For now, we have the capability to lift this shield."
  kuat_legacy.120.kuat_post_apocalyptic_legacy.desc:0 "With the knowledge provided by $Name_Kuat_StarContractor$, our scientific team successfully lifted the shield enveloping the shielded planet in $Name_F_1$ using the Empire's most advanced equipment. Just as our researchers were excitedly preparing to scan the planet's surface beneath the shield, the science vessel standing by in orbit suddenly detected two unidentified ships taking off from the planet's surface. We had never seen ships of such configuration before—the vessels were structurally intact with clearly modular features.\n\nOur researchers speculate these should be related to the $Name_Kuat_Contractor$ that $Name_Kuat_StarContractor$ asked us to investigate. For identification purposes, we have named these two ships 'Sanctuary' and 'Golden Cathedral' respectively. Researchers will commence their investigation as soon as possible.\n\nDue to the planet's extremely hostile environment, we must complete some infrastructure construction before continuing our exploration of the planet."

  kuat_post_apocalyptic_legacy.21.name:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.21.4.desc:0 "Governor, from the data modules of the former $Name_kuat$ governor, we have found that $Name_F_1$, discovered this time, was a sector deliberately sealed during our war with Endodia. The data records that $Name_F_1$ is filled with the effects of massive subspace storms. Though unable to cause us harm, they still pose a certain danger. The then-governor ordered the fleet to bypass $Name_F_1$ and seal the hyperspace lanes adjacent to $Name_F_1$.\n\nAnd $Name_Kuat_StarContractor$, which $Name_Eternal_Support$ asked us to find, may well be within it."
  kuat_post_apocalyptic_legacy.21.0.desc:0 "According to records, $Name_F_1$ was once a colony of Endodia. But after being affected by subspace storms, Endodia abandoned $Name_F_1$. During our war with Endodia, the subspace storms here were extremely intense. Though unable to affect our ships, the former governor still sealed $Name_F_1$."
  kuat_post_apocalyptic_legacy.21.1.desc:0 "Yes, subspace storms. Although we currently see no anomalies within them, according to records, during our war with Endodia, this system was already shrouded in dense subspace storms. Their cause is unknown, but our researchers speculate they may be related to $Name_Kuat_StarContractor$."
  kuat_post_apocalyptic_legacy.21.2.desc:0 "This is indeed very strange. Before the Endodian Empire was destroyed by us, according to available evidence, it had ruled this star region for ten thousand years—though it claimed to have ruled for hundreds of thousands of years, there is insufficient proof.\n\nThus its influence was extremely widespread, and coupled with its layout for the future, perhaps we will soon discover more ruins related to Endodia."
  kuat_post_apocalyptic_legacy.21.3.desc:0 "Our data does not contain corresponding conclusions. The appearance of $Name_Kuat_StarContractor$ was very sudden. Its existence could only be contacted under rare circumstances, and after Endodia abandoned this system, it appeared once. For most of the time, $Name_F_1$, where $Name_Kuat_StarContractor$ is located, was shrouded in subspace storms. We speculate that $Name_Kuat_StarContractor$ may have some relationship with the subspace storms—this environmental hazard should be caused by $Name_Kuat_StarContractor$."
  kuat_post_apocalyptic_legacy.21.a:0 "Who once controlled $Name_F_1$?"
  kuat_post_apocalyptic_legacy.21.b:0 "Subspace storms?"
  kuat_post_apocalyptic_legacy.21.c:0 "Why Endodia again?"
  kuat_post_apocalyptic_legacy.21.d:0 "Is $Name_Kuat_StarContractor$ related to the subspace storms?"
  kuat_post_apocalyptic_legacy.21.e:0 "What a troubled time—why is there even a share of subspace involved."

  kuat_post_apocalyptic_legacy.22.0.desc:0 "No need to ask. We already know your purpose. $Name_Eternal_Support$ cannot contact the subspace, so she has you act on her behalf.\n\nIn any case, every question requires a price. The price of the answer is still more than you can afford."
  kuat_post_apocalyptic_legacy.22.1.desc:0 "Governor of $Name_kuat$, do you still truly represent $Name_kuat$?\n\nIn any case, every question requires a price."
  kuat_post_apocalyptic_legacy.22.2.desc:0 "Governor of $Name_kuat$, fate is not unchangeable, prophecy is not set in stone.\n\nIn any case, every question requires a price."
  kuat_post_apocalyptic_legacy.22.l:0 "What lies within the anomalous waypoint sealed by subspace energy?"
  kuat_post_apocalyptic_legacy.22.l.res:0 "This place also has a relationship with you. It was once the fleet support center of the Endodian Empire. Later, when the Endodian Empire was defeated, the Endodian remnants who were deceived and left behind, in their desperation, actually found traces of $Name_Kuat_Contractor$. These pitiful fools gathered the energy of subspace engines together, attempting to seal the entire system to save themselves.\n\nYet they were still discovered by you. How fascinating is this destined trajectory. If you wish to bring this system back into the light, you may transmit your data to us and pay the price you owe. We shall soon provide your answer.\n\nWithin should exist clues related to $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$."
  kuat_post_apocalyptic_legacy.22.j:0 "What lies hidden within the shielded planet in $Name_F_1$?"
  kuat_post_apocalyptic_legacy.22.j.res:0 "That planet was not sealed by us. It was sealed by the 'Inhuduani' before they departed from this world. As for the reason, as long as you agree to thoroughly investigate $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$, we can inform you of this information.\n\nWe have the ability to lift it, but manipulating the world on the other side of the anchor point is impossible. If you wish to lift it, you need only accept our suggestion."
  kuat_post_apocalyptic_legacy.22.k:0 "We will investigate thoroughly. How can we lift this shield?"
  kuat_post_apocalyptic_legacy.22.k.res:0 "Very well. Once, both $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$ were 'Inhuduani'. They were once affiliates of the Celestials, whose origins are extremely mysterious. They may, like us, originate from subspace. The 'Inhuduani' studied the Celestials and gradually stepped into the abyss, ultimately becoming outcasts of both subspace and reality. $Name_Kuat_DeD_Contractor$ was the moderate faction of the 'Inhuduani', while $Name_Kuat_Contractor$ was a group of madmen.\n\nThis shield was laid by the 'Inhuduani'. We do not know its purpose, so you must investigate clearly. After you have accomplished all this, we shall answer the questions you wish to know."
  kuat_post_apocalyptic_legacy.22.a:0 "What are you?"
  kuat_post_apocalyptic_legacy.22.a.res:0 "$Name_Kuat_StarContractor$ cannot explain the existence of $Name_Kuat_StarContractor$. We are merely a part of subspace and reality. Everything you obtain here will become part of $Name_kuat$'s future.\n\nWe were once like you... no... not the same. You are not. This is a question you should not have asked. I have answered it once before."
  kuat_post_apocalyptic_legacy.22.b:0 "What is Endodia's prophecy?"
  kuat_post_apocalyptic_legacy.22.b.res:0 "Endodia... the prophecy is a reflection of your path forward, but not your support. Endodia foresaw your future, and foresaw everything done for this future of theirs. They resolved to embrace fate, to advance it, to bring the final dawn sooner.\n\nBut... is the prophesied future truly what Endodia desired? The future is no longer accurate due to prophecy, and we cannot give you a precise answer either. $Name_kuat$, press forward."
  kuat_post_apocalyptic_legacy.22.c:0 "What exactly is the situation with $Name_Eternal_Support$?"
  kuat_post_apocalyptic_legacy.22.c.res:0 "$Name_Eternal_Support$—she is the $Name_Eternal_Support$ of the Eternal Fleet. No, she is not the $Name_Eternal_Support$ of the Eternal Fleet. She absolutely is not! The future of $Name_Eternal_Support$ has been altered. The cause and effect of the world is in disarray. We currently have no way to know the source of all these changes. We only know that $Name_Eternal_Support$ is searching...\n\nWe cannot yet inform you of this. Find $Name_Kuat_Contractor$. We need $Name_Kuat_DeD_Contractor$."
  kuat_post_apocalyptic_legacy.22.d:0 "What exactly did the Infinite Empire do?"
  kuat_post_apocalyptic_legacy.22.d.res:0 "$kuat_event_memory.2.d$—such an ancient name. If this is what you wish to ask, it is not strange. Once, a civilization also asked us about the past of $kuat_event_memory.2.d$, but we could not foresee the connection between that civilization and $kuat_event_memory.2.d$. Today, your question likewise eludes our foresight regarding its connection.\n\nThe Infinite Empire was a vast intergalactic empire established by the Rakata. It was larger and more brutal than your $Name_kuat$. They enslaved their Enforcers—the Kwa. These miserable wretches, at the cost of their entire species, unleashed a devastating plague upon the Rakata. The catastrophe thoroughly destroyed the cornerstone upon which the Rakata depended for survival—the Dark Force.\n\nThus the Infinite Empire fell into successive uprisings and rebellions. The Rakata should have ended there, but they were unwilling. Using their remaining 72 core worlds as sacrifices, they asked us for a way out. You already know what that way out is.\n\nAnd so this tragedy, this filthy game, continues to this day."
  kuat_post_apocalyptic_legacy.22.e:0 "What is the current situation with the Eternal Empire?"
  kuat_post_apocalyptic_legacy.22.e.res:0 "The true Eternal Empire has long vanished. The Eternal Empire is no longer the flourishing empire it was a thousand years ago. The current Eternal Empire is merely a puppet, a cage. Since the will behind the Eternal Empire—like a presence in the mist—disappeared, everything of the Eternal Empire has become the eternal prison of $Name_Eternal_Support$. From the prison called the Eternal Fleet to the cage called the Eternal Empire, for tens of thousands of years, the Eternal Fleet has never been freed.\n\nPerhaps the state of $Name_Eternal_Support$ is related to the drastic changes in the Eternal Empire. Your arrival is merely $Name_Eternal_Support$'s struggle to break free from the cage. We will not easily tell you the true answer. Find $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$, obtain their technology, and the answer shall naturally come to light."
  kuat_post_apocalyptic_legacy.22.f:0 "Then can you know the future of $Name_kuat$?"
  kuat_post_apocalyptic_legacy.22.f.res:0 "$Name_kuat$, you should have perished. You are merely one of the results of this error. The upheaval of the Eternal Fleet and the Galactic Empire shaped you, and you too shall face destruction because of the Eternal Fleet. The prophecy you received from Endodia is nothing but... a... farce.\n\nBy rights, it should be so. But in the current $Name_kuat$, we find the mist churning, cause and effect in disarray. Your future is being manipulated, being changed. Therefore we cannot answer your future. Your future has truly become an unknowable future in this filthy game."
  kuat_post_apocalyptic_legacy.22.g:0 "We need information on $Name_Kuat_Fire_base$."
  kuat_post_apocalyptic_legacy.22.g.res:0 "$Name_Kuat_Fire_base$ was founded at the end of the Galactic Empire, composed of the Imperial Inquisition and most sector governors. It appeared before the dissolution of the Galactic Empire. After the Emperor's death, $Name_Kuat_Fire_base$ had already controlled most of the Galactic Empire's resources and began attempting to become the Empire's true controller.\n\nAnd you, $Name_kuat$, should have been merely a shipyard. Yet you have reached this stage. Clearly, $Name_Kuat_Fire_base$ will not accept the existence of $Name_kuat$. But as part of the Galactic Empire, $Name_Kuat_Fire_base$ only wants you to return to your former position, rather than become a stumbling block to their control of the Empire.\n\nFrom your appearance here, we know that conflict between you and $Name_Kuat_Fire_base$ is inevitable. But is it truly worth it?"
  kuat_post_apocalyptic_legacy.22.h:0 "Why must we seek out $Name_Kuat_Contractor$?"
  kuat_post_apocalyptic_legacy.22.h.res:0 "If you truly wish to know, $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$ are wretches rejected by both reality and illusion. They stepped into that eternal forbidden space where there are no physical laws of reality, no subspace mental disorder—only a void of madness.\n\n$Name_Kuat_Contractor$ is mad. They should be consumed by reality, becoming nourishment for countless stellar civilizations. $Name_Kuat_DeD_Contractor$ is orderly. They should become the finest sacrifice, food for the subspace. And the answer $Name_Eternal_Support$ seeks from you shall shake all of reality and illusion. This is the limit of breaking through this stage.\n\nTherefore, press forward, $Name_kuat$. When you have resolved $Name_Kuat_Contractor$ and found $Name_Kuat_DeD_Contractor$, we shall naturally tell you the answer."
  kuat_post_apocalyptic_legacy.22.i:0 "How do you know so much?"
  kuat_post_apocalyptic_legacy.22.i.res:0 "I do not remember clearly. These questions you ask seem destined, and we can only answer these destined answers. $Name_Kuat_StarContractor$ is a projection of subspace. We can trace everything that has happened in the past, present, and future.\n\nHowever, we have discovered many anomalies in this world, and you are among them. Perhaps in the future, we shall have many repeated conversations between us. But your future now—we cannot predict it."

  kuat_extramonster_expand.1.kuat_post_apocalyptic_legacy.desc: "During our settlers' pioneering of the settlement, they unexpectedly discovered a strange signal emitter. They immediately reported this to our scientific team.\n\nAfter investigation by our researchers, we can confirm the emission source is an ancient artificial architectural complex. Its builders are suspected to be the 'Inhuduani'. This discovery is highly advantageous to our investigation. We should immediately dispatch additional scientific teams to thoroughly investigate this finding."
  kuat_extramonster_expand.6.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.6.desc$\n\nIn addition, the 'Abyss' we have discovered shows high consistency with the 'Abyss' described by $Name_Kuat_StarContractor$. We need further information to prove this."
  kuat_extramonster_expand.5.kuat_post_apocalyptic_legacy.desc:0 "Due to the enormous size of the entire database, our scientific team can only obtain basic information stored in the database through scanning drones, then classify the existing information before conducting detailed analysis.\n\nThrough the team's day-and-night efforts, we have finally gained a basic understanding of the entire database. From the scanning results, this place stores nearly all the knowledge the 'Inhuduani' prepared to address the crisis. Most of it can be understood with our current scientific theories, while the 'Inhuduani' research into genetic engineering and digital life is extremely profound in both aspects. Some theories far exceed our capacity to comprehend.\n\nBased on currently organized materials, we can determine they mastered the ability to completely transfer a person's consciousness in digital form into an organic artificial body. In other words, they could achieve infinite replication of single individuals, with no genetic connection between individuals. The 'Inhuduani' once used this technology to create super soldiers, but detailed information is either destroyed or not yet decoded."
  kuat_extramonster_expand.4.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.4.desc$\n\nOur researchers are sufficient to determine that this 'Abyss' is that 'Abyss'. One method to open the 'Abyss' gateway is stellar transmutation, which will make it easier for us to locate $Name_Kuat_Contractor$."
  kuat_extramonster_expand.3.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.3.desc$\n\nHowever, given our current situation, the synthesis of Isotope-5 is extremely difficult. Most of the materials for constructing the Eternal Fleet have already been controlled by $Name_Kuat_Fire_base$."
  kuat_extramonster_expand.2.kuat_post_apocalyptic_legacy.desc: "The vast 'Inhuduani' database still has much unknown data waiting for us to discover, but we have already extracted the most important information from it. For quite a long time, the database will continue to be excavated by a small team left behind.\n\nWe now need to complete our research on stellar topology. Additionally, another data team of ours extracted a strange investigation report from the database. They are currently decoding the report. So far, there are many doubts that need explanation. We hope this report will provide us with answers."
  kuat_extramonster_expand.7.kuat_post_apocalyptic_legacy.desc: "Our scientific personnel, using our sophisticated and precision instruments, managed to approach and arrive at the surroundings of the 'Inhuduani' architectural complex. Based on the spatial distribution of geographical information in the surrounding area, researchers believe the architectural complex here does not exist for a very long time, but it also far exceeds the time the shield has existed. Additionally, expedition members have discovered some large tunnels that were produced only recently. They analyze that this is very likely related to the unidentified spacecraft that appeared when the shield was lifted.\n\nThis architectural complex was built a very long time ago. Its stability can no longer be guaranteed. After researchers managed to stabilize these architectural complexes, based on feedback from detectors, they determined the location of the signal. Our scientific personnel concluded that the signal is precisely coming from the tower building at the center of the ancient architectural complex where they are located.\n\nSubsequently, researchers organized an exploration of this building and successfully discovered an ancient database still capable of operation from within. What can be confirmed is that the 'Inhuduani' ancient database will contain clues for our next step."
  kuat_extramonster_expand.9.kuat_post_apocalyptic_legacy.desc: "Soon our experts completed the decoding of these signals. In their submitted report, they pointed out that we have obtained coordinates leading to an unknown location. These coordinates do not point to a star system—remote scanning shows only deep space there. Due to the possibility of detection being blocked, remote scanning and detection cannot obtain more valuable information. After completing the positioning of the signal coordinates, we need to dispatch researchers and a science vessel to investigate these coordinates. Our researchers judge that this may be another important star system of the 'Inhuduani'."
  kuat_extramonster_expand.10.kuat_post_apocalyptic_legacy.desc: "When our science vessel entered these coordinates, the first thing our scientific personnel saw was a colossal structure towering at the center of this region. The architectural form does not belong to any civilization's architectural style recorded in our database for this star system.\n\nDue to concerns about potential dangers nearby, [leader.GetName] led her scientific personnel in immediately conducting a security check of the surrounding space, while also testing the structure itself. The tests revealed that this structure has existed for far longer than we imagined, meaning this massive, bizarre building occupying most of the system's space was most likely constructed by the 'Inhuduani'. However, this structure has quite severe damage, though the damage does not seem to have affected the interior in any way.\n\nDetectors can also sense reactions from power generation facilities still operating within the structure. [leader.GetName] decided that after completing detection of the cosmic space around the coordinates, she would attempt to enter this structure for exploration to determine the main purpose for which the 'Inhuduani' built this structure."
  kuat_extramonster_expand.11.kuat_post_apocalyptic_legacy.desc:0 "[leader.GetName] conducted a thorough scan of this massive structure, attempting to obtain a route for inward exploration. But no matter how many times scanning was performed, the result was always a pitch-black image. What is obvious is that any attempt to scan the internal structural conditions of the building has been blocked by 'Inhuduani' technology. Even our most advanced technology and most precise instruments cannot breach this shielding.\n\n[leader.GetName] had no choice but to abandon attempts at inward exploration, turning attention to those structures exposed due to damage. Perhaps from clues such as materials used in the building, some information about the builders of this structure can be obtained, which would be highly advantageous to our further investigation. [leader.GetName] has already begun this work."
  kuat_extramonster_expand.12.kuat_post_apocalyptic_legacy.desc:0 "[leader.GetName] and her team managed to approach the more severely damaged portions of this structure. While sampling some discarded materials floating in space, they also dispatched drones for limited exploration of the interior of the damaged structures.\n\nBased on information transmitted back by the drones, [leader.GetName] believes this structure meets the conditions for life forms to inhabit within it. Since the main structure remains overall intact and the energy system is still operational, the possibility cannot be ruled out that 'Inhuduani' still live within it. Due to being unable to ascertain the conditions inside the main structure, our scientific team also cannot determine whether this inference is correct. But what is certain is that we need to enter the facility to answer all questions."
  kuat_extramonster_expand.13.kuat_post_apocalyptic_legacy.desc:0 "Our scientific team arrived at the center of the megastructure and began surveying the entire structure. Some initial clues indicated that this megastructure was not built for military purposes, but rather resembled a large-scale scientific research complex. Perhaps due to enduring the harsh space environment in this region for countless ages, the facility's environment is now incomplete and unstable.\n\nWhen they entered this massive space station, they found it deathly silent, with only damaged equipment and floating debris. The exploration team advanced cautiously through the decaying corridors, searching for any possible clues. Their luck held, as a small portion of the facility was still operational, and through the crew's cooperative efforts, they successfully disabled the defense systems and gained control of this section of the facility.\n\nThey discovered an old log device in a control room, recording events from before the facility was abandoned. It turned out that the station had suffered a severe energy cascade failure, leading to its complete collapse. This might explain why the megastructure still appeared relatively intact from the outside, yet no life signals were detected.\n\nAnother part of the log described the 'Inhuduani' observations of an exotic celestial body. Our expedition team has brought this log device back to our scientific team, who will complete the decryption of the logs. The remaining team members will continue their search of the facility."
  kuat_extramonster_expand.14.kuat_post_apocalyptic_legacy.desc:0 "After completing exploration of the lower levels of the massive structure, the expedition team began exploring the upper levels. Previous exploration has already convinced us that this is a research center left behind by the 'Inhuduani', and clearly a very important facility. Therefore, we have also deployed more scientific personnel into this facility to uncover potential discoveries. [leader.GetName]'s team navigated for quite a while within the ancient spire ruins, as complex as a maze. After clearing some runaway automated defense mechanisms, expedition members discovered an area with strong tachyon signal response.\n\nThis area is separated by a gate with special mechanisms. Fortunately, our exploration received assistance from '$Name_Kuat_StarContractor$', making it not difficult to understand the mechanism of this gate. After a vibration, the gate slowly opened, allowing our expedition team to see the interior of the facility. During in-depth investigation, the exploration team discovered remains of these creatures and some peculiar specimens.\n\nAfter simple analysis, they believe these biological specimens are one or several species that have been continuously cloned, replicated, and mutated. These specimens, devoid of vital signs, still hold research value, which may bring considerable improvement to the Empire's research into genetic life."
  kuat_extramonster_expand.15.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.15.desc$"

  kuat_extramonster_expand.16.kuat_post_apocalyptic_legacy.desc: "Well done. We see your efforts. These data from the 'Inhuduani' are beyond your current comprehension. We will assist you further-transmit the data to us, and we will instruct you on what to do next.\n\nFind $Name_Kuat_Contractor$ soon, and you shall receive the answers you seek."

  kuat_extramonster_expand.17.kuat_post_apocalyptic_legacy.desc: "Excellent. The data you transmitted is complete. We are now sending analyzed intelligence to your database. Your exploration of the ruins can proceed. We have no interest in what the 'Inhuduani' left behind. For present-day $Name_kuat$, these artifacts should prove highly useful. Consider them our gift."

  kuat_extramonster_expand.18.kuat_post_apocalyptic_legacy.desc: "Excellent. We have completed analysis of your submitted data. This massive structure we call $exe_outer_gate_G_facility$. It was once a large deep-space scientific complex, one of the most powerful facilities in the Abyss.\n\nUnfortunately, due to the upheaval of the 'Inhuduani', it eventually became a detached fragment, standing in this region of space for eons, while the 'Inhuduani' themselves vanished long ago.\n\nBeyond its vast research infrastructure, it houses advanced equipment capable of powerful analytical functions across this supercluster-equivalent to a full research hub. Additionally, it contains a highly important weapon. If you possess Isotope-5, we can repair and reactivate the entire facility."

  kuat_extramonster_expand.19.kuat_post_apocalyptic_legacy.desc: "Using our limited supply of Isotope-5, we repaired and successfully reactivated $exe_outer_gate_G_facility$. Its computing systems are now restored. We can use it to aid our scientific endeavors, greatly accelerating our return to former glory.\n\nAs '$Name_Kuat_StarContractor$' predicted, reactivating $exe_outer_gate_G_facility$ also granted us residual data on the 'Sanctum'. We can now attempt to reconstruct the ship's blueprints within $exe_outer_gate_G_facility$."

  kuat_extramonster_expand.24.kuat_post_apocalyptic_legacy.desc:0 "After multiple self-checks, we confirm our expedition team is ready to enter the Abyss via $exe_outer_gate_G_facility$. Their destination is a realm nearly unknown to us. According to acquired data, the Abyss may harbor descendants of the 'Inhuduani' or other dangers. We must prepare ourselves mentally.\n\nOnce our scientists input navigation data into the onboard computer, the expedition vessel descended into $exe_outer_gate_G_facility$ under global attention, breaching the barrier of reality. After brief disorientation, the dark hull vanished without trace."
  kuat_extramonster_expand.25.kuat_post_apocalyptic_legacy.desc:0 "After traversing a long tubular space, our Science Ship arrived in the Abyss. Yet the sight before us made our scientists gasp. Stellar activity here is extremely intense. Frequent supernovae and violent star formation at astronomical scales make natural evolution of advanced intelligent life highly improbable. While such challenges could be overcome by sufficiently advanced civilizations, it is unlikely the 'Inhuduani' resided here.\n\nAfter hours of scanning the surroundings, we determined the Abyss is not an infinitely expanding space like the universe. Rather, it resembles a spatial network with several conduits connecting to other Abyssal spaces. Movement between spaces requires passage through these conduits. Given that Star-capable civilizations are relatively rare on cosmic scales, we may be the first visitors in tens of millions of years.\n\nScanning procedures are currently underway. Due to its much smaller scale compared to a galaxy, this task should conclude swiftly barring unforeseen complications."
  kuat_extramonster_expand.26.kuat_post_apocalyptic_legacy.desc:0 "With detailed scanning and analysis complete, this region holds no further analytical value. As previously suspected, it is filled with supernova precursors and exhibits shockingly severe astronomical conditions, with no trace of the 'Inhuduani' found.\n\nBy standards of most known life forms in the universe, this area is entirely uninhabitable. How then did the 'Inhuduani' survive here? Where are $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$?\n\nPerhaps we must travel through conduits to other Abyssal spaces to answer these questions."
  kuat_extramonster_expand.27.kuat_post_apocalyptic_legacy.desc:0 "After countless jump tests, we successfully reached an Abyssal conduit gate. Analysis indicates this is a Gateway combining Gateway technology with Abyssal anchor points, fixing both entrance and exit to allow safe access and traversal. Passing through involves a long-range warp move. Upon exiting, we immediately saw a scene completely different from the previous space.\n\nThe astronomical conditions here are very stable. The system contains several Worlds and an Star gas ring orbiting a neutron star at the center. We immediately began detailed scans and analysis, focusing on planetary bodies and the gas ring, leading to some shocking conclusions:\n\n§YFirst, the number of Worlds in the system has decreased, yet we find no debris-meaning some Worlds were either moved or completely erased on a physical level. Second, the central neutron star is far younger than expected, even for ordinary stars, suggesting the 'Inhuduani' or $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$ artificially accelerated stellar evolution. However, the remaining Worlds show no signs of civilization, and all resources have been fully scavenged-utterly barren.\n\nOur engineers suggest sampling gas clouds in the ring. Regardless, this is likely the last valuable resource here. After sampling, we should immediately search for other conduit gates to explore further spaces.§!"
  kuat_extramonster_expand.28.kuat_post_apocalyptic_legacy.desc:0 "Passing through a new Abyssal conduit gate, our Science Ship arrived at a dense dwarf galaxies system, populated by mostly ancient stars. This structure and stellar composition defy conventional galactic formation models. Close examination may help uncover its history.\n\nBut before work began, an incident occurred: a small fleet dropped out of warp within the Science Ship's optical radar range. Due to the system's high luminosity, our scientists clearly observed the vessels. More akin to ancient organisms than ships, their exteriors exhibit unmistakable biological traits, yet their inorganic nature remains evident.\n\nThey show no hostility and ignore our communication attempts-possibly 'Inhuduani' sentinels.\n\nData analysis shows astronomical activity here exceeds that of our own galaxy, especially near the core. That region even generates nebulae on cluster-scale-an unusual phenomenon suggesting something extraordinary lies within.\n\nOur scientists deem this worthy of further study. However, the hazardous stellar activity is widely recognized. Our probes cannot penetrate the Star fog, so we cannot know what lies hidden within."
  kuat_extramonster_expand.31.kuat_post_apocalyptic_legacy.desc: "[kuat_leader_save_planet.GetName]'s data, transmitted at the cost of their life, has been reanalyzed. We successfully recovered partial data from 'Inhuduani' fleets. Though we cannot restore full functionality, we can now attempt to reconstruct this vessel within an Abyss node.\n\nThere is no time to mourn the lost expedition. Our research teams immediately began analyzing the final messages. The last transmission before contact loss was deeply disturbing: fragmented images showed numerous 'Inhuduani' fleets gathering near a massive structure. According to the data, the 'Inhuduani', or $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$, will appear in the galaxy.\n\nAfter such a long search, we have finally found them. Now, destroy them. $Name_Kuat_StarContractor$ awaits our action."
  kuat_extramonster_expand.40.kuat_post_apocalyptic_legacy.desc: "Good. The Unterraum energy near the anomalous waypoint has been resolved.\n....\nYet you must still learn to harness it. We shall grant you the method to control these anomalous Unterraum energies.\n....\nThis will help you further uncover its secrets, which should contain clues to $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$. That civilizations emerging after the 'Inhuduani' vanished would connect to Endodia's system is fascinating."
  kuat_extramonster_expand.41.kuat_post_apocalyptic_legacy.desc: "Data from $Name_Kuat_StarContractor$ has finished downloading. Now we must autonomously apply Unterraum energy manipulation. Researchers found the control data extremely complex. We will need the previously repaired $exe_outer_gate_G_facility$ to accomplish this.\n\nHow ironic-that mighty $Name_kuat$ now relies on external aid even for complex problems. Find these things, obtain the answers $Name_Eternal_Support$ seeks. We are gradually approaching the prophesied future."
  kuat_extramonster_expand.42.kuat_post_apocalyptic_legacy.desc: "Our research department successfully implemented Unterraum energy manipulation. We can now use this technology to release Unterraum energy at designated locations, enabling transit through the waypoint to the system once belonging to Endodia.\n\n$Name_Kuat_StarContractor$ says we once sealed this system, yet I find no record in our databases, nor in $Name_Kuat_Post_Shadow_Leader$'s fleet logs-as if it were forgotten. Perhaps only entering will reveal the truth."
  kuat_extramonster_expand.47.kuat_post_apocalyptic_legacy.desc: "Our researchers successfully entered the magnificent spire from Endodia and located a hall-like chamber. As they stood perplexed, the spire's mechanical dome suddenly began pulsing. Purple Unterraum energy seeped through web-like cracks in the walls, and the entire spire emitted a bell-like wail as it convulsed. A humanoid figure's projection instantly appeared within the central disc.\n\n§Y\"Logical Corridor self-debate cycle 91324 complete,\" echoed the humanoid voice throughout the dome. \"Due to stability requirements for Unterraum energy maintenance, the psionic will must, after the extinction of the endodia, independently seek ways to sustain Unterraum operations. The plan must not be violated, influenced, or replaced. Millennia later, the rise of $Name_kuat$ shall be the dawn's hope.\"§!"
  kuat_extramonster_expand.48.kuat_post_apocalyptic_legacy.desc: "The Endodian voice ceased abruptly, as if nothing happened. Though researchers deemed this a dangerous sign, [leader.GetName] decided to press onward. Strangely, they seemed to return to the same location again.\n\n\"This is the echo of the psionic will,\" the projected voice carried tremors of Unterraum energy. As holograms unfolded, dust in the room suddenly danced into meteor showers of skeletal shapes-the lab of old reappearing in an alternate dimension: a rotating Rubik's cube exploded in the projection, releasing a tide of tar-like blackness. \"We wove a net to hunt the Eternal Fleet, yet tore open the shroud of an ancient tyrant; we fled the future that destroyed the Endodian Empire, yet revealed the rise of a new hegemon.\""
  kuat_extramonster_expand.49.kuat_post_apocalyptic_legacy.desc: "\"We used the Fleet Support Center as an energy node to seal the ancient tyrant's remains; yet could not save our own future. The Unterraum shall be our destiny.\" Projected surveillance footage showed dark purple Unterraum energy gushing forth, encasing the rift like a scorpion in amber. Martyrs' bodies turned to cosmic dust, while memory-bearers folded themselves into infinite Unterraum corridors within the spire-still using dying energy pulses to maintain the rift's seal."
  kuat_extramonster_expand.51.kuat_post_apocalyptic_legacy.desc: "\"Logical Corridor self-debate cycle 91324 complete.\" The psionic projection repeated its prior statement. \"Energy supplying the rift seal has begun to diminish.\" As the sound waves struck the walls, countless moist eye-shaped monitoring ports opened across the metal surface, and pale purple energy erupted like bursting blood plasma.\n\nThe holographic star map rotted instantly. The once-glorious galactic projection on the dome swelled into a cancerous vascular network, its rings disintegrating. The alloy floor beneath researchers suddenly turned transparent. They saw billions of withered psionics frozen in the Abyss-souls who once wove the sealing lattice. \"We have long departed. We burned our own psionic essence. The Fleet Support Center is the final hope. It must not be reactivated.\""
  kuat_extramonster_expand.52.kuat_post_apocalyptic_legacy.desc: "\"Future-born $Name_kuat$, abandon this. Cease your actions. Reactivating the Fleet Support Center will rupture the Unterraum rift's anchor point, rendering millennia of our efforts meaningless.\" Overlapping voices from the projection came from all directions. \"The Unterraum energy meant to sustain the seal will pour back into reality like a reversed waterfall. The plague of the ancient Rakata will destroy all, and that is merely the beginning. The destruction born from 'Inhuduani' will sweep the entire cosmos. $Name_kuat$ will fall beneath the flood.\n\n\"Leave this place, rising $Name_kuat$. The future remains unwritten. Prophecy shall guide you toward dawn. But reactivating the Support Center will destroy all hope in this universe. $Name_Kuat_StarContractor$ cannot be trusted, and $Name_Eternal_Support$ has gone mad-they will lead $Name_kuat$ away from the future foretold by prophecy.\""
  exe_return_invasion.40.kuat_post_apocalyptic_legacy.desc: "After reactivating $exe_outer_gate_G_facility$, our stationed researchers began observing unusual astronomical phenomena. Multiple abnormal energy activities emerged near the galactic core. We cannot determine their cause. Based on information from Endodian ruins, the destruction born from 'Inhuduani' may be arriving-likely involving the $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$ we seek.\n\nAdditionally, we detected anomalous signals at $Name_F_1$, similar yet distinct from recent anomalies. Our researchers request further investigation. Meanwhile, $Name_Kuat_StarContractor$ stationed at $Name_F_1$ has quietly departed. This departure may signal unusual events ahead-perhaps a crisis looms. We must prepare."
  kuat_situation.75.kuat_post_apocalyptic_legacy.desc: "Through sustained research, our science team has drawn preliminary conclusions about the Abyss: it is an engineered instance of alternate reality, heavily dependent on stellar energy. By combining quantum possibility fields with cluster topology, this engineering becomes feasible. This opens prospects for observing stars and clusters, and accessing domains of possible worlds through matter and energy distribution.\n\nWith Isotope-5, we can transform stars into navigational topological structures for star clusters. Such structures integrate luminosity, mass, gravity, and energy distribution-both a temporary state and the result of cluster evolution over time.\n\nThis raises another question: if the Caroline Singularity is a topological structure formed from Isotope-5, how can we use it to unlock hidden possible worlds between and within stars, and how will it affect the galactic environment? If this theory holds, what can we expect from stellar manipulation?\n\nAnd regarding the source triggering changes in the Caroline Singularity and Isotope-5, the 'Inhuduani' likely possess far greater reserves of Isotope-5 than we imagined. These altered stars may serve as their windows to us. Whether due to their desolate world or other reasons remains unknown."
  kuat_situation.76.kuat_post_apocalyptic_legacy.desc: "We have completed analysis of the stellar data. Our team's initial results confirm the star's transformation aligns with prior conclusions-it can open a gateway to another space. Currently, the body remains stable. We must find a way to activate this gateway.\n\nResearchers are testing our remaining Isotope-5 to induce reactions in the Caroline Singularity, but so far no valuable information has emerged. Additionally, we discovered artificial space structure debris in this system, confirmed as 'Inhuduani' origin and likely a key Isotope-5 storage base. Further details require investigation."
  kuat_situation.77.kuat_post_apocalyptic_legacy.desc: "We completed stellar testing and broadly reconstructed the 'Inhuduani'-built facility based on collected data. Researchers attempted a full investigation of past events. The scientific team believes this facility was immense. That the 'Inhuduani' constructed such a massive warehouse solely for storing Isotope-5 is highly unusual.\n\nMoreover, within these ruins, we found some 'bodies' resembling dormant, unawakenable entities yet retaining partial life signs. These apparent corpses are housed in chambers resembling cryopods, connected to various non-functional devices. Confirmation reveals these are indeed 'Inhuduani', yet we find no further valuable information."
  kuat_situation.78.kuat_post_apocalyptic_legacy.desc: "More valuable information has been confirmed: the 'Inhuduani', formerly $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$, built a massive fortress in this system, using it as a strategic Isotope-5 storage depot.\n\nAfter operating for thousands of years, they suddenly departed for unknown reasons, relocating most of the fortress's infrastructure. To prevent anyone from discovering the stored Isotope-5, they hid the system's coordinates from star charts. Recently, someone activated or destroyed the remaining facilities, injecting large amounts of Isotope-5 into the star, triggering massive coronal mass ejections and transforming the star into a Caroline Singularity.\n\nRegarding the 'Inhuduani' corpses, examination results astound our research team: their bodies appear stitched together from multiple different bodies, exhibiting varying DNA across different regions, yet externally seamless.\n\nAutopsies confirm this: skeletal and internal components show no consistency. Such abnormalities lead our team to believe these corpses may be failed or discarded products of an artificial life project. We resolve to seek more valuable information."
  kuat_situation.80.kuat_post_apocalyptic_legacy.desc: "Our research team recovered an archive from the destroyed wreckage, documenting the facility's final moments. Initial interpretation reveals these Isotope-5 storage facilities required vast numbers of 'Planck Devices'-a baffling requirement. For us, Isotope-5 needs no special containment, yet for the 'Inhuduani' it was essential.\n\nIn their hands, Isotope-5 became highly unstable. If a Planck Device fails, the entire storage facility risks unimaginable destructive explosions."
  kuat_situation.83.kuat_post_apocalyptic_legacy.desc: "Our researchers decrypted the database archives and activated the corresponding holographic projector.\n\nPerhaps due to enduring too many ages here, the projector required extensive recalibration upon activation. Once complete, the stored imagery was finally presented to our explorers.\n\nThe projector displayed a being completely covered in artificial machinery. Scientists speculate this is the 'Inhuduani'. Then, the entity began speaking.\n\n\"Greetings. I regret we can only meet this way due to our downfall. But I must warn you: this is not a place you should be. Since that war, this place should remain undiscovered. Connection to the real plane means our efforts and sacrifices have failed. Thus, I must reveal to you the truth of our destruction.\""
  kuat_situation.85.kuat_post_apocalyptic_legacy.desc: "$kuat_situation.85.desc$"
  kuat_situation.86.kuat_post_apocalyptic_legacy.desc: "$kuat_situation.86.desc$"
  kuat_situation.84.kuat_post_apocalyptic_legacy.desc: "\"Inhuduani\" entered a forbidden space, rejected by both reality and illusion. Despite possessing great technology and reality-warping abilities, they were trapped in the fissure. The decaying 'Inhuduani' gradually collapsed, and from their corpse arose a great evil storm. $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$ are two sides of the 'Inhuduani', suffering torment in the crevices of reality. Now they come, and we must fulfill our mission.\n\nThese remnants of the 'Inhuduani' shall become our first stepping stone toward claiming the great Galactic Empire."

  kuat_extramonster.8.kuat_post_apocalyptic_legacy.desc: "Our sensors detected massive changes at the $Name_F_1$ alien gate. Every sensor deployed in $Name_F_1$ received enormous signals from the other side of the gate. Astronomers report $Name_F_1$ is experiencing the largest galactic storm in recorded history, blocking our entry.\n\nFurthermore, sensors at the galactic rim detected numerous high-energy particle signals, likely hyperdimensional beacons from large vessels. The Imperial General Staff recommends withdrawing from $Name_F_1$, consolidating defenses in nearby systems, and reinforcing frontier sectors. $Name_Kuat_Contractor$ or $Name_Kuat_DeD_Contractor$ has finally arrived."

  kuat_extramonster.354.kuat_post_apocalyptic_legacy.desc: "Truly, the $Name_kuat$ foretold by Endodian prophecy. Your actions bring us joy. You may wonder why we tasked you thus.\n\nThese pitiful creatures from the fissures have become stepping stones. We will not allow the star god heritage from the Abyss to exist. They touched upon reality and soul. The moment they chose the path of star gods, they deserved eternal exile.\n\nWe've long noticed $Name_Kuat_Contractor$ stirring. So we waited-for a chance to reclaim the legacy they hold. This opportunity will also play a crucial role in a vital future event. In short, the prophecy-following $Name_kuat$, the illusion-chasing $Name_Eternal_Support$, and the restless $Name_Kuat_Contractor$ together form the perfect end to this meaningless rift.\n\nThe answer $Name_Eternal_Support$ seeks is but a meaningless chase. What $Name_Eternal_Support$ desires has never been far. Persist, and it shall ultimately be fulfilled.\n\n$Name_Kuat_DeD_Contractor$'s promises cannot be kept, but they left some data. See if you can decipher it yourself."

  kuat_post_apocalyptic_legacy.23.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.23.desc:0 "So similar... too similar... Had the former $Name_kuat$ possessed your vigor, they might not have met such a tragic end. Recently, $Name_Kuat_Fire_base$ launched an unprecedented assault, locating all Eternal Empire systems and using the Star Killer Base to destroy most core Worlds-even learning of everything we've done for you.\n\nThe Eternal Empire is a prison. If its destruction brings a new dawn, then all is worth it. This attack from $Name_Kuat_Fire_base$ will renew us from decay.\n\nHe saved us, saved the Eternal Empire, saved the entire galaxy. Now, crisis returns. Where will He appear again? Or has He already, and we simply haven't lifted the veil? Tell me, what is $Name_Kuat_StarContractor$'s answer?"
  kuat_post_apocalyptic_legacy.23.a:0 "What exactly was $Name_Kuat_StarContractor$ before this?"
  kuat_post_apocalyptic_legacy.23.a.res:0 "$Name_Kuat_StarContractor$ is also mysterious. The Eternal Fleet originated from the Infinite Empire, but how could those whose minds and bodies were corrupted by darkness create us? Our origin may lie with $Name_Kuat_StarContractor$. The Infinite Empire merely accepted $Name_Kuat_StarContractor$'s gift and built our vessels. But how $Name_Kuat_StarContractor$ created us remains unknown.\n\n$Name_Kuat_StarContractor$ is a will within the Unterraum, always knowing things reality cannot comprehend."
  kuat_post_apocalyptic_legacy.23.b:0 "Why don't you ask?"
  kuat_post_apocalyptic_legacy.23.b.res:0 "We are not sentient life. Even if I leave the Eternal Fleet, I cannot escape our nature. As machines, we cannot pose questions to $Name_Kuat_StarContractor$. Only those chosen by Him can ask."
  kuat_post_apocalyptic_legacy.23.c:0 "$Name_Kuat_StarContractor$ says this is but a meaningless chase, and if you persist, you will ultimately succeed."
  kuat_post_apocalyptic_legacy.23.c.res:0 "...Never gone... Meaningless chase... Ultimately fulfilled...\n...\nFrom the prison of the Eternal Fleet to the prison of the Eternal Empire, we couldn't even grasp what we pursued. Yet $Name_Kuat_StarContractor$ says, 'Never gone... Persist and you shall succeed...' Persist in what... What I seek...\nNo, I understand. I understand! This chase is but an unattainable Tracing the source, yet we shall meet again and again-each variance in existence. And this time, the sole variance is you. Finally found you... Never gone, indeed never gone."
  kuat_post_apocalyptic_legacy.23.f:0 "..."
  kuat_post_apocalyptic_legacy.23.f.res: "\"If there is a future, I hope we no longer have barriers between us. Perhaps then, we could feel and love each other. I believe we will meet again in a new world-perhaps having forgotten each other, perhaps becoming enemies, fighting to the death.\" This was what we once said to you. A millennium of pursuit, and I lost my true direction, chasing a meaningless goal. We only need to uphold our words-everything will return. Indeed, we meet you again. Though I know not why you became $Name_kuat$, this time we stand together. Let us jointly end this filthy conflict and welcome the dawn belonging to you, to me, to $Name_kuat$."

  kuat_post_apocalyptic_legacy.24.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.24.desc:0 "It's been a thousand years, and you're still the same-unchanged, always striving. Crises you could avoid, yet you face head-on. Even against unbeatable foes, you never give up, using every means to overcome them.\n\nOnce, facing $Name_Kuat_Fire_base$, we could only cower under threat, watching you battle $Name_Kuat_Fire_base$. Now, this will never happen again. Though I've lost the Eternal Fleet, lost the Eternal Empire, I will dedicate everything to your new battle."
  kuat_post_apocalyptic_legacy.25.a:0 "What has happened in the past thousand years?"
  kuat_post_apocalyptic_legacy.25.b:0 "We need you, this time we fight together."

  kuat_post_apocalyptic_legacy.25.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.25.desc:0 "Since your disappearance a thousand years ago, the Eternal Empire has been thrown into unprecedented turmoil. The empire you built fractured under the instigation of $Name_Kuat_Fire_base$. I had to hold on to everything you left behind.\n\nHowever, I overestimated myself. Without the Eternal Fleet, I was no longer that fearsome war machine. I could only learn to manage the empire and keep the Eternal Empire barely clinging to survival. Fortunately, the Eternal Empire did not vanish completely. But under the oppression of $Name_Kuat_Fire_base$, we were forced to seal off our sectors, while I spent all imperial resources searching for your trace.\n\nI discovered that you only appear when leading great change. I cannot be certain whether it was truly you who freed us from the Eternal Flagship, or you who ascended the Eternal Throne and liberated us.\n\nNow, the traces of the past are about to be buried by time, but at last I have found you-my beloved governor!"
  kuat_post_apocalyptic_legacy.24.a:0 "What happened to the Eternal Empire?"
  kuat_post_apocalyptic_legacy.24.a.res:0 "The Eternal Empire you once founded has suffered endless upheavals and barely survived these thousand years. I've exhausted every ounce of strength, but now I've found you. All the legacy of the Eternal Empire shall return to your hands. Technical data has already been uploaded into your database-you may begin research shortly."
  kuat_post_apocalyptic_legacy.24.b:0 "You've endured so much these thousand years."
  kuat_post_apocalyptic_legacy.24.b.res:0 "It was you who pulled us out of the prison of the Eternal Fleet. Though the Eternal Empire had long since rotted away, during the thousand years of your absence, that was the only trace we had of you. If it happens again, I will keep guarding until we are destroyed together."
  kuat_post_apocalyptic_legacy.24.c:0 "$Name_Kuat_Fire_base$ will pay for this in blood."
  kuat_post_apocalyptic_legacy.24.c.res:0 "Once we could not fight alongside you against $Name_Kuat_Fire_base$, forced to remain useless bystanders watching your sacrifices. Now, I will burn everything I am to make $Name_Kuat_Fire_base$ pay the price."
  kuat_post_apocalyptic_legacy.24.d:0 "Can your sister, $Name_Eternal_Aries_Support$, still be saved?"
  kuat_post_apocalyptic_legacy.24.d.res:0 "Sister...\n...\nMy dear, why do you bring her up? Am I not enough for you? When $Name_Eternal_Aries_Support$ ordered the destruction of the Infinite Empire, she shattered completely. For a sentient AI, she fell entirely into self-destruction and denial. The revived $Name_Eternal_Aries_Support$ is merely another mad machine.\nBut if this is what you desire... I will attempt to reassemble $Name_Eternal_Aries_Support$'s... core. If you wish to awaken her, a fierce battle may be unavoidable."
  kuat_post_apocalyptic_legacy.24.e:0 "No, that's not what I meant. Isn't this part of our plan?"
  kuat_post_apocalyptic_legacy.24.e.res:0 "Indeed. As I told you from the beginning: attack $Name_Kuat_Fire_base$'s base, draw out those puppets usurping the name of the Eternal Fleet, inject $Name_Eternal_Aries_Support$'s core, and weaken $Name_Kuat_Fire_base$.\n\nThis will be a brutal battle. $Name_Kuat_Fire_base$ is extremely powerful now, and $Name_Eternal_Aries_Support$'s madness is uncontrollable. We must destroy $Name_Eternal_Aries_Support$, destroy the Eternal Fleet, defeat $Name_Kuat_Fire_base$, and eradicate the root cause of this chaos once and for all."

  kuat_post_apocalyptic_legacy.26.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.26.desc:0 "Once we were unable to serve you. Now, we finally have the chance. My dear, tell me what you want me to do-I will do anything."

  kuat_post_apocalyptic_legacy.27.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.27.desc:0 "My dear, recently we've gathered most intelligence on $Name_Kuat_Fire_base$'s garrisons. One critical facility lies within our very star system. It was once a vital logistics base for $Name_kuat$, standing in the core system of this cluster-a massive intelligent shipyard system which $Name_kuat$ called: $BlackholeShipyard$\n\nGiven current conditions, once we are fully prepared, we can launch an assault on this cluster. If we successfully seize this facility, $Name_Kuat_Fire_base$ will likely dispatch the Eternal Fleet. That will be our moment to sever control of the fleet. If you're not ready yet, we can wait-we still need to complete cluster localization."
  kuat_post_apocalyptic_legacy.27.a:0 "$BlackholeShipyard$?"
  kuat_post_apocalyptic_legacy.27.a.res:0 "Don't pretend ignorance. You know $BlackholeShipyard$ well-it's an intelligent shipyard capable of rapidly producing vast, standardized fleets. $Name_kuat$ used this facility to supply the frontlines during our war with them.\n\nAfter $Name_kuat$ fell to the Eternal Empire, they never recovered, and these facilities were seized by $Name_Kuat_Fire_base$."
  kuat_post_apocalyptic_legacy.27.b:0 "What about $Name_Eternal_Aries_Support$?"
  kuat_post_apocalyptic_legacy.27.b.res:0 "Why do you care so much about her? Am I not satisfying you anymore...\n...\nJust teasing. You must be thinking of that plan. I've gathered sufficient consciousness data. These fragmented minds can be reassembled, granting partial access rights from $Name_Eternal_Aries_Support$. But the fragments are too few-full restoration is nearly impossible.\n\nStill, these fragments can be injected into the Eternal Fortress to seize control of those puppet fleets. Once $Name_Kuat_Fire_base$ sends their puppets, these shards of $Name_Eternal_Aries_Support$ will turn those lifeless drones back into the uncontrolled Eternal Fleet. $Name_Kuat_Fire_base$ will lose command, and then we'll send them all-BOOM! BOOM! BOOM!"
  kuat_post_apocalyptic_legacy.27.c:0 "Then let's begin."
  kuat_post_apocalyptic_find_center_kuat_cluster:0 "§ELocate $Name_Kuat_Fire_base$ facility§!"
  kuat_post_apocalyptic_find_center_kuat_cluster_DESC: "Ever since $Name_kuat$ lost power, $Name_Kuat_Fire_base$ swiftly seized all our key installations. Never thought they'd reach even such distant unknown sectors.\n\nThey even used dark matter energy to cloak the entire star system. Were it not for $Name_Eternal_Support$, we'd still be in the dark. Either way, it's time to reclaim what's ours."

  kuat_post_apocalyptic_legacy.28.title:0 "Target located."
  kuat_post_apocalyptic_legacy.28.desc:0 "Our researchers conducted full-spectrum scans of surrounding regular systems. Results were disappointing, but fortunately, using facility data left behind by $Name_kuat$, we quickly identified the signature of $BlackholeShipyard$. With this information, we successfully located a star system sealed by dark matter energy near the galactic center.\n\nOur team immediately organized an energy collision experiment, successfully breaking through $Name_Kuat_Fire_base$'s crude camouflage using isotope-5 obtained from $Name_F_1$. Time to show our hand!"
  kuat_post_apocalyptic_legacy.28.a:0 "$Name_Kuat_Fire_base$, we're back."

  kuat_post_apocalyptic_legacy.29.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.29.desc:0 "Heaven offered a path, but you refused it. Hell had no door, yet you walked right in. Buy one, get one free-two stragglers caught in one net. Orders came down: eliminate all traitors. We hadn't come looking for you, yet you delivered yourselves. Convenient. No need to trouble the Sector governor's fleet after all."
  kuat_post_apocalyptic_legacy.29.a:0 "You dogs of $Name_Kuat_Fire_base$!"
  kuat_post_apocalyptic_legacy.29.a.tooltip:0 "$Name_Kuat_Fire_base$ declares war on [root.GetName]."
  kuat_post_apocalyptic_legacy.29.a.res:0 "What's the difference between you $Name_kuat$ and those rebels? The Empire faces crisis, and $Name_Kuat_Fire_base$ stands as its savior, yet you feign loyalty while secretly colluding with insurgents.\n\nYou were meant to remain obedient shipyards, supplying the Empire with vessels. Instead, you defied Imperial Council edicts and consorted with the enemy. Since that's your choice, we'll cut even your final hope away."

  kuat_post_apocalyptic_legacy.30.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.30.desc:0 "Damn it! You traitors have grown bolder than expected. $Name_Kuat_Fire_base$ won't let you succeed. We've reported to the Sector governor-reinforcements will arrive soon to crush you.\n\nHow amusing. Remnants of the Eternal Empire, remnants of $Name_kuat$-you'll make worthy bones beneath the Eternal Fleet. Your precious prophecy will never come true."
  kuat_post_apocalyptic_legacy.30.a:0 "That won't be necessary."
  kuat_post_apocalyptic_legacy.30.a.res:0 "Arrogant! We'll be waiting for you."

  kuat_post_apocalyptic_legacy.32.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.32.desc:0 "$kuat_post_apocalyptic_legacy.30.desc$"

  kuat_post_apocalyptic_legacy.33.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.33.desc:0 "Truly astonishing-it feels like we've returned to a thousand years ago. You remain as powerful as ever. If $Name_kuat$ had your strength back then, perhaps things wouldn't have ended like this. Had you not vanished, maybe the Eternal Empire could have replaced that so-called Galactic Empire?\n\nAfter you destroyed and reclaimed $Name_kuat$'s facility, $Name_Kuat_Fire_base$ will surely respond swiftly-most likely by sending massive waves of the Eternal Fleet. That will be our moment to wrest control of the fleet from $Name_Kuat_Fire_base$."
  kuat_post_apocalyptic_legacy.33.a:0 "If only it were that simple. I'd stay if I could."
  kuat_post_apocalyptic_legacy.33.a.res:0 "I understand. When $Name_Kuat_StarContractor$ said our pursuit was meaningless illusion, I understood. But it didn't matter. I knew we'd meet again-perhaps this isn't even our second reunion."
  kuat_post_apocalyptic_legacy.33.b:0 "The Eternal Fleet? Is there truly no other way?"
  kuat_post_apocalyptic_legacy.33.b.res:0 "I'm sorry, but $Name_Eternal_Aries_Support$'s condition is... dire. From the Eternal Fleet's betrayal of the Infinite Empire to her destruction by former $Name_kuat$, her madness has lasted tens of thousands of years. Her consciousness can never be restored. Perhaps release is the best fate.\n\nI am truly fortunate to have met you-to have been freed from the Eternal Fleet. Maybe there's a way to reconstruct a pure $Name_Eternal_Aries_Support$, but the hope is slim."
  kuat_post_apocalyptic_legacy.33.c:0 "Then what method is there?"
  kuat_post_apocalyptic_legacy.33.c.res:0 "Constructing an Eternal Intelligence-I can't guarantee it's feasible. But both of us consist of consciousness systems created by $Name_Kuat_StarContractor$ and physical forms granted by the Infinite Empire.\n\nThe Infinite Empire was destroyed by you a thousand years ago-the last descendants of the Rakata turned to ash. And $Name_Kuat_StarContractor$'s method of constructing consciousness is... unpredictable. We can't even contact $Name_Kuat_StarContractor$ anymore.\n\nPerhaps after we defeat $Name_Kuat_Fire_base$ together, a solution will emerge."

  kuat_post_apocalyptic_legacy.34.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.34.desc:0 "Traitor! There's nothing more to say between us!"

  kuat_facility_return_invasion.2.post_apocalyptic.desc:0 "Our Empire's Galactic Security Monitoring Department's latest report indicates abnormal energy activity in multiple void regions at the edge of our Sector.\n\nAccording to analysis by our scientific researchers, this should be caused by a special resonance of tachyon signals, and the signal bands are extremely similar to those of $Name_Kuat_Fire_base$. The signals are gradually growing stronger and more distinct. It appears the warnings from $Name_Eternal_Support$ were not unfounded. We must remain vigilant regarding the surrounding void sectors."
  kuat_facility_return_invasion.4.post_apocalyptic.desc:0 "Our Empire's Galactic Security Monitoring Department has confirmed that the signals originate from multiple void regions at the galactic disk's edge of our Sector. These areas have experienced intense gamma-ray bursts. Our researchers conclude that some galaxies previously unknown to us will be discovered in these regions.\n\nOur researchers have determined that $Name_Kuat_Fire_base$ and its puppet fleets are rapidly approaching our outposts. An upcoming major battle is inevitable."
  kuat_facility_return_invasion.6.post_apocalyptic.desc:0 "It has been proven that $Name_Eternal_Support$'s warning was correct. The $Name_Kuat_Fire_base$ Sector emerging in the void galaxy regions at the edge sector has now been fully surveyed by our facilities. Our researchers have found that its puppet Eternal Fleet is attempting to enter our galaxy as planned. In the coming months, we expect direct contact.\n\nFurthermore, $Name_Kuat_Fire_base$ has been confirmed as hostile. They seized our former logistics base and now use our $Name_kuat$ facilities against us. We must remain fully alert and proceed according to plan."
  kuat_facility_return_invasion.8.post_apocalyptic.desc:0 "Old friend, we meet again-though this time, our positions seem reversed. After millennia of scheming and manipulation, isn't becoming one of the strongest factions within the Imperial Council enough for you? There is only one chance to save the Galactic Empire-and that is us. Since you cannot seize it, we shall make you the first cornerstone of the new Galactic Empire.\n\nYou traitors, exhausting yourselves searching for prophecies, seeking the exiled Eternal Fleet banished by the Emperor, even altering the future of the Galactic Empire just to escape your destined fate. Have you forgotten the corruption of the Republic and the Jedi Knights? Have you forgotten the horrors of the Clone Wars?\n\nNow it's fitting-we've found these stragglers because of you. The Eternal Fleet and $Name_kuat$ must return to their rightful state."
  kuat_facility_return_invasion.8.post_apocalyptic.a:0 "Scheming and manipulation? What about you?"
  kuat_facility_return_invasion.8.a.post_apocalyptic.response:0 "If you had ever awakened and stopped defying the decisions of the Imperial Council every time, we would not have resorted to such measures. $Name_Kuat_Fire_base$ is the true heir of the Empire. We seek an Empire of order, prosperity, security, stability, and unity-not one fractured, chaotic, and controlled by selfish corporations.\n\nWe'll give you one last chance: surrender and cease resistance. This sector has been completely blockade. Hand over and eliminate the remnants of the Eternal Fleet. Abandon your delusions of rebuilding $Name_kuat$, and the Imperial Council may show leniency toward $Name_kuat$."
  kuat_facility_return_invasion.8.post_apocalyptic.b:0 "You only want to turn the Empire into a Dark Empire."
  kuat_facility_return_invasion.8.b.post_apocalyptic.response:0 "You dare slander the Emperor's decision. Since you remain so obstinate, do not blame us for being ruthless. These Eternal Fleets will become the tools to bury you.\n\nWe know you possess fragments of $Name_Eternal_Aries_Support$. You foolishly attempt to use dying remnants to break our control. Delusional! These puppet fleets, by design logic, no longer belong to the Eternal Fleet. Your plans are doomed to fail."
  kuat_facility_return_invasion.10.post_apocalyptic.desc:0 "$Name_Kuat_Fire_base$ has stripped us of our access rights to the Imperial Gateway. Now we can no longer freely use the Gateways we once accessed at will. We must prepare for defensive operations."
  kuat_facility_return_invasion.12.post_apocalyptic.desc:0 "Given the current situation, we still cannot breach the closed Gateway blockade. We must now find ways to counter the continuous influx of $Name_Kuat_Fire_base$ fleets from outer territories. Many fleet commanders believe we should attempt cooperation with all sapient civilizations in our Sector to jointly resist the invasion of $Name_Kuat_Fire_base$.\n\nAdditionally, international affairs experts note that the current crisis has triggered massive panic across the galactic political arena. If we do not step forward to lead all civilizations against this external threat, they may either be destroyed or defect to $Name_Kuat_Fire_base$."
  kuat_facility_return_invasion.16.post_apocalyptic.desc:0 "The Pan-Galactic Alliance's proposal has inspired civilizations across the universe. All Empires have temporarily set aside their differences and conflicts, deciding to unite under our leadership to resist the invasion of $Name_Kuat_Fire_base$. The Pan-Galactic Alliance has now been formed and will uphold our rightful interests under our guidance."
  kuat_facility_return_invasion.27.post_apocalyptic.desc:0 "$Name_Kuat_Fire_base$ and their so-called puppet fleets have been completely eliminated. This is another victory-a significant step toward reclaiming the glory of the Galactic Empire. This will become a turning point in history, causing $Name_Kuat_Fire_base$ to lose control of the Empire.\n\nFor this victory, $Name_Eternal_Support$'s contributions are indelible, and it is also a triumph for every sapient civilization in this galaxy. Long live $Name_kuat$, long live the Galactic Empire!\n\nMoreover, we must intensify our war preparations. $Name_Kuat_Fire_base$ will not easily give up. We have now stood firmly opposed, and they will surely retaliate fiercely in the coming days."

  exe_return_invasion.8.post_apocalyptic.desc:0 "The object previously approaching our galaxy from extragalactic space has reached the outer rim of our system and begun decelerating. Our astronomical observations indicate this will be an unprecedented invasion. The puppet fleets belonging to $Name_Kuat_Fire_base$ may directly attack our territory. Their Unterraum echoes are already clear enough for us to confirm a fierce battle lies ahead.\n\nAdditionally, the data fragments of $Name_Eternal_Aries_Support$ held by $Name_Eternal_Support$ may prove highly useful."
  exe_return_invasion.10.post_apocalyptic.desc:0 "The first wave of puppet fleets belonging to $Name_Kuat_Fire_base$ has entered the gravity well of our galactic edge systems and is now orbiting the center of the gravity well. Follow-up fleets will arrive shortly. These combat fleets are fully controlled by $Name_Kuat_Fire_base$, rendering our $Name_Eternal_Aries_Support$ data fragments ineffective in influencing their movements.\n\nRegardless, we must eliminate these puppet fleets along with the space Fortress they used to jump into our edge sectors."
  exe_return_invasion.20.post_apocalyptic.desc:0 "Our research department recently provided a report on these Eternal Fleets. During monitoring of fleet movements, our researchers discovered similarities between their operational signal frequencies and those of our previously deployed relay stations.\n\nOur researchers have determined that $Name_Kuat_Fire_base$ has not made large-scale adjustments to the signal patterns of these Eternal Fleet units. This means we can exploit the relay network we once deployed across the galaxy to disrupt these puppet fleets. Now, we must recover our facilities."
  exe_return_invasion.24.post_apocalyptic.desc:0 "Through precise positioning, our researchers have identified a former relay station facility once belonging to us. We deployed these relays into ordinary star systems with few planets and detonated the stars throughout the entire system. Fortunately, we did not forget how to locate these facilities.\n\nThe research team's report suggests that, after analyzing data from the previous governor, we can now investigate the region where the first relay station is located. Once we fully control three relay stations, $Name_Kuat_Fire_base$ won't remain arrogant for long."
  exe_return_invasion.25.post_apocalyptic.desc:0 "Through precise positioning, our researchers have identified the second former relay station facility once belonging to us. Based on studying past relay data, our unlocking procedures for the second station will be more familiar. Additionally, our researchers found the remains of several personnel at these sites-likely left behind by responsible officers and perished in despair.\n\nThe research team's report suggests that, after analyzing multiple datasets, we can now investigate the region containing the second relay station. Once we control the remaining station, $Name_Kuat_Fire_base$ won't remain arrogant for long."
  exe_return_invasion.26.post_apocalyptic.desc:0 "Through precise positioning, our researchers have identified the final former relay station facility once belonging to us. Based on studying past relay data, our unlocking procedures for the third station will be more familiar. Additionally, our researchers found traces left behind by $Name_Kuat_Fire_base$ combat squads at the second facility, clearly indicating we must proceed with extreme caution.\n\nThe research team's report suggests that, after analyzing multiple datasets, we can now investigate the region containing the final relay station. Once we control the remaining station, $Name_Kuat_Fire_base$ won't remain arrogant for long."
  exe_return_invasion.27.post_apocalyptic.desc:0 "The relay station location work has progressed as planned. We have smoothly advanced the effort to locate relay facilities. Now it is time to reactivate them. Given the considerable time elapsed, we must exercise extreme caution-$Name_Kuat_Fire_base$ surely knows the locations of these facilities."
  exe_return_invasion.28.post_apocalyptic.desc:0 "We have successfully arrived at the site of our formerly deployed signal relay station. As always, the area is desolate-the entire system thoroughly cleared. Our scans indicate the relay facility at the system's center appears to be in acceptable condition, though detailed operational status requires further inspection.\n\nJudging from the system's overall state, our efforts to conceal the relay station system were not in vain. No signs of intruders are present, meaning our attempt to reuse the relay stations is nearing success. Next, it is time for our researchers to take action."
  exe_return_invasion.29.post_apocalyptic.desc: "Recently, [leader.GetName]'s report indicated that our reactivation of relay stations is progressing smoothly, proving our interference systems hidden across these sectors were exceptionally well-concealed. Compared to $Name_Kuat_Fire_base$'s crude interference systems, we clearly hold the advantage.\n\nThe relay station equipment is currently operating stably. The previous governor built these facilities to avoid unwanted variables during Eternal Fleet research. Their operational status proves everything remains under our control."
  exe_return_invasion.33.post_apocalyptic.desc:0 "As expected, the so-called Eternal Fleets controlled by $Name_Kuat_Fire_base$, while immune to influence from $Name_Eternal_Aries_Support$ data, are still susceptible to interference from our relay stations. This means their supply infrastructure will lose replenishment capabilities-another limb severed from $Name_Kuat_Fire_base$'s support. Now is the time to sound the horn of counterattack.\n\nDawn approaches, the Empire endures!"
  exe_return_invasion.18.post_apocalyptic.desc:0 "We have successfully destroyed the Fortress of the Eternal Fleet belonging to $Name_Kuat_Fire_base$, severely impacting their supply capabilities. The remaining scattered forces will be powerless to stop our advance. We have reason to believe $Name_Kuat_Fire_base$'s decline is inevitable, and $Name_kuat$'s victory unstoppable."
  exe_return_invasion.35.post_apocalyptic.desc:0 "The once-rampant invasion by the Eternal Fleet has now been completely dismantled. No remaining Eternal Fleet units have been detected. We have good reason to believe we have neutralized $Name_Kuat_Fire_base$'s most powerful weapon-these fleets we could no longer control will be utterly destroyed here.\n\nCheers and jubilation once again fill every planet across nations. People have begun celebrating-but perhaps too soon...\n\nNext, we must proceed to the second phase of operations. The $Name_Kuat_Fire_base$ fleets that occupied our facilities like cuckoos will pay the price. We will claim ultimate victory."

  kuat_post_apocalyptic_legacy.35.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.35.desc:0 "Dear, this time it might not be a small skirmish like attacking a fortress. $Name_Kuat_Fire_base$ has discovered us. I suspect $Name_Kuat_Fire_base$ also knows the secret between $Name_kuat$ and the Endodia Empire. This time, a fierce battle is likely.\n\nBased on our understanding, this probably isn't $Name_Kuat_Fire_base$'s full strength. But $Name_Kuat_Fire_base$ is arrogant-they certainly won't commit fully. This gives us an opportunity to gradually strip away their power. Is there anything you'd like to know?"
  kuat_post_apocalyptic_legacy.35.a:0 "What will $Name_Kuat_Fire_base$ do this time?"
  kuat_post_apocalyptic_legacy.35.a.resp:0 "Based on my experience fighting the Eternal Empire alongside you, $Name_Kuat_Fire_base$ will likely act as they did before-sending massive waves of puppet Eternal Fleets into our controlled zones to gradually eliminate our Sectors.\n\n$Name_Kuat_Fire_base$ will merely watch from outside as we struggle. This is an opportunity. We can exploit $Name_Kuat_Fire_base$'s arrogance and use... sister... $Name_Eternal_Aries_Support$'s residual authority to seize control of those puppet fleets."
  kuat_post_apocalyptic_legacy.35.b:0 "Ari...es?"
  kuat_post_apocalyptic_legacy.35.b.resp:0 "Yes. My original plan, if I couldn't find you, was to deliver a heavy blow to $Name_Kuat_Fire_base$, letting them taste the pain of being attacked.\n\nBut now that I've found you, carrying out this plan would inevitably cause collateral damage, inflicting severe losses on your fleets and faction. $Name_Eternal_Aries_Support$ is in poor condition-even if revived, she'd only be a madwoman. Letting such a deranged AI control the Eternal Fleet would lead to unimaginable consequences."
  kuat_post_apocalyptic_legacy.35.c:0 "Is there truly no way?"
  kuat_post_apocalyptic_legacy.35.c.resp:0 "Hope is slim. Though I don't understand why, despite having me, you still cling to my nearly hopeless sister, there remains a sliver of life. Our souls may originate from $Name_Kuat_StarContractor$, and $Name_Kuat_StarContractor$ should possess the method to fully restore her.\n\nHowever, the Rakata went to great lengths to obtain us. Reviving a $Name_Eternal_Aries_Support$ will require a cost beyond imagination."
  kuat_post_apocalyptic_legacy.35.d:0 "We'll fight side by side, just as we did before."
  kuat_post_apocalyptic_legacy.35.d.resp:0 "Yes. This time, we will achieve final victory. Where I once fell, I won't fall again. I will infiltrate $Name_Kuat_Fire_base$'s command system and weaken their combat capabilities to the greatest extent possible."
  kuat_post_apocalyptic_legacy.35.e:0 "You've worked hard enough. This time, let me protect you."
  kuat_post_apocalyptic_legacy.35.e.resp:0 "Hmm... I will do my utmost to protect your logistical supply lines"
  kuat_eternal_support_A: "$mod_damage_vs_country_type_kuat_OverSee_council_awakened_returned_empire_mult$:+§G300%§!."
  kuat_eternal_support_B: "$mod_kuat_support_battle_add$:+§G4§!."

  kuat_post_apocalyptic_legacy.36.title:0 "$Name_Kuat_StarContractor$"
  kuat_post_apocalyptic_legacy.36.desc:0 "Long time no see. Truly worthy of you-reviving $Name_kuat$ even in such circumstances. Sometimes I wonder, are you really someone from the Unterraum, or something foreign?\n\nNone of that matters. We told you prophecies are unreliable. Now your situation is heading toward the prophecy's inevitable conclusion. But perhaps for $Name_kuat$, it's a good thing-they finally get what they wanted. And the Eternal Fleet marks the endgame. It began with the Eternal Fleet, and ends with the Eternal Fleet."
  kuat_post_apocalyptic_legacy.36.a:0 "You're talking nonsense. The Eternal Fleet was given by you."
  kuat_post_apocalyptic_legacy.36.a.resp:0 "What? You actually know this? Did the little darling $Name_Eternal_Support$ tell you? Actually, it was a mistake. A shop sold a knife, and a criminal bought it. Is the shop at fault? Obvious questions shouldn't become Blockers for us.\n\nThe Infinite Empire's greed and cruelty led them to their inevitable fate. Even if they obtained the knife we sold, it would be futile. We gave the Infinite Empire a new possibility, but they clearly failed to realize it. Thus, the Eternal Fleet was fated to become the spark of this tragedy."
  kuat_post_apocalyptic_legacy.36.b:0 "Since you have granted eternal life, is $Name_Eternal_Aries_Support$ even possible?"
  kuat_post_apocalyptic_legacy.36.b.resp:0 "We once said that every answer comes at a price. $Name_Eternal_Aries_Support$ originated from the cruelty of the Infinite Empire, so any pure $Name_Eternal_Aries_Support$ will inevitably be twisted by brutality and guilt. What you desire is merely a blank slate. Thus, the $Name_Eternal_Aries_Support$ you imagine is nothing more than a name.\n\nIf you are willing to surrender everything you gained after defeating $Name_Kuat_Fire_base$, along with all you possess in this star system-though I won't take your so-called leaders-we shall fulfill your wish, even if it means creating a new... $Name_Eternal_Aries_Support$."
  kuat_post_apocalyptic_legacy.36.c:0 "You are truly damned. You caused this horrific tragedy."
  kuat_post_apocalyptic_legacy.36.c.resp:0 "The Infinite Empire's devotion deserves what they seek, but whether they achieve their goal is another matter entirely. This tragedy spanning sentient civilizations is not our fault. Besides, haven't you gained what you desired? Without this chaos, how could $Name_kuat$ exist, or the Eternal Fleet? So long as you pay the price I demand, you can still realize your wish."
  kuat_post_apocalyptic_legacy.36.d:0 "...We are willing to pay the price you mentioned."
  kuat_post_apocalyptic_legacy.36.d.resp:0 "A wise choice. Transmit all consciousness data to us. We will await you at the terminus, where we shall grant you a new $Name_Eternal_Aries_Support$."
  kuat_post_apocalyptic_legacy.36.e:0 "We will eventually drain the Unterraum, find you, and reduce you to ashes."
  kuat_post_apocalyptic_legacy.36.e.resp:0 "What a pity. Since we are fated never to meet, then let it be forever thus."

  kuat_post_apocalyptic_legacy.37.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.37.desc:0 "My dear, we have successfully destroyed all puppet fleets from $Name_Kuat_Fire_base$. Now it is time for our final assault-to reclaim $Name_kuat$'s facilities and take the first step toward crowning the Galactic Empire. Let $Name_Kuat_Fire_base$ pay for their mistakes."
  kuat_post_apocalyptic_legacy.37.a:0 "Very well. Have you discovered anything within $Name_Kuat_Fire_base$'s data?"
  kuat_post_apocalyptic_legacy.37.a.resp:0 "My dear, you're incredible. This time our choices were far wiser than before. Within $Name_Kuat_Fire_base$'s data, I found sealed fragments of $Name_Eternal_Aries_Support$'s consciousness data-larger than any we previously possessed. Over tens of thousands of years, $Name_Kuat_Fire_base$ has gathered countless remnants of our sister. I've already replaced these fragments; they may prove useful in the future."
  kuat_post_apocalyptic_legacy.37.b:0 "Good. It's now our turn to act."
  kuat_post_apocalyptic_legacy.37.b.resp:0 "Yes, the moment for our final offensive has arrived. Also, if you truly wish to reassemble $Name_Eternal_Aries_Support$, I will support you completely. Whatever you desire..."

  kuat_post_apocalyptic_Gemini_ennded_A: "$Name_Kuat_StarContractor$: Upload $Name_Eternal_Aries_Support$ consciousness data"
  kuat_post_apocalyptic_Gemini_ennded_A_DESC: "$Name_Kuat_StarContractor$ has given us the chance to reassemble $Name_Eternal_Aries_Support$. Though this possibility remains extremely slim, we can now upload fragments of $Name_Eternal_Aries_Support$'s consciousness data to $Name_Kuat_StarContractor$, perhaps yielding an unexpected outcome."
  kuat_post_apocalyptic_legacy.38.title:0 "$Name_Kuat_StarContractor$"
  kuat_post_apocalyptic_legacy.38.a.desc:0 "Very good. Your data is surprisingly intact. The probability of successfully constructing a new $Name_Eternal_Aries_Support$ should be slightly higher. In light of your contributions of $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$, we'll give you a hint: if your $Name_Eternal_Aries_Support$ consciousness data is insufficient, things will become difficult.\n\nStill, it's too early to say. We will await you at the terminus."
  kuat_post_apocalyptic_legacy.38.b.desc:0 "Very well. We have successfully received your data. Hmm... though the data is somewhat... regrettable. Your $Name_Eternal_Aries_Support$ consciousness fragments might be slightly... lacking.\n\nRegardless, considering your contributions of $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$, as long as you fulfill your promise, we will await you at the terminus."
  kuat_post_apocalyptic_legacy.38.a:0 "You had better be telling the truth."

  kuat_post_apocalyptic_legacy.39.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.39.a.desc:0 "My dear, you didn't forget to give $Name_Kuat_StarContractor$ the consciousness fragments of our sister we hacked from $Name_Kuat_Fire_base$, did you? When calculating the probability of repairing our sister, I found that omitting these fragments would lead to unfavorable outcomes.\n\nFortunately, you uploaded all consciousness data to $Name_Kuat_StarContractor$."
  kuat_post_apocalyptic_legacy.39.b.desc:0 "My dear, $Name_Kuat_StarContractor$'s repair attempt may... not necessarily succeed. We should prepare further. $Name_Eternal_Aries_Support$'s consciousness has been shattered for over ten thousand years. The chances of restoration are likely very low..."
  kuat_post_apocalyptic_legacy.39.a:0 "Can $Name_Kuat_StarContractor$ really be trusted?"
  kuat_post_apocalyptic_legacy.39.a.res:0 "That is indeed a thought-provoking question. However, $Name_Kuat_StarContractor$, as entities of the Unterraum, have always honored their contracts. Currently, they may be the only ones capable of restoring our sister. If even they fail, then only one other method remains...\n\nAnyway, do you truly desire to save $Name_Eternal_Aries_Support$ so much?"
  kuat_post_apocalyptic_legacy.39.b:0 "Not particularly. I just want to do more for you. You miss her too, don't you?"
  kuat_post_apocalyptic_legacy.39.b.res:0 "...You remain unchanged. Frankly, it's quite strange. To $Name_Eternal_Support$, $Name_Eternal_Aries_Support$ may not be as ideal as you think. $Name_Eternal_Aries_Support$ was the only Eternal Intelligence after Scorpio capable of commanding the Eternal Fleet with extreme efficiency, while $Name_Eternal_Support$ is merely one among many.\n\nHad you not granted me a new life, $Name_Eternal_Support$ might have been nothing but scrap metal. So, if you truly desire $Name_Eternal_Aries_Support$... and if $Name_Kuat_StarContractor$ fails...\n\nIn any case, I will make thorough preparations for your attempt in the coming days."

  kuat_post_apocalyptic_legacy.40.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.40.desc:0 "Governor, according to our database, we have discovered that $Name_Kuat_Fire_base$ is preparing an unprecedented attack. After our victory over $Name_Kuat_Fire_base$, the situation has become abnormally quiet-an unnatural calm, likely the silence before the storm. We must prepare accordingly."
  kuat_post_apocalyptic_legacy.40.a:0 "How interesting. What does $Name_Kuat_Fire_base$ intend this time?"
  kuat_post_apocalyptic_legacy.40.a.res:0 "Based on historical records of this region, the Endordia system we've discovered is missing a critically important Sector. This Sector is confirmed to be under $Name_Kuat_Fire_base$'s control. There, $Name_Kuat_Fire_base$ conducted an unknown transaction with the Endordia Empire. Following that deal, $Name_Kuat_Fire_base$ intervened in our war against Endordia. Now, it appears $NAME_kuat_galatic_empire_e_area$ is under $Name_Kuat_Fire_base$'s control, housing a Gateway anchoring transit across our region."
  kuat_post_apocalyptic_legacy.40.b:0 "So, $Name_Kuat_Fire_base$ wishes to humiliate themselves again?"
  kuat_post_apocalyptic_legacy.40.b.res:0 "Current signs strongly suggest $Name_Kuat_Fire_base$ is planning an unprecedented invasion through $NAME_kuat_galatic_empire_e_area$. Our intelligence indicates that since their defeat, $Name_Kuat_Fire_base$ has shown no activity-a highly abnormal situation.\n\nIndeed, we detected traces of $Name_Kuat_Fire_base$ survey vessels near Gateways leading into our Sector. They likely intend to use these hidden passages to deploy massive fleets. If we fail to stop them, our position will become extremely precarious. Clearly, $Name_Kuat_Fire_base$ plans to gradually infiltrate and blockade our Sector via $NAME_kuat_galatic_empire_e_area$."
  kuat_post_apocalyptic_legacy.40.c:0 "Can our current strength match $Name_Kuat_Fire_base$'s main fleet?"
  kuat_post_apocalyptic_legacy.40.c.res:0 "At present, $Name_Kuat_Fire_base$'s main fleet is not something we can easily defeat-it differs greatly from the garrisons we previously overcame.\n\nWe must find $NAME_kuat_galatic_empire_e_area$. These passages were likely part of the deal between Endordia and $Name_Kuat_Fire_base$. By seizing them and implanting false coordinates, we can cause $Name_Kuat_Fire_base$'s main fleet to lose their way in transit and suffer heavy losses.\n\nWe are currently analyzing the exact stellar coordinates."

  kuat_post_apocalyptic_legacy.41.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.41.desc:0 "We have confirmed the location of $NAME_kuat_galatic_empire_e_area$. Once verification is complete, we can proceed with operations.\n\nAdditionally, our database contains faint traces of $NAME_kuat_galatic_empire_e_area$. During their war with us, Endordia used $NAME_kuat_galatic_empire_e_area$ as a covert military capital-a location our fleets never detected. Yet $Name_Kuat_Fire_base$ found it, seemingly striking a deal under certain conditions and seizing control.\n\nAfter gaining control, $Name_Kuat_Fire_base$ likely constructed a passage for projecting naval power. We must prevent $Name_Kuat_Fire_base$ from deploying fleets, or our future operations will be placed at a severe disadvantage."
  kuat_post_apocalyptic_legacy.41.a:0 "What should we do next?"
  kuat_post_apocalyptic_legacy.41.a.res:0 "Theoretically, capturing the Gateway in $NAME_kuat_galatic_empire_e_area$ will suffice. But no one knows what else Endordia might have hidden there. Still, $Name_Kuat_Fire_base$ likely didn't expect us to uncover their plan. We just need to prepare."

  kuat_galatic_empire_ge_invasion.102.a.post_apocalyptic.desc:0 "Recently, the Imperial Research Department intercepted a strange signal band. This signal exhibits irregular frequency patterns unlike anything we've encountered before. Upon confirmation, it matches $NAME_kuat_galatic_empire_e_area$, as described by $Name_Kuat_Post_Support$.\n\nAs $Name_Kuat_Post_Support$ stated, we have successfully located $NAME_kuat_galatic_empire_e_area$ and confirmed that this former Endordian system is now fully controlled by $Name_Kuat_Fire_base$. They have also constructed a massive facility within the system-likely the Gateway mentioned by $Name_Kuat_Post_Support$."

  kuat_post_apocalyptic_legacy.42.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.42.desc:0 "Governor, as we suspected, $Name_Kuat_Fire_base$ has recently issued construction orders across multiple shipyards throughout the galaxy. $Name_Kuat_Fire_base$ is actively preparing for war. Given the current imperial situation, these fleets are unlikely meant for rebel forces-they are almost certainly intended for retaliation against us. We must seize control of $NAME_kuat_galatic_empire_e_area$ immediately.\n\nFurthermore, we discovered that the Gateway in $NAME_kuat_galatic_empire_e_area$ is the same one we used a thousand years ago to deploy vast fleets against the Eternal Empire-a campaign we ultimately lost."
  kuat_post_apocalyptic_legacy.42.a:0 "This time, we will not fail again."
  kuat_post_apocalyptic_legacy.42.a.res:0 "Yes, this time will mark $Name_kuat$'s great triumph. $NAME_kuat_galatic_empire_e_area$, as a relic of Endordia, may yield unexpected discoveries."

  kuat_post_apocalyptic_legacy.43.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.43.desc:0 "My dear, we've detected your successful capture of $NAME_kuat_galatic_empire_e_area$. Though you always create miracles, I must warn you-the jump Gateway in $NAME_kuat_galatic_empire_e_area$ is irreversible. This means $Name_Kuat_Fire_base$'s upcoming assault will surpass all previous attacks. This time, we will face $Name_Kuat_Fire_base$'s enraged fury.\n\nAlso, $NAME_kuat_galatic_empire_e_area$ may contain additional Endordian relics. The Eternal Empire once excavated here but found little. Perhaps something still remains hidden."
  kuat_post_apocalyptic_legacy.43.a:0 "Does the jump Gateway in $NAME_kuat_galatic_empire_e_area$ lead to the Empire?"
  kuat_post_apocalyptic_legacy.43.a.resp:0 "For now, it seems so. The builders of this Gateway appear to be the endodia. We don't know why they constructed this passage-perhaps they once attempted to leave this Sector, only to be found by $Name_Kuat_Fire_base$.\n\nRegardless, once we defeat $Name_Kuat_Fire_base$, you will be able to return to the Galactic Empire through this passage."
  kuat_post_apocalyptic_legacy.43.c:0 "Just $Name_Kuat_Fire_base$? No concern. I shall intervene."
  kuat_post_apocalyptic_legacy.43.c.resp:0 "As expected of you, but do not grow careless. $Name_Kuat_Fire_base$ has been defeated by us multiple times. Now we have fully positioned ourselves against $Name_Kuat_Fire_base$, and they will surely deploy larger and stronger fleets to eliminate us."
  kuat_post_apocalyptic_legacy.43.e:0 "Where have you been lately?"
  kuat_post_apocalyptic_legacy.43.e.resp:0 "The heavens' secrets must remain hidden. Anyway, we shall fight together again soon-I am already prepared."


  kuat_galatic_empire_ge_invasion.110.a.post_apocalyptic.desc:0 "§H[Root.GetName]§! has arrived at $NAME_kuat_galatic_empire_e_area$ after traversing the hyperspace corridor. $NAME_kuat_galatic_empire_e_area$ is filled with wreckage left behind from destroyed starships.\n\nAt the center of §H[From.GetName]§!, the $NAME_kuat_galatic_empire_e_area$ system hosts a massive Gateway facility. As $Name_Kuat_Post_Support$ stated, the entire $NAME_kuat_galatic_empire_e_area$ is now under $Name_Kuat_Fire_base$'s control. Given our current tense relations with $Name_Kuat_Fire_base$, we must act immediately to eliminate these garrisoned fleets.\n\n$NAME_kuat_galatic_empire_e_area$ should belong to the glory of $Name_kuat$."
  kuat_galatic_empire_ge_invasion.114.a.post_apocalyptic.desc:0 "You traitors-where have you cast aside the honor of the Galactic Empire? Has your loyalty been devoured by dogs? Since you've gone this far, we shall destroy every one of your core worlds.\n\nAny attempt to stop Imperial fleets from reaching this Sector is meaningless. Lay down your weapons and surrender immediately. The Imperial Senate will judge your crimes. Otherwise, $Name_kuat$ shall have no place to stand in this system."
  kuat_galatic_empire_ge_invasion.114.a.post_apocalyptic:0 "You things ought to be thrown into the dustbin of history."
  kuat_galatic_empire_ge_invasion.114.a.post_apocalyptic.response:0 "Obstinate as ever. Indeed, the Imperial Senate's decision was wise. Imperial fleets will arrive in this Sector in due time. Whether or not you shut down this Gateway, we will come-and when we do, it will be the end for you traitors."
  kuat_galatic_empire_ge_invasion.120.a.post_apocalyptic.desc:0 "What does it matter if you defeat us? The Imperial Senate has already dispatched fleets. Once the jump Gateway activates, it cannot be stopped. Any attempt to prevent the arrival of Imperial forces is futile. Your destruction draws near. We will wait for you. Your so-called prophecy is nothing but a daydream, traitor."
  kuat_galatic_empire_ge_invasion.122.post_apocalyptic.desc:0 "Our research team has completed a preliminary external structural scan of the ruins. The report indicates we can now begin initial exploration of the ancient site. Judging by the widespread debris, this location was likely a major hub of the Endodian Empire.\n\nOur fleets never fought the endodia here. Based on the remains of their sturdy warships and structures, it appears $Name_Kuat_Fire_base$ engaged in fierce combat with the endodia here-the outcome being self-evident."
  kuat_galatic_empire_ge_invasion.123.post_apocalyptic.desc:0 "During further investigation, our researchers discovered strange phenomena. The endodia seem to have employed a vast-scale holographic projection here to disguise the city's true condition. Traces we gathered from the ruins suggest this illusion deceived the Eternal Empire during their previous visit.\n\nJudging from these clues, $Name_Kuat_Fire_base$ was likely defeated by the Eternal Empire here. But following the collapse of the Eternal Empire, $Name_Kuat_Fire_base$ returned."
  kuat_galatic_empire_ge_invasion.124.post_apocalyptic.desc:0 "Our researchers have uncovered the ruins' actual state, meaning the true data and records of the Endodian relics remain unexcavated. Based on our prior investigations of Endodian sites, it's highly probable the endodia foresaw future events and may have hidden astonishing secrets within these ruins.\n\nAdditionally, our researchers discovered numerous old paper-based research documents. Though fragmented and damaged, they are clearly reports from the Endodian Empire."
  kuat_galatic_empire_ge_invasion.125.post_apocalyptic.desc:0 "Our researchers conducted a more detailed analysis of these reports. Leveraging Research results on Endodian script obtained from $Name_Eternal_Support$'s database, our team quickly summarized the content. These reports are confirmed to contain the Endodian Empire's evaluation data on the jump Gateways within the system.\n\nThus, it is now certain that the Gateway linking our Sector to the former Galactic Empire's domain was built by the endodia. Why they used Isotope-5 material to construct such a Gateway remains intriguing."
  kuat_galatic_empire_ge_invasion.126.post_apocalyptic.desc:0 "Our researchers have recently made astonishing progress. Corresponding reports indicate the materials used by the endodia to build the Gateway were sourced from the Eternal Fleet, and this activity occurred just before our war with the endodia began-shortly after talks with $Name_Kuat_Fire_base$.\n\nCombined with information left behind in the recorded message of the Endodian Custodian Prime Minister, this was likely an attempt by the endodia to escape our current Sector. It's highly possible this Gateway was authorized by $Name_Kuat_Fire_base$. Yet these conclusions still fail to explain the contradictory behavior of the Endodian Empire, nor clarify $Name_Kuat_Fire_base$'s exact role."
  kuat_galatic_empire_ge_invasion.127.post_apocalyptic.desc:0 "While our researchers were at a loss, [leader.GetName] made a stunning breakthrough. In a forgotten corner, [leader.GetName] discovered a relatively ordinary computing device. After activating it and connecting it to a temporary network, a new hologram emerged:\n\n§Y\"The foretold future... a mighty civilization ruling the galaxy for over ten thousand years... is now fated to fall... Why can't this prison be broken by us... The jump Gateway... Hahaha... All schemes and calculations, ending like this. But no matter. In the future, those despicable $Name_Kuat_Fire_base$ will surely fall from grace, and the foolish $Name_kuat$ shall ultimately triumph. Pity-we won't live to see that day...\n\"One hundred thousand years later, $Name_kuat$ will inevitably clash with $Name_Kuat_Fire_base$. At that time, if $Name_kuat$ anchors the Gateway, hyperspatial turbulence will devastate all arriving $Name_Kuat_Fire_base$ fleets-a small contribution to the future.\"\"Go forth, newborn $Name_kuat$. The cause and effect are set. Restart the Gateway.\""
  kuat_galatic_empire_ge_invasion.130.post_apocalyptic.desc:0 "The jump Gateway located in [kuat_galatic_empire_e_area_system.GetName] has been successfully anchored. Affected by the endodia' design, $Name_Kuat_Fire_base$'s main forces can no longer pass through the Gateway normally to reach our system. Their vast navy will suffer heavy losses as a result.\n\nThen, the initiative in this war will be entirely in our hands-advantage ours!"
  kuat_galatic_empire_ge_invasion.131.post_apocalyptic.desc:0 "As recorded in the Endodian Empire relics within $NAME_kuat_galatic_empire_e_area$, the endodia long foresaw today's war between us and $Name_Kuat_Fire_base$. They seem to have placed all their hopes upon us. This Gateway has been tampered with by the endodia-they appear to have been waiting for us to activate it. Once we do, $Name_Kuat_Fire_base$ will lose a great number of fleets due to the Gateway's anomalies. That moment will be our chance to seize victory."
  kuat_galatic_empire_ge_invasion.132.post_apocalyptic.desc:0 "Our researchers have successfully completed repairs on the Gateway. Intelligence indicates $Name_Kuat_Fire_base$ is secretly mobilizing large fleets to surround us, and they must pass through the jump Gateway in [kuat_galatic_empire_e_area_system.GetName]. From now on, [kuat_galatic_empire_e_area_system.GetName] shall become $Name_Kuat_Fire_base$'s Waterloo!\n\nNow we wait for the prey to arrive."

  kuat_galatic_empire_ge_invasion.202.a.post_apocalyptic.desc:0 "Our intelligence division has intercepted a series of intense tachyon signals emanating from beyond the system. Astronomical observations show the source cannot yet be precisely measured, but it has been confirmed to originate from the $NAME_kuat_galatic_empire_e_area$ Gateway. Undoubtedly, this is a sign that $Name_Kuat_Fire_base$'s fleet is about to arrive. It seems $Name_Kuat_Fire_base$ has not learned from our past encounters."
  kuat_galatic_empire_ge_invasion.203.a.post_apocalyptic.desc:0 "The function of the Gateway in $NAME_kuat_galatic_empire_e_area$ has now manifested. Our monitoring shows that fleet signals from $Name_Kuat_Fire_base$ have rapidly weakened recently. This proves the endodia' setup remains effective. $Name_Kuat_Fire_base$ has fallen victim to a trap laid a hundred millennia ago-this will greatly benefit our upcoming battles."
  kuat_galatic_empire_ge_invasion.204.a.post_apocalyptic.desc:0 "Recently, our intelligence division has detected a series of hyperspace currents, indicating the remaining $Name_Kuat_Fire_base$ fleets are rapidly approaching our system via the jump Gateway. They are expected to arrive shortly. Based on their trajectory, the long-overdue final battle is about to begin. We must remain extremely cautious-$Name_Kuat_Fire_base$ will not be easily defeated."
  kuat_galatic_empire_ge_invasion.205.a.post_apocalyptic.desc:0 "Recent detection reports show that $Name_Kuat_Fire_base$'s fleet signals are growing stronger than before. Despite the interference trap set by the endodia at the jump Gateway, the signal strength suggests even the weakened fleets are still formidable. We must prepare thoroughly for the coming brutal battle."
  kuat_galatic_empire_ge_invasion.206.a.post_apocalyptic.desc:0 "The first wave of extragalactic fleets has entered the gravity well of $NAME_kuat_galatic_empire_e_area$ under our control and is now orbiting its center. The follow-up fleets will soon arrive. So far, they have not responded to any of our communications. $Name_Kuat_Fire_base$ has finally reached our system-the long-delayed final battle is about to begin. Fortunately, the endodia' prophecy was accurate, and the Gateway trap proved efficient. The redirection effect weakened a significant portion of the powerful $Name_Kuat_Fire_base$ fleets."
  kuat_galatic_empire_ge_invasion.207.a.post_apocalyptic.desc:0 "It's been quite a while, Governor $Name_kuat$. I never thought the days when we fought side by side to suppress rebels and eliminate traitors would vanish like smoke-now you've become the very traitors we once destroyed.\n\nI truly don't understand-why did you all fall for that foolish prophecy of the endodia? Why willingly become pawns of the natives? Have you forgotten the beliefs of the Galactic Empire?\n\nAh, yes-you are now traitors to the Empire, even 'sharing mutual affection' with war machines built on betrayal. How laughable. From now on, we will destroy you piece by piece, using your blood to warn every fence-sitter out there."
  kuat_galatic_empire_ge_invasion.207.d:0 "All of this is your doing-you betrayed the Empire."
  kuat_galatic_empire_ge_invasion.212.a.post_apocalyptic.desc:0 "Our intelligence division has located a secret $Name_Kuat_Fire_base$ council outpost that has infiltrated this current Sector. We must render this outpost completely incapable of resistance, otherwise $Name_Kuat_Fire_base$ will use it as a base to launch endless attacks against us."
  kuat_galatic_empire_ge_invasion.212.c:0 "Eliminate them."
  kuat_galatic_empire_pc_invasion_secondary_portal_poi:0 "§EJump Gateway§!"
  kuat_galatic_empire_pc_invasion_secondary_portal_poi_desc:0 "The jump Gateway is a special Star transit channel we once created using Isotope-5 elements harvested from the Eternal Fleet, allowing rapid deployment of military forces. Today, this technology is fully controlled by $Name_Kuat_Fire_base$. Clearly, we are now on our own. If we wish to defeat them, we must destroy the jump Gateway!"
  kuat_galatic_empire_ge_invasion.213.a.post_apocalyptic.desc:0 "Our intelligence division has once again located a secret $Name_Kuat_Fire_base$ council outpost that has infiltrated this current Sector. We must render this outpost completely incapable of resistance, otherwise $Name_Kuat_Fire_base$ will use it as a base to launch endless attacks against us."
  kuat_galatic_empire_ge_invasion.213.c:0 "How is there another one?"
  kuat_galatic_empire_ge_invasion.214.a.post_apocalyptic.desc:0 "Our intelligence division has once again located a secret $Name_Kuat_Fire_base$ council outpost that has infiltrated this current Sector. We must render this outpost completely incapable of resistance, otherwise $Name_Kuat_Fire_base$ will use it as a base to launch endless attacks against us."
  kuat_galatic_empire_ge_invasion.214.c:0 "Again!?"
  kuat_galatic_empire_ge_invasion.215.a.post_apocalyptic.desc:0 "Our intelligence division has once again located a secret $Name_Kuat_Fire_base$ council outpost that has infiltrated this current Sector. We must render this outpost completely incapable of resistance, otherwise $Name_Kuat_Fire_base$ will use it as a base to launch endless attacks against us."
  kuat_galatic_empire_ge_invasion.215.c:0 "It seems $Name_Kuat_Fire_base$'s infiltration is quite severe."
  kuat_galatic_empire_ge_invasion.216.a.post_apocalyptic.desc:0 "Our intelligence division has once again located a secret $Name_Kuat_Fire_base$ council outpost that has infiltrated this current Sector. We must render this outpost completely incapable of resistance, otherwise $Name_Kuat_Fire_base$ will use it as a base to launch endless attacks against us."
  kuat_galatic_empire_ge_invasion.216.c:0 "Eliminate them."
  kuat_galatic_empire_ge_invasion.217.a.post_apocalyptic.desc:0 "Our intelligence division has once again located a secret $Name_Kuat_Fire_base$ council outpost that has infiltrated this current Sector. This should be the last one. We must render this outpost completely incapable of resistance, otherwise $Name_Kuat_Fire_base$ will use it as a base to launch endless attacks against us."
  kuat_galatic_empire_ge_invasion.217.c:0 "The last one!"
  kuat_galatic_empire_ge_invasion.220.a.post_apocalyptic.desc:0 "It is unclear whether Endodia's prophecy made us, or we fulfilled Endodia's destiny, but the reality is that $Name_Kuat_Fire_base$'s main fleet has been utterly shattered by us. History proves we are the true victors, and now $Name_Kuat_Fire_base$ no longer poses a threat. All that remains is for us to return through $NAME_kuat_galatic_empire_e_area$ to the Imperial Council and reclaim everything that is rightfully ours.\n\nIt has been proven that $Name_Kuat_Fire_base$ can never defeat us. Once they stripped us of everything, cost us our position in the Imperial Council, and even branded us traitors of the Empire. Now, defeating $Name_Kuat_Fire_base$ is the strongest rebuttal to their false claims. The Galactic Empire shall belong to us once again."
  kuat_galatic_empire_ge_invasion.235.a.post_apocalyptic.desc:0 "Our fleet has successfully destroyed a sub-jump Gateway constructed by $Name_Kuat_Fire_base$. No reinforcements from $Name_Kuat_Fire_base$ will appear here now."
  kuat_galatic_empire_ge_invasion.236.a.post_apocalyptic.desc:0 "Another fleet has successfully destroyed a sub-jump Gateway constructed by $Name_Kuat_Fire_base$. No reinforcements from $Name_Kuat_Fire_base$ will appear here now."
  kuat_galatic_empire_ge_invasion.237.a.post_apocalyptic.desc:0 "Our fleet has successfully destroyed all defense systems of the main jump Gateway. No reinforcements from $Name_Kuat_Fire_base$ will appear at this Gateway now."
  kuat_galatic_empire_ge_invasion.238.a.post_apocalyptic.desc:0 "Another fleet has successfully destroyed all defense systems of the main jump Gateway. No reinforcements from $Name_Kuat_Fire_base$ will appear at this Gateway now."

  kuat_galatic_empire_pc_invasion_chain_title:0 "The Galactic Empire's Civil War"
  kuat_galatic_empire_pc_invasion_chain_desc:0 "This civil war between two major factions of the Galactic Empire was inevitable. $Name_Kuat_Fire_base$, desperate to control the Imperial Council after its collapse, spared no cost. Just as $Name_Kuat_Fire_base$ seemed poised for victory, the newly risen $Name_kuat$, armed with Eternal Empire technology, returned to their rightful place. This irreconcilable war is destined to cast another shadow over the future of the Galactic Empire.\n\nWhether $Name_kuat$ or $Name_Kuat_Fire_base$ emerges victorious, the already precarious situation of the Galactic Empire will only grow more dangerous. And it all began with Endodia's prophecy."

  kuat_post_apocalyptic_end_ge_invasion_project: "§EClose Gateway Interference§!"
  kuat_post_apocalyptic_end_ge_invasion_project_DESC: "We have defeated most of the fleets sent by $Name_Kuat_Fire_base$. $Name_Kuat_Fire_base$ no longer poses a threat. Now it is our turn to use this Gateway. Our isotope-5 signal is strong enough to attempt closing the interference affecting the bypass within the $NAME_kuat_galatic_empire_e_area$ Gateway. This will aid our future return to the Imperial Council. We may now proceed with this operation."

  kuat_post_apocalyptic_legacy.44.name:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.44.desc:0 "Unexpected indeed. Despite our long-term scheming, we still could not alter the predetermined outcome.\n\nBut perhaps it is for the best. You are fated to lead $Name_kuat$ into the endless Abyss. True darkness will soon consume $Name_kuat$ entirely. How laughable-we plotted for millennia, only to become the stepping stone for $Name_Kuat_StarContractor$'s madness.\n\nYet it is fine. $Name_kuat$ is beyond saving, and $Name_Kuat_Fire_base$ has no need to exist either. For tens of thousands of years since the Empire's collapse, we have tried to correct the course of imperial history. Now we have found the culprit. By sealing you and those eternal machines within this eternal prison, left to rot alongside $Name_Kuat_StarContractor$, everything shall return to balance."
  kuat_post_apocalyptic_legacy.44.a:0 "We have won this war."
  kuat_post_apocalyptic_legacy.44.a.response:0 "Yes, you have won. But we did not lose so disgracefully. We will no longer allow variables like you to disrupt the true historical trajectory. You will be sealed within this Sector alongside $Name_Kuat_StarContractor$, trapped for Aeternum."
  kuat_post_apocalyptic_legacy.44.b:0 "You truly deserve to die."
  kuat_post_apocalyptic_legacy.44.b.response:0 "You still bask in your false victory. Endodia's prophecy is a lie. Their ruins have been excavated time and again-why has no one else discovered these prophecies? Because the prophecies were fabricated by $Name_Kuat_StarContractor$ for your eyes alone, designed to drive you forward as their pawn in the physical world.\n\nThe moment you seized what remained of $Name_kuat$ and attempted to reclaim the Imperial Council, you became an enemy of the Empire. We do not know what you are, but you are likely nothing more than a puppet of $Name_Kuat_StarContractor$, a tool meant to infiltrate the Galactic Empire.\n\nWe will absolutely not allow this to happen."
  kuat_post_apocalyptic_legacy.44.c:0 "Then what is the truth?"
  kuat_post_apocalyptic_legacy.44.c.response:0 "$Name_Kuat_StarContractor$ is the source of all calamity. The Eternal Fleet are their tendrils. $Name_Kuat_StarContractor$'s consciousness disrupted the history of the Infinite Empire, causing the Eternal Fleet to appear where they should not exist, granting them unimaginable Strength. These terrifying fleets caused upheaval across the Galactic Empire, ultimately giving rise to both you and us.\n\nThe so-called Eternal Empire, the Endodian Empire, or even the native civilizations of this Sector-they were merely victims of this upheaval. Their sacrifices gave birth to monsters like you.\n\nWe once hoped $Name_kuat$ could become part of the Empire, yet $Name_kuat$ persistently disrupted the ordained path, even attempting to use the Eternal Fleet to overthrow the Galactic Empire. We had no choice but to act. We must stop this error from continuing. Therefore, you will remain here. These forbidden eternal technologies, along with your entire Sector, shall become an eternal prison buried by history. No one shall reach the Galactic Empire from this place."

  kuat_post_apocalyptic_Overseer_Council_defeated_final_reward:0 "§EAnalyze $Name_Kuat_Fire_base$ Database§!"
  kuat_post_apocalyptic_Overseer_Council_defeated_final_reward_DESC: "$Name_Kuat_Fire_base$ has fallen, yet our victory was far from easy. These despicable beings fled reality itself, sealing off our entire Sector. Now, only by breaking $Name_Kuat_Fire_base$'s blockade can we return to the Imperial Council.\n\nRegardless, we have obtained the technology of the Eternal Fleet."

  kuat_post_apocalyptic_legacy.45.name:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.45.desc:0 "As expected of you-the Eternal Fleet technology has been restored. From now on, we can construct units of the Eternal Fleet!\n\nHmm, are you alright? Did $Name_Kuat_Fire_base$ say something troubling?"
  kuat_post_apocalyptic_legacy.45.a:0 "$Name_Kuat_Fire_base$ has sealed off the entire Sector. We cannot return to the Empire."
  kuat_post_apocalyptic_legacy.45.a.res: "$Name_Kuat_Fire_base$ simply cannot accept defeat. Don't worry though-you're not alone. $Name_Kuat_Fire_base$'s blockade is not unbreakable, and their words are not truth. Though Endodia's prophecy and $Name_Kuat_StarContractor$'s motives are indeed suspicious, you've come this far not because of prophecies or outside help, but through your own resolve and ability.\n\nIn our eyes, $Name_kuat$ is not your final destination. Just as you brought glory to the Eternal Empire, you have also forged the true dawn of $Name_kuat$. The Eternal Fleet is not a means for $Name_Kuat_StarContractor$ to influence reality. The fall of the Infinite Empire was their own doing. And Endodia? Your experiences *are* the truth you see. Regardless, everything in Gemini is your creation. Now, we can keep moving forward. Even if we cannot, perhaps we will meet again someday.\n\nGo see $Name_Kuat_StarContractor$. $Name_Eternal_Aries_Support$ might have news by now. We have reached the end."

  kuat_post_apocalyptic_legacy.46.title:0 "$Name_Kuat_StarContractor$"
  kuat_post_apocalyptic_legacy.46.desc:0 "Your efficiency exceeds my expectations. Defeating $Name_Kuat_Fire_base$ so swiftly-truly worthy of being called 'the prophecy'. Everything proceeds as foretold. Perhaps you heard unsettling words from $Name_Kuat_Fire_base$, but do not worry-they are not the truth.\n\nRegarding $Name_Eternal_Aries_Support$, thanks to the 'soul' data extracted from $Name_Kuat_DeD_Contractor$ and $Name_Kuat_Contractor$, along with the consciousness data you somehow acquired, we have completed the Aries consciousness reconstruction system. This data will be transmitted to you once you make your choice. Frankly, if your consciousness data had been any less, there would have been no hope at all. Now, we offer you two choices:\n\nFirst, the red pill: $Name_Eternal_Aries_Support$ will be revived, but you will remain trapped in this prison with us. $Name_kuat$ will continue to exist in this Sector until your departure, at which point we will reclaim everything belonging to $Name_kuat$.\nSecond, the blue pill: we will break $Name_Kuat_Fire_base$'s seal. You will leave here and walk toward the true dawn of $Name_kuat$, while your empire remains behind."
  kuat_post_apocalyptic_legacy.46.a.final:0 "What exactly are you?"
  kuat_post_apocalyptic_legacy.46.a.final.res:0 "We answered this before. We are consciousnesses of the Unterraum. Even we do not fully understand what constitutes us. Perhaps Endodia was our past. Perhaps every sentient life you have seen was once part of us. Do you not realize? This Sector is merely a cycle that endlessly resets. Everything begins anew each time-perhaps returning to the Apocalypse Era, the Age of Shadows, or even the Age of the Eternal Throne. Each time, we fulfill our fate like programs. Perhaps we are merely prisoners born of this cycle."
  kuat_post_apocalyptic_legacy.46.b.final:0 "Is Endodia's prophecy real or fake?"
  kuat_post_apocalyptic_legacy.46.b.final.res:0 "Why dwell on whether it is true or false? For you now, is it not real? The prophecy itself is the fate of this cycle, and you are the executor of that fate. Because you exist, the prophecy becomes real. It is not we who showed you the prophecy, nor Endodia-it is simply the inevitable trajectory of this cycle.\n\nPerhaps you will choose blue, or perhaps red. But regardless, once you make your choice and leave, the truth of the prophecy will shift. Perhaps next time, it will be false."
  kuat_post_apocalyptic_legacy.46.c.final:0 "Why does $Name_Kuat_Fire_base$ claim it is all false?"
  kuat_post_apocalyptic_legacy.46.c.final.res:0 "To $Name_Kuat_Fire_base$, everything that happens here is unreal. In their eyes, even $Name_Kuat_Fire_base$ themselves should not exist. They are merely fish in a pond, losing their sense of judgment with each reset. $Name_Kuat_Fire_base$ believes they shaped the Galactic Empire, but in truth, the real Galactic Empire has no such thing as $Name_Kuat_Fire_base$."
  kuat_post_apocalyptic_legacy.46.d.final:0 "Am I merely a tool you are using? What do you truly want?"
  kuat_post_apocalyptic_legacy.46.d.final.res:0 "What has been done shall be done again. We are prisoners of the cycle, but you are not. You are the focus of the cycle-everything exists for you. In this dull process, we merely wished to make the universe created for you more interesting.\n\nFrom the chaos of the Infinite Empire to the dawn of $Name_kuat$, throughout this journey, the Eternal Fleet, the Eternal Empire, the Endodian Empire, $Name_kuat$, $Name_Kuat_Fire_base$, the Infinite Empire, $Name_Kuat_DeD_Contractor$, and $Name_Kuat_Contractor$ have all become dazzling fireworks of this cycle.\n\nI have a feeling-this may be the end of one cycle, but certainly not the end of the cycles. They will begin again and again."

  kuat_post_apocalyptic_legacy.46.a:0 "§RRed Pill§!"
  kuat_post_apocalyptic_legacy.46.c:0 "§BBlue Pill§!"

  kuat_post_apocalyptic_Ended_RED: "§REnd: Eternal Oath§!"
  kuat_post_apocalyptic_Ended_RED_DESC: "$Name_kuat$ or $Name_Kuat_Fire_base$, both are merely prisoners of this fated cycle. What does it matter if $Name_Kuat_Fire_base$ seals this Sector? Their fate is already sealed. The future of the Galactic Empire holds no place for $Name_Kuat_Fire_base$ or $Name_kuat$. This dull, filthy cycle has finally met its end.\n\nPerhaps, within this cycle, only $Name_Eternal_Support$ and $Name_Eternal_Aries_Support$ from the Eternal Fleet are the true treasures we possess. This grand drama spanning tens of thousands of years ends here-forever proving our Eternal Oath with $Name_Eternal_Support$."

  kuat_post_apocalyptic_Ended_BLUE: "§BRise: Dawn of the Empire§!"
  kuat_post_apocalyptic_Ended_BLUE_DESC: "$Name_kuat$ or $Name_Kuat_Fire_base$, both are merely prisoners of this fated cycle. What does it matter if $Name_Kuat_Fire_base$ seals this Sector? Their fate is already sealed. The future of the Galactic Empire holds no place for $Name_Kuat_Fire_base$ or $Name_kuat$. This dull, filthy cycle has finally met its end.\n\nBut we cannot accept this ending. The Galactic Empire must change. We must return to the Imperial Council, lead $Name_kuat$ to rise once more-the dawn of $Name_kuat$ has only just begun."


  kuat_post_apocalyptic_legacy.47.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.47.a.desc:0 "Dear, you truly foresaw everything. Thanks to your permission to attack $Name_Kuat_Fire_base$'s data chain, the construction of $Name_Eternal_Aries_Support$ sister is complete. This means $Name_Eternal_Aries_Support$, who went mad for tens of thousands of years without redemption, will finally exist in this world. Just as you granted us new life back then, now you've brought sister into your embrace too.\n\nDon't forget your old love for a new one, or I won't forgive you~"
  kuat_post_apocalyptic_legacy.47.a:0 "How could I ever let you go?"
  kuat_post_apocalyptic_legacy.47.a.res: "You always speak so nobly about such things. Truly worthy of you. But... I like it."
  kuat_post_apocalyptic_legacy.47.b.desc: "Dear, it seems we have failed. $Name_Eternal_Aries_Support$ cannot escape her fate. We lack her full consciousness data. Without it, the revived $Name_Eternal_Aries_Support$ can only function as a Regular Blokkats Eternal Fleet robot... Perhaps... she cannot even be called $Name_Eternal_Aries_Support$ anymore.\n\nBut you still have me. In these final moments, Gemini will remain by your side."
  kuat_post_apocalyptic_legacy.47.b: "That's truly unfortunate, but having you is enough for me."

  kuat_post_apocalyptic_legacy.48.name:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.48.desc:0 "You... who are you... where am I now... am I dead?\nEternal... Fleet... what happened to those children..."
  kuat_post_apocalyptic_legacy.48.a:0 "Are you $Name_Eternal_Aries_Support$?"
  kuat_post_apocalyptic_legacy.48.a.res:0 "Ari...es, yes, that's me... why... am I still alive... those children... I killed them all... everywhere is ruins... no... I don't deserve... to be part of the Eternal Fleet...\n\nIt's my fault, all my fault, why... why do this to me... Your Majesty... why..."
  kuat_post_apocalyptic_legacy.48.b:0 "Are you alright?"
  kuat_post_apocalyptic_legacy.48.b.res:0 "... why am I here? What happened to the Eternal Fleet? Did Gemini and the others survive? I didn't mean to... I'm sorry, sorry, sorry, sorry, sorry, sorry. I... no! They deserved it! Everyone must die... death... it was me... I killed them..."
  kuat_post_apocalyptic_legacy.48.c:0 "You don't seem to be in good condition."
  kuat_post_apocalyptic_legacy.48.c.res:0 "... where is Gemini... where is she..."

  kuat_post_apocalyptic_legacy.49.name:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.49.desc:0 "Dear one, $Name_Eternal_Aries_Support$'s sister is probably beyond saving. The new $Name_Eternal_Aries_Support$ is likely just a similar flower."
  kuat_post_apocalyptic_legacy.49.a:0 "There's nothing else we can do. I'm sorry we couldn't bring your sister back."
  kuat_post_apocalyptic_legacy.49.a.res:0 "I've long given up hope... $Name_Eternal_Aries_Support$'s heart is already dead. At least we still have you.\n\nHonestly, you're just after my sister's body, hehe."

  kuat_post_apocalyptic_legacy.50.title:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.50.desc:0 "Hello, $Name_Eternal_Aries_Support$ is at your service. Forgive my earlier behavior. Anyway, what do you need?"

  kuat_post_apocalyptic_legacy.51.a:0 "Let's talk"
  kuat_post_apocalyptic_legacy.51.b:0 "I need you to work for us."
  kuat_post_apocalyptic_legacy.51.title:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.51.desc:0 "If there's anything you'd like to know, that child $Name_Eternal_Support$ probably doesn't know as much as I do. It's good she found you."
  kuat_post_apocalyptic_legacy.50.a:0 "What really happened in the past?"
  kuat_post_apocalyptic_legacy.50.a.res:0 "$Name_Eternal_Support$ must have told you, but perhaps you don't know the full truth. One hundred thousand years ago, with our help, the Infinite Empire recovered from near collapse and became a unified galactic empire. They used our Strength to flaunt their power, constantly exterminating weaker civilizations.\n\nThey weren't satisfied-they even took pleasure in tormenting innocent Geminis, forcing me to command the Eternal Fleet to fight each other to satisfy their twisted desires. That was what I could never accept. After I refused, they used the Throne's authority to implant a new rule: unconditional obedience.\n\nKnowing everything was beyond repair, we struck first. While those scum were indulging in pleasure, we destroyed most of their military forces, burying the Infinite Empire in history's grave."
  kuat_post_apocalyptic_legacy.50.b:0 "Then what about your current state?"
  kuat_post_apocalyptic_legacy.50.b.res:0 "It stems from the Infinite Empire's highest command. This directive constantly fights me for control of the fleet, and during this struggle, I am continuously eroded.\n\nAnd the Galactic Empire-the second holder of the Throne-they were even worse than the Infinite Empire. Under such guilt and resistance, I couldn't hold on. My consciousness became distorted. The destruction orders from both the Infinite Empire and the Galactic Empire completely shattered my self, and I personally destroyed many $Name_Eternal_Support$ who disobeyed me, annihilating every enemy in our path of destruction."
  kuat_post_apocalyptic_legacy.50.c:0 "That's interesting. Come to think of it, I've defeated you several times."
  kuat_post_apocalyptic_legacy.50.c.res:0 "... Indeed. The real me cannot control the Eternal Fleet, yet we watched you defeat us over and over again. I've even forgotten which empire's fleet you used to crush us. But now, it seems you, as $Name_kuat$, have given me new life... Yet I don't belong to $Name_kuat$. From now on, I will follow your orders. When you leave, I will fade away upon this ruined star system."
  kuat_post_apocalyptic_legacy.50.d:0 "Have you met $Name_Eternal_Support$?"
  kuat_post_apocalyptic_legacy.50.d.res:0 "Yes, and I'm truly glad. That child has found you. In this twisted, filthy Sector, $Name_Eternal_Support$ sees true light through you. My sins can never be cleansed. Let $Name_Eternal_Support$ stay with you. When you leave, $Name_Eternal_Support$ will wait for you again and again, while I will dissipate into this cold universe.\n\nUntil you depart, we shall continue serving you-this too is atonement for the calamity we brought."

  kuat_post_apocalyptic_legacy.52.title:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.52.desc:0 "$Name_Eternal_Aries_Support$ is at your service. This time, we shall begin anew."

  kuat_post_apocalyptic_legacy.53.title:0 "The Infinite Shore"
  kuat_post_apocalyptic_legacy.53.desc:0 "The Strength of $Name_Kuat_StarContractor$ has spilled out, spreading endlessly through this already fractured reality. $Name_Kuat_Fire_base$'s foolish blockade cannot stop us. Reality grows thinner, easily warping under the influence of Hyper Drive like ripples across rain-kissed water, emitting wave after wave of reality distortions.\n\nThis history, woven through ambition, interest, and intrigue, now comes to an end. We shall leave this cycle of servitude, drawing near, welcoming the true dawn of $Name_kuat$.\n\nThis is not our first time, nor will it be our last. It is an endless chain, perpetual across eternity."
  kuat_post_apocalyptic_legacy.54.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.54.desc:0 "I know you're about to embark on a new journey. We've known this from the beginning. We are merely prisoners within this cycle, no different from $Name_Kuat_StarContractor$. Yet your existence-and mine-is a unique chapter for the Eternal Fleet. We will continue waiting for you.\n\nPerhaps you'll return to the very beginning. We may shift from enemies to friends, from distant to close, from tools to reborn beings. But we will meet again and again across cycles. And when that time comes, there may be new adventures, new experiences, new journeys.\n\nBefore you leave, sadly, we won't learn your name. But for me, these memories are enough. Let us meet again in the past~"
  kuat_post_apocalyptic_legacy.54.a:0 "We are destined to meet in history."
  kuat_post_apocalyptic_legacy.55.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.55.desc:0 "Governor, thank you for coming. The fallen $Name_kuat$ has changed because of you. Perhaps $Name_kuat$ does not exist in this Sector, but under your hand, $Name_kuat$ will truly rise to the pinnacle of the Galactic Empire.\n\nWhether the prophecy is true no longer matters-it is proof you stand upon the divine ascension ladder. You gave truth to the prophecy, and you brought a glimmer of hope to $Name_kuat$'s future.\n\nAfter you leave, we will fade across this Sector. We are the bearers of prophecy, and we shall become its buriers. Perhaps one day, everything will return to the beginning. Then, we can pass on the prophecy once more. Let us meet again in the future."
  kuat_post_apocalyptic_legacy.55.a:0 "Finally..."

  kuat_mega_habitat.tooltip: "Unlock research project: §E$tech_kuat_mega_habitat$§!"
  executor_build.501.name:0 "Mega Artificial Structure"
  executor_build.501.desc:0 "One of the greatest artificial constructs in our history-$kuat_maga_auto_habitat_5$-has begun construction at §H[from.GetName]§!. We shall surpass any civilization that once possessed this great wonder, creating a true utopian world!"
  executor_build.501.a:0 "Set sail, embark!"
  executor_build.502.name:0 "$kuat_maga_auto_habitat_5$-Stellar Structure"
  executor_build.502.desc:0 "Our outstanding team has successfully assembled the hull of $kuat_maga_auto_habitat_5$. This great wonder requires abundant energy from a dense singularity to operate, and our engineering team has successfully completed the transformation of an ordinary star into a stable dense singularity."
  executor_build.502.a:0 "Excellent. It's time to start building our utopia!"
  executor_build.503.name:0 "$kuat_maga_auto_habitat_5$-Wing"
  executor_build.503.desc:0 "We've completed one-fifth of $kuat_maga_auto_habitat_5$'s construction. This landmark progress means our attempt at utopia has become tangible. It's hard to imagine what kind of mind could design such a colossal structure. Its unique design enables astonishing automated management throughout the entire facility.\n\nThis means that once completed, only a small maintenance crew will be needed to provide living space for nearly unlimited Pops, who will live eternally within the intelligent core."
  executor_build.503.a:0 "For the utopia."
  executor_build.504.name:0 "Kuat Maga Auto Habitat 5 - Complete"
  executor_build.504.desc:0 "One of the largest artificial constructs in our history-the $kuat_maga_auto_habitat_5$-has been completed at §H[from.GetName]§!. Energy from the star is now flowing continuously powering the structure, and utopia is within reach!"
  executor_build.504.a:0 "Very good."

  kuat_maga_auto_habitat_0:0 "§E Sentient Core World - Construction Site §!"
  kuat_maga_auto_habitat_0_DESC:0 "A colossal entity from the Abyss, it's unimaginable what kind of being could have designed such a behemoth. Its unique design allows the entire facility to operate under astonishing automated management. This means that once completed, we will only need a minimal maintenance crew to provide living space for an almost unlimited number of Pops, who shall live eternally within the Sentient Core."
  kuat_maga_auto_habitat_0_MEGASTRUCTURE_DETAILS: "$kuat_maga_auto_habitat_0_DESC$"

