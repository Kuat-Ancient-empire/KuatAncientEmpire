 kuat_tech_plague_immune_desc:0 "Engineered viruses retain a synthetic template of the plague and pass this information to the host's immune system."
 kuat_tech_plague_spread:0 "Spread Plague"
 kuat_tech_plague_spread_desc:0 "We may not understand how the §Pplague§! works, but we can purge the 'infection' from our planets and carry it to wherever we need."

 kuat_plague_zombie_army:0 "Corrupted Primordial Tribe"
 kuat_plague_zombie_army_plural:0 "Corrupted Primordial"
 kuat_plague_zombie_army_cap: "$kuat_plague_zombie_army$"
 kuat_plague_zombie_army_desc:0 "By conventional standards, it is hard to call these things an 'army,' as the swarm of Corrupted Primordials shows no semblance of tactics or strategy-only madness, slaughter, and devouring. However, their habit of hiding in inaccessible parts of large cities makes eradication difficult and dangerous."

 kuat_auto_planet_defender:0 "Automated Defense Drone"
 kuat_auto_planet_defender_plural:0 "Automated Defense Drone"
 kuat_auto_planet_defender_cap: "$kuat_auto_planet_defender$"
 kuat_auto_planet_defender_desc:0 "By conventional standards, it is hard to call these things an 'army,' as these machines are merely labor robots designed to maintain the server clusters of fully automated worlds. Yet when enemies invade, these robots tirelessly join the fight, seemingly directed by data consciousness within the servers. For every two robots destroyed, the world loses one citizen."

