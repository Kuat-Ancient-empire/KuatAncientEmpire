  ag_legacy_stroy_chain_title:"§ELost Civilization Ruins§!"
  ag_legacy_stroy_chain_desc:"Our radar has detected unusual signals. Due to their extremely rare signal propagation patterns, our researchers speculate they are transmission waves from an alien civilization. The research department recommends we investigate the source of these signals as soon as possible."
  ag_legacy_stroy.1:"§EStrange Signal§!"
  ag_legacy_stroy.1.desc:"Our researchers have concluded their investigation on [root.from.planet.GetName]. During this investigation, they successfully established contact with the crystals and obtained some clues buried beneath the ruins-those fleets that bombed the planet, we seem to have seen them somewhere before...\n\nRegardless, these are important clues for uncovering these unknown secrets. Next, we must await further breakthroughs from our researchers."
  ag_legacy_stroy.2:"§ECloud City Shelter§!"
  ag_legacy_stroy.2.desc:"Our researchers have concluded their investigation on [root.from.planet.GetName]. In this investigation, they successfully obtained more information. Recordings within the Cloud City Shelter are filled with despair and screams. After analyzing the data, we can confirm the builders were once an extremely advanced civilization. They encountered an enemy far stronger than themselves. After losing the war, the builder civilization split into compromise and resistance factions, though their ultimate fates remain under investigation.\n\nNext, we must await further breakthroughs from our researchers."
  ag_legacy_stroy.3:"§EDeep-Sea Base§!"
  ag_legacy_stroy.3.desc:"Our researchers have concluded their investigation on [root.from.planet.GetName]. Although the clues within this ruin are not obvious, our researchers have still gathered some leads. The deep-sea base originated from the resistance faction of the ancient civilization. They established weapon research and personnel training centers underwater, attempting to fight back against the enemy who destroyed them.\n\nStrangely, there are no visible signs of battle. Our researchers speculate it was abandoned, but the reason remains under investigation. Next, we need to conduct project research on the crystal."
  ag_legacy_stroy.4:"§EMysterious Cave§!"
  ag_legacy_stroy.4.desc:"Our researchers have concluded their investigation on [root.from.planet.GetName]. Our team discovered that beneath the ice layer lies a hidden shelter. Some data storage facilities within contain almost no valuable information, having been deliberately erased. Therefore, we have reason to believe the shelter was abandoned, requiring further investigation. Next, we must await further breakthroughs from our researchers."
  ag_legacy_stroy.5:"§EDivergent Path Shelter§!"
  ag_legacy_stroy.5.desc:"Our researchers have concluded their investigation on [root.from.planet.GetName]. This shelter was built to protect civilians from the threat of war. We can confirm the owners later issued orders for evacuation and transferred vast amounts of data storage. Our researchers speculate that after realizing resistance was hopeless, the builders attempted to preserve their history and data within the facility, leaving the truth of their past for future generations.\n\n§YRegardless, the data storage left behind some clues. We should locate and control the special Gateway mentioned within. Our researchers believe it should be the Kuat Gateway.§!"
  ag_legacy_stroy.6:"§EAncient Ruins§!"
  ag_legacy_stroy.6.desc:"Our researchers have concluded their investigation on [root.from.planet.GetName]. This ruin was likely a remote colony of the Infinite Empire. According to records, the Infinite Empire was a vast power that ruled the galaxy tens of thousands of years ago, long before humanity emerged. We cannot imagine how prosperous and powerful it was, yet this mighty empire collapsed rapidly. This remote colony seems to have suffered a similar fate, though we have found no clues revealing the cause of their destruction. However, we can confirm that when disaster struck, this remote colony could no longer receive rescue from the Infinite Empire's government or military.\n\n§YRegardless, we should document this event. Perhaps the downfall of these pioneer empires had other hidden causes.§!"
  ag_legacy_stroy.7:0 "§EAncient Ruins§!"
  ag_legacy_stroy.7.desc:0 "The planet $NAME_KALIWA$ is shrouded in mystery. We can confirm it was once a city of the Rakata. This city declined rapidly after a Crisis that swept across the entire Infinite Empire.\n\nAdditionally, our researchers, through analysis of the ruins' data, determined this site served as a shelter where they hid from enemies. It contained ample security defenses, food, and water sources sufficient to sustain all Rakata on the planet. Yet, in reality, these measures failed to save them. These survivors, along with their Infinite Empire, quickly perished, and the shelter ultimately became an uninhabitable world. Though some AIs still operate, the site has completely lost its former glory.\n\n§YWhat could have caused such a vast empire to collapse? Was it a Crisis or human folly?§!"

  ancient_shadow_place_B:"§RObtain construction rights for $Name_boss_Venator$, $Name_boss_X308_Balletor$, $Name_boss_X308_Titan$, $Name_boss_Venator_II$. Check at shipyards. These Mark ships cannot be designed.§!"
  ancient_shadow_place:"§GAcquire research option: $tech_kuat_starbase$. Select and research in the tech interface.§!"


    ag_legacy_stroy_recording_1_desc:"§GCommander, the construction of Shelter 171 is progressing as planned, but the situation with the front-line fleet appears grim. We haven't received any residual signals from the rear guard fleet for a long time.\n\n§YHmm, as long as the shelter construction proceeds normally, that's fine. The front-line fleet probably won't last much longer. They're coming. Things aren't easy for the higher-ups either-the opposition armed forces have already surrendered to them. Our situation is even more severe.\n\n§GCommander... we probably can't stay hidden much longer. We've lost communications with many shelters. The opposition likely betrayed us.\n\n§YRegardless, we have no way back. We must complete the final sealing of the facility within three solar days. These classified data must not fall into anyone's hands. They must be deleted. No one will know where we lie in wait. We will wait for the light to return, in darkness.§!"
    ag_legacy_stroy_recording_2_desc:"§GCommander, the signal from Facility 171 has disappeared. Their last report indicated they activated emergency protocols. It seems Shelter 171's concealment plan has failed, though the exact reason remains unclear.\n\n§YSomething's wrong. You archive the files first. Our main task is completing Facility 131. Seal the emergency data sent from 171 as well. We'll finish in one solar day.\n\n§GYes, Commander.\n\n§PWarning: Large number of hostile signal fleets detected near planetary orbit. Activating emergency protocol. DP-131 boarding window initiated.\n\n§YThese damn intruders! So the traitors leaked our location after all. Evacuate the civilians quickly. It's time for our last stand.§!"
    ag_legacy_stroy_recording_3_desc:"§GYou know, how much do you think we'll make on this run? After this job, we'll be rich men.\n\n§YYou better behave. This stuff comes from a forbidden ancient battlefield zone. One mistake and we die in space.\n\n§GBro, you're right, but uh... if a few items go missing from the cargo, they wouldn't know, right? We sell them privately later-this could be a fortune, enough to buy a new ship.\n\n§YHmm, maybe worth a try. We're almost there. The client's arriving.\n\n§EWell done, you've served us faithfully. We won't treat you poorly. But something's missing from the cargo-where's the crystal!?\n\n§YGovernor, this is everything. We wouldn't dare deceive you, even if we had ten thousands.\n\n§PSince that's the case, pleasant doing business. Safe travels (once they launch, destroy their ship).§!"
    ag_legacy_stroy_recording_4_desc:"§GDirector, we've lost communication signals from most shelters. $NAME_ag_kae_e_area$ sent us final orders-the Emperor leaves our choice of staying or leaving to us. Currently, the opposition holds the majority seats.\n\n§YPah! These damn surrender-lovers, abandoning their families, betraying their race-these parasites will be despised. We cannot do such a thing. Shelters may be safe, but our resources won't last 200 return cycles. If every plan fails, our descendants will be trapped and die inside.\n\n§GDirector, can we truly win this war?\n\n§YFool! What are you saying? This is the Emperor's order!§!"
    ag_legacy_stroy_recording_5_desc:"§GGeneral, the construction of our army preservation facility is nearly complete. The deep-sea base construction is fully finished. Only defense systems remain unfinished.\n\n§YGood. We'll hold these damn Kuatans here.\n\n§GGeneral, dissenting voices questioning the Emperor's decision have emerged within the base, and they're not few. A general in the field may disobey orders-General, please reconsider.\n\n§YWhat? You want to surrender too? Fine. Brothers have it tough. If it really comes to that, those who want to leave may go. I will hold this position until destruction.\n\n§GGeneral.... In that case, sorry General, but brothers don't want to see you die. Men, take the General aboard.\n\n§YYou!§!"
    ag_legacy_stroy_recording_6_desc:"Our researchers' investigation on [root.from.planet.GetName] has concluded. This ruin was likely once a remote colony of the Infinite Empire.\n\nAccording to our findings, the Infinite Empire was a vast power that ruled the galaxy tens of thousands of years ago, long before humanity emerged. We can scarcely imagine how prosperous and powerful it once was. Yet this mighty empire collapsed rapidly in a short span of time. Something similar appears to have happened here at this remote colony, though we've found no clues as to what caused their destruction.\n\nWhat we can confirm is that, when disaster struck, this distant outpost could no longer receive aid from the Infinite Empire's government or military forces. §YRegardless, we should document this event-perhaps the fall of these precursor empires hides deeper secrets.§!"
    ag_legacy_stroy_recording_7_desc:"The planet named $NAME_KALIWA$ is shrouded in mystery. We have confirmed it was once a Rakatan city. The city fell into rapid decline following a Crisis that swept across the entire Infinite Empire.\n\nFurthermore, our researchers, through analysis of data from the ruins, determined this site served as a refuge for the Rakata fleeing enemies. It contained ample defensive systems, food, and water supplies sufficient to sustain the planet's entire Rakatan population. Yet in reality, none of this saved them. These survivors, along with their Infinite Empire, swiftly perished, leaving the shelter behind as a completely uninhabitable world.\n\nThough some AI systems still operate, all former glory has long faded. §YWhat could have possibly shattered such a vast empire? Was it Crisis or catastrophe wrought by their own hands?§!"
    ag_legacy_stroy_recording_8_desc:"$kuat_legacy_key_world_5_desc$"
    ag_legacy_stroy_recording_9_desc:"$kuat_legacy_key_world_1_desc$"
    ag_legacy_stroy_recording_10_desc:"$kuat_legacy_key_world_2_desc$"
    ag_legacy_stroy_recording_11_desc:"$kuat_legacy_key_world_3_desc$"
    ag_legacy_stroy_recording_12_desc:"$kuat_legacy_key_world_4_desc$"
    ag_legacy_stroy_recording_13_desc:"$kuat_legacy_key_world_6_desc$"
    ag_legacy_stroy_recording_14_desc:"$kuat_legacy_key_world_7_desc$"
    ag_legacy_stroy_recording_15_desc:"§GBrother, tell me, are our myths real? My grandfather told me the Dragon of Zakuul must never be desecrated.\n\n§YThat's just child's nonsense. You actually believe that? Enough talk-the higher-ups gave us a mission. We've discovered a spacecraft unlike anything we've ever seen. There might be something valuable inside.\n\n§GBrother, look, the radiation signature from this ship's material seems unusual. I think we've found something extraordinary.\n\n§YYou're right... this is a frequency we've never seen before. Wait-no, stop advancing! Danger! Damn it, we're trapped. Get word back-tell them not to come in!§!"
    ag_legacy_stroy_recording_16_desc:"§GDoctor, I did it, I did it! The substance we recovered from that ship clearly possesses incredible properties. This... this is like a divine miracle.\n\n§Y.... Stop. Stop moving! Damn it, have you lost your mind?\n\n§GDoctor, I did it, I did it! The gods are guiding us. Our path has been wrong all along. Hahahaha, waaaaaah, hahahahaha! Doctor, let us repent before the gods together!\n\n§YDamn you... hurry... send a distress call to the fleet...§!"
    ag_legacy_stroy_recording_17_desc:"§GDirector, we've recently received multiple reports of researchers suddenly going mad and attacking those around them. They all share one thing in common-they were once members of the Zealots of Zildrog.\n\nShould we take action?\n\n§YYes, you're right. But He has awakened. Since you've sensed it already, join us. Let us welcome together the awakening of the Creator God.\n\n§GCould it be... you... you're also a remnant of the cult? The authorities won't let you escape.\n\n§YHahahaha, the authorities? They are the greatest blasphemers! They seek to control our god. Then let you become my first offering of loyalty to Him.§!"
    ag_legacy_stroy_recording_18_desc:"§GCaptain, these cult remnants appear to be converging on the newly discovered excavation site.\n\n§YGood. Soon, these foolish zealots will deliver results we can use. Order all divisions: once they reactivate the ruins, eliminate these madmen.\n\n§GAye, Captain. All squads, stand ready to execute orders.§!"
    ag_legacy_stroy_recording_19_desc:"§GBro, we're gonna strike it rich this time. Did you notice? This is a fully intact spaceship. If we can take control of her, we'll be the most powerful pirates in these sectors.\n\n§YWait, bro, there's no life signs anywhere on board-but the ship is still running. Could this be a trap?\n\n§GImpossible. Are you coming or not? Or are you scared? If you won't go, I will.\n\n§YI'm not going. You go if you want. I'd like to stay alive.\n\n§GHmph, coward. Once I seize this ship, you'll have no choice but to bow down to me. Strange... why can't I control anything? Wait-why are these robots activating?! No...§!"
    ag_legacy_stroy_recording_20_desc:"§E$Name_Kuat_Fire_base$ grows bolder by the day. They've already extended their reach into the Senate.\n\n§GHmph, what can we do about it? Your so-called research project hasn't yielded any results yet.\n\n§EDon't mock me with your idle words. Isn't your plan simply to wage war against $Name_Kuat_Fire_base$? The Empire cannot afford to fracture further.\n\n§GExtraordinary times call for extraordinary measures. $Name_Kuat_Fire_base$ has already noticed us.\n\n§GA new report from Sector S-1919810415411-114-critical intelligence on the Eternal Fleet has been obtained. These unstable tools will soon become the Empire's military edge. The plan must succeed. Fulfill your duties-for the Empire.\n\n§GCan you truly continue pushing forward? What if $Name_Kuat_Fire_base$ openly declares war? Our fleets can't withstand that right now.\n\n§YEnough. Proceed with the plan. $Name_Kuat_Fire_base$ dares not ignite a full civil war. If they try to devour us, they'll lose at least a few teeth.§!"

