l_english: 
 Name_F_1:"§EVoid Fortress (F)§!"
 Name_Kuat_Contractor:"§EWanderers§!"
 Name_Kuat_DeD_Contractor:"§BSleepers§!"
 Name_Kuat_StarContractor:"§EDescendants§!"
 misc_system_desc_6:"$Name_F_1$"
 misc_system_desc_6_desc:"The Imperial Research Department has intercepted a new signal band, and our scientists have discovered that it originates from a star system never before seen on the star charts. Researchers believe this will be a milestone in our deep space exploration. Our research department urges us to explore this system as soon as possible."
 misc_system_desc_6_desc_finished:"Our investigation into $misc_system_desc_6$ has made significant progress. This time, our researchers collected a vast amount of data from $Name_Kuat_StarContractor$, the complexity and obscurity of which are beyond imagination. After preliminary decryption, we found that these materials cover extensive academic research by $Name_Kuat_StarContractor$, including astrophysics, quantum mechanics, bioengineering, history, theology, and other strange disciplines.\n\nAdditionally, the materials mention numerous factions still unknown to us. We only learned about the history and conflicts between the Endordia Empire and $Name_kuat$, while other powers remain shrouded in mystery, with no concrete information yet available.\n\nThe Endordia Empire has collapsed, yet shadows still loom over the heavens. Perhaps we should pause and reconsider our future-maybe the Endordia Empire was right.\n\nOverall, this discovery opens the door to a broader realm, but the path ahead remains obscured in mist. We will remain vigilant and protect at all costs the hard-won achievements we have gained.\n\nWe sincerely hope that under your wise leadership, our civilization can embark on our own great journey."
 kuat_legacy_key_world_6_desc:"[kuat_legacy_key_world_6]"

 kuat_plague.62.name:0 "Garrison crisis on §H[from.GetName]§!."
 kuat_plague.62.desc:0 "According to the command center's final message, the surviving government erected a Blocker, but §PInfected§! breached the city. Countless unarmed civilians had no time to escape and were transformed into §RCorrupted Progenitors§! right before our soldiers' eyes. Our military control over the World has been severely compromised. The situation is critical-we need reinforcements.\n\nIf we do not send additional troops, we will lose the remaining survivors-and possibly the entire World's control."
 kuat_plague.62.0:0 "We will reclaim control over the World at any cost."
 kuat_plague.62.1:0 "We must save our citizens quickly!"
 kuat_plague.62.2:0 "Burn them!"
 kuat_plague.62.3:0 "That's horrifying!"
 kuat_plague.62.4:0 "We must resolve this!"
 kuat_plague.62.62:0 "This shall henceforth be our day of mourning."
 kuat_plague.62.6:0 "Let us pray for their souls."
 kuat_plague.62.7:0 "We must formulate an effective Approach."
 kuat_plague.9.name:0 "Plague: Report"
 kuat_plague.9.desc.0:0 "Our scientific team has carefully studied all available data and analyzed the relative viable options. They found:\nBiological agents are difficult to neutralize, but the presence of §Pclinics, hospitals, Crime£crime£, Amenities£amenities£§! on the World affects Pops survival rates."
 kuat_plague.9.desc.1:0 "Certain characteristics of §PArtificial Orbital Structures§! may help prevent infection. We might utilize §PArtificial Orbital Structures§!."
 kuat_plague.9.desc.2:0 "Due to the emergency, our experts have developed multiple infection models and conducted validation tests on the people of §H[kuat_plague_gaia.GetName]§!. Their conclusion indicates that such Worlds' Physma improves Pops' Resilience against the virus. Perhaps a better environment could help alleviate this crisis."
 kuat_plague.9.0:0 "Preparations are needed to issue an appeal to the people."
 kuat_plague.9.0.tooltip:0 "Grant usage rights to §H$edict_kuat_plague_quarantine$§!."
 kuat_plague.10.name:0 "Appeal"
 kuat_plague.10.desc.1.0:0 "After confirming lethal §PCorruption§! in frontier regions, the government has decided to halt all Trade, scientific cooperation, and tourism activities. Government research departments have launched a new round of clinical medical studies; this disaster will soon subside"
 kuat_plague.10.desc.2.0:0 "Also restricting §Prefugees§! from entering from quarantine zones."
 kuat_plague.10.desc.3.0:0 "From now on, any contact with aliens is considered treason."
 kuat_plague.10.desc.4.0:0 "The government does not rule out §Pmilitary intervention§! as a last resort against infection."
 kuat_plague.10.desc.4.1:0 "The government does not rule out §Pmilitary intervention§! as an effective anti-infection measure."
 kuat_plague.10.desc.4.2:0 "The government does not rule out §Pmilitary intervention§! as a punitive measure against infection."
 kuat_plague.10.desc.4.3:0 "The government does not rule out §Pmilitary intervention§! as a deterrent against infection."
 kuat_plague.10.desc.1.1:0 "After confirming lethal §PCorruption§! cases in other species' frontier regions, the government has ordered restrictions on all related Trade and tourism contacts."
 kuat_plague.10.desc.3.1:0 "To prevent the spread of Corruption, we are forced to take such measures. Notably, communication channels remain open, allowing our scientists to exchange data with Representatives of other species and work together toward a solution."
 kuat_plague.10.desc.1.2:0 "After confirming lethal §PCorruption§! cases in border regions, the government has ordered the suspension of all Trade, scientific, and tourism contacts with potential adversaries."
 kuat_plague.10.desc.3.2:0 "We are forced to take such measures to prevent the spread of this Corruption and the possibility of threatening our sovereignty. Border forces have entered an alert state."
 kuat_plague.10.desc.1.3:0 "After confirming lethal §PCorruption§! cases in border regions, the government has ordered the suspension of all Trade, scientific, and tourism contacts with neighboring nations."
 kuat_plague.10.desc.3.3:0 "We must take such measures to avoid the spread of Corruption. We will provide humanitarian aid to affected friendly nations."
 kuat_plague.10.desc.1.4:0 "These godless sinners have incurred the Creator's wrath: lethal Corruption cases have been discovered in frontier regions bordering us. The government has ordered the cessation of all Trade, scientific, and tourism contacts with the unclean."
 kuat_plague.10.desc.3.4:0 "We are forced to take these measures to prevent the spread of Corruption. We will pray for their swift recovery."
 kuat_plague.10.desc.1.5:0 "After confirming lethal Corruption! In border regions, the government has decided to cease all Trade, scientific, and tourism contacts with these incompetent fools."
 kuat_plague.10.desc.3.5:0 "We are forced to take these measures to prevent the spread of the Corruption. Our finest scientists are already working on a vaccine."
 kuat_plague.10.0:0 "We must stand together."
 kuat_plague.50.name:0 "Galactic Plague"
 kuat_plague.50.desc:0 "After communicating with the ancient AIs within the ruins of $Name_H_1$ and receiving their warnings and hints, our scientist has discovered strange traces across the galaxy, along with rumors of a §P disease§!. While no fatal cases have occurred yet, this illness has already caused widespread panic among the Pops.\n\nNotably, the disease has spread to many Worlds and attracted the attention of our Center for Disease Control. Our research division believes we should take the ancient AIs' warnings seriously."
 kuat_plague.50.0:0 "We will pay attention."
 kuat_plague.50.1.0:0 "Unfortunate biomass."
 kuat_plague.50.1.1:0 "Poor organic lifeforms."
 kuat_plague.50.1.2:0 "A biological puzzle..."
 kuat_plague.50.2:0 "This is no issue for higher forms of evolution."
 kuat_plague.50.3:0 "The cost of planetary lifestyles."
 kuat_plague.50.4:0 "We need to learn."
 kuat_plague.50.4.tooltip:0 "Truly fascinating"
 kuat_plague.51.name:0 "Galactic Great Plague"
 kuat_plague.51.desc.0.0:0 "The message from the ancient AIs was accurate. Our scientist's research has revealed that a §P disease§! is becoming extremely lethal at an incredible rate-our scientist calls it the Corruption. It has already killed millions across the galaxy, and they have warned our scientist that this is not an ordinary disease, but a deadly infectious crisis originating from a higher plane of existence. Our researchers believe that unsealing the rift left behind by the endodia is what triggered this catastrophe, though the exact transmission method remains unclear. For now, we must find a way to counter the Corruption as quickly as possible."
 kuat_plague.51.desc.1.0:0 "Our Empire has already been infected. Our researchers should join projects studying the plague. The warning from the ancient AIs is accurate and valid. This crisis of unknown origin has already spread throughout our Empire. We must unite as one to overcome this challenge."
 kuat_plague.51.desc.1.1:0 "Our Empire has not yet been infected. But we should heed the message from the ancient AIs-this crisis of unknown origin has already begun lurking in the shadows."
 kuat_plague.51.0:0 "A powerful force is testing our beliefs."
 kuat_plague.51.1:0 "Our calculations are not encouraging."
 kuat_plague.52.name:0 "Corruption Progenitor Plague"
 kuat_plague.52.desc:0 "Today, shortly after survivors were evacuated from an infected World, one of our xeno-biologists submitted his report to the scientific community.\n\nHe personally observed how a deceased individual regained certain neural functions. Unfortunately, all reanimated hosts were highly aggressive. Most infected individuals show no signs of intelligence, but a rare few exhibit clear cognitive behavior. Our researchers currently refer to these entities as Progenitors. This infection appears to originate from an attack targeting the genetic traits of sentient life, manifesting in biological organisms through virus-like infection and assault. We must find a way to resolve this crisis, or our species will face total annihilation.\n\nOur research department believes these infected Pops possess some research value, but under current circumstances, our priority must be addressing the crisis. The accuracy of the ancient AIs' warning has now been proven.\n\nRemnants of a crisis possibly originating from the ancient Infinite Empire are now ravaging our Empire."
 kuat_plague.52.0:0 "This is a severe threat!"
 kuat_plague.53.name:0 "Infectious outbreak on §H[from.GetName]§!"
 kuat_plague.53.desc.0.0:0 "The administrative body on §H[from.GetName]§! has reported local Pops suffering from §P infection§!. Due to the severity of the situation, quarantine measures have been deployed globally, and the spread of Corruption continues to accelerate."
 kuat_plague.53.desc.0.1:0 "The administrative body on §H[from.GetName]§! has reported the first confirmed case of Corruption virus infection. Local authorities are doing everything possible to mitigate negative impacts. The infected individual has been purified."
 kuat_plague.53.desc.0.2:0 "The §P Corruption Plague§! on §H[from.GetName]§! has entered its final stage. Our biologist analysis indicates that, in a sense, the Corruption Progenitors have formed a unique biological community. There is now a high probability that this World will release a §R Corruption Progenitor Swarm§!. Once released, it would destroy the entire civilization on this World.\n§RAs long as any non-immune Pops remain on this World, the Corruption Legion can spawn at any time!§!"
 kuat_plague.53.desc.1.0:0 "§H[from.GetName]§! is the first World to report numerous §P contamination§! cases. However, the local population data indicates our medication is effective, with very few fatalities so far.\nDue to epidemic management, local authorities have temporarily suspended public transportation and airspace access, canceled all gatherings and demonstrations, and strengthened preventive quarantine measures.\nPops on the World have been divided into green and yellow zones based on the presence of infected individuals. With assistance from law enforcement, checkpoints staffed with bio-control personnel are monitoring the status of local Pops in each zone.\nThe administration strongly advises anyone exhibiting known symptoms of §P Corruption§! to immediately seek medical attention at the nearest hospital or clinic.\n\nWe must maintain isolation and do everything possible to preserve order."
 kuat_plague.53.desc.1.1:0 "The administration of §H[from.GetName]§! reports a large number of §P infection cases with fatal consequences.§!\nAs a result, martial law has been enacted. Movement between settlements is prohibited unless individuals carry special permits and pass through designated outposts; such violations will be treated as acts of bioterrorism.\nThe government has issued a special Edict, reclassifying all yellow zones where infected Pops exceed 70% as red zones. From today onward, all red zones will be completely isolated from the outside world-including military and medical personnel remaining within. No transfer of personnel from red zones will be permitted until the epidemic ends.\nIntelligence indicates small private vessels are smuggling residents out of the area illegally.\n\nWe must use every means available to maintain quarantine and order."
 kuat_plague.53.desc.1.2:0 "A massive outbreak of Corruption involving §P infected individuals§! has occurred on §H[from.GetName]§!.\nThis has caused widespread panic among the local population. Reports indicate desertion among military personnel and large-scale looting in yellow zones, suggesting the region has descended into anarchy. The last remaining civilized safe havens are fortified green zones near administrative centers, where the remaining forces are concentrated.\nShocking lunar images from red zones show vast armies of Corruption Progenitors advancing toward the remaining settlements.\n\nWe must employ every possible method to maintain quarantine and order."
 kuat_plague.53.desc.2.0:0 "Analysts believe §H[fromfrom.GetName]§! in the §H[fromfrom.solar_system.GetName]§! system is the source of the infection."
 kuat_plague.56.name:0 "Increased deaths on §H[from.GetName]§!"
 kuat_plague.56.desc.0:0 "Another wave of infection has swept through §H[from.GetName]§!, leaving only empty cities behind! Survivors have taken refuge in facilities guarded by our military. Economic and industrial activity on the World has completely halted. The situation is critical!"
 kuat_plague.57.name:0 "§Y[From.GetName]§!: Growing numbers of Corruption Progenitors"
 kuat_plague.56.desc.1:0 "More and more of our citizens are succumbing to Corruption, subsequently reinforcing the ranks of the Corruption Progenitors. Local governments are requesting immediate aid. We must find a way to save our people!"
 kuat_plague.56.0:0 "This is truly horrifying."
 kuat_plague.56.1:0 "Arm yourselves!"
 kuat_plague_block.tooltip:0 "Click to disable news about infected Worlds."
 kuat_plague.58.name:0 "Survivors"
 kuat_plague.58.desc:0 "We have received an unexpected signal from §H[from.GetName]§!. Signal analysis experts confirm that these transmissions are neither pre-recorded nor automated emergency broadcasts, but originate from living, healthy citizens who claim to have overcome the infection.\n\nOn a voluntary basis, a team of scientists has been dispatched to the infected World. Upon examining the survivors, they were found to have multiple bite and scratch wounds, yet displayed no symptoms of §P Corruption§!. This is a promising development-hope may finally be on the horizon."
 kuat_plague.58.0:0 "We can make use of them."
 kuat_plague.61.name:0 "§H[from.GetName]§! has ceased responding"
 kuat_plague.61.desc:0 "Attempts to contact §H[from.GetName]§! have been lost. Clearly, no one survived the planet's infection, and now we must abandon this world completely. This is a dark hour for the Empire."
 kuat_plague.61.0:0 "A sorrowful day."
 kuat_plague.152.name:0 "Bombing concluded."
 kuat_plague.152.desc:0 "§H[from.leader.GetName]§! reports mission completion. The planet's biosphere will not recover for a long time; everything on the surface has been eradicated. The contagion pathway from this world has been fully eliminated."
 kuat_plague.152.0:0 "May the plague end swiftly."

 kuat_chain_plague_count_title:0 "§EInfection Report§!"
 kuat_chain_plague_count_desc:0 "The entire galaxy faces the threat of total annihilation of all sentient life! This corruptive plague, suspected to originate from the ancient Infinite Empire, has dealt severe blows to all known galactic civilizations. Below are the statistics compiled by our experts based on the final damage caused by the pandemic."
 kuat_chain_plague_infested_planet:0 "Number of infected planets"
 kuat_chain_plague_kill_pop_count:0 "Number of Pops consumed"
 kuat_chain_plague_kill_planet_count:0 "Number of planets destroyed"
 kuat_chain_plague_infested_planet_total:0 "Total number of infected planets in the galaxy"
 kuat_chain_plague_kill_pop_count_total:0 "Total number of Pops consumed across the galaxy"
 kuat_chain_plague_kill_planet_count_total:0 "Total number of planets destroyed across the galaxy"
 kuat_chain_plague_zombie_count_total:0 "Total number of corrupted abominations discovered"

 edict_kuat_plague_quarantine:0 "§EQuarantine§!"
 edict_kuat_plague_quarantine_desc:0 "Thorough inspection of all cargo and strict adherence to quarantine protocols will help contain the spread of corruption.\nMigration to infected planets is prohibited."

 kuat_decision_plague_psi_clear:0 "Pandemic: Psionic Purification"
 kuat_decision_plague_psi_clear_desc:0 "A special ritual will harness the power of the Shroud to purge all plague entities from an entire World, instantly curing all infected Pops. However, note that the plague may §Preinfect§! this World again."

 kuat_decision_plague_planet_bombardment:0 "Pandemic: Clear Infection"
 kuat_decision_plague_planet_bombardment_desc:0 "Order the navy to bomb this World into oblivion, annihilating all life and ultimately eradicating the plague from its surface.\n§RWarning: This will permanently destroy all Pops on this World and be seen as ethnic cleansing by other Empires. This decision is irreversible!§!"

 kuat_plague_quarantine_fail:0 "§RYou must own an infected World to use this Edict!§!"
 bombardment_kuat_stance_plague_spread:0 "Plague Spread"
 bombardment_kuat_stance_plague_spread_desc:0 "This bombardment stance has a chance to spread corruptive pathogens to the target World after each bombardment cycle."

 kuat_plague_lvl_1:0 "Corruption"
 kuat_plague_lvl_1_desc:0 "This World has been infected by a novel and lethal corruptive disease. Fortunately, the outbreak has been contained and its effects should subside soon."
 kuat_plague_lvl_2:0 "Great Plague"
 kuat_plague_lvl_2_desc:0 "Infection has spread globally; the World's Pops are slowly but steadily declining."
 kuat_plague_lvl_3:0 "§RCorrupted Abomination Plague§!"
 kuat_plague_lvl_3_desc:0 "Panic grips the World. Pops are attempting to flee by any means possible."
 kuat_unity:0 "National Revelation"
 kuat_unity_desc:0 "National Revelation."
 kuat_plague_bombardment_planet:0 "Bombing Aftermath"
 kuat_plague_bombardment_planet_desc:0 "To prevent the plague from further ravaging our Empire, we have made a difficult decision-to sacrifice all life on this World to ensure the safety of all others."
 gateway_kuat_plague:0 "$kuat_plague_lvl_2$"
 kuat_plague.9.desc.3:0 "Our §Ppsionics§! have received new guidance and can now effectively reduce infection rates among the populace. These psionics, through their psychic abilities, attempt to reach out to The "Ancient Gods" inquired about the origins of the current pandemic, but clearly they received no clear clues, only some strange fragments. \n\nInfinite....Calamity....The Force....Collapse..."
 kuat_plague.9.desc.4:0 "Our scientists §Pdiscovered a special ritual§!-using energy from the Shroud to purify the World. While this cannot prevent a new wave of infection, it can grant immunity to some individuals. They have also detected strange whispers emanating from the void.\n\nImmunity... future... hope... eternity..."
 kuat_plague.9.desc.5:0 "Illegal immigration and resource transport are primary factors in its spread. We have established §Pa set of measures§! to slow the diffusion of the pathogen.\nThe primary vector of the pathogen is living organisms, so transmission is expected to be faster on §Ppopulous Worlds§!.\n\n§H[root.ruler.GetName]§!, report concluded."
 kuat_plague.63.name:0 "World purification complete."
 kuat_plague.63.desc:0 "Our mighty forces have landed on §H[root.GetName]§! and eradicated the §Rswarm of corrupted abominations§! from its surface. We may now send colonists without fear of infection.\n\nAt the request of our CDC, to prevent contamination, §Pall infrastructure will be sealed and dismantled§!."
 kuat_plague.63.0:0 "As long as we stand united, we are invincible!"
 kuat_plague.63.1:0 "Award relevant personnel!"
 kuat_plague.63.2:0 "This is not the last one on our list."
 kuat_plague.63.4:0 "Strengthen perimeter defenses!"
 kuat_plague.63.6:0 "Glory to the Creator!"
 kuat_plague.170.name:0 "Plague antidote invented!"
 kuat_plague.170.desc.0:0 "Through examination of biological data from §Rcorrupted Progenitors§! and infected cases, as well as antigen protein testing, our researchers have discovered a way to achieve complete immunity against this disease, and our scientists have issued a corresponding report.\n\nThe report indicates that by tracing back to the virus origin point, the virus's nature closely resembles the Unterraum energy within the conduits contacted by $Name_Kuat_StarContractor$, and corruption is in fact the collapse of Unterraum Strength into the material world. The corruption we encountered has spread across star systems where we unsealed Unterraum energy-these residual plagues were precisely what caused the ancient Rakata civilization's destruction.\n\nThus, this is a special form of energy originating from Their realm, which exerts immense genetic impact on specific organisms, granting them powerful regenerative abilities while stripping most Force traits derived from genetic systems. However, due to its instability, affected individuals lose their sanity and develop primal devouring urges; furthermore, its bloodborne transmission causes infected individuals to become highly aggressive, expanding the infection radius.\n\nNow our experts have found a permanent solution: by genetically modifying our species to gain immunity, we can finally escape the plague's grasp. Additionally, we should consider humanitarian aid-should we export and share our developed vaccine with other nations?"
 kuat_plague.170.desc.1:0 "Many scientists involved in vaccine development believe we should share the antidote data with underdeveloped nations."
 kuat_plague.170.0:0 "Share it with anyone"
 kuat_plague.170.1:0 "Share it with our friends"
 kuat_plague.170.1.tooltip:0 "Including the Federation"
 kuat_plague.170.2:0 "Share only with our Federation allies."
 kuat_plague.170.3:0 "Share with Exotics? No."
 kuat_plague.171.name:0 "Obtain plague antidote"
 kuat_plague.171.desc:0 "§H[from.GetName]§!'s scientists have shared with us the data regarding the plague antidote. We now possess the cure for this accursed pandemic-the restoration of our living environment is within reach."
 kuat_plague.171.0:0 "Very good."
 kuat_plague.173.name:"Dawn"
 kuat_plague.173.desc:"According to information collected from all fronts by our CDC, the nationwide §Rcorruption§! epidemic has lost all known transmission pathways within the empire. Now, no World under our control remains affected by this crisis. Yet the galaxy-wide threat continues to spread-we must remain vigilant. Regardless, we are now safe.\n\nThis lingering plague from the ancient Rakata has reached its end. The shadows from the past shall fully dissipate, and a new dawn shines upon the entire galaxy.\n\nBut how exactly did this plague cross millions of years to affect the present? What is the relationship between the spacetime rift sealed by the endodia and Unterraum? This crisis still holds many unanswered questions."
 kuat_plague.173.a:"Very good."

 kuat_plague.174.name:0 "$PSIONIC_AURA$ conflict"
 kuat_plague.174.desc:0 "The §H[from.GetName]§! star system has seen our §H$PSIONIC_AURA$§! engage in fierce struggle against the §M Rakata Plague §! aura emanating from the nearby §H[fromfrom.GetName]§! star system. Our psionic [GetResearchers] modeled such behavior before, but this is the first time we've obtained firsthand data on this phenomenon.\n\nIn theory, the stronger the aura-the greater its projection intensity-the more it will gradually displace opposing forces. If this struggle results in one side's total defeat, the dominant aura may flow into the vacated star system.\n\nThis is literally a 'clash of souls'.\n\nUnfortunately, the $PSIONIC_AURA$ within §H[fromfrom.GetName]§! is too powerful-our conventional psionic countermeasures are completely ineffective."
 kuat_plague.174.a:0 "We cannot fail!"

 kuat_plague.175.name:0 "$shroud.4950.title$"
 kuat_plague.175.desc:0 "We have detected high-concentration psionic energy in the §H[from.GetName]§! star system. Our [GetTelepathPlural], by listening to echoes within the §HUnterraum§!, combined with our actions at the Fleet Support Center, have determined this phenomenon stems from the activity of the ancient Rakata extinction plague. Before we lifted restrictions at the Fleet Support Center, this dark plague was sealed within an Unterraum rift.\n\nIt once caused the Limit Empire to lose its proud Dark Force, and halted the Endodian Empire at the threshold of the Unterraum gateway. This activity bears certain similarities to known $PSIONIC_AURA$ phenomena. Like $PSIONIC_AURA$, it possesses the ability to influence observable reality, and we can confirm the plague spreads between star systems.\n\nOur data shows this outbreak carries severe negative effects. If left unchecked, it will rapidly spread throughout the entire star system."
 kuat_plague.175.a:0 "Worrisome."

 kuat_opinion_immune_shared:0 "Plague: Share Vaccine"
 triggered_opinion_kuat_apacalytic:"Minion of $Name_Kuat_Fire_base$"
 kuat_tech_plague_immune_prereqfor:0 "immunity"
 kuat_tech_plague_immune_prereqfor_desc:0 "Reduces mortality. Pops gain long-term immunity to the plague."
 kuat_tech_plague_immune_2:0 "Plague: Increase Immunity"
 kuat_tech_plague_immune_2_desc:0 "Symptomatic compensation increases survival chances and the likelihood of developing long-term immunity."
 kuat_tech_plague_immune_2_prereqfor:0 "Increase Immunity"
 kuat_tech_plague_immune_2_prereqfor_desc:0 "Reduces mortality and increases the chance of acquiring the Immune Trait."
 kuat_tech_plague_anti_zombie:0 "Plague: Anti-Corrupted Progenitor Strategy"
 kuat_tech_plague_anti_zombie_desc:0 "Perhaps we could contain the infected so they won't be lost among millions of dead mutated bodies."
 kuat_tech_plague_anti_zombie_prereqfor:0 "Reduce Corrupted Progenitor Army"
 kuat_tech_plague_anti_zombie_prereqfor_desc:0 "Decreases the number of Corrupted Progenitor troops on infected Worlds."
 kuat_tech_plague_spread_prereqfor:0 "§HOrbital Bombardment Stance:§! $kuat_tech_plague_spread$"
 kuat_tech_plague_spread_prereqfor_desc:0 "Some might say this is inhumane."
 kuat_decision_plague_fail:0 "World infected."
 kuat_decision_plague_test_fraction_of_immune:0 "Plague: Immunity Test"
 kuat_decision_plague_test_fraction_of_immune_desc:0 "Mass testing of planetary residents will give us a clearer understanding of the situation."
 kuat_decision_plague_test_fraction_of_immune_tooltip:0 "Previous tests:\nNatural immunity: [this.kuat_plague_natural_immune_pops]%\nAcquired immunity: [this.kuat_plague_immune_pops]%"
 kuat_plague_natural_immune_pops_loc:0 "[this.kuat_plague_natural_immune_pops]"
 kuat_plague_immune_pops_loc:0 "[this.kuat_plague_immune_pops]"
 job_kuat_plague_purge:0 "Devour"
 job_kuat_plague_purge_desc:0 "On worlds controlled by the Corrupted Primordials, the devouring of Pops is very common."
 job_kuat_plague_purge_plural:0 "$job_kuat_plague_purge$"
 job_kuat_plague_purge_cap: "$job_kuat_plague_purge$"
 kuat_plague.10.desc.0:0 "[this.kuat_scripted_loc_plague_kuat_plague_10_desc_0]"
 kuat_plague.10.desc.0.0:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, we stand united."
 kuat_plague.10.desc.0.1:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, we set aside our differences and stand together."
 kuat_plague.10.desc.0.2:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, we must prepare to face our adversaries."
 kuat_plague.10.desc.0.3:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, you must put aside past grudges."
 kuat_plague.10.desc.0.4:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, let us pray together."
 kuat_plague.10.desc.0.5:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, losses are inevitable; steel yourselves."
 kuat_plague.10.desc.1:0 "[this.kuat_scripted_loc_plague_kuat_plague_10_desc_1]"
