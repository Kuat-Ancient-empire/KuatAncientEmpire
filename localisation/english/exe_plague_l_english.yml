l_english:
  Name_F_1: "§EVoid Fortress (F)§!"
  Name_Kuat_Contractor: "§EWanderers§!"
  Name_Kuat_DeD_Contractor: "§BSleepers§!"
  Name_Kuat_StarContractor: "§EDescendants§!"
  misc_system_desc_6: "$Name_F_1$"
  misc_system_desc_6_desc: "The Imperial Research Department has intercepted a new signal band, and our scientists have determined that it originates from a star system never before charted on our star maps. Researchers believe this will mark a milestone in our deep-space exploration, and urge us to survey this system as soon as possible."
  misc_system_desc_6_desc_finished: "Our investigation into $misc_system_desc_6$ has yielded significant breakthroughs. Our researchers have recovered a vast trove of data from $Name_Kuat_StarContractor$, the complexity and depth of which defy imagination. Preliminary decryption reveals that these archives encompass extensive scholarly research conducted by $Name_Kuat_StarContractor$ across astrophysics, quantum mechanics, bioengineering, history, theology, and other esoteric disciplines.\n\nFurthermore, the records reference numerous factions still unknown to us. Thus far, we have only pieced together the history and conflicts between the Endodia Empire and $Name_kuat$, while other powers remain shrouded in mystery.\n\nThe Endodia Empire has fallen, yet dark shadows still loom across the heavens. Perhaps we should pause and reflect upon our own future — perhaps the Endodia Empire was right all along.\n\nWhile this discovery opens the door to a far wider cosmos, the path ahead remains veiled in mist. We will remain vigilant and defend our hard-won achievements at any cost.\n\nWe sincerely hope that under your wise leadership, our civilization will embark upon its own great journey."
  kuat_legacy_key_world_6_desc: "[kuat_legacy_key_world_6]"

  kuat_plague.62.name:0 "Garrison crisis on §H[from.GetName]§!."
  kuat_plague.62.desc:0 "According to the command center's final transmission, the surviving administration erected a containment perimeter, but the §PInfected§! breached the city defenses. Countless unarmed civilians had no time to flee and were transformed into §RCorrupted Progenitors§! right before our soldiers' eyes. Our military grip over the planet has been severely compromised. The situation is critical — we need immediate reinforcements.\n\nUnless we deploy additional troops, we will lose the remaining survivors — and potentially control of the entire world."
  kuat_plague.62.0:0 "We will reclaim control of the world at any cost."
  kuat_plague.62.1:0 "We must rescue our citizens immediately!"
  kuat_plague.62.2:0 "Purge them with fire!"
  kuat_plague.62.3:0 "How horrifying!"
  kuat_plague.62.4:0 "We must contain this!"
  kuat_plague.62.62:0 "Henceforth, this day shall be remembered in mourning."
  kuat_plague.62.6:0 "Let us pray for their souls."
  kuat_plague.62.7:0 "We must formulate an effective countermeasure."
  kuat_plague.9.name:0 "Plague: Report"
  kuat_plague.9.desc.0:0 "Our science team has carefully analyzed all available data and evaluated our viable options. Their findings indicate:\nThe biological pathogen is exceedingly difficult to neutralize, but the presence of §Pclinics, hospitals, Crime£crime£, and Amenities£amenities£§! on a world directly affects Pop survival rates."
  kuat_plague.9.desc.1:0 "Certain properties of §PArtificial Orbital Structures§! appear to inhibit infection. Utilizing §PArtificial Orbital Structures§! may help shelter our population."
  kuat_plague.9.desc.2:0 "In light of the emergency, our experts have developed multiple epidemiological models and conducted field trials among the inhabitants of §H[kuat_plague_gaia.GetName]§!. Their findings indicate that the pristine biosphere of such worlds bolsters Pop resilience against the pathogen. Enhancing our planetary environments may help alleviate this crisis."
  kuat_plague.9.0:0 "We must prepare a public address to the nation."
  kuat_plague.9.0.tooltip:0 "Unlocks the §H$edict_kuat_plague_quarantine$§! Edict."
  kuat_plague.10.name:0 "Public Address"
  kuat_plague.10.desc.1.0:0 "Following confirmed cases of lethal §PCorruption§! in frontier sectors, the government has suspended all trade, scientific exchange, and civilian travel. State research divisions have launched emergency clinical trials; this calamity will soon be brought under control."
  kuat_plague.10.desc.2.0:0 "Entry of §Prefugees§! from quarantined sectors has also been restricted."
  kuat_plague.10.desc.3.0:0 "Effective immediately, any unauthorized contact with xenos shall be prosecuted as high treason."
  kuat_plague.10.desc.4.0:0 "The government does not rule out §Pmilitary intervention§! as a last resort to contain the infection."
  kuat_plague.10.desc.4.1:0 "The government does not rule out §Pmilitary intervention§! as an active containment measure."
  kuat_plague.10.desc.4.2:0 "The government does not rule out §Pmilitary intervention§! as a punitive measure against the infected."
  kuat_plague.10.desc.4.3:0 "The government does not rule out §Pmilitary intervention§! as a deterrent against quarantine breaches."
  kuat_plague.10.desc.1.1:0 "Following confirmed cases of lethal §PCorruption§! in foreign frontier sectors, the government has ordered strict restrictions on all cross-border trade and travel."
  kuat_plague.10.desc.3.1:0 "We are compelled to enact these measures to halt the spread of Corruption. However, diplomatic channels remain open, allowing our scientists to share epidemiological data with foreign representatives and collaborate on a cure."
  kuat_plague.10.desc.1.2:0 "Following confirmed cases of lethal §PCorruption§! along our borders, the government has suspended all trade, scientific, and travel links with potential adversaries."
  kuat_plague.10.desc.3.2:0 "These measures are necessary to prevent the spread of Corruption and safeguard our national sovereignty. Border fleets have been placed on high alert."
  kuat_plague.10.desc.1.3:0 "Following confirmed cases of lethal §PCorruption§! along our borders, the government has suspended all trade, scientific, and travel links with neighboring states."
  kuat_plague.10.desc.3.3:0 "We must enact these measures to contain the spread of Corruption, though we will continue to provide humanitarian relief to afflicted friendly nations."
  kuat_plague.10.desc.1.4:0 "Those godless sinners have brought the Creator's wrath upon themselves: lethal Corruption has broken out along our borders. The government has ordered an immediate halt to all trade, scientific, and travel contact with the unclean."
  kuat_plague.10.desc.3.4:0 "We are compelled to take these measures to keep the Corruption from our flock. We shall pray for their swift deliverance."
  kuat_plague.10.desc.1.5:0 "Following confirmed outbreaks of lethal Corruption along our borders, the government has severed all trade, scientific, and travel links with those incompetent fools."
  kuat_plague.10.desc.3.5:0 "We are forced to enact these measures to halt the spread of Corruption. Our finest minds are already working on a vaccine."
  kuat_plague.10.0:0 "We must stand united."
  kuat_plague.50.name:0 "Galactic Plague"
  kuat_plague.50.desc:0 "After communicating with the ancient AIs within the ruins of $Name_H_1$ and receiving their warnings, our scientists have detected troubling signs across the galaxy alongside rumors of a mysterious §Pdisease§!. Though no fatalities have been confirmed yet, the illness has already sparked widespread panic among the populace.\n\nNotably, the contagion has reached multiple worlds and drawn the attention of our Center for Disease Control. Our research division strongly advises taking the ancient AIs' warnings seriously."
  kuat_plague.50.0:0 "We will monitor the situation closely."
  kuat_plague.50.1.0:0 "Unfortunate biomass."
  kuat_plague.50.1.1:0 "Fragile organic lifeforms."
  kuat_plague.50.1.2:0 "An intriguing biological anomaly..."
  kuat_plague.50.2:0 "Of no concern to higher forms of existence."
  kuat_plague.50.3:0 "The price of clinging to planetary biospheres."
  kuat_plague.50.4:0 "We must study this."
  kuat_plague.50.4.tooltip:0 "Truly fascinating."
  kuat_plague.51.name:0 "The Great Galactic Plague"
  kuat_plague.51.desc.0.0:0 "The warning from the ancient AIs was all too accurate. Our researchers report that the §Pdisease§! is mutating into an exceedingly lethal pathogen at an alarming rate — a contagion our scientists have termed the Corruption. It has already claimed millions of lives across the galaxy. As the ancient AIs warned, this is no ordinary illness, but a deadly pandemic originating from a higher plane of existence. Our researchers believe that unsealing the spatial rift left behind by the Endodia triggered this catastrophe, though its exact vector of transmission remains unclear. We must find a way to counter the Corruption before it is too late."
  kuat_plague.51.desc.1.0:0 "Our Empire has already been exposed. Our research divisions must immediately mobilize to study the pathogen. The warning of the ancient AIs has been borne out in full: this crisis of unknown origin is now spreading across our worlds, and we must stand as one to survive this trial."
  kuat_plague.51.desc.1.1:0 "Our Empire has thus far escaped infection, yet we must heed the warning of the ancient AIs — this crisis of unknown origin is already stalking the shadows."
  kuat_plague.51.0:0 "A powerful force is testing our beliefs."
  kuat_plague.51.1:0 "Our calculations are not encouraging."
  kuat_plague.52.name:0 "Corruption Progenitor Plague"
  kuat_plague.52.desc:0 "Today, shortly after survivors were evacuated from an infected World, one of our xeno-biologists submitted his report to the scientific community.\n\nHe personally observed how a deceased individual regained certain neural functions. Unfortunately, all reanimated hosts were highly aggressive. Most infected individuals show no signs of intelligence, but a rare few exhibit clear cognitive behavior. Our researchers currently refer to these entities as Progenitors. This infection appears to originate from an attack targeting the genetic traits of sentient life, manifesting in biological organisms through virus-like infection and assault. We must find a way to resolve this crisis, or our species will face total annihilation.\n\nOur research department believes these infected Pops possess some research value, but under current circumstances, our priority must be addressing the crisis. The accuracy of the ancient AIs' warning has now been proven.\n\nRemnants of a crisis possibly originating from the ancient Infinite Empire are now ravaging our Empire."
  kuat_plague.52.0:0 "This is a severe threat!"
  kuat_plague.53.name:0 "Infectious outbreak on §H[from.GetName]§!"
  kuat_plague.53.desc.0.0:0 "The administrative body on §H[from.GetName]§! has reported local Pops suffering from §P infection§!. Due to the severity of the situation, quarantine measures have been deployed globally, and the spread of Corruption continues to accelerate."
  kuat_plague.53.desc.0.1:0 "The administrative body on §H[from.GetName]§! has reported the first confirmed case of Corruption virus infection. Local authorities are doing everything possible to mitigate negative impacts. The infected individual has been purified."
  kuat_plague.53.desc.0.2:0 "The §P Corruption Plague§! on §H[from.GetName]§! has entered its final stage. Our biologist analysis indicates that, in a sense, the Corruption Progenitors have formed a unique biological community. There is now a high probability that this World will release a §R Corruption Progenitor Swarm§!. Once released, it would destroy the entire civilization on this World.\n§RAs long as any non-immune Pops remain on this World, the Corruption Legion can spawn at any time!§!"
  kuat_plague.53.desc.1.0:0 "§H[from.GetName]§! is the first World to report numerous §P contamination§! cases. However, the local population data indicates our medication is effective, with very few fatalities so far.\nDue to epidemic management, local authorities have temporarily suspended public transportation and airspace access, canceled all gatherings and demonstrations, and strengthened preventive quarantine measures.\nPops on the World have been divided into green and yellow zones based on the presence of infected individuals. With assistance from law enforcement, checkpoints staffed with bio-control personnel are monitoring the status of local Pops in each zone.\nThe administration strongly advises anyone exhibiting known symptoms of §P Corruption§! to immediately seek medical attention at the nearest hospital or clinic.\n\nWe must maintain isolation and do everything possible to preserve order."
  kuat_plague.53.desc.1.1:0 "The administration of §H[from.GetName]§! reports a large number of §P infection cases with fatal consequences.§!\nAs a result, martial law has been enacted. Movement between settlements is prohibited unless individuals carry special permits and pass through designated outposts; such violations will be treated as acts of bioterrorism.\nThe government has issued a special Edict, reclassifying all yellow zones where infected Pops exceed 70% as red zones. From today onward, all red zones will be completely isolated from the outside world-including military and medical personnel remaining within. No transfer of personnel from red zones will be permitted until the epidemic ends.\nIntelligence indicates small private vessels are smuggling residents out of the area illegally.\n\nWe must use every means available to maintain quarantine and order."
  kuat_plague.53.desc.1.2:0 "A massive outbreak of Corruption involving §P infected individuals§! has occurred on §H[from.GetName]§!.\nThis has caused widespread panic among the local population. Reports indicate desertion among military personnel and large-scale looting in yellow zones, suggesting the region has descended into anarchy. The last remaining civilized safe havens are fortified green zones near administrative centers, where the remaining forces are concentrated.\nShocking lunar images from red zones show vast armies of Corruption Progenitors advancing toward the remaining settlements.\n\nWe must employ every possible method to maintain quarantine and order."
  kuat_plague.53.desc.2.0:0 "Analysts believe §H[fromfrom.GetName]§! in the §H[fromfrom.solar_system.GetName]§! system is the source of the infection."
  kuat_plague.56.name:0 "Increased deaths on §H[from.GetName]§!"
  kuat_plague.56.desc.0:0 "Another wave of infection has swept through §H[from.GetName]§!, leaving only empty cities behind! Survivors have taken refuge in facilities guarded by our military. Economic and industrial activity on the World has completely halted. The situation is critical!"
  kuat_plague.57.name:0 "§Y[From.GetName]§!: Growing numbers of Corruption Progenitors"
  kuat_plague.56.desc.1:0 "More and more of our citizens are succumbing to Corruption, subsequently reinforcing the ranks of the Corruption Progenitors. Local governments are requesting immediate aid. We must find a way to save our people!"
  kuat_plague.56.0:0 "This is truly horrifying."
  kuat_plague.56.1:0 "Arm yourselves!"
  kuat_plague_block.tooltip:0 "Click to disable news about infected Worlds."
  kuat_plague.58.name:0 "Survivors"
  kuat_plague.58.desc:0 "We have received an unexpected signal from §H[from.GetName]§!. Signal analysis experts confirm that these transmissions are neither pre-recorded nor automated emergency broadcasts, but originate from living, healthy citizens who claim to have overcome the infection.\n\nOn a voluntary basis, a team of scientists has been dispatched to the infected World. Upon examining the survivors, they were found to have multiple bite and scratch wounds, yet displayed no symptoms of §P Corruption§!. This is a promising development-hope may finally be on the horizon."
  kuat_plague.58.0:0 "We can make use of them."
  kuat_plague.61.name:0 "§H[from.GetName]§! has ceased responding"
  kuat_plague.61.desc:0 "Attempts to contact §H[from.GetName]§! have been lost. Clearly, no one survived the planet's infection, and now we must abandon this world completely. This is a dark hour for the Empire."
  kuat_plague.61.0:0 "A sorrowful day."
  kuat_plague.152.name:0 "Bombing concluded."
  kuat_plague.152.desc:0 "§H[from.leader.GetName]§! reports mission completion. The planet's biosphere will not recover for a long time; everything on the surface has been eradicated. The contagion pathway from this world has been fully eliminated."
  kuat_plague.152.0:0 "May the plague end swiftly."

  kuat_chain_plague_count_title:0 "§EInfection Report§!"
  kuat_chain_plague_count_desc:0 "The entire galaxy faces the threat of total annihilation of all sentient life! This corruptive plague, suspected to originate from the ancient Infinite Empire, has dealt severe blows to all known galactic civilizations. Below are the statistics compiled by our experts based on the final damage caused by the pandemic."
  kuat_chain_plague_infested_planet:0 "Number of infected planets"
  kuat_chain_plague_kill_pop_count:0 "Number of Pops consumed"
  kuat_chain_plague_kill_planet_count:0 "Number of planets destroyed"
  kuat_chain_plague_infested_planet_total:0 "Total number of infected planets in the galaxy"
  kuat_chain_plague_kill_pop_count_total:0 "Total number of Pops consumed across the galaxy"
  kuat_chain_plague_kill_planet_count_total:0 "Total number of planets destroyed across the galaxy"
  kuat_chain_plague_zombie_count_total:0 "Total number of corrupted abominations discovered"

  edict_kuat_plague_quarantine:0 "§EQuarantine§!"
  edict_kuat_plague_quarantine_desc:0 "Thorough inspection of all cargo and strict adherence to quarantine protocols will help contain the spread of corruption.\nMigration to infected planets is prohibited."

  kuat_decision_plague_psi_clear:0 "Pandemic: Psionic Purification"
  kuat_decision_plague_psi_clear_desc:0 "A special ritual will harness the power of the Shroud to purge all plague entities from an entire World, instantly curing all infected Pops. However, note that the plague may §Preinfect§! this World again."

  kuat_decision_plague_planet_bombardment:0 "Pandemic: Clear Infection"
  kuat_decision_plague_planet_bombardment_desc:0 "Order the navy to bomb this World into oblivion, annihilating all life and ultimately eradicating the plague from its surface.\n§RWarning: This will permanently destroy all Pops on this World and be seen as ethnic cleansing by other Empires. This decision is irreversible!§!"

  kuat_plague_quarantine_fail:0 "§RYou must own an infected World to use this Edict!§!"
  bombardment_kuat_stance_plague_spread:0 "Plague Spread"
  bombardment_kuat_stance_plague_spread_desc:0 "This bombardment stance has a chance to spread corruptive pathogens to the target World after each bombardment cycle."

  kuat_plague_lvl_1:0 "Corruption"
  kuat_plague_lvl_1_desc:0 "This World has been infected by a novel and lethal corruptive disease. Fortunately, the outbreak has been contained and its effects should subside soon."
  kuat_plague_lvl_2:0 "Great Plague"
  kuat_plague_lvl_2_desc:0 "Infection has spread globally; the World's Pops are slowly but steadily declining."
  kuat_plague_lvl_3:0 "§RCorrupted Abomination Plague§!"
  kuat_plague_lvl_3_desc:0 "Panic grips the World. Pops are attempting to flee by any means possible."
  kuat_unity:0 "National Revelation"
  kuat_unity_desc:0 "National Revelation."
  kuat_plague_bombardment_planet:0 "Bombing Aftermath"
  kuat_plague_bombardment_planet_desc:0 "To prevent the plague from further ravaging our Empire, we have made a grim decision — sacrificing all life on this world to safeguard the rest of our civilization."
  gateway_kuat_plague:0 "$kuat_plague_lvl_2$"
  kuat_plague.9.desc.3:0 "Our §Ppsionics§! have received new guidance and can now effectively reduce infection rates among the populace. Through their psychic abilities, they attempted to commune with the \"Ancient Gods\" to learn the origins of the current pandemic, yet received no clear answers — only haunting, fragmented whispers:\n\nInfinite... Calamity... The Force... Collapse..."
  kuat_plague.9.desc.4:0 "Our scientists have §Puncovered a special ritual§! — channeling energy from the Shroud to purify the world. While this cannot prevent future reinfection, it grants permanent immunity to a portion of the population. During the ritual, they also detected strange whispers echoing from the void:\n\nImmunity... Future... Hope... Eternity..."
  kuat_plague.9.desc.5:0 "Illegal migration and unregulated cargo transport are the primary vectors of transmission. We have established §Pa comprehensive set of containment protocols§! to slow the pathogen's spread.\nBecause living organisms serve as the primary vector, transmission is projected to accelerate significantly on §Pdensely populated worlds§!.\n\n§H[root.ruler.GetName]§!, that concludes our report."
  kuat_plague.63.name:0 "World purification complete."
  kuat_plague.63.desc:0 "Our valiant forces have landed on §H[root.GetName]§! and eradicated the §Rswarm of corrupted abominations§! from its surface. We may now dispatch colonists without fear of infection.\n\nAt the recommendation of our CDC, §Pall contaminated infrastructure will be sealed and dismantled§! to prevent any secondary outbreak."
  kuat_plague.63.0:0 "So long as we stand united, we are invincible!"
  kuat_plague.63.1:0 "Commend all personnel involved!"
  kuat_plague.63.2:0 "This will not be the last world we reclaim."
  kuat_plague.63.4:0 "Fortify our perimeter defenses!"
  kuat_plague.63.6:0 "Glory to the Creator!"
  kuat_plague.170.name:0 "Plague Antidote Developed!"
  kuat_plague.170.desc.0:0 "Through exhaustive analysis of biological samples from §RCorrupted Progenitors§! and infected hosts, combined with targeted antigen-protein trials, our researchers have discovered a method to confer complete immunity against the contagion and submitted their final report.\n\nBy tracing the pathogen back to its point of origin, the report concludes that the virus's energetic signature closely matches the Subspace energy within the conduits accessed by $Name_Kuat_StarContractor$ — confirming that the Corruption is, in fact, the physical manifestation of Subspace energy collapsing into the material realm. The outbreak we encountered spread across the star systems where we unsealed those Subspace conduits; these lingering plagues are the very same catastrophe that brought down the ancient Rakata civilization.\n\nOriginating from that higher realm, this volatile energy inflicts drastic genetic mutations upon susceptible organisms, granting rapid cellular regeneration while stripping away hereditary Force sensitivity. However, its extreme instability shatters the host's sanity, replacing reason with a primal urge to devour. Worse still, its bloodborne nature drives infected hosts into hyper-aggressive frenzies, rapidly expanding the radius of contagion.\n\nNow, our experts have engineered a permanent solution: through targeted gene therapy, our species can acquire lasting immunity and break free from the nightmare of the plague forever. One question remains — out of humanitarian concern, should we share our vaccine data with other nations?"
  kuat_plague.170.desc.1:0 "Many of the scientists who developed the vaccine urge us to share the antidote data with less developed nations."
  kuat_plague.170.0:0 "Share it with the entire galaxy."
  kuat_plague.170.1:0 "Share it with friendly nations."
  kuat_plague.170.1.tooltip:0 "Includes Federation members."
  kuat_plague.170.2:0 "Share it only with our Federation allies."
  kuat_plague.170.3:0 "Share it with xenos? Never."
  kuat_plague.171.name:0 "Plague Antidote Received"
  kuat_plague.171.desc:0 "Scientists from §H[from.GetName]§! have shared their plague antidote data with us. At last, we hold the cure to this accursed pandemic — the restoration of our worlds is finally within reach."
  kuat_plague.171.0:0 "Splendid."
  kuat_plague.173.name: "Dawn"
  kuat_plague.173.desc: "According to reports compiled from every front by our Center for Disease Control, the §RCorruption§! pandemic has lost all active transmission chains within our borders. Not a single world under our control remains afflicted by this crisis. Though the contagion still rages across the wider galaxy — requiring our continued vigilance — our people are finally safe.\n\nThis ancient shadow left behind by the Rakata has at last been dispelled, and a new dawn breaks across our realm.\n\nYet troubling questions remain: how did a plague cross tens of thousands of years to haunt the present? And what truly lies behind the spacetime rift sealed by the Endodia and its connection to Subspace? Many mysteries of this crisis remain unanswered."
  kuat_plague.173.a: "Very good."

  kuat_plague.174.name:0 "$PSIONIC_AURA$ Conflict"
  kuat_plague.174.desc:0 "In the §H[from.GetName]§! system, our §H$PSIONIC_AURA$§! has locked in a fierce struggle against the §MRakatan Plague§! aura spilling over from the neighboring §H[fromfrom.GetName]§! system. While our psionic [GetResearchers] had previously modeled such interactions in theory, this marks the first time we have gathered firsthand observational data.\n\nIn principle, the stronger aura — the one with greater projection intensity — will steadily push back the opposing field. Should one side be completely overwhelmed, the victorious aura will surge into the vacated star system.\n\nIt is, in every sense, a clash of souls.\n\nUnfortunately, the $PSIONIC_AURA$ radiating from §H[fromfrom.GetName]§! is overwhelming — our conventional psionic countermeasures are proving entirely ineffective."
  kuat_plague.174.a:0 "We must not falter!"

  kuat_plague.175.name:0 "$shroud.4950.title$"
  kuat_plague.175.desc:0 "We have detected an intense concentration of psionic energy in the §H[from.GetName]§! system. By listening to echoes within §HSubspace§! and cross-referencing our actions at the Fleet Support Center, our [GetTelepathPlural] have determined that this phenomenon stems from the ancient Rakata extinction plague — a dark contagion that had lain sealed within a Subspace rift until we lifted the restrictions at the Fleet Support Center.\n\nIn ages past, it stripped the Infinite Empire of its vaunted dark Force and halted the Endodia Empire at the very threshold of the Subspace gateway. Much like a $PSIONIC_AURA$, it warps observable reality and propagates across interstellar space from system to system.\n\nOur readings warn of severe deleterious effects. If left unchecked, the outbreak will rapidly engulf the entire star system."
  kuat_plague.175.a:0 "Deeply troubling."

  kuat_opinion_immune_shared:0 "Plague: Share Vaccine"
  triggered_opinion_kuat_apacalytic: "Minion of $Name_Kuat_Fire_base$"
  kuat_tech_plague_immune_prereqfor:0 "immunity"
  kuat_tech_plague_immune_prereqfor_desc:0 "Reduces mortality. Pops gain long-term immunity to the plague."
  kuat_tech_plague_immune_2:0 "Plague: Increase Immunity"
  kuat_tech_plague_immune_2_desc:0 "Symptomatic compensation increases survival chances and the likelihood of developing long-term immunity."
  kuat_tech_plague_immune_2_prereqfor:0 "Increase Immunity"
  kuat_tech_plague_immune_2_prereqfor_desc:0 "Reduces mortality and increases the chance of acquiring the Immune Trait."
  kuat_tech_plague_anti_zombie:0 "Plague: Anti-Corrupted Progenitor Strategy"
  kuat_tech_plague_anti_zombie_desc:0 "Perhaps we could contain the infected so they won't be lost among millions of dead mutated bodies."
  kuat_tech_plague_anti_zombie_prereqfor:0 "Reduce Corrupted Progenitor Army"
  kuat_tech_plague_anti_zombie_prereqfor_desc:0 "Decreases the number of Corrupted Progenitor troops on infected Worlds."
  kuat_tech_plague_spread_prereqfor:0 "§HOrbital Bombardment Stance:§! $kuat_tech_plague_spread$"
  kuat_tech_plague_spread_prereqfor_desc:0 "Some might say this is inhumane."
  kuat_decision_plague_fail:0 "World infected."
  kuat_decision_plague_test_fraction_of_immune:0 "Plague: Immunity Test"
  kuat_decision_plague_test_fraction_of_immune_desc:0 "Mass testing of planetary residents will give us a clearer understanding of the situation."
  kuat_decision_plague_test_fraction_of_immune_tooltip:0 "Previous tests:\nNatural immunity: [this.kuat_plague_natural_immune_pops]%\nAcquired immunity: [this.kuat_plague_immune_pops]%"
  kuat_plague_natural_immune_pops_loc:0 "[this.kuat_plague_natural_immune_pops]"
  kuat_plague_immune_pops_loc:0 "[this.kuat_plague_immune_pops]"
  job_kuat_plague_purge:0 "Devour"
  job_kuat_plague_purge_desc:0 "On worlds controlled by the Corrupted Primordials, the devouring of Pops is very common."
  job_kuat_plague_purge_plural:0 "$job_kuat_plague_purge$"
  job_kuat_plague_purge_cap: "$job_kuat_plague_purge$"
  kuat_plague.10.desc.0:0 "[this.kuat_scripted_loc_plague_kuat_plague_10_desc_0]"
  kuat_plague.10.desc.0.0:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, we stand united."
  kuat_plague.10.desc.0.1:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, we set aside our differences and stand together."
  kuat_plague.10.desc.0.2:0 "[this.kuat_scripted_loc_get_citizens_cap]! In this difficult time, we must prepare to face our adversaries."
