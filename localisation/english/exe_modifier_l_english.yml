l_english:
  ag_exe_invasion_chain_title:0 "§E Eternal Fleet §!"
  ag_exe_invasion_chain_desc:0 "These invaders from beyond the galaxy seem unwilling to communicate with us; they only destroy everything they encounter until they themselves are destroyed."
  ag_exe_invasion_fleet:0 "§Y Eternal Fleet §!"
  ag_exe_invasion_planet_destroyed:0 "§Y Worlds destroyed by the Eternal Fleet §!"
  ag_exe_invasion_ship_kill_by_us:0 "§G Eternal Fleet units we have eliminated §!"
  ag_exe_invasion_ship_kill_by_other:0 "§G Eternal Fleet units eliminated by others §!"
  ag_exe_invasion_victim:0 "§R Ships destroyed by the Eternal Fleet §!"

  exe_invasion_lock_outer_gate: "§E Close Gateway §!"
  exe_invasion_lock_outer_gate_DESC: "We can close the Gateways within our territory to increase our preparation time."
  exe_invasion_lock_the_eclipse: "§E Eternal Flagship §!"
  exe_invasion_lock_the_eclipse_DESC: "A super-flagship from the Eternal Fleet. We need further research and analysis of its composition, but this flagship design resembling Kuat Ship Yards seems to hold unknown secrets......................."

  kuat_shattered_holy_planet:0 "§E Former Holy World §!"
  kuat_shattered_holy_planet_desc:0 "This world was once regarded as a holy site by a Fallen Empire, but now only countless debris float in orbit. Whatever wealth it once held has long been obliterated by the previous catastrophe."
  kuat_shattered_holy_planet_custom:0 "This world was once regarded as a holy site by a Fallen Empire before being shattered."

  exe_outer_gate_locked: "§E $exe_outer_gate$ §!"
  exe_outer_gate_locked_DESC: "A strange Gateway that has already been locked by us."

  exe_outer_gate_disable: "§E $exe_outer_gate$ §!"
  exe_outer_gate_disable_MEGASTRUCTURE_DETAILS: "$exe_outer_gate_disable_DESC$"
  exe_outer_gate_disable_DESC: "A strange Gateway that has already been locked."

  bombardment_exe_invasion_bombardment:0 "§E Annihilation Bombardment §!"
  bombardment_exe_invasion_bombardment_desc:0 "Orbital bombardment weapons mounted on these fleet warships can inflict massive damage upon planets.\n- Deals §R lethal §! damage to §Y Armies §!.\n- Deals §R lethal §! damage to §Y Planets §!.\n- Deals §R lethal §! damage to §Y Pops §!.\n- Will bombard undefended planets.\n- A planet will be §R completely destroyed §! if its devastation level reaches §R100 §! or the £pop£ §Y total population §! count is §R1 or less §!."
