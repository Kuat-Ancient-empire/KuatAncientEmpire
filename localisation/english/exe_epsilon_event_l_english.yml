  TIMELINE_EVENT_RAKATA_LEGACY_01_TOOLTIP:"The imprisoned Rakata seer-he is the key to unlocking all mysteries of the Eternal Fleet. But what will be the cost?"
  TIMELINE_EVENT_RAKATA_LEGACY_01:"Mind Prison"

  TIMELINE_EVENT_KUAT_LEGACY_01_TOOLTIP:"A strange signal emanating from a Gaia World-the beginning of everything lies here."
  TIMELINE_EVENT_KUAT_LEGACY_01:"$kuat_lagacy$"

  TIMELINE_EVENT_KUAT_LEGACY_02_TOOLTIP:"$kuat_lagacy$ has pointed us in a direction. What might await us at $kuat_lagacy_2$?"
  TIMELINE_EVENT_KUAT_LEGACY_02:"$kuat_lagacy_2$"

  TIMELINE_EVENT_KUAT_LEGACY_03_TOOLTIP:"This appears to be some sort of chain. Just like its predecessor, $kuat_lagacy_2$ once again tells us we should seek something at $kuat_lagacy_3$?"
  TIMELINE_EVENT_KUAT_LEGACY_03:"$kuat_lagacy_3$"

  TIMELINE_EVENT_KUAT_LEGACY_04_TOOLTIP:"A place of great significance. $Name_F_1$ may conceal even deeper secrets. We must prepare ourselves."
  TIMELINE_EVENT_KUAT_LEGACY_04:"$Name_F_1$"

  TIMELINE_EVENT_KUAT_LEGACY_05_TOOLTIP:"$Name_B_1$, one of Endodia's former key facilities, now reduced to rubble. Oh, and we found some ship data in their graves? How bizarre-how has this not been looted by grave robbers yet?"
  TIMELINE_EVENT_KUAT_LEGACY_05:"$Name_B_1$"

  TIMELINE_EVENT_KUAT_LEGACY_06_TOOLTIP:"$Name_A_1$, one of Endodia's former key facilities, now nothing but ruins. Truly tragic. Surely there must be some strange legacy left behind here, right?"
  TIMELINE_EVENT_KUAT_LEGACY_06:"$Name_A_1$"

  TIMELINE_EVENT_KUAT_LEGACY_07_TOOLTIP:"$Name_C_1$, yet another former key facility of the Endodian Empire, now utterly destroyed. How completely devastated it is-rubble everywhere, yet still containing technologies that were never stolen?\nIndeed, we must truly be the chosen ones!"
  TIMELINE_EVENT_KUAT_LEGACY_07:"$Name_C_1$"

  TIMELINE_EVENT_KUAT_LEGACY_08_TOOLTIP:"So that's how it was. The Endodian Empire, manipulated by $Name_Kuat_Fire_base$, launched a reckless attack on $Name_kuat$. $Name_kuat$ was caught off guard. Unfortunately, by the time they recovered, the Endodian Empire had already been crippled by the Eternal Fleet."
  TIMELINE_EVENT_KUAT_LEGACY_08:"$kuat_legacy_kuat$"

  TIMELINE_EVENT_KUAT_LEGACY_12_TOOLTIP:"$Name_D_1$, perhaps the last remaining system of the Endodian Empire that can still be patched up? One must admit, stellar hubs are incredibly useful."
  TIMELINE_EVENT_KUAT_LEGACY_12:"$Name_D_1$"

  TIMELINE_EVENT_KUAT_LEGACY_13_TOOLTIP:"$kuat_lagacy_1$, the Infinite Empire-a civilization buried by history. Sadly, beyond these traces, nothing else remains."
  TIMELINE_EVENT_KUAT_LEGACY_13:"$kuat_lagacy_1$"

  TIMELINE_EVENT_KUAT_LEGACY_14_TOOLTIP:"$kuat_lagacy_11$, another ruin of the Infinite Empire. There's even a colonial management AI still functioning? It seems the Infinite Empire held many secrets. Unfortunately, none of them are accessible now."
  TIMELINE_EVENT_KUAT_LEGACY_14:"$kuat_lagacy_11$"

  TIMELINE_EVENT_GALATIC_COUNCIL_LEAGACY_01_TOOLTIP:"$Name_D_1$, perhaps the last remaining system of the Endodian Empire that can still be patched up? One must admit, stellar hubs are incredibly useful."
  TIMELINE_EVENT_GALATIC_COUNCIL_LEAGACY_01:"$Name_D_1$"

  TIMELINE_EVENT_ETERNAL_ROUTINS_01_TOOLTIP:"We have established contact with a combat unit from the Eternal Fleet and initiated investigation and negotiation procedures. This is an unprecedented path. Unfortunately, we cannot keep her."
  TIMELINE_EVENT_ETERNAL_ROUTINS_01:"Unprecedented Path"

  TIMELINE_EVENT_ETERNAL_ROUTINS_02_TOOLTIP:"We have solved the puzzle sealing the Stellar Forge. From now on, the Stellar Forge will provide the strongest possible support for our upcoming operations!"
  TIMELINE_EVENT_ETERNAL_ROUTINS_02:"Stellar Forge"
