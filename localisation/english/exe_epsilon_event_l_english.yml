 kuat_diplomatic.14.title:0 "$Name_Kuat_Fire_base$"
 kuat_diplomatic.14.desc:0 "Damn it, how did you find this place?\n\nThere are impurities within the Endodia Empire. Seal off $Name_F_1$ and do not attempt to communicate with Them-these devils will bring disaster upon you, and even the entire galaxy.\n\nFor future security, we will dispatch forces to take control of this Sector."
 kuat_diplomatic.14.a:0 "Is that so"
 kuat_diplomatic.14.a.res:0 "You must abandon any thought of communicating with them; this is the most dangerous place.\n\nCurrent empire credits: [Root.eternal_bornus_var]"

 kuat_diplomatic.15.title:0 "$Name_Kuat_Fire_base$"
 kuat_diplomatic.15.desc:0 "You've done very well-we have received reports of your recent activities.\n\nYou've actually engaged $Name_kuat$ in battle? You're truly exceptional. Driving $Name_kuat$ away ensures the Eternal Fleet will proceed unimpeded.\n\nDo not let your guard down. $Name_kuat$ has not been defeated-you've merely repelled a few Regular Blokkats garrison fleets. They will return."
 kuat_diplomatic.15.a:0 "$Name_kuat$? They'll come back?"
 kuat_diplomatic.15.a.res:0 "Yes, $Name_kuat$ will return. But before that happens, consider how you'll deal with the approaching Eternal Fleet. These were once the Emperor's sharp blades, now reduced to barely surviving in this state."

 kuat_diplomatic.16.title:0 "$Name_Kuat_Fire_base$"
 kuat_diplomatic.16.desc:0 "You've done very well-we have received reports of your recent activities.\n\nWe didn't expect you'd already be capable of defeating the Eternal Fleet. With that accomplished, you should now possess enough Strength to face $Name_kuat$'s return. The long-standing conflict between the $Name_kuat$ Empire and the Endodia Empire may finally end with you. The data from the Eternal Fleet has proven immensely helpful, revealing $Name_kuat$'s intentions to establish forward bases across multiple outer sectors."
 kuat_diplomatic.16.a:0 "We will drive them away."
 kuat_diplomatic.16.a.res:0 "Do not forget-you are still Watchers. You must uncover the secrets $Name_kuat$ researched here. We need more information about the Eternal Fleet."

 kuat_diplomatic.17.title:0 "$Name_Kuat_Fire_base$"
 kuat_diplomatic.17.desc:0 "You've done very well-we have received reports of your recent activities.\n\nIt appears $Name_kuat$ used the pretext of hunting the Eternal Fleet to secretly attempt control over it-their malicious intent is now clear. Fortunately, we outmaneuvered them. Before retreating, $Name_kuat$ granted you full access to their technology and facilities. You should hand all of this over to us. $Name_Kuat_Fire_base$ will reassess your merits. The new Endodia Empire shall surely be yours."
 kuat_diplomatic.17.a:0 "What $Name_kuat$ left behind was meant for us to fight the Eternal Fleet."
 kuat_diplomatic.17.a.res:0 "Indeed. Otherwise, how could you possibly resist a full-scale invasion by the Eternal Fleet? These fleets were $Name_kuat$'s primary research subjects. Now, use $Name_kuat$'s legacy to defeat the Eternal Fleet, then return everything to us.\n\nCurrent empire credits: [Root.eternal_bornus_var]"

 kuat_diplomatic.18.title:0 "$Name_Kuat_Fire_base$"
 kuat_diplomatic.18.desc:0 "You've done very well-we have received reports of your recent activities.\n\nYou've not only defeated $Name_kuat$, but also triumphed over the Eternal Fleet. The research data on the Eternal Fleet has been transmitted to our database. Your mission is complete. You resemble the old Endodia Empire-but you are even stronger. We will not allow the Endodia Empire to rise from its grave. It is time to end this-the new 'Endodia' Empire.\n\nUnlike $Name_kuat$, we will not strip you of everything. Now, we will reclaim everything we have given you."
 kuat_diplomatic.18.a:0 "What do you mean? What are you going to do?"
 kuat_diplomatic.18.a.res:0 "Farewell, our friends. The Watcher Protocol will soon be deactivated. Enjoy this final freedom."

 kuat_diplomatic.19.title:0 "$Name_Kuat_Fire_base$"
 kuat_diplomatic.19.desc:0 "You've done very well-we have received reports of your recent activities.\n\nYou made a surprising choice-one we did not expect. Defying $Name_kuat$'s demands places you on a path few have dared to walk."
 kuat_diplomatic.19.a:0 "Is that right?"
 kuat_diplomatic.19.a.res:0 "At least according to our records, very few civilizations have chosen this path. Those who did previously all failed. Yet you have once again defeated the Eternal Fleet, proving you may forge an entirely new path. We look forward to your discoveries along this road-but your time is short."

 kuat_diplomatic.20.title:0 "$Name_Kuat_Fire_base$"
 kuat_diplomatic.20.desc:0 "Do not come here again. Our fleet has sealed off $Name_F_1$.\n\nYou should go do what you were meant to do!"

 Name_G_1:"§EVoid Forbidden Zone (G)§!"
 Name_H_1:"§ELost Forbidden Zone (H)§!"
 misc_system_desc_8:"$Name_G_1$"
 misc_system_desc_9:"$Name_H_1$"
 kuat_legacy_key_world_8_desc:"A strange star system, an odd star, bizarre structures-as if detached from the universe's natural laws. We cannot determine what lies hidden here. $Name_Kuat_StarContractor$ tells us this system is a relic of the ancient Abyss, a fragment broken off from the Abyss itself, concealing secrets from beyond the Abyss."
 kuat_legacy_key_world_9_desc:"A buried, forgotten star system-once the glory of the Endodia Empire, now reduced to ruins and hidden facilities lurking in darkness. How much more remains unknown? $Name_Kuat_StarContractor$ says this was the region where the Endodia resistance detonated Unterraum energy seals. Why did they seal it? Was it due to war with $Name_kuat$? The truth remains to be uncovered."
 exe_outer_gate_G_facility:"§EAbyss Node§!"
 exe_outer_gate_G_facility_DESC:"An unknown construct, likely a research facility from the Abyss, broken free and standing in this space for eons. Beyond its vast research infrastructure, its advanced equipment possesses powerful astronomical observation capabilities within this supercluster-equivalent to a complete research hub."
 exe_outer_gate_G_facility_completed:0 "§EAbyss Node§!"
 exe_outer_gate_G_facility_completed_DESC:"An unknown construct, likely a research facility from the Abyss, broken free and standing in this space for eons. Beyond its vast research infrastructure, its advanced equipment possesses powerful astronomical observation capabilities within this supercluster-equivalent to a complete research hub."
 exe_enable_the_F_system_line_stage_5:0 "§ETrack the Mysterious Vessel§!"
 exe_enable_the_F_system_line_stage_5_DESC:"With additional assistance, our team is advancing the pursuit of the mysterious vessel's trail. If successful, we will obtain its jump destination coordinates. Once acquired, we should attempt to travel there and uncover the source of all this."
 exe_enable_the_F_system_line_stage_7:0 "§E$Name_Kuat_StarContractor$: Upload Data§!"
 exe_enable_the_F_system_line_stage_7_DESC:"To continue our exploration, we must follow $Name_Kuat_StarContractor$'s instructions and upload the data into $Name_Kuat_StarContractor$'s database. It remains unclear why They require this data."
 exe_enable_the_F_system_line_stage_8:0 "§E$Name_Kuat_StarContractor$: Upload Data§!"
 exe_enable_the_F_system_line_stage_8_DESC:"To continue our exploration, we must follow $Name_Kuat_StarContractor$'s instructions and upload the data into $Name_Kuat_StarContractor$'s database. It remains unclear why They require this data."
 exe_enable_the_F_system_line_stage_9:0 "§ERepair Abyss Node§!"
 exe_enable_the_F_system_line_stage_9_DESC:"Based on data and blueprints recovered from the Abyss Node, we have mastered its repair methods. Additionally, we've discovered the secret of a superweapon located atop the node's spire. To harness this war-altering weapon's Strength, we must repair and reactivate this massive node."
 exe_enable_the_F_system_line_stage_10:0 "§EImplant Installation Test§!"
 exe_enable_the_F_system_line_stage_10_DESC:"In a neuro-modification industry focused on specialization, cerebral enhancement implants are rare anomalies. They offer multiple benefits: enhancing perception by interfacing with the occipital lobe, while influencing the neocortex to improve information processing. When multiple implants form a neural implant network, their performance increases significantly.\n\nOur scientists are pioneers. Let us await the results of this trial."
 exe_enable_the_F_system_line_stage_11:0 "§EImplant Installation Rollout§!"
 exe_enable_the_F_system_line_stage_11_DESC:"In a neuro-modification industry focused on specialization, cerebral enhancement implants are rare anomalies. They offer multiple benefits: enhancing perception by interfacing with the occipital lobe, while influencing the neocortex to improve information processing. When multiple implants form a neural implant network, their performance increases significantly.\n\nThe trial's success proves the implant's safety. Now, we can expand its application."
 exe_enable_the_F_system_line_stage_12:0 "§EDecipher Residual Data§!"
 exe_enable_the_F_system_line_stage_12_DESC:"In honor of [kuat_leader_save_planet.GetName]\n\nIn the distant deep space, everything is the misty Abyss, our great scientist-[kuat_leader_save_planet.GetName] has sacrificed herself. With exceptional wisdom and fearless courage, she led our exploration into the deep void.\n\nNow that she is gone, we must remember all she has done. We absolutely cannot let our great scientist's sacrifice be in vain. The miracle she created with her life will be the decisive weight that leads us to glory and breaks the balance of future crises."
 exe_enable_the_F_system_line_stage_13:0 "§E$Name_Kuat_StarContractor$: Upload Data§!"
 exe_enable_the_F_system_line_stage_13_DESC:0 "Transmit the data to $Name_Kuat_StarContractor$. They will provide us with answers. Behind the Unterraum blockade, we might find more information about the ancient Endodia Empire."
 exe_enable_the_F_system_line_stage_14:0 "§E$Name_Kuat_StarContractor$: Download Data§!"
 exe_enable_the_F_system_line_stage_14_DESC:0 "$Name_Kuat_StarContractor$ has solved the issue of the Unterraum blockade. We need to decode the descendant data before applying it. Now, it is time for us to work hard.\n\nDo endodia still exist within? What truly happened in the history of the Endodia Empire? These secrets of the Endodia Empire will ultimately be uncovered by us."
 exe_enable_the_F_system_line_stage_15:0 "§EEndodia: Data Analysis§!"
 exe_enable_the_F_system_line_stage_15_DESC:0 "$Name_Kuat_StarContractor$ has revealed the method to resolve the Unterraum energy anomaly. Now is the time to act-stabilize the state of this lost stellar ring, collapse the pale purple Unterraum currents into a stable state, and uncover the forgotten secrets of the Endodia Empire."

 kuat_origin.8.name:"§EEternal War"
 kuat_origin.8.desc:"Since we signed the surveillance contract with $Name_Kuat_Fire_base$, they have always been watching us. Now, the Eternal Fleet-the war machine hoped for by $Name_kuat$-is about to arrive. We must complete our mission and discover the secrets $Name_kuat$ has hidden within these fleets.\n\nAfter we finish repairing the $StarForge$, the signal it emits will guide our relay stations. They will form an array that will expose the Eternal Fleet to our sight. The Eternal Fleet is now not far from our forces. The imperial high command has made their demands clear: we must pay any price to eliminate these mad machines and acquire their technology; otherwise, we cannot answer to $Name_Kuat_Fire_base$.\n\nAll units, prepare for combat!"
 kuat_origin.8.flag.desc:"Our nation's scientists have expended tremendous effort and successfully broken through the ancient Rakatan civilization's blockade on the $StarForge$. This forge is exactly as Kuat described-its tachyon signal resonance closely resembles that of the Eternal Fleet. This means we can use this facility to lure the Eternal Fleet into appearance and destroy them at once.\n\nCountless explorers and researchers have been obsessed with the $StarForge$, and even the Kuat were no exception. They were drawn to the $StarForge$, yet ultimately led to their complete destruction. Only we have proven capable of controlling this super fortress. Now that we fully control the entire $StarForge$, defeating the Eternal Fleet will be much easier."
 kuat_origin.8.eternal.desc:"Our nation's scientists have expended tremendous effort and successfully broken through the ancient Rakatan civilization's blockade on the $StarForge$. The liberation of this forge marks the beginning of our full mastery over Rakatan precursor technology.\n\nCountless explorers and researchers have been obsessed with the $StarForge$, and even the Kuat and Rakata were no exception.\n\nThey were drawn to the $StarForge$, yet ultimately led to their complete destruction. Only we have proven capable of controlling this super fortress. Now that we fully control the entire $StarForge$, we can defeat our enemies with greater ease."
 kuat_origin.8.a:"For the Future"
 kuat_origin.9.title:"$Name_Kuat_Fire_base$"
 kuat_origin.9.desc:"Connecting...\nID: 114\nConnection successful\n\nWatcher ID 114, system status confirmed normal. What is your request this time?\n$Name_Kuat_Fire_base$ will provide maximum support to all sector watchers."
 kuat_origin.9.a:"We need support."
 kuat_origin.9.b:"What is our mission?"
 kuat_origin.9.c:"We need intelligence on the Eternal Fleet."

 kuat_origin.10.desc:"ID: 114 verifying...\nVerification successful, data normal\n\n$Name_Kuat_Fire_base$ will provide the following fleet reinforcement packages based on your current situation. You must supply sufficient Imperial Credit Points. Note that $Name_Kuat_Fire_base$ has issued mission requirements-you must complete them promptly. All Strength must be devoted to fulfilling your obligations.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]\nCredits are only awarded upon completion of stage reports."

 kuat_origin.10.a:"Artillery Flagship Fleet"
 kuat_origin.10.a.fail:"Our current Imperial Credit Points do not exceed 30"
 kuat_origin.10.b:"Missile Flagship Fleet"
 kuat_origin.10.b.fail:"Our current Imperial Credit Points do not exceed 30"
 kuat_origin.10.d:"Carrier Flagship Fleet"
 kuat_origin.10.d.fail:"Our current Imperial Credit Points do not exceed 30"
 kuat_origin.10.c:"Super Flagship Fleet"
 kuat_origin.10.c.fail:"Our current Imperial Credit Points do not exceed 90"

 kuat_origin.11.desc:"ID: 114 verifying...\nVerification successful, data normal\n\n$Name_Kuat_Fire_base$ has accepted your intelligence. $Name_kuat$ has acted unusually in the Imperial Assembly-instead of demanding status as before, they are now actively withdrawing from the main Sector. These behaviors are highly abnormal. Through our intelligence network, we have discovered $Name_kuat$'s intentions: they are attempting to excavate or study some ancient legacy in your star system and use it as leverage against us.\n\n$Name_Kuat_Fire_base$ will never allow this to happen. We have chosen you-you must serve us. Perform your duties as Watcher and regularly report any research clues related to $Name_kuat$ here. In return, you will receive unimaginable rewards once everything concludes."
 kuat_origin.11.a:"We need intelligence on $Name_kuat$."
 kuat_origin.11.b:"Are we the only ones?"

 kuat_origin.12.desc:"ID: 114 verifying...\nVerification successful, data normal\n\n$Name_kuat$ originated as a warlord oligarchy that rose after the collapse of the First Empire. They are an illegal separatist force. After the Emperor's death, these factions seized military power, established their own territories and fleets, and not only rejected governance by the Imperial government but also attempted to seize our authority. This is unacceptable to $Name_Kuat_Fire_base$. Only an Imperial government controlled by $Name_Kuat_Fire_base$ can bring order and prosperity to the Empire. They will only destroy it all.\n\nYou don't need to know so much. Just do what you're supposed to do. We won't treat you poorly."
 kuat_origin.12.a:"WARNING: Source localization entry is incomplete"
 kuat_origin.12.a.respon:"We will keep watching you."

 kuat_origin.13.desc:"ID: 114 verifying...\nVerification successful, data normal\n\nYou are not the first, nor will you be the last. $Name_kuat$'s exploration fleets span multiple unknown Sectors. Small Sectors like yours are everywhere. Wherever $Name_kuat$ exists, there will be our Watchers."
 kuat_origin.13.a:"We will complete the mission."
 kuat_origin.13.a.respon:"We will keep watching you. Here, take these useless scraps."

 kuat_origin.14.desc:"ID: 114 verifying...\nVerification successful, data normal\n\nThe Eternal Fleet is an ancient fleet built on the World of Eokas and entirely operated by intelligent systems. Its creators, the Infinite Empire, have long perished. Our Emperor once controlled the Throne and brought the Eternal Fleet to the Empire. Due to the Eternal Fleet's unique AI combat system, the Imperial military became highly interested. Both we and $Name_kuat$ conducted detailed studies. During subsequent technological upgrades, the military integrated Imperial technology into the Eternal Fleet and deployed it against rebel forces.\n\nAs expected, it achieved remarkable success in battles against regional warlords and rebels, destroying their main fleets. However, tragically, the Emperor died, and the Eternal Fleet went out of control, attempting to destroy everything. This disaster was actually caused by $Name_kuat$'s incompetence-their ship blueprints were stolen by rebels, leading to catastrophe.\n\nThe loss of control over the Eternal Fleet is now inevitable. A significant number of Eternal Fleet units remain active. $Name_kuat$, claiming to suppress the Eternal Fleet, is very likely instead breeding them. They are playing with fire."
 kuat_origin.14.a:"Do you have information on other Watchers?"

 kuat_origin.15.desc:"ID: 114 verifying...\nVerification successful, data normal\n\nCurrently, no one within the Empire knows the builders of the Eternal Fleet. Imperial databases contain no relevant records. Perhaps the late Emperor knew their origin, but we cannot confirm. Due to the secrecy and danger of unknown Sectors and the current military situation, we cannot dispatch fleets to explore them.\n\nBased on our current research, the Eternal Fleet can resist nearly any weapon, but our §Rpowerful§! Star dreadnoughts can somewhat mitigate their impact. Therefore, prepare yourselves. You must stop $Name_kuat$, destroy the Eternal Fleet, and transfer its technical data to us. The technological achievements of the Eternal Fleet must never fall into $Name_kuat$'s hands."

 kuat_origin.15.a:"We want to know the status of Sector 110"
 kuat_origin.area_1:"ID: 114 verifying...\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other Watchers. The Eternal Fleet in Sector ID:110 has been almost completely cleared. The Watcher in that area has failed and been destroyed by $Name_kuat$."
 kuat_origin.15.b:"We want to know the status of Sector 111"
 kuat_origin.area_2:"ID: 114 Verifying......\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other watchers. The Eternal Fleet in region ID: 111 is rampaging. The watcher's mission in that region is ongoing, $Name_kuat$ has retreated."
 kuat_origin.15.c:"We want to know the status of Sector 112"
 kuat_origin.area_3:"ID: 114 Verifying......\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other watchers. The Eternal Fleet has not yet appeared in region ID: 112. The watcher's mission in that region is ongoing. $Name_kuat$ has begun clearing the watcher in this region; the mission is expected to fail."
 kuat_origin.15.d:"We want to know the status of Sector 113"
 kuat_origin.area_4:"ID: 114 Verifying......\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other watchers. The Eternal Fleet has not yet appeared in region ID: 113. No watcher has been selected for this region. $Name_kuat$ has retreated."


