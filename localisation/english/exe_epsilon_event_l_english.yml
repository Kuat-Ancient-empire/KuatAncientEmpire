  TIMELINE_EVENT_SHADOW_COPORUATION_05: "$kuat_fallen_mission_reaction_10_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_06_TOOLTIP: "Based on our field discoveries and partial technical schematics provided by $Name_kuat$, this component appears to be a core communications beacon from a massive Star Fortress, capable of broadcasting high-frequency tachyon signals for long-range communications — though it requires several (errors) to amplify the signal for intergalactic transmission."
  TIMELINE_EVENT_SHADOW_COPORUATION_06: "$kuat_fallen_mission_reaction_11_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_07_TOOLTIP: "This is a reactor that annihilates a type of exotic matter fuel, creating a miniature star within the reaction chamber to generate power. Unlike conventional exotic matter reactors, this reactor consumes the fuel directly, whereas standard versions extract higher-dimensional exotic matter via fuel-induced dimensional drops. This design achieves higher efficiency and energy output."
  TIMELINE_EVENT_SHADOW_COPORUATION_07: "$kuat_fallen_mission_reaction_12_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_08_TOOLTIP: "Unlike the typical style of $Name_kuat$, this vessel is entirely black and shaped like a horizontal T, though the front crossbar makes it resemble a cross, with propulsion units at the rear. Its main guns are mounted on the front crossbar, and the turrets can rotate freely. The ship's propulsion system is highly advanced, significantly faster than ours, and equipped with a cloaking generator."
  TIMELINE_EVENT_SHADOW_COPORUATION_08: "$kuat_fallen_mission_reaction_13_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_09_TOOLTIP: "Based on data provided by $Name_kuat$ and information we've uncovered... this may be an artificial intelligence command system designed and built by a superpower known as the Infinite Empire during a plague outbreak, in a desperate attempt to save their civilization. Allegedly, it was constructed at the cost of the life force of several species and several worlds."
  TIMELINE_EVENT_SHADOW_COPORUATION_09: "$kuat_fallen_mission_reaction_14_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_10_TOOLTIP: "This massive war fortress bears an uncanny resemblance to both our own war Fortresses and certain facilities belonging to Kuat, yet its subsystems and armaments appear significantly more advanced.\n\nCombat records between the Endodia Empire and those extragalactic drone fleets suggest these fortresses once appeared on battlefields, providing support to automated fleets. According to our research on interstellar communication beacons, these fortresses would continuously deploy reinforcements whenever those fleets invaded — unless three special facilities were deactivated."
  TIMELINE_EVENT_SHADOW_COPORUATION_10: "$kuat_fallen_mission_reaction_15_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_11_TOOLTIP: "$Name_kuat$ has informed us that some of their new designs require more energy, and out of trust and superficial friendliness toward us, they have chosen to entrust us with this energy regulation component for research.\nThis device is designed to optimize reactor output and conserve ship energy consumption. One wonders — what kind of energy-intensive technology would necessitate such a device?"
  TIMELINE_EVENT_SHADOW_COPORUATION_11: "$kuat_fallen_mission_reaction_16_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_12_TOOLTIP: "Similar to $Name_kuat$'s Star Dreadnoughts, this vessel serves as a fleet flagship and possesses certain anti-disruption capabilities. However, unlike Kuat's Super Star Destroyer design philosophy, this ship is equipped with only four previously researched superlasers, seemingly intended for long-range bombardment."
  TIMELINE_EVENT_SHADOW_COPORUATION_12: "$kuat_fallen_mission_reaction_17_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_RAKATA_LEGACY_01_TOOLTIP: "The imprisoned Rakata seer — he is the key to unlocking all mysteries of the Eternal Fleet. But what will be the cost?"
  TIMELINE_EVENT_RAKATA_LEGACY_01: "Mind Prison\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_01_TOOLTIP: "A strange signal emanating from a Gaia World — the beginning of everything lies here."
  TIMELINE_EVENT_KUAT_LEGACY_01: "$kuat_lagacy$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_02_TOOLTIP: "$kuat_lagacy$ has pointed us in a direction. What might await us at $kuat_lagacy_2$?"
  TIMELINE_EVENT_KUAT_LEGACY_02: "$kuat_lagacy_2$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_03_TOOLTIP: "This is clearly an interlocking chain of clues. Just like its predecessor, $kuat_lagacy_2$ now points us toward $kuat_lagacy_3$ in our search for the truth."
  TIMELINE_EVENT_KUAT_LEGACY_03: "$kuat_lagacy_3$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_04_TOOLTIP: "A place of great significance. $Name_F_1$ may conceal even deeper secrets. We must prepare ourselves."
  TIMELINE_EVENT_KUAT_LEGACY_04: "$Name_F_1$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_05_TOOLTIP: "$Name_B_1$, one of Endodia's former key facilities, now reduced to rubble. Oh, and we found some ship data in their graves? How bizarre — how has this not been looted by grave robbers yet?"
  TIMELINE_EVENT_KUAT_LEGACY_05: "$Name_B_1$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_06_TOOLTIP: "$Name_A_1$, one of Endodia's former key facilities, now nothing but ruins. Truly tragic. Surely there must be some strange legacy left behind here, right?"
  TIMELINE_EVENT_KUAT_LEGACY_06: "$Name_A_1$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_07_TOOLTIP: "$Name_C_1$, yet another former key facility of the Endodian Empire, now utterly destroyed. How completely devastated it is — rubble everywhere, yet still containing technologies that were never stolen?\nIndeed, we must truly be the chosen ones!"
  TIMELINE_EVENT_KUAT_LEGACY_07: "$Name_C_1$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_08_TOOLTIP: "So that is what transpired: manipulated by $Name_Kuat_Fire_base$, the Endodian Empire launched a rash surprise attack that caught $Name_kuat$ off guard; yet by the time $Name_kuat$ rallied to retaliate, the Endodian Empire had already been crippled by the Eternal Fleet drawn to the fray."
  TIMELINE_EVENT_KUAT_LEGACY_08: "$kuat_legacy_kuat$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_12_TOOLTIP: "$Name_D_1$, perhaps the last remaining system of the Endodian Empire that can still be patched up? One must admit, stellar hubs are incredibly useful."
  TIMELINE_EVENT_KUAT_LEGACY_12: "$Name_D_1$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_13_TOOLTIP: "$kuat_lagacy_1$, the Infinite Empire — a civilization buried by history. Sadly, beyond these traces, nothing else remains."
  TIMELINE_EVENT_KUAT_LEGACY_13: "$kuat_lagacy_1$\n§L[GetDate]§!"

  TIMELINE_EVENT_KUAT_LEGACY_14_TOOLTIP: "$kuat_lagacy_11$, another ruin of the Infinite Empire. There's even a colonial management AI still functioning? It seems the Infinite Empire held many secrets. Unfortunately, none of them are accessible now."
  TIMELINE_EVENT_KUAT_LEGACY_14: "$kuat_lagacy_11$\n§L[GetDate]§!"

  TIMELINE_EVENT_GALATIC_COUNCIL_LEAGACY_01_TOOLTIP: "$Name_D_1$, perhaps the last remaining system of the Endodian Empire that can still be patched up? One must admit, stellar hubs are incredibly useful."
  TIMELINE_EVENT_GALATIC_COUNCIL_LEAGACY_01: "$Name_D_1$\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_ROUTINS_01_TOOLTIP: "We have established contact with a combat unit from the Eternal Fleet and initiated investigation and negotiation procedures. This is an unprecedented path. Unfortunately, we cannot keep her."
  TIMELINE_EVENT_ETERNAL_ROUTINS_01: "Unprecedented Path\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_ROUTINS_02_TOOLTIP: "We have solved the puzzle sealing the Stellar Forge. From now on, the Stellar Forge will provide the strongest possible support for our upcoming operations!"
  TIMELINE_EVENT_ETERNAL_ROUTINS_02: "Stellar Forge\n§L[GetDate]§!"
