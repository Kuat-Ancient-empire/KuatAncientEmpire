l_english:
  #origin
  kuat_support_class_arrived_desc: "The empire's §Hflagship fleet§! deployed from the capital has arrived at $capital_planet|H$"
  origin_kuat_apocalyptic: "§E<The Dawn of Kuat> Apocalypse§!"
  origin_kuat_apocalyptic_desc: "The radiance of $Name_Kuat_Fire_base$ once enveloped all our worlds — sublime, yet supremely arrogant. Beneath its cold glare, we could only struggle to survive, carving out a narrow shadow of our own to escape the cruelty of that blinding light. Now, we must fulfill our covenant to claim our true freedom."
  origin_tooltip_kuat_apocalyptic_effects: "§HThis is a narrative origin. We will explore the shadows hidden in the past, pursue mysteries beyond the veil of the stars, and uncover our true destiny.§!\nStart in an §EIsolated Cluster§!.\n\nThis origin belongs to the main storyline of 'The Dawn of Kuat'."
  origin_kuat_shadow:0 "§E<The Dawn of Kuat> Beneath the Shadow§!"
  origin_kuat_shadow_desc:0 "The shadow of $Name_kuat$ once enveloped all our worlds — sublime, yet supremely arrogant. Beneath its cold darkness, we could only struggle to survive, kindling a faint light of our own to endure the cruelty of its dominion. Now, we shall forge our own glory with our own hands — our story has only just begun."
  origin_tooltip_kuat_shadow_effects:0 "§HThis is a narrative origin. We will explore the shadows hidden in the past, pursue mysteries beyond the veil of the stars, and uncover our true destiny.§!\nStart in a §Efixed trinary star system§!.\nThe starting system contains a $think_tank_ruined$, a $dyson_sphere_ruined$, and a $matter_decompressor_ruined$.\n§RWe will lose all starting fleets.§!\n\nThis origin belongs to the main storyline of 'The Dawn of Kuat'."
  kuat_origin_system_NAME:0 "§ESupreme§!"
  kuat_origin_system_DESC:1 "A pioneer species' star system located within a rare spatial rift. Dimensional turbulence, once common here, made space extremely unstable. However, the pioneers used special means to establish a stable stellar environment. From here, our journey begins."
  d_str_kuat_spring: "§EPioneer City§!"
  d_str_kuat_spring_desc: "A massive city forged by the pioneers."
  START_SCREEN_KUAT_ORIGIN: "Our [GetSpeciesName] species' origins are lost to history; our records have suffered a rupture. We can only struggle to survive. Now, with the help of $Name_Kuat_Fire_base$, we have fully secured control over [GetHomeWorldName].\n\nLooking back, the radiance of $Name_Kuat_Fire_base$ once covered all our worlds. It was both sublime and supremely arrogant. Under its cold light, we barely survived, striving to create a small shadow of our own to escape the cruelty of that brilliance. Now, we must fulfill our covenant to gain true freedom."
  origin_kuat_trigger_first: "§ERequires both Ancient Empire and Kuat Ancient Empire to be enabled.§!"
  tech_kuat_databank: "$building_kuat_databank$"
  tech_kuat_databank_desc: "A structure containing construction techniques for all ship designs from Kuat's shipyards. Though we lack the actual shipbuilding technology, advanced equipment can boost our research capabilities."
  tech_kuat_resource_center: "$building_kuat_resource_center$"
  tech_kuat_resource_center_desc: "Kuat can acquire vast resources through transdimensional translocation. This technology will greatly enhance our resource acquisition."
  tech_kuat_shield: "$building_kuat_shield$"
  tech_kuat_shield_desc: "Kuat's planetary shield technology. Using these specially designed shields, they can withstand nearly all orbital bombardments."
  tech_kuat_ground_yards: "$building_kuat_ground_yards$"
  tech_kuat_ground_yards_desc: "Kuat has not only achieved great heights in space-based shipbuilding, but also developed powerful and highly practical technologies for ground-based shipyards. These advancements will provide stable support for our ship production."
  tech_kuat_command_center: "$building_kuat_command_center$"
  tech_kuat_command_center_desc: "Kuat once used this anti-gravity technology to construct magnificent aerial command centers. Now, once we complete this research, we can locally reconfigure and build our own aerial command center on a world."

  ########################
  #######decision#########
  ########################
  Firing_The_StarKiller: "§E$kuat_starkillerbase_1$ firing"
  Firing_The_StarKiller_desc: "We will activate our $kuat_starkillerbase_1$"
  Firing_The_StarKiller_tooltip: "$kuat_starkillerbase_1$ will activate"
  Building_The_Kuat_Command_Line: "§EConstruct $building_kuat_command_center$"
  Building_The_Kuat_Command_Line_desc: "We will construct a magnificent galactic central building!"
  Building_The_Kuat_Command_Line_Auto_planet: "§EConstruct Automated Data Hub§!"
  Building_The_Kuat_Command_Line_Auto_planet_desc: "We will construct a magnificent galactic central world! Supported by distributed server arrays, all inhabitants of the world will efficiently serve the nation within the data realm, and industrial activities will be fully managed by intelligent AI systems."
  Building_The_Kuat_AI_Command_Line_Auto_planet: "§EUpgrade Automated Data Hub§!"
  Building_The_Kuat_AI_Command_Line_Auto_planet_desc: "$Building_The_Kuat_Command_Line_Auto_planet_desc$"
  Bulding_kuat_auto_planet_focus_target:0 "§ESet Focus"
  Bulding_kuat_auto_planet_focus_target_desc:0 "The Automated Data Hub stores vast amounts of information across the entire world. Setting a focus center will elevate the core status of this galactic central building, allowing it to receive data migration from other data centers."
  building_kuat_command_center_target_desc:0 "Set this Automated Data Hub as the focal data center"
  Bulding_kuat_auto_planet_focus_remove_target:0 "§ERemove Focus"
  Bulding_kuat_auto_planet_focus_remove_target_desc:0 "The Automated Data Hub stores vast amounts of information across the entire world. Removing the focus will prevent this data center from receiving data migrations from other centers."
  building_kuat_command_center_remove_target_desc:0 "This Automated Data Hub is no longer serving as the focal data center."
  Building_kuat_auto_planet_migrant_data:0 "§EMigrate Data"
  Building_kuat_auto_planet_migrant_data_desc:0 "The Automated Data Hub stores vast amounts of information across the entire world. Data migration allows this world's data to be transferred to the focal data center with minimal loss."
  Building_kuat_auto_planet_migrant_data_failed:0 "Data migration is currently in progress; bandwidth cannot support a second world migrating data."
  building_kuat_command_center_migrant_data_desc:0 "Pops' industrial data from the world will be fully migrated to the focal data center, and the planetary colony will be abandoned!"
  Building_The_Kuat_Shield: "§EActivate $building_kuat_shield$§!"
  building_kuat_shield_tooltip: "§EThis will activate $building_kuat_shield$. $building_kuat_shield$ will operate for 720 days. During operation, the world will not suffer bombardment.§!"
  Building_The_Kuat_Shield_desc: "$building_kuat_shield_tooltip$"
  Destroy_The_Kuat_Shield: "§EDeactivate $building_kuat_shield$§!"
  Destroy_The_Kuat_Shield_desc: "§EThis will deactivate $building_kuat_shield$§!"
  Destroy_The_Kuat_Shield_tooltip: "$Destroy_The_Kuat_Shield_desc$"
  we_can_not_get_support_now: "The Navy cannot spare any additional fleets at the moment. Please try again later!"

  kuat_diplomatic.1.desc:0 "O forgotten ones, you have been most fortunate to be chosen as our Watchers in this place. We shall provide you with every necessary support, and you must complete the tasks we demand.\n\nYour past is a fog of mystery, but now there is hope for clarity. As you fulfill your mission, you shall uncover your own history. This beginning requires only that you Watch $Name_kuat$ and excavate the secrets they hide within this star region.\n\nThis is your duty as Watchers, your obligation. Should you successfully complete your mission, we shall dissolve the Watcher Contract. Then, everything here shall belong to you."
  kuat_diplomatic.1.a:0 "Can we even refuse?"
  kuat_diplomatic.1.a.res: "Clearly not. We shall be watching you always. We have left you this isolated star region, together with facilities formerly belonging to $Name_kuat$ and a portion of their fleet, along with Imperial Credit Points—all are yours now.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.2.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.2.desc:0 "You've done very well. We have received reports of your recent activities. Your timely reports prove we were not mistaken in choosing you.\n\nThese ruins were once shelters of the Endodia Empire—a most prosperous civilization. We and $Name_kuat$ once had dealings with them. Who would have thought that after all this time, they would come to this—you have seen it yourself, destroyed by $Name_kuat$'s Star Destroyers."
  kuat_diplomatic.2.a:0 "Why destroy this place?"
  kuat_diplomatic.2.a.res:0 "Who can say? Perhaps war is ruthless, and they were simply swept away. These Imperial Credit Points are yours.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.3.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.3.desc:0 "You've done very well. We have received reports of your recent activities.\n\n\"Cloud City\" was also one of the Endodia Empire's shelters. These people once formed the backbone of resistance against $Name_kuat$'s aggression. After their defeat on the front lines, they were forced to establish these refuges, hoping to rise again. Regrettably, they failed nonetheless."
  kuat_diplomatic.3.a:0 "What was this war all about?"
  kuat_diplomatic.3.a.res:0 "War? It is merely an expression of interest—and the secrets hidden within are what you must uncover. As we have said, this is your destiny. In any case, these Imperial Credit Points are yours.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.4.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.4.desc:0 "You've done very well. We have received reports of your recent activities.\n\n\"Ocean World\" was once one of the secret facilities built by the Endodia Empire. Unfortunately, there is nothing of valuable information here—you clearly did not find anything that caught our interest. These facilities were merely places where remnants of the Endodia fled."
  kuat_diplomatic.4.a:0 "What do you mean? Nothing valuable?"
  kuat_diplomatic.4.a.res:0 "Indeed, you have not yet found anything truly valuable. Though you found no significant information, given your enthusiastic attitude, these Imperial Credit Points are yours.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.6.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.6.desc:0 "You've done very well. We have received reports of your recent activities.\n\nWe did not expect you to discover this place. It was built during the war between the Endodia Empire and $Name_kuat$. They used this facility to secretly research the encryption system of Jump Gates, attempting to launch a surprise attack on $Name_kuat$.\n\nRegrettably, they succeeded—but only in war. In the end, this place could only serve as a shelter, storing some outdated data."
  kuat_diplomatic.6.a:0 "Why do these recorded data resemble the cataclysm that befell our ancestors before they established their civilization?"
  kuat_diplomatic.6.a.res:0 "Resemblance? Perhaps you truly do have some connection to the Endodia Empire. But whatever the case, do your work. We have been watching you.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.5.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.5.desc:0 "You've done very well. We have received reports of your recent activities.\n\nYou have actually found more information regarding the Endodia Empire. This region's existence confirms the Endodia Empire's destruction is indeed related to the secrets $Name_kuat$ conceals within this star sea. We look forward to your next report."
  kuat_diplomatic.5.a:0 "Yes, understood."
  kuat_diplomatic.5.a.res:0 "These are yours.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.7.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.7.desc:0 "You've done very well. We have received reports of your recent activities.\n\nThis information, hm? The Infinite Empire—how could these relics of a bygone era leave traces here? In any case, you've done excellently this time. The Infinite Empire is not something you should concern yourself with. Pay it no mind."
  kuat_diplomatic.7.a:0 "Yes, understood."
  kuat_diplomatic.7.a.res:0 "These are yours.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.8.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.8.desc:0 "Cease reports regarding the Infinite Empire. Your focus should not be there.\n\nThis information is not for you to decipher."
  kuat_diplomatic.8.a:0 "Yes, understood."
  kuat_diplomatic.8.a.res:0 "These are yours.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.9.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.9.desc:0 "You've done very well. We have received reports of your recent activities.\n\nThe fall of $Name_A_1$ is most regrettable. This facility was once one of the fierce battlefields where the Endodia Empire and $Name_kuat$ clashed. Upon this fortress, countless warships lie dormant. Both $Name_kuat$ and Endodia suffered severe losses in this battle. Within $Name_A_1$ there may also be important strategic fortress blueprints of the ancient Endodia Empire. Find them, and you shall understand what the cataclysm your ancestors spoke of truly was."
  kuat_diplomatic.9.a:0 "Cataclysm? Could the Endodia Empire truly be our past?"
  kuat_diplomatic.9.a.res:0 "Yes. The Endodia Empire's destruction left multiple branches of survivors—and you are one of them. We chose you as a Watcher. This is also your destiny.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.10.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.10.desc:0 "You've done very well. We have received reports of your recent activities.\n\n$Name_B_1$ is extremely similar to $Name_A_1$. After the fall of $Name_A_1$, the Endodia Empire shifted their defensive focus to $Name_B_1$. This fortress not only halted $Name_kuat$'s advance but also conceals certain secrets the Endodia had yet to complete. Your next task is to retrieve these and return them to us."
  kuat_diplomatic.10.a:0 "Yes, understood. (But why should we return them to you?)"
  kuat_diplomatic.10.a.res:0 "This is our demand, also your obligation. You have no right to question. Go and do it.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.11.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.11.desc:0 "You've done very well. We have received reports of your recent activities.\n\n$Name_C_1$—we did not expect them to actually have $Name_C_1$. Could they be planning to label all 26 letters? Such is the legacy of the storied Endodia Empire. Even after their fall, they left behind so many legacies. You must conduct a thorough sweep of this facility. Everything you find must be returned to us."
  kuat_diplomatic.11.a:0 "Y-yes."
  kuat_diplomatic.11.a.res:0 "You are far more efficient than any Watcher we have previously contracted. Keep up the good work. Liberation draws near.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.12.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.12.desc:0 "You've done very well. We have received reports of your recent activities.\n\nThe ancient Endodia seers no longer recognize you, but your past has been confirmed. $Name_kuat$ destroyed Endodia, simply because Endodia touched their interests. Now we need you to prepare. It is time for $Name_kuat$ to answer."
  kuat_diplomatic.12.a:0 "Yes, understood."
  kuat_diplomatic.12.a.res:0 "Perhaps you feel we are using you. But the Watcher Protocol has also brought tremendous support for your development. Focus on your own affairs. We will not mistreat you.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.13.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.13.desc:0 "You've done very well. We have received reports of your recent activities.\n\nIt turns out the Endodia Empire had hidden this place too. $Name_kuat$ calculated all possibilities, yet somehow forgot this one. Within $Name_D_1$ there is actually a coordinate for one of our garrison fleets. The garrison commander should not recognize you—but you may go and prove your identity to them. They shall make the correct choice."
  kuat_diplomatic.13.a:0 "The correct choice?"
  kuat_diplomatic.13.a.res:0 "A most correct choice. Go.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"

  kuat_diplomatic.14.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.14.desc:0 "Damn it, how did you find this place?\n\nThere are impurities within the Endodia Empire. Seal off $Name_F_1$ and do not attempt to communicate with Them — these devils will bring disaster upon you, and even the entire galaxy.\n\nFor future security, we will dispatch forces to take control of this sector."
  kuat_diplomatic.14.a:0 "Is that so"
  kuat_diplomatic.14.a.res:0 "You must abandon any thought of communicating with them; this is the most dangerous place.\n\nCurrent empire credits: [Root.eternal_bornus_var]"

  kuat_diplomatic.15.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.15.desc:0 "You have done very well — we have received the reports of your recent operations.\n\nYou actually engaged $Name_kuat$ in battle? Truly remarkable. Driving $Name_kuat$ back ensures that the Eternal Fleet will advance into this sector unimpeded.\n\nHowever, do not let your guard down. $Name_kuat$ has not been defeated — you have merely repelled a few of their regular garrison fleets. They will return."
  kuat_diplomatic.15.a:0 "$Name_kuat$? They'll come back?"
  kuat_diplomatic.15.a.res:0 "Yes, $Name_kuat$ will return. But before that happens, consider how you'll deal with the approaching Eternal Fleet. These were once the Emperor's sharp blades, now reduced to barely surviving in this state."

  kuat_diplomatic.16.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.16.desc:0 "You've done very well — we have received reports of your recent activities.\n\nWe didn't expect you'd already be capable of defeating the Eternal Fleet. With that accomplished, you should now possess enough strength to face $Name_kuat$'s return. The long-standing conflict between the $Name_kuat$ Empire and the Endodia Empire may finally end with you. The data from the Eternal Fleet has proven immensely helpful, revealing $Name_kuat$'s intentions to establish forward bases across multiple outer sectors."
  kuat_diplomatic.16.a:0 "We will drive them away."
  kuat_diplomatic.16.a.res:0 "Do not forget — you are still Watchers. You must uncover the secrets $Name_kuat$ researched here. We need more information about the Eternal Fleet."

  kuat_diplomatic.17.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.17.desc:0 "You've done very well — we have received reports of your recent activities.\n\nIt appears $Name_kuat$ used the pretext of hunting the Eternal Fleet to secretly attempt control over it — their malicious intent is now clear. Fortunately, we outmaneuvered them. Before retreating, $Name_kuat$ granted you full access to their technology and facilities. You should hand all of this over to us. $Name_Kuat_Fire_base$ will reassess your merits. The new Endodia Empire shall surely be yours."
  kuat_diplomatic.17.a:0 "What $Name_kuat$ left behind was meant for us to fight the Eternal Fleet."
  kuat_diplomatic.17.a.res:0 "Indeed. Otherwise, how could you possibly resist a full-scale invasion by the Eternal Fleet? These fleets were $Name_kuat$'s primary research subjects. Now, use $Name_kuat$'s legacy to defeat the Eternal Fleet, then return everything to us.\n\nCurrent empire credits: [Root.eternal_bornus_var]"

  kuat_diplomatic.18.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.18.desc:0 "You have done very well — we have received the reports of your recent operations.\n\nYou have not only repelled $Name_kuat$, but also triumphed over the Eternal Fleet. All of $Name_kuat$'s research data on the Eternal Fleet has been uploaded to our database, and your mission as Watchers is now complete. You have grown so much like the old Endodian Empire — and even stronger than they once were. Yet we will never allow the Endodian Empire to rise from its grave. It is time to bring this to an end, 'New Endodian Empire.'\n\nOf course, unlike $Name_kuat$, we will not exterminate you; we are simply reclaiming everything we once bestowed upon you."
  kuat_diplomatic.18.a:0 "What do you mean? What are you going to do?"
  kuat_diplomatic.18.a.res:0 "Farewell, our friends. The Watcher Protocol will soon be deactivated. Enjoy this final freedom."

  kuat_diplomatic.19.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.19.desc:0 "You've done very well — we have received reports of your recent activities.\n\nYou made a surprising choice — one we did not expect. Defying $Name_kuat$'s demands places you on a path few have dared to walk."
  kuat_diplomatic.19.a:0 "Is that right?"
  kuat_diplomatic.19.a.res:0 "At least according to our records, very few civilizations have chosen this path. Those who did previously all failed. Yet you have once again defeated the Eternal Fleet, proving you may forge an entirely new path. We look forward to your discoveries along this road — but your time is short."

  kuat_diplomatic.20.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.20.desc:0 "Do not come here again. Our fleet has sealed off $Name_F_1$.\n\nYou should go do what you were meant to do!"

  Name_G_1: "§EVoid Forbidden Zone (G)§!"
  Name_H_1: "§ELost Forbidden Zone (H)§!"
  misc_system_desc_8: "$Name_G_1$"
  misc_system_desc_9: "$Name_H_1$"
  kuat_legacy_key_world_8_desc: "A strange star system, an odd star, bizarre structures — as if detached from the universe's natural laws. We cannot determine what lies hidden here. $Name_Kuat_StarContractor$ tells us this system is a relic of the ancient Abyss, a fragment broken off from the Abyss itself, concealing secrets from beyond the Abyss."
  kuat_legacy_key_world_9_desc: "A buried, forgotten star system — once the glory of the Endodia Empire, now reduced to ruins and hidden facilities lurking in darkness. How much more remains unknown? $Name_Kuat_StarContractor$ says this was the region where the Endodia resistance detonated Subspace energy seals. Why did they seal it? Was it due to war with $Name_kuat$? The truth remains to be uncovered."
  exe_outer_gate_G_facility: "§EAbyss Node§!"
  exe_outer_gate_G_facility_DESC: "An unknown construct, likely a research facility from the Abyss, broken free and standing in this space for eons. Beyond its vast research infrastructure, its advanced equipment possesses powerful astronomical observation capabilities within this supercluster — equivalent to a complete research hub."
  exe_outer_gate_G_facility_completed:0 "§EAbyss Node§!"
  exe_outer_gate_G_facility_completed_DESC: "An unknown construct, likely a research facility from the Abyss, broken free and standing in this space for eons. Beyond its vast research infrastructure, its advanced equipment possesses powerful astronomical observation capabilities within this supercluster — equivalent to a complete research hub."
  exe_enable_the_F_system_line_stage_5:0 "§ETrack the Mysterious Vessel§!"
  exe_enable_the_F_system_line_stage_5_DESC: "With additional assistance, our team is advancing the pursuit of the mysterious vessel's trail. If successful, we will obtain its jump destination coordinates. Once acquired, we should attempt to travel there and uncover the source of all this."
  exe_enable_the_F_system_line_stage_7:0 "§E$Name_Kuat_StarContractor$: Upload Data§!"
  exe_enable_the_F_system_line_stage_7_DESC: "To continue our exploration, we must follow $Name_Kuat_StarContractor$'s instructions and upload the data into $Name_Kuat_StarContractor$'s database. It remains unclear why They require this data."
  exe_enable_the_F_system_line_stage_8:0 "§E$Name_Kuat_StarContractor$: Upload Data§!"
  exe_enable_the_F_system_line_stage_8_DESC: "To continue our exploration, we must follow $Name_Kuat_StarContractor$'s instructions and upload the data into $Name_Kuat_StarContractor$'s database. It remains unclear why They require this data."
  exe_enable_the_F_system_line_stage_9:0 "§ERepair Abyss Node§!"
  exe_enable_the_F_system_line_stage_9_DESC: "Based on data and blueprints recovered from the Abyss Node, we have mastered its repair methods. Additionally, we've discovered the secret of a superweapon located atop the node's spire. To harness this war-altering weapon's strength, we must repair and reactivate this massive node."
  exe_enable_the_F_system_line_stage_10:0 "§EImplant Installation Test§!"
  exe_enable_the_F_system_line_stage_10_DESC: "In a neuro-modification industry focused on specialization, cerebral enhancement implants are rare anomalies. They offer multiple benefits: enhancing perception by interfacing with the occipital lobe, while influencing the neocortex to improve information processing. When multiple implants form a neural implant network, their performance increases significantly.\n\nOur scientists are pioneers. Let us await the results of this trial."
  exe_enable_the_F_system_line_stage_11:0 "§EImplant Installation Rollout§!"
  exe_enable_the_F_system_line_stage_11_DESC: "In a neuro-modification industry focused on specialization, cerebral enhancement implants are rare anomalies. They offer multiple benefits: enhancing perception by interfacing with the occipital lobe, while influencing the neocortex to improve information processing. When multiple implants form a neural implant network, their performance increases significantly.\n\nThe trial's success proves the implant's safety. Now, we can expand its application."
  exe_enable_the_F_system_line_stage_12:0 "§EDecipher Residual Data§!"
  exe_enable_the_F_system_line_stage_12_DESC: "In memory of [kuat_leader_save_planet.GetName]:\n\nIn the distant reaches of deep space, amidst the shrouded Abyss, our great scientist [kuat_leader_save_planet.GetName] gave her life. With extraordinary wisdom and fearless resolve, she led our expedition into the uncharted void.\n\nThough she has departed, we shall forever honor her sacrifice — and ensure it was never in vain. The miracle she bought with her life shall become the decisive catalyst that tips the scales of future crises and guides us toward glory."
  exe_enable_the_F_system_line_stage_13:0 "§E$Name_Kuat_StarContractor$: Upload Data§!"
  exe_enable_the_F_system_line_stage_13_DESC:0 "Transmit the data to $Name_Kuat_StarContractor$. They will provide us with answers. Behind Subspace blockade, we might find more information about the ancient Endodia Empire."
  exe_enable_the_F_system_line_stage_14:0 "§E$Name_Kuat_StarContractor$: Download Data§!"
  exe_enable_the_F_system_line_stage_14_DESC:0 "$Name_Kuat_StarContractor$ has provided the solution to the Subspace blockade, though we must first decode the transmitted data before putting it into practice. Now is the time to redouble our efforts.\n\nDo any Endodians still survive within? What truly transpired in the final days of the Endodian Empire? We shall soon unearth the long — buried secrets of Endodia."
  exe_enable_the_F_system_line_stage_15:0 "§EEndodia: Data Analysis§!"
  exe_enable_the_F_system_line_stage_15_DESC:0 "$Name_Kuat_StarContractor$ has revealed the method to resolve Subspace energy anomaly. Now is the time to act — stabilize the state of this lost stellar ring, collapse the pale purple Subspace currents into a stable state, and uncover the forgotten secrets of the Endodia Empire."

  kuat_origin.8.name: "§EEternal War"
  kuat_origin.8.desc: "Ever since we signed the Watcher Covenant with $Name_Kuat_Fire_base$, their gaze has never left us. Now, the Eternal Fleet — the ancient war machine upon which $Name_kuat$ placed such high hopes — is about to arrive. We must fulfill our covenant duty and uncover the secrets $Name_kuat$ concealed behind these fleets.\n\nOnce we complete the repairs to the $StarForge$, the resonance signal emitted by the $StarForge$ will synchronize with our deployed relay stations, forming a sector-wide array that will force the hidden Eternal Fleet out of the shadows. The main force of the Eternal Fleet is now closing in on our defensive lines. Imperial High Command has made its orders clear: we must annihilate these rampant war machines and seize their core technology at any cost, or we will have no way to answer to $Name_Kuat_Fire_base$.\n\nAll units, go to Condition One — prepare for combat!"
  kuat_origin.8.flag.desc: "After tireless effort, our nation's scientists have successfully broken through the ancient Rakatan lockouts sealing the $StarForge$. The characteristics of this Stellar Forge match Kuat's archives to the letter — its tachyon signal resonance frequency mirrors that of the Eternal Fleet, meaning we can use this megastructure to lure the Eternal Fleet into the open and destroy them in one fell swoop.\n\nIn ages past, countless explorers and scholars grew obsessed with the $StarForge$, and even the arrogant Kuat were no exception; seduced by the power of the $StarForge$, they were ultimately dragged into the abyss of destruction by the $StarForge$ itself. Only we have proven worthy of mastering this super-fortress! Now that the entire $StarForge$ is under our complete control, we shall crush the incoming Eternal Fleet with far greater ease."
  kuat_origin.8.eternal.desc: "After tireless effort, our nation's scientists have successfully broken through the ancient Rakatan lockouts sealing the $StarForge$. The reactivation of this Stellar Forge marks the beginning of our full mastery over Rakatan precursor technology.\n\nIn ages past, countless explorers and scholars grew obsessed with the $StarForge$, and even the Kuat and the Rakata themselves were no exception.\n\nSeduced by the power of the $StarForge$, they were ultimately dragged into the abyss of destruction by the $StarForge$ itself. Only we have proven worthy of mastering this super-fortress! Now that the entire $StarForge$ is under our complete control, we shall crush our enemies with effortless might."
  kuat_origin.8.a: "For the Future"
  kuat_origin.9.title: "$Name_Kuat_Fire_base$"
  kuat_origin.9.desc: "Connecting...\nID: 114\nConnection successful\n\nWatcher ID 114, system status confirmed normal. What is your request this time?\n$Name_Kuat_Fire_base$ will provide maximum support to all sector watchers."
  kuat_origin.9.a: "We need support."
  kuat_origin.9.b: "What is our mission?"
  kuat_origin.9.c: "We need intelligence on the Eternal Fleet."

  kuat_origin.10.desc: "ID: 114 verifying...\nVerification successful, data normal\n\n$Name_Kuat_Fire_base$ will provide the following fleet reinforcement packages based on your current situation. You must supply sufficient Imperial Credit Points. Note that $Name_Kuat_Fire_base$ has issued mission requirements — you must complete them promptly. All strength must be devoted to fulfilling your obligations.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]\nCredits are only awarded upon completion of stage reports."

  kuat_origin.10.a: "Artillery Flagship Fleet"
  kuat_origin.10.a.fail: "Our current Imperial Credit Points do not exceed 30"
  kuat_origin.10.b: "Missile Flagship Fleet"
  kuat_origin.10.b.fail: "Our current Imperial Credit Points do not exceed 30"
  kuat_origin.10.d: "Carrier Flagship Fleet"
  kuat_origin.10.d.fail: "Our current Imperial Credit Points do not exceed 30"
  kuat_origin.10.c: "Super Flagship Fleet"
  kuat_origin.10.c.fail: "Our current Imperial Credit Points do not exceed 90"

  kuat_origin.11.desc: "ID: 114 verifying...\nVerification successful, data normal\n\n$Name_Kuat_Fire_base$ has accepted your intelligence. $Name_kuat$ has acted unusually in the Imperial Assembly — instead of demanding status as before, they are now actively withdrawing from the main sector. These behaviors are highly abnormal. Through our intelligence network, we have discovered $Name_kuat$'s intentions: they are attempting to excavate or study some ancient legacy in your star system and use it as leverage against us.\n\n$Name_Kuat_Fire_base$ will never allow this to happen. We have chosen you — you must serve us. Perform your duties as Watcher and regularly report any research clues related to $Name_kuat$ here. In return, you will receive unimaginable rewards once everything concludes."
  kuat_origin.11.a: "We need intelligence on $Name_kuat$."
  kuat_origin.11.b: "Are we the only ones?"

  kuat_origin.12.desc: "ID: 114 verifying...\nVerification successful, data normal\n\n$Name_kuat$ originated as a warlord oligarchy that rose after the collapse of the First Empire. They are an illegal separatist force. After the Emperor's death, these factions seized military power, established their own territories and fleets, and not only rejected governance by the Imperial government but also attempted to seize our authority. This is unacceptable to $Name_Kuat_Fire_base$. Only an Imperial government controlled by $Name_Kuat_Fire_base$ can bring order and prosperity to the Empire. They will only destroy it all.\n\nYou don't need to know so much. Just do what you're supposed to do. We won't treat you poorly."
  kuat_origin.12.a: "Understood."
  kuat_origin.12.a.respon: "We will keep watching you."

  kuat_origin.13.desc: "ID: 114 verifying...\nVerification successful, data normal\n\nYou are not the first, nor will you be the last. $Name_kuat$'s exploration fleets span multiple unknown sectors. small like yours are everywhere. Wherever $Name_kuat$ exists, there will be our Watchers."
  kuat_origin.13.a: "We will complete the mission."
  kuat_origin.13.a.respon: "We will keep watching you. Here, take these useless scraps."

  kuat_origin.14.desc: "ID: 114 verifying...\nVerification successful, data normal\n\nThe Eternal Fleet is an ancient armada constructed on the world of Iokath and operated entirely by a sentient AI network. Its creators, the Infinite Empire, perished eons ago. Our late Emperor once commanded the Eternal Throne and brought a portion of the Eternal Fleet into the service of the Galactic Empire. Drawn by its unique AI combat architecture, both we and $Name_kuat$ conducted extensive studies on the fleet, integrating Imperial technology into its vessels and deploying them to crush rebel forces.\n\nAs expected, the fleet achieved overwhelming victories against regional warlords and insurgents alike. Tragically, following the Emperor's death, the Eternal Fleet went rampant and sought to annihilate all life in its path — a catastrophe brought about by $Name_kuat$'s own incompetence when they allowed rebel infiltrators to steal their warship blueprints.\n\nNow, the rampage of the Eternal Fleet is irreversible, and vast numbers of its warships still prowl the stars. Though $Name_kuat$ claims to be hunting them down, intelligence suggests they are secretly attempting to breed and harness them instead. They are playing with fire."
  kuat_origin.14.a: "Do you have information on other Watchers?"

  kuat_origin.15.desc: "ID: 114 verifying...\nVerification successful, data normal\n\nCurrently, no one within the Empire knows the builders of the Eternal Fleet. Imperial databases contain no relevant records. Perhaps the late Emperor knew their origin, but we cannot confirm. Due to the secrecy and danger of unknown sectors and the current military situation, we cannot dispatch fleets to explore them.\n\nBased on our current research, the Eternal Fleet can resist nearly any weapon, but our §Rpowerful§! Star Dreadnoughts can somewhat mitigate their impact. Therefore, prepare yourselves. You must stop $Name_kuat$, destroy the Eternal Fleet, and transfer its technical data to us. The technological achievements of the Eternal Fleet must never fall into $Name_kuat$'s hands."

  kuat_origin.15.a: "We want to know the status of Sector 110"
  kuat_origin.area_1: "ID: 114 verifying...\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other Watchers. The Eternal Fleet in Sector ID:110 has been almost completely cleared. The Watcher in that area has failed and been destroyed by $Name_kuat$."
  kuat_origin.15.b: "We want to know the status of Sector 111"
  kuat_origin.area_2: "ID: 114 Verifying......\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other watchers. The Eternal Fleet in region ID: 111 is rampaging. The watcher's mission in that region is ongoing, $Name_kuat$ has retreated."
  kuat_origin.15.c: "We want to know the status of Sector 112"
  kuat_origin.area_3: "ID: 114 Verifying......\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other watchers. The Eternal Fleet has not yet appeared in region ID: 112. The watcher's mission in that region is ongoing. $Name_kuat$ has begun clearing the watcher in this region; the mission is expected to fail."
  kuat_origin.15.d: "We want to know the status of Sector 113"
  kuat_origin.area_4: "ID: 114 Verifying......\nVerification successful, data normal\n\nAccording to protocol, you have the right to know the status of other watchers. The Eternal Fleet has not yet appeared in region ID: 113. No watcher has been selected for this region. $Name_kuat$ has retreated."


