  TIMELINE_EVENT_ENDODIA_LEGACY_03_TOOLTIP:"§EOmen of Shadows§!, the Endoria Empire once reached this point, and how far will we walk into the darkness? What secrets of $Name_kuat$ remain unknown to us? Movements from beyond the dark grow ever clearer-crisis is imminent."
