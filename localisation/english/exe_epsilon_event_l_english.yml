 kuat_epsilon_other_building_unlock:0 "§ESearch the Unknown Sector Archive§!"
 kuat_epsilon_other_building_unlock_DESC:0 "A faint but peculiar tachyon signal can be detected above the geometric center of an archive discovered within §H[kuat_ancient_epsilon_star.GetName]§!, too weak for us to decipher its contents.\n\nWe need to search the archive and attempt to interpret this signal, but it will take additional time to resolve this issue."
 kuat_epsilon_unlock_shield_world:0 "§EActivate Tachyon Signal Jamming System§!"
 kuat_epsilon_unlock_shield_world_DESC:0 "Faint but unusual tachyon signals can be detected above the geometric centers of multiple shield bands distributed across §H[kuat_ancient_epsilon_star.GetName]§!.\n\nWe must establish a tachyon signal jamming system to disable the shield bands, search them, and identify the source of these signals-though resolving this will require more time.\n\n§RDue to unstable shield energy, we must evacuate all ships from orbit around these rings, or face severe consequences!§!"
 kuat_epsilon_ringworld_1_site:0 "§EResearch Findings§!"
 kuat_epsilon_ringworld_1_site_desc:0 "Previous researchers stored part of their research on the Stellar Forge within a peculiar database on §H[From.Planet.GetName]§!. These findings could greatly assist our reactivation efforts in §H[kuat_ancient_epsilon_star.GetName]§!, though protective measures are in place. We must commit greater manpower and resources to overcome this challenge."
 
