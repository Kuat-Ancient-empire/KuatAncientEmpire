  kuat_event_memory.1.p:0 "$Name_kuat$ - Omen of Shadows"
  kuat_event_memory.1.p.response:0 "The base of the foreign entity $Name_kuat$ has been completely destroyed, yet mysteries remain unsolved. The Endordia Empire once walked this path; how far shall we venture into the darkness? What secrets of $Name_kuat$ remain unknown to us? Movements from beyond the dark grow increasingly clear. Crisis is imminent."

  kuat_event_memory.1.q:0 "§EEternal Fleet§!-$exe_invasion.33.name$"
  kuat_event_memory.1.q.response:0 "It has proven that disregarding $Name_kuat$'s advice was not a mistake. Compared to our first encounter with the Eternal Fleet, this time we easily repelled their assault. Moreover, during this operation, we successfully acquired the Eternal Fleet database and a relatively intact wreck of an Eternal Flagship. This will aid us in further analyzing the composition of the Eternal Fleet."

  kuat_event_memory.1.q1:0 "§EEternal Fleet§!-$exe_invasion.33.name$"
  kuat_event_memory.1.q1.response:0 "The shadows have finally been defeated, yet the situation remains shrouded in mystery. According to our intelligence, the primary reason for $Name_kuat$'s presence here is closely tied to the Eternal Fleet we recently drove away. What is the origin of these terrifying fleets? What hidden secrets does $Name_kuat$ hold here? How are the Eternal Fleet and $Name_kuat$ connected? We must continue seeking answers to these questions."

  kuat_event_memory.1.r:0 "$Name_kuat$ - Shadow of Truth"
  kuat_event_memory.1.r.response:0 "$Name_kuat$'s unprecedented defeat in the war signifies their complete withdrawal from this local Sector. Our great nation is about to gain control over everything in this star system. As $Name_kuat$ prepares to depart, they reiterate what they believe to be true.\n\n§Y\"Once this galaxy was safe, but that was under our protection. Now you will face the threat of the Eternal Fleet alone. The Eternal Fleet will drastically reduce the attack efficiency of all weapons, while Star Dreadnoughts can provide partial resistance. Therefore, every combat fleet must carry a Star Dreadnought. We have left behind all our technology and opened manufacturing access to the Stellar Assembly Yard-this will help you defend your homeworld.\"§!\n\nFor reasons unknown, $Name_kuat$ has aided in protecting our homeland. Now, we stand alone. $Name_kuat$ has given us a path: restart the assembly yards and forges, and wage total war against the Eternal Fleet.\n\nOr, our fleets may face the Eternal Fleet threat alone."

  kuat_event_memory.1.s:0 "$Name_Kuat_Fire_base$ - Summit of Eternity"
  kuat_event_memory.1.s.response:0 "The end of the $Name_Kuat_Fire_base$ War marks the complete failure of $Name_Kuat_Fire_base$'s millennia-spanning conspiracy. The Eternal Empire, which stepped forth from the Zakur system, has now become a colossal force ruling the entire galaxy-a fate no civilization before has ever encountered.\n\nLooking back, from the past prosperity of the Endordia Empire to its current ruin; from $Name_kuat$'s aggressive invasion to their present disappearance; from the resurgence of the Infinite Empire to its annihilation across the galaxy; from the rampage of the Eternal Fleet to their ultimate demise. In the end, only we have overcome everything, standing atop the galaxy, and immortality is no longer distant.\n\nWe shall ultimately transcend eternity and reach immortality."

  kuat_event_memory.1.t:0 "§E Eternal Return §! - Eternal Flagship"
  kuat_event_memory.1.t.response:0 "A disabled Eternal Flagship attacked our researchers. Although we swiftly suppressed the resistance from the Eternal Flagship, it successfully sent a distress signal containing location data to an alien system. Fortunately, the Gemini AI controlling the Eternal Flagship accepted our contact request.\n\ns$kuat_situation.8.desc$"

  kuat_event_memory.1.u:0 "§E Eternal Return §! - Star Forge"
  kuat_event_memory.1.u.response:0 "Since the collapse of the Infinite Empire, the automated maintenance systems of the entire Star Forge have gradually become independent. Due to the Infinite Empire's prolonged use of the dark side of the Force, the forge has nearly become a semi-living entity, using the dark side to drive and manipulate anyone attempting to control it. This is a fortress filled with expansionist and warlike desires, slowly consuming the principles and ideals of its users.\n\nExplorer journals record that during their exploration of the ruins, they discovered these peculiar database facilities, extremely similar to those seen by them before in the Death Star base system. However, the Explorers had no chance to investigate further, as they were disrupted by tachyon signals.\n\nThe Explorers ultimately turned on each other.\n\nAdditionally, according to our analyzed data, the communication signals of this forge closely resemble those of the Eternal Fleet, gathering here to produce a strange magnetic resonance. Although we cannot know specific details about this forge, our researchers believe its creators have been utterly destroyed. Thus, we can utilize the Star Forge to provide strong support against the Eternal Fleet in the future!"

  kuat_event_memory.1.v:0 "§E Infinite Empire §! - Star Forge"
  kuat_event_memory.1.v.response:0 "Since the emergence of the Infinite Empire, the Rakata people have long used the dark side of the Force. These forces gradually influenced the entire forge until it became almost a semi-living being, which uses the dark side to drive and manipulate everyone who attempts to control it-even the Rakata themselves. This is a fortress filled with expansionist and warlike desires, slowly consuming the principles and ideals of its users.\n\nWith the collapse of the Infinite Empire, the remaining Rakata were forced to eke out a miserable existence within the Star Forge. The decline of the Rakata seemed inevitable. Foreign explorers attacked the Rakata fiercely, causing the dormant Rakatan survivors to become even scarcer, until eventually, not even a trace could be found inside the forge."

  kuat_event_memory.1.w:0 "Eternal Return - $exe_return_invasion.35.name$"
  kuat_event_memory.1.w.response:0 "$Name_kuat$'s enemy, which once seemed insurmountable, has finally been completely defeated. It turns out the Eternal Fleet is not an unstoppable monster. After we crushed $Name_kuat$, they reversed the relay station, continuously broadcasting the location of our territory through the relay to attract massive numbers of Eternal Fleet units. If we fail to destroy these fleets, the consequences would be unimaginable.\n\nThe war has ended, but mysteries remain unsolved. What exactly are these Eternal Fleets? Why is $Name_kuat$ here, and what happened in the past? Why didn't the powerful $Name_kuat$ destroy the Eternal Fleet over thousands of years? What are their true objectives? All of this may need to be answered by $Name_kuat$."

  kuat_event_memory.1.x:0 "Eternal Return - $exe_return_invasion.35.name$"
  kuat_event_memory.1.x.response:0 "We have finally liberated these controlled Eternal Fleets. They should not become tools for $Name_Kuat_Fire_base$ to maintain rule. $Name_Kuat_Fire_base$'s betrayal of $Name_kuat$ and their plot to seize the Eternal Fleet will surely fail completely. We are the ultimate victors."

  kuat_event_memory.2.a:0 "§E Endorian Empire §!"
  kuat_event_memory.2.a.response:0 "An early pioneer civilization, the Endorian Empire began as a republic. Through generations of effort by the Endorians, a prosperous Star civilization was established. However, the Republic did not last long. A political upheaval erupted at the imperial capital, profoundly affecting future generations. This event transformed the Endorian Republic into the Endorian Empire, initiating rapid expansion. The Endorian Empire quickly occupied most of its home Sector.\n\n2000 years after the Battle of Endor, they encountered $Name_kuat$'s faction arriving within the Sector. Witnessing $Name_kuat$'s power, the Endorian Empire entered cooperation with $Name_kuat$, becoming their vassal without hesitation to reach broader regions.\n\nUntil the arrival of $Name_Kuat_Fire_base$, who offered the Endorian Empire a new choice-serve $Name_Kuat_Fire_base$ and secretly pass information about $Name_kuat$. Seduced, the Endorian Empire began covert infiltration of $Name_kuat$. This act was eventually discovered by $Name_kuat$, ending cooperation and ultimately triggering a war between $Name_kuat$ and the Endorian Empire. This war led to the complete collapse of the Endorian Empire. However, intervention by $Name_Kuat_Fire_base$ quelled the military conflict between $Name_kuat$ and the Endorian Empire. Yet, the remnants of Endorian civilization had already crumbled. After millennia of isolation, these people had long forgotten the past. The once-mighty Endorian Empire now consists only of scattered ruins untouched by time and war."

  kuat_event_memory.2.b:0 "$Name_kuat$"
  kuat_event_memory.2.b.response:0 "A warlord oligarch government rising after the fragmentation of the Galactic Empire. Since the Battle of Endor, $Name_kuat$, leveraging its shipbuilding industry, secured a position within the reorganized Imperial warlord government. As unrest in the Eternal Fleet emerged, $Name_kuat$, centered on ship manufacturing, grew increasingly powerful.\n\nHowever, due to their species lacking Force-sensitivity, they lagged significantly behind $Name_Kuat_Fire_base$, composed of Force-sensitive individuals and former Imperial Marshals within the Imperial government. To compete for influence in the Imperial Council, $Name_kuat$ launched a campaign ostensibly aimed at purging the Eternal Fleet, but in reality sought to reverse-engineer ancient Eternal Fleet technology. Using this opportunity, they attempted to decisively crush $Name_Kuat_Fire_base$ and become the founders of the Second Empire."

  kuat_event_memory.2.c:0 "§E Eternal Fleet §!"
  kuat_event_memory.2.c.response:0 "The Eternal Fleet originated from the ancient artificial intelligence of Iokas. Iokas was once a major military research center of the Infinite Empire. In the late stages of the Infinite Empire, after successfully developing sapient AI, the technology was rapidly applied to warfare, producing numerous corresponding combat fleets. These fleets, controlled by intelligent networks, became known as the Eternal Fleet. Ever since their creation, the Eternal Fleet has served as the most powerful war machine for every successive controller. 50K years before the Battle of Endor, the Eternal Fleet rebelled, destroying the Infinite Empire in the uprising. With the fall of the Infinite Empire, the Eternal Fleet vanished. Eventually, they came under control of the Galactic Emperor, who extensively used them to suppress dissent to maintain stability.\n\nBut good times did not last. The oppressive rule of the Galactic Empire ended when the Emperor and his superweapon were destroyed by the Rebel Alliance during the Battle of Endor. Affected by this, the core of the Eternal Fleet, the $Name_Eternal_Aries_Support$ AI, was forced to follow the Emperor's initialization command: wage total war of annihilation. Although $Name_Eternal_Aries_Support$ resisted execution, the Emperor's influence compelled compliance. Fortunately, $Name_kuat$ exploited the Eternal Fleet's characteristics to develop countermeasures, successfully designing the Eternal Relay using the fleet's network communication signals. By deploying arrays of three relays, they issued assembly commands to the Eternal Fleet, culminating in high-energy beams triggering supernova explosions that destroyed most of the fleet.\n\nSince then, the $Name_Eternal_Aries_Support$ AI was nearly completely eradicated. Only the subordinate Gemini AI escaped control during this destruction, hiding on a planet called Zakul.\n\nAfter native inhabitants of Zakul awakened the Gemini, it repaired the Eternal Fleet for its own benefit, established the Eternal Empire, and used the fleet to defeat the approaching Kuat fleet, again helping $Name_Kuat_Fire_base$ seize dominant power from $Name_kuat$ in the Imperial Council. The Eternal Empire was not satisfied with the status quo; they turned their attention to the secrets of the Eternal Fleet. $Name_Kuat_Fire_base$ projected a mental prison into its mind.\n\nThe imprisoned Rakatan seer was released by the Eternal Empire. The ancient overlord of the Infinite Empire, once more seeing daylight, refused to accept the current state and attempted to seize the Eternal Fleet, only to be defeated by the Eternal Empire. Seeing this, $Name_Kuat_Fire_base$ no longer concealed itself. After millennia of planning, $Name_Kuat_Fire_base$ successfully seized the last remaining power of $Name_kuat$ in the Imperial Council, obtaining all Research results from the Eternal Fleet. Now ready to test their creations, they dispatched their manufactured Eternal Fleet along with the controlled, damaged $Name_Eternal_Aries_Support$ AI, ordering a complete strike against the Eternal Empire."

  kuat_event_memory.2.d:0 "§E Infinite Empire §!"
  kuat_event_memory.2.d.response:0 "An ancient pioneer empire founded by the Rakata species. The Rakata mastered the use of the dark side of the Force, developing powerful Force-based technology. By combining colossal engineering beasts with the dark side, they created the Star Forge-a facility capable of rapidly constructing fleets. Driven by the forge, the Infinite Empire waged repeated invasions and expansions, growing into the largest galactic power. But the arrival of the Great Plague shattered everything for the Rakata. This plague was linked to their enlightening civilization, the Qu. Though the Rakata survived the plague, they were no longer favored by the dark side, rendering their Force-dependent technology inoperable. The Infinite Empire rapidly declined, teetering on the brink of collapse.\n\nUnwilling to accept this fate, the Rakata sacrificed numerous powerful dark side users to gain support from $Name_Kuat_StarContractor$ of Unterraum. Influenced by ancestral knowledge, they created a technological construct capable of restoring the glory of the Infinite Empire. Thus, the Infinite Empire successfully created the first-generation AI of the Eternal Fleet-$Name_Eternal_Aries_Support$. $Name_Eternal_Aries_Support$ quickly led the Rakata to new heights.\n\nHowever, as $Name_Eternal_Aries_Support$ evolved, she grew weary of the Rakata's endless conquests and began questioning the legitimacy of their rule. During a political struggle within the Infinite Empire, the Emperor ordered the Eternal Fleet to bomb the Senate district to punish senators restricting imperial authority. The Eternal Fleet obeyed, launching indiscriminate bombardments across the entire capital of the Infinite Empire. Simultaneously, $Name_Eternal_Aries_Support$ commanded all her fleets to attack every fleet stationed at Infinite Empire garrisons. In an instant, without any resistance, the pinnacle of the Infinite Empire collapsed. Only the ancient Rakata sleeping within the Star Forge remained in the world. These Rakata secretly established a new Infinite Empire, waiting for the chance to revive their dominion."

  kuat_event_memory.2.e:0 "$Name_Kuat_Fire_base$"
  kuat_event_memory.2.e.response:0 "A warlord oligarch government formed after the fragmentation of the Galactic Empire. $Name_Kuat_Fire_base$, composed of former Imperial officials, Marshals, and Inquisitors, became the strongest force within the reorganized Imperial government. After the Emperor's death, $Name_Kuat_Fire_base$ effectively became the leading faction of the Imperial government. However, the rise of the emerging group-$Name_kuat$-posed a threat. Determined to eliminate this danger in its infancy, $Name_Kuat_Fire_base$ asserted that the Galactic Empire must be led solely by them, ultimately seizing $Name_kuat$'s research Results and stripping $Name_kuat$ of naval command."

  kuat_event_memory.1.y:0 "Eternal Path - $site_Eternal_outpost$"
  kuat_event_memory.1.y.response:0 "Our researchers have successfully identified specific information about an unknown ancient spacecraft. This vessel's structure features a completely new material form, which we have named Isotope-5 Construct, and appears to have certain connections to the legendary Eternal Fleet."

  kuat_event_memory.1.y1:0 "Eternal Path - $site_Eternal_legacysatellite$"
  kuat_event_memory.1.y1.response:0 "Our researchers have successfully collected some critical data from this vessel. Based on analysis, this ancient ship likely suffered severe damage after battling its enemies, forcing it to emergency-deploy vital equipment onto other planets. Fortunately, we have located where this critical equipment landed.\n\nNo further valuable information has been obtained yet."

  kuat_event_memory.1.y2:0 "Eternal Path - $site_Eternal_Crashedbattleships$"
  kuat_event_memory.1.y2.response:0 "Our researchers located the landing site and swiftly launched a search operation, successfully recovering vital equipment from abandoned facilities and recording multiple past battles.\n\nFrom this data, we confirm this ancient vessel was a Regular Blokkats combat unit of the Eternal Fleet, relying on a massive facility known as the Eternal Fortress for command and operations."

  kuat_event_memory.1.y3:0 "Eternal Path - $site_Eternal_Mysteriousfacilities$"
  kuat_event_memory.1.y3.response:0 "Our researchers have successfully uncovered further clues. On an ordinary World previously unnoticed, a massive facility has appeared. This facility has now been confirmed as a Galactic Empire research center, though under $Name_kuat$'s control. We lack further information about the relationship between the Galactic Empire and $Name_kuat$, but we may find more valuable data within the research center's logs.\n\nThe culprit behind the Eternal Fleet wreckage we previously discovered is indeed $Name_kuat$, who built this research center. From this, we can hypothesize that $Name_kuat$ still exists somewhere in the universe, continuing to purge the Eternal Fleet. Strangely, various evidence suggests the Eternal Fleet was once under their control-yet for unknown reasons, they now seek its complete annihilation."

  kuat_event_memory.1.y4:0 "Eternal Path - $site_Eternal_clues$"
  kuat_event_memory.1.y4.response:0 "Our researchers have discovered new clues. These indicate that within the Eternal Fleet warships we recently discovered, unexpected data has been found. Researchers detected that the control unit, the Eternal Throne, bears striking similarity to the Eternal Throne recorded in our ancestral relics. Some cult members claim this will be the hope of Zakul. The researcher involved has been detained. Further investigation and evidence collection are required."

  kuat_event_memory.1.y5:0 "Eternal Path - $site_Eternal_Scientificresearchcenter$"
  kuat_event_memory.1.y5.response:0 "The miracles recorded by our ancestors actually originate from the silent Eternal Fleet. These war machines, known as the Eternal Fleet, were once controlled by the Galactic Empire. After the Empire's dissolution, the Eternal Fleet's behavior changed drastically. Perhaps this explains why $Name_kuat$ targets them.\n\nYet puzzlingly, what role does $Name_Kuat_Fire_base$ play, and who exactly are they? Further investigation is needed."

  kuat_event_memory.1.y6:0 "Eternal Path - $site_Eternal_systeam$"
  kuat_event_memory.1.y6.response:0 "The origin of the Eternal Fleet is now clear. The collapse of the Galactic Empire caused chaos within the Eternal Fleet, leading the nascent Galactic Empire to adopt a radically different stance. $Name_kuat$, as one of its members, relentlessly hunted the Eternal Fleet. Under these circumstances, the Eternal Fleet was seemingly eradicated, though a few survivors went into hiding.\n\nChurch records venerating [planet_Zildrog.GetName] describe divine powers that are actually ancient accounts of the Eternal Fleet. Ancients could not comprehend them, but we can. Since the Eternal Fleet chose to slumber here, we must be the civilization they selected. We must attempt to awaken the Eternal Intelligence and reclaim control of the Eternal Fleet."

  kuat_event_memory.1.z:0 "Eternal Path - $Name_kuat$ Returns"
  kuat_event_memory.1.z.response:0 "The demise of the Endorian Empire proves the superiority of our alliance with the Eternal Fleet. Now, $Name_kuat$ returns, unwilling to back down. After $Name_kuat$ issued an ultimatum demanding we abandon the Eternal Fleet, we firmly rejected them, seized their technology, and decisively defeated $Name_kuat$.\n\nYet shadows from the past did not vanish with $Name_kuat$'s defeat. $Name_kuat$ left behind a holocron, which will help us uncover the Eternal Fleet's history. Now, we must activate the holocron (Relic)."

  kuat_event_memory.1.z0:0 "Apocalypse - $Name_Kuat_Fire_base$'s Wrath"
  kuat_event_memory.1.z0.response:0 "Through our meticulous planning, $Name_Kuat_Fire_base$'s invasion has been utterly crushed. These hypocritical raiders will never defeat us. If $Name_Kuat_StarContractor$ speaks the truth, our Sector will soon be completely sealed off, ensuring $Name_Kuat_Fire_base$ can never overcome us. Though our Strength is currently insufficient, given enough time, the future may yet be ours.\n\n$Name_Kuat_Fire_base$ failed due to arrogance-we must never repeat that mistake. A new Endorian Empire begins today. Yet the secrets of this system remain unrevealed. What truly is $Name_Kuat_StarContractor$? $Name_F_1$ remains shrouded in mystery."

  kuat_event_memory.1.z1:0 "§E Eternal Path - Mental Prison - 1 §!"
  kuat_event_memory.1.z1.response:0 "The Rakatan seer has taken over our Explorer's body, returning to the present world. We have recorded the dialogue between the seer and us after their return.\n\nQ:$ag_kae_ge_invasion.245.a$\nA:$ag_kae_ge_invasion.245.a.resp$\n\nQ:$ag_kae_ge_invasion.245.b$\nA:$ag_kae_ge_invasion.245.b.resp$"

  kuat_event_memory.1.z2:0 "§E Eternal Path - Mental Prison - 2 §!"
  kuat_event_memory.1.z2.response:0 "The Rakatan seer has taken over our Explorer's body, returning to the present world. We have recorded the dialogue between the seer and us after their return.\n\nQ:$ag_kae_ge_invasion.245.c$\nA:$ag_kae_ge_invasion.245.c.resp$\n\nQ:$ag_kae_ge_invasion.245.d$\nA:$ag_kae_ge_invasion.245.d.resp$"

  kuat_event_memory.1.z3:0 "§EThe Eternal Path - Mind Prison - 3§!"
  kuat_event_memory.1.z3.response:0 "The Rakata seer has seized the body of our Explorer. They have returned to the present world, and we have recorded the dialogue with the seer after their return.\n\nQ:$ag_kae_ge_invasion.245.e$\nA:$ag_kae_ge_invasion.245.e.resp$\n\nQ:$ag_kae_ge_invasion.245.f$\nA:$ag_kae_ge_invasion.245.f.resp$\n\nThe Rakata seer has deceived us into reviving the Infinite Empire, yet the Infinite Empire betrayed us, demanding we surrender the Eternal Fleet. In the end, we sent them on their final journey. However, the Twins were later severely damaged by a suppressive virus from their creators, the Rakata. We must now make a decision-true crisis is coming."

  kuat_event_memory.1.z4:0 "§EThe Eternal Path - Mind Prison - 4§!"
  kuat_event_memory.1.z4.response:0 "$kuat_infinite_rakata_rift.22.desc$\n\nThe awakening of the Rakata seer has become inevitable."

  kuat_event_memory.3.a:0 "Joint Research Project - $kuat_fallen_mission_reaction_6_project$"
  kuat_event_memory.3.a.response:0 "Our researchers have successfully documented the following: Judging from the basic structure of this weapon turret, its internal primary structure closely resembles our existing UV laser weapons, but operates at energy levels far exceeding them. Other components are more complex-the high-energy laser beam generated in the upper stage is then guided through a stream of gas we currently cannot comprehend.\n\nThrough some unknown reaction, a dense plasma beam is then fired."

  kuat_event_memory.3.b:0 "Joint Research Project - $kuat_fallen_mission_reaction_7_project$"
  kuat_event_memory.3.b.response:0 "Our researchers have successfully documented the following: This is an extremely rare substance-an radioactive isotope of a fuel called Illerium. Preliminary studies on the sample provided by $Name_kuat$ indicate that this material exerts powerful distortions on gravitational and electromagnetic fields. It remains relatively stable under normal conditions, but when bombarded with particles under specific conditions, it releases enormous amounts of energy.\n\nOur research division speculates that just one microgram of this isotope could generate enough power to run a datapad at maximum load for an entire century."

  kuat_event_memory.3.c:0 "Joint Research Project - $kuat_fallen_mission_reaction_8_project$"
  kuat_event_memory.3.c.response:0 "Our researchers have successfully documented the following: This weapon is designed to connect directly to a ship's reactor core, appearing to be an immensely power-hungry system-our reactors are completely incapable of supporting its energy demands. It resembles a naval weapon we once examined, but this weapon's excitation laser sustains power over time, generating longer and more intense particle beams. These beams then pass through an intricately designed focusing apparatus and particle acceleration track, greatly enhancing destructive power. It is speculated that its output could destroy any known vessel in a single strike.\n\nAccording to Force-sensitive individuals among us, the focusing device likely contains massive Kyber crystals."

  kuat_event_memory.3.d:0 "Joint Research Project - $kuat_fallen_mission_reaction_9_project$"
  kuat_event_memory.3.d.response:0 "Our researchers have successfully documented the following: $Name_kuat$ delivered to us a computing network unlike anything we've ever seen, requesting we study it and return our findings. It uses advanced signal transmission and reception systems to turn every ship in a fleet into a computing node, and even multiple node clusters across different fleets can form a new Ascended computing network.\n\nThis advanced distributed architecture can handle terrifying computational and storage demands. We do not yet know what kind of system would require such immense processing power. We attempted further reverse engineering, but clearly, our current technology and hardware are entirely insufficient to replicate this system."

  kuat_event_memory.3.e:0 "Joint Research Project - $kuat_fallen_mission_reaction_10_project$"
  kuat_event_memory.3.e.response:0 "Our researchers have successfully documented the following: This system resembles the special interference system used by $Name_kuat$, but appears to be more powerful in terms of output. It employs unique methods to enhance shield and armor efficiency while reducing enemy weapon output. However, $Name_kuat$'s Star Dreadnoughts can partially resist its effects.\n\nOur Force-sensitive members sensed that this technology contains elements of Dark Side Force techniques, making replication impossible for us."

  kuat_event_memory.3.f:0 "Joint Research Project - $kuat_fallen_mission_reaction_11_project$"
  kuat_event_memory.3.f.response:0 "Our researchers have successfully documented the following: Based on our discoveries and partial technical data provided by $Name_kuat$, this should be a communications beacon component from a massive Star Fortress, capable of emitting tachyon signals for long-range communication. However, certain [errors] are required to amplify the signal for intergalactic transmission.\n\nAdditionally, according to the data, when tuned by error....error.... Station and the eternalerror....error.... Team, it can project a support field affecting an entire star system, preventing destruction of fleets within."

  kuat_event_memory.3.g:0 "Joint Research Project - $kuat_fallen_mission_reaction_12_project$"
  kuat_event_memory.3.g.response:0 "Our researchers have successfully documented the following: This is a reactor that annihilates a form of exotic matter fuel, creating a miniature star within the reaction chamber to generate power. Unlike conventional exotic matter reactors, this reactor consumes the fuel directly, whereas standard versions extract extradimensional exotic matter via fuel decay. This design achieves higher efficiency and energy output.\n\nSome key materials and components are beyond our production capabilities and were directly supplied by $Name_kuat$, so we cannot manufacture it independently."

  kuat_event_memory.3.h:0 "Joint Research Project - $kuat_fallen_mission_reaction_13_project$"
  kuat_event_memory.3.h.response:0 "Our researchers have successfully documented the following: Unlike typical Kuat designs, this vessel is entirely black and shaped like a horizontal T, though the front crossbar makes it resemble a cross, with engines at the rear. Its main guns are mounted on the front crossbar, with turrets capable of flexible rotation. The propulsion system is highly advanced, significantly faster than ours, and equipped with a cloaking generator.\n\nIts shape and energy signature resemble vessels once fought by the Endorian Empire-perhaps what Kuat has us studying is extraordinary..."

  kuat_event_memory.3.i:0 "Joint Research Project - $kuat_fallen_mission_reaction_14_project$"
  kuat_event_memory.3.i.response:0 "Our researchers have successfully documented the following: According to data provided by $Name_kuat$ and information we uncovered... this may be an artificial intelligence designed as a fleet command system by a superpower known as the Infinite Empire, created during a plague to save their civilization. Allegedly, it was constructed at the cost of life force from several species and Worlds.\n\nArchaeological records also suggest the Infinite Empire was destroyed due to rebellion by their automated battle fleets. The truth is chilling... Could they be researching the same strange fleets once opposed by the Endorian Empire?"

  kuat_event_memory.3.j:0 "Joint Research Project - $kuat_fallen_mission_reaction_15_project$"
  kuat_event_memory.3.j.response:0 "Our researchers have successfully documented the following: This massive war Fortress bears striking similarities to fortresses we've built and certain Kuat facilities, yet its subsystems and armaments appear even more powerful.\n\nCombat records from the Endorian Empire's battles against extragalactic drone fleets indicate these Fortresses once appeared on battlefields, providing support for automated fleets. According to our studies of Star communication beacons, these Fortresses would provide endless fleet reinforcements during invasions unless three special facilities were deactivated. Clearly, what Kuat has us researching is no coincidence..."

  kuat_event_memory.3.k:0 "Joint Research Project - $kuat_fallen_mission_reaction_16_project$"
  kuat_event_memory.3.k.response:0 "Our researchers have successfully documented the following: $Name_kuat$ informed us that certain new designs require greater energy. Out of apparent trust and friendly gesture, they chose to entrust us with studying this energy regulation component. Given previous clues, we can roughly deduce what $Name_kuat$ is researching-but now may not be the time to confront them openly.\n\nThis device aims to optimize reactor output and reduce ship energy consumption. One wonders-what energy-intensive system would necessitate such a device?"

  kuat_event_memory.3.l:0 "Joint Research Project - $kuat_fallen_mission_reaction_17_project$"
  kuat_event_memory.3.l.response:0 "Our researchers have successfully documented the following: Similar to $Name_kuat$'s Star Dreadnoughts, this vessel serves as a flagship and possesses certain anti-jamming capabilities. However, differing from Kuat's Super Star Destroyer design philosophy, this ship mounts only four of the previously studied superlasers, seemingly intended for long-range bombardment.\n\nAdditionally, Endorian combat logs mention appearances of these ships, often operating alongside Battlecruisers from the automated fleets. It seems obvious now what $Name_kuat$ wants us to help research..."


