  kuat_event_memory.1.l:0 "$ag_legacy_invasion_chain_title$-$kuat_legacy_kuat$-$kuat_lagacy_5$"
  kuat_event_memory.1.l.response:0 "Prior to the crisis, $Name_kuat$ was engaged in conflict with the Eternal Fleet. During this period, the Endordia Empire was at the peak of its power. However, influenced by $Name_Kuat_Fire_base$, they were tempted to launch a surprise attack on $Name_kuat$'s garrison forces and attempt to seize their technology.\n\nThis action inadvertently drew the attention of the Eternal Fleet. At that time, the Endordia Empire did not possess sufficient Strength to resist such a powerful enemy. After paying a heavy price, Endordian researchers discovered that Kuat's Star Dreadnoughts could effectively repel attacks from the Eternal Fleet, ultimately driving them away.\n\nHowever, peace did not last long. $Name_kuat$ swiftly launched retaliatory actions against the Endordia Empire. Already weakened by the previous war, the Endordians were unable to resist $Name_kuat$'s offensive, leading to the empire's defeat. Following their defeat, the Endordia Empire signed an agreement with $Name_kuat$. While their civilization survived, their nation was completely destroyed.\n\nThe seer of the Endordia Empire left behind a message, hoping to warn future generations that destroying $Name_kuat$ would bring disaster upon the world. This message serves not only as reflection on history but also as a warning for the future."

