l_english:
#origin
 kuat_support_class_arrived_desc:"The empire's §Hflagship fleet§! deployed from the capital has arrived at $capital_planet|H$"
 origin_kuat_apocalyptic:"§E[The Dawn of Kuat] Revelation§!"
 origin_kuat_apocalyptic_desc:"The radiance of $Name_Kuat_Fire_base$ once covered all our worlds. It was both sublime and supremely arrogant. Under its cold light, we barely survived, striving to create a small shadow of our own to escape the cruelty of that brilliance. Now, we must fulfill our covenant to gain true freedom."
 origin_tooltip_kuat_apocalyptic_effects:"§HThis is a simple narrative origin. We will explore the shadows hidden in the past, pursue mysteries beyond the veil of the stars, and reveal our true destiny.§!\nStarting in the §EIsolated Cluster§!\n\nThis origin belongs to the main storyline of 'The Dawn of Kuat'."
 origin_kuat_shadow:0 "§E[The Dawn of Kuat] Beneath the Shadow§!"
 origin_kuat_shadow_desc:0 "The gloom of $Name_kuat$ once covered all our worlds. It was both sublime and supremely arrogant. Under its cold darkness, we barely survived, striving to create a small light of our own to escape the cruelty of that brilliance. Now, we shall forge our own glory with our hands-our story has only just begun."
 origin_tooltip_kuat_shadow_effects:0 "§HThis is a simple narrative origin. We will explore the shadows hidden in the past, pursue mysteries beyond the veil of the stars, and reveal our true destiny.§!\nStarting in a §Efixed three-star system§!\nThe starting system will contain $think_tank_ruined$, $dyson_sphere_ruined$, $matter_decompressor_ruined$§!\n§RWe will lose all starting fleets§!\n\nThis origin belongs to the main storyline of 'The Dawn of Kuat'."
 kuat_origin_system_NAME:0 "§ESupreme§!"
 kuat_origin_system_DESC:1 "A pioneer species' star system located within a rare spatial rift. Dimensional turbulence, once common here, made space extremely unstable. However, the pioneers used special means to establish a stable stellar environment. From here, our journey begins."
 d_str_kuat_spring:"§EPioneer City§!"
 d_str_kuat_spring_desc:"A massive city forged by the pioneers."
 START_SCREEN_KUAT_ORIGIN:"Our [GetSpeciesName] species' origins are lost to history; our records have suffered a rupture. We can only struggle to survive. Now, with the help of $Name_Kuat_Fire_base$, we have fully secured control over [GetHomeWorldName].\n\nLooking back, the radiance of $Name_Kuat_Fire_base$ once covered all our worlds. It was both sublime and supremely arrogant. Under its cold light, we barely survived, striving to create a small shadow of our own to escape the cruelty of that brilliance. Now, we must fulfill our covenant to gain true freedom."
 origin_kuat_trigger_first:"§ERequires both Ancient Empire and Kuat Ancient Empire to be enabled.§!"
 tech_kuat_databank:"$building_kuat_databank$"
 tech_kuat_databank_desc:"A structure containing construction techniques for all ship designs from Kuat's shipyards. Though we lack the actual shipbuilding technology, advanced equipment can boost our research capabilities."
 tech_kuat_resource_center:"$building_kuat_resource_center$"
 tech_kuat_resource_center_desc:"Kuat can acquire vast resources through transdimensional translocation. This technology will greatly enhance our resource acquisition."
 tech_kuat_shield:"$building_kuat_shield$"
 tech_kuat_shield_desc:"Kuat's planetary shield technology. Using these specially designed shields, they can withstand nearly all orbital bombardments."
 tech_kuat_ground_yards:"$building_kuat_ground_yards$"
 tech_kuat_ground_yards_desc:"Kuat has not only achieved great heights in space-based shipbuilding, but also developed powerful and highly practical technologies for ground-based shipyards. These advancements will provide stable support for our ship production."
 tech_kuat_command_center:"$building_kuat_command_center$"
 tech_kuat_command_center_desc:"Kuat once used this anti-gravity technology to construct magnificent aerial command centers. Now, once we complete this research, we can locally reconfigure and build our own aerial command center on a World."

