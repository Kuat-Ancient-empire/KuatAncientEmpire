  TIMELINE_EVENT_SHADOW_COPORUATION_04_TOOLTIP: "$Name_kuat$ has given us a computing network unlike anything we've seen before, requesting that we study it and return our findings. It uses advanced signal transmission and reception systems to turn every ship in a fleet into a computing node, and even multiple node clusters from different fleets can form a new Ascended computing network."
