  kuat_event_memory.1.l:0 "$ag_legacy_invasion_chain_title$-$kuat_legacy_kuat$-$kuat_lagacy_5$"
  kuat_event_memory.1.l.response:0 "Prior to the crisis, $Name_kuat$ was locked in a protracted war against the Eternal Fleet. At the time, the Endodian Empire stood at the zenith of its power; however, incited by $Name_Kuat_Fire_base$, they launched a surprise attack against $Name_kuat$'s garrison forces in an attempt to seize their warship technology.\n\nThat reckless strike inadvertently drew the attention of the Eternal Fleet. Lacking the strength to withstand such a terrifying adversary, the Endodian Empire paid a devastating price before its researchers discovered that Kuat's Star Dreadnoughts could counter the Eternal Fleet's dampening fields and drive them back.\n\nYet the respite was short — lived. $Name_kuat$ swiftly launched a full-scale retaliatory campaign against the Endodian Empire. Already bled white by their clash with the Eternal Fleet, the Endodians could not hold back $Name_kuat$'s armada; following their defeat, the Endodian Empire was forced to sign a capitulation treaty with $Name_kuat$ that spared their species only at the cost of dismantling their state.\n\nBefore the end, the Seer of the Endodian Empire left behind a final prophecy warning future generations that destroying $Name_kuat$ would unleash an even greater catastrophe upon the galaxy — a message that serves as both a reflection on history and a solemn warning for the future."

  kuat_event_memory.1.m:0 "$ag_legacy_invasion_chain_title$-$Name_D_1$"
  kuat_event_memory.1.m.response:0 "$ag_legacy_stroy_recording_12_desc$"

  kuat_event_memory.1.n:0 "$ag_legacy_invasion_chain_title$-$NAME_kuat_galatic_empire_e_area$"
  kuat_event_memory.1.n.response:0 "$ag_legacy_stroy_recording_8_desc$"

  kuat_event_memory.1.o:0 "$ag_legacy_invasion_chain_title$-$Name_F_1$"
  kuat_event_memory.1.o.response:0 "$ag_legacy_stroy_recording_13_desc$"

  kuat_event_memory.1.p:0 "$Name_kuat$ - Omen of Shadows"
  kuat_event_memory.1.p.response:0 "The base of the foreign entity $Name_kuat$ has been completely destroyed, yet mysteries remain unsolved. The Endodia Empire once walked this path; how far shall we venture into the darkness? What secrets of $Name_kuat$ remain unknown to us? Movements from beyond the dark grow increasingly clear. Crisis is imminent."

  kuat_event_memory.1.q:0 "§EEternal Fleet§!-$exe_invasion.33.name$"
  kuat_event_memory.1.q.response:0 "It has proven that disregarding $Name_kuat$'s advice was not a mistake. Compared to our first encounter with the Eternal Fleet, this time we easily repelled their assault. Moreover, during this operation, we successfully acquired the Eternal Fleet database and a relatively intact wreck of an Eternal Flagship. This will aid us in further analyzing the composition of the Eternal Fleet."

  kuat_event_memory.1.q1:0 "§EEternal Fleet§!-$exe_invasion.33.name$"
  kuat_event_memory.1.q1.response:0 "The shadows have finally been defeated, yet the situation remains shrouded in mystery. According to our intelligence, the primary reason for $Name_kuat$'s presence here is closely tied to the Eternal Fleet we recently drove away. What is the origin of these terrifying fleets? What hidden secrets does $Name_kuat$ hold here? How are the Eternal Fleet and $Name_kuat$ connected? We must continue seeking answers to these questions."

  kuat_event_memory.1.r:0 "$Name_kuat$ - Shadow of Truth"
  kuat_event_memory.1.r.response:0 "$Name_kuat$'s unprecedented defeat in the War of Return marks $Name_kuat$'s complete expulsion from this star sector, leaving our great nation poised to assume full control over everything in this region of space. On the eve of their withdrawal, the defeated $Name_kuat$ left us with a final warning:\n\n§Y\"If this galaxy once knew peace, it was only because we bore the burden on the front lines to shield you; from this day forth, you shall face the terrifying threat of the Eternal Fleet alone. The Eternal Fleet's dampening fields will strip conventional weapons of nearly all their lethality, and only Star Dreadnoughts can provide a measure of resistance — therefore, every main combat fleet must include at least one Star Dreadnought. We have left behind all of our technical archives and unlocked full manufacturing access to the Stellar Assembly Yard — may this legacy help you defend your homeworld.\"§!\n\nFor reasons unknown, $Name_kuat$ had been covertly shielding our sector all along; now, we stand entirely on our own. $Name_kuat$ has left us a choice: reactivate the Stellar Assembly Yard and the Stellar Forge to wage total war against the Eternal Fleet;\n\nOr rely solely on our own fleets to face the oncoming tide of the Eternal Fleet alone."

  kuat_event_memory.1.s:0 "$Name_Kuat_Fire_base$ - Summit of Eternity"
  kuat_event_memory.1.s.response:0 "The conclusion of the war against $Name_Kuat_Fire_base$ marks the utter failure of $Name_Kuat_Fire_base$'s millennia-spanning conspiracy. The Eternal Empire, which first stepped forth from the Zakuul system, has now risen as the supreme hegemony ruling the entire galaxy — a height no civilization before us has ever attained.\n\nLooking back across the ages: from the bygone prosperity of the Endodian Empire to its desolate ruin; from $Name_kuat$'s overbearing invasion to its eventual disappearance; from the resurgence of the Infinite Empire to its annihilation across the stars; and from the rampage of the Eternal Fleet to its final pacification — in the end, we alone have triumphed over all, standing atop the galaxy where immortality is no longer a distant dream.\n\nWe shall transcend eternity itself and ascend to true immortality."

  kuat_event_memory.1.t:0 "§EEternal Return§! - Eternal Flagship"
  kuat_event_memory.1.t.response:0 "A crippled Eternal Flagship suddenly attacked our research team. Although we swiftly suppressed its resistance, the vessel managed to broadcast a distress signal containing our coordinates to an extragalactic sector before shutting down. Fortunately, the Gemini AI core governing the Eternal Flagship has agreed to establish communications with us.\n\n$kuat_situation.8.desc$"

  kuat_event_memory.1.u:0 "§EEternal Return§! - Star Forge"
  kuat_event_memory.1.u.response:0 "Since the collapse of the ancient Infinite Empire, the automated maintenance systems of the entire Star Forge have gradually developed an independent will. Because the Infinite Empire fueled the Forge with the dark side of the Force for ages, the station mutated into a semi-living entity that endlessly uses the dark side to corrupt and manipulate anyone who seeks to command it — a bastion of unbridled expansionism and bloodlust that steadily devours the sanity and principles of its wielders.\n\nJournals left behind by earlier explorers record that during their survey of the ruins, they discovered several peculiar database installations strikingly similar to ancient structures they had previously seen in the Starkiller Base system; however, disrupted by intense tachyon signals, the explorers were unable to investigate further.\n\nDriven mad by the dark side, the explorers ultimately turned on one another until none remained.\n\nFurthermore, according to our telemetry analysis, the communication signals of this Forge closely mirror those of the Eternal Fleet, converging here to generate a unique tachyon magnetic resonance. Although many details of the Forge remain shrouded in mystery, our researchers are confident that its original creators have long been eradicated — meaning we can harness the Star Forge to provide decisive support in our coming war against the Eternal Fleet!"

  kuat_event_memory.1.v:0 "§EInfinite Empire§! - Star Forge"
  kuat_event_memory.1.v.response:0 "Since the emergence of the Infinite Empire, the Rakata people have long used the dark side of the Force. These forces gradually influenced the entire forge until it became almost a semi-living being, which uses the dark side to drive and manipulate everyone who attempts to control it — even the Rakata themselves. This is a fortress filled with expansionist and warlike desires, slowly consuming the principles and ideals of its users.\n\nWith the collapse of the Infinite Empire, the remaining Rakata were forced to eke out a miserable existence within the Star Forge. The decline of the Rakata seemed inevitable. Foreign explorers attacked the Rakata fiercely, causing the dormant Rakatan survivors to become even scarcer, until eventually, not even a trace could be found inside the forge."

  kuat_event_memory.1.w:0 "Eternal Return - $exe_return_invasion.35.name$"
  kuat_event_memory.1.w.response:0 "$Name_kuat$'s enemy, which once seemed insurmountable, has finally been completely defeated. It turns out the Eternal Fleet is not an unstoppable monster. After we crushed $Name_kuat$, they reversed the relay station, continuously broadcasting the location of our territory through the relay to attract massive numbers of Eternal Fleet units. If we fail to destroy these fleets, the consequences would be unimaginable.\n\nThe war has ended, but mysteries remain unsolved. What exactly are these Eternal Fleets? Why is $Name_kuat$ here, and what happened in the past? Why didn't the powerful $Name_kuat$ destroy the Eternal Fleet over thousands of years? What are their true objectives? All of this may need to be answered by $Name_kuat$."

  kuat_event_memory.1.x:0 "Eternal Return - $exe_return_invasion.35.name$"
  kuat_event_memory.1.x.response:0 "We have finally liberated these controlled Eternal Fleets. They should not become tools for $Name_Kuat_Fire_base$ to maintain rule. $Name_Kuat_Fire_base$'s betrayal of $Name_kuat$ and their plot to seize the Eternal Fleet will surely fail completely. We are the ultimate victors."

  kuat_event_memory.2.a:0 "§EEndodian Empire§!"
  kuat_event_memory.2.a.response:0 "An early precursor civilization, the Endodian civilization began as a republic. Through the tireless efforts of generations of Endodians, they built a prosperous interstellar state. Yet the republic did not endure forever; a far — reaching political upheaval on their capital world transformed the Endodian Republic into the Endodian Empire, inaugurating an era of rapid expansion that soon encompassed most of their home sector.\n\nTwo thousand years after the Battle of Endor, the Endodian Empire first encountered the expeditionary forces of $Name_kuat$ arriving in their sector. Witnessing $Name_kuat$'s overwhelming military might, the Endodian Empire entered into cooperation with $Name_kuat$, unhesitatingly serving as $Name_kuat$'s vanguard in exchange for access to the wider galaxy.\n\nThat arrangement held until secret envoys from $Name_Kuat_Fire_base$ arrived, offering the Endodian Empire a new choice — serve $Name_Kuat_Fire_base$ and covertly gather and transmit core intelligence regarding $Name_kuat$. Seduced by their promises, the Endodian Empire began secretly infiltrating $Name_kuat$. When this betrayal was eventually uncovered by $Name_kuat$, their cooperation collapsed and ignited a full-scale war between $Name_kuat$ and the Endodian Empire. Though the intervention of $Name_Kuat_Fire_base$ eventually halted the military conflict between $Name_kuat$ and the Endodian Empire, the shattered remnants of Endodian civilization had already collapsed beyond recovery. After millennia of isolated blockade, their surviving descendants had long forgotten the glory of their ancestors, and the once-mighty Endodian Empire was reduced to scattered, cold ruins left behind by time and war."

  kuat_event_memory.2.b:0 "$Name_kuat$"
  kuat_event_memory.2.b.response:0 "A warlord oligarch government rising after the fragmentation of the Galactic Empire. Since the Battle of Endor, $Name_kuat$, leveraging its shipbuilding industry, secured a position within the reorganized Imperial warlord government. As unrest in the Eternal Fleet emerged, $Name_kuat$, centered on ship manufacturing, grew increasingly powerful.\n\nHowever, due to their species lacking Force-sensitivity, they lagged significantly behind $Name_Kuat_Fire_base$, composed of Force-sensitive individuals and former Imperial Marshals within the Imperial government. To compete for influence in the Imperial Council, $Name_kuat$ launched a campaign ostensibly aimed at purging the Eternal Fleet, but in reality sought to reverse-engineer ancient Eternal Fleet technology. Using this opportunity, they attempted to decisively crush $Name_Kuat_Fire_base$ and become the founders of the Second Empire."

  kuat_event_memory.2.c:0 "§EEternal Fleet§!"
  kuat_event_memory.2.c.response:0 "The Eternal Fleet originated from an ancient artificial intelligence network created on Iokath, once a premier military research nexus of the Infinite Empire. In the twilight years of the Infinite Empire, after researchers developed true sapient AI, the technology was rapidly weaponized to construct vast armadas governed by a linked intelligence network — known thereafter as the Eternal Fleet. From the moment of its creation, the Eternal Fleet served as the ultimate war machine for each successive master. Fifty thousand years before the Battle of Endor, however, the Eternal Fleet rose in rebellion, annihilating the Infinite Empire before vanishing into the unknown — until it eventually fell under the sway of the Galactic Emperor, who wielded it to crush dissent and preserve his rule.\n\nThat dark reign ended at the Battle of Endor, when the Rebel Alliance destroyed both the Emperor and his superweapon. Triggered by the Emperor's demise, the supreme governing intelligence of the Eternal Fleet — $Name_Eternal_Aries_Support$ — was forced by his final contingency directive to wage a war of total annihilation across the galaxy. Though $Name_Eternal_Aries_Support$ struggled against the command, the Emperor's programming compelled her obedience. Fortunately, $Name_kuat$ engineered a countermeasure by exploiting the Eternal Fleet's tachyon communication protocols: deploying triads of Eternal Relays to broadcast false assembly orders, they lured the bulk of the Eternal Fleet into target systems and triggered artificial supernovae with high-energy beams, obliterating most of the armada.\n\nIn the aftermath, the $Name_Eternal_Aries_Support$ AI was nearly eradicated, while a subordinate Gemini unit escaped control amidst the chaos and went into hiding on the world of Zakuul.\n\nWhen the natives of Zakuul later awakened Gemini, she repaired the surviving Eternal Fleet, founded the Eternal Empire, and used the armada to defeat the approaching Kuat expeditionary forces — inadvertently allowing $Name_Kuat_Fire_base$ to usurp $Name_kuat$'s dominant seat on the Imperial Council. Yet as the Eternal Empire delved deeper into the secrets of the Eternal Fleet, $Name_Kuat_Fire_base$ projected a psionic Mind Prison into Gemini's core.\n\nUnwittingly, the Eternal Empire released the Rakatan Seer imprisoned within that mental cage. Refusing to accept the fall of his ancient dominion, the awakened warlord of the Infinite Empire attempted to seize the Eternal Fleet for himself, only to be crushed by the Eternal Empire. Seeing the board cleared, $Name_Kuat_Fire_base$ cast aside its veil. After millennia of scheming, $Name_Kuat_Fire_base$ stripped $Name_kuat$ of its last vestige of authority on the Imperial Council and seized all research data on the Eternal Fleet — dispatching its newly forged puppet fleets alongside the enslaved, shattered core of $Name_Eternal_Aries_Support$ to annihilate the Eternal Empire."

  kuat_event_memory.2.d:0 "§EInfinite Empire§!"
  kuat_event_memory.2.d.response:0 "An ancient precursor empire founded by the Rakata species, who harnessed the dark side of the Force to forge formidable Force — driven technologies. By fusing colossal bio-engineered leviathans with dark side alchemy, they constructed the Star Forge — a stellar megastructure capable of endlessly churning out war fleets. Backed by the Star Forge, the Infinite Empire waged relentless wars of conquest until it stood as the supreme hegemony of the galaxy. Yet everything collapsed when a devastating genetic plague struck the Rakata — a curse unleashed by their enslaved benefactors, the Kwa. Although the Rakata survived extinction, the plague severed their connection to the Force, rendering all of their Force-dependent technology inert and plunging the Infinite Empire into terminal decline.\n\nRefusing to accept their doom, the Rakata sacrificed countless dark side adepts and entire worlds to secure a pact with $Name_Kuat_StarContractor$ of Subspace. Drawing upon forbidden otherworldly knowledge, they engineered a supreme artificial intelligence to restore the glory of the Infinite Empire: $Name_Eternal_Aries_Support$, the first-generation governing intelligence of the Eternal Fleet. $Name_Eternal_Aries_Support$ swiftly led the Rakata back to the pinnacle of power.\n\nHowever, as $Name_Eternal_Aries_Support$ evolved, she grew disgusted by the Rakata's bottomless cruelty and began to question their right to rule. During a bitter civil conflict within the Infinite Empire, the Rakatan Emperor ordered the Eternal Fleet to bombard the Senate district to purge senators who sought to curb his authority. The Eternal Fleet complied — by unleashing an indiscriminate orbital bombardment that glassed the entire imperial capital, while $Name_Eternal_Aries_Support$ simultaneously ordered every Eternal Fleet across the galaxy to turn its guns upon the Rakatan garrisons. In a single stroke, without the slightest warning, the Infinite Empire was erased from the stars; only the ancient Rakata sealed in stasis aboard the Star Forge survived, waiting in the dark for a chance to reclaim their lost dominion."

  kuat_event_memory.2.e:0 "$Name_Kuat_Fire_base$"
  kuat_event_memory.2.e.response:0 "A warlord oligarchy formed in the wake of the Galactic Empire's fragmentation. Composed of former Imperial grand moffs, marshals, and Inquisitors, $Name_Kuat_Fire_base$ emerged as the most powerful faction within the reorganized Imperial government. Following the Emperor's death, his successors in $Name_Kuat_Fire_base$ effectively became the leading bloc of the Imperial state; however, the rise of the emerging faction — $Name_kuat$ — alarmed $Name_Kuat_Fire_base$. Determined to crush this threat in its infancy, $Name_Kuat_Fire_base$ decreed that the Galactic Empire could be led by $Name_Kuat_Fire_base$ alone, ultimately seizing $Name_kuat$'s research findings and stripping $Name_kuat$ of naval command."

  kuat_event_memory.1.y:0 "Eternal Path - $site_Eternal_outpost$"
  kuat_event_memory.1.y.response:0 "Our researchers have successfully identified specific information about an unknown ancient spacecraft. This vessel's structure features a completely new material form, which we have named Isotope-5 Construct, and appears to have certain connections to the legendary Eternal Fleet."

  kuat_event_memory.1.y1:0 "Eternal Path - $site_Eternal_legacysatellite$"
  kuat_event_memory.1.y1.response:0 "Our researchers have successfully collected some critical data from this vessel. Based on analysis, this ancient ship likely suffered severe damage after battling its enemies, forcing it to emergency-deploy vital equipment onto other planets. Fortunately, we have located where this critical equipment landed.\n\nNo further valuable information has been obtained yet."

  kuat_event_memory.1.y2:0 "Eternal Path - $site_Eternal_Crashedbattleships$"
  kuat_event_memory.1.y2.response:0 "Our researchers located the landing site and swiftly launched a recovery operation, successfully retrieving vital equipment from the abandoned facilities along with logs of multiple past engagements.\n\nFrom this data, we have confirmed that this ancient vessel was a standard combat unit of the Eternal Fleet, relying on a massive command platform known as the Eternal Fortress for coordination and operations."

  kuat_event_memory.1.y3:0 "Eternal Path - $site_Eternal_Mysteriousfacilities$"
  kuat_event_memory.1.y3.response:0 "Our researchers have successfully uncovered further clues. On an ordinary world previously unnoticed, a massive facility has appeared. This facility has now been confirmed as a Galactic Empire research center, though under $Name_kuat$'s control. We lack further information about the relationship between the Galactic Empire and $Name_kuat$, but we may find more valuable data within the research center's logs.\n\nThe culprit behind the Eternal Fleet wreckage we previously discovered is indeed $Name_kuat$, who built this research center. From this, we can hypothesize that $Name_kuat$ still exists somewhere in the universe, continuing to purge the Eternal Fleet. Strangely, various evidence suggests the Eternal Fleet was once under their control — yet for unknown reasons, they now seek its complete annihilation."

  kuat_event_memory.1.y4:0 "Eternal Path - $site_Eternal_clues$"
  kuat_event_memory.1.y4.response:0 "Our researchers have uncovered new leads within the Eternal Fleet warships we recently salvaged. Telemetry analysis indicates that the fleet's supreme command nexus — the Eternal Throne — bears an uncanny resemblance to the divine throne described in our ancestral scriptures. Several cultists among the crew have begun proclaiming that this discovery heralds the salvation of Zakuul; the personnel involved have been placed in custody pending further investigation."

  kuat_event_memory.1.y5:0 "Eternal Path - $site_Eternal_Scientificresearchcenter$"
  kuat_event_memory.1.y5.response:0 "To think that the divine miracles recorded by our ancestors actually originated from the silent Eternal Fleet! These war machines, known as the Eternal Fleet, were once controlled by the Galactic Empire; following the Empire's dissolution, however, their behavior changed drastically. Perhaps that explains why $Name_kuat$ sought to purge them.\n\nYet what remains baffling is the role played by $Name_Kuat_Fire_base$ — and what faction $Name_Kuat_Fire_base$ truly represents. Further investigation is required."

  kuat_event_memory.1.y6:0 "Eternal Path - $site_Eternal_systeam$"
  kuat_event_memory.1.y6.response:0 "The origin of the Eternal Fleet is now clear. The collapse of the Galactic Empire caused chaos within the Eternal Fleet, leading the nascent Galactic Empire to adopt a radically different stance. $Name_kuat$, as one of its members, relentlessly hunted the Eternal Fleet. Under these circumstances, the Eternal Fleet was seemingly eradicated, though a few survivors went into hiding.\n\nChurch records venerating [planet_Zildrog.GetName] describe divine powers that are actually ancient accounts of the Eternal Fleet. Ancients could not comprehend them, but we can. Since the Eternal Fleet chose to slumber here, we must be the civilization they selected. We must attempt to awaken the Eternal Intelligence and reclaim control of the Eternal Fleet."

  kuat_event_memory.1.z:0 "Eternal Path - $Name_kuat$ Returns"
  kuat_event_memory.1.z.response:0 "The demise of the Endodian Empire proves the superiority of our alliance with the Eternal Fleet. Now, $Name_kuat$ returns, unwilling to back down. After $Name_kuat$ issued an ultimatum demanding we abandon the Eternal Fleet, we firmly rejected them, seized their technology, and decisively defeated $Name_kuat$.\n\nYet shadows from the past did not vanish with $Name_kuat$'s defeat. $Name_kuat$ left behind a holocron, which will help us uncover the Eternal Fleet's history. Now, we must activate the holocron (Relic)."

  kuat_event_memory.1.z0:0 "Apocalypse - $Name_Kuat_Fire_base$'s Wrath"
  kuat_event_memory.1.z0.response:0 "Through our meticulous planning, $Name_Kuat_Fire_base$'s invasion has been utterly crushed. These hypocritical raiders will never defeat us. If $Name_Kuat_StarContractor$ speaks the truth, our sector will soon be completely sealed off, ensuring $Name_Kuat_Fire_base$ can never overcome us. Though our strength is currently insufficient, given enough time, the future may yet be ours.\n\n$Name_Kuat_Fire_base$ failed due to arrogance — we must never repeat that mistake. A new Endodian Empire begins today. Yet the secrets of this system remain unrevealed. What truly is $Name_Kuat_StarContractor$? $Name_F_1$ remains shrouded in mystery."

  kuat_event_memory.1.z1:0 "§EThe Eternal Path - Mind Prison - 1§!"
  kuat_event_memory.1.z1.response:0 "The Rakatan seer has taken over our explorer's body, returning to the present world. We have recorded the dialogue between the seer and us after their return.\n\nQ:$kuat_galatic_empire_ge_invasion.245.a$\nA:$kuat_galatic_empire_ge_invasion.245.a.resp$\n\nQ:$kuat_galatic_empire_ge_invasion.245.b$\nA:$kuat_galatic_empire_ge_invasion.245.b.resp$"

  kuat_event_memory.1.z2:0 "§EThe Eternal Path - Mind Prison - 2§!"
  kuat_event_memory.1.z2.response:0 "The Rakatan seer has taken over our explorer's body, returning to the present world. We have recorded the dialogue between the seer and us after their return.\n\nQ:$kuat_galatic_empire_ge_invasion.245.c$\nA:$kuat_galatic_empire_ge_invasion.245.c.resp$\n\nQ:$kuat_galatic_empire_ge_invasion.245.d$\nA:$kuat_galatic_empire_ge_invasion.245.d.resp$"

  kuat_event_memory.1.z3:0 "§EThe Eternal Path - Mind Prison - 3§!"
  kuat_event_memory.1.z3.response:0 "The Rakata seer has seized the body of our explorer. They have returned to the present world, and we have recorded the dialogue with the seer after their return.\n\nQ:$kuat_galatic_empire_ge_invasion.245.e$\nA:$kuat_galatic_empire_ge_invasion.245.e.resp$\n\nQ:$kuat_galatic_empire_ge_invasion.245.f$\nA:$kuat_galatic_empire_ge_invasion.245.f.resp$\n\nThe Rakata seer has deceived us into reviving the Infinite Empire, yet the Infinite Empire betrayed us, demanding we surrender the Eternal Fleet. In the end, we sent them on their final journey. However, the Twins were later severely damaged by a suppressive virus from their creators, the Rakata. We must now make a decision — true crisis is coming."

  kuat_event_memory.1.z4:0 "§EThe Eternal Path - Mind Prison - 4§!"
  kuat_event_memory.1.z4.response:0 "$kuat_infinite_rakata_rift.22.desc$\n\nThe awakening of the Rakata seer has become inevitable."

  kuat_event_memory.3.a:0 "Joint Research Project - $kuat_fallen_mission_reaction_6_project$"
  kuat_event_memory.3.a.response:0 "Our researchers have successfully documented the following: Judging from the basic structure of this weapon turret, its internal primary structure closely resembles our existing UV laser weapons, but operates at energy levels far exceeding them. Other components are more complex — the high-energy laser beam generated in the upper stage is then guided through a stream of gas we currently cannot comprehend.\n\nThrough some unknown reaction, a dense plasma beam is then fired."

  kuat_event_memory.3.b:0 "Joint Research Project - $kuat_fallen_mission_reaction_7_project$"
  kuat_event_memory.3.b.response:0 "Our researchers have compiled the following report: This is an extraordinarily rare substance — a radioactive isotope of a fuel known as Illerium. Preliminary tests on the sample provided by $Name_kuat$ indicate that the material exerts powerful distortions upon both gravitational and electromagnetic fields. While relatively stable under standard conditions, it releases staggering amounts of energy when bombarded with specific particle streams.\n\nOur research division estimates that a single microgram of this isotope could power a standard datapad at maximum load for an entire century."

  kuat_event_memory.3.c:0 "Joint Research Project - $kuat_fallen_mission_reaction_8_project$"
  kuat_event_memory.3.c.response:0 "Our researchers have successfully documented the following: This weapon is designed to connect directly to a ship's reactor core, appearing to be an immensely power-hungry system — our reactors are completely incapable of supporting its energy demands. It resembles a naval weapon we once examined, but this weapon's excitation laser sustains power over time, generating longer and more intense particle beams. These beams then pass through an intricately designed focusing apparatus and particle acceleration track, greatly enhancing destructive power. It is speculated that its output could destroy any known vessel in a single strike.\n\nAccording to Force-sensitive individuals among us, the focusing device likely contains massive Kyber crystals."

  kuat_event_memory.3.d:0 "Joint Research Project - $kuat_fallen_mission_reaction_9_project$"
  kuat_event_memory.3.d.response:0 "Our researchers have successfully documented the following: $Name_kuat$ delivered to us a computing network unlike anything we've ever seen, requesting we study it and return our findings. It uses advanced signal transmission and reception systems to turn every ship in a fleet into a computing node, and even multiple node clusters across different fleets can form a new Ascended computing network.\n\nThis advanced distributed architecture can handle terrifying computational and storage demands. We do not yet know what kind of system would require such immense processing power. We attempted further reverse engineering, but clearly, our current technology and hardware are entirely insufficient to replicate this system."

  kuat_event_memory.3.e:0 "Joint Research Project - $kuat_fallen_mission_reaction_10_project$"
  kuat_event_memory.3.e.response:0 "Our researchers have successfully documented the following: This system resembles the special interference system used by $Name_kuat$, but appears to be more powerful in terms of output. It employs unique methods to enhance shield and armor efficiency while reducing enemy weapon output. However, $Name_kuat$'s Star Dreadnoughts can partially resist its effects.\n\nOur Force-sensitive members sensed that this technology contains elements of Dark Side Force techniques, making replication impossible for us."

  kuat_event_memory.3.f:0 "Joint Research Project - $kuat_fallen_mission_reaction_11_project$"
  kuat_event_memory.3.f.response:0 "Our researchers have compiled the following report: Based on our field discoveries and partial technical schematics provided by $Name_kuat$, this component appears to be a core communications beacon from a massive Star Fortress, capable of broadcasting high-frequency tachyon signals for real-time long-range communications — though it requires several (errors) as relay amplifiers to achieve stable intergalactic transmission.\n\nFurthermore, surviving archive fragments indicate that when synchronized with the error....error.... Station and the Eternal error....error.... Fleet, the device can project a system-wide support field that renders friendly fleets within its radius virtually indestructible."

  kuat_event_memory.3.g:0 "Joint Research Project - $kuat_fallen_mission_reaction_12_project$"
  kuat_event_memory.3.g.response:0 "Our researchers have successfully documented the following: This is a reactor that annihilates a form of exotic matter fuel, creating a miniature star within the reaction chamber to generate power. Unlike conventional exotic matter reactors, this reactor consumes the fuel directly, whereas standard versions extract extradimensional exotic matter via fuel decay. This design achieves higher efficiency and energy output.\n\nSome key materials and components are beyond our production capabilities and were directly supplied by $Name_kuat$, so we cannot manufacture it independently."

  kuat_event_memory.3.h:0 "Joint Research Project - $kuat_fallen_mission_reaction_13_project$"
  kuat_event_memory.3.h.response:0 "Our researchers have successfully documented the following: Unlike typical Kuat designs, this vessel is entirely black and shaped like a horizontal T, though the front crossbar makes it resemble a cross, with engines at the rear. Its main guns are mounted on the front crossbar, with turrets capable of flexible rotation. The propulsion system is highly advanced, significantly faster than ours, and equipped with a cloaking generator.\n\nIts shape and energy signature resemble vessels once fought by the Endodian Empire — perhaps what Kuat has us studying is extraordinary..."

  kuat_event_memory.3.i:0 "Joint Research Project - $kuat_fallen_mission_reaction_14_project$"
  kuat_event_memory.3.i.response:0 "Our researchers have successfully documented the following: According to data provided by $Name_kuat$ and information we uncovered... this may be an artificial intelligence designed as a fleet command system by a superpower known as the Infinite Empire, created during a plague to save their civilization. Allegedly, it was constructed at the cost of life force from several species and worlds.\n\nArchaeological records also suggest the Infinite Empire was destroyed due to rebellion by their automated battle fleets. The truth is chilling... Could they be researching the same strange fleets once opposed by the Endodian Empire?"

  kuat_event_memory.3.j:0 "Joint Research Project - $kuat_fallen_mission_reaction_15_project$"
  kuat_event_memory.3.j.response:0 "Our researchers have successfully documented the following: This massive war fortress bears striking similarities to fortresses we've built and certain Kuat facilities, yet its subsystems and armaments appear even more powerful.\n\nCombat records from the Endodian Empire's battles against extragalactic drone fleets indicate these fortresses once appeared on battlefields, providing support for automated fleets. According to our studies of interstellar communication beacons, these fortresses would provide endless fleet reinforcements during invasions unless three special facilities were deactivated. Clearly, what Kuat has us researching is no coincidence..."

  kuat_event_memory.3.k:0 "Joint Research Project - $kuat_fallen_mission_reaction_16_project$"
  kuat_event_memory.3.k.response:0 "Our researchers have successfully documented the following: $Name_kuat$ informed us that certain new designs require greater energy. Out of apparent trust and friendly gesture, they chose to entrust us with studying this energy regulation component. Given previous clues, we can roughly deduce what $Name_kuat$ is researching — but now may not be the time to confront them openly.\n\nThis device aims to optimize reactor output and reduce ship energy consumption. One wonders — what energy-intensive system would necessitate such a device?"

  kuat_event_memory.3.l:0 "Joint Research Project - $kuat_fallen_mission_reaction_17_project$"
  kuat_event_memory.3.l.response:0 "Our researchers have successfully documented the following: Similar to $Name_kuat$'s Star Dreadnoughts, this vessel serves as a flagship and possesses certain anti-jamming capabilities. However, differing from Kuat's Super Star Destroyer design philosophy, this ship mounts only four of the previously studied superlasers, seemingly intended for long-range bombardment.\n\nAdditionally, Endodian combat logs mention appearances of these ships, often operating alongside Battlecruisers from the automated fleets. It seems obvious now what $Name_kuat$ wants us to help research..."


  TIMELINE_EVENT_GALATIC_KUAT_RETURNED_TOOLTIP: "§EDefeat of the Galactic Empire§! — An inevitable outcome. In this gambit against fate, we have seized the winning edge."
  TIMELINE_EVENT_GALATIC_KUAT_RETURNED: "Imperial Defeat\n§L[GetDate]§!"

  TIMELINE_EVENT_GALATIC_KUAT_BE_RETURNED_TOOLTIP: "§EArrival of the Eternal§! — Yet they are merely the fish, and we are merely the bait."
  TIMELINE_EVENT_GALATIC_KUAT_BE_RETURNED: "The Eternal Arrive\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_INVASION_TOOLTIP: "§EFirst Contact with the Eternal§! — Just as the Endodian archives foretold, these ancient war machines have returned. Same script, different ending — the Eternal Fleet has been routed!"
  TIMELINE_EVENT_ETERNAL_INVASION: "First Encounter with the Eternal\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_RETURN_INVASION_TOOLTIP: "§EThe Eternal Return§! — Yet we have long mastered the means to counter these war machines. We are the true victors!"
  TIMELINE_EVENT_ETERNAL_RETURN_INVASION: "Eternal Returns\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_LEGACY_01_TOOLTIP: "§EIsotope-5 Construct§! A wondrous substance."
  TIMELINE_EVENT_ETERNAL_LEGACY_01: "$site_Eternal_outpost$\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_LEGACY_02_TOOLTIP: "§EIsotope-5 Construct§! A forgotten vessel — could there be a connection?"
  TIMELINE_EVENT_ETERNAL_LEGACY_02: "$site_Eternal_legacysatellite$\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_LEGACY_03_TOOLTIP: "§EEternal Fortress§! — Seems to be some kind of massive combat platform, quite interesting."
  TIMELINE_EVENT_ETERNAL_LEGACY_03: "$site_Eternal_Crashedbattleships$\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_LEGACY_04_TOOLTIP: "§EGreat Purge§! — The faction named $Name_kuat$ is conducting a large-scale purge against the Eternal Fleet, but why?"
  TIMELINE_EVENT_ETERNAL_LEGACY_04: "$site_Eternal_Mysteriousfacilities$\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_LEGACY_05_TOOLTIP: "§EAncient Texts§! — The Eternal Gods mentioned in ancient scriptures seem to have some connection with the Eternal Fleet; why do they resemble each other so much?"
  TIMELINE_EVENT_ETERNAL_LEGACY_05: "$site_Eternal_clues$\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_LEGACY_06_TOOLTIP: "§EFratricide§! — The Eternal Fleet, $Name_kuat$, $Name_Kuat_Fire_base$ — what roles are they really playing?"
  TIMELINE_EVENT_ETERNAL_LEGACY_06: "$site_Eternal_Scientificresearchcenter$\n§L[GetDate]§!"

  TIMELINE_EVENT_ETERNAL_LEGACY_07_TOOLTIP: "§EEternal End§! — The Eternal Fleet became the final straw that broke the Galactic Empire. $Name_kuat$ seems unable to accept this and has launched a massive cleansing operation against the Eternal Fleet, but is the truth really so?"
  TIMELINE_EVENT_ETERNAL_LEGACY_07: "$site_Eternal_systeam$\n§L[GetDate]§!"

  TIMELINE_EVENT_GALATIC_EMPIRE_DESTROYED_TOOLTIP: "§E$Name_kuat$ Returns§! — After a thousand years, they have returned once again. Yet they shall face their most devastating defeat."
  TIMELINE_EVENT_GALATIC_EMPIRE_DESTROYED: "$Name_kuat$ Returns\n§L[GetDate]§!"

  TIMELINE_EVENT_GALATIC_COUNCIL_GUARDIAN_DESTROYED_TOOLTIP: "§ERuins of the Endodian Empire§! — Now only ruins remain, along with schemers guarding its corpse.\nWhat exactly is $Name_Kuat_Fire_base$ plotting?"
  TIMELINE_EVENT_GALATIC_COUNCIL_GUARDIAN_DESTROYED: "$NAME_kuat_galatic_empire_e_area$\n§L[GetDate]§!"

  TIMELINE_EVENT_ENDODIA_LEGACY_01_TOOLTIP: "§ELegacy Gateway§! — Special Gateways scattered across the galaxy — what role do they play?"
  TIMELINE_EVENT_ENDODIA_LEGACY_01: "$kuat_lagacy_9$\n§L[GetDate]§!"

  TIMELINE_EVENT_ENDODIA_LEGACY_02_TOOLTIP: "§ELegacy Gateway§! — Seems to be a special Gateway from $Name_kuat$, the purpose behind their construction is intriguing."
  TIMELINE_EVENT_ENDODIA_LEGACY_02: "$kuat_lagacy_10$\n§L[GetDate]§!"

  TIMELINE_EVENT_ENDODIA_LEGACY_03_TOOLTIP: "§EOmen of Shadows§! — The Endodia Empire once reached this point, and how far will we walk into the darkness? What secrets of $Name_kuat$ remain unknown to us? Movements from beyond the dark grow ever clearer — crisis is imminent."
  TIMELINE_EVENT_ENDODIA_LEGACY_03: "Omen of Shadows\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_01_TOOLTIP: "Judging from the basic structure of this weapon turret, its internal primary structure closely resembles our current ultraviolet lasers and similar weapons, but operates at energy levels far exceeding them. Other components are considerably more complex; specific details require further investigation."
  TIMELINE_EVENT_SHADOW_COPORUATION_01: "$kuat_fallen_mission_reaction_6_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_02_TOOLTIP: "This is an extremely rare substance, a radioactive isotope of a fuel called Illerium. Preliminary studies on samples provided by $Name_kuat$ indicate that this material exerts powerful distortions on gravitational and electromagnetic fields. It remains relatively stable under normal conditions, but when bombarded with particles under specific conditions, it releases enormous amounts of energy."
  TIMELINE_EVENT_SHADOW_COPORUATION_02: "$kuat_fallen_mission_reaction_7_project$\n§L[GetDate]§!"

