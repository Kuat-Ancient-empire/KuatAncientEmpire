 Firing_The_StarKiller:"§E$kuat_starkillerbase_1$ firing"
 Firing_The_StarKiller_desc:"We will activate our $kuat_starkillerbase_1$"
 Firing_The_StarKiller_tooltip:"$kuat_starkillerbase_1$ will activate"
 Building_The_Kuat_Command_Line:"§EConstruct $building_kuat_command_center$"
 Building_The_Kuat_Command_Line_desc:"We will construct a magnificent galactic central building!"
 Building_The_Kuat_Command_Line_Auto_planet:"§EConstruct Automated Data Hub§!"
 Building_The_Kuat_Command_Line_Auto_planet_desc:"We will construct a magnificent galactic central World! Supported by distributed server arrays, all inhabitants of the World will efficiently serve the nation within the data realm, and industrial activities will be fully managed by intelligent AI systems."
 Building_The_Kuat_AI_Command_Line_Auto_planet:"§EUpgrade Automated Data Hub§!"
 Building_The_Kuat_AI_Command_Line_Auto_planet_desc:"$Building_The_Kuat_Command_Line_Auto_planet_desc$"
 Bulding_kuat_auto_planet_focus_target:0 "§ESet Focus"
 Bulding_kuat_auto_planet_focus_target_desc:0 "The Automated Data Hub stores vast amounts of information across the entire World. Setting a focus center will elevate the core status of this galactic central building, allowing it to receive data migration from other data centers."
 building_kuat_command_center_target_desc:0 "Set this Automated Data Hub as the focal data center"
 Bulding_kuat_auto_planet_focus_remove_target:0 "§ERemove Focus"
 Bulding_kuat_auto_planet_focus_remove_target_desc:0 "The Automated Data Hub stores vast amounts of information across the entire World. Removing the focus will prevent this data center from receiving data migrations from other centers."
 building_kuat_command_center_remove_target_desc:0 "This Automated Data Hub is no longer serving as the focal data center."
 Building_kuat_auto_planet_migrant_data:0 "§EMigrate Data"
 Building_kuat_auto_planet_migrant_data_desc:0 "The Automated Data Hub stores vast amounts of information across the entire World. Data migration allows this World's data to be transferred to the focal data center with minimal loss."
 Building_kuat_auto_planet_migrant_data_failed:0 "Data migration is currently in progress; bandwidth cannot support a second World migrating data."
 building_kuat_command_center_migrant_data_desc:0 "Pops' industrial data from the World will be fully migrated to the focal data center, and the World colony will be abandoned!"
 Building_The_Kuat_Shield:"§EActivate $building_kuat_shield$§!"
 building_kuat_shield_tooltip:"§EThis will activate $building_kuat_shield$. $building_kuat_shield$ will operate for 720 days. During operation, the World will not suffer bombardment.§!"
 Building_The_Kuat_Shield_desc:"$building_kuat_shield_tooltip$"
 Destroy_The_Kuat_Shield:"§EDeactivate $building_kuat_shield$§!"
 Destroy_The_Kuat_Shield_desc:"§EThis will deactivate $building_kuat_shield$§!"
 Destroy_The_Kuat_Shield_tooltip:"$Destroy_The_Kuat_Shield_desc$"
