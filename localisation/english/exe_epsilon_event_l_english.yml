 ###### 事件 ######
 kuat_epsilon.1.name:0 "§HRuined Sector§!"
 kuat_epsilon.1.desc:0 "After traversing the hyperspace corridor, §H[Root.GetName]§! has arrived in an empty expanse.\n\nThis system differs from anything we've seen in the Kuat Sector-it is a massive, galaxy-scale installation. The entire ring structure and the sharp, towering obelisks standing desolate in deep space appear bizarre and oppressive. Our ship sensors detect intense tachyon signal fields surrounding the central ring, severely hindering long-range scanning. Furthermore, the entire system is disrupted by powerful tachyon signals and an unknown energy type never before detected in the Kuat Cluster.\n\nAccording to our scientists, the megastructures across this sector do not match Kuat architectural styles. Even the materials and design of the obelisks and the central structure above the star are entirely different. Our researchers believe we should intensify our study of this facility to uncover its true secrets.\n\nDue to missing critical technical data and lack of support from prior dominators, resolving this will take considerable time. Patience is required!"
 kuat_epsilon.1.a:0 "Strange..."
 kuat_epsilon.2.name:0 "§HNew Progress§!"
 kuat_epsilon.2.desc:0 "According to reports from our science division: one of the shield bands among several rings within §H[kuat_ancient_epsilon_star.GetName]§! has undergone a dramatic shift in energy reaction-the strongest response observed in this sector in decades.\n\nOur scientists have seized this opportunity to rapidly locate multiple shield nodes. Their report indicates we have now largely determined the operational patterns and signal architecture of the shields. After years of stalled research, our team has successfully captured what feels like a gift from the heavens. This is our moment to act-we must analyze the system's energy and signal structures, disrupt the stability of the tachyon signals, and collapse the energy framework sustaining the shields."
 kuat_epsilon.5.name:"§HEnergy Surge§!"
 kuat_epsilon.5.desc:"The tachyon signal shield over [root.GetName] has fully disengaged. However, due to the chaotic and powerful tachyon magnetic fields, the planetary energy source remains active. Upon shield release, a catastrophic disaster erupted in orbit. Violent energies surged across the planet's orbital path, with high-frequency, high-intensity reactions rapidly exploding throughout. These energy storms destroyed all Blockers in orbit, though fortunately the ring itself sustained no serious damage.\n\n§EThe energy burst was brief. Once the orbital energy dissipates, [root.GetName] will reveal its habitable surface. We should now land and colonize this ring to seek valuable information.§!"
 kuat_epsilon.2.a:"Deploy more personnel to unlock the shield as quickly as possible."
 kuat_epsilon.5.a:"Begin landing preparations immediately!"
 kuat_epsilon.6.name:0 "§H[Root.GetName]§!"
 kuat_epsilon.6.desc:0 "Our Colony Ship has landed on a rare open area of the rugged surface of §H[Root.GetName]§!, establishing a provisional government and taking necessary measures to address environmental challenges on §H[Root.GetName]§!. Overall, colonization proceeds smoothly.\n\nWhile exploring parts of §H[Root.GetName]§!, colonists accidentally discovered a ruin buried beneath glaciers. Dating analysis shows its construction period aligns closely with that of the dormant Stellar Forge in §H[kuat_ancient_epsilon_star.GetName]§!, likely built by the same civilization. According to colony reports, the ruin has long been abandoned, but its structural integrity remains good, possibly containing information useful for further research into §H[kuat_ancient_epsilon_star.GetName]§!. We must first clear it from the glaciers of §H[Root.GetName]§!; our engineers will complete this task shortly."
 kuat_epsilon.6.a:0 "Truly amazing"
 
 kuat_epsilon.7.name:0 "Peculiar Database"
 kuat_epsilon.7.desc:0 "We have completed clearing the peculiar database from the glaciers of §H[Root.GetName]§!. Preliminary studies by our science team indicate the structure's core is a Builder data repository and tachyon signal transmitter, highly similar to our own data storage buildings. However, imperial database queries confirm it was not constructed by any allied faction. Perhaps we can find what we seek here. Previous researchers on §H[Root.GetName]§! built a series of facilities of unclear purpose around this tachyon transmitter.\n\nOur science team reports the tachyon transmitter at the building's center does not originate from §H[kuat_ancient_epsilon_star.GetName]§!. Like the three strange obelisks in space, it was transported here by earlier researchers from another location. Our team requires more time to study this peculiar database."
 kuat_epsilon.7.a:0 "This ruin is highly valuable-we need more personnel to conduct research."
 kuat_epsilon.7.b:0 "This ruin is clearly suspicious-we must dismantle it immediately!"
 
 kuat_epsilon.8.name:0 "$kuat_epsilon.7.name$"
 kuat_epsilon.8.desc:0 "After completing the clearance of the peculiar database from the glaciers of §H[Root.GetName]§!, our researchers found this site identical to previously discovered ruins-a database facility centered on an ancient tachyon signal emitter. Further study is required."
 kuat_epsilon.8.a:0 "Truly amazing"
 kuat_epsilon.8.b:0 "Dismantle this structure."
 kuat_epsilon.12.name:0 "Archive Exploration Project"
 kuat_epsilon.12.desc:0 "After extensive research, our science team has completed reconnaissance around the peculiar database. Given our current status, we may now begin exploration and search operations within the archive."
 kuat_epsilon.12.a:0 "Truly amazing"
 kuat_epsilon.13.name:0 "$kuat_epsilon.12.name$"
 kuat_epsilon.13.desc:0 "We have completed Transformation work on the peculiar database on §H[Root.GetName]§! and conducted a preliminary survey of this data facility, which closely resembles our own data centers. Researchers are now conducting a full investigation into past events, and our deployed tachyon signal amplifiers are ready. The science team has successfully obtained the structure of the tachyon signals discovered within the peculiar database-the resonance broadcast pattern of the Eternal Fleet.\n\nBased on other information previously recovered from ruins, we now possess a crucial lead to reactivate the entire Stellar Forge. This fortress will become a vital support for our fleet. Our science team believes these signals relate to certain data earlier researchers obtained from the obelisks, and that the tachyon signal structure was referred to by those researchers as \"§HIdentifier [GetKuatEpsilonCode1]§!\""
 kuat_epsilon.13.a:0 "Excellent"
 kuat_epsilon.13.a.tooltip:0 "[GetKuatEpsilonObelisk1] Identifier: §H[GetKuatEpsilonCode1]§!"
 
 kuat_epsilon.14.name:0 "$kuat_epsilon.12.name$"
 kuat_epsilon.14.desc:0 "Since the peculiar database on §H[Root.GetName]§! was cleared from the glaciers, our research team has been studying this database, but for a long time there were no noteworthy findings-until recently, when our research team made some interesting discoveries.\n\nAccording to reports from the research team on §H[Root.GetName]§!, they detected a strange tachyon signal above the ancient data nexus that consistently forms a specific geometric structure. However, this signal is so faint that it was once mistaken for an instrument Glitch. Our research team struggles to decipher its content and requests that the colonial government of §H[Root.GetName]§! allocate resources to support further investigation of this peculiar database by installing additional tachyon signal amplifiers within the ruins to assist in analyzing this unusual tachyon signal.\n\nUnfortunately, modifying the peculiar database on §H[Root.GetName]§! is not easy. The ancient tachyon emitter at the center of the ruins severely interferes with our work, and our research team requires more resources to find solutions."
 kuat_epsilon.14.a:0 "Approve special project."
 
 kuat_epsilon.15.name:0 "$kuat_epsilon.12.name$"
 kuat_epsilon.15.a.desc:0 "Since our research team began exploring and searching the peculiar database on §H[Root.GetName]§!, we have obtained some highly valuable ancient data. These data indicate that the database is closely related to these attracted Explorers. Lured by the Forge and guided by the dark side of the Force, these Explorers revealed their ambitions and desires, attempting to seize control of the entire facility-or even dominate the entire universe.\n\nThey explored ancient star systems that do not exist within known coordinates. Unfortunately, they were drawn here by the tachyon signals emitted by the Forge and became fuel for it. After the collapse of the Rakata Empire, the automated maintenance systems of the entire stellar forge gradually became independent. Due to the Infinite Rakata Empire's prolonged use of the dark side of the Force, the fortress has almost become a semi-living entity, manipulating and driving anyone who attempts to control it through the dark side. This is a fortress filled with expansionist and warlike desires, steadily consuming the principles and ideals of its users.\n\nWhile our scientists continue their investigation, much of the material within this facility is already damaged, preventing us from obtaining useful information."
 kuat_epsilon.15.b.desc:0 "Since our research team began exploring and searching the peculiar database on §H[Root.GetName]§!, we have obtained some highly valuable ancient data. At this new facility, our researchers painstakingly recovered research materials left behind by Explorers from the previous site.\n\nThe Explorers' exploration of these facilities was extremely thorough. Under the temptation of the Stellar Forge, they gradually descended into the corrupted Abyss. The Explorers discovered that some facilities of the Forge bear striking similarities to those they had previously seen in the Death Star system.\n\nHowever, the Explorers had no chance to investigate further. Starting from what could be discerned within the ruins, they analyzed the magnetic resonance and tachyon signal frequencies, discovering that these tachyon frequencies appear to match the resonant frequency of some intelligent system. Although detectable via instruments, these resonant frequencies exhibit extreme stability and cannot be disrupted. Upon realizing interference was impossible, the Explorers, in a state of obsession, decided to channel these signals through diagonally opposed facilities into the entire Stellar Forge to activate it.\n\nYet as we sought more information, our trail went cold. We must now proceed to the next facility."
 kuat_epsilon.15.c.desc:0 "Since our research team began exploring and searching the peculiar database on §H[Root.GetName]§!, we have obtained some highly valuable ancient data. Our researchers' investigation inside the final peculiar database facility we discovered went smoothly, and we successfully recovered all records left by the Explorers and learned of their ultimate fate.\n\nThe Explorers resolved to activate the Forge, but under the temptation and fear induced by the dark side of the Force, they erupted into fierce conflict over exclusive control of the Stellar Forge, turning on each other. This battle was unforeseeable for everyone involved; once awareness set in, more Explorers joined the fray to fight for survival and Strength.\n\nIt is lamentable that the Explorers exhausted every means solely to slaughter one another and vie for the Stellar Forge, yet not a single one emerged victorious.\n\nFurthermore, according to our analysis, the Forge's communication signals are extremely similar to those of the Eternal Fleet, converging here to produce a peculiar magnetic resonance. Although we cannot determine the exact details about the Forge, our researchers believe its creators have likely been completely eradicated. Thus, we can leverage the Stellar Forge to provide strong support against the approaching Eternal Fleet!"
 kuat_epsilon.15.a:0 "Whether the Eternal Fleet or the Stellar Forge, both shall be fully under our control."
 
 kuat_epsilon.21.name:0 "Work of Predecessors"
 kuat_epsilon.21.a.desc:0 "After a period of archaeological work, our research team uncovered partial surviving records within the peculiar database on §H[Root.GetName]§!-the Research results of prior researchers on §H[Root.GetName]§! who studied this peculiar database. These Research results were carefully stored within the database when the Explorers departed, suggesting they once planned to return to §H[kuat_ancient_epsilon_star.GetName]§! at some future time to resume their unfinished work. However, those researchers never returned to §H[kuat_ancient_epsilon_star.GetName]§!. Ultimately, they were lured by the Forge, turned on each other, and perished. Their Legacy Research results will now provide us with valuable assistance.\n\nHowever, according to the research team's report, the previous researchers implemented numerous protective measures around these materials, which exceed the capabilities of the colonial government on §H[Root.GetName]§! to handle. They require additional manpower and resources from us to breach these protections and continue their research."
 kuat_epsilon.21.b.desc:0 "Our research team has found another set of legacy Research results from predecessors within the peculiar database on §H[Root.GetName]§!. It also possesses certain protective measures. We require more manpower and resources to continue our research."
 kuat_epsilon.21.a:0 "Truly amazing"
 
 kuat_epsilon.22.name:0 "$kuat_epsilon.21.name$"
 kuat_epsilon.22.a.desc:0 "$kuat_epsilon.21.a.desc$"
 kuat_epsilon.22.b.desc:0 "$kuat_epsilon.21.b.desc$"
 kuat_epsilon.22.a:0 "Truly amazing"
 
 kuat_epsilon.23.name:0 "$kuat_epsilon.21.name$"
 kuat_epsilon.23.a.desc:0 "$kuat_epsilon.21.a.desc$"
 kuat_epsilon.23.b.desc:0 "$kuat_epsilon.21.b.desc$"
 kuat_epsilon.23.a:0 "Truly amazing"
 
 kuat_epsilon.25.name:0 "§EAncient Research Findings: I§!"
 kuat_epsilon.25.desc:0 "The research team led by §H[Root.GetLeaderName]§! has completed necessary preparations near the peculiar database on §H[From.Planet.GetName]§!. All equipment required for archaeological work is ready. Our research team may now proceed to the next phase."
 kuat_epsilon.25.a:0 "Continue"
 
 kuat_epsilon.26.name:0 "§EAncient Research Findings: II§!"
 kuat_epsilon.26.a.desc:0 "After a period of research, the research team led by §H[Root.GetLeaderName]§! has found a way to bypass the security measures. Based on currently available information, our research team believes that the Explorers who once operated on §H[kuat_ancient_epsilon_star.GetName]§! were dedicated to studying a peculiar database they called the 'Stellar Forge'-that massive, deranged space station located at the center of §H[kuat_ancient_epsilon_star.GetName]§!.\n\nOur research team reports that the previous Explorers believed this station to be a powerful automated weapon. However, it appears the station had already ceased operation when they discovered §H[kuat_ancient_epsilon_star.GetName]§!. Tempted by this fortress in darkness, they decided to reactivate the entire fortress's systems using tachyon signal resonance from the surrounding structures. To restart the fortress, the previous researchers transported three obelisk-like ancient structures from elsewhere. Our research team does not yet understand how these obelisks function, and further study will require additional time."
 kuat_epsilon.26.b.desc:0 "After a period of research, the research team led by §H[Root.GetLeaderName]§! has found a way to bypass the security measures. Our research team is currently analyzing the acquired information and expects it will take some time before results are finalized."
 kuat_epsilon.26.a:0 "Truly amazing"
 
 kuat_epsilon.27.name:0 "§EAncient Research Findings: III§!"
 kuat_epsilon.27.a.desc:0 "Our research team's archaeological work on §H[From.Planet.GetName]§! has concluded successfully. §H[Root.GetLeaderName]§!'s report indicates that the three obelisks within §H[kuat_ancient_epsilon_star.GetName]§! are called Eternal Obelisks, though we do not know how they were constructed. However, these obelisks possess a special tachyon signal resonance amplification system capable of enhancing the tachyon resonance field through the star's energy output, thereby reactivating the Stellar Forge.\n\nThe previous Explorers had already completed setup of the Eternal Obelisks, but ultimately abandoned their efforts due to succumbing to temptation and foolish infighting. Our research indicates that activating an obelisk requires adjusting two control parameters known as '§HUpper Code§!' and '§HLower Code§!'. Previous researchers have already obtained the obelisk's §HUpper Code[GetKuatEpsilonCode0]§!. Building upon their work, perhaps we can soon complete what those fools could not."
 kuat_epsilon.27.b.desc:0 "Our research team's archaeological work on §H[From.Planet.GetName]§! has concluded successfully. We have successfully recovered the Upper Code corresponding to the obelisk: §H[GetKuatEpsilonCode0]§!."
 kuat_epsilon.27.a:0 "Excellent"
 kuat_epsilon.27.a.tooltip:0 "[GetKuatEpsilonObelisk0] Upper Code: §H[GetKuatEpsilonCode0]§!\n§Y<You may now access the configuration interface by upgrading the corresponding ancient obelisk.>§!"
 
 kuat_epsilon.31.name:0 "§EEternal Obelisk§!"
 kuat_epsilon.31.a.desc:0 "<Initializing debug system ... ... §GComplete§!>\n<Establishing tachyon signal connection ... ... §GComplete§!>\n\n<Resetting instruction priority ... ... §Y4407§! ... §Y90§! ... §Y1§!>\n<Unknown visitor detected: §Rc0117a36§!>\n\n<Verifying tachyon signal frequency ... ... §G123202-407-01: c0117a36§!>\n<System permissions ... ... §YN1§!>\n\n<Appending subsystem ... ... §Y c0117a36-1023§!>\n<Resetting instruction priority ... ... §Y0117§! ... §Y90§! ... §Y1§!>\n<Requesting Upper Code ... ... >\n<Requesting Lower Code ... ... >"
 kuat_epsilon.31.b.desc:0 "<Initializing debug system ... ... §GComplete§!>\n<Establishing tachyon signal connection ... ... §GComplete§!>\n\n<Resetting instruction priority ... ... §Y4407§! ... §Y90§! ... §Y2§!>\n<Unknown visitor detected: §Rc0117a36§!>\n\n<Verifying tachyon signal frequency ... ... §G123202-407-02: c0117a36§!>\n<System permissions ... ... §YN1§!>\n\n<Appending subsystem ... ... §Y c0117a36-1023§!>\n\n<Resetting instruction priority ... ... §Y0117§! ... §Y90§! ... §Y2§!>\n\n<Requesting Upper Code ... ... >\n<Requesting Lower Code ... ... >"
 kuat_epsilon.31.c.desc:0 "<Initializing debug system ... ... §GComplete§!>\n<Establishing tachyon signal connection ... ... §GComplete§!>\n\n<Resetting instruction priority ... ... §Y4407§! ... §Y90§! ... §Y3§!>\n<Unknown visitor detected: §Rc0117a36§!>\n\n<Verifying tachyon signal frequency ... ... §G123202-407-03: c0117a36§!>\n<System permissions ... ... §YN1§!>\n\n<Appending subsystem ... ... §Y c0117a36-1023§!>\n<Resetting instruction priority ... ... §Y0117§! ... §Y90§! ... §Y3§!>\n\n<Requesting Upper Code ... ... >\n<Requesting Lower Code ... ... >"
 kuat_epsilon.31.a:0 "§EConfirm Configuration§!"
 
 kuat_epsilon.32.name:0 "Research Results"
 kuat_epsilon.32.desc:0 "Combining current Research results from studies of the peculiar databases across the three $pc_ringworld_habitable$ habitable zones, our research team has located a control facility near the Stellar Forge encircling the central star of §H[kuat_ancient_epsilon_star.GetName]§!. The previous Explorers intended to use this facility to simultaneously operate the three Eternal Obelisks within §H[kuat_ancient_epsilon_star.GetName]§! and resonate to activate the Forge. Our research team has completed modifications to this facility. Once our research teams adjust all three Eternal Obelisks and prepare them, we can use this control facility to trigger the obelisks and bombard the tachyon signal field of §H[kuat_ancient_epsilon_star.GetName]§! with resonance. Provided our data and codes are correct, the Forge may reactivate."
 kuat_epsilon.32.a:0 "Truly amazing"
 kuat_epsilon.32.a.tooltip:0 "§Y<You may now activate the three Eternal Obelisks by upgrading the Stellar Forge at the center of §H[kuat_ancient_epsilon_star.GetName]§!.>§!"
 
 kuat_epsilon.33.name:0 "Origin"
 kuat_epsilon.33.desc:0 "We have activated the three Eternal Obelisks within §H[kuat_ancient_epsilon_star.GetName]§!. Internal tachyon signal activity has begun, and these obelisks should start operating shortly."
 kuat_epsilon.33.a:0 "I hope we succeeded..."
 
 kuat_epsilon.37.name:0 "Progress"
 kuat_epsilon.37.desc:0 "The three Eternal Obelisks within §H[kuat_ancient_epsilon_star.GetName]§! have begun operating. Three strange beams of tachyon energy now strike the central star of the system, emitting bright orange light. Our research team has detected that the tachyon resonance intensity in the system is rapidly increasing and should soon reach the threshold required to restart the Stellar Forge."
 kuat_epsilon.37.a:0 "Very good. Let us continue waiting."
 
 kuat_epsilon.38.name:0 "Alert"
 kuat_epsilon.38.desc:0 "The three Eternal Monoliths within §H[kuat_ancient_epsilon_star.GetName]§! have begun operation, but things are not proceeding as we anticipated. The tachyon signal magnetic resonance intensity of the star system does not match the signal intensity levels obtained from our multiple simulation tests. Clearly, there are some issues with our setup."
 kuat_epsilon.38.a:0 "This looks very bad..."
 
 kuat_epsilon.39.name:0 "Resonance Amplification"
 kuat_epsilon.39.desc:0 "The three ancient Eternal Monoliths within §H[kuat_ancient_epsilon_star.GetName]§! have ceased operation. The tachyon signal activity at the top of the monoliths is gradually subsiding. They have completed their task as expected. The control system of the Stellar Forge is slowly powering up. Currently, it remains in a transitional state between on and off. However, its tachyon signal resonance with the surrounding environment has reached the expected intensity. Based on our research department's prior experience studying the tachyon frequencies of Stellar Forges and the Eternal Fleet, we should now be able to directly restart the Stellar Forge."
 kuat_epsilon.39.a:0 "Then let us begin."



#剧情回忆
  concept_kuat_mission_6_chain_add_on_1:0 "Before engaging any unit from this MOD in combat, ensure your fleet includes a flagship. If a secondary flagship is present, it can provide bonuses to the main flagship. Super-flagships do not require a secondary flagship."
  concept_kuat_mission_6_chain_add_on_1_desc:0 "$kuat_mission_6_chain_add_on_1$"
  concept_kuat_mission_6_chain_add_on_2:0 "When engaging any unit from this MOD in combat, the Dynamic Modifier System will activate. This system ensures balanced engagements. Supply zones will greatly increase the beneficial modifiers applied to your side while reducing the suppression effects you suffer. Therefore, try to engage within supply zones whenever possible."
  concept_kuat_mission_6_chain_add_on_2_desc:0 "$kuat_mission_6_chain_add_on_2$"
  concept_kuat_mission_6_chain_add_on_3:0 "Some special units possess independent combat functions. For example, both the Infinite Empire and the Wanderers have abilities that restore a certain number of destroyed ships upon killing an enemy. Guardian Cruisers possess efficiency suppression capabilities against enemy ships not from this MOD. Kuat, Overseer, and Wanderer series: do not require flagship fleets; Infinite Empire and Eternal Fleet require the presence of a flagship fleet."
  concept_kuat_mission_6_chain_add_on_3_desc:0 "$kuat_mission_6_chain_add_on_3$"
  concept_kuat_mission_6_chain_add_on_4:0 "All independent combat units within this MOD possess Autonomous support systems to ensure stable event chain operations."
  concept_kuat_mission_6_chain_add_on_4_desc:0 "$kuat_mission_6_chain_add_on_4$"
  concept_kuat_mission_6_chain_add_on_5:0 "Flagship"
  concept_kuat_mission_6_chain_add_on_5_desc:0 "A Flagship refers to all restricted-quantity constructed Star Dreadnoughts, including $Name_boss_Venganza$, $Name_boss_Dominance$, $NAME_KUAT_Annihilator$, $Name_boss_eclipse$, $NAME_KUAT_COMPELLOR$, $NAME_KUAT_IMPELLOR$, $NAME_KUAT_EXECUTOR_1$, $NAME_KUAT_EXECUTOR$, $Name_boss_Dominance$, Infinite Battlecruisers, Eternal Flagships, and supported flagships from other MODs."
  concept_kuat_mission_6_chain_add_on_6:0 "Secondary Flagship / Support Ship"
  concept_kuat_mission_6_chain_add_on_6_desc:0 "Includes §YBalletor$X308_Balletor$, Titan-class$X308_Balletor$, Tyrant-class$X308_Balletor$, and supported flagships from other MODs."
  concept_kuat_mission_6_chain_add_on_7:0 "Super Flagship / Supremacy Flagship"
  concept_kuat_mission_6_chain_add_on_7_desc:0 "Only includes $NAME_KUAT_COMPELLOR$, $NAME_KUAT_IMPELLOR$ Star Dreadnoughts, $Name_boss_eclipse$ Star Dreadnought, Infinite Carriers, Wanderer Carriers, Sleeper Flagships, and supported flagships from other MODs."

