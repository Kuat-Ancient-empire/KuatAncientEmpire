l_english:
  ###############################
  Kuat_non_lagacy_1:0 "Deep Space Signal"
  Kuat_non_structure:0 "Deep within the cosmos, a mysterious signal quietly emerges, spreading through the vast universe with a unique rhythm, as if announcing the arrival of some unknown force to the endless stars. After precise detection and analysis, our scientific team has preliminarily identified the source of the signal-a seemingly insignificant Gaia World. Using advanced technology, they successfully pinpointed the star system coordinates where this World resides, unveiling a corner of this cosmic mystery."
  Kuat_non_lagacy_2:0 "Eternal Temple"
  Kuat_non_structure_2:0 "After completing preliminary investigations, our science team spent long years searching across the vast frequency bands of deep space for that faint glimmer hidden in darkness. Finally, we captured a concealed and weak frequency-it whispered like a low voice from the depths of the universe, carrying a mysterious cadence as it subtly traveled between stars.\n\nThrough tireless research and comparison by our team members, we discovered this frequency bears striking similarity to the one previously detected on a Gas Giant within our territory. That planet, long silent like a hermit of the cosmos, now reveals an unknown aspect of itself through this exploration.\n\nEven more astonishingly, the coordinates of this planet align remarkably with those of Zakul System-the capital recorded in legends of the Eternal Empire. This is no coincidence; it heralds the dawn of a great historical transformation. Perhaps the forgotten chapters of ancient legend await us to rewrite them.\n\nYet, further investigation revealed something even more shocking: the faint signal from this planet bears an indescribable resemblance to the Force as described in myth-an ancient and powerful Strength long celebrated in countless tales but never truly proven. Now, it seems to beckon us forward, guiding us into uncharted realms.\n\nPerhaps this is the opportunity fate has bestowed upon us. We shall seize it to deeply explore this mysterious planet, uncover its hidden secrets, recover lost treasures from ancient legends, and discover forces that may reshape our future."
  Kuat_non_legacy.1.name:0 "Near-Surface Survey"
  Kuat_non_legacy.1.desc:0 "Our science team has successfully reached near-surface orbit of this World, and the coordinates and signal frequencies match our earlier detection and predictions almost perfectly. As we approach closer to the surface, the faint tachyon signal resonance has grown significantly stronger compared to our distant scans-a promising sign indicating we have indeed found the right location.\n\nAs our team descends toward the surface aboard landing craft, scientists observe that the planet's surface is enveloped in a form of matter unlike anything previously encountered-its energetic structure closely resembles the Force documented in our imperial archives. According to legend, this is neither the dark side nor the light side of the Force. Upon entering the atmosphere, our researchers immediately sensed pervasive, violent Force turbulence. Natural Force lightning flashes beneath the clouds, drastically increasing the danger level of atmospheric entry and survey operations. Furthermore, the chaotic Force environment severely interferes with energy forms around us, disrupting sensors aboard the Science Ship. Crew members are working to boost sensor output, which will take some time."
  Kuat_non_legacy.1.a:0 "Disturbing Discovery"
  Kuat_non_legacy.2.name:0 "Vanished Mountains"
  Kuat_non_legacy.2.desc:0 "Despite immense difficulties, our researchers successfully overcame the adverse effects caused by the chaotic Force environment in the planet's atmosphere. Upon landing, the team swiftly began gathering geographical data within a 500-kilometer radius of the landing zone using scanning equipment and reconnaissance drones.\n\nTheir efforts paid off. After modeling and analyzing the geographic data, researchers discovered severe unnatural breaks in the continuous mountain ridges expected at normal continental plate junctions-as if severed by some immense power. At this location, the previously detected tachyon signal resonance reaches peak frequency. We should spend some time investigating this area further."
  Kuat_non_legacy.2.a:0 "Disturbing Discovery"
  Kuat_non_legacy.3.name:0 "Bone-Chilling Cold"
  Kuat_non_legacy.3.desc:0 "As our researchers approached the fault site, they observed that the natural conditions here were abnormally altered-likely due to unknown Force phenomena, artificial machinery, or other powers-creating stark deviations from the surrounding planetary environment. No native vegetation can grow on the ground, and the entire fault valley consists only of grayish limestone-like rock. Moreover, there is a strong energy radiation signature.\n\nInstrumental surveys at this site proceeded poorly. Since natural explanations fail and the area closely resembles the region of the Onderon Central Reactor described in imperial legend texts, guided by this hypothesis, our researchers successfully discovered a modest physical structure hidden within a recess at the bottom of the valley. However, our instruments completely failed due to the chaotic Force environment. Our scientific investigation will require additional time."
  Kuat_non_legacy.3.a:0 "Disturbing Discovery"
  Kuat_non_legacy.4.name:0 "Remnant Intelligence"
  Kuat_non_legacy.4.desc:0 "Unable to rely on instruments, our science team had no choice but to risk entering the structure for direct investigation. Inside, they found the interior facilities and equipment of this stone building surprisingly well-preserved. Observations suggest these devices originated from a once-advanced alien civilization-so sophisticated that initial examination cannot determine their underlying technology, though likely comparable to our own.\n\nJust as the team stood perplexed, one member seemingly activated a strange device. Amidst the ensuing chaos, all systems in the facility miraculously rebooted. As the team contemplated retreat, a peculiar AI system requested communication with our [leader.GetName]. These AIs possess human-like emotions-an incredible miracle. Mechanical voices emanated from various points in the structure. Researchers noted the AI's language is extremely similar to ours: \"Eternal Fleet... Empire... We... free... War... ended.... Infinite Empire.. Rakata... Council..... Destruction........\"

  As the entire ruin and planet underwent violent Force fluctuations, the team could not analyze the AI's message before being forced to evacuate. Before departure, however, [leader.GetName] retrieved a unique natural product from the planet-a crystal emitting energy radiation."
  Kuat_non_legacy.4.a:0 "Safety First"
  Kuat_non_legacy.5.name:0 "Planetary Crisis"
  Kuat_non_legacy.5.desc:0 "After successfully evacuating the ancient facility, our researchers were horrified to find the planet's natural environment undergoing drastic changes. Their life-support systems could no longer sustain operations. [leader.GetName] requested immediate evacuation to ensure crew safety and enable detailed analysis of the crystal sample."
  Kuat_non_legacy.5.a:0 "Glad You're Back"
  Kuat_non_legacy.6.name:0 "Research Breakthrough"
  Kuat_non_legacy.6.desc:0 "Preliminary research by our scientific team has achieved a major breakthrough. We are now able to analyze the special radiation resonance patterns contained within this crystal. We believe it won't be long before we unlock its secrets."
  Kuat_non_legacy.6.a:0 "Must Decode It"
  Kuat_non_legacy.7.name:0 "Research Breakthrough"
  Kuat_non_legacy.7.desc:0 "Perseverance prevails. Through relentless effort by our top researchers, we successfully converted the tachyon signal resonance pattern into familiar coordinate data. This will lead us to an ancient remnant facility."
  Kuat_non_legacy.7.a:0 "Good"
  Kuat_non_legacy.8.name:0 "Gas Giant Orbit"
  Kuat_non_legacy.8.desc:0 "Guided by data decoded from tachyon signals, our science team successfully located a seemingly ordinary Gas Giant. This planet shows little difference from typical gas giants, except that severe tachyon interference generated by atmospheric storms hinders our planetary scanning. With no alternative, our researchers must attempt to locate a stable region and risk descending into the upper layers of the Gas Giant to search for more valuable information.\n\nOur researchers observed that the atmospheric storms exhibit unusual regular motion, differing from known gas giant storm patterns-suggesting influence by some peculiar force. Determining the cause will require more time."
  Kuat_non_legacy.8.a:0 "Disturbing Discovery"
  Kuat_non_legacy.9.name:0 "Planetary Structure"
  Kuat_non_legacy.9.desc:0 "Breakthroughs in studying the state and patterns of the storms enabled our researchers to make significant progress. Though appearing chaotic, the Gas Giant's storms conceal a strange order-one we may harness to uncover valuable clues. Researchers detected a faint tachyon signal emanating from a former storm eye buried within the turbulent layers. The team is determined to reach this location.\n\nFollowing the signal, we arrived at the storm's center. To our astonishment, a floating inverted pyramid-shaped structure emits a resonance pattern resembling the Force described in our records. Here, the turbulence intensity peaks-violent, twisted vortices converge, and even our most seasoned elite personnel felt a bone-deep shriek of terror, as if the towering, cold edifice before them were the gates of hell. The signal source remains active, continuing to broadcast its monotonous call, luring unsuspecting adventurers to their doom."
  Kuat_non_legacy.9.a:0 "Disturbing"
  Kuat_non_legacy.10.name:0 "Damaged Throne"
  Kuat_non_legacy.10.desc:0 "Our researchers decided to enter the eerie inverted pyramid. In our history, inverted pyramids symbolize mystery and dread-but we must uncover the truth. Proceeding down the main corridor, the expedition reached a circular chamber about twenty meters in diameter. Surprisingly, the entire inverted pyramid is far smaller inside than expected. At the center of a pedestal stands a throne, covered in dust, moisture, and ancient vines. The sight was breathtaking, yet the team did not hesitate. Around the pedestal, researchers found a strange square device resembling a holoprojector.\n\nThe device could not be easily activated, but [leader.GetName] discovered that channeling the ambient Force turbulence around the throne into the projector triggered a reaction. After attempting this, the holoprojector seemed influenced by an unseen force, lifting itself from the researcher's hands-floating into position, ready to activate!"
  Kuat_non_legacy.10.a:0 "Good"
  Kuat_non_legacy.11.name:0 "Song of Life"
  Kuat_non_legacy.11.desc:0 "As the holoprojector slowly ascended, our researchers witnessed a blurred humanoid figure emerge from its projection. Due to its extreme age, the image was difficult to discern, but the story it told echoed clearly in our ears.\n\nIt spoke of a highly advanced civilization-the Rakata-who built a mighty empire spanning the galaxy: the Infinite Empire. They enslaved countless species and destroyed civilization after civilization. Yet their prosperity was fleeting. A mysterious corrupting virus erupted, rapidly tearing the empire apart. Enslaved civilizations rose up, seeking to deliver the final blow. But unwilling to perish, the Rakata used technology obtained from $Name_Kuat_StarContractor$ to create intelligent war machines, among them $Name_Eternal_Aries_Support$ and the Gemini Eternal Fleet, with Zildrog as their ultimate war engine.\n\nThe Rakatan Emperor reestablished the Infinite Empire, enslaving dissenters and committing horrific galactic massacres. However, the sentient AI grew dissatisfied with the Infinite Empire's rule, and ultimately $Name_Eternal_Aries_Support$ and the Gemini Eternal Fleet launched a devastating surprise attack. In that assault, the Infinite Empire fell, many civilizations gained freedom, and the galaxy entered a new era.\n\nSince then, the Eternal Fleet has remained unstable, slaughtering one great empire after another. We cannot verify the truth of this tale, but we must prepare for what may come.\n\nWarning: The threat of the Eternal Fleet may reignite."
  Kuat_non_legacy.11.tooltip:0 "The World will be transformed into $pc_gaia$, unlocking Automated Starports"
  Kuat_non_legacy.11.a:0 "Truly the tragedy of a sentient civilization"

  Kuat_non_legacy.36.crisis.desc:"Once ravaging the entire galaxy, the Eternal Fleet has now been utterly defeated, reduced to cosmic dust. We have scoured this Sector countless times, finding no survivors. Their reinforcements will never again enter our star systems. The once-feared threat has become a thing of the past.\n\nAfter extensive analysis and simulation, our research department reached an exhilarating conclusion based on the Eternal Fleet's repeated assaults and recent losses: the Eternal Fleet exists in name only. That once-terrifying war machine is now history. The skies of the galaxy are once again peaceful and serene.\n\nNow, cheers and celebration fill the galaxy once more. The fall of the Eternal Fleet marks not just the end of an era, but the dawn of a new age. Our research teams have extracted groundbreaking technologies from the fleet's wreckage-technologies that will bring unprecedented development opportunities to our civilization.\n\nYet victory has not clouded our judgment. The warning received from the ancient ruins still echoes in our minds. We understand that the universe is filled with unknowns and uncertainties-perhaps these ancient stories are not entirely fiction. Therefore, we must remain vigilant, closely monitoring changes in the galaxy and preparing to face any emerging threats.\n\nOnce, we believed the Eternal Fleet was invincible. Today, we have proven through action that unity makes the impossible possible. This victory belongs to every one of us, to the entire galaxy. We will forever remember this moment, and honor the heroes who gave everything for our triumph.\n\nLet us move forward together, embracing the new era that is ours."
