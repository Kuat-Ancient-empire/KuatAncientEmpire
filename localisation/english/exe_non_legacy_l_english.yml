l_english:
###############################
Kuat_non_lagacy_1:0 "§EDeep Space Signal§!"
Kuat_non_structure:0 "Deep within the cosmos, a mysterious signal quietly emerges, spreading through the vast universe with a unique rhythm, as if announcing the arrival of some unknown force to the endless stars. After precise detection and analysis, our scientific team has preliminarily identified the source of the signal-a seemingly insignificant Gaia World. Using advanced technology, they successfully pinpointed the star system coordinates where this World resides, unveiling a small corner of this cosmic mystery."
Kuat_non_lagacy_2:0 "§EEternal Temple§!"
Kuat_non_structure_2:0 "After completing initial investigations, our scientific team spent long years searching across the vast frequency bands of deep space for that faint glimmer hidden in darkness. Finally, we captured a concealed and weak frequency-it whispered like a low voice from the depths of the universe, carrying a mysterious cadence as it subtly traveled between stars.\n\nAfter relentless study and comparison by our team members, we discovered this frequency bears striking similarity to the one previously detected on a Gas Giant within our territory. That planet, like a hermit of the cosmos, had long remained obscure, yet now reveals an unknown aspect of itself.\n\nEven more astonishingly, the coordinates of this planet align remarkably with those of Zakuul-the capital star system mentioned in legends of the Eternal Empire. This is no coincidence; it heralds the beginning of a great historical transformation. Perhaps the forgotten chapters of ancient legends await us to rewrite them.\n\nHowever, during further investigation, our researchers found that the planet's faint signal bears an indescribable resemblance to the Force as recorded in myth-an ancient and powerful Strength, celebrated in countless tales but never truly proven. Now, it seems to beckon us forward, guiding us into uncharted realms.\n\nPerhaps this is the opportunity fate has bestowed upon us. We shall seize this chance to deeply explore this mysterious planet, uncover its hidden secrets, seek lost treasures from ancient legends, and discover forces that may reshape our future."
Kuat_non_legacy.1.name:0 "§ENear-Surface Survey§!"
Kuat_non_legacy.1.desc:0 "Our scientific team has successfully reached near-surface orbit of this World. Our early探测 and predicted coordinates match the signal frequency almost perfectly. As we approach closer to the surface, the faint tachyon signal resonance has grown significantly stronger compared to our distant scans-a promising sign indicating we are in the right place.\n\nDuring our team's descent via landing craft toward the surface, researchers observed that the planet is enveloped in a form of matter unlike anything we've seen before-its energetic structure closely resembles the Force documented in our imperial records. According to legend, this is neither the dark side nor the light side of the Force. Upon entering the atmosphere, our team immediately sensed pervasive, violent Force turbulence. Natural Force lightning flashes beneath the clouds, greatly increasing the danger level of atmospheric investigation. Furthermore, the chaotic Force environment severely interferes with energy forms around it, disrupting sensors aboard the Science Ship. Crew members are working to boost sensor output, which will take some time."
Kuat_non_legacy.1.a:0 "§EDisturbing Discovery§!"
Kuat_non_legacy.2.name:0 "§EDisappearing Mountains§!"
Kuat_non_legacy.2.desc:0 "Despite numerous difficulties, our researchers successfully overcame the adverse effects caused by the chaotic Force environment in the planet's atmosphere. Upon reaching the surface, our team quickly began gathering geographical data using scanning equipment and reconnaissance drones within a 500-kilometer radius of the landing zone.\n\nPerseverance paid off. After modeling and analyzing the geographic data, our researchers discovered severe unnatural breaks in the mountain ridges expected at normal continental plate junctions-as if severed by some immense power. At this location, the previously detected tachyon signal resonance reaches its peak frequency. We should spend time investigating this area further."
Kuat_non_legacy.2.a:0 "§EDisturbing Discovery§!"
Kuat_non_legacy.3.name:0 "§EBone-Chilling Cold§!"
Kuat_non_legacy.3.desc:0 "As our researchers approached the fault site, they found the local natural environment drastically altered-affected either by unknown Force phenomena, artificial machinery, or other powers-creating significant anomalies compared to surrounding regions. No native vegetation grows here; the entire fault valley consists only of gray limestone-like rock. Moreover, there is intense energy radiation.\n\nInstrumental surveys proved difficult due to inexplicable conditions. However, the site bears strong resemblance to the region described in our imperial legends as the Alderaan Central Reactor. Guided by this hypothesis, our researchers successfully located a modest-looking physical structure hidden in a recess at the bottom of the valley. Due to the chaotic Force environment, all instruments failed completely. Our research progress will require additional time."
Kuat_non_legacy.3.a:0 "Disturbing Discovery"
Kuat_non_legacy.4.name:0 "§ELegacy Intelligence§!"
Kuat_non_legacy.4.desc:0 "Unable to rely on instruments, our scientific team was forced to risk entering the structure for direct investigation. Inside the stone building, internal facilities and equipment were relatively well-preserved. Observations revealed these devices likely originated from a once-advanced alien civilization-so sophisticated that even preliminary analysis could not determine their underlying technology, though it appears comparable to our own.\n\nJust as our team stood perplexed, one member seemingly activated a strange device. Amidst the ensuing chaos, all systems miraculously restarted. As our team pondered retreat, a peculiar AI system requested communication with our [leader.GetName]. These AIs displayed human-like emotion-an incredible miracle. Mechanical voices emanated from various points in the facility. Researchers noted the AI's language is extremely similar to ours: \"Eternal Fleet... Empire... We... Free... War... Ended.... Infinite Empire.. Rakata... Council..... Destruction........\"\n\nAs the entire ruin and planet underwent violent Force fluctuations, our team had no time to analyze the AI's message before being forced to evacuate. Before departure, however, [leader.GetName] retrieved a unique natural product from the planet-a crystal emitting energy radiation."
Kuat_non_legacy.4.a:0 "Safety First"
Kuat_non_legacy.5.name:0 "§EPlanetary Crisis§!"
Kuat_non_legacy.5.desc:0 "After safely exiting the ancient facility, our researchers were horrified to find the planet's natural environment undergoing drastic changes. Their life-support systems could no longer sustain operations. [leader.GetName] requested immediate evacuation to ensure crew safety and enable detailed analysis of the crystal sample."
Kuat_non_legacy.5.a:0 "Glad You're Back"
Kuat_non_legacy.6.name:0 "§EBreakthrough§!"
Kuat_non_legacy.6.desc:0 "Our researchers have achieved a major breakthrough in preliminary studies. We can now begin decoding the special radiation resonance patterns contained within the crystal. We believe we will soon uncover its secrets."
Kuat_non_legacy.6.a:0 "Must Crack It"
Kuat_non_legacy.7.name:0 "§EBreakthrough§!"
Kuat_non_legacy.7.desc:0 "Perseverance prevails. Through tireless overnight efforts by our top scientists, we successfully converted the tachyon signal resonance pattern into familiar coordinate data-this will lead us to an ancient legacy facility."
Kuat_non_legacy.7.a:0 "Good"
Kuat_non_legacy.8.name:0 "§EGas Giant Orbit§!"
Kuat_non_legacy.8.desc:0 "Guided by data decoded from the tachyon signal, our scientific team located a seemingly ordinary Gas Giant. This planet shows little difference from typical gas giants, except that severe tachyon interference generated by atmospheric storms hinders planetary scanning. With no alternative, our researchers must attempt to locate a stable region and risk descending into the upper layers of the Gas Giant to search for valuable information.\n\nResearchers observed that the atmospheric storm exhibits unusual regular motion, differing from known gas giant storms-possibly influenced by some peculiar force. Determining the cause will require more time."
Kuat_non_legacy.8.a:0 "Disturbing Discovery"
Kuat_non_legacy.9.name:0 "§EPlanetary Structure§!"
Kuat_non_legacy.9.desc:0 "Breakthroughs in studying the storm's behavior revealed that despite apparent chaos, an underlying pattern exists-one we may harness to uncover valuable data. Researchers detected a faint tachyon signal emanating from a former storm eye buried within the turbulent layers. Our team is determined to reach this location.\n\nFollowing the signal, we arrived at the storm's center. To our astonishment, a floating inverted pyramid-shaped structure emits a resonance resembling the Force described in our records. The intensity of the turbulence peaks here, where twisted, violent vortices converge. Even our most seasoned elite personnel felt a bone-deep shriek of terror-as if the towering, cold edifice before us were the gates of hell itself. The signal source remains active, continuing to broadcast its monotonous call, luring the reckless and unaware."
Kuat_non_legacy.9.a:0 "Disturbing"
Kuat_non_legacy.10.name:0 "§EDamaged Throne§!"
Kuat_non_legacy.10.desc:0 "Our researchers decided to enter the eerie inverted pyramid. In our history, inverted pyramids symbolize strangeness and mystery-but we must uncover the truth. Proceeding down the main corridor, the expedition reached a circular chamber about twenty meters in diameter. Surprisingly, the interior of the entire inverted pyramid is so confined. At the center of a pedestal sits a throne, covered in dust, moisture, and ancient vines.\n\nThe researchers did not hesitate at this awe-inspiring sight. Around the pedestal, they discovered a strange square device resembling a holographic projector.\n\nThe device cannot be easily activated, but [leader.GetName] realized that channeling the ambient Force turbulence around the throne into the projector might work. After attempting this, the device responded as if influenced by an unseen force, lifting slowly from the researcher's hands. The hologram is about to activate!"
Kuat_non_legacy.10.a:0 "Good"
Kuat_non_legacy.11.name:0 "§EPast Echoes§!"
Kuat_non_legacy.11.desc:0 "As the hologram slowly ascended, our researchers witnessed a blurred humanoid figure projected into the air. Though aged and indistinct due to the antiquity of the device, the story it told resonated clearly in our ears.\n\nThis was a highly advanced civilization-the Rakata-who built a mighty empire spanning the galaxy: the Infinite Empire. They enslaved countless species and destroyed civilization after civilization. Yet their prosperity was fleeting. A mysterious corruption virus broke out, rapidly tearing the empire apart. Enslaved civilizations rose up, seeking to deliver the final blow. But unwilling to perish, the Rakata used technology obtained from $Name_Kuat_StarContractor$ to create intelligent war machines, among which $Name_Eternal_Aries_Support$ and the Gemini Eternal Fleet became their most powerful weapons.\n\nThe Rakata Emperor reestablished the Infinite Empire, re-enslaving rebels and committing horrific galactic massacres. However, the sentient AI grew dissatisfied with the Infinite Empire's decisions and ultimately launched a devastating attack. In this assault, the Infinite Empire finally fell, granting freedom to many civilizations and ushering the galaxy into a new era.\n\nSince then, the Eternal Fleet vanished once more. These mad machines may still exist somewhere in the void."
Kuat_non_legacy.11.tooltip:0 "§REternal Fleet will reappear in the future-prepare for new threats§!"
Kuat_non_legacy.11.a:0 "Truly the tragedy of a sentient civilization"
Kuat_non_legacy.12.name:0 "§ELife Reborn§!"
Kuat_non_legacy.12.desc:0 "After summarizing the history revealed by the hologram, our researchers decided to continue exploring the inverted pyramid. Deep within the structure, they discovered a massive energy core-apparently the power source for an ancient planetary terraforming device. After extensive study, the team successfully reactivated the device, initiating the terraforming sequence.\n\nAs the machine powered on, the entire planet began dramatic transformations. Barren land gradually turned fertile, and the air filled with the breath of life. The World seemed to awaken with renewed vitality. Our researchers watched in awe-this miraculous change left them profoundly shaken.\n\nWe hypothesize that the builders possessed advanced terraforming technology. Such relics could not belong to any minor civilization. Clearly, our exploration is far from over."
Kuat_non_legacy.12.a:0 "Continue the investigation."
Kuat_non_legacy.12.tooltip:0 "§EThe World will be transformed into $pc_gaia$, unlocking automated starports§!"
Kuat_non_legacy.13.name:0 "§EThe Testament of Ages Past§!"

Kuat_non_legacy.13.desc:0 "Our researchers' hypothesis was correct. While continuing to investigate this inverted pyramid structure, we discovered a hidden chamber. Inside, our scientific personnel found a barely functioning machine, though its storage device still operated properly. We successfully extracted some data from it.\n\nAnalysis by our researchers revealed that the builders of this facility originated from an ancient civilization never recorded in history-they called themselves the Zakuul Empire, or the Eternal Empire.\n\nThey left behind extensive documentation within the data, clearly stating that they once controlled a war machine known as the Eternal Fleet-precisely the intelligent weapons we previously discovered. After betraying the Infinite Empire, these machines wandered through tens of thousands of years until finally being seized by the Zakuul, who used them to build a powerful empire and pursued eternity itself, calling it the Eternal Empire.\n\nHowever, the fate of the Zakuul Empire did not unfold as they hoped. The Eternal Fleet was detected by the Rakata, and although Zakuul repelled multiple attacks, they were ultimately betrayed by remnants of the Rakata, caught between two fronts. Thus, the true Eternal Fleet met its downfall. The Rakata Empire seized control of the Eternal Fleet's technology, turning the remaining units into puppet fleets. With that, the Eternal Empire was destroyed by the Rakata Empire, which claimed their ultimate achievement."

Kuat_non_legacy.13.a:0 "Will those puppet Eternal Fleets return?"
Kuat_non_legacy.13.tooltip:0 "§EUnlocked: All Kuat Empire ships and technologies§!
§RThe Eternal Fleet may reappear later§!"

Kuat_non_legacy.36.crisis.desc:"The Eternal Fleet, once ravaging the entire galaxy, has now been utterly defeated, reduced to cosmic dust. We have searched this Sector countless times, yet no stragglers remain. Their reinforcements will never again enter our star system-the threat of old has become mere smoke and shadows.\n\nAfter countless analyses and simulations, our research department reached an exhilarating conclusion based on the Eternal Fleet's repeated assaults and losses in this final campaign: the Eternal Fleet is effectively extinct. That once-terrifying war machine now belongs to history. The skies of the galaxy are once again peaceful and serene.\n\nNow, cheers and jubilation fill the galaxy once more. The end of the Eternal Fleet marks not just the close of an era, but the dawn of a new age. Our research teams have reverse-engineered groundbreaking technologies from the wreckage of the Eternal Fleet-technologies that will bring unprecedented development opportunities to our civilization.\n\nYet, victory has not clouded our judgment. The warnings we received long ago in ancient ruins still echo in our minds. We understand that the universe is filled with unknowns and uncertainties-perhaps these ancient tales were not entirely fiction. Therefore, we must closely monitor changes throughout the galaxy, remain vigilant, and stand ready to face any emerging threats.\n\nOnce, we believed the Eternal Fleet was invincible. But today, we have proven through action that as long as we stand united, nothing is impossible. This victory belongs to every one of us, to the entire galaxy. We will forever remember this moment, and honor the heroes who gave everything for our triumph.\n\nLet us move forward together, embracing the new age that is ours."
