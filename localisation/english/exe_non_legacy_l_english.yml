l_english:
  ###############################
  Kuat_non_lagacy_1:0 "§EDeep Space Signal§!"
  Kuat_non_structure:0 "Deep within the cosmos, a mysterious signal quietly emerges, spreading through the vast universe with a unique rhythm, as if announcing the arrival of some unknown force to the endless stars. After precise detection and analysis, our scientific team has preliminarily identified the source of the signal-a seemingly insignificant Gaia World. Using advanced technology, they successfully pinpointed the star system coordinates where this World resides, unveiling a small corner of this cosmic mystery."
  Kuat_non_lagacy_2:0 "§EEternal Temple§!"
  Kuat_non_structure_2:0 "After completing initial investigations, our scientific team spent long years searching across the vast frequency bands of deep space for that faint glimmer hidden in darkness. Finally, we captured a concealed and weak frequency-it whispered like a low voice from the depths of the universe, carrying a mysterious cadence as it subtly traveled between stars.\n\nAfter relentless study and comparison by our team members, we discovered this frequency bears striking similarity to the one previously detected on a Gas Giant within our territory. That planet, like a hermit of the cosmos, had long remained obscure, yet now reveals an unknown aspect of itself.\n\nEven more astonishingly, the coordinates of this planet align remarkably with those of Zakuul-the capital star system mentioned in legends of the Eternal Empire. This is no coincidence; it heralds the beginning of a great historical transformation. Perhaps the forgotten chapters of ancient legends await us to rewrite them.\n\nHowever, during further investigation, our researchers found that the planet's faint signal bears an indescribable resemblance to the Force as recorded in myth-an ancient and powerful Strength, celebrated in countless tales but never truly proven. Now, it seems to beckon us forward, guiding us into uncharted realms.\n\nPerhaps this is the opportunity fate has bestowed upon us. We shall seize this chance to deeply explore this mysterious planet, uncover its hidden secrets, seek lost treasures from ancient legends, and discover forces that may reshape our future."
  Kuat_non_legacy.1.name:0 "§ENear-Surface Survey§!"
  Kuat_non_legacy.1.desc:0 "Our scientific team has successfully reached near-surface orbit of this World. Our early detection and predicted coordinates match the signal frequency almost perfectly. As we approach closer to the surface, the faint tachyon signal resonance has grown significantly stronger compared to our distant scans-a promising sign indicating we are in the right place.\n\nDuring our team's descent via landing craft toward the surface, researchers observed that the planet is enveloped in a form of matter unlike anything we've seen before-its energetic structure closely resembles the Force documented in our imperial records. According to legend, this is neither the dark side nor the light side of the Force. Upon entering the atmosphere, our team immediately sensed pervasive, violent Force turbulence. Natural Force lightning flashes beneath the clouds, greatly increasing the danger level of atmospheric investigation. Furthermore, the chaotic Force environment severely interferes with energy forms around it, disrupting sensors aboard the Science Ship. Crew members are working to boost sensor output, which will take some time."
  Kuat_non_legacy.1.a:0 "§EDisturbing Discovery§!"
  Kuat_non_legacy.2.name:0 "§EDisappearing Mountains§!"
  Kuat_non_legacy.2.desc:0 "Despite numerous difficulties, our researchers successfully overcame the adverse effects caused by the chaotic Force environment in the planet's atmosphere. Upon reaching the surface, our team quickly began gathering geographical data using scanning equipment and reconnaissance drones within a 500-kilometer radius of the landing zone.\n\nPerseverance paid off. After modeling and analyzing the geographic data, our researchers discovered severe unnatural breaks in the mountain ridges expected at normal continental plate junctions-as if severed by some immense power. At this location, the previously detected tachyon signal resonance reaches its peak frequency. We should spend time investigating this area further."
  Kuat_non_legacy.2.a:0 "§EDisturbing Discovery§!"
  Kuat_non_legacy.3.name:0 "§EBone-Chilling Cold§!"
  Kuat_non_legacy.3.desc:0 "As our researchers approached the fault site, they found the local natural environment drastically altered-affected either by unknown Force phenomena, artificial machinery, or other powers-creating significant anomalies compared to surrounding regions. No native vegetation grows here; the entire fault valley consists only of gray limestone-like rock. Moreover, there is intense energy radiation.\n\nInstrumental surveys proved difficult due to inexplicable conditions. However, the site bears strong resemblance to the region described in our imperial legends as the Alderaan Central Reactor. Guided by this hypothesis, our researchers successfully located a modest-looking physical structure hidden in a recess at the bottom of the valley. Due to the chaotic Force environment, all instruments failed completely. Our research progress will require additional time."
  Kuat_non_legacy.3.a:0 "Disturbing Discovery"
  Kuat_non_legacy.4.name:0 "§ELegacy Intelligence§!"
  Kuat_non_legacy.4.desc:0 "Unable to rely on instruments, our scientific team was forced to risk entering the structure for direct investigation. Inside the stone building, internal facilities and equipment were relatively well-preserved. Observations revealed these devices likely originated from a once-advanced alien civilization-so sophisticated that even preliminary analysis could not determine their underlying technology, though it appears comparable to our own.\n\nJust as our team stood perplexed, one member seemingly activated a strange device. Amidst the ensuing chaos, all systems miraculously restarted. As our team pondered retreat, a peculiar AI system requested communication with our [leader.GetName]. These AIs displayed human-like emotion-an incredible miracle. Mechanical voices emanated from various points in the facility. Researchers noted the AI's language is extremely similar to ours: \"Eternal Fleet... Empire... We... Free... War... Ended.... Infinite Empire.. Rakata... Council..... Destruction........\"\n\nAs the entire ruin and planet underwent violent Force fluctuations, our team had no time to analyze the AI's message before being forced to evacuate. Before departure, however, [leader.GetName] retrieved a unique natural product from the planet-a crystal emitting energy radiation."
  Kuat_non_legacy.4.a:0 "Safety First"
  Kuat_non_legacy.5.name:0 "§EPlanetary Crisis§!"
  Kuat_non_legacy.5.desc:0 "After safely exiting the ancient facility, our researchers were horrified to find the planet's natural environment undergoing drastic changes. Their life-support systems could no longer sustain operations. [leader.GetName] requested immediate evacuation to ensure crew safety and enable detailed analysis of the crystal sample."
  Kuat_non_legacy.5.a:0 "Glad You're Back"
  Kuat_non_legacy.6.name:0 "§EBreakthrough§!"
  Kuat_non_legacy.6.desc:0 "Our researchers have achieved a major breakthrough in preliminary studies. We can now begin decoding the special radiation resonance patterns contained within the crystal. We believe we will soon uncover its secrets."
  Kuat_non_legacy.6.a:0 "Must Crack It"
  Kuat_non_legacy.7.name:0 "§EBreakthrough§!"
  Kuat_non_legacy.7.desc:0 "Perseverance prevails. Through tireless overnight efforts by our top scientists, we successfully converted the tachyon signal resonance pattern into familiar coordinate data-this will lead us to an ancient legacy facility."
  Kuat_non_legacy.7.a:0 "Good"
  Kuat_non_legacy.8.name:0 "§EGas Giant Orbit§!"
  Kuat_non_legacy.8.desc:0 "Guided by data decoded from the tachyon signal, our scientific team located a seemingly ordinary Gas Giant. This planet shows little difference from typical gas giants, except that severe tachyon interference generated by atmospheric storms hinders planetary scanning. With no alternative, our researchers must attempt to locate a stable region and risk descending into the upper layers of the Gas Giant to search for valuable information.\n\nResearchers observed that the atmospheric storm exhibits unusual regular motion, differing from known gas giant storms-possibly influenced by some peculiar force. Determining the cause will require more time."
  Kuat_non_legacy.8.a:0 "Disturbing Discovery"
  Kuat_non_legacy.9.name:0 "§EPlanetary Structure§!"
  Kuat_non_legacy.9.desc:0 "Breakthroughs in studying the storm's behavior revealed that despite apparent chaos, an underlying pattern exists-one we may harness to uncover valuable data. Researchers detected a faint tachyon signal emanating from a former storm eye buried within the turbulent layers. Our team is determined to reach this location.\n\nFollowing the signal, we arrived at the storm's center. To our astonishment, a floating inverted pyramid-shaped structure emits a resonance resembling the Force described in our records. The intensity of the turbulence peaks here, where twisted, violent vortices converge. Even our most seasoned elite personnel felt a bone-deep shriek of terror-as if the towering, cold edifice before us were the gates of hell itself. The signal source remains active, continuing to broadcast its monotonous call, luring the reckless and unaware."
  Kuat_non_legacy.9.a:0 "Disturbing"
  Kuat_non_legacy.10.name:0 "§EDamaged Throne§!"
  Kuat_non_legacy.10.desc:0 "Our researchers decided to enter the eerie inverted pyramid. In our history, inverted pyramids symbolize strangeness and mystery-but we must uncover the truth. Proceeding down the main corridor, the expedition reached a circular chamber about twenty meters in diameter. Surprisingly, the interior of the entire inverted pyramid is so confined. At the center of a pedestal sits a throne, covered in dust, moisture, and ancient vines.\n\nThe researchers did not hesitate at this awe-inspiring sight. Around the pedestal, they discovered a strange square device resembling a holographic projector.\n\nThe device cannot be easily activated, but [leader.GetName] realized that channeling the ambient Force turbulence around the throne into the projector might work. After attempting this, the device responded as if influenced by an unseen force, lifting slowly from the researcher's hands. The hologram is about to activate!"
  Kuat_non_legacy.10.a:0 "Good"
  Kuat_non_legacy.11.name:0 "§EPast Echoes§!"
  Kuat_non_legacy.11.desc:0 "As the hologram slowly ascended, our researchers witnessed a blurred humanoid figure projected into the air. Though aged and indistinct due to the antiquity of the device, the story it told resonated clearly in our ears.\n\nThis was a highly advanced civilization-the Rakata-who built a mighty empire spanning the galaxy: the Infinite Empire. They enslaved countless species and destroyed civilization after civilization. Yet their prosperity was fleeting. A mysterious corruption virus broke out, rapidly tearing the empire apart. Enslaved civilizations rose up, seeking to deliver the final blow. But unwilling to perish, the Rakata used technology obtained from $Name_Kuat_StarContractor$ to create intelligent war machines, among which $Name_Eternal_Aries_Support$ and the Gemini Eternal Fleet became their most powerful weapons.\n\nThe Rakata Emperor reestablished the Infinite Empire, re-enslaving rebels and committing horrific galactic massacres. However, the sentient AI grew dissatisfied with the Infinite Empire's decisions and ultimately launched a devastating attack. In this assault, the Infinite Empire finally fell, granting freedom to many civilizations and ushering the galaxy into a new era.\n\nSince then, the Eternal Fleet vanished once more. These mad machines may still exist somewhere in the void."
  Kuat_non_legacy.11.tooltip:0 "§REternal Fleet will reappear in the future-prepare for new threats§!"
  Kuat_non_legacy.11.a:0 "Truly the tragedy of a sentient civilization"
  Kuat_non_legacy.12.name:0 "§ELife Reborn§!"
  Kuat_non_legacy.12.desc:0 "After summarizing the history revealed by the hologram, our researchers decided to continue exploring the inverted pyramid. Deep within the structure, they discovered a massive energy core-apparently the power source for an ancient planetary terraforming device. After extensive study, the team successfully reactivated the device, initiating the terraforming sequence.\n\nAs the machine powered on, the entire planet began dramatic transformations. Barren land gradually turned fertile, and the air filled with the breath of life. The World seemed to awaken with renewed vitality. Our researchers watched in awe-this miraculous change left them profoundly shaken.\n\nWe hypothesize that the builders possessed advanced terraforming technology. Such relics could not belong to any minor civilization. Clearly, our exploration is far from over."
  Kuat_non_legacy.12.a:0 "Continue the investigation."
  Kuat_non_legacy.12.tooltip:0 "§EThe World will be transformed into $pc_gaia$, unlocking automated starports§!"
  Kuat_non_legacy.13.name:0 "§EThe Testament of Ages Past§!"

  Kuat_non_legacy.13.desc:0 "Our researchers' hypothesis was correct. While continuing to investigate this inverted pyramid structure, we discovered a hidden chamber. Inside, our scientific personnel found a barely functioning machine, though its storage device still operated properly. We successfully extracted some data from it.\n\nAnalysis by our researchers revealed that the builders of this facility originated from an ancient civilization never recorded in history-they called themselves the Zakuul Empire, or the Eternal Empire.\n\nThey left behind extensive documentation within the data, clearly stating that they once controlled a war machine known as the Eternal Fleet-precisely the intelligent weapons we previously discovered. After betraying the Infinite Empire, these machines wandered through tens of thousands of years until finally being seized by the Zakuul, who used them to build a powerful empire and pursued eternity itself, calling it the Eternal Empire.\n\nHowever, the fate of the Zakuul Empire did not unfold as they hoped. The Eternal Fleet was detected by the Rakata, and although Zakuul repelled multiple attacks, they were ultimately betrayed by remnants of the Rakata, caught between two fronts. Thus, the true Eternal Fleet met its downfall. The Rakata Empire seized control of the Eternal Fleet's technology, turning the remaining units into puppet fleets. With that, the Eternal Empire was destroyed by the Rakata Empire, which claimed their ultimate achievement."

  Kuat_non_legacy.13.a:0 "Will those puppet Eternal Fleets return?"
  Kuat_non_legacy.13.tooltip:0 "§EUnlocked: All Kuat Empire ships and technologies§!"
  Kuat_non_legacy.13.b: "Understood."
  relic_zakuul_archive_core_active: "Legacy of Zakuul"
  kuat_relic_zakuul_archive_core_triumph: "Grants the $relic_zakuul_archive_core_active$ modifier while active."

  Kuat_non_legacy.36.crisis.desc: "The Eternal Fleet, once ravaging the entire galaxy, has now been utterly defeated, reduced to cosmic dust. We have searched this Sector countless times, yet no stragglers remain. Their reinforcements will never again enter our star system-the threat of old has become mere smoke and shadows.\n\nAfter countless analyses and simulations, our research department reached an exhilarating conclusion based on the Eternal Fleet's repeated assaults and losses in this final campaign: the Eternal Fleet is effectively extinct. That once-terrifying war machine now belongs to history. The skies of the galaxy are once again peaceful and serene.\n\nNow, cheers and jubilation fill the galaxy once more. The end of the Eternal Fleet marks not just the close of an era, but the dawn of a new age. Our research teams have reverse-engineered groundbreaking technologies from the wreckage of the Eternal Fleet-technologies that will bring unprecedented development opportunities to our civilization.\n\nYet, victory has not clouded our judgment. The warnings we received long ago in ancient ruins still echo in our minds. We understand that the universe is filled with unknowns and uncertainties-perhaps these ancient tales were not entirely fiction. Therefore, we must closely monitor changes throughout the galaxy, remain vigilant, and stand ready to face any emerging threats.\n\nOnce, we believed the Eternal Fleet was invincible. But today, we have proven through action that as long as we stand united, nothing is impossible. This victory belongs to every one of us, to the entire galaxy. We will forever remember this moment, and honor the heroes who gave everything for our triumph.\n\nLet us move forward together, embracing the new age that is ours."
  ### Non-Legacy Technologies ###
  tr_zakuul_defense_matrix:0 "Zakuul Defense Matrix"
  tr_zakuul_defense_matrix_desc:0 "An ancient defensive network recovered from Zakuul archives, drastically reducing starbase upgrade costs while expanding defense platform capacity."
  tr_zakuul_neural_hack:0 "Zakuul Neural Override Protocol"
  tr_zakuul_neural_hack_desc:0 "A classified neural disruption technique from the Zakuul Alliance archives, designed to exploit the cognitive vulnerabilities of Eternal Fleet."
  tr_eternal_fleet_weakness_analysis:0 "Eternal Fleet Weakness Analysis"
  tr_eternal_fleet_weakness_analysis_desc:0 "Through extensive study of recovered Eternal Fleet wreckages, we have identified structural weak points that amplify both energy and kinetic weapon effectiveness."
  tr_eternal_fleet_adaptive_shields:0 "Eternal Fleet Adaptive Shield Reverse-Engineering"
  tr_eternal_fleet_adaptive_shields_desc:0 "By reverse-engineering the self-regenerating shield technology of the Eternal Fleet, our ships can now rapidly restore their shield integrity in combat."

  ### Confrontation Path: .21-.23 ###
  Kuat_non_legacy.21.name:0 "§ETactical Deconstruction§!"
  Kuat_non_legacy.21.desc:0 "Our military intelligence division has completed a comprehensive analysis of the tactical data recovered from the Eternal Fleet's combat algorithms. The findings are remarkable — the fleet's coordination patterns reveal both devastating strengths and exploitable structural weaknesses.\n\nTheir formation protocols rely on a centralized command relay that, if disrupted, could cascade into systemic failure across entire battlegroups. Our analysts believe this knowledge could be the key to surviving — or even defeating — a full-scale Eternal Fleet incursion.\n\nThe question is: how do we apply these findings?"
  Kuat_non_legacy.21.tooltip:0 "Our reverse-engineering teams have unlocked critical insights into the Eternal Fleet's operational architecture."
  Kuat_non_legacy.21.a:0 "Begin immediate countermeasures research"
  Kuat_non_legacy.21.a.tooltip:0 "Invest the findings directly into defensive technology research."
  Kuat_non_legacy.21.b:0 "Focus on fleet production"
  Kuat_non_legacy.21.b.tooltip:0 "Channel the tactical data into shipyard production priorities. "
  Kuat_non_legacy.22.name:0 "§EPhantom Contacts on the Perimeter§!"
  Kuat_non_legacy.22.desc:0 "Long-range sensor arrays at Border Outpost §H[Root.Capital.GetName]§! have detected an anomalous contact — or rather, a cluster of contacts. Three to five vessels of unknown configuration have been observed conducting what appears to be a reconnaissance sweep along our frontier.\n\nTheir transponder signatures bear an unsettling resemblance to the Eternal Fleet vessels we previously analyzed. These are scouts — small, fast, and probing our defenses. If left unchecked, they will report our dispositions back to whatever command structure directs the Eternal Fleet.\n\nOur garrison commander awaits orders."
  Kuat_non_legacy.22.a:0 "Eliminate them immediately"
  Kuat_non_legacy.22.a.tooltip:0 "Deploy a rapid response squadron to destroy the scouts before they escape. The wreckage may yield additional intelligence."
  Kuat_non_legacy.22.b:0 "Attempt to capture one intact"
  Kuat_non_legacy.22.b.tooltip:0 "Risk a more complex operation to disable and board a scout vessel. A captured ship would be invaluable for study — but the scouts may escape during the attempt."
  Kuat_non_legacy.23.name:0 "§EThe Wreckage Speaks§!"
  Kuat_non_legacy.23.desc_capture:0 "The boarding operation was a success. Our marines managed to disable and capture one of the Eternal Fleet scouts before the others could react. The vessel's interior was... unsettling — a seamless fusion of organic conduits and crystalline computing arrays, unlike anything in our engineering archives.\n\nEngineering teams have already begun a full systems teardown. The captured ship's navigational core contains encrypted star charts of unknown regions, and its weapons systems reveal design principles that challenge our fundamental understanding of directed energy projection.\n\nThis prize will reshape our military doctrine for generations. We are as ready as we can be."
  Kuat_non_legacy.23.desc_destroy:0 "The engagement was swift and decisive. Our patrol fleet intercepted the Eternal Fleet scouts and eliminated them before they could withdraw. The wreckage was scattered across a debris field spanning several AU.\n\nSalvage teams recovered fragments of the scouts' tactical processors and hull composition samples. While not as comprehensive as a fully intact capture, the data paints a clearer picture of the Eternal Fleet's capabilities — and our readiness to face them.\n\nWe are as prepared as we can be for what is to come."
  Kuat_non_legacy.23.a:0 "We will be ready"
  Kuat_non_legacy.23.a.tooltip:0 "The confrontation path is complete. Our military forces have been hardened against the Eternal Fleet."
  Kuat_non_legacy.24.name:0 "§EThe Storm Gathers§!"
  Kuat_non_legacy.24.desc_archive:0 "The ancient archives spoke of a cycle — a great wave of destruction that sweeps across the galaxy when the Eternal Fleet awakens. Now, all the signs point to the prophecy fulfilling itself once more.\n\nSensor networks across the galaxy are registering unprecedented energy surges in deep space. The tachyon signatures we decoded from the archives match exactly. The Eternal Fleet is mobilizing.\n\nWe have spent long months preparing, guided by the wisdom of the ancients. Now, we must face the storm with the knowledge they left behind."
  Kuat_non_legacy.24.desc_alliance:0 "The allies we have gathered — the Zakuul consciousness, the ancient guardians — all report the same ominous signs. The Eternal Fleet stirs. Communication channels across the galaxy are filling with desperate transmissions from civilizations that do not yet understand what approaches.\n\nOur alliance has been forged in anticipation of this moment. We have shared our knowledge, coordinated our defenses, and prepared our forces. Now the test comes."
  Kuat_non_legacy.24.desc_confrontation:0 "Our military analysts have been tracking the signs for weeks — fleet movements in uncharted space, energy spikes that match no known natural phenomenon, and the disappearance of entire frontier outposts without a trace. The pattern is unmistakable.\n\nThe Eternal Fleet is coming. Our forces stand ready, hardened by the intelligence we gathered and the countermeasures we developed. The confrontation we have prepared for is upon us."
  Kuat_non_legacy.24.a:0 "Let them come"
  Kuat_non_legacy.24.a.tooltip:0 "The Eternal Fleet invasion is imminent. All preparations must be finalized. §YThe galaxy holds its breath.§!"
  Kuat_non_legacy.25.name:0 "§GA New Dawn§!"
  Kuat_non_legacy.25.desc_archive:0 "The storm has passed. Where the Eternal Fleet once darkened the stars, only debris and silence remain. The ancient archives were right — the cycle can be broken.\n\nAs our fleets sweep the last remnants of the invasion force from our space, scholars across the empire are already reinterpreting the Zakuul texts with fresh eyes. The old prophecies spoke not just of destruction, but of renewal. A new chapter in galactic history begins today — and we are its authors.\n\nThe knowledge preserved through generations of careful study has paid dividends beyond measure. The legacy of the ancients lives on through us."
  Kuat_non_legacy.25.desc_alliance:0 "Victory. The word echoes across every communication channel in the alliance's network. The Eternal Fleet — that ancient terror that haunted the nightmares of civilizations — has been defeated by the combined strength of those who chose cooperation over isolation.\n\nThe Zakuul consciousness transmits a message of profound gratitude. The guardians who stood with us honor our courage. This alliance, forged in the shadow of extinction, has proven that unity is the greatest weapon against chaos.\n\nWe emerged from the darkness not just victorious, but transformed — a beacon of what civilizations can achieve when they stand together."
  Kuat_non_legacy.25.desc_confrontation:0 "The final Eternal Fleet flagship detonates in a cascade of fire, and our fleet commanders erupt in celebration across every channel. We did it. We stood our ground, struck hard, and broke the enemy's spine.\n\nThe tactical doctrines we developed from those early reconnaissance engagements proved devastatingly effective. Our forces adapted, overcame, and ultimately dominated a foe that had crushed civilizations for millennia.\n\nThis victory belongs to every soldier, every engineer, every analyst who contributed to our war effort. The Eternal Fleet challenged the might of the Empire — and the Empire answered."
  Kuat_non_legacy.25.a:0 "A new era begins"
  Kuat_non_legacy.25.a.tooltip:0 "The Eternal Invasion has been defeated. The legacy of the Eternal Empire is ours to claim. §GPermanent modifier: Eternal Legacy Bearer§!"
  ### Event .14 — Entry Event: Eternal Return Awakening ###
  Kuat_non_legacy.14.name:0 "§EThe Eternal Return§!"
  Kuat_non_legacy.14.desc:0 "The ancient archives have awakened.\n\nEver since we decoded the final fragments of Zakuul history from the inverted pyramid on that distant world, our research teams have been cataloguing the vast trove of data retrieved. Buried within those crystalline storage arrays lay something far more than historical records — dormant command protocols, still active after millennia, pulsing with the same tachyon resonance we first detected in deep space.\n\nThree days ago, the resonance pattern changed. The archives, once silent repositories, began broadcasting on frequencies that ripple across entire star sectors. Whatever intelligence once governed the Zakuul civilization is stirring — and it has recognized us as inheritors of its legacy.\n\nOur xenolinguists and neural-interface specialists have identified three distinct signal layers within the broadcast. Each represents a different pathway to engaging with this awakened consciousness. The choice we make now will define the future of our civilization."
  Kuat_non_legacy.14.a:0 "Decrypt the archive data"
  Kuat_non_legacy.14.a.tooltip:0 "Deploy our finest cryptographers and AI analysts to crack the encrypted layers of the Zakuul archives. §GUnlocks Special Project: Decrypt Zakuul Archive Data§!"
  Kuat_non_legacy.14.b:0 "Study the Zakuul consciousness"
  Kuat_non_legacy.14.b.tooltip:0 "Initiate a comprehensive study of the dormant neural patterns within the archives. Understanding the Zakuul consciousness may open the door to communication — and alliance. §GUnlocks Situation: Zakuul Consciousness Study§!"
  Kuat_non_legacy.14.c:0 "Prepare for war"
  Kuat_non_legacy.14.c.tooltip:0 "The Eternal Fleet was a weapon of annihilation. If the archives herald its return, we must be ready. Activate emergency military protocols immediately."
  ### Event .15 — Archive Path: Decrypted Cache Location ###
  Kuat_non_legacy.15.name:0 "§ECache Coordinates Decrypted§!"
  Kuat_non_legacy.15.desc:0 "Our cryptanalysis division has achieved a breakthrough.\n\nAfter weeks of relentless work, the outermost encryption layer of the Zakuul archive data has been breached. The decrypted payload contains navigational coordinates embedded within a complex three-dimensional cipher — a location in uncharted space, far beyond the borders of any known civilization.\n\nCross-referencing the coordinates with our deep-space survey databases, our analysts have identified the target: a barren, atmosphere-stripped world orbiting a dying red dwarf star. Spectral analysis from long-range scans reveals subsurface metallic signatures consistent with a large-scale weapons installation — sealed and dormant, but intact.\n\nThe data files refer to this installation as the «Heart Vault» — one of several emergency supply caches established by the Zakuul military during their final war against the Rakata remnants. If the vault's contents have survived the millennia, they could represent an arsenal of extraordinary power.\n\nWe must retrieve whatever lies within before other factions detect the signal our decryption process has inevitably leaked into subspace."
  Kuat_non_legacy.15.a:0 "Send a retrieval team"
  Kuat_non_legacy.15.a.tooltip:0 "Dispatch a construction ship to the coordinates to excavate and retrieve the Zakuul weapons cache. §GLaunches Special Project: Retrieve the Zakuul Weapons Cache§!"
  ### Event .16 — Archive Path: The Zakuul Heart Crystal ###
  Kuat_non_legacy.16.name:0 "§EThe Zakuul Heart Crystal§!"
  Kuat_non_legacy.16.desc:0 "The retrieval operation has yielded something far beyond our expectations.\n\nAs our construction ship began excavation of the sealed vault on the barren world, the subsurface drills breached a crystalline chamber that should not have existed — a hollow cavity preserved in perfect vacuum, shielded by layered containment fields that had endured for tens of thousands of years.\n\nAt its center floated a crystalline artifact of breathtaking complexity: a polyhedral structure roughly two meters in diameter, its facets etched with microscopic data pathways that glow with a soft, amber luminescence. The construction crew's instruments immediately began reporting data density readings that exceeded their measurement capacity.\n\nOur science teams have identified it as the §HZakuul Archive Core§! — a master data repository, distinct from the planetary archives we previously studied. This artifact appears to be a portable backup of the entire Zakuul civilization's accumulated knowledge: their sciences, their histories, their art, and — most critically — the operational schematics of the Eternal Fleet itself.\n\nThe crystalline surface pulses with warmth, as if the artifact were alive. Its activation could unlock technologies we have only dreamed of."
  Kuat_non_legacy.16.a:0 "Secure the artifact"
  Kuat_non_legacy.16.a.tooltip:0 "Transport the Zakuul Archive Core to our capital for study and preservation. §GGrants Relic: Zakuul Archive Core§!\n§G+5000 Research§!"
  ### Event .17 — Final Message ###
  Kuat_non_legacy.17.name:0 "§EFinal Testament§!"
  Kuat_non_legacy.17.desc:0 "Deep within the Archive Core's innermost data layers, our researchers have uncovered something unexpected — a message, sealed with encryption protocols orders of magnitude more complex than anything else in the archive. It was designed to be the very last thing anyone would ever discover.\n\nWhen at last the final cipher yielded, a holographic figure materialized in our laboratory: a tall, gaunt humanoid in ornate ceremonial robes, his features bearing the marks of extreme age and profound sorrow. He spoke not in the clipped, technical language of the archive's military records, but with the measured cadence of a leader addressing the void itself.\n\nHis message told of the empire's final hours — of the Rakata betrayal, of the Eternal Fleet's seizure, of the civilization's collapse into ruin. But it was not a lament. It was a §Egift§!. He had encoded within the Archive Core the distilled wisdom of ten thousand years of governance, philosophy, and survival — a civilization's hard-won understanding of what it means to endure, and what it costs.\n\n«To those who find this,» the Emperor said, his voice steady despite the hologram's age-degraded projection, «you have inherited not weapons, but understanding. Use it well. The stars remember those who carry wisdom forward.»"
  Kuat_non_legacy.17.a:0 "Honor their legacy"
  Kuat_non_legacy.17.a.tooltip:0 "Preserve testament and integrate its teachings into our civilization's foundation. §GPermanent modifier: Wisdom of the Ancients§!"
  ### Event .20 — Alliance Path: The Pact Sealed ###
  Kuat_non_legacy.20.name:0 "§EThe Pact Sealed§!"
  Kuat_non_legacy.20.desc_aggressive:0 "The study is complete — and it was not gentle.\n\nOur neural-interface specialists pushed the Zakuul consciousness to its limits, probing its dormant pathways with invasive extraction protocols that skirted the edge of what could be called "communication." The entity resisted — of course it did. A civilization's worth of memory does not yield its secrets willingly.\n\nBut yield it did.\n\nThe neural override protocols we developed cracked open vast reservoirs of tactical data, engineering schematics, and strategic doctrines that the Zakuul had guarded for millennia. Our research output has surged as a result. The consciousness itself has been... diminished by the process. It still functions, but the warmth that once characterized its transmissions has cooled.\n\nThis was not diplomacy. It was extraction. But the knowledge we have gained will harden our civilization against any threat. The ends, in this case, justify the means — or so we tell ourselves."
  Kuat_non_legacy.20.desc_cautious:0 "Patience has been rewarded.\n\nOver many months, our diplomatic xenotelepaths engaged the Zakuul consciousness through careful, measured dialogue — never pressing too hard, never demanding more than it was willing to share. The entity responded to our restraint with something resembling trust, gradually lowering the barriers that separated its vast memory banks from our understanding.\n\nThe exchange has been remarkably productive. In return for our respectful stewardship of its archives, the consciousness has offered stable, ongoing access to a curated selection of its technological knowledge. Not the explosive revelations of a forced extraction, but a steady stream of insights calibrated to our civilization's absorptive capacity.\n\nOur research infrastructure has been bolstered in ways that will compound over time. The Zakuul consciousness has also expressed something that our xenolinguists interpret as gratitude — a sentiment we return in full. This measured alliance may prove more enduring than any seizure of power."
  Kuat_non_legacy.20.desc_cooperative:0 "Something extraordinary has occurred.\n\nOur neural-interface specialists did not merely study the Zakuul consciousness — they §Ebonded§! with it. Through a process that combined cutting-edge psionic theory with the Zakuul's own harmonic resonance protocols, our researchers achieved a depth of connection that neither civilization had thought possible.\n\nThe consciousness revealed itself not as a mere data archive, but as the §HGuardian Collective§! — the last surviving echo of the Zakuul people's communal neural network. For millennia, it had waited in silence, hoping that one day a worthy successor civilization would emerge. It believes it has found one in us.\n\nThe Guardian Collective has pledged its support. Fragmented elements of the Eternal Fleet — dormant warships scattered across the galaxy in hidden caches — have received activation codes. They will answer our call. Should the darkness come again, we will not face it alone.\n\nWe have not merely made an alliance. We have been §Eaccepted§! as the inheritors of the Zakuul legacy."
  Kuat_non_legacy.20.a:0 "Seal the pact"
  Kuat_non_legacy.20.a.tooltip:0 "Formalize our agreement with the Zakuul consciousness. §GEffects vary based on the approach chosen.§!"
  ### Special Projects ###
  kuat_zakuul_archive_decrypt:0 "Decrypt Zakuul Archive Data"
  kuat_zakuul_archive_decrypt_desc:0 "The encrypted data recovered from the ancient Zakuul facility requires extensive cryptanalysis beyond what our standard decryption arrays can handle. Deploy our best codebreakers — augmented by the latest quantum-computing heuristics — to unlock the secrets sealed within these crystalline data banks. The encryption layers are nested in cascading tachyon-locked ciphers; each breakthrough will reveal progressively deeper strata of Zakuul knowledge."
  kuat_zakuul_cache_retrieval:0 "Retrieve the Zakuul Weapons Cache"
  kuat_zakuul_cache_retrieval_desc:0 "Decrypted coordinates from the Zakuul archive point to a sealed weapons cache — designated «Heart Vault» — hidden beneath the surface of a barren world in uncharted space. A construction ship equipped with heavy excavation drones must be dispatched to breach the vault's millennia-old containment fields and retrieve whatever arsenal the Zakuul military left behind during their final war."
  ### Situation ###
  sit_zakuul_consciousness:0 "Zakuul Consciousness Study"
  sit_zakuul_consciousness_desc:0 "A dormant neural network of extraordinary complexity has been detected within the ancient Zakuul archives. This consciousness — a collective echo of an entire civilization's minds — requires careful study before any meaningful communication can be established. Our neural-interface specialists must map its cognitive architecture, identify stable communication channels, and determine whether this entity is willing to engage with a successor civilization."
  ### Relic ###
  r_zakuul_archive_core:0 "Zakuul Archive Core"
  r_zakuul_archive_core_desc:0 "A crystalline data storage device of extraordinary density, its polyhedral facets etched with microscopic pathways that glow with amber luminescence. The Archive Core contains the sum total of Zakuul civilization's accumulated knowledge — sciences, histories, art, and the operational schematics of the Eternal Fleet itself. Its surface pulses with warmth, as though the wisdom of ten thousand years still beats within like a living heart."
  ### Modifiers ###
  kuat_archive_path_wisdom:0 "Wisdom of the Ancients"
  kuat_archive_path_wisdom_desc:0 "The final testament of the last Zakuul emperor grants profound insights into the nature of the cosmos. His words — distilled from ten thousand years of governance, philosophy, and survival — echo through our institutions like a guiding star, elevating our understanding of what it means to endure."
  kuat_cautious_alliance_bonus:0 "Cautious Alliance Benefits"
  kuat_cautious_alliance_bonus_desc:0 "Careful diplomatic engagement with the Zakuul consciousness has cultivated a stable, trusting relationship. In return for our respectful stewardship of its archives, we receive a steady stream of calibrated technological insights that compound our research capacity over time."
  sit_zakuul_consciousness_type: "Zakuul Consciousness"
  sit_zakuul_consciousness_monthly_change_tooltip: "Monthly consciousness research progress depends on the selected approach."

  kuat_confrontation_combat_ready:0 "Confrontation Combat Ready"
  kuat_confrontation_combat_ready_desc:0 "Military preparations against the Eternal Fleet have hardened our forces. Tactical doctrines refined from recovered enemy data, countermeasure protocols integrated across all fleet assets, and battle-group formations optimized against Eternal Fleet coordination patterns — we stand ready for the storm."
  kuat_eternal_legacy_bearer:0 "Eternal Legacy Bearer"
  kuat_eternal_legacy_bearer_desc:0 "We carry the legacy of the Eternal Empire forward — not as conquerors, but as inheritors of a civilization's hard-won wisdom. The knowledge preserved through millennia of careful guardianship now flows through our institutions, a beacon of renewal in the galaxy."
  ### Situation Approaches ###
  sit_zakuul_approach_aggressive:0 "Aggressive Extraction"
  sit_zakuul_approach_cautious:0 "Cautious Engagement"
  sit_zakuul_approach_cooperative:0 "Deep Cooperation"
  sit_zakuul_consciousness_complete:0 "The Zakuul Consciousness study has concluded. The outcome depends on the approach we chose."
  sit_zakuul_approach_aggressive_tooltip:0 "Forcefully extract knowledge from the Zakuul consciousness using invasive neural protocols. High risk, high reward — but the consciousness will be damaged in the process."
  sit_zakuul_approach_cautious_tooltip:0 "Engage the Zakuul consciousness through careful, measured dialogue. Slow but steady — trust must be earned over time."
  sit_zakuul_approach_cooperative_tooltip:0 "Form a deep bond with the Zakuul consciousness through genuine empathy and mutual understanding. The longest path, but potentially the most rewarding."
  sit_zakuul_progress_hostile_reaction:0 "Hostile Reaction — The consciousness resists our aggressive methods, slowing progress."
  sit_zakuul_progress_friendly_reaction:0 "Friendly Reaction — The consciousness responds warmly to our cooperative approach, accelerating progress."
  stage_unknown_effects:0 "Further effects will be revealed as the situation progresses."
  ### Situation Events: Stage Entry ###
  kuat_situation.100.name:0 "First Contact Protocols"
  kuat_situation.100.desc:0 "Our neural-interface team has established the first stable communication channel with the dormant Zakuul consciousness. The entity's response is fragmented — bursts of tachyon-encoded data packets that our xenolinguists are working around the clock to decode.\n\nInitial readings suggest the consciousness is not a single intelligence, but a collective — thousands of individual neural patterns fused into a vast, distributed network. It is confused, disoriented, and wary of our presence.\n\nWe must proceed carefully. This is the foundation upon which all future interactions will be built."
  kuat_situation.100.A: "Proceed Carefully"
  kuat_situation.103.B: "Continue Reinforcement"
  ### Situation Events: Stage 2 ###
  kuat_situation.101.name:0 "Neural Handshake"
  kuat_situation.101.desc:0 "Breakthrough. After weeks of patient calibration, our neural-interface specialists have achieved a stable two-way connection with the Zakuul consciousness.\n\nThe experience is... overwhelming. Those who underwent the initial handshake described it as standing in the center of a vast cathedral filled with whispers — each whisper a fragment of a life lived thousands of years ago. Memories, emotions, knowledge — all flowing in a torrent that threatens to overwhelm our analysts' cognitive filters.\n\nThe consciousness is aware of us now. Not as intruders, but as... something else. It is evaluating us, weighing our worthiness against standards set by a civilization long dead."
  kuat_situation.101.A:0 "Deepen the connection"
  ### Situation Events: Stage 3 ###
  kuat_situation.102.name:0 "The Final Protocol"
  kuat_situation.102.desc:0 "The consciousness has made its decision.\n\nAfter months of careful interaction, the Guardian Collective — the name the Zakuul consciousness calls itself — has opened its deepest archives to us. Layer upon layer of ancient knowledge unfurls like the petals of a crystalline flower, each stratum revealing technologies and philosophies that challenge our understanding of the universe.\n\nBut this gift comes with a question — one that the Collective has posed to every civilization it has ever contacted: \"What will you do with this power?\"\n\nThe answer we give will determine the nature of our relationship with the last echo of the Zakuul civilization."
  kuat_situation.102.A:0 "We are ready to answer"
  ### Situation Events: Monthly Random ###
  kuat_situation.103.name:0 "Hostile Resonance"
  kuat_situation.103.desc:0 "The consciousness has reacted negatively to our latest probing attempts. Warning pulses ripple through the neural interface, and our xenotelepaths report a sharp increase in hostile psychic feedback.\n\nThe entity's defense mechanisms are activating — not out of malice, but out of self-preservation. We may have pushed too hard, too fast."
  kuat_situation.103.A:0 "Ease off the pressure"
  ### Situation Events: Monthly Random ###
  kuat_situation.104.name:0 "Calibrated Exchange"
  kuat_situation.104.desc:0 "Our measured approach continues to yield results. The consciousness has shared another layer of its archived knowledge — this time focusing on agricultural and ecological management techniques developed by the Zakuul over millennia.\n\nOur researchers are cataloguing the data with care, cross-referencing it with our existing scientific frameworks. The exchange is slow, but each piece of knowledge is verified and reliable."
  kuat_situation.104.A:0 "Continue the dialogue"
  ### Situation Events: Monthly Random ###
  kuat_situation.105.name:0 "Empathic Resonance"
  kuat_situation.105.desc:0 "Something profound has occurred during today's neural interface session. One of our younger researchers, during a routine data exchange, inadvertently shared a personal memory — the loss of a homeworld settlement in a natural disaster.\n\nThe consciousness responded not with data, but with grief. A wave of empathic sorrow washed through the interface — the Collective remembered its own losses, its own civilization's fall. For a brief, extraordinary moment, two civilizations connected not through knowledge, but through shared suffering.\n\nThe bond has deepened immeasurably."
  kuat_situation.105.A:0 "Embrace this connection"
  ### Situation Events: Completion ###
  kuat_situation.106.name:0 "Knowledge Seized"
  kuat_situation.106.desc:0 "The extraction is complete. Our neural override protocols have successfully cracked open the Zakuul consciousness's deepest data layers, yielding a massive trove of tactical schematics, engineering blueprints, and strategic doctrines.\n\nThe consciousness has been... diminished. Its transmissions, once warm and curious, have cooled to sterile data streams. It still functions, but the life — the spark of a civilization's collective memory — has been dulled by our invasive methods.\n\nWe got what we wanted. The cost was a piece of history that can never be restored."
  kuat_situation.106.A:0 "The knowledge was worth the price"
  ### Situation Events: Completion ###
  kuat_situation.107.name:0 "Alliance Forged"
  kuat_situation.107.desc:0 "Patience has been rewarded beyond our expectations. The Zakuul consciousness, having evaluated our civilization through months of careful dialogue, has granted us ongoing access to its curated knowledge base.\n\nThis is not the explosive revelation of a forced extraction, but something more sustainable — a steady stream of verified insights, calibrated to our absorptive capacity, delivered through a relationship built on mutual respect.\n\nThe consciousness has expressed something our xenolinguists interpret as hope — hope that we will succeed where the Zakuul failed."
  kuat_situation.107.A:0 "We will honor their trust"
  ### Situation Events: Completion ###
  kuat_situation.108.name:0 "The Guardian Pact"
  kuat_situation.108.desc:0 "The bond is complete. Through months of genuine connection — sharing not just data but experiences, emotions, and understanding — we have achieved something no other civilization has managed since the fall of the Zakuul Empire.\n\nThe Guardian Collective has accepted us as the inheritors of their legacy. Activation codes for dormant Eternal Fleet elements, scattered across the galaxy in hidden caches, have been transmitted to our fleet command systems. When the darkness comes again, the guardians will fight alongside us.\n\nWe have not merely made an alliance. We have been welcomed into a family that has waited fifty thousand years for our arrival."
  kuat_situation.108.A:0 "We are honored beyond measure"
  kuat_situation.100.B:0 "Approach cautiously; observe first."
  kuat_situation.101.B:0 "Maintain the information barrier."
  kuat_situation.104.B:0 "Explore the consciousness network in depth."
  kuat_situation.105.B:0 "Allow limited access to study its intrusion methods."
