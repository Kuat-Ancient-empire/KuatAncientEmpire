    starkiller_base_NAME:0 "§EUnknown Sector§!"
    starkiller_base_DESC:0 "Origins at Starkiller Base, a powerful superweapon."

    thermal_oscillator:0 "§BThermal Oscillator§!"
    thermal_oscillator_desc:0 "This component is located on the surface of Starkiller Base, storing dark energy collected from the star it orbits. This not only provides sufficient power for the base itself, but also fuels physics research."

    fostarkiller_base:0 "§RDevastating Superweapon§!"
    fostarkiller_base_desc:0 "Deep within the Unknown Sector, the First Order constructed a superweapon that uses an entire planet as a weapons platform. Serving as a First Order stronghold in this region of space, this modified mobile frigid world hosts large numbers of soldiers, officers, and scientists. To ensure the fortress's security, they have equipped the planet with a planetary Shield Generator to withstand orbital bombardment."

    kyber_crystals:0 "§MRich in Kyber Crystals§!"
    kyber_crystals_desc: "Kyber crystals are rare Force-attuned crystals that grow naturally and have been discovered scattered across major planets in the galaxy. They are typically used by Jedi and Sith to construct lightsabers. Because they can focus immense energy, they are the ideal choice for manufacturing turbolasers."

    weapon_testing_labs:0 "Weapons Laboratory"
    weapon_testing_labs_desc:0 "This mobile arsenal contains numerous top-secret research and weapons facilities, providing access to the latest technological advancements."

    #Under Construction
    kuat_starkillerbase_0:0 "Initiate Starkiller Base Project"
    kuat_starkillerbase_0_MEGASTRUCTURE_DETAILS: "$kuat_starkillerbase_0_DESC$"
    kuat_starkillerbase_0_DESC:0 "Within this Imperial-era mining facility, we will construct an unprecedented superweapon that will restore the Empire's former glory. It is time to begin construction of our superweapon."

    kuat_starkillerbase_0_1:0 "Starkiller Base Phase One"
    kuat_starkillerbase_0_1_DESC:0 "We must conduct large-scale mining operations on this planet to extract its Kyber crystal deposits for use in our war machine. After sufficient excavation, we will transform this planet into a massive mobile weapons platform, with enormous superlaser arrays embedded within vast trenches carved into the planet's crust. Since these trenches were originally dug by the Empire years ago, converting the planet into a superweapon will be significantly easier."

    kuat_starkillerbase_0_2:0 "Starkiller Base Phase Two"
    kuat_starkillerbase_0_2_DESC:0 "The thermal oscillator is a component found in various vehicles and machines. It is required for our Starkiller Base superweapon to prevent the planet from becoming unstable due to internal energy buildup. Starkiller Base harnesses stellar energy to collect dark energy, which is then used to destroy distant star systems. To store this energy, the thermal oscillator generates an oscillating containment field, allowing the device to hold the vast amounts of dark energy necessary for operation while consuming far less power than normal."

    #Completed
    kuat_starkillerbase_1:0 "Starkiller Base"
    kuat_starkillerbase_1_DESC:0 "An operational Starkiller Base. It is capable of focusing stellar energy into a high-energy beam, enabling it to destroy entire target star systems or even stars."
    kuat_starkillerbase_15: "Select Target"
    kuat_starkillerbase_15_DESC: "Starkiller Base requires one or more specific planetary targets to activate its weapon systems."
