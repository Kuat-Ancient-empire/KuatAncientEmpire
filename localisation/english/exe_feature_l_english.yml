    tradition_kuat_scum: "Vigil"
    tradition_kuat_scum_desc: "We are the true guardians of the entire galaxy. Foolish people do not understand the crisis they face, but we must remain vigilant-the crisis has never left, and the gears of war can no longer be stopped. Only the resolve of the Stellar Watch will allow us to defeat our enemies."
    tr_kuat_scum_adopt: "Vigil Tradition"
    tr_kuat_scum_adopt_effect: "After this tradition is enabled: The game difficulty setting of this mod can no longer be reduced to Casual or Normal.\n§RCannot be changed§!"
    tr_kuat_scum_adopt_desc: "§Y$mod_kuat_shipyard_reduce$§!§G+25%§!."
    tr_kuat_scum_finish:0 "Vigil Tradition completed."
    tr_kuat_scum_finish_effect: ""
    tr_kuat_scum_finish_desc:0 "There is no room left in this war-behind us lies our homeland. The omen of crisis has arrived; we must fight for the future of the Empire."
    tr_kuat_scum_1:0 "Alloy Production Innovation"
    tr_kuat_scum_1_desc:6 "§Y$mod_planet_jobs_alloys_produces_mult$§!§G+300%§!."
    tr_kuat_scum_1_delayed:0 "As our citizens' identification with and pride in the Empire continues to grow, the skill level and efficiency of alloy production line workers have significantly improved. With continuous improvements in production methods, the time from coating and refining to fulfilling market orders has been greatly reduced compared to the past."
    tr_kuat_scum_2:0 "Ship Maintenance Innovation"
    tr_kuat_scum_2_desc:6 "§Y$MOD_STARBASE_SHIPYARD_BUILD_COST_MULT$§!§G-50%§!."
    tr_kuat_scum_2_delayed:0 "As our citizens' identification with and pride in the Empire continues to grow, the skill level and efficiency of shipyard workers have significantly improved, leading to rapid advancement in the Empire's military industry. With continuous improvements in shipbuilding methods, the cost required during the process from Hull coating to forming Star vessels has been greatly reduced compared to the past."
    tr_kuat_scum_3:0 "Ship Manufacturing Innovation"
    tr_kuat_scum_3_desc:6 "§Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§!§G+100%§!."
    tr_kuat_scum_3_delayed:0 "As our citizens' identification with and pride in the Empire continues to grow, the skill level and efficiency of shipyard workers have significantly improved, leading to rapid advancement in the Empire's military industry. With continuous improvements in shipbuilding methods, the time required from Hull coating to forming Star vessels has been greatly reduced compared to the past."
    tr_kuat_scum_4:0 "Hull Research Innovation"
    tr_kuat_scum_4_desc:6 "§Y$mod_weapon_type_energy_weapon_damage_mult$§!§G+300%§!\n§Y$mod_weapon_type_kinetic_weapon_damage_mult$§!§G+300%§!\n§Y$mod_weapon_type_explosive_weapon_damage_mult$§!§G+300%§!"
    tr_kuat_scum_4_delayed:0 "As our citizens' identification with and pride in the Empire continues to grow, the skill level and efficiency of scientists in research institutes have significantly improved, leading to rapid advancement in the Empire's military technology. Major breakthroughs have been achieved in research on ship Hull technology. Continuous improvements in Hull technology have greatly reduced both the time and cost required from Hull coating to achieving effective starship defense compared to the past."
    tr_kuat_scum_5:0 "Weapon Research Innovation"
    tr_kuat_scum_5_desc:6 "§Y$MOD_SHIP_WEAPON_RANGE_MULT$§!§G+100%§!."
    tr_kuat_scum_5_delayed:0 "The growing sense of identity and pride among our citizens within the Empire has significantly elevated the skill level and efficiency of scientists at research institutes, driving rapid advancements in military technology. Aeternum's research into ship weaponry has achieved a major breakthrough. Weaponry continues to improve across all aspects-from ammunition quality and technical design to actual attack range-now offering superior performance compared to the past, while also reducing production costs substantially."


