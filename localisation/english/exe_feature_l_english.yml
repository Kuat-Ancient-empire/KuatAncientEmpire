    kuat_mission_1_chain_title:0 "§HMission§!: Colonize [kuat_mission_1_target_planet.GetName]"
    kuat_mission_1_chain_desc:0 "§H[fallen_empire_kuat.GetName]§! demands that we colonize §H[kuat_mission_1_target_planet.GetName]§!. We must establish a colony there with at least §Y5§!£pop£ Pops.\n\nTime limit: §Y7300§!£time£."
    kuat_mission_2_chain_title:0 "§HMission§!: Monitor [kuat_mission_2_target_country.GetName]"
    kuat_mission_2_chain_desc:0 "§H[fallen_empire_kuat.GetName]§! demands that we monitor §H[kuat_mission_2_target_country.GetName]§!. We must establish an outpost in a star system connected via hyperlane to their border and maintain it for at least §Y2§! months.\n\nTime limit: §Y7300§!£time£."
    kuat_mission_3_chain_title:0 "§HMission§!: Colonize [kuat_mission_3_target_planet.GetName]"
    kuat_mission_3_chain_desc:0 "§H[fallen_empire_kuat.GetName]§! demands that we colonize §H[kuat_mission_3_target_planet.GetName]§!. We must establish a colony there with at least §Y5§!£pop£ Pops.\n\nTime limit: §Y7300§!£time£."
    kuat_mission_4_chain_title:0 "§HMission§!: Destroy [kuat_mission_4_target_country.GetName]"
    kuat_mission_4_chain_desc:0 "§H[fallen_empire_kuat.GetName]§! demands that we destroy the government of §H[kuat_mission_4_target_country.GetName]§!. We must eliminate this nation and occupy their capital [kuat_mission_4_target_planet.GetName], eradicating them completely.\n\nTime limit: §Y7300§!£time£."
    kuat_mission_5_chain_title:0 "§HMission§!: Change Ruling Ethics"
    kuat_mission_5_chain_desc:0 "§H[fallen_empire_kuat.GetName]§! demands that we change our ruling ethics to §H$ethic_fanatic_pacifist$§!.\n\nTime limit: §Y7300§!£time£."
    kuat_mission_0_chain_title:0 "§HMission§!: Kuat's Recommendation"
    kuat_mission_0_chain_desc:0 "§H[fallen_empire_kuat.GetName]§! requires us to complete their assigned tasks within a specified time and phase. Completing these tasks may alter §H[fallen_empire_kuat.GetName]§!'s opinion of us."
    kuat_mission_0_chain_amount:0 "Number of completed tasks"
    kuat_mission_total_chain_title:0 "§HTask§!: Joint Research Program"
    kuat_mission_total_chain_desc:0 "§H[fallen_empire_kuat.GetName]§! demands that our scientific department fully participate in the joint research program. We currently do not understand §H[fallen_empire_kuat.GetName]§!'s motives, but we must now take part in this program.\n\nOur scientists predict that we will need to complete the majority of projects before uncovering relevant information."
