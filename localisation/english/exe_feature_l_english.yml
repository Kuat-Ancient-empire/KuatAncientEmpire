    kuat_system_selector.1.title:0 "§HStar System Selector§!"
    kuat_system_selector.1.desc: "This is a very long description."
    kuat_system_selector.1.eternal_star_killer_weapon.desc:0 "To select targets in other star systems for the Eternal Fleet to attack, we need to set the coordinates of the target system within the fleet's star system selector.\n\nCurrently, there is no convenient method to quickly pinpoint a target. However, we can provide the selector's control system with characteristics of the desired star system to narrow down potential candidates, then identify the exact target system from among them.\n\nUse the buttons on the right to specify certain features of the target star system. Hovering over some buttons will display relevant descriptions."
    kuat_system_selector.1.response:0 "Filter criteria have been modified."
    kuat_system_selector.1.epsilon_star_killer_weapon.desc:0 "To use the Death Star Base to remotely attack targets in other star systems, we need to set the coordinates of the target system within the base's targeting system.\n\nCurrently, there is no convenient method to quickly pinpoint a target. However, we can provide the base's control system with characteristics of the desired star system to narrow down potential candidates, then identify the exact target system from among them.\n\nUse the buttons on the right to specify certain features of the target star system. Hovering over some buttons will display relevant descriptions."
    kuat_system_selector.2.desc:0 "This is a very long description."
    kuat_system_selector.2.eternal_star_killer_weapon.desc:0 "The star system selector's control system has locked onto candidate targets. We must now select from them the actual star system we wish to attack.\n\nSince we cannot make the Mid of the Eternal Fleet output more energy and control signals in a short time, the number of simultaneous attacks is limited. Currently, we can attack up to §Y1§! target at once.\n\nBefore launching an attack, the Gemini AI requires time to mobilize fleets and charge weapons. During this period, the Mid of the Eternal Fleet will be exceptionally vulnerable. We should avoid engaging enemy forces in combat, or it may be destroyed by hostile powers."
    kuat_system_selector.2.response:0 "Star system selection status has been updated."
    kuat_system_selector.2.epsilon_star_killer_weapon.desc:0 "The Death Star Base's control system has locked onto candidate targets. We must now select from them the actual star system we wish to attack.\n\nSince we cannot make the thermal oscillator Mid of the Death Star Base output more energy in a short time, the number of simultaneous attacks is limited. Currently, we can attack up to §Y5§! targets at once.\n\nBefore launching an attack, the Death Star Base requires time to charge its weapons. During this period, the base will be exceptionally vulnerable. We should avoid engaging enemy forces in combat, or it may be destroyed by hostile powers."
