    01_kuat_PATRONIZING_WSG: "Generation after generation, we hope you won't choose the path your ancestors once took."
    02_kuat_PATRONIZING_WSG: "The universe is but a stage, and we are all merely players, aren't we?"
    03_kuat_PATRONIZING_WSG: "Do you know what awaits us beyond the stars? We do. Crisis and destruction."
    01_kuat_DISMISSIVE_WSG: "If you need ships built, submit a request to the shipyard, not through diplomacy."
    01_kuat_ANGRY_WSG: "If given the chance, we will destroy you, insolent fools."
    02_kuat_ANGRY_WSG: "We will no longer communicate with anyone who opposes Imperial policy. Do not test our patience."
    01_kuat_WAR_GREETING_WSG: "We will make you understand the consequences of your foolishness!"
    02_kuat_WAR_GREETING_WSG: "Your feeble weapons cannot stop the assault of our warships. You should surrender; we guarantee no grudges will be held."
    01_kuat_CUSTODIAL_WG: "For thousands of years, we have witnessed countless crises arrive, effortlessly harvesting entire galactic civilizations and lives. And after destruction, the spark of civilization spreads anew. This region is like a cycle-today one empire and one crisis, tomorrow another empire and another crisis. Is there nothing here but crisis and destruction?"
