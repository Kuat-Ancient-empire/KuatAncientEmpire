    executor_build_special_parit.desc: "Ah, emerging civilization? Oh no, you are not descendants of that foolish Empire-hard to say whether I should congratulate or pity you....\n\nThe crimes and mistakes of your ancestors will never be buried by time. Their betrayal-we will never forget. Though we believe you should not exist, due to agreements once made, we will show leniency. Yet we will watch your actions closely. As they say, history is a mirror. We hope you do not repeat the mistakes of your forebears. Should you foolishly walk the same path as your ancestors, then in that day, there shall be no civilians in war-you will be utterly destroyed like them, and lose any chance to preserve your species."

