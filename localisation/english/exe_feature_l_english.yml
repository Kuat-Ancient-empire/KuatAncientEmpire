    exe_return_kuat_eternal_starbase: "§EAncient Archive§!"
    exe_return_kuat_eternal_starbase_DESC: "According to our research, the team speculates that §Y$Name_A_1$§! was once a heavy war fortress of the Endordia Empire. However, the Endordia Empire that once controlled it has long since vanished. Perhaps we should investigate further here to uncover clues buried in history."
