    Infinite_StarForge:0 "Infinite Construction Yard"
    Infinite_StarForge_DESC:0 "The Infinite Empire's ship construction yard-an awe-inspiring producer of warships-this facility greatly accelerates the reinforcement rate of the Infinite Empire's fleets."
    Infinite_StarForge_MEGASTRUCTURE_DETAILS:0 "The Infinite Empire's ship construction yard-an awe-inspiring producer of warships-this facility greatly accelerates the reinforcement rate of the Infinite Empire's fleets."

    Infinite_inborder:0 "Infinite Interference Tower"
    Infinite_inborder_DESC:0 "What does the mechanical five-star icon on the Infinite Empire seem to mean? This facility is blocking our communications, and our supplies will not be able to extend into the system. "
    Infinite_inborder_MEGASTRUCTURE_DETAILS:0 "What does the mechanical five-star icon on the Infinite Empire seem to mean? This facility is blocking our communications, and our supplies will not be able to extend into the system. "
    Infinite_inborder_disabled:0 "Infinite Interference Tower (Deactivated)"
    Infinite_inborder_disabled_DESC:0 "What does the mechanical five-star icon on the Infinite Empire seem to mean? This facility is blocking our communications, and our supplies will not be able to extend into the system. Apparently it is no longer available. "
    Infinite_inborder_disabled_MEGASTRUCTURE_DETAILS:0 "What does the Infinite Empire's jamming tower from nowhere, the mechanical five-star icon on it seems to mean? This facility is blocking our communications, and our supplies will not be able to extend into the system. Apparently it is no longer available. "
    Infinite_inborder_restored:0 "$Infinite_inborder$"
    Infinite_inborder_restored_DESC:0 "What does the mechanical five-star icon on the Infinite Empire seem to mean? Obviously, we don't know yet. However, this jamming facility now belongs to us. "
    Infinite_inborder_restored_MEGASTRUCTURE_DETAILS:0 "$Infinite_inborder$ will provide strike protection to the galaxies around it."
    Infinite_inborder_upgraded:0 "Disable $Infinite_inborder$"
