 kuat_galatic_empire_e_area_site:"§EDestroyed City§!"
 kuat_galatic_empire_e_area_site_desc:"Our researchers discovered a ruined city on the ring structure within the $NAME_kuat_galatic_empire_e_area$ system. This matches closely with prior information obtained from $Name_Kuat_Fire_base$ regarding the capital of the Endodia Empire. Although this once-glorious city lies in complete ruin, our researchers recommend further investigation to search for valuable data and relics."

