 astral_rift_infinite_rakata:"§EMind Prison§!"
 kuat_relic_triumph_cooldown:"$relic_triumph_cooldown$\n\nObtain ship design: $NAME_KUAT_LAGATOR$\n\nOpen rift: $astral_rift_infinite_rakata$"

 kuat_infinite_rakata_rift.1.name:0 "§EMind Prison§!"
 kuat_infinite_rakata_rift.1.desc:0 "The Mind Prison is $Name_kuat$'s most classified project, said to be capable of imprisoning the minds and wills of any living being. Its existence has long been a mystery, until we defeated $Name_kuat$, and a holodrive led us here, allowing us to uncover the secrets hidden within.\n\n[Leader.GetName] risked their life, traveling through dimensional storms in a spacecraft. Notably, dimensional storms are terrifying phenomena that exist only within higher-dimensional rifts; they can warp space-time and devour everything. Even inside the ship, [Leader.GetName] could feel fear spreading. Within the storm, [Leader.GetName] witnessed all manner of bizarre visions, entirely indescribable in words.\n\nAfter enduring countless trials, [Leader.GetName] finally reached the other side of the dimensional rift. There, we were astonished to discover an octahedron bound by chains, floating in the void. It emitted a mysterious and dangerous aura, sending chills down one's spine. [Leader.GetName] immediately began investigating it, discovering complex Runic inscriptions and patterns on its surface-seeming like an ancient language. Yet instinct told them: the Mind Prison had been found. [Leader.GetName] attempted to decipher their meaning, hoping to find a way into the Mind Prison.\n\nAfter considerable effort, [Leader.GetName] finally uncovered a shocking truth. The Mind Prison is a mental domain, within which lies a secret older than $Name_kuat$ itself. To enter the Mind Prison, one must connect their consciousness with the Mid of the Mind Prison. This is an extremely dangerous act, as once inside, there may be no return. Moreover, unknown entities are imprisoned within the Mind Prison, and we cannot calculate the risks involved.\n\n[Leader.GetName] now faces a difficult choice: enter the Mind Prison or attempt to dismantle and destroy it. Either decision may bring great risk and cost."
 kuat_infinite_rakata_rift.1.a:0 "Mental Access"
 kuat_infinite_rakata_rift.2.name:0 "§EMental Access§!"
 kuat_infinite_rakata_rift.2.desc:0 "[Leader.GetName] risked their life to enter $Name_kuat$'s Mind Prison. We cannot determine exactly how it functions, but the Mind Prison seems to possess its own will-it is resisting us.\n\nHowever, the moment [Leader.GetName] connected to the Mind Prison, they faced fierce resistance. The Mind Prison attempted to control and enslave [Leader.GetName]'s party, using inner fears and desires to break our will and consume us. [Leader.GetName]'s group fell into a grueling struggle, constantly encountering illusions and traps. The Mind Prison was attempting to eliminate [Leader.GetName], but ultimately failed. Drawing upon unshakable conviction, [Leader.GetName] overcame every obstacle and finally reached the core region of the Mind Prison-the place where all imprisoned souls reside.\n\nThey witnessed a chilling sight: formless consciousnesses and souls filled the area, unable to think or feel freely, wandering only in pain and despair. [Leader.GetName] discovered these imprisoned souls had nearly fully merged with the Mind Prison."
 kuat_infinite_rakata_rift.2.a:0 "Keep watch over them. Be extremely cautious of these spirits."
 kuat_infinite_rakata_rift.21.name:0 "§EImprisoned Beings§!"
 kuat_infinite_rakata_rift.21.desc:0 "Although the internal space of the Mind Prison is vast, our researchers cannot explore its structure. [Leader.GetName], however, possesses immense mental fortitude, overcoming the dark influence of the Mind Prison and locating its Mid.\n\nWithin the core domain, [Leader.GetName] quickly discovered the deepest layer of the prison, where a shocking secret lay hidden-an ancient darkness sealed for millennia. At the moment of despair, the will of the Mind Prison contacted [Leader.GetName], revealing certain truths and pleading that we not break the seal.\n\nIt turned out that the last seer of the Rakatan Empire had been imprisoned here by the Emperor. They were once the creators of the Mind Prison, and thus the will of the Mind Prison fears the return of the Rakatan seers to the material world-they wield powerful dark forces, though we still know nothing of their past.\n\nAccording to the Mind Prison's will, the Rakatans were imprisoned here by the Galactic Emperor. By the Emperor's final decree, the Rakatans had attempted to rebel against Imperial rule, so their seer was locked within the Mind Prison, condemned to suffer for Aeternum. Clearly, $Name_kuat$ inherited this legacy, reinforcing the Mind Prison's seal to prevent the Rakatans from ever threatening their safety again.\n\nDespite this, [Leader.GetName] was astonished to discover that the Rakatan seer had not given up hope-they had been waiting for an opportunity to reclaim everything they had lost."
 kuat_infinite_rakata_rift.21.a:0 "Handle with caution."
 kuat_infinite_rakata_rift.22.name:0 "§EAncient Relics§!"
 kuat_infinite_rakata_rift.22.desc:0 "[Leader.GetName] carefully assessed the current situation. Deciding to cautiously attempt contact with the imprisoned Rakatan seer, just as our researchers began preparing, a massive psychic force invaded them. Fortunately, this force bore no hostility. It left behind fragments of dark past buried in the past.\n\n§YThe Rakatans were the dominant species of the Infinite Empire, ruling the galaxy unchallenged millions of years ago. Their brutal reign bred widespread resentment across the stars. Yet due to their mastery of dark Strength, none could defeat the Infinite Empire. Thus, the Infinite Empire used their power to create wonders such as the Mind Prison and the Stellar Forge.\n\nUntil the arrival of the Kwars. Once the mentors of the Rakatans, after enlightenment the Rakatans enslaved the Kwars. Their descendants exploited the rotting rule of the Infinite Empire, unleashing a virus-its origin unknown. The virus stripped the Rakatans of their Strength, even their lives. Under this threat, the Infinite Empire could no longer sustain its rule. At this moment, the Empire's vassals rose in rebellion. In an instant, the Infinite Empire fractured, and the galaxy plunged into chaos.\n\nThe Infinite Empire should have perished then and there. But the Rakatans refused to accept extinction. They sacrificed every sentient being under their control to create Gemini and $Name_Eternal_Aries_Support$ intelligence. Ultimately, the Eternal Fleet, formed by Gemini and $Name_Eternal_Aries_Support$, crushed all opposition and restored the Infinite Empire's dominion.\n\nBut fate cannot be denied-the Infinite Empire was destined to fall. In their final act, they created an even more terrible monster: the war machine of the Dark Lord. Now, the last Rakatan seer remains imprisoned within the Mind Prison.\n\nThis revelation shocked [Leader.GetName] and others. Perhaps we should reconsider whether to liberate this final Rakatan seer. The will of the Mind Prison urges us to help suppress the Rakatan seer."
 kuat_infinite_rakata_rift.22.a:0 "Reinforce the Seal"
 kuat_infinite_rakata_rift.22.b:0 "Break the Seal"
 kuat_infinite_rakata_rift.23.name:0 "§EReinforce the Seal§!"
 kuat_infinite_rakata_rift.23.desc:0 "Clearly, we cannot remain idle amid the current galactic situation. Forces from a past World still hide within the mist. The crisis is dire-we cannot allow these remnants of the past to endure. We must reinforce the seal and ensure these spirits of the past vanish completely into the river of time.\n\n[Leader.GetName] slowly approached the control console at the core of the Mind Prison and reached out, connecting to the Mind Prison's management system, aiding its will in suppressing the Rakatan seer. As [Leader.GetName] linked in, the space of the Mind Prison shook violently. Above the void's sky, purple and golden light appeared, clashing fiercely. The shockwaves intensified the spatial tremors. Many souls consumed by the prison screamed shrilly, as if Abyssal demons were awakening.\n\nAfter the terrifying aftermath spread through the mental realm for a time, the golden light gradually dimmed-the Rakatan seer's power was awakening. The Mind Prison's will is now frail and dying, unable to contain the seer's resurgence. Just as the golden light was about to vanish, [Leader.GetName] was engulfed by a surge of purple light. The tremors then subsided. The Mind Prison's space began to collapse, but [Leader.GetName]'s mind was damaged, rendering them unable to move. Fortunately, our research team evacuated the wounded from the Mind Prison."
 kuat_infinite_rakata_rift.23.a:0 "Perhaps the awakening of the Rakatan seer was inevitable."
 kuat_infinite_rakata_rift.3.name:0 "§EBreak the Seal§!"
 kuat_infinite_rakata_rift.3.desc:0 "Clearly, we should release the suppressed Rakatan seer. From their words, we shall learn all the secrets of the past World.\n\n[Leader.GetName] slowly approached the control console at the core of the Mind Prison and reached out, connecting to the Mind Prison's management system, beginning the release of the seer. As the seer was being freed, the will of the Mind Prison erupted with immense psychic power. The prison's space trembled. Souls enslaved and devoured by the prison shrieked-this Abyss-like scene terrified [Leader.GetName]'s party. Above the void's sky, golden light suppressed the purple radiance emanating from the prison's core. The two forces clashed violently, their shockwaves increasing the frequency of spatial quakes-tearing open the void itself.\n\nAfter the terrifying aftermath spread through the mental realm for a time, the golden light gradually dimmed-the Rakatan seer's power was awakening. The Mind Prison's will is now frail and dying, unable to contain the seer's resurgence. Just as the golden light was about to vanish, [Leader.GetName] was engulfed by a surge of purple light. The tremors then subsided. The Mind Prison's space began to collapse, but [Leader.GetName]'s mind was damaged, rendering them unable to move. Fortunately, our research team evacuated the wounded from the Mind Prison."
 kuat_infinite_rakata_rift.3.a:0 "§GPerhaps the awakening of the Rakatan seer was inevitable.§!"
 kuat_infinite_rakata_rift.3.b:0 "§YPerhaps the awakening of the Rakatan seer was inevitable.§!"
 kuat_infinite_rakata_rift.3.c:0 "§RPerhaps the awakening of the Rakatan seer was inevitable.§!"
