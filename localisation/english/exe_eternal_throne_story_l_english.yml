#origin
 Name_Zakuul:"Zakul"
 Name_Izax:"Izax"
 Name_Zildrog:"Zildrog"
 Name_Scyva:"Skiva"
 Name_Zakuul_Star:"Zakulan Giant"
 origin_eternalthrone:"§E[The Dawn of Kuat] Eternal Throne§!"
 origin_eternalthrone_desc:"This is an ordinary planet located beyond the frontier worlds, but high levels of automation and various ruins ensure that ordinariness is only temporary. As people gradually uncover and utilize the technology of ancient forerunners, a powerful force is quietly brewing. Now we have entered the vast starry expanse, yet there remains much we cannot understand-but this will not last for long..."
 origin_eternalthrone_effect:"§HWe will begin this game as the Eternal Empire§!\nStarting in the §EZakul§! system\nStarting with Eternal Arcologies\n§YThis origin is disabled in multiplayer; no multiplayer compatibility, unpredictable outcomes may occur§!\n\nThis origin is a sequel to the 'Dawn of Kuat' storyline."
 START_SCREEN_ETERNAL_ORIGIN:"For a long time, our [GetSpeciesName] species, under new leadership, achieved global unity. Yet within the vast galaxy, we remain but dust. Our empire must not rest here. Over centuries, we have completed leaps in industry and technology. We have built the largest and most magnificent city in our history. We believe this will not be the last. We shall spread prosperity across the entire galaxy.\n\nThis is an ordinary planet located beyond the frontier worlds, but high levels of automation and various ruins ensure that ordinariness is only temporary. As people gradually uncover and utilize the technology of ancient forerunners, a powerful force is quietly brewing. Now we have entered the vast starry expanse, yet there remains much we cannot understand-but this will not last for long..."
 START_SCREEN_SHADOW_ORIGIN:"For a long time, our [GetSpeciesName] species, under new leadership, achieved global unity. Yet internal factions remained strong, and ultimately our unity collapsed into chaos. Our civilization entered a dark age lasting centuries.\n\nUntil $Name_kuat$ appeared, showing us a new path forward. The light of $Name_kuat$ now covers all our worlds. It is both sublime and profoundly arrogant. Beneath its cold radiance, we barely survive, striving to create small shadows of our own to escape the cruelty of its brilliance. Now, we shall forge our own glory with our hands. Our story has only just begun..."
 exe_zakuul_System_NAME:"Zakul"
 exe_zakuul_System_DSEC:"Zakul once possessed significant southern oceans and extensive marshlands covering the planetary surface. The planet's swamps are semi-solid regions filled with massive, weed-choked trees. Like Odessen, this world also holds a unique connection to balancing the Force between its light and dark sides. Although development and civilization have led the entire Core World to be completely covered by cities, Zakul still retains its vibrant vitality."
