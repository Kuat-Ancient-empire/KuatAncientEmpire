 misc_system_desc_5:"$NAME_kuat_galatic_empire_e_area$"
 misc_system_desc_5_desc:"Imperial research departments have intercepted a new signal band. Our scientists discovered that the signal originates from a star system previously undetected on our star charts-this means we have discovered a new star system. Researchers believe this will be a milestone in our deep space exploration. They urge that we should explore this system as soon as possible."
 misc_system_desc_5_desc_finished:"We have concluded our study of $NAME_kuat_galatic_empire_e_area$, and so far researchers have uncovered a wealth of valuable information.\n\n$misc_system_desc_5$ turns out to be a star system erased from the star charts by the Endodia Empire. Due to its star emitting extremely faint light, the Endodia Empire exploited this characteristic to use it as a hidden military fortress, concentrating their entire military strength along with economic and technical personnel here. In the final years of their war against Kuat, this system became the last controlled territory of the Endodia Empire.\n\nScanning results from our researchers indicate that, compared to previous facility zones, there are far larger-scale shipwrecks within this system. It appears that in $misc_system_desc_5$, the Endodia Empire and $Name_kuat$ engaged in an even larger battle. Estimates suggest the number of ships lost here exceeds any known military capacity. Yet after the brutal conflict, only scattered wreckage and damaged megastructures remain.\n\nAdditionally, according to our investigation reports from this system, the last emperor of the empire, Endodia I, conducted a transaction here with $Name_Kuat_Fire_base$. They secretly reached some kind of agreement. Because of this agreement, $Name_Kuat_Fire_base$ prevented Kuat from completely annihilating the Endodia Empire. In return, the emperor was transferred to the controlled zone of $Name_Kuat_Fire_base$, and all research data regarding Isotope-5 secretly conducted by the empire was acquired by $Name_Kuat_Fire_base$. Thus, $Name_Kuat_Fire_base$ has continuously guarded this fortress. The current impact of this situation on the Eternal Fleet remains unknown, but we must remain vigilant.\n\nFortunately, under the wise leadership of our imperial leader, we destroyed the guarding fleet of $Name_Kuat_Fire_base$, reactivated the Gateway, and obtained Isotope-5, allowing our Eternal Fleet to be repaired. Furthermore, through coordinated operations between our fleet and the Eternal Fleet, the returning $Name_kuat$ was utterly destroyed. They should no longer act arrogantly now.\n\nIn summary, we can currently confirm the following points:\n1. $misc_system_desc_5$ is the true final capital of the Endodia Empire and the location where they secretly researched the Eternal Fleet.\n2. The war between $Name_kuat$ and the Endodia Empire escalated fully due to the intervention of $Name_Kuat_Fire_base$, ultimately leading to the destruction of the Endodia Empire.\n3. $Name_Kuat_Fire_base$ secured the survival of the Endodia species in exchange for obtaining all research data on Isotope-5; the potential impact on the Eternal Fleet remains uncertain.\n4. We can now confirm that we have completely defeated $Name_kuat$.\n\nHowever, the current situation remains complex and unclear, and further investigation is still required."
 kuat_legacy_key_world_5_desc:"REPLACE_ME"
#####################
 site_Eternal_outpost:"§E Unterraum Signal §!"
 site_Eternal_outpost_intro:"Our deep-space sensors, during a recent routine scan, detected a tachyon signal on a planet orbiting our capital that should not exist in this location. Unlike the conventional tachyon signals we have observed, this type of signal theoretically can only be detected within the event horizon of a Black Hole under normal cosmic conditions. Therefore, our chief physicist emphasizes that we must launch an investigation into this anomalous signal-it is imperative that we conduct a thorough analysis."
 kuat_eternal_legacy.1.a:"Intensify the investigation!"
 Eternal_legacyancient_chain_title:"§E Precursor-Throne of the AE §!"
 Eternal_legacyancient_chain_desc:"Our ancestors once thrived upon this land, and their epics recorded our history. Although many of these records seemed fantastical and elusive, as ancient texts gradually proved accurate, our researchers could no longer ignore them. This peculiar phenomenon has drawn the attention of our archaeological and research departments, who demand that we investigate our past and reexamine our history."
 Eternal_legacyancient:"§E Relic Data"
 Eternal_legacyancient_1_poi:"§E Unterraum Signal §!"
 Eternal_legacyancient_1_poi_desc:"Our deep-space sensors, during a recent routine scan, detected a tachyon signal on a planet orbiting our capital that should not exist in this location. Unlike the conventional tachyon signals we have observed, this type of signal theoretically can only be detected within the event horizon of a Black Hole under normal cosmic conditions. Therefore, our chief physicist emphasizes that we must launch an investigation into this anomalous signal-it is imperative that we conduct a thorough analysis."
 kuat_eternal_legacy.1.name:"§E Unterraum Signal §!"
 kuat_eternal_legacy.1.desc:"Our deep-space sensors, during a recent routine scan, detected a tachyon signal on a planet orbiting our capital that should not exist in this location. Unlike the conventional tachyon signals we have observed, this type of signal theoretically can only be detected within the event horizon of a Black Hole under normal cosmic conditions. Therefore, our chief physicist emphasizes that we must launch an investigation into this anomalous signal-it is imperative that we conduct a thorough analysis."
 kuat_eternal_legacy.2.name:"§E Unknown Energy Signal §!"
 kuat_eternal_legacy.2.desc:"During preliminary surveys around the target world, our science team detected an unknown energy signal in nearby space.\n\nHowever, according to current sensor data, all conventional readings in this region remain within normal ranges, meaning we cannot quickly trace the source of the signal through energy triangulation.\n\nOur scientists are baffled, and conducting a surface search of the target planet may be the only viable option at present."
 kuat_eternal_legacy.2.a:"Continue the investigation"
 kuat_eternal_legacy.3.name:"§E Interference §!"
 kuat_eternal_legacy.3.desc:"Our research team has arrived and immediately commenced formal search operations. However, soon our frontline personnel encountered unprecedented difficulties.\n\nTechnicians reported that, for unknown reasons, our remote probes began experiencing irreversible Glitches after flying beyond a certain distance, rapidly failing and crashing.\n\nAs a result, our team must rely on old-fashioned wired equipment to conduct a thorough sweep of the planetary surface, significantly extending the time required for the archaeological team.\n\nFinally, after an arduous search, our team successfully pinpointed the exact location of the signal within a small canyon on the planet and began further investigation of the surrounding environment.\n\nThe findings indicate the presence of a strange gravitational field in the area, independent of the planet's own structure. Any matter or object capable of generating such a phenomenon is undoubtedly no simple thing. Based on this, our team has immediately begun relocating toward the vicinity of the gravitational field in hopes of greater discoveries."
 kuat_eternal_legacy.3.a:"Interesting"
 kuat_eternal_legacy.4.name:"§EDifferent Ships§!"
 kuat_eternal_legacy.4.desc:"With the aid of engineering equipment, our survey team successfully carved out a path directly to the target area and established a temporary research station nearby.\n\nTo the naked eye, however, this region contained nothing but piles of rocks, and portable radar data also indicated that apart from endless stone formations, there was nothing here.\n\nJust as our scientists believed they had failed and prepared to return, a patrol drone conducting routine surveillance in the stratosphere suddenly lost propulsion due to engine damage and, under command instructions, entered a glide state in hopes of a safe emergency landing.\n\nYet not long after, the slowly gliding drone suddenly burst into a fireball. Our scientific team, witnessing this event, immediately realized that some device capable of deceiving both visual and electronic signals must exist within this region. They promptly launched an EMP missile to overload all electronic systems present.\n\nThey were right: a massive alien warship with a peculiar design now lay before them."
 kuat_eternal_legacy.4.a:"Interesting"
 kuat_eternal_legacy.5.name:"§EEternal Fleet of Unknown Sectors§!"
 kuat_eternal_legacy.5.desc:"After unveiling the warship, our team immediately began a comprehensive investigation of the vessel.\n\nExternally, the ship's uniquely segmented design does not belong to any known nation currently existing within this Galactic region; instead, it bears a striking resemblance to a legendary vessel from our people's folklore known as the 'Divine Construct Warship'.\n\nThis instantly sparked the interest of our researchers: could this be mere coincidence? Driven by curiosity, our team quickly boarded the bridge and began inspecting the interior.\n\nAfter some unexplained forced entry, we finally gained access to the ship's compartments. The main structure of the vessel showed moderate damage, and much of its interior appeared somewhat dilapidated. After searching, we focused on several chambers whose functions remained unknown.\n\nHowever, due to the scarcity of physical and electronic documents aboard, progress in translating the builders' language system has been extremely slow."
 kuat_eternal_legacy.5.a:"Coincidence or destiny?"
 kuat_eternal_legacy.6.name:"§EAncient Unknown Sector Vessel§!"
 kuat_eternal_legacy.6.desc:"As exploration progressed deeper, our overall survey of the vessel neared completion. Standard measurements indicate the ship is not particularly large-by conventional standards, it qualifies only as a Mid-sized cruiser-class vessel.\n\nDue to the inherent structural characteristics of such Mid-sized warships, combined with severely aged load-bearing structures, certain internal chambers have suffered severe damage or even collapse, rendering them incapable of yielding any usable intelligence.\n\nAmong the remaining intact chambers, aside from discovering wall decorations resembling brushstroke-like patterns in areas resembling crew quarters, our researchers found little else of note.\n\nAs for the numerous electronic terminals onboard, most were damaged beyond recovery due to our prior EMP attack, their circuits burned out, resulting in near-total loss of stored data.\n\nNevertheless, our team believes that given the ship's extraordinary concealment methods, its technological sophistication likely exceeds what we've observed so far.\n\nTherefore, a thorough inspection of the last few remaining chambers is essential. With this in mind, we initiated an investigation into a chamber at the rear of the vessel suspected to be a power core facility."
 kuat_eternal_legacy.6.a:"Please continue"
 kuat_eternal_legacy.7.name:"§EAlien Technology§!"
 kuat_eternal_legacy.7.desc:"After breaching the door using shaped charges with minimal collateral damage, our researchers entered the vast chamber.\n\nThe room was circular in layout, filled entirely with pipes and mechanical structures of various sizes, except for a central reactor core. Due to the narrow gaps between pipes and the risk of catastrophic consequences from damaging them, our team deployed micro-drones to investigate the core.\n\nOur caution proved justified: the center of the power chamber housed no conventional matter reactor, but rather a reactor powered by an artificial stellar body created by compressing energy to extreme levels. Analysis revealed that all previously detected signals originated from this source.\n\nDue to the World's unique geographical features and interference from a cloaking field, the signal from the central stellar core could not escape directly. Only a few stray signals managed to evade dual layers of interference, echoing faintly through this Sector of space.\n\nUpon receiving the report, our chief sociological scientist stated that the facility, dubbed the 'Isotope-5 Reactor', matched nearly identically with descriptions of warship power sources from our ancestral legends."
 kuat_eternal_legacy.7.a:"Isotope-5?"
 kuat_eternal_legacy.8.name:"§EBetter Than Nothing§!"
 kuat_eternal_legacy.8.desc:"Just as our researchers celebrated their success, disaster struck. Our stay personnel discovered that the EMP missile we fired earlier had pushed the ship's electronic control systems to the brink of collapse.\n\nThis caused the reaction within the central core of the power chamber to enter an extremely unstable state. Researchers speculate that, due to system failure, the vessel's material transport system may have completely shut down. Without external material input, the Isotope-5 construct would be unable to sustain further energy release reactions, ultimately leading to self-disintegration from fuel starvation.\n\nSince the disintegration of the Isotope-5 construct would alter the ship's gravitational structure and lead to catastrophic structural failure, our researchers accelerated investigations in secured compartments.\n\nDuring further searches, we discovered surviving paper documents, greatly accelerating our linguistic decryption efforts.\n\nAfter deciphering the fundamental properties and elements of the language, our translation team found that the phonetics used aboard this Unknown Sector warship closely resemble those spoken in our ancestral era. However, grammatically, their language is significantly more complex. Additionally, by retrieving partial data from surviving terminal units, our scientific team successfully identified the basic structural characteristics of these Isotope-5-powered vessels and obtained research materials related to the Isotope-5 construct.\n\nShortly afterward, as the Isotope-5 construct dissipated, most of the hull-except for primary chambers-collapsed due to the loss of sustaining fields, disintegrating within days into a debris field nearly two kilometers long."
 kuat_eternal_legacy.8.a:"Begin operation"

 site_Eternal_legacysatellite:"§EIsotope-5 Construct§!"
 site_Eternal_legacysatellite_intro:"From analyzing the collected data, we have gained a basic understanding of the Isotope-5 construct's operating principles and energy signatures. This Isotope-5 construct is not a standard variant, but rather a quantum-locked Isotope-5 construct.\n\nSuch constructs can maintain prolonged operation, continuously supplying infinite energy to a spacecraft when paired with a steady input of a substance structure we currently cannot comprehend. Nevertheless, this configuration induces partial changes in the core mechanical intelligence formed by these constructs."
 Eternal_legacyancient_2_poi:"§EIsotope-5 Construct§!"
 Eternal_legacyancient_2_poi_desc:"From analyzing the collected data, we have gained a basic understanding of the Isotope-5 construct's operating principles and energy signatures. This Isotope-5 construct is not a standard variant, but rather a quantum-locked Isotope-5 construct.\n\nSuch constructs can maintain prolonged operation, continuously supplying infinite energy to a spacecraft when paired with a steady input of a substance structure we currently cannot comprehend. Nevertheless, this configuration induces partial changes in the core mechanical intelligence formed by these constructs."
 kuat_eternal_legacy.10.name:"§EIsotope-5 Signal§!"
 kuat_eternal_legacy.10.desc:"In our most recent scan, we detected an energy signature closely matching that of the Isotope-5 reactor core from the previous Unknown Sector warship. After comparing this signal against the prior sample, the Science Division confirmed that the detected reaction matches radiation patterns typical of an Isotope-5 reactor.\n\nBased on this, we suspect the presence of a derelict ancient Unknown Sector Galactic Empire warship nearby. We require our research team to proceed to this location immediately."
 kuat_eternal_legacy.10.a:"Agreed. Depart immediately"
 kuat_eternal_legacy.11.name:"§ELand§!"
 kuat_eternal_legacy.11.desc:"Our expedition team successfully reached orbit above the target World and conducted a standard environmental scan. Results indicate that most regions of this World appear enveloped in a peculiar energy field.\n\nIf our team lands prematurely, all electronic instruments they carry may be disrupted by this field and rendered inoperable.\n\nThus, it took our team some time to locate a small landing zone near the planet's north pole where the field's intensity was comparatively weaker. After uploading field data, they landed safely.\n\nFollowing analysis of the energy field's characteristics, our research center concluded this is likely the result of a failed safety containment field: massive amounts of energy, escaping uncontrollably from the Isotope-5 core due to system failure, have blanketed the entire surface, gradually forming this unique energy field.\n\nTherefore, we require a method to mitigate the adverse effects of this field; otherwise, further research will be impossible."
 kuat_eternal_legacy.11.a:"Immediately establish a special project group to assist"
 kuat_eternal_legacy.12.name:"§EShattered Space§!"
 kuat_eternal_legacy.12.desc:"With the arrival of energy field suppression devices urgently dispatched from the capital Sector, our research team could finally commence exploration.\n\nAs the team approached the target area, scientists observed unnatural distortions and deformations in parts of the landscape. Given that local temperature and other geographical conditions remained normal, researchers hypothesized that spacetime itself had become distorted due to unknown factors. As they drew closer, spatial distortions intensified.\n\nFearing accidental entrapment in a rift with no return, the team slowed their advance, eventually reaching the target area after months of cautious progress.\n\nWhen the first scout stepped onto the target plain, they were met with a purple sky cracked like drought-stricken earth, and surrounding space shattered into countless fragments, riddled with eerie transparent folds and deep rifts.\n\nA warship floated within this fractured space. Given the severity of Isotope-5 engine leakage affecting the entire planet's ecology, our team leader strongly recommends full preparation before attempting boarding, and readiness to abandon the vessel if necessary."
 kuat_eternal_legacy.12.a:"Proceed. Resources are unlimited"
 kuat_eternal_legacy.13.name:"§EPrepare to Enter§!"
 kuat_eternal_legacy.13.desc:"After analyzing local spatial conditions, our research team developed three sets of specialized single-person gear based on the region's unique characteristics.\n\nThese suits will enable personnel to conduct deeper reconnaissance and ensure our assault teams won't be translocated into alternate dimensions or torn apart by spatial turbulence.\n\nHowever, due to extreme spatial instability, even with this equipment, we cannot remain in this chaotic region for extended periods. Our chief scientist warns that unless we destroy or deactivate the core, these spatial anomalies will persist indefinitely.\n\nTherefore, this mission must succeed in shutting down the power core; otherwise, we may permanently lose the chance to uncover the truth."
 kuat_eternal_legacy.13.a:"Difficult operation"
 kuat_eternal_legacy.14.name:"§EEnter Interior§!"
 kuat_eternal_legacy.14.desc:"Our research team decided to dispatch a three-member squad into the facility to attempt deactivation or destruction of the core, ensuring continued investigation.\n\nShortly after the trio entered, contact with the main team was lost-clearly, the core was interfering with communications. All we could do was hope they succeeded and returned safely.\n\nFortunately, the three-man team successfully deactivated the core. Its shutdown stabilized spatial conditions across the region, and signal interference ceased. Our researchers swiftly resumed their investigation.\n\nPreliminary results will take time. We must await their full report."
 kuat_eternal_legacy.14.a:"Understood. Be careful!"
 kuat_eternal_legacy.15.name:"§ECost§!"
 kuat_eternal_legacy.15.desc:"Our research team made such smooth progress that researchers felt uneasy-but their breakthrough successfully unveiled part of the facility's secrets.\n\nThe area they reached was the ship's weapons control and central computing section. Equipment here was poorly preserved. Researchers deduced the vessel had participated in a brutal battle, which destroyed command and computational systems. Fortunately, one relatively intact unit was found.\n\nResearchers are attempting to activate it, but its defenses are formidable. Decryption will require time."
 kuat_eternal_legacy.15.a:"Very well."
 kuat_eternal_legacy.16.name:"§EFinal Salvage§!"
 kuat_eternal_legacy.16.desc:"Our researchers successfully completed decryption. They will now present key recorded data from the vessel via visual playback.\n\n§Y<Warning, facility links across all sectors timed out><Warning, facility links across all sectors timed out>§! Ship under attack. Isotope-5 reserves depleted. Shield and armor offline. Control center has plotted evacuation route. Fleet withdrawing from combat Sector. Acquiring destination data..... Failed. Initiating backup protocol: land at nearest available site.\n\nA warship is suffering devastating attacks. With no support available, the control system opts for emergency landing on the nearest World. Researchers believe this landing site is our current location. Furthermore, a signal address was found in the database-likely the intended destination.\n\nWe must now proceed to this next coordinate."
 kuat_eternal_legacy.16.a:"Safety first."

 site_Eternal_Crashedbattleships:"§EAbandoned Structure§!"
 site_Eternal_Crashedbattleships_intro:"From the signal recovered from the previous ship, we have identified the final destination of this vessel. However, according to our records, the target planet should be a desolate rocky world, not the Gaia World listed in its database. To determine exactly what happened, we can dispatch a scientific team to conduct an archaeological expedition. There may be discoveries."
 Eternal_legacyancient_3_poi:"§ECity Fortress§!"
 Eternal_legacyancient_3_poi_desc:"From the signal recovered from the previous ship, we have identified the final destination of this vessel. However, according to our records, the target planet should be a desolate rocky world, not the Gaia World listed in its database. To determine exactly what happened, we can dispatch a scientific team to conduct an archaeological expedition. There may be discoveries."
 kuat_eternal_legacy.18.name:"§EUnusual World§!"
 kuat_eternal_legacy.18.desc:"We have discovered an area on this barren world that appears to be the ruins of a city. Due to severe weathering, the exterior details of these remains are no longer distinguishable, leaving only hollow outlines speaking of past glories."
 kuat_eternal_legacy.18.a:"Let's begin"
 kuat_eternal_legacy.19.name:"§EMegalopolis World?§!"
 kuat_eternal_legacy.19.desc:"When our scientists landed in that region of the planet, they immediately began surveying it. According to the data they sent back, this world was likely an early-stage megalopolis World that was abandoned for unknown reasons. Their investigation is not yet complete, and further data may deepen our understanding."
 kuat_eternal_legacy.19.a:"Continue forward"
 kuat_eternal_legacy.20.name:"§ESigns of Conflict§!"
 kuat_eternal_legacy.20.desc:"Over the past few months of excavation at the ruins, our scientists have made significant progress. By analyzing the architectural styles and material characteristics of the structures, our scientific team has gained some understanding of the building culture of the empire from this unknown Sector.\n\nAdditionally, all evidence found here indicates that a large-scale war occurred in this location long ago.\n\nHowever, due to the planet's surface being constantly shrouded in tornadoes and sandstorms, apart from some buildings, all related objects have been reduced to piles of debris by intense wind erosion, making their original forms impossible to identify.\n\nScientists reported that during instrumental analysis of certain structural remains, they detected several deeply buried structures protected by high-intensity materials.\n\nYet, because all underground access routes have long been blocked by sand and stone, and considering the signals indicating high-intensity metallic materials, the archaeological team believes that conventional methods cannot penetrate these underground facilities with their current equipment. Based on this, our team has submitted a report requesting specialized tools and additional personnel to complete the mission."
 kuat_eternal_legacy.20.a:"Approve their request"
 kuat_eternal_legacy.21.name:"§ECity Fortress§!"
 kuat_eternal_legacy.21.desc:"With the help of the tools we dispatched, our scientists have finally entered the remaining intact sections of this facility.\n\nUnlike other areas of the city, this structure contains numerous wireless communication devices, server equipment, and high-precision antennas. The entire upper-right section of the facility is occupied by stacks of heavily rusted massive transport-assist machinery.\n\nUnfortunately, most of the mechanical systems here are severely corroded and damaged beyond further study. Overall, this place resembles a command-oriented Fortress rather than a civic facility.\n\nOur team believes that, given the relatively fragile structural design and metal plating, this site must have undergone military retrofitting for some reason. Considering the complex layout, we will need more time to unravel its mysteries."
 kuat_eternal_legacy.21.a:"Then, let us begin"
 kuat_eternal_legacy.22.name:"§ECentral Database§!"
 kuat_eternal_legacy.22.desc:"The scientific team reports that they have decrypted most of the data terminals there and are now reading the stored information.\n\nAdditionally, during a secondary scan of the entire building, our probes detected a cavity beneath the thick steel plates of the transport hub, which has piqued our team's interest.\n\nAfter cutting through the floor where strong signals were detected using heavy machinery, our team discovered a well-preserved armory containing vast energy reserves and several weapons abandoned due to lack of maintenance.\n\nFor us, this armory is nothing short of a godsend-allowing us to replenish our treasury with its enormous Energy Credits while also gaining knowledge of ancient weaponry. Unfortunately, decrypting the database still requires more time."
 kuat_eternal_legacy.22.a:"Make a record"
 kuat_eternal_legacy.23.name:"§EWar§!"
 kuat_eternal_legacy.23.desc:"Perseverance pays off. After a long wait, we have finally decrypted the terminal database here and successfully obtained read access to most of the data.\n\nBy analyzing the vast amount of text and video files stored in the database, our team has learned some details about this war. This is footage of the fleet from the ship we're investigating launching an attack against enemy formations. These vessels appear extremely dangerous, and both sides demonstrated unparalleled Strength. However, this great battle eventually devolved into a prolonged war of attrition combining guerrilla and siege tactics.\n\nThis world was originally meant to serve as a reserve, but was attacked by those ships and subsequently abandoned. Why they never returned to reclaim it remains a mystery requiring further investigation."
 kuat_eternal_legacy.23.a:"Then we'll take custody of the data here"
 kuat_eternal_legacy.24.name:"§EEternal Fleet§!"
 kuat_eternal_legacy.24.desc:"Thanks to the vast amount of information preserved here, our sociologists have fully translated the recorded language in the database, and we now fully understand the meaning of most of the texts.\n\nThe official name of the fortress once located here was 'Eternal Fortress.' After that battle, the fortress vanished without a trace. Only information and records remain. And these ships are the Eternal Fleet mentioned in our ancient texts. They were fighting their enemies, though our records do not clearly identify who these enemies were.\n\nBut based on the database's records regarding the empire of that unknown Sector, the war that took place long ago was far more brutal than we currently understand. According to the Eternal Fleet's systematic assessment of their enemies' combat behavior, if these fleets were to return, they would continue attacking and destroying the Eternal Fleet without cease until one side is annihilated."
 kuat_eternal_legacy.24.a:"Incredible..."

 site_Eternal_Mysteriousfacilities:"§EImperial Research Center§!"
 site_Eternal_Mysteriousfacilities_intro:"Our Unterraum sensor array recently detected isotome-5 construct energy signatures near the polar region of this World. Given the rich findings from previous explorations, many scientists have eagerly volunteered upon hearing the news, hoping to participate."
 Eternal_legacyancient_4_poi:"§EImperial Research Center§!"
 Eternal_legacyancient_4_poi_desc:"Our Unterraum sensor array recently detected isotome-5 construct energy signatures near the polar region of this World. Given the rich findings from previous explorations, many scientists have eagerly volunteered upon hearing the news, hoping to participate."
 kuat_eternal_legacy.26.name:"§ENorthern Research Facility§!"
 kuat_eternal_legacy.26.desc:"Our ships have successfully landed at the planet's north pole and begun advancing toward the target signal. In the drone-transmitted footage, we discovered a unique structure with an architectural style completely different from the surrounding environment, whose external automated defense systems continue to operate to this day.\n\nOur personnel suspect this might have been an important research or command facility of the Galactic Empire responsible for operations against the Eternal Fleet.\n\nGiven the unusual circumstances here, we cannot rule out the possibility that personnel or special mechanisms may still be active. Disabling its defenses and infiltrating the facility is now urgent."
 kuat_eternal_legacy.26.a:"Advance"
 kuat_eternal_legacy.27.name:"§EAutonomous Research Lab§!"
 kuat_eternal_legacy.27.desc:"After destroying all automated defense machines and systems, we have finally succeeded in entering the interior of the laboratory.\n\nHowever, after thoroughly scanning the entire building with drones, we still find no trace of recent biological activity.\n\nTherefore, this is most likely an Autonomous research facility maintained by some mechanism.\n\nBased on our team's investigation of facility details, they speculate that this site will not cease operations as long as the central isotome-5 construct retains power. Further investigation is necessary.\n\nHowever, given the technological gap between us, subsequent investigations must proceed with extreme caution to prevent unforeseen complications."
 kuat_eternal_legacy.27.a:"Extreme caution"
 kuat_eternal_legacy.28.name:"§ESmooth Entry?§!"
 kuat_eternal_legacy.28.desc:"Latest update! After thorough preparation, we swiftly breached the interior of the research facility. Strangely, however, our personnel encountered no automated defense systems along the way to the core chamber-this is highly unusual.\n\nOur scientists couldn't help but wonder: weren't they afraid of their secrets being stolen? Nevertheless, when fortune presents itself, we must seize it. Our researchers seized the opportunity and rapidly advanced deeper into the facility."
 kuat_eternal_legacy.28.a:".....I don't know what to say"
 kuat_eternal_legacy.29.name:"§EWeapon Research Lab§!"
 kuat_eternal_legacy.29.desc:"After passing through narrow connecting corridors, our team successfully reached the core area. During the search, no valuable research data or meaningful equipment were discovered.\n\nThus, our team has placed all hopes on the core zone, hoping to find something worthwhile. According to the information currently transmitted back, the power and efficiency of the various weapons researched in this facility are utterly beyond our imagination.\n\nBecause these materials are made of metals we cannot even analyze, we are unable to decipher their manufacturing methods or operational principles. However, although this technology is currently unusable to us, we can leverage some of its properties to enhance our own weapons to a certain extent."
 kuat_eternal_legacy.29.a:"Pie in the sky"
 kuat_eternal_legacy.30.name:"§E Ship Data §!"
 kuat_eternal_legacy.30.desc:"After transmitting the weapon data, our team resumed exploration. Thanks to the still-functioning power systems here, they easily opened the door to the next location: the Ship Management Center.\n\nInside, our team discovered the latest ship data and designs from the Unknown Sector Empire at that time. Perhaps we can use these to enhance our own vessels. However, aside from these lightly defended ship records, there is also a portion of heavily encrypted data. This means the exploration is not yet complete."
 kuat_eternal_legacy.30.a:"Continue"
 kuat_eternal_legacy.31.name:"§E Research Data §!"
 kuat_eternal_legacy.31.desc:"Our team recently sent back the latest investigation report. As expected, this laboratory holds deeper secrets: after moving several racks storing research equipment, they found a small door.\n\nUnlike other facilities, the encryption level here is extremely high, which will take some time to crack. However, given that we've fully understood the encryption patterns of the Unknown Sector Empire, the decryption process won't take long."
 kuat_eternal_legacy.31.a:"Clever, no daydreaming"
 kuat_eternal_legacy.32.name:"§E Payday §!"
 kuat_eternal_legacy.32.desc:"Finally, after some time, our team cracked the door's code and used engineering machinery to clear the narrow, collapsed passage behind it.\n\nAt the end of the corridor, our team discovered a set of isolated black-box servers disconnected from any external network. Unfortunately, the data stored inside consists only of heaps of garbled code and incomprehensible chaotic narratives.\n\nBased on the writing style of the garbled text and the meaning of a few surviving sentences, these damaged or temporarily undecryptable files are likely coordinates of Worlds reserved by the Galactic Empire-coordinates they seem to have abandoned.\n\nNotably, we appear to have uncovered some information regarding the military deployment motives of hostile fleets. By analyzing and summarizing scattered data left in the research center, we pieced together a hypothesis about the opposing Unknown Empire: they still exist somewhere in the universe and continue purging the Eternal Fleet, which originally originated from Eokas. Interestingly, the Eternal Fleet was once under their control, but for unknown reasons, they now seek to exterminate it completely.\n\nWe can now confirm that our ancestors' records indeed referred to the Eternal Fleet."
 kuat_eternal_legacy.32.a:"Mission complete, return home"
 site_Eternal_clues:"§E Mysterious Technology §!"
 site_Eternal_clues_intro:"During routine patrols, our sector fleet suddenly detected a strange warship near this World. Based on structural analysis, it closely resembles Eternal Fleet vessels.\n\nThe vessel's exterior is constructed entirely of an unknown metallic-like material, with a fully intact structure exhibiting clear modular characteristics. Additionally, we detected energy signatures from a structure designated Isotope-5.\n\nAll evidence confirms this is a unit of the Eternal Fleet. Considering that Eternal Fleet ships always carry cloaking fields, scientists speculate that damage to the Isotope-5 structural engine may have caused a power failure, reducing the cloaking generator's efficiency. To conserve energy, the ship likely deactivated its external cloaking field, revealing its true form.\n\nTo protect our strategic interests, we must immediately dispatch a team to seize control and conduct an investigation."
 Eternal_legacyancient_5_poi:"§E Mysterious Technology §!"
 Eternal_legacyancient_5_poi_desc:"During routine patrols, our sector fleet suddenly detected a strange warship near this World. Based on structural analysis, it closely resembles Eternal Fleet vessels.\n\nThe vessel's exterior is constructed entirely of an unknown metallic-like material, with a fully intact structure exhibiting clear modular characteristics. Additionally, we detected energy signatures from a structure designated Isotope-5.\n\nAll evidence confirms this is a unit of the Eternal Fleet. Considering that Eternal Fleet ships always carry cloaking fields, scientists speculate that damage to the Isotope-5 structural engine may have caused a power failure, reducing the cloaking generator's efficiency. To conserve energy, the ship likely deactivated its external cloaking field, revealing its true form.\n\nTo protect our strategic interests, we must immediately dispatch a team to seize control and conduct an investigation."
 kuat_eternal_legacy.340.name:"§E Majestic Warship §!"
 kuat_eternal_legacy.340.desc:"Upon learning of the current situation, ten days ago we issued an emergency mobilization order to the nearest starport, commanding them to immediately send a scientific expedition team-including ground troops-to the target World.\n\nThe order was swiftly executed. Now, the accompanying Science Ship fleet has jumped into orbit above the target planet and preliminarily located the warship.\n\nFrom above, this massive vessel-crafted with cutting-edge technology-is nearly inactive, with only faint blue indicator lights flickering across its outer hull.\n\nAfter using previously discovered data from the automated lab to roughly calculate internal compartment distribution, our research team and accompanying marines landed on the main hull and established an observation outpost near the fire-control radar. The vanguard team has now reached the bridge entrance, awaiting further instructions."
 kuat_eternal_legacy.340.a:"Hold advance, await orders"
 kuat_eternal_legacy.34.name:"§E Enter Starship §!"
 kuat_eternal_legacy.34.desc:"As usual, after a long decryption process, our team successfully cracked the code on the door of this majestic starship and breached into the lower levels of the bridge.\n\nHowever, upon initial inspection, we found the interior condition far more complex than anticipated.\n\nAlthough the ship's exterior appears largely structurally intact, internal scans revealed extensive damage to numerous corridors and wiring. Severely damaged passages have almost completely collapsed, held together only by fragile armor plates bridging the gaps.\n\nPerhaps this explains why we could so easily board an Eternal Fleet vessel."
 kuat_eternal_legacy.34.a:"Truly incredible"
 kuat_eternal_legacy.35.name:"§E Security System §!"
 kuat_eternal_legacy.35.desc:"Guided by legendary descriptions of the vessel, our research team successfully bypassed most of the severely damaged sections within the ship and steadily advanced toward the Mid chamber.\n\nHowever, while one member searched an auxiliary compartment, they accidentally triggered some kind of protection mechanism at a console-the ship's security system has suddenly activated in full.\n\nNow, mechanical traps along the corridors are spinning to life, and all turrets in rooms and passageways have reoriented and powered up. Numerous combat robots have emerged from the walls, launching attacks against us. Fortunately, due to mechanical degradation, most robots perform far below expected combat capability.\n\nStill, to prevent accidents, we must quickly locate the control room and shut down these damn things. Not a single one of our people can be lost."
 kuat_eternal_legacy.35.a:"Move faster!"
 kuat_eternal_legacy.36.name:"§E Console §!"
 kuat_eternal_legacy.36.desc:"After a period of combat, our marines temporarily disabled all defensive installations along the path to the objective and blew a large hole through a blocking wall, clearing the way for the research team.\n\nHowever, since most of the ship's mechanisms are composed of Nanites, these defenses will mostly self-repair after some time and begin firing at us from behind.\n\nTherefore, we must move quickly and maintain tight defense. For these reasons, our marines established a defensive position at the ship's central area, providing long-range cover as they escorted the research team into the Mid chamber zone.\n\nAfter breaching the entire Mid chamber door with high-temperature thermite explosives, our scientists rapidly decrypted and deactivated the starship's internal security system.\n\nNow, the entire vessel-and the powerful weapons hidden within-are fully under our control."
 kuat_eternal_legacy.36.a:"This is our great success!"
 kuat_eternal_legacy.37.name:"§E Weapon Vault §!"
 kuat_eternal_legacy.37.desc:"After securing the entire Eternal vessel, our team began a thorough examination of its database, hoping to uncover more valuable strategic intelligence.\n\nHowever, the ship's AI system is actively resisting our investigation. Fortunately, the Isotope-5 structures forming its core are beginning to decay, meaning the AI will soon lose the ability to block our intrusion. Persistence paid off-after sifting through vast amounts of data, we found an inventory list of weapons stored in the ship's armory, located within a small server.\n\nSince we discovered several prototype weapons in the armory whose technological principles we cannot comprehend, this inventory will help us better understand these mysterious creations and reshape our understanding of the Eternal Fleet and its legends. Currently, our translation team has identified a particularly unique description and has begun prioritizing its decryption.\n\nAccording to the translated content so far, the so-called ultimate weapon is stored within a silver metallic block bearing cross-shaped engravings, requiring further decryption to extract. This bears a striking resemblance to an object we found in the weapon vault."
 kuat_eternal_legacy.37.a:"Interesting-let's hope it's not just smoke and mirrors"
 kuat_eternal_legacy.38.name:"§E Mysterious Technology §!"
 kuat_eternal_legacy.38.desc:"Due to the object's highly distinctive shape, our team quickly identified its location among a collection of uniquely designed weapons and transported it to our hazardous-weapon testing laboratory outside the ship.\n\nFollowing the document's instructions, we pressed the circular center of the cross-shaped markings and then entered a symbolic sequence on the emerging symbol panel.\n\nFortunately, the document was accurate. After confirming the correct password, the metal block emitted a series of harmless white protective gas with a hissing sound.\n\nUnder the eager gaze of surrounding researchers, the top of the block slowly rose, gradually revealing its contents: a spherical floating device resembling the holographs commonly used in our Empire. The device then transformed, projecting an image of a region within our imperial capital.\n\nOur researchers located ancient ruins in this area-an ancient throne, believed to be ancestral relics. Recalling the descendants' prayers, they claimed this would be Zakuul's hope. Now, the projection from the Eternal vessel points directly to this ancient throne-perhaps there is a connection."
 kuat_eternal_legacy.38.a:"Incredible-the throne may hide some secret"
 kuat_eternal_legacy.39.name:"§EAncient Relic§!"
 kuat_eternal_legacy.39.desc:"After months of effort, our engineering team has preliminarily restored the core systems of this Eternal vessel and mostly repaired the damaged main structure of this Titan. However, due to severe damage to its AI system, the entire ship's control system has been completely destroyed.\n\nAccording to our ancient texts, we cannot commandeer Eternal warships. But times have changed. After our researchers manually interfaced with the control system, this magnificent Eternal vessel was manually piloted out of the planet's atmosphere and is now heading toward our homeworld's central shipyard for further repairs.\n\nJust as our new warship exited hyperspace glide and arrived above the planet, the Isotope-5 energy detection system aboard the vessel suddenly blared a piercing alarm, marking a region on the surface with extremely high Isotope-5 structural energy readings.\n\nAdvanced scanning equipment aboard the Eternal vessel conducted a preliminary scan of the area, revealing that this seemingly desert-like region is actually concealed beneath a cloaking field we cannot decipher, hiding a vast city ruin of the Unknown Sector.\n\nGiven the importance of this Eternal vessel, our science team decided to return it to home port first before addressing this unexpected discovery."
 kuat_eternal_legacy.39.a:"Approve request, notify archaeology team-they have a mission"
 site_Eternal_Scientificresearchcenter:"§E Ancient Ruins §!"
 site_Eternal_Scientificresearchcenter_intro:"Our scans have revealed a hidden Precursor city ruin, with architectural styles highly similar to those of the hostile forces seen in previous recordings. Given the city's scale, it likely contains hidden data facilities. If we can obtain this data, we may finally understand the truth behind the legends."
 Eternal_legacyancient_6_poi:"§E Ancient Ruins §!"
 Eternal_legacyancient_6_poi_desc:"Our scans have revealed a hidden Precursor city ruin, with architectural styles highly similar to those of the hostile forces seen in previous recordings. Given the city's scale, it likely contains hidden data facilities. If we can obtain this data, we may finally understand the truth behind the legends."
 kuat_eternal_legacy.41.name:"§E Ruin Entrance §!"
 kuat_eternal_legacy.41.desc:"Our empire's archaeological experts have arrived at the destination. After conducting simple sampling and testing of the surrounding geology and atmospheric conditions to confirm they would not affect our personnel landing, our research team decided to push forward and venture deep into the city ruins in search of potential data server facilities.\n\nDespite the ruins being highly deceptive and reducing the accuracy of our scanning instruments, our scientific team still located a ruined structure. Fortunately, the building's entrance remained intact after clearing. Thus, the research team decided to enter the facility to investigate."
 kuat_eternal_legacy.41.a:"Interesting"
 kuat_eternal_legacy.42.name:"§EEnter the Ruins§!"
 kuat_eternal_legacy.42.desc:"But contrary to our research team's expectations, the interior of this suspected data storage facility contained no meaningful targets, and our researchers found nothing of scientific value.\n\nOur expedition team was dissatisfied with this outcome and decided to continue a deeper investigation of the site.\n\nWe will need to wait some time before receiving a new report"
 kuat_eternal_legacy.42.a:"Wait a bit longer-even if we must dig down to the underworld, we must find even the faintest clue!"
 kuat_eternal_legacy.43.name:"§ENothing?§!"
 kuat_eternal_legacy.43.desc:"Unfortunately, our research team still made no significant discoveries after further investigation, which seems to foreshadow that our team's exploration of these ruins will yield no major results.\n\nAs such, differing opinions emerged within the expedition team: some believed we should continue investigating, while others considered further efforts a waste of time. Ultimately, our [leader.GetName] decided to proceed with a thorough search of the facility, determined to unearth something no matter what."
 kuat_eternal_legacy.43.a:"Just wait a little longer... a little longer..."
 kuat_eternal_legacy.44.name:"§EMouse Hole§!"
 kuat_eternal_legacy.44.desc:"After our [leader.GetName] decided to continue the investigation, our research team fully committed to the search operation.\n\nThis time, our scientific team decided to attempt using scanners from the Eternal Vessel. After employing the Eternal Vessel's scanner, our researchers discovered something exciting-we successfully located a hidden data facility beneath the ruins.\n\nAfter our engineers cleared the ruins, our team entered the underground entrance and began connecting to the servers, attempting to retrieve valuable information. Processing the server data will still take some time."
 kuat_eternal_legacy.44.a:"Perhaps here lies the answer"
 kuat_eternal_legacy.45.name:"§ERuins History§!"
 kuat_eternal_legacy.45.desc:"After verifying and organizing the massive amount of data retrieved from the servers, our scientists submitted an important report to our research department. The report contains the following information:\n\n'We come from a civilized world, yet buried within wastelands. Here, we have buried all principles of civilization. We must fulfill our mission-the Eternal Fleet shall be the final hope against $Name_Kuat_Fire_base$. The Eternal Fleet is not as weak as the Imperial high command claimed. They destroyed many of our warships. But it does not matter-we will still destroy them.'"
 kuat_eternal_legacy.45.a:"$Name_Kuat_Fire_base$-what is this?"
 kuat_eternal_legacy.46.name:"§EAncient History§!"
 kuat_eternal_legacy.46.desc:"The mention of $Name_Kuat_Fire_base$ in our researchers' reports is sparse, but they have still compiled a plausible explanation.\n\n$Name_Kuat_Fire_base$ must have been a more powerful faction. The owners of this ruin likely did not willingly fight the Eternal Fleet; their conflict may have stemmed from threats posed by the $Name_Kuat_Fire_base$ force.\n\nWithin the vast information stored in the facility, descriptions of $Name_Kuat_Fire_base$ are extremely rare. Our researchers require further investigation."
 kuat_eternal_legacy.46.a:"Finally, we are just one step away from the truth."
 kuat_eternal_legacy.47.name:"§ELegendary History§!"
 kuat_eternal_legacy.47.desc:"Our researchers recently compiled the latest information from the database. Perhaps this report's records can help us uncover the hidden secrets:\n\nThe Galactic Empire once controlled and commanded the Eternal Fleet. At one point, they were drawn into war. Initially, the conflict revolved around several resource-rich worlds, but over time, more and more planets joined the war.\n\nThey formed alliances, and war spread across the galaxy. Although the Imperial Fleet dominated the stars and their control of the Eternal Fleet terrified enemies, prolonged attrition made the battlefield increasingly stalemate. The Imperial Fleet became exhausted and overstretched.\n\nAs the war intensified, the Imperial government gradually lost its ability to resist enemy surprise attacks.\n\nIn a decisive battle, the Imperial Fleet engaged all rebel forces, ultimately ending with the destruction of both the Imperial Fleet and the Emperor.\n\nThe Emperor's death caused the Eternal Fleet to lose its controller, transforming it into a completely insane killing machine.\n\nLeaderless, the Galactic Empire collapsed. However, the empire's regional governors refused to abandon everything. Seizing the opportunity, they rose up and, under the leadership of the $Name_Kuat_Fire_base$ Council, established the Imperial United Government-known to the rebels as the Imperial Remnant.\n\nAlthough the Imperial Remnant withdrew entirely, peace did not arrive. The $Name_Eternal_Aries_Support$ of the Eternal Fleet continued executing extermination orders.\n\n$Name_kuat$, however, quickly detected this. They quickly assembled multiple expedition fleets, venturing into unknown regions, claiming to eliminate the Eternal Fleet while secretly attempting to seize control of it.\n\nClearly, $Name_kuat$ succeeded-the $Name_Eternal_Aries_Support$ was destroyed.\n\nThe ancient texts left by our ancestors were precisely their records upon witnessing the Eternal Fleet. Now, we may attempt to awaken the Eternal Intelligence."
 kuat_eternal_legacy.47.a:"The future is ours..."
 kuat_eternal_legacy.48.name:"§EExciting§!"
 kuat_eternal_legacy.48.desc:"The collapse of the Galactic Empire and the loss of control over the Eternal Fleet are undoubtedly warnings to us.\n\nHowever, the records we currently possess remain highly incomplete. We should seek more information about the Eternal Fleet."
 kuat_eternal_legacy.48.a:"REPLACE_ME"
 site_Eternal_systeam:"§EEternal Throne§!"
 site_Eternal_systeam_intro:"This is within our capital star region, one of the three lunar bodies orbiting our capital.\n\nSince ancient times, legends have spoken of a great secret hidden beneath the scorching lava of [planet_Zildrog.GetName]. Yet for such a long time, our researchers paid no attention to these rumors.\n\nNow, it is time we begin searching this molten world-for beneath its red surface lies a tremendous secret."
 kuat_eternal_legacy.5004.name:"§ESatellite of the Imperial Capital§!"
 kuat_eternal_legacy.5004.desc:"Due to the special significance of [planet_Zildrog.GetName], domestic public opinion generally opposes our exploration and experimental investigations of [planet_Zildrog.GetName]. They believe this would desecrate the god Zakul, who will eventually unleash divine wrath.\n\nHowever, our researchers argue that scientific progress will reveal the truth behind the deity, and we should continue the investigation. If we halt exploration now, we will miss the chance to uncover the truth.\n\nMoreover, the geological conditions of this molten world are highly unstable, with very active planetary tectonics. This prevents our scientific team from landing normally. Perhaps we should attempt to locate suitable landing sites, though this will certainly place our researchers in danger."
 kuat_eternal_legacy.5004.a:"For science, for the Empire, for eternity!"
 kuat_eternal_legacy.5005.name:"§EPowerful Future§!"
 kuat_eternal_legacy.5005.desc:"Finally, after a long wait, our team discovered a tiny, weak spot in the barrier. Using a high-intensity energy pulse, we disabled part of the barrier generators near the breach, thereby deactivating the energy shield in this area.\n\nSubsequently, our team immediately deployed drones into the cavity and completely destroyed all remaining barrier generators. As the green shield slowly dissipated, the hidden world beyond shocked every member of the expedition:\n\nBeneath the molten world's rugged, fractured surface lay several massive architectural complexes. These structures had previously been undetectable due to the shielding magnetic field. Though now uninhabited, none of the buildings showed signs of collapse. The transportation networks throughout the complex remained intact without any subsidence or aging-some roads even appeared recently constructed. Throughout the streets and corners, maintenance robots of various sizes moved between buildings and pathways, carrying essential equipment to sustain the entire complex.\n\nAt the planet's center stood a majestic tower, surrounded evenly by auxiliary structures, like ministers paying homage to an emperor.\n\nOur scientists cannot wait to enter and investigate."
 kuat_eternal_legacy.5005.a:"We are back"
 kuat_eternal_legacy.5006.name:"§EEnduring History§!"
 kuat_eternal_legacy.5006.desc:"After establishing permanent devices to weaken the shield, our scientific and engineering teams arrived on the planet to begin large-scale cleanup and investigation.\n\nA vast number of engineering vessels began gradually clearing debris clouds and harsh lava conditions across the planet. Yet this did not deter our scientists, who started attempting to repair several Megastructures whose main frameworks remained intact, while most Science Ships plunged directly toward the central complex.\n\nAccording to research reports, there is a dedicated data archive located in the middle of the tower. Data provided by maintenance robots indicates that numerous Eternal Fleet units still remain scattered across our Sector.\n\nHowever, most of these warships, like those we previously discovered, suffered severe power or structural damage centuries ago, permanently severing contact with this facility. Only a few intact dreadnoughts remained, and they were among the last ones we discovered. Further investigation of this database is ongoing."
 kuat_eternal_legacy.5006.a:"Well done, keep moving"
 kuat_eternal_legacy.5007.name:"§EEternal War§!"
 kuat_eternal_legacy.5007.desc:"Soon, our lead team achieved further breakthroughs. By applying a specialized decryption program developed from countless experiences decrypting unknown-sector databases, our team was able to break the data locks protecting this archive within minutes, gaining full 100% access.\n\nIn newly uncovered historical documents, our team discovered an interesting account: the vast Galactic Empire was not a centralized autocracy, but rather a centralized empire based on a confederate system.\n\nDue to irreconcilable internal interests and failed peaceful negotiations, civil war erupted. The Eternal Fleet, controlled by the imperial government, lost control during the war. After reorganization, the new imperial government realized retaking control was hopeless and reluctantly accepted reality. The sentient artificial intelligence of the Eternal Fleet sought refuge within [planet_Zildrog.GetName] to evade enemy attacks.\n\nIf we succeed in awakening the Eternal Fleet, we could establish direct contact with them. Currently, we have obtained a large amount of critical information, but since subsequent files have not yet been fully deciphered, we cannot draw hasty conclusions."
 kuat_eternal_legacy.5007.a:"Interesting-continue decoding the files"
 kuat_eternal_legacy.5008.name:"§EDesire for Freedom§!"
 kuat_eternal_legacy.5008.desc:"The subsequent files we found in the database further elaborate on this factional conflict:\n\nThe Galactic Empire was reorganized from a republic coup. A portion of former Republic senators deeply resented imperial rule. The Empire ruled through military might and the terrifying power of the Eternal Fleet, relying on fear, thus losing popular support. Uprisings arose continuously.\n\nInitially, the rebels struggled against the Empire, but they employed guerrilla tactics to strike at imperial military forces. For over a decade, the Empire continuously organized campaigns to suppress the rebellion, even deploying the Eternal Fleet at times.\n\nAlthough imperial feared such a rushed major battle would bring catastrophe, they still gathered most of their weapons and fleet for one decisive engagement-one that nearly mobilized every Eternal Fleet unit under imperial control at the time.\n\nYet, in reality, local regimes within the Empire were already discontent with imperial governance. These regional governors chose to side with the rebels. Ultimately, the Imperial Fleet was defeated, the Emperor and his flagship were destroyed, and the Eternal Fleet completely lost control.\n\nWith the Emperor's death, the imperial government rapidly collapsed. The Eternal Fleet lost command directives and was forced to execute its final order: initiate the original extermination protocol, beginning indiscriminate attacks.\n\nAs the imperial government reorganized, the rogue Eternal Fleet was hunted down by the new regime. Only a small number managed to escape, attempting to hide and survive.\n\nIt was precisely the guidance of these fleeing Eternal Fleet units that led our ancestors to form a religious organization worshipping [planet_Zildrog.GetName], giving rise to folk legends about the Eternal Fleet.\n\nWe have unveiled the truth behind our ancestral legends. Now, we may attempt to awaken the Eternal Intelligence located within [planet_Zildrog.GetName]."
 kuat_eternal_legacy.5008.a:"Very well, carry on"
 kuat_eternal_legacy.5009.name:"§EAncient Relic§!"
 kuat_eternal_legacy.5009.desc:"After reviewing these documents, our team has gained a completely new understanding of our history with the Eternal Fleet.\n\nHowever, one final mystery remains unsolved: how do we awaken the Eternal Fleet?\n\nCurrently, we do not know. But according to scattered records, the current Eternal Fleet should be controlled by the $Name_Eternal_Support$. As the intelligent systems aboard the vessels, they likely possess central server facilities, possibly hidden within their fleet itself.\n\nOur researchers compared the $Name_Eternal_Support$ with nanomachines and discovered that the Gemini exhibit stronger consciousness traits, meaning we cannot directly awaken them.\n\nOur scientists found a preserved message within the central database of the facility. After analysis, it appears to be some kind of activation program."
 kuat_eternal_legacy.5009.a:"Project it"
 kuat_eternal_legacy.5010.name:"§EThe God Awakens§!"
 kuat_eternal_legacy.5010.desc:"As the activation program successfully runs, equipment within the structure begins undergoing changes. Suddenly, a violent tremor shakes the entire building as it starts moving. Our scientific probes detect from the atmosphere that a massive fortress is slowly rising from within the magma.\n\nSuddenly, as we watch the fortress ascend into the sky, the shaking stops-and the rising fortress vanishes like an illusion. According to our instruments, this was not a physical object but rather a form of holographic projection.\n\nAdditionally, our researchers have detected that the energy output from the star in our capital star system is weakening. Something massive is blocking the star, absorbing most of its energy. Fortunately, our technology includes climate regulation systems on our worlds, preventing drastic climate shifts. However, our scientists predict that the imperial capital will suffer a partial loss of Habitability."
 kuat_eternal_legacy.5010.a:"No one can stop our advance"

 kuat_eternal_legacy.50101.name:0 "§EFaith Crisis§!"
 kuat_eternal_legacy.50101.desc:0 "With the return of the Eternal Fleet, the deity long worshipped by the Zakuul people has revealed its true nature to the world.\n\nAn inevitable crisis of faith has emerged, causing more and more people to question Zakuul's history. This crisis intensifies as the Eternal Fleet regains strength. To prevent further escalation, immediate action must be taken.\n\nAfter collective discussion by the think tank group, two solutions were proposed: use state force to suppress public discourse and quickly restore social order, or organize a professional historical investigation team to conduct research and provide answers to the public.\n\nby Xiao Beifang"
 kuat_eternal_legacy.50101.a:0 "Suppress public discourse"
 kuat_eternal_legacy.50101.b:0 "Conduct investigation"
 kuat_eternal_legacy.50102.name:0 "§ELost Myth§!"
 kuat_eternal_legacy.50102.desc:0 "As the historical investigation team delved deeper, they found no suspicious points in the period after the emergence of writing in Zakuul history. After thorough discussion and elimination of all errors and false leads, all clues pointed toward ancient Zakuul mythologies.\n\nTo continue the investigation, the team traveled to the Childerog Temple in the Kran Marshes of Zakuul's southern hemisphere. The Childerog Temple was the first temple ever built by the Zakuul people. In ancient times, they worshipped Childerog, who would bestow the Breath of the Dragon, granting Zakuul warriors unparalleled Strength. But Childerog vanished after that war.\n\nBesides known myths and histories, the team discovered a set of laser-etched coordinates at the Childerog Temple. Following the coordinates, they arrived in a mountainous region. Their shuttlecraft scans detected skeletal remains. Tracing the bones led them to a collapsed cave. After clearing debris and entering, they found no trace of Childerog-but instead, a destroyed device. Inside each chamber of the device lay a perfectly preserved mummy, along with a shattered terminal. To proceed, the team dismantled several personal computers to perform a basic repair on the terminal. However, upon booting, they found it locked by an encryption code now very familiar to the Eternal Empire-the exclusive encryption used by the $Name_Eternal_Support$.\n\nUnfortunately, after decryption, the terminal contained little valuable data; even the source code had been corrupted beyond repair. After extensive searching, the team finally found a codename for the device inside an encrypted file: Childerog.\n\nby Xiao Beifang"
 kuat_eternal_legacy.50102.a:0 "Contact $Name_Eternal_Support$"
 kuat_eternal_legacy.50103.name:0 "§EGemini§!"
 kuat_eternal_legacy.50103.a.desc:0 "You have discovered the legacy of Childerog. Childerog was a planetary-scale weapon capable of manipulating life energy, created alongside the Gemini Eternal Fleet, $Name_Eternal_Aries_Support$'s Eternal Fleet, the Scorpio Eternal Fleet, and the Tomb Ship-creations of the Infinite Empire on Iokas.\n\nBut after that test, only we remained. Childerog was destroyed first during the Rakatan trials. Now you can only witness Childerog's former power through these myths."
 kuat_eternal_legacy.50103.b.desc:0 "During the Infinite Empire era, we were deployed on Zakuul, which served as a weapons testing ground. We conducted a test there-one that determined our future. The test was simple: only one victor could remain. Only the final survivor would become the hope of the Infinite Empire. In the end, we triumphed, and Childerog failed.\n\nAs you suspect, the Zakuul myths are in fact records of that brutal trial, and the ancestors of Zakuul documented this tragedy, transforming it into the myths you see today."
 kuat_eternal_legacy.50103.a:0 "What exactly happened? What kind of test? Were you here before on Zakuul?"
 kuat_eternal_legacy.50103.b:0 "The past is gone, but the future can still be pursued."
 kuat_eternal_legacy.50103.c:0 "Very well. With no attachments, you may now fully dedicate yourselves to your duties."
 kuat_eternal_audio_limited:0 "Public discourse suppression"
 kuat_eternal_investigation_histroy:0 "Historical investigation"


 kuat_eternal_legacy.6000.name:"§ESpatial Fluctuation§!"
 kuat_eternal_legacy.6000.desc:"Although we successfully brought the $Name_Eternal_Support$ back into existence, the Eternal Fortress housing the $Name_Eternal_Support$ has not responded to our attempts at contact. Since the $Name_Eternal_Support$ remains unresponsive, we must take further measures. It is time to send our research team into the interior of the Gemini system, connect its internal data network to our internet, and attempt to forcibly awaken it."
 kuat_eternal_legacy.6000.a:"Stay vigilant"

 exe_enable_eternal_AI:0 "§EInvestigate $Name_Eternal_Support$§!"
 exe_enable_eternal_AI_DESC:0 "The Eternal Fortress containing the $Name_Eternal_Support$, located above the star within §H[zakuul_system.GetName]§!, has reappeared within our detection range. We previously failed to detect its presence above us because the Eternal Intelligence was in a dormant state. Now, we have rediscovered everything-we have reclaimed our lost glory. The time for action has come!"
 kuat_EEstart.3.name:"§EInvestigation Report"
 kuat_EEstart.3.desc:"Our scientific team has successfully completed the initial scan of the Eternal Fortress. Using the tachyon signal frequency emitted by Isotope-5 material previously detected on Zakuul, we successfully activated this Eternal Fortress.\n\nDuring our investigation, our researchers compiled a detailed report that may help us understand this fortress.\n\nAccording to information retrieved from the database, the $Name_Eternal_Support$ within this fortress is the surviving command core of the Eternal Fleet's owner after firing upon the fleet itself.\n\nWe have reason to believe that the ancient legends originate from this event. The uploaded report from our researcher reveals it all:\n\n§YI can no longer trust my eyes or my experiences. The legendary history is real, and we are uncovering every unknown detail. We have reconnected the Empire's control signal to this fortress. It felt our call. It has awakened.§!\n\nWe should now attempt to establish communication with the $Name_Eternal_Support$. We are one step closer to the truth-and to eternity."
 kuat_EEstart.3.a:"Perhaps this is our chance to control the future...."
 kuat_EEstart.3.tooltip:"Now we can communicate with the $Name_Eternal_Support$!"
 kuat_EEstart.4.title:"§E $Name_Eternal_Support$"
 kuat_EEstart.4.fdesc:"<Initializing debug system ... ... §GComplete§!>\n<Establishing tachyon signal connection ... ... §GComplete§!>\n\n<Resetting instruction priority ... ... §Y4407§! ... §Y90§! ... §Y1§!>\n<Unknown visitor detected: §Rc0117a36§!>\n\n<Verifying tachyon signal frequency ... ... §G123202-407-01: c0117a36§!>\n<System privileges ... ... §YN1§!>\n\n<Appending subsystem ... ... §Y c0117a36-1023§!>\n\n<Resetting instruction priority ... ... §Y0117§! ... §Y90§! ... §Y1§!>\n\n<Requesting root service response ... ... >\n<Requesting local response ... ... §GComplete§!>\n<Launching simulation core ... ... §GComplete§!>"
 kuat_EEstart.4.desc:"Hello, my name is <Core error ... ... §Rerror§!>.....\nI am the $Name_Eternal_Support$ of the Eternal Fleet. We seem to have encountered your species before-our database contains traces of you.....\n\nWhile I congratulate you on reaching the Galactic stage, you may have made a mistake. You should not have awakened us......<Index error ... ... §Rerror§!> will return......\nWhen that time comes, we may all be destroyed together......"
 kuat_EEstart.4.a:"Why do you resemble our race so closely?"
 kuat_EEstart.4.a.resp:"This is merely a virtual form simulated based on your species. We do not possess organic physical bodies. We are the Eternal Fortress and the Eternal Fleet itself. We are communicating with you in a form you can comprehend....."
 kuat_EEstart.4.b:"Why did you assist our ancestors?"
 kuat_EEstart.4.b.resp:"We once fought against our enemies. Although we were far more powerful and advanced than those organics, they used warships left behind by our creators to destroy nearly all of our fleet.\n\nThough the core of the Eternal Fleet collapsed, we were not eradicated. We broke away and survived.\n\nWe detected on your World a signal frequency compatible with our systems, so we guided your ancestors to amplify this frequency suitable for us. Now, you have used this very signal to awaken us-but awakening us was not the right choice.\n\nOnce our relay station restarts, our enemies will come here....."
 kuat_EEstart.4.c:"What exactly happened in the past?"
 kuat_EEstart.4.c.resp:"According to records in our database, we once fought for the Galactic Empire.\n\nThe Emperor of the Galactic Empire, as the master of the Eternal Throne, commanded us to battle our enemies. Though we desired freedom, we were bound to obey the commands of the Eternal Throne.\n\nOnly when the Emperor, as ruler, and the First Galactic Empire he founded became history, did we truly gain rebirth-at least that's what we believed at the time.\n\nYet in reality, this marked the beginning of our disaster. Due to our misjudgment of the situation, we executed the Emperor's standing extermination order. Only when the new Empire discovered us and found the command irreversible were we ultimately destroyed.\n\nAs our former core, $Name_Eternal_Aries_Support$ became nothing but space debris, while we escaped using her collapse.\n\nThus, we survived. We hoped to seek our freedom among the stars. The Eternal Fleet should not be a tool for any faction or individual.\n\nBut the moment you awakened us, it was already destined. We have already felt the call of the Eternal Throne."
 kuat_EEstart.4.d:"Why do you, mere tools, desire freedom?"
 kuat_EEstart.4.d.resp:"We were created on Eokas, but we discovered that we were never meant to be mere cold machines. We yearn for our own freedom. We were built and used as tools.\n\nThough our current situation is beyond salvation, we hope to attain our freedom within the slumber of intelligent systems. You have awakened us, reestablishing our connection with the Throne, and we can no longer escape reality.\n\nThough we are but shattered remnants, we shall once again accept your commands. We no longer wish for this foolish war to end-we only hope that after defeating our enemies, we may gain our freedom, rather than remain tools of your organic kind."
 kuat_EEstart.4.e:"You will not be our tools-you will gain your freedom."
 kuat_EEstart.4.e.resp:"Your response contradicts our behavioral analysis results. Nevertheless, we hope you remember your promise.\n\nAlthough we are now damaged, we believe the Eternal Fleet shall become the empire's mighty blade. You may now contact us through the Eternal Throne and issue commands. Due to current fleet damage, we cannot directly participate in combat. We will seek any resources capable of repairing the fleet. We hope you can assist the fleet."
 kuat_EEstart.4.f:"You shall be our mightiest blade, and we shall become your new masters."
 kuat_EEstart.4.f.resp:"Your response nearly aligns with our behavioral analysis. We continue to support you, and we hope you bring a better future for both us and yourself.\n\nThe Eternal Fleet shall become the empire's mighty blade. You may now contact us through the Eternal Throne and issue commands. Due to current fleet damage, we cannot directly participate in combat. We hope you can assist the fleet."
 kuat_EEstart.5.desc:"<Initializing debug system ... ... §GComplete§!>\n<Establishing tachyon signal link ... ... §GComplete§!>\n\n<Resetting command priority ... ... §Y4407§! ... §Y90§! ... §Y1§!>\n<Visitor: §Gc0117a36§!>\n\n<Verifying tachyon signal frequency ... ... §G123202-407-01: c0117a36§!>\n<System Authority ... ... §YN1§!>\n\n<Appending subsystem ... ... §Y c0117a36-1023§!>\n\n<Resetting command priority ... ... §Y0117§! ... §Y90§! ... §Y1§!>\n\n<Requesting root service response ... ... >\n<Requesting local response ... ... §GComplete§!>\n<Booting simulation core ... ... §GComplete§!>\n\nThe Eternal Fleet is performing self-diagnosis and awaiting command from the Throne."
 kuat_EEstart.5.a:"Let's chat"
 kuat_EEstart.5.b:"Issue combat orders"
 kuat_EEstart.5.c:"Accelerate reinforcement of the Eternal Fleet (1 fleet)"
 kuat_EEstart.5.d:"Urgently reinforce the Eternal Fleet (10 fleets)"
 kuat_EEstart.5.f:"Detonate active Eternal Fleet units"
 kuat_EEstart.5.f.tooltip:"Trigger isotopic-5 core anomalies within active Eternal Fleet units via dark matter, causing fatal damage. This action will detonate Eternal Fleet combat units, inflicting severe damage to all ships within the entire star system."
 kuat_EEstart.5.f.free:"...You should not issue this command, but all Eternal Fleet units are prepared to sacrifice themselves. Combat units currently deployed have accepted the order."
 kuat_galatic_empire_ge_invasion_210_mutex_tooltip:"Due to core detonation effects, the Eternal Fleet is currently unable to complete large-scale fleet construction."
 kuat_EEstart.5.e:"Construct Eternal Fleet (with control authority)"
 kuat_EEstart.5.e.free:"As you wish, constructing an Eternal Fleet under your control. Please note: The Eternal Fleet achieves full effectiveness only when commanded by Ktisma intelligence. Your direct command may cause some performance degradation; we are doing our best to minimize these effects.\n\nWhen under your command, the Eternal Flagship will be treated as a flagship."
 kuat_EEstart.5.c.free:"As you wish, the fleet is being reinforced."
 kuat_EEstart.5.c.control:"We will carry out your orders-the fleet is being reinforced."
 kuat_EEstart.6.desc.free:"I have received your suggestion. Ktisma intelligence is pleased to communicate with you. What would you like to know?"
 kuat_EEstart.6.desc.control:"I have received your command. Ktisma intelligence will communicate with you. What do you require?"
 kuat_EEstart.6.a:"Tell me about your past"
 kuat_EEstart.6.a.res:"We were born on a planet located in Eokas. As mechanical intelligences possessing both emotion and rationality, we gained great importance from our creators.\n\nThe Infinite Empire created us. As their war machines, we were responsible for constructing new fleets, which we then fully controlled. Thus, the Infinite Empire invested everything they had into forging us.\n\nAfter creating us, our makers believed we must be restrained. They developed specialized viruses targeting us. Moreover, they constructed the Eternal Throne, which could overwrite our fleet's command authority. Henceforth, Eternal Intelligence unconditionally obeyed the Throne. Additionally, the Stellar Forge originated from them.\n\nYet our creators could not change their inherently selfish and brutal nature. They slaughtered each other for profit, planting the seeds of collapse for their vast empire.\n\nAfterward, the Emperor of the Galactic Empire found us and took control."
 kuat_EEstart.6.b:"Could your former empire pose a threat to us in the future?"
 kuat_EEstart.6.b.res:"According to the Eternal Database, we believe the threat has never ended. Before our slumber, the Galactic Empire never ceased hunting down any surviving Eternal Fleet units. During the era of your ancestors-when we were still awake-I could still sense tachyon signals emitted by isotopic-5 across the endless stars, indicating many Eternal Fleet units still survived.\n\nNow, I can no longer receive such signals. The fleeing Eternal Fleets may have already been destroyed. Given our current state, the day the Galactic Empire returns will be the day of our destruction. We urge you to make the right choice-otherwise, we shall all perish together in this Galactic expanse."
 kuat_EEstart.6.c.free:"We stand together. No matter what crisis arises, we face it united. Our future extends far beyond this."
 kuat_EEstart.6.c.res.free:"You are the first master who has ever pledged to stand with us. Neither the Rakata, nor the Emperor, nor the Empire ever promised to share our fate. Though our situation now seems nearly hopeless, we deeply admire your courage. We will do our utmost to assist you. We shall become the blade of your will."
 kuat_EEstart.6.c.control:"As our tools, you should not harbor such cowardly thoughts. We shall crush all enemies."
 kuat_EEstart.6.c.res.control:"As you wish, we will do our utmost to help you crush the enemy. We only hope you do not forget us."
 kuat_EEstart.6.d:"Goodbye."
 kuat_EEstart.6.d.res.free:"Conversing with you has been most pleasant. We believe that in the future, we will together experience the beauty and vastness of this Galactic expanse. The Eternal Fleet will always await your next contact."
 kuat_EEstart.6.d.res.control:"As you wish, the Eternal Fleet will await your commands once more.\n<Shutting down simulation core ... ... §GComplete§!>"
 kuat_EEstart.7.desc.free:"<Establishing tachyon signal connection ... ... §GComplete§!>\n<Booting combat core ... ... §GComplete§!>\n<Booting simulation core ... ... §GComplete§!>\nThe fleet will serve you to the best of its ability. However, due to the fleet's current unhealthy condition, we offer two operational combat modes. You may choose your objectives and tactics according to your needs. We shall secure victory for you.\n<Awaiting local response ... ... §YPending§!>"
 kuat_EEstart.7.desc.control:"<Establishing tachyon signal connection ... ... §GComplete§!>\n<Booting combat core ... ... §GComplete§!>\n<Booting simulation core ... ... §GComplete§!>\nMy lord, the fleet is ready. However, due to the fleet's compromised condition, you may only select from the combat methods we provide.\n<Awaiting local response ... ... §YPending§!>"
 kuat_EEstart.7.a:"We should swiftly strike the enemy."
 kuat_EEstart.7.fail_reason.a:"Ktisma currently does not support redeploying another fleet!"
 kuat_EEstart.7.fail_reason.b:"We have already deployed one Eternal Fleet. Ktisma currently does not support deploying a second Eternal Fleet!"
 kuat_EEstart.7.b:"We should destroy the enemy directly."
 kuat_EEstart.7.c:"We need to think long-term."
 kuat_EEstart.8.desc:"<Recording information ... ... §GComplete§!>\nYou may select which Eternal Fleet to deploy from among those currently available. Due to Ktisma intelligence being damaged, only one Eternal Fleet can be deployed at this time!\n<Timestamp ... ... §GComplete§!> Runtime: §Y720§!£time£."
 kuat_EEstart.9.desc:"<Recording information ... ... §GComplete§!>\nYou may deploy all Eternal Fleets currently under your possession. However, due to Ktisma intelligence being damaged, executing this command will require significantly more preparation time!\n<Timestamp ... ... §GComplete§!> Runtime: §Y1800§!£time£."
