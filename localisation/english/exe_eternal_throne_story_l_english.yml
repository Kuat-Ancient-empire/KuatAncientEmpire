 kuat_galatic_empire_ge_invasion_chain:"§E The Return of Kuat §!"
 kuat_galatic_empire_ge_invasion_chain_title:"§E The Return of Kuat §!"
 kuat_galatic_empire_ge_invasion_chain_desc:"Since the last destruction of the $Name_Eternal_Support$, $Name_kuat$ believed they had completely eradicated the Eternal Fleet and thus ceased interfering in our affairs. However, the Eternal Fleet still exists. Our previous attack on $Name_Kuat_Fire_base$ and reactivation of the Gateway drew the attention of $Name_kuat$'s detectors. Now they have discovered a critical flaw in their operations. They will restart this war until the $Name_Eternal_Support$ is fully destroyed or they are completely driven away."
 kuat_galatic_empire_ge_invasion_portal:"§Y Active Jump Gateway §!"
 kuat_galatic_empire_ge_invasion_planet_destroyed:"§R Destroyed World §!"
 kuat_galatic_empire_ge_invasion_ship_kill_by_us:"§G Ships we destroyed §!"
 kuat_galatic_empire_ge_invasion_ship_kill_by_other:"§G Ships destroyed by others §!"
