 building_eternal_pop_assembly:0 "§E Eternal Assembly Plant §!"
 building_eternal_pop_assembly_desc:0 "The Eternal Assembly Plant will continuously assemble robots and clones for the Eternal Empire."

 building_eternal_pop_assembly_organic_assembly:0 "The Eternal Assembly Plant employs a new planetary Pop assembly model: when vacant jobs or Pop count is below 50, population growth is calculated based on available housing; when surplus Pops or vacant jobs exceed 50, growth is calculated based on job vacancies.\n\nAssembly speed formula: Assembly Speed = max (number of World districts * 3, available housing)\n\nBase assembly starts at 1, increasing by 1 for every additional 45 Pops, up to a maximum of 5"

