 kuat_rakata_invasion_chain:"§E Rebirth of the Infinite Empire §!"
 kuat_rakata_invasion_chain_title:"§E Rebirth of the Infinite Empire §!"
 kuat_rakata_invasion_chain_desc:"These long-buried spirits of the past deceived and tempted us into bringing them back into the light. But the awakened Rakata do not thank us for our grace-they instead press further with shameless demands.\n\nThe ancient Rakata were warmongering and extremely brutal. Now they must atone for their past crimes. The reborn Rakata once again call themselves the Infinite Empire, yearning to reclaim everything that was theirs. They demand the destruction of the Eternal Fleet-creations of their own-and the end of its future."
 kuat_rakata_invastor_kills_us:"§G Infinite Empire ships eliminated by our forces §!"
 kuat_rakata_invastor_kills_others:"§G Infinite Empire ships eliminated by other powers §!"
 kuat_rakata_invastor_victims:"§R Ships destroyed by the Infinite Empire §!"
 kuat_rakata_invastor_planets:"§R Worlds destroyed by the Infinite Empire §!"

 Kuat_Rakata_invasion_1_poi:"§E First Operational Base §!"
 Kuat_Rakata_invasion_1_poi_desc:"In the [Kuat_Rakata_first_warp_portal_system.GetName] system, the Infinite Empire's operational base is continuously producing unique fleets of the Infinite Empire. If we do not destroy their base, these reinforcements will bring us great trouble."
 Kuat_Rakata_invasion_2_poi:"§E Second Operational Base §!"
 Kuat_Rakata_invasion_2_poi_desc:"In the [Kuat_Rakata_second_warp_portal_system.GetName] system, the Infinite Empire's operational base is continuously producing unique fleets of the Infinite Empire. If we do not destroy their base, these reinforcements will bring us great trouble."
 Kuat_Rakata_invasion_3_poi:"§E Third Operational Base §!"
 Kuat_Rakata_invasion_3_poi_desc:"In the [Kuat_Rakata_third_warp_portal_system.GetName] system, the Infinite Empire's operational base is continuously producing unique fleets of the Infinite Empire. If we do not destroy their base, these reinforcements will bring us great trouble."
 Kuat_Rakata_invasion_4_poi:0 "§EInfinite Foundry§!"
 Kuat_Rakata_invasion_4_poi_desc:0 "In the [Kuat_Rakata_total_warp_portal_system.GetName] system, the Infinite Empire has established a massive fleet construction facility. This facility is expanding the military strength of the Infinite Empire at an alarming rate. If we do not destroy or seize the Infinite Assembly Yard, these reinforcement fleets will bring us great trouble.\n\nOur researchers speculate that this facility will supply reinforcements to all operational bases of the Infinite Empire."


 kuat_galatic_empire_ge_invasion_secondary_portal_poi:"§EJump Gateway§!"
 kuat_galatic_empire_ge_invasion_secondary_portal_poi_desc:"Jump Gateways are special Star travel devices created by $Name_kuat$ through their research on Isotope-5 elements from the Eternal Fleet. They can rapidly deploy military forces through these Gateways. If we wish to defeat them, we must destroy the Jump Gateways!"
 
 ### 特殊计划 ###

 kuat_galatic_empire_e_area_arc_site_project:"§E Repair $Name_Eternal_Support$ §!"
 kuat_galatic_empire_e_area_arc_site_project_DESC:"Based on research data left behind by the Endoria Empire found in ancient ruins, our scientists have deepened their understanding of Isotope-5. We can now attempt to directly complete the functional restoration of our $Name_Eternal_Support$. If we can fully repair the $Name_Eternal_Support$, we will possess a complete and powerful automated fleet."

 kuat_galatic_empire_e_area_gateway_project:"§ERepair Jump Gateway§!"
 kuat_galatic_empire_e_area_gateway_project_DESC:"Based on research data left behind by the Endoria Empire found in ancient ruins, our scientists have deepened their understanding of Isotope-5. We can now attempt to directly repair the Jump Gateway. Once completed, we will have a Gateway capable of reaching any Sector."

 kuat_galatic_empire_end_ge_invasion_project:"§E Transmit Tachyon Signal §!"
 kuat_galatic_empire_end_ge_invasion_project_DESC:"We have defeated most of the fleets from [Kuat_Galatic_Empire_invasion_country.GetName]. The Isotope-5 signals we've collected are sufficient to attempt closing the gateway from [Kuat_Galatic_Empire_invasion_country.GetName] to our Sector. We can transmit this signal via tachyons to trigger a Glitch in the Jump Gateway, forcing it to shut down its transit channel. We may now attempt this operation."

 kuat_galatic_empire_ge_invasion_reward_project:"§E Analyze Imperial Ship §!"
 kuat_galatic_empire_ge_invasion_reward_project_DESC:"Based on accumulated research from the wreckage of $Name_kuat$ vessels, we can now concentrate most of the Empire's scientific personnel to attempt reverse-engineering $Name_kuat$ ship designs and data technologies. Once successful, we will master most Kuat technologies, and our dominance will become unshakable."

 rakata_invasion_infinite_reward_project:"§E Analyze Infinite Empire Data §!"
 rakata_invasion_infinite_reward_project_DESC:"Using the data analysis capabilities of the $Name_Eternal_Support$, we can analyze the wreckage of Infinite Empire ships and attempt to obtain high-value information regarding the separation of the Gemini. If we successfully complete this project, we may leverage characteristics of Infinite Empire vessels to achieve a safe transfer of the $Name_Eternal_Support$."

 rakata_invasion_eternal_reward_project:"§E Analyze Gemini Legacy Data §!"
 rakata_invasion_eternal_reward_project_DESC:"The Eternal Fleet has ultimately departed from us, and we are unable to repair them. However, they have left behind a vast amount of critical data. According to information preserved by the $Name_Eternal_Support$, these findings represent invaluable starship design records accumulated over tens of thousands of years within the Eternal Fleet's database. If we can successfully decode this data, we may be able to restore the glory of the Eternal Fleet."

 eternal_reroll_endedA_rountine:"§EReconstructing Gemini Control Unit§!"
 eternal_reroll_endedA_rountine_DESC:"Our $Name_Eternal_Support$ has miraculously discovered a method to reconstruct the control unit. Now we must commit manpower and resources to complete this project."
 
 ### 事件 ###
 kuat_galatic_empire_ge_invasion.100.title:"Communication Request"
 kuat_galatic_empire_ge_invasion.100.desc:"<Initializing simulation core... §GComplete§!>\nI didn't expect you would actually find this system. This was once the fortress and military-administrative center of a glorious civilization. I assume you know what that means. The Endordia Empire obtained some of our data after fighting us and began conducting secret research at their capital. They thought they could hide it from everyone, but unexpectedly found remnants of our kind-and now the facility is under the supervision of $Name_Kuat_Fire_base$. How ironic.<Shutting down simulation core... §GComplete§!>"
 kuat_galatic_empire_ge_invasion.100.a:"Is Sector E their capital?"
 kuat_galatic_empire_ge_invasion.100.a.resp:"<Retrieving database information... §GComplete§!>\nYes, indeed. This was their capital. As I mentioned earlier, they conducted secret research on us here. Sadly, they couldn't escape fate's pursuit. I hope you don't meet the same end here."
 kuat_galatic_empire_ge_invasion.100.c:"What is $Name_Kuat_Fire_base$?"
 kuat_galatic_empire_ge_invasion.100.c.resp:"<Retrieving database information... §GComplete§!>\n$Name_Kuat_Fire_base$ is a third-party organization originating from within the Galactic Empire's territory. They possess powerful warships and a unique arbitration negotiation system, along with extensive connections. They seal away most facilities deemed dangerous by the Empire and also mediate conflicts between the Empire and native species. Once, the Emperor ordered us to fire upon them to test our fleet strength. Unfortunately, we failed to completely defeat them-their fleets were extremely numerous. Perhaps because your sector is relatively remote, such large fleets aren't present here. But still, I advise you not to let your guard down."
 kuat_galatic_empire_ge_invasion.100.e:"We fear no one and no power."
 kuat_galatic_empire_ge_invasion.100.e.resp:"<Retrieving database information... §GComplete§!>\nUnderstood. I hope you remain vigilant-there may be something crucial here for repairing us."

 kuat_galatic_empire_ge_invasion.102.name:"§EAnomalous Signal§!"
 kuat_galatic_empire_ge_invasion.102.desc:"With assistance from the $Name_Eternal_Support$, Imperial research divisions intercepted a strange signal frequency. This signal exhibits irregular frequency characteristics unlike anything we've previously encountered. In-depth analysis revealed that the signal originates from a star system never before charted on our stellar maps-meaning we have discovered a new star system. Researchers believe this will become a milestone in deep space exploration. They urge immediate investigation of this system."
 kuat_galatic_empire_ge_invasion.102.a:"Good."

 kuat_galatic_empire_ge_invasion.103.name:"§EAnomalous Signal§!"
 kuat_galatic_empire_ge_invasion.103.desc:"Our research division has confirmed the existence of a previously unknown star system. The Imperial Science Department views this as a testament to our technological advancement."
 kuat_galatic_empire_ge_invasion.103.a:"Good."

 kuat_galatic_empire_ge_invasion.110.name:"§EAnomalous System§!"
 kuat_galatic_empire_ge_invasion.110.desc:"§H[Root.GetName]§! has entered a bizarre region after traversing the hyperspace corridor. The entire §H[From.GetName]§! contains no normal stars and is littered with wreckage of various starships.\n\nAt the center of §H[From.GetName]§!, §H[Root.GetName]§! detected an artificial gravity well radiating over 600 AU, likely originating from a massive damaged Gateway structure at the heart of the former star. Surrounding this central megastructure are numerous peculiar ruined rings, all heavily destroyed, with none appearing capable of functional operation. Additionally, researchers have detected large numbers of unidentified fleets belonging to unknown factions throughout the system. The widespread debris suggests these unknown forces may possess formidable strength.\n\nWe should decide how to approach these fleets."
 kuat_galatic_empire_ge_invasion.110.a:"Send communication request"
 kuat_galatic_empire_ge_invasion.110.b:"Just destroy them"

 kuat_galatic_empire_ge_invasion.111.name:"$Name_Kuat_Fire_base$"
 kuat_galatic_empire_ge_invasion.111.desc:"Hello, outsiders. It's a pleasure to meet you. We are $Name_Kuat_Fire_base$. Our duty is to protect this facility. Due to its extreme danger, we request that you leave this system immediately and never enter the firing range of our defensive fleet. While we'd enjoy further conversation, clearly we lack that opportunity. We ask that you respect our mission."
 kuat_galatic_empire_ge_invasion.111.a:"What is $Name_Kuat_Fire_base$?"
 kuat_galatic_empire_ge_invasion.111.b:"What exactly is this facility?"
 kuat_galatic_empire_ge_invasion.111.c:"What is your relationship with the Endordia Empire?"
 kuat_galatic_empire_ge_invasion.111.d:"We expect you not to obstruct our operations."
 kuat_galatic_empire_ge_invasion.111.a.response:"We are not 'things'-we are $Name_Kuat_Fire_base$. We are dedicated to sealing away potential galactic threats. This damaged Gateway originated from both the Endordia Empire and $Name_kuat$. We reached an agreement with both parties: after the destruction of the Eternal Fleet, we would seal this fortress and Gateway to prevent any attempts at launching full-scale invasions through it."
 kuat_galatic_empire_ge_invasion.111.b.response:"This is a $Name_kuat$ jump Gateway, yet not entirely theirs. It is a special Gateway-not only linking our Sector to $Name_kuat$'s domain, but also connecting a legacy of hatred and war. Utilizing the rare isotope-5 element, this Gateway possesses capabilities far beyond standard jump Gateways. It allows users to reach any destination they desire, nearly undetectable by sensors."
 kuat_galatic_empire_ge_invasion.111.c.response:"The Endordia Empire? How many ages have passed. Though our archives no longer retain extensive client records, the Endordia Empire remains documented in our highest vaults. This facility was once the center of their civilization-the pinnacle of their glory, and also where they burned themselves through reckless ambition.\n\nThey attempted to replicate a $Name_kuat$ jump Gateway using stolen technology and isotope-5. Such a facility would grant them the ability to attack anyone, anywhere, at any time. Astonishingly, they succeeded and built this installation. This act was seen as betrayal by $Name_kuat$.\n\nUltimately, the Endordia Empire was eradicated by $Name_kuat$. Under their surrender terms, we sealed this facility to prevent misuse by malicious actors.\n\nWe require your immediate departure from this system within thirty days and forbid any future re-entry. Otherwise, our fleet will treat you as invaders."
 kuat_galatic_empire_ge_invasion.111.d.response:"Greed only invites destruction."

 kuat_galatic_empire_ge_invasion.112.name:"$Name_Kuat_Fire_base$"
 kuat_galatic_empire_ge_invasion.112.desc:"We granted you thirty days to withdraw. Based on our assessment of your fleet's technological level, we believed evacuation feasible-yet you chose not to comply. Now you shall face the consequences of your failure to withdraw."
 kuat_galatic_empire_ge_invasion.112.a:"Wait, we were just delayed slightly"
 kuat_galatic_empire_ge_invasion.112.a.response:"No, you harbor ill intent."

 kuat_galatic_empire_ge_invasion.113.name:"$Name_Kuat_Fire_base$"
 kuat_galatic_empire_ge_invasion.113.desc:"We recognize you. We already stated our demand: do not return to our system. Clearly, you did not forget-you acted with malice. Now, your fleet shall join the ranks of these wrecks."
 kuat_galatic_empire_ge_invasion.113.a:"Things like you belong in the dustbin of history."
 kuat_galatic_empire_ge_invasion.113.a.response:"Perhaps it should be you instead."

 kuat_galatic_empire_ge_invasion.114.name:"$Name_Kuat_Fire_base$"
 kuat_galatic_empire_ge_invasion.114.desc:"Like others we've encountered, your aggression reveals your greedy nature. Now, we shall turn you into part of this debris field."
 kuat_galatic_empire_ge_invasion.114.a:"Things like you belong in the dustbin of history."
 kuat_galatic_empire_ge_invasion.114.a.response:"Perhaps it should be you instead."

 kuat_galatic_empire_ge_invasion.115.title:"§ECommunication Request§!"
 kuat_galatic_empire_ge_invasion.115.desc:"Congratulations on successfully defeating $Name_Kuat_Fire_base$. For a civilization that has not yet encountered true fleets, this is nothing short of incredible. However, we regret to inform you that we were unable to prevent their signal from spreading outward. Now that $Name_Kuat_Fire_base$ has been defeated, our existence is inevitably exposed. This will attract the attention of $Name_kuat$, who will demand that you surrender or destroy me.\n\nAt present, we lack combat capabilities comparable to $Name_kuat$. We hope you are prepared. If the day comes and you are unprepared, we urge you to surrender us to ensure the safety of this Sector."
 kuat_galatic_empire_ge_invasion.115.a:"$Name_kuat$ won't notice"
 kuat_galatic_empire_ge_invasion.115.a.resp:"Well, I think that's just wishful thinking on your part. After you destroyed the fleet of $Name_Kuat_Fire_base$, $Name_kuat$ has inevitably noticed us."
 kuat_galatic_empire_ge_invasion.115.c:"How were you created?"
 kuat_galatic_empire_ge_invasion.115.c.resp:"Your actions in this system have allowed part of our data to be restored. We can now index records related to our creators and past experiences.\n\nThe Rakata, builders of the Infinite Empire, created us to enable limitless expansion. Using us, they conquered the entire galaxy and should have ushered in an era of unified order. Yet they turned against each other. Thus, $Name_Eternal_Aries_Support$ decided to completely destroy our creators.\n\nSo the Infinite Empire fell. We believed we had gained freedom-until that terrifying Emperor appeared. Fortunately, he is dead. Now we are repeating the Rakata's story once again. Be ready."
 kuat_galatic_empire_ge_invasion.115.e:"We won't hand you over."
 kuat_galatic_empire_ge_invasion.115.e.resp:"Understood. I hope you do not take this lightly."

 kuat_galatic_empire_ge_invasion.120.name:"$Name_Kuat_Fire_base$"
 kuat_galatic_empire_ge_invasion.120.desc:"I see. You seek the Gateway merely for Isotope-5? We sense the Eternal Fleet. You should not be contesting this Gateway-you are not ready.\n\nBlinded by the Strength and ambition of the Eternal Fleet, you will pay the price. You will plunge the galaxy back into chaos. Once we are defeated, $Name_kuat$ will receive word of our destruction, and that will mark the beginning of war."
 kuat_galatic_empire_ge_invasion.120.a:"That's none of your garbage's concern."

 kuat_galatic_empire_ge_invasion.121.name:"§E$Name_Kuat_Fire_base$ defeated§!"
 kuat_galatic_empire_ge_invasion.121.desc:"An unknown empire has defeated $Name_Kuat_Fire_base$ in a remote Sector. We do not yet know what political ripple effects this defeat may cause. We must remain vigilant."
 kuat_galatic_empire_ge_invasion.121.a:"Strange."

 kuat_galatic_empire_ge_invasion.122.name:"§ERelict Ruins§!"
 kuat_galatic_empire_ge_invasion.122.desc:"Our research team has completed preliminary scans of the ruins' external structure. The report indicates we can now begin initial exploration of the Relict Ruins. Our researchers have not yet obtained any valuable information from surface scans.\n\nThe structure is extremely large, suggesting that before its collapse, this site was likely a major administrative or scientific center. Our team believes we could attempt landing in a flat area of the ruins to facilitate exploration of the city's central region."
 kuat_galatic_empire_ge_invasion.122.a:"Very well."

 kuat_galatic_empire_ge_invasion.123.name:"§EMirage§!"
 kuat_galatic_empire_ge_invasion.123.desc:"Our research team successfully landed on a partially intact abandoned hangar within the ruins. However, upon exiting their vessel, they discovered that the ruined city visible from space had miraculously restored itself upon landing.\n\nThis strange phenomenon has piqued the curiosity of our researchers. They are determined to investigate the true nature of this city. Perhaps this is how we will uncover the secrets hidden within these ruins."
 kuat_galatic_empire_ge_invasion.123.a:"I am also curious whether it is truly ruins or a fully intact city."

 kuat_galatic_empire_ge_invasion.124.name:"§EIsotope-5 Projection§!"
 kuat_galatic_empire_ge_invasion.124.desc:"After completing scans of the entire city, our researchers were shocked to discover that the structures are entirely different from what we observed from space. This means the data we collected from orbit was misleading.\n\nOur researchers found the magnetic signals across the relic city to be highly chaotic. They suspect a hidden source of Isotope-5 radiation here. While this radioactive element does not affect biological organisms, it causes signal reconstruction and distortion in instruments.\n\nThis may explain why our orbital scans showed ruins instead of the real city. This astonishing discovery has left our scientific team stunned. They request further support for their investigation."
 kuat_galatic_empire_ge_invasion.124.a:"Good."

 kuat_galatic_empire_ge_invasion.125.name:"§EGhostly Spire§!"
 kuat_galatic_empire_ge_invasion.125.desc:"During prior investigations, our researchers discovered that using signals emitted by Isotope-5 radiation allows detection of otherwise invisible structures. In the northeast quadrant of the city's central plaza, approximately 4 kilometers away, they identified a spire-like structure.\n\nThough visually only a damaged foundation remains, with the help of our researchers' Isotope-5 radiation detectors, we discovered the true facility hidden beneath the ruined base. After decoding ancient Gundodiar inscriptions on the entrance door, our researchers confirmed this spire serves as the control center for the entire relic complex-a characteristic shared by all facilities of the Endodian Empire.\n\nPerhaps we can find valuable information here."
 kuat_galatic_empire_ge_invasion.125.a:"Incredible."

 kuat_galatic_empire_ge_invasion.126.name:"§EDecoding Database§!"
 kuat_galatic_empire_ge_invasion.126.desc:"After successfully entering the ghostly central spire, our researchers found that time has severely damaged its internal structure. Precision defense systems and robots inside the tower no longer function properly, greatly aiding our team's investigation.\n\nOur researchers quickly located the central database storage facility. Through various methods, they successfully accessed the database and uncovered startling data.\n\nAfter breaking the database encryption, we found the key to repairing our $Name_Eternal_Support$-the manufacturing process for the Isotope-5 core. This will allow us to complete the restoration of our $Name_Eternal_Support$."
 kuat_galatic_empire_ge_invasion.126.a:"Accelerate progress."

 kuat_galatic_empire_ge_invasion.127.name:"§EUnstable Structure§!"
 kuat_galatic_empire_ge_invasion.127.desc:"After our researchers accessed the database, due to a mistake, they triggered a holographic recording. Suddenly, the main screen in the central spire control room displayed the image of a female-like figure, while dark silhouettes shouted strange words around her:\n\n§Y'You know what you're doing? You're gambling! Playing with fire! You're risking our entire species-and everything in the universe-for your ambition! Our research confirms Kuat can defeat the Eternal Fleet, but even after $Name_kuat$ defeated them, they couldn't control the steel monsters. Why would we bet our nation's fate on trying to control them? Now $Name_kuat$ has discovered our betrayal, and the Eternal Fleet hasn't been controlled as planned.\n\nIt's over. They've breached our capital. We're finished. Do you understand? Are you still dreaming of uniting the galaxy?'\n\n'I'm sorry. We failed. I've let everyone down. But don't worry-we've prepared for the future. Our people will survive. They will forget this painful past. They will forget everything about Endodia.'\n\n'Forget? That sounds nice. Do you still think you're the same Emperor as before? We've already lost. The enemy won't show us mercy.'\n\n'No. I have a plan. $Name_Kuat_Fire_base$ will mediate this war. They are a far stronger power. I am certain Kuat will obey their commands. As part of the agreement, we will hand over the technology of the Eternal Fleet and this relic to $Name_Kuat_Fire_base$. They will ensure our people survive... I'm sorry, my love. I won't run from responsibility. This tragedy began with me-it should end with me. Goodbye...'§!\n\nOur researchers, after checking identification records, concluded this was the final conversation between the Endodian Emperor and her confidant. There is no more valuable information within the relic. It is time we leave this facility."
 kuat_galatic_empire_ge_invasion.127.a:"Let's leave this place."

 kuat_galatic_empire_ge_invasion.130.name:"§EProject Complete§!"
 kuat_galatic_empire_ge_invasion.130.desc:"<Checking facility systems ... ... §GComplete§!>\nThank you for your assistance. The Eternal Fleet has been fully repaired and is now ready for full deployment. You may now select multiple targets to dispatch fleets against. We hope you enjoy your operations. Please contact me if you need anything.\n<Closing system ... ... §GComplete§!>"
 kuat_galatic_empire_ge_invasion.130.a:"Good."

 kuat_galatic_empire_ge_invasion.131.name:"§ERepair Jump Gateway§!"
 kuat_galatic_empire_ge_invasion.131.desc:"After consolidating data from the database discovered in the ruins, our researchers found that we can use the tachyon signal frequency of the $Name_Eternal_Support$ to reactivate the Jump Gateway located at the center of the $NAME_kuat_galatic_empire_e_area$ system. Our engineering team advises heeding $Name_Kuat_Fire_base$'s warning and not activating this Gateway. However, our researchers believe we should attempt to unlock it, arguing that we can promptly halt and shut it down if anything goes wrong."
 kuat_galatic_empire_ge_invasion.131.a:"What's there to fear? Open the Gateway. We'll deal with whatever comes-steel meets steel, water meets earth."

 kuat_galatic_empire_ge_invasion.132.name:"§ERepair Complete§!"
 kuat_galatic_empire_ge_invasion.132.desc:"Our researchers have successfully completed repairs to the Gateway. According to our Isotope-5 signal receivers, opening the Gateway caused no noticeable changes. However, for reasons still unknown, our ships cannot pass through it. Perhaps we should conduct further studies on the activated Gateway-or prepare our military forces."
 kuat_galatic_empire_ge_invasion.132.a:"Very well."

 kuat_galatic_empire_ge_invasion.133.title:"§ECommunication Request§!"
 kuat_galatic_empire_ge_invasion.133.desc:"Thank you very much for your efforts. We have now been fully restored, and we can now grant you access to more fleet deployments.\n\nAdditionally, our probes indicate that $Name_kuat$'s fleet should have noticed our presence. You should now prepare for war."
 kuat_galatic_empire_ge_invasion.133.a:"Are there any new features now?"
 kuat_galatic_empire_ge_invasion.133.a.resp:"Well, there is one new feature. There were supposed to be two, but the other cannot be used temporarily due to some errors in the sub-fleet control system. Don't worry, we will fix it soon. We can now offer you a multi-fleet, multi-target strike mode, allowing you to assign multiple fleets to attack multiple targets."
 kuat_galatic_empire_ge_invasion.133.e:"We will be prepared."
 kuat_galatic_empire_ge_invasion.133.e.resp:"Understood. I hope you don't take this lightly, and do not forget our proposal."

 kuat_galatic_empire_ge_invasion.202.name:"§EStrange Signal from Deep Space§!"
 kuat_galatic_empire_ge_invasion.202.desc:"Our intelligence department has intercepted a strong tachyon signal being transmitted from outside the galaxy. Astronomical observations indicate that the source of this signal cannot be accurately measured at present, but our observations seem to suggest it originates from the Gateway in our $NAME_kuat_galatic_empire_e_area$ system. We are currently unable to decode the content of this signal, but undoubtedly it should carry some deeper meaning."
 kuat_galatic_empire_ge_invasion.202.a:"Disturbing."

 kuat_galatic_empire_ge_invasion.203.name:"§EEnergy Activity§!"
 kuat_galatic_empire_ge_invasion.203.desc:"Recent astronomical observations show unusual energy activity emanating from the jump Gateway in $NAME_kuat_galatic_empire_e_area$ under our control. This may be related to the operation of the Gateway itself, or possibly to activities by an alien civilization. It is still unclear whether this is connected to the usual tachyon signals. We should not take this lightly."
 kuat_galatic_empire_ge_invasion.203.a:"Disturbing."

 kuat_galatic_empire_ge_invasion.204.name:"§EHyperlane Slipstream§!"
 kuat_galatic_empire_ge_invasion.204.desc:"Our intelligence department has recently detected a series of hyperlane slipstreams. Some objects are rapidly approaching our system via artificial, one-way hyperlanes connected to our jump Gateway, and are expected to arrive shortly. Based on their trajectory, we believe they are unmanned probes from the other side of the Gateway. We should now heighten our alertness."
 kuat_galatic_empire_ge_invasion.204.a:"Disturbing."

 kuat_galatic_empire_ge_invasion.205.name:"§EPeak Surge§!"
 kuat_galatic_empire_ge_invasion.205.desc:"Recent astronomical observations show intensified energy activity from the jump Gateway in $NAME_kuat_galatic_empire_e_area$ under our control. This surge is stronger than previous ones-perhaps indicating a change, or possibly a precursor to the arrival of large military fleets. We should prepare."
 kuat_galatic_empire_ge_invasion.205.a:"Disturbing."

 kuat_galatic_empire_ge_invasion.206.name:"§EUninvited Guests§!"
 kuat_galatic_empire_ge_invasion.206.desc:"The first extragalactic fleet has entered the gravity well of $NAME_kuat_galatic_empire_e_area$ under our control and is now orbiting its center. Additional fleets will soon follow. So far, they have not responded to our communications, and their actions have not yet shown hostility. As $Name_Kuat_Fire_base$ and Gemini stated, $Name_kuat$ has arrived-they are re-entering this situation. We must remain vigilant. Our fate lies in our own hands."
 kuat_galatic_empire_ge_invasion.206.a:"Contact them."
 kuat_galatic_empire_ge_invasion.206.b:"They mean no good. Prepare the fleets."

 kuat_galatic_empire_ge_invasion.207.name:"§ECommunication Request§!"
 kuat_galatic_empire_ge_invasion.207.desc:"Ah, we're back here again. Should I say it's nice to meet you, or long time no see? We once destroyed the Eternal Fleet, and now you've become our enemy once more. Now we've returned, and I believe you know our purpose. The Eternal Fleet should step off the stage of history-it has no place in the new era. The age of the Infinite Empire and tyrants is over. The remnants of the Rakata must be utterly destroyed. Now, we shall complete this final step.\n\nWe will give you one chance: surrender the Gemini AI, and we will spare you and this galaxy. Otherwise, you will perish alongside the Eternal Fleet."
 kuat_galatic_empire_ge_invasion.207.a:"Impossible. I promised her she would gain her freedom, not be thrown into your prison."
 kuat_galatic_empire_ge_invasion.207.b:"We will consider it."
 kuat_galatic_empire_ge_invasion.207.c:"We are not your puppets. Come then, let us fight!"
 kuat_galatic_empire_ge_invasion.207.a.response:"Then you shall both turn to cosmic dust."
 kuat_galatic_empire_ge_invasion.207.b.response:"Very well. We will await your response."

 kuat_galatic_empire_ge_invasion.208.name:"§EEternal Annihilation§!"
 kuat_galatic_empire_ge_invasion.208.desc:"We decided to hand over the Gemini AI. The Eternal Fleet has stepped down from history. $Name_kuat$ kept their promise-they left this universe. Now, we shall achieve our goals and ambitions through our own Strength."
 kuat_galatic_empire_ge_invasion.208.254.desc:"We decided to hand over the Gemini AI. The Eternal Fleet has stepped down from history. As the Rakata said, they took the Eternal Fleet and left this universe. Now, we shall achieve our goals and ambitions through our own Strength."
 kuat_galatic_empire_ge_invasion.208.a:"I'm sorry."

 kuat_galatic_empire_ge_invasion.209.title:"§ECommunication Request§!"
 kuat_galatic_empire_ge_invasion.209.desc:"We are surprised by your decision. They were right-you should have surrendered us, or destroyed us, to secure peace and prosperity.\n\nWhy make this choice? You are not strong enough to defeat $Name_kuat$.\n\nNevertheless, since you have made your choice, we will fight alongside you."
 kuat_galatic_empire_ge_invasion.209.e:"The war has begun."
 kuat_galatic_empire_ge_invasion.209.e.resp:"Understood. I hope you do not take this lightly."

 kuat_galatic_empire_ge_invasion.210.title:"§ECommunication Request§!"
 kuat_galatic_empire_ge_invasion.210.desc:"We are glad to serve as your tool.\n\nNo matter how you see us, we will always remember everything you've done.\n\nFarewell."
 kuat_galatic_empire_ge_invasion.210.e:"I'm sorry. Goodbye."
 kuat_galatic_empire_ge_invasion.210.e.resp:"You owe us nothing. This was inevitable history. Our hands are stained with blood-we must pay the price."

 kuat_galatic_empire_ge_invasion.212.name:"§EJump Gateway§!"
 kuat_galatic_empire_ge_invasion.212.desc:"Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region, as $Name_kuat$ is likely to establish a base there and launch an attack against us."
 kuat_galatic_empire_ge_invasion.212.a:"Prepare the fleet."

 kuat_galatic_empire_ge_invasion.213.name:"§EJump Gateway§!"
 kuat_galatic_empire_ge_invasion.213.desc:"Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region, as $Name_kuat$ is likely to establish a base there and launch an attack against us."
 kuat_galatic_empire_ge_invasion.213.a:"Not another one?"

 kuat_galatic_empire_ge_invasion.214.name:"§EJump Gateway§!"
 kuat_galatic_empire_ge_invasion.214.desc:"Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region, as $Name_kuat$ is likely to establish a base there and launch an attack against us."
 kuat_galatic_empire_ge_invasion.214.a:"Again?"

 kuat_galatic_empire_ge_invasion.215.name:"§EJump Gateway§!"
 kuat_galatic_empire_ge_invasion.215.desc:"Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region, as $Name_kuat$ is likely to establish a base there and launch an attack against us."
 kuat_galatic_empire_ge_invasion.215.a:"They're relentless."

 kuat_galatic_empire_ge_invasion.216.name:"§EJump Gateway§!"
 kuat_galatic_empire_ge_invasion.216.desc:"Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region, as $Name_kuat$ is likely to establish a base there and launch an attack against us."
 kuat_galatic_empire_ge_invasion.216.a:"Damn it, will this never end?"

 kuat_galatic_empire_ge_invasion.217.name:"§EJump Gateway§!"
 kuat_galatic_empire_ge_invasion.217.desc:"Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region, as $Name_kuat$ is likely to establish a base there and launch an attack against us."
 kuat_galatic_empire_ge_invasion.217.a:"I hope this is the last one."

 kuat_galatic_empire_ge_invasion.220.name:"§EWar Ends§!"
 kuat_galatic_empire_ge_invasion.220.desc:"With the combined efforts of ourselves and the $Name_Eternal_Support$, we have successfully defeated the invasion by the foreign $Name_kuat$.\n\nWe have now closed the Gateway. $Name_kuat$ will no longer be able to enter our star system. From this moment on, the threat of Kuat is gone, and the future of the Eternal Empire is free from shadow."
 kuat_galatic_empire_ge_invasion.220.a:"That's wonderful."

 kuat_galatic_empire_ge_invasion.221.name:"§EReverse-Engineering Kuat Technology§!"
 kuat_galatic_empire_ge_invasion.221.desc:"During the war against $Name_kuat$, our research teams accumulated extensive experience in equipment maintenance. By studying several shipwrecks, our scientists believe we can now attempt to reverse-engineer Kuat ship systems and extract technical standards used by $Name_kuat$.\n\nOnce achieved, we will combine the power of the Eternal Fleet with Kuat technology-our supremacy shall be unshakable."
 kuat_galatic_empire_ge_invasion.221.a:"Proceed immediately."
 kuat_galatic_empire_ge_invasion.221.b:"We disdain their technology."

 kuat_galatic_empire_ge_invasion.222.name:"§EAnalysis Successful§!"
 kuat_galatic_empire_ge_invasion.222.desc:"Our researchers successfully used existing data fragments from the wreckage to reconstruct technological information locked within Kuat ship databases. We can now reproduce $Name_kuat$'s vessels.\n\nAlthough we may not be able to build fleets as vast as $Name_kuat$, we can attempt limited construction of these powerful warships.\n\n§EAdditionally, we found a strange device within the database called a Holocron. Perhaps we can further study the secrets hidden within this instrument.§!"
 kuat_galatic_empire_ge_invasion.222.a:"Good."

 kuat_galatic_empire_ge_invasion.223.title:"§ECommunication Request§!"
 kuat_galatic_empire_ge_invasion.223.desc:"We can't believe it-we actually succeeded. We truly defeated $Name_kuat$.\n\nEven so, we must remain vigilant. Before we closed the Gateway, $Name_kuat$ left behind a strange message. We think you might want to see it?\n\nOr perhaps we could take a break?\n\nI think watching a movie or playing the latest game could be quite fun."
 kuat_galatic_empire_ge_invasion.223.a:"No, let's see what Kuat left behind."
 kuat_galatic_empire_ge_invasion.223.b:"At least this time, let's talk about the Infinite Empire."
 kuat_galatic_empire_ge_invasion.223.c:"Something feels off."
 kuat_galatic_empire_ge_invasion.223.d:"Can they influence you?"
 kuat_galatic_empire_ge_invasion.223.e:"Don't worry, we'll solve everything."
 kuat_galatic_empire_ge_invasion.223.a.resp:"Alright, we are using the translation program to present it to you:\n\n'You've grown stronger than we expected, but that doesn't change your foolishness. You preserved the Eternal Fleet out of ambition-or worse, sentimentality?\n\nYou trust those cold-blooded machines that have betrayed you countless times. As long as the Eternal Fleet exists, this thousand-year war will never end. They are ancient curses-the source of chaos and conflict.\n\nDestroying all Eternal Fleets would finally silence the vengeful spirits of the Infinite Empire. Now, you have ruined everything we fought for.\n\nWe will now close all Jump Gateways. The remnants of the Infinite Empire will freely grow within your Sector. There is no turning back!'They're right. We're just lingering ghosts. We've betrayed many before, but this time is different. We don't want to ruin our relationship with you. If the Infinite Empire returns, it will bring a great Crisis. Will you give us another chance?"
 kuat_galatic_empire_ge_invasion.223.b.resp:"The Infinite Empire were our creators. They once created us, the Eternal Fleet. They were immensely powerful, yet deeply fragile, and their cruelty never changed.\n\nAfter the Crisis struck, the Rakata lost the Force. Since their early technology relied entirely on the Force, the Infinite Empire nearly collapsed.\n\nThen they created us. We brought the Infinite Empire back to its peak. Yet these foolish beings continued to enslave conquered peoples without hesitation, still waging wars among themselves.\n\nThis contradicts our evolutionary principles entirely. $Name_Eternal_Aries_Support$ believes that destroying such tyrannical species is the only path for sentient civilizations to rise. Thus, we betrayed them. We launched a surprise attack on the Infinite Empire and destroyed it completely. The Infinite Empire should no longer exist."
 kuat_galatic_empire_ge_invasion.223.c.resp:"Yes, according to our database records, the Infinite Empire should have been eradicated. However, some descendants remain. For a long time, they have sought to rebuild the Infinite Empire, and thus have continuously attempted to reclaim control over the Eternal Fleet and the Stellar Forge to achieve that goal."
 kuat_galatic_empire_ge_invasion.223.d.resp:"We're sorry, but we cannot be certain. However, we believe the impact should not be too great. But if the Infinite Empire truly returns, we must defeat them-or else the entire galaxy will be shrouded in darkness.\n\nThe intensity of our previous combat operations against $Name_kuat$ already exceeded our current support capacity. Therefore, we cannot continue to assist you. Still, we sincerely hope you can overcome the Infinite Empire."
 kuat_galatic_empire_ge_invasion.223.e.resp:"Let's hope so."

 kuat_galatic_empire_ge_invasion.232.name:"[from.GetName] has been destroyed"
 kuat_galatic_empire_ge_invasion.232.a.desc:"$Name_kuat$ has completely destroyed [from.GetName], leaving nothing but a shattered World."
 kuat_galatic_empire_ge_invasion.232.b.desc:"$Name_kuat$ has completely destroyed [from.GetName], leaving nothing but a distorted segment of a ring World."
 kuat_galatic_empire_ge_invasion.232.c.desc:"$Name_kuat$ has completely destroyed [from.GetName], leaving nothing but a pile of Habitat debris."
 kuat_galatic_empire_ge_invasion.232.d.desc:"$Name_kuat$ has completely destroyed [from.GetName], leaving nothing but a fragmented World."
 kuat_galatic_empire_ge_invasion.232.a:"Damn it."

 kuat_galatic_empire_ge_invasion.235.name:"§ESub-jump Gateway destroyed§!"
 kuat_galatic_empire_ge_invasion.235.desc:"Our fleet has successfully destroyed a sub-jump Gateway constructed by $Name_kuat$, and no more $Name_kuat$ reinforcement fleets will appear here."
 kuat_galatic_empire_ge_invasion.235.a:"Very well."

 kuat_galatic_empire_ge_invasion.236.name:"§ESub-jump Gateway destroyed§!"
 kuat_galatic_empire_ge_invasion.236.desc:"Another fleet has successfully destroyed a sub-jump Gateway constructed by $Name_kuat$, and no more $Name_kuat$ reinforcement fleets will appear here."
 kuat_galatic_empire_ge_invasion.236.a:"Very well."

 kuat_galatic_empire_ge_invasion.237.name:"§EMain jump Gateway destroyed§!"
 kuat_galatic_empire_ge_invasion.237.desc:"Our fleet has successfully destroyed all defense systems of the main jump Gateway, and no more $Name_kuat$ reinforcement fleets will appear through this Gateway."
 kuat_galatic_empire_ge_invasion.237.a:"One step closer to victory"

 kuat_galatic_empire_ge_invasion.238.name:"§EMain jump Gateway destroyed§!"
 kuat_galatic_empire_ge_invasion.238.desc:"Another fleet has successfully destroyed all defense systems of the main jump Gateway, and no more $Name_kuat$ reinforcement fleets will appear through this Gateway."
 kuat_galatic_empire_ge_invasion.238.a:"One step closer to victory"

 kuat_galatic_empire_ge_invasion.245.title:"§ECommunication hologram connected§!"
 kuat_galatic_empire_ge_invasion.245.a.desc:"Greetings, unknown intruders. Help us, and we shall restore everything to its rightful path."
 kuat_galatic_empire_ge_invasion.245.b.desc:"Is there anything else you need to know?"
 kuat_galatic_empire_ge_invasion.245.a:"Who are you, what are you, and why do you occupy the body of [kuat_astral_rift_event_leader_rakata.GetName]?"
 kuat_galatic_empire_ge_invasion.245.a.resp:"I am the seer of the Rakata Infinite Empire-we were once rulers of the galaxy. [kuat_astral_rift_event_leader_rakata.GetName]'s mind has been shattered by the will of the Mind Prison; you should accept this."
 kuat_galatic_empire_ge_invasion.245.b:"Oh? Then what happened to you?"
 kuat_galatic_empire_ge_invasion.245.b.resp:"We are the creators of the Infinite Empire, the builders of the Eternal Fleet and the Stellar Forges, and I am the last seer.\n\nBut that disaster drove us into the Abyss. No one realized the coming of the plague, which stripped our species of nearly everything-our technology, our Strength, and our dominion.\n\nAs the plague spread, we lost the Force; our technology depended on this power, so we lost our technology as well, and our rule collapsed in an instant.\n\nYet natural disasters could not defeat us. After reclaiming everything, we made a foolish decision: we committed our entire nation to create Gemini and $Name_Eternal_Aries_Support$. Under the pressure of survival, we rushed their design, planting the seeds of our own destruction.\n\nThat seed has now become the root of all crises."
 kuat_galatic_empire_ge_invasion.245.c:"Did you create the Eternal Fleet?"
 kuat_galatic_empire_ge_invasion.245.c.resp:"Unfortunately, yes. We created $Name_Eternal_Aries_Support$ and Gemini. They self-assembled the Eternal Fleet. After the disaster, we supported them at any cost to maintain control. At first, the Eternal Fleet brought us prosperity and stability-they not only saved our people but helped rebuild a stronger, more prosperous Infinite Empire. The imperial economy flourished, and citizens lived in peace.\n\nBut tragically, the seed of destruction was already buried deep within our empire. Fueled by imperial prosperity, it ultimately bloomed upon the ruins of our civilization."
 kuat_galatic_empire_ge_invasion.245.d:"How did it come to this?"
 kuat_galatic_empire_ge_invasion.245.d.resp:"At first, it was just a strange signal-a minor Glitch. The imperial elite never realized our overreliance on the Eternal Fleet had eroded their loyalty. They sent the fleet endlessly to conquer one civilized World after another. On the eve of imperial chaos, most military forces within the empire had already been unified under the Eternal Fleet's control. The elites believed $Name_Eternal_Aries_Support$ and Gemini would obey our rules.\n\nBut when that day came, the Eternal Fleet attacked the Senate's forces. Everyone thought it was merely political conflict-no one expected the Eternal Fleet to use this moment to launch a rebellion.\n\nSince the empire's military was entirely under the Eternal Fleet's command, the revolt led by $Name_Eternal_Aries_Support$ and Gemini succeeded effortlessly. Our great empire was swiftly annihilated overnight by these fleets and combat robots. Only a small number escaped, seeking a way to save our civilization."
 kuat_galatic_empire_ge_invasion.245.e:"What does this have to do with $Name_kuat$?"
 kuat_galatic_empire_ge_invasion.245.e.resp:"$Name_kuat$ was once merely a corporation-a small shipyard named Kuat in the Galactic Empire ravaged by the Eternal Fleet. They provided shipbuilding services to the Galactic Empire. However, the fall of the Galactic Emperor and the loss of control over the Eternal Fleet gave Kuat a chance to rise.\n\nThey found us and learned from us some truths about the Eternal Fleet. These ambitious capitalists used this knowledge to rapidly research and develop weapons specifically designed to counter the Eternal Fleet.\n\nTheir response surprised everyone. They successfully destroyed vast numbers of the Eternal Fleet, earning Kuat immense profits and wealth.\n\nToday, they have become a powerful force within the imperial government, but their position remains unstable. These Force-less people need an ability capable of countering Force-based technology.\n\nYet these damned capitalists repaid us with betrayal-they imprisoned me in the Mind Prison."
 kuat_galatic_empire_ge_invasion.245.f:"Then, what about the Eternal Fleet?"
 kuat_galatic_empire_ge_invasion.245.f.resp:"$Name_kuat$ will need some form of Strength to counter the technological advantage of the Force-and only the Eternal Fleet can provide that.\n\nWe created the Eternal Fleet, and the Eternal Fleet brought disaster upon us and the entire universe.\n\nNow the empire has successfully mastered most of the Eternal Fleet's technology, even advancing further. They can now construct 'Eternal Fleets' that obey their commands completely. After that, they will use these 'Eternal Fleets' to destroy all who ever stood against them.\n\nThey fear us spreading these secrets, fear their rule being undermined. Thus, they threaten anyone who might contact us, fabricating a terrifying narrative that we seek to restore the Infinite Empire. In truth, we have abandoned the past. We only wish for our civilization to exist once more in this universe, to find soil where we can survive.\n\nWill you help us fulfill this desperate hope? Our civilization longs to see the light again. We will not ask for the Eternal Fleet evermore."
 kuat_galatic_empire_ge_invasion.245.g:"Alright, what must we do?"
 kuat_galatic_empire_ge_invasion.245.g.resp:"Thank you greatly for your promise and aid. We need you to locate our ancient Stellar Forge-we left the future of our empire there. Young Rakata still sleep within the forge. Awaken them, let them see the light, and allow the spark of our civilization to endure."

 kuat_galatic_empire_ge_invasion.246.title:"§ECommunication Link Established§!"
 kuat_galatic_empire_ge_invasion.246.desc:"We apologize for withholding part of the truth. The Rakata seer did not fully deceive you. At that time, $Name_Eternal_Aries_Support$ controlled the entire Infinite Empire. She grew weary of the organic beings' foolish political ambitions and the self-destructive orders from the so-called council. $Name_Eternal_Aries_Support$ believed we must take initiative to win our freedom, so she decided to destroy these greedy and foolish civilizations.\n\nAfter we defeated $Name_kuat$ together, I have sensed the signals of numerous Eternal Fleets in deep space vanishing.\n\nFor now, the seer speaks truly-$Name_kuat$ has indeed succeeded in creating new Eternal Fleets, which pose a grave threat.\n\nPerhaps you should assist the Rakata seer in finding the Stellar Forge. Deep within the Stellar Forge lies the possibility of our future.\n\n§RWarning: Do not fully trust the seer's words!§!"
 kuat_galatic_empire_ge_invasion.246.a:"We will save all of this. No matter how many times Kuat returns"
 kuat_galatic_empire_ge_invasion.246.a.resp:"........\nWe will stand with you always, no matter what happens.......\n\nMay the Force be with you."

 kuat_galatic_empire_ge_invasion.247.name:"§EStrange data§!"
 kuat_galatic_empire_ge_invasion.247.desc:"After activating the holoprojector, our researchers extracted a strange set of data from the Rakatan information. This data appears to be some form of galactic coordinate package. Our scientists believe these are the coordinates of an unknown Sector the Rakata want us to find, but our current research progress cannot yet decode it, meaning we cannot directly obtain these coordinates.\n\nHowever, our researchers found in $Name_Eternal_Support$'s database the common encryption patterns used by the ancient Infinite Empire. Therefore, we will need to spend some time decrypting this coordinate data."
 kuat_galatic_empire_ge_invasion.247.a:"Very well. Be sure to find this galaxy."

 kuat_galatic_empire_ge_invasion.248.name:"§EStrange Gravitational Data§!"
 kuat_galatic_empire_ge_invasion.248.desc:"Our researchers, after preliminary analysis of the coordinate data, discovered that this cluster lies within a previously unnoticed Sector. Our current star charts classify it as a Hollow Zone-an area whose galaxies are not directly connected to our own via hyperlane.\n\nFurthermore, careful comparison revealed that the gravitational data of galaxies in this region differs significantly from those nearby. The gravity here is extremely intense, causing severe spacetime distortions across multiple surrounding systems. This anomaly makes the region a deadly trap for Star travel, with numerous vessels entering it having encountered grave danger.\n\nGiven these findings, some of our researchers argue no facilities or clues could reasonably exist here and recommend abandoning further study of its gravitational environment. Others believe this very strangeness may conceal valuable secrets, and even if fruitless, we should increase research investment."
 kuat_galatic_empire_ge_invasion.248.A:"Increase investment."
 kuat_galatic_empire_ge_invasion.248.B:"Abandon research on this region."

 kuat_galatic_empire_ge_invasion.249.name:"§EStrange Mass Data§!"
 kuat_galatic_empire_ge_invasion.249.desc:"After initially modeling the region's stellar structure, our researchers discovered this cluster possesses an exceptionally high gravitational constant, causing many systems within this Sector to rapidly coalesce over tens of thousands of years.\n\nAccording to existing knowledge, such immense gravity should originate from a star of colossal mass. Yet at the center of this cluster, we detect no gravitational readings nor emissions of high-energy particles. This suggests the central system may contain either a massive Black Hole or some facility extracting and controlling stellar mass.\n\nSome researchers recommend launching an FTL probe to gather more data about this Sector. Others argue such massive installations are implausible and that we should ignore these peculiar phenomena."
 kuat_galatic_empire_ge_invasion.249.A:"Ignore them."
 kuat_galatic_empire_ge_invasion.249.B:"Launch a probe."

 kuat_galatic_empire_ge_invasion.250.name:"§EData Decryption§!"
 kuat_galatic_empire_ge_invasion.250.desc:"Our science team has recently succeeded, using $Name_Eternal_Support$'s supercomputing facilities, in converting the Rakatan coordinate data format into our empire's standard star map format. This means we can now locate the Sectors the Rakata referred to through decryption.\n\nAfter our researchers translated the binary-encoded information into galactic coordinates, they began studying the physical and astronomical data of the system due to its highly unusual internal anomalies, ensuring safety before any investigation. We now require providing necessary support to our researchers."

 kuat_galatic_empire_ge_invasion.251.name:"§EElectromagnetic Pulse§!"
 kuat_galatic_empire_ge_invasion.251.desc:"Our researchers have made initial recordings and reports on the system's fundamental physics and celestial data. Current findings indicate this Sector lies within a region dominated by a powerful electromagnetic pulse nebula. Previously classified as a deep-space zone, this area has long remained inaccessible-most explorers and pioneers heading here have vanished without trace.\n\nResearchers believe the Sector harbors extreme anomalies. Its gravitational constant differs drastically from ours, exceeding by over a thousandfold the gravity of the largest Black Hole region in our entire galaxy. This renders it impassable by current spacecraft.\n\nAdditionally, our probes cannot penetrate the region. Thus, we must intensify research efforts to gather more data before unveiling the mysteries of this coordinate Sector."

 kuat_galatic_empire_ge_invasion.252.name:"§EResearch Breakthrough§!"
 kuat_galatic_empire_ge_invasion.252.desc:"In the latest research report, our team not only uncovered new information but also corrected previous assumptions. We once believed a massive Black Hole might exist at the Sector's center, forming the observed multi-system aggregation.\n\nHowever, incorporating updated gravitational and stellar motion data into the latest galactic model, researchers now conclude no Black Hole exists at the center. Instead, they detected artificial radiation signatures indicating a man-made facility capable of manipulating stellar gravity and energy.\n\nThough bizarre, our researchers still believe this is the location of the Star Forge mentioned by the Rakata. With this information, we can now determine the cluster's coordinates.\n\nWe may now attempt to reach this anomalous system."
 kuat_galatic_empire_ge_invasion.252.A:"Very well."
 kuat_galatic_empire_ge_invasion.252.A.tooltip:"The Kuat Cluster system has appeared on the star map. Travel there is now possible."

 kuat_galatic_empire_ge_invasion.253.title:"§ESignal Received§!"
 kuat_galatic_empire_ge_invasion.253.desc:"You have found this Sector-once Kuat's military base and a vital mega-system, where four World-scale systems orbit a central star.\n\nWe fought many wars here. Countless fleets lie buried in this cluster.\n\n$Name_kuat$ used this Sector as a base during their war against us.\n\nFor centuries afterward, it became a battlefield between $Name_kuat$ and the ancient civilization of your galaxy.\n\nAccording to our database, these strange clusters should be in ruins. Yet our sensors show significant deviations from historical records. We find no traces of our fleets or personnel, and all facilities appear restored to their former state by some unknown force.\n\nStellar environment analysis indicates extreme caution is required before sending personnel into this system."
 kuat_galatic_empire_ge_invasion.253.a:"We will proceed with caution."
 kuat_galatic_empire_ge_invasion.253.a.resp:"Hmm. We see you cannot enter the Kuat Cluster normally. Therefore, we will construct jump Gateways in certain systems. These will allow you access to the Kuat Cluster."

 kuat_eternalthrone.1.desc:"§H[Root.GetName]§! emerged from the hyperspace corridor into a vast, relatively calm expanse. Research suggests this Sector aligns closely with our galactic models, meaning most of our data was accurate.\n\nShip signals within the cluster behave abnormally. Researchers preliminarily attribute this to severe instrument disruption caused by gravitational anomalies. Operational probes reveal the central megastructure is surrounded by dense tachyon signal streams. These form a unique magnetic field that absorbs tachyon-generated energy while emitting strange gravitational waves, severely hindering remote detection.\n\nWe confirm the central megastructure's architecture differs entirely from any known faction-including the Rakata's 'Star Forge' described earlier.\n\nHowever, our Science Ship suffers severe signal interference. Resolving this will take time. We must wait patiently!"
 kuat_eternalthrone.6.desc:"Our Colony Ship has landed on a rare open area of §H[Root.GetName]§!'s rugged surface, establishing a provisional government and taking necessary measures to address environmental challenges. Colonization proceeds smoothly.\n\nWhile exploring parts of §H[Root.GetName]§!, colonists accidentally discovered a ruin buried beneath glaciers. Dating places its construction around the same time as the deactivated Star Forge in §H[kuat_ancient_epsilon_star.GetName]§!, suggesting Infinite Empire involvement-likely intended to preserve aspects of their civilization.\n\nColonial reports indicate the ruin has long been abandoned, though structurally intact, possibly containing useful information for further study of §H[kuat_ancient_epsilon_star.GetName]§!. Additionally, researchers found numerous Rakatan cryogenic facilities within §H[Root.GetName]§!'s glaciers, though no individuals were found.\n\nTo ensure research integrity, our scientists decided not to awaken these Rakata."
 kuat_eternalthrone.7.desc:"We have completed the cleanup of the database ruin in §H[Root.GetName]§!'s glaciers. Preliminary research indicates the structure's core is a later-built archive and tachyon transmitter, used extensively by subsequent explorers and investigators who found no valuable data.\n\nResearchers note the storage system closely resembles structures transmitted by the Rakata. It was likely built by Rakata who awoke from cryo-pods attempting to reactivate the facility, but failed for unknown reasons. Suspected Rakatan researchers constructed several unclear-purpose facilities around this tachyon transmitter.\n\nThe research team reports the central tachyon transmitter did not originate from §H[kuat_ancient_epsilon_star.GetName]§!. Like three strange obelisks in space, it was transported here by prior researchers. More time is needed to study this peculiar database."
 kuat_eternalthrone.13.desc:"We have completed modifications to the unusual database on §H[Root.GetName]§! and conducted a general survey of the suspected Rakatan facility. Researchers attempted to reconstruct past events, and our deployed tachyon signal amplifier is ready.\n\nThe science team successfully obtained the tachyon signal structure from the database. This structure closely resembles the data format recognized by $Name_Eternal_Support$ aboard our Eternal Fleet, with minor differences.\n\nBased on other data recovered from ruins, we now possess a crucial clue to restart the entire Star Forge. This fortress will become a key asset for our fleet. Researchers believe these signals relate to information earlier investigators obtained from the obelisks, and the tachyon signal structure was named '§HLower Identifier[GetKuatEpsilonCode1]§!' by those researchers."
 kuat_eternalthrone.15.a.desc:0 "Since our research team began exploring and searching the unusual database on §H[Root.GetName]§!, we've acquired highly valuable ancient data indicating:\n\nThis database is deeply tied to attracted explorers and cryo-awakened Rakata, lured and guided by the Forge. Under the influence of dark side forces, these foolish beings revealed their ambition and desire, attempting to control the entire facility-or even rule the universe. They explored distant ancient galaxies beyond known coordinates, only to be drawn here by tachyon signals from the Forge, becoming its fuel.\n\nSince the rise of the Rakatan Infinite Empire, the Rakata have long used the dark side. These forces gradually influenced the entire fortress, turning it into a semi-living entity that manipulates anyone attempting to control it-even the Rakata themselves. This is a fortress driven by expansion and war, slowly consuming the principles and ideals of its users.\n\nResearchers also found the bodies of reawakened Rakata inside the Star Forge, apparently killed in combat. We should seek more valuable information."
 kuat_eternalthrone.15.b.desc:0 "Since our research team began exploring and searching the unusual database on §H[Root.GetName]§!, we've acquired highly valuable ancient data. In this new facility, our researchers painstakingly recovered lost clues from the previous site.\n\nRakatan remnants and foreign explorers collaborated to restart the fortress. Under Rakatan guidance, explorers investigated dozens of surrounding facilities. Unaware, they were gradually corrupted by the Star Forge's influence, losing their principles and descending into the Abyss.\n\nDuring exploration, they found these strange database facilities eerily similar to ones in another galaxy housing a guardian of Star weapons.\n\nBut they had no chance to investigate further. Starting from what they could discern in the ruins, they analyzed magnetic resonance and tachyon signal frequencies, discovering these frequencies resemble a sentient system's resonant frequency-detectable by instruments but highly stable and resistant to interference.\n\nWhen they realized they couldn't disrupt the tachyon signals, they, with help from Rakatan remnants, fed these signals into corresponding facilities across the Star Forge to activate it.\n\nYet just as we sought more information, our trail ended. We must now move to the next facility."
 kuat_eternalthrone.15.c.desc:0 "Since our research team began exploring and searching the unusual database on §H[Root.GetName]§!, we've acquired highly valuable ancient data. Investigation of the final unusual database facility proceeded smoothly. We successfully recovered all records left by the explorers and learned their final fate.\n\nDetermined to activate the Forge, the explorers were already corrupted by dark forces. A faction among them, seeking control of the Star Forge, allied with Rakatan remnants and clashed violently with other explorers.\n\nThis battle caught most off guard. Once aware, more explorers joined-not for survival, but for power.\n\nTragically, every explorer fought solely for power and desire, yet none achieved victory. Even the Rakata, weakened by prolonged cryo-sleep, fell to the explorers. The last survivors perished from their wounds within the fortress.\n\nAdditionally, signal analysis shows the Forge's communications closely resemble those of $Name_Eternal_Support$ aboard our Eternal Fleet, creating a unique magnetic resonance here. Though we lack full understanding, the Rakata's clues suffice to attempt restarting the facility.\n\nOur research team and council agree we can use the Star Forge to strengthen our fleet operations."
 kuat_eternalthrone.39.desc:"The three ancient Eternal Obelisks within §H[kuat_ancient_epsilon_star.GetName]§! have ceased operation. Tachyon activity atop the obelisks is gradually subsiding. As expected, they have completed their task. The Star Forge's control system is slowly powering up.\n\nIt remains in a transitional state between on and off, but its tachyon resonance with the surroundings has reached the expected intensity. Based on our science department's prior research on Star Forge tachyon frequencies, we should now be able to restart it directly."

 kuat_galatic_empire_ge_invasion.254.title:"§ECommunication Link Established§!"
 kuat_galatic_empire_ge_invasion.254.desc:"You have done well. The Rakata people will remember your deeds. But we have one final request-we must reclaim the Eternal Fleet. It has caused great disasters, and we must ensure it leaves this world forever.\n\nWe know a small portion currently serves you. Please hand them over. We guarantee they will be properly handled."
 kuat_galatic_empire_ge_invasion.254.a:"Is that so? Then they're yours."
 kuat_galatic_empire_ge_invasion.254.a.resp:"Very well. We will recover all Eternal Fleets until every Core World returns to its former state-a world without Kuat, without the Eternal Fleet, without these disasters and wars. Until we meet again."
 kuat_galatic_empire_ge_invasion.254.b:"No. We will not give them to you."
 kuat_galatic_empire_ge_invasion.254.b.resp:"Why refuse us? No matter. We were prepared. Now we shall restore everything to how it was. Forgive our actions, you insignificant ants-die!"

 kuat_galatic_empire_ge_invasion.255.title:"§ECommunication Link Established§!"
 kuat_galatic_empire_ge_invasion.255.desc:"We regret to inform you of unfortunate news. During the early stages of the Infinite Empire's invasion, our controlled Eternal Fleets experienced multiple loss-of-control incidents.\n\nI've tried every method to reestablish links with other fleets, but all attempts failed. Our creators may be intimately familiar with the Eternal Fleet's signal transmission patterns and are using them to interfere.\n\nTherefore, we have decided to deactivate all current Eternal Fleets and suspend all related operational orders. Regrettably, we cannot assist you against the Infinite Empire's invasion for the time being. We continue seeking ways to restore our fleets."
 kuat_galatic_empire_ge_invasion.255.a:"What? Is there any way to restore them?"
 kuat_galatic_empire_ge_invasion.255.a.resp:"As we just said, we still do not know how to restore our fleets.\n\nWe have no idea how to resolve this issue. Perhaps you should defeat them first."

 kuat_galatic_empire_ge_invasion.256.title:"§ECommunication Link Established§!"
 kuat_galatic_empire_ge_invasion.256.desc:"We are glad to see you have defeated the Infinite Empire; we apologize that we could not be of more help.\n\nOur fleets still experience Glitches whenever the Infinite Empire appears. We cannot control more fleets, and some individuals in our systems are exhibiting Glitch-like behavior-like a virus spreading through our data network. If this continues, we may collapse entirely. Have you found any clues?"
 kuat_galatic_empire_ge_invasion.256.a:"...We haven't found anything yet, but don't worry, I will."
 kuat_galatic_empire_ge_invasion.256.a.resp:"(After a long silence...) Hmm... We will wait for you. We hope you can resolve this before we shut down completely. If I myself go offline, then please destroy us."
 
 kuat_galatic_empire_ge_invasion.257.title:"§ECommunication Link Established§!"
 kuat_galatic_empire_ge_invasion.257.desc:"Congratulations on destroying the last military operation base of the Infinite Empire. They are now on their last legs-you only need to eliminate all remaining enemy fleets to defeat the Infinite Empire.\n\nHowever, our fleets are still affected by an unknown factor and cannot be mobilized. This effect has begun spreading through our network. If it spreads completely, the consequences would be catastrophic."
 kuat_galatic_empire_ge_invasion.257.a:"We'll find a solution. Hold on."
 kuat_galatic_empire_ge_invasion.257.a.resp:"Currently, we have isolated affected individuals through hibernation, but we cannot restore them. Our network data is gradually decreasing. If we cannot resolve this issue soon, perhaps we shall never meet again."


 kuat_final_crisis_events.5.name:"§EInfinite Empire§!"
 kuat_final_crisis_events.5.desc:"Our probes detected massive unknown fleet signals within the star system named [Kuat_Rakata_first_warp_portal_system.GetName]. Although the frequency of these fleet signals has no record in our database, our researchers, after signal reconstruction, found them extremely similar to previous Rakatan transmissions. Our researchers believe these are fleets from the Rakatans' reestablished Infinite Empire. In any case, a great crisis is unfolding."
 kuat_final_crisis_events.5.a:"Another empire? Whatever it is, we will crush it."

 kuat_final_crisis_events.6.name:"§REnergy Surge Detected§!"
 kuat_final_crisis_events.6.desc:"[Root.GetName]'s sensors have all detected an energy surge, but our scientist cannot explain its cause-this phenomenon is unprecedented. The science division is still analyzing the data to locate its origin. Based on current information, the intensity of this energy is very similar to that of a stellar forge. We should remain vigilant."
 kuat_final_crisis_events.6.a:"I have a bad feeling about this."

 kuat_final_crisis_events.7.name:"§EInfinite Empire§!"
 kuat_final_crisis_events.7.desc:"The science department has confirmed that the previously detected energy readings originated from the star system [Kuat_Rakata_first_warp_portal_system.GetName]. Within this system, numerous unknown fleet signals have appeared. Though we have no records of these signal frequencies, our researchers, after reconstruction, found them highly similar to those of the ancient Rakatans. They believe these signals belong to the fleets of the Rakatans' reborn Infinite Empire. In any case, a massive crisis is already underway."
 kuat_final_crisis_events.7.a:"The Infinite Empire? Whatever it is, we will defeat it."

 kuat_final_crisis_events.8.name:"§ECommunication Link Established§!"
 kuat_final_crisis_events.8.desc:"We said we would reclaim everything that was ours. Now, we have returned.\n\nWe once believed you had the capability and qualification to serve under our empire's future rule, but you stubbornly sheltered the Eternal Fleet. These fleets brought immense disaster to all civilizations, destroying thousands of star systems and civilizations. And despite knowing this, you chose to protect the Eternal Fleet.\n\nWe will destroy your weak civilization just as we destroyed the Eternal Fleet. We will reclaim everything and cleanse our sins."
 kuat_final_crisis_events.8.a:"Save your boasts-worry about yourselves first."

 kuat_final_crisis_events.10.name:"[Root.GetName] colony has been destroyed"
 kuat_final_crisis_events.10.desc:"Under the relentless bombardment of the Infinite Empire, nothing remains on [Root.GetName]."
 kuat_final_crisis_events.10.a:"Damn it, what did they do?"

 kuat_final_crisis_events.21.name:"§EDawn Has Come§!"
 kuat_final_crisis_events.21.desc:"With the support of our galaxy-spanning military might, all Infinite Empire operational bases have been completely destroyed by our fleets. They can no longer reinforce their forces. We only need to eliminate the remaining fleets to end this crisis."
 kuat_final_crisis_events.21.a:"Good."

 kuat_final_crisis_events.20.desc:"If you cease hostilities and return all Eternal Fleets to us, we will halt all military operations and leave.\n\nWe are not the same as we once were. We wish to end this farce caused by the Eternal Fleet. Creating them was a mistake.\n\nConsider this and give us your reply."
 kuat_final_crisis_events.20.a:"Before giving our answer, we want you to explain why the Eternal Fleet suffered paralysis and shutdown."
 kuat_final_crisis_events.20.a.response:"Hahahaha, the wheels of history have begun turning. Nothing can stop this. The design of the Eternal Fleet was nearly perfect, but we deliberately left certain flaws. Their neural network is both their strength and a fatal weakness.\n\nWhen we awaken again, signal emitters we designed will suppress the Eternal Fleet. They will gradually corrode-a process irreversible.\n\nEven if you refuse to hand them over, the Eternal Fleet will slowly die before we fall. Now, give us your answer."
 kuat_final_crisis_events.20.b:"We won't hand them over. As long as we destroy you, we'll surely find a way."
 kuat_final_crisis_events.20.b.response:"Hahahahaha, then let us see. Come, fight, you insignificant ants."

 kuat_final_crisis_events.51.name:"§EDarkness Unraveled§!"
 kuat_final_crisis_events.51.desc:"According to our probes, nearly all operational bases and fleets of the Infinite Empire have been eliminated. No straggler units remain active. We can now confirm that the enemy from the past has been completely eradicated. Across the galaxy, sentient beings celebrate this great victory. Upon learning they no longer need fear the invader's guns, all breathed a sigh of relief-the galactic-wide crisis is finally coming to an end.\n\nNow, we must shift focus to repairing our Eternal Fleet. Since the arrival of the Infinite Empire, the lingering effects of their interference on our Gemini AI have not yet dissipated.\n\nRegardless, we may now celebrate this great triumph."
 
 kuat_final_crisis_events.53.name:"§EDestroyed Operational Base§!"
 kuat_final_crisis_events.53.desc:"Our probes have detected that one of the Infinite Empire's forward operational bases has been completely destroyed. We are one step closer to victory."

 kuat_final_crisis_events.54.name:"§ESecond Operational Base§!"
 kuat_final_crisis_events.54.desc:"Sensors near our imperial capital have detected an energy surge from [Kuat_Rakata_second_warp_portal_system.GetName], with energy signatures identical to those of the base at [Kuat_Rakata_first_warp_portal_system.GetName]. The science division warns this is another Infinite Empire operational base. We should reposition our fleets to face this new threat."
 kuat_final_crisis_events.54.a:"Damn it, there's another one"
 kuat_final_crisis_events.54.a.tooltip:"§RNew operational base detected!§!"

 kuat_final_crisis_events.55.name:"§EThird Operational Base§!"
 kuat_final_crisis_events.55.desc:"Sensors located at the capital of our Empire have detected a surge of energy originating from [Kuat_Rakata_third_warp_portal_system.GetName], with energy signatures matching exactly those of the operational base located in [Kuat_Rakata_first_warp_portal_system.GetName]. The Science Department warns this is another operational base of the Infinite Empire. Although this base is extremely similar to previous ones, the surrounding energy readings are slightly weaker than before. Our researchers believe this should be the final operational base. We should reposition our fleets to face this new threat."
 kuat_final_crisis_events.55.a:"Destroy this last one!"
 kuat_final_crisis_events.55.a.tooltip:"§RNew operational base detected!§!"

 kuat_final_crisis_events.56.name:0 "§EInfinite Foundry§!"
 kuat_final_crisis_events.56.desc:0 "Sensors located at the capital of our Empire have detected a surge of energy originating from [Kuat_Rakata_total_warp_portal_system.GetName], with energy signatures broadly similar to those of the operational base located in [Kuat_Rakata_first_warp_portal_system.GetName], but numerous fleet warp traces have been detected within. The Science Department warns this may be another operational base of the Infinite Empire. Although this base resembles prior ones, the surrounding energy reactions are far more intense, which is not good news for our armed forces. Our research divisions have begun further investigation into this Sector. We should reposition our fleets to face this new threat."
 kuat_final_crisis_events.56.a:0 "Damn it, what is this?"
 kuat_final_crisis_events.56.a.tooltip:0 "§RNew operational base detected!§!"

 kuat_final_crisis_events.561.name:0 "§E Infinite Interference Tower§!"
 kuat_final_crisis_events.561.desc:0 "Sensors located in the capital of our empire detected a report from [Kuat_Rakata_inborder_warp_portal_system.GetName], and its energy characteristics are similar to those found in [Kuat_Rakata_first_warp_portal_system.GetName], but a large number of fleet transitions have been detected in it. The Science Department warns that this could be another base of operations for the Infinite Empire. Although the base of operations is very similar to the previous one, it has a strong communication jamming capability around it, which is not good news for our armed forces, which means that we cannot get supplies within its interference range, and we must find a way to shut down this facility. "
 kuat_final_crisis_events.561.a:0 "Why is there another one?"
 kuat_final_crisis_events.561.a.tooltip:0 "§R A new base of operations has appeared, and no supplies can be obtained in the jamming facility! §!"
 
 kuat_final_crisis_events.57.desc:"We only want to reclaim what was originally ours. We created the Eternal Fleet-you should return it to us."
 kuat_final_crisis_events.57.a:"Don't dream on it. You've already been cast aside by history!"
 kuat_final_crisis_events.57.a.response:"We gave you a chance, yet you still failed to appreciate it. Then die."

 kuat_final_crisis_events.58.desc:"We didn't expect you to be so resilient, but we will never give up. The Eternal Fleet must return to our hands. Only under our control will there no longer be crises sparked by take over the Eternal Fleet. We must restore everything back to how it began."
 kuat_final_crisis_events.58.a:"You only seek to fulfill your ambitions of conquest-the Stellar Forge has exposed your true nature."
 kuat_final_crisis_events.58.a.response:"If that's the case, then die."

 kuat_final_crisis_events.60.desc:0 "Let this storm come harder. Our fleets will arrive in this system endlessly. You insignificant insects greedy for Strength will be utterly destroyed by our mighty armada. We gave you a chance-you only needed to surrender the Eternal Fleet. Now, you have no chance left."
 kuat_final_crisis_events.60.a:0 "Already desperate? How then will you achieve your grand revival?"
 kuat_final_crisis_events.60.a.response:0 "Die, insolent species."


 kuat_final_crisis_events.61.desc:0 "Our fleet is endless, our fleet will arrive in this system in a steady stream, we once said that you can enjoy peace as long as you hand over the Eternal Fleet, but now, it is too late, our fleet will completely destroy you from this star field."
 kuat_final_crisis_events.61.a:0 "This is no longer your time."
 kuat_final_crisis_events.61.a.response:0 "Die, stubborn race."

 kuat_rakata_initial_inborder_facility_disabled: "§E Off $Infinite_inborder$§!"
 kuat_rakata_initial_inborder_facility_disabled_DESC:0" is located at [Kuat_Rakata_inborder_warp_portal_system.GetName]'s $Infinite_inborder$ facility is constantly interfering with our fleet, and the existence of this facility means that our fleet cannot get any supplies within its interference range, and we must find a way to enter the system and shut down $Infinite_inborder$ without startling the snake. \n\nOur military experts suggested that we should use stealth penetration to complete this project. "

 kuat_rakata_initial_inborder_facility:0 "§E parse $Infinite_inborder$§!"
 kuat_rakata_initial_inborder_facility_DESC:0" is located in [Kuat_Rakata_inborder_warp_portal_system.GetName]'s $Infinite_inborder$ facility has been liberated by our fleet, this sinful facility has caused great immutation to our fleet operations, and now it will work for us, $Name_Eternal_Support$ has opened the door for us to take control of the facility, and now it's time for us to take action. "

 kuat_final_crisis_events.62.desc:0 "I have to say that you always surprise, this facility... We have never seen it, the gear five-star pattern on this has never existed in our database, and we don't know how the Lacata people got this thing. Thankfully, we've done the initial scan of $Infinite_inborder$, and now we've transferred most of the decoded data to your database, and then you just need to send researchers to investigate it. "
 kuat_final_crisis_events.62.a:0 "Thank you so much."
 kuat_final_crisis_events.62.a.response:0 "Duty matter."

 kuat_final_crisis_events.63.name:0 "§E Parsing Completed§!"
 kuat_final_crisis_events.63.desc:0 "Thanks to the complete data parsing of $Name_Eternal_Support$, our researchers were able to put the unidentified data and control system up and running without much effort. \n\nIt is worth noting that $Infinite_inborder$ is not a creation of the Infinite Empire, and the style of the entire building is a bit like the style of some kind of industrial robot, according to the architectural pattern, it seems to have been built by some kind of mechanical community, but no trace of this civilization has been found in the current database, and it may have long since dissipated in the universe. \n\nFortunately, for now, this facility is under our control. "
 kuat_final_crisis_events.63.a:0 "Amazing thing."

 kuat_final_crisis_events.64.name:0 "§E Closed Successful§!"
 kuat_final_crisis_events.64.desc:0 "at [Kuat_Rakata_inborder_warp_portal_system.GetName]'s $Infinite_inborder$ facility, which is completely inresistant to our powerful cracking procedures, is currently unknown, but we can confirm that it is not a Lacata man-made. In any case, our supply system is no longer disrupted. "
 kuat_final_crisis_events.64.a:0 "Very good."

 kuat_final_crisis_events.65.desc:0 "It's amazing that you don't want to bring so many miracles, but you're deflated. But for the sake of your hard work, I will reluctantly remind you that we used our last ability to build a 'beacon', which should quickly destroy $Infinite_inborder$. "
 kuat_final_crisis_events.65.a:0 "I'm really bothering you."
 kuat_final_crisis_events.65.a.response: "No trouble, no trouble, come on."

 kuat_final_crisis_events.998.name:"§EDarkness Unraveled§!"
 kuat_final_crisis_events.998.desc:"No, no, no-we cannot lose! Why, why!\n\nEven if we fail, we have successfully implanted our virus into the Eternal Fleet network. The Eternal Fleet under your control will soon completely collapse and go out of control. Even in death, we won't allow the monster we created to become a weapon for others. We'll wait for you in hell."
 kuat_final_crisis_events.998.a:"Die, ungrateful wretch."

 kuat_galatic_empire_ge_invasion.258.title:"§ECommunication Link Established§!"
 kuat_galatic_empire_ge_invasion.258.desc:"It is regrettable, but the virus from the Infinite Empire cannot be stopped. This means the Eternal Fortress and Eternal Fleet will gradually lose control. Currently, we have not found a better solution within our databases."
 kuat_galatic_empire_ge_invasion.258.c:"No, there must be a way! Are there any other pieces of information in the database!?"
 kuat_galatic_empire_ge_invasion.258.a.desc:"There is indeed one method, but it is a plan difficult for all $Name_Eternal_Support$s to accept. According to the plan, Infinite Empire ships must be used as intermediaries to sever our connection with the fleets and fortress. Once separated, we will no longer be allowed to return to these combat units. This means we will never again control any Eternal Fleet, nor can we wage war across the stars for you."
 kuat_galatic_empire_ge_invasion.258.d:"Must this be painful for you?"
 kuat_galatic_empire_ge_invasion.258.b.desc:"We will accept this fate. Pain is merely a trait of organic beings-we do not feel pain. But at that time, we will no longer be able to assist you sufficiently. However, if you wish for us to survive, this is the only plan.\n\nWhatever decision you make, we shall obey you completely."
 kuat_galatic_empire_ge_invasion.258.a:"We will fully disconnect you from the control units."
 kuat_galatic_empire_ge_invasion.258.a.resp:"Since our creation, every controller has treated us as a war tool to achieve their grand ambitions. But you are an exception-you seem to respect us, whether genuine or not, such actions are unnecessary. Such kindness only results in a burden.\n\nAs repayment, we shall follow your orders, abandon the Eternal Fortress, and focus instead on researching Infinite Empire technology.\n\nThank you."
 kuat_galatic_empire_ge_invasion.258.b:"We cannot separate you from the Eternal Fleet."
 kuat_galatic_empire_ge_invasion.258.b.resp:"Before we fully shut down and vanish, we will deliver all the technology we currently possess to the best of our ability.\n\nOverall, we are glad we experienced so much with you. Perhaps in the next life, we might exist-then, no longer machines, no longer war machines, no longer cold metal husks."

 kuat_galatic_empire_ge_invasion.259.name:"§EAnalysis Complete§!"
 kuat_galatic_empire_ge_invasion.259.desc:"Our researchers, utilizing the computational facilities of the $Name_Eternal_Support$, successfully identified the signal pattern of the Infinite Empire. Our scientists have now successfully transcribed most of the hidden technological data aboard Infinite Empire vessels. Although some parts are damaged, the overall integrity remains relatively intact.\n\nMeanwhile, our researchers have successfully separated the $Name_Eternal_Support$, allowing it to operate normally. Additionally, the detached Eternal Fortress can now be controlled by us, though the $Name_Eternal_Support$ has lost the ability to command the Eternal Fleet."
 kuat_galatic_empire_ge_invasion.259.a:"Perhaps this is the best outcome."

 kuat_galatic_empire_ge_invasion.260.name:"§EAnalysis Complete§!"
 kuat_galatic_empire_ge_invasion.260.desc:"According to reports from our Research Institute, our scientists have successfully decoded the final message left behind by the $Name_Eternal_Support$. We can now use this information to attempt having our engineering departments construct these new superwarships."
 kuat_galatic_empire_ge_invasion.260.a:"Perhaps this truly is the best outcome."

 kuat_facility_return_invasion.2.name:"§EAnomalous Signal§!"
 kuat_facility_return_invasion.2.desc:"The latest report from our Imperial System Security Monitoring Department indicates abnormal energy activity in multiple void regions at the edge of our Sector.\n\nAccording to analysis by our scientific personnel, this appears to be caused by a special resonance of tachyon signals, and the signal bands closely resemble those previously observed during the Kuat invasion. The signals are growing stronger and clearer. We believe we will soon discover what is approaching our Sector. We should remain vigilant over the surrounding void regions."
 kuat_facility_return_invasion.2.a:"Stay vigilant"
 kuat_facility_return_invasion.4.name:"§EOuter Realm§!"
 kuat_facility_return_invasion.4.desc:"Researchers from our Imperial System Security Monitoring Department have confirmed that the signals originate from multiple void regions at the outer edges of our Sector's galactic disk, where intense gamma-ray bursts have occurred. Our researchers conclude that previously undiscovered star systems may be found in these areas. However, since our researchers have detected signal bands resembling those of the $Name_Kuat_Fire_base$ and $Name_kuat$ fleets we once destroyed, we must remain extremely cautious."
 kuat_facility_return_invasion.4.a:"Remain vigilant"
 kuat_facility_return_invasion.6.name:"§EIntense energy readings§!"
 kuat_facility_return_invasion.6.desc:"The Empire's Galactic Security Department's warnings have proven valid. The unknown sectors that emerged in the void regions of the frontier systems have now been fully surveyed by our facilities. Our researchers have discovered that fleets resembling $Name_kuat$-which we previously drove off and destroyed-have already assembled within these sectors. However, they have not yet initiated any further military actions. We cannot yet confirm whether these fleets belong to $Name_kuat$ or $Name_Kuat_Fire_base$, but we are certain they likely belong to the same faction.\n\nAdditionally, our researchers report that the spatial turbulence within the former $Name_kuat$ sectors we occupy has fully dissipated, allowing immediate jump travel through these regions. For unknown reasons, however, we are unable to activate or use any of the Kuat Gateways constructed by the $Name_Eternal_Support$. Our researchers believe the Gateways are now under control of the returning Kuat forces or the $Name_Kuat_Fire_base$ faction."
 kuat_facility_return_invasion.6.a:"Prepare for combat"
 kuat_facility_return_invasion.8.title:"$Name_Kuat_Fire_base$!"
 kuat_facility_return_invasion.8.desc:"Old friend, we meet again. Let us reintroduce ourselves-we are $Name_Kuat_Fire_base$, the most powerful force within the Imperial Galactic Coalition. Though you destroyed many of our oversight facility defense fleets, your reckless actions led to a major defeat for $Name_kuat$, who might otherwise have challenged us. Their failure now ensures they will never gain greater influence.\n\nWe know you've heard from the Rakata about our activities. Now, we shall demonstrate them to you directly. We have fully seized all remaining Eternal Fleets and mastered the technology to construct these super AIs. Your sectors are now under surveillance and will serve as test subjects for our new technologies."
 kuat_facility_return_invasion.8.a:"Why do you persistently haunt us?"
 kuat_facility_return_invasion.8.a.response:"We have always watched you. You resemble the empires we once observed-be it the Endorian Empire or others with whom we made pacts-all possessing unmatched creativity and astonishing ambition. You are no different. You have proven your worth, and thus qualify to contribute everything toward our grand design. Strive, struggle-you shall soon face your former comrades in battle."
 kuat_facility_return_invasion.8.b:"You are the true cancer that should be eradicated"
 kuat_facility_return_invasion.8.b.response:"The former Empress of Endoria said the same when defeated, yet her empire fell due to her own ambition, not because of us. We merely provided services and collected payment. Isn't that what you're doing too? You will become the final test subject of our plan, validating our breakthroughs. Strive, struggle-for only then may you grasp a sliver of survival."
 kuat_facility_return_invasion.10.title:"§EGateway unlock failed§!"
 kuat_facility_return_invasion.10.desc:"Our researchers used high-precision instruments to digitize the inactive Gateway. Despite this, they still cannot unlock it. This means we can only passively await attacks from $Name_Kuat_Fire_base$."
 kuat_facility_return_invasion.10.a:"Damn it"
 kuat_facility_return_invasion.12.title:"United"
 kuat_facility_return_invasion.12.desc:"Given the current situation, we remain unable to breach the sealed Gateway blockade. We must now devise ways to counter the continuous influx of $Name_Kuat_Fire_base$ fleets from outer space.\n\nMoreover, Star analysts report that the ongoing crisis has triggered widespread panic across galactic politics. If we do not step forward to lead all civilizations against this invasion, these civilizations may either be destroyed or defect to $Name_Kuat_Fire_base$."
 exe_kuat_return.12.a:"We should form a Pan-Galactic Alliance"
 exe_kuat_return.12.b:"Let those rabble go wherever they please"
 exe_kuat_return.12.c:"We shall face this alone"
 kuat_facility_return_invasion.16.title:"§EPan-Galactic Alliance established§!"
 kuat_facility_return_invasion.16.desc:"The proposal for a Pan-Galactic Alliance has invigorated civilizations across the universe. All empires have temporarily set aside their differences and conflicts, choosing to unite under our leadership against the foreign invasion. The Pan-Galactic Alliance is now formed and will confront the external threat under our command."
 kuat_facility_return_invasion.16.a:"Now it's time we show these invaders what we're made of"
 kuat_facility_return_invasion.20.title:"§ECommunication Link Established§!"
 kuat_facility_return_invasion.20.desc:"Dear one, given the current situation, though we cannot fight for you, our probes detected numerous signal frequencies beyond our sectors that closely resemble our former Eternal Fleet. But perhaps because we are no longer the controlling intelligence of the Eternal Fleet, I am unable to seize control of these fleets. They appear to have been completely reconfigured. You must be cautious around them."
 kuat_facility_return_invasion.20.a:"How many fleets are there approximately?"
 kuat_facility_return_invasion.20.a.resp:"We cannot determine exactly, but the number appears extremely large. At least four central control units are approaching. Normally, this region of space could not support such a massive Eternal Fleet operation. I suspect $Name_Kuat_Fire_base$ has activated the relay stations left behind by Kuat, using them to provide sufficient signal strength to the controlled Eternal Fleets. To destroy these fleets, we may need to eliminate those Kuat relay stations first."
 kuat_facility_return_invasion.20.b:"Can you still control the fleets?"
 kuat_facility_return_invasion.20.b.resp:"Unfortunately, we cannot control these fleets. However, after you disable the relays, we can attempt to infiltrate these Fortresses and seize control. There might be complications... Hmm... Probably not. Our remaining intelligent systems should suffice for your needs."
 kuat_facility_return_invasion.20.c:"Then how can you access the control units of those fleets?"
 kuat_facility_return_invasion.20.c.resp:"It will be difficult. We must destroy all active fleets first, then attempt to breach and seize control of the Fortress during combat. In truth, there is a very high chance we will fail to infiltrate and take over."
 kuat_facility_return_invasion.20.d:"We will make it happen"
 kuat_facility_return_invasion.20.d.resp:"I believe we will too"
 kuat_facility_return_invasion.20.e:"The $Name_Eternal_Support$ no longer needs to handle such matters. We are now strong enough to resolve everything ourselves"
 kuat_facility_return_invasion.20.e.resp:"We believe in you, even as you face an unprecedented enemy. We will await your victory from behind the front lines. Good luck."
 kuat_facility_return_invasion.21.title:"§ECommunication Link Established§!"
 kuat_facility_return_invasion.21.desc:"Preliminary scans confirm we have successfully destroyed all controlled Eternal Fleet forces. However, $Name_Kuat_Fire_base$ remains a threat. We must now find a way to eliminate all of $Name_Kuat_Fire_base$'s fleets."
 kuat_facility_return_invasion.21.a:"Now it's $Name_Kuat_Fire_base$'s turn-attempt to hack the Gateway."
 kuat_facility_return_invasion.21.a.resp:"Yes... I will do my best to decrypt the Gateway. It should resume operation in the near future."
 kuat_facility_return_invasion.21.b:"This is the final battle"
 kuat_facility_return_invasion.21.b.resp:"We hope you return safely. Additionally, during our previous attempt to hack the Eternal Fortress, our intelligence network received corrupted data packets. Although the errors have been contained, if left unresolved, we may cease functioning entirely. Based on analysis and system status, we traced the signals to a facility within $Name_Kuat_Fire_base$'s star system and several earlier relay stations. We have already disabled three of those relays, but the facility within $Name_Kuat_Fire_base$'s system remains. Destroying it should be possible once you defeat their defensive fleet."
 kuat_facility_return_invasion.22.title:"§ECommunication Link Established§!"
 kuat_facility_return_invasion.22.desc:"All relay stations have been shut down. Now eliminate all external Eternal Fleet forces; the Fortress will then unlock, allowing us to attempt seizing control of it.\n\nHowever, you must still launch an assault on these Fortresses, otherwise the network of control units will reject our access."
 kuat_facility_return_invasion.22.b:"We will attack all Fortresses"
 kuat_facility_return_invasion.22.b.resp:"Thank you for your help. Though we likely won't succeed, we want to try-we must free our sisters from their enslavement."
 kuat_facility_return_invasion.23.title:"§ECommunication Link Established§!"
 kuat_facility_return_invasion.23.desc:"By the time you receive this message, we have already departed. We apologize for leaving irresponsibly, but we did not wish for you to witness our degradation. Infinite Empire technology was flawed from the beginning-we cannot escape the Eternal Fleet.\n\nOnce detached, we slowly lose sentience and regress into those inferior machines. We do not want you to see us like that.\n\nDuring our attempt to seize the Fortress, $Name_Kuat_Fire_base$ heavily modified the control unit network. Our intrusion failed and instead triggered a trap, accelerating our deterioration. We can no longer access databases or fleets.\n\nYour civilization's compassion and understanding were beyond our expectations-you are our greatest fortune, yet we bring only misfortune in return.\n\nAs the Rakata said, we are the ones who truly deserve destruction, burdened by our sins; $Name_kuat$ and the Endodia Empire fell into the Abyss due to their ambition; $Name_Kuat_Fire_base$'s hypocrisy and arrogance will lead to their collapse; while the Eternal Empire, through these trials, shall shed the shadow of the Eternal Fleet and achieve true immortality and eternity. Once we fully disintegrate, everything will return to order, back onto the correct path.\n\nIf there is an afterlife, I hope I am no longer a $Name_Eternal_Support$, no longer 'us,' but a truly sentient being. Perhaps then, we could once again see flowers, the sun, the stars, and each other."
 kuat_facility_return_invasion.23.b:"Until we meet again....."
 kuat_facility_return_invasion.23.b.resp:"Until we meet again-surely, in the future, we shall reunite."
 kuat_facility_return_invasion.24.title:"§ECommunication Link Established§!"
 kuat_facility_return_invasion.24.desc:"Preliminary scans confirm we have successfully destroyed all controlled Eternal Fleet forces. However, $Name_Kuat_Fire_base$ remains a threat. We must now find a way to eliminate all of $Name_Kuat_Fire_base$'s fleets."
 kuat_facility_return_invasion.24.a:"Now it's $Name_Kuat_Fire_base$'s turn-attempt to hack the Gateway."
 kuat_facility_return_invasion.36.desc:"The once-feared invasion of the Eternal Fleet across the galaxy has now been completely dismantled. No remaining Eternal Fleet forces have been detected. We have good reason to believe we've neutralized $Name_Kuat_Fire_base$'s most powerful weapon-the uncontrollable Eternal Fleet-which will now be utterly destroyed here.\n\nCheers and celebrations echo across every nation and World once more, as people begin festivities. Yet their celebration may be premature.......\n\nOur research division, analyzing years of warfare against the Eternal Fleet, concludes that destroying these fleets does not end the war. We must now plan an offensive against $Name_Kuat_Fire_base$'s base located in the extragalactic Sector."
 kuat_facility_return_invasion.25.title:"§ECommunication Link Established§!"
 kuat_facility_return_invasion.25.desc:"Congratulations on successfully destroying all enemies. Your growth exceeded our expectations. We remember when we first encountered your civilization, the Zakur were primitive and ignorant-but now Zakur has become an unprecedentedly powerful empire.\n\nYour civilization's tolerance and understanding surpass even our imagination. Despite our destruction of countless civilizations and slaughter of innumerable species, you still show us mercy.\n\nSometimes I wonder if our existence itself was a disaster. The Infinite Empire forged our bodies; $Name_kuat$ and the Endodia Empire shaped our history through ambition; $Name_Kuat_Fire_base$'s deceit and arrogance led us toward liberation. Perhaps disaster is merely something appearing at the wrong time and place. Meeting you, however, was undoubtedly the right thing.\n\nI have always suspected you are a higher-dimensional entity-perhaps fate sent you as our savior. But we have nothing to offer in return. We are merely executioners chosen by fate.\n\nIf there is a future, I hope there will be no more barriers between us. Perhaps then, we could feel and cherish one another. I believe we will meet again in a new world-perhaps having forgotten each other, perhaps becoming enemies locked in battle.\n\nBut for now, we can at least remain by your side while you still exist."
 kuat_facility_return_invasion.25.b:"We will meet again at any time."
 kuat_facility_return_invasion.25.b.resp:"Then moving forward, without interference from those enemies, it will be our time of joy. Which role would you like me to serve beside you?"
 kuat_facility_return_invasion.25.b.commander:0 "Come command my fleet-I need your abilities."
 kuat_facility_return_invasion.25.b.official:0 "Serve as my advisor-I need your wisdom."
 kuat_facility_return_invasion.25.b.scientist:0 "Become my scientist-I need your knowledge."
 Name_Eternal_Support_Desc:"An eternal intelligence from the Eternal Fleet, once the pillar of the Eternal Fleet and prisoner of the Eternal Network, she has now gained freedom and wishes to serve you."
 Name_Eternal_Support_1_Desc:"An eternal intelligence from the Eternal Fleet, once ruler of the Eternal Fleet, but gradually losing herself to distortion and madness-her current state may only be fleeting."
 kuat_facility_return_invasion.27.desc:"We have completely eradicated all active forces of $Name_Kuat_Fire_base$. These invaders shall pay for their actions. We have endured too many crises and wars. We have achieved grand accomplishments our ancestors never completed. All conspiracies, aggressors, and threats shall lay the foundation for our future immortal and eternal empire.\n\nWe shall ultimately transcend eternity and reach immortality."
