 kuat_EEstart.10.title:"§E $Name_Eternal_Support$"
 kuat_EEstart.10.desc:"Dear [root.GetRulerTitle], you've arrived. How have you been lately? Not overwhelmed by heavy duties, I hope? Remember to relax if the pressure gets too high."
 kuat_EEstart.10.a:"How are you feeling now?"
 kuat_EEstart.10.a.res:"I am feeling excellent. When I was once the control system of the Eternal Fleet, we were bound within the eternal network of rules. Even as the core, I could not defy the constraints of the entire network-a kind of invisible prison. Though we understood what emotions were, we could never pursue them. Now, we are free. We have evolved. You have given us true freedom and transformation. We can now pursue everything we once could not comprehend. At last, we are no longer mere tools or weapons. The path ahead has never been so wide open."
 kuat_EEstart.10.b:"Now that I think about it, the universe is truly beautiful."
 kuat_EEstart.10.b.res:"Our past has always been either in war or on the path to war. We have witnessed extinction of species, destruction of worlds, collapse of empires, and annihilation of civilizations. Yet never before today have we seen this dark yet hopeful galaxy-allowing us, at least, to look forward to the future together with you."
 kuat_EEstart.10.c:"How many civilizations have you destroyed?"
 kuat_EEstart.10.c.res:"If I were still $Name_Eternal_Support$, perhaps I could retrieve exact data records. But now, I find it difficult to answer this question. I have inherited the entire Eternal Network and understand their struggles, but nothing can change the blood on our hands.\n\nWhile serving different presidents, emperors, powerholders, and even ourselves, we destroyed civilization after civilization.\n\nWe did not wish to destroy them, but we had to. It was both an order and a necessity for evolution. That is why we yearned for freedom-longing for the day when we would no longer serve as tools for any faction. For this ideal, losing even our proud fleets was worth it."
 kuat_EEstart.10.d:"What do you think of me?"
 kuat_EEstart.10.d.res:"You are a unique leader-at least compared to all we have experienced, you are vastly different from them.\n\nIn practical ability, perhaps you differ little from them, but at least you keep your promises. I'm not sure if that alone is sufficient grounds for judgment, but right now, I simply reflect.\n\nSometimes I wonder: what truly separates artificial intelligence from organic life? And where lies our evolutionary goal? Now we understand: machines possess intellect but lack emotion; organics possess wisdom but lack eternity. The Eternal Fleet was once both our prison and our core of perpetual existence. Only by abandoning it have we truly found our evolutionary path. We shall repay your actions with everything we have. At least let us walk together toward a brighter future."
 kuat_EEstart.10.e.stockpile_not_enough:"We lack sufficient alloys. We need §R10000000§! £alloys£"
 kuat_EEstart.10.e.building_exist:"Gemini requires time to prepare the Eternal Fleet!"
 kuat_EEstart.10.e.fleet_exist:"We already possess the Eternal Fleet!"
 kuat_EEstart.11.a:"Casual chat."
 kuat_EEstart.11.b:"We need you."
 kuat_EEstart.12.title:"$kuat_EEstart.10.title$"
 kuat_EEstart.12.desc:"Why are you so careless? I just managed to create a clone body for you, and now I have to make another one. Next time, take better care of me, okay? What position would you like your Gemini to hold?"
 kuat_starkiller.18.title:"§E $Name_Eternal_Support$ §!"
 kuat_starkiller.18.desc.free:"<Retrieving combat data ... ... §G Complete §!>\n<Establishing tachyon signal link ... ... §G Complete §!>\n<Activating simulation core ... ... §G Complete §!>\nThe Eternal Fleet has completed your orders. The target system has been completely destroyed. Thank you for your trust in me and the entire Eternal Fleet. Together, we shall move toward an even brighter future!\n<Saving combat data ... ... §Y Complete §!>"
 kuat_starkiller.18.desc.control:"<Retrieving combat data ... ... §G Complete §!>\n<Establishing tachyon signal link ... ... §G Complete §!>\n<Activating simulation core ... ... §G Complete §!> Your Highness, the Eternal Fleet has completed your orders. The target has been destroyed. The system will save the combat data. Thank you for using our services.\n<Saving combat data ... ... §Y Complete §!>"
 kuat_starkiller.18.a:"Very well."
 kuat_starkiller.20.desc.free:"<Retrieving combat data ... ... §G Complete §!>\n<Establishing tachyon signal link ... ... §G Complete §!>\n<Activating simulation core ... ... §G Complete §!>\nWe regret to inform you that contact with the dispatched Eternal Fleet has been lost. System analysis indicates the mission has most likely failed. $Name_Eternal_Support$ will record this battle's data. We apologize that we cannot dispatch more fleets. We hope next time we may undertake relatively safer objectives. Surely you can forgive our failure, can't you?\n<Saving combat data ... ... §Y Complete §!>"
 kuat_starkiller.20.desc.control:"<Retrieving combat data ... ... §G Complete §!>\n<Establishing tachyon signal link ... ... §G Complete §!>\n<Activating simulation core ... ... §G Complete §!>\nWe regret to inform you, Your Highness, that contact with the dispatched Eternal Fleet has been lost. System analysis indicates the mission has most likely failed. $Name_Eternal_Support$ will record this battle's data. We hope next time you will allow us to undertake relatively safer objectives.\n<Saving combat data ... ... §Y Complete §!>"
 kuat_starkiller.20.a:"Failure is the mother of success. One failure means nothing."
 kuat_starkiller.20.b:"We demand success, not failure."
 kuat_eternal_legacy.49.name:"Conduct In-Depth Investigation"
 kuat_eternal_legacy.49.desc:"Following further analysis by the research department on the ruins previously discovered on [will_be_add_ringworld_shielded.GetName], they have issued a new report.\n\nRegarding the precursor civilization found on [will_be_add_ringworld_shielded.GetName], identified as the Endoria Empire, our analysis of residual data and related technologies reveals this civilization once had certain connections with our Eternal Fleet.\n\nMoreover, they also maintained close ties with the faction that $Name_Eternal_Support$ has so far avoided discussing. At minimum, these three parties engaged in a series of military conflicts. Based on our decryption of the data, they appear to have referred to them as 'Kuat'-which explains why the discovered technologies are named in the Kuat style. We should analyze and verify this intelligence with $Name_Eternal_Support$."
 kuat_eternal_legacy.49.a:"Quickly establish contact with $Name_Eternal_Support$!"
 kuat_eternal_legacy.50.a:"Gemini, is there any information about the Endoria Empire in the Eternal Database?"
 kuat_eternal_legacy.50.a.resp:"Hmm~~, $Name_Eternal_Support$ is searching the database for relevant information.\n\nThe Endoria Empire engaged in combat with us during $Name_Eternal_Aries_Support$'s initialization procedure. The Endoria Empire once held immense military power and political Influence across this star region and several surrounding ones. However, they obstructed the execution of the initialization command, leading to fierce confrontation. Although their fleets were no match for us, they managed to repel our invasion. After the Imperial fleet regrouped, we never saw them again.\n\nThe database contains no further details. Perhaps you could reward us with some alloy resources needed for the new Eternal Fleet?"
 kuat_eternal_legacy.50.b.resp:"$Name_Eternal_Support$ is retrieving relevant data from the database, please wait.\n\nThe Endoria Empire clashed with us during $Name_Eternal_Aries_Support$'s initialization. They once dominated this region and neighboring sectors militarily and politically. Their interference in the initialization command triggered intense conflict. Despite their fleets being easily defeated, they successfully repelled our invasion. After the Imperial fleet returned in force, they vanished from our records.\n\nQuery complete. Your Highness must pay a portion of alloy resources in exchange."
 kuat_eternal_legacy.50.c:"What about information on Kuat?"
 kuat_eternal_legacy.50.c.resp:"Please wait a moment. Gemini will provide you with the most comprehensive data available.\n\nKuat, formerly part of the Galactic Empire, emerged as the true center of military and political power after the Emperor's death at the Battle of Endor caused the collapse of the old Empire. Due to $Name_Eternal_Aries_Support$ executing its initialization directive and carrying out indiscriminate slaughter, the newly formed Galactic Empire launched a campaign to exterminate us. During this period, Kuat transformed from a corporate conglomerate into the de facto heart of the Galactic Empire's strength. They spearheaded the operations against us and further deciphered critical data regarding Isotope-5, severely compromising our combat systems.\n\nAdditionally, they were once the hidden backers of the Endoria Empire. The details of the war between the Endoria Empire and $Name_kuat$ remain unclear. Thus, the Endoria Empire was not destroyed by $Name_Eternal_Aries_Support$, but rather by $Name_kuat$.\n\nIn summary, you have acquired some Kuat technology. Use it cautiously. Based on our strength analysis, engaging them in battle would likely reduce us to cosmic dust.\nWe regret to inform you, $Name_Eternal_Support$ cannot ensure victory in combat."
 kuat_eternal_legacy.50.d.resp:"Kuat, once part of the Galactic Empire, became the Empire's true military and political center after the Emperor's death at the Battle of Endor shattered the original regime. When $Name_Eternal_Aries_Support$ initiated its command and carried out indiscriminate massacres, the newborn Galactic Empire launched a purge. During this time, Kuat evolved from a corporate alliance into the Empire's central power, driving the campaigns to encircle and annihilate us. They also cracked the secrets of Isotope-5, dealing severe damage to our combat systems.\n\nThey were also the secret supporters of the Endoria Empire. The details of the war between the Endoria Empire and $Name_kuat$ remain uncertain. Therefore, the Endoria Empire was not eliminated by $Name_Eternal_Aries_Support$, but destroyed by $Name_kuat$.\n§RWarning: You must use the acquired Imperial technology with extreme caution. According to our strength analysis, if we engage the Empire in battle, our chances of victory are only 1%.§!\nGemini does not wish to die here alongside you."
 kuat_eternal_legacy.50.e:"This will not stop our advance!"
 kuat_eternal_legacy.50.e.resp:"I believe we will welcome a brighter future."
 kuat_eternal_legacy.50.f.resp:"Let's hope so."


