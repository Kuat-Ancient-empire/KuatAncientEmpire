 ss_Solarfarm:"§ESolar Farm§!"
 ss_Solarfarm_desc:"Advanced solar farms that convert excess solar energy into power while ensuring crop yields."
 ss_volatile_motes:"§EMote Production Facility§!"
 ss_volatile_motes_desc:"This production facility manufactures an unstable particulate substance."
