 situation_find_infinite_system_type:0 "$situation_find_infinite_system$"
 situation_find_infinite_system_desc:1 "Our scientific team recently succeeded in converting the Rakata coordinate data format into our empire's standard star map storage format, using the $Name_Eternal_Support$'s supercomputing facilities. This means we can now locate the Sectors the Rakata claimed existed.\n\nAccording to related data retrieved from the $Name_Eternal_Support$'s historical database, the target Sector once belonged to $Name_kuat$'s stationed cluster. We hope Kuat has evacuated that Sector, otherwise the cost will be greater.\n\nIn short, additional time and investment will accelerate results, though we can also proceed methodically. Regardless, we must act now."

