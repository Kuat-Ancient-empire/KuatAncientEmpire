        executor_build.804.title:"Fleet usage rights have expired"
        executor_build.804.desc:"The twenty-year term has come to an end."
        executor_build.804.a:"We don't need this fleet anymore!"
        executor_build.808.title:"Warning"
        executor_build.808.desc:"Your actions have completely violated our mutual assistance agreement. We have issued multiple protests and warnings, yet you persist stubbornly. Since you so wish to follow in the footsteps of your ancestors, we shall oblige you. You will be recognized as our enemy-you are §Rplaying with fire!§!"
        executor_build.808.a:"So what?"
        executor_build.8010.title:0 "Warning"
        executor_build.8010.desc:0 "Due to your previous actions, we hereby notify you: the Council will reevaluate whether continuing our mutual assistance agreement is necessary. Meanwhile, we will readjust our strategic posture toward you within the next 2 to 4 years."
        executor_build.8010.a:0 "§RWhat?§!"
        executor_build.8010.b:"§GWait, let's keep peace.§!"
        executor_build.8011.title:0 "Warning"
        executor_build.8011.desc:0 "According to the 'Decision on the Feasibility of the Treaty of Civilizational Mutual Assistance and Friendship and the Necessity of Military Mobilization,' passed by the Premier Committee of $Name_Kuat_Fire_base$ and the Joint Parliament of $Name_kuat$, you are hereby recognized as a terrorist civilization. Diplomatic channels will be fully closed, and we will deploy fleets to conduct comprehensive strikes against your facilities and regime."
        executor_build.8011.a:0 "Then bring it on!"
        executor_build.8012.title:0 "Communication Request"
        executor_build.8012.desc:0 "According to the 'Feasibility Report on the Treaty of Civilizational Mutual Assistance and Friendship' passed by the Premier Committee of $Name_Kuat_Fire_base$ and the Joint Parliament of $Name_kuat$, your actions have safeguarded $Name_kuat$'s interests in stellar region S-1919810415411-114. We now recognize that you have not violated relevant treaties. Military mobilization has ceased. You only need to transfer control of the facility star system.\n\nBased on the requirements of the 'Feasibility Report on the Treaty of Civilizational Mutual Assistance and Friendship,' upon completion of the tasks we will issue next, you will be permitted to assist us in logistical support operations for the frontline fleet."
        executor_build.8012.a:0 "What? Work?"
        executor_build.8013.title:0 "Communication Request"
        executor_build.8013.desc:0 "Very good, you have quickly shown us the future of our cooperation. We have completed the related closing work. Next, we will fully commit to maintaining logistical support for the frontline fleets. At that time, we will require your participation in joint development projects with our research department. Cooperation happy."
        executor_build.8013.a:0 "Cooperation happy."
        executor_build.802.trading:"Trade."
        executor_build.802.trading.a:"Thank you for your support. Thank you for your patronage."
        executor_build.802.trading_desc:"§RThis will increase $Name_kuat$'s £opinion£ of us.§!"
        need_lower_than_100:"§RTheir £opinion£ of us must be below 1000.§!"
        need_5000_alloys:"§R5000 Energy Credits required.§!"
        opinion_mutual_threat_kuat_fleet:"Attacked our outpost"
        opinion_kuat_buy_op_ship_credit:"Trade"
        exe_invasion.1004.desc:"Honorable leader, welcome to this mod. Due to the extensive content, we will introduce the relevant mechanics. Please review them carefully."
        exe_invasion.1004.1.desc:0 "Flagship Mechanism: Under normal circumstances, ensure that §Reach fleet has exactly one flagship (a flagship is any restricted-number constructed StarDreadnought). Each fleet must have only one§!. This mechanism grants mod ships a daily high-intensity healing bonus of 3–9 days when fighting non-mod units, depending on flagship type.\n\nWhen facing Eternal or $Name_kuat$-series fleets, the Flagship Mechanism grants your fleet resistance against damage suppression from Eternal fleets, allowing your fleet to deal 1%–75% damage. Additionally, all mod ships remain protected as long as the flagship survives (though it cannot resist event-based kills or instant high-damage attacks). Non-mod units receive a 100% cumulative cyclic bonus and 100% total damage bonus for the corresponding duration.\n\nSupplementary Mechanism: Support ships serve as auxiliary flagships within fleets. These vessels increase the flagship's total bonus by 10–25%. They typically operate in a 1+2 configuration. Support flagships include §YBalletor $X308_Balletor$, Titan-class $X308_Balletor$, and Tyrant-class $X308_Balletor$.§!"
        exe_invasion.1004.2.desc:0 "Dynamic Modifiers Mechanism: You can adjust this via start settings and choose whether to enable it at any time. This core mechanism affects all combat units of factions in this mod and consists of two main parts and one supplementary part:\nPart One – Self-Protection: Grants Eternal Fleet series, $Name_kuat$ series, $Name_Kuat_Fire_base$ series, and Infinite Empire series factions resistance against any strong aura suppression effects, meaning they are unaffected by aura modifiers.\n\nPart Two – Mechanism Safeguard: Applies to the player and is used by the Eternal Fleet series, Infinite Empire series, $Name_kuat$ series, and Guardian series. The Eternal Fleet portion is the most critical component of this mod. This mechanism ensures the full functionality of the flagship system and the combat effectiveness of the Eternal Fleets.\n\nFinally, Supply Zones enhance flagship effects while reducing Dynamic Modifier functionality. This mechanism primarily activates around Eternal Fortresses and Citadels (encouraging local defensive operations). Effects include:\n1. Supply Zones increase supply limits within their range. Within this limit, Supercapital fleets gain a 600% cyclic bonus, standard 1+2 flagships gain 300%, and single flagships gain 100%. Output beyond the limit drops to base flagship levels.\n2. Supply Zones allow flagship fleets to reload combat energy. After reloading, a flagship fleet can engage in up to four battles outside Supply Zones, losing 25% of its total cyclic bonus per engagement. Reloading completes within 60 days upon returning to a Supply Zone."
        exe_invasion.1004.3.desc:0 "Event Effects: Primarily used by the Infinite Empire series, $Name_kuat$ series, and Guardian series. Special Event Mechanics function as random combat events, with different effects per faction.\n\nThe Infinite Empire has kill regeneration capability. Wandering Defender Fleets have duplication ability. The $Name_kuat$ series can randomly reduce enemy ship cyclic damage for short durations. Guardians function similarly to $Name_kuat$."
        exe_invasion.1004.4.desc:0 "Safeguard Mechanism Section: This primarily supports Eternal Fleets and the Infinite Empire. The Safeguard Mechanism stabilizes event conclusion detection and enables abnormal restarts-such as re-triggering an Eternal Fleet invasion crisis if forcibly interrupted. This mechanism plays a vital role in ensuring stable mod event operation."
        exe_invasion.1004.A.1:0 "What is the Flagship Mechanism?"
        exe_invasion.1004.A.2:0 "What is Dynamic Modifiers?"
        exe_invasion.1004.A.3:0 "What are Special Effects?"
        exe_invasion.1004.A.4:0 "What is the Safeguard Mechanism?"
        exe_invasion.1004.A:"Meow meow meow?"
        exe_invasion.1004.B:"I understand now!"

      kuat_lagacy_9:"§EMysterious Cave"
      Kuat_structure_9:"This World exhibits some unusual characteristics. Our technology cannot pinpoint the exact source of the signals. A deep tunnel at the bottom of a glacial rift valley might hold surprising discoveries. Regardless, our research department recommends establishing a research base near the tunnel to investigate further."
      executor_build.23.name:"§EAnomalous Signal"
      executor_build.23.desc:"Our research department's newly developed sensors have detected unusual signals. Recent investigations indicate the signal originates from a deep tunnel at the bottom of a glacial rift on a World. Scientists believe the valley formed naturally through glacial erosion.\n\nHowever, deeper scans reveal a massive, geometrically regular cavity at the tunnel's end, likely the signal source according to sensor data.\n\nLatest scans strongly suggest this cavity emits the signals our sensors detected. To determine whether this is a rare geological phenomenon causing magnetic resonance or something unknown, our research department recommends establishing a research base near the tunnel for further investigation."
      executor_build.23.a:"Execute Immediately"
      executor_build.30.title:"§EDeeper Underground"
      executor_build.30.desc:"Our research team's recent comprehensive geological scan of this World confirms earlier findings: a deep tunnel was discovered at the bottom of a glacial rift, as previously detected.\n\nWhile the tunnel appears to be a natural result of glacial erosion, deeper scans confirm our prior discovery-a massive, geometrically regular cavity at its end.\n\nOn-site surveys by our scientists strongly support our earlier hypothesis: this cavity likely contains additional objects. To determine whether this is a rare geological wonder or evidence of unknown entities, our research team urges following the research department's recommendation to establish a research base near the tunnel for thorough investigation."
      executor_build.30.a:"Alright, executing immediately"
      executor_build.31.title:"§E Inward Excavation"
      executor_build.31.desc:"Our scientists have successfully reached the end of the tunnel using our newest model of underground drill. However, unlike the vast cavity or artificial basement we expected, there was nothing at the tunnel's end-only a rudimentary signal transmitter, even after continuing to bore toward the signal source.\n\nJust as our scientists were losing hope and beginning to think it was all just a farce by some utterly bored alien, an intern science officer accompanying the expedition proposed a bold hypothesis:\n\nCould there be similar signal sources elsewhere on the planet? Was this merely a puzzle set by some unknown entity for outsiders? On a trial basis, our research team conducted a thorough search across the entire World for similar signal frequencies. The result: we discovered two other identical signals at comparable depths, with the three signal sources forming a perfect equilateral triangle.\n\nJudging from the transmission directions of the three signals, could something lie at the triangle's center? With nothing to lose, our research team relocated directly above the triangle's midpoint and began a new round of excavation. This will take some time to yield results."
      executor_build.31.a:"Worth a try"
      executor_build.32.title:"§E Depths of the Core"
      executor_build.32.desc:"Sure enough, this excavation yielded rich results: our team successfully reached the entrance of a massive underground structure. The gate is made of some kind of space-grade alloy used in starship construction, its surface devoid of any ornamentation or mechanisms, uncorroded, save for a line of mysterious alien script carved at its center. Analysis of cut samples suggests this gate may have existed for tens of thousands of years-or even longer.\n\nRegrettably, in order to uncover the secrets behind the gate, the accompanying engineering team installed cutting equipment and sawed an entry large enough for heavy scientific apparatus, then deployed drones inside. Initial drone scans indicate the interior space is immense, filled with various mysterious electronic devices. Strangely, most of these systems are either powered down or damaged, with only a giant columnar structure at the facility's center and emergency green lighting scattered throughout still operational.\n\nFurther exploration is undoubtedly necessary. We've also discovered numerous branching chambers within the artificial structure, along with many deactivated or slightly damaged electronic instruments. Moreover, the central column is highly likely to be the core control hub of the entire underground facility. To fully unravel the mysteries here, we must commit substantial effort and resources to ensure the smooth progress of scientific operations."
      executor_build.32.a:"Send another batch of electronic decryption and recovery equipment down there!"
      executor_build.33.title:"§E Sanctuary"
      executor_build.33.desc:"After conducting a preliminary scan of the underground facility to rule out defensive mechanisms, our researchers swiftly entered and initiated archaeological work, achieving significant progress. Based on the linguistic department's decryption of surviving paper documents and functional computer terminals, we have roughly mastered the language used by the builders of this underground complex, and now understand the meaning of the inscription on the gate: §R Eighth Sanctuary §!.\n\nWith the language deciphered, all subsequent work became much simpler. Data extracted from a storage core found in a chamber resembling a regional management center reveals that the builders belonged to a civilization known as the Endodarian Empire. Having been drawn into a massive war with their situation becoming increasingly dire, this civilization constructed ten permanent sanctuaries in hopes of future revival.\n\nAs one of the later sanctuaries to be completed, this site served multiple functions: a major resource depot, refugee shelter, and an environmental terraforming facility intended for future Gaia transformation of the World. However, according to administrative texts on the core, the sanctuary's orderly occupation plan was abruptly halted due to some extremely mysterious reason. All subsequent related data has been deliberately erased and is irrecoverable.\n\nAlongside these precious records, the species and nation names of this race, as well as all detailed information about their imperial history, have also been purged.\n\nTo learn what truly happened to this empire, decrypting the heavily secured central hub is absolutely essential."
      executor_build.33.a:"Proceed without hesitation"
      executor_build.34.title:"§E Arcane Deconstruction"
      executor_build.34.desc:"Aside from the central mainframe, we have collected and analyzed all remaining paper manuscripts and every electronic terminal that remains functional or only slightly damaged. While we have already gained much from these, truly unlocking the mystery of the Eighth Sanctuary requires understanding what lies stored within the central mainframe located at the heart of the facility.\n\nIf cracking the other computers in the facility was difficult, decrypting and analyzing the central mainframe was nothing short of monumental-so much so that our researchers one time doubted whether this eerie green-glowing metal pillar was completely locked down. Finally, after countless days and nights of grueling effort, our decryption work achieved a critical breakthrough, and partial access to the central data repository was granted.\n\nYet, when we eagerly began reviewing the unlocked sections of the database, we found only vast stretches of severely corrupted data files. Humanistic documents were entirely destroyed without exception, while technological records retained only those matching or slightly surpassing our current level of advancement.\n\nOur data analysts speculate that, to prevent their final legacy from falling into hostile hands, the civilization likely implemented a data destruction protocol designed to ensure no successor state would follow in their doomed footsteps.\n\nReluctantly, to recover all potentially surviving data and gain full control over the facility, our decryption efforts must continue. Judging from the expression on the data analyst's face upon hearing this decision, it won't be easy."
      executor_build.34.a:"Unlock it"
      executor_build.35.title:"§E Tracing the Source"
      executor_build.35.desc:"Although our decryption efforts haven't led to a qualitative leap in our existing technology, we must press forward to fully master this invaluable facility. As experience accumulates, our decryption team is gradually accelerating. The entire computational process is expected to improve accordingly. Finally, with the last data module fully cracked, we have obtained complete access to the facility.\n\nAs previously anticipated, the vast archives of technological data meant for imperial revival were largely destroyed during the anti-decryption process by the central computer, with only fragments marginally ahead of our current tech remaining. All humanistic and administrative records-except for a few file sets that somehow escaped deletion, possibly due to oversight or other reasons-have been wiped clean, leaving not a single trace.\n\nDisappointed, our researchers began examining these lucky survivors. As expected, aside from a few simple files summarizing the empire's historical context, most others were merely operational manuals and documentation related to the sanctuary's function.\n\nNevertheless, we did make some discoveries. According to our decryption of a document titled \"§R<error>§! Sanctuary Intelligence Overview,\" a special sanctuary codenamed \"Divergent Path\" contains top-secret technology related to a certain type of Gateway. Alongside this intelligence, the exact coordinates of this facility were recorded. Fortunately, we successfully identified the hyperlane leading to this location, and initial Sector scanning has already been updated on the star map.\n\nAdditionally, with full control of the facility now established, all stored resources are available for our use. Simultaneously, the moment we unlocked full access to the central computer, terraforming processes for the entire World automatically initiated-results should manifest shortly."
      executor_build.35.a:"Judging by the outcome, we haven't completely failed. Head to those coordinates"

      kuat_lagacy_10:"§E Hidden Data Repository§!"
      Kuat_structure_10:"We have successfully pinpointed the location of the sanctuary named \"Divergent Path\" and have preliminarily surveyed the planetary conditions. Now, we must immediately dispatch a team to ensure our archaeological operation proceeds without complications."
      executor_build.36.name:"§E The Hidden Sanctuary§!"
      executor_build.36.desc:"We successfully located this previously undiscovered Sector using the coordinates found on the earlier World. The moment [dig_archetectrue_leader.GetName] attempted to scan the Sector, their view was obscured by a sky-darkening field of space debris. [dig_archetectrue_leader.GetName] reported that, judging from intercepted fragments, these ruins have likely existed far longer than we can imagine.\n\nAfter barely carving a narrow path through the wreckage, a small Science Ship was dispatched into orbit to scan the planetary surface. On the surface, the World appears unremarkable, blanketed in thick ice and snow. However, our signal detectors clearly picked up the same frequency emanating from beneath the surface-identical to the signals from the previous World. This confirms we've found the right place."
      executor_build.36.a:"Immediately dispatch our most elite team!"
      executor_build.37.title:"§E Gates of Steel§!"
      executor_build.37.desc:"Using the coordinates discovered earlier, we successfully located this previously unknown Sector. The moment our scientist entered the Sector, their view was obscured by a sky-darkening field of space debris. Our research team reported that, judging from intercepted fragments, these ruins have likely existed far longer than we can imagine.\n\nAfter clearing part of the orbital debris with heavy engineering vessels and opening a navigable path, our expedition team finally arrived at the sanctuary codenamed \"Divergent Path,\" as recorded in the core archives of the Eighth Sanctuary. However, unlike the previous sanctuary, this one features extremely high security. Aside from the automated defense systems encountered en route, the sanctuary's gate is exceptionally sturdy and locked by complex protocols.\n\nBased on comprehensive analysis of the gate's material composition and intensity, it is absolutely impossible for our current technology to breach it without causing severe damage. Attempting to destroy the entire gate with heavy weaponry or high-yield explosives risks collapsing the entire underground sanctuary structure."
      executor_build.37.a:"We must find a way to safely enter the facility without damaging its internal structure."
      executor_build.38.title:"§E A Scene of Chaos§!"
      executor_build.38.desc:"Upon arrival, our researchers immediately commenced operations. After relentless day-and-night efforts, we finally cracked the gate's security lock this morning and opened a passage into the facility.\n\nAs per protocol, our expedition team deployed a squad of scanning drones to gather basic information about this artificial structure-but the results were astonishing. Rather than a sanctuary, the scans suggest this is more akin to a data storage facility: numerous powered-down servers are haphazardly arranged in the main chamber, with damaged data terminals scattered throughout the corners. Even the chambers meant for storing supplies are piled high with various data storage devices. Like the previous sanctuary, a cylindrical central mainframe stands operational at the facility's heart. Preliminary scans show the entire facility is extremely disordered, with parts strewn across the floor and documents scattered everywhere-clear evidence of a panicked evacuation by the last Stay personnel.\n\nOur team has entered the facility and begun attempting to restore minor access ports."
      executor_build.38.a:"I hope this isn't just a junkyard"
      executor_build.39.title:"§E Data Defragmentation§!"
      executor_build.39.desc:"Thanks to the computer team's efforts, we've successfully restored several data terminals with minor damage. Yet, as with all previous terminals, every piece of data related to the Endodarian Empire's cultural and historical records has been completely erased, leaving only fragmented references to the great war that may have engulfed the entire galaxy.\n\nAccording to recovered data, the \"Divergent Path\" data vault was originally built as the final sanctuary. As the last of its kind, the Endodarian Empire invested incalculable manpower and resources into it, successfully transforming it into a paradise using advanced nanotechnology.\n\nHowever, as the empire's war situation worsened, a directive from the highest leadership ordered the mass withdrawal of stored resources and personnel. In their place, vast arrays of data storage terminals and server banks were transferred here in bulk. After undergoing \"security processing,\" the final Stay personnel evacuated, sealed the facility, and detonated a weather weapon before departure, turning the paradise back into a frozen hell.\n\nSubsequently, all records related to this site were erased, leaving only the summary in the Eighth Sanctuary. Our scientific team is now attempting to restore the server arrays in the main hall, hoping some residual data remains."
      executor_build.39.a:"Only one way to find out"
      executor_build.40.title:"§E Empty Handed§!"
      executor_build.40.desc:"Due to minimal server damage and lack of complex encryption, our computer team has successfully restored the vast majority of local server banks. All ports capable of booting up are now online and operational.\n\nJust as our data analysts rejoiced and connected to the local network to assess the overall status, they discovered that most documents on these servers were severely corrupted. No matter how hard our engineers tried to repair them, the files contained nothing but endless lines of garbled code. Some suspect this is a security safeguard mechanism and attempted to run unlock protocols, but to no avail.\n\nNow, our helpless data team is performing further processing on these files, hoping to extract something useful."
      executor_build.40.a:"Is this what they call emotional whiplash?"
      executor_build.41.title:"§E Undermining the Foundation§!"
      executor_build.41.desc:"Unfortunately, all attempts to recover server data have failed without exception. Our data specialists speculate that either the files were completely destroyed before the Endodarian Stay personnel evacuated, or they were encrypted using some form of Computing technology beyond our current understanding. Either way, with our present computational capabilities, recovery is impossible.\n\nAfter hitting a dead end with these server banks, our team has turned attention to the central mainframe. Perhaps it holds the answers we seek. However, given the difficulty of decoding the mainframe, we must commit greater resources and time-and prepare for the worst. Our chief physicist estimates it may take months, if not years, to fully unlock the facility unless we achieve a major breakthrough in computing technology.\n\nAdditionally, after transferring and clearing files we cannot currently process, some idle servers and computers in the main hall-with their exceptional computational performance-can now assist in offloading our calculation burden. With these inherited facilities, our computational speed may slightly exceed previous estimates."
      executor_build.41.a:"Continue working"
      executor_build.42.title:"§E Brainstorm§!"
      executor_build.42.desc:"Unsurprisingly, the encryption on this central mainframe is extremely complex. Yet, to everyone's bemusement, whether due to some precursor's prank or a test, the simplest way to obtain the highest administrative access turns out to be solving a series of intricate puzzles! The questions span a wide range-from complex mathematical functions and physics problems to intricate logic puzzles. Some even touch upon advanced fields we are currently researching or have yet to explore, closely tied to bottlenecks in knowledge and research.\n\nOur chief physicist stated that if we refuse to solve the puzzles and attempt brute-force decryption, the facility will remain sealed. With no alternative, we hastily devised a prize-based game, converting all questions into gameplay elements to rally the nation's brightest minds without leaking sensitive information.\n\nIt is said that [leader.GetName], during a break after solving one such puzzle, once complained to the team: 'Feels like I'm back in school-painful, yet strangely satisfying.'"
      executor_build.42.a:"No moles-let's see what puzzles we've got"
      executor_build.43.title:"§E The Puzzle Unraveled§!"
      executor_build.43.desc:"Ultimately, with the assistance of talented individuals across the nation, we successfully answered seventy percent of the questions. The remaining unsolved questions were all copied down to guide our future research. For some reason, the central computer did not prevent our copying.\n\nAfter fully obtaining access, we discovered within a folder in the database all descriptions related to the \"Gateway\", as well as instructions on how to unlock it. This so-called \"Gateway\" is precisely the mysterious ring-shaped structure we previously discovered during Star exploration. The files mention that this portal was constructed by the faction known as $Name_Kuat_Fire_base$, yet was used and locked by $Name_kuat$ using an extremely complex special code. However, during a certain war, the once-powerful empire discovered the method to unlock the Gateway from a data facility and recorded and preserved it. During the great war, as the Endordia Empire's strength rapidly declined and battlefield conditions grew increasingly unfavorable, at a critical moment-knowing their empire would ultimately be destroyed-the imperial leadership permanently stored this secret within this final and most confidential sanctuary, preserving all knowledge that might assist future generations.\n\nThe archive concludes with:\n\n\"Stranger who has fatefully discovered this place, we hope you learn from our mistakes and do not follow our misguided path. The key to open the door is here; everything beyond is for you to explore.\""
      executor_build.43.a:"disturbing"
      exe_enable_kuat_stargate:"#E Send tachyon signal§!"
      exe_enable_kuat_stargate_DESC:"Based on data we previously collected, this ancient Gateway operates via special tachyon signal resonance, meaning we can reactivate the Gateway by transmitting a tachyon signal at a specific frequency. What awaits us on the other side?"
      executor_build.44.name:"Scan complete"
      executor_build.44.desc:"Our recent survey of [From.GetName]'s star system has concluded. The system is littered with shattered debris orbiting the star. Some fragments, upon analysis, appear to be remnants of ships with unique structural designs. These shipwrecks bear unusual national insignias. Influenced by the star's mass and gravitational pull from surrounding celestial bodies, the debris has formed a vast debris field across the system, posing challenges to our navigation and investigation.\n\nAdditionally, there is an unusual Gateway within this system. Its design matches almost exactly the technical records obtained from two ancient ruins we previously excavated. We are certain this is the same Gateway described in ancient records. Using the specific-frequency tachyon signal resonance documented in those ruins, we can unlock this Gateway. On the other side appears to be the gateway to the $Name_kuat$ Sector. Regardless, we should try."
      executor_build.44.a:"We should try"
      executor_build.45.title:"Research complete"
      executor_build.45.desc:"Our tachyon signal resonance has been sent. Now we wait for the Gateway's response. If successful, it means we will open a door to a world we have never known."
      executor_build.45.a:"Truly exciting"
      executor_build.46.title:"Gateway activated"
      executor_build.46.desc:"Tachyon signal frequency normal. All $Name_kuat$ jump Gateways currently located within the galaxy have fully activated. The galactic balance will be completely disrupted. A new storm is coming."
      executor_build.46.a:"We will prepare ourselves."
      executor_build.47.name:"$executor_build.44.name$"
      executor_build.47.desc:"Although the star systems under our current control do not contain the peculiar Gateway we seek, our researchers have identified a foreign star system. Our investigation reveals that the system is filled with fragmented debris orbiting the star. Some debris, upon analysis, appears to be remnants of uniquely structured vessels bearing strange national insignias. Influenced by the star's gravity and surrounding celestial bodies, the wreckage has formed a massive debris zone throughout the system, which will hinder our future navigation and surveys.\n\nAdditionally, there is an unusual Gateway in this system. Its design matches almost exactly the technical data obtained from two previously excavated ancient ruins. We are certain this is the same Gateway mentioned in ancient records. Using the specific-frequency tachyon signal resonance documented in those ruins, we can unlock this Gateway. On the other side appears to be the gateway to the $Name_kuat$ Sector. Regardless, we should try."
      executor_build.47.a:"$executor_build.44.a$"
      executor_build.801.a:"WARNING: Source localization entry is incomplete"

      executor_build_op_a.a:"What a regretful and sorrowful story."
      executor_build.11.title:"The Lost Empire"
      executor_build.11.desc:"I didn't expect you would still find the facilities of the Endordia Empire. Endordia was once a glorious empire. Throughout our thousands of years of observation, they brought great prosperity to this small galaxy during their long and tragic history of folly.\n\nBut their flame extinguished just as they reached their peak. So too did Endordia. Their military oppression over neighboring minor nations grew increasingly harsh, leading inevitably to conflict. The Endordia Empire ultimately fell to enemies they once scorned. Perhaps their demise can serve as a lesson to your young civilization. You still do not understand the immense darkness hidden within the vast starry expanse.\n\nI hope you do not become the next one. You are already far too arrogant."

      executor_build.901.title:"The Cost"
      executor_build.901.desc:"Very well. You have successfully constructed our technological masterpiece-the Executor. Though we do not know how you acquired its construction technology, since you have obtained it and now built her without our consent, you must pay a price.\n\nWe will collect 50% of your stored Energy Credits every 10 years for 20 years. Thank you for your understanding."
      executor_build.901.a:"Give it to them, damn it."
      executor_build.901.b:"Why? It's ours! Why should we give it to them?"
      opinion_kuat_shipc_can_not_get:"They rejected us"
      opinion_kuat_new_parit_finish:"Diplomatic friction"
      opinion_kuat_new_parit_finish_1:"Something to look forward to"
      executor_build.902.desc:"The five-year term has ended. $Name_kuat$ has withdrawn half of the current Energy Credits from our Star bank account."

      executor_build.601.title:"Declare War"
      executor_build.601.desc:"You will §Rpay the price§! for your actions!"
      executor_build.601.a:"§RThat's something we should be saying!"

