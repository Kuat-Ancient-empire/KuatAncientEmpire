    kuat_extramonster.32.name:0 "Data Collection Complete"
    kuat_extramonster.32.1.desc:0 "Our scientific team has successfully extracted crucial clues regarding the suppression of Caroline Singularity transmutation from the first batch of $Name_Kuat_Contractor$ fleets. We can now confirm that after $Name_Kuat_Contractor$ injects its unique element, the matter ejection characteristics of the Caroline Singularity can provide sufficient energy for $Name_Kuat_Contractor$ fleets to intervene in reality, linking the Abyss and reality. However, this support is unidirectional-returning it to the star will cause irreversible effects.\n\nTherefore, we only need to utilize the unique element from $Name_Kuat_Contractor$ fleets and re-inject it into the matter-ejecting Caroline Singularity. This will trigger reverse transformation of the transmuting Caroline Singularity, causing it to collapse with tremendous energy release.\n\nPerhaps it is time we act."
    kuat_extramonster.32.2.desc:0 "Our scientific team has extracted enough unique elements from the second batch of $Name_Kuat_Contractor$ fleets to suppress one transmuting Caroline Singularity. If all goes well, our research team can begin operations to suppress Caroline Singularity transmutation shortly.\n\nAdditionally, scientists have discovered that the existence form of these $Name_Kuat_Contractor$ may bear significant similarities to the $Name_Kuat_StarContractor$ we previously encountered, though no further information is currently available."
    kuat_extramonster.32.3.desc:0 "Our research team has extracted enough unique elements from the third batch of $Name_Kuat_Contractor$ fleets to re-suppress a Caroline Singularity currently undergoing transmutation. If all goes well, our research team can proceed with actions to suppress the singularity's transmutation in the near future.\n\nAdditionally, the connection between the troubling $Name_Kuat_Contractor$ and $Name_Kuat_StarContractor$ is beginning to surface. Our scientists have discovered that both exist within a more abstract realm known as the Domain of Vela. We currently have no further information on this."
    kuat_extramonster.32.4.desc:0 "Our research team has extracted enough unique elements from the fourth batch of $Name_Kuat_Contractor$ fleets to re-suppress a Caroline Singularity currently undergoing transmutation. If all goes well, our research team can proceed with actions to suppress the singularity's transmutation in the near future.\n\nFurthermore, our current analysis does not yield much valuable data. However, our scientists have observed a peculiar phenomenon occurring in the AI systems of destroyed $Name_Kuat_Contractor$ ships. After destruction, these AIs continuously repeat an information stream composed of high-frequency particle resonance, as if transmitting some kind of message."
    kuat_extramonster.32.5.desc:0 "Our research team has extracted enough unique elements from the fifth batch of $Name_Kuat_Contractor$ fleets to re-suppress a Caroline Singularity currently undergoing transmutation. If all goes well, our research team can proceed with actions to suppress the singularity's transmutation in the near future.\n\nMoreover, our researchers have successfully decoded the transmitted information streams. However, the data remains fragmented, offering insufficient clues to assist in suppressing the transmuting star. Perhaps it would be better to wait for a full report from our research team."
    kuat_extramonster.32.6.desc:0 "Our research team has extracted enough unique elements from the sixth batch of $Name_Kuat_Contractor$ fleets to re-suppress a Caroline Singularity currently undergoing transmutation. If all goes well, our research team can proceed with actions to suppress the singularity's transmutation in the near future.\n\nIn addition, our researchers have successfully reconstructed the fragmented messages: \"The Jupiter Node of $Name_Kuat_StarContractor$ will end the existence of $Name_Kuat_Contractor$. As long as $Name_Kuat_StarContractor$ is stopped, $Name_Kuat_Contractor$ shall be eternal.\""
    kuat_extramonster.32.7.desc:0 "Our research team has extracted enough unique elements from the $Name_Kuat_Contractor$ fleet to re-suppress a Caroline Singularity currently undergoing transmutation. If all goes well, our research team can proceed with actions to suppress the singularity's transmutation in the near future."
    kuat_extramonster.32.A:0 "It's time to end this!"
  
    sc_kuat_white_hole.1.active:0 "Stellar Transmutation-[kuat_white_hole_system_1.GetName]"
    sc_kuat_white_hole.1.active.desc:0 "Our astronomers have discovered that the central star in [kuat_white_hole_system_1.GetName] has undergone a topological transformation. This type of star now exhibits a new matter ejection pattern, which obstructs further observation. Our military intelligence department believes that such a sensitive timing of stellar transmutation indicates that $Name_Kuat_Contractor$ intends to use it as a means to wage war upon our world.\n\nWe should suppress the ongoing changes in [kuat_white_hole_system_1.GetName]."
    sc_kuat_white_hole.2.active:0 "Stellar Transmutation-[kuat_white_hole_system_2.GetName]"
