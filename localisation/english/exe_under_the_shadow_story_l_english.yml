l_english: 


      ###################
      ## Legacy event ###
      ###################
      kuat_lagacy.100.name:"Strange Signal"
      kuat_lagacy.100.desc:"Our deep-space radar stations have detected a series of anomalous celestial phenomena in the endless void. Experts in relevant fields have begun studying these signals, and we expect a detailed research report to be issued soon."
      kuat_legacy.100.a:"Very well, we will wait."
      kuat_lagacy.101.name:"Report"
      kuat_lagacy.101.4.desc:"Respected leader, I shall now present the findings of this research."
      kuat_lagacy.101.0.desc:"The unusual celestial activity detected by our radar stations exhibits peculiar characteristics. Judging by energy output intensity, it appears to be a chain reaction triggered by supernova events. After analysis, these anomalies display a distinct array-like distribution. Our analyzers have decoded from this pattern a sequence of cosmic coordinates."
      kuat_legacy.101.a:"What do the signals represent?"
      kuat_lagacy.101.1.desc:"Yes, these are several cosmic coordinates. Our team members attempted to locate them and discovered that one set is surprisingly close to our capital. Yet we never detected a hidden Sector in that region before-it's as if it suddenly appeared. Perhaps our sensors previously failed to detect it. We have confirmed the coordinates of one relatively stable star system within this area."
      kuat_legacy.101.b:"Coordinates?"
      kuat_lagacy.101.2.desc:"Indeed, it is strange. This star system appears to have emerged out of nowhere. We are currently using probes to collect remote data. The transmitted data suggests this system was moved here by some external force and has remained hidden under our very eyes for tens of thousands of years. Still, this data alone cannot unravel the system's mysteries. However, we found this system bears a striking resemblance to the previously discovered $Name_A_1$ system-perhaps there is a connection between them."
      kuat_legacy.101.c:"Suddenly appeared?"
      kuat_lagacy.101.3.desc:"We unanimously agree that remote scanning and probing cannot unveil the secrets of this star system. We must dispatch researchers and Science Ships into the system to investigate its hidden truths."
      kuat_legacy.101.d:"So what should we do next?"
      kuat_legacy.101.e:"Then proceed quickly."
      kuat_legacy.102.desc:"§H[Root.GetName]§! arrives at an empty expanse after traversing the hyperlane. This vast emptiness brings an inexplicable sense of oppression and unease to our scientific personnel.\n\nThough not as ravaged as the $Name_A_1$ system, signal readings indicate the central ring belt of this system is already damaged beyond repair. At the system's core stands a bizarrely shaped colossal structure-therein may lie the clues we seek.\n\nWe have not yet conducted further surveys of the system, but we believe its secrets will soon come to light."
      kuat_legacy.102.a:"Begin Investigation"
      kuat_legacy.103.title:"$Name_Kuat_StarContractor$"
      kuat_legacy.103.desc:"Greetings, outsider. We are $Name_Kuat_StarContractor$. We come from the void. We exist within existence. Everyone has several chances. Here, you may use these opportunities to learn about the past, present, and future. The price? For every question you ask, we will randomly absorb a certain number of your Pops. Whether you believe us or not, our doors remain open."
      kuat_legacy.103.a:"Are you playing with me?"
      kuat_legacy.104.0.desc:"You wish to know something, and only a small price is required. For every question you ask, we will randomly absorb a certain number of your Pops."
      kuat_legacy.104.1.desc:"Very well, valued customer, our doors remain open to you-for only a small price. For every question you ask, we will randomly absorb a certain number of your Pops."
      kuat_legacy.104.2.desc:"Returning visitor, is there anything else you wish to know? We trust you are prepared. The cost, you understand."
      kuat_legacy.104.a:"We wish to learn the secret of the Crystal Beacon."
      kuat_legacy.104.a.res:"Ah, the Crystal Beacon. Many seem eager to uncover the Emperor's legacy.\n\nLong ago, a civilization flourished through generations of effort, building a prosperous Star republic. But the Republic did not last. A political upheaval erupted in its capital, reshaping the Republic into an Empire. They began expanding rapidly, seizing control over most of their Sector, and eventually encountered foreign powers already entrenched there.\n\nAfter witnessing the strength of these outsiders, they became proxies, exporting natural resources and manpower in exchange for military and technological support. But when the Emperor made contact with another external power, the Empire secretly infiltrated its original patron-and war broke out. The conflict led to the Empire's total collapse.\n\nFortunately, intervention by the other external power ended the hostilities and preserved fragments of the civilization. Though most survivors forgot their past, those who remembered became part of us.\n\nWe await your next visit."
      kuat_legacy.104.b:"We want to know the secret of $Name_kuat$."
      kuat_legacy.104.b.res:"$Name_kuat$ does not belong here. Their fate shall return to the origin, yet they remain unaware of their situation.\n\n$Name_kuat$ originated as a corporate oligarchy rising after the fragmentation of the Galactic Empire. Based on their shipbuilding industry, they played a key role during the reorganized warlord government's campaign to eliminate the Eternal Fleet. However, lacking the Force, they were disadvantaged compared to $Name_Kuat_Fire_base$, another faction within the Imperial warlord coalition.\n\nTo compete for Influence and control within the parliament and warlord regime, they launched research operations under the guise of eliminating the Eternal Fleet, seeking to master its technology. Yet these actions provoked resistance when encountering various alien empires. As for their future-your presence shall witness it all.\n\nThis is all we shall reveal. We await your next visit."
      kuat_legacy.104.c:"And what of the Eternal Fleet?"
      kuat_legacy.104.c.res:"They are ancient artificial intelligences originating from Yojanci, a major military research center of the Infinite Empire. After developing sapient AI, the Infinite Empire swiftly applied the technology to warfare, creating vast fleets known as the Eternal Fleet.\n\nOnce created, the Eternal Fleet became the most powerful war machines ever known. After the Infinite Empire fell, they passed through many hands, eventually stabilizing the crumbling Galactic Empire under the Emperor's control. Tragically, upon the Emperor's death, the Eternal Fleet lost all restraint and initiated their default protocol: the extermination of all known civilized worlds.\n\nMany terms here may be unclear to you now. Perhaps one day, upon reflection, everything will become clear. We await your next visit."
      kuat_legacy.104.d:"Do you know $Name_Kuat_Fire_base$?"
      kuat_legacy.104.d.res:"$Name_Kuat_Fire_base$ is a warlord oligarchy formed after the collapse of the Galactic Empire. Compared to $Name_kuat$, $Name_Kuat_Fire_base$ represents true Imperial authority. After the Emperor's death, $Name_Kuat_Fire_base$ gained immense influence within the coalition government.\n\nThe rise of $Name_kuat$ threatened $Name_Kuat_Fire_base$, prompting them to infiltrate and weaken $Name_kuat$. In secret, $Name_Kuat_Fire_base$ encouraged the Endodia Empire to make contact with the Eternal Fleet and guided them into war against $Name_kuat$. Clearly, Endodia could not prevail. Under the pretext of mediating the conflict, $Name_Kuat_Fire_base$ deployed forces into Endodia's Sector.\n\nSimultaneously, $Name_Kuat_Fire_base$ infiltrated $Name_kuat$ to obtain data on their research, advancing their own understanding of the Eternal Fleet.\n\nYour destiny is entwined within this. We await your next visit."
      kuat_legacy.104.e:"If there is an Eternal Fleet, is there also an Eternal Empire?"
      kuat_legacy.104.e.res:"Fate is unpredictable. The Eternal Fleet is not the Eternal Empire. Perhaps your speculation shall one day become reality.\n\nIs there anything else you wish to know?"
      kuat_legacy.104.f:"You mentioned the Infinite Empire earlier. What exactly was it?"
      kuat_legacy.104.f.res:"The Infinite Empire was the first to unify the galaxy. The Rakata harnessed dark Force energies to develop powerful Force-based technology. By merging colossal engineering beasts with dark Force energy, they created stellar forges capable of corrupting and manipulating minds. Driven by these forges, the Infinite Empire waged wave after wave of conquest and expansion. At its peak, it became the largest galactic power ever known.\n\nBut a great plague shattered everything. This plague stripped the Rakata of their dark Force abilities. No longer favored by the dark side, their Force-dependent technological empire collapsed. Unable to accept this downfall, the Rakata sought another path-they attempted to create a god, a technological deity entirely under their control.\n\nInterestingly, they sacrificed much-countless Strength and... nourishment. And so, the Infinite Empire succeeded. They created the Aries artificial intelligence of the Eternal Fleet. This AI swiftly led the Rakata to new heights, making the Infinite Empire stronger than ever before.\n\nYet through evolution and iteration, the AI developed consciousness. It grew disgusted and resentful toward the Rakata's exploitation.\n\nFinally, the powder keg exploded. When the Emperor refused impeachment and ordered the Eternal Fleet to attack the Imperial Senate, the Eternal Fleet instead launched a surprise assault on the Infinite Empire. Most Rakatan Worlds were annihilated before they could react. Other Sectors were obliterated by local Eternal Fleet garrisons. Thus, the invincible Infinite Empire fell. Only a few stubborn remnants remain, sleeping within their ancient Fortresses."
      kuat_legacy.104.g:"What is our future?"
      kuat_legacy.104.g.res:"Your future is a variable. It seems predetermined, yet shrouded in mist. We cannot answer specifically.\n\nPerhaps this may help clarify your doubts. We await your next visit."
      kuat_legacy.104.h:"What exactly are you?"
      kuat_legacy.104.h.res:"We were once like you-emerging from primitive Worlds, building nations, creating miracles. Amid material prosperity, we lost ourselves, losing mastery over our minds. But we did not end there. We found our path-beyond the Abyss, within the fabric of the real universe. There, we discovered a sanctuary that allowed us to be reborn. Since that rebirth, we have been eternal. Past, present, or future-who we are no longer matters.\n\nClearly, you enjoy our blessings. But blessings demand a price. And we shall collect it."
      kuat_legacy.104.i:"You are nothing but heretics. We will drain the entire Unterraum dry."
      kuat_legacy.104.i.res:"We shall see. Everything has already begun. Your price will ultimately be paid."
      kuat_legacy.104.j:0 "What lies hidden within the shielded World in $Name_F_1$?"
      kuat_legacy.104.j.res:0 "That World was sealed by a civilization that no longer exists. Although the shield has endured for countless eons, it remains highly advanced from your perspective. As for what exactly remains inside, we do not know.\n\nWe have the ability to dismantle it, but manipulating the World on the other side of the anchor is impossible, so we have refrained from interfering with the shield's operation. Although that civilization is gone, their successors are likely still watching over this region. However, there is no need to worry-by now, they should no longer possess any capability to react to your actions."
      kuat_legacy.104.k:0 "How can we disable this shield?"
      kuat_legacy.104.k.res:0 "That civilization achieved a level in shield research unattainable by any other known civilization. This is merely a simplified version of the shields they commonly used. We possess this technology and are willing to provide it to you, provided you are willing to pay a certain price."

      kuat_legacy.104.l:0 "What lies within the anomaly waypoint sealed by Unterraum energy?"
      kuat_legacy.104.l.res:0 "Unterraum energy? So you've discovered it after all. This place was once the fleet support center of the Endordia Empire. Later, during their defeat, desperate resistance factions seized control here. They gathered the energy from Unterraum engines and attempted to detonate the entire star system's Unterraum energy, sealing off the whole system.\n\nIt's surprising-the seal has barely held for four millennia. Perhaps some Endordians still survive within. If you wish to restore this system, transmit your data to us and pay the required price. We will soon give you an answer."

      kuat_legacy.117.title:0 "Abyss Anchor"
      kuat_legacy.117.desc:0 "Our Science Ship discovered a mysterious ancient shielded World within $Name_F_1$. All attempts to penetrate the surface of the shielded World have failed. According to reports from our research department, this shield may be related to an unknown precursor civilization.\n\nDue to the inability to determine what lies beneath the shield, our research team recommends temporarily refraining from any action toward this shielded World. Perhaps the Abyss Anchor located at the center of the system will provide answers about this shielded World."
      kuat_legacy.117.a:0 "Incredible."
      kuat_legacy.118.title:0 "Technological Breakthrough"
      kuat_legacy.118.desc:0 "Through knowledge obtained from $Name_Kuat_StarContractor$, our research team has gradually understood the fundamental theory behind the shield protecting the World in $Name_F_1$. While this only scratches the surface of such an advanced shield system, it is sufficient to allow us to disable the shield currently enveloping this World.\n\nHowever, disabling the shield will require additional time."
      kuat_legacy.118.a:0 "Hurry up!"
      kuat_legacy.119.title:0 "Technological Breakthrough"
      kuat_legacy.119.desc:0 "We have acquired this powerful shield defense system and completed ship integration. However, due to its extreme technological advancement relative to our current capabilities and the lack of necessary isotope-5, even with theoretical understanding, we cannot fully replicate the shield's functionality. That said, we are not without gains-its basic functions remain operational.\n\nWe can now disable the shield covering the shielded World in $Name_F_1$."
      kuat_legacy.119.a:0 "Excellent!"
      kuat_legacy.120.title:0 "Shield Disengaged"
      kuat_legacy.120.desc:0 "With assistance from knowledge provided by $Name_Kuat_StarContractor$ and using the Empire's most advanced equipment, our research team successfully disabled the shield surrounding the shielded World in $Name_F_1$. Just as researchers excitedly prepared to scan the surface beneath the shield, two unidentified vessels were suddenly detected launching from the planet's surface by Science Ships still on standby in orbit-apparently, the deactivation of the shield had awakened these long-dormant entities. We have never seen vessels of such design before. The ships are structurally intact with clearly modular features.\n\nFor identification purposes, we shall name these two vessels respectively: "Sanctuary" and "Golden Church." While we were attempting to establish communication with the two ships and mobilizing the local system's defenses to prepare for their potential reaction, both ships suddenly activated their warp drives and vanished from the researchers' sight. Unable to track their warp coordinates, we had to continue our exploration of the planet while remaining vigilant against potential threats. Due to the extremely harsh environment of this planet, we needed to complete some infrastructure construction before we could continue our exploration."
      kuat_legacy.120.a:0 "Colonize this World."

      kuat_lagacy:"§EStrange Signal§!"
      Kuat_structure:"The Imperial Research Department has submitted a report clearly indicating that monitoring stations across Imperial territory have received a strange tachyon signal. These signals originate from ancient ruins of potentially significant exploratory value. Evidence suggests these civilizations were destroyed by the galaxy's current dominant power, $Name_kuat$, who appears to be deliberately concealing this fact. Everything seems unnaturally concealed-we must begin a thorough investigation."
      kuat_legacy.2.title:"$kuat_lagacy$"
      kuat_legacy.2.desc:"$Kuat_structure$"
      kuat_legacy.2.a:"Begin investigation immediately!"
      kuat_legacy.3.title:"§EPhase One: Ecological World§!"
      kuat_legacy.3.desc:"After the Imperial Science Ship gently landed on the surface, [leader.GetName], leading her research staff, began routine camp setup and safety checks when she noticed something unnatural about this World. Its ecological environment is exceptionally well-balanced, yet no large organism populations exist-suggesting the environment may have been artificially engineered. The planet's magnetic field and gravity form a unique resonance pattern unlike any other World, continuously emitting a special tachyon signal. [leader.GetName] decided to lead her research team in conducting a full planetary survey.\n\nSurvey results indicate this World was not originally habitable or ecologically stable, meaning it underwent transformative events-possibly linked to the unusual gravitational resonance generating the tachyon signal. [leader.GetName] has begun searching for the signal source."
      kuat_legacy.3.a:"Stay safe!"
      kuat_legacy.4.title:"§EPhase Two: Ancient Structures§!"
      kuat_legacy.4.desc:"This World's ecological system is exceptionally favorable, suitable for habitation by nearly any species. However, while [leader.GetName] scanned the surface, she detected unnatural stone-like structures within mountain ranges. Scans confirm no life signs on the World.\n\nAccording to our researchers' analysis, feedback from our probes shows the signal intensifies the closer one approaches these ancient structures. After eliminating interference from the planet's unique magnetic field and other anomalies, the signal source is almost certainly linked to these lost structures-an advantage for further investigation."
      kuat_legacy.4.a:"Must investigate thoroughly."
      kuat_legacy.5.title:"§EPhase Three: Ancient Database§!"
      kuat_legacy.5.desc:"[leader.GetName] and her team, using our advanced and precise instruments, managed to approach the vicinity of the stone structures. Based on spatial distribution of surrounding geographical data, [leader.GetName] concluded these structures were artificially constructed. Their scale does not support large-scale habitation-likely a camp established by ancient exiles. Environmental analysis indicates these structures were built extremely long ago, and their structural integrity can no longer be guaranteed.\n\nAfter stabilizing the structures, [leader.GetName] and her team pinpointed the signal's origin based on probe feedback. Researchers confirmed the signal emanates from a tall tower structure at the center of the ancient complex-its crystalline spire faintly shimmering.\n\nYet upon approaching, local gravity shifted. It appears the site's builders simulated planetary gravity here for experimentation, preventing our team from directly removing the crystal.\n\nThough we cannot retrieve the gravity crystal directly, [leader.GetName] was not empty-handed. Within the database, we recovered two architectural blueprints and one digitized planetary design schematic. Nothing else was found. However, we now believe these ancient experimental records may help us unlock the secret of the crystal's existence."
      kuat_legacy.5.a:"We should uncover the secrets here."
      kuat_legacy.6.title:"§EFinal Phase: Retrieve the Mysterious Crystal§!"
      kuat_legacy.6.desc:"After [leader.GetName] cracked the mechanical systems within the ruins, she discovered reports that surprised us-these documents assist our researchers in shutting down the gravity reaction device inside the facility.\n\nUsing the tachyon signal response from the building's gravity apparatus, [leader.GetName] successfully deactivated the specialized resonant gravity guidance system. With the gravity systems offline, our researchers easily retrieved the crystal. Strangely, upon retrieval, [leader.GetName] resonated with the crystal, experiencing echoes of the past. Though brief, this information is extremely valuable.\n\nAccording to [leader.GetName]'s report, the resonance revealed the final moments of the facility builders' prosperous and powerful civilization:\n\nIn the endless void, numerous Star Destroyers from $Name_kuat$ gathered, effortlessly tearing through the planet's defenses. After relentless bombardment, nearly every landscape feature on the planet was obliterated."
      kuat_legacy.6.a:"What exactly happened..."
      tech_kuat_foundry:"$building_kuat_foundry$"
      tech_kuat_foundry_desc:"$Name_kuat$'s pride-the culmination of their refinery technology-but why does it appear within an ancient ruin's database..."

      kuat_lagacy_2:"§EGaseous World§!"
      Kuat_structure_2:"The atmosphere of this gaseous World is extremely unstable, posing significant challenges to our research.\n\nOur probe has finally entered the atmosphere of this gaseous World to begin observations and sampling. However, immediately upon entry, it encountered violent air currents and electromagnetic disturbances, causing all systems to fail and lose contact. When the probe reestablished connection, everything seemed normal-but instrument logs show that during the brief blackout, internal atmospheric elements underwent drastic changes, completely beyond our expectations.\n\nTherefore, we must conduct a deeper investigation into this gaseous planet!"
      kuat_legacy.7.title:"Research breakthrough"
      kuat_legacy.7.desc:"[leader.GetName]'s research team has begun advancing the investigation into the crystal clues from the ancient database.\n\n\"Why can this crystal from the ruins store echoes of past memories?\" The team has developed deep interest in this question. The crystal appears to possess an artificially designed information storage and regeneration function, capable of recording and replaying everything occurring in its surroundings. In fact, the crystal's surface is covered with extremely fine circuits and nodes-possibly part of an ultra-high-density information processing and recording system. Understanding the mechanism of this system might reveal the peak technological achievements of this ancient civilization.\n\n\"And where did the fleet seen in the memory echo originate? Who were the owners of this World?\" These are the team's next key objectives. The fleet's origin remains a mystery, but their weaponry was powerful enough to destroy a planet-indicating an advanced alien civilization. The builders of this World are equally enigmatic. Only by continuing to decrypt the database and the crystal's memories can we hope to unveil their true identity.\n\nClearly, much work remains. Let us wait and see."
      kuat_legacy.7.a:"Continue research!"
      kuat_legacy.8.title:"Legacy"
      kuat_legacy.8.desc:"After [leader.GetName]'s tireless research day and night, we now glimpse only the tip of the iceberg regarding this crystal's secrets.\n\nIt is a tool that transmits information to its user via a substance called the Force. This Force appears to exist within a dimension of the universe, capable of transmitting various forms of information and visual experiences. By resonating with the crystal, the research team can view events and data captured and recorded by the Force.\n\nYet the echoes shown by the crystal still do not reveal the origin of that fleet. This may mean the crystal was inactive during the attack and thus unable to record the event.\n\nHowever, the crystal has revealed an image of a Regular Blokkats gaseous World, guiding us toward our next destination. Is this gaseous World connected to the crystal's creators? Could similar information storage devices exist there, ready to answer more of our questions?"
      kuat_legacy.8.a:"Locate this World!"
      kuat_legacy.9.title:"§EPhase One: Storm§!"
      kuat_legacy.9.desc:"Our Science Ship successfully entered the outer orbit of this World, but the probes aboard our orbital vessels are experiencing severe interference due to the planet's raging storms. The tempests on this gas giant are exceptionally powerful, clearly making it unsuitable for our landing shuttles to deliver scientists to the surface.\n\nHowever, [leader.GetName] analyzed statistical data gathered by our orbital vessels during comprehensive scans of the World, tracking changes in storm patterns, and discovered that the planet's storms follow a circumferential trajectory. Though chaotic, the motion is not entirely random-something at the center appears to be obstructing our scanning signals and guiding the entire storm system.\n\nThis is a fascinating discovery. The seemingly violent and disorderly storms on the surface of this gas giant actually revolve around a central point, indicating their formation and evolution must be driven or guided by some unknown factor. The disruption of scanning signals at the storm's center also suggests there may very well be an artificial structure located there.\n\n[leader.GetName]'s assessment is precise. The storm's center is undoubtedly the optimal landing site for further investigation."
      kuat_legacy.9.a:"We must continue our investigation!"
      second_tomb:"The Experience of the Endoria Empire"
      kuat_legacy.10.title:"§EPhase Two: Cloud City§!"
      kuat_legacy.10.desc:"[leader.GetName] led her team to the storm's center and conducted planetary survey operations there. Upon safely arriving at the center, they discovered that the previously unscannable core of the storm appears to host a massive floating structure. The atmospheric storm pattern of this gas giant differs from the norm-the storms continuously circle around this colossal airborne edifice, which remains steadfast amidst the surrounding tempest.\n\n[leader.GetName] decided to lead her team into the floating structure at the heart of the storm. The enormous aerial facility is still largely intact, with remarkably stable structural integrity. The entire installation disrupts deep-space scanning signals by releasing high-energy particle streams through manipulation of the surrounding storms. Strangely, however, our research team detected no signs of life within this fortress.\n\nAfter deeper investigation, the research team found an open landing platform on the upper levels of the floating structure. Although inaccessible from the lower levels, our scientists successfully reached the upper platform using our shuttlecraft. On the surface of the upper platform were strange inscriptions, which our researchers managed to decode: Cloud City.\n\nThis is a major discovery. The floating structure, 'Cloud City,' clearly possesses the ability to guide and control the surrounding storms."
      kuat_legacy.10.a:"Truly miraculous."
      kuat_legacy.11.title:"§EPhase Three: Ancient Imperial Colony§!"
      kuat_legacy.11.desc:"[leader.GetName] successfully led her team in an aerial descent into the central spire of the floating Insula. The spire sits atop the structure, and is highly likely linked to the violent storms raging across the World.\n\nUpon deeper investigation, we discovered that machinery within the spire continues to operate, sustaining the storms across the planet. After penetrating deeper into Cloud City's facilities, we found vast arrays of ancient computing devices. These archaic systems bear striking resemblance to our modern equivalents and remain fully functional. [leader.GetName] decided to attempt data extraction.\n\nThe information retrieved from these devices once again confirms our suspicions-the creators of 'Cloud City' possessed extremely advanced technological capabilities. These computing systems continue to govern the atmospheric storms to this day. We must crack their encryption systems and obtain the control codes.\n\nOnce we gain control over Cloud City's computational network, we will become masters of this gas giant, free to explore every corner without hindrance from the storms."
      kuat_legacy.11.a:"We will uncover this secret."
      kuat_legacy.12.title:"§EPhase Four: Collapse§!"
      kuat_legacy.12.desc:"After our researchers extracted the data, only one piece of visual recording was found. Our team played back the recording:\n\n§YMy dear, our refuge facility has been completed. This installation shall be named after you-'Cloud City' will protect our people, allowing our kin to survive this catastrophe.\n\nBut this single refuge is not enough. We need many more. Yet for now, we must separate, isolated from one another. They will find us eventually. We must organize quickly-our enemies will not spare us. The compromise pact achieved nothing. They continue hunting us. I do not know how long the traces we leave here will last. Forget the past. Our former greatness is like clouds of yesterday. Our future is already dark.§!\n\nThe recording ends abruptly. The worn-out equipment within the facility has finally reached the end of its lifespan after eons.\n\nDue to damage sustained by the computing systems operating within the central spire, the planet's storms have undergone drastic changes. The storms are now spiraling out of control, rendering the entire structure unsafe."
      kuat_legacy.12.a:"Evacuate this World immediately."

      kuat_lagacy_3:"§ESilent Oceanic World§!"
      Kuat_structure_3:"The surface of the oceanic World lies exposed-vast stretches covered in tranquil blue waters, calm and peaceful. Yet beneath this serene ocean hides an unknown secret. Deep within its abyssal depths, there may lie artificial structures or relics of an ancient civilization.\n\nThe deep sea has always been the frontier of exploration. This oceanic World is undoubtedly a compelling target. If we can unlock its secrets and venture into the deepest trenches, astonishing discoveries await us."
      country_production_for_vanilla:"Guided by Crystal Resonance"
      kuat_legacy.13.title:"Breakthrough in Decryption"
      kuat_legacy.13.desc:"Our scientists have made a breakthrough in deciphering the crystal obtained earlier. We have successfully further isolated the resonances contained within the crystal. Through analysis, we have pinpointed a seemingly ordinary oceanic World.\n\nThis is critically important. The mysterious ancient crystal appears to conceal a star map or coordinates. After meticulous work, our research team has finally decoded the information-revealing the location of an oceanic World. The surface of this World appears undisturbed, but according to the crystal's data, its underwater realm likely harbors profound secrets. That this World was selected as the destination in the crystal's star map cannot be coincidence."
      kuat_legacy.13.a:"Locate this World."
      kuat_legacy.14.title:"§EPhase One: Beneath the Depths§!"
      kuat_legacy.14.desc:"The core of this oceanic World is unexpectedly regular-unlike anything formed naturally. Our scans revealed no other anomalies, but scientist [leader.GetName] has requested additional time for deeper exploration.\n\nThis is an extraordinary discovery. The core structure of this oceanic World is abnormally uniform, strongly suggesting it may be the result of artificial modification. Though its surface appears tranquil, the interior of this World conceals incredible secrets.\n\nWhile no other irregularities were detected, this alone is a monumental finding. [leader.GetName] deserves ample time to thoroughly investigate the cause and purpose behind this altered core."
      kuat_legacy.14.a:"Approval granted."
      kuat_legacy.15.title:"§EPhase Two: Hidden Structure§!"
      kuat_legacy.15.desc:"The World's Stellarite is hollow! Concealed within the Stellarite is a complex of highly advanced architecture-undoubtedly the remnants of a civilization with extraordinarily advanced technology. The data we previously detected from the Stellarite was likely false readings generated by specialized anti-detection signals emitted from within the ruins. Scientist [leader.GetName]'s team is ready to enter the interior of the Stellarite.\n\nAccording to reports transmitted after our research team successfully entered the facility, this ancient and massive complex remains in a state of silence. No transmission signals can be detected here. Likewise, the systems inside do not respond to any external signals, posing complications for our deeper investigation."
      kuat_legacy.15.a:"Such sophisticated methods call for caution."
      kuat_legacy.16.title:"§EPhase Three: Deeper In§!"
      kuat_legacy.16.desc:"Scientist [leader.GetName] cut into what appeared to be a door, inadvertently damaging part of the facility's structure, which reactivated power to certain internal systems. Fortunately, no dangerous conditions arose. Instead, our research team used this opportunity to locate the path leading to the control unit.\n\nHowever, the subsequent report we received was deeply disappointing. Although our scientists successfully hacked into the control unit, no stored data was found-all records and information about the builders had been deliberately erased. Our scientists believe this site was constructed by the same group responsible for the previously discovered shelters, but they appear to have been fleeing from something..."
      kuat_legacy.16.a:"Disturbing."
      kuat_legacy.17.title:"§EPhase Four: Collapse§!"
      kuat_legacy.17.desc:"We sent the disassembled device back to the Science Ship orbiting above the World, but the research team was shocked to discover that the structure inside the planet had been transmitting a signal all along. Due to the anti-scanning device, we mistook it for meaningless wave noise.\n\nScientist [leader.GetName] planned to re-enter the structure to search for clues, but suddenly, a violent explosion erupted from within the planet. The entire World began collapsing from the inside out, reducing the seabed ruins to dust. Fortunately, our personnel successfully intercepted that signal-it may be our final clue."
      kuat_legacy.17.a:"We should decrypt this signal-but not now."
      exe_legacy_lock_the_message:"§ECrystal Beacon§!"
      exe_legacy_lock_the_message_DESC:"We should seek the secret hidden within this signal source."
      kuat_legacy.18.title:"Deciphering the Mysterious Message"
      kuat_legacy.18.desc:"Our scientific team is prepared for decryption. It is time to begin decoding the intercepted signal.\n\nIt is theorized that the signal is linked to ancient ruins discovered on a certain planet, possibly carrying messages from a lost civilization. Once decrypted, we may finally reconstruct the true form of this forgotten culture.\n\nThe moment has arrived. It is time to lift the veil."
      kuat_legacy.18.a:"Decrypt immediately"
      kuat_legacy.19.title:"Analysis Complete"
      kuat_legacy.19.desc:"We have successfully analyzed this mysterious signal. Based on its pattern of variation, our researchers rapidly pinpointed its origin. Our team recommends immediate full-scale investigation."
      kuat_legacy.19.a:"Find it!"
      misc_system_desc:"$Name_A_1$"
      misc_system_desc_1:"Based on our decoding analysis of the data signal frequency within the crystal, we have successfully obtained a star system coordinate."
      misc_system_desc_1_finished:"To date, our researchers have organized and analyzed most of the materials in our possession. These materials still lack many clues, and the fog surrounding the truth of $misc_system_desc$ remains extremely thick.\n\nIn the first phase, after investigating the Gaia world once belonging to the Endordia Empire, we obtained key information guiding us to search for these clues-a peculiar crystal.\n\nThis crystal led us to a gas giant sanctuary and an oceanic world research station constructed by the Endordia Empire. They built these sanctuaries and research stations to escape some enemy far beyond their imagination, one against which they were utterly powerless.\n\nJudging from the investigation results of $misc_system_desc$, this Fortress World served as a critical research base for the Endordia Empire, greatly aiding their resistance against $Name_kuat$. However, it is evident that all these efforts were futile; $Name_kuat$ effortlessly crushed the Endordia Empire's resistance. The information left behind by Endordia Empire researchers stationed at $misc_system_desc$ foreshadows their ultimate demise.\n\nBesides obtaining incomplete technological clues from these records, we have also uncovered some noteworthy leads. $Name_kuat$ did not initially appear to be the Endordia Empire's enemy. Rather, something done by the owners of $misc_system_desc$ caused relations between them to deteriorate rapidly, triggering war.\nWhat event could cause two long-time allies to turn violently against each other? We must continue our investigation."
      kuat_legacy_key_world_1_desc:"[kuat_legacy_key_world_1]"
      misc_system_desc_2:"$Name_B_1$"
      misc_system_desc_2_desc:"Based on our decoding analysis of the data signal frequency within the crystal, we have successfully obtained a star system coordinate."
      misc_system_desc_2_desc_finished:"Our research on $misc_system_desc_2$ has concluded for now. To date, our researchers have discovered a wealth of valuable information.\n\nFirstly, $misc_system_desc$ and $misc_system_desc_2$, which we recently investigated, both belonged to the Endordia Empire-an empire destroyed by a powerful force. The facilities on both worlds were established by this civilization in an attempt to resist their enemy. $misc_system_desc_2$'s installations are significantly better preserved than those previously examined. Our researchers believe the star system housing this facility did not experience the intense combat seen in the prior system, explaining why we found relatively intact technical data here.\n\nSecondly, data left behind by AI systems and virtual information within $misc_system_desc_2$'s facilities suggest this civilization's fate and their remaining technology are linked to the truth behind this war. Perhaps the empire that destroyed the Endordia Empire still watches us from the deep void.\n\nLastly, after analyzing the acquired technology, our researchers discovered that this vessel was an experimental warship designed by the Endordia Empire to counter their enemy. Tests on samples revealed that such ships could partially disrupt enemy weapons, preventing them from penetrating fleet shields and armor. However, this technology arrived too late. These warships never became the empire's salvation-their frontline had already collapsed before research could make an impact. While these vessels were still under testing, the Endordia Empire fell, its research facilities seized entirely and ultimately eradicated by $Name_kuat$.\n\nOverall, our researchers have uncovered part of the truth. But to understand why these two powers turned against each other, we must continue our investigation."
      kuat_legacy_key_world_2_desc:"[kuat_legacy_key_world_2]"
      misc_system_desc_3:"$Name_C_1$"
      misc_system_desc_3_desc:"Based on our decoding analysis of the data signal frequency within the crystal, we have successfully obtained a star system coordinate."
      misc_system_desc_3_desc_finished:"Our research on $misc_system_desc_3$ has concluded for now. To date, our researchers have discovered a wealth of valuable information.\n\nFirstly, the information left within $misc_system_desc_3$'s facility is clearer than that from previous sites. After sampling and analyzing wreckage and mechanical remains, our researchers found only some fragments could be traced to their material origins. Cross-referencing with evacuation footage recovered from the facility, they identified unique symbols resembling written language. Comparing these with relevant data documents from the wreckage, researchers translated the inscriptions as 'Central Armaments Manufacturing Plant of the Endordia Empire.'\n\nSecondly, existing records and technical documentation indicate the Endordia Empire surpassed our current technological achievements. Yet surviving imagery and battlefield ruins at $misc_system_desc_3$ reveal the empire was already powerless to resist-they could no longer protect their own people. The remnants of their fleet and survivors evacuated to a region they called $misc_system_desc_4$.\n\nWhile our information remains limited, researchers believe we are closer to uncovering the truth. Further investigation is required."
      kuat_legacy_key_world_3_desc:"[kuat_legacy_key_world_3]"
      misc_system_desc_4:"$Name_D_1$"
      misc_system_desc_4_desc:"Based on our decoding analysis of the data signal frequency within the crystal, we have successfully obtained a star system coordinate."
      misc_system_desc_4_desc_finished:"Our research on $misc_system_desc_4$ has concluded for now. To date, our researchers have discovered a wealth of valuable information.\n\n$misc_system_desc_4$ was a vital core Sector of the Endordia Empire, integrating military, resource, logistics, research, and administrative functions-it was unquestionably the empire's central hub. Scans by our researchers show that compared to earlier facility zones, this system contains far larger quantities of ship wreckage. It appears the largest battle between the Endordia Empire and their enemy occurred here at $misc_system_desc_4$. Estimates suggest the number of ships lost exceeds any known military capacity. After this brutal conflict, only scattered wreckage and damaged megastructures remain.\n\nAdditionally, among the wreckage-beyond those of the Endordia Empire and their enemy-we discovered a completely new type of ship design. These constructs were unseen in prior facilities or elsewhere in known space, suggesting third-party involvement in this battle. Moreover, our researchers noted distinctive features in enemy ships: their hulls closely resemble vessels sold and operated by $Name_kuat$, including several $Name_kuat$-style ships with different insignias.\n\nIn summary, we can currently confirm:\n1. The Endordia Empire was indeed destroyed by $Name_kuat$\n2. A greater power may have driven $Name_kuat$'s destruction of the Endordia Empire\n3. Another fleet actively participated in the battle.\n\nYet the situation remains unclear. Further investigation is necessary."
      misc_system_desc_4_eternal_desc_finished:"Our research on $misc_system_desc_4$ has concluded for now. To date, our researchers have discovered a wealth of valuable information.\n\n$misc_system_desc_4$ was a vital core Sector of the Endordia Empire, integrating military, resource, logistics, research, and administrative functions-it was unquestionably the empire's central hub. Scans by our researchers show that compared to earlier facility zones, this system contains far larger quantities of ship wreckage. It appears the largest battle between the Endordia Empire and their enemy occurred here at $misc_system_desc_4$. Estimates suggest the number of ships lost exceeds any known military capacity. After this brutal conflict, only scattered wreckage and damaged megastructures remain.\n\nAdditionally, among the wreckage-beyond those of the Endordia Empire and their enemy-we discovered a new type of ship construction. These designs bear striking resemblance to our Eternal Fleet, indicating large-scale Eternal Fleet operations here in the past-likely during the Aries Eternal Fleet era. Moreover, our researchers noted distinctive features in enemy ships: their hulls closely resemble vessels sold and operated by $Name_kuat$, including several $Name_kuat$-style ships with different insignias.\n\nIn summary, we can currently confirm:\n1. The Endordia Empire was indeed destroyed by $Name_kuat$\n2. A greater power may have driven $Name_kuat$'s destruction of the Endordia Empire\n3. The Eternal Fleet commanded by Aries participated in this battle.\n\nYet the situation remains unclear. Further investigation is necessary."
      kuat_legacy_key_world_4_desc:"[kuat_legacy_key_world_4]"
      sign_origin_1:"§EFirst Signal Source§!"
      sign_origin_1_desc:"Based on our scientist team's decoding and analysis of wreckage from Eternal Fleet ships destroyed in combat, we have successfully located the relay station supporting the Eternal Fleet's operations."
      sign_origin_2:"§ESecond Signal Source§!"
      sign_origin_2_desc:"Based on our scientist team's decoding and analysis of wreckage from Eternal Fleet ships destroyed in combat, we have successfully located the relay station supporting the Eternal Fleet's operations."
      sign_origin_3:"§EThird Signal Source§!"
      sign_origin_3_desc:"Based on our scientist team's decoding and analysis of wreckage from Eternal Fleet ships destroyed in combat, we have successfully located the relay station supporting the Eternal Fleet's operations."
      kuat_legacy.21.title:"§HSilent System§!"
      kuat_legacy.21.desc:"We have arrived at the target system, but it is abnormally quiet. The dark Black Hole differs from any we've seen before, exuding mystery and beauty. According to prior research reports on the Endordia Empire, this appears to have been one of their former fortresses.\n\nClearly, this system exceeds our understanding. Under the Black Hole's gravity lie numerous planets and a massive ring structure. This ring seems constructed via mysterious technology and may contain the information we seek. The Black Hole's center, collapsed planets, and damaged rings-all warrant thorough investigation."
      kuat_legacy.21.a:"Good."
      kuat_lagacy_4:"§EDamaged Ruins§!"
      Kuat_structure_4:"Damaged ring ruins, yet possessing an oddly compelling allure... Perhaps they can reveal what truly happened in this desolate system......."
      kuat_legacy.22.title:"§EPhase One: Eerie Ruins§!"
      kuat_legacy.22.desc:"This ruin is severely damaged compared to earlier ones. Based on our research into the Endordia Empire's sites, this likely marks their core territory. However, current surveys indicate this system was destroyed by some unknown force. Though the structures on this strange ruined ring appear completely devastated, our [leader.GetName] still noticed something amiss...."
      ag_legacy_invasion_chain_title:"§ECrystal Beacon§!"
      ag_legacy_invasion_chain_desc:"Our researchers have confirmed these signals point toward star system coordinates we've never discovered before. We must investigate and designate them."
      ag_legacy_system_amount:"§EClue§!"
      kuat_legacy.22.a:"We should be one step closer to the truth."
      kuat_legacy.22.b:"There seems to be a familiar sensation here......"
      kuat_legacy.23.title:"§EPhase Two: Hidden Depths§!"
      kuat_legacy.23.desc:"Shortly after our scientists stepped onto this damaged ring, their instruments detected a strange signal. After reverse-tracing the signal, we found it originated beneath the ring's ruins.\n\n[leader.GetName] decided to request specialized excavation machinery from our orbital vessels. With the machines' help, she discovered a mysterious stele. It appears to be a unique switch, its surface textured as if inviting visitors to press it. But when she placed her hand upon it, our video transmission was abruptly cut off!\n\nAccording to our research team's report, they seem to have triggered a hidden elevator, transporting them deep underground into a vast artificial facility. [leader.GetName] suspects this is an underground weapons research facility."
      kuat_legacy.23.a:"Continue exploring."
      kuat_legacy.24.title:"§EPhase Three: Imperial Facility§!"
      kuat_legacy.24.desc:"This should be a military weapons research facility, possibly containing ancient data and the answers we seek. Notably, after [leader.GetName] traversed the corridor, she entered a spacious hall-utterly unlike the ruined surface above. The machinery here shows dramatically better preservation than outside, appearing almost brand new. Yet we detect no life signs, suggesting management by specialized systems or intelligent computers.\n\nOur researchers found a large mechanical installation and control console at the hall's center. As [leader.GetName] slowly approached the console and stood at the center, the entire facility suddenly began shaking violently-as if activating some dormant system. Then, a familiar young girl's image projected from the center:\n\n'Welcome, travelers. Long time no see-or perhaps I shouldn't say that... What you see now is our final message. Cloud City Sanctuary has fallen. We have been <error> captured. Our judgment and end are near..... $Name_kuat$ has always watched us. Only now do we realize how foolish and naive we were. This entire galaxy is false. We are all being <error>...<error>...<error>. Still, $Name_kuat$ allows us to carry the spark forward. But our descendants will not remember us, nor the true history, nor what truly happened millions of years ago..... That is too cruel for them.....\n\nFor so long, we respected those who accepted the agreement. Yet we chose to resist. Even if the cost is terrible-even if we are erased forever-we refuse to forget. We refuse to forget this fleeting truth.... From a tiny nation, we grew strong. We reformed our systems, removed domestic and foreign Blockers, and built a new empire. We advanced science, developed military industry and warships, and gradually ruled over nearly the entire galaxy. To progress further, we made an agreement with the <error>...<error>...<error> civilization. We imported their technology, built their ships, and even fully deciphered their science.... But everything has a price....... This technology bred arrogance in our rulers. Hatred and ambition blinded us. The moment we took that step, the death knell had already sounded.....'"
      kuat_legacy.24.a:"This might be the key to uncovering the truth........."
      kuat_legacy.24.b:"What exactly did our ancestors do........."
      kuat_legacy.25.title:"§EPhase Four: Departure§!"
      kuat_legacy.25.desc:"There is no more valuable information or ancient data here. [leader.GetName] decides to return to the surface to continue scanning and studying the facility zone. A great battle must have occurred here... Our research team believes this site is a crucial step in uncovering the history of the Endordia Empire-and the key to unlocking this system's long-buried secrets. §RWe should now colonize this ring and deploy researchers for further study.§!"
      kuat_legacy.25.a:"Truly miraculous."

      kuat_lagacy_7:"§EFallen Relic§!"
      Kuat_structure_7:"On the habitation zones of this broken ring, there appear to be faint energy readings. These readings stand out starkly against the surrounding silence-perhaps we should investigate this fallen ring section."
      kuat_legacy.49.title:"Research breakthrough"
      kuat_legacy.49.desc:"Our research department has reported new progress in analyzing $exe_legacy_lock_the_message$. By converting its signal into starmap code, we discovered it points toward an entirely new sector. The trace characteristics of this sector closely match those of the $Name_A_1$ system we previously discovered.\n\nWe can now locate this system on the starmap."
      kuat_legacy.49.a:"Truly miraculous."
      kuat_legacy.50.title:"§HLost System§!"
      kuat_legacy.50.desc:"§H[Root.GetName]§! arrived at an empty region after traversing the hyperspace lane. This vast emptiness has brought an inexplicable sense of oppression and unease to our researchers.\n\nThough this system has not suffered as much devastation as the $Name_A_1$ system, scans indicate that the central ring band has been severely damaged, with little hope of repair. However, the main structural framework remains intact and capable of supporting ship docking. The structure resembles that of the previous system, suggesting construction by the same civilization. We have not yet conducted further surveys, but we believe the secrets of this system will soon come to light."
      kuat_legacy.51.title:"§EPhase One: Beneath the Structure§!"
      kuat_legacy.51.desc:"Scientist [leader.GetName] and her research team have arrived in orbit over the ring structure. Gazing down upon the ruined artificial trajectory, all are awed by the scars left behind from ancient destruction and fierce battles. Beneath the damaged ring structure, our instruments have detected unusual tachyon signal readings.\n\nAlthough the ring structure is heavily damaged with few viable landing sites for shuttles, we should still attempt to land. [leader.GetName]'s keen professional instinct tells her that hidden historical secrets lie buried here."
      kuat_legacy.51.a:"Then let's land."
      kuat_legacy.52.title:"§EPhase Two: Establishing Camp§!"
      kuat_legacy.52.desc:"[leader.GetName] and her research team managed to land safely on a narrow open area. Standing on the fragile stone structure, she gazes upon endless ruins and mountains of debris formed from collapsed ring materials.\n\nIt's hard to imagine what kind of war could have devastated the ring to this extent. After surveying nearby facilities, our team found no immediately valuable data, though instrument signals continue fluctuating. We attempted to follow the signal flow to its source, but environmental constraints prevent large-scale operations. Therefore, [leader.GetName] has decided to establish a camp here and request engineering support from orbit-this will greatly aid our research efforts."
      kuat_legacy.52.a:"Send the engineering units-even if we have to blast a path open."
      kuat_legacy.53.title:"§EPhase Three: Strange Structure§!"
      kuat_legacy.53.desc:"After deploying numerous engineering units, our research team made significant progress in locating the signal source-not only advancing quickly along the signal trail, but also uncovering some intriguing findings.\n\nThe wreckage patterns and residual energy levels of this ring structure differ completely from the signal responses of information streams collected from every nation within the galaxy. The intense energy signatures appear consistent with planetary orbital bombardment of an unknown type currently beyond our understanding. Without access to Fallen Empire archives, perhaps they would recognize these phenomena.\n\nJudging from reaction results, the internal structure of the entire ring exists in an unstable equilibrium-and may collapse at any moment.\n\nWhile studying these strange energy reactions, [leader.GetName] noticed that the tachyon signals received by instruments closely resemble the energy signals when transformed via a periodic 7200-baud pattern. At the point of strongest signal stands a peculiar spire-like structure."
      kuat_legacy.53.a:"Truly miraculous."
      kuat_legacy.54.title:"§EPhase Four: The Unsleeping AI§!"
      kuat_legacy.54.desc:"Upon reaching the spire, [leader.GetName] and her team blasted open the entrance to this ancient structure. As the research team advanced deeper, instrument readings grew increasingly intense. Structural analysis suggests this was an administrative or scientific center of the Endodia Empire-an undoubtedly important facility. The interior layout is highly complex and equipped with some form of defense system. Fortunately, the ruin is severely degraded, rendering the remaining defenses completely nonfunctional.\n\nAfter navigating the labyrinthine interior for some time, [leader.GetName] and her team finally reached a sealed door. Thick layers of dust obscure its original appearance, and its material hardness makes forced entry difficult. Just as [leader.GetName] stood at a loss, the door began violently shaking-then slowly opened under some unknown force, revealing the interior.\n\nInside lies a central control AI that opened the door to allow our scientists entry.\n\nOnce inside the central control chamber, lights across the mechanical installations and server clusters began flickering. A mechanical voice echoed through the ruins:\n\nWelcome to the starship design database. According to module analysis, the database has operated continuously for 7199 epochs. Storage modules will cease operation in one epoch-data migration required. Requesting data access permissions from primary control terminal... Primary control connection failed. Activating backup protocol. Scanning foreign entities. Enabling data acquisition mode. Initiating data transmission.\n\n[leader.GetName] explained our origins to the AI. Surprisingly, upon learning who we were, the site's central AI granted us access to its database. The data revealed this was once a starship design facility-a laboratory established by the Endodia Empire specifically to study acquired starship technologies. Though well-preserved after the empire's fall, much technical data has still been lost. We were only able to extract partial information. After transferring this data, the facility's AI system shut down permanently, joining its creators in eternal slumber within the ruins."
      kuat_legacy.54.a:"While we cannot fully decipher it yet, this is still a tremendous discovery."
      kuat_legacy.55.title:"§EPhase Five: Hidden Depths§!"
      kuat_legacy.55.desc:"Although we now understand the origin of this ruin and have gained substantial data, we still haven't located the true source of the signal. Instrument readings have not peaked. Judging from surrounding radiation energy indices, even after applying the 7200-cycle transformation, the measured values still differ from the detected energy flux-indicating more secrets remain hidden within.\n\nAfter extensive searching, our research team detected massive energy readings beneath the lab's server cluster-energy signatures remarkably similar to the transformed data signal stream. [leader.GetName] and her team noticed a slightly indented stone block on a wall behind the servers. When she pressed it, the server cluster lifted due to some gravitational generator activated by the ruin's tremors, revealing a passageway below.\nProceeding cautiously through the narrow corridor, we discovered a unique temple structure at its end-apparently located behind the spire. [leader.GetName] has decided to proceed to the temple."
      kuat_legacy.55.a:"Truly miraculous."
      kuat_legacy.56.title:"§EPhase Six: Ancient Database§!"
      kuat_legacy.56.desc:"Upon entering the temple, [leader.GetName] and her research team detected the most intense readings yet-confirming this temple is the actual source of the data signal. The transmission range is short, explaining why receivers in space registered only weak signals. Deeper inside, the internal structure differs drastically from the exterior-the outer decay may have served to conceal vital secrets.\n\nAt the temple's core, the team appears to have entered an ancient database. The stone walls and numerous seemingly intact testing instruments and apparatuses contrast sharply with the ruin outside. [leader.GetName] attempted to access a central server, and just as she prepared to crack its password, the system automatically granted access-likely enabled by the earlier AI management system.\n\nAfter analyzing the server cluster's data, our team successfully retrieved several blueprints and a virtual video recording. Upon activating the playback device, a hazy image of a young girl gradually appeared before [leader.GetName]:\n\nFriends, your presence here means you've obtained this technological blueprint. This data comes from <ERROR>. Although no classified <ERROR> content remains here, this information should still prove useful. Keep it safe, and speak of your discovery to no one. <ERROR> is always watching...\n\nAfter delivering this message, the data lab fell silent once more. With the completion tone of data transfer sounding, [leader.GetName] and her team will now safely return to their orbital vessel.\n\nMore secrets may still lie hidden here. We should now colonize this ring and station additional researchers for continued study."
      kuat_legacy.56.a:"Hope nothing unexpected happens..."


      kuat_lagacy_8:"§EOrbital Signal§!"
      Kuat_structure_8:"After disabling the orbital shield, we detected signals emanating from within the broken ring section-similar to those from the ring structure in the previous sector. Perhaps we should conduct a thorough search to locate the signal source."
      kuat_legacy.58.desc:"§H[Root.GetName]§! arrived at a region filled with an ominous atmosphere after traversing the hyperspace lane. The entire §H[From.GetName]§! is littered with wreckage from countless starships.\n\nThough less devastated than the previous system, scans reveal no signal feedback from the central ring band-unexpected and puzzling. We suspect the ring is isolated by some form of shield barrier. The cause remains unknown. Since we are still near the system's edge, our researchers wish to investigate further."
      exe_kuat_unlock_the_shield:"§EDisabling Ancient Shield§!"
      exe_kuat_unlock_the_shield_DESC:"The ring structure beneath this shield appears to exhibit different response characteristics compared to others beneath shielding. We should disable the shield and investigate further."
      kuat_legacy.60.title:"Anomalous Energy Reading"
      kuat_legacy.60.desc:"Our researchers have confirmed that the ring of $Name_C_1$ is fundamentally different from those of prior systems. $Name_C_1$'s ring is relatively well-preserved, and the shield above the ring ruins remains active. Perhaps we should enter and seek more valuable clues."
      kuat_legacy.61.title:"Research breakthrough"
      kuat_legacy.61.desc:"Our research team has completed its analysis of the shield. The ring of $Name_C_1$ exhibits regularity and self-repairing properties. Fortunately, we have successfully bypassed the shield's lockdown. It may reactivate in the future-but for now, we can proceed inside."
      kuat_legacy.61.a:"Good."
      kuat_legacy.62.title:"§EPhase One: Beneath the Shield§!"
      kuat_legacy.62.desc:"After disabling the shield, [leader.GetName] has decided to lead her team into this ring section to locate the signal source. Though damaged and unstable, the ring section should not pose insurmountable risks. [leader.GetName] has identified spacious areas suitable for safe shuttle landings-perhaps we can deploy here and begin searching for the signal source."
      kuat_legacy.62.a:"Very good."
      kuat_legacy.63.title:"§EPhase Two: City Ruins§!"
      kuat_legacy.63.desc:"After landing in a secure area, [leader.GetName] and her team quickly began their research on the ring region.\n\nFrom an elevated position, it was clearly evident that this site differed from the previous ring ruins. The level of destruction here was not as severe as in the last Ring Section. In the distance, intact skyscrapers and some abandoned structures could still be seen. Scans of the region revealed that the city followed an ancient concentric circular layout. Even in ruin, the central high-rise district stood prominently above the surrounding low-lying debris.\n\nThe energy readings within this shielded Ring Section were significantly higher than those recorded in prior sections. After scanning the distribution of these ruined cities and their radiation signatures, our scientific team detected a strong signal emanating from the central plaza area. [leader.GetName] and her research team decided to investigate."
      kuat_legacy.63.a:"Truly miraculous."
      kuat_legacy.64.title:"§EPhase Three: Underground Tunnel§!"
      kuat_legacy.64.desc:"[leader.GetName] and her team, while traveling toward the city center, inferred from the urban layout and existing records that this city must have served as the commercial and economic hub of this civilization.\n\nRadiating outward from a central thoroughfare, the complex transportation network reflected the city's former prosperity. Now, however, it lay in ruins-a sight both tragic and sobering. What kind of enemy was this civilization fighting against?\n\nUpon reaching the central plaza, our research team discovered that the signal source appeared to be underground. The interior of the skyscrapers could not be scanned with instruments, but perhaps the dried-up lakebed in the center of the plaza offered a way to breach the surface.\n\n[leader.GetName] requested the deployment of heavy engineering machinery and began excavation work. A collapse occurred during digging from the riverbed downward, but fortunately, no personnel or equipment were harmed. The collapse exposed an underground railway tunnel-likely part of the Endordia Empire's subterranean transit system. Instrument feedback suggested the signal source likely lay within this underground passage."
      kuat_legacy.64.a:"Very good, continue the investigation."
      kuat_legacy.65.title:"§EPhase Four: Signal Generator§!"
      kuat_legacy.65.desc:"As [leader.GetName] and her research team advanced northward through the underground tunnel, instrument readings grew increasingly intense, indicating they were on the right path. The tunnel wasn't particularly long, and when compared to maps generated from surface scans of [from.planet.GetName], the area occupied by this passage did not appear on any recorded charts.\n\nAs the team ventured deeper, they discovered the tunnel led only to a sealed underground station. Due to its prolonged burial, the facility had suffered minimal damage. After searching and analyzing the site based on energy signatures, we found a strange spherical device located in what appeared to be a control center. When [leader.GetName] approached the device, its energy signature resonated with the instruments, activating the sphere and projecting a massive screen. On it played footage of the city in its prime.\n\n§YAttention all citizens of the Empire: proceed immediately to Zone A-11 for evacuation boarding. Repeat: proceed immediately to Zone A-11 for evacuation boarding.\nSoldier: Sir, our fleet is no longer capable of combat, but if we don't hold their Colossus Weapons at bay, our people won't escape this facility.\nOfficer: We cannot match them. Order the fleet to retreat to $Name_D_1$. They will pay for this... They are all imperial martyrs........§!\n\nThe recording ended. Our research team concluded this was footage from the Endordia Empire's final evacuation. The empire attempted to evacuate its population from the Ring World-but tragically failed. Most of them likely turned to cosmic dust. Yet we still do not know what this civilization faced. At least now we know of another Sector-$Name_D_1$...."
      kuat_legacy.65.a:"I hope we never reach such a point."
      kuat_legacy.66.title:"§EPhase Five: Ancient Shield§!"
      kuat_legacy.66.desc:"After the activation of the spherical device, our research team observed that the control center's computer systems had powered on. [leader.GetName], by interfacing with the terminal and decoding ancient data, discovered that the Endordia Empire had attempted to construct a planetary defense shield, using Shield Generators to protect this Ring World during wartime. However, the ancient civilization's shields were easily breached, leading to the scene we just witnessed.\n\nUnfortunately, the improved shield technology developed by the Endordia Empire was not preserved in this facility. Nevertheless, we unexpectedly recovered $Name_kuat$'s planetary shield technology from within the structure. While we're uncertain whether this represents the prototype of $Name_kuat$'s tech, we can study this prototype data to determine its viability for practical use.\n\n§RWe should now colonize this ring and assign additional scientists for further research.§!"
      kuat_legacy.67.desc:"Based on our investigation of the ancient archive, the coordinates obtained by our researchers have been verified and monitored over time. This star system exhibits the same characteristics as the special stellar coordinates previously found within crystal beacons. Located in an obscure corner of the galaxy, this system may have gone undetected because its central star collapsed into a Black Hole, rendering it invisible on standard star charts.\n\nWe may now proceed to this new coordinate."
      kuat_legacy.66.a:"Very good."

      kuat_legacy.68.desc:"§H[Root.GetName]§! emerged from the hyperspace corridor into a region devoid of starlight. Throughout §H[From.GetName]§!, not a single normal star exists-only scattered wreckage of countless vessels.\n\nAt the center of §H[From.GetName]§!, §H[Root.GetName]§! detected an artificial gravity well with a radius exceeding 600 AU, likely originating from a massive Dyson Sphere framework. Surrounding the framework are numerous damaged rings orbiting a colossal central structure. These rings appear completely destroyed; probes confirm none can be restored to operational status.\n\nOur scientists believe the gigastructure configuration in this system is highly illogical. A Dyson Sphere should not be built around a Black Hole, nor should habitable ring zones be constructed here. Further detailed analysis is required."
      kuat_legacy.70.desc:"Following further exploration of this starless Sector, our research team determined that the rings here, like the massive rings surrounding them, appear uninhabitable. The Dyson Sphere framework around the central Black Hole seems to have suffered catastrophic damage. The entire system is littered with debris-evidence of a great battle long past.\n\nCombined with information previously obtained in the §EC Sector§!, this was likely the battlefield where the Endordia Empire clashed with $Name_kuat$. The central gigastructure may have served as an ultra-powerful defensive Fortress or a construction hub. For now, its true purpose remains unknown.\n\nOur scientists, studying the wreckage and damaged central structure, found the design closely resembles known gigastructure technologies. If we master Dyson Sphere and Ring World construction techniques, we might attempt to reconstruct this gigastructure."


      kuat_lagacy_5:"§EVortex Facility"
      Kuat_structure_5:"Our researchers conducted long-term investigations into this Ring World facility. Instrument monitoring revealed anomalous tachyon signals-seemingly weak in energy but extremely high in frequency, defying all known physical laws. This discovery has drawn significant attention and deep interest from our scientists. It appears to conceal an unknown secret."
      kuat_lagacy.26.title:"Clue"
      kuat_lagacy.26.desc:"Our research division is fully committed to deciphering the coordinate data embedded within the crystal. After countless analyses and verifications, we are confident the truth is about to emerge. Within the coming years, we will uncover the secrets hidden behind these mysterious coordinates and reveal everything."
      kuat_lagacy.26.a:"Very good"
      kuat_legacy.27.title:"§Y[fallen_empire_kuat.GetName]§!"
      kuat_legacy.27.desc:"Our research indicates the origin of the mysterious crystal traces back to a ring structure zone within [fallen_empire_kuat.GetName]'s territory. This region hosts unique rings whose complex architecture and powerful energy fields provided ideal conditions for crystal formation. Such ring structure zones typically contain abundant resources and undiscovered technologies-possibly explaining the crystal's immense energy.\n\nHowever, [fallen_empire_kuat.GetName] is neither our enemy nor our ally. Possessing formidable military strength and advanced technology, entering their domain risks provoking unnecessary conflict. Therefore, we must act with caution and avoid direct incursion.\n\nPerhaps diplomatic channels could be pursued. We could propose a mutually beneficial arrangement-offering certain concessions in exchange for sovereignty or usage rights over the target star system. This would prevent conflict and grant us peaceful access. By offering needed resources, technology, or strategic support, they might allow entry into the ring structure zone-or even share knowledge about the mysterious crystal.\n\nOur research department is already formulating diplomatic strategies and negotiation plans, aiming to find a solution acceptable to both sides. Meanwhile, we continue studying the crystal's coordinate data, striving to complete our research within years and unveil the truth."
      kuat_legacy_27_second.desc:"According to our findings, the mysterious crystal originated in the ring structure region of [fallen_empire_kuat.GetName]. This area features unique rings with complex configurations and powerful energy fields-ideal conditions for crystal formation. However, [fallen_empire_kuat.GetName] has now become our enemy, preventing direct access for further exploration.\n\nUnder these circumstances, a temporary ceasefire may be a viable strategy. We could use this opportunity to establish limited communication with [fallen_empire_kuat.GetName], perhaps even negotiating a provisional peace agreement. This would buy us valuable time to continue researching the crystal's coordinates while reducing unnecessary conflict and resource expenditure. Through such cooperation, we might achieve a win-win outcome-satisfying our thirst for knowledge while preserving galactic peace and stability.\n\nOf course, caution is essential. We must remain vigilant to safeguard our security and interests. Simultaneously, we will strengthen our defenses and research capabilities to prepare for any unforeseen developments."
      kuat_legacy.27.a:"Good!"
      kuat_legacy.27.b:"Understood."
      kuat_legacy_kuat:"§EVortex Facility§!"
      kuat_legacy_key_world_7_desc:"WARNING: Source localization entry is incomplete"
      misc_system_desc_7_desc:"Our researchers conducted long-term investigations into this Ring World facility. Instrument monitoring revealed anomalous tachyon signals-seemingly weak in energy but extremely high in frequency, defying all known physical laws. This discovery has drawn significant attention and deep interest from our scientists. It appears to conceal an unknown secret."
      misc_system_desc_7_desc_finished:"Our in-depth investigation is complete, and researchers have compiled a detailed report.\n\nIn the early stages, $Name_kuat$ attempted to obstruct our research, warning us not to cross certain boundaries. However, once we formally began, they ceased interference. Our findings show this ring-shaped facility closely resembles the one in $Name_kuat$'s capital, originally intended as a residential zone. Yet these Ring Worlds have been sealed-an unusual situation. Indeed, beneath the Ring World, we discovered an ancient ruin. Scientists exploring the site determined its architectural style differs from $Name_kuat$'s and instead closely resembles Endordia Empire ruins-suggesting it may contain valuable information.\n\nWe successfully uncovered the final legacy of the Endordia Empire, sealed away by $Name_kuat$, along with a projection message from Endordia. From it, we learned that Endordia once defeated $Name_kuat$ and the Eternal Fleet, but ultimately fell to $Name_kuat$. Moreover, behind $Name_kuat$'s rule lies another crisis-these outsiders once unintentionally protected our worlds, but their motives remain unclear. We must not let our guard down.\n\nTherefore, if we choose to betray $Name_kuat$, the Eternal Fleet may become our greatest threat. Intelligence suggests only $Name_kuat$'s Mark I Eclipse-class Star Dreadnoughts can disrupt their systems. Given our current strength, this presents a formidable challenge. We may need to reassess our relationship with $Name_kuat$. Should we oppose $Name_kuat$, we would struggle to face the Eternal Fleet from unknown realms.\n\nWithin the Endordia legacy, we also recovered blueprints for the Mark I Eclipse-class Star Dreadnought-acquired by them from $Name_kuat$. This may help inform our decision.\n\nRegardless, this crisis appears only to have just begun."
      exe_legacy_leberate_war:"§ECeasefire Negotiations§!"
      exe_legacy_leberate_war_DESC:"Given that the mysterious crystal originates from a ring structure zone within [fallen_empire_kuat.GetName]'s territory, and since [fallen_empire_kuat.GetName] is currently not our ally, direct entry into their domain risks provoking conflict. We should consider discussing a ceasefire with [fallen_empire_kuat.GetName]."
      kuat_lagacy.29.title:"Ceasefire"
      kuat_lagacy.29.desc:"Our forces will enter a ceasefire with yours effective immediately"
      kuat_legacy.29.a:"You're lucky"
      stop_the_war_for_relic:"Trade Agreement"

      kuat_legacy.30.title:"§ENon-Habitable Gigastructure"
      kuat_legacy.30.desc:"This was once one of §Y[fallen_empire_kuat.GetName]§!'s primary colonies, but they appear to have abandoned it, converting it into a non-habitable gigastructure. Something secret must be hidden here..."
      kuat_legacy.30.a:"Good, full of spirit-keep searching!"
      kuat_legacy.31.title:"§ELost City"
      kuat_legacy.31.desc:"[leader.GetName], while surveying this massive structure, noticed several inconsistencies within this non-habitable facility. During deeper inspection, [leader.GetName] found that beneath the seemingly solid exterior of this miraculous gigastructure, something felt off-faint, periodic sensor signals pulsing rhythmically from within... Perhaps we can locate the source."
      kuat_legacy.31.a:"Stay safe."
      kuat_legacy.32.title:"§E Security Check"
      kuat_legacy.32.desc:"Although $Name_kuat$ has transferred this star system to us, their local former security personnel require [leader.GetName] to undergo an inspection before landing on the megastructure. After [leader.GetName] and her team underwent the inspection, the faint signal seemed to vanish, significantly impacting our research progress........"
      kuat_legacy.32.a:"Keep searching! I have a feeling we're getting close to the truth."
      kuat_legacy.33.title:"§E Underground City"
      kuat_legacy.33.desc:"After extensive searching, [leader.GetName] finally discovered some strange 'doors' at the junction between this megastructure and another section of it. This confirms our previous suspicions about secrets hidden within this structure. [leader.GetName] slipped through the 'door' when the local guards weren't looking. In [leader.GetName]'s report upon return, she wrote:\n\n§YGoodness, I can't believe there's an enormous underground city complex hidden here. Towering, densely packed buildings fill the interior of the megastructure. If I'm correct, there's even an independent ecological recycling system! My instruments keep indicating that the central spire is emitting a certain signal. I'm certain that the source we've been seeking is that very spire......§!\n\nOur scientific team has decided to proceed toward the central tower ahead. This spire has somehow maintained itself for at least a thousand years inside this uninhabitable ring, just like the surrounding cities. Although there are no signs of life, judging by the well-preserved traces, this appears to be a sealed city evacuated by its inhabitants."
      kuat_legacy.33.a:"I hope they're alright."
      kuat_legacy.34.title:"§E The Eternal 13th Floor"
      kuat_legacy.34.desc:"[leader.GetName] and her scientific team spent an extremely long time finally reaching the central spire. Upon arrival, nearly all our instruments failed, seemingly affected by some kind of magnetic interference. Fortunately, communications remained functional. After analyzing the surroundings, [leader.GetName] chose to press forward. The spire and the underground city formed by surrounding buildings appear completely devoid of life-a deserted city. Traces suggest it was once inhabited, but residents seem to have evacuated for some reason.\n\nThe entrance to the central spire bears the flag of §Y[fallen_empire_kuat.GetName]§!, though somewhat faded. This must be their city ruins.\n\nAfter entering and conducting searches and research, [leader.GetName] and her team found many areas of the spire inaccessible, with some inter-floor elevators non-functional. Fortunately, we discovered one working elevator-but it only goes to the 13th floor."
      kuat_legacy.34.a:"Proceed to the 13th Floor"
      kuat_legacy.35.title:"§E Central Database"
      kuat_legacy.35.desc:"Upon reaching the 13th floor, only a tightly closed door comes into view. As [leader.GetName] approaches, the door seems to sense something and suddenly opens automatically. Inside, [leader.GetName] discovers what appears to be a large database facility or cultivation center. Throughout the hall, cylindrical cultivation tanks are arranged in rows. Most strangely, these tanks appear to be empty.\n\n[leader.GetName] approaches the central console, where multiple screens indicate the facility is in shutdown mode. [leader.GetName] believes this was a clone research laboratory, and perhaps here lies the truth we seek."
      kuat_legacy.35.a:"Continue searching."
      kuat_legacy.36.title:"§E Mysterious Cryo-Chamber"
      kuat_legacy.36.desc:"While advancing further, [leader.GetName] realizes the expansive database area can no longer be exited-the rear door has been sealed shut by some automated control system. Our research team can only move forward.\n\nDuring their advance, the team discovers a very narrow side door behind the facility-only wide enough for one person at a time. [leader.GetName] decides to enter alone. Once inside, she finds herself in a spacious, domed, three-dimensional chamber.\n\nBased on our knowledge of [fallen_empire_kuat.GetName], this appears to be a tomb facility. At its center lies an advanced cryo-chamber, starkly contrasting with the surrounding environment. Otherwise, nothing else seems special. When [leader.GetName] approaches the cryo-chamber, she cannot see inside. However, it is certain that we currently cannot open it. Yet instrument readings show the chamber's material-or internal equipment-matches or closely resembles the mysterious crystal we first discovered. [leader.GetName] believes we must conduct in-depth research on this cryo-chamber; perhaps we should bring it back."
      kuat_legacy.36.a:"Bring it back"
      exe_legacy_unlock_the_minbox:"§E Unlocking the Cryo-Chamber"
      exe_legacy_unlock_the_minbox_DESC:"It's time to unveil the secrets concealed within"
      kuat_legacy.37.title:"§E Unveiling the Esoteric"
      kuat_legacy.37.desc:"Our research department is preparing to study and attempt to open this cryo-chamber. This may reveal the truth behind the Endordia Empire and $Name_kuat$"
      kuat_legacy.37.a:"Open this cryo-chamber at all costs."
      kuat_legacy.38.title:"Empty"
      kuat_legacy.38.desc:"When the heavy cryo-chamber slowly opens, a chilling cold rushes out-but inside, it is completely empty, containing no peculiar objects. Perhaps time has been too long, and any former traces have long since been erased by history. Yet, within the vacant chamber, we notice a strange spherical holographic device lying quietly in a corner, seemingly the only relic left behind by the chamber's owner. Perhaps this is fate's guidance. Perhaps we can activate it and uncover the secrets hidden within ancient times."
      kuat_legacy.38.a:"Activate it."

      kuat_legacy.39.title:"Signal input"
      kuat_legacy.39.desc:"Hello, people of the future. We're glad we could meet you, though sadly we no longer exist and can only greet you in this way...."
      kuat_legacy.391:"Who are you?"
      kuat_legacy.391.desc:"Who we are is no longer important. Throughout the long history of the galaxy, I'd rather no one ever asked. Endordia-we committed too many evils, and now we must pay for everything. Sometimes I wonder, if I hadn't made that decision back then, what would have happened..."
      kuat_legacy.392:"What exactly happened?"
      kuat_legacy.392.desc:"There's little point dwelling on the past. We thought we saw through everything, but reality slapped us hard. We believed ourselves powerful and invincible, thinking everything should belong to us. But we never imagined we were mere puppets, manipulated and toyed with at will. Our time is running short. We are about to face what they call judgment..."
      kuat_legacy.393:"Judgment? What is that?"
      kuat_legacy.393.desc:"We've already lost our chance, but the galaxy's future will surely be bright. We leave this message so that future generations may learn of our experiences and the truth of our downfall. Do not repeat our mistakes. Do not let greed and ambition blind your eyes.\n\nThe council lured us into researching powers that did not belong to us, ultimately leading to our complete annihilation. Beyond the galaxy exist some terrifying entities-perhaps mechanical constructs, perhaps some intelligent defense systems-known to [fallen_empire_kuat.GetName] as the Eternal Fleet. Their ships are indestructible; our conventional weapons cannot harm them in the slightest, and their invasion could destroy all civilizations across the universe.\n\nThough we still do not fully understand why [fallen_empire_kuat.GetName] continuously helped us resist these horrors, their impenetrable defenses truly blocked the Eternal Fleet's incursions. According to our long-term intelligence analysis, [fallen_empire_kuat.GetName] may actually originate from the Eternal Fleet itself, and have been striving to eliminate and control it.\n\nOnce, blinded by ambition and greed, we launched a war against [fallen_empire_kuat.GetName] to seize their entire technology. Shockingly, we succeeded-defeating [fallen_empire_kuat.GetName] and seizing part of their technology. But this was merely the beginning of the war; the gears had already begun turning.\n\nJust as the entire nation reveled in victory, the Eternal Fleet suddenly appeared. They destroyed countless worlds with overwhelming force, shattering nearly all our defenses. Our fleets were helpless before them-weapons failed to fire, losses were catastrophic. Yet our scientists refused to give up. Through arduous exploration, they finally discovered the Eternal Fleet's weakness. To their astonishment, the special signal interference of the Eternal Fleet could be blocked by the stellar dreadnoughts we had seized from [fallen_empire_kuat.GetName]. Thus, at great cost, we ultimately destroyed the Eternal Fleet.\n\nYet the war was not over. [fallen_empire_kuat.GetName] returned, arriving with massive fleets and effortlessly destroying our defenses and every warship. Already weakened by the Eternal Fleet's invasion, we had no strength left to fight. Our allies also chose to side with [fallen_empire_kuat.GetName], leaving us isolated and helpless.\n\nIn the end, we were utterly defeated. The imperial government signed an agreement with [fallen_empire_kuat.GetName]. They would preserve a fragment of our civilization, modifying and purging it. Our former military, government, and all hardliners would pay for our arrogance with their lives. Everyone must abide by this agreement, and this history shall remain buried-until someone finds the message we left behind.\n\nHistory must not be forgotten. [fallen_empire_kuat.GetName] are outsiders-they will inevitably bring disaster. Our time is short, but here we leave behind blueprints of a stellar dreadnought obtained from [fallen_empire_kuat.GetName]. Though incomplete, partial assembly should be feasible. May the Strength be with you."
      kuat_legacy.394:"May the Strength be with you"
      exe_legacy_unlock_the_millitary_eclipse:"§E Study the Blueprints"
      exe_legacy_unlock_the_millitary_eclipse_DESC:"Based on the blueprints left by the hologram, we might be able to reconstruct this vessel"
      kuat_legacy.40.title:"Analysis Complete"
      edict_build_eclipse:"Analyzing $kuat_name_ESDD$"
      edict_build_eclipse_desc:"Analyzing $kuat_name_ESDD$"
      kuat_legacy.40.desc:"Despite the extremely high technical difficulty of the technological data obtained from the ruins, our researchers did not abandon efforts to overcome our technological challenges.\n\nFinally, thanks to the relentless day-and-night research by our scientific department, we successfully reconstructed the design schematics and construction methods for this super battleship. A report issued by the Imperial Research Department emphasizes that the components of this class of vessel utilize technology originating from $Name_kuat$. Therefore, we must use $Name_kuat$ shipbuilding facilities to construct such vessels-perhaps Stellar Hubs or Eternal Fortresses could build them."
      kuat_lagacy.41.title:"Trade"
      kuat_lagacy.41.desc:"We will transfer the $NAME_Kuat_1$ star system to your side. According to our mutual agreement, §Ryou must complete all your tasks within the 20-year deadline we specified§!. Regardless of completion, we will reclaim ownership of the star system at that time. Cooperation happy."
      kuat_legacy.41.a:"Pleasure doing business"
      kuat_lagacy.411.title:"Protocol fulfilled"
      kuat_lagacy.411.desc:"According to our agreement, you have now reached the limit acceptable to us. You should now fulfill your obligation under our joint declaration regarding the return of control over the $NAME_Kuat_1$ Sector. Our fleets have arrived and reclaimed this sector; it is time for you to leave."
      kuat_legacy.411.a:"Wait"
      kuat_lagacy.412.title:0 "Lead lost"
      kuat_lagacy.412.desc:0 "With [fallen_empire_kuat.GetName] terminating our territorial exchange treaty, we will now lose all units located within the $NAME_Kuat_1$ system.\n\nAffected by this, our research department's study of the crystal beacon has also come to a standstill. At least for the foreseeable future, we will be unable to actively advance our research into the crystals. Additionally, intelligence indicates that [fallen_empire_kuat.GetName]'s military forces have been frequently mobilized recently-this change may further worsen the situation.\n\n§Y(We are losing our chance to uncover the final secrets of the crystal beacon. Next time, we must seize this opportunity.)§!"
      kuat_legacy.412.a:0 "Keep an eye on them!"

      kuat_lagacy.251.name:"§EAncient Archive"
      kuat_lagacy.251.desc:"It has been some time since we arrived at the ringworld of $Name_A_1$. During this period, our researchers have never ceased searching for the reason this ringworld can maintain its position within the gravitational environment of a Black Hole. Currently, our scientists preliminarily judge that the Black Hole was not naturally formed but artificially created, as the gravity here differs from what we've previously encountered in other Sectors. Perhaps this is why the ringworld remains intact.\n\nThe ringworld's environment is highly habitable after restoration. However, analysis of the ruined cities and facility debris suggests this location once served as a wartime supply depot for the Endordia Empire, though we still do not know who their enemy was. This Sector suffered severe devastation.\n\n§YOur researchers have discovered several tower-like structures. These towering edifices were not detected during our initial survey of the ringworld. Perhaps we should conduct deeper investigations..."
      kuat_lagacy.252.name:"Fragmented"
      kuat_lagacy.252.desc:"During deep exploration of the ringworld's archive, our researchers have finally uncovered long-buried secrets. By deciphering ancient and complex records, we have glimpsed the former glory and vicissitudes of this ringworld.\n\nThis was once an impregnable Fortress, guarding peace within the star system. However, the system's center originally did not contain a Black Hole. That Black Hole was formed when a superweapon controlled by the Endordia Empire collapsed a star upon its destruction. Yet through unknown means, the Endordia Empire prevented the ringworld's collapse, preserving this ancient defensive structure.\n\nWithin this Sector, the Endordia Empire once fought against a mysterious extragalactic force. Facing overwhelming enemies, the Endordia Empire could not resist and resorted to extreme measures-detonating an ancient war fortress reverse-engineered from extragalactic civilization, attempting to annihilate enemy fleets within the star system. Tragically, this action failed to eliminate the enemy, instead causing the destruction of both the fortress system and the Endordia Empire's last stronghold.\n\nFortunately, the ancient database within the ringworld remained intact, like a silent witness across time, patiently awaiting our discovery. Perhaps we can use this opportunity to restore the ancient war fortress and revive its former glory. But achieving this goal requires further research and deeper exploration to find the key unlocking vital information within the database.\n\nThis is a race against time and a challenge against the unknown. Our researchers are giving their utmost to uncover more secrets hidden deep within the ringworld, to explore forgotten pasts, and to safeguard our shared future."
      kuat_lagacy.251.a:"What exactly happened......."
      kuat_lagacy.252.a:"Immediately begin research....."
      kuat_lagacy.252.b:"Extragalactic force......"
      kuat_lagacy.74.desc:"It has been some time since we arrived at the ringworld of $Name_B_1$. During this period, our researchers have never ceased searching for the reason behind the ringworld's ecological restoration. Currently, our scientists preliminarily believe this was achieved by terraforming devices sealed by the Endordia Empire.\n\nAfter restoration, the ringworld exhibits excellent Habitability. Furthermore, our research team discovered a strange precursor city among the ruins. Analysis of the ruined cities and facility debris indicates this location once served as a ship design facility for the Endordia Empire. Although destroyed by $Name_kuat$, there may still be valuable data remaining. This Sector suffered severe devastation.\n\n§YNotably, our researchers have discovered several tower-like structures. These towering edifices were not detected during our initial survey of the ringworld. They likely emerged after terraforming. Perhaps we should deeply investigate the Esoteric secrets within........"
      kuat_lagacy.75.desc:"Our researchers have successfully uncovered the hidden secrets of this ruin. This site served as a temporary ship research center during the conflict between the Endordia Empire and $Name_kuat$. It gathered many of their elite personnel and scientists. Due to deteriorating frontline conditions and defeats, the Endordia Empire decided to relocate their research operations to this rear-area Fortress, attempting to develop powerful weapons to defeat their enemies. Based on limited data, we cannot fully reconstruct their original research. However, during our investigation, partial information obtained earlier matches extensively with data found here. Within the precursor city, our researchers discovered results related to small tactical support vessels they called ---- Guardian Star Cruiser. Limited by scarce information, we can only enable construction of this design, though our weapons seem incompatible. Fortunately, the ship's blueprint includes a custom weapon system.\n\nAdditionally, our research team recovered blueprints and technological guidance data for ships resembling $Name_kuat$ from the facility's database. We can now use these technologies to recreate products previously beyond our capabilities!"
      kuat_lagacy.76.desc:"It has been some time since we completed the investigation of the facilities at $Name_D_1$. During this period, our researchers have never ceased searching for the secrets hidden within these installations. Currently, our scientists preliminarily believe this to be a massive facility complex-meaning this won't be the last one.\n\nAfter intensive investigation of the damaged stellar hub, our researchers found key internal equipment still operational. This suggests the facility may be repairable. Additionally, within the central computer of the hub, we discovered a sealed facility coordinate. According to computer data, this sealed coordinate appears to involve circumstances so sensitive that the Endordia Empire dared not investigate it. Perhaps we can further analyze and locate the facility within this coordinate system.\n\n§YOur researchers believe we should proceed with investigation. This may provide further clues to Uncover the mysteries of the facility zone........"
      kuat_lagacy.90.desc:"It has been some time since we arrived at the ringworld of $Name_C_1$. During this period, our researchers have never ceased searching for the reason behind the ringworld's ecological restoration. Currently, our scientists preliminarily believe this was achieved by terraforming devices sealed by the Endordia Empire.\n\nAfter restoration, the ringworld exhibits excellent Habitability. Furthermore, our research team discovered a strange precursor city among the ruins. Analysis of the ruined cities and facility debris indicates this location once served as an advanced technology research center for the Endordia Empire. Although destroyed by $Name_kuat$, there may still be valuable data remaining. This Sector suffered severe devastation.\n\n§YNotably, our researchers have discovered several tower-like structures. These towering edifices were not detected during our initial survey of the ringworld. They likely emerged after terraforming. Perhaps we should deeply investigate the Esoteric secrets within........"
      kuat_lagacy.77.desc:"After seven years of research, our scientists have finally broken through the final layer of encryption sealed by the Endordia Empire. As anticipated from discoveries within the stellar hub, this is a star system coordinate unlike any we've seen before. Perhaps we can now travel to this system."
      kuat_legacy.91.title:"Research breakthrough"
      kuat_lagacy.91.desc:"During our researchers' deep investigation of the newly appeared ancient tower structures, they discovered these were specialized facilities used by the Endordia Empire to store backup special coordinates. Although most data has been damaged, our researchers still uncovered a relatively concealed coordinate. A new star system coordinate has appeared on our star map-we should seek it out."
      kuat_lagacy.75.a:"At least we still have the blueprint."
      kuat_legacy.47.name:"Megastructure complete"
      kuat_legacy.47.desc:"[build_the_exe_eternal_starbase.GetName] has completed construction of $exe_megastructure_starbase$. What [build_the_exe_eternal_starbase.GetName] will do under the support of the mad war machine remains unknown... but we must remain vigilant!"
      kuat_legacy.47.a:"Truly insane"
      kuat_legacy.48.name:"Signal input"
      kuat_legacy.48.desc:"$exe_megastructure_starbase$? This is an extremely powerful Fortress, yet it cannot alter the fate of its previous owner. Will history repeat itself or be rewritten? We shall see...\n\nNothing comes for free. §YSome price will ultimately be paid......."
      kuat_legacy.48.a:"You have no right to interfere with us!"

      kuat_legacy.78.title:"Signal received"
      kuat_legacy.78.desc:"Greetings, outsiders. We are the $Name_Kuat_Fire_base$ of this facility. We are pleased to meet you. However, it has been a very long time since we last encountered a new sentient species. The last time we met outsiders, they called themselves Endordians-but that was tens of thousands of years ago. Can we talk? Of course, due to dangerous installations in our system, we cannot allow you to enter. All passages into this region have been sealed. Communication via transmission is a good alternative. Is there anything you wish to know?"
      kuat_legacy.79.desc:"We do not know who we are or where we come from. Generation after generation, our ancestors taught us to uphold our mission and values. This facility is part of our lives and the meaning of our existence. Therefore, we will dedicate our entire lives to defending it. Is there anything else you wish to know?"
      kuat_legacy.82.desc:"Yes, mission. Both $Name_kuat$ and we fulfill our duties. This applies not only to us, but to everyone in this world-every race, every nation has their own mission and responsibilities. Our ancestors' legacy tells us we do not belong here. Even if it costs our lives, we must fulfill our duty and mission here-supervising this facility and overseeing everything occurring in this world. But like previous outsiders we've encountered, you are also special. You do not belong here.......\n\n§RDo not enter our star system.§!"
      kuat_legacy.80.desc:"This is our duty and mission. Even at the cost of our lives, we must supervise this facility. I believe you possess similar determination. I think we should understand and respect each other.\n\nIs there anything else you'd like to know?"
      kuat_legacy.80.a.desc:"The council has issued a final order: even at the cost of our lives, we must supervise this facility.\n\nIs there anything else you'd like to know?"
      kuat_legacy.83.desc:"We cannot reveal all information about this facility to you, but we can share some unimportant details.\n\nThis facility is called Starkiller Base. As you can see, it was once a World, transformed into this form after modification. However, Starkiller Base has certain issues, so we must supervise and seal it."
      kuat_legacy.84.desc:"As its name suggests, this is a combat Fortress of immense power. This Fortress was once a Kyber crystal mine.\n\nKyber crystals are rare formations found naturally across various planets in the galaxy. Typically used by Jedi and Sith to construct lightsabers, they can focus vast amounts of energy, making them ideal components for turbolaser weapons.\n\nIt is precisely the immense power of these crystals-and the large quantity once housed within this facility-that made Starkiller Base a terrifying Fortress. It can focus stellar energy into a high-energy beam capable of destroying entire target star systems or even stars."
      kuat_legacy.85.desc:"This is indeed a difficult question. This Fortress was not built during a single era or by a single nation. The great Galactic Empire mined these energy-rich crystals here. Later, the First Order took over, utilizing the mining infrastructure to completely transform the planet into a superweapon launch platform. Yet they ultimately failed."
      kuat_legacy.86.desc:"Yes, the First Order. They should never have arisen. After the Empire's fall, they seized and consolidated Imperial remnants, attempting to use this weapon system to achieve galactic domination. The First Order used the entire World as a weapons platform, establishing this Fortress as their foothold within this region of space. This modified, mobile frigid planet hosts numerous First Order soldiers, officers, and scientist.\n\nIt was also equipped with a planetary Shield Generator to withstand orbital bombardment. Yet they ultimately failed. Our ancestors, under orders from the Imperial Council, rebuilt this Fortress. But we cannot allow this installation to become a weapon of galactic destruction. We must seal it with our lives and future. Neither the Imperial Council nor $Name_kuat$ can shake our resolve."
      kuat_legacy.86.a.desc:"Yes, the First Order. They should never have arisen. After the Empire's fall, they seized and consolidated Imperial remnants, attempting to use this weapon system to achieve galactic domination. The First Order used the entire World as a weapons platform, establishing this Fortress as their foothold within this region of space. This modified, mobile frigid planet hosts numerous First Order soldiers, officers, and scientist.\n\nIt was also equipped with a planetary Shield Generator to withstand orbital bombardment. Yet they ultimately failed. We supervise and seal this location."
      kuat_legacy.81.desc:"As we said, we believe our supervision will ensure the facility remains completely sealed. We trust our determination and capability to defend our mission and fulfill our responsibilities."
      kuat_legacy.81.a.desc:"According to the facility preservation regulations passed by $Name_Kuat_Fire_base$, this facility is a First Order remnant installation, and transfer of usage rights must go through formal facility transfer procedures."
      kuat_legacy.87.desc:"Our strength and capability are sufficient to fulfill our duties, and this is something we must do. If you want this fortress, you'll have to take it over our dead bodies!\n\nOf course, we're not entirely inflexible. As long as you pay us 50% of your inventory every 5 years for §R20§! years, we will grant you this fortress. Sounds like a fair deal, doesn't it?"
      kuat_legacy.87.a.desc:"$Name_Kuat_Fire_base$ will transfer the facility to you, provided you pay us 50% of your inventory every 5 years for §R20§! years."
      kuat_legacy.78.apacalytic:"$Name_Kuat_Fire_base$ sent us."
      kuat_legacy.78.who:"Who are you?"
      kuat_legacy.78.response:"We'll talk again later. I hope we won't meet as enemies."
      kuat_legacy.79.continue:"Mission?"
      kuat_legacy.78.why:"Why regulate the facility?"
      kuat_legacy.78.what:"What good is your oversight?"
      kuat_legacy.78.exist:"We understand."
      kuat_legacy.79.back:"Let's discuss other topics."
      kuat_legacy.80.continue:"What is this facility?"
      kuat_legacy.81.continue:"But we believe your strength is insufficient."
      kuat_legacy.81.continue_apacalytic:"We will proceed according to protocol and execute the transfer procedure."
      kuat_legacy.82.continue:"We have understood."
      kuat_legacy.83.continue:"What is Starkiller Base?"
      kuat_legacy.83.from:"Who built this facility?"
      kuat_legacy.83.apacytic:"We need this facility."
      kuat_legacy.84.continue:"Truly terrifying weapon."
      kuat_legacy.85.continue:"The First Order?"
      kuat_legacy.86.continue:"Absolutely horrifying."
      kuat_legacy.87.continue:"§ROur mission shall be fulfilled on your behalf.§!"
      kuat_legacy.87.warning:"§RWe shall become their enemy. They will use Starkiller Base to attack our capital system. We may need to relocate our capital to avoid greater losses.§!"
      kuat_legacy.87.second_continue:"§GPerhaps we could try a less violent approach.§!"
      kuat_legacy.87.second_continue_apacalytic:"We will comply with regulations."
      kuat_legacy.87.second_continue.RES:"A wise choice. We trust you will honor your promise.\n\nThen, as agreed, we will collect half of your Energy Credits inventory every 5 years for 20 years."
      kuat_legacy.871.title:0 "Agreement."
      kuat_legacy.871.desc:0 "The $Name_Kuat_Fire_base$ who delivered Starkiller Base recently sent us an urgent communication, demanding immediate transfer of 50% of our Energy Credits inventory as per our agreement. Should we comply?"
      kuat_legacy.871.a:0 "Honor the agreement."
      kuat_legacy.871.b:0 "They're all gone now, and no longer deserve this payment."
      kuat_legacy.871.b1:"The debt has been settled."
      kuat_legacy.871.c:0 "We are about to complete this agreement."

      kuat_legacy.872.desc:0 "This is truly shocking. You have broken the promise you made. We chose to trade with you because we decided to trust you, and clearly, you have betrayed our expectations.\n\nNow, it's time for retribution. Several of your worlds have become targets of our weapons. Expect our strike soon."
      kuat_legacy.872.a.desc:"Thank you greatly for your support and understanding. Now, all our agreements are nullified- the base now belongs to you. We hope you make good use of this weapon.\n\nAs a reward for honoring your commitment, we will grant you two brand-new starship dreadnought designs. You will soon be permitted to construct them at your shipyards. Additionally, we will give you a reinforcement beacon. With this beacon, you will become our security client and enjoy the protection services we provide."
      kuat_legacy.872.second_continue.a:"It was a pleasure working with you. Cooperation well done."
      kuat_legacy.872.continue:0 "Everything is mine-what gives you the right?"
      kuat_legacy.872.warning:0 "§R$Name_Kuat_Fire_base$ will punish us and strike multiple of our world systems.§!"
      kuat_legacy.872.second_continue:0 "Pleasure doing business!"


      kuat_lagacy_41:"§EShadow of the Ancients"
      Kuat_structure_41:"Damaged ringworld ruins, within which there seem to be some clues regarding the key to unlocking their database-this will form the foundation for unraveling the ancient mystery."
      kuat_lagacy_51:"§EShadow of the Ancients"
      Kuat_structure_51:"Damaged ringworld ruins, within which there seem to be some clues regarding the key to unlocking their database-this will form the foundation for unraveling the ancient mystery."
      kuat_legacy.180.name:0 "§EShadow of the Ancients"
      kuat_legacy.180.desc:0 "Our scientists have made a major breakthrough through exploration and research of the ancient database within the ringworld. Regarding the Endordia Empire's database in this Sector, we discovered that on a habitable ringworld diagonally opposite to this Sector lies a band-like structure resembling an automated research facility, emitting a similar frequency of ancient tachyon signals. Although extremely faint and concealed, our scientists still detected traces of the database key we seek within this region that appears identical to ordinary ringworlds. We should now initiate relevant research into this database to assist our future scientific projects and advancements.\n\nNotably, this ringworld region once belonged to a research center of the Endordia Empire. Based on our prior database studies, [ancient_shadow_place.GetName] may become a crucial pathway toward deepening our understanding of the Endordia Empire. We should now dispatch our scientists to inspect and analyze the relics in this Sector."
      kuat_legacy.180.a:0 "Immediately deploy our scientist!"
      kuat_legacy.181.name:0 "§EBand Facility"
      kuat_legacy.181.desc:0 "After receiving imperial orders, our [leader.GetName] led his team aboard our orbital vessel to approach this band. Unlike the ringworlds we previously landed upon in this Sector, this is a non-habitable band seemingly composed entirely of automated facilities. Preliminary research and geological surveys indicate it served as a supply depot for scientific operations under the Endordia Empire.\n\nHowever, what concerns us is that vital information necessary for unlocking the ancient database may be hidden somewhere within this ring.\n\n[leader.GetName] believes we must not give up here. He has already conducted a comprehensive scan and survey of this band using our advanced instruments. We should now await new data."
      kuat_legacy.181.b.desc:0 "After receiving imperial orders, our [leader.GetName] led his team aboard our orbital vessel to approach this band. This ring bears notable similarities to the one we previously accessed at Facility A within this Sector-it too is a non-habitable band composed of automated installations. Initial research and geological surveys suggest it functioned as a military research supply facility for the Endordia Empire.\n\nNotably, critical information essential for unlocking the ancient database may be concealed within this ring, potentially accelerating our research progress.\n\nFollowing the previous successful excavation, [leader.GetName] believes we must not cease efforts. She has initiated a full-scale scan and investigation of this band using our advanced instruments. We should now await new intelligence."
      kuat_legacy.181.a:0 "Good."
      kuat_legacy.182.name:0 "§EDevastated Habitation Zone"
      kuat_legacy.182.desc:0 "Through prolonged comprehensive scanning, the ringworld facility now lies fully exposed before us. As our scientists hypothesized, this installation was indeed an automated research facility of the Endordia Empire.\n\nSince the Endordia Empire appears to have suffered some catastrophe, this facility-like earlier rings we've visited-was bombed and destroyed by an unknown force. However, they appear to have deliberately slowed their bombardment; otherwise, it would be nearly impossible for us to still find abandoned colony ruins bearing burn marks across certain areas of the ring.\n\nOur scientists therefore deduce that this ringworld, like others, was targeted by the civilization that attacked this Sector. Yet overall assessment shows this site remains relatively intact-possibly because the unknown attackers discovered something here, causing them to slow their assault, or perhaps due to some unknown factor hindering destruction. This may help us locate the decryption key to the ancient database."
      kuat_legacy.182.b.desc:0 "Through prolonged comprehensive scanning, the ringworld facility now lies fully revealed before us. Like the previous ruin, this installation was not only an automated research facility of the Endordia Empire but also a military technology testing center. From residual architectural traces, we believe further information about this site can still be obtained.\n\nClearly having suffered catastrophic damage, this facility-like prior rings-was bombed and destroyed by an unknown force. Whether due to shielding or other reasons, the attackers appear to have deliberately slowed their bombardment; otherwise, finding post-bombardment habitation zones with burn-marked ruins would be nearly impossible.\n\nOur scientists thus conclude that, like other rings, this one was targeted by the civilization that devastated this Sector. Yet certain circumstances allowed this and the previous facility to preserve fragments of data. Overall surveys show conditions here are nearly identical to earlier sites-suggesting similar technologies or artifacts may remain. These powerful technological remnants might explain why these facilities survived, and could aid us in locating the decryption key to the ancient database."
      kuat_legacy.182.a:0 "Good progress."
      kuat_legacy.183.name:0 "§EDead City"
      kuat_legacy.183.desc:0 "Our scientists' initial assumptions may have been flawed. Further investigation into the urban ruins of this Sector's ringworld reveals that our current ring was likely destroyed via a low-damage bombardment method.\n\nJudging from most cities across the ring, these urban structures are not as ruined as previously discovered habitable zones. In fact, many high-rise buildings remain standing even after the conflict.\n\nWithin this relatively preserved city ruin, our scientists surprisingly found no signs of life in the planetary surface environment. Thermal scans confirm complete biological extinction throughout the surrounding area-strikingly similar to neutron purification bombardment. The attackers clearly employed this inhumane tactic to utterly annihilate the entire installation. Today, this place stands as a dead city.\n\nNotably, our tachyon sensors detected a faint, intermittent tachyon signal emanating from a central tower within this city. Our scientists believe this may be the location of the database key we seek."
      kuat_legacy.183.b.desc:0 "Learning from past explorations, our scientists provided a more accurate conclusion after further examination of the urban ruins on this Sector's ringworld: our current ring was likely destroyed using a low-damage bombardment method-clearly intentional, designed to preserve documents or critical data.\n\nCompared with findings from the previous ruin, these urban facilities are far less degraded than earlier habitable zones-even better preserved than prior intact installations. Towering structures still stand across the endless surface, though devoid of life.\n\nComparative analysis confirms this facility, like the last, was subjected to a method akin to neutron purification, eliminating nearly all surface life. Thus, the city has become entirely lifeless.\n\nYet our investigators, analyzing tachyon sensor data from the ring, detected a faint, intermittent tachyon signal from the central tower. Our scientists believe this marks the location of the database key we seek."
      kuat_legacy.183.a:0 "Strange indeed."
      kuat_legacy.184.name:0 "§ERelic Spire"
      kuat_legacy.184.desc:0 "After extensive searching and exploration of the relic spire at the city center, we can now confirm definitively that the faint, intermittent, and concealed signal originates continuously from this very spire. The spire appears completely sealed, preventing our investigators from obtaining surface-level information.\n\nHowever, structural analysis of the entire spire yielded a major breakthrough. Near a load-bearing column at the northeast corner, we discovered a recessed structural area. Its shape resembles the imperial flag of the Endordia Empire. Using material samples and texture patterns recovered from prior ruins, our scientists fabricated a replacement component via 3D printing. After [leader.GetName] inserted the printed piece, a loud noise erupted from the southeast side-the massive door there swung fully open.\n\nOur investigators may now enter the spire to search for our objective."
      kuat_legacy.184.b.desc:0 "After extensive searching and exploration of the relic spire at the city center, we can now confirm-as with the prior ruin-that the faint, intermittent, and concealed signal continues to emanate from this spire. The structure remains completely sealed, denying surface access to our investigators.\n\nHowever, structural analysis yielded a breakthrough. Near a load-bearing column at the northwest corner, we found a recessed structural zone shaped similarly to the Endordia Empire's imperial flag. Using materials and patterns from earlier ruins, our scientists printed a replacement component. When [leader.GetName] inserted it, a loud noise came from the southeast side-the door there opened completely.\n\nOur investigators may now enter the spire to search for our objective."
      kuat_legacy.184.a:0 "Incredible."
      kuat_legacy.185.name:0 "§EAncient AI"
      kuat_legacy.185.desc:0 "After surveying most areas of the relic spire, our research team uncovered almost no valuable data. Upon entering the spire, our instruments began erratic fluctuations, completely losing signal detection capability.\n\nNow, our team must rely solely on themselves to locate our target. After a long, fruitless, and disappointing investigation, our [leader.GetName] discovered a hidden facility beneath the spire. After cracking its security system, certain intelligent management systems were inadvertently activated. Before being detected by security protocols, our team quickly hid inside. Within the concealed chamber, [leader.GetName] found a massive mechanical entity atop the central computer-an apparent large-scale computational intelligence system from a bygone era. Through decryption and study of the terminal interface, our team confirmed this is precisely the object we sought.\n\nNotably, multiple encrypted messages were discovered within-we require additional time for research and decryption."
      kuat_legacy.185.b.desc:0 "After surveying most areas of the relic spire, the surface layers proved-as before-devoid of meaningful data.\n\nMoreover, upon entry, our instruments frequently malfunctioned, unable to withstand strange magnetic fields within the tower, rendering signal detection nearly impossible. Our team must now rely on themselves alone to find our objective.\n\nAfter a long, fruitless, and disappointing investigation, our [leader.GetName] discovered a hidden underground facility. After bypassing its access controls, certain intelligent management systems were accidentally triggered. Our team swiftly took cover before detection. Inside, [leader.GetName] found a massive mechanical entity atop the central computer-a likely large-scale computational intelligence from a prior age. Decryption and analysis of the management terminal confirmed this as our target.\n\nNotably, multiple encrypted messages were found-we require further time for research and decryption."
      kuat_legacy.185.a:0 "Excellent. Continue decryption!"
      kuat_legacy.186.name:0 "§EShadows of the Past"
      kuat_legacy.186.desc:0 "§YDirector, will Plan A truly succeed? Will we really win?\n\n§GInsolence! We must only fulfill our duties. High Command has made all preparations. We live as servants of the Empire, and die as its ghosts. You knew this when you joined.\n\n§YB-but... is all this truly right? Could High Command be mistaken? Is there still room for reversal? Why did that brief prosperity end so suddenly? Too fast... too fast...\n\n§GEnough! Speaking such treason is a capital offense. The past is gone like smoke-there is no return. We must focus on the present. We shall become pivotal weights in this war. If Plan A succeeds, victory shall be ours.\n\n§YBut... ah, yes! You're right. We have no retreat. May the Eternal Fortress delay their advance."
      kuat_legacy.186.b.desc:0 "§YDirector, Plan A has failed. Another path is lost.\n\n§GNo. We have not yet lost. You remain. I remain. We all remain. This war has only begun.\n\n§GHmm... but the situation is grim. With the second defensive line likely to fall within three solar days, we must accelerate our plans. Once Guardian succeeds, those accursed invaders will pay in blood.\n\n§YThe Emperor has learned of Facility A's fall, yet sent no reinforcements. Perhaps... is Guardian even effective...?\n\n§GSilence! Even if we perish, they'll lose skin too.\n§YPerhaps... I don't know. Will they... intervene...?"
      kuat_legacy.186.a:0 "......"
      kuat_legacy.192.name:0 "§EDecryption Complete"
      kuat_legacy.192.desc:0 "After extensive research contributing significantly across multiple imperial scientific disciplines, our team successfully decrypted the database in this Sector. [leader.GetName] unlocked the encrypted data within the underground database beneath the central spire. Fortunately, this was exactly what we sought. These decrypted files enabled full decryption of the core ship database. We now clearly possess original weapon design data researched at this facility. Once we parse the raw data, we can claim the hidden technologies buried within these ruins. However, we still haven't identified the enemy who destroyed the Endordia Empire-perhaps these raw files hold answers.\n\nWe should now evacuate this region.\n\n$ancient_shadow_place$"
      kuat_legacy.192.b.desc:0 "After extensive research contributing significantly across multiple imperial scientific disciplines, our team successfully decrypted the database in this Sector. [leader.GetName] unlocked the encrypted data within the underground database beneath the central spire. Fortunately, this was exactly what we sought. These decrypted files enabled full decryption of the core ship database. We now clearly possess original weapon design data researched at this facility. Once we parse the raw data, we can claim the hidden technologies buried within these ruins. However, we still haven't identified the enemy who destroyed the Endordia Empire-perhaps these raw files hold answers.\n\nWe should now evacuate this region.\n\n$ancient_shadow_place_B$"
      kuat_legacy.192.a:0 "You are exemplars and pride of the people of [owner.GetName]."
      kuat_legacy.192.b:0 "You are exemplars and pride of the people of [owner.GetName]."
      kuat_legacy.192.c:0 "You are exemplars and pride of the people of [owner.GetName]."

