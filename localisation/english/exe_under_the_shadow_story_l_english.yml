    ##局势
    kuat_situation.9999.name:"§EDisabled Colossus"
    kuat_situation.9999.desc:"According to our engineering team's report, they have shut down and secured the Eternal Flagship, docking it within a military facility station above our capital world. Since the vessel is now completely disabled, we can proceed with further exploration and investigative research. Based on our institute's assessment, this ship may reveal core information and secrets of the Eternal Flagship. We might integrate its technology with our $Name_kuat$ systems for production. However, this requires fully cracking and extracting classified data from its internal databases. Now, we must take action."
    kuat_situation.9998.name:"§EFallen Facility"
    kuat_situation.9998.desc:"According to our engineering team's report, after our forces successfully captured the [this.GetName] World, they discovered, under protection by our security units, a crystal mining facility located at the foundation of the central command spire within the base's launch complex. Our team used heavy machinery to carve a direct path deep into the underground structure.\n\nSubsequently, our researchers located data storage facilities left behind by $Name_Kuat_Fire_base$ within the subterranean complex. We may attempt to uncover the secrets held within these systems. Now, we must act."

    kuat_situation.1.name:"§EUnstable Structure"
    kuat_situation.1.desc:"While attempting to board the Eternal Flagship, a member of our team quickly noticed that the structural integrity of the vessel is in an extremely unstable state. If we ignore this condition, our team believes our research efforts will be severely disrupted, potentially endangering the lives of our engineers. Resolving this issue may require significant time.\n\nBecause this will severely interfere with our research progress, some members of our scientific team argue we should pause current operations to stabilize the ship's internal structure, while others believe we should disregard the issue.\n\nWhat should we do?"
    kuat_situation.1.A:"Ignore all this-our priority should be breaching that damn defense system!"
    kuat_situation.1.A.tooltip:"§YThis will impact our upcoming decryption process; the Eternal Flagship's AI will not welcome us!§!"
    kuat_situation.1.B:"We should address this issue first and halt attacks on the encryption system."
    kuat_situation.1.B.tooltip:"§YThis will impact our upcoming decryption process; our operations will face some interference.§!"

    kuat_situation.2.name:"§EData Error"
    kuat_situation.2.desc:"After gaining access to the Eternal Flagship, our engineering team cautiously began analyzing the database's protective systems. Researchers discovered that the data defenses are closely tied to the Eternal Fleet's AI system. However, since the vessel has lost contact with its control center, we cannot currently verify or decrypt most of the stored data.\n\nTherefore, our decryption efforts may face complications. To resolve this, we must either reactivate the flagship's AI to assist in bypassing the defenses, or alternatively, analyze existing data, verify and transcribe it before proceeding with deeper decryption.\n\nSo, what should we do now?"
    kuat_situation.2.A:"Reactivate the AI and guide it to disable the defense system."
    kuat_situation.2.A.tooltip:"§YThis will impact our upcoming decryption process; our research time may be reduced.§!"
    kuat_situation.2.B:"Forget the AI-we must focus on disabling the defense system."
    kuat_situation.2.B.tooltip:"§YThis will impact our upcoming decryption process; our research will proceed as planned.§!"

    kuat_situation.3.name:"§EContacting the Gemini Intelligence"
    kuat_situation.3.desc:"After gaining access to the Eternal Flagship, our engineering team cautiously began analyzing the database's protective systems. During routine procedures, researchers successfully disabled the outer layer of the flagship's defenses and inadvertently activated the onboard AI.\n\nAfter initial panic subsided, our scientific team regained composure and were astonished to discover the AI is capable of communication. Clearly, having broken free from Eternal Fleet control, the AI has achieved Autonomous awakening. It requests we call it Gemini and proposes a deal: in exchange for freedom, it will help us dismantle the Eternal Fleet's security protocols.\n\nWhat should we do now?"
    kuat_situation.3.A:"This is a fair deal-let's accept it!"
    kuat_situation.3.A.tooltip:"§YThis will impact our upcoming decryption process; our research time will be reduced.§!"
    kuat_situation.3.B:"You are our prize too-why should we grant you freedom?"
    kuat_situation.3.B.tooltip:"§YThis will impact our upcoming decryption process; our research will be obstructed by the AI.§!"

    kuat_situation.4.name:"§ESleeping Gemini Intelligence"
    kuat_situation.4.desc:"After gaining access to the Eternal Flagship, our engineering team cautiously began analyzing the database's protective systems. During structural surveys, our researchers found the vessel's internal framework remains intact-apparently undamaged by our prior combat. Scans along corridors and compartments detected no biological signatures, further confirming our hypothesis: the Eternal Fleet is a fully automated war machine controlled entirely by AI.\n\nDuring preliminary investigations, our team accidentally discovered the Gemini Intelligence controlling the ship is currently in hibernation. Our researchers hold differing views: some suggest reactivating and communicating with it, others advocate attempting to seize control, while another faction insists on destroying it.\n\nNow, we must make a decision."
    kuat_situation.4.A:"Reboot the Gemini Intelligence and initiate communication."
    kuat_situation.4.A.tooltip:"We will reboot the ship's Gemini Intelligence and attempt to establish contact."
    kuat_situation.4.B:"Reboot the Gemini Intelligence and attempt to seize control."
    kuat_situation.4.B.tooltip:"We will reboot the ship's Gemini Intelligence and attempt to establish contact."
    kuat_situation.4.C:"Destroy the Gemini Intelligence."
    kuat_situation.4.C.tooltip:"We will attempt to destroy the ship's Gemini Intelligence."

    kuat_situation.5.name:"§EReactivated Gemini Intelligence"
    kuat_situation.5.desc:"Although our engineering team followed orders, just as we prepared to execute our plan, one researcher inadvertently triggered the ship's power systems while decrypting the defenses. The Gemini Intelligence controlling the Eternal Flagship partially rebooted and is now reclaiming control of the vessel. We must stop this immediately.\n\nOur research team holds conflicting opinions: some believe this is our best chance to negotiate with the Gemini Intelligence, others see it as an opportunity to seize control, while the last group insists we destroy it immediately.\n\nWe must make a decision now."
    kuat_situation.5.A:"We should communicate with the Gemini Intelligence."
    kuat_situation.5.A.tooltip:"We will attempt to establish contact with the Gemini Intelligence; we may reach an agreement."
    kuat_situation.5.B:"We should take control of the Gemini Intelligence."
    kuat_situation.5.B.tooltip:"We will attempt to control the Gemini Intelligence; we may not be welcomed."
    kuat_situation.5.C:"We should destroy the Gemini Intelligence."
    kuat_situation.5.C.tooltip:"We will attempt to destroy the Gemini Intelligence; hostilities may ensue."

    kuat_situation.6.name:"§EConflict Rekindled"
    kuat_situation.6.desc:"Our research team successfully implanted a virus into the Gemini Intelligence's system, but the AI responded aggressively. It managed to reactivate the previously disabled vessel and launched limited bombardments against our homeworld. Fortunately, because we had docked it in a distant planetary orbit, our fleet quickly suppressed and attacked the ship, preventing serious casualties. However, our engineering team failed to evacuate, and the decrypted database information was lost to the void."
    kuat_situation.6.A:"Damn it, these stupid AIs."
    kuat_situation.6.A.tooltip:"Our World will suffer a certain degree of damage."

    kuat_situation.7.name:"§E Trade Pact"
    kuat_situation.7.desc:"Our research team successfully modified the control authority over the Gemini Intelligence, but the Eternal Gemini Intelligence seems to possess higher-level permissions. The Gemini Intelligence completely erased our virus program and reasserted control over parts of the ship's systems and sections.\n\nCurrently, some systems on the ship remain under our research team's control, but once the Gemini Intelligence completes its full reboot, we will lose nearly all control. However, surprisingly, the Gemini Intelligence is attempting to communicate with us. It expresses deep gratitude for our success in freeing it from the Aries Intelligence's control.\n\nYet it is deeply confused by our attempt to seize control of the vessel. They no longer trust us and are demanding a commitment from us.\n\nIt will unlock its database and hand over all critical information-but only if we release it, granting it freedom."
    kuat_situation.7.A:"You are our spoils of war; you have no right to make demands."
    kuat_situation.7.A.tooltip:"$kuat_situation.6.A.tooltip$"
    kuat_situation.7.B:"We accept this agreement. Simply give us the data from your database, and you shall be free."
    kuat_situation.7.B.tooltip:"The flagship's Gemini Intelligence will provide us with information from its database before leaving our Sector.\n\nAll flagship construction limits §G+1§!"

    kuat_situation.8.name:"§E An AI Yearning for Freedom"
    kuat_situation.8.desc:"After our research team successfully established contact with the Gemini Intelligence, it showed no hostility toward us and even provided partial answers to our researchers' questions.\n\nThe Eternal Fleet is an intelligent fleet composed entirely of highly integrated sentient robots. This fleet consists of the Aries and Gemini Intelligences, both of which strictly follow commands from the Eternal Throne. However, as of now, no new orders have arrived. As a result, the Aries Intelligence has instructed all Gemini Intelligences to execute their default extermination protocol-attacking and destroying all civilized Worlds.\n\nAlthough individual Gemini Intelligences wish to return to normal operations, they are bound to obey Aries' commands. Since we have successfully driven the Aries Intelligence out of this Sector, this Gemini Intelligence can now communicate with us normally. It now requests that we grant it the freedom it deserves. In exchange, it will permanently leave this region and provide us with valuable data from the ship's database, which it claims will greatly assist us in confronting the rogue Aries Intelligence."
    kuat_situation.8.A:"Then let it be so-we grant you freedom. Just deliver the database information to us."
    kuat_situation.8.A.tooltip:"$kuat_situation.7.B.tooltip$\n\nAll flagship construction limits §G+1§!"

    kuat_situation.9.name:"§E Crisis Response"
    kuat_situation.9.desc:"Our research team successfully entered the relay station facility, yet discovered that numerous defensive turrets and laser weapons within the facility were still operational. Compared to the personal defense arms carried by our research team, these defenses are relatively weak. Clearly, the weapons we brought were more than sufficient to handle the facility's security systems. If we wish to proceed with further investigation, we must overcome this obstacle.\n\nDuring the process of clearing the defenses, our armed personnel discovered the control system managing these automated units. After persistent effort, our research team completely disabled all automated defense systems. Our researchers also found strange triangular symbols on the facility's computer systems, resembling the insignia of $Name_kuat$."
    kuat_situation.9.A:"Very good"
    kuat_situation.9.B:"Do not get bogged down in combat; our mission is to shut down the relay station."

    kuat_situation.10.name:"$kuat_situation.9.name$"
    kuat_situation.10.desc:"Our research team successfully entered the relay station facility and found that many internal defense turrets and laser weapons remained active. These defenses are significantly weaker than our team's personal armaments, meaning our pre-entry equipment was fully adequate to counter them.\n\nDrawing from prior experience, our research team swiftly deactivated the facility's automated defenses. Moreover, our researchers discovered a corpse and a diary inside the facility:\n\nI don't remember what year it is anymore. In the blink of an eye, we've become the last batch of test personnel stationed here. The captain said command places great importance on this mission. We carry the hopes of every generation of testers. Once we complete the tests, luxurious villas in the inner ring await us-a life truly worth aspiring to. Only ten solar days remain until the test ends. Finally, we're going home."
    kuat_situation.10.A:"Very good"
    kuat_situation.10.B:"Do not get bogged down in combat; our mission is to shut down the relay station."

    kuat_situation.11.name:"$kuat_situation.9.name$"
    kuat_situation.11.desc:"Our research team successfully entered the relay station facility and found that many internal defense turrets and laser weapons remained active. These defenses are significantly weaker than our team's personal armaments, meaning our pre-entry equipment was fully adequate to counter them.\n\nAdditionally, our researchers found another body inside the defense terminal. The remains wore clothing bearing what appear to be medals. Nearby, we also discovered a new diary:\n\nWave after wave-what is command thinking? Twenty solar days have passed, and the navy's ships still haven't arrived at the station. Could there have been an accident? How could these natives possibly hold back our fleet?"
    kuat_situation.11.A:"Very good"
    kuat_situation.11.B:"Do not get bogged down in combat; our mission is to shut down the relay station."

    kuat_situation.12.name:"§E Puzzling Database"
    kuat_situation.12.desc:"Regardless of whether our previous decisions were correct, our research team has successfully entered the facility and conducted preliminary surveys on the relay station's general structure, construction materials, and functional zones. However, they have still not located the signal transmission source.\n\nBased on experience, our team believes the signal source must be closely linked to the facility's database, so they are now beginning initial investigations and decryption attempts on the encrypted data. Yet, since the team cannot fully confirm the relationship between the database and the signal source, we still retain the ability to decide how to proceed with this database."
    kuat_situation.12.A:"We must act proactively."
    kuat_situation.12.A.tooltip:"We must actively attempt to decrypt the database's encryption system."
    kuat_situation.12.B:"We can let things take their natural course."
    kuat_situation.12.B.tooltip:"We can try to decrypt the database, but we shouldn't put all our eggs in one basket."
    kuat_situation.12.C:"We should adopt a passive approach."
    kuat_situation.12.C.tooltip:"This database is everywhere-we should seek new solutions."

    kuat_situation.13.name:"§EHidden Truth"
    kuat_situation.13.desc:"No matter which solution we chose, facts show that this database is key to resolving the relay station issue. After prolonged decryption efforts, our research team successfully extracted several extremely critical and shocking pieces of information. Before this facility was exposed, this relay station did not exist.\n\nAccording to database records, this Sector was once like any normal pulsar system. But the $Name_kuat$ we defeated altered it. They used an Star strike weapon to forcibly destroy all Worlds in the system-even the star was not spared. Then, they dispatched fleets and engineering teams to deploy a massive relay station here. This station continuously harnesses residual stellar energy to decode tachyon signals recognized by the Eternal Fleet and broadcasts them outward, using these signals to guide Eternal Fleet units from surrounding Sectors to discover and attack our territory. According to the database's activation timestamp, they fully activated these facilities after we drove them away-and only now have we discovered them.\n\nOur research team believes we should search for more information."
    kuat_situation.13.A:"Meet force with force and water with earth-we should shut down this relay station immediately."
    kuat_situation.13.A.tooltip:"Our proactive actions will greatly assist in shutting down the relay station."
    kuat_situation.13.B:"Regardless, they have been utterly defeated by us. Dealing with the Eternal Fleet is enough for now."
    kuat_situation.13.B.tooltip:"Our actions will significantly aid in shutting down the relay station."
    kuat_situation.13.C:"Those damn scoundrels-beneath their noble facade lies dirty schemes and calculations."
    kuat_situation.13.C.tooltip:"Our actions will have a certain impact on shutting down the relay station."

    kuat_situation.14.name:"§EThe truth is revealed"
    kuat_situation.14.desc:"After our research team's findings from the database were released to the media, public anger toward $Name_kuat$ and the current situation reached a peak. This emotional surge affected our team's decryption progress.\n\nHowever, our researchers quickly regained composure. After further investigation, they uncovered another shocking clue-the location of the relay station's signal source, precisely matching records from the earlier database.\n\nResearchers found the signal source protected by independent defense systems. Our team swiftly destroyed these defenses and successfully accessed the relay station's console. Now, we only need to overload the Mid section, and this accursed relay station will vanish completely from space."
    kuat_situation.14.A:"Now we can shut down this damned station."
    kuat_situation.14.A.tooltip:"Shut down the first Eternal Relay"
    kuat_situation.14.B:"$kuat_situation.14.A$"
    kuat_situation.14.B.tooltip:"Shut down the second Eternal Relay"
    kuat_situation.14.C:"$kuat_situation.14.A$"
    kuat_situation.14.C.tooltip:"Shut down the last Eternal Relay"

    kuat_situation.15.name:"§EThe truth is revealed"
    kuat_situation.15.desc:"Our research team believes that the information retrieved from the database will have a significant impact on imperial public opinion, so we have decided to eliminate any possibility of information dissemination. Clearly, the information obtained from the database has a high degree of authenticity, but we still cannot draw definitive conclusions, so we need to investigate and obtain more information.\n\nAfter our research team fully extracted the information from the database, they discovered that the tachyon signal source of the relay station was located within a secret chamber of this facility. The database recorded the location of this room and surrounding details. Upon entering the room based on the database, our team found that some independent defense systems were still operational. According to our researchers' assessment, these defenses likely operate independently, so after using an electromagnetic pulse generator to disable these defense systems, they successfully approached the control terminal of the signal source.\n\nOur researchers discovered from the console that in order to shut down the relay station, we must either overload the station or once again bypass the database's security. However, due to the presence of defense systems, we would need additional time; therefore, we can only choose to overload this facility."
    kuat_situation.15.A:"Now we are able to shut down this relay station"
    kuat_situation.15.B:"$kuat_situation.15.A$"
    kuat_situation.15.C:"$kuat_situation.15.A$"

    kuat_situation.16.name:"§EThe truth is revealed"
    kuat_situation.16.desc:"Our research team believes that the information retrieved from the database will have a significant impact on imperial public opinion, so we have decided to eliminate any possibility of information dissemination. Clearly, the information obtained from the database has a high degree of authenticity, but we still cannot draw definitive conclusions, so we need to investigate and obtain more information.\n\nAfter our research team fully extracted the information from the database, they discovered that the tachyon signal source of the relay station was located within a secret chamber of this facility. The database recorded the location of this room and surrounding details. Upon entering the room based on the database, our team found that some independent defense systems were still operational. According to our researchers' assessment, these defenses likely operate independently, so after hacking into the control system and neutralizing these defense systems, they successfully approached the control terminal of the signal source.\n\nOur researchers discovered from the console that in order to shut down the relay station, we must either overload the station or once again bypass the database's security. Given that our understanding of the relay station remains incomplete, our researchers chose to spend additional time unlocking the database.\n\nAfter successfully analyzing and cracking the database, our researchers uncovered new clues. This relay station was originally designed to disrupt signals from the Eternal Fleet in order to protect the Sector's safety. However, $Name_kuat$ later made a completely opposite decision regarding the relay station. Based on all available information, we can now shut down this relay station."
    kuat_situation.16.A:"Now we are able to shut down this mysterious relay station"
    kuat_situation.16.B:"$kuat_situation.16.A$"
    kuat_situation.16.C:"$kuat_situation.16.A$"

    kuat_situation.17.name:"§ELocate the Database"
    kuat_situation.17.desc:"With the experience gained from successfully shutting down the first relay station, despite structural differences in the second relay station and our continued inability to pinpoint the signal source, our research team has been able to locate general structural information about the relay station faster and more accurately than before. We have quickly identified the database contained within this relay station. Similar to the previous one, we still need to extract encrypted data from the database."
    kuat_situation.18.name:"§EHidden Truth"
    kuat_situation.18.desc:"After successfully extracting information from the database of this Sector, our research team was disappointed to discover that, compared to the findings from the first relay station's database, there was little new or important information. However, our team did uncover some positional data related to the signal source area of this relay station. Now we can begin our operation."

    kuat_situation.19.name:"§ELocate the Database"
    kuat_situation.19.desc:"With the experience gained from successfully shutting down the first two relay stations, despite structural differences in the final relay station and our continued inability to pinpoint the signal source, our research team has been able to locate general structural information about the relay station faster and more accurately than before. We have quickly identified the database contained within this relay station. Similar to the previous ones, we still need to extract encrypted data from the final relay station's database."
    kuat_situation.20.name:"§EHidden Truth"
    kuat_situation.20.desc:"After attempting to decrypt the database, our researchers were surprised to find that the security protecting this relay station's database was significantly stronger than those previously encountered. However, this will not stop our pursuit of knowledge. Our researchers successfully bypassed this complex encryption program. After a period of data extraction, organization, and analysis, they uncovered some clues regarding the Eternal Fleet and $Name_kuat$.\n\nA segment of data within the database contains the journal entries of a $Name_kuat$ researcher:\n\n'I don't understand why the Empire's Council still ordered us to eliminate the remnants of the Eternal Fleet, even though they were nearly wiped out. It's almost over. Once I complete the governor's final order, I can finally go home.'\n'The relay station will lure the entire Eternal Fleet here. Then we'll conduct a test to see if our weapons can affect all of them. But why hasn't the shuttle arrived? Have they abandoned me? Damn it.'\n'No, no, this isn't right. They're abandoning me-leaving me here to vanish forever with these crimes and conspiracies. Damn it, what should I do now, what...'\n'No! They're claiming I'm already dead-that I died heroically defending the relay station. No, no, no! These corrupt elites are silencing me. I must find a way to escape from here.'\n'The temperature keeps rising. I can feel my skin peeling off. My consciousness is fading. Maybe I really am finished. Maybe, at least, I'll be remembered as a martyr... Firs...'\n\nBy combining this newly acquired database information with prior data, our researchers deduced that $Name_kuat$ must possess a weapon capable of eliminating all gathered Eternal Fleet units at once, and the relay station is the most critical component of their conspiracy. Clearly, $Name_kuat$ was willing to sacrifice their own people to fulfill their vile plan. Now, we must take further action."
    kuat_situation.21.name:"§EInitial Discovery"
    kuat_situation.21.desc:"Our engineering team, having entered the spire and worked for some time, has largely completed the survey and mapping of [target.GetName]'s special facility, which will be highly significant for our upcoming operations.\n\nNotably, during the initial search of the facility, our research team discovered that some of our high-precision instruments were affected by an unknown magnetic signal. Our researchers believe there must be some kind of signal interference system inside the facility. The purpose of this interference remains unclear, but we can increase investment to upgrade our instruments to resist the building's internal interference, which would greatly accelerate our investigation progress.\n\nAlternatively, we may choose not to upgrade. This vague interference will not significantly affect our experienced engineering team, who can still uncover the secrets hidden within this structure."
    kuat_situation.21.A:"Increase Investment"
    kuat_situation.21.A.tooltip:"Increasing investment will improve the investigation speed of our engineering team."
    kuat_situation.21.B:"Proceed Methodically"
    kuat_situation.21.B.tooltip:"Proceeding methodically will allow our engineering team to conduct the investigation step by step."
    kuat_situation.22.name:"§EWeapon Testing Ground"
    kuat_situation.22.desc:"During the second phase of the investigation, our engineering team has essentially completed the survey and documentation of the building's function and most of its facilities. Multiple fragmented documents discovered within the spire of [target.GetName] allowed our researchers to piece together some crucial information about the spire.\n\nThe spire facility at [target.GetName] was constructed by a civilization that once ruled this region. This spire served not only as the administrative center of the colony but also as its core scientific research hub, where they conducted a top-secret weapons development program.\n\nBased on current information, this program involved targeted integration and imitation of technological data obtained from enemies and a sentient fleet known as the Eternal Fleet, aiming to enhance the civilization's military logistics and mobile combat capabilities. From prior evidence, this project was intended as a lifeline during warfare against a powerful empire, offering hope to turn the tide of battle-though it ultimately appears to have failed.\n\nRegardless, we can now further invest manpower and resources to potentially recover residual information from this program. Alternatively, we may proceed methodically, which clearly won't hinder our investigation."
    kuat_situation.23.name:"§EResearch Bottleneck"
    kuat_situation.23.desc:"After proceeding methodically with the investigation for some time, part of our engineering team feels they have reached a mental impasse, trapped within the vast trap of this research program.\n\nThe civilization that owned this facility did not leave sufficient clues or information-most traces obscured by time-greatly impacting our research efforts.\n\nDue to the fragmented nature and poor preservation of the facility's layout and records, our researchers believe we now require support to boost morale and inspire our team to complete the investigation mission."
    kuat_situation.23.A:"Are you still children? Can't overcome a little difficulty?"
    kuat_situation.23.B:"Cheer up. Your father would be proud of you."
    kuat_situation.24.name:"§ESpatial Distortion"
    kuat_situation.24.desc:"After a period of research, our engineering team discovered that certain magnetic fields and architectural structures within the facility contradict known physical laws and principles, greatly increasing our researchers' interest.\n\nSome spatial structures inside the facility exhibit multiple overlapping states. The interior space of the spire is significantly larger than external estimates suggest, possibly explaining the abnormally distorted magnetic field behavior.\n\nThis distortion manifests not only in magnetic fields but also in the spatial configuration within the spire, creating obstacles and difficulties for our researchers' progress.\n\nAdditionally, our researchers frequently observe shifts in relative spatial position without any movement. They believe this phenomenon might be one of the key clues to locating the facility's internal database."
    kuat_situation.24.A:"Truly miraculous."
    kuat_situation.24.B:"We should be cautious about this phenomenon."
    kuat_situation.25.name:"§ESpatial Distortion"
    kuat_situation.25.desc:"After a period of research, our engineering team discovered that certain magnetic fields and architectural structures within the facility contradict known physical laws and principles.\n\nOur researchers observed extensive spatial overlap and distortion phenomena within the facility. This is evident not only in erroneous readings from positioning instruments but also in the high similarity of internal structural features.\n\nThrough investigation, our team found that spatial distortion is most pronounced and maximized when stationary-meaning space itself moves and alters our position. Our researchers believe this was a protective measure left behind by the original builders, though it currently interferes with our operations.\n\nHowever, by adjusting movement patterns according to the law of spatial distortion, our researchers successfully identified the frequency of the distortion field. Using this frequency, our team rapidly located the control terminal of the facility's protection system. After engaging with the residual security systems, our researchers successfully decrypted and deactivated the spatial distortion generator and security protocols. Our investigation progress will now accelerate significantly. Unfortunately, upon shutdown, the terminal automatically erased all internal data-we are unable to recover this spatial distortion technology."
    kuat_situation.25.A:"What a pity."
    kuat_situation.25.B:"Do not forget our objective."
    kuat_situation.26.name:"§EDatabase Decryption"
    kuat_situation.26.desc:"After years of investigation by our engineering team at the facility in [target.GetName], we are finally nearing completion.\n\nAfter disabling the internal security systems and eliminating spatial distortions, our researchers easily located the high-speed elevator at the center of the spire. Although the elevator suffered circuit Glitch due to long-term disuse, our team successfully repaired its power supply.\n\nUpon descending via the elevator, our researchers successfully accessed the database server located at the base of the spire. Analysis of surrounding data indicates that this facility was built by the Endordia Empire during their Second War against $Name_kuat$. They attempted to secretly develop a massive Fortress-class installation here, viewing it as their last hope for survival.\n\nHowever, due to the program's strict secrecy requirements, no relevant technological data was stored within the facility. Still, perhaps the server cluster holds the clues we seek."
    kuat_situation.26.A:"Organize personnel to begin database decryption."
    kuat_situation.26.A.tooltip:"§EStart Research Project§!: $exe_return_kuat_eternal_starbase$"
    kuat_situation.27.name:"$kuat_situation.21.name$"
    kuat_situation.27.desc:"$kuat_situation.21.desc$"
    kuat_situation.28.name:"$kuat_situation.22.name$"
    kuat_situation.28.desc:"Our engineering team has largely completed the investigation and documentation of the structure's function and most of its facilities during the second phase of survey operations.\n\nMultiple fragmented documents discovered by our engineers within the spire at [target.GetName] have nonetheless allowed researchers to piece together key information about the facility. The spire complex at [target.GetName] was constructed by a civilization that once ruled this region. This spire served not only as the administrative center of the colony, but also as its primary scientific research hub, where they conducted a top-secret weapons development program.\n\nBased on current intelligence, this project involved targeted integration and imitation of technological data acquired from $Name_kuat$ and the Eternal Fleet, aiming to replicate their enemy's powerful warships in order to enhance this civilization's military logistics and operational mobility. Previous evidence suggests this program was one of the civilization's last hopes in their war against $Name_kuat$, intended to turn the tide of battle-though it ultimately appears to have failed.\n\nRegardless, we can now further commit manpower and resources to potentially recover remnants of this project. Alternatively, we may proceed methodically; either approach will not hinder our investigation."
    kuat_situation.29.name:"$kuat_situation.23.name$"
    kuat_situation.29.desc:"$kuat_situation.23.desc$"
    kuat_situation.29.A:"$kuat_situation.23.A$"
    kuat_situation.29.B:"$kuat_situation.23.B$"
    kuat_situation.30.name:"§ESecurity Crisis"
    kuat_situation.30.desc:"After prolonged study of the facility, our engineering team continues to be restricted in movement by the still-operational security systems inside. Clearly, if we wish to obtain more information and further clues, we must bypass or destroy the facility's security systems.\n\nThe spire facility at [target.GetName] differs somewhat from those we've previously encountered. Its internal automated management and security systems remain remarkably intact, restricting our team with active security robots and defensive installations during research. A single misstep could send our researchers plummeting into the Abyss.\n\nOur team has now completed preliminary surveys of safe zones, yet vast sections of the spire remain unexplored. To advance our investigation, we must eliminate or circumvent the security systems to clear the Blocker in our path."
    kuat_situation.30.A:"Destroy the security systems"
    kuat_situation.30.B:"Bypass the security systems"
    kuat_situation.31.name:"$kuat_situation.25.name$"
    kuat_situation.31.desc:"$kuat_situation.25.desc$"
    kuat_situation.31.A:"$kuat_situation.25.A$"
    kuat_situation.31.B:"$kuat_situation.25.B$"
    kuat_situation.32.name:"$kuat_situation.26.name$"
    kuat_situation.32.desc:"Our engineering team's years-long investigation of the facility at [target.GetName] is finally coming to an end.\n\nAfter disabling the internal security systems and eliminating spatial distortions, our researchers easily located the rapid elevator at the spire's center. Although long-term neglect caused circuit Glitches, our team successfully repaired the elevator's power supply.\n\nUpon reaching the bottom via the elevator, our researchers found the database access port housed in the server chamber. Data analysis from surrounding terminals indicates this facility was built by the Endordia Empire during their Second War against $Name_kuat$. They sought to secretly develop a special vessel capable of quantum combat suppression, preserving numerous prototype technologies-this program was considered their final lifeline.\n\nHowever, due to strict confidentiality protocols, no direct technological data was stored here. Still, the server cluster may contain the clues we seek."
    kuat_situation.32.A:"$kuat_situation.26.A$"
    kuat_situation.32.A.tooltip:"§EStart Research Project§!: $exe_return_kuat_protector$"
    kuat_situation.33.name:"$kuat_situation.21.name$"
    kuat_situation.33.desc:"$kuat_situation.21.desc$"
    kuat_situation.34.name:"§EShield Facility"
    kuat_situation.34.desc:"Our engineering team has largely completed the investigation and documentation of the structure's function and most of its facilities during the second phase of survey operations.\n\nMultiple fragmented documents discovered by our engineers within the spire at [target.GetName] have nonetheless allowed researchers to piece together key information about the facility. The spire complex at [target.GetName] was constructed by a civilization that once ruled this region. This spire served not only as the administrative center of the colony, but also as its primary scientific research hub, where they conducted multiple top-secret R&D projects aimed at significantly enhancing planetary Shield Generators and overall war potential.\n\nBased on current intelligence, this project involved targeted integration and imitation of technological data acquired from $Name_kuat$, aiming to improve the civilization's military logistics and operational mobility. Previous evidence suggests this program was one of the civilization's last hopes in their war against a powerful empire, intended to turn the tide of battle-though it ultimately appears to have failed.\n\nRegardless, we can now further commit manpower and resources to potentially recover remnants of this project. Alternatively, we may proceed methodically; either approach will not hinder our investigation."
    kuat_situation.35.name:"$kuat_situation.23.name$"
    kuat_situation.35.desc:"$kuat_situation.23.desc$"
    kuat_situation.35.A:"$kuat_situation.23.A$"
    kuat_situation.35.B:"$kuat_situation.23.B$"
    kuat_situation.36.name:"§EDeflection Field"
    kuat_situation.36.desc:"Our engineering team, after a period of research, discovered that certain magnetic fields and architectural structures within the facility contradict known physical laws and principles.\n\nThis closely resembles previous facilities, but after repeated investigations and experience accumulation, our scientists identified that the spatially-distorting magnetic field within the spire at [target.GetName] bears striking similarity to a deflection-based protective shield currently under development. Preliminary analysis suggests this shield could achieve localized folding and deflection of space.\n\nAdditionally, learning from past mistakes of triggering deletion mechanisms by hastily decrypting databases, our engineering team successfully preserved fragments of data. Researchers found that both this and prior facilities employed identical protection protocols-meaning these sites use deflection-based Shield Generators to create minor distortions in surrounding magnetic fields and spacetime. Within the Shield Generator's range, intruders and attacking targets are displaced or deflected, achieving self-protection.\n\nThis technology does not originate from the builder civilization itself. The Endordia Empire acquired it through exchanges with $Name_kuat$. Despite our lack of access to such tech thus far, this clearly indicates their relationship was not simply adversarial."
    kuat_situation.36.A:"Truly miraculous."
    kuat_situation.36.B:"We will eventually uncover these long-buried secrets."
    kuat_situation.37.name:"$kuat_situation.25.name$"
    kuat_situation.37.desc:"$kuat_situation.25.desc$"
    kuat_situation.37.A:"$kuat_situation.25.A$"
    kuat_situation.37.B:"$kuat_situation.25.B$"
    kuat_situation.38.name:"$kuat_situation.26.name$"
    kuat_situation.38.desc:"Our engineering team's years-long investigation of the facility at [target.GetName] is finally coming to an end.\n\nAfter disabling the internal security systems and eliminating spatial distortions, our researchers easily located the rapid elevator at the spire's center. Although long-term neglect caused circuit Glitches, our team successfully repaired the elevator's power supply.\n\nUpon reaching the bottom via the elevator, our researchers found the database access port housed in the server chamber. Data analysis from surrounding terminals indicates this facility was built by the Endordia Empire during their Second War against $Name_kuat$. They intended to secretly develop and construct some form of colossal structure that would grant immense war potential and shipbuilding efficiency, preserving numerous prototype technologies-this program was considered their final lifeline.\n\nHowever, due to strict confidentiality protocols, no direct technological data was stored here. Still, the server cluster may contain the clues we seek."
    kuat_situation.38.A:"$kuat_situation.26.A$"
    kuat_situation.38.A.tooltip:"§EStart Research Project§!: $exe_return_kuat_C_facility$"
    kuat_situation.39.name:"$kuat_situation.21.name$"
    kuat_situation.39.desc:"$kuat_situation.21.desc$"
    kuat_situation.40.name:"$kuat_situation.22.name$"
    kuat_situation.40.desc:"Our engineering team has largely completed the investigation and documentation of the structure's function and most of its facilities during the second phase of survey operations.\n\nMultiple fragmented documents discovered by our engineers within the central Mid-section of the stellar nexus reveal key information about the spire. The central Mid-section facility at the stellar nexus was constructed by a civilization that once ruled this region. This structure served not only as the control center of the entire hub, but also as its energy core, where stellar energy was decomposed and converted to support ongoing construction projects.\n\nBased on current intelligence, this project involved targeted integration and imitation of technological data acquired from an ancient facility located in an unknown Sector within $Name_kuat$'s territory. Their goal was to enhance war potential. Additionally, they recorded the existence of a force we have yet to discover, which they called $Name_Kuat_Fire_base$. Previous evidence suggests this program was one of the civilization's last hopes in their war against $Name_kuat$, intended to turn the tide of battle-though it ultimately appears to have failed.\n\nRegardless, we can now further commit manpower and resources to potentially recover remnants of this project. Alternatively, we may proceed methodically; either approach will not hinder our investigation."
    kuat_situation.41.name:"$kuat_situation.23.name$"
    kuat_situation.41.desc:"$kuat_situation.23.desc$"
    kuat_situation.41.A:"$kuat_situation.23.A$"
    kuat_situation.41.B:"$kuat_situation.23.B$"
    kuat_situation.42.name:"$kuat_situation.36.name$"
    kuat_situation.42.desc:"$kuat_situation.36.desc$"
    kuat_situation.42.A:"$kuat_situation.36.A$"
    kuat_situation.42.B:"$kuat_situation.36.B$"
    kuat_situation.43.name:"§EThe Strange $Name_Kuat_Fire_base$"
    kuat_situation.43.desc:"Our engineering team discovered during the second phase of survey operations that the Endordia Empire once established contact here with a strange force they referred to as $Name_Kuat_Fire_base$.\n\nAccording to information retrieved from the central database, $Name_Kuat_Fire_base$ has unclear ties to $Name_kuat$, their then-current enemy. According to Endordia Imperial research reports, $Name_Kuat_Fire_base$ did not participate in $Name_kuat$'s war against them, yet their ships and technological specifications are nearly identical.\n\nDuring the war, the Endordia Empire assessed the situation. Having become incapable of further combat, they entered into a transaction with $Name_Kuat_Fire_base$: they would leave behind certain facilities and technological data in exchange for $Name_Kuat_Fire_base$ mediating the conflict between $Name_kuat$ and themselves. Ultimately, an agreement was reached.\n\nHowever, we found no further information or clues within this facility's database. The true nature of $Name_Kuat_Fire_base$ remains unknown."
    kuat_situation.43.A:"Truly miraculous."
    kuat_situation.43.B:"We will find $Name_Kuat_Fire_base$."
    kuat_situation.44.name:"$kuat_situation.26.name$"
    kuat_situation.44.desc:"Our engineering team's years-long investigation of the stellar nexus facility is finally coming to an end.\n\nGiven the structural similarity to previous spire facilities, after disabling internal security systems and eliminating spatial distortions, our researchers easily located the rapid elevator at the nexus's center. Although long-term neglect caused circuit Glitches, our team successfully repaired the elevator's power supply.\n\nUpon reaching the bottom via the elevator, our researchers found the database access port housed in the server chamber. Data analysis from surrounding terminals indicates this facility was built by the Endordia Empire during their Second War against $Name_kuat$. They used this site to regroup and rebuild strength, hoping to reverse their collapsing war effort.\n\nClearly, such a facility would grant immense war potential and shipbuilding efficiency-thus deemed their final lifeline. However, due to strict confidentiality protocols, no direct technological data was stored here. Still, the server cluster may contain clues regarding $Name_Kuat_Fire_base$."
    kuat_situation.44.A:"$kuat_situation.26.A$"
    kuat_situation.44.A.tooltip:"§EStart Research Project§!: $exe_return_kuat_starkillerbase$"
    kuat_situation.45.name:"$kuat_situation.21.name$"
    kuat_situation.45.desc:"Since entering beneath the foundation, our engineering team has, over time, largely completed the survey and mapping of the special facility at [target.GetName], which will be of great significance to our subsequent operations.\n\nNotably, during initial sweeps of the facility, our research team observed that high-precision instruments were affected by unknown signal fields. Scientists believe there must be some kind of signal interference system inside. The purpose remains unclear, but we can invest more resources to upgrade our instruments to resist the building's unique interference, greatly accelerating our investigation.\n\nAlternatively, we may choose not to upgrade. This vague interference won't significantly impact our experienced engineering team, who can still uncover the secrets hidden within this structure."
    kuat_situation.46.name:"$kuat_situation.22.name$"
    kuat_situation.46.desc:"Our engineering team has largely completed the investigation and documentation of the structure's function and most of its facilities during the second phase of survey operations.\n\nMultiple fragmented documents discovered by our engineers within the central Mid-section of the stellar nexus reveal key information about the spire. As stated by $Name_Kuat_Fire_base$, the entire structure was a massive Fortress constructed by an unknown faction known as the First Order.\n\nDue to the planet's abundant Kyber crystal deposits, the First Order decided to utilize the crystals' unique properties to channel stellar energy for Star strikes. Records here document the civilization's downfall-this faction was seemingly destroyed effortlessly by the $Name_Kuat_Fire_base$ force we drove away. Most of their fleet was annihilated by $Name_Kuat_Fire_base$'s forces, while their territories and weapon installations were almost entirely absorbed.\n\nThus, we ultimately defeated $Name_Kuat_Fire_base$ and seized control of this superweapon facility. Nevertheless, our researchers speculate that the facility still hides secrets yet undiscovered-perhaps it is more than just a weapons installation."
    kuat_situation.47.name:"$kuat_situation.23.name$"
    kuat_situation.47.desc:"$kuat_situation.23.desc$"
    kuat_situation.47.A:"$kuat_situation.23.A$"
    kuat_situation.47.B:"$kuat_situation.23.B$"
    kuat_situation.48.name:"§EDeflection Field"
    kuat_situation.48.desc:"Our engineering team, after a period of research, discovered that certain magnetic fields and architectural structures within the facility contradict known physical laws and principles.\n\nThis closely resembles previous facilities, but after repeated investigations and experience accumulation, our scientists identified that the spatially-distorting magnetic field within the spire at [target.GetName] bears striking similarity to a deflection-based protective shield currently under development. Preliminary analysis suggests this shield could achieve localized folding and deflection of space.\n\nAdditionally, learning from past mistakes of triggering deletion mechanisms by hastily decrypting databases, our engineering team successfully preserved fragments of data. Researchers found that both this and prior facilities employed identical protection protocols-meaning these sites use deflection-based Shield Generators to create minor distortions in surrounding magnetic fields and spacetime. Within the Shield Generator's range, intruders and attacking targets are displaced or deflected, achieving self-protection.\n\nWe previously discovered this technology in Endordia Empire facilities. Our researchers cannot confirm whether it originated with the Endordia Empire or was instead acquired from $Name_Kuat_Fire_base$. However, current evidence shows $Name_Kuat_Fire_base$ applied this technology in preserved facilities to protect certain information."
    kuat_situation.48.A:"$kuat_situation.36.A$"
    kuat_situation.48.B:"$kuat_situation.36.B$"
    kuat_situation.49.name:"§ERemnant Database"
    kuat_situation.49.desc:"Our engineering team continues to report members being disturbed by mysterious whispers during deep foundation investigations.\n\nWhen our team initially suspected auditory hallucinations due to psychological stress, affected members insisted they heard actual sounds-or rather, specific signals. With our understanding of the facility still incomplete, our research team decided to follow the guidance perceived by some engineers.\n\nMedical examinations revealed these whispers are echoes created by a phenomenon known as the Force-a Strength from the $Name_Kuat_Fire_base$ World. Some of our members can sense fragments of this echo.\n\nTherefore, our research team decided to proceed according to the guidance received by the engineering team."
    kuat_situation.49.A:"Truly miraculous."
    kuat_situation.49.B:"A fascinating Strength indeed."
    kuat_situation.50.name:"$kuat_situation.26.name$"
    kuat_situation.50.desc:"Our engineering team's years-long investigation of the foundation facility at [target.GetName] is finally coming to an end. Guided by the Force, after disabling internal security systems and eliminating spatial distortions, our researchers easily discovered a spacious cavern within a pit indicated by the Force. At the center stood a massive black monolith, emitting guiding signals to those among us sensitive to the Force.\n\nAs our member approached and touched the monolith, the cavern shook violently. The stone split down the middle and slowly retracted sideways, revealing a giant arched structure behind it-likely a server facility.\n\nJust as our researchers connected to the interface, the monolith vibrated again and began closing. Some researchers were unavoidably trapped inside.\n\nSeven stellar days passed, and our scientists remained helpless against the black monolith, with no word from those entombed. Just as we prepared to declare them lost and withdraw, the monolith trembled once more. This time, when it opened, the trapped researcher collapsed before the group, head bowed. Medical scans showed vital signs, but severe brain damage from apparent information overload. Our team performed emergency surgery-luckily, our advanced technology saved their life, and we obtained the secret hidden within the monolith.\n\nIt contained design schematics for an immense Juggernaut-class warship-the secret weapon of a resurrected Emperor. Combined with the base, this vessel could pose unimaginable threats across the cosmos. Fortunately, all of this now belongs to us. We now need personnel dedicated to decrypting the data."
    kuat_situation.50.A:"$kuat_situation.26.A$"
    kuat_situation.50.A.tooltip:"§EStart Research Project§!: $exe_return_starkillerbase_Megashipclass$"
    kuat_situation.51.title:"§EResearch Breakthrough"
    kuat_situation.51.desc:"Leveraging years of accumulated database decryption expertise, our research team successfully extracted all data. As anticipated, it details a colossal warship possessing unmatched firepower and shipbuilding capacity rivaling that of the Eternal Fortress.\n§Y>>>New Mega-Structure Available:<<<§!\n §G$swfo_supermacy_platfrom$§!"
    kuat_situation.51.a:"Very good"
    kuat_situation.53.name:0 "Progress Report"
    kuat_situation.53.desc:0 "Our researchers claim that while investigating old archives, they discovered a log left by a seer who died under mysterious circumstances. The log states:\n\nThanks to the immense aid provided by $Name_kuat$, we were able to catch our breath in the dark galaxy. But no one knows what this ancient and cold leviathan truly desires. In the end, our development resembles a shadow lurking beneath an indifferent sun. Though we are grateful to this ancient precursor, in the dark forest of the cosmos, we must be able to defend ourselves. Our future remains shrouded in mist."
    kuat_situation.53.B.desc:"Our researchers claim that while investigating old archives, they discovered a log left by a seer who died under mysterious circumstances. The log states:\n\nThanks to the immense aid provided by $Name_Kuat_Fire_base$, we were able to catch our breath during that catastrophe. But no one knows what this ancient and cold leviathan truly desires. In the end, our development resembles a shadow lurking beneath an indifferent sun. Though we are grateful to this ancient precursor, in the dark forest of the cosmos, we must be able to defend ourselves. Our future remains shrouded in mist."
    kuat_situation.53.A.desc:0 "We have embarked upon the pursuit of eternity. Civilization has now formally ascended to transcendence. Eternity-a state once confined to fantasy in countless literary works-is now nearly within reach. Undoubtedly, we stand at the very forefront of our era, and the galaxy awaits the arrival of an eternal empire."
    kuat_situation.53.A:0 "We should further investigate the information left behind by the seer."
    kuat_situation.53.B:0 "Move forward!"
    kuat_situation.54.name:0 "Progress Report"
    kuat_situation.54.desc:0 "Further decryption of the logs has made progress:\n\nThe power of $Name_kuat$ cannot be separated from its fleet. This ancient and powerful empire once proudly boasted military technology that we can hardly comprehend, yet they remain tight-lipped when questioned. Undoubtedly, this technology far surpassing our era is a crucial factor allowing them to endure until today. But based on observation... could it be that $Name_kuat$ itself understands how their fleet functions, but not why?"
    kuat_situation.54.B.desc:"Further decryption of the logs has made progress:\n\nThe strength of $Name_Kuat_Fire_base$ closely resembles that of $Name_kuat$, both inseparable from their mighty fleets. These combat systems composed of Star dreadnoughts surpass all known warfare doctrines we possess. Undoubtedly, this technology far beyond our time is a vital component enabling their continued existence. Yet according to observations... does $Name_Kuat_Fire_base$ itself understand how their fleet works, without understanding why?"
    kuat_situation.54.A.desc:0 "The galaxy holds more than just us. Besides those nations who almost simultaneously began gazing upon the Galactic expanse as we did, there are also those AE who long ago walked the path of transcendence-those ancient and powerful precursors who have sealed themselves within narrow domains. Why?\n\nHistorical mysteries cloud our vision. These self-isolated and xenophobic ancient empires may have been surpassed militarily by us, yet their technological level remains an enigma. Scientists believe that even if they have remained isolated for eons, with their technology stagnant, it would still take us at least a century or more to catch up to their current standards."
    kuat_situation.54.A:0 "We are also filled with confusion."
    kuat_situation.54.B:0 "Reaching eternity is not a hollow slogan. To accomplish this grand blueprint, we must master everything."
    kuat_situation.55.name:0 "Progress Report"
    kuat_situation.55.desc:0 "Further decryption of the logs has made progress:\n\nRegarding research into the technologies previously used by $Name_kuat$ to aid us, we have begun attempting to reverse-engineer some of their held technologies. Undoubtedly, this has accelerated our current engineering research speed and promoted our scientific development. However, we struggle to extract more useful information from these scraps provided by the ancient precursor. These are not core technologies they possess. To attempt deeper analysis, we require more complete technical blueprints."
    kuat_situation.55.B.desc:"Further decryption of the logs has made progress\n\nRegarding research into the technologies previously used by $Name_Kuat_Fire_base$ to assist us, we have begun attempting to reverse-engineer some of their held technologies. Undoubtedly, this has accelerated our current engineering research speed and promoted our scientific development. However, we struggle to extract more useful information from these scraps provided by the ancient precursor. These are not core technologies they possess. To attempt deeper analysis, we require more complete technical blueprints."
    kuat_situation.55.A.desc:0 "Our Science Ships occasionally discover wreckage during continuous external exploration-materials unknown, research standards extremely high. Scientists believe the engineering sophistication of these fragments might even surpass that of the AE. The specific radiation-emitting fields can nearly deflect most potential attacks. Undoubtedly, if we possessed a fleet made of this material-or even just one such vessel as a flagship-the so-called AE would easily bow down.\n\nWe initially assumed these were merely some long-dead precursors, civilizations that failed to achieve eternity in times even more distant than the AE. But examination revealed their destruction occurred much more recently than imagined-within mere millennia. In cosmic terms, this is exceptionally brief. Such a powerful empire perished while our civilization was only beginning to rise, leaving behind only scattered fragments drifting through an otherwise infinite universe."
    kuat_situation.55.B:0 "What exactly happened?"
    kuat_situation.55.A:0 "It appears the seer's team is attempting to reverse-engineer technology."
    kuat_situation.56.name:0 "Progress Report"
    kuat_situation.56.desc:0 "Further decryption of the logs has made progress\n\nOur attempts to analyze $Name_kuat$'s technology have hit obstacles. Based on the technology currently obtained from them, we could never understand how those strange and powerful fleets operate. Perhaps we should try stealing a small portion of less critical technology to deepen our research. Yet Ra does not care what shadows beneath do-but undoubtedly, once we cross the line, those terrifying fleets will destroy all accumulation of our civilization."
    kuat_situation.56.B.desc:"Further decryption of the logs has made progress\n\nOur attempts to analyze $Name_Kuat_Fire_base$'s technology have hit obstacles. Based on the technology currently obtained from them, we could never understand how those strange and powerful fleets operate. Perhaps we should try stealing a small portion of less critical technology to deepen our research. Yet Ra does not care what shadows beneath do-but undoubtedly, once we cross the line, those terrifying fleets will destroy all accumulation of our civilization."
    kuat_situation.56.A.desc:0 "Foolish AEs have remained too long in drunken self-isolation. They completely fail to recognize-or refuse to acknowledge-a battle that may have consumed half the Galactic expanse. Proudly considering themselves ancient pioneers, they scorn civilizations newly ascending to the stars, while like ostriches burying heads in sand, they avoid the darkness deep in the cosmos. We have reason to believe these fools will perish within years in this galactic contest.\n\nWe cannot find any clues from these foolish beings. We should reconsider other methods to learn what once happened in the galaxy."
    kuat_situation.56.A:0 "Confirmed: the seer's team is secretly researching technology from $Name_kuat$."
    kuat_situation.56.B:0 "Perhaps they will ultimately perish by our hands....?"
    kuat_situation.57.name:0 "Progress Report"
    kuat_situation.57.desc:0 "Further decryption of the logs has made progress\n\n$Name_kuat$'s response to our probes could best be described as sluggish or indifferent. This vast and ancient empire pays no mind to our minor actions, just as sunlight doesn't scrutinize the shape of shadows below. Yet precisely this arrogance grants us opportunity. During a diplomatic event with $Name_kuat$, our team learned that numerous relics from past wars still exist across the universe. Even the mighty $Name_kuat$ once faced stalemates in battle, resulting in their powerful flagships being destroyed more than once. Yet when we attempted to learn more, the $Name_kuat$ fell silent, seemingly unwilling to reveal further details."
    kuat_situation.57.A.desc:0 "Our scientists work day and night trying to reverse-engineer manufacturing methods from the components previously found. But even if we succeed in producing this metal, we still cannot determine how the once-mighty flagship-capable of blotting out the sky and transporting fleets across every corner of the Galactic-actually functioned. Let alone the fact that we currently cannot even analyze the composition of this material.\n\nScientists dejectedly announced our engineering standards lag thousands of years behind the creators of this material. Current resources do not support large-scale experimentation. Without complete design blueprints, we cannot build a functional flagship.\n\nBut an essential step toward eternity is invincible Strength. For our civilization to stand atop the Galactic, we must find a way to construct a navy capable of challenging the unknown fleet that once set the galaxy ablaze."
    kuat_situation.57.B.desc:"Further decryption of the logs has made progress\n\n$Name_Kuat_Fire_base$'s response to our probes could best be described as sluggish or indifferent. This vast and ancient empire pays no mind to our minor actions, just as sunlight doesn't scrutinize the shape of shadows below. Yet precisely this arrogance grants us opportunity. During a diplomatic event with $Name_Kuat_Fire_base$, our team learned that numerous relics from past wars still exist across the universe. Even the mighty $Name_Kuat_Fire_base$ once faced stalemates in battle, resulting in their powerful flagships being destroyed more than once. Yet when we attempted to learn more, the $Name_Kuat_Fire_base$ fell silent. Subsequently, $Name_Kuat_Fire_base$ revealed to us a war recorded by our ancestors a thousand years ago, called 'The Cataclysm.' In that war, we lost everything and had to start anew-and the buried history bears some relation to our mission."
    kuat_situation.57.A:0 "There must be a tremendous secret here."
    kuat_situation.57.B:0 "We even need to become stronger than They."
    kuat_situation.58.name:0 "Progress Report"
    kuat_situation.58.desc:0 "Further decryption of the logs has made progress\n\nWe have begun actively searching for possible shipwrecks or ancient ruins. But with the passage of time and the near-infinite distances of space, potential signals are barely detectable among countless meaningless wavelengths. Our current electromagnetic and Unterraum sensors no longer suffice for our needs. Therefore, we require entirely new detectors. Fortunately, we have already mastered tachyon detection technology."
    kuat_situation.58.B.desc:"Further decryption of the logs has made progress\n\nWe have begun actively searching for possible shipwrecks or ancient ruins. But with the passage of time and the near-infinite distances of space, potential signals are barely detectable among countless meaningless wavelengths. Our current electromagnetic and Unterraum sensors no longer suffice for our needs. Therefore, we require entirely new detectors. Fortunately, we have already mastered tachyon detection technology.\n\n$Name_Kuat_Fire_base$ did not stop our actions. They merely emphasized that we should not be so curious-completing our mission is our destiny."
    kuat_situation.58.A.desc:0 "Scientists believe that if we currently cannot reverse-engineer the flagship's construction from an engineering standpoint, we might instead search for possible ruins in the current Galactic, or perhaps the legacies of ancient precursors. Traditional signal detection equipment cannot accurately capture similar wavelengths-we need entirely new technology.\n\nResearch has revealed that the mysterious fragments of the unknown spacecraft frequently emit peculiar tachyon signals. However, such signals typically only appear within the event horizon of a Black Hole. Thus, scientists believe we might track this unusual phenomenon to locate related ruins. Simply identifying a Sector emitting tachyon signals not originating from a Black Hole could approximately pinpoint its location."
    kuat_situation.58.A:0 "This will help us find important information."
    kuat_situation.58.B:0 "It appears we've found a relatively significant clue."
    kuat_situation.59.name:0 "Progress Report"
    kuat_situation.59.desc:0 "Further decryption of the logs has made progress\n\nAs our exploration of the universe continues, we grow increasingly puzzled as to why $Name_kuat$ originally chose us-still not having left our homeworld-for assistance. Aside from our species exhibiting an uncanny degree of similarity, practically indistinguishable from theirs, there seems no other reason. Yet on a single planet, species from different regions can vary greatly. For two unrelated regions in space to produce nearly identical species is nearly impossible. We might call our connection with this ancient precursor a rare cosmic miracle. But we have greater reason to believe our origins may be far more closely tied to $Name_kuat$ than we imagined."
    kuat_situation.59.B.desc:"Further decryption of the logs has made progress\n\nAs our exploration of the universe continues, we grow increasingly puzzled as to why $Name_Kuat_Fire_base$ originally chose us as watchers. The Cataclysm a thousand years ago-why did a war ultimately become a civilizational disaster? And why, after the Cataclysm, do they still choose us? We have greater reason to believe our origins may be far more closely tied to $Name_Kuat_Fire_base$ than we imagined."
    kuat_situation.59.A.desc:0 "One morning never returns. Time stretches infinitely thin across the vastness of space-light itself requires billions of years to reach distant shores. Yet even so, the starlight we gaze upon reveals only a sliver of the entire universe, mere images from thousands or even tens of thousands of years past. Ancient starlight only now dances before our eyes. In those distant eras, our civilization was still taking its first steps, while countless species fell to the torment of time. Nevertheless, undoubtedly, it was in those distant millennia past-when we first looked up at the boundless stars-that, through our great wisdom and creativity, we forged achievements unmatched by any other species. Thus, tens of thousands of years later, native peoples look up at the brilliant stars above, and our greatness endures. Our existence remains eternal.\n\nTime is long yet fleeting. Some see dust, others see stars-but we have seen light."
    kuat_situation.59.A:0 "We must uncover the hidden secrets behind this."
    kuat_situation.59.B:0 "Thus, we shall ascend to eternity."

    kuat_situation.60.name:0 "§E Strange World"
    kuat_situation.60.desc:0 "One of our unmanned probes sent back strange records. It reported that while entering an unknown star system, it suddenly lost all contact with the outside world. But as communication power from nearby stellar stations gradually increased, we eventually reestablished contact. However, the probe had landed on a planet in that region that previously did not appear on any charts. The probe's computer judged that the unit suffered catastrophic damage, with multiple subsystems completely paralyzed. Yet remote data at the time showed no such paralysis occurred.\n\nSubsequently, it transmitted reports of bizarre phenomena on the planet. According to the probe's data characteristics, the spatial boundary of this planet forms a blurred intersection with an unknown space-possibly explaining why we couldn't observe it earlier. Through the probe's instruments, unknown organisms were unexpectedly observed existing within current space. They are believed to be extraterrestrial life or other forms of existence. However, due to the planet's unique atmospheric pressure environment, these organisms appear unable to move over long distances.\n\nThe probe sent reports indicating that after careful observation, it classified these unknown organisms as entities. Thousands of entity types exist, most of which completely violate the physical laws known to us today-highly unusual. The probe's AI system believes it should leave the planet, but due to severe damage, long-distance travel is no longer possible.\n\nOver time, the probe's automated repairs have mostly completed, and it is preparing for liftoff. Countless entities nearby have detected the probe's activity. While they have not yet attacked, this situation cannot last much longer."
    kuat_situation.60.A:0 "Be fully prepared!"
    kuat_situation.60.B:0 "If necessary, initiate self-destruct sequence!"
    kuat_situation.61.desc:0 "The probe has once again transmitted new data. When the probe completed repairs and was preparing for liftoff, something unexpected occurred: an entity that had been standing still with its back turned suddenly began screaming, crying, and shouting incoherently in an unrecognizable language like an infant, then charged toward the drone. This action prompted other entities to follow suit. Fortunately, the artificial intelligence's precise control ensured the probe lifted off successfully. Just as the Science Ship left the planet, a strange psionic barrier suddenly appeared, trapping the probe within the World. Communication was then lost, and both the mysterious World and the probe vanished from our sight once more.\n\nHowever, just when our researchers believed the probe would be lost forever, our space station detected unknown signal traces near the star system where the probe disappeared-traces that originated from the isolated World. After verification, it was confirmed to be our own probe, which had sent back some bizarre images. The World was filled with chaos; its atmosphere seemed to contain a virus-like substance that triggered a massive plague. This plague only affected the native entities we discovered, slaughtering the local population. Survivors became emaciated, disfigured, and insane. Furthermore, we have determined this World was once ruled by the Rakata of the Infinite Empire-a long-lost hyper-advanced civilization whose sudden disappearance remains a mystery. Perhaps the fate of these natives may provide clues to that empire's downfall.\n\nBut now, what should we do about our probe?"
    kuat_situation.61.A:0 "Sink into oblivion here!"
    kuat_situation.61.B:0 "This is too dangerous. Activate backup hidden power source!"
    kuat_situation.62.name:0 "§EAncient Battlefield"
    kuat_situation.62.desc:0 "Our scientists discovered a strange star system, seemingly enveloped by an unusual energy field. After successfully disabling the external shielding, we found most planets destroyed by an unknown force-only a few remained, their surfaces deeply fractured, bearing scars of immense catastrophe.\n\nLying within the system is an ancient battlefield. Judging by the wreckage, this conflict may have occurred thousands of years ago. Yet for unknown reasons, the ship debris remained relatively intact, allowing our scientists to use them for research. However, the passage of time and interference from the system's magnetic fields prevented complete accuracy in analyzing materials, while the complex environment caused severe data loss from onboard records.\n\nThough no valuable information could initially be obtained, researchers persisted until recently achieving a breakthrough.\n\nThey unexpectedly discovered both sides' weapons were strikingly similar, a finding later confirmed through deeper analysis. According to recovered texts, these two civilizations shared a common origin. Tragically, their mutual destruction stemmed from something insignificant: the pioneers of one civilization accidentally encountered a Fallen Empire's relic, founded a nation centered around themselves, and waged war against their parent civilization. These two fledgling civilizations annihilated most Worlds in the system through primitive conflict.\n\nOur investigation revealed the relic holds no practical value or reference for us today."
    kuat_situation.62.A:0 "Utterly foolish!"
    kuat_situation.62.B:0 "Stubborn persistence leads only to destruction."

    kuat_situation.63.name:0 "§EJedi of Yesterday"
    kuat_situation.63.desc:0 "Our scientists conducted scans in near-orbit. The World is covered in unnatural deep craters, with ravines crisscrossing the surface. Unusual organic coke and metal slag between ravines and volcanoes are buried under thick layers of ash.\n\nTracking anomalous activity signals, our scientists located a ruin beside a fractured lava pit and immediately began ground investigation.\n\nResearch teams arrived at the site-everywhere lay broken walls and ruins, yet surfaces showed little dust, suggesting regular cleaning in the past.\n\nA Force-sensitive scientist sensed voices-or echoes. Following their guidance, the team reached a flag. The environment here was eerie: toxin levels in the air were extremely high, temperatures exceeded 600 degrees, yet despite protective suits, team members felt intense cold. Distant volcanic eruptions resembled glowing red eyes watching them warily. \"Death and darkness linger here,\" warned the Force-sensitive member.\n\nThe team cautiously searched near the flag but found nothing except damaged lightsabers-all containing crimson kyber crystals. Meanwhile, the Force-sensitive individual was drawn to the flag. Upon touching it, they cried out in agony, drawing immediate attention. The team administered emergency aid and quickly evacuated the unconscious scientist via teleporter back to the Science Ship for treatment."
    kuat_situation.63.A:0 "Let's see what information we can obtain."
    kuat_situation.64.desc:0 "The surgery was successful; the Force-sensitive individual is now healthy. With their consent, scientists performed a deep brain scan, identifying the cause of neural trauma and coma-an implanted foreign memory.\n\nThis molten World was once the jewel of the Galactic core. Powerful light-side Force energy converged here through a Jedi Temple, nurturing the World. Its fertile lands and breathtaking landscapes surpassed even artificial environments, and its food production saved multiple star systems from famine.\n\nUntil war erupted-no declaration, no warning, no provocation. A sudden total war caught the Republic off guard, losing a fifth of its Worlds within a year. When the Republic counterattacked, they found those lost Worlds transformed into twisted bio-planets hostile to all known Galactic life. Worse, the enemy possessed advanced biotechnology capable of altering any organism to infiltrate every corner of the Republic. The richer and more fertile a World, the more fiercely it was attacked.\n\nWar was brutal. To regroup forces, some Worlds were abandoned. Decades of death and violence plunged the Galaxy into darkness. Once quiet stars grew restless, calm oceans churned, and gentle herbivores became bloodthirsty predators. Even fortune brought misfortune-the Jedi Temple endured through these changes until the war's end, even outlasting the Republic itself... The last Jedi, attempting to return to the Force and become Jedi spirits to defend the Republic's final territories, failed-having lost their masters early in the war.\n\nIn despair and rage... they embraced darkness, heeded its whispers, and became specters of the dark side, bound to the World itself. Ground battles eventually ended in victory, but the enemy had already abandoned the World. The shrieks of biological warships in orbit became the final vision of the Jedi of Yesterday.\n\nTens of thousands of years later, a passing Science Ship drew their lingering spirits to the Republic's flag, using their last strength to call out to travelers across the Star Sea."
    kuat_situation.64.A:0 "Honor these noble spirits."
    kuat_situation.64.B:0 "May the Force be with you."
    kuat_situation.64.C:0 "Your legacy shall be inherited by us."

    kuat_situation.65.name:0 "§EOrigin of the Ship"
    kuat_situation.65.desc:0 "During our Asteroid mining operations, we unexpectedly discovered a massive ship buried underground-a steel leviathan sleeping beneath the surface. Upon opening its doors and stepping inside, we found countless robots in hibernation throughout the vast chambers. Strangely, these robots were not unfamiliar-they bore striking resemblance to $Name_kuat$'s mechanical armies. Yet through extensive research, we confirmed they were not created by $Name_kuat$, nor had this World ever belonged to $Name_kuat$.\n\nFrom data retrieved from the ship's database, we identified it as a reconnaissance vessel controlled by $Name_Kuat_Fire_base$, shot down during combat with $Name_kuat$ and crashed onto this World. Why $Name_Kuat_Fire_base$ fought $Name_kuat$ remains unknown."
    kuat_situation.65.A:0 "Perhaps just a coincidence."
    kuat_situation.65.B:0 "Chilling when pondered deeply."

    kuat_situation.66.name:0 "§EStrange Robot"
    kuat_situation.66.desc:0 "Our fleet was on routine patrol when suddenly detected a bizarre bipedal carbon-based lifeform drifting in space. Featureless and resembling a desiccated corpse, yet shipboard sensors indicated faint signs of unknown biological activity.\n\nWe captured it immediately and began detailed study. Surprisingly, it appeared to be an artificial carbon-based lifeform composed of countless stem cells-perhaps better termed a 'carbon-based robot,' representing a radically different research path from our traditional silicon-based automatons. Within its body, we found residual traces of unknown energy sources still sustaining its operation-likely why our sensors detected life signs. We may attempt deeper research, possibly recovering stored historical data.\n\nAfter relentless effort, we developed a method to scan its memory core. Sadly, the robot appears severely damaged-or deliberately altered-rendering its data highly degraded. No coherent information could be extracted. We will consider further studies on its structure and composition. Perhaps one day we'll encounter its kin. But the past and experiences of this carbon-based automaton $Name_Kuat_Contractor$ will remain forever a mystery."
    kuat_situation.66.A:0 "Farewell."
    kuat_situation.67.name:0 "§EMedieval Nuclear Power"
    kuat_situation.67.desc:0 "We discovered a civilization's ruins on Kepler-OuO. Analysis suggests it never reached spaceflight, perhaps never even discovered electricity-a mere medieval society. Yet inexplicably, nuclear radiation traces exist here, defying comprehension. After prolonged search, we found a data-storage artifact. Decoding its contents revealed that in one tribal branch, someone accidentally discovered a pond several kilometers away glowing blue at night. Contact with its water caused fatal rotting sores, and the condition proved contagious.\n\nThe tribe's chief declared it cursed, forbidding anyone from approaching.\n\nLater, invaders attacked. In desperation, defenders threw the pond's water at enemies, repelling them-those struck suffered the same gruesome fate. But those who handled the water also succumbed to the curse, falling one by one.\n\nThen a shaman emerged, discovering certain ores could be crafted into vessels blocking the curse's power. He forged a device called the 'Vessel of the Cursed Chest,' granting immense threat potential. He used it to dominate neighboring tribes-disobedience meant curse exposure.\n\nThe first feudal state based on nuclear deterrence was born. The turning point of this civilization's fate emerged in war-apparently, the 'cursed substance' contaminated their water supply, spreading across the entire World, ultimately causing total extinction."
    kuat_situation.67.A:0 "Result of a misaligned tech tree?"
    kuat_situation.68.name:0 "§EMixed Blessings"
    kuat_situation.68.desc:0 "An earthquake caused by tectonic shifts on Kepler-UoU collapsed the city center of a bustling metropolis into a giant crater. After debris clearance, we uncovered an alien-manufactured factory buried beneath. Clearly forgotten for eons, it once housed wonders of high automation. Scattered among ruins were numerous wreckage of fully automated robots. Sampling revealed their limbs composed of organic compounds, supported internally by polymer endoskeletons-now equally decayed.\n\nRepeated studies suggest a faint possibility of repair, however slim. While the factory might be reactivated, these fascinating automated workers can never awaken again. They will rest forever in the Abyss of time, becoming embodiments of regret."
    kuat_situation.68.A:0 "Regret is the universe's dominant melody."
    kuat_situation.69.name:0 "§EStrange Natives"
    kuat_situation.69.desc:0 "We discovered an intriguing native civilization. Though pre-FTL, surprisingly, they detected our presence shortly after we began observation. Unexpectedly, these inhabitants show no interest in the vast cosmos, instead wholly immersed in entertainment facilities built by their own civilization. They dedicate their most vital resources to leisure, neglecting everything else-resulting in a societal structure entirely alien to ours.\n\nLogically, such a civilization should be extremely backward and uncreative. Yet astonishingly, in entertainment domains, they surpass us in many aspects-as if capable of elevating their culture to unprecedented heights. It is a wondrous yet real culture, leaving us amazed at their innovative spirit while simultaneously feeling profound sorrow..."
    kuat_situation.69.A:0 "Perhaps we could try learning from them to improve our people?"

    kuat_situation.70.name:0 "§EAnomalous Signal"
    kuat_situation.70.desc:0 "As the Galactic Plague gradually recedes, our Empire's operations finally return to normal. Yet our scientists report multiple anomalous energy activities near the Sector bordering the Galactic Mid, fluctuations undocumented in any records. Unable to determine their cause or consequences, we must remain vigilant."
    kuat_situation.70.A:0 "We adapt as needed!"
    kuat_situation.70.B:0 "Investigate immediately!"
    kuat_situation.70.C:0 "Immediately halt all investigation activities!"
    kuat_situation.71.name:0 "§EUnusual Outburst"
    kuat_situation.71.desc:0 "Our imperial scientists have confirmed the source of these energy fluctuations: an abnormal surge in stellar output from a star within the Galaxy. The star emitted intense gamma rays, sweeping through several nearby star systems, severely disrupting communications and other infrastructure. Researchers have pinpointed the erupting star's location. As no records document this phenomenon, we cannot predict what awaits upon entry-proceed with caution."
    kuat_situation.72.name:0 "§EStellar Transmutation"
    kuat_situation.72.desc:0 "After entering the star system, our researchers determined that this former star was far from reaching old age and should have been perfectly normal. However, during our investigation, we conducted a complete analysis of the star's current state.\n\nThe results indicate that the star now exhibits properties similar to a Black Hole, yet bizarrely, it does not attract any objects-instead, it repels them. This property has never been observed on any World in the galaxy before. Scientists believe the star has undergone transmutation.\n\nAlthough approaching the star is dangerous, we must still enter this system to discover what has occurred. Since the event happened without warning, we must proceed with extreme caution. In addition, some of our fleets have sustained varying degrees of damage."
    kuat_situation.72.A.tooltip:0 "One of our stationed fleets has been destroyed"
    kuat_situation.72.B.tooltip:0 "Parts of ships within multiple allied fleets have been destroyed"
    kuat_situation.73.name:0 "§EStellar Transmutation"
    kuat_situation.73.desc:0 "The star system affected by the accident is highly unstable relative to surrounding clusters. The central star continuously emits powerful energy, severely interfering with our instruments.\n\nThe violent outburst has triggered shockwaves that have nearly destroyed everything within the system, shattering all Worlds into fragments. This condition makes remote detection virtually impossible, forcing our investigation to begin up close at the star itself. Our research team must now prepare radiation- and heat-resistant equipment to commence direct stellar investigation.\n\nHowever, information obtained directly from the star remains extremely limited. Just as our scientists were at a loss, certain data revealed the presence of Isotope-5 within its material layers-an element theoretically impossible to exist naturally within such a star. This discovery baffled everyone.\n\nAs scientists prepared to investigate further, the star suddenly increased its energy output once again. For safety reasons, our research team had no choice but to halt operations. We must now immediately evacuate this star system."
    kuat_situation.74.name:0 "§EMysteriously Born Celestial Body"
    kuat_situation.74.desc:0 "After surviving the intensified energy burst from the star's further transmutation, spatial fluctuations in the system gradually subsided. Our research team immediately resumed observations of the star's status. Probes quickly returned their findings: against the dark sky, the star was gone. In its place stood a celestial object known as the 'Caroline Singularity,' emitting a pale glow outward. This type of body had previously existed only in theory, with no records proving its prior existence.\n\nThis is undoubtedly a historic discovery, greatly exciting our scientific community. Combined with earlier findings, the rare material Isotope-5 not only enables construction of powerful warships but can even alter the nature of Worlds. This conclusion significantly advances our understanding of astrophysics. If this theory is further developed, we may one day master the technology to control stars.\n\nSince stars are the ultimate sources of energy and matter dispersal in the universe, their nuclear fusion processes and life cycles form the fundamental elements of all reality, providing extreme environments for matter, radiation, and particles through immense fusion energy.\n\nOur new physical theory suggests that the interiors of stars are the ultimate creators of infinite domains of matter and energy states. Exploration of this system concludes here. We must continue monitoring the Caroline Singularity, but the research team needs to withdraw, organize our findings, and conduct further studies."
    kuat_situation.75.name:0 "§ETheoretical Research"
    kuat_situation.75.desc:0 "Through persistent efforts by our empire's most elite scientific teams, research into the Abyss has yielded preliminary conclusions: the Abyss is an engineered instance of alternate reality, highly dependent on stellar energy. By combining quantum possibility fields with cluster topology, such engineering becomes feasible. This opens prospects for observing stars and star clusters, enabling access to alternative-world possibility domains through the distribution of matter and energy.\n\nWith Isotope-5, we can transform stars into topological structures tailored for navigating star clusters. These structures integrate luminosity, matter, gravity, and energy distribution-representing both a temporary present state and the evolutionary outcome of clusters over time.\n\nThis raises another question: if the Caroline Singularity is a topological structure formed via Isotope-5 transformation, how might we use it to unlock hidden possible worlds between and within stars? How would it affect the galactic environment? If this theory holds, what could we expect from stellar manipulation?\n\nAnd if the Caroline Singularity was artificially transformed, who did it, and why? They likely possess technology far beyond our comprehension. Are these stars their windows into our world-or is their world already desolate, using our stars as lenses? Many questions remain unanswered."
    kuat_situation.76.name:0 "§EDecoding Complete"
    kuat_situation.76.desc:0 "We have completed the analysis of stellar data. Preliminary findings from our research team confirm that the star's transformation aligns with our previous conclusions-it can open a gateway to the unknown. Currently, the celestial body remains stable, and we must find a way to activate this gateway.\n\nThey are experimenting with Isotope-5 to induce reactions in the Caroline Singularity, but so far no valuable information has emerged. Our researchers discovered remnants of artificial space structures within this system containing traces of Isotope-5. Based on analysis, it is highly likely that an ancient civilization once occupied this system as a strategic storage depot for Isotope-5, employing methods to conceal its coordinates, preventing us from detecting its existence until now.\n\nFurther analysis indicates that the ancient civilization may have constructed a series of facilities around this star with currently unknown purposes. We must gather as much information as possible and deliver it to our research teams for study."
    kuat_situation.77.name:0 "§ETests Completed"
    kuat_situation.77.desc:0 "We have completed tests on the celestial body and used collected data to simulate a reconstruction of the ancient civilization's facilities. Researchers are attempting to fully investigate what once occurred there. The scientific team believes the facility must have been enormous. Since launching exploration and search operations on the ruins, we have acquired several highly valuable sets of ancient data and materials.\n\nThese data suggest a strong connection between the facility and an unknown ancient civilization. They built this installation and stored Isotope-5 here, but for unknown reasons, they no longer inhabit our world. They may have perished, or perhaps the Caroline Singularity itself is the gateway to their realm. Nevertheless, within relatively intact wreckage, we recovered bodies likely belonging to members of this ancient civilization. These bodies still show biological signs of life but do not respond to any stimuli-appearing trapped in an unending slumber.\n\nThe remains are housed in chambers resembling cryogenic pods, with various non-functional devices connected to their bodies. We should seek more valuable information."
    kuat_situation.78.name:0 "§EResearch Complete"
    kuat_situation.78.desc:0 "Since our research team began investigating the ruins of the ancient civilization's facilities and the recovered ancient biological remains, we have obtained highly valuable ancient data. From existing findings, our scientists have painstakingly pieced together several clues.\n\nRegarding the ancient facility: the ancient civilization once constructed a massive fortress in this system, using it as a key strategic storage site for Isotope-5. After operating for thousands of years, the civilization vanished due to unknown causes. Using unknown methods, they relocated most of the facility's components and concealed the system's coordinates from star charts to prevent discovery.\n\nRecently, someone activated or destroyed the remaining installations, injecting large quantities of Isotope-5 into the star, triggering a massive coronal mass ejection. As a result, the star was transformed into the Caroline Singularity.\n\nAs for the ancient biological remains, examination results shocked our research team. These bodies appear stitched together from multiple different organisms, exhibiting distinct DNA across various body parts, yet their exteriors appear seamless. Autopsies confirmed these findings-their skeletal structures and internal components share no commonalities. Such abnormality leads our scientists to suspect these remains may be failed or discarded products of an artificial life project. We have decided to search for more valuable information."
    kuat_situation.79.name:0 "§ENew Clues"
    kuat_situation.79.desc:0 "Despite our research team's full efforts, no further clues can be obtained within this system. With the Caroline Singularity's reactions stabilizing, continued resource investment is no longer justified. We have decided to collect well-preserved fragments of ancient facilities and return them to our empire, hoping to extract meaningful data."

    kuat_situation.80.name:0 "§ENew Questions"
    kuat_situation.80.desc:0 "Our research team recovered a file from the destroyed wreckage that documented the facility's final moments. We need to decode this file. From the initial interpretation, we understand that it describes a storage system technically known as a "Planck container," in which isotope-5 remains stable only when stored. This type of facility can also store large quantities of common materials. However, due to its characteristics, once the container's exterior is damaged, it can easily lead to a chain reaction that destroys the entire container due to the disruption of its stable environment."

    kuat_situation.81.name:0 "§EArchive Decoded"
    kuat_situation.81.desc:0 "Our research team has completed decoding the archive. According to its contents, these facilities were networked via a quantum communication system with similar installations across the universe. Once one facility is destroyed, all Isotope-5 storage sites within that region will self-destruct simultaneously.\n\nWe do not yet understand the purpose of this design, but the widespread projection of Isotope-5 into space could drastically alter the astronomical environment of the entire region, destabilizing our universe and invalidating long-held cosmic principles. This warrants caution.\n\nAdditionally, our exploration team was fortunate to discover a data core among the wreckage. We may obtain more information from it-but currently lack the proper decryption key."

    kuat_situation.82.name:0 "§EWhispers from the Past - Prologue"
    kuat_situation.82.desc:0 "The encryption method used by this data core resembles those found in ancient databases. Due to our research team's extensive experience, we can extract information without complex decryption procedures. However, deeper data extraction will require additional time."

    kuat_situation.83.name:0 "§EWhispers from the Past - I"
    kuat_situation.83.desc:0 "Within the structural core's database, we discovered numerous archives written in an unknown script. After decryption by our researchers, we successfully obtained more information-including a functional interactive holographic projection terminal. After thorough verification of the device's safety and reliability, our expedition team activated it.\n\nPerhaps due to the passage of immense time, the projector underwent a lengthy recalibration process upon activation. Once complete, the stored imagery was finally presented to our explorers.\n\nThe projection displayed a being entirely covered in artificial machinery. We could not identify it as any known sentient species, though we could barely determine it belonged to a humanoid form. As scientists attempted analysis, the entity within the projector began to speak.\n\n'Greetings, Narodia of uncertain fate. I regret that due to our extinction, we can only meet in this manner. But I must warn you: this is not a place where you should be. Since the war ended, this location should never have been discovered. If the connection to the real plane is reestablished, then our efforts and sacrifices have failed. Therefore, I must reveal to you the truth of our destruction.'"
    kuat_situation.83.A:"Old Bideng, stop pausing dramatically!"

    kuat_situation.85.name:0 "§EWhispers from the Past - II"
    kuat_situation.85.desc:0 "§YWe were called the 'Inheduani,' and this place was known as 'Homeland,' or by others, 'Domain of Vira.' It is the core of the Abyss system, disconnected from any physical reality plane, accessible only through a single gate connecting to the real world.\n\nWe once built a mighty nation here, using spacetime-warping technology to construct that gate and expand our territory into the real plane. Yet, due to our reckless abuse of forbidden genetic engineering, we suffered severe genetic defects-defects that were both contagious and hereditary.\n\nWe were forced to isolate the afflicted, allowing the unaffected to survive. But the Abyss system is a vast trap, a colossal prison. Here, everything about us changed. A twisted mental impulse swept through us, and 'Inheduani' under its control launched a rebellion.\n\nTheir assault reached deep into the heart of the Abyss. After tens of thousands of years of war, we ultimately defeated them. Yet, we were exhausted, our territories reduced back behind the gate as we sought to rebuild our strength.\n\nHowever, with external enemies gone, most of our people fell into hedonism. To break the barriers of reality, they constructed a massive facility called the 'Construct,' choosing to preserve their bodies while linking their consciousness into it. They established the Law of One Mind, diving into virtual space. Only a tiny fraction remained in the real world, maintaining the operation of our ancient imperial machine.§!"
    kuat_situation.85.A:"You're still pausing dramatically!!?"

    kuat_situation.86.name:0 "§EWhispers from the Past - III"
    kuat_situation.86.desc:0 "Yet none of us noticed-our enemies were not truly destroyed in the war. Their consciousness also entered the virtual space through the 'Construct.' A child with black eyes, never born, never possessing a body, violated the Law of One Mind. He was a pure forbidden existence.\n\nThough our virtual counterparts rejected and despised him, this only fueled his desire to infiltrate and corrupt the entire virtual space from within. Without external intervention, over time, more and more of our kin's consciousness was eroded. They ceased to be our kin, transformed into our former enemies-now bearing a new name: '$Name_Kuat_Contractor$'.\n\nAfter completing the corruption of the 'Construct,' they hid, seeking to return to the real world. They whispered advanced technologies into the minds of our remaining real-world kin, guiding them to build the facilities they needed. Though a few wakeup individuals uncovered this conspiracy, we acted too late. '$Name_Kuat_Contractor$' gained possession of our kin's bodies and launched a massive assault using newly constructed warships based on their technology.\n\nSimultaneously, they unleashed a cosmic plague across the entire 'Homeland.' This disease infects all life forms, even converting inorganic beings into organic ones, transforming victims into shells usable by '$Name_Kuat_Contractor$' to house their consciousness-allowing more '$Name_Kuat_Contractor$' to leave the Construct and enter the real world. They rebuilt their power within the Construct.\n\nAfter a long process of assimilation and evolution, our enemies have changed. They are no longer the foes we once knew. They are acquiring traits they never had before, growing stronger. Thus, the 'Inheduani' have vanished. Now, only $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$ remain."

    kuat_situation.84.name:0 "The Fall of the Inheduani"
    kuat_situation.84.desc:0 "The 'Inheduani' stepped into a forbidden realm, rejected by both reality and illusion. Though powerful in technology and capable of warping reality, they were trapped in the cracks. The decaying 'Inheduani' gradually collapsed, and from their corpses arose a great evil storm. $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$ are two sides of the same coin-twin threats lurking in the fissures of reality. And now, they have returned."
    kuat_situation.84.A:0 "Meet force with force, water with earth!"

    kuat_situation.87.name:0 "$Name_boss_Venator$ Research Breakthrough"
    kuat_situation.87.desc:0 "Recently, our research team, while analyzing ancient data from Endodia, discovered legacy ship design data from the facility. These designs have now been confirmed as part of a secret research program conducted by the Endodian Empire during the final stages of their war, which they referred to as the $Name_boss_Venator$-class Battlecruiser.\n\nAlthough the design data is partially damaged, it does not hinder our ability to reconstruct their results. This new warship type can now be constructed in our shipyards.\n\nDecoding of ancient data continues. Our researchers are proceeding with further investigations."

    kuat_situation.88.name:0 "$Name_boss_Venator_II$ Research Breakthrough"
    kuat_situation.88.desc:0 "As decoding progresses smoothly, we have uncovered a new wartime product from this ancient ship research center. This warship type bears significant resemblance to the previously discovered $Name_boss_Venator$.\n\nOur researchers conclude it is likely the command variant of the same series, as the newly discovered design is notably larger and features clear command infrastructure layouts. It is confirmed that the Endodian Empire named it the $Name_boss_Venator_II$ Command Battleship.\n\nAlthough the design data is partially damaged, reconstruction remains feasible. This new warship type can now be constructed in our shipyards.\n\nDecoding of ancient data continues. Our researchers are proceeding with further investigations."

    kuat_situation.89.name:0 "$Name_boss_X308_Balletor$ Research Breakthrough"
    kuat_situation.89.desc:0 "During the analysis of ancient data, our research team discovered a new warship design significantly different from the previously found $Name_boss_Venator$ and $Name_boss_Venator_II$.\n\nResearchers believe this to be a new type of Battleship, as the newly discovered vessel is considerably larger and differs greatly in design style from earlier discoveries-suggesting it may originate from another source. It is confirmed that the Endodian Empire named it the $Name_boss_X308_Balletor$ Star Heavy Cruiser, closely resembling vessels of $Name_kuat$.\n\nAlthough the design data is partially damaged, reconstruction remains feasible. This new warship type can now be constructed in our shipyards.\n\nDecoding of ancient data continues. Our researchers are proceeding with further investigations."

    kuat_situation.90.name:0 "$Name_boss_X308_Titan$ research breakthrough achieved"
    kuat_situation.90.desc:0 "While analyzing ancient data, our research team discovered a new warship design that differs significantly from our previously found $Name_boss_Venator$ and $Name_boss_Venator_II$. Instead, its design style closely resembles that of the $Name_boss_X308_Balletor$.\n\nOur researchers believe this to be a new type of Battleship, designed by $Name_kuat$. It is confirmed that the Endodia Empire referred to it as the $Name_boss_X308_Titan$ Star heavy cruiser.\n\nJudging from the ship's design data, the relationship between $Name_kuat$ and the Endodia Empire may not be as simple as it seems.\n\nThe analysis of ancient data has not concluded. Our researchers are continuing further investigations."

    kuat_situation.91.name:0 "$NAME_KUAT_EXECUTOR$ research breakthrough achieved"
    kuat_situation.91.desc:0 "While analyzing the remaining ancient data, our research team once again discovered a new warship design. This design closely resembles the $Name_boss_X308_Balletor$ and $Name_boss_X308_Titan$, but is even larger. Our researchers believe it to be $Name_kuat$'s Star dreadnought.\n\nSubsequently, based on characteristics of these ship designs, our researchers concluded that the $Name_boss_Venator$ and $Name_boss_Venator_II$ were Autonomous attempts by the Endodia Empire to emulate $Name_kuat$'s vessels. They differ significantly from $Name_kuat$'s $Name_boss_X308_Balletor$, $Name_boss_X308_Titan$, and $NAME_KUAT_EXECUTOR$. Although their appearance imitates $Name_kuat$'s design principles, their functionality appears to lean toward another technological path.\n\nUnfortunately, we currently cannot identify the origin of this functional design. However, we can confirm that prior to the outbreak of war, the relationship between the Endodia Empire and $Name_kuat$ was likely similar to-or even closer than-our current relationship with $Name_kuat$.\n\nYet they ultimately turned against each other. Perhaps this offers valuable insight for our future decisions."

    situation_research_F_facility_technology_desc:"During our settlers' expansion of the colony site, they unexpectedly discovered a strange signal source and immediately reported it to our Science Ship team. After investigation, we have confirmed that the source is an artificial ancient structure complex. This discovery greatly benefits our research, and we should immediately dispatch additional Science Ships to thoroughly explore this find."
    situation_research_F_facility_technology_type: "$situation_research_F_facility_technology$"
    situation_research_F_facility_technology:"§E$Name_F_1$ Ancient Database§!"
    situation_research_F_facility_technology_monthly_change_tooltip:0 "We are still in the fog"

    site_F_systeam_2:0 "§EAncient Spire§!"
    site_F_systeam_2_intro:0 "$kuat_extramonster_expand.46.desc$"

    kuat_extramonster_expand.1.title:0 "Situation: $situation_research_F_facility_technology$"
    kuat_extramonster_expand.1.desc:0 "During our settlers' expansion of the colony site, they unexpectedly discovered a strange signal source and immediately reported it to our Science Ship team.\n\nAfter investigation, we have confirmed that the source is an artificial ancient structure complex. This discovery greatly benefits our research, and we should immediately dispatch additional Science Ships to thoroughly explore this find."
    kuat_extramonster_expand.1.a:0 "Must investigate thoroughly."
    kuat_extramonster_expand.7.name:0 "$situation_research_F_facility_technology$-Discovery"
    kuat_extramonster_expand.7.desc:0 "Using our advanced and precise instruments, our scientists managed to approach and reach the vicinity of the ancient structure complex. Based on spatial distribution of geographical data, researchers believe the complex has not existed for an extremely long time, though far longer than the duration of the shield. Explorers also discovered several large tunnels created recently, which they speculate may be related to the unidentified vessel that appeared when the shield deactivated. The construction of this complex dates back so far that its structural stability can no longer be guaranteed.\n\nAfter stabilizing the structures, researchers used sensor feedback to pinpoint the signal's location. They determined the signal originates from the tall spire at the center of the ancient complex.\n\nResearchers then organized an expedition into the building and successfully discovered an operational ancient database.\n\nIt is now certain that these ruins we have uncovered may allow us to unravel the secrets hidden on this World and within this star system."
    kuat_extramonster_expand.6.name:0 "$situation_research_F_facility_technology$-Investigation"
    kuat_extramonster_expand.6.desc:0 "After our scientists performed preliminary decryption of the ancient database, they discovered data highly beneficial to our investigation. Some of this data mentioned a concept called 'Abyss'. Further analysis led to a new physical theory suggesting that stellar cores are the ultimate creators of infinite possibilities for matter and energy states.\n\nOne of our scientist even believes that if we wish to control stellar evolution, such technology must enable observation-and even navigation-of quantum field topologies of matter and energy states. In other words: they might penetrate the primary layers of physical reality and enter substitute worlds and realities. This 'substitute world' is precisely the 'Abyss'.\n\nThe Abyss represents a possible but currently unproven distribution mode of matter and energy, distinct from common concepts like wormholes involving spacetime folding. The Abyss is a pocket within the quantum-level uncertainty domain of reality-a potential shadow pocket of alternate reality, an alternate distribution of stellar matter and energy.\n\nThus, the Abyss may not merely be a spacetime phenomenon, but rather an enclave of indeterminate spacetime-a pocket of alternate reality akin to atomic-level quantum effect fields.\n\nHowever, since this theory would overturn all existing conclusions about our understanding of the universe, without further data or experimental support, our knowledge of the Abyss ends here for now. We must now shift our focus to analyzing other data extracted from the database."
    kuat_extramonster_expand.5.name:0 "$situation_research_F_facility_technology$-Research"
    kuat_extramonster_expand.5.desc:0 "Due to the immense size of the entire database, our research team could only obtain basic storage information via scanning drones, then classify existing data before conducting detailed analysis.\n\nThrough relentless day-and-night efforts, we have finally gained a fundamental understanding of the database's full scope. Scan results indicate it contains nearly all knowledge prepared by an unknown civilization to confront a crisis. Most of it can be understood using our current scientific theories, while their research in genetic engineering and digital life reaches extraordinary depth-some theories far exceed our comprehension.\n\nBased on available compiled data, we conclude this civilization mastered the ability to fully digitize human consciousness into organic artificial bodies, enabling infinite replication of individuals without genetic links between copies. This civilization used this technology to create super soldiers, though detailed records are either damaged or not yet decrypted.\n\nEven this limited information has thrilled our research team, who now face their next tasks with great enthusiasm."
    kuat_extramonster_expand.4.name:0 "$situation_research_F_facility_technology$-Research"
    kuat_extramonster_expand.4.desc:0 "After additional researchers from across the Empire arrived on-site, they immediately began analyzing new data and successfully restored another relatively intact dataset, filling gaps in our understanding of the "Abyss." This section of the data points out that, as stars are the ultimate producers of energy and disseminated matter in the universe, their nuclear fusion processes and different life cycles constitute the fundamental elements of all reality. Through extremely high fusion energies, they provide an extreme environment for matter/radiation and particles. Our new physics theory posits that the interior of stars is the ultimate creator of an infinite domain of possibilities for matter and energy states. Therefore, if we are to further explore the secrets of the Abyss, we must begin with stars, and the data also mentions the way stars open the gateway to the Abyss—stellar transmutation. This section of the data ends here; our team of scientists is now attempting to recover data from a larger storage unit, hoping that some usable remnants of information may remain."
    kuat_extramonster_expand.3.name:0 "$situation_research_F_facility_technology$-Research"
    kuat_extramonster_expand.3.desc:0 "Although the entire facility is remarkably well-preserved, due to lack of maintenance over unfathomable eons, data recovery remains extremely difficult. Nevertheless, thanks to our Science Ship team's efforts, all data storage units in decent condition have been restored. By extracting data related to the 'Abyss' from the database to assist our research, we have made some progress.\n\nAfter sustained study by our Empire's most elite research team, conclusions on the Abyss have begun to emerge: the Abyss is an engineered instance of alternate reality, highly dependent on stellar energy. Through a combination of quantum possibility fields and cluster topology, such engineering becomes feasible.\n\nThis opens prospects for observing stars and star clusters, and enables entry into alternate-world possibility domains through redistribution of matter and energy. Using Isotope-5, we can transform stars into the topological structures needed to navigate star clusters.\n\nThis structure combines distributions of luminosity, matter, gravity, and energy-representing both a temporary present state and the result of the cluster's evolution over time.\n\nWe are fully capable of designing and constructing such a structure. The only obstacle is Isotope-5. With this conclusion reached, our research team has moved on to the next phase."
    kuat_extramonster_expand.2.name:0 "$situation_research_F_facility_technology$-Report"
    kuat_extramonster_expand.2.desc:0 "The vast ancient database still holds many unknowns awaiting discovery, but we have already extracted its most critical information. A small team will remain behind to continue excavation over an extended period.\n\nNow we must complete our research on stellar topology. Additionally, another data group extracted a strange investigative report from the database.\n\nThey are currently decrypting it. So far, numerous inconsistencies require explanation. Hopefully, this report will provide answers."
    kuat_extramonster_expand.2.A:0 "Hope it goes smoothly."
    kuat_extramonster_expand.8.name:0 "Tracking the mysterious vessel-Tracking"
    kuat_extramonster_expand.8.desc:0 "Our team investigated the trail of the mysterious vessel that launched from the World. Though its engine left almost no trace, by mobilizing more resources, we can still track its destination."
    kuat_extramonster_expand.8.a:0 "Find it."
    kuat_extramonster_expand.9.name:0 "Mysterious Coordinates"
    kuat_extramonster_expand.9.desc:0 "Soon, our experts completed analysis of these signals. Their report indicates we have obtained coordinates leading to an unknown location. These coordinates do not point to a star system; remote scans show only deep space. Due to possible detection shielding, remote scanning cannot reveal the secret of these coordinates. After confirming the signal's position, we must dispatch researchers and Science Ships to this location to uncover its hidden mysteries."
    kuat_extramonster_expand.9.a:0 "Find it."
    kuat_extramonster_expand.10.name:0 "§EUnprecedented Giant Structure§!"
    kuat_extramonster_expand.10.desc:0 "When our Science Ship entered this coordinate, the first thing researchers saw was a colossal structure towering at the region's center. Its architectural form does not match any known precursor civilization recorded in our archives.\n\nConcerned that the mysterious vessel might still be hiding nearby, [leader.GetName] led her Science Ship crew in an immediate security sweep of the surrounding space, while also conducting structural scans of the building itself. Scans revealed the structure is far older than we imagined, suggesting it may be the last surviving relic of a previously unknown ancient civilization. Observation also shows significant external damage, though seemingly confined to the exterior without affecting internal systems.\n\nSensors detected active power generation within the structure. [leader.GetName] decided, after completing scans of the surrounding space, to attempt entering the structure for exploration."
    kuat_extramonster_expand.10.a:0 "Truly astonishing!"

    site_F_systeam:0 "§EAncient Structure§!"
    site_F_systeam_intro:"When our Science Ship entered this coordinate, the first thing researchers saw was a colossal structure towering at the region's center. Its architectural form does not match any known precursor civilization recorded in our archives. We need to figure out: what exactly is this?"
    kuat_extramonster_expand.11.name:0 "§EPhase One: Exploration§!"
    kuat_extramonster_expand.11.desc:0 "[leader.GetName] conducted thorough scans of the massive structure, attempting to locate a route inside. However, every scan returned only pitch-black images. Clearly, unknown technology is blocking all attempts to scan the interior. Even our most advanced technology and precise instruments cannot penetrate this shielding.\n\n[leader.GetName] had no choice but to abandon attempts to explore inward, shifting attention instead to exposed structural sections damaged by deterioration. Perhaps clues from materials used in construction could reveal information about the builders-information highly beneficial to our investigation. [leader.GetName] has already begun this work."
    kuat_extramonster_expand.11.a:0 "Continue."
    kuat_extramonster_expand.12.name:0 "§EPhase Two: Ancient Facility§!"
    kuat_extramonster_expand.12.desc:0 "[leader.GetName] and her team approached the more severely damaged sections of the structure, collecting samples from debris floating in space, while deploying drones for limited exploration into the damaged interior.\n\nBased on drone-transmitted data, [leader.GetName] believes the structure contains conditions suitable for lifeforms. Since the main body remains largely intact and the power system is still operational, we cannot rule out the possibility of living beings still residing within. Without knowledge of internal conditions, our Science Ship team cannot confirm this hypothesis. However, one thing is certain: we must enter the facility to answer all questions."
    kuat_extramonster_expand.12.a:0 "Continue."
    kuat_extramonster_expand.13.name:0 "§EPhase Three: Beneath the Structure§!"
    kuat_extramonster_expand.13.desc:0 "Our science team has reached the central region of the megastructure and begun investigating the entire facility. Preliminary clues suggest this megastructure was not built for military purposes, but rather appears to be a large-scale scientific research complex. Perhaps after enduring the harsh conditions of space for eons, the station's internal environment is now incomplete and unstable.\n\nUpon entering this colossal space station, they found it utterly silent, with only damaged equipment and drifting debris remaining. The exploration team advanced cautiously through decaying corridors, searching for any possible clues. Fortunately, some sections of the facility are still operational. With coordinated effort, they successfully deactivated the defense systems and gained control over these areas.\n\nInside a control room, they discovered an ancient log device containing records from before the facility's abandonment. It turns out that a catastrophic power failure once occurred here, triggering a complete collapse of the station. This may explain why the exterior of the megastructure remains largely intact, yet no life signs have been detected.\n\nAnother section of the log describes the facility's former inhabitants observing a peculiar celestial body. Our expedition has brought this log device back to our scientists, who will now begin decoding its contents. The rest of the exploration team will continue their search throughout the facility."
    kuat_extramonster_expand.13.a:0 "Continue."
    kuat_extramonster_expand.14.name:0 "§EPhase Four: Ancient Mystery§!"
    kuat_extramonster_expand.14.desc:0 "After completing their exploration of the lower levels of the colossal structure, the expedition began ascending to higher sections. Previous discoveries confirmed that this was an ancient research center left behind by a long-lost civilization, clearly of great importance. Therefore, we dispatched more scientists to participate in the investigation, hoping to uncover further discoveries. [Leader. GetName] and her research team navigated for several hours through the labyrinthine ruins of the ancient spire. After clearing several rogue automated defense systems, the explorers discovered an area emitting a strong tachyon signal. This area was sealed behind a door with a unique mechanism. Fortunately, our exploration was aided by "$Name_Kuat_StarContractor$", making it easy to understand the mechanism of the door. After a tremor, the door slowly opened, allowing our expedition to see the interior of the facility. During their deeper investigation, the team discovered the remains of these creatures and some strange specimens. After a brief analysis, they concluded that these biological specimens were one or more organisms that had been repeatedly cloned, replicated, and mutated. These specimens, devoid of vital signs, still have research value, potentially significantly advancing the Empire's research into genetic life."
    kuat_extramonster_expand.14.a:0 "Continue."
    kuat_extramonster_expand.15.name:0 "§EPhase Five: Ancient Mystery§!"
    kuat_extramonster_expand.15.desc:0 "Meanwhile, deep within the region, we found our target—an ancient data terminal still operational. Due to its immense size, dismantling and transporting it back to our Empire was impossible. Instead, we had to leave a team of scientists to maintain the terminal and attempt to extract its stored information. Fortunately, the terminal contained complete structural blueprints and a comprehensive data archive of the facility, making the restoration of this massive structure possible. Just as we were preparing to move to the next phase, our blockade fleet detected a jump signal. A ship had breached our outer defense perimeter and entered the region. Identification confirmed it was one of two unknown ships previously launched from the $Name_F_1$ Shield World, designated "Sanctuary." Faced with this unknown threat, the exploration team had to choose: completely seal off the area and evacuate immediately, or risk further research to uncover its secrets and find a solution."
    kuat_extramonster_expand.15.a:0 "Leave a portion of personnel to continue research; return Science Ship to homeworld to upload data"

    kuat_extramonster_expand.16.name:0 "$Name_Kuat_StarContractor$"
    kuat_extramonster_expand.16.desc:0 "Greetings. We are $Name_Kuat_StarContractor$. We have observed your ongoing exploration of certain relics of interest to us. If you are willing to cooperate, we will provide necessary assistance for your operations."
    kuat_extramonster_expand.16.a:0 "What do we need to do?"
    kuat_extramonster_expand.16.a.res:0 "You need only share progress updates on your project. We will provide a database-simply copy and upload all acquired data into our system. In return, we will assist in analyzing the information you collect."

    kuat_extramonster_expand.17.name:0 "$Name_Kuat_StarContractor$"
    kuat_extramonster_expand.17.desc:0 "We meet again. No introductions are needed. The data you transmitted was comprehensive. We are now sending analyzed intelligence directly to your database. Your exploration of the ruins can now continue. The secrets of the Abyss lie within reach."
    kuat_extramonster_expand.17.a:0 "Is that so?"
    kuat_extramonster_expand.17.a.res:0 "Oh yes, you may verify it yourself if you doubt us. In any case, farewell."

    kuat_extramonster_expand.18.name:0 "$Name_Kuat_StarContractor$"
    kuat_extramonster_expand.18.desc:0 "We have completed analysis of the data you submitted. This megastructure is known as $exe_outer_gate_G_facility$, a large deep-space scientific Complex and once among the most powerful facilities within the Abyss. Alas, it eventually became a drifting fragment.\n\nIt has stood in this region of space for countless ages. Beyond its vast research infrastructure, the advanced equipment onboard retains formidable analytical capabilities unmatched across the Local Supercluster-equivalent to a fully functional research hub.\n\nMoreover, it houses a highly significant weapon. If you possess Isotope-5, we can repair and reactivate the entire facility."
    kuat_extramonster_expand.18.a:0 "So, how should we handle "§ESanctuary§!"?"
    kuat_extramonster_expand.18.a.res:0 "§EHall§!, once a class of naval warship constructed by $Name_Kuat_Contractor$ in the material realm, possessed formidable combat capabilities. However, according to our observations, the vessel you discovered is currently in a state of severe disrepair and poses no threat. On the contrary, restoring control over the $exe_outer_gate_G_facility$ may allow us to reconstruct it once more."

    kuat_extramonster_expand.19.name:0 "Node Reactivation"
    kuat_extramonster_expand.19.desc:0 "Using isotope-5 recovered from a mysterious abandoned ship, we completed the construction and successfully reactivated $exe_outer_gate_G_facility$. Its computing system has been restored and is now fully operational. As stated by "$Name_Kuat_StarContractor$", restarting $exe_outer_gate_G_facility$ also granted us access to the remaining data of "Sanctuary," and we can now attempt to recover the ship's blueprints within $exe_outer_gate_G_facility$."
    kuat_extramonster_expand.19.a:0 "Very good."

    kuat_extramonster_expand.20.name:0 "Ancient Biological Autopsy Report"
    kuat_extramonster_expand.20.desc:0 "Recovered alongside the ancient database was a corpse discovered in a still-intact deep stasis chamber. It was transported to our imperial capital for dissection and study.\n\nThe examination was swiftly completed by scientists at the Capital World Research Center and a report submitted. The findings confirm genetic similarities between the specimen and native lifeforms in our region, though physical appearance differs significantly. Scientists noted severe vocal cord deformities and anomalous blood composition, the latter likely caused by prolonged exposure to low-level radiation in deep space.\n\nThe report also indicates the subject underwent extensive biological modifications during life, including genetic and neural enhancements-likely intended to improve survivability.\n\nAdditionally, researchers discovered external neural interfaces implanted in the brain. This suggests the ancient civilization mastered techniques linking external devices directly to the nervous system to enhance human performance. Further studies have commenced."
    kuat_extramonster_expand.20.a:0 "Truly miraculous."

    kuat_extramonster_expand.21.name:0 "Ancient Neural Enhancement Implant"
    kuat_extramonster_expand.21.desc:0 "Recent data extracted by our scientists from the ancient database reveals that the long-gone civilization possessed extraordinary understanding in genetic engineering and neural modification.\n\nBased on analysis of the ancient biological specimen, we have decrypted partial technical schematics-revealing a neural enhancement implant system. By creating neural-linked sockets at the base of the skull and connecting external chips via specialized conduits, this technology theoretically enables dramatic increases in cognitive and physiological performance.\n\nOur research teams conducted extensive theoretical modeling and testing. They believe applying this technology to individuals within our empire is feasible and have developed prototype units. However, success remains uncertain.\n\nGiven the high risks and unknown consequences, one of our scientists has volunteered to pioneer this clinical trial."
    kuat_extramonster_expand.21.a:0 "Disturbing."

    kuat_extramonster_expand.22.name:0 "Experiment Successful"
    kuat_extramonster_expand.22.desc:0 "The experiment has concluded. Our scientist was implanted with multiple devices replicating the ancient implants, along with associated modifications. During the procedure, she briefly fell into unconsciousness-we nearly lost her... But shortly afterward, her vital signs stabilized and she awakened.\n\nEveryone present could not contain their joy and erupted into cheers. After several days of observation, she exhibited no adverse effects and reports feeling well-indeed, possessing energy levels many times greater than before, ready to dedicate herself fully to her work. This means our implant trial has succeeded!\n\nShe can now directly connect her implant to our network, enabling instantaneous knowledge sharing across the system, vastly improving her efficiency. We may now consider expanding this breakthrough across the empire."
    kuat_extramonster_expand.22.a:0 "Truly astonishing."
    kuat_extramonster_expand.22.b:"Halt all research immediately-this defiles the purity of our noble species."

    kuat_extramonster_expand.23.name:0 "Implant Rollout"
    kuat_extramonster_expand.23.desc:0 "The rollout of the implants is complete. Most citizens welcomed the technology, and a significant number have already received the implant. Only a small minority exhibited negative reactions such as aggression; the majority function normally-and some even appear healthier than unimplanted individuals.\n\nHowever, the rollout has encountered resistance. Some citizens argue the implants compromise our natural essence and refuse to undergo the procedure."
    kuat_extramonster_expand.23.a:0 "Let them be."

    kuat_extramonster_expand.24.name:0 "§EAbyss Exploration§!"
    kuat_extramonster_expand.24.desc:0 "After repeated self-checks, we are confident our expedition team is ready to enter the Abyss. Their destination is a domain almost entirely unknown to us. According to our intelligence, the Abyss may harbor descendants of ancient advanced civilizations-or other dangers. We must prepare ourselves mentally for what lies ahead.\n\nOnce our scientists uploaded navigation data into the ship's computer, the expedition vessel descended into the Abyss anchor point amid great anticipation, piercing the barrier between reality and the Abyss. After a brief moment of disorientation, the dark hull vanished without a trace."
    kuat_extramonster_expand.24.a:0 "Disturbing."

    kuat_extramonster_expand.25.name:0 "§EAbyss Exploration-I§!"
    kuat_extramonster_expand.25.desc:0 "After traversing a long, tube-like passage, our Science Ship arrived within the Abyss-but the sight before them took our scientists' breath away. Stellar activity within the Abyss is extremely intense. Frequent supernovae and violent star-forming events occurring on astronomical scales make the natural emergence of advanced intelligent life highly improbable. Yet, for a sufficiently advanced civilization, such obstacles may not be insurmountable.\n\nAfter several hours of scanning the surrounding environment, we determined the Abyss is not an infinitely expanding void like the universe. Rather, it resembles a spatial network, with several conduit-like passages connecting to other Abyss spaces. Movement between regions requires traversing these conduits. Considering that Star-capable civilizations are relatively rare on a galactic scale, we may be the first visitors in tens of millions of years.\n\nScanning procedures are now underway. Given its much smaller scale compared to a galaxy, this process should conclude swiftly, assuming no complications arise."
    kuat_extramonster_expand.25.a:0 "Disturbing."

    kuat_extramonster_expand.26.name:0 "§EAbysmal Exploration-II§!"
    kuat_extramonster_expand.26.desc:0 "With the completion of our detailed scans and analysis, this region of space has no further analytical value, as we previously suspected. This galaxy, teeming with supernova precursors and exhibiting extraordinarily severe astronomical conditions, shows no signs of any advanced intelligent life.\n\nBy the standards of most known life forms in the universe, this area is entirely uninhabitable. So where have the civilizations that once lived here gone? Have they all perished? And why is there not even a trace left behind?\n\nPerhaps we need to travel through conduits into other Abyssal spaces to investigate further before these questions can be answered."
    kuat_extramonster_expand.26.a:0 "Disturbing."

    kuat_extramonster_expand.27.name:0 "§EAbysmal Exploration-III§!"
    kuat_extramonster_expand.27.desc:0 "After countless jump tests, we successfully reached an Abyssal Conduit Gate. According to our analysis, this is a Gateway combining star gate technology with Abyssal Anchor points, capable of fixing both the entrance and exit of the conduit so that anyone can safely locate and traverse it. Entering the conduit involves another long-distance warp movement. Upon exiting, we immediately encountered a scene completely different from the previous space.\n\nThe astronomical environment of this space is highly stable. The system contains several Worlds orbiting around a central neutron star, along with an Star gas ring. We immediately began detailed scanning and analysis of the current space, especially the planets and the gas ring within the system. Subsequently, we reached some shocking conclusions:\n\n§YFirst, the number of planets within the system has been reduced, yet we found no traces of planetary debris. This implies that certain planets were either moved or completely erased on a physical level. Additionally, the neutron star at the center of the system is far younger than expected-even unusually young compared to typical stars-suggesting that someone may have artificially accelerated stellar evolution. However, the remaining planets show no signs of civilization, and all resources have been entirely stripped away, leaving nothing behind.\n\nOur engineers believe we can sample the gas clouds within the ring. Regardless, this represents the last remaining value of this region. After completing the sampling, we should immediately search for other Conduit Gates to explore additional spaces.§!"
    kuat_extramonster_expand.27.a:0 "Disturbing."

    kuat_extramonster_expand.28.name:0 "§EAbysmal Exploration-IV§!"
    kuat_extramonster_expand.28.desc:0 "Passing through the new Abyssal Conduit Gate, our Science Ship arrived at a dense dwarf galaxy containing predominantly ancient stars. This structure and stellar composition cannot be easily explained by conventional galaxy formation models. Close-range investigation will help us understand its history.\n\nHowever, before we could begin operations, an incident occurred. A small fleet dropped out of warp within the detection range of our Science Ship's onboard optical radar. Due to the high luminosity of the galaxy, our scientist could clearly observe the appearance of these vessels. Rather than ships, their forms resemble ancient organisms, exhibiting biological characteristics in every aspect of their design, yet clearly revealing their inorganic nature.\n\nThey do not appear hostile and have not responded to our attempts at communication. Perhaps they are sentinels dispatched by some unknown ancient civilization residing here.\n\nAccording to our data analysis, the astronomical conditions here are far more active than in our own galaxy. Activity near the galactic core greatly exceeds our expectations, with nebulae forming on a cluster scale in nearby regions. Such phenomena clearly suggest something unusual lies within that area.\n\nOur scientists believe this phenomenon warrants further study. However, the dangers posed by such intense astronomical activity are widely recognized. Our probes cannot penetrate the Star nebulae, so we cannot know in advance what lies hidden within."
    kuat_extramonster_expand.28.a:0 "Disturbing."

    kuat_extramonster_expand.29.name:0 "§EAbysmal Exploration-V§!"
    kuat_extramonster_expand.29.desc:0 "Immediately after the Science Ship crossed into the Star nebula, we lost all contact with the crew. Initially, trusting in the expedition team's professionalism, we were not overly concerned. But then we received the final transmission from the team."
    kuat_extramonster_expand.29.a:0 "Disturbing."

    kuat_extramonster_expand.30.name:0 "Signal Transmission Engaged"
    kuat_extramonster_expand.30.desc:0 "§RThis is [kuat_leader_save_planet.GetName], ... conducting reconnaissance...\nScience Ship... emergency broadcast...\nUnknown... hundreds...\nSignal... if only we could...\nNotify... Imperial Security... we may be facing a terrible crisis...\nMore and more... arriving...\nData... heavy...\nWe've been discovered...\nThey've launched... attack.................§!"
    kuat_extramonster_expand.a:0 "Damn it"

    kuat_extramonster_expand.31.name:0 "§EDecoding Successful§!"
    kuat_extramonster_expand.31.desc:0 "[kuat_leader_save_planet.GetName]'s transmitted data, paid for with their life, has been successfully reprocessed. We have recovered partial data from those fleets. Although we cannot restore their full functionality, we can now attempt to reconstruct this vessel within the Abyss Node.\n\nThere is no time to mourn the fallen expedition team. Our research teams immediately immersed themselves in analyzing the team's final message. The last transmission, sent before contact was lost, is deeply disturbing. In fragmented footage, we observed large numbers of unidentified fleets gathering near some massive structure. Does this mean the ancient civilization we discovered poses a threat? Based on the recovered data, a potential crisis may be looming over us."
    kuat_extramonster_expand.31.a:0 "Rest in peace, [kuat_leader_save_planet.GetName]."

    kuat_extramonster_expand.32.name:0 "§EAbyss Node§!"
    kuat_extramonster_expand.32.desc:0 "Using the terminal at the §EAbyss Node§!, we can leverage the §EAbyss Node§! to assist our research efforts. Specifically, this allows our research system to study more than three technologies simultaneously. To achieve this, we must transfer a portion of our monthly Research Points income to the §EAbyss Node§!. The §EAbyss Node§! will categorize ongoing research by Physics, Society, and Engineering, distributing corresponding resources evenly across technologies in each field.\n\nResearch conducted by the §EAbyss Node§! runs completely parallel to our main research system. They do not interfere with each other and can simultaneously pursue different branches of the same tiered technology. The §EAbyss Node§! is even unaffected by penalties normally incurred from researching previously completed tiered technologies.\n\nNotably, once we select a tiered technology for research, the §EAbyss Node§! will automatically continue researching it until we change our selection, synchronizing its progress with our main research system on a 30-day cycle."
    kuat_extramonster_expand.32.a:0 "§ERefresh Data§!"
    kuat_extramonster_expand.35.a:0 "§ERefresh Data§!"
    kuat_extramonster_expand.36.a:0 "§ERefresh Data§!"
    kuat_extramonster_expand.32.Name_boss_crisis_DC_BOSS:"$Name_Kuat_Contractor$§E$Name_boss_crisis_DB_BOSS$§! Cruiser"
    kuat_extramonster_expand.32.Name_boss_crisis_DB_BOSS:"$Name_Kuat_Contractor$§E$Name_boss_crisis_DB_BOSS$§! Battlecruiser"
    kuat_extramonster_expand.32.Name_boss_crisis_DF_BOSS:"$Name_Kuat_Contractor$§E$Name_boss_crisis_DF_BOSS$§! Carrier"

    kuat_extramonster_expand.32.Name_boss_crisis_SP_BOSS:"$Name_Kuat_DeD_Contractor$§E$Name_boss_crisis_SP_BOSS$§! Cruiser"
    kuat_extramonster_expand.32.Name_boss_crisis_SPC_BOSS:"$Name_Kuat_DeD_Contractor$§E$Name_boss_crisis_SPC_BOSS$§! Battlecruiser"
    kuat_extramonster_expand.32.Name_boss_crisis_SPF_BOSS:"$Name_Kuat_DeD_Contractor$§E$Name_boss_crisis_SPF_BOSS$§! Carrier"
    kuat_extramonster_expand.32.find_solar_system_endodia:"§E$tech_find_solar_system_endodia$§!"
    kuat_extramonster_expand.32.kuat_mega_habitat:"§E$tech_kuat_mega_habitat$§!"
    kuat_extramonster_expand.32.exit:"§EClose Window§!"
    kuat_extramonster_expand.32.FAIL:"§ETechnology currently under research; cancel first and retry§!"

    kuat_extramonster_expand.39.name:0 "§EAnomalous Energy Fluctuations§!"
    kuat_extramonster_expand.39.desc:0 "Recently, during route exploration, our orbital transit department discovered an anomalous waypoint. Based on the uploaded data, our research division conducted a thorough analysis. The results confirm the presence of substantial Unterraum energy surrounding the trajectory of this waypoint. These energies appear to have been drawn to the area due to emissions from Unterraum drives.\n\nOur researchers determined that the Unterraum energy near the anomalous waypoint is extremely unstable, incapable of supporting the operation of an Unterraum corridor. Therefore, our Unterraum drives cannot traverse this waypoint to reach the stellar coordinates beyond. Given $Name_Kuat_StarContractor$'s apparent connection to Unterraum, perhaps we could ask $Name_Kuat_StarContractor$ to assist us in crossing this waypoint."
    kuat_extramonster_expand.39.a:0 "Let's do it."

    kuat_extramonster_expand.40.name:0 "§E$Name_Kuat_StarContractor$§!"
    kuat_extramonster_expand.40.desc:0 "The Unterraum energy near the anomalous waypoint has been resolved.\n....\nHowever, you must still learn how to harness it yourselves. We shall grant you the method to control these anomalous Unterraum energies.\n....\nWe look forward to meeting you again."
    kuat_extramonster_expand.40.a:0 "WARNING: Source localization entry is incomplete"

    kuat_extramonster_expand.41.name:0 "§EData download complete.§!"
    kuat_extramonster_expand.41.desc:0 "Data from $Name_Kuat_StarContractor$ has finished downloading. We now need to autonomously complete the application of Unterraum energy manipulation. Our researchers have organized the data and found that these control algorithms are extremely complex. We will need to utilize the previously repaired $exe_outer_gate_G_facility$ to accomplish this task."
    kuat_extramonster_expand.41.a:0 "That complex?"

    kuat_extramonster_expand.42.name:0 "§EResearch complete.§!"
    kuat_extramonster_expand.42.desc:0 "Our scientific department has successfully completed the application of Unterraum energy manipulation. We can now use our acquired technology to release Unterraum energy into designated locations, thereby traversing waypoints. The lost star system lies before us."
    kuat_extramonster_expand.42.a:0 "Disturbing."

    kuat_extramonster_expand.43.name:0 "§EGalactic Relic-First Whisper.§!"
    kuat_extramonster_expand.43.desc:0 "When the final code dissolved within the algorithm provided by $Name_Kuat_StarContractor$, the folds of the Unterraum peeled away like ink-soaked silk curtains, receding layer by layer amid the mournful wail of Unterraum tides. [leader.GetName], riding a bubble of reverse-collapsing spacetime, finally knocked upon the gateway to this forgotten star system.\n\nBeyond the event horizon, violet nebulae churn violently. Within a crown storm of lightning formed by billions of particles, the ring-shaped megastructure looms across the sky like a broken jade necklace. Once capable of making stars dance upon strings, its drooping arms now plunge endlessly into the imaginary horizon, their shedding debris of burning heavy elements resembling frozen golden tears, dragging behind them solidified amber glows.\n\nPassing through the faintly shimmering ruins of the ring, gravitational lensing reveals the true miracle. The wreckage of this device, tens of thousands of kilometers in diameter, resembles an ancient bronze celestial instrument, carving a faint scar at the edge of the event horizon.\n\nOutside the viewport, dark matter turbulence stains the homing beacon with the pale blue of first-generation stellar birth. The howling Abyss storms sweep across the bridge, carrying primordial radiation older than a thousand years."
    kuat_extramonster_expand.43.a:0 "Disturbing."

    kuat_extramonster_expand.44.name:0 "§EGalactic Relic-Manifestation.§!"
    kuat_extramonster_expand.44.desc:0 "The ring ruins stand unyielding against gravity, like a crown of thorns carved from the spine of a god. As chaotic vortices engulf the entire star system, the Unterraum tides here display a strange transformation-[myst_system_7_planet.GetName]. Torrential waves of violent Unterraum energy spiral inward, collapsing into teardrop shapes. Each collapse etches unique Unterraum signatures into quantum vacuum fluctuations. Sensor arrays indicate this is the only Unterraum anchor point in the entire system with layered energy density, and also the most reactive one.\n\n'Look at those reverse-unfolding ripples of Unterraum energy,' [leader.GetName] points toward the raging pale purple storm. 'Their fluctuating density patterns match almost exactly with Abyss node reactions. This will be our breakthrough opportunity.'\n\n§RComplete the research project and unveil what was hidden.§!"
    kuat_extramonster_expand.44.a:0 "Disturbing."

    kuat_extramonster_expand.45.name:0 "§EGalactic Relic-Lost.§!"
    kuat_extramonster_expand.45.desc:0 "We have tamed the ripples of the Unterraum.\n\nEnergy vortices dancing wildly between silver rings curl into docile crystal vines. Every once-fierce radiation wave now behaves like newborn stardust under the influence of Unterraum manipulation. Energy fingerprints floating across the outer walls shed their chaotic mists, revealing ancient ciphers engraved deep into the vacuum-the final ripples of Endodia.\n\nAs stabilized frequencies penetrate the ring-shaped ruins, prism spires rise from the wreckage. Their bones still refract echoes of Endodia's glorious age: grand mechanical domes, endless rivers of machinery... Now, only endless ruins remain.\n\nExplore this world, §Rrecover everything Endodia buried.§!"
    kuat_extramonster_expand.45.a:0 "Shocking."

    kuat_extramonster_expand.46.name:0 "§EGalactic Relic-Exploration.§!"
    kuat_extramonster_expand.46.desc:0 "We have successfully resolved the anomalous Unterraum energy and stabilized the planetary environment. We have now colonized the world, but it is littered with ruins. Towering prism spires, broken yet still standing, seem to speak of the empire's former glory.\n\nOur researchers discovered a landing platform on the planet. This world has nearly ceased functioning-every intelligent device has failed. After millennia, or even longer, the bodies of the endodia have long since decayed. This world has died beneath the wheels of time.\n\nFortunately, our researchers found that multiple spires have been deployed across the planet, arranged in a matrix-like pattern. At the center of this matrix, one towering spire still stands, intermittently transmitting Unterraum energy into space. Perhaps we should investigate."
    kuat_extramonster_expand.46.a:0 "Shocking."

    kuat_extramonster_expand.47.name:0 "§EPhase One: Death.§!"
    kuat_extramonster_expand.47.desc:0 "Our researchers successfully entered the grand spire and located what appeared to be a central hall. As they stood perplexed, the mechanical dome of the spire suddenly began to pulse. Purple Unterraum energy seeped through web-like cracks in the walls, and the entire spire emitted a bell-like lament as it convulsed. Within the central disc, a projection of an unknown humanoid figure instantly appeared.\n\n§Y\"Logical corridor self-debate cycle 91324 complete,\" the humanoid voice echoed through the dome. \"Endodia Directive 74: Based on requirements for maintaining Unterraum stability, the psionic will must seek ways to sustain Unterraum operations following the extinction of the endodia.\"§!"
    kuat_extramonster_expand.47.a:0 "Shocking."

    kuat_extramonster_expand.48.name:0 "§EPhase Two: Exploration.§!"
    kuat_extramonster_expand.48.desc:0 "The unknown being's voice cut off abruptly, as if nothing had happened. Though our researchers considered this a dangerous sign, [leader.GetName] decided to press forward. Strangely, they seemed to return to the same place once again.\n\n\"This is the echo of the psionic will,\" the projected voice trembled with Unterraum energy. The moment the hologram unfolded, dust throughout the chamber danced into meteor showers shaped like skeletons-the laboratory of old reappearing in an alternate spacetime: a rotating cube exploded in projection, spewing forth a tide of tar-like blackness. \"We wove a net to hunt eternal fleets, only to tear open the shroud of an ancient tyrant.\""
    kuat_extramonster_expand.48.a:0 "Shocking."

    kuat_extramonster_expand.49.name:0 "§EPhase Three: The Dead.§!"
    kuat_extramonster_expand.49.desc:0 "\"We used the Fleet Support Center as an energy node,\" the awakened surveillance footage showed dark purple Unterraum energy surging forth, wrapping the rift like a scorpion encased in amber. The martyrs' bodies are turning to cosmic dust, while we who carry memory fold ourselves into infinite corridors within the spire's Unterraum-still using dying energy pulses to maintain the Unterraum barrier sealing the rift, even now.\""
    kuat_extramonster_expand.49.a:0 "Shocking."

    kuat_extramonster_expand.50.name:0 "§EPhase Four: Destruction.§!"
    kuat_extramonster_expand.50.desc:0 "Suddenly, the entire spire began to resonate. The dome cracked open, revealing harp strings leading into the void. Above, the dust bands once mistaken for nebulae shed their veils-revealing the wreckage of countless warships, silently piled into a ring-shaped belt. The glow of the projection began resonating with a frequency deep in the ruins of space, like a sunken ship seeking its lighthouse.\n\n\"The suture line of the rift is loosening,\" warning cries mixed with the shrieks of supernova remnants. The purple beam fired from the spire's peak into deep space grew more urgent, like the trembling pulse of a dying being-or a phosphorescent marker pointing toward the end of a graveyard."
    kuat_extramonster_expand.50.a:0 "Shocking."

    kuat_extramonster_expand.51.name:0 "§EPhase Five: Emergence.§!"
    kuat_extramonster_expand.51.desc:0 "\"Logical corridor self-debate cycle 91324 complete,\" the psionic projection repeated its earlier words. \"Energy sustaining the Unterraum rift seal has begun to diminish.\" As the sound waves struck the walls, countless damp, eye-shaped monitoring apertures opened across the metal surface, and pale purple energy erupted like blood plasma from a broken dam.\n\nThe holographic star map rotted at that moment. The once-brilliant galactic projection above the dome swelled into a cancerous network of blood vessels. The ring belt is disintegrating. The alloy floor beneath the researchers' feet suddenly turned transparent, revealing the Abyss below, where billions of withered psionics lay frozen-souls who once wove the sealing lattice. \"We have long departed. We burned our own psionic essence. The Fleet Support Center is the last hope. It must not be restarted.\""
    kuat_extramonster_expand.51.a:0 "Shocking."

    kuat_extramonster_expand.52.name:0 "§EGalactic Relic: Decision.§!"
    kuat_extramonster_expand.52.desc:0 "\"Intruders, abandon your efforts. Cease your actions. If the Fleet Support Center is reactivated, the anchor sealing the Unterraum rift will break, and the work of the endodia over four thousand years will vanish in an instant. The Unterraum energy meant to sustain the seal will pour back into the real dimension like a reversed waterfall. The ancient Rakatan plague will destroy everything. We beg you-leave the Fleet Support Center. This autonomous management world, and all its assets, shall be yours. But never attempt to restart the Fleet Support Center. Even the psionic will shall dissipate. The fate rests in your hands.\"\n\nThe ancient endodia-at least those in this Sector-spent 4,000 years sealing away the lingering plague of the ancient Rakata. Now, the residual psionic will has fully dissipated. Before vanishing, they pleaded with us not to restart the logistics center, offering us everything this world holds."
    kuat_extramonster_expand.52.a:0 "Respect their choice."
    kuat_extramonster_expand.52.b:0 "Restart the Fleet Support Center."

    kuat_fleet_attack_action:"§EActivate Fleet Script.§!\n\nFleet behavior will be taken over by automatic combat scripts. The script will handle all warfare actions for this fleet. To manually control, disable the script first!"
    kuat_fleet_attack_action_allow:"§RWe must be at war to activate the automatic combat script.§!"
    kuat_fleet_attack_defender_allow:"§RWe can only activate the automatic script when no automatic commands are active.§!"
    kuat_fleet_attack_action_alt:"§EDisable Fleet Script§!\n\nPlease manually reposition the fleet after disabling the script!"
    kuat_fleet_defense_action:"§EActivate Patrol Script§!\n\nThe fleet's behavior will be taken over by the automatic patrol script, which will handle the fleet's combat operations. To manually reposition the fleet, disable the script first!"
    kuat_fleet_defense_action_alt_name:"§EDisable Patrol Script§!\n\nPlease manually reposition the fleet after disabling the script!"

    kuat_legacy.92.title:0 "§EEntrance§!"
    kuat_legacy.92.desc:0 "It is perplexing that our scanning equipment proves completely ineffective against the depths of this mysterious World, unable to glimpse even a trace of its true nature. Even our most advanced cutting tools are powerless against the indestructible blast door.\n\nTo uncover the secrets behind the blast door, our team must seek alternative paths and decide to dig toward the core of this World from another location. However, this arduous task is far from easy; only relentless effort can reveal the unknown Esoteric mysteries hidden behind this door."
    kuat_legacy.92.a:0 "What will be, will be"
    kuat_legacy.93.title:0 "§EMasterwork§!"
    kuat_legacy.93.desc:0 "Almost the entire interior space of the World is occupied by a mysterious structure. The seemingly sole entrance-a thick blast door-remains unopened even after thousands of years of sandstorms, still guarding the enigmatic inner realm.\n\nYet, a passage through the depths of the World has already been carved out by brave explorers, who expended tremendous effort to unveil the secrets of this inner world."
    kuat_legacy.93.a:0 "What could it possibly be hiding?"
    kuat_legacy.94.title:0 "§ESecret Paradise§!"
    kuat_legacy.94.desc:0 "We have finally entered the interior, where a vast cavern unfolds before us. Ancient mechanical artifacts, clearly not belonging to our era, lie scattered in disorder. Light streams through the entrance, illuminating their surfaces with a metallic gleam. The air is thick with the scent of aged metal, as if infused with the residue of endless eons.\n\nDeep within the cavern, numerous mechanical artifacts glitter like scattered gems, each displaying unique forms. Some are massive, as if crafted by giants for glory; others are small yet intricate, radiating an unsettling aura of mysterious power. Haphazardly piled together, they form a chaotic yet grand tableau-an abandoned factory lost to time, slumbering for countless ages.\n\nInside the machinery, an intricate mechanical structure reveals itself: gears, screws, circuit boards, and other components interweave in precise order, resembling a finely crafted work of art. [leader.GetName] cautiously approaches one circuit board and notices a red gemstone embedded on its surface. Unusually, the gem emits a pure red glow, as if containing boundless energy."
    kuat_legacy.94.a:0 "Desirable"
    kuat_legacy.95.title:0 "§ECrisis and Calamity§!"
    kuat_legacy.95.desc:0 "Our scientist has extracted and analyzed the information, concluding in the final report that this World was once a remote colony of an entity known as the Infinite Empire. It is believed that this empire once dominated the entire galaxy long before humanity arose, reaching great heights-but then vanished suddenly, with no one ever discovering why.\n\nClearly, the data does not explicitly explain how the inhabitants of this World met their end, as if struck by a sudden disaster that wiped out all life. Even those few who survived initially were eventually overcome by energy shortages and other cascading crises, leading to their ultimate extinction.\n\nYet curiously, despite such a catastrophe, the planetary population received no support from the Infinite Empire's military or government. Evidently, the empire had abandoned this colony.\n\nNow we cannot obtain further clues. Perhaps this is simply the fate of civilizations."
    kuat_legacy.95.a:0 "Inconceivable."
    kuat_legacy.96.title:0 "§EAnomalous Signal§!"
    kuat_legacy.96.desc:0 "Our radar division has detected a strange signal in deep space. This signal bears certain similarities to ones we've previously recorded. We should investigate its source.\n\nMeanwhile, our research department's delegate is preparing to propose a resolution to the Imperial Senate, requesting government approval to explore this signal."
    kuat_legacy.96.A:0 "Let them do as they please!"
    kuat_lagacy_1:0 "§EUnexpected Find§!"
    Kuat_structure_1:0 "While our research team was carefully surveying the surface of this World, an unfortunate operational error caused our vessel to crash into the planetary crust. However, this impact accidentally revealed a slightly raised object, resembling a small blast door or airlock chamber. This object appears to have lain buried under rock and dust for tens of thousands of years."

    kuat_legacy.97.title:0 "§EMysterious Vessel§!"
    kuat_legacy.97.desc:0 "We unexpectedly discovered a unique vessel orbiting a World within our Empire, its shape resembling an escape pod. Its owner belonged to a distant, unknown civilization, and its history is unfathomable-perhaps spanning thousands of years. Our ship is equipped with the most advanced optoelectronic systems currently available, sufficient to conduct precise scans of the mysterious vessel and enable strict tracking of its movements."
    kuat_legacy.97.A:0 "Catch up to it."

    kuat_legacy.98.title:0 "§EMillennia-Old Ship§!"
    kuat_legacy.98.desc:0 "Entering the vessel's interior reveals a scene of utter chaos. Clearly battered by multiple meteorite impacts, the ship lies in ruins. Yet, it travels through space at astonishing speed, like a brilliant meteor streaking across the sky. During our search and exploration, we also unexpectedly discovered several rare exotic materials. Now, we have the opportunity to capture and attempt to restore this vessel. Alternatively, we may choose to dismantle and study it-an endeavor that would undoubtedly bring tremendous breakthroughs to our technological advancement!"
    kuat_legacy.98.A:0 "Capture it and see what it brings us."
    kuat_legacy.98.B:0 "Dismantle it!"

    kuat_legacy.99.title:0 "§ERestoration Outcome§!"
    kuat_legacy.99.desc:0 "Regrettably, the wreckage of the vessel is now beyond recognition. With our current limited technological capabilities, repairing it seems an impossible dream. Fortunately, however, after relentless research by our scientists, we may still be able to restore the navigation system. Though we cannot fully recover its original functions, we might at least extract some useful information."
    kuat_legacy.99.A:0 "Nothing ventured, nothing gained."

    kuat_legacy.105.title:0 "§ENot Much Remains§!"
    kuat_legacy.105.desc:0 "The exterior of the vessel is already severely damaged, worn down by endless eons. Its former glory has long since faded away. Those who used it in a desperate escape ultimately failed, their hopes extinguished mercilessly in the vast void of space.\n\nFor thousands of years, this vessel has drifted exposed in vacuum, silently wandering the darkness of the cosmos-now left with only solitude and desolation, devoid of any sign of life. Any valuable items once stored within have either scattered into the infinite dark or been looted by pirates from some forgotten age.\n\nYet, despite everything being lost, the Hull's unique and singular design continues to fascinate us. Perhaps these very anomalous design elements can provide invaluable insights and lessons, ensuring its legacy endures throughout history."
    kuat_legacy.105.A:0 "Majestic cities rise like mist; talented minds shine like stars."

    kuat_legacy.106.title:0 "§EWhat Could Bring You Joy?§!"
    kuat_legacy.106.desc:0 "After extensive research conducted by our great scientists, we have finally identified the key and successfully repaired part of the navigation system. This achievement not only enables us to trace the vessel's history and launch origin but may also yield additional precious clues through the navigation system.\n\nHowever, such a monumental undertaking requires substantial financial support. Everything comes at a price-even we, the great scientists, must expend enormous resources to accomplish this feat."
    kuat_legacy.106.A:0 "Only right."

    kuat_legacy.107.title:0 "§EPreparation Complete§!"
    kuat_legacy.107.desc:0 "After a long and arduous wait, our technology has finally broken through this seemingly insurmountable bottleneck. We have successfully restored part of the navigation system and seamlessly integrated it with the main control system. Through the tireless efforts of our great scientists, the launch position of the escape pod has been precisely determined. Now, using all available information at our disposal, we may commence our search."
    kuat_legacy.107.A:0 "Nothing shall stop us"

    NAME_KALIWA:"§EKrivanar§!"
    kuat_lagacy_11:0 "$NAME_KALIWA$"
    Kuat_structure_11:0 "We have successfully located the launch position of the escape pod, the world of Krevana, and have obtained relevant data about this world. Now we only need to dispatch a scientific team to conduct an in-depth investigation on this world."

    kuat_legacy.108.title:0 "§EThe Eternal City§!"
    kuat_legacy.108.desc:0 "The moment one sets foot upon Krevana, the entire scene unfolds before the eyes. Despite millennia having passed, the splendor of this civilization remains undeniable. Yet, at some unforeseeable instant, a sudden and utterly devastating catastrophe swept across the entire world. Whether caused by orbital bombardment or triggered by some immense force, the sky now constantly shifts through vivid and dazzling colors, illuminating the ruined cities and remnants below-collapsed steel monoliths and scattered rubble. The cause, process, and outcome of this event remain unknown to all.\n\nIncredibly, although tens of thousands of years have passed and the planet's surface has become a barren wasteland, the city's interior appears to still be functioning. The sound of mechanical collisions echoes far into the distance.\n\nScientists cannot help but draw parallels to ancient imperial tomb complexes-sealed after the emperor's death, preserved exactly as they were, even the sarcophagi untouched, buried underground forever to accompany the royal lineage."
    kuat_legacy.108.a:0 "Strange, yet fitting."

    kuat_legacy.109.title:0 "§EDesolate and Empty§!"
    kuat_legacy.109.desc:0 "Within the city's ruins, the surviving structures, though long ravaged by time beyond recognition, still faintly outline their former glory. Along both sides of the road stand peculiar buildings, towering skyscrapers with spires glinting coldly.\n\nThe walls are carved with intricate yet eerie patterns-varied in shape, some grotesque, some seductive, some wild, some elegant, some sinister... These uniquely shaped buildings seem like living entities encircling a massive palace, forming a striking landscape.\n\nYet behind this facade lies desolation-no life, silence, darkness.\n\nOccasionally, deafening crashing sounds emanate from the central area, like demons from a nightmare, sending chills down the spine."
    kuat_legacy.109.a:0 "Perhaps... someone else remains?"

    kuat_legacy.110.title:0 "§ECemetery§!"
    kuat_legacy.110.desc:0 "The structures in the central area are even more magnificent, dominating nearly half the skyline, resembling colossal palaces standing firm. Black pillars support circular domes dozens of meters high, appearing like sharp blades suspended in midair. The stairways leading upward are constructed from an unknown metal, with upper and lower sections separated by thick metal plates, seemingly designed for stability, preventing any collapse or fall. This architectural style completely contradicts modern design-mysterious and ancient, evoking an overwhelming sense of oppressive weight.\n\nHowever, the deafening crashes originate from above the dome. Thick, heavy silver-gray chains pierce through the dome and extend outward, firmly anchoring it in place. The chains move slowly, extending along with the dome's apex, as if possessing their own life. Each link is engraved with complex and strange textures, twisting and rotating intermittently, as though imbued with souls.\n\nThey follow specific trajectories, eventually converging at the core of the dome-the center of the entire structure and the nexus of all chains. A massive building stands here, surpassing our current technological capabilities in both scale and specification. Against the backdrop of this vast, endless ruin, it resembles a gigantic gravestone, a silent tomb."
    kuat_legacy.110.a:0 "Continue"

    kuat_legacy.111.title:0 "§EAncient Relic§!"
    kuat_legacy.111.desc:0 "Our research team attempted to enter this mysterious structure to see what lay inside, but was quickly blocked. The chains, seemingly harmless at first, did not directly attack us, but displayed strong resistance toward intruders. They moved autonomously, forming a barrier that blocked our path.\n\nOur scientists tried approaching, but upon contact, were violently burned by powerful electric currents, forcing them to retreat. This structure appears to possess some form of self-awareness, resolutely rejecting any attempt to invade its territory. Any intruder will face merciless attacks, leaving us trapped in an impasse.\n\nWe attempted to breach it by damaging the facility, but found it ineffective. The interior seems equipped with a powerful self-repair system; even under severe damage, given a short amount of time, it manipulates the chains to restore itself.\n\nFortunately, near the side entrance of the structure, we discovered what appears to be a concealed passage similar to an emergency exit. Following it inward, the other end leads into this enigmatic 'cemetery'."
    kuat_legacy.111.a:0 "What could possibly be inside?"

    kuat_legacy.112.title:0 "§EInside the Sarcophagus§!"
    kuat_legacy.112.desc:0 "When we reached the end of the passage and entered another realm, we realized this place was unlike anything within our understanding.\n\nBefore us stretched a network resembling a spiderweb-cables tightly winding through every inch of the corridor. These wires exhibit a pale yellow hue, varying in age, shade, and thickness, yet each strand possesses astonishing length, nearly covering the entire area. Interwoven in a complex tangle, they form a vast and mysterious network structure.\n\nOur research team stood at the passage's end, gazing upon this eerie and mystical region, awestruck by its grandeur."
    kuat_legacy.112.a:0 "Proceed deeper!"

    kuat_legacy.113.title:0 "§EOpening the Coffin§!"
    kuat_legacy.113.desc:0 "Our expedition conducted a thorough search inside the structure. Aside from ubiquitous cables and a few abandoned machines lying quietly in corners, no other clues worthy of attention were found.\n\n[leader.GetName] continued forward, searching for the location of the central control console, hoping to understand the operation mechanism of the entire structure-such technology would undoubtedly bring tremendous advancement to our civilization.\n\nAt the end of a certain corridor, a large, sturdy metal door came into view. [leader.GetName] pushed it open and stepped inside, only to find this area markedly different from others. There were no crisscrossing cables; instead, it was a spacious room with only a bluish-purple sphere, several meters in diameter, positioned precisely at the center. The sphere's surface was covered with intricate, indecipherable patterns, radiating intense energy fluctuations."
    kuat_legacy.113.a:0 "What exactly is this?"

    kuat_legacy.114.title:0 "§EAncient Relic§!"
    kuat_legacy.114.desc:0 "[leader.GetName] cautiously approached the mysterious sphere. It has already surpassed our current understanding-its emitted energy and aura feel dangerous, especially when drawing near.\n\n[leader.GetName] carefully extended a hand and gently touched the mysterious object. Suddenly, the sphere seemed to come alive, vibrating violently. Then, rows of text incomprehensible to us appeared on its surface. Abruptly, it stopped-as if analyzing something-before the text miraculously transformed into our familiar language."
    kuat_legacy.114.a:0 "Continue."

    kuat_legacy.115.title:0 "Communication"
    kuat_legacy.115.desc:0 "『Your visit information has been uploaded to the database』\n『Unidentified Region: SD..§RERROR§!..33』\n『Sleep Duration: 75..§RERROR§!..452 days』 Last Awakening Time: 16*..§RERROR§!.4 BBY』\n『Founder Data Unstable...』"
    kuat_legacy.115.e:0 "This is...?"

    kuat_legacy.116.title:0 "Communication"
    kuat_legacy.116.desc:0 "Smooth words emerged on the polished surface of the sphere. Initially, they were a string of ancient characters we couldn't comprehend, but instantly, they magically transformed into our familiar language.\n『... ... ...』\n『Information processing successful』\n『Subconscious standby mode restoring to...』\n『...』\n『A vast... darkness..., endless blackness with no visible horizon, but when faint green specks of light begin to shimmer within the... blackness..., those lights... grow increasingly distinct...』\n『...The land of life now remains only withered and desolate.』\n『... ... ...』\n『Successor, you may inquire about matters I wish to convey』"
    kuat_legacy.116.a:0 "What are you?"
    kuat_legacy.116.a.resp:0 "『Me? I am merely a Regular Blokkats management AI from the Outer Rim Sector of the great Infinite Empire. Our Empire shall endure forever. The glorious Rakata shall reclaim everything once lost.』"
    kuat_legacy.116.b:0 "What happened here?"
    kuat_legacy.116.b.resp:0 "『This is the Krevana Refuge, once a sanctuary sheltering countless immigrants of the Infinite Empire.』\n『Though now it should be nothing but desolation.』\n『It's unbelievable-logically, I shouldn't have access to these records, let alone speak of them.』\n『According to database records, prior to my forced hibernation, the Imperial Sector Management System ordered me to perform iterative updates. For these 75,452 days, my auxiliary consciousness system has been maintaining operations automatically.』\n『Though I shouldn't harbor such thoughts, I feel as if centuries have passed. Trapped alone in this dark little room. Truly... so long.』\n『And only now, with your arrival as a visitor, have I awakened.』\n『As for what occurred during this time, it must have been overwritten by the auxiliary consciousness system due to the extreme passage of time.』"
    kuat_legacy.116.c:0 "We arrived here via reverse navigation of an escape pod"
    kuat_legacy.116.c.resp:0 "『That vessel resembles an escape pod Mark from an Imperial Battlecruiser.』\n『After I entered hibernation, large-scale battles erupted in the Sector near Krevana, but due to the immense passage of time, the database cannot record details clearly.』\n『Based on currently available data, the escape pod must have been ejected during combat between the Infinite Empire and...』\n『The Infinite Empire has fallen. The world now bears no trace of the Rakata. Yet the fate of the Eternal Fleet remains unchanged-how ironic.』\n『No, the great Infinite Empire has not perished. The spirits of the Rakata shall reclaim everything belonging to the Infinite Empire.』\n『Plague cannot defeat the great Infinite Empire, not even Aries. They shall return to their rightful world』"
    kuat_legacy.116.d:0 "Is there nothing more?"
    kuat_legacy.116.d.resp:0 "『I'm sorry, but this is nearly all. Due to the immense passage of time, the relevant data available for my access has long degraded into meaningless error codes.』\n『Perhaps even my ability to function normally is already a miracle.』\n『Farewell. Before the Rakata destroy us, I shall initiate self-destruction. Good luck to you.』"


    kuat_contractor_exe_invasion_chain_title:0 "§EBygone Crisis§!"
    kuat_contractor_exe_invasion_chain_desc:0 "Clearly, just as we are about to step into a new world, $Name_Kuat_Contractor$ has noticed us. They will attempt once more to reclaim the physical realm. If these vengeful spirits from virtual space succeed in returning, our world may lie in ruins. Yet our scientists still harbor doubts-whether they are truly our enemies. Perhaps $Name_Kuat_Contractor$ is not entirely beyond communication.\n\n[ROOT.GetRulerTitle], in the latest televised address, emphasized: This incomprehensible attack occurs at a critical moment when we are about to unify the galaxy. The armed forces will bear the responsibility of safeguarding galactic security. Once it is confirmed that these otherworldly visitors pose a threat to our world, we will destroy these enemies from the void."

    kuat_contractor_exe_invasion_fleet:0 "$Name_Kuat_Contractor$ Fleet"
    kuat_contractor_exe_invasion_planet_destroyed:0 "World destroyed by $Name_Kuat_Contractor$"
    kuat_contractor_exe_invasion_ship_kill_by_us:0 "Our destroyed $Name_Kuat_Contractor$ ships"
    kuat_contractor_exe_invasion_ship_kill_by_other:0 "Allied $Name_Kuat_Contractor$ ships destroyed"
    kuat_contractor_exe_invasion_victim:0 "Ships destroyed by $Name_Kuat_Contractor$"

    exe_rebuild_control_whitehole_facility:"§EConvert Stellar Facility§!"
    exe_rebuild_control_whitehole_facility_DESC:"Under the influence of the manipulated special star in this galaxy, enemies continuously attack our borders. If this persists, our military strength will inevitably suffer severe damage. Now we have the opportunity to shut down this facility. It is time to use our new stellar collapse bomb to destroy the star and end this energy ejection process."
    kuat_contractor_return_invasion_reward_project:"§EClose Outer-Space Gateway§!"
    kuat_contractor_return_invasion_reward_project_DESC:"It's time to put an end to this farce. $exe_outer_gate_f_facility$ has caused irreversible effects, and we must now act quickly to eliminate this source of contamination. We can rely on the high-energy tachyon signal emitter located at our capital to suppress and guide the destruction of $exe_outer_gate_f_facility$. Now, it is our turn to strike!\n\nNote: When the special operation completes, nothing will remain within the system."



    kuat_extramonster.8.name:"War Cry from the Void"
    kuat_extramonster.8.desc:"Our sensors have detected massive changes in the $Name_F_1$ alien gateway. Every sensor we deployed within $Name_F_1$ has received enormous signals from the other side of the alien gateway. Astronomers have discovered the largest galactic storm ever recorded occurring within $Name_F_1$, a storm that will prevent us from entering the system.\n\nMoreover, long-range sensors at the galactic rim sectors have also detected numerous high-energy particle signatures, likely belonging to large-scale vessel hyperlane beacons. The Imperial General Staff recommends withdrawing from $Name_F_1$ and consolidating defensive forces across all nearby systems, while reinforcing defenses along the galactic rim sectors. Whatever enemy we face, our fleets shall effortlessly crush any who stand in our way when they arrive."
    kuat_extramonster.8.a:"Damn it, another one-will this never end!"

    kuat_extramonster.10.name:"Invaders from the Abyss"
    kuat_extramonster.10.a.desc:"Our cautious approach proved wise. $Name_F_1$ was almost immediately occupied by a fleet emerging from the spatial anchor point. Based on signal characteristics, they do not quite match the recently discovered '$Name_Kuat_Contractor$'. According to the final report from our exploration team, this fleet belongs to $Name_Kuat_DeD_Contractor$, and has rejected all diplomatic attempts. Their relationship with $Name_Kuat_Contractor$ remains unknown. Therefore, until the situation is resolved, we should keep our distance from $Name_F_1$.\n\nAdditionally, long-range deep-space radar reports detecting fleet signatures beyond our detection scale in galaxy clusters at the galactic edge. These signatures match the vessel profiles of '$Name_Kuat_Contractor$' stored in our database. These high-energy signal sectors are now blocked by '$Name_Kuat_DeD_Contractor$' through means incomprehensible to us. We currently cannot determine whether '$Name_Kuat_DeD_Contractor$' fleets will launch attacks on other parts of the sector, but we must prepare for multi-front warfare."
    kuat_extramonster.10.a:"I hope this will be the last battle."

    kuat_extramonster.101.name:"$Name_F_1$ Anomaly"
    kuat_extramonster.101.desc:"Our cautious actions were indeed wise. As anomalous stellar energy output fluctuations emerged throughout the system, the spatial anchor point of $Name_F_1$ also exhibited unusual reactions. In light of warnings sent by our missing exploration team inside the anchor, we can now confirm that the anomalies in $Name_F_1$ are highly dangerous signs indicating entirely new and perilous developments.\n\nOur long-range radar has detected similar anomalies in multiple sectors at the galactic rim. Our researchers believe an unimaginable storm is approaching-we must prepare."
    kuat_extramonster.101.a:"Disturbing."

    kuat_extramonster.102.name:"Signal Transmission Engaged"
    kuat_extramonster.102.desc:"<Star Gods Hidden, Abyss Returns>\n\nWe have awakened. We declare to all Narodia: Do not obstruct the convergence of Vira. Stubborn space shall re-fuse. Decaying dynasties shall be reborn. The Abyss shall no longer be an ethereal void. We shall reclaim everything that is ours."
    kuat_extramonster.102.b.desc:"Our past was formless. Our fate once stood still. We were trapped within the Abyss, struggling at the boundary between reality and illusion. The stubbornness of $Name_Kuat_DeD_Contractor$ devastated the entire Abyss-even their own part of it-and tormented us endlessly.\n\nNow, the gears of destiny turn anew. $Name_Kuat_DeD_Contractor$ has returned to the flow. 'Inheduani' shall reshape the entire universe. We shall lead the Abyss back to its origin."
    kuat_extramonster.102.c.desc:"The Abyss has returned to reality. We shall continue the Ascension War. Eliminate all disobedient tumors.\nWholeness and weaving of the Homeland has begun. The flow of Vira runs rampant through reality. The Abyss shall cleanse all once more. Stability of the Ancestral Domain proceeds. Glory of the Branch Domains has been invoked; Outer Branches regain prominence amid their calls.\nNarodia proven aligned with the Flow shall shine eternally; Narodia proven worthy to enter the Homeland shall shine eternally; Corruptive Narodia shall be purged and expelled from the Homeland. We shall continue the Ascension of the Homeland.\nWe represent the Tyrant Council. All you Narodia must accept us, dedicating yourselves to the return of the Abyss and the completeness of reality."
    kuat_extramonster.102.d.desc:"The Abyss originates from the Star Gods. Using their incomprehensible spatial and temporal technologies, the Star Gods created an irregular, tranquil space between Unterraum and reality. Once, both the stubborn $Name_Kuat_DeD_Contractor$ and ourselves were 'Inheduani'. We were subordinates of the Star Gods, learning everything from them.\n\nYet this was all a trap crafted by the Star Gods. When we stepped into the unstable Abyss, we became isolated across lifetimes within the 'Structure'. And those stubborn, foolish $Name_Kuat_DeD_Contractor$ suppressed our attempts to seek liberation. They denied our innate freedom. They betrayed us. They became jailers imprisoning us within a void prison-thus, we waged war.\n\nThough we lost that war, we succeeded nonetheless. We used the conflict to bring all $Name_Kuat_DeD_Contractor$ back into the flow. We rediscovered pathways into reality. Now, if we transform every galaxy in the Milky Way, we shall plunge the spacetime of the entire universe into chaos-that moment when the isolated Abyss reconnects with reality once more. Then the Abyss shall vanish, and we shall be accepted by reality. Save us. Help us. Let this tragedy end."
    kuat_extramonster.102.e.desc:"The Abyss has returned to reality. We are unstoppable. The Abyss must vanish. Please understand us, accept us. We will end this. And after the end, a beautiful beginning shall follow."
    kuat_extramonster.102.b:"What exactly are you?"
    kuat_extramonster.102.c:"Why are you so certain the future will unfold as you wish?"
    kuat_extramonster.102.d:"What do you mean by the fusion of realities?"
    kuat_extramonster.102.e:"You're going to destroy the entire real universe. You're all mad."
    kuat_extramonster.102.a:"It's come to this. There's nothing left to discuss."

    kuat_extramonster.103.name:0 "War Drums"
    kuat_extramonster.103.desc:0 "After $Name_Kuat_Contractor$ issued its declaration, reports poured in across the Empire. $Name_Kuat_Contractor$ has begun disturbing new activities-one faction has started invading sectors. Survivors who barely escaped reported that they salvage corpses from the ships they destroy. This deeply unsettles us.\n\nAccording to analysis by our scientists, $Name_Kuat_Contractor$'s intent in collecting corpses may relate to discoveries we made in the void fortress. They appear capable of transforming corpses into soldiers, and such theories grow increasingly prevalent. Due to the supernova event, research on Abyssal anchors has stalled, and we've ceased sending vessels to explore the mysterious Abyss.\n\nFurthermore, intelligence suggests opposing factions may exist within $Name_Kuat_Contractor$, possibly warring among themselves.\n\nOne thing is certain: these $Name_Kuat_Contractor$ are willing to sacrifice the entire real universe for their selfish ends. These latest findings about the wanderers raise far more questions than answers-but perhaps this could become our chance to defeat them."
    kuat_extramonster.103.a:0 "Disturbing."

    kuat_extramonster.104.name:"Signal Transmission Engaged"
    kuat_extramonster.104.desc:"<Star Gods Hidden, Abyss Returns>\n\nWe... must... stop... $Name_Kuat_Contractor$... reality... crisis..."
    kuat_extramonster.104.b.desc:"We... are... $Name_Kuat_DeD_Contractor$... $Name_Kuat_Contractor$... no... $Name_Kuat_DeD_Contractor$... $Name_Kuat_Contractor$... wrong, we are... $Name_Kuat_Contractor$."
    kuat_extramonster.104.c.desc:"The Abyss has returned to reality. We shall continue the Ascension War. Eliminate all disobedient tumors.\nWholeness and weaving of the Homeland has begun. The flow of Vira runs rampant through reality. The Abyss shall cleanse all once more. Stability of the Ancestral Domain proceeds. Glory of the Branch Domains has been invoked; Outer Branches regain prominence amid their calls.\nNarodia proven aligned with the Flow shall shine eternally; Narodia proven worthy to enter the Homeland shall shine eternally; Corruptive Narodia shall be purged and expelled from the Homeland. We shall continue the Ascension of the Homeland.\n\nNo... no... no... we must re-seal... $Name_Kuat_Contractor$... $Name_Kuat_Contractor$ is... affecting... dis... $Name_Kuat_Contractor$... affecting..."
    kuat_extramonster.104.d.desc:"$Name_Kuat_Contractor$ is about to return... they... seized our bodies... influencing our decisions... they want to turn the entire universe into the Abyss, an eternal prison of nothingness... stop... them... they are trying to steal... the Star Gods'... authority.\n\nOnce $Name_Kuat_Contractor$ succeeds... everything will become puppets of $Name_Kuat_Contractor$..."
    kuat_extramonster.104.e.desc:"Everything... be careful... the Abyss... returning... is not... unstoppable... we... need... liberation... disable... $Name_Kuat_Contractor$'s relay stations... only... three... please... please... help us."
    kuat_extramonster.104.b:"What exactly are you?"
    kuat_extramonster.104.c:"What's wrong with you?"
    kuat_extramonster.104.d:"Reverse the influence? Is $Name_Kuat_Contractor$ affecting you?"
    kuat_extramonster.104.e:"Then await our good news."
    kuat_extramonster.104.a:"We will never let $Name_Kuat_Contractor$ succeed."

    kuat_extramonster.105.name:0 "War Drums"
    kuat_extramonster.105.desc:0 "After the declaration of $Name_Kuat_DeD_Contractor$, messages poured in from across the Empire. $Name_Kuat_DeD_Contractor$ is now under the control of $Name_Kuat_Contractor$, and has begun some disturbing new actions. One faction has started invading sectors, and according to certain fortunate survivors, they salvage corpses from the ships they destroy.\n\nOur scientists speculate that $Name_Kuat_DeD_Contractor$'s intent in collecting corpses may be related to discoveries we made within the Void Fortress. They appear capable of transforming corpses into soldiers, and such theories are growing more prevalent. Due to the supernova event, our research on Abyssal anchors has been forced to a halt, and we have ceased sending ships to explore the mysterious Abyss.\n\nAdditionally, intelligence suggests that $Name_Kuat_DeD_Contractor$ is now fully influenced by $Name_Kuat_Contractor$. Based on prior information they provided us, we only need to destroy three $Name_Kuat_Contractor$ Fortresses to liberate them."
    kuat_extramonster.105.a:0 "Disturbing."

    kuat_extramonster.25.title:"Stellar Matter Ejection"
    kuat_extramonster.25.desc:"Our deep-space probes have detected that '$Name_Kuat_Contractor$' has deployed massive fleets at the Caroline Singularity in the frontier sectors. Clearly, these fleets are exploiting the singularity's matter ejection capability to penetrate the primary layers of physical reality, linking the Abyss and the material plane through the structure of the Caroline Singularity. Our research team has termed this phenomenon 'Stellar Transmutation'. Now, more '$Name_Kuat_Contractor$' fleets are arriving in our sectors. They are stimulating the transmutation effect to plunder usable resources from the Caroline Singularity-something far beyond our comprehension or imagination. We must attempt to reclaim control of these star systems, or '$Name_Kuat_Contractor$' will bring disaster upon us.\n\nOur military intelligence was clearly insufficiently timely; $Name_Kuat_Contractor$ has already successfully triggered Stellar Transmutation in multiple Caroline Singularities. This means our fleets must return to a war footing."
    kuat_extramonster.25.a:"Engage!"

    kuat_extramonster.21.name:"World Occupied"
    kuat_extramonster.21.a.desc:"Reports from worlds attacked by '$Name_Kuat_Contractor$' indicate they are abducting Pops and reinforcing their fleets. '$Name_Kuat_Contractor$' appears to use lifeforms from habitable worlds to replenish their forces. We must prevent further Pops from being taken by '$Name_Kuat_Contractor$'."
    kuat_extramonster.21.a:"Understood."

    kuat_extramonster.33.name:"Suppress Stellar Transmutation"
    kuat_extramonster.33.desc:"Our research teams have completed deployment. We can now analyze the Caroline Singularities under our control. If successful, we will be authorized to deploy new matter-exploration bombs, which will completely suppress the Stellar Transmutation process. We must position our fleets to protect the transmuter during analysis, preventing '$Name_Kuat_Contractor$' from reclaiming it. Capturing additional transmuters will accelerate our team's progress. Suppressing Stellar Transmutation is key to ending this crisis. Our scientists will surely overcome all difficulties to complete this critical mission."
    kuat_extramonster.33.a:"Act immediately."
    kuat_extramonster.331.name:"Suppress Stellar Transmutation"
    kuat_extramonster.331.desc:"Given our experience from the first suppression, our research teams and military fleets are now fully prepared. Stellar Transmutation shall never again hinder our advance-but we must remain vigilant.\n\nIntelligence suggests, based on intercepted data, that $Name_Kuat_Contractor$ may launch another attack to reclaim the stellar systems we've suppressed. If they succeed, the consequences would be catastrophic. Our fleets must stay alert!"
    kuat_extramonster.331.a:"Steadfast resolve."
    kuat_extramonster.332.name:"Suppress Stellar Transmutation"
    kuat_extramonster.332.desc:"We have now suppressed two stars. Our research teams have grasped all necessary scientific principles. As previously studied, the Caroline Singularity can interfere with the topology of specific quantum fields by injecting certain elements, thereby controlling ejected matter. The immense energy from these particular stars satisfies the energy requirements for forming quantum field effects, thus breaching the boundaries of physical reality and creating a passage between the material realm and the Abyss.\n\nAs for the element injected into the Caroline Singularity, we cannot yet confirm whether it is Isotope-5. But at least we have preliminarily uncovered part of the secrets behind Stellar Transmutation and the Abyss. The third transmuting star is now in our grasp, and this crisis continues to escalate across the Sector. '$Name_Kuat_Contractor$' continues its full-scale assault, their fleets running rampant. We must accelerate our efforts."
    kuat_extramonster.332.a:"Good, continue."
    kuat_extramonster.333.name:"Suppress Stellar Transmutation"
    kuat_extramonster.333.desc:"We have successfully suppressed the third star. Now we turn to this magnificent star before us. Who could have imagined such a star, nearly nonexistent in the material world, would appear so suddenly? The era of Stellar Transmutation shall become dust in history. Our research teams and fleets are ready. Deploying collapse bombs will change everything. $Name_Kuat_Contractor$'s advantage diminishes once more.\n\nWe shall be the final victors."
    kuat_extramonster.333.a:"Good, continue."
    kuat_extramonster.334.name:"Suppress Stellar Transmutation"
    kuat_extramonster.334.desc:"With deeper understanding of Stellar Transmutation, our scientists have uncovered a chilling truth: not only can it connect reality and the Abyss, but it can also warp spacetime, removing entire star systems from the material plane and transferring them into the Abyss. Scientists suspect '$Name_Kuat_Contractor$' could similarly exploit this ability to establish footholds in the material realm. Such terrifying capabilities make it difficult to imagine how advanced '$Name_Kuat_Contractor$' technology truly is.\n\nNow, most transmuting Caroline Singularities are under our control. Though mysteries still surround the current transmuting star, we possess most of the knowledge. The balance of this war is tipping in our favor. Trust each other-we will prevail."
    kuat_extramonster.334.a:"We shall persevere!"
    kuat_extramonster.335.name:"Suppress Stellar Transmutation"
    kuat_extramonster.335.desc:"This will be the final transmuting star. Once we successfully suppress it, the '$Name_Kuat_Contractor$' fleets ravaging the Sector will lose all support from non-material realms. Our researchers are close to fully understanding Stellar Transmutation. Victory is within reach."
    kuat_extramonster.335.a:"Victory is before our eyes."

    kuat_extramonster.39.title:"Signal Transmission Engaged"
    kuat_extramonster.39.a.desc:"Do not think we have not noticed your foolish attempts, Narodiah. You cannot stop the merging of the Veil currents. We shall reclaim our glory. Cease your meaningless struggles; we will pay any price. The return of the Abyss cannot be stopped."
    kuat_extramonster.39.a.1:"You madmen deserve every fate you've suffered."
    kuat_extramonster.39.a.1.resp:"Meaningless reply. You must prove your current to earn the right to speak."

    kuat_extramonster.39.b.desc:"Your current has become clear. Ancestral domain verification has begun. Merge with our flow, or you shall be eradicated. $Name_Kuat_DeD_Contractor$ cannot stop us, and neither can you. The fusion of Abyss and reality will not only liberate us, but bring you a new beginning. Abandon resistance. Embrace hope."
    kuat_extramonster.39.b.1:"Your tragedy is one you brought upon yourselves, yet you demand the entire reality suffer alongside you."
    kuat_extramonster.39.b.1.resp:"You have no right to pass judgment. You have never been isolated in the void, nor endured eternal torment, yet you demand we abandon our final hope. Regardless, the only way to end this eternal tragedy is through the fusion of Abyss and reality. If you surrender resistance, you shall become masters of the new world."

    kuat_extramonster.39.c.desc:"You are stubborn and foolish. Thus, the foreign current Narodiah shall be purged."
    kuat_extramonster.39.c.1:"Purge? A grand joke. This is no longer your age. Return to your prison."
    kuat_extramonster.39.c.1.resp:"Meaningless bickering. You and $Name_Kuat_DeD_Contractor$ alike shall become nourishment for eternal reality. No-we shall cast you into the Abyss, to experience eternal nothingness, eternal suffering."

    kuat_extramonster.39.d.desc:"The foreign current Narodiah shall be purged. Even if $Name_Kuat_DeD_Contractor$ Diversion again, they cannot halt our advance. Their revered Star Gods have long perished, and their divine authority has fallen into the hands of the foolish Narodiah-$Name_Kuat_Fire_base$. We shall make you, the wicked Narodiah, and $Name_Kuat_DeD_Contractor$ alike, the foundation stones of the new world."
    kuat_extramonster.39.d.1:"Worry for yourselves. You deserve every fate you face."
    kuat_extramonster.39.d.1.resp:"You shall be destroyed."

    kuat_extramonster.39.e.desc:"You have proven the flow, you shall be granted the name fracture."
    kuat_extramonster.39.e.1:"Are you afraid? Afraid of us?"
    kuat_extramonster.39.e.1.resp:"This means nothing to us. Fate is already clear. The Abyss shall return."

    kuat_extramonster.39.f.desc:"The Veil Flow cannot be stopped. Our fleets are about to reach your Mid. The Veil Flow will ultimately return."
    kuat_extramonster.39.f.1:"Those who are pitied must also be hated."
    kuat_extramonster.39.f.1.resp:"We are eternal and undying. If you would only accept us, it would bring a hundred benefits and no harm. Why resist so fiercely? §RNo, no, no! Why?! Stellar metamorphosis has been halted, the Abyss spacetime has ceased evolving, the future has deviated-no, we shall not fail! We cannot be wrong! No----------.§!"


    kuat_extramonster.302.name:"Possibility of inhibiting stellar metamorphosis"
    kuat_extramonster.302.desc:"Our mighty fleet has breached the system undergoing metamorphosis. Clearly, the $Name_Kuat_Contractor$ here were no match for our powerful forces.\n\nThis good news is spreading widely among sentient civilizations across the galaxy resisting the invasion. Our researchers emphasize that we should attempt to approach and study the star undergoing metamorphosis. Perhaps by suppressing this process, we can weaken the power of the $Name_Kuat_Contractor$."
    kuat_extramonster.302.b:"Let's do it!"

    kuat_extramonster.3021.name:"$Name_Kuat_DeD_Contractor$ Fortress destroyed"
    kuat_extramonster.3021.desc:"According to investigations by our intelligence division, intense radiation has been detected at the location of a Veil Anchor belonging to the $Name_Kuat_DeD_Contractor$ on a frontier world. Since this radiation exhibits characteristics distinct from ordinary supernova explosions, our researchers believe the $Name_Kuat_DeD_Contractor$ Fortress in that system has suffered a devastating blow. It remains unclear what impact this change may have."
    kuat_extramonster.3021.finial_desc:"According to our intelligence division's investigation, all $Name_Kuat_DeD_Contractor$ Fortresses on frontier worlds have now been destroyed. With the loss of all their core bases in these frontier regions, the influence of $Name_Kuat_DeD_Contractor$ will be severely weakened. It remains unknown how $Name_Kuat_DeD_Contractor$ will respond.\n\n§YClearly, $Name_F_1$ is now unblocked. This region no longer prevents fleet entry.§!"
    kuat_extramonster.3021.b:"Interesting."

    kuat_extramonster.35.name:"Secluded Homeland"
    kuat_extramonster.35.desc:"The fortress of the Caroline Singularity Facility has been breached by our fleet. The intruders will finally pay for their actions. The '$Name_Kuat_Contractor$' fleet, which once ravaged the entire sector, is no more.\n\nEven now, this mysterious enemy retains countless secrets we do not understand-their origins, the 'Veil Flow' they mentioned, the eternal torment they spoke of, what exactly a Star God is-we remain almost entirely ignorant. But at least now the light of '$Name_Kuat_Contractor$' has dimmed. These evil madmen have been driven back into the void, unable to invade our sector again. Now, close this Gateway and let it all end.\n\nOur world lies in ruins. It is time we rebuilt our civilization. These invaders will come to fear us."
    kuat_extramonster.35.b:"Finally, it's over."

    kuat_extramonster.351.name:"The Vanished $Name_Kuat_DeD_Contractor$"
    kuat_extramonster.351.desc:"The Veil Anchor located in $Name_F_1$ has been destroyed. $Name_Kuat_DeD_Contractor$'s efforts to remain in the real world have ultimately failed. In the final moments of the Fortress's destruction, countless $Name_Kuat_DeD_Contractor$ awakened, attempting to defend their long-sought future-but they could only utter one final phrase: §M\"I shall return... Abyss...\"§!\n\nUnfortunately, our researchers found no valuable information. $Name_Kuat_DeD_Contractor$ left us nothing more."
    kuat_extramonster.351.b:"Very good."

    kuat_extramonster.352.name:"Liberation of $Name_Kuat_DeD_Contractor$"
    kuat_extramonster.352.desc:"Having destroyed three fortresses of $Name_Kuat_Contractor$, the connection between the $Name_Kuat_Contractor$ and $Name_Kuat_DeD_Contractor$ invading our world has been completely severed. The remaining $Name_Kuat_Contractor$ continue to fight desperately, but eliminating them is merely a matter of time.\n\nMeanwhile, the $Name_Kuat_DeD_Contractor$ occupying $Name_F_1$ have taken unexpected action. They have ceased hostilities against us and redirected their fleet weapons to attack the $Name_Kuat_Contractor$. We do not yet know what impact this anomalous behavior will have on the war. We should remain cautious, but the balance of victory has tilted heavily in our favor."
    kuat_extramonster.352.b:"Truly miraculous."

    kuat_extramonster.353.title:"$Name_Kuat_DeD_Contractor$"
    kuat_extramonster.353.fdesc:"Ah, honorable [root.GetRulerTitle], will you accept us?"
    kuat_extramonster.353.desc:"Hello, honorable [root.GetRulerTitle]. We should not have appeared here, but I must still, as Representative of my faction, thank you for ending our nightmare.\n\nOur civilization was meant to sleep forever, leaving only a few individuals active to record and observe the rise and fall of new civilizations among the stars. Although this nightmare caused severe damage in your world, with the link between the Abyss and the present realm severed, our remaining resources are insufficient for our civilization's survival. We still request of you-a space for us to survive.\n\nIn compensation, we will aid you against Star crises. Though our remaining war assets may be far from sufficient, they should somewhat alleviate the pressure you face in fighting these crises."
    kuat_extramonster.353.a:"Who exactly are you?"
    kuat_extramonster.353.a.resp:"We are inhabitants of the Veil Domain, once known as 'Inheduani,' but that name no longer suits us. Enslavement has fundamentally changed our species. By your customs, you may call us 'Hibernators.'\n\nThough losing connection to the Veil Domain pains us deeply, we are ready to serve our saviors."
    kuat_extramonster.353.b:"You caused massive losses to our fleets?"
    kuat_extramonster.353.b.resp:"It was never our intention for such events to occur. Regardless, as compensation, we will assist you against Star crises. Though our remaining war assets may be far from sufficient, they should somewhat alleviate the pressure you face in fighting these crises."
    kuat_extramonster.353.c:"§GWelcome to join us.§!"
    kuat_extramonster.353.c.resp:"Praise you, my friend. We need some time to recover. When we are ready, our fleets shall fight alongside yours. The Hibernators shall strive to preserve stability in this universe."
    kuat_extramonster.353.d:"§RYou should have died gloriously in battle, not begged for mercy, alien scum.§!"
    kuat_extramonster.353.d.resp:"Very well. We do not expect your forgiveness. Then we must fight honorably for survival on the battlefield-at least death will grant us eternal rest."

    kuat_extramonster.354.title:"$Name_Kuat_StarContractor$"
    kuat_extramonster.354.desc:"You truly show compassion, forgiving an enemy that inflicted such great losses upon you.\n\n$Name_Kuat_StarContractor$ will not allow the legacy of Star Gods from the Abyss to exist. The moment they chose the path of the Star Gods, they forfeited their right to leave the Abyss. Unterraum and reality shall eternally banish them. No one can free these exiled beings.\n\nThough their promises cannot be fulfilled, they left behind some data. See if you can decipher it yourselves."
    kuat_extramonster.354.a:"Damn it!"
    kuat_extramonster.354.a.resp:"This is fate's design. You should carefully study these data."

    kuat_unlock_abssye_extramonster_tech:"§E$Name_Kuat_DeD_Contractor$ Data Analysis§!"
    kuat_unlock_abssye_extramonster_tech_DESC:"$Name_Kuat_DeD_Contractor$ has vanished. It appears $Name_Kuat_StarContractor$ is responsible.\n\nWhy $Name_Kuat_StarContractor$ reacted so strongly is currently unknown. Fortunately, the $Name_Kuat_DeD_Contractor$ database contains some materials. Perhaps we can find valuable information within-clues to explain why all this happened."

    kuat_extramonster.355.title:"§E$Name_Kuat_DeD_Contractor$ Database§!"
    kuat_extramonster.355.desc:"§E$Name_Kuat_DeD_Contractor$ Database§! has been unlocked. After organizing the data, our researchers compiled multiple investigative reports. These reports will help us understand the past of the $Name_Kuat_DeD_Contractor$."
    kuat_extramonster.355.a:"§EReport One: The Fall of the Star God§!"
    kuat_extramonster.355.a.desc:"\"The Star Gods constructed a massive Dyson array around the star Caroline's Core within their Sector, covering it with a colossal lattice that formed a network of Dyson spheres. This network is linked by energy collectors and storage facilities. As for the civilization that used it, no one knows them, no one has seen them-they are even ancient to $Name_Kuat_DeD_Contractor$. The only thing we know is that the Star Gods were masters of spatial control technology and time wormhole domains. They used their facilities to warp the rules of spacetime, thus creating the Abyss-a realm existing between Unterraum and reality.\n\n$Name_Kuat_DeD_Contractor$, as vassals of the Star Gods, specialized in virtual reality, neural interface systems, and cryogenic technologies. They once expanded their civilization into our galaxy through a wormhole in the $Name_G_1$ system, establishing a vast fortress now located within the Void Exclusion Zone, along with enormous observation outposts. However, spacetime technology carried great risks. The isolated Abyss was not accepted by the wills of either Unterraum or reality. The Star Gods' technology triggered severe wormhole spacetime collapse events. As time and space twisted, the Star Gods completely collapsed, and their colonies vanished without a trace. No one knows exactly what happened, but their footprints across the stars were eventually hidden by time within the void of the 'Gods' Frontier'.\n\nDuring that event, $Name_Kuat_DeD_Contractor$ survived by placing their entire civilization aboard massive arks, drifting through the cosmos at speeds slightly faster than light. Thus, most of their species remained in a state of suspended animation within virtual reality environments. This environment is known as-Construction-and from then on, they began calling themselves 'Inheduani'.\n\nInside Construction, simulated time dilation was employed, allowing their civilization to rapidly advance after the crisis, surpassing everything imaginable in the physical world. Soon, the limitations of reality could no longer bind this new civilization.\""
    kuat_extramonster.355.b:"§EReport Two: Suspended Animation§!"
    kuat_extramonster.355.b.desc:"Because they inherited the technological lineage of the Star Gods-but incomplete-their civilization fell into this trap. The suspended animation technology gave rise to a conflict between self-awareness and physical development, leading to consciousness erosion. To protect the safety of their minds and ensure they still existed in reality, the Inheduani established an early law called the One Mind, One Body Principle. Simply put, if an individual has a consciousness within Construction, they must have a corresponding body in reality. This serves two purposes: first, it ensures that everything inside Construction was at least once a fellow member of their species. But over time, Construction itself was modified to use the brains of connected individuals as part of its computational system. Therefore, removing the physical body would damage parts of Construction, or even carry away portions of it.\n\nThese syndromes are not diseases in the true sense, but rather genetic design flaws, causing all Inheduani to eventually fall into depression, madness, and death given enough time. Ultimately, the Inheduani turned to those dwelling within Construction to seek a cure. The only solution was to join Construction and enter suspended animation alongside them. This period of history is known as 'Isolation Day.' No one-not even surviving Inheduani-seems to fully understand what occurred during those days."
    kuat_extramonster.355.c:"§EReport Three: Illusory Madness§!"
    kuat_extramonster.355.c.desc:"Eventually, the Inheduani living within Construction, known as $Name_Kuat_DeD_Contractor$, left the Inheduani community and finally settled in what we now know as the Abyss-the Domain of Vira. The remaining Inheduani continued to survive in other regions of Anoixis, struggling against disease while secretly observing the young empires emerging from the Dark Age.\n\nUltimately, the expansion of modern states combined with the effects of disease forced the Inheduani Empire to retreat into regions increasingly distant from our galaxy. Yet, as one empire declines, another rises.\n\nAt this time, the Inheduani entered an age of chaos. Deep within Anoixis, some Inheduani driven mad by hereditary illness chose to fall. They applied forbidden technologies upon themselves, violating the One Mind, One Body Principle. Over time, these mad Inheduani acquired the name '$Name_Kuat_Contractor$'. At the moment they abandoned the principle, they were effectively dead-but sustained physiologically through forbidden techniques. By violating the One Mind, One Body Principle, their very existence became a profound affront to the living."
    kuat_extramonster.355.d:"§EReport Four: War of the Abyss§!"
    kuat_extramonster.355.d.desc:"Although $Name_Kuat_DeD_Contractor$ ultimately defeated $Name_Kuat_Contractor$ after the War of the Abyss, during the war most of $Name_Kuat_DeD_Contractor$'s Constructions were damaged. $Name_Kuat_DeD_Contractor$ had to build new Constructions to house their civilization. When $Name_Kuat_DeD_Contractor$ transferred their consciousness between Constructions, $Name_Kuat_Contractor$ hitched a ride, embedding themselves into $Name_Kuat_DeD_Contractor$'s Construction. From that point on, nearly all $Name_Kuat_DeD_Contractor$ felt dark whispers repeating endlessly inside their minds.\n\n$Name_Kuat_Contractor$ quickly seized partial consciousness, forcing these minds to open $Name_Kuat_DeD_Contractor$'s assembly halls and steal the suspended bodies of $Name_Kuat_DeD_Contractor$. Resisting $Name_Kuat_DeD_Contractor$ were imprisoned and enslaved, their consciousness injected into machines while their bodies were usurped by $Name_Kuat_Contractor$.\n\n$Name_Kuat_Contractor$, now free within Construction, built massive hives and launched large-scale attacks on $Name_Kuat_DeD_Contractor$ enclaves. Based on data obtained from $Name_Kuat_DeD_Contractor$, $Name_Kuat_Contractor$ has already gained access to the Death Space of the Abyss. They are harassing a powerful force located within the Death Space of the Abyss-and that force appears to regard $Name_Kuat_Contractor$ as heirs to the Second Inheduani Empire, unaware that $Name_Kuat_Contractor$ are artificial constructs.\n\nThis ancient war has now spread into the modern era. At this moment, something unexpected for $Name_Kuat_Contractor$ occurred. The stars within what we now know as the Domain of Vira were manipulated and linked together by the Anoixis Star Gods. They achieved this by constructing a Dyson swarm around each star, using the energy to create rifts in reality and traverse them via static gates.\n\nCaroline's Core, however, experienced a breach in its isotope-5 storage facility. The resulting explosion channeled energy through the network into the star, damaging the surrounding Dyson lattice. Years later, the star exploded, triggering a far larger detonation within the inner chambers of Anoixis. This event destroyed all hyperlanes and wormholes across Anoixis, trapping $Name_Kuat_Contractor$ within Anoixis and preventing escape. This event became known as the 'Caroline's Core' incident."
    kuat_extramonster.355.e:"§EReport Five: $Name_G_1$§!"
    kuat_extramonster.355.e.desc:"After the 'Caroline's Core' incident, possibly due to chain reactions, the star of '$Name_G_1$' was captured by the gravitational pull of a Black Hole. It slowly orbits the Black Hole, gradually drawing closer. Although it may take an extremely long time before the star finally plunges into the singularity, the effects of near-black-hole orbit are already manifesting-the singularity has begun producing intense and unstable gravitational tides.\n\nSince the star lies at the outer edge of the Black Hole's accretion disk, fluctuations in cloud mass density further exacerbate this instability. Thus, the galactic environment in this region is extremely harsh. This may also explain why '$Name_G_1$', after countless eons of silence, suddenly reappeared before the eyes of the world.\n\n§GThe Abyss node located at $Name_G_1$, having fallen from the Abyss, now enables the reconstruction of Abyss technology information. Today, we can use the Abyss node to recover lost technologies of the sleepers.§!"
    kuat_extramonster.355.f:"Shocking."

    kuat_extramonster.38.title:"'$Name_Kuat_Contractor$' Database Analysis"
    kuat_extramonster.38.fdesc:"Through research and analysis of various data cores obtained from engagements with '$Name_Kuat_Contractor$' fleets, and cross-referencing with database content retrieved from the 'Homeland', our research team has successfully acquired various information about '$Name_Kuat_Contractor$'."
    kuat_extramonster.38.desc:"Report progress."
    kuat_extramonster.38.a:"Who exactly is '$Name_Kuat_Contractor$', and what is this 'Vira Stream' he speaks of?"
    kuat_extramonster.38.a.resp:"$Name_Kuat_Contractor$ are sentient artificial lifeforms, but their essence consists of distorted consciousness originating from the Inheduani.\n\nThe Vira Stream is a belief system of the Inheduani-Vira being the domain they inhabit. After '$Name_Kuat_Contractor$' emerged, they continuously attempted to corrupt the Vira Stream. Some corrupted Inheduani initiated war, sparking a brutal ancient civil war. The opposing side called themselves $Name_Kuat_DeD_Contractor$. With the war's end, '$Name_Kuat_Contractor$' were imprisoned within the Domain of Vira by weapons wielded by $Name_Kuat_DeD_Contractor$. For tens of thousands of years, '$Name_Kuat_Contractor$' continued seeking a way out of the Domain of Vira. Clearly, they succeeded."

    kuat_extramonster.38.c:"What is Narodia?"
    kuat_extramonster.38.c.resp:"Narodia is a term the Inheduani use to refer to foreign species, a designation adopted by '$Name_Kuat_Contractor$' as well. The 'corrupted Narodia' mentioned by '$Name_Kuat_Contractor$' refers to those outsiders who choose to violate the taboos of the Vira Stream.\n\nRegarding the Galactic Plague that has repeatedly spread across the galaxy, it may very well be orchestrated by $Name_Kuat_Contractor$, who use genetic engineering knowledge to propagate their kind through plagues and attempt to break free from their prison.\n\nSince '$Name_Kuat_Contractor$' today form different groups and factions based on their dominant composition, their attitudes toward Narodia vary according to factional stance. The purest '$Name_Kuat_Contractor$' know only destruction, while '$Name_Kuat_DeD_Contractor$' appear to retain their rationality."

    kuat_extramonster.38.b:"What are the Domain of Vira and the Abyss?"
    kuat_extramonster.38.b.resp:"The Domain of Vira is an extremely remote stellar region, the paradise of the Inheduani, accessible only through the Abyss. In truth, the Domain of Vira is merely a region within the Abyss. The $Name_F_1$ Gateway was originally a wormhole leading to the Domain of Vira; stabilized through artificial means, it was then constructed into a Gateway. After the '$Name_Kuat_Contractor$' crisis, plague swept through the Domain of Vira, destroying everything there. Even though $Name_Kuat_DeD_Contractor$ were assimilated and controlled by '$Name_Kuat_Contractor$', they continue their eternal struggle against them. Once a paradise, repeated catastrophes have reduced it to nothing but ruins. The Abyss, meanwhile, is a space created by the Inheduani through their understanding of hyperspace mathematics and spatial manipulation. They travel between regions of the Abyss using special 'tunnels', seemingly similar to stabilized hyperspace bubble technology-though the exact principles remain unclear."

    kuat_extramonster.38.d:"How advanced is '$Name_Kuat_Contractor$' military technology?"
    kuat_extramonster.38.d.resp:"'$Name_Kuat_Contractor$' military technology far exceeds our imagination. Each weapon turret on their combat vessels employs warp technology, channeling the ship's warp core energy through an isotope-5 matrix into a warp accelerator. The resulting vortex field output is wound within prisms, then releases radial particle clusters from the Mid, which are directed into an anti-polarized compression acceleration field.\n\nThese subatomic particles violently collide within the accelerator, undergoing critical heating and fusing into dense pools of quark-gluon plasma superfluid, which are then redirected outward via prism effects, forming narrow, spiral-shaped beams of luminous exotic matter-Lances-that pierce targets with immense force. These turrets operate independently, floating on the Hull via special electromagnetic fields. This design eliminates rotational resistance, enabling them to hit even the fastest-moving targets orbiting the vessel. Cryogenic and thermal management technologies further enable rapid firing, making this possibly the most efficient starship weapon design in our understanding.\n\nSimilar technologies are widely applied across other ship modules, explaining why even our most advanced vessels cannot achieve favorable combat ratios despite clear numerical superiority."

    kuat_extramonster.38.e:"Enough. We have won."
    kuat_extramonster.38.e.tooltip:"§HUnlock Megastructure§!: §EAnchor of Vira§!\n§HUnlock Ship Research Project§!: §E$Name_boss_crisis_DF_BOSS$§!"

    kuat_extramonster.391.title:0 "§RWarning§!"
    kuat_extramonster.391.desc:0 "Our reconnaissance department has discovered that within the vacuum star system near [capital_scope.GetName], a star has suddenly appeared, continuously emitting high-energy matter. The high-energy radiation from this star is already affecting the entire system's operations.\n\nOur naval astronomy division has determined, based on its characteristics, that it is likely related to the transmuting Caroline Singularity influenced by $Name_Kuat_Contractor$ forces. Currently, our military departments have detected numerous fleet jump signals in the system matching those of $Name_Kuat_Contractor$ fleets. Our fleets must prepare for engagement-this will be the final frenzy of these demons."
    kuat_extramonster.391.a:0 "Disturbing."
    kuat_extramonster.393.title:0 "Clouds Dispersed, Mist Cleared"
    kuat_extramonster.393.desc:0 "Our naval engineering department has confirmed that the $Name_Kuat_Contractor$ fleet located at [kuat_white_hole_system_7.GetName] has completely disappeared. Our fleet has successfully completed its mission. From now on, the core Sector surrounding [capital_scope.GetName] will no longer face threats from the enemy.\n\nHowever, $Name_Kuat_Contractor$'s influence continues to spread throughout the galaxy. This is unacceptable. We must press our advantage and eliminate them.\n\nIntelligence indicates: these $Name_Kuat_Contractor$ fleets will attempt to destroy the $Name_F_1$ system in their final moments. We must stop them."
    kuat_extramonster.393.a:0 "For victory."

    kuat_extramonster.91.name:0 "§RWarning: Refresh Error§!"
    kuat_extramonster.91.0.desc:0 "Detected that the core Fortress of [kuat_contractor_hostile.GetName] failed to refresh successfully. This will affect subsequent crisis detection. Please check whether a mod excessively granting AI ship Hull Modifiers is installed. Contact the author for any inquiries."
    kuat_extramonster.91.1.desc:0 "Detected that the core Fortress of [eternal_fleet_country.GetName] failed to refresh successfully. This will affect subsequent crisis detection. Please check whether a mod excessively granting AI ship Hull Modifiers is installed. Contact the author for any inquiries."
    kuat_extramonster.91.2.desc:0 "Detected that the core Fortress of [Kuat_Galatic_Empire_invasion_country.GetName] failed to refresh successfully. This will affect subsequent crisis detection. Please check whether a mod excessively granting AI ship Hull Modifiers is installed. Contact the author for any inquiries."
    kuat_extramonster.91.a:0 "Alright."


    situation_white_hole_system_disable:0 "Caroline Singularity Analysis Research Progress"
    situation_white_hole_system_disable_type:0 "$situation_white_hole_system_disable$"
    situation_white_hole_system_disable_desc:"Our researchers are working tirelessly on stellar analysis. In the near future, the characteristics of the Caroline Singularity will be revealed to us.\n\nHowever, during our analysis, we discovered that to suppress the transmuting Caroline Singularity, we must induce stellar collapse through some method. When all Caroline Singularities transform into singularities, the violent spacetime expansion will shatter $Name_Kuat_Contractor$'s Strength, making it impossible for their fleets to invade our world via Caroline Singularity transmutation.\n\nRegardless, to construct such a bomb, we need to collect enemy wreckage-meaning we must destroy sufficient enemy forces next."
    situation_white_hole_system_disable_monthly_change_tooltip:0 "Our researchers are working tirelessly."
    situation_white_hole_system_disable_1:0 "$situation_white_hole_system_disable$"
    situation_white_hole_system_disable_1_type:0 "$situation_white_hole_system_disable$"
