    kuat_set_difficulty_group.desc:"Crisis difficulty setting. Here you can adjust the base combat intensity of all enemies in the 'Star Wars: Dawn of Kuat' mod. Note that $kuat_set_difficulty_botton.easy$ and $kuat_set_difficulty_botton.normal$ do not require complex mechanics, whereas $kuat_set_difficulty_botton.hard$ and $kuat_set_difficulty_botton.ban$ require reading the game mechanics and utilizing them to counter enemies."
    kuat_set_check_group.desc:"Dynamic Modifiers intensity setting. This affects the base intensity of all enemies in the 'Star Wars: Dawn of Kuat' mod. When game difficulty is set to $kuat_set_difficulty_botton.hard$ or $kuat_set_difficulty_botton.ban$, this determines the additional damage ratio of enemies (typically 1 = 100%)."
    kuat_ai_trigger_group.desc:"Fleet animation setting. All ships from $Name_kuat$ will play a hyperspace arrival animation upon entering a system, causing fleets to be locked for a period. Here you can choose whether to enable this."
    kuat_set_return_group.desc:"If you're not afraid to die, go ahead and click. Once this option is enabled, any consequences will be disregarded."

    kuat_set_difficulty_botton.normal.desc:"We have initiated the Eternal Invasion.\n\nCurrent difficulty: §YNormal§!$exe_invasion.tooltip_nonflagship$"
    kuat_set_difficulty_botton.easy.desc:"We have initiated the Eternal Invasion.\n\nCurrent difficulty: §GExperience§!$exe_invasion.tooltip_nonflagship$"
