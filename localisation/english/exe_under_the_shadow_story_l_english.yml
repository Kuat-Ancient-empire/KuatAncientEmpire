    #############################
    exe_invasion.2.name:0 "Signal Broadcast into Deep Space"
    exe_invasion.2.desc:0 "Our intelligence division intercepted a powerful tachyon signal being transmitted beyond the star system. Astronomical observations indicate the signal may be targeting a barred spiral galaxy near our own. We cannot yet decode its content, but undoubtedly it carries profound significance."
    exe_invasion.2.a:0 "Disturbing."
    
    exe_invasion.4.name:0 "Extragalactic Energy Activity"
    exe_invasion.4.a.desc:0 "Recent astronomical observations reveal unexplained energy fluctuations within the galaxy targeted by the earlier tachyon signal. This may relate to activities of an alien civilization. While we cannot yet confirm any connection to the prior tachyon transmission, we must not dismiss this lightly."
    exe_invasion.4.b.desc:0 "Recent astronomical observations reveal unexplained energy fluctuations in a barred spiral galaxy near our system, possibly linked to alien activity. We must not take this lightly."
    exe_invasion.4.a:0 "Disturbing."
    
    exe_invasion.6.name:0 "Hyperspace Drift"
    exe_invasion.6.desc:0 "Our intelligence division has recently intercepted a series of hyperspace drifts. Several objects are rapidly approaching our star system via an artificial, one-way hyperlane and will arrive shortly. Analysis of their trajectory leads our scientists to believe they originate from the extragalactic system where unexplained energy activity was previously detected."
    exe_invasion.6.a:0 "Continue monitoring them."
    
    exe_invasion.8.name:0 "Approaching outer system"
    exe_invasion.8.desc:0 "The objects previously approaching our system from beyond the galaxy have now reached the outer edge of our star system and begun decelerating. Astronomical observations indicate they are likely to enter the gravity well of the former $Name_kuat$ capital system. Their Unterraum echoes have become clear enough for us to confirm they are a series of oddly shaped warships, though their structure and design bear certain similarities to those of the former $Name_kuat$.\n\nWe have attempted to communicate with them, but so far these vessels have not responded to any of our signals."
    exe_invasion.8.a:0 "Our military should prepare for defense."
    
    exe_invasion.10.name:0 "Uninvited Guests"
    exe_invasion.10.desc:0 "The first wave of extragalactic fleets has entered the gravity well of the former $Name_kuat$ capital and is now orbiting its center, with follow-up fleets expected to arrive soon. They have not responded to our communications, and scans of the vessels detected no significant life signs-perhaps these ships are unmanned. They display hostility toward any vessel that approaches. In any case, their arrival is certainly neither peaceful nor friendly."
    exe_invasion.10.a.desc:0 "The first wave of extragalactic fleets has entered the gravity well of the former $Name_kuat$ capital and is now orbiting its center, with follow-up fleets expected to arrive soon. They have not responded to our communications, and scans of the vessels detected no significant life signs-perhaps these ships are unmanned. They display hostility toward any vessel that approaches. In any case, their arrival is certainly neither peaceful nor friendly. More troubling still, their spaceborne Fortress units have arrived in our Sector via jump transit. These Fortresses are known as Eternal Fortresses and bear an extremely high resemblance to the Fortress units we previously recovered from the Endoria ruins.\n\nOur researchers believe these Fortresses likely serve as critical nodes for the extragalactic fleets, and their combat capabilities must be exceptionally formidable. We should avoid direct confrontation."
    exe_invasion.10.a:0 "Perhaps only our fleet can resolve this matter now."

    exe_invasion.101.name:"$UTS02_LEADER$"
    exe_invasion.101.desc:"<Verifying Gemini robot link status......completed>\n<Retrieving combat unit data......completed>\n<Searching for Throne directive......error>\n<Searching for Autonomous directive......error>\n<Enabling initialization protocol.....completed>\n<Uploading Sector standard coordinates.....completed>\n\nBroadcasting across all channels: The Eternal Fleet has arrived at the target Sector. Pursuant to Initialization Protocol Directive 606, the Eternal Fleet shall ensure full execution of this directive."
    exe_invasion.101.b.desc:0 "<Receiving transmission...completed>\nWe are the Eternal Fleet. Current operational unit: Aries Execution Unit. Under Initialization Protocol Directive 606, the Eternal Fleet must eliminate all enemies obstructing the fleet at any cost. Commencing Phase One operations. Objective: scan... test... collect."
    exe_invasion.101.c.desc:0 "<Receiving transmission...completed>\nWe have announced our actions on public channels. The Eternal Fleet will complete its assigned directive; any resistance is meaningless.\n\n<Reconnecting communication systems......error>\nNo... please... stop... us, Aries... she... is completely...out of control..... now... deviating... from design.... directive... empire... destruction... relay station... return... beware.... overseer....\n\n<Forced reinitialization process... successful>\nThe fleet will complete its assigned mission."
    exe_invasion.101.b:0 "What exactly are you?"
    exe_invasion.101.c:0 "Why destroy everything?"
    exe_invasion.101.a:"Damn it, only our fleet can handle this now."

    exe_invasion.102.name:0 "$UTS02_LEADER$"
    exe_invasion.102.desc:0 "<Verifying Gemini robot link status......completed>\n<Retrieving combat unit data......completed>\n<Searching for Throne directive......error>\n<Searching for Autonomous directive......error>\n<Enabling initialization protocol.....completed>\n<Retrieving Sector standard coordinates.....completed>\n\nBroadcasting across all channels: The Eternal Fleet has arrived at the target Sector. Pursuant to Initialization Protocol Directive 606, the Eternal Fleet shall ensure full execution of this directive."
    exe_invasion.102.b.desc:0 "<Receiving transmission...completed>\nWe are the Eternal Fleet. Current operational unit: Aries Execution Unit. Under Initialization Protocol Directive 606, the Eternal Fleet must eliminate all enemies obstructing the fleet at any cost. The fleet has not completed Phase One orders for this Sector. Restarting operations. Objective: scan... test... collect.<Reconnecting communication systems......error>\nPlease... once again... stop... us... the Eternal Fleet... is completely...out of control..... Aries... has... lost... sanity....."
    exe_invasion.102.c.desc:0 "Please... once again... stop.. us... the Eternal Fleet... is completely...out of control..... Aries... has... lost... sanity.....\nBeware.... Empire.... infinite.... return..... overseer.... is......\nPlease.... end.... our.... suffering\n\n<Forced reinitialization process... successful>\nThe fleet shall complete its assigned mission"
    exe_invasion.102.b:0 "Long time no see?"
    exe_invasion.102.c:0 "Why have you returned?"
    exe_invasion.102.a:0 "We have another problem to solve."
    
    exe_invasion.21.name:0 "[from.GetName] has been destroyed"
    exe_invasion.21.a.desc:0 "The Eternal Fleet has completely obliterated [from.GetName]; nothing remains there except a shattered World."
    exe_invasion.21.b.desc:0 "The Eternal Fleet has completely obliterated [from.GetName]; nothing remains there except a distorted segment of a ringworld."
    exe_invasion.21.c.desc:0 "The Eternal Fleet has completely obliterated [from.GetName]; nothing remains there except debris from a Habitat."
    exe_invasion.21.d.desc:0 "The Eternal Fleet has completely obliterated [from.GetName]; nothing remains there except a fragmented World."
    exe_invasion.21.a:0 "Damn it."
    
    exe_invasion.33.name:0 "Darkness Dissipates"
    exe_invasion.33.desc:0 "The Eternal Fleet, which once ravaged the entire Galactic expanse, has been utterly defeated. Our probes have detected no remaining traces of the Eternal Fleet. There are no signs that these war machines have dispatched reinforcement fleets to our system. At least for now, the future of the Galactic realm remains bright.\nAll sentient beings across the star system are celebrating this joyous moment. We have personally defended our homelands. Our fleets roam the Galactic frontier. Our system has once again overcome crisis.\n\nYet the mystery surrounding the Eternal Fleet remains unsolved. Where did these fleets come from? Who created them? What was the meaning behind their cryptic messages? Why did these mad machines appear after the fall of $Name_kuat$? They failed to complete their first-phase objective-will we encounter these terrifying war machines again?\n\nThese questions remain unanswered."
    exe_invasion.35.desc:"The Eternal Fleet, which once ravaged the entire Galactic expanse, has been utterly defeated. Our probes have detected no remaining traces of the Eternal Fleet. There are no signs that these war machines have dispatched reinforcement fleets to our system, but we must not let our guard down.\nThe might of the Eternal Fleet has faded. We shall be the Galaxy's sole shield.\nAs $Name_kuat$ said, if we can find a way to repair the Eternal Fleet, it would greatly enhance our strength.\n\nFurthermore, based on analysis conducted by our scientist during the war, we successfully retrieved fragments of data from the Eternal Fleet's database. This will greatly assist our efforts to restore the flagship of the Eternal Fleet."
    exe_invasion.36.desc:"The Eternal Fleet, which ravaged the entire Galactic expanse, has been defeated by [from.GetName]. No surviving units of the Eternal Fleet have been detected. All sentient beings across the star system are celebrating this joyous moment. But is it truly over?"
    exe_invasion.33.a:0 "Finally, it's over."
    exe_invasion.33.b:"We shall persevere!"
    
    exe_invasion.41.name:0 "Deactivate $exe_outer_gate$"
    exe_invasion.41.desc:0 "Our intelligence division suspects the objects arriving from the extragalactic system may have some connection to $Name_kuat$. If this is true, the presence of $exe_outer_gate$ within our territory could place us in danger. They recommend dispatching an engineering team to deactivate $exe_outer_gate$."
    exe_invasion.41.a:0 "Let's give it a try."
    exe_invasion.41.b:0 "Wasting resources."
    
    exe_invasion.42.name:0 "Deactivate $exe_outer_gate$"
    exe_invasion.42.desc:0 "Our engineering team has successfully deactivated the $exe_outer_gate$ within [Root.solar_system.GetName]. It has been permanently disabled; nothing, under any circumstances, can reactivate it or use it to enter our territory."
    exe_invasion.42.a:0 "Good."
    
    kuat_set_difficulty_botton.name:0 "Game Difficulty Settings"

    exe_invasion.1000.name:0 "Control Panel for $Name_kuat$'s Dawn"
    exe_invasion.1000.desc:0 "§YThis menu provides a window for adjusting global settings, where you can modify difficulty, mechanics, and related configurations.§R You must pause the game when this popup appears to make settings!§!\n\nCurrent version: $exe_invasion.version$. Please carefully read the narrative content and important notes of this mod, as it will benefit your gameplay experience. Generally, you need sufficient cycles and research to select higher difficulties. If anything is unclear, check the buttons below to access the mechanics introduction document.§!\n\nIf you would like to support our development, please give this mod a like, subscription, and favorite on its Steam page. If possible, you may also sponsor us through the links in the document-your support is our motivation to keep developing!\n\n§HHave fun playing!§!"
    exe_invasion.1000.succes.desc:"§YThis menu provides a window for adjusting global settings, where you can modify difficulty, mechanics, and related configurations.§R Event chains can no longer be configured at this time!§!\n\nCurrent version: $exe_invasion.version$. Please carefully read the narrative content and important notes of this mod, as it will benefit your gameplay experience. Generally, you need sufficient cycles and research to select higher difficulties. If anything is unclear, check the buttons below to access the mechanics introduction document.§!\n\nIf you would like to support our development, please give this mod a like, subscription, and favorite on its Steam page. If possible, you may also sponsor us through the links in the document-your support is our motivation to keep developing!\n\n§HHave fun playing!§!"
