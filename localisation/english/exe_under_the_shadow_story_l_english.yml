      ############################################
      kuat_missions.11.desc:0 "[Root.GetName]'s [Root.Species.GetName], you may have noticed various destabilizing events occurring recently in the galaxy... Hmm, perhaps not. Your technological level is insufficient to detect them, so we'll just state the conclusion.\n\nAccording to Article 11 of the Galactic Observation Edict, we require you to establish a colony on §H[kuat_mission_1_target_planet.GetName]§! with a certain number of Pops, so we can proceed with our next plan to prevent negative events. Are you willing to help us complete this task?\n\nThis will affect the Imperial Council's evaluation of you. Please treat it carefully."
      kuat_missions.12.desc:0 "[Root.GetName], we have detected a large number of your Pops on the target planet. You have done well."
      kuat_missions.13.desc:0 "[Root.GetName], we gave you ample preparation time, but we still have not detected a valid colony on the target planet. You will §Rpay the price§! for your failure."

      kuat_missions.21.desc:0 "[Root.GetName]'s [Root.Species.GetName], we have strong evidence indicating that [kuat_mission_2_target_country.GetName] is likely constructing weapons of mass destruction within their territory, intending to disrupt galactic peace. However, due to various reasons, we cannot directly obtain proof. Therefore, according to Article 19 of the Galactic Observation Edict, we require you to build a monitoring station in a star system connected to their territory via hyperlane, monitor their internal energy activity continuously for two months, and provide us with the data. Are you willing to help us complete this task?\n\nNote: The station must be personally constructed by you to ensure data authenticity. This will affect the Imperial Council's evaluation of you. Please treat it carefully."
      kuat_missions.24.desc:0 "[Root.GetName], based on the data you collected over two months, we confirm the target nation did not attempt to construct weapons of mass destruction within their territory. Monitoring can now cease. You have done well."
      kuat_missions.25.desc:0 "[Root.GetName], we gave you ample preparation time, but you still failed to provide us with five consecutive years of energy activity data from within the target nation. You will §Rpay the price§! for your failure."

      kuat_missions.31.desc:0 "[Root.GetName]'s [Root.Species.GetName], you must have noticed by now that the frequency of destabilizing events occurring in the galaxy is increasing. Even if you lack the means to detect these events, they are certainly not beneficial to you.\n\nAccording to Article 12 of the Galactic Observation Edict, we require you to establish a colony on §H[kuat_mission_3_target_planet.GetName]§! with a certain number of Pops, so we can proceed with our next plan to prevent negative events. Are you willing to help us complete this task?\n\nThis will affect the Imperial Council's evaluation of you. Please treat it carefully."
      kuat_missions.32.desc:0 "[Root.GetName], we have detected a large number of your Pops on the target planet. You have done well."
      kuat_missions.33.desc:0 "[Root.GetName], we gave you ample preparation time, but we still have not detected a valid colony on the target planet. You will §Rpay the price§! for your failure."

      kuat_missions.41.desc:0 "[Root.GetName]'s [Root.Species.GetName], you surely have already noticed that [kuat_mission_4_target_country.GetName] is a cancer threatening galactic peace. Their atrocities must now be stopped.\n\nSince we cannot intervene directly, according to Article 16 of the Galactic Observation Edict, we require you to launch an attack against [kuat_mission_4_target_country.GetName], capture their current capital §H[kuat_mission_4_target_planet.GetName]§!, and completely destroy their government. Are you willing to help us complete this task?\n\nNote: You must capture the enemy's planet rather than destroy it. This will affect the Imperial Council's evaluation of you. Please treat it carefully."
      kuat_missions.42.desc:0 "[Root.GetName], the target nation's government no longer exists. You have done well."
      kuat_missions.43.desc:0 "[Root.GetName], we have given you ample preparation time, but the target nation remains extremely defiant. You will pay the price for your failure."

      kuat_missions.51.desc:0 "[Root.Species.GetName] of [Root.GetName], we have observed that your government's ruling Ethic leans excessively toward violence. This is not beneficial for a young civilization like yours. For the future of your society and the entire galaxy, under Article 18 of the Galactic Observation Edict, we require you to shift your ruling Ethic to $ethic_fanatic_pacifist$. Will you take responsibility for your own future and that of the galaxy?"
      kuat_missions.52.desc:0 "[Root.GetName], your government has changed significantly since our last communication. Well done."
      kuat_missions.53.desc:0 "[Root.GetName], your barbaric government still shows no meaningful change to this day. It seems your civilization is beyond saving, yet you must still pay the price for your warmongering."

      kuat_missions.11.a.desc:"$kuat_missions.11.desc$\n\nThis will affect the Imperial Council's assessment of you-handle it with care.\n\nYou should cease serving $Name_Kuat_Fire_base$. They resort to any means necessary to achieve their goals. They may treat you well now, but once they achieve their objectives, they will discard you without hesitation."
      kuat_missions.21.a.desc:"$kuat_missions.21.desc$\n\nWe have already warned you once: you must stop serving $Name_Kuat_Fire_base$. They deceived the Endoria Empire once-they can deceive you twice."
      kuat_missions.31.a.desc:"$kuat_missions.31.desc$\n\nYou appear to still be working for $Name_Kuat_Fire_base$. They will eventually destroy you."
      kuat_missions.41.a.desc:"$kuat_missions.41.desc$\n\nOut of respect for your dedicated service, upon fulfilling our requirements, we will offer you a path forward. At that time, please cease providing valuable information to $Name_Kuat_Fire_base$."



