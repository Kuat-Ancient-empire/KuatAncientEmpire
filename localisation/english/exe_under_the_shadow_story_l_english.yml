    sc_kuat_white_hole.8.active:0 "Stellar Transmutation-[kuat_ded_white_hole_system_8.GetName]"
    sc_kuat_white_hole.8.active.desc:0 "Our astronomers have discovered that the central star in [kuat_ded_white_hole_system_8.GetName] has undergone a topological transformation. This type of star now exhibits a new matter ejection pattern; however, unlike previous discoveries, while this property still hinders further observation, it is relatively weaker. Our military intelligence department believes this stellar transmutation differs from prior cases and may originate from the influence of $Name_Kuat_DeD_Contractor$.\n\nWe might consider observing developments before acting."
