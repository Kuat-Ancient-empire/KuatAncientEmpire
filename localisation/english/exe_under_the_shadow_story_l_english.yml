    #################################
    kuat_starkiller.7.title:"Winter is coming"
    kuat_starkiller.7.desc:"Our unrestricted slaughter has provoked serious discontent among the nations of the galaxy. We are now opposed by the entire galaxy. All nations have abandoned their conflicts and suspicions, uniting together to stop our actions.\n\nThe road has narrowed, my friend."
    kuat_starkiller.7.a:"Bring it on"
    kuat_starkiller.10.title:"Victory"
    kuat_starkiller.10.desc:"Under our overwhelming offensive, those old-fashioned relics could not hold out. They destroyed part of the Star-killer's facilities before defeat, but they didn't have time to destroy everything. Therefore, we can repair this superweapon, which will play an important role in our future operations."
    kuat_starkiller.10.a:"Very good"
    kuat_starkiller.11.desc:"Coordinate Beacon Ship construction completed. This ship will guide the target acquisition for the Star-killer base. You only need to jump to the destination.\n\nNote: If the coordinate ship is destroyed, the system where it was destroyed will become the attack target and fire will be directed immediately. Have fun playing."
    kuat_starkiller.11.a:"I understand"
    kuat_starkiller.12.title:"§RWarning: Ship Limit Detection"
    kuat_starkiller.12.desc:"You have now built the maximum number of this type of ship allowed. Any excess ships will be deleted immediately!\n\nThis only controls the number of ships that fit the flagship mechanism type.\n\nThis message will not appear again."
    kuat_starkiller.12.a:"Got it"
    kuat_starkiller.13.title:"Coordinate Anchoring"
    kuat_starkiller.13.desc:"Our beacon has successfully reached its destination. All systems are within our strike range. Once the weapon fires, this place will vanish completely. Shall we anchor coordinates here?"
    kuat_starkiller.13.a:"That's it, blow them all to hell!"
    kuat_starkiller.13.b:"Wrong target, not here."



