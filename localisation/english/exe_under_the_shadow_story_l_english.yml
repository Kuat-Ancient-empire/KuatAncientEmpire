    kuat_fleet_calling.9.title:0 "Who is calling the fleet?"
    kuat_fleet_calling.9.desc:0 "The security fleet from $Name_Kuat_Fire_base$ has arrived via jump into [solar_system.GetName] and joined the combat formation, now fully under our command. These fleets will depart our star system after 360 days."
    kuat_fleet_calling.9.a:0 "Very good"
    kuat_fleet_calling.8.title:0 "Call ended"
    kuat_fleet_calling.8.desc:0 "The security fleet [this.GetName] from $Name_Kuat_Fire_base$ has now completed its agreement with us. They are no longer under our command and have left our star system"
    kuat_fleet_calling.8.a:0 "Wait!"
    kuat_fleet_jump_drive_support:0 "Jump"


    kuat_fallen_mission_reaction.1.desc:0 "We have learned that you may have accepted a commission from the [fallen_empire_kuat.GetName] and are attempting to spy on our confidential information. Be aware that the [fallen_empire_kuat.GetName] is orchestrating a massive conspiracy. Your actions are undoubtedly a betrayal of the entire galaxy. If you do not cease immediately, we will deliver a heavy blow against you."
    kuat_fallen_mission_reaction.1.accept:0 "We must accept."
    kuat_fallen_mission_reaction.1.refuse:0 "Do not interfere."
    kuat_fallen_mission_reaction.1.refuse.response:0 "Obstinate fools, you are merely tools of the [fallen_empire_kuat.GetName]. We will deliver a heavy blow against you."
    kuat_fallen_mission_reaction.2.desc:0 "You have broken your word. You previously made promises, yet still completed the [fallen_empire_kuat.GetName]'s commission. Based on your conduct, we will deliver a heavy blow against you."
    kuat_fallen_mission_reaction.2.refuse:0 "Do not interfere."
    kuat_fallen_mission_reaction.2.refuse.response:0 "We shall meet on the battlefield!"
    kuat_fallen_mission_reaction.3.desc:0 "The Sacred Seer has guided us. We understand that the [fallen_empire_kuat.GetName] has commissioned you to defile our holy sites. Beware, young civilization-accepting heresies will be your undoing. Behind the [fallen_empire_kuat.GetName] lies unpredictable darkness. Halt your steps and stay away from the [fallen_empire_kuat.GetName], or we will deliver a heavy blow against you."
    kuat_fallen_mission_reaction.3.accept:0 "We must accept."
    kuat_fallen_mission_reaction.3.refuse:0 "Do not interfere."
    kuat_fallen_mission_reaction.3.refuse.response:0 "How tragic. Is nothing capable of being stopped? We shall meet on the battlefield."
    kuat_fallen_mission_reaction.4.desc:0 "You gave your word but failed to uphold it. You have already contributed to the [fallen_empire_kuat.GetName]'s plans. Now you stand as traitors. We will deliver a heavy blow against you."
    kuat_fallen_mission_reaction.4.refuse:0 "Do not interfere."
    kuat_fallen_mission_reaction.4.refuse.response:0 "We shall meet on the battlefield!"
    kuat_fallen_mission_reaction.5.desc:0 "The Eternal Fleet has returned. These mad machines have descended upon this world once more. Long ago, they were unleashed by the Empire of Endordia. Now you repeat the same mistake.\n\nBe warned: these insane war machines care for nothing. You must destroy them completely, or the entire galaxy will perish.\n\nBased on our past experience, defeating them requires a starship known as a 'Star Dreadnought' serving as the flagship of your fleet. Do not venture into outer systems-no fleet can withstand the Eternal Fleet there."
    kuat_fallen_mission_reaction.5.accept:0 "We will prepare ourselves."
    kuat_fallen_mission_reaction.5.accept.response:0 "Remember, defeating them requires a Star Dreadnought as your fleet's flagship. Do not go to outer systems-no fleet can oppose the Eternal Fleet there."

    kuat_fallen_mission_reaction.18.desc:0 "Greetings, we are $Name_Kuat_Fire_base$. Our investigators have discovered that you are attempting scientific collaboration with the [fallen_empire_kuat.GetName]. We issue this necessary warning.\n\nThe [fallen_empire_kuat.GetName] is using you, turning you into their vanguard and cannon fodder.\n\nThis is a reenactment of the fable of the farmer and the snake. Once, a foolish civilization helped the [fallen_empire_kuat.GetName] complete its research, after which the [fallen_empire_kuat.GetName] destroyed the entire star system-the civilization vanished without even leaving dust. This research collaboration will drain your scientific capabilities and ultimately enable the rise of the [fallen_empire_kuat.GetName].\n\nThe research results involve forbidden technologies from the Eternal Fleet-something you should never have seen.\nFor the sake of galactic peace and stability, we advise that after obtaining the research results, you immediately submit all related documents to us. Under no circumstances should $Name_kuat$ acquire these. Otherwise, all will be lost.\n\nIf you make the right decision, simply withhold the data and upload it to our database."
    kuat_fallen_mission_reaction.18.apocalyptic.desc:"You have done very well. You have actually gained the trust of the [fallen_empire_kuat.GetName]. The Imperial Council is highly satisfied with you. Now we command you to complete $Name_kuat$'s mission and upload all research data to our database. This is an order. Here are these generous Imperial Credit Points.\n\nCurrent Imperial Credit Points: [Root.eternal_bornus_var]"
    kuat_fallen_mission_reaction.18.accept:0 "Betraying your benefactor?"
    kuat_fallen_mission_reaction.18.refuse:0 "WARNING: Source localization entry is incomplete"

    kuat_fallen_mission_reaction.17.desc:0 "Very good. The final research project is nearly complete. Do not worry-this will be the last one. The day of harvest for our cooperation is near."
    kuat_fallen_mission_reaction.16.desc:0 "New research project files have been uploaded to your data center. Please continue completing these projects as before."
    kuat_fallen_mission_reaction.15.desc:0 "Very good. New research project files have been uploaded to your data center. Please continue completing these projects as before."
    kuat_fallen_mission_reaction.14.desc:0 "Very good. Let us continue striving. New research project files have been uploaded to your data center. Please continue completing these projects as before."
    kuat_fallen_mission_reaction.13.desc:0 "Unexpectedly, you have succeeded once again. Only a few remain. This bloodless war is nearing its end. Please continue completing these projects as before."
    kuat_fallen_mission_reaction.12.desc:0 "Very good. Your actions please me deeply. You have proven that our cooperation was a wise choice. Although research must continue and you must still commit many scientists, we have decided to grant you generous rewards.\n\nThese ship technologies will help you stabilize your situation. We hope you can persevere."
    kuat_fallen_mission_reaction.11.desc:0 "Greetings. We have transmitted to you the research project you are now required to complete. This project will be recorded in your evaluation opinion process. We emphasize again: this information must not be transferred to anyone. We hope you will once again uphold your promise."
    kuat_fallen_mission_reaction.10.desc:0 "Greetings. We have transmitted to you the research project you are now required to complete. This project will be recorded in your evaluation opinion process. We emphasize again: this information must not be transferred to anyone. We hope you will once again uphold your promise."
    kuat_fallen_mission_reaction.9.desc:0 "Given your recent excellent performance, we are now advancing the joint research program. We have transmitted to you the research project you are now required to complete. This project will be recorded in your evaluation opinion process. We emphasize again: this information must not be transferred to anyone.\n\nAdditionally, through multiple prior evaluations, we have observed your responsible actions. Therefore, we will transfer partial control of certain star systems to you."
    kuat_fallen_mission_reaction.8.desc:0 "Given your recent excellent performance, we are now advancing the joint research program. We have transmitted to you the research project you are now required to complete. This project will be recorded in your evaluation opinion process. We emphasize again: this information must not be transferred to anyone."
    kuat_fallen_mission_reaction.7.desc:0 "Given your recent excellent performance, we are now advancing the joint research program. We have transmitted to you the research project you are now required to complete. This project will be recorded in your evaluation opinion process. We emphasize again: this information must not be transferred to anyone."
    kuat_fallen_mission_reaction.6.desc:0 "Given your recent excellent performance, we are now advancing the joint research program. We have transmitted to you the research project you are now required to complete. This project will be recorded in your evaluation opinion process. Remember: this information must not be transferred to anyone."

    kuat_fallen_mission_reaction.accept:0 "We will complete it."
    kuat_fallen_mission_reaction.accept.response:0 "Then, we await your good news."
    kuat_fallen_mission_reaction.area_d_option:0 "Thank you greatly for your generosity. We will certainly strive to complete our tasks."
    kuat_fallen_mission_reaction.area_d_option.response:0 "These star systems are the legacy of the former Empire of Endordia. Now, they deserve a new master."
    kuat_fallen_mission_reaction.ship_option:0 "Thank you greatly for your generosity. We will certainly strive to complete our tasks."
    kuat_fallen_mission_reaction.ship_option.respon:0 "These ship technologies are blueprints for naval vessel designs soon to be retired by our empire. They should prove highly useful in your hands."


    kuat_fallen_mission_reaction.19.1.desc:0 "We have completed $kuat_fallen_mission_reaction_6_project$. During the research, our scientist discovered $kuat_fallen_mission_reaction_6.poject_desc$\n\nHowever, no further findings have emerged. What should we do next?"
    kuat_fallen_mission_reaction.19.2.desc:0 "We have completed the $kuat_fallen_mission_reaction_7_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_7.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.3.desc:0 "We have completed the $kuat_fallen_mission_reaction_8_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_8.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.4.desc:0 "We have completed the $kuat_fallen_mission_reaction_9_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_9.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.5.desc:0 "We have completed the $kuat_fallen_mission_reaction_10_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_10.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.6.desc:0 "We have completed the $kuat_fallen_mission_reaction_11_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_11.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.7.desc:0 "We have completed the $kuat_fallen_mission_reaction_12_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_12.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.8.desc:0 "We have completed the $kuat_fallen_mission_reaction_13_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_13.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.9.desc:0 "We have completed the $kuat_fallen_mission_reaction_14_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_14.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.10.desc:0 "We have completed the $kuat_fallen_mission_reaction_15_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_15.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.11.desc:0 "We have completed the $kuat_fallen_mission_reaction_16_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_16.poject_desc$\n\nHowever, no further discoveries have been made so far. What should we do next?"
    kuat_fallen_mission_reaction.19.12.desc:0 "We have completed the $kuat_fallen_mission_reaction_17_project$, and during the research process, our scientist discovered $kuat_fallen_mission_reaction_17.poject_desc$\n\nWe have now completed all projects. We can now confirm that $Name_kuat$ is gathering this information for use in combat against the Eternal Fleet. Furthermore, the technology of the Eternal Fleet possesses extremely high Complexity. Multiple factions have already sought access to this technological data. We should consider how to handle these technologies."

    kuat_fallen_mission_reaction_6.poject_name:0 "$kuat_fallen_mission_reaction_6_project$"
    kuat_fallen_mission_reaction_6.poject_desc:0 "Judging from the basic structure of this weapon turret, its internal primary structure closely resembles our existing ultraviolet lasers and similar weapons, but operates at energy levels far exceeding them. However, other components are more complex. The high-energy laser beam generated at the upper stage is then guided through a stream of gas we currently cannot comprehend.\n\nFollowing an unknown reaction, a dense plasma beam is emitted."
    kuat_fallen_mission_reaction_7.poject_name:0 "$kuat_fallen_mission_reaction_7_project$"
    kuat_fallen_mission_reaction_7.poject_desc:0 "This is an extremely rare substance-an radioactive isotope of a fuel called Illerium. Preliminary studies on the sample provided by $Name_kuat$ indicate that this material exerts powerful distortions on gravitational and electromagnetic fields. It remains relatively stable under normal conditions, but when bombarded with particles under specific conditions, it releases enormous amounts of energy.\n\nOur research department speculates that just one microgram of this isotope could generate enough power to operate a datapad at maximum load for an entire century."
    kuat_fallen_mission_reaction_8.poject_name:0 "$kuat_fallen_mission_reaction_8_project$"
    kuat_fallen_mission_reaction_8.poject_desc:0 "This weapon is designed to connect directly to the ship's reactor core, appearing to be an extremely energy-intensive system-our reactors are entirely incapable of supporting its power demands. It resembles a naval weapon we previously examined, but this weapon's excitation laser sustains power over time, generating longer and more intense particle beams. These beams then pass through an intricately designed focusing apparatus and particle acceleration track, resulting in significantly greater destructive power. It is speculated that its firepower is sufficient to destroy any known vessel in a single strike.\n\nAccording to Force-sensitive individuals among us, the focusing device likely contains large Kyber crystals."
    kuat_fallen_mission_reaction_9.poject_name:0 "$kuat_fallen_mission_reaction_9_project$"
    kuat_fallen_mission_reaction_9.poject_desc:0 "$Name_kuat$ has delivered to us a computational network unlike anything we've seen before, requesting that we study it and deliver our findings back to them. It uses advanced signal transmission and reception systems to turn every ship in a fleet into a computing node, and even multiple node clusters across different fleets can form new Ascended computational networks.\n\nThis advanced distributed computing architecture can support terrifying computational and storage demands. We do not yet know what kind of system would require such immense processing power. We attempted further reverse engineering, but clearly, our current technology and hardware are completely unable to reconstruct this system."
    kuat_fallen_mission_reaction_10.poject_name:0 "$kuat_fallen_mission_reaction_10_project$"
    kuat_fallen_mission_reaction_10.poject_desc:0 "This system is similar to the special interference system used by $Name_kuat$, but appears to be more powerful in terms of output. It employs special methods to enhance shield and armor efficiency while reducing enemy weapon power, though $Name_kuat$'s Star Dreadnoughts can partially resist its effects.\n\nOur Force-sensitive members sensed that this technology contains elements of Dark Side Force techniques, making replication impossible for us."
    kuat_fallen_mission_reaction_11.poject_name:0 "$kuat_fallen_mission_reaction_11_project$"
    kuat_fallen_mission_reaction_11.poject_desc:0 "Based on the technical data we discovered and that provided by $Name_kuat$, this should be a communications beacon component from a massive Star Fortress, capable of emitting tachyon signals for long-range communication, but requiring certain [errors] to amplify the signal for intergalactic transmission.\n\nAdditionally, according to the data, when synchronized with error....error.... station and the Eternal...error...fleet, it can project a support field affecting an entire star system, preventing destruction of fleets within."
    kuat_fallen_mission_reaction_12.poject_name:0 "$kuat_fallen_mission_reaction_12_project$"
    kuat_fallen_mission_reaction_12.poject_desc:0 "This is a reactor that annihilates a type of exotic matter fuel, creating a miniature star within the reaction chamber to generate power. Unlike conventional exotic matter reactors, this reactor consumes the fuel directly, whereas standard versions extract extradimensional falling exotic matter from the fuel, making this version far more efficient and higher in energy output.\n\nSome key materials and components are beyond our production capabilities and were directly supplied by $Name_kuat$, so we cannot manufacture it independently."
    kuat_fallen_mission_reaction_13.poject_name:0 "$kuat_fallen_mission_reaction_13_project$"
    kuat_fallen_mission_reaction_13.poject_desc:0 "Unlike the typical style of $Name_kuat$, this vessel is entirely black and shaped like a horizontal T, though the front crossbar makes it resemble a cross, with engines at the rear. Its main guns are mounted on the front crossbar, and the turrets can rotate flexibly. The propulsion system is highly advanced, significantly faster than ours, and equipped with a cloaking generator.\n\nIts shape and energy signature resemble certain vessels once fought by the Endorian Empire. Perhaps what $Name_kuat$ has us studying is extraordinary..."
    kuat_fallen_mission_reaction_14.poject_name:0 "$kuat_fallen_mission_reaction_14_project$"
    kuat_fallen_mission_reaction_14.poject_desc:0 "Based on the data provided by $Name_kuat$ and information we have uncovered... this may be an artificial intelligence designed as a fleet command system by a superpower known as the Infinite Empire, created in desperation to save their civilization from some plague. Allegedly, it was constructed at the cost of the life force of several species and several Worlds.\n\nAt the same time, archaeological records suggest the Infinite Empire was ultimately destroyed due to rebellion by this AI and its automated war fleets. The truth is chilling... Could they be researching the very strange fleets once opposed by the Endorian Empire?"
    kuat_fallen_mission_reaction_15.poject_name:0 "$kuat_fallen_mission_reaction_15_project$"
    kuat_fallen_mission_reaction_15.poject_desc:0 "This massive war Fortress bears a strange resemblance to fortresses we have built and certain facilities belonging to $Name_kuat$, yet its subsystems and armaments appear even more powerful.\n\nCombat records from the Endorian Empire's engagements with extragalactic drone fleets indicate these fortresses once appeared on battlefields, providing support for automated fleets. According to our research on Star communication beacons, these fortresses are responsible for continuously supplying fleets during invasions unless three special facilities are deactivated. It seems unclear exactly what $Name_kuat$ is having us study..."
    kuat_fallen_mission_reaction_16.poject_name:0 "$kuat_fallen_mission_reaction_16_project$"
    kuat_fallen_mission_reaction_16.poject_desc:0 "$Name_kuat$ informed us that certain new designs require more energy. Out of apparent trust and friendly gesture toward us, they chose to entrust us with this energy regulation component for research. Considering the previous series of clues, we can roughly deduce what $Name_kuat$ is researching. However, now might not be the time to confront them openly.\n\nThis device aims to optimize reactor output and reduce ship energy consumption. One wonders-what kind of high-energy-consuming system would necessitate developing such a device?"
    kuat_fallen_mission_reaction_17.poject_name:0 "$kuat_fallen_mission_reaction_17_project$"
    kuat_fallen_mission_reaction_17.poject_desc:0 "Similar to $Name_kuat$'s Star Dreadnoughts, this vessel serves as a flagship and possesses certain anti-interference capabilities. However, differing from $Name_kuat$'s Super Star Destroyer design philosophy, this ship mounts only four of the previously studied superlasers, seemingly intended for long-range bombardment.\n\nAdditionally, Endorian combat logs mention appearances of this class of vessel, often operating alongside Battlecruisers from the automated fleets. Thus, what $Name_kuat$ is having us assist in researching becomes self-evident..."

    kuat_fallen_mission_reaction.19.a:0 "Save data and continue research."
    kuat_fallen_mission_reaction.19.b:0 "Upload to $Name_kuat$."
    kuat_fallen_mission_reaction.19.c:0 "Upload to $Name_Kuat_Fire_base$."

    kuat_fallen_mission_reaction_6_project:0 "§ERoutine Weapon Research"
    kuat_fallen_mission_reaction_6_project_DESC:"This appears to be a design similar to the turbolasers used by $Name_kuat$, but operating at a higher energy level. $Name_kuat$ has also provided us with relevant data on the associated gases, hoping we can assist in researching this project."
    kuat_fallen_mission_reaction_7_project:0 "§ESpecial Isotope"
    kuat_fallen_mission_reaction_7_project_DESC:"An exotic matter fuel with extremely high energy density. $Name_kuat$ is only willing to disclose that it is a certain isotope of Illerium. Since $Name_kuat$'s research department has more pressing matters, they have commissioned us to study it."
    kuat_fallen_mission_reaction_8_project:0 "§EHeavy Anti-Ship Weapon"
    kuat_fallen_mission_reaction_8_project_DESC:"A highly destructive anti-ship weapon that appears to require a reactor powered by a substance we have previously handled to meet its energy demands. $Name_kuat$ has delivered a prototype to us, hoping we can refine it."
    kuat_fallen_mission_reaction_9_project:0 "§EAdvanced Computing Network"
    kuat_fallen_mission_reaction_9_project_DESC:"An advanced distributed computing network based on shipboard computers, capable of supporting unimaginable computational loads. $Name_kuat$ has provided us with related data and hopes we can assist in researching this project."
    kuat_fallen_mission_reaction_10_project:0 "§ECounter-Protection System"
    kuat_fallen_mission_reaction_10_project_DESC:"A special counter-protection system capable of effectively enhancing fleet combat and defense efficiency. $Name_kuat$ has provided us with related data and hopes we can assist in researching this project."
    kuat_fallen_mission_reaction_11_project:0 "§EStar Communication Beacon"
    kuat_fallen_mission_reaction_11_project_DESC:"A multifunctional communication beacon component, massive in size and energy consumption, only suitable for installation on enormous space stations. $Name_kuat$ has provided us with related data and hopes we can assist in researching this project."
    kuat_fallen_mission_reaction_12_project:0 "§EExotic Matter Reactor"
    kuat_fallen_mission_reaction_12_project_DESC:"An advanced reactor with extremely high efficiency, but we lack the capability to produce it independently. $Name_kuat$ has provided us with related data and hopes we can assist in researching this project."
    kuat_fallen_mission_reaction_13_project:0 "§E New Ship Design"
    kuat_fallen_mission_reaction_13_project_DESC:"A peculiar-looking Battlecruiser, though its energy signature and other aspects look very familiar... $Name_kuat$ has also handed over the related data to us, hoping we can assist in researching this project."
    kuat_fallen_mission_reaction_14_project:0 "§E Command Artificial Intelligence"
    kuat_fallen_mission_reaction_14_project_DESC:"This might be the dark sin of some past empire-they built this AI system to prolong their brutal rule, but for some reason $Name_kuat$ is studying it... $Name_kuat$ has also handed over the related data to us, hoping we can assist in researching this project."
    kuat_fallen_mission_reaction_15_project:0 "§E Intelligent Combat Fortress"
    kuat_fallen_mission_reaction_15_project_DESC:"A powerful war fortress, seemingly capable of supporting fleet operations, and appears somewhat similar to our own Eternal Fortress. $Name_kuat$ has also handed over the related data to us, hoping we can assist in researching this project."
    kuat_fallen_mission_reaction_16_project:0 "§E Energy Regulation Network"
    kuat_fallen_mission_reaction_16_project_DESC:"An energy regulation network designed for use with massive warships, capable of optimizing reactor output. $Name_kuat$ has also handed over the related data to us, hoping we can assist in researching this project."
    kuat_fallen_mission_reaction_17_project:0 "§E Flagship Fleet Unit"
    kuat_fallen_mission_reaction_17_project_DESC:"A flagship-class combat unit, equipped with only four high-energy weapons, and they seem strangely familiar. $Name_kuat$ has also handed over the related data to us, hoping we can assist in researching this project."



    kuat_fallen_mission_reaction.20.A.desc:0 "Very well, your actions have proven we made the right choice. This farce can finally end-henceforth, all shadows from the old empire shall vanish into oblivion.\n\nOur investigators have learned that you've completed most of the assigned research projects and integrated these technologies. Now it's time to compile the documentation and deliver it to our technical division.\n\nWe sincerely thank you for your help. From now on, the relay stations will reactivate; they will become the final barrier protecting your galaxy from incursions by the Eternal Fleet. These technologies are yours as a gift."
    kuat_fallen_mission_reaction.20.B.desc:0 "Very well, although the data you submitted is quite fragmented, it will still help us complete the final integration of technological applications.\n\nYour actions have proven our cooperation was the right choice. Now it is time for us to depart. We must return to the core Sector to carry out our ultimate plan. Before we leave, we have already reactivated the relay stations surrounding this current star region. These stations will protect your galaxy from harassment by the Eternal Fleet."
    kuat_fallen_mission_reaction.20.C.desc:0 "No, you haven't obtained much valuable research outcome. Sigh, perhaps we overestimated you. These technologies from the Eternal Fleet may indeed be beyond your comprehension. Regardless, it's over now. Without complete data, we can no longer afford the time to protect your Sector.\n\nAfter we leave, attacks from the Eternal Fleet will proceed unimpeded. Good luck to you."
    kuat_fallen_mission_reaction.20.D.desc:0 "Unfortunately, you have produced no meaningful results. Perhaps we did overestimate you, but do not worry-we will remain here, continuing to protect this Sector from harassment by the Eternal Fleet."

    kuat_fallen_mission_reaction.20.A:0 "Pleasure doing business. Wishing you good fortune."
    kuat_fallen_mission_reaction.20.A.respon:0 "Pleasure doing business! You've made a wise choice. After our departure, our base will belong to you.\n\nAdditionally, $Name_Kuat_Fire_base$ will not back down easily. We cannot predict what they'll do next, but we once discovered a strange black hole-like planet in a star system abandoned by $Name_Kuat_Fire_base$. When our researchers attempted further investigation, the entire Sector suddenly vanished. We cannot confirm whether this is linked to $Name_Kuat_Fire_base$, so you must remain vigilant.\n\nOur shipyards will continue to provide you with essential support. The true storm is coming."

    kuat_fallen_mission_reaction.20.B:0 "Pleasure doing business. Until we meet again."
    kuat_fallen_mission_reaction.20.B.respon:0 "Regardless, we deeply appreciate your cooperation."

    kuat_fallen_mission_reaction.20.C:0 "There's nothing else we could do."
    kuat_fallen_mission_reaction.20.C.respon:0 "Regardless, we greatly appreciate your past assistance-even though you deceived us and handed the data over to $Name_Kuat_Fire_base$. Cooperating with $Name_Kuat_Fire_base$ is like making a deal with a tiger. Now there's no turning back-struggle on as best you can."

    kuat_fallen_mission_reaction.20.D:0 "We've done our best."
    kuat_fallen_mission_reaction.20.D.respon:0 "We understand-perhaps this is all you could achieve. Regardless, we deeply appreciate your cooperation."

    kuat_fallen_mission_reaction.21.desc:0 "$Name_kuat$ is about to leave your Sector. From now on, we will no longer interfere in any of your affairs. Furthermore, the relay station signals have been adjusted to shield mode, which will block the Eternal Fleet from acquiring data on your galaxy. Once we complete our final data integration, you will no longer need the relay stations-the Eternal Fleet will sleep forever in the deep void.\n\nWe greatly appreciate that you did not listen to $Name_Kuat_Fire_base$. Those rats in the sewers will pay for their actions! As a reward, these outdated technologies now belong to you.\n\n$Name_Kuat_Fire_base$ will not back down easily. We cannot predict their next move, but we once discovered a strange black hole-like planet in a star system abandoned by $Name_Kuat_Fire_base$. When our researchers attempted further investigation, the entire Sector suddenly disappeared. We cannot confirm whether this is linked to $Name_Kuat_Fire_base$, so you must remain vigilant."
    kuat_fallen_mission_reaction.21.accept:0 "Until we meet again!\n\n§R Event chain 'Under the Shadows' has concluded entirely.§!"

    kuat_fallen_mission_reaction.22.desc:0 "This is $Name_Kuat_Fire_base$. You've made a very correct decision. Together, we have ultimately thwarted $Name_kuat$'s conspiracy. $Name_kuat$ will have to leave this Sector, and once they're gone, so shall we. As a reward, this Sector is now yours to command.\n\nMoreover, we must warn you: $Name_kuat$ will not back down easily. Their actions against the Eternal Fleet will never cease. $Name_kuat$ is likely to retaliate soon. Based on our previous investigations, multiple relay stations belonging to $Name_kuat$ lie hidden within this Sector. These stations were originally critical facilities protecting $Name_kuat$'s bases. Now that $Name_kuat$ is withdrawing, these relay stations may instead transmit the location of this system, triggering an invasion by the Eternal Fleet. You must prepare accordingly. Our agreement ends here. Until we meet again!"
    kuat_fallen_mission_reaction.22.accept:0 "Don't let the door hit you on the way out!"

    kuat_fallen_mission_reaction.23.desc:0 "Unfortunately, you have demonstrated no value whatsoever. Perhaps choosing you was a mistake. In any case, everything has now ended. We will assign you no further tasks, but we will still protect your World-you need not fear the Eternal Fleet. Consider these resources your due compensation."
    kuat_fallen_mission_reaction.23.accept:0 "You should leave this place!"


