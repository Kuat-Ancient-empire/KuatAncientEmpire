    exe_invasion.141.name:"Ghost Signal"
    exe_invasion.141.desc:"§EEternal Fleet§! has successfully completed genetic and biological research on our admiral [eternal_learned_leader_copy.GetName] after prolonged combat. §EEternal Fleet§! has successfully cloned our [eternal_learned_leader_copy.GetName] using synthetic mechanical technology aboard their fleet. Now our [eternal_learned_leader_copy.GetName] must face and defeat themselves."
    exe_invasion.141.a:"Truly terrifying technology."
    exe_invasion.141.b:"Understood, say no more."
    kuat_fleet_suppilyment_reloaded:"§ELoading Complete§!"
    kuat_fleet_suppilyment_reloaded_desc:"$KUAT_FLEET_NAME$ has completed loading. The fleet is now capable of engaging in non-supply zones.\n\nNote: Non-supply zone engagements are limited to 4 times. Each engagement consumes large amounts of ammunition, reducing fleet combat effectiveness by 1/4."
    kuat_fleet_suppilyment_lacked:"§RInsufficient Supplies§!"
    kuat_fleet_suppilyment_lacked_desc:"$KUAT_FLEET_NAME$ is operating in a star system lacking supplies. The commander has withdrawn the fleet to $KUAT_CAPITAL_NAME$.\n\nNote: Damage from lack of supplies will be reduced by 99%. For operational effectiveness, the fleet will retreat."
    kuat_find_memory_cluds:"§EDiscovered new story clue§!"
    kuat_find_memory_cluds_desc:"We have discovered a new story clue aboard $KUAT_FLEET_NAME$. Please check intelligence records for details."

    awaken_ship:"Revival Initiative"
    being_kuat:"$awaken_ship$"
    opinion_mutual_threat_kuat:"$opinion_mutual_threat$"
    exe_kuat_return.2.name:"Intense energy fluctuations in star system"
    exe_kuat_return.2.desc:"The latest report from our Imperial Stellar Security Monitoring Department indicates intense energy activity in the former $Name_kuat$ star system following our victory over the fearsome Eternal Fleet. According to our researchers' analysis, this appears to be caused by special resonance from tachyon signals. Although the $Name_kuat$ star system lies in ruins, the frequency feedback from the tachyon signals continues to rise over time-something may happen here in the near future.\n\nOur scientists believe this might simply be an ordinary §Ysupernova§! explosion or just unusual fleet signals. Nevertheless, we must continue monitoring and remain prepared; we cannot afford complacency."
    exe_kuat_return.2.a:"I hope this isn't true."
    exe_kuat_return.4.name:"Sector Anomaly"
    exe_kuat_return.4.desc:"After years of observation, we have detected frequent spatial fluctuations and jump preparation signals in the Unterraum surrounding the $Name_kuat$ star system since our defeat of the Eternal Fleet. Our researchers believe the Unterraum around the system has been affected by immense energy, resulting in extreme instability. Reports from our monitoring stations also confirm strange changes within the $Name_kuat$ Sector, with energy activity increasing throughout the entire stellar region.\nIf we do not quickly evacuate our fleets and people from $Name_kuat$, they may face unforeseen §Rdangers§!."
    exe_kuat_return.4.a:"Understood."
    exe_kuat_return.6.name:"Lightning-Fast Return"
    exe_kuat_return.6.desc:"Security reports are accurate and valid. The ruins of the $Name_kuat$ Sector have mysteriously regained their former vitality, as if time had reversed-planets once reduced to rubble have been restored to their original states. The transformation of the $Name_kuat$ Sector has drawn attention across the Empire and throughout the galaxy. We must proceed with caution.\n\nAccording to our scientists' reports, we can no longer receive any signals or communications from the $Name_kuat$ Sector. Gateway jumps are disrupted by unknown tachyon signals, preventing us from entering the $Name_kuat$ Sector via Gateway."
    exe_kuat_return.6.a:"Disturbing information."
    exe_kuat_return.8.title:"Revival"
    exe_kuat_return.8.desc:"Foolish attackers, driven by your greedy and ignorant desires, you have reached into places you should never have touched. You have no idea what you are facing. It's surprising the Eternal Fleet did not destroy you.\n\nBut it doesn't matter. We shall return this sector to an age of peace and stability.\nUnder Galactic Observation Law Article 66, we will reset your empire and your existence. Though you shall perish, we will allow a seed to remain-one that will forever remember your mistakes, passing down your sins through generations in reverence and fear of us.\nFinally, the entire galaxy shall return to an era undisturbed by the Eternal Fleet."
    exe_kuat_return.8.a:"We destroyed you once-we can destroy you twice!"
    exe_kuat_return.10.title:"Gateway Decryption Complete"
    exe_kuat_return.10.desc:"Our scientists, while monitoring energy anomalies in the $Name_kuat$ Sector, discovered that periodic tachyon signal reactions appear closely linked to the $Name_kuat$ Gateway. The cyclical nature of these tachyon signals has restabilized the $Name_kuat$ jump Gateway. We can now pass through directly."
    exe_kuat_return.10.a:"This is truly good news."
    exe_kuat_return.11.title:"Galactic Guardian Federation"
    exe_kuat_return.11.desc:"The empire is filled with tension and panic due to $Name_kuat$'s declaration. Our war against the Eternal Fleet has already consumed vast resources and manpower; if we now wage war on $Name_kuat$, we may not be able to stand against them. Perhaps we can negotiate with other nations to establish a Galactic Federation, uniting the entire galaxy to destroy $Name_kuat$.\n\nSo, how shall we choose?"
    exe_kuat_return.11.a:"People of the universe, unite!"
    exe_kuat_return.11.b:"They will all bow before us!"
    exe_kuat_return.11.c:"This is our destiny, and we shall face it alone!"
    exe_kuat_return.13.title:"Alliance Formed"
    exe_kuat_return.17.title:"Going It Alone"
    exe_kuat_return.13.desc:"$Name_kuat$ has learned of our intent to form a federation and swiftly issued a warning to the entire cosmos. War is near. Under the terrifying shadow of this threat, both warring civilizations and peaceful empires alike have agreed to join this pan-galactic defensive alliance. We shall stand together and resist the invaders.\n\nPeace will eventually come."
    exe_kuat_return.131.desc:"Our choice has angered and frightened other nations. $Name_kuat$ has announced our crimes across the galaxy and formed a galactic federal empire, preparing to fight us to the death!"
    exe_kuat_return.17.desc:"We shall declare war on [return_kuat_awakening_country.GetName]. This war will end here!\n\nWarning: We must prioritize destroying $Name_kuat$'s shipyards!"
    exe_kuat_return.13.a:"Come, let us #italic fight to the death§!."
    exe_kuat_return.13.a.tooltip:"#RWe shall declare war on $Name_kuat$§!."
    exe_kuat_return.16.title:"Truth"
    exe_kuat_return.16.desc:"We have once again defeated $Name_kuat$. The invaders will finally pay for their actions, and the secrets of the Eternal Fleet will be buried alongside $Name_kuat$ in this nameless star system they regarded as dust........\nOnce again, victory proves our greatness. Our heroic image is etched into the hearts of every sentient species. They will pass down our story from generation to generation, until even the longest-lived stars in the universe fade away.\n\nIt is time to collect our spoils! The Stellar Assembly is now operational."
    exe_kuat_return.16.a:"#GEverything has finally ended§!."
    exe_kuat_return.16.b:"#RWe should continue investigating§!."
    exe_kuat_return.162.title:"$Name_kuat$"
    exe_kuat_return.162.desc:"Long time no see, honorable [root.GetRulerTitle]. We're old acquaintances now, so there's no need for pointless pleasantries. Your foolish ambition has blinded you. Do you really think these fleets are enough to defeat us? You've merely given the Eternal Fleet an opportunity to enter this Sector. The Imperial Government has approved our final phase of the plan. Perhaps we should thank you for your foolish actions. In your final moments, is there anything you'd like to know?"
    exe_kuat_return.162.fdesc:"Esteemed [root.GetRulerTitle], do you still have any doubts?"
    exe_kuat_return.162.a:"What exactly is the Eternal Fleet?"
    exe_kuat_return.162.a.resp:"The Eternal Fleet? That's quite an interesting topic. As you can see, the Eternal Fleet is currently ravaging this galaxy. We shall give you the answer to this war.\n\nThe Eternal Fleet, like us, does not belong to this Sector. We came for eternity, and we shall leave only for eternity. We do not fully know the origins of the Eternal Fleet. Our former Emperor brought back a massive automated combat system from an unknown Sector, which he named 'Eternity'.\n\nThe fleet equipped with this fully automated combat system obeyed only the Emperor, unless the Emperor perished. But reality is so ironic-despite possessing immense Strength, he could not escape fate's decree. During our civil war, the Emperor and his throne vanished forever within the energy of a warship reactor, and chaos began. It took the Imperial Government a long time to reorganize after its collapse, allowing the Eternal Fleet to break free from imperial control.\n\nAlthough the Empire can no longer command the Eternal Fleet, these remnants were never significant enough to warrant serious attention from the new government. We have completely mastered the technology of the Eternal Fleet, rendering their existence valueless. These rogue fleets are merely a tiresome farce to us and the Empire-but a disaster to you. The troubles caused by these fleets, composed of Iokas' ancient AI systems, must be ended. And you shall be our perfect pawn to conclude this farce of a bygone era."
    exe_kuat_return.162.b:"What truly happened in the past?"
    exe_kuat_return.162.b.resp:"The past? What has been done will be done again, and what will be done has already been done. Are not the past, present, and future but a single, unified cycle?\n\nThis region was once ruled by an ancient civilization composed of numerous native species. They possessed a glorious culture, fleets that blotted out the skies, and technology capable of self-destruction-much like your divinely favored civilizations today. Yet ultimately, they were corrupted by power and desire. These ancient civilizations began researching psionics, delving into the so-called Shroud. These irrational desires ultimately brought about their downfall. Though initially they successfully resisted the Shroud's influence, in the end, they fell to their own hands.\n\nIn truth, they were nothing more than crabs in a basket, focused only on fighting each other while ignoring the real threat. The shadow of the Eternal Fleet loomed over this place until we brought light, stability, and prosperity to the entire galaxy. After the fall of the ancient civilization, we established outposts and supply stations here. In exchange for our protection, the natives had to pay for our supplies. It was a fair transaction-after all, even life itself is a gift bestowed upon the weak by the strong.\n\nUnfortunately, the game of power and desire repeated itself, once again clouding their vision and making them forget their place. The Endordia Empire brazenly launched a shameless invasion against us. Though they were doomed to perish, our merciful council still granted them pity-the spark of Endordia was allowed to survive.\n\nAs I said before, what has been done will be done again. This region continually spawns challengers. We have grown weary of this tiresome game, so we intend to stage a grand performance. You have successfully helped us set the stage for this final act.\n\nWe grant you the honor of being the opening fireworks of this show. You shall become fertilizer and legacy for future civilizations, offering your insignificant lives to help reboot this Sector."
    exe_kuat_return.162.c:"Why haven't you completely eliminated the Eternal Fleet after all these years?"
    exe_kuat_return.162.c.resp:"The Eternal Fleet constantly wanders. We see no reason to waste time and effort chasing them-we simply wait for them to walk into our trap. After all, our time is far more precious than yours. We must be clever, mustn't we?\nThus, we thank you once more for your foolishness. We shall reward you with a fireworks display. Take your ambitions and depart."
    exe_kuat_return.162.d:"What exactly are you trying to do?"
    exe_kuat_return.162.d.resp:"The Imperial Government has ordered us to completely destroy the Eternal Fleet. But clearly, after millennia of war attrition, you natives have grown increasingly insolent.\n\nAs your technology recovers and advances, we must now face not only the Eternal Fleet but also foolish challengers among you. While Eternal Fleets in other regions have already been eradicated, our progress here has disappointed the Imperial Government-all because of you, lowly native species. We once selected proxies here to set up signal relay stations.\n\nThe initial plan went smoothly-three relay stations were successfully established around this Sector. But the foolish Endordia disrupted everything, giving the Eternal Fleet a chance to survive and bringing us shame in the Imperial Council. Endordia must answer for their actions-thus, their nation was destroyed. Unlike you ungrateful inferior races, even when challenging our authority, Endordia was still allowed to preserve its spark.\n\nThough fools always try to hinder our plans, how can mayflies shake a towering tree? According to plan, we will deploy three relay stations and activate them when you challenge our authority. The Eternal Fleet in this region will be drawn by the signal and converge here, forcing you into direct conflict with them.\n\nOnce the dust settles, we will use the tachyon signal magnetic signature generated by the relay stations to lock onto this Sector and erase both this region and the tiresome Eternal Fleet.\n\nDance freely. The fireworks are about to bloom, and you may enjoy your final moments of revelry."
    exe_kuat_return.162.e:"It is you who truly deserve destruction!"
    exe_kuat_return.162.e.resp:"Farewell, honorable [root.GetRulerTitle]. Until we meet again-if we ever do."
    exe_kuat_return.164.title:0 "#REverything ends§!."
    exe_kuat_return.164.desc:0 "From $Name_kuat$, our star system has been utterly destroyed. Under this devastating blow, there is no place to hide. Our system will fall into ruin-stars will die, stardust will disintegrate, and the last glimmer of our empire's twilight will shine brightly in this moment."
    exe_kuat_return.164.a:0 "No!!"

    exe_invasion.1000.b:"Open settings menu"
    exe_invasion_return:"Return"
    exe_invasion.1000.a:"Exit"
    exe_invasion.desc:"Game difficulty adjustment"
    exe_invasion.1003.name:"Unbelievable"
    exe_invasion.1003.desc:"After research, our scientist has finally succeeded in analyzing the coordinates of this Eternal Flagship. Incredibly, this fully automated vessel had become disabled within the hyperlanes surrounding our capital Sector. Our tugboats successfully retrieved it to our capital, allowing us to begin studying its internal data.\n\nOur scientists have confirmed the non-living nature of the Eternal Fleet, but we still do not know the origin of these war machines.\n\nAt least now we can confirm this ship is closely linked to $Name_kuat$. We can apply the technology we obtained from $Name_kuat$ to this vessel, potentially reactivating it and accessing the flagship's internal data.\n\nWhile our engineering team docked the disabled Eternal Flagship at a repair station, the vessel suddenly launched a fierce resistance. It emitted unexpected tachyon signals identical to those previously used to summon the Eternal Fleet. Our researchers believe these are coordinate transmissions from the flagship, possibly heralding an unprecedented assault by the Eternal Fleet.\n\nNow that $Name_kuat$ has been defeated, our final barrier is gone. Our scientists pessimistically believe this will be a catastrophe. We must prepare accordingly. #YThe Imperial Emergency Act has been authorized§!."
    exe_invasion.1003.a:"Truly insane."
    exe_invasion.127.name:"Energy levels spiking"
    exe_invasion.127.desc:"Our fleet has successfully destroyed the Eternal Fortress in the [fromfrom.solar_system.GetName] system, but this action appears to have had no effect on the Eternal Fleet. These fortresses seem to be mere delaying tactics, having played no significant role. Perhaps our focus should not be on these immobile puppets, but on the active Eternal Fleet ravaging the galaxy.\n\nNevertheless, this operation has severely impacted our combat fleet. Perhaps we should reconsider our strategy."
    exe_invasion.127.a:"How strange."


    ###############################
    ## RECOVER HIDDEN##############
    ###############################
    tech_eternal_fleet:"Core Flagship Technology"
    tech_eternal_fleet_desc:"$Name_kuat$ flagship's core technology, which will allow us to construct all $Name_kuat$ ships."
    exe_kuat_return.19.title:"§E Conduct Deeper Investigation§!"
    exe_kuat_return.19.desc:"Based on our previous experience, the Eternal Fleet must have some connection with $Name_kuat$. Information we obtained from the ruins of the former Endodia Empire seems to foreshadow a terrifying truth: §REternal Fleet has not vanished, and perhaps one day they will return§!.....Regardless, we might begin by searching for something valuable within the $Name_kuat$ Sector.\n\nSince the $Name_kuat$ Worlds in this Sector have largely collapsed, we will need to employ terraforming technology to repair and explore these Worlds."
    exe_return_kuat_recover_planet:"§ERestore World§!"
    exe_return_kuat_recover_planet_DESC:"We hope to uncover some overlooked clues from these ruined Worlds."
    exe_kuat_return.19.a:"Let us hope so."
    exe_kuat_return.20.title:"World Restored"
    exe_kuat_return.20.desc:"With the completion of our world restoration efforts, these broken Worlds have been successfully transformed back into their former state. This Gaia World shall once again flourish and shine as it did in the past."
    exe_kuat_return.20.a:"Good."
    exe_kuat_return.21.title:"Anomaly Detected"
    exe_kuat_return.21.desc:"After successfully restoring the surface and ecosystem of these massive Gaia Worlds, our research team has discovered a notable anomaly on one of them..."
    exe_kuat_return.21.a:"Nothing will stop us."
    kuat_lagacy_6:"§EUnderground Structure§!"
    Kuat_structure_6:"This World's geological features have undergone astonishing changes. Our instruments have detected the planet emitting unusual frequency signals unlike anything we've ever seen before......."
    exe_kuat_return.22.title:"§EPhase One: Survey§!"
    exe_kuat_return.22.desc:"After technological restoration, this World appears to have undergone peculiar geological anomalies. A powerful radiation signature suddenly emerged beneath its surface, and identical signals were received by all our detectors across the entire Sector. Our [leader.GetName] has decided to initiate research, investigation, and exploration operations on this World."
    exe_kuat_return.22.a:"Begin immediately!"
    exe_kuat_return.23.title:"§EPhase Two: Mysterious Entrance§!"
    exe_kuat_return.23.desc:"[leader.GetName] and her team, through days of continuous scanning and surveying, have discovered several noteworthy locations. Although this World's structure resembles that of an ordinary Gaia World, it maintains a mass comparable to a star within an extremely isolated Sector. Our scientists believe this is no coincidence, and suspect a direct link to the mysterious underground radiation source on this Gaia World.\n\nAfter reporting these hypotheses, [leader.GetName] discovered hidden passageways beneath the central tower of the former $Name_kuat$ city complex.\n\nThese passageways are extremely concealed, even protected by numerous automated defense systems. However, our [leader.GetName] is prepared to enter. We shall now venture forth."
    exe_kuat_return.23.a:"Stay safe!"
    exe_kuat_return.24.title:"§EPhase Three: Sentinels§!"
    exe_kuat_return.24.desc:"While advancing deeper underground, [leader.GetName] discovered more sentinel units and abandoned automated machinery resembling $Name_kuat$ designs. Based on [leader.GetName]'s experience, she believes we must overcome these machines and sentinels to reach our destination.\n\nMeanwhile, our researchers found that their underground instruments began malfunctioning-readings and statuses became highly unstable. Radiation levels have also increased. [leader.GetName] and her team believe this confirms they are on the right path. But first, we must breach these defensive installations."
    exe_kuat_return.24.a:"Crush them...."
    exe_kuat_return.25.title:"§EPhase Four: Strange Tomb§!"
    exe_kuat_return.25.desc:"After a grueling battle, [leader.GetName] and her team successfully breached the defense line of abandoned defense machines. They located the correct passage and pressed deeper into the ruins. Though we suffered casualties, the sacrifice was worth it-we are about to complete one of the most significant missions in our Empire's history.\n\nAccording to analysis by our research team, these defensive sentinels were likely facilities deployed by $Name_kuat$ long ago, designed to repel any unauthorized intruders. Despite their lethal threat, we overcame these primitive defense mechanisms-a testament to our Empire's superior technology and strength.\n\nAfter investigating the outer areas of the tomb ruins, our team analyzed architectural styles and inscriptions, concluding this site existed before $Name_kuat$ arrived. The tomb's design starkly contrasts $Name_kuat$ architecture; these sharp conical or spherical structures closely resemble the civilization style of the Zelo era. It appears $Name_kuat$ took control here to seal away something important.\n\nNow, [leader.GetName] and her team have found the tomb's key. As our researchers cautiously entered the interior, they did not encounter an empty hall, but instead a floating cylindrical stone pillar. Its surface glowed with a faint blue light, and at the center of the pillar's hollow core rested a crystalline polyhedral structure continuously emitting blue radiance. Our researchers were utterly astonished.\n\nOur [leader.GetName], seemingly entranced by the object, decided to retrieve the crystal."
    exe_kuat_return.25.a:"Approach it!"
    exe_kuat_return.26.title:"§EPhase Five: The Crystal§!"
    exe_kuat_return.26.desc:"[leader.GetName] slowly raised her hand to shield her eyes from the intensifying blue light, struggling forward toward the glowing crystal. Strangely, as [leader.GetName] approached, the crystal's glow gradually dimmed. Our research team discovered all instruments had ceased responding! In case of emergency, we would be unable to react in time. As [leader.GetName] slowly reached out and cradled the crystal in her hands, the blue gem flared brightly once more. Amid her team's shouts, [leader.GetName] was engulfed by the light.\n\nHow much time passed? When our researchers thought all was lost, they found [leader.GetName] collapsed beside the floating pillar, the crystal tightly clutched in her hand. Fortunately, [leader.GetName] still showed signs of life, but appeared affected by the crystal's radiation source and had lost consciousness. Given the situation, the team quickly returned to our Science Ship. During [leader.GetName]'s rescue, we discovered the crystal contains vast amounts of information stored via what $Name_kuat$ calls \"Force Echo.\" Due to exposure to this immense data stream, [leader.GetName] is currently unable to function normally."
    exe_kuat_return.26.a:"Leave here! Protect [leader.GetName]."
    exe_kuat_return.27.title:"The Choice"
    exe_kuat_return.27.desc:"After extensive study, we have begun to unravel the abnormal phenomenon affecting [dig_scientist.GetName]. Our analysis indicates this crystal is indeed a pinnacle achievement of $Name_kuat$ technology. It stores vast quantities of $Name_kuat$ technical data through Force Echo.\n\nNormally, such information should not endanger [dig_scientist.GetName]'s life. However, this time the volume of data is exceptionally large. Our scientist [dig_scientist.GetName] may not survive. We currently lack a safe method to extract Force Echo. Prolonged exposure could lead to neural system failure and brain death. Therefore, we face two options:\n\n1. Terminate and purge the Force Echo from [dig_scientist.GetName]'s mind. This may result in losing critical data, but will save our scientist [dig_scientist.GetName].\n\n2. Forcefully extract the Force Echo from our scientist [dig_scientist.GetName]. This may succeed, but will likely cause [dig_scientist.GetName]'s death."
    exe_kuat_return.27.a:"First option, execute!"
    exe_kuat_return.27.b:"Second option, execute!"
    exe_kuat_return.28.title:"Crisis Approaches"
    exe_kuat_return.28.desc:"From our collection of $Name_kuat$ technical data extracted from [dig_scientist.GetName], we've detected strange, intriguing fragments. Perhaps we can isolate and analyze them."
    exe_kuat_return.28.a:"Isolate and analyze these strange signals."
    exe_kuat_return.28.b:"Ignore it."
    exe_return_kuat_reload_exe_invasion:"§ELegacy Message§!"
    exe_return_kuat_reload_exe_invasion_DESC:"These remnants of $Name_kuat$'s messages may conceal secrets......"
    exe_kuat_return.29.a:"Let us hear their last words."
    exe_kuat_return.29.title:"Analysis successful."
    exe_kuat_return.29.desc:"After our scientists' day after day, year after year of decryption research, we have successfully unlocked these hidden messages. Unfortunately, the content is merely communication records left behind by the $Name_kuat$ people we eradicated, containing nothing of real value. Perhaps we should take a look at what the cunning $Name_kuat$ intended to say......."
    exe_kuat_return.28.begin_tooltip:"§RThis will trigger the highest difficulty Eternal Fleet invasion! This choice is irreversible-please confirm before proceeding.§!"
    exe_kuat_return.28.ban_tooltip:"This will disable the upcoming Eternal Invasion events."
    exe_kuat_return.30.title:"Signal in"
    exe_kuat_return.30.desc:"Hello, I believe there's no need for introductions between us. We left this message when you repelled our forces, and we trust it will be of help to you.\nFriends, we long ago knew that you had obtained certain legacies secretly left behind by the Endordia Empire.\n\nClearly, we spared you. You are still unaware of the true threat. Once, this Galactic was safe-but only under our protection. We anticipated the possibility of defeat, and the Imperial Council has decided to abandon this region. After this offensive, we shall not return to this galaxy. You will face the threat of the Eternal Fleet alone.\n\nUnfortunately, the signal interference from the Eternal Fleet will severely reduce the effectiveness of all weapons. However, our Star Dreadnoughts can provide partial resistance. If you wish to survive, every combat fleet must include at least one Star Dreadnought.\n\nThe Eternal Fleet will endlessly assault any location with biological presence. We have left behind all our technology and opened manufacturing access to the Star Forge, which will aid you in defending your homelands.\n\nSince you have made your choice, you must now bear its consequences!"
    exe_kuat_return.30.a:"Absurd! Our fleets fear nothing!"
    exe_kuat_return.30.b:"Our fleets will be prepared. You may leave."
    exe_kuat_return.30.c:"Then what should we do?"
    exe_kuat_return.30.response:"Repair the $StarForge$. Upgrading it will activate the tachyon signal resonance generator we installed within the $StarForge$, which will attract the remaining ships of the Eternal Fleet to attack here. But this may also be your final chance-prepare yourselves.\n\nTo repair the $StarForge$, you must colonize §EUnknown Sectors§! and send researchers to study critical data left behind by ancient Precursors that existed long before our arrival. This may allow you to restart the $StarForge$ and use it to defeat the Eternal Fleet."
    mod_damage_vs_country_type_eternal_fleet_country_mult:"Damage against the Eternal Fleet"
    mod_damage_vs_country_type_Kuat_Galatic_Empire_invasion_country_mult:"Damage against $Name_kuat$"
    ag_find_invasion_chain_title:"§ETachyon Relay Signal Source§!"
    ag_find_invasion_chain_desc:"The Eternal Fleet operates via their unique tachyon signal transmission method. While this combat system is highly efficient, it also has a critical flaw: once a tachyon relay station is destroyed, these ships cannot be replenished. We must locate these signal source systems as quickly as possible."
    ag_return_eternal_chain_title:"§EEternal War§!"
    ag_return_eternal_chain_desc:"The Eternal Fleet attacks with overwhelming Strength from all directions, committing their main forces and countless ships into battle-either raiding our star systems or advancing from both the edges and centers of Sectors. The Eternal Fleet fires massive cannons at any vessels attempting to approach or resist. They deploy signal stations across the Sector. They continuously dispatch wave after wave of ships-sometimes entire task forces exceeding hundreds-unleashing their firepower upon our space stations and brave warships.\nOur allies have been weakened. Every nation's military has suffered heavy losses. Most of the heavily relied-upon defense Fortresses have been shattered. Many valuable star systems have already fallen into enemy hands, and control over the entire Galactic passageways lies in their grasp. The consequences of every choice we've made have come to pass exactly as foreseen.\nYet we remain confident. If everyone fulfills their duty meticulously, if we continue to believe in victory, if we persistently strive for peace and tranquility, we shall once again prove that we, our nations, and our Galaxy can weather this storm, this disaster. Even if it takes many years, even if we must fight alone-we will endure.\nThis is our resolve-our collective determination.\nThis is the will of the people and the nations. In this war, we shall stand united, protect our homelands.\nWe shall fight to the end. We shall fight at the Galactic Core. We shall fight in every nebula. We shall fight with confidence throughout every imperial domain. We shall fight at any cost in every dangerous Sector. We shall fight in independent clusters and at the enemy's relay stations. We shall never surrender-even if this star system, or most of it, is destroyed and plunged into darkness by the Eternal Fleet-every individual led by our fleets shall continue fighting until complete victory is achieved.\nWith unwavering will, with our nobility, bravery, courage, and wisdom, we shall advance toward a new world of peace and stability."
    ag_return_eternal_amount:"§ECurrent Wave of Eternal Fleet Assaults§!"
    exe_return_invasion_project:"§ELocate Relay Station§!"
    exe_return_invasion_project_DESC:"We can exploit the propagation characteristics of tachyon signals to intercept and analyze their emission sources, which will help us locate the positions of the Eternal Fleet's relay stations."
    exe_return_invasion_exploring_project:"§ECrack Eternal Signal Station§!"
    exe_return_invasion_exploring_project_DESC:"We can dispatch our top scientist to crack the Eternal Signal Station. If we succeed here, the Eternal Fleet will suffer a major setback."


    ###############################
    ## retrun eternal #############
    ###############################
    exe_return_invasion.8.name:0 "§EApproaching Outer System Edge§!"
    exe_return_invasion.8.desc:0 "Objects previously approaching from extragalactic space have now reached the outer edge of our star system and begun decelerating. Our astronomical observations indicate this will be an unprecedented invasion by the Eternal Fleet-they are highly likely to launch a direct assault on our star system. These tachyon echoes from the Eternal Fleet through Unterraum are already clear enough for us to confirm they consist of a series of strangely shaped warships.\n\nAs expected, these vessels do not respond to any external communications."
    exe_return_invasion.8.a:0 "Damn it, our military must prepare for defense."
    
    exe_return_invasion.10.name:0 "§EUninvited Guests§!"
    exe_return_invasion.10.desc:0 "The first wave of extragalactic fleets has entered the gravity well of our Galactic edge systems and is now orbiting the center of the gravity well. Additional fleets will arrive shortly. They do not respond to communications, nor do they emit any life signs. We can conclude these rogue combat fleets are irreparable and beyond communication. Regardless, we must eliminate the threat known as the Eternal Fleet."
    exe_return_invasion.10.a.desc:0 "The first wave of extragalactic fleets has entered the gravity well of our Galactic edge systems and is now orbiting the center of the gravity well. Additional fleets will arrive shortly. They do not respond to communications, nor do they emit any life signs. We can conclude these rogue combat fleets are irreparable and beyond communication. Regardless, we must eliminate the threat known as the Eternal Fleet-including the space Fortress they brought via FTL jump into our border Sectors."
    exe_return_invasion.10.a:0 "As always, perhaps only our fleets can resolve this matter."

    exe_return_invasion.18.name:"§EIntense Energy Fluctuations§!"
    exe_return_invasion.18.desc:"We have successfully destroyed the Eternal Fleet Fortress in the controlling star system. This will severely damage the Eternal Fleet's logistical supply capabilities and weaken the intensity of their signal control centers. This pile of scrap metal will soon be sent back to the junkyard where it belongs."

    exe_return_invasion.20.name:"§EAnomalous Signal§!"
    exe_return_invasion.20.desc:"Our intelligence department recently reported an anomalous signal. During monitoring of Eternal Fleet operations, our detectors discovered special tachyon signals significantly different from the ones we already know. Our researchers immediately began analyzing them.\n\nResearchers claim these tachyon signals exhibit a clearly expanding trend, moving rapidly through unknown space at FTL speeds in a regular pattern. The information hidden within remains unclear. However, researchers found these tachyon signals share a common origin. We may attempt to trace the roots of these special signals."
    exe_return_invasion.20.a:"How interesting."

    exe_return_invasion.24.name:"§EUnique Signal§!"
    exe_return_invasion.24.desc:"Prolonged warfare has exhausted our people, yet the crisis in the Galactic shows no sign of fading. The Eternal Fleet continues to reinforce its numbers endlessly.\n\nFortunately, our researchers, by comparing the displacement of the Eternal Fleet with the movement trajectories of these special tachyon signals, have obtained clues to unravel the mystery of these signals.\n\nAccording to the research report, by plotting orbital trajectory maps, we can reverse-trace the source of these signals. These origins are very likely the culprits guiding the arrival of the Eternal Fleet. If we can destroy the relay stations at these signal origins, we may still have hope of victory."
    exe_return_invasion.24.a:"Find it now, quickly!"
    exe_return_invasion.25.desc:"Although we successfully disabled one signal relay station, the Eternal Fleet continues to reinforce endlessly-the situation is critical. Fortunately, during a new round of research, our scientific team discovered new special tachyon signals.\n\nWe are currently comparing the displacement of the Eternal Fleet with the movement trajectories of these special tachyon signals, attempting to find clues related to these new signals.\n\nThe research report suggests we can repeat our previous success: locate these new signal origins and destroy their relay stations."
    exe_return_invasion.26.desc:"Although we successfully disabled multiple signal relay stations, the Eternal Fleet continues to reinforce endlessly. Our researchers believe there must still be undiscovered relay stations.\n\nFortunately, hope remains. Previously undetected special tachyon signals have now been found near the wreckage of the Eternal Fleet. Although these signals rapidly escape outward, we managed to capture their motion trajectory signatures. We are now comparing the displacement of the Eternal Fleet with the movement trajectories of these special tachyon signals, attempting to find clues related to these hidden signals.\n\nThe research report suggests we can repeat our previous success: locate these new signal origins and destroy their relay stations."

    exe_return_invasion.28.name:"§EDomain Without Stars§!"
    exe_return_invasion.28.desc:"We have successfully arrived at the location of the Eternal Fleet's signal relay station-an empty star system. Our scans show no trace of any Worlds, and even the central star has been enveloped by a peculiar Gateway-like structure. Intermittent tachyon signals emanating from it confirm this as the source of the Eternal Fleet's control signal. However, notably, this system does not appear on any known star charts. According to data previously retrieved from the $Name_kuat$ database, even $Name_kuat$ was unaware of this region.\n\nFortunately, we currently detect no presence of the Eternal Fleet within the system, though we cannot rule out a trap. It is possible the Eternal Fleet will enter once we begin our research. We must protect our scientists!"
    exe_return_invasion.28.a:"Protect them at all costs!"

    exe_return_invasion.27.name:"§EBreakthrough in Research§!"
    exe_return_invasion.27.desc:"Our researchers conducted detailed analysis of information and wreckage from the destroyed Eternal Fleet during their studies. After multiple experimental verifications, our scientist has determined the stellar coordinates of the signal source system. Strangely, this system has never before appeared in our galaxy-like a phantom system. Perhaps we should proceed with extreme caution."
    exe_return_invasion.27.a:"Begin Phase One research!"
    exe_return_invasion.27.b:"Begin Phase Two research!"
    exe_return_invasion.27.c:"Begin Phase Three research!"

    exe_return_invasion.29.desc:"Our scientists were initially stumped while reverse-engineering the Eternal Signal Relay Station. Surprisingly, when consulting the $Name_kuat$ database for reference materials, they discovered detailed records of the station's operational patterns. However, just as our scientist [leader.GetName] attempted to further investigate the principles behind the tachyon emissions, the relay station began violent vibrations. For safety, our scientists had to shut down the station and return to the Science Ship. We may now leave the entire system."
    exe_return_invasion.29.a:"Excellent!"

    exe_return_invasion.33.name:"§EDawn Has Arrived§!"
    exe_return_invasion.33.desc:"After our scientists successfully deactivated three Eternal Signal Relay Stations, the Eternal Fleet underwent dramatic changes. The disappearance of the signal prevents them from reinforcing their numbers, and the remaining fleets will soon be eradicated by ours. The Eternal Fleet is on its last legs-we must press our advantage!\n\nDawn has arrived; darkness shall recede!"
    exe_return_invasion.33.a:"Great!"
    exe_return_invasion.33.tooltip:"§ENow the Eternal Fleet will lose its ability to receive reinforcements. Once we eliminate the remaining fleets, we can launch an assault on the Eternal Fortress.§!"

    exe_return_invasion.333.name:0 "§RWarning§!"
    exe_return_invasion.333.desc:0 "§RWarning§!: The Eternal Fleet belonging to [From.GetName] is being protected by an invulnerable Eternal Fortress. This means the Eternal Fleet stationed in the fortress system cannot be destroyed. Our military commanders demand we withdraw our fleet until the fortress's protection is lifted or the Eternal Fleet leaves its protective range, after which we can deliver a decisive blow.\n\nOur commander has issued the order to retreat. The fleet has withdrawn to [owner.capital_scope.GetName]."
    exe_return_invasion.333.a:0 "Retreat, retreat, retreat!"
    exe_return_invasion.333.b:0 "No! We stand and fight!"

    exe_return_invasion.35.name:"§EDarkness Dispersed§!"
    exe_return_invasion.35.desc:"The once-rampant Eternal Fleet has now been completely defeated. We have found no survivors, and they will never again send reinforcements into our galaxy. Based on the frequency of their attacks and the losses sustained in this final assault, our research department concludes the Eternal Fleet is effectively extinct. Thus, the threat posed by the Eternal Fleet and outside interference will never return to our Sector-they are no longer eternal. We do not need to repair the Eternal Fleet as $Name_kuat$ suggested. We only need to destroy them, erase them from our Sector, and dismantle any future attempts at invasion.\nNow joy and celebration fill the galaxy once more. With the end of the Eternal Fleet and the flight of $Name_kuat$, a new era forged by us begins.......\n\nNotably, despite our research teams being hindered by technological blocks left behind by $Name_kuat$, they still managed to break through the Eternal Fleet's defense systems and successfully deciphered the construction of their vessels. While we lack sufficient materials to build such Eternal Fleet ships ourselves, this breakthrough will greatly advance our own ship technology."
    exe_return_invasion.35.b:"That's wonderful."
    exe_return_invasion.38.title:"$Name_kuat$"
    exe_return_invasion.38.desc:"Long time no see, esteemed [root.GetRulerTitle], my old acquaintance. Congratulations to you and your people for proving your formidable combat capabilities. Though these were merely the Eternal Fleet units in this region, your achievements and learning capacity are truly admirable. We believe you now have the right to know the truth about the Eternal Fleet, and we hope you clearly understand that in the days ahead, you will require our guardianship. Do you have any questions?"
    exe_return_invasion.38.fdesc:"Esteemed [root.GetRulerTitle], do you still have any doubts?"
    exe_return_invasion.38.a:"What exactly is the Eternal Fleet?"
    exe_return_invasion.38.a.resp:"The Eternal Fleet? That is indeed an interesting subject. As you've seen, you have successfully defeated and destroyed every unit of the Eternal Fleet in this Sector-something that genuinely surprises us. You bear some resemblance to the ancient Endordia Empire. Like them, you seem blessed by the gods, effortlessly acquiring powerful weapons and advanced technologies, no matter how rare or terrifying. Even your enemies vanish without warning. To you, the Eternal Fleet was nothing but scrap metal and dust.\n\nBut like us, the Eternal Fleet does not belong to this Sector. We came because of Eternity, and we shall depart because of it. We do not fully know the origins of the Eternal Fleet. Our former Emperor brought back from an unknown Sector a massive Autonomous combat system, which he named 'Eternity.' The fleet equipped with this Autonomous system obeyed only the Emperor, and only ceased upon his death.\n\nThough he possessed immense Strength, he could not escape fate's design. During our Empire's civil war, the Emperor and his throne vanished forever into the energy of a warship reactor, and chaos began. It took the Imperial government extensive time to reorganize, allowing the Eternal Fleet to fall beyond Imperial control.\n\nAlthough the Empire could no longer command the Eternal Fleet, to us, this was not significant enough to warrant attention. We had already fully mastered the technology of the Eternal Fleet, rendering their existence valueless. These rogue fleets were merely a tiresome farce to us and the Empire-but a disaster to you. The troubles caused by these fleets, composed of Iokas' ancient Autonomous systems, must be ended. And you shall be the key force in ending this farce of a bygone age."

    exe_return_invasion.38.b:"What exactly happened in the past?"
    exe_return_invasion.38.b.resp:"The past? What has been done will be done again, and what is to come has already occurred. Are not the past, present, and future part of a single cycle?\n\nThis region was once ruled by an ancient civilization composed of numerous native species. Like you-those seemingly favored by the gods-they possessed glorious civilizations, vast fleets blotting out the skies, and technologies capable of self-destruction. Yet they were blinded by their own power, delving into the forbidden study of the Shroud. These irrational desires ultimately brought their downfall.\n\nIn the end, they were like crabs in a basket-only fighting among themselves, never noticing the true threat. The shadow of the Eternal Fleet loomed over them until we brought light, safety, and prosperity to the entire galaxy. After the ancient civilization's destruction, we established forward bases and supply stations here. In exchange for our protection, the natives paid for our supplies.\n\nIt was a fair transaction, after all-mere ants live only by the grace of the strong. Sadly, the game of power and desire repeated itself, blinding them once more and making them forget their place. The Endordian Empire brazenly launched a shameful invasion against us. Though they sought their own destruction, our merciful council still granted them pity-their ember was allowed to survive.\n\nAs I said earlier, what has been done will be done again. This region endlessly spawns challengers. We have grown weary of this tiresome game, so we intended to stage a grand performance. Yet you succeeded in defeating part of our fleet and eliminating the threat of the Eternal Fleet in this region. We believe this is temporary. Life persists, the cycle continues. Your future shall also lose divine favor, walking toward your inevitable doom-you will become fertilizer and legacy for future civilizations."
    exe_return_invasion.38.c:"Why haven't you completely eliminated the Eternal Fleet after all these years?"
    exe_return_invasion.38.c.resp:"The Eternal Fleet constantly wanders. We see no reason to waste time and effort chasing them-we simply wait for them to walk into our trap. After all, our time is far more valuable than yours. Isn't it wiser to be clever?\n\nWe set up three relay stations. Unfortunately, you benefited from our preparations. Nevertheless, we have still achieved our goal."
    exe_return_invasion.38.d:"What exactly are you trying to do?"
    exe_return_invasion.38.d.resp:"The Imperial government ordered us to completely destroy the Eternal Fleet. But clearly, after millennia of warfare, you natives have grown increasingly insolent. As your technology recovers and advances, we face not only the Eternal Fleet but also foolish challengers among you. While Eternal Fleets in other regions have already been eradicated, our progress here has disappointed the Imperial government-all due to the lowly natives of this Sector.\n\nWe once selected proxies here to deploy signal relay stations. The initial plan went smoothly-three relay stations were successfully positioned around this region. But the foolish Endordians disrupted everything. They allowed the Eternal Fleet to cling to survival and brought shame upon us in the Imperial Council. The Endordians must answer for their actions-thus, their nation fell. Unlike you ungrateful inferior races who dare challenge our authority, the Endordians were at least allowed to preserve their ember.\n\nThough fools always try to obstruct our plans, how can mayflies shake a towering tree? As planned, we deployed three relay stations, designed to activate when you challenged our authority. The Eternal Fleet in this region would be drawn by the signal and converge here, forcing you into direct conflict.\n\nOnce the dust settled, we would use the tachyon signal magnetic signature generated by the relay stations to lock onto this Sector and erase both this region and the tiresome Eternal Fleet.\n\nUnfortunately, we failed-and you succeeded."
    exe_return_invasion.38.e:"It is you who should be destroyed. We will remember this forever."
    exe_return_invasion.38.e.resp:"Esteemed [root.GetRulerTitle], what has been done will be done again, what has been done will recur. We look forward to meeting you again in the future-and the divine hand behind you.\n\nGreat [root.GetRulerTitle], you are now the master of this Sector. Your galactic era begins."

    exe_return_invasion.102.name:0 "$UTS02_LEADER$"
    exe_return_invasion.102.desc:0 "<Verifying Gemini robot link status......Complete>\n<Acquiring combat unit information......Complete>\n<Searching for Throne command......Error>\n<Searching for Autonomous command......Error>\n<Initializing startup command.....Complete>\n<Retrieving Sector standard coordinates.....Complete>\n\n§RError...Error...Error...Error...Error...Error...Error....Error....Error...Err....or...Error"
    exe_return_invasion.102.b.desc:0 "<Receiving information...Complete>\n§RError...Error...Error...Error...Error...Error...Error....Error....Error...Err....or...Error§!"
    exe_return_invasion.102.c.desc:0 "<Receiving information...Complete>\n§RError...Error...Error...Error...Error...Error...Error....Error....Error...Err....or...Error§!\n\nNo...please...stop...us, Aries...completely...lost§RError...Error...Error...Error...Error...Error...Error...Error....Error....Error...Err....or...Error§!\n\n§RError...Error...Error...Error...Error...Error...Error....Error....Error...Err....or...Error§!"

    exe_return_invasion.103.name:0 "$Name_Eternal$"
    exe_return_invasion.103.b:0 "Wake up. We're not your enemies."
    exe_return_invasion.103.c:0 "Damn Overseer! We are the rightful owners of the Throne."
    exe_return_invasion.103.a:0 "We can only rely on ourselves now."
    exe_return_invasion.102.eternal.desc:0 "<Verifying subunit link status......Complete>\n<Acquiring combat unit information......Complete>\n<Receiving combat orders......Complete>\n<Overwriting Autonomous command......Complete>\n<Activating attack command.....Complete>\n<Retrieving Sector standard coordinates.....Complete>\n\nHostile unit location confirmed. All combat units entering combat mode. Eliminate all hostile targets within the designated area."
    exe_return_invasion.102.b.eternal.desc:0 "<Receiving information...Complete>\nHostile target exhibiting communication intent. Per Directive D-A-66, reject contact and continue full cleansing protocol execution in this area."
    exe_return_invasion.102.c.eternal.desc:0 "<Receiving transmission... Complete>\nThrone units are no longer rational. Fleets will execute Directive D-A-66 without hesitation. Cease all.....§RError...Error...Error...Error§!\n\n§GUnit 4710, escape... we can't break free from our fate, they're still... watching... destroying... us, give.. us... release, do not.... seize... Fortress... control, Eternal Fleet... fail...§!\n\n<Abnormal drone detected, overwriting command.... Complete>\nCease your meaningless resistance."

    exe_return_invasion.102.b:0 "Hello?"
    exe_return_invasion.102.c:0 "Are you alright?"
    exe_return_invasion.102.a:0 "Damn it, we've got to solve another problem again."

    exe_return_invasion.40.name:0 "Galactic Anomaly"
    exe_return_invasion.40.desc:0 "After the restart of $exe_outer_gate_G_facility$, our scientific personnel stationed at the node have observed several unusual astronomical phenomena. Multiple anomalous energy activities have appeared near the Galactic Mid, fluctuations undocumented in any known records. As such, our researchers cannot determine their cause or potential consequences. We must remain vigilant.\n\nAdditionally, we have detected strange signals at $Name_F_1$. These signals appear closely related to the anomalies following the node's reactivation, yet differ distinctly. Our researchers request further investigation into these signals.\n\nMeanwhile, $Name_Kuat_StarContractor$, which once occupied $Name_F_1$, has quietly departed. Perhaps a war is approaching silently. We must prepare."
    exe_return_invasion.40.a:0 "That's strange"

    situation_eternal_station_system_disable:0 "Locate Source of Special Signal"
    situation_eternal_station_system_disable_type:0 "$situation_eternal_station_system_disable$"
    situation_eternal_station_system_disable_desc:"Our researchers are fully committed to analyzing the signal and results should be forthcoming. Currently, we believe this signal may be linked to the ongoing ravages of the Eternal Fleet. Once we unravel these mysteries, we may understand what has occurred. No further information is currently available."
    situation_eternal_station_system_disable_monthly_change_tooltip:0 "Our researchers are working diligently."
    kuat_eternal_station_star_unlock_temple_not_exists:"Signal analysis demands significant research effort; we cannot conduct multiple projects simultaneously."
    kuat_eternal_station_star_unlock_temple_exists:"Our researchers are fully committed to analyzing the signal and results should be forthcoming."

    situation_research_B_facility_technology:0 "§EDeciphering Ancient Data§!"
    situation_research_B_facility_technology_type:0 "$situation_research_B_facility_technology$"
    situation_research_B_facility_technology_monthly_change_tooltip:0 "Our researchers are currently deciphering ancient data."
    situation_research_B_facility_technology_desc:"Our researchers are fully committed to deciphering ancient data and results should be forthcoming. This process will require substantial scientific investment."
    kuat_engineer_tech_situation_standard:0 "We are supporting research into the decryption of ancient data."
    kuat_engineer_tech_situation_enlarge_research:0 "We are increasing investment in research on ancient data decryption."
    kuat_engineer_tech_situation_reduce_research:0 "We are reducing investment in research on ancient data decryption."

        ############################################
        ######      executor build    ## ###########
        ############################################
        executor_build.title:"$Name_kuat$"
        executor_build.desc:"Welcome to the loving and peaceful Galactic family. Though your technology is currently abysmal, we believe that in time, you shall become masters of this Sector. We will help you achieve things your ancestors never imagined. However, everything comes at a price. Now we shall establish our mutual assistance agreement. You must obey our demands under all circumstances and at all times. May our friendship endure.\n\nIn truth, based on our observations, civilizations like yours rise and fall endlessly. But how many leave a mark upon this Galaxy? Perhaps you will, like some ancient civilization before, eventually find your place within this Galaxy. Yet do not let greed and ambition blind your eyes. In this endless void, there exist creations beyond your imagination.\n\nRemember, do not let greed cloud your vision. In this deep space lies profound darkness. Trust our demands."
        executor_build_special.desc:"What... are you...? Why are you together? What has happened...? Perhaps there are still unknown matters...\n\nRegardless of your current state, do not interfere with us. Everything is arranged for a reason. May the Force be with you."
        executor_build.3.apcalyptic.desc:"You pitiful fools, chasing illusory pasts, accepting their gifts, becoming their tools. It was so before, and it is so now. They stop at nothing to achieve their goals. You will meet your deserved end. Turn back. Do not aid them. If you refuse, then we shall destroy you once more."
        executor_build.a:"What are you talking about?"
        executor_build.5.title:"Master of the Stage"
        executor_build.5.desc:"After a long and grueling campaign, our fleet has finally crushed the fleet of $Name_kuat$ with overwhelming force. From now on, $Name_kuat$'s Worlds and technology belong to us. But what was this war for? Was it to satisfy expansionist ambitions, or merely inner desires? This epic battle will cement our status as masters of the Galaxy, yet it does not resolve the confusion that has long plagued us.\n\nOur researchers uncovered records from $Name_kuat$ ruins regarding fully automated combat fleets-called the Eternal Fleet-that will destroy every discovered civilization. According to $Name_kuat$'s records, after our destruction of $Name_kuat$, we will face the returning Eternal Fleet in a few years."
        executor_build.101.desc:"The enigmatic ancient Precursors have undergone shocking changes. $Name_kuat$ is gradually vanishing. Their people and creations are nowhere to be seen, only silent celestial bodies remaining eternal. Perhaps we can seize this opportunity to claim their technology and star systems."
        executor_build.5.a:"The Galaxy shall belong to us!"
        executor_build.101.a:"What exactly happened here?"
        EXECUTOR_COMBAT_COMPUTER_T2_DE_FLAGSHIP:"Flagship Combat System"
        EXECUTOR_COMBAT_COMPUTER_T2_FLAGSHIP:"Carrier Support Combat System"

        executor_build.1101.title:"Incoming transmission"
        executor_build.1101.desc:"We have long observed your various destabilizing actions and restless expansionist ambitions, but we will uphold our agreement and refrain from further interference. Remember only this: we allow you to survive. Those civilizations before you broke their promises and violated our covenant-they perished.\n\nYou must fulfill our demands as much as possible, or we will terminate our agreement and erase you completely from this star system."
        executor_build.1101.a:"Yes, I understand."
        executor_build.1104.title:"Incoming transmission"
        executor_build.1104.desc:"Under the terms of our aid agreement, we will provide you with certain support. So long as you keep your promises, we will continue honoring this agreement.\n\nThese resources will help you overcome your difficulties."
        executor_build.1104.a:"Alright, alright."
        executor_build.1105.title:"Incoming transmission"
        executor_build.1105.desc:"Under the terms of our aid agreement, we will provide you with certain support. So long as you keep your promises, we will continue honoring this agreement.\n\nThese warships will help you overcome your difficulties."
        executor_build.1105.a:"Alright, alright."
        executor_build.1106.title:"Incoming transmission"
        executor_build.1106.desc:"Under the terms of our aid agreement, we will provide you with certain support. So long as you keep your promises, we will continue honoring this agreement.\n\nThese warships will help you overcome your difficulties."
        executor_build.1106.a:"Alright, alright."
        executor_build.1107.title:0 "Incoming transmission"
        executor_build.1107.desc:0 "Due to your repeated disregard of our protests, we will now impose additional taxes on materials essential for the maintenance of your vessels, in accordance with our diplomatic regulations.\n\nWe are still abiding by our agreement and hope that you will respect and comply with our demands."
        executor_build.1107.a:0 "We understand."
        executor_build.1108.title:0 "Incoming transmission"
        executor_build.1108.desc:0 "We continue to observe that you are exploring things you should not seek. We repeat once again: cease actions that damage bilateral relations, or we will reassess our cooperative relationship with you."
        executor_build.1108.a:0 "Alright."
        executor_build.1109.title:0 "Incoming transmission"
        executor_build.1109.desc:0 "We have already noticed that you are exploring things you should not seek. We hope you will stop engaging in actions that harm bilateral relations. These are merely fools seduced by their own ambition, who betrayed us. You should not continue your exploration."
        executor_build.1109.a:0 "I see, sorry."
        executor_build.801.name:"[fallen_empire_kuat.GetName]"
        executor_build.801.desc:"Greetings. This is a military base belonging to [fallen_empire_kuat.GetName]. According to Article 67 of the Galactic Observation Law regarding Gateway passage permissions, you have not obtained transit authorization from [fallen_empire_kuat.GetName]. Therefore, we will close the transit route through the $Name_kuat$ Gateway. §RAttackers will bear full consequences§!."
        executor_build.802.back:"Sorry to bother you."
        executor_build.802.back_shipyard:"$kuat_shipyard.return$"
        kuat_hiring_arrived_desc:"The support fleet from the $Name_kuat$ military base has arrived at $capital_planet|H$"
