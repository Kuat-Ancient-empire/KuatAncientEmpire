    situation_unlocked_the_first_station:"§EBreaching Relay Station§!"
    situation_unlocked_the_first_station_type:0 "§EBreaching Relay Station§!"
    situation_unlocked_the_first_station_desc:1 "After our navy's fierce combat, our research team has successfully reverse-engineered and traced the tachyon signal source of the Eternal Fleet's operations. Based on our initial survey results in this Sector, if we wish to shut down the continued operation of this tachyon signal relay station, we must immediately organize personnel to enter the relay facility at the center of the star system. It is time for us to act."
    situation_unlocked_the_second_station:"$situation_unlocked_the_first_station$"
    situation_unlocked_the_second_station_type:0 "$situation_unlocked_the_first_station$"
    situation_unlocked_the_second_station_desc:1 "After our navy's fierce combat, our research team has successfully reverse-engineered and traced the second tachyon signal source of the Eternal Fleet's operations. Combining our new surveys of this Sector with data from the previous relay Sector, it is clear that if we wish to shut down the continued operation of this tachyon signal relay station, we must immediately organize personnel to enter the relay facility at the center of the star system. It is time for us to act."
    situation_unlocked_the_third_station:"$situation_unlocked_the_first_station$"
    situation_unlocked_the_third_station_type:0 "$situation_unlocked_the_first_station$"
    situation_unlocked_the_third_station_desc:1 "After our navy's fierce combat, our research team has successfully reverse-engineered and traced the final tachyon signal source of the Eternal Fleet's operations. Combining our new surveys of this Sector with data from the two previous relay Sectors, it is evident that if we wish to shut down the continued operation of this tachyon signal relay station, we must immediately organize personnel to enter the relay facility at the center of the star system. Once we disable this relay, [target.GetName] will cease all reinforcement activities."
    situation_hositile_altitude_station:"§EPassive Approach§!"
