 tech_kuat_strange_shield_contractor:0 "§EAegis Defense Deflection Field-Basic Theory§!"
 tech_kuat_strange_shield_contractor_desc:0 "The Aegis Defense Deflection Field is less a shield and more a bidirectional system-capable of both defense and offense. It is generally considered the standard shield and superweapon system used by Wanderer ships.\n\nFunctionally, the Aegis Defense Deflection Field is essentially a shield that collects impact energy, and when the collected energy reaches a threshold, activates a massive directional warp lance: the system manipulates free molecules, radiating them into a generated counter-polar rotational field. Upon acceleration to critical point, they combine into quark-gluon plasma and are directed outward at a target.\n\nBecause this targeting requires a charging process, we must utilize Isotope-5 within the ship's Mid core. Isotope-5 enables the shield energy to focus and redirect, allowing attacks on fast, difficult-to-aim-and-track targets."


 tech_kuat_strange_shield_contractor_1:0 "§EAegis Defense Deflection Field-Advanced Theory§!"
 tech_kuat_strange_shield_contractor_1_desc:0 "By adjusting the intensity of the core field, we can freely control both shield strength and weapon output. Since the core field can directly penetrate outside the Hull, it extends the effect of the Shield Generator.\n\nThe resulting shield can resist and store additional energy and momentum from any attack-temporarily stored energy will far exceed the Hull's inherent tolerance. When incoming attacks reach a critical state, the Isotope-5 in the ship's Mid will reverse the stored energy and direct it toward a target locked by the weapon system. The field will, under Isotope-5's control, focus onto a single point.\n\nThen, particles from the core will radiate to this focal point, combining into quark-gluon plasma and launching toward the target with unparalleled force."
 exe_enable_F_system_databank_stage_1:0 "§E$Name_Kuat_StarContractor$: Shield Technology Transfer§!"
 exe_enable_F_system_databank_stage_1_DESC:"Our researchers believe we should convert the technology described by $Name_Kuat_StarContractor$ into our primary technical language; otherwise, the subsequent analysis process will be severely impacted."
 exe_enable_F_system_databank_stage_2:0 "§E$Name_Kuat_StarContractor$: Shield Disruption§!"
 exe_enable_F_system_databank_stage_2_DESC:"By applying the technical information transmitted by $Name_Kuat_StarContractor$, our engineering department can now conduct shield disruption operations on the planetary shield located on [will_be_add_habitable_plague.GetName]."

 tech_Name_boss_crisis_DC_BOSS:"§E$Name_boss_crisis_DC_BOSS$§!"
 tech_Name_boss_crisis_DC_BOSS_desc:"$Name_boss_crisis_DC_BOSS$ is a cruiser equipped with formidable firepower, designed by $Name_Kuat_Contractor$, who is sealed within the Abyss."
 tech_Name_boss_crisis_DB_BOSS:"§E$Name_boss_crisis_DB_BOSS$§!"
 tech_Name_boss_crisis_DB_BOSS_desc:"$Name_boss_crisis_DB_BOSS$ is a Battleship equipped with formidable firepower, designed by $Name_Kuat_Contractor$, who is sealed within the Abyss."
 tech_Name_boss_crisis_DF_BOSS:"§E$Name_boss_crisis_DF_BOSS$§!"
 tech_Name_boss_crisis_DF_BOSS_desc:"$Name_boss_crisis_DF_BOSS$ is a powerful carrier with formidable firepower, designed by the $Name_Kuat_Contractor$ sealed within the Abyss."
 tech_find_solar_system_endodia:"§EUnterraum Energy Manipulation§!"
 tech_find_solar_system_endodia_desc:"$tech_find_solar_system_endodia$ is a powerful ability originating from $Name_Kuat_Contractor$. Although it has been adapted for use in the material world, it can still partially unleash its original capabilities."
 tech_Name_boss_crisis_SPC_BOSS:"§E$Name_boss_crisis_SPC_BOSS$§!"
 tech_Name_boss_crisis_SPC_BOSS_desc:"§E$Name_boss_crisis_SPC_BOSS$§! is a standard vessel from $Name_Kuat_DeD_Contractor$, originally an experimental cruiser. The addition of rapid deployment and electronic warfare subsystems further enhances its already formidable combat capabilities."
 tech_Name_boss_crisis_SP_BOSS:"§E$Name_boss_crisis_SP_BOSS$§!"
 tech_Name_boss_crisis_SP_BOSS_desc:"§E$Name_boss_crisis_SP_BOSS$§! is a standard vessel from $Name_Kuat_DeD_Contractor$. This ship Dismantles the Strike Craft subsystem-rarely used by Battleships in head-on confrontations-freeing up additional Mid space and energy to further enhance its weaponry. Optimized Hull structure also improves the efficiency of radiative discharge, enabling superior weapon performance."
 tech_Name_boss_crisis_SPF_BOSS:"§E$Name_boss_crisis_SPF_BOSS$§!"
 tech_Name_boss_crisis_SPF_BOSS_desc:"§E$Name_boss_crisis_SPF_BOSS$§! is the pride of $Name_Kuat_DeD_Contractor$'s fleet-their flagship that serves as the core pillar in fleet operations."

  tech_Aggressor_drive: 0 "$Aggressor_cap$"
  tech_Aggressor_drive_desc: 0 "$Aggressor$ is a fast cruiser modeled after Eternal Fleet. This cruiser possesses powerful firepower and maneuverability, giving it a high degree of suppression over heavy fleets, and also offers a high level of customization."
  tech_Aggressor_drive_modding: 0 "$Aggressor$ template modification"
  tech_Aggressor_drive_modding_desc: 0 "The template-based modification of the $Aggressor$ means its outstanding customizable capabilities are further enhanced, allowing for flexible adjustments based on different combat needs."
  tech_Kandosii_drive: 0 "$Kandosii_cap$"
  tech_Kandosii_drive_desc: 0 "$Kandosii$ is a fast dreadnought based on Eternal Fleet, developed from $Aggressor$. This fast dreadnought possesses powerful firepower and maneuverability, giving it a high degree of suppression over heavy fleets, and also offers a high level of customization."
  tech_Kandosii_drive_modding: 0 "$Kandosii$ templated modification"
  tech_Kandosii_drive_modding_desc: 0 "The template-based modification of $Kandosii$ means its outstanding customizable assembly capabilities are further enhanced, allowing for flexible adjustments based on different combat needs."