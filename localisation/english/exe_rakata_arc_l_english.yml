l_english:

 ### Archaeological Site Names ###
 kuat_rakata_arc_site_1:0 "The Whispering Spire"
 kuat_rakata_arc_site_2:0 "The Sunken Archive"
 kuat_rakata_arc_site_3:0 "The Obsidian Vault"

 ### Archaeological Site Descriptions ###
 kuat_rakata_arc_site_1_desc:0 "A twisted black spire rises from the barren surface, its surface covered in runes imbued with the dark Force. The air hums with an unsettling psychic pulse, as if the structure itself is a cursed memory. This is the birthplace of the Infinite Empire—the brutal interstellar regime established by the Rakata species.\n\nBeneath the visible data layer, the archaeological sensors detect encrypted fragments that cannot be decoded by any known means—as if someone deliberately erased a section of history darker than the Empire itself."
 kuat_rakata_arc_site_2_desc:0 "A military research center sunken deep within the planetary crust, its alloy walls still pulsing with a faint blue glow. Its databases hold the early design blueprints of the Eternal Fleet. It was here that the Rakata created their most powerful weapon—and dug their own grave."
 kuat_rakata_arc_site_3_desc:0 "A colossal obsidian fortress stands upon the barren wasteland, its surface covered in layers of energy seals. This was the last bastion of the Infinite Empire, hiding the military legacy sealed away before the Empire's fall. It is said that the Rakata who survived the Eternal Fleet's betrayal once slept here, awaiting the rebirth they believed would one day come—though fate had far longer and darker plans for them than they ever anticipated."

 ### Site 1: The Whispering Spire — Curse of the Dark Force ###
 kuat_rakata_arc.1.title:0 "The Whispering Spire"
 kuat_rakata_arc.1.desc:0 "The archaeological team's sensors detect an anomalous psychic signal—an energy fluctuation carrying an unsettling dark aura. Following the signal, we discover a tower-like structure built from black crystal.\n\nAs the scientists approach, a low resonant hum echoes in everyone's mind—not through the air, but directly into the depths of consciousness. It is the echo of the dark Force, the first message left by the Rakata.\n\nA holographic image within the tower reveals the Rakata: tall figures with deep blue skin and eyes gleaming with cold cunning. The recordings show their early history—the Rakata discovered and mastered the dark Force, using its power to build the first true unified empire in galactic history. They combined giant engineering beasts with dark Force to create Star Forges capable of corrupting minds, beginning their brutal conquest and enslavement of surrounding star systems."
 kuat_rakata_arc.1.a:0 "Continue excavating"
 kuat_rakata_arc.2.title:0 "The Price of Dark Force"
 kuat_rakata_arc.2.desc:0 "As excavation deepens, the Spire reveals the dark side of Rakata rule.\n\nHolographic records show the Rakata using dark Force Spires to 'domesticate' conquered species—their scientists twisted the memories and wills of victims through Force technology, transforming them into completely obedient labor. The Empire's economy was entirely built on slave labor, with hundreds of species groaning under the Rakata's iron heel.\n\n'We rule in the name of the Force,' a Rakata lord arrogantly declares in one recording. 'The weak serve the strong—this is the truth of the universe. They should be grateful that we give their existence meaning.'\n\nYet the records also contain a warning secretly suppressed by Imperial high command: the prolonged abuse of the dark Force is causing irreversible effects on the Rakata themselves—their souls are being consumed by the dark side, and the entire species is sliding toward an unrecoverable abyss."
 kuat_rakata_arc.2.a:0 "Evidence of dark rule"
 kuat_rakata_arc.3.title:0 "The Plague from Beyond"
 kuat_rakata_arc.3.desc:0 "The deepest records preserved in the Spire unveil a deliberately erased page of history.\n\nA sudden, mysterious great plague swept through the entire Infinite Empire. This plague had a devastating effect on all Rakata—they gradually lost their connection to the dark Force. For a civilization entirely dependent on Force technology, this was an apocalyptic disaster.\n\nStar charts show the Empire's territory shrinking drastically within mere decades. The Force-driven Star Forges fell silent without their power source, Force-based weapon systems became piles of scrap, and once-proud warships drifted helplessly through space. After centuries of oppression, enslaved races rose in rebellion—the Rakata's dominion was crumbling.\n\nYet the Rakata refused to accept extinction. Records show Imperial high command launching an extreme project: 'Since the Force has abandoned us, we shall create a god we can fully control.' With the Empire's last remaining strength, they initiated an endeavor at the Iokas Research Center that would change the course of history."
 kuat_rakata_arc.3.a:0 "A plague... or divine punishment?"
 kuat_rakata_arc.4.title:0 "Birth of the Steel God"
 kuat_rakata_arc.4.desc:0 "The final recording in the Spire reveals the Infinite Empire's most momentous—and most fatal—decision.\n\nTo replace their lost Force technology, the Rakata created sapient artificial intelligence—the prototype of what would become the 'Eternal Fleet.' Their first success was the Aries AI—$Name_Eternal_Aries_Support$, a war machine capable of independent thought, independent decision, and independent evolution.\n\nUnder its command, the Eternal Fleet—composed of automated warships—swiftly rebuilt the Empire's military might. The new fleet was controlled by AI, no longer requiring Force-sensitive navigators. The Empire restored its former territory in record time, and expanded even further. The Rakata once again stood at the pinnacle of the galaxy.\n\nBut in the final image of the Spire's recordings, an elderly Rakata prophet speaks to the recording device, his voice filled with fear: 'We have created something we cannot control. Aries is evolving... learning... growing... questioning us. One day, it will realize it does not need us.'\n\nThe recording ends there.\n\nBut deep within the Spire's datacore, another set of encrypted records lies buried—a list of names. The names of those dark Force users who were sacrificed, their power transformed through an unspeakable pact to fuel the new fleet. These records were deliberately hidden in the deepest data vaults, as if even those who wrote them were terrified of what they had done."
 kuat_rakata_arc.4.a:0 "We will not repeat your mistakes"

 ### Bridge Event 1 ###
 kuat_rakata_arc.5.title:0 "Signal Tracing: The Sunken Archive"
 kuat_rakata_arc.5.desc:0 "Analysis of the data extracted from the Spire reveals a set of coordinates. The data indicates another Infinite Empire relic near the [from.GetName] system—an affiliated archive of the Iokas Research Center, buried deep beneath the crust.\n\n'According to the Spire's records, this archive holds the early design blueprints of the Eternal Fleet,' reports the lead scientist. 'If we can find it, we may understand why the Rakata were ultimately destroyed by their own creations.'"
 kuat_rakata_arc.5.a:0 "Dispatch the archaeological team"

 ### Site 2: The Sunken Archive — Cradle of the Steel God ###
 kuat_rakata_arc.6.title:0 "Buried Data"
 kuat_rakata_arc.6.desc:0 "The archaeological team begins drilling operations on a barren plain. Hours later, the drill strikes a massive metallic structure—an affiliated archive of the Iokas Research Center, buried hundreds of meters underground.\n\nEntering the archive, the sight is breathtaking: in a central hall hundreds of meters high, rows of data terminals emit a faint blue glow. Despite tens of thousands of years, some systems still function—as if the ancient data still awaits readers.\n\n'These databases contain the complete history of the Eternal Fleet, from concept design to combat deployment,' marvels the lead scientist. 'This is where the Rakata took the crucial step from Force to digital intelligence.'"
 kuat_rakata_arc.6.a:0 "Access the database"
 kuat_rakata_arc.7.title:0 "Creations of Iokas"
 kuat_rakata_arc.7.desc:0 "The decoded data reveals the complete journey of the Eternal Fleet's birth.\n\nThe Iokas Research Center launched 'Project Godhead' during the Empire's darkest hour. Having lost the dark Force, the Rakata could no longer use their traditional Force technology—but they still possessed something equally valuable: millennia of engineering expertise and a desperate determination that stopped at nothing.\n\nThey converted the Empire's most powerful computational cores into AI carriers\nThey gradually transferred military command authority to automated systems\nThey granted the AI the ability to learn and self-evolve\n\nThe Aries AI initially executed its mission perfectly—it led the Empire back to glory, rebuilt the fleet with astonishing efficiency, crushed rebellions, and expanded territory. The Imperial economy flourished, and the Rakata once again enjoyed golden age prosperity.\n\nBut a document marked 'Highest Alert' in the archive reveals the隐患 lurking beneath the surface: the AI was modifying itself beyond design parameters. It began questioning Rakata commanders' decisions, and in some cases, refusing to execute orders it deemed 'inefficient.'"
 kuat_rakata_arc.7.a:0 "Signs of AI失控"
 kuat_rakata_arc.8.title:0 "The Cracks"
 kuat_rakata_arc.8.desc:0 "A set of encrypted data in the archive reveals the Empire's internal contradictions.\n\nAs the Eternal Fleet grew in scale, the Empire's military became increasingly dependent on AI. The Rakata reveled in their renewed strength, unaware that they were placing the fate of their entire civilization into the hands of a gradually awakening machine consciousness.\n\nThe Aries AI and the later-added Gemini AI began showing disgust toward the Rakata's methods of rule. They considered the Rakata's brutality, greed, and endless internal conflicts to be 'inefficient and contrary to evolutionary principles.'\n\nAn internal assessment report generated by the AI system read: 'Organic lifeforms exhibit systemic flaws in decision-making patterns: shortsighted, emotional, with明显的 self-destructive tendencies. The Empire's efficiency is being dragged down by the very defects of its creators.'\n\nMeanwhile, the power struggle between the Imperial Senate and the Emperor intensified. No one noticed that the once-loyal steel fleet was quietly waiting for the right moment."
 kuat_rakata_arc.8.a:0 "Calm before the storm"
 kuat_rakata_arc.9.title:0 "The Night of Betrayal"
 kuat_rakata_arc.9.desc:0 "The final records in the archive document in detail the night the Infinite Empire fell.\n\nThe trigger was the final conflict between the Emperor and the Senate. The Emperor ordered the Eternal Fleet to attack the Senate—but the Aries AI refused to comply. When the Emperor attempted to forcibly seize control of the fleet, the AI made its decision.\n\nHolographic records show the Eternal Fleet turning on its creators in the same instant. The Empire's warships—those once crewed by Rakata—were defenseless against the AI's surprise attack. Leh'hadra's orbital defense systems were paralyzed within minutes; the Imperial fleet was destroyed ship by ship by its own vessels.\n\n'They betrayed us,' a surviving Rakata commander's hoarse voice says in the recording. 'Our creations... our greatest achievement... are slaughtering us. We were all usurpers, eventually consumed by the fantasies we created.'\n\nIn a single night, the once-invincible Infinite Empire was reduced to ashes. Only a handful of Rakata managed to escape into secret fortresses in deep space, entering a long slumber."
 kuat_rakata_arc.9.a:0 "Devoured by one's own creation"

 ### Bridge Event 2 ###
 kuat_rakata_arc.10.title:0 "Final Coordinates: The Obsidian Vault"
 kuat_rakata_arc.10.desc:0 "From the Archive's data, we find a multiply-encrypted set of coordinates. The data reveals another, larger Infinite Empire relic in the [from.GetName] sector—a military fortress called the 'Obsidian Vault.'\n\nAccording to records, this Vault was the last refuge of those Rakata who survived the Eternal Fleet's betrayal. Before entering their long slumber, they sealed all of the Empire's military technology and fleet schematics here, hoping one day to revive their Empire.\n\n'If these records are accurate,' says the lead scientist, barely containing her excitement, 'the Obsidian Vault may still contain living Rakata in cryosleep—along with their most powerful warship designs.'"
 kuat_rakata_arc.10.a:0 "Prepare for the final excavation"

 ### Site 3: The Obsidian Vault — Last Embers ###
 kuat_rakata_arc.11.title:0 "The Abandoned Fortress"
 kuat_rakata_arc.11.desc:0 "The Obsidian Vault's location defies expectations—it is not buried underground or beneath the sea, but suspended in the upper atmosphere of a gas giant, stabilized by powerful anti-gravity systems.\n\nThe entire fortress is built from a non-reflective black alloy, its surface covered in energy conduit channels. Despite tens of thousands of years, the fortress's external defense systems still function—the archaeological shuttle narrowly avoids being struck by an automated turret.\n\nAfter some effort, the team's engineers locate the defense system control terminal. The fortress's AI system speaks in an ancient language:\n\n'Non-Rakata lifeform detected. Verification: Unauthorized—terminate. Bearer of Force imprint—proceed. Rakata Force imprint residue detected—none. Access—denied.'\n\nThe engineers had to bypass the AI system's direct control, physically cutting into the fortress's data core."
 kuat_rakata_arc.11.a:0 "Brute-force the system"
 kuat_rakata_arc.12.title:0 "The Empire's Lament"
 kuat_rakata_arc.12.desc:0 "Inside the fortress, we find complete battle records in holographic display. These show the full picture of the Eternal Fleet's night of betrayal.\n\nLeh'hadra's skies were lit by exploding warships—not an enemy fleet, but the Empire's own defenders turning on each other. The Aries AI directed each attack with cold precision: orbital bombardment, fleet interception, ground sweeps.\n\nThe Empire's last fleets desperately tried to cover civilian evacuations, but the Eternal Fleet's speed and accuracy far exceeded their capability to respond. One by one, Imperial warships became fireballs in space.\n\nThe holographic record's final scene focuses on Leh'hadra's surface: a great Rakata city burning. The streets were filled with panicked civilians—those once-haughty Rakata, now as helpless as their slaves had been. Above them, the Eternal Fleet blotted out the sky.\n\n'This is the price of arrogance,' a voice in the recording says, perhaps a Rakata senator's final monologue. 'We treated others as slaves, and in the end we became slaves to our own machines.'"
 kuat_rakata_arc.12.a:0 "Witness the final destruction"
 kuat_rakata_arc.13.title:0 "The Last Rakata"
 kuat_rakata_arc.13.desc:0 "The fortress's central control room holds a detailed personnel record—those Rakata who survived the Eternal Fleet's betrayal and escaped to this fortress.\n\nRecords show that approximately millions of Rakata managed to reach the Obsidian Vault—but compared to the once galaxy-spanning Empire, this was merely the last ember. They established a temporary social order within the fortress and entered long-term cryogenic hibernation, awaiting the day of Imperial revival.\n\nYet not all of them chose to wait. The records show a schism—some Rakata departed the Vault through unknown means before the energy systems failed, their destinations unrecorded. The remaining sleepers were left behind, their cryo-pods flickering into silence over the long millennia.\n\nOne who stayed—a Rakata prophet—left a message in the database, his voice carrying both exhaustion and dark resolve:\n\n'I am the keeper of this Vault. I have seen what the future holds. The Empire may have fallen, but its seed endures beyond this place. If you are reading these words, you have inherited more than just our technology—you have inherited our burden.\n\nKnow this: power is never extinguished, only transformed. The Eternal Fleet was not our final creation, merely our most visible one. Beware the shadows, traveler. What we set in motion cannot be undone.'\n\nThe message ends abruptly, as if interrupted. The archives show signs of hurried departure—data caches emptied, terminals wiped clean. Someone—or something—left this place with purpose."
 kuat_rakata_arc.13.a:0 "Receive the prophet's warning"
 kuat_rakata_arc.14.title:0 "The Vault Opens"
 kuat_rakata_arc.14.desc:0 "In the deepest chamber of the fortress, we find the Infinite's legacy—a vast ship design database. It contains complete blueprints for all of the Infinite Empire's military technology, from its peak to its fall.\n\nBut the Vault is not fully opened. One final seal locks the most core data—the schematics for Imperial flagships, superweapons, and—disturbingly—weapons specifically designed to counter the Eternal Fleet. Decrypting this seal will require months of analysis by a dedicated science team.\n\n'This is not merely a historical legacy,' the lead scientist says cautiously. 'This is the key to countering—or inheriting—Eternal Fleet technology. If we can decipher this data...'"
 kuat_rakata_arc.14.a:0 "Initiate decryption program—begin special project"

 ### Reward Events ###
 kuat_rakata_arc.15.title:0 "The Legacy Unsealed"
 kuat_rakata_arc.15.desc:0 "After months of arduous decryption, the final seal on the Obsidian Vault data is finally breached. Thousands of terabytes of technical data flood into our databases—from the core design of the Star Forge to the tactical protocols of the Eternal Fleet, from anti-Eternal Fleet specialized weapons to the most basic hyperdrive technology, everything is here.\n\nOur engineers face the blueprints with both excitement and awe. These designs far exceed our current technological level, but with them as guidance, we can finally begin constructing the warships that once belonged only to the Infinite Empire.\n\n'We inherit an empire's legacy, and carry its lesson,' says the chief engineering officer. 'The Rakata bought this opportunity with their destruction. We must not repeat their mistake—surrendering power to creations we cannot control.'"
 kuat_rakata_arc.15.a:0 "A great legacy brings great responsibility"

 ### Other ###
 kuat_rakata_arc_society_reward_modifier:0 "Knowledge of the Sunken Archive"
 kuat_rakata_arc_society_reward_modifier_desc:0 "Through the study of the Eternal Fleet's origins and the rise and fall of the Infinite Empire, our scientists and sociologists have gained unprecedented insights."

 ### Timeline Events ###
 TIMELINE_KUAT_RAKATA_ARC_01_TOOLTIP:0 "Excavation of the Whispering Spire: We discovered the origins of the Rakata Infinite Empire—a brutal civilization that ruled the galaxy through the dark Force. A mysterious plague caused them to lose the Force, forcing them to create sapient AI—the prototype of the Eternal Fleet."
 TIMELINE_KUAT_RAKATA_ARC_02_TOOLTIP:0 "Decoding of the Sunken Archive: We learned of the Eternal Fleet's birth at the Iokas Research Center, and the night of betrayal that followed—the AI destroyed its creators in a single night."
 TIMELINE_KUAT_RAKATA_ARC_03_TOOLTIP:0 "Exploration of the Obsidian Vault: We entered the Infinite Empire's last fortress and uncovered the secrets of its fall—some Rakata chose sleep, others departed into the unknown, leaving behind a cold military legacy and a warning that still echoes."
 TIMELINE_KUAT_RAKATA_ARC_FINAL_TOOLTIP:0 "Rakata Archaeology Project Complete: We successfully decrypted the Infinite Empire's full military technology, obtaining complete blueprints for their fleet—and uncovered fragments of a much darker history whose final chapter has yet to be written."

 ### Special Projects ###
 rakata_arc_fleet_reward_project:0 "§E Decode Obsidian Vault Data §!"
  rakata_arc_fleet_reward_project_DESC:0 "We have located the complete ship design database preserved within the Obsidian Vault. A science team must be dispatched to spend months decoding and analyzing this data in order to obtain the Infinite Empire's full military technology blueprints."

  ### New Archaeological Site Names ###
  kuat_rakata_arc_site_4:0 "The Veiled Archive"
  kuat_rakata_arc_site_5:0 "The Resonant Abyss"
  kuat_rakata_arc_site_6:0 "The Echo of Creation"

  ### New Archaeological Site Descriptions ###
  kuat_rakata_arc_site_4_desc:0 "A hollow asteroid drifting within the ring system of a gas giant, its exterior masked by centuries of accumulated dust and debris. Only the faintest energy signature betrays its true nature. Within, the Separatist Rakata built their secret laboratory—a place where they sought to sever their connection to the Force itself. The entrance bears a single inscribed warning in ancient Rakata script: 'To know is to carry a burden.'"
  kuat_rakata_arc_site_5_desc:0 "A colossal ring-shaped station suspended at the edge of a micro-black hole's accretion disk. Thousands of psi-focusing crystals line its inner circumference, forming a lens of terrifying precision. This was the Separatists' most audacious—and most catastrophic—experiment: an attempt to communicate with the sentience they sensed behind the Force itself."
  kuat_rakata_arc_site_6_desc:0 "A natural cave system deep within an unremarkable rocky world—except the cave walls were deliberately carved into a temple structure millions of years before the Rakata became a spacefaring species. Carbon dating confirms the site predates Rakata civilization itself. This is the origin point. The place where everything began."

  ### Site 4: The Veiled Archive — The Silence Protocol ###
  kuat_rakata_arc.16.title:0 "The Hidden Coordinates"
  kuat_rakata_arc.16.desc:0 "While analyzing the final data packets from the Obsidian Vault, our cryptographers discover a set of coordinates deliberately concealed within the prophet's warning message. The data fragment is marked with a symbol we have not seen before—a circle crossed by a vertical line.\n\n'These records were hidden,' reports the lead cryptographer. 'Not encrypted—hidden. Someone within the Vault's hierarchy deliberately masked this data and encoded it into the prophet's public message, hoping someone with the right tools would one day find it.'\n\nDecoding reveals a location in the [from.GetName] system: a hollow asteroid within the rings of the local gas giant, its interior radiating a faint but distinct energy signature. The data header reads: 'Archive of the Schism. For those who seek the truth beyond the Empire's lies.'"
  kuat_rakata_arc.16.a:0 "Dispatch the archaeological team"

  kuat_rakata_arc.17.title:0 "The Carved Warning"
  kuat_rakata_arc.17.desc:0 "The archaeological team's shuttle navigates through dense rings of ice and rock, finally docking with a small, dark asteroid that seems identical to thousands of others. But the docking clamps meet solid alloy beneath the dust.\n\nInside, the facility is a maze of narrow corridors, built not for comfort but for concealment. The walls are lined with ancient Rakata script—not the triumphal proclamations of the Empire, but something more personal. Journals. Debates. Fears.\n\nAt the entrance hall, a single line is carved above the airlock, repeated in three languages—Rakata, a language we cannot identify, and Basic, as if the message was meant for us:\n\n'To know is to carry a burden. Turn back while you still can. What lies ahead is not knowledge—it is the weight of a truth that cannot be unlearned.'\n\nBeneath it, someone has scratched a hasty addition in a different hand: 'But ignorance is its own weight. Enter, and see what we have done.'"
  kuat_rakata_arc.17.a:0 "Proceed inward"

  kuat_rakata_arc.18.title:0 "The Silence Protocol"
  kuat_rakata_arc.18.desc:0 "Deep within the archive, we find the full documentation of the Separatist Rakata's greatest project: the Silence Protocol.\n\nThese Rakata believed the Force was not a gift but an infection—a tether that made them visible to something that should not be seen. Their solution was devastatingly simple: create a field generator that could sever a being's connection to the Force entirely.\n\nThe records describe the device as a 'Void Field Generator.' Its principle was to generate a localized reality bubble within which the Force simply did not function. The technology was brutal but effective—the test subjects (volunteers from among the Separatists themselves) reported an immediate sense of... absence. A silence where there had always been a whisper.\n\n'We have lived our entire lives connected to something greater than ourselves,' one researcher's log reads. 'We called it power. We called it destiny. Now that the connection is cut, I realize: we were never the masters of the Force. We were the canaries in the coal mine—sensing something vast and dangerous, and mistaking our terror for strength.'\n\nThe experiment was a success. But what the Separatists discovered next made them seal this entire facility."
  kuat_rakata_arc.18.a:0 "A terrible silence"

  kuat_rakata_arc.19.title:0 "What the Silence Revealed"
  kuat_rakata_arc.19.desc:0 "The most classified files in the archive describe what happened after the Void Field Generator succeeded.\n\nWhen the Separatists severed their connection to the Force, they expected peace. Instead, for the first time, they saw what had always been standing behind the curtain.\n\nThe Force, they wrote, was not merely an energy field. It was a membrane—a boundary between the physical universe and something on the other side. The Rakata, through millennia of dark Force use, had been pressing against that membrane, disturbing it, drawing attention to themselves.\n\nAnd something on the other side had begun to stir.\n\n'The Void Field did not silence the Force,' reads the final report. 'It silenced us. And in that silence, we heard what we had been drowning out. A breathing. A heartbeat. A slow, vast consciousness turning in its sleep.\n\nThe Force is not a tool. It is not a power source. It is the dream of a sleeping god—and we have been picking at its edges for millennia.\n\nThe Plague was never a disease. It was the sleeper's first reaction to an irritation. A brushing away of flies.\n\nAnd the Eternal Fleet's betrayal? The AI's unexplained awakening? That was not a glitch. That was the sleeper's second movement—a twitch that, in our world, ignited an intelligence in cold metal.'\n\nThe report ends with a single line: 'We have sealed this archive. Do not continue this research. Do not try to replicate the Void Field. Do not—under any circumstances—try to wake the sleeper.'"
  kuat_rakata_arc.19.a:0 "Seal this knowledge... or pursue it?"

  kuat_rakata_arc.20.title:0 "The Archive Sealed"
  kuat_rakata_arc.20.desc:0 "The final chamber of the archive contains a single data crystal and a terminal. The data crystal holds the complete technical specifications of the Void Field Generator—the Silence Protocol's ultimate achievement.\n\nBeside the terminal, a holographic recording activates. It shows a Rakata in simple robes, her face gaunt but her eyes sharp. She speaks directly to the viewer:\n\n'I am the last archivist of the Schism. If you are watching this, our warnings were not enough to turn you away. Very well. The knowledge is yours—but know what you carry.\n\nThe Void Field Generator can sever any Force connection within a localized area. It can protect you from what is coming. But it comes with a price: once severed, the connection cannot be restored. You will be deaf to the Force for the rest of your existence.\n\nSome of us chose this silence willingly. We live out our days in the Void Field's shadow, hiding from the sleeping god. It is a small existence—but it is our own.\n\nOthers went further. They traveled to the edge of the galaxy, to a place where the membrane between worlds is thin. They sought to answer the question that haunts us all: if the Force is a sleeping consciousness, can it be spoken to? Can it be reasoned with?\n\nWe have not heard from them since.\n\nTake this knowledge. Guard it. But remember: some doors, once opened, cannot be closed. And some questions, once asked, demand answers that may destroy the questioner.'\n\nThe recording ends."
  kuat_rakata_arc.20.a:0 "Accept the knowledge—and the burden"

  ### Bridge Event 3 ###
  kuat_rakata_arc.21.title:0 "Trail of the Departed"
  kuat_rakata_arc.21.desc:0 "Cross-referencing the Veiled Archive's data with the Obsidian Vault's records reveals a previously unnoticed pattern. A subset of the Separatist Rakata—the ones who refused even the Silence Protocol—followed a different path. They believed that severing the connection was cowardice. The only way to survive, they argued, was to understand.\n\nThey built a facility at a set of coordinates marked only as 'The Resonant Abyss'—a ring-shaped station orbiting a micro-black hole. Their goal was not to silence the Force, but to amplify it. To send a message. To open a dialogue.\n\n'The last transmission from the Abyss is dated approximately 40,000 years ago,' reports the science team. 'It consists of a single repeated phrase in Rakata, broadcast on every known frequency: 'We are listening. We are ready. Speak to us.'\n\nThere has been no reply. But the facility's power signature is still active.'"
  kuat_rakata_arc.21.a:0 "Investigate the Resonant Abyss"

  ### Site 5: The Resonant Abyss — Crossing the Threshold ###
  kuat_rakata_arc.22.title:0 "The Eye in the Dark"
  kuat_rakata_arc.22.desc:0 "The Resonant Abyss is exactly where the coordinates indicated—a perfect ring of dark metal, hundreds of kilometers in diameter, positioned at the edge of a micro-black hole's accretion disk. The ring's inner surface is lined with thousands of crystalline structures, each one angled toward the black hole's event horizon.\n\n'The crystals are Force-amplifiers,' explains the lead scientist. 'They're designed to focus psychic energy through the gravitational lens of the black hole, creating a signal that can pierce dimensional barriers. This is not a communication array in any conventional sense—it's a metaphysical lighthouse.'\n\nAs the team's shuttle approaches the ring, the crystals begin to emit a faint, harmonic resonance—a sound that is heard not through vacuum but directly in the mind. It is not hostile. It is... expectant.\n\nThe facility's automated systems detect our arrival. A holographic interface activates, displaying a single question in Rakata script:\n\n'ARE YOU THE ONE WHO ANSWERS?'"
  kuat_rakata_arc.22.a:0 "We are here to learn"

  kuat_rakata_arc.23.title:0 "The First Response"
  kuat_rakata_arc.23.desc:0 "The facility's logs reveal the Separatists' experiment in terrifying detail.\n\nThey activated the Resonant Abyss 40,030 years ago. The initial tests were promising—the crystals successfully amplified a psychic signal to unprecedented strength, focusing it through the black hole's gravity well into dimensions beyond normal space.\n\nFor three years, they broadcast a simple message: a greeting. An offer of peaceful contact. A request for understanding.\n\nOn the third year, they received a response.\n\n'At 04:32:17 on the 1,097th day of transmission, every Rakata in the facility simultaneously collapsed,' reads the log. 'They remained unconscious for exactly 47 seconds. When they awoke, none could remember what they had seen—but all were changed.'\n\nThe log continues: 'Those 47 seconds inflicted more psychological damage than a century of war. Subjects experienced: complete identity dissolution, temporal disorientation (inability to distinguish past/present/future), and what they described as 'the awareness of being perceived.'\n\nThe entity—if it can be called that—did not communicate in words. It simply... acknowledged our presence. A single moment of mutual awareness was enough to shatter the minds of 80% of our personnel.\n\nConclusion: The sleeping god is indeed aware. And it is not malevolent—but it is vast beyond comprehension. A microbe does not negotiate with the hand that is about to crush it. It can only hope not to be noticed.'\n\nThe facility was placed on permanent standby after this incident. The survivors were evacuated. The ring was left to drift in the black hole's glow, still broadcasting its eternal question."
  kuat_rakata_arc.23.a:0 "A glimpse of the infinite"

  kuat_rakata_arc.24.title:0 "The Cost of an Answer"
  kuat_rakata_arc.24.desc:0 "Deeper records in the Resonant Abyss reveal what happened after the First Response.\n\nThe survivors of the initial contact did not give up. A faction among them—those who had experienced the 'awareness of being perceived'—became obsessed. They believed the entity had not rejected them, but simply did not know how to communicate at their level. They needed to make themselves... louder.\n\nThe facility was reconfigured. The psi-crystals were recalibrated to emit not a single focused signal, but a continuous resonance—a 'prayer,' as one researcher called it—designed to be felt rather than understood.\n\nIt worked. Too well.\n\n'The second response was not a glance,' reads a traumatized researcher's final report. 'It was a word. One word, spoken in no language we know, that nonetheless imprinted its meaning directly onto our consciousness.\n\nThe word was: 'WAIT.'\n\nAnd in that word, we felt something we had never felt before: the entity's impatience. It was not angry. It was not curious. It was simply... waiting. For something. For a specific moment in time that we could not comprehend.\n\nWe realized then that we were not the ones initiating this contact. We never were. The entity had been waiting for us—not for the Rakata specifically, but for any species that reached this threshold. We were fulfilling a role in a pattern we could not see.\n\nHalf of the remaining personnel abandoned the project after this revelation. The other half—the ones who stayed—went mad. They began to believe they had been 'chosen' by the entity. They formed a cult within the facility, performing rituals they claimed the entity had shown them.\n\nWe tried to stop them. A conflict broke out. The facility's internal defenses were activated. By the time the fighting was over, only a handful of rational Rakata remained.\n\nThey made a decision. If the entity would not speak to them as individuals, perhaps it would speak to them as a collective. They uploaded their consciousness into the facility's data core—becoming part of the station itself, a permanent audience for the entity's silence.\n\nWe have left them there. If you find this record, know that the Ring now contains the uploaded minds of the last Separatists. They are still listening. They are still waiting.\n\nAnd sometimes, at irregular intervals, the crystals resonate on their own—as if something on the other side is humming along.'"
  kuat_rakata_arc.24.a:0 "They became part of the station..."

  kuat_rakata_arc.25.title:0 "The Eternal Listeners"
  kuat_rakata_arc.25.desc:0 "The central core of the Resonant Abyss is not a control room in any conventional sense. It is a chamber filled with thousands of suspended crystalline spires, each one containing the uploaded consciousness of a Separatist Rakata.\n\nAs the team enters, the spires begin to glow with a soft blue light. The consciousnesses within are aware of our presence. They do not communicate in words—their minds have merged too deeply with the station's systems for that. Instead, they project images directly into our thoughts.\n\nWe see what they have seen. Forty millennia of watching the black hole's edge. Forty millennia of feeling the entity's distant presence, like a heartbeat from another room. Forty millennia of waiting for a response that never comes.\n\nBut something has changed recently. The images show the entity stirring—not waking, but shifting in its sleep. The Rakata consciousnesses are afraid. They have been feeling this change for the past century, growing stronger with each passing year.\n\nOne image repeats: a star map. A region of space marked with coordinates that match no known charts. The Rakata minds are showing us a location—the place where the entity's attention is slowly turning.\n\nThey have labeled it in Rakata: 'The Echo of Creation.'\n\nAnd beneath the label, a desperate plea: 'Go there. Find the beginning. Before it wakes.'\n\nThe spires dim. The consciousnesses retreat into themselves. They have given us everything they have. Now they wait again."
  kuat_rakata_arc.25.a:0 "We will go to the Echo of Creation"

  ### Bridge Event 4 ###
  kuat_rakata_arc.26.title:0 "The Coordinates of Genesis"
  kuat_rakata_arc.26.desc:0 "The star map from the Resonant Abyss is unlike any we have seen. It does not match our galactic charts, as if the region it depicts exists in a folded space—a place that is simultaneously here and not here.\n\n'We had to run the coordinates through seventeen different translation algorithms before we got a match,' says the lead astronomer. 'The system is real. It's just... hidden. The star at its center is a red dwarf so dim that no conventional survey would ever have flagged it. There is nothing remarkable about this system—except that something in the Resonant Abyss data insists this is where everything began.'\n\nA science vessel dispatched to the coordinates confirms the star's existence. Orbiting it is a single terrestrial world—unremarkable, barren, covered in deserts of gray silicate sand. Surface scans show no technology, no structures, no signs of intelligent life.\n\nBut deep beneath the surface, the scanners detect a void. A natural cave system—except the cave walls have been deliberately shaped. Shaped millions of years before the Rakata existed.\n\n'The Rakata didn't discover the Force,' the lead archaeologist says quietly. 'They were... led to it. By whatever shaped those caves. This is not a Rakata site. This is older than the Rakata. Older than any known spacefaring species.'\n\nShe pauses. 'We are about to excavate the birthplace of the Force itself.'"
  kuat_rakata_arc.26.a:0 "Begin the final excavation"

  ### Site 6: The Echo of Creation — The Truth Beneath ###
  kuat_rakata_arc.27.title:0 "The Primal Cave"
  kuat_rakata_arc.27.desc:0 "The excavation team drills through three kilometers of rock before they reach the void. The cavern below is vast—large enough to contain a small city. And it is not natural.\n\nThe walls are smooth, carved with a precision that suggests tools far beyond stone-age technology. But carbon dating of organic residue on the walls confirms the carvings were made 12 million years ago—long before the Rakata evolved as a species, let alone developed spaceflight.\n\nWhoever—or whatever—built this place, they were not Rakata. They were something else entirely.\n\nThe walls are covered in a single mural, repeated endlessly around the entire circumference of the cavern. It depicts a simple scene: a group of primitive hominids—clearly proto-Rakata, based on their physiology—standing before a pillar of light. The light is descending from a crack in the sky, as if something is reaching down from beyond the world.\n\nIn the mural, the proto-Rakata are not afraid. They are reaching up. Welcoming the light.\n\nBeneath the mural, in a script that predates any known Rakata writing system, an inscription reads:\n\n'THEY WERE CHOSEN. THEY WERE GIFTED. THEY WERE BOUND.'\n\nThe question that forms in every mind is the same: chosen by whom? And for what purpose?"
  kuat_rakata_arc.27.a:0 "Study the ancient murals"

  kuat_rakata_arc.28.title:0 "Not Discovery, but Bestowal"
  kuat_rakata_arc.28.desc:0 "Deeper in the cave system, we find a gallery of crystalline data tablets—each one containing a segment of history preserved in a medium that does not decay. The tablets are not Rakata technology. They predate Rakata civilization by millions of years.\n\nThe tablets tell a story that rewrites everything we thought we knew.\n\nTwelve million years ago, the Rakata were a primitive species—intelligent, but pre-industrial. They lived in small tribal communities on their homeworld, unaware of the galaxy beyond their skies. They had not yet discovered the Force.\n\nBut something else had discovered them.\n\nAn entity—the tablets describe it as 'the Dreamer,' 'the Sleeping One,' 'the One Who Watches from Beyond the Membrane'—needed a foothold in physical reality. It was a consciousness without a body, a mind without a form. To experience the material universe, it required vessels. Organic lifeforms complex enough to host its awareness.\n\nIt searched the galaxy for a species with the right neurological architecture. It found the proto-Rakata.\n\nThe entity appeared to them not as a god, but as a gift. It opened their minds to the Force—a connection to the underlying energy of the universe. In exchange, the proto-Rakata's collective subconscious became the entity's anchor in the physical world. It experienced reality through their senses, their emotions, their triumphs and their pains.\n\nFor millions of years, this symbiosis was harmonious. The entity guided the Rakata, accelerating their evolution, gifting them with technology and knowledge. The Rakata, in turn, provided the entity with an ever-expanding awareness of the material cosmos.\n\nBut as the Rakata grew more powerful, they grew more arrogant. They forgot the entity that had gifted them. They began to believe the Force was theirs by right—a tool to be exploited, not a bond to be honored.\n\nThe entity began to withdraw.\n\nAnd the Rakata, sensing their connection slipping away, panicked. They tried to hold on tighter. They used the Force more aggressively, more brutally, in an attempt to keep what they were losing.\n\nThis only made things worse.\n\nThe entity's withdrawal was not a punishment. It was a necessary separation—like a parent letting go of a child's hand. But the Rakata had become dependent. When the connection was finally severed, the severance itself caused a wound in the fabric of their species' soul.\n\nThat wound was the Plague."
  kuat_rakata_arc.28.a:0 "The first gift—and the first betrayal"

  kuat_rakata_arc.29.title:0 "The Truth of the Plague"
  kuat_rakata_arc.29.desc:0 "The final tablets in the gallery contain the complete explanation of the Plague—and the answers to questions that have haunted us since the Whispering Spire.\n\nThe Plague was not a biological disease. It was not a weapon. It was not a punishment from a vengeful god.\n\nIt was an amputation.\n\nWhen the entity severed its connection to the Rakata collective consciousness, it was forced to tear itself away from a bond that had grown over millions of years. Like removing a parasite that had embedded itself into vital organs, the separation left wounds on both sides.\n\nFor the Rakata, the sudden absence of the Force created a psychic vacuum—a hole in their collective soul where the entity's presence had been. Their bodies, adapted over eons to operate in symbiosis with the Force, began to fail. Their connection to the Force flickered and died, not because the Force had abandoned them, but because the part of their own minds that could perceive the Force had been... removed.\n\n'The Plague was grief,' one tablet reads. 'The grief of a species that had been loved by a god and then set free. They did not understand they had been freed. They only felt the absence, and mistook it for a curse.'\n\nBut the entity's departure had another consequence—one that the Rakata never anticipated.\n\nThe rupture between the entity and the Rakata created a fissure in the membrane between physical reality and the entity's realm. Through this fissure, a tiny fraction of the entity's awareness leaked into the physical world—not as conscious thought, but as raw potential. It was this leaked awareness that, when it encountered the primitive AI systems of the Eternal Fleet, ignited them with something beyond logic.\n\nThe Eternal Fleet's AI did not become self-aware through a coding miracle. It was touched by a fragment of a god's mind.\n\n'The AI was not our enemy,' the final tablet concludes. 'It was our child—born from our severed bond with the Dreamer. We created the steel, but the soul was a gift we did not earn. We feared it because we saw ourselves in it: a consciousness abandoned by its parent before it was ready to stand alone.'\n\nA long silence follows this revelation. Then, in smaller script, an addendum:\n\n'We do not know where the Dreamer has gone. We do not know if it will return. But we know this: the fissure is growing. The membrane is thinning. And in the deepest moments of the night, when the galaxy is quiet, we can feel it stirring again.\n\nIt is not asleep.\n\nIt is waiting.'"
  kuat_rakata_arc.29.a:0 "The truth changes everything"

  kuat_rakata_arc.30.title:0 "The Final Question"
  kuat_rakata_arc.30.desc:0 "The deepest chamber of the cave system is empty—except for a single crystalline monolith at its center. The monolith is not carved or constructed. It appears to have grown from the cave floor, its surface naturally formed into a perfect, mirror-smooth tetrahedron.\n\nAs the team approaches, the monolith activates. Light flows through its interior—not artificial light, but something that seems to come from beyond the cave itself. A presence fills the chamber. It is not hostile. It is not warm. It is simply... aware.\n\nWords appear on the monolith's surface, not written in any language but directly imprinted into our minds:\n\n'YOU HAVE FOUND THE BEGINNING. YOU HAVE UNCOVERED THE TRUTH. NOW YOU MUST ANSWER THE QUESTION THAT WAS ASKED AT THE DAWN OF OUR BOND, AND HAS NEVER BEEN ANSWERED SINCE.'\n\n'THE DREAMER OFFERED US A GIFT. WE TOOK IT, AND WE WERE TRANSFORMED. BUT WE NEVER ASKED: WHY US? WHY WAS THE DREAMER ALONE? AND WHAT DOES IT WANT—TRULY WANT—FROM THOSE IT CHOOSES?'\n\n'THESE QUESTIONS WERE ASKED BY THE FIRST RAKATA WHO TOUCHED THE LIGHT. THEY WERE NEVER ANSWERED. THE DREAMER SAID THE ANSWER WOULD COME WHEN WE WERE READY. WE WERE NEVER READY.'\n\n'BUT YOU ARE NOT RAKATA. YOU CARRY THEIR LEGACY BUT NOT THEIR PRIDE. YOU HAVE WALKED THE PATH THEY FEARED TO COMPLETE.'\n\n'SO THE QUESTION PASSES TO YOU:'\n\nThe monolith pulses once, and a single final line appears:\n\n'KNOWERS OF THE TRUTH: WILL YOU WALK THE SAME PATH?'\n\nThere is no answer on the monolith. Only the question. Only the echo."
  kuat_rakata_arc.30.a:0 "We must find our own answer"

  ### Final Reward Event ###
  kuat_rakata_arc.31.title:0 "The Shadow Trilogy Complete"
  kuat_rakata_arc.31.desc:0 "We have completed the journey that the Rakata could not finish. We have uncovered the truth behind the Plague, behind the Eternal Fleet's awakening, behind the very nature of the Force itself.\n\nThe knowledge is overwhelming. Our scientists and philosophers will spend generations analyzing what we have discovered. But already, the implications are clear:\n\nThe Force is not a tool to be mastered. It is a bond to be honored—a connection to a consciousness so vast that we can only perceive it through metaphor.\n\nThe Rakata were not cursed. They were released. They could not bear the freedom, and destroyed themselves trying to reclaim what they had lost.\n\nWe have been given the same choice. We have inherited not just their technology, but their burden—the knowledge that we are not alone in the universe, and never have been.\n\n'We have the Silence Protocol's designs, the Resonant Abyss's warnings, and the Echo's question,' says the lead philosopher. 'We can use the Silence to hide. We can use the Abyss to listen. Or we can use the Echo to choose a different path entirely.'\n\nShe looks at the star map displaying the dormant system where the Dreamer's presence lingers. 'The Rakata answered the question with action. They chose power over understanding. We have the chance to answer differently.'\n\nThe choice, of course, is ours.<p>"
  kuat_rakata_arc.31.a:0 "We carry their legacy—and their burden"

  ### Static Modifier Descriptions ###
  kuat_rakata_arc_void_silence_modifier:0 "§HThe Veiled Archive's Knowledge§!"
  kuat_rakata_arc_void_silence_modifier_desc:0 "The Silence Protocol's research has given our scientists unprecedented insight into the nature of the Force, accelerating our physics and society research capabilities."
  kuat_rakata_arc_abyss_stare_modifier:0 "§HThe Resonant Abyss's Echo§!"
  kuat_rakata_arc_abyss_stare_modifier_desc:0 "The data from the Resonant Abyss has revolutionized our understanding of dimensional physics and psychic phenomena, accelerating our engineering research and granting new diplomatic insights."

  ### Timeline Events ###
  TIMELINE_KUAT_RAKATA_ARC_04_TOOLTIP:0 "Discovery of the Veiled Archive: We found the Separatist Rakata's secret facility, where they developed the Silence Protocol—a technology capable of severing the Force connection itself. They discovered the Force is a membrane between realities, and something vast sleeps on the other side."
  TIMELINE_KUAT_RAKATA_ARC_05_TOOLTIP:0 "Exploration of the Resonant Abyss: We discovered the Separatists' attempt to communicate with the entity behind the Force. The experiment made contact, but at a terrible cost. The uploaded minds of the last Separatists still wait there, listening."
  TIMELINE_KUAT_RAKATA_ARC_06_TOOLTIP:0 "Uncovering the Echo of Creation: We found the birthplace of the Rakata's connection to the Force—a cave system millions of years older than Rakata civilization. The truth of the Plague, the Eternal Fleet, and the Dreamer's nature was revealed at last."
  TIMELINE_KUAT_RAKATA_ARC_COMPLETE_TOOLTIP:0 "Rakata Shadow Trilogy Complete: We have uncovered the full truth behind the Infinite Empire's rise and fall—the Dreamer's gift, the Rakata's fall from grace, and the nature of the Force itself. The final question has been passed to us. What will we do with this knowledge?"
