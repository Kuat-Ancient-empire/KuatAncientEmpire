  executor_build.1007.title:0 "Kuat's Dawn Development Sponsorship"
  executor_build.1007.desc:0 "§P1. If you would like to sponsor us, you can use Alipay to scan the first QR code on the left and sponsor any amount, which will be considered as helping with MOD creation.\n\n§Y2. If you have requests regarding custom ship models, please join the QQ group to contact the author directly. QQ group number: 637596124; or scan the first QR code on the right to join our channel and contact the author.\n\n§G3. If you want to view the update logs of the MODs I develop and maintain, you can scan the first QR code on the right, join our QQ channel, and receive update information in a timely manner.§!\n\nRegardless, thank you very much for your support of 'Kuat's Dawn'"
  executor_build.1007.a:0 "Exit"
  executor_build.1008.title:0 "Communications"
  executor_build.1008.desc:0 "Welcome to the deployment menu, where you can select the basic functions of this mod that you need to access.\n\nContact Shipyard: Contact Kuat Shipyards, where you can purchase a large number of ships from Kuat.\nLaunch Psionic Harassment: Deploy a powerful psionic field from the Eternal Fortress targeting a specific region; within this field, the efficiency of the Eternal Fleet will be reduced.\nCentralize Automated Starports: Mass-deploy automated starports on all currently eligible Worlds."
  executor_build.1008.a:0 "Contact Shipyard"
  executor_build.1008.b:0 "Launch Psionic Harassment (Test)"
  executor_build.1008.c:"Centralize Automated Starports"
  executor_build.1008.g:"Force AI to Deploy Automated Starports"
  executor_build.1008.g.tooltip:"This will force all AI-controlled Worlds to centrally operate according to the automated starport algorithm. (Try clicking this if experiencing lag)"
  executor_build.1008.check.planet:"We currently have no Worlds eligible for automated starport deployment"
  executor_build.1008.check.resource:0 "We do not have sufficient resources"
  executor_build.1008.check.flag:0 "cooldown"
  executor_build.1008.clear_storm:"Crash Temporary Check (Storm)"
  executor_build.1008.clear_storm_tooltip:"Clear all non-supply zone storms across the universe. If storm regions are displayed incorrectly, or crashes occur at certain times, you may use this function to temporarily resolve the issue"
  executor_build.1008.f:"$edict_kuat_remove_ship$"
