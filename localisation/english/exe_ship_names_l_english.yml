 kuat_mission_6_chain_title:0 "§EDawn of Kuat§!"
 kuat_mission_6_chain_desc:0 "§EMechanism Explanation§!:\n§YMechanism One: ['concept_kuat_mission_6_chain_add_on_1']§!\n\n§PMechanism Two: ['concept_kuat_mission_6_chain_add_on_2']§!\n\n§BMechanism Three: ['concept_kuat_mission_6_chain_add_on_3']§!\n\n§HMechanism Four: ['concept_kuat_mission_6_chain_add_on_4']§!\n\n§R['concept_kuat_mission_6_chain_add_on_5'] can only serve the fleet it is in and cannot provide cross-fleet support.§!"

 kuat_mission_6_chain_add_on_1:"['concept_kuat_mission_6_chain_add_on_5'] Mechanism: Under normal circumstances, ensure that each fleet has exactly one ['concept_kuat_mission_6_chain_add_on_5'], and only one. This mechanism will keep all ships from this mod within the ['concept_kuat_mission_6_chain_add_on_5'] fleet fully protected until the ['concept_kuat_mission_6_chain_add_on_5'] is destroyed during combat against enemy fleets. Additionally, all fire rate bonuses will be disabled for both sides and converted 1-to-1 into damage bonuses. When facing aura suppression from this mod's crisis, ['concept_kuat_mission_6_chain_add_on_5'] grants your fleet resistance to suppression, enabling sufficient damage output.\n\n['concept_kuat_mission_6_chain_add_on_6'] Mechanism: ['concept_kuat_mission_6_chain_add_on_6'] serves as a support unit within the fleet, increasing the suppression resistance capability of ['concept_kuat_mission_6_chain_add_on_5'] by 25%."

 kuat_mission_6_chain_add_on_2:"Dynamic Modifiers Mechanism Module. You may adjust whether to enable this mechanism via start settings. The Dynamic Modifiers Mechanism is a core mechanic affecting all factions in this mod:\n\nSelf-Protection Mechanism: Grants fleets from the Eternal Fleet series, $Name_Kuat$ series, $Name_Kuat_Fire_base$ series, and Infinite Empire series resistance to high-level aura suppression, rendering them immune to aura-based Modifiers.\n\nPlayer Suppression Mechanism: Applies to the player and is used by the Eternal Fleet series, Infinite Empire series, $Name_kuat$ series, and Guardians series. The Eternal Fleet series portion is the most critical component of this mod, ensuring the proper operation of the ['concept_kuat_mission_6_chain_add_on_5'] system and the Eternal Fleet system.\n\nLogistics Zone Mechanism: Logistics Zones enhance the effect of ['concept_kuat_mission_6_chain_add_on_5'] while reducing the impact of dynamic modifiers. This mechanism primarily originates from Eternal Fortress, Anchor of Vela, Supreme, and ubiquitous Citadels. The effects are as follows:\n\n1. Logistics Zones increase supply limits for star systems within range. Within the supply limit, ['concept_kuat_mission_6_chain_add_on_7'] fleets gain a 500% cyclic bonus in combat, regular 1+2 ['concept_kuat_mission_6_chain_add_on_5'] fleets gain a 300% cyclic bonus, and single ['concept_kuat_mission_6_chain_add_on_5'] fleets gain a 100% cyclic bonus. Output exceeding the limit reverts to the base ['concept_kuat_mission_6_chain_add_on_5'] level, and fleets are dispatched back to the logistics zone."

 kuat_mission_6_chain_add_on_3:"Event Effects, primarily used by the Infinite Empire series, $Name_kuat$ series, Guardians, and Arbiters. Special Event Mechanisms function as random combat events, with different effects per faction.\n\nDue to their extensive use of dark Force technologies, Infinite Empire ships possess rapid reformation capabilities, allowing their main forces to mirror themselves during their first engagement.\n\nThe Wanderers are known for their mysterious methods. Their defense fleets can analyze enemies and replicate opposing vessels, even restoring destroyed friendly ships based on enemy ship losses after swiftly eliminating targets.\n\nThe $Name_kuat$ series leverages deep development of Star Dreadnoughts to rapidly disrupt enemy combat efficiency via electronic warfare systems, randomly reducing enemy cyclic damage output for short durations.\n\nGuardians and Arbiters: As experimental vessels reverse-engineered by the Endoria Empire to mimic the Eternal Fleet and $Name_kuat$ ships, Guardians and Arbiters feature $Name_kuat$-style appearances and partial Eternal Fleet combat abilities. Though their performance is unstable and ineffective against $Name_kuat$, Infinite Empire, Wanderers, or Eternal Fleet, they still provide adequate combat support. Guardians protect friendly fleets from excessive dynamic suppression, while Arbiters impose dynamic suppression on enemies."

 kuat_mission_6_chain_add_on_4:"Support Mechanism Module, primarily affecting the Eternal Fleet and Infinite Empire. The Support Mechanism ensures stable event conclusion detection and enables abnormal restarts, such as re-triggering the Eternal Fleet invasion crisis if the event chain was forcibly interrupted. This mechanism plays a crucial role in maintaining stable mod event execution."

 concept_kuat_damage_control_modifier:0 "Ship Efficiency Maintenance"
 concept_kuat_damage_control_modifier_desc:0 "Ship Efficiency Maintenance applies to its respective vessel, preserving the total percentage of $MOD_SHIP_HULL_MULT$, $MOD_SHIP_ARMOR_MULT$, $MOD_SHIP_SHIELD_MULT$, $MOD_SHIP_WEAPON_RANGE_MULT$, $MOD_SHIP_TRACKING_MULT$, $MOD_OWNED_SHIP_ACCURACY_MULT$, $MOD_SHIP_TRACKING_ADD$, $MOD_SHIP_ACCURACY_ADD$, $MOD_SHIP_SHIELD_ADD$, $MOD_SHIP_ARMOR_ADD$."
 concept_kuat_flagships_protection_strength:0 "Flagship Protection intensity"
 concept_kuat_flagships_protection_strength_desc:0 "Flagship protection intensity applies to ['concept_kuat_mission_6_chain_add_on_5'] fleets, enhancing the special shield intensity that protects the entire fleet."
 mod_kuat_damage_control_modifier:"['concept_kuat_damage_control_modifier']"
 mod_kuat_flagships_protection_strength:"['concept_kuat_flagships_protection_strength']"

