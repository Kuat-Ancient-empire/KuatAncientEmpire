l_english:
 ag_kae_oc_invasion_chain_title:0 "The Fury of $Name_Kuat_Fire_base$§!"
 ag_kae_oc_invasion_chain_desc:0 "After the dark secrets of $Name_Kuat_Fire_base$ were exposed, their ugly true nature was laid bare before the entire galaxy. They schemed against $Name_kuat$ at any cost, and now we have delivered the final blow to their strategic failure.\n\nThe hypocritical $Name_Kuat_Fire_base$ will not back down easily. They are about to launch a full-scale assault on our star systems. Any chance of avoiding war has vanished completely. Now it is time for us to send them back where they belong."

 ag_kae_e_area_arc_site_project_1:"§ERe-anchor the Jump Gateway§!"
 ag_kae_e_area_arc_site_project_1_DESC:"By using isotope-5 obtained from the Endodia ruins to reconfigure the navigation address of the Gateway, we can greatly weaken future $Name_Kuat_Fire_base$ fleets arriving in our star system. Then, the decisive battle with $Name_Kuat_Fire_base$ shall begin."


 kuat_fallen_mission_reaction.24.desc:0 "Very well, you truly are surprising. We chose you because of your past-your ancestors, the Endodia Empire, were destroyed by $Name_kuat$. It was we who allowed you to survive. And yet, you betrayed us to aid $Name_kuat$.\n\nWe gave you support more than sufficient to restore your glory, even surpassing your ancestors. Since you do not value this gift, we shall show you the fate of those who betray the Watchers."
 kuat_fallen_mission_reaction.24.accept:0 "We simply don't want to be your puppets."
 kuat_fallen_mission_reaction.24.accept.res:0 "Just excuses for your despicable actions. In the face of interest, such dignity is laughable.\n\nDo you still dare hope that $Name_kuat$ will save you? This farce must end."

 kuat_fallen_mission_reaction.25.title:0 "$Name_Kuat_StarContractor$"
 kuat_fallen_mission_reaction.25.desc:0 "Long time no see. We meet again. These insolent beings have occupied our domain for far too long-it's infuriating. But I've just cleaned house. Much better.\n\nYou look unwell. $Name_Kuat_Fire_base$ will soon use the Star-Destroyer Base to annihilate you. You're lucky, though. $Name_Kuat_StarContractor$ is very interested in you-no, in \"you.\" So if you're willing to pay a price, we can stop it all. Such a favorable deal won't come around often."
 kuat_fallen_mission_reaction.25.accept:0 "We'll make the deal."
 kuat_fallen_mission_reaction.25.accept.res:0 "Delicious. We have already distorted this star system. Now $Name_Kuat_Fire_base$'s bases can no longer lock onto this location. Hidden within this Sector is another $Name_Kuat_Fire_base$ base. Destroy it, and perhaps there remains a sliver of hope."

 kuat_fallen_mission_reaction.26.title:0 "$Name_Kuat_StarContractor$"
 kuat_fallen_mission_reaction.26.desc:0 "Not bad. As expected of you. You found [ag_kae_e_area_system.GetName] so quickly. Once, it was a glorious civilization-your own past, in fact. But that was long ago. You are not them.\n\nBut since you're here, if you're willing to pay the price, we can grant you greater chances of survival. Such a favorable deal won't come around often."
 kuat_fallen_mission_reaction.26.accept:0 "Then how should we deal with $Name_Kuat_Fire_base$?"
 kuat_fallen_mission_reaction.26.accept.res:0 "Excellent. See the Jump Gateway at the center of the Sector? The isotope-5 here can be used to re-anchor it. $Name_kuat$, whom you once aided, closed all passages leading here before leaving. Simply redirect the entire star system's Gateways, and most $Name_Kuat_Fire_base$ fleets will lose your location. A weakened $Name_Kuat_Fire_base$ will then be manageable.\n\nOnce you succeed, everything will end. I must say, \"you\" are truly fascinating."

 kuat_fallen_mission_reaction.27.title:0 "$Name_Kuat_StarContractor$"
 kuat_fallen_mission_reaction.27.desc:0 "You never cease to amaze. Such high efficiency is unheard of!\n\nBut $Name_Kuat_Fire_base$ is coming. Don't die. It's been a while since something this interesting happened."
 kuat_fallen_mission_reaction.27.accept:0 "We won't die."

 ag_kae_ge_invasion.102.a.desc:0 "The Imperial Research Department intercepted a strange signal band. This signal exhibits irregular frequency patterns unlike anything we've encountered before. Our researchers discovered through deep analysis that the signal originates from a star system previously unknown on our star charts.\n\nAs $Name_Kuat_StarContractor$ predicted, we have located the garrison star system of $Name_Kuat_Fire_base$. Defense officials warn that without a preemptive strike, we will be at a disadvantage when $Name_Kuat_Fire_base$ retaliates."

 ag_kae_ge_invasion.110.a.desc:0 "§H[Root.GetName]§! entered a bizarre region after traversing the hyperlane. The entire §H[From.GetName]§! contains no normal stars, only scattered wreckage of various ships.\n\nAt the center of §H[From.GetName]§!, §H[Root.GetName]§! detected an artificial gravity well with a radiation radius exceeding 600 AU, originating from a massive, damaged Gateway structure at the heart of the star. Surrounding the central megastructure are numerous peculiar, broken rings. All rings are destroyed, and scans confirm none can be restored to operational status. Meanwhile, our scouts report that the concentrated $Name_Kuat_Fire_base$ fleet in this system has not yet received orders from $Name_Kuat_Fire_base$, and thus has not attacked us. This presents a perfect opportunity for a first strike."

 ag_kae_ge_invasion.114.a.desc:0 "You insignificant ants dare betray us? Now you shall face our fury. We will send fleets to shatter each of your core worlds into fragments and reduce your species to nothing but primitives."

 ag_kae_ge_invasion.120.a.desc:0 "Damn it! Why do you natives possess these fleets? Don't think that with mere merchant support you can defeat us. When the Jump Gateway reactivates, your Sector, your Empire, your entire civilization will be erased."

 ag_kae_ge_invasion.126.a.desc:0 "Our researchers successfully entered the faintly visible central spire. Over time, its internal structure has severely deteriorated-precision defense instruments and robots inside no longer function properly, greatly aiding our research team's investigation.\n\nThey swiftly located the central data storage facility. Using various methods, they managed to unlock the database and uncovered astonishing data.\n\nAfter breaking the encryption, we found the key to resealing the Jump Gateway: residual isotope-5 can be used to re-anchor the Gateway address, limiting naval tonnage passing through. This will minimize the number of $Name_Kuat_Fire_base$ fleets arriving."

 ag_kae_ge_invasion.130.a.desc:0 "The Jump Gateway in [ag_kae_e_area_system.GetName] has been successfully anchored. Now, the main forces of $Name_Kuat_Fire_base$ cannot pass through normally. They will be unable to deploy large naval fleets into our Sector.\n\nAt that point, we will hold complete initiative. Fighting on home ground-advantage ours."

 ag_kae_ge_invasion.131.a.desc:0 "As $Name_Kuat_StarContractor$ said, $Name_Kuat_Fire_base$'s arrival is inevitable. We must eliminate the threat as soon as possible. These fools don't yet know we've redirected the Jump Gateway. Any fleet exceeding our tolerance threshold will be unable to enter our star system.\n\nThe redirection won't last forever. Now is when the Gateway rules are strongest. It's time to lure them in. Repair the Jump Gateway. Send them off for good."

 ag_kae_ge_invasion.132.a.desc:0 "Our researchers successfully completed the Gateway repair. According to our isotope-5 signal receiver, the Gateway's activation immediately drew attention from the other side.\n\nThis means our plan's first phase has succeeded. Now we wait for the prey to arrive."

 ag_kae_ge_invasion.202.a.desc:0 "Our intelligence division intercepted a strong tachyon signal broadcast from outside the star system. Astronomical observations cannot precisely locate its source, but evidence suggests it originated from the Gateway in our $NAME_ag_kae_e_area$ system. We cannot decode the message yet, but undoubtedly it signals the imminent arrival of $Name_Kuat_Fire_base$ fleets."

 ag_kae_ge_invasion.203.a.desc:0 "Recent astronomical observations indicate unusual energy activity at the Jump Gateway in $NAME_ag_kae_e_area$, which we occupy. $Name_Kuat_Fire_base$ is coming."

 ag_kae_ge_invasion.204.a.desc:0 "Recently, our intelligence division intercepted a series of hyperspace slips. $Name_Kuat_Fire_base$ fleets are rapidly approaching our star system via an artificial one-way hyperlane connected to our Jump Gateway. They will arrive shortly. Judging by their trajectory, the deadly drama is about to begin."

 ag_kae_ge_invasion.205.a.desc:0 "Recent astronomical observations show unusual energy activity at the Jump Gateway in $NAME_ag_kae_e_area$, under our control. Compared to last time, $Name_Kuat_Fire_base$'s fleet is making much more noise. Our soldiers must prepare."

 ag_kae_ge_invasion.206.a.desc:0 "The first extragalactic fleet has entered the gravity well of $NAME_ag_kae_e_area$ under our control and is orbiting its center. The follow-up fleet will arrive soon. So far, they have not responded to our communications-their intentions remain unclear. As $Name_Kuat_StarContractor$ said, $Name_Kuat_Fire_base$ has finally reached our star system. Fortunately, our plan succeeded. The Gateway redirection blocked most advanced $Name_Kuat_Fire_base$ fleets. Now we only need to deal with these rabble to drive them away permanently."

 ag_kae_ge_invasion.207.a.desc:0 "You damned inferior species! You dared conspire against us? Do you really think $Name_kuat$'s secret support can let you defeat us?\n\nYou are nothing but our puppets. To rebel is to invite annihilation.\n\nI admit, $Name_kuat$ helped you shut down other Jump Gateways-but what good will it do? They will suffer the harshest punishment, and your fate-only destruction awaits."

 ag_kae_ge_invasion.212.a.desc:0 "Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region; $Name_Kuat_Fire_base$ is likely to launch an offensive from there and establish a base."

 ag_kae_ge_invasion.212.b:0 "Prepare the fleet."

 ag_kae_oc_invasion_secondary_portal_poi:0 "§EJump Gateway§!"
 ag_kae_oc_invasion_secondary_portal_poi_desc:0 "The Jump Gateway is a special Star travel device created by $Name_kuat$ through research on isotope-5 from the Eternal Fleet. It allows rapid deployment of military forces. Now controlled by $Name_Kuat_Contractor$, clearly $Name_kuat$ cannot stop their plundering. Now we must rely on ourselves. If we wish to defeat them, we must destroy the Jump Gateway!"

 ag_kae_ge_invasion.213.a.desc:0 "Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region; $Name_Kuat_Fire_base$ is likely to launch an offensive from there and establish a base."
 ag_kae_ge_invasion.213.b:0 "How come another one?"

 ag_kae_ge_invasion.214.a.desc:0 "Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region; $Name_Kuat_Fire_base$ is likely to launch an offensive from there and establish a base."
 ag_kae_ge_invasion.214.b:0 "Again? Damn it."

 ag_kae_ge_invasion.215.a.desc:0 "Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region; $Name_Kuat_Fire_base$ is likely to launch an offensive from there and establish a base."
 ag_kae_ge_invasion.215.b:0 "Truly persistent."

 ag_kae_ge_invasion.216.a.desc:0 "Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region; $Name_Kuat_Fire_base$ is likely to launch an offensive from there and establish a base."
 ag_kae_ge_invasion.216.b:0 "Damn it, will this ever end."

 ag_kae_ge_invasion.217.a.desc:0 "Our research department has discovered a new jump Gateway through astronomical observations. We should quickly organize a fleet to investigate this region; $Name_Kuat_Fire_base$ is likely to launch an offensive from there and establish a base."
 ag_kae_ge_invasion.217.b:0 "Hope this is the last one."

 ag_kae_ge_invasion.220.a.desc:0 "Through our meticulous planning, the invasion by $Name_Kuat_Fire_base$ has been completely crushed. These hypocritical raiders will never defeat us. If $Name_Kuat_StarContractor$ speaks the truth, our Sector will soon be entirely sealed off-$Name_Kuat_Fire_base$ will never overcome us. Though our Strength is insufficient now, given enough time, the future may yet be ours.\n\n$Name_Kuat_Fire_base$ fell due to arrogance. We must never repeat that mistake. The new Endoria Empire begins here."

 ag_kae_ge_invasion.232.a.a.desc:0 "$Name_Kuat_Fire_base$ has completely destroyed [from.GetName]. Now, nothing remains there except a shattered World."
 ag_kae_ge_invasion.232.b.a.desc:0 "$Name_Kuat_Fire_base$ has completely destroyed [from.GetName]. Now, nothing remains there except a grotesquely distorted segment of a ring World."
 ag_kae_ge_invasion.232.c.a.desc:0 "$Name_Kuat_Fire_base$ has completely destroyed [from.GetName]. Now, nothing remains there except debris from a Habitat."
 ag_kae_ge_invasion.232.d.a.desc:0 "$Name_Kuat_Fire_base$ has completely destroyed [from.GetName]. Now, nothing remains there except a fragmented World."

 ag_kae_ge_invasion.235.a.desc:0 "Our fleet has successfully destroyed a sub-jump Gateway constructed by $Name_Kuat_Fire_base$. No reinforcements from $Name_Kuat_Fire_base$ will appear here anymore."

 ag_kae_ge_invasion.236.a.desc:0 "Another empire's fleet has successfully destroyed a sub-jump Gateway constructed by $Name_Kuat_Fire_base$. No reinforcements from $Name_Kuat_Fire_base$ will appear here anymore."

 ag_kae_ge_invasion.237.a.desc:0 "Our fleet has successfully destroyed all defense systems of the main jump Gateway. No reinforcements from $Name_Kuat_Fire_base$ will appear through this Gateway anymore."

 ag_kae_ge_invasion.238.a.desc:0 "Another empire's fleet has successfully destroyed all defense systems of the main jump Gateway. No reinforcements from $Name_Kuat_Fire_base$ will appear through this Gateway anymore."
