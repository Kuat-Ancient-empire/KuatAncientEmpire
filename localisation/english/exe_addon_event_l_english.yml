l_english:
  kuat_galatic_empire_oc_invasion_chain_title:0 "$Name_Kuat_Fire_base$§E's Fury§!"
  kuat_galatic_empire_oc_invasion_chain_desc:0 "After the dark secrets of $Name_Kuat_Fire_base$ were exposed, their true colors were laid bare before the entire galaxy. They schemed against $Name_kuat$ at every turn, and now we have dealt the final blow to their strategic ambitions.\n\nYet the hypocritical $Name_Kuat_Fire_base$ will not back down easily. They are preparing to launch a full-scale assault across our star systems. Any hope of avoiding war has vanished completely — now it is time to send them back where they belong."

  kuat_galatic_empire_e_area_arc_site_project_1: "§ERe-anchor the Jump Gateway§!"
  kuat_galatic_empire_e_area_arc_site_project_1_DESC: "By using the Isotope-5 recovered from the Endodia ruins to reconfigure the navigational address of the Jump Gateway, we can severely weaken the $Name_Kuat_Fire_base$ fleets arriving in our star system — setting the stage for our decisive battle against $Name_Kuat_Fire_base$."


  kuat_fallen_mission_reaction.24.desc:0 "Very well — you truly never cease to surprise us. We chose you because of your past: your ancestors, the Endodia Empire, were destroyed by $Name_kuat$, and it was we who allowed your bloodline to survive. Yet you betrayed us to aid $Name_kuat$.\n\nWe granted you support more than sufficient to restore your ancient glory — even to surpass your forebears. Since you do not value this gift, we shall show you the fate of those who betray the Overseers."
  kuat_fallen_mission_reaction.24.accept:0 "We simply refuse to be your puppets."
  kuat_fallen_mission_reaction.24.accept.res:0 "Nothing more than an excuse for your treachery. Before true power and interest, such pride is laughable.\n\nDo you still dare hope that $Name_kuat$ will save you? This farce ends now."

  kuat_fallen_mission_reaction.25.title:0 "$Name_Kuat_StarContractor$"
  kuat_fallen_mission_reaction.25.desc:0 "Long time no see. We meet again. Those insolent interlopers occupied our domain for far too long — it was infuriating. Fortunately, I have just cleaned house. Much better.\n\nYou look unwell. $Name_Kuat_Fire_base$ will soon unleash Starkiller Base to annihilate you. Still, fortune favors you: $Name_Kuat_StarContractor$ has taken a keen interest in you — or rather, in \"you.\" If you are willing to pay the price, we can put a stop to it all. An offer this generous will not come twice."
  kuat_fallen_mission_reaction.25.accept:0 "We accept the deal."
  kuat_fallen_mission_reaction.25.accept.res:0 "Delightful. We have already distorted the spatial coordinates of this star system; $Name_Kuat_Fire_base$'s superweapons can no longer lock onto this location. However, another $Name_Kuat_Fire_base$ outpost lies hidden within this sector. Destroy it, and a sliver of hope may yet remain for you."

  kuat_fallen_mission_reaction.26.title:0 "$Name_Kuat_StarContractor$"
  kuat_fallen_mission_reaction.26.desc:0 "Not bad — as expected of you, locating [kuat_galatic_empire_e_area_system.GetName] so quickly. Once, a glorious civilization stood here — your own ancestors, in fact. Biologically speaking, however, that was eons ago; you are no longer them.\n\nEven so, since you have come this far, we can offer you a far greater chance of survival — provided you are willing to pay the price. An offer this generous will not come twice."
  kuat_fallen_mission_reaction.26.accept:0 "Then how do we deal with $Name_Kuat_Fire_base$?"
  kuat_fallen_mission_reaction.26.accept.res:0 "Splendid. Do you see the Jump Gateway at the heart of the sector? The Isotope-5 stored here can be used to re-anchor its coordinates. $Name_kuat$, whom you once aided, sealed off all other transit corridors leading here before departing. Redirect the Gateways across this system, and the bulk of $Name_Kuat_Fire_base$'s armada will lose your coordinates. A weakened $Name_Kuat_Fire_base$ vanguard will be well within your power to crush.\n\nOnce you succeed, this ordeal will be over. I must admit — \"you\" are truly fascinating."

  kuat_fallen_mission_reaction.27.title:0 "$Name_Kuat_StarContractor$"
  kuat_fallen_mission_reaction.27.desc:0 "You never cease to amaze. Such efficiency is virtually unheard of!\n\nStill, $Name_Kuat_Fire_base$ is coming. Try not to die — it has been a long time since anything this entertaining happened."
  kuat_fallen_mission_reaction.27.accept:0 "We will survive."

  kuat_galatic_empire_ge_invasion.102.a.desc:0 "The Imperial Research Department has intercepted an anomalous signal band exhibiting irregular frequency patterns unlike anything we have encountered before. Through deep spectral analysis, our researchers determined that the transmission originates from a star system previously uncharted on our star maps.\n\nJust as $Name_Kuat_StarContractor$ foretold, we have pinpointed the forward garrison system of $Name_Kuat_Fire_base$. Defense command warns that unless we launch a preemptive strike, we will face a severe disadvantage when $Name_Kuat_Fire_base$ unleashes its retaliation."

  kuat_galatic_empire_ge_invasion.110.a.desc:0 "After traversing the hyperlane, §H[Root.GetName]§! emerged into an eerie region of space. The entire §H[From.GetName]§! system contains no natural stars — only the scattered wreckage of countless warships drifting in the void.\n\nAt the heart of §H[From.GetName]§!, §H[Root.GetName]§! detected an artificial gravity well with a radiation radius exceeding 600 AU, emanating from a colossal, damaged Gateway structure where a star should be. Surrounding this central megastructure are numerous shattered rings; scans confirm that every ring has been irreparably destroyed. Meanwhile, our scouts report that the $Name_Kuat_Fire_base$ armada massed in this system has not yet received attack orders from $Name_Kuat_Fire_base$, leaving them passive. This is our golden opportunity for a preemptive strike."

  kuat_galatic_empire_ge_invasion.114.a.desc:0 "You insignificant insects dare betray us?! Now you shall taste our wrath! We will dispatch our armadas to shatter every last one of your core worlds into dust and blast your species back to the stone age!"

  kuat_galatic_empire_ge_invasion.120.a.desc:0 "Damn it! How do wretched primitives like you command such fleets?! Do not delude yourselves into thinking that mere merchant handouts can save you! When the Jump Gateway reactivates, your sector, your empire, and your entire civilization will be wiped from existence!"

  kuat_galatic_empire_ge_invasion.126.a.desc:0 "Our researchers successfully entered the faintly visible central spire. Over the millennia, its internal structure has severely deteriorated — the precision defense arrays and security automatons within no longer function properly, greatly facilitating our expedition's advance.\n\nThe team swiftly located the central data repository. Employing every decryption method at their disposal, they unlocked the core database and uncovered an astonishing revelation.\n\nWithin the decrypted files lay the key to resealing the Jump Gateway: residual Isotope-5 can be used to re-anchor the Gateway's spatial address and restrict the maximum naval tonnage permitted through the conduit, drastically reducing the number of $Name_Kuat_Fire_base$ fleets that can enter our space."

  kuat_galatic_empire_ge_invasion.130.a.desc:0 "The Jump Gateway in [kuat_galatic_empire_e_area_system.GetName] has been successfully re-anchored. The main battlefleets of $Name_Kuat_Fire_base$ can no longer transit the conduit normally, preventing them from deploying overwhelming naval force into our sector.\n\nWith this, the strategic initiative is entirely ours. We fight on home ground — and the advantage is in our hands."

  kuat_galatic_empire_ge_invasion.131.a.desc:0 "As $Name_Kuat_StarContractor$ warned, $Name_Kuat_Fire_base$'s offensive is inevitable — we must eliminate this threat once and for all. Those fools do not yet realize that we have re-anchored the Jump Gateway; any fleet exceeding our mass threshold will be barred from entering our star system.\n\nHowever, the spatial redirection will not hold forever. Right now, the Gateway's mass-restriction protocols are at peak strength. It is time to spring the trap: repair the Jump Gateway, lure them through, and send them to their graves."

  kuat_galatic_empire_ge_invasion.132.a.desc:0 "Our engineering teams have completed repairs on the Jump Gateway. According to our Isotope-5 signal receivers, the Gateway's reactivation immediately drew the attention of forces on the other side.\n\nPhase One of our plan is complete. Now, we wait for our prey to walk into the trap."

  kuat_galatic_empire_ge_invasion.202.a.desc:0 "Our intelligence division has intercepted a powerful tachyon broadcast originating from beyond our star system. While astronomical arrays cannot pinpoint its exact source, all evidence indicates that the transmission was relayed through the Jump Gateway in our $NAME_kuat_galatic_empire_e_area$ system. Though the message remains encrypted, there is no doubt what it heralds: the fleets of $Name_Kuat_Fire_base$ are on the move."

  kuat_galatic_empire_ge_invasion.203.a.desc:0 "Recent astronomical observations have detected anomalous energy surges within the Jump Gateway in the $NAME_kuat_galatic_empire_e_area$ system under our control. $Name_Kuat_Fire_base$ is coming."

  kuat_galatic_empire_ge_invasion.204.a.desc:0 "Our intelligence division has detected a rapid succession of hyperspace emergence signatures. $Name_Kuat_Fire_base$ fleets are hurtling toward our star system along an artificial one-way hyperlane linked to our Jump Gateway, and will arrive shortly. Judging by their trajectory, the final curtain is about to rise."

  kuat_galatic_empire_ge_invasion.205.a.desc:0 "Astronomical observations indicate another surge of anomalous energy at the Jump Gateway in the $NAME_kuat_galatic_empire_e_area$ system under our control. Compared to the previous wave, $Name_Kuat_Fire_base$'s incoming force is generating far greater spatial turbulence. Our fleets must brace for impact."

  kuat_galatic_empire_ge_invasion.206.a.desc:0 "The first extragalactic vanguard has entered the gravity well of our $NAME_kuat_galatic_empire_e_area$ system and taken up orbit around its center, with follow-up squadrons close behind. Thus far, they have ignored all hails — though their intentions are unmistakable. Just as $Name_Kuat_StarContractor$ predicted, $Name_Kuat_Fire_base$ has finally arrived. Fortunately, our gambit succeeded: the Gateway redirection barred the bulk of $Name_Kuat_Fire_base$'s heavy armadas. Now, we need only crush these stragglers to drive them from our space forever."

  kuat_galatic_empire_ge_invasion.207.a.desc:0 "You accursed lesser beings! You dared conspire against us?! Do you truly believe $Name_kuat$'s covert meddling can save you from our wrath?\n\nYou are nothing more than puppets on our strings. To bare your fangs against your masters is to court annihilation!\n\nI admit, $Name_kuat$ helped you sever the other Jump Gateways — but what difference will it make? They shall suffer our harshest retribution, and as for you — only total obliteration awaits!"

  kuat_galatic_empire_ge_invasion.212.a.desc:0 "Through astronomical observations, our research department has detected a newly opened secondary Jump Gateway. We must dispatch a fleet to investigate the sector immediately — $Name_Kuat_Fire_base$ is almost certain to launch an offensive from there and establish a forward operating base."

  kuat_galatic_empire_ge_invasion.212.b:0 "Mobilize the fleet."

  kuat_galatic_empire_oc_invasion_secondary_portal_poi:0 "§EJump Gateway§!"
  kuat_galatic_empire_oc_invasion_secondary_portal_poi_desc:0 "The Jump Gateway is a specialized interstellar transit conduit developed by $Name_kuat$ through research on Isotope-5 recovered from the Eternal Fleet, enabling the rapid deployment of naval forces. Now seized by $Name_Kuat_Contractor$, it is clear that $Name_kuat$ can no longer contain their depredations. We must rely on our own strength — if we wish to defeat them, we must destroy the Jump Gateway!"

  kuat_galatic_empire_ge_invasion.213.a.desc:0 "Through astronomical observations, our research department has detected a newly opened secondary Jump Gateway. We must dispatch a fleet to investigate the sector immediately — $Name_Kuat_Fire_base$ is almost certain to launch an offensive from there and establish a forward operating base."
  kuat_galatic_empire_ge_invasion.213.b:0 "Why is there another one?!"

  kuat_galatic_empire_ge_invasion.214.a.desc:0 "Through astronomical observations, our research department has detected a newly opened secondary Jump Gateway. We must dispatch a fleet to investigate the sector immediately — $Name_Kuat_Fire_base$ is almost certain to launch an offensive from there and establish a forward operating base."
  kuat_galatic_empire_ge_invasion.214.b:0 "Again?! Damn it!"

  kuat_galatic_empire_ge_invasion.215.a.desc:0 "Through astronomical observations, our research department has detected a newly opened secondary Jump Gateway. We must dispatch a fleet to investigate the sector immediately — $Name_Kuat_Fire_base$ is almost certain to launch an offensive from there and establish a forward operating base."
  kuat_galatic_empire_ge_invasion.215.b:0 "They truly are relentless."

  kuat_galatic_empire_ge_invasion.216.a.desc:0 "Through astronomical observations, our research department has detected a newly opened secondary Jump Gateway. We must dispatch a fleet to investigate the sector immediately — $Name_Kuat_Fire_base$ is almost certain to launch an offensive from there and establish a forward operating base."
  kuat_galatic_empire_ge_invasion.216.b:0 "Damn it, will this ever end?!"

  kuat_galatic_empire_ge_invasion.217.a.desc:0 "Through astronomical observations, our research department has detected a newly opened secondary Jump Gateway. We must dispatch a fleet to investigate the sector immediately — $Name_Kuat_Fire_base$ is almost certain to launch an offensive from there and establish a forward operating base."
  kuat_galatic_empire_ge_invasion.217.b:0 "Let us hope this is the last one."

  kuat_galatic_empire_ge_invasion.220.a.desc:0 "Through our meticulous planning, the invasion launched by $Name_Kuat_Fire_base$ has been utterly crushed. Those hypocritical marauders will never subjugate us again. If $Name_Kuat_StarContractor$ spoke the truth, our sector will soon be completely sealed off from their reach — $Name_Kuat_Fire_base$ has lost its hold over us forever. Though our strength is not yet at its peak, given time, the future belongs to us.\n\n$Name_Kuat_Fire_base$ fell to its own hubris. We must never repeat their mistake. The new Endodia Empire begins here."

  kuat_galatic_empire_ge_invasion.232.a.a.desc:0 "$Name_Kuat_Fire_base$ has utterly annihilated [from.GetName]. Nothing remains in orbit save a shattered world."
  kuat_galatic_empire_ge_invasion.232.b.a.desc:0 "$Name_Kuat_Fire_base$ has utterly annihilated [from.GetName]. Nothing remains in orbit save a grotesquely twisted segment of a Ring World."
  kuat_galatic_empire_ge_invasion.232.c.a.desc:0 "$Name_Kuat_Fire_base$ has utterly annihilated [from.GetName]. Nothing remains in orbit save the drifting debris of a Habitat."
  kuat_galatic_empire_ge_invasion.232.d.a.desc:0 "$Name_Kuat_Fire_base$ has utterly annihilated [from.GetName]. Nothing remains in orbit save a fragmented world."

  kuat_galatic_empire_ge_invasion.235.a.desc:0 "Our fleet has successfully destroyed a secondary Jump Gateway constructed by $Name_Kuat_Fire_base$. No further reinforcements from $Name_Kuat_Fire_base$ will emerge here."

  kuat_galatic_empire_ge_invasion.236.a.desc:0 "Another empire's fleet has successfully destroyed a secondary Jump Gateway constructed by $Name_Kuat_Fire_base$. No further reinforcements from $Name_Kuat_Fire_base$ will emerge here."

  kuat_galatic_empire_ge_invasion.237.a.desc:0 "Our fleet has successfully neutralized all defensive systems of the primary Jump Gateway. No further reinforcements from $Name_Kuat_Fire_base$ will emerge through this conduit."

  kuat_galatic_empire_ge_invasion.238.a.desc:0 "Another empire's fleet has successfully neutralized all defensive systems of the primary Jump Gateway. No further reinforcements from $Name_Kuat_Fire_base$ will emerge through this conduit."
