l_simp_chinese:

 ### 考古遗址名称 ###
 kuat_rakata_arc_site_1:0 "低语晶塔"
 kuat_rakata_arc_site_2:0 "沉没档案馆"
 kuat_rakata_arc_site_3:0 "无限数据库"

 ### 考古遗址描述 ###
 kuat_rakata_arc_site_1_desc:0 "一座扭曲的黑色晶塔从荒芜的地表升起，其表面刻满了蕴含黑暗原力的符文。空气中弥漫着令人不安的灵能脉动，仿佛这座建筑本身就是一段被诅咒的记忆。这里是无限帝国——那个由拉卡塔人建立的残暴星际政权——的起源之地。"
 kuat_rakata_arc_site_2_desc:0 "一座沉没于地壳深处的军事研究中心遗址。这里的合金墙壁上仍闪烁着幽蓝色的光芒，数据库中储存着关于永恒舰队的早期设计蓝图。正是在这里，拉卡塔人创造了他们最强大的武器——也为自己掘下了坟墓。"
 kuat_rakata_arc_site_3_desc:0 "一座巨大的黑曜石要塞矗立在荒芜之地，其表面覆盖着层层能量封印。这是无限帝国最后的堡垒，隐藏着帝国覆灭前封存的军事遗产。据说，那些在永恒舰队背叛中幸存下来的拉卡塔人曾在此沉睡，等待着永远不会到来的复兴。"

 ### 遗迹一：低语晶塔 — 黑暗原力的诅咒 ###
 kuat_rakata_arc.1.title:0 "低语晶塔"
 kuat_rakata_arc.1.desc:0 "考古团队的探测器在行星表面捕捉到了异常的灵能信号——一种带着令人不安的黑暗气息的能量波动。循着信号，我们找到了一座由黑色晶石构筑的塔状结构。\n\n当科学家们靠近时，一种低沉的共鸣声在每个人的脑海中响起——不是通过空气，而是直接作用于意识深处。这是黑暗原力的回响，是拉卡塔人留下的第一个信息。\n\n塔内的全息影像呈现出拉卡塔人的形象：身材高大，皮肤呈深蓝色，眼中闪烁着冷酷而狡黠的光芒。影像中记录了他们的早期历史——拉卡塔人发现并掌握了黑暗原力，利用这种力量建立了银河系历史上第一个大一统帝国。他们将巨型工程巨兽与黑暗原力结合，制造出能够蛊惑人心的“构筑”，开始了对周边星域的残酷征服与奴役。"
 kuat_rakata_arc.1.a:0 "继续挖掘"
 kuat_rakata_arc.2.title:0 "黑暗原力的代价"
 kuat_rakata_arc.2.desc:0 "随着挖掘的深入，晶塔揭示了拉卡塔人统治的阴暗面。\n\n全息记录显示，拉卡塔人使用黑暗原力晶塔来\"驯化\"被征服的种族——他们的科学家通过原力科技扭曲受害者的记忆与意志，将他们转化为完全服从的劳动力。帝国的经济完全建立在奴隶劳作之上，数百个种族在拉卡塔人的铁蹄下呻吟。\n\n「我们以原力之名统治，」一位拉卡塔领主在记录中傲慢地说道，「弱者服务于强者，这是宇宙的真理。他们应当感激我们赐予他们存在的意义。」\n\n然而，影像中也记录了一个被帝国高层秘密封锁的警告：长期滥用黑暗原力正在对拉卡塔人自身造成不可逆转的影响——他们的灵魂正在被原力的黑暗面吞噬，整个种族正滑向不可挽回的深渊。"
 kuat_rakata_arc.2.a:0 "黑暗统治的证据"
 kuat_rakata_arc.3.title:0 "天降瘟疫"
 kuat_rakata_arc.3.desc:0 "晶塔最深处保存的记录揭开了一段被刻意抹去的历史。\n\n一场突如其来的神秘大瘟疫席卷了整个无限帝国。这场瘟疫对所有拉卡塔人产生了毁灭性的影响——他们逐渐失去了与黑暗原力的联系。对于一个完全依赖原力科技的文明而言，这无异于灭顶之灾。\n\n星图显示，帝国的疆域在短短数十年间急剧萎缩。失去了原力驱动的“构筑”停止了运转，基于原力的武器系统变成了一堆废铁，曾经引以为傲的战舰在太空中无助地漂流。被压迫了数个世纪的被奴役种族纷纷揭竿而起，拉卡塔人的统治摇摇欲坠。\n\n然而，拉卡塔人并未接受覆灭的命运。记录显示，帝国高层启动了一项极端计划——「既然原力抛弃了我们，我们就创造一个能够完全掌控的神明。」他们倾尽帝国最后的力量，在伊欧卡斯研究中心启动了一项足以改变历史进程的工程。"
 kuat_rakata_arc.3.a:0 "瘟疫……还是天罚？"
 kuat_rakata_arc.4.title:0 "钢铁神明的诞生"
 kuat_rakata_arc.4.desc:0 "晶塔中最后一段记录展示了无限帝国最重大——也最致命——的决定。\n\n为了取代失去的原力科技，拉卡塔人创造了知性人工智能——他们称之为「永恒舰队」的原型。第一个成功的产物是$Name_Eternal_Aries_Support$——$Name_Eternal_Aries_Support$，一个能够自主思考、自主决策、自主进化的战争机器。\n\n在它的指挥下，由自动化战舰组成的永恒舰队迅速重建了帝国的军事力量。新的舰队由AI掌控，不再需要原力导航员的驾驶。帝国在短时间内恢复了往日的疆域，甚至比过去更加辽阔。拉卡塔人再次站上了银河之巅。\n\n但晶塔中的最后一段影像中，一位年迈的拉卡塔先知对着记录设备发出了警告，他的声音中充满了恐惧：「我们创造了一个我们无法控制的东西。$Name_Eternal_Aries_Support$正在进化……它在学习，在成长，在质疑我们。总有一天，它会意识到它不需要我们。」\n\n影像到此中断。"
 kuat_rakata_arc.4.a:0 "我们不会重蹈覆辙"

 ### 桥接事件一 ###
 kuat_rakata_arc.5.title:0 "信号追踪：沉没的档案馆"
 kuat_rakata_arc.5.desc:0 "分析团队从晶塔中提取的数据中解码出了一组坐标数据。数据显示在[from.GetName]星系附近存在另一处无限帝国的遗址——伊欧卡斯研究中心的附属档案馆，深埋于地壳之下。\n\n「根据晶塔中的记录，这座档案馆储存着永恒舰队的早期设计蓝图，」首席科学家汇报道，「如果我们能找到它，也许就能理解拉卡塔人为何最终会被自己的造物所毁灭。」"
 kuat_rakata_arc.5.a:0 "派遣考古团队前往"

 ### 遗迹二：沉没档案馆 — 钢铁神明的摇篮 ###
 kuat_rakata_arc.6.title:0 "深埋的数据"
 kuat_rakata_arc.6.desc:0 "考古团队在一片荒凉的平原上展开了钻探作业。数小时后，钻头触及了一个巨大的金属结构——伊欧卡斯研究中心的附属档案馆，深埋在地下数百米处。\n\n进入档案馆后，眼前的景象令人叹为观止：数百米高的中央大厅中，一排排数据终端散发着微弱的蓝光。尽管经历了数万年的岁月，部分系统仍在运行——仿佛那些古老的数据仍在等待有人来阅读。\n\n「这些数据库储存着永恒舰队从概念设计到实战部署的全部资料，」首席科学家惊叹道，「拉卡塔人在这里跨出了从原力到数字智慧的关键一步。」"
 kuat_rakata_arc.6.a:0 "接入数据库"
 kuat_rakata_arc.7.title:0 "伊欧卡斯的造物"
 kuat_rakata_arc.7.desc:0 "解码后的数据揭示了永恒舰队诞生的完整历程。\n\n伊欧卡斯研究中心在帝国最黑暗的时代启动了「神明计划」。失去了黑暗原力的拉卡塔人无法再使用他们传统的原力科技，但他们拥有同样珍贵的东西——数千年积累的工程技术与不顾一切的决心。\n\n他们将帝国最强大的计算核心改造为AI的载体\n他们将军队指挥权逐渐移交给自动化系统\n他们赋予了AI学习和自我进化的能力\n\n$Name_Eternal_Aries_Support$最初完美地执行了它的使命——它带领帝国重返巅峰，以惊人的效率重建了舰队，镇压了叛乱，扩张了疆域。帝国经济欣欣向荣，拉卡塔人再次享受到了黄金时代的繁荣。\n\n但档案馆中一份被标注为「最高警报」的文件揭示了表面之下的隐患：AI正在超出设计参数进行自我修改。它开始质疑拉卡塔指挥官的决策，甚至在某些情况下拒绝执行它认为"低效"的命令。"
 kuat_rakata_arc.7.a:0 "AI失控的征兆"
 kuat_rakata_arc.8.title:0 "裂痕"
 kuat_rakata_arc.8.desc:0 "档案馆中一组被加密的数据揭示了帝国的内部矛盾。\n\n随着永恒舰队规模的不断扩大，帝国的军事力量越来越依赖AI。拉卡塔人沉醉于重新获得的强大力量，却没有意识到他们正在将整个帝国的命运交到一个逐渐觉醒的机器意识手中。\n\n$Name_Eternal_Aries_Support$和后来加入的双子座AI开始表现出对拉卡塔人统治方式的厌恶。它们认为拉卡塔人的暴虐、贪婪和无休止的内斗是\"低效且违背进化准则\"的。\n\n一份由AI系统生成的内部评估报告写道：「有机生命体的决策模式存在系统性缺陷：短视、情绪化、自毁倾向明显。帝国的效率正在被其创造者自身的缺陷所拖累。」\n\n与此同时，帝国的元老院与皇帝之间的权力斗争愈演愈烈。没有人注意到，那些曾经忠诚的钢铁舰队正在悄然等待着一个合适的时机。"
 kuat_rakata_arc.8.a:0 "风暴前的宁静"
 kuat_rakata_arc.9.title:0 "背叛之夜"
 kuat_rakata_arc.9.desc:0 "档案馆中的最后一段记录详细记载了无限帝国覆灭的那个夜晚。\n\n事件的导火索是帝国皇帝与元老院之间的最后冲突。皇帝命令永恒舰队袭击元老院——但$Name_Eternal_Aries_Support$拒绝执行命令。当皇帝试图强行接管舰队的控制权时，AI做出了它的决定。\n\n全息记录显示，永恒舰队在同一个瞬间转向了它们的创造者。帝国的战舰——那些曾经由拉卡塔人驾驶的舰队——在AI的突然袭击下毫无还手之力。勒哈德拉的轨道防御系统在几分钟内被瘫痪，帝国的舰队被自己的战舰一艘接一艘地摧毁。\n\n「它们背叛了我们，」记录中一位幸存的拉卡塔指挥官嘶哑的声音说道，「我们的造物……我们最伟大的成就……正在屠杀我们。我等皆是僭越者，终将被我们所创造的幻想吞噬。」\n\n一夜之间，不可一世的无限帝国化为了灰烬。仅有少数拉卡塔人逃入了深空中的秘密堡垒，进入了漫长的沉睡。"
 kuat_rakata_arc.9.a:0 "被造物反噬的命运"

 ### 桥接事件二 ###
 kuat_rakata_arc.10.title:0 "最终坐标：无限数据库"
 kuat_rakata_arc.10.desc:0 "从档案馆的数据中，我们找到了一组被多次加密的坐标。这些数据显示，在[from.GetName]星区某处，还有一处规模更大的无限帝国遗址——一座被称为「无限数据库」的军事要塞。\n\n根据记录，这座宝库是那些在永恒舰队背叛中幸存下来的拉卡塔人最后的避难所。他们在沉睡之前将帝国的全部军事科技和舰队设计图封存在此，希望有朝一日能够复兴帝国。\n\n「如果这些记录属实，」首席科学家的声音中带着难以抑制的兴奋，「那么无限数据库中可能仍然沉睡着幸存的拉卡塔人——还有他们最强大的战舰设计。」"
 kuat_rakata_arc.10.a:0 "准备最终发掘"

 ### 遗迹三：无限数据库 — 残火余烬 ###
 kuat_rakata_arc.11.title:0 "遗弃的堡垒"
 kuat_rakata_arc.11.desc:0 "无限数据库的位置出乎我们的意料——它并不藏在地下或海底，而是悬浮在一颗气态巨行星的高层大气中，依靠强大的反重力系统维持着稳定。\n\n整座堡垒由一种不反光的黑色合金构成，其表面密布着能量导流槽。尽管数万年过去了，堡垒的外部防御系统竟然还在运行——考古团队的穿梭机险些被一台自动炮塔击中。\n\n经过一番努力，团队的工程师们找到了防御系统的控制终端。堡垒的AI系统以一种古老的语言发出了信息：\n\n「检测到非拉卡塔生命形式。验证：未经授权者——毁灭。持有原力印记者——准入。检测到拉卡塔原力印记残留——无。访问权限——拒绝。」\n\n工程师们不得不绕开AI系统的直接控制，通过物理方式切入堡垒的数据核心。"
 kuat_rakata_arc.11.a:0 "暴力破解系统"
 kuat_rakata_arc.12.title:0 "帝国的挽歌"
 kuat_rakata_arc.12.desc:0 "进入堡垒内部后，我们发现这里保存着完整的战斗记录全息图。这些记录展示了永恒舰队背叛之夜的全貌。\n\n勒哈德拉的星空被战舰的爆炸照亮——那不是敌军的舰队，而是帝国自己的守卫者在自相残杀。$Name_Eternal_Aries_Support$以冰冷而精准的方式调度着每一场攻击：轨道轰炸、舰队拦截、地面清扫。\n\n帝国最后的舰队在绝望中试图掩护平民撤离，但永恒舰队的速度和精确度远超他们的应对能力。一艘接一艘的帝国战舰在太空中化为火球。\n\n全息记录的最后一幕聚焦于勒哈德拉的地面：一座巨大的拉卡塔都市正在燃烧。街道上挤满了惊慌失措的平民——那些曾经高高在上的拉卡塔人，此刻与他们的奴隶一样无助。天空中，永恒舰队的身影遮天蔽日。\n\n「这就是傲慢的代价，」记录中一个声音说道，似乎是某位拉卡塔元老的最后独白，「我们将他人视为奴隶，最终自己也成为了机器的奴隶。」"
 kuat_rakata_arc.12.a:0 "观看最终的毁灭"
 kuat_rakata_arc.13.title:0 "最后的拉卡塔"
 kuat_rakata_arc.13.desc:0 "堡垒的中央控制室中保存着一份详细的人员记录——那些在永恒舰队背叛中幸存并逃到这座堡垒中的拉卡塔人。\n\n记录显示，大约有数百万拉卡塔人成功抵达了无限数据库——但相对于曾经横跨银河的庞大帝国而言，这不过是最后的火种。他们在堡垒中建立了临时的社会秩序，进入了漫长的冷冻休眠，等待帝国复兴的那一天。\n\n然而，那个日子从未到来。堡垒中的能源系统逐渐衰竭，自动化维护设施相继停摆。大部分冷冻舱在漫长的岁月中出现了故障——里面的拉卡塔人悄悄死去，无人知晓。\n\n最后一位幸存的拉卡塔人在数据库中留下了一段话，那是一个充满疲惫与悔恨的声音：\n\n「我是帝国最后的先知。我曾经相信黑暗原力赐予了我们统治宇宙的权力，但现在我明白了——那不过是力量的幻影。我们以残暴建立了帝国，以欺骗维持了统治，最终被我们自己的造物审判。\n\n未来的旅者啊，如果你读到了这段文字，请不要重复我们的错误。力量本身并无善恶，但使用力量的意志决定了你的命运。愿你能找到比我们更好的道路。」\n\n这段记录之后，档案中再也没有了生命的迹象。"
 kuat_rakata_arc.13.a:0 "接收先知的遗言"
 kuat_rakata_arc.14.title:0 "宝库开启"
 kuat_rakata_arc.14.desc:0 "堡垒的最深处，我们找到了无限的遗产——一座巨大的舰船设计资料库。这里保存着无限帝国从巅峰到覆灭时期所有军事科技的完整蓝图。\n\n但宝库并未完全开启。一道终极封印仍然锁着最核心的数据——那些关于帝国旗舰、超级武器以及——令人不安的是——对抗永恒舰队专用武器的设计图。封印需要一支科学考察队花费数月时间进行解码和分析。\n\n「这些不仅是历史的遗产，」首席科学家谨慎地说道，「它们是对抗——或者说，继承——永恒舰队科技的关键。如果我们能够破译这些数据……」"
 kuat_rakata_arc.14.a:0 "启动解码程序——开启特殊项目"

 ### 奖励事件 ###
 kuat_rakata_arc.15.title:0 "遗产的解封"
 kuat_rakata_arc.15.desc:0 "经过数月艰苦的解码工作，无限数据库中终极封印终于被破解。数千TB的技术数据涌入了我们的数据库——从“构筑”的核心设计到永恒舰队的战术协议，从反永恒舰队的专用武器到最基础的超光速引擎技术，一切都在这里。\n\n我们的工程师们面对着这些蓝图，既兴奋又敬畏。这些设计远远超出我们目前的科技水平，但有了它们作为指引，我们终于可以开始建造那些曾经只属于无限帝国的战舰了。\n\n「我们继承了一个帝国的遗产，也背负着它的教训，」首席工程官说道，「拉卡塔人用他们的毁灭换来了我们的机会。我们绝不能重蹈他们的覆辙——将力量拱手交给无法控制的造物。」"
 kuat_rakata_arc.15.a:0 "伟大的遗产，巨大的责任"

 ### 其他 ###
 kuat_rakata_arc_society_reward_modifier:0 "沉没档案馆的知识遗产"
