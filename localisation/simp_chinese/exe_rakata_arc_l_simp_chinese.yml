  ### 时间线事件 ###
  TIMELINE_KUAT_RAKATA_ARC_04_TOOLTIP:0 "发现隐匿档案库：我们找到了分离派拉卡塔人的秘密设施，他们在这里开发了静默协议——一种能够切断原力连接本身的技术。他们发现原力是现实之间的一层薄膜，而某种广阔的存在在另一侧沉睡。"
  TIMELINE_KUAT_RAKATA_ARC_05_TOOLTIP:0 "探索共鸣深渊：我们发现了分离派试图与原力背后的存在进行交流的实验。实验确实建立了接触，但付出了可怕的代价。最后一批分离派的上传心智仍然在那里等待，在倾听。"
  TIMELINE_KUAT_RAKATA_ARC_06_TOOLTIP:0 "揭开创世回响：我们找到了拉卡塔人与原力连接的诞生地——一个比拉卡塔文明古老数百万年的洞穴系统。瘟疫、永恒舰队以及做梦者本质的真相终于被揭示。"
  TIMELINE_KUAT_RAKATA_ARC_COMPLETE_TOOLTIP:0 "拉卡塔暗影三部曲完成：我们已经揭示了无限帝国兴衰的全部真相——做梦者的赠予、拉卡塔人的堕落以及原力本身的本质。最终的提问已经传递给了我们。我们将如何对待这些知识？"
