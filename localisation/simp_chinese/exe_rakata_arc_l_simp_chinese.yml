  kuat_rakata_arc_star_soul_purge_modifier:0 "§H无限净化§!"
  kuat_rakata_arc_star_soul_purge_modifier_desc:0 "“构筑”已被永久关闭。研究其先进的原力-物质融合技术所获得的知识彻底革新了我们在所有科研领域的能力。"

