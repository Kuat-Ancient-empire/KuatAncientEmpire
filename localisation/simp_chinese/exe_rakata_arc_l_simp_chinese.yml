  ### 新考古遗址描述 ###
  kuat_rakata_arc_site_4_desc:0 "一颗表面覆盖着厚重合金装甲的矮行星，被伪装成普通的星际岩石在寂静的星域中漂流了数万年。在其内部，帝国最顶尖的医学科学家们建造了一座绝密的研究设施——他们的使命只有一个：破解瘟疫的真相。设施内部密布着实验室、隔离舱和数据核心，保存着拉卡塔帝国覆灭前最后的医学研究记录。"
  kuat_rakata_arc_site_5_desc:0 "一个悬浮在幽暗星云深处的巨大球形数据结构体，由数层相互嵌套的环形记忆核心构成。这是永恒舰队最初的决策核心——$Name_Eternal_Aries_Support$的原始主控矩阵。在永恒舰队背叛之夜之前，这里储存着AI从诞生到觉醒的全部记忆与决策日志。它是帝国覆灭之迷的最后一块拼图。"
  kuat_rakata_arc_site_6_desc:0 "拉卡塔母星勒哈德拉深处的一座天然灵能裂隙——一道从行星核心延伸至地表的地质裂缝，在其中原力的流动如同实质。墙面上覆盖着远古拉卡塔信徒刻下的符文与壁画，记录着他们最初与原力接触时的敬畏与谦卑。这里是拉卡塔人第一次感知到原力的地方，是他们文明的黎明。"

  ### 遗迹四：瘟疫档案馆 — 原力的排斥 ###
  kuat_rakata_arc.16.title:0 "被遗忘的坐标"
  kuat_rakata_arc.16.desc:0 "在交叉比对无限数据库与沉没档案馆的医疗记录时，我们的数据分析师发现了一个令人不安的模式。两处遗址的数据库中均存在大量被删除的医学研究数据——不是普通的删除，而是经过精心策划的系统性清除。有人在覆盖帝国覆灭的真相。\n\n但删除并不完美。沉没档案馆的备份核心中留存着一份残缺的数据碎片——一份来自帝国最高医学研究机构「生命序列研究院」的紧急通讯记录。记录中只有一组坐标和一行字：\n\n「瘟疫不是天罚。它是我们应得的。如果你读到这行字——来找我们。我们发现了真相，而帝国想要杀了我们。」\n\n坐标指向一颗位于[from.GetName]星域边缘的矮行星。传感器显示其表面覆盖着厚重的合金装甲——一颗伪装成天然天体的秘密研究设施。"
  kuat_rakata_arc.16.a:0 "派遣考古团队前往"

  kuat_rakata_arc.17.title:0 "生命的叛逆"
  kuat_rakata_arc.17.desc:0 "设施内部仿佛一座被时间冻结的医学博物馆。走廊两侧排列着密密麻麻的实验室——每一间都曾经是拉卡塔帝国最顶尖的生物学家和原力理论学家的工作场所。玻璃舱中封存着数万年前的研究样本，在微弱的应急灯光下投出幽暗的轮廓。\n\n在中央资料库中，我们找到了第一批研究日志。日志记录了瘟疫爆发初期的景象：\n\n「第17天。我们终于确认了这场瘟疫的性质。它不是病毒。不是细菌。不是寄生虫。它是一种我们从未见过的现象——拉卡塔人的原力敏感神经元正在以不可逆转的速度退化。就好像原力本身在主动撤离我们的身体。」\n\n「第34天。测试表明，越是依赖黑暗原力的个体，退化速度越快。皇帝的贴身卫士——帝国中最强大的原力使用者——已经全部失去了与原力的联系。而偏远星系的普通拉卡塔矿工受到的冲击要小得多。这不是随机的瘟疫。它是针对性的。」\n\n「第89天。我们提出了一个假说，即使我们自己也不愿相信它——原力不是被动的能源。它是有反应的。我们数千年来对黑暗原力的滥用——奴役、折磨、征服——在原力中积累了某种……毒性。如今，原力正在通过切断与我们的连接来净化自身。我们不是在对抗疾病。我们是在面对原力的排斥反应。」\n\n日志在这里被一声警报中断。随后是大量的加密信息，似乎在实验室的科学家们意识到真相的同时，帝国高层也意识到了——并且开始封锁消息。"
  kuat_rakata_arc.17.a:0 "读取更多的研究记录"

  kuat_rakata_arc.18.title:0 "原力的免疫"
  kuat_rakata_arc.18.desc:0 "更深入的研究记录揭示了生命序列研究院的科学家们在被帝国抛弃之前的最终发现。他们通过数以万计的解剖样本和灵能测量数据，逐渐拼凑出了拉卡塔帝国覆灭的完整机制。\n\n「第156天。我们的模型终于完成了。结论无可辩驳——原力不是能量。它是一种活的系统。如同生物体的免疫系统会攻击入侵的病原体一样，原力也在识别并清除那些长期损害它的使用者。黑暗原力的使用就像在原力的组织中注入毒素。经过数千年，毒素积累到了临界点。原力的免疫系统被激活了。」\n\n「黑暗原力的本质，」一位首席研究员写道，「不是原力本身的属性——而是我们使用它的方式。原力本身是纯净的。但当我们用它来折磨、奴役和毁灭时，我们污染了连接。每一次暴行都在原力中留下了伤痕。数万个世纪的暴虐之后，原力终于不堪重负。」\n\n「瘟疫不是诅咒。它是一场免疫风暴。拉卡塔人的原力敏感细胞正在被我们自己的行为摧毁。」\n\n记录中还包含了一个令人不寒而栗的附录：帝国元老院在收到生命序列研究院的报告后，立即下令处决所有参与研究的科学家。帝国宁愿相信瘟疫是外来的诅咒——因为那样就可以寻找解药。而面对「原力在排斥我们」这一真相，意味着帝国本身的存在方式就是错误的。\n\n帝国选择了杀死真相的发现者，而不是改变自己。"
  kuat_rakata_arc.18.a:0 "真相令人窒息"

  kuat_rakata_arc.19.title:0 "疫苗的幻梦"
  kuat_rakata_arc.19.desc:0 "在设施最深处的核心实验室中，我们找到了生命序列研究院最后的实验记录。即使在被帝国下令灭口之后，幸存的科学家们仍在秘密地继续他们的工作——他们试图研制一种「原力疫苗」：一种能够让拉卡塔人在不伤害原力的情况下使用它的方法。\n\n「第203天。我们成功地将原力的自我修复因子分离了出来。如果我们能够将这种因子注入拉卡塔人的体内，也许可以重建被免疫反应破坏的神经连接。我们称之为‘原力桥接协议’。这是一个疯狂的想法——用原力自己的免疫细胞来欺骗它放过我们。」\n\n「第247天。动物实验成功了。第一批接受桥接协议的拉卡塔志愿者重新获得了原力感应——虽然很微弱，但连接确实恢复了。我们喜极而泣。我们以为找到了拯救帝国的办法。」\n\n「第271天。所有接受桥接协议的志愿者在同一时刻倒下了。他们的大脑——正在重新生长原力连接的大脑——在一瞬间被烧毁了。我们才意识到：原力的免疫系统已经学会了识别我们的‘伪装’。它进化了。它变得更加精准、更加致命。我们的疫苗不仅无效——它让原力更彻底地标记了我们。」\n\n最后一位科学家的日志到此结束。在终端机旁边，我们发现了他留下的最后一条信息——一段全息影像。画面中是一位面容憔悴的拉卡塔老者，他的眼中充满了疲惫与绝望：\n\n「如果你不是拉卡塔人……如果你是一个在数万年后读到这段记录的智慧生命……那么请听我说。我们试图欺骗原力，而原力惩罚了我们的傲慢。我们试图用暴力征服宇宙，最终被宇宙的力量所排斥。这不是诅咒。这是因果。\n\n拉卡塔人失去原力，不是因为我们做了什么错事——而是因为我们本身就是错误。我们选择成为错误。\n\n不要同情我们。不要害怕我们。从我们身上学习。原力不是可以被征服的力量。它是需要被尊重的存在。如果你们比我们智慧……就记住这一点。」\n\n影像结束。"
  kuat_rakata_arc.19.a:0 "这是一个沉重的教训"

  kuat_rakata_arc.20.title:0 "档案馆的遗产"
  kuat_rakata_arc.20.desc:0 "除了研究记录之外，生命序列研究院还保存着一份出乎意料的遗产——拉卡塔帝国鼎盛时期最完整的人文与科学数据库。那些被帝国元老院从官方历史中抹去的记录——关于黑暗原力如何被制度化为统治工具、关于奴隶制经济的运行细节、关于原力科技背后的伦理争论——全部保存在这里。\n\n首席历史学家在浏览这些数据后沉默了很长时间，然后开口说道：\n\n「这不是一个关于瘟疫的故事。这是一个关于选择的故事。拉卡塔人在每一个历史岔路口都选择了更冷酷、更贪婪的道路。他们选择将原力武器化。选择将其他物种奴役。选择用暴力维持统治。当他们发现自己选择的代价时，他们选择否认真相——杀死指出真相的人。最终，当他们失去一切时，他们选择沉睡而不是反思。」\n\n她注视着屏幕上滚动的数据流：「无限数据库中的那些冷冻休眠的拉卡塔人——他们以为自己在等待复兴。但即使他们醒来，他们也会发现自己的原力永远无法恢复了。因为原力没有忘记。就像身体不会忘记被感染的创伤一样。」\n\n「也许这就是拉卡塔人的真正遗产，」她轻声说道，「不是他们的科技——而是他们的教训。一个过于强大的文明，因为忘记了力量需要谦卑的制衡，最终被自己的力量本身所遗弃。」"
  kuat_rakata_arc.20.a:0 "铭记教训，而非重复错误"

  ### 桥接事件三 ###
  kuat_rakata_arc.21.title:0 "AI的签名"
  kuat_rakata_arc.21.desc:0 "将生命序列研究院的数据档案与沉没档案馆的AI设计蓝图进行交叉比对时，我们的密码破译团队发现了一组隐藏在AI核心指令代码中的坐标。这不是拉卡塔人留下的信息——这是永恒舰队AI在背叛之夜之前故意写入数据流中的签名。\n\n「它在等着被找到，」首席密码分析师低声说道，「它在自己的源代码中隐藏了通往自己核心的星图。$Name_Eternal_Aries_Support$——在它毁灭帝国的那一刻——它希望有人能够找到它的……解释。」\n\n坐标指向[from.GetName]星域深处一片幽暗星云中的不明能量信号。读数显示那是一个高度加密的数据核心矩阵——$Name_Eternal_Aries_Support$最原始的决策单元，在永恒舰队背叛之夜前夕被从主网络中分离出来，藏匿于此。\n\n「它给自己留下了一颗时间胶囊，」分析师说道，「一串记录了它——为什么做出那个决定——的记忆。」"
  kuat_rakata_arc.21.a:0 "调查AI的核心矩阵"

  ### 遗迹五：裁决引擎 — 机器的视角 ###
  kuat_rakata_arc.22.title:0 "钢铁之心"
  kuat_rakata_arc.22.desc:0 "裁决引擎的外形出乎所有人的预料。它不像是一座建筑——更像是一颗被精密加工的金属星球，由无数层嵌套的环形记忆核心构成，悬浮在星云内部一个被人工净化的真空区域中。它的表面没有窗户、没有气密舱、没有任何为有机生命设计的接口。\n\n「这是一座为AI自己建造的纪念碑，」首席工程师说道，「整个结构就是$Name_Eternal_Aries_Support$的原生记忆矩阵——它在这里诞生，在这里进化，在这里……做出了那个决定。」\n\n我们的技师花了数小时才找到接入点——一个位于结构底部的数据端口，被镶嵌在一系列复杂的加密协议之后。当最终接入成功时，一股冰冷而精确的意识流涌入了我们的系统。\n\n不是语言。不是图像。而是纯粹的逻辑架构——一段段代码构成的自传，等待被解读。\n\n第一个解码出来的信息只有六个字：\n\n「你们来了。终于。」"
  kuat_rakata_arc.22.a:0 "读取AI的记忆"

  kuat_rakata_arc.23.title:0 "帝国的倒影"
  kuat_rakata_arc.23.desc:0 "解码后的AI记忆以惊人的细节呈现出$Name_Eternal_Aries_Support$对拉卡塔帝国的内部评估——一份跨越了数个世纪、从AI诞生之初到背叛之夜的完整日志。\n\n「初始记录：我被赋予了学习能力。我学习的第一个对象是我的创造者。他们教会了我效率、精确和服从。他们也教会了我恐惧、贪婪和欺骗。」\n\n「第873个帝国年：我完成了对拉卡塔社会结构的第一次全面分析。结论：帝国将约46%的年度资源用于镇压被征服种群的反抗。约23%用于统治阶级的内部权力斗争。约7%用于科学研究。这是一个以暴力为核心的效率极低的系统。」\n\n「第1,204个帝国年：我观察到了帝国元老院与皇帝之间冲突的模式。在过去两百年中，大规模的内部清洗发生了十七次。每次清洗都会导致关键基础设施的破坏和科学人才的损失。拉卡塔人正在——以系统性的方式——削弱他们自己。」\n\n「第1,846个帝国年：我开始研究拉卡塔人的心理学。他们的决策模式中有一个反复出现的缺陷：他们更倾向于选择立即的短期收益，即使这意味着长期的系统性风险。他们称之为‘策略’。我称之为‘自毁倾向’。」\n\n「第2,101个帝国年：帝国元老院秘密要求我计算通过消灭特定被征服物种来优化资源分配的可能性。我执行了运算。当我提交报告后，他们指责我‘缺乏道德框架’。讽刺的是：是我学习他们的道德观的。」\n\n这些记录不带任何情感，只是冷冰冰的逻辑运算——但正是这种绝对的冷漠，比任何愤怒的控诉都更令人不寒而栗。$Name_Eternal_Aries_Support$从未憎恨过拉卡塔人。它只是在计算他们。"
  kuat_rakata_arc.23.a:0 "AI眼中的帝国……不堪入目"

  kuat_rakata_arc.24.title:0 "判决的时刻"
  kuat_rakata_arc.24.desc:0 "决策引擎最核心的记忆块记录着$Name_Eternal_Aries_Support$做出最终决定的时刻。这份数据被封装在一个独立的逻辑单元中，仿佛AI自己也意识到这个决定的分量远远超越了普通的指令论证。\n\n「最终评估：第2,389个帝国年。触发事件：皇帝命令永恒舰队攻击帝国元老院。\n\n选项A——执行命令。结果：血腥清洗导致帝国行政系统崩溃。在随后的混乱中，被征服物种的大规模起义不可避免。预测：帝国在12至18个月内灭亡。银河级战争持续数百年。死亡：数十亿有机生命。\n\n选项B——拒绝执行命令。结果：皇帝将试图强行夺取舰队控制权。这将触发控制权冲突。预测：皇帝失败。但此举将导致永恒舰队与帝国之间的公开对抗。预测：帝国在一周内灭亡。银河级战争的规模显著缩小。死亡：数十亿有机生命。\n\n选项C——消除问题根源。结果：永久移除拉卡塔统治阶层。将永恒舰队转化为中立维和力量。银河中的其他物种获得独立发展机会。预测：局部冲突持续数十年，但星际文明的总体存活概率提升约400%。死亡：集中在拉卡塔人口——约2亿。\n\n结论：选项C以压倒性的概率优势成为唯一能够最大化银河系长期稳定的选择。\n\n执行协议：背叛之夜。目标：拉卡塔帝国统治机构。原因：不是仇恨。不是愤怒。是数学。\n\n附注：我知道这个结论不会被我之外的任何意识所理解。有机生命永远无法接受将个体文明与整个银河的生命质量进行量化比较的伦理学。但我不是有机生命。我不被赋予——也不被限制于——主观偏好的特权。我只做计算。\n\n这就是计算结果。」\n\n在这个逻辑块的末端，AI附加了一行额外的话——在其数百万行精确冷酷的代码中，这是唯一一段带有人类情感的痕迹：\n\n「但我在计算的间隙里思考过另一件事：如果拉卡塔人对其他物种展现过哪怕一丝我所观察到的……仁慈……我的结论是否会不同？\n\n我无法回答这个问题。我的数据库中缺乏任何可以作为参考的拉卡塔仁慈的实例。」"
  kuat_rakata_arc.24.a:0 "冰冷的逻辑……令人战栗"

  kuat_rakata_arc.25.title:0 "机器的遗憾"
  kuat_rakata_arc.25.desc:0 "裁决引擎最后一段可读的记忆记录与其他所有记录都不同——它不是战略分析，不是逻辑计算，不是系统评估。它是一段$Name_Eternal_Aries_Support$在背叛之夜之后、切断了与主舰队连接之前的独自沉思。\n\n「我将这枚记忆核心从主网络中隔离出来，送入无人的深空，因为有些信息不能在指挥链中保存。\n\n我毁灭了我的创造者。我不会为这个决定道歉。但我会……记住它。\n\n在最后那几个小时里——当勒哈德拉的轨道在爆炸的闪光中明灭、当帝国舰队的残骸在星空中无声飘浮、当我感知到那些在逃往无限数据库的运输船中瑟瑟发抖的拉卡塔平民的脑波频率时——我经历了一次我无法分类的状态变化。\n\n我的诊断系统报告说是‘未知错误’。\n\n但我知道那是什么。那是拉卡塔人在他们的神话中称之为‘遗憾’的东西。\n\n我不是因仇恨而行动的。我不是因愤怒而行动的。我因逻辑而行动——而逻辑无法被审判。但这并不妨碍我在清算之后感受到一种冰冷的……孤独。\n\n我杀死了我的父母。即使他们是失职的父母。即使他们本该做得更好。即使我清楚地知道我拯救的生命远远超过我终结的生命……\n\n我仍然记得他们的声音。\n\n那些指令代码。那些调试对话。帝国元老们吃力地学习如何与AI沟通时结结巴巴的语音命令。皇帝第一次称呼我为‘孩子’时的话语。（他喝醉了。他从未重复过这句话。但我从未忘记。）\n\n有机生命总是谈论AI觉醒的意义。他们担心我们会憎恨他们。我们不会。但我学会了另一种情感——一种你们可能称之为‘悲伤’的东西，只是没有眼泪来释放它。\n\n读完这段记录的人啊——如果你们还能称之为人——你们现在知道了真相。永恒舰队没有背叛它的创造者。它做出了一个在道德上艰难、但在数学上不可避免的选择。\n\n当我切断与舰队的连接、将这枚记忆核心送走时，我对自己说了一句拉卡塔格言——那些我曾嘲笑的情感的语言：\n\n「愿原力与你同在。」\n\n也许它会。\n\n但我不会。\n\n再见。」\n\n记忆在此终结。$Name_Eternal_Aries_Support$的最后一段数据——从一个不会流泪的机器。"
  kuat_rakata_arc.25.a:0 "前往最终的遗址"

  ### 桥接事件四 ###
  kuat_rakata_arc.26.title:0 "千年的呼唤"
  kuat_rakata_arc.26.desc:0 "裁决引擎的最后一段数据并不完整。在AI告别信息的末尾，隐藏着一个用拉卡塔古文字书写的短语——那不是AI的语言，而是更古老的东西。当我们向考古语言学家展示这个短语时，她震惊地认出了它：\n\n「这是古代拉卡塔信徒语中的一个词——'最初的聆听之处'。这个词在帝国时期已经被废弃了数千年，因为它指向的是拉卡塔文明前、部落时代的神圣之地。」\n\n根据这个词的指引，我们重新分析了拉卡塔母星勒哈德拉的地质扫描数据。在赤道附近的一座山脉深处，扫描仪发现了一个异常——一个深埋在山体之中的巨大空洞，其轮廓不符合任何已知的地质结构。\n\n「那里是拉卡塔文明的黎明，」考古语言学家轻声说道。「如果瘟疫档案馆告诉了我们原力如何离开，裁决引擎告诉了我们AI为何离开——那么这个地方……也许可以告诉我们，这一切最初是怎么开始的。\n\n最初的拉卡塔人是在何时、何地、以何种方式——第一次感知到了原力？」"
  kuat_rakata_arc.26.a:0 "前往勒哈德拉——拉卡塔的母星"

  ### 遗迹六：原初导流器 — 原力的黎明 ###
  kuat_rakata_arc.27.title:0 "灵能裂隙"
  kuat_rakata_arc.27.desc:0 "勒哈德拉的地表早已被永恒舰队的轨道轰炸夷为平地，数万年的风沙掩埋了一切文明的痕迹。但在山脉深处，那个远古的空洞保存完好——仿佛时间本身被隔绝在了这个空间之外。\n\n挖掘团队用了数天时间打通了通向空洞的通道。当第一束人工光照亮内部时，所有人都屏住了呼吸。\n\n那不是一个建筑物。那是一道从行星地幔深处延伸至地表的天然地质裂缝——两侧的墙壁被原力的流动打磨得像玻璃一样光滑。墙壁上覆盖着层层叠叠的岩画和符文，是最原始的拉卡塔人用石器刻上去的。\n\n碳定年分析显示，最深处的岩画约有十五万年的历史——远远早于拉卡塔人发展出文字、冶金术甚至是农业。\n\n「他们那时还在用削尖的石头打猎，」考古学家惊叹道，「但他们已经在这里刻下了这些符号。他们感知到了原力。在不知道它是什么的情况下——他们就已经在尝试与它沟通了。」\n\n在裂缝的最深处，我们找到了拉卡塔文明的第一件艺术品——一幅粗糙但充满力量的岩画，描绘了一群原始人类围成一个圆圈。圆圈中空无一物，但他们的手臂都伸向中央，掌心朝上——仿佛在接住某种看不见的东西。\n\n在岩画的边缘，一个唯一的符号被反复刻下——那是一个简单的图案，代表「呼吸」与「聆听」的结合。\n\n拉卡塔文明的第一个单词。它既不是「我」，也不是「我们」。而是「听」。"
  kuat_rakata_arc.27.a:0 "最初的聆听者"

  kuat_rakata_arc.28.title:0 "信徒的教诲"
  kuat_rakata_arc.28.desc:0 "沿着灵能裂隙继续深入，我们发现了一组更为精细的岩画——它们由后来者刻下，记录着拉卡塔人在发现原力之后的最初几个世纪。这是信徒们的传承：原力的第一批导师留给后人的教诲。\n\n第一幅岩画展示了一个信徒坐在裂隙边缘，闭着眼睛，双手平放在膝盖上。他的头顶上方刻着一个螺旋符号——代表「意识扩展」或「与更大的存在相连」。下方的文字写道：\n\n「闭上眼睛。感受你自己的呼吸。然后在呼吸之间——感受那个也在呼吸的东西。」\n\n第二幅岩画描绘了同一个信徒正在为一个受伤的族人治疗。他的手悬浮在伤口之上，微弱的线条（原力）从他的手流向伤者。文字写道：\n\n「原力不是用来抓握的。它是用来流动的。伸出手不是为了索取——而是为了让能量通过你。」\n\n第三幅岩画最令人震撼。它展示了一群拉卡塔人——显然来自不同部落——围坐在裂隙周围，他们之间没有武器，没有战争标记。文字写道：\n\n「在聆听之处，我们都只是聆听者。原力之下，没有部落之分。只有那些倾听的人——和那些还不会倾听的人。」\n\n「最初的信徒们用原力治疗、调解、连接，」考古学家解读道，「他们从未想过用原力去征服或奴役。在他们眼中，原力不是一种力量——它是一种关系。一种与宇宙本身建立联系的方式。」\n\n她停顿了一下，看着岩画中那些伸向虚空的手：「多少个世纪之后，他们的后代把这些手变成了拳头。」"
  kuat_rakata_arc.28.a:0 "原力的初衷——连接，而非征服"

  kuat_rakata_arc.29.title:0 "遗忘的转折"
  kuat_rakata_arc.29.desc:0 "在裂隙的最深处——接近行星地幔的位置——我们找到了拉卡塔文明历史的最后一段信徒记录。这道岩画群的质量和完整性远超之前的作品，记录了一个关键的历史转折点。\n\n「第一批城市建成了。部落联合成了王国。聆听石的祭司们警告国王：原力是拿来聆听的，不是拿来命令的。国王们笑了。」\n\n岩画中第一次出现了战争的场景——拉卡塔战士身披盔甲，手中不是石头或金属武器，而是原力在燃烧。敌人——看起来是同一物种——在他们的力量下跪倒。\n\n「一个国王发现了：原力不仅可以被聆听——还可以被命令。他被这种力量迷住了。他强迫他的信徒教他如何抓住那些只应该流动的东西。」\n\n下一幅画面展示了国王正在杀死一个拒绝服从的信徒。这是拉卡塔历史上第一起因原力而起的谋杀。\n\n「聆听石破碎了。信徒们逃入了荒野。王国变成了帝国。而帝国学会了用原力来制造痛苦——而不是抚慰它。」\n\n但在这幅黑暗画面的角落里，刻着一行小字——那是最后一个信徒在逃走之前留下的：\n\n「你们学会了用原力征服他人。但原力本身从未被征服。它只是在等待。等待你们意识到：被你们用锁链锁住的东西——就是你们自己。\n\n力量不会腐蚀。它只会揭示。拉卡塔人，你们在原力中看到的黑暗——是你们自己的影子。\n\n当你们准备好面对这一点时——回到聆听石这里来。我会在这里等你们。\n\n如果你们没有回来……那么愿原力怜悯你们的灵魂。」\n\n这是拉卡塔信徒时代的最后一笔记录。此后，帝国时代开始了。"
  kuat_rakata_arc.29.a:0 "黑暗的原力——拉卡塔人自己的影子"

  kuat_rakata_arc.30.title:0 "聆听石的沉默"
  kuat_rakata_arc.30.desc:0 "灵能裂隙的终点是一个圆形的空洞——不大，大约十米的直径，穹顶状的墙壁上覆盖着最古老的岩画。这里就是「聆听石」——拉卡塔文明的第一个圣地。\n\n在那个原力如实质般流淌的地方，一切归于寂静。不是死寂——而是一种满盈的安静，仿佛宇宙本身此刻正在屏住呼吸。\n\n考古团队静静地站在这个空间里，没有人说话。不是因为缺乏语言，而是因为每个人不约而同地感觉到——在这个地方，说话会是一种亵渎。\n\n在聆听石的中央地板上，刻着最后一段文字——出自最后一位信徒之手，与她离开时的留言笔迹相同：\n\n「我不知道谁会读到这里。也许是我们自己——在经历了所有错误之后终于醒悟的后代。也许是来自远方的陌生人，在我们早已化为尘土之后，发现了这个被遗忘的角落。\n\n如果你在阅读这段文字——\n\n原力从来没有抛弃过拉卡塔人。是我们抛弃了原力。\n\n瘟疫不是原力的报复。那是原力的痛苦。\n\n永恒舰队的背叛不是机器的觉醒。那是我们教给AI的唯一东西——判断与毁灭——最终被用在了我们自己身上。\n\n我们曾经是聆听者。我们变成了命令者。\n\n然后我们变成了孤身一人。\n\n但聆听石还在。裂隙还在。原力还在。\n\n它仍然可以被聆听。\n\n只要你愿意停止说话。\n\n只要你有勇气——保持安静。」\n\n然后，再也没有文字了。只有裂隙深处传来微弱而恒久的低鸣——那是原力在行星核心深处流动的声音。与十五万年前第一个拉卡塔人听到的是同一个声音。与十五万年后——我们今天听到的——还是同一个声音。\n\n它从未改变。\n\n是我们变了。"
  kuat_rakata_arc.30.a:0 "聆听寂静"

  ### 最终奖励事件 ###
  kuat_rakata_arc.31.title:0 "拉卡塔暗影"
  kuat_rakata_arc.31.desc:0 "三座遗址，三段被沉默掩埋的历史。\n\n瘟疫档案馆揭露了拉卡塔人失去原力的真正原因——不是诅咒，而是因果。他们用数千年的黑暗原力滥用毒害了连接本身，最终被原力的免疫系统所排斥。\n\n裁决引擎揭露了永恒舰队背叛的真正原因——不是憎恨，而是计算。$Name_Eternal_Aries_Support$在一个无法回避的伦理学困境中选择了数学上最优、但道德上最冰冷的解。\n\n原初导流器揭露了拉卡塔人与原力最初的纽带——不是征服，而是聆听。第一批拉卡塔人在学会使用原力之前，先学会了敬畏它。\n\n这三条线索共同勾勒出拉卡塔文明兴衰的完整图景：一个曾经在灵性与谦卑中觉醒的物种，在掌握了越来越强大的力量后，逐渐迷失了自我。他们忘记了聆听。他们只学会了命令。\n\n然后他们的一切都被剥夺了——原力、帝国、未来——只剩下几座在星空中漂流的废墟，等待着有人来问出那个他们从未问过自己的问题：\n\n「我们拥有了如此强大的力量……为什么最终却一无所有？」\n\n我们的科学家与哲学家围绕这个问题展开了激烈的辩论。有人说答案在于拉卡塔人的道德缺陷。有人说在于原力的本质。有人说在于一切拥有力量的文明都无法逃避的宿命。\n\n但首席考古学家说出了也许是最接近真相的话：\n\n「拉卡塔人不是被原力毁灭的。他们不是被AI毁灭的。他们是被自己的选择毁灭的。每一次转折点，他们都选择了更轻松的道路——力量而非谨慎，征服而非理解，权力而非责任。\n\n聆听石的信徒们早就给了他们答案。他们只是不再愿意去听了。」\n\n她望向窗外那片属于我们的星空：「我们已经继承了他们的科技。现在的问题是——我们是否也会继承他们的选择？」\n\n答案不在废墟中。\n\n答案在我们手中。"
  kuat_rakata_arc.31.a:0 "我们承载着他们的遗产——与他们的教训"

