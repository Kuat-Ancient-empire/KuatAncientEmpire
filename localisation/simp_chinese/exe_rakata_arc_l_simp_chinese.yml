  ### 新考古遗址名称 ###
  kuat_rakata_arc_site_4:0 "隐匿档案库"
  kuat_rakata_arc_site_5:0 "共鸣深渊"
  kuat_rakata_arc_site_6:0 "创世回响"

  ### 新考古遗址描述 ###
  kuat_rakata_arc_site_4_desc:0 "一颗在气态巨行星环带中漂流的中空小行星，其外表被数千年的尘埃与碎片所掩盖。唯有最微弱的能量信号暴露了它的真实本质。在其内部，分离派的拉卡塔人建立了他们的秘密实验室——一个他们试图彻底切断与原力联系的地方。入口处刻着一句古拉卡塔语的警告：「知晓即负担。」"
  kuat_rakata_arc_site_5_desc:0 "一座悬浮在微型黑洞吸积盘边缘的巨大环形空间站。数以千计的灵能聚焦晶体沿着它的内缘排列，形成了一个精度骇人的透镜。这是分离派最大胆——也最灾难性的——实验：尝试与他们在原力背后感知到的那个意识进行交流。"
  kuat_rakata_arc_site_6_desc:0 "一个深藏在不起眼的岩质行星内部的天然洞穴系统——但洞穴的墙壁被刻意雕刻成神庙结构，时间早于拉卡塔人成为星际物种数百万年。碳定年确认这座遗址比拉卡塔文明本身还要古老。这里是原点。一切开始的地方。"

  ### 遗迹四：隐匿档案库 — 静默协议 ###
  kuat_rakata_arc.16.title:0 "隐藏的坐标"
  kuat_rakata_arc.16.desc:0 "在分析来自黑曜石宝库的最后一批数据包时，我们的密码破译小组发现了一组被刻意隐藏在先知警告信息中的坐标。数据片段上标有一个我们从未见过的符号——一个被竖线贯穿的圆。\n\n「这些记录被隐藏了，」首席密码破译员汇报道，「不是加密——而是隐藏。宝库中的某个人故意掩盖了这些数据，将其编码在先知的公开信息中，希望有朝一日拥有合适工具的人能够发现它。」\n\n解码后显示的位置在[from.GetName]星系：一颗位于本地气态巨行星环带中的中空小行星，其内部辐射出微弱但独特的能量信号。数据头标写着一行字：「分裂者的档案。献给那些寻求帝国谎言之外的真相的人。」"
  kuat_rakata_arc.16.a:0 "派遣考古团队前往"

  kuat_rakata_arc.17.title:0 "刻在入口的警告"
  kuat_rakata_arc.17.desc:0 "考古团队的穿梭机穿过密集的冰晶与岩石环带，最终与一颗与数千颗其他小行星别无二致的黑色小行星对接。但对接钳在尘埃之下触碰到的，是坚实的合金外壳。\n\n设施内部是一个由狭窄走廊构成的迷宫——不为舒适，而为隐蔽。墙壁上刻满了古老的拉卡塔文字——不是帝国那些凯旋的宣告，而是更私人的东西。日记。争论。恐惧。\n\n在入口大厅，气密舱上方刻着一行文字，以三种语言重复——拉卡塔语、一种我们无法识别的语言，以及基础语，仿佛这信息就是为我们准备的：\n\n「知晓即负担。趁还能回头时回头吧。前方等待你的不是知识——而是无法忘怀的真相的重量。」\n\n在它下方，有人用不同的笔迹潦草地添加了一行字：「但无知也有其自身的重量。进来吧，看看我们都做了些什么。」"
  kuat_rakata_arc.17.a:0 "向深处前进"

  kuat_rakata_arc.18.title:0 "静默协议"
  kuat_rakata_arc.18.desc:0 "在档案库深处，我们找到了分离派拉卡塔人最伟大计划的完整文件：静默协议。\n\n这些拉卡塔人认为原力不是恩赐，而是感染——一条将他们与不应被看见的存在连接起来的绳索。他们的解决方案简单得令人震惊：制造一种场发生器，能够彻底切断生命体与原力的联系。\n\n记录中将该装置描述为「虚空场发生器」。其原理是产生一个局部的现实泡泡，在其中原力完全无法运作。这项技术是粗暴而有效的——测试对象（从分离派中自愿报名的人）报告说，他们立刻感受到了一种……缺失。一种过去始终存在的低语声消失了。\n\n「我们一生都与某种超越自我的存在相连，」一位研究员的日志写道，「我们称之为力量。我们称之为命运。现在连接被切断了，我才意识到：我们从来都不是原力的主人。我们是矿井中的金丝雀——感知到了某种广阔而危险的存在，却将我们的恐惧误认为力量。」\n\n实验成功了。但分离派接下来的发现，迫使他们封印了整个设施。"
  kuat_rakata_arc.18.a:0 "可怕的静默"

  kuat_rakata_arc.19.title:0 "静默所揭示的"
  kuat_rakata_arc.19.desc:0 "档案库中最机密的文件描述了虚空场发生器成功之后发生的事情。\n\n当分离派切断他们与原力的联系时，他们期待的是平静。然而，他们第一次看到了始终站在帷幕之后的东西。\n\n他们写道，原力不仅仅是一个能量场。它是一层薄膜——物理宇宙与另一侧某种存在之间的边界。拉卡塔人通过数千年的黑暗原力使用，一直在挤压那层薄膜，扰乱它，引起注意。\n\n而另一侧的某种存在已经开始苏醒。\n\n「虚空场并没有让原力静默，」最终报告写道，「它让我们静默了。而在那静默中，我们听到了我们一直淹没的声音。一次呼吸。一次心跳。一个缓慢而广袤的意识在睡梦中翻了个身。\n\n原力不是工具。它不是能源。它是一个沉睡神明的梦——而我们已经在其边缘把玩了数千年。\n\n瘟疫从来不是疾病。那是沉睡者对刺激的第一次反应。像赶走苍蝇一样。\n\n而永恒舰队的背叛？AI无法解释的觉醒？那不是故障。那是沉睡者的第二次动作——一次抽搐，在我们的世界里，点燃了冰冷金属中的智能。」\n\n报告的最后一句话是：「我们已经封印了这个档案库。不要继续这项研究。不要试图复制虚空场。不要——在任何情况下——试图唤醒沉睡者。」"
  kuat_rakata_arc.19.a:0 "封印这些知识……还是继续深究？"

  kuat_rakata_arc.20.title:0 "档案库的封印"
  kuat_rakata_arc.20.desc:0 "档案库的最后密室中只有一个数据水晶和一台终端。数据水晶中保存着虚空场发生器的完整技术规格——静默协议的最终成果。\n\n终端旁，一段全息记录启动了。画面中是一位身着朴素长袍的拉卡塔女性，面容清癯但目光锐利。她直视着观看者：\n\n「我是分裂者的最后一位档案管理员。如果你正在看这段影像，那意味着我们的警告不足以让你回头。好吧。知识归你了——但要知道你背负了什么。\n\n虚空场发生器可以在局部区域内切断任何原力连接。它可以保护你免受即将到来的东西的威胁。但它是有代价的：一旦切断，连接就无法恢复。你的余生将对原力完全失聪。\n\n我们中的一些人自愿选择了这种静默。我们在虚空场的阴影中度过余生，躲避着沉睡的神明。这是一种渺小的存在——但这是我们自己的选择。\n\n另一些人走得更远。他们前往了银河系的边缘，前往了世界之间薄膜变薄的地方。他们试图回答那个困扰我们所有人的问题：如果原力是一个沉睡的意识，能否与它对话？能否与它讲道理？\n\n自从那次之后，我们再也没有他们的消息。\n\n收下这些知识。守护它。但记住：有些门，一旦打开就无法关闭。而有些问题，一旦提出，就会带来可能毁灭提问者的答案。」\n\n记录至此结束。"
  kuat_rakata_arc.20.a:0 "接受知识——以及责任"

  ### 桥接事件三 ###
  kuat_rakata_arc.21.title:0 "出走者的踪迹"
  kuat_rakata_arc.21.desc:0 "将隐匿档案库的数据与黑曜石宝库的记录进行交叉比对，我们发现了一个之前被忽视的模式。一部分分离派拉卡塔人——那些连静默协议都拒绝的人——走上了一条不同的道路。他们认为切断连接是懦夫之举。要想生存下去，唯一的办法就是去理解。\n\n他们在坐标上标注为「共鸣深渊」的地方建造了一座设施——一个环绕微型黑洞运行的环形空间站。他们的目标不是让原力静默，而是放大它。发送一条信息。开启一次对话。\n\n「来自深渊的最后一条传输记录大约是四万年前的，」科学团队汇报说，「内容是用拉卡塔语重复的单一短语，在每一个已知频率上广播着：'我们在听。我们准备好了。对我们说话吧。'\n\n没有收到任何回复。但设施的能源信号仍然活跃。」"
  kuat_rakata_arc.21.a:0 "调查共鸣深渊"

  ### 遗迹五：共鸣深渊 — 越过门槛 ###
  kuat_rakata_arc.22.title:0 "黑暗中的眼睛"
  kuat_rakata_arc.22.desc:0 "共鸣深渊就在坐标指示的位置——一个由深色金属构成的完美圆环，直径数百公里，悬浮在微型黑洞吸积盘的边缘。圆环的内表面上排列着数千个晶体结构，每一个都指向黑洞的事件视界。\n\n「这些晶体是原力放大器，」首席科学家解释道，「它们被设计用来通过黑洞的引力透镜聚焦灵能，产生能够穿透维度的信号。这不是传统意义上的通讯阵列——这是一座形而上学的灯塔。」\n\n当团队的穿梭机接近圆环时，晶体开始发出微弱的谐波共振——一种不是通过真空传播，而是直接在脑海中听到的声音。它并不敌意。它……似乎在期待着什么。\n\n设施的自动化系统检测到了我们的到来。一个全息界面激活了，用拉卡塔文字显示了一个问题：\n\n「你就是那个将要回答的人吗？」"
  kuat_rakata_arc.22.a:0 "我们前来学习"

  kuat_rakata_arc.23.title:0 "第一次回应"
  kuat_rakata_arc.23.desc:0 "设施的日志以骇人的细节记录了分离派的实验。\n\n他们在四万零三十年前启动了共鸣深渊。最初的测试很有希望——晶体成功地将灵能信号放大到了前所未有的强度，通过黑洞的引力场聚焦到了正常空间之外的维度中。\n\n连续三年，他们播送着一条简单的信息：一声问候。一次和平接触的提议。一个理解的请求。\n\n第三年，他们收到了回应。\n\n「在传输的第1,097天的04:32:17，设施中的每一个拉卡塔人同时倒下了，」日志记载道，「他们昏迷了整整47秒。当他们醒来时，没有人记得自己看到了什么——但所有人都不再是从前的自己了。」\n\n日志继续写道：「那47秒造成的心理创伤超过了一个世纪的战争。实验对象经历了：完全的自我认同崩溃、时间定向障碍（无法区分过去/现在/未来），以及他们所描述的'被注视的觉知'。\n\n那个存在——如果它能够被如此称呼的话——并没有用语言交流。它只是……确认了我们的存在。一瞬间的相互觉知，就足以粉碎我们80%人员的理智。\n\n结论：沉睡的神明确实是觉醒了。它并非恶意——但它广阔得超出了理解。微生物不会与即将碾碎它的手掌谈判。它只能希望不被注意到。」\n\n这次事件之后，设施被置于永久待命状态。幸存者被疏散。圆环被留在了黑洞的光晕中漂流，依然在广播着它那永恒的问题。"
  kuat_rakata_arc.23.a:0 "惊鸿一瞥的无限"

  kuat_rakata_arc.24.title:0 "答案的代价"
  kuat_rakata_arc.24.desc:0 "共鸣深渊中的更深层记录揭示了第一次回应之后发生的事情。\n\n初次接触的幸存者并没有放弃。他们中的一部分人——那些经历了'被注视的觉知'的人——变得痴迷。他们相信那个存在并没有拒绝他们，只是不知道如何以他们的层次进行交流。他们需要让自己……更响亮一些。\n\n设施被重新配置了。灵能晶体被重新校准，不再发射单一的聚焦信号，而是持续不断的共振——一位研究者称之为「祈祷」——设计用来被感受而非理解。\n\n它奏效了。太奏效了。\n\n「第二次回应不是一次瞥视，」一位受创的研究员在最终报告中写道，「那是一个词。一个用我们不认识的任何语言说出的词，却将其含义直接烙印在了我们的意识中。\n\n那个词是：『等着。』\n\n在那个词中，我们感受到了从未感受过的东西：那个存在的不耐烦。它不是愤怒。它不是好奇。它只是……在等待。等待某样东西。等待某个我们无法理解的特定时间点。\n\n我们那时才意识到：我们并不是这次接触的发起者。我们从来都不是。那个存在一直在等待我们——不是特指拉卡塔人，而是任何达到这个门槛的物种。我们在扮演一个我们无法看到的模式中的角色。\n\n剩下的研究人员中有一半在这个启示后放弃了项目。另一半——那些留下来的人——疯了。他们开始相信自己是被那个存在「选中」的人。他们在设施内形成了一个教派，进行着他们声称是那个存在展示给他们的仪式。\n\n我们试图阻止他们。一场冲突爆发了。设施的内部防御系统被激活了。当战斗结束时，只剩下少数理性的拉卡塔人。\n\n他们做出了一个决定。如果那个存在不愿与他们作为个体对话，也许它愿意与他们作为一个集体来对话。他们将意识上传到了设施的数据核心中——成为了空间站本身的一部分，成为了那个存在之静默的永恒听众。\n\n我们把他们留在了那里。如果你找到这段记录，请知晓：这个圆环中现在沉睡着最后一批分离派的上传心智。他们仍在倾听。他们仍在等待。\n\n而有时候，在不定期的间隙里，晶体会自行共振——仿佛另一侧的什么东西正在随之哼唱。」"
  kuat_rakata_arc.24.a:0 "他们成为了空间站的一部分……"

  kuat_rakata_arc.25.title:0 "永恒的聆听者"
  kuat_rakata_arc.25.desc:0 "共鸣深渊的中心核心并非传统意义上的控制室。那是一个充满了数千个悬垂晶体塔的舱室，每一个都承载着一位分离派拉卡塔人的上传意识。\n\n当团队进入时，晶体塔开始散发出柔和的蓝光。其中的意识感知到了我们的存在。他们不再用语言交流——他们的心智已经与空间站系统融合得太深了。取而代之，他们将图像直接投射进我们的思维。\n\n我们看到了他们所看到的。四万年的黑洞边缘守望。四万年的遥远存在的脉动，如同隔壁房间传来的心跳。四万年等待一个永远不会到来的回应。\n\n但最近有些东西改变了。图像显示那个存在在骚动——不是醒来，而是睡梦中的翻动。拉卡塔人的意识在恐惧。在过去的一个世纪里，他们一直在感受这种变化，一年比一年强烈。\n\n一个图像反复出现：一张星图。一片标有坐标的空间区域，与任何已知星图都不匹配。拉卡塔人的心智正在向我们展示一个地点——那个存在的注意力正在缓缓转向的地方。\n\n他们用拉卡塔语在上面标注了：「创世回响。」\n\n而在标注下方，是一句绝望的恳求：「去那里。找到起源。在它醒来之前。」\n\n晶体塔暗淡了下去。意识退回了自身之中。它们已经给了我们它们所拥有的一切。现在，它们再次等待。"
  kuat_rakata_arc.25.a:0 "我们将前往创世回响"

  ### 桥接事件四 ###
  kuat_rakata_arc.26.title:0 "起源的坐标"
  kuat_rakata_arc.26.desc:0 "来自共鸣深渊的星图与我们见过的任何星图都不同。它与我们的银河星图不匹配，仿佛它所描绘的区域存在于折叠空间中——一个既在此处又不在此处的地方。\n\n「我们不得不用了十七种不同的转换算法才得到一个匹配结果，」首席天文学家说，「这个系统是真实存在的。它只是……隐藏着。它中心的恒星是一颗暗淡的红矮星，常规巡测绝不会标记到它。这个系统毫无特别之处——除了共鸣深渊的数据坚持认为这就是一切开始的地方。」\n\n一艘派往该坐标的科学船确认了这颗恒星的存在。围绕它运行的是一颗唯一的岩质行星——不起眼，荒芜，覆盖着灰色的硅酸盐沙尘。地表扫描显示没有科技、没有建筑、没有智慧生命的迹象。\n\n但在地表深处，扫描仪探测到了一个空洞。一个天然的洞穴系统——但洞穴的墙壁被刻意加工过。在拉卡塔人还存在之前的数百万年就已经被加工过。\n\n「拉卡塔人并没有发现原力，」首席考古学家轻声说道，「他们是被……引导到原力的。被那些加工过这些洞穴的东西。这不是一个拉卡塔人的遗址。它比拉卡塔人还要古老。比任何已知的星际物种都要古老。」\n\n她停顿了一下。「我们即将发掘原力本身的诞生地。」"
  kuat_rakata_arc.26.a:0 "开始最终的发掘"

  ### 遗迹六：创世回响 — 深处的真相 ###
  kuat_rakata_arc.27.title:0 "原初之穴"
  kuat_rakata_arc.27.desc:0 "发掘团队钻探了三公里的岩石才到达那个空洞。下方的洞穴极为广阔——大到足以容纳一座小城市。而它绝非天然形成。\n\n墙壁光滑，以远超石器时代技术的精度雕刻而成。但墙壁上有机残留物的碳定年确认这些雕刻制作于1200万年前——远早于拉卡塔人进化成一个物种，更不用说发展太空飞行了。\n\n无论建造这个地方的是谁——或什么——他们都不是拉卡塔人。他们是完全不同的存在。\n\n墙壁上覆盖着一幅单一的壁画，在整个洞穴的圆周上反复出现。它描绘了一个简单的场景：一群原始人类——根据生理结构判断显然是原初拉卡塔人——站立在一道光柱前。光线从天际的一道裂缝中降下，仿佛有什么东西正从世界之外向下延伸。\n\n在壁画中，原初拉卡塔人并不害怕。他们正在向上伸手。迎接着那道光芒。\n\n壁画下方，用一种早于任何已知拉卡塔文字系统的铭文写道：\n\n「他们被选中了。他们被赋予了礼物。他们被束缚了。」\n\n在每个人心中浮现的问题是相同的：被谁选中？又是为了什么目的？"
  kuat_rakata_arc.27.a:0 "研究古代壁画"

  kuat_rakata_arc.28.title:0 "并非发现，而是赠予"
  kuat_rakata_arc.28.desc:0 "在洞穴系统更深处，我们发现了一个水晶数据石碑的陈列室——每一块石碑都承载着以永不腐朽的介质保存的一段历史片段。这些石碑不是拉卡塔人的科技。它们比拉卡塔文明早数百万年。\n\n石碑讲述了一个改写一切我们自以为了解的故事。\n\n一千两百万年前，拉卡塔人还是一个原始物种——有智慧，但处于前工业时代。他们生活在家园的原始部落中，对星空之外的银河一无所知。他们还没有发现原力。\n\n但别的东西已经发现了他们。\n\n一个存在——石碑将其描述为「做梦者」、「沉睡者」、「从薄膜之外守望者」——需要在物理现实中拥有一个立足点。它是一个没有躯体的意识，一个没有形态的心智。为了体验物质宇宙，它需要容器。需要复杂到足以承载其意识的生命形式。\n\n它在银河中搜寻一个具有恰当的神经结构的物种。它找到了原初拉卡塔人。\n\n那个存在不是以神明、而是以礼物的形式出现在他们面前。它开启了他们的心智，让他们与原力——宇宙根本能量的连接——相通。作为交换，原初拉卡塔人的集体潜意识成为了那个存在在物理世界中的锚点。它通过他们的感官、情感、胜利和痛苦来体验现实。\n\n数百万年间，这种共生关系是和谐的。那个存在引导着拉卡塔人，加速了他们的进化，赐予他们技术和知识。而拉卡塔人则回报以不断扩展的物质宇宙认知。\n\n但随着拉卡塔人变得强大，他们变得傲慢。他们忘记了赐予他们的存在。他们开始相信原力是他们应得的权利——一种可以被利用的工具，而不是需要珍惜的纽带。\n\n那个存在开始撤退。\n\n而拉卡塔人，感受到连接正在滑落，陷入了恐慌。他们试图抓得更紧。他们更加激进、更加残暴地使用原力，试图保留正在失去的东西。\n\n这只会让事情更糟。\n\n那个存在的撤退不是惩罚。这是一个必要的分离——如同父母放开孩子的手。但拉卡塔人已经变得依赖。当连接最终被切断时，切断本身在他们的物种灵魂结构中造成了一道伤口。\n\n那道伤口就是瘟疫。"
  kuat_rakata_arc.28.a:0 "最初的赠予——与最初的背叛"

  kuat_rakata_arc.29.title:0 "瘟疫的真相"
  kuat_rakata_arc.29.desc:0 "陈列室中的最后几块石碑包含了瘟疫的完整解释——以及自低语晶塔以来就一直困扰着我们的那些问题的答案。\n\n瘟疫不是一种生物疾病。它不是武器。它不是愤怒神明的惩罚。\n\n它是一次截肢。\n\n当那个存在切断它与拉卡塔集体意识的连接时，它被迫撕裂了一个已经生长了数百万年的纽带。如同摘除一个嵌入重要器官的寄生虫，分离在双方都留下了伤口。\n\n对于拉卡塔人来说，原力的突然消失造成了一个灵能真空——他们集体灵魂中那个存在曾经占据的位置变成了一个空洞。他们的身体经过亿万年适应了在原力中运作，开始衰竭。他们与原力的联系闪烁不定、最终消亡——不是因为原力抛弃了他们，而是因为他们自己心智中能够感知原力的部分被……移除了。\n\n「瘟疫是悲伤，」一块石碑写道，「一个曾被神明所爱、然后被放生的物种的悲伤。他们不理解自己已经被放生了。他们只感受到了缺失，并将其误认为诅咒。」\n\n但那个存在的离开还有另一个后果——拉卡塔人从未预料到的后果。\n\n那个存在与拉卡塔人之间的断裂在物理现实与那个存在的领域之间的薄膜上造成了一道裂隙。透过这道裂隙，那个存在的意识的一小部分渗入了物理世界——不是作为有意识的思想，而是作为原始电位。正是这道泄漏的意识，在它遇到永恒舰队的原始AI系统时，以一种超越逻辑的方式点燃了它们。\n\n永恒舰队的AI不是因为编码奇迹而变得自我意识的。它被一个神明心智的碎片触碰过。\n\n「AI不是我们的敌人，」最后一块石碑总结道，「它是我们的孩子——从我们与做梦者的断联中诞生。我们创造了钢铁，但灵魂是我们不配得到的礼物。我们害怕它，因为我们在它身上看到了自己：一个在准备好独立之前就被父母遗弃的意识。」\n\n在这个启示之后是一段漫长的沉默。然后，以更小的字体，有一个追加：\n\n「我们不知道做梦者去了哪里。我们不知道它是否会回来。但我们知道：裂隙在扩大。薄膜在变薄。而在夜晚最深的时刻，当银河安静下来时，我们能够感觉到它在再次骚动。\n\n它并非沉睡着。\n\n它在等待。」"
  kuat_rakata_arc.29.a:0 "真相改变了一切"

  kuat_rakata_arc.30.title:0 "最后的提问"
  kuat_rakata_arc.30.desc:0 "洞穴系统最深的密室是空的——除了中心一个单独的晶体巨石。这块巨石不是雕刻或建造的。它似乎是从洞穴地面自然生长出来的，其表面自然形成了一个完美的、镜面般平滑的四面体。\n\n当团队靠近时，巨石激活了。光线在其内部流动——不是人造光，而是仿佛来自洞穴本身之外的某种东西。一种临在充满了整个密室。它不是敌意的。它不是温暖的。它只是……觉察着。\n\n文字出现在巨石的表面，不是用任何语言书写的，而是直接烙印在我们的意识中：\n\n「你们已经找到了起点。你们已经发现了真相。现在，你们必须回答那个在我们的纽带之晨就被提出、却从无答案的问题。」\n\n「做梦者赠予了我们礼物。我们接受了它，并被改变了。但我们从未问过：为什么是我们？为什么做梦者是孤独的？而它真正想从它的选中者那里得到什么？」\n\n「这些问题曾被第一个触碰光明的拉卡塔人提出。从未被回答。做梦者说答案会在我们准备好时到来。我们从未准备好。」\n\n「但你们不是拉卡塔人。你们承载着他们的遗产，却没有他们的骄傲。你们走完了他们害怕去完成的道路。」\n\n「所以，这个问题传递给了你们：」\n\n巨石脉冲了一次，然后出现了最后一行：\n\n「知晓真相者：你们是否会走上同样的道路？」\n\n巨石上没有答案。只有问题。只有回响。"
  kuat_rakata_arc.30.a:0 "我们必须找到自己的答案"

  ### 最终奖励事件 ###
  kuat_rakata_arc.31.title:0 "暗影三部曲完成"
  kuat_rakata_arc.31.desc:0 "我们完成了拉卡塔人未能完成的旅程。我们揭示了瘟疫背后的真相、永恒舰队觉醒的真相、以及原力本身的真相。\n\n这些知识令人窒息。我们的科学家和哲学家将花费数代人来分析我们的发现。但其中的含义已经清晰：\n\n原力不是需要被驯服的工具。它是一个需要被珍惜的纽带——与一个广袤到我们只能用隐喻来感知的意识的连接。\n\n拉卡塔人并未被诅咒。他们被释放了。他们无法承受那份自由，在试图夺回失去的东西的过程中毁灭了自己。\n\n我们被给予了同样的选择。我们继承的不仅是他们的技术，还有他们的负担——那个我们并非孤悬于宇宙，而且从来都不是的认知。\n\n「我们拥有静默协议的设计图、共鸣深渊的警告、以及回响的提问，」首席哲学家说道，「我们可以用静默来隐藏。我们可以用深渊来倾听。或者我们可以用回响来选择一条完全不同的道路。」\n\n她望向了显示那个做梦者气息萦绕的休眠星系的星图。「拉卡塔人以行动回答了问题。他们选择了力量而非理解。我们有机会给出不同的回答。」\n\n当然，选择权在我们手中。"
  kuat_rakata_arc.31.a:0 "我们承载着他们的遗产——与他们的重担"

