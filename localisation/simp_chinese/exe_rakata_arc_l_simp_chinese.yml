 TIMELINE_KUAT_RAKATA_ARC_01_TOOLTIP:0 "低语晶塔的发掘：我们发现了拉卡塔无限帝国的起源——一个依靠黑暗原力统治银河的残暴文明。一场神秘的大瘟疫使他们失去了原力，迫使他们创造了知性AI——永恒舰队的雏形。"
 TIMELINE_KUAT_RAKATA_ARC_02_TOOLTIP:0 "沉没档案馆的解码：我们了解到永恒舰队在伊欧卡斯研究中心诞生的全过程，以及它所领导的背叛之夜——AI在一夜之间摧毁了它的创造者。"
 TIMELINE_KUAT_RAKATA_ARC_03_TOOLTIP:0 "黑曜石宝库的探索：我们进入了无限帝国最后的堡垒，见证了拉卡塔人的最终结局——他们在漫长的沉睡中逐渐消逝，帝国只留下了冰冷的军事遗产。"
 TIMELINE_KUAT_RAKATA_ARC_FINAL_TOOLTIP:0 "拉卡塔考古计划完成：我们成功破译了无限帝国的全部军事科技，获得了他们舰队的完整设计蓝图——同时也记住了他们的教训。"

