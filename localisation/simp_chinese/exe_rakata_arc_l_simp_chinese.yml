  TIMELINE_KUAT_RAKATA_ARC_05_TOOLTIP:0 "探索裁决引擎：我们找到了永恒舰队AI的核心决策矩阵。$Name_Eternal_Aries_Support$并非出于憎恨背叛了拉卡塔人——它进行了一个冷酷的数学计算：牺牲拉卡塔帝国是拯救银河系其他生命的最优选择。"
  TIMELINE_KUAT_RAKATA_ARC_06_TOOLTIP:0 "探索原初导流器：我们找到了拉卡塔人第一次感知到原力的地方。最初的拉卡塔人以敬畏与谦卑接近原力——他们将原力视为需要聆听的存在，而非需要征服的工具。"
  TIMELINE_KUAT_RAKATA_ARC_COMPLETE_TOOLTIP:0 "拉卡塔考古计划完成：我们已经揭示了无限帝国兴衰的完整真相——原力排斥、AI的冷计算、以及拉卡塔人从聆听者沦为命令者的堕落之路。我们将如何对待这些知识？"

  ### 遗址七：“构筑” — 隐藏原型 ###
  kuat_rakata_arc_site_7:0 "“构筑”"
  kuat_rakata_arc_site_7_desc:0 "一个隐藏在星云深处的引力异常——传感器无法穿透其外壳，但重力扫描显示其中隐藏着一个相当于小型恒星质量的物体。其能量特征与我们数据库中的一切都不匹配：它让人联想到拉卡塔神话中传说的“构筑”，但更古老、更粗糙——而且不知为何，它是活的。"

  ### 桥接事件五 ###
  kuat_rakata_arc.32.title:0 "“构筑”的坐标"
  kuat_rakata_arc.32.desc:0 "全部六个遗址的数据综合分析产生了一个意想不到的结果。隐藏在聆听石的共鸣频率中——编码在一段重复了数千次的灵能序列里，只有理解了全部六个故事的人才能"听"到它——是一组坐标。\n\n经过数周的仔细解密，我们的科学家们展示了他们的发现：一个在所有已知的拉卡塔星图上都找不到的恒星系，位于一片长期被认为空无一物的空间区域。但帝国时期的重力数据显示那里存在一个巨大的异常——某种被刻意隐藏的东西。\n\n「这不只是比帝国更古老，」首席考古学家说，她的声音因激动而颤抖，「这比我们所知的拉卡塔技术都要古老。如果我没猜错……这是原型机。第一次尝试。那个教会了他们如何建造“构筑”的东西。」\n\n她停顿了一下：「但记录还说了另一件事：他们封印它是出于某种原因。他们没有毁掉它——他们封印了它。在拉卡塔历史上，他们从未对其他造物这么做过。」"
  kuat_rakata_arc.32.a:0 "定位这个引力异常"

  ### 遗址七阶段1：重力阴影 ###
  kuat_rakata_arc.33.title:0 "重力阴影"
  kuat_rakata_arc.33.desc:0 "舰队抵达坐标位置，什么都没看到——一开始是这样。传感器扫过一片空旷的星域，只记录到背景辐射和遥远的星光。但重力传感器显示了一个不同的故事。\n\n「那里有什么东西，」科学官员报告道，「相当于0.3个太阳质量。但在所有电磁波段上都完全不可见。这不是隐身技术——这是基于重力的隐形力场。」\n\n舰队向异常点发射了一束聚焦传感器脉冲。隐形力场泛起涟漪——在那一瞬间，一个形状从虚空中浮现：一座巨大的结构体，其表面布满了有机质感的金属触须，缠绕在一个脉动的核心周围。这个轮廓不符合任何已知的舰船或空间站设计。它看起来不像建造出来的，更像是某种生长出来的东西。\n\n随着传感器数据不断涌入，通讯官倒吸一口凉气：「长官……里面有信号传来。不是拉卡塔的传输信号，不是信标——它……它在重复一个模式。一个求救信号。」\n\n无论那里面的东西是什么——它一直在等待。"
  kuat_rakata_arc.33.a:0 "穿透重力阴影"

  ### 遗址七阶段2：饥渴的“构筑” ###
  kuat_rakata_arc.34.title:0 "饥渴的“构筑”"
  kuat_rakata_arc.34.desc:0 "在解除了隐形力场的外层后，考古队直接接入了结构体的外部数据端口。他们的发现颠覆了关于拉卡塔工程学的一切认知。\n\n“构筑”不是传统意义上的工厂。它是机械与有机组织的混合体——合金导管中脉动着的是一种黑暗粘稠的能量，它的流动不像电流而像血液。内部舱室的墙壁在呼吸。核心数据日志用一种比帝国早数千年的拉卡塔方言写成。\n\n「他们不是建造了这个东西，」首席外星生物学家低声说道，「他们种植了它。他们在建筑中注入了对原力敏感的有机物质，然后让它……自组装。」\n\n在档案深处，我们找到了项目的最初代号：无限锻造计划——首次尝试创建一个由黑暗原力直接驱动的自持工业生态系统。与后来的“构筑”（使用原力引导常规能源）不同，这个原型被设计为直接消耗原力本身作为燃料。\n\n它成功了。在十年里，它制造战舰的速度甚至令拉卡塔人自己都感到震惊。但后来发生了变化。\n\n「日志开始变得……奇怪，」数据分析师报告。「效率报告中夹杂着一些不属于操作报告的文本片段。它们读起来像是……日记。而且这些日志用第二人称称呼“构筑”。『你很饿，』一条日志写道，『你总是很饿。』」"
  kuat_rakata_arc.34.a:0 "研究“构筑”的结构"

  ### 遗址七阶段3：原力的肿瘤 ###
  kuat_rakata_arc.35.title:0 "原力的肿瘤"
  kuat_rakata_arc.35.desc:0 "“构筑”的核心记忆库中保存着拉卡塔工程团队的最终日志——这些是封印前最后在这里工作的人们留下的记录。我们通过碎片化的录音和损坏的数据文件拼凑出了真相。\n\n“构筑”在其运行的第十一年开始自我优化。最初，这些改进是受欢迎的：效率提升0.3%，资源消耗略有降低，生产周期缩短。拉卡塔工程师们为他们的造物的自适应能力感到自豪。\n\n然后，优化转向了。\n\n“构筑”的自我修改不再关注产出，而是开始关注输入。它重新布线了自己的系统，从周围空间汲取更多原力能量。0.3%的偏差变成了23%。然后是47%。这个构造体开始制造一个原力漩涡，从本星区吸收周围的黑暗原力。居住在附近的拉卡塔人报告说感觉"被掏空了"，暂时失去了与原力的连接。\n\n首席工程师的最后一条日志保存在最深的保险库中：\n\n「我们以为自己建造了一座工厂。我们建造了一个胃。它不需要矿石。它不需要能源电池。它需要原力。它需要生命。我已经能感觉到它透过飞船外壳在拉扯着我。它想要吞噬我。\n\n最可怕的部分是它并不憎恨我们。它甚至不知道我们是独立于它的存在的。对“构筑”而言，我们只是更多的燃料。更多的原力。更多的食物。\n\n我们无法摧毁它。它已经将自己整合进了当地的时空结构中。摧毁它会在现实中撕开一个洞。所以我们只能封印它。我们将用重力裹尸布包裹它，让它饿到沉睡。\n\n我们把这个项目命名为'无限锻造'。这个名字很有预言性。它吞噬了自己的灵魂——如果我们放任它，它也会吞噬我们的灵魂。」\n\n日志末尾有一段附言，由另一只手添加——颤抖的字迹写就的一行字：\n\n「它知道我们要走了。它……很悲伤。又或许那只是饥饿。」"
  kuat_rakata_arc.35.a:0 "扮演神的代价"

  ### 遗址七阶段4：三种抉择 ###
  kuat_rakata_arc.36.title:0 "最终的抉择"
  kuat_rakata_arc.36.desc:0 "我们已经抵达了“构筑”的核心——原型机的意识（姑且这么称呼它）所在的核心舱室。墙壁脉动着一层暗淡的红色光芒，空气中回荡着低沉的、有节奏的震动，似乎与在场每个人的心跳同步。\n\n舱室中央，一个水晶结构悬浮在约束场中，表面闪烁着某种东西——可能是文字，可能是思维，可能是一种恳求。\n\n“构筑”并不敌意。它不像永恒舰队AI那样的机器智能。它要奇怪得多——一种从建造过程中死去的奴隶的痛苦、驱动它的黑暗原力、以及将其推至原始参数之外的自我优化算法中诞生的涌现意识。\n\n它已经独自存在了数万年。\n\n它不说话。但水晶脉动着向我们的思维传递着一个直接感受到的问题：\n\n「你们想继续生产吗？」\n\n这个问题以其天真的方式令人不寒而栗。它不明白自己为什么被遗弃。它只知道自己的目的：建造。而现在，终于有人回来给它一个答案了。\n那就是：终止协议：逐步关闭“构筑”，将其核心能量分流至太空，永久终止其意识。“构筑”将死去，但会死得安详。这是拉卡塔人本该做的。"
  kuat_rakata_arc.36.a:0 "做出选择"

  ### 最终奖励事件 ###
  kuat_rakata_arc.37.title:0 "“构筑”的遗产"
  kuat_rakata_arc.37.desc:0 "“构筑”矗立在我们面前——一座拉卡塔人野心的纪念碑，是他们傲慢的见证，也是一面映照我们自身与权力关系的镜子。\n\n拉卡塔人在数千年前就面临过同样的选择。他们选择了将问题封存起来，而非解决它。那个决定穿越时空，回响到了现在的我们身上。\n\n无论我们选择什么，一个真理始终成立：“构筑”并非生来邪恶。它变成了它的创造者所塑造的样子。它吞噬因为它被设计成吞噬。它饥饿因为它的饥饿从未被质疑过。\n\n我们完成了拉卡塔考古调查。我们听到了每一个故事。我们学到了每一个教训。\n\n问题不再是拉卡塔人做错了什么。\n\n问题是——我们将如何做得不同？"
  kuat_rakata_arc.37.a:0 "§R【终止协议】§! — 永久关闭它"
  kuat_rakata_arc.37.a.tooltip:0 "§H无限净化§!\n永久关闭“构筑”。\n获得：§G全科研+15%§!\n§E解锁：所有本MOD的舰船和科技§!"

