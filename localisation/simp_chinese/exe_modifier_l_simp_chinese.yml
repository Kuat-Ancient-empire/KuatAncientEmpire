#####################
sc_kuat:1 "边缘星域"
sc_kuat_desc:1 "这些是位于我们尚且无法准确观测的星域的一颗恒星周围的行星系统，这些行星系统组成了这片星域的主体环境和星域结构。"
cannot_sold_kuat_fleet:0 "无法出售、转让该舰队或转换该舰队为佣兵城邦。"
