l_simp_chinese:

 ag_exe_invasion_chain_title:0 "§E永恒舰队§!"
 ag_exe_invasion_chain_desc:0 "这些来自河外星系的入侵者似乎不会与我们交流，它们只会摧毁它们所遭遇的一切，直到它们自己被摧毁为止。"
 ag_exe_invasion_fleet:0 "§Y永恒舰队§!"
 ag_exe_invasion_planet_destroyed:0 "§Y被永恒舰队摧毁的世界§!"
 ag_exe_invasion_ship_kill_by_us:0 "§G我们消灭的永恒舰队§!"
 ag_exe_invasion_ship_kill_by_other:0 "§G他人消灭的永恒舰队§!"
 ag_exe_invasion_victim:0 "§R被永恒舰队摧毁的舰船§!"

 exe_invasion_lock_outer_gate:"§E关闭星门§!"
 exe_invasion_lock_outer_gate_DESC:"我们可以关闭我们境内的星门，以增加我们的准备时间。"
 exe_invasion_lock_the_eclipse:"§E永恒旗舰§!"
 exe_invasion_lock_the_eclipse_DESC:"来自永恒舰队的超级旗舰，我们需要进一步研究并分析其构成，但这酷似夸特造船厂的旗舰设计似乎有着不为人知的秘密......................."
 
 kuat_shattered_holy_planet:0 "§E曾经的圣地§!"
 kuat_shattered_holy_planet_desc:0 "这颗星球曾经被某个失落帝国视为圣地，但现在只剩下漂浮在轨道上的无数残骸。无论其曾拥有什么样的财富，都早已在此前的灾难中灰飞烟灭了。"
 kuat_shattered_holy_planet_custom:0 "这颗星球在被粉碎前曾经被某个失落帝国视为圣地。"

 exe_outer_gate_locked:"§E$exe_outer_gate$§!"
 exe_outer_gate_locked_DESC:"一个奇怪的星门，它已经被我们锁定了。"

 exe_outer_gate_disable:"§E$exe_outer_gate$§!"
 exe_outer_gate_disable_MEGASTRUCTURE_DETAILS:"$exe_outer_gate_disable_DESC$"
 exe_outer_gate_disable_DESC:"一个奇怪的星门，它已经被锁定了。"

 bombardment_exe_invasion_bombardment:0 "§E毁灭轰炸§!"
 bombardment_exe_invasion_bombardment_desc:0 "这些舰队战舰搭载的轨道轰炸武器能对行星造成巨大的伤害。\n-对§Y陆军§!造成§R致命§!的伤害。\n-对§Y行星§!造成§R致命§!的伤害。\n-对§Y人口§!造成§R致命§!的伤害。\n-会轰炸不设防的行星。\n-行星破坏度达到§R100§!或£pop£§Y总人口§!数量§R不超过1§!时将会使得该行星被§R彻底摧毁§!。"
