  TIMELINE_EVENT_SHADOW_COPORUATION_02_TOOLTIP: "这是一种极其稀有的物质，是某种燃料Illerium的放射性同位素。对$Name_kuat$提供给我们的样本的初步研究表明，该物质对引力场与电磁场有着强大的扭曲效应，并且在常规条件下相对稳定，而特定条件下被粒子轰击可以释放巨量能量。"
  TIMELINE_EVENT_SHADOW_COPORUATION_02: "$kuat_fallen_mission_reaction_7_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_03_TOOLTIP: "该武器从设计上与舰船反应堆核心直接连接，看起来是一种耗能巨大的武器，至少我们的反应堆完全无法支撑其消耗。其与我们曾接手过的一款舰船武器类似，但该武器的激发激光器会在一段时间内持续供电，进而产生更多更长的高能粒子束，之后还会经过一个设计精妙的聚焦装置与粒子加速轨道，从而获得更强大的破坏力，据推测其威力足以一击摧毁我们已知的任何舰船。"
  TIMELINE_EVENT_SHADOW_COPORUATION_03: "$kuat_fallen_mission_reaction_8_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_04_TOOLTIP: "$Name_kuat$交给我们一套闻所未闻的舰载计算网络，要求我们对其进行研究并将成果悉数上交。它利用先进的信号收发装置，将编队中的每一艘战舰都化作一个独立的计算节点，甚至多个舰队的节点群还能进一步互联，组建为更高阶的计算网络。"
  TIMELINE_EVENT_SHADOW_COPORUATION_04: "$kuat_fallen_mission_reaction_9_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_05_TOOLTIP: "该系统与$Name_kuat$所使用的那套特殊干扰系统类似，但在功率等方面更为强大。它采取某种特殊手段保障了护盾与装甲的防护效率，并能削弱敌方的武器功率，唯有$Name_kuat$的星际无畏舰可以部分抵消其效果。"
  TIMELINE_EVENT_SHADOW_COPORUATION_05: "$kuat_fallen_mission_reaction_10_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_06_TOOLTIP: "根据我们发现以及$Name_kuat$提供的一部分技术资料，这应该是某座巨大的星际堡垒的通讯信标组件，能够发射快子信号用于远程通信，但需要一些【错误】进行信号放大来进行跨星系传输。"
  TIMELINE_EVENT_SHADOW_COPORUATION_06: "$kuat_fallen_mission_reaction_11_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_07_TOOLTIP: "这是一台将某种超物质燃料进行湮灭反应，在反应室内制造出一颗微型恒星来进行供能的反应堆。与常规超物质反应堆不同，该反应堆直接消耗燃料本身，而常规版本则使用燃料获取高维跌落下来的超物质进行反应，效率与能量等级更高。"
  TIMELINE_EVENT_SHADOW_COPORUATION_07: "$kuat_fallen_mission_reaction_12_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_08_TOOLTIP: "与$Name_kuat$常见的风格不同，这种舰船通体黑色且呈现横过来的T字型，但是前部有着横梁从而更像是十字，尾部为推进器。其主炮均装备于前部的横梁上，并且炮塔可以灵活转动。该舰船的推进器非常先进，速度比我们的快出许多，并且装备了隐形发生器。"
  TIMELINE_EVENT_SHADOW_COPORUATION_08: "$kuat_fallen_mission_reaction_13_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_09_TOOLTIP: "根据$Name_kuat$交予我们的资料与我们发掘出的一些信息...这可能是某个被称为无限帝国的超级强权在遇上某种瘟疫时，为了挽救自己文明而设计建造的舰队指挥人工智能。据称其以数个种族与数个星球的生命原力为代价，才建造出了该种AI。"
  TIMELINE_EVENT_SHADOW_COPORUATION_09: "$kuat_fallen_mission_reaction_14_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_10_TOOLTIP: "这种巨大的战争堡垒，不知为何这和我们建造过的战争堡垒，以及夸特的某些设施非常相似，但是搭载的各种子系统与武装似乎更为强大。\n\n恩多迪亚帝国与那些来自河外星系的无人舰队的交战记录，这些堡垒似乎曾经出现于战场上，为那些自动化舰队提供支援。根据我们对星际通讯信标的研究，这些堡垒会在那些舰队入侵时负责提供源源不断地舰队支援，除非关闭三座特殊设施。"
  TIMELINE_EVENT_SHADOW_COPORUATION_10: "$kuat_fallen_mission_reaction_15_project$\n§L[GetDate]§!"

  TIMELINE_EVENT_SHADOW_COPORUATION_11_TOOLTIP: "$Name_kuat$告诉我们，他们的某些新设计需要更多的能源，出于对我们的信任与表面友好态度，选择将这个能源调控组件交予我们研究。\n这一设备旨在优化反应堆的出力与节约舰船的能耗，看起来是为了使用什么能耗巨大的东西才会研究此类设备？"
