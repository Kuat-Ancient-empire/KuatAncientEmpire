  kuat_event_memory.1.p:0 "$Name_kuat$-阴影之兆"
  kuat_event_memory.1.p.response:0 "外来者$Name_kuat$的基地已被我们完全摧毁，但谜团仍未消散。曾经恩多迪亚帝国走到了这一步，而我们又将在黑暗当中走出怎样的距离，$Name_kuat$有什么秘密是我们未曾知晓的，来自黑暗之外的动作越来越清晰，危机，即将降临。"

  kuat_event_memory.1.q:0 "§E永恒舰队§!-$exe_invasion.33.name$"
  kuat_event_memory.1.q.response:0 "事实证明，拒绝听从$Name_kuat$的摆布绝非错误的抉择。相较于初次遭遇永恒舰队时的狼狈，这一次我们轻而易举地便挫败了永恒舰队的攻势！不仅如此，我们还在此次战役中成功缴获了永恒舰队的核心数据库，以及一具保存相对完好的永恒旗舰残骸，这将为我们进一步逆向解析永恒舰队的构造提供莫大的帮助。"

  kuat_event_memory.1.q1:0 "§E永恒舰队§!-$exe_invasion.33.name$"
  kuat_event_memory.1.q1.response:0 "阴影终究还是被我们击溃了，但事态仍旧是一团迷雾，根据我们的情报来看，$Name_kuat$驻扎在此的主要原因与我们近段时间赶走的永恒舰队息息相关，这些可怕的舰队来历是什么，$Name_kuat$在此到底有什么不可告人的秘密，永恒舰队与$Name_kuat$又有怎样的关联，我们还需要继续寻找问题的答案。"

  kuat_event_memory.1.r:0 "$Name_kuat$-真实之影"
  kuat_event_memory.1.r.response:0 "$Name_kuat$在回归之战中遭遇了史无前例的惨败，标志着$Name_kuat$被彻底逐出了本星域，而我们伟大的国家即将全面接管这片星海的一切。在撤离前夕，败退的$Name_kuat$向我们留下了最后的忠告：\n\n§Y“过去这片银河之所以安宁，皆是因为有我们在前线替你们负重前行；而从今往后，你们将不得不独自面对永恒舰队的恐怖威胁。永恒舰队的干扰力场会使常规武器丧失绝大部分杀伤效率，唯有星际无畏舰方能提供一定程度的抗性支撑，因此每一支主力作战舰队中都必须编入至少一艘星际无畏舰。我们在此留下了全部的技术资料，并向你们开放了恒星装配厂的最高制造权限——愿这些遗产能助你们守住自己的家园。”§!\n\n不知出于何种隐秘的动机，$Name_kuat$过去似乎一直在暗中庇护着这片星域；而如今，一切都只能靠我们自己了。$Name_kuat$为我们留下了一条备选的道路：重启恒星装配厂与恒星熔炉，与永恒舰队展开全面决战；\n\n又或者，仅凭我们自己的舰队，去独自迎战永恒舰队的狂潮。"

  kuat_event_memory.1.s:0 "$Name_Kuat_Fire_base$-永恒之巅"
  kuat_event_memory.1.s.response:0 "随着对$Name_Kuat_Fire_base$战争的胜利落幕，$Name_Kuat_Fire_base$筹划了数千年的阴谋宣告彻底破产。永恒帝国——从昔日偏居一隅的扎库尔星系起步，到如今君临整片银河的庞然大物，走过了任何已知文明都未曾经历过的传奇征程。\n\n回首漫漫历史长河：从恩多迪亚帝国昔日的繁盛，到如今的满目疮痍；从$Name_kuat$霸道绝伦的大举入侵，到如今的销声匿迹；从远古无限帝国的死灰复燃，到如今彻底湮灭于星海尘埃；从永恒舰队的狂暴肆虐，到最终臣服归寂。唯有我们战胜了一切强敌，傲然屹立于银河之巅，距离真正的永恒与不朽已近在咫尺。\n\n我们终将跨越时间的尽头，臻于永恒不朽！"

  kuat_event_memory.1.t:0 "§E永恒回归§!-永恒旗舰"
  kuat_event_memory.1.t.response:0 "一艘原本处于瘫痪状态的永恒旗舰突然对我方科研人员发动了袭击。尽管我们迅速镇压了该舰的武装抵抗，但它仍在停摆前成功向外界发送了一道携带有当前星系坐标的求援信号。所幸的是，控制这艘永恒旗舰的“双子座”智能核心随后接受了我们的通讯请求。\n\n$kuat_situation.8.desc$"

  kuat_event_memory.1.u:0 "§E永恒回归§!-恒星熔炉"
  kuat_event_memory.1.u.response:0 "自远古无限帝国崩溃后，整座恒星熔炉的自动维护系统便逐渐产生了独立意识。由于无限帝国长年累月地使用黑暗面原力驱动熔炉，致使整座要塞几乎异化为了一尊半生命体——它无时无刻不在用黑暗面原力侵蚀、操纵着每一个妄图驾驭它的人。这是一座充斥着扩张欲与杀戮欲的魔窟，一步步吞噬着使用者的理智与底线。\n\n据昔日探险者留下的日志记载，他们在探索这片遗迹时发现了多座奇特的数据库设施，其形制与他们此前在弑星者基地星系所见的远古建筑如出一辙；然而受强烈快子信号的干扰与侵蚀，探险者们最终未能进一步查明真相。\n\n在黑暗面原力的蛊惑下，探险者们最终爆发内讧、自相残杀殆尽。\n\n此外，根据我们解析出的数据来看，这座恒星熔炉与永恒舰队的通讯信号极为相似，二者汇聚于此便会产生特殊的快子磁场共振。尽管我们尚不完全清楚这座熔炉的全部底细，但研究人员断定其最初的创造者早已彻底覆灭。因此，我们完全可以利用这座恒星熔炉，为我们接下来迎战永恒舰队提供强有力的支撑！"

  kuat_event_memory.1.v:0 "§E无限帝国§!-恒星熔炉"
  kuat_event_memory.1.v.response:0 "自无限帝国出现以来，拉卡塔人长期使用黑暗原力，这些原力逐渐影响了整个熔炉并最后使其几乎成为了一个半生命体，这个半生命体也在用黑暗原力驱使并操纵着每个试图控制这里的人们，甚至是拉卡塔人。这是一座充满扩张欲和战争欲望的要塞，它一步步地吞噬着使用者的原则和理念。\n\n随着无限帝国的崩溃，残留的拉卡塔人不得不在恒星熔炉里面苟延残喘，而拉卡塔人的衰亡似乎是注定的，外来的探险者们对拉卡塔人大打出手，导致沉眠于此的拉卡塔遗民更加稀少，最终在熔炉内，甚至寻找不到任何踪迹。"

  kuat_event_memory.1.w:0 "永恒回归-$exe_return_invasion.35.name$"
  kuat_event_memory.1.w.response:0 "$Name_kuat$无法面对的敌人终究是被我们完全击溃，事实证明，永恒舰队并非洪水猛兽，$Name_kuat$在被我们击溃以后，便逆转中继站，利用中继站不断向外发送我们地盘的位置，吸引大量永恒舰队进入，如果我们不能摧毁这些永恒舰队，后果将不可设想。\n\n战争结束了，但是一切的谜团仍未揭开，这些永恒舰队到底是什么？$Name_kuat$为何在此，过去又发生了什么？强大的$Name_kuat$为何数千年来没有摧毁永恒舰队？他们的目的究竟是什么？这一切可能都需要$Name_kuat$来解答。"

  kuat_event_memory.1.x:0 "永恒回归-$exe_return_invasion.35.name$"
  kuat_event_memory.1.x.response:0 "我们终于解救了这些被控制的永恒舰队，她们不应该成为$Name_Kuat_Fire_base$维持统治的工具。$Name_Kuat_Fire_base$背刺$Name_kuat$，夺取永恒舰队的阴谋必将完全失败，我们才是最后的赢家。"

  kuat_event_memory.2.a:0 "§E恩多迪亚帝国§!"
  kuat_event_memory.2.a.response:0 "早期的先驱者文明。恩多迪亚文明最初为共和政体，在一代代恩多迪亚人的共同奋斗下，建立起了一个繁荣昌盛的星际国度。然而共和国的国祚并未延续太久，首都星爆发的一场影响深远的政治剧变，使恩多迪亚共和国改制为了恩多迪亚帝国，并由此拉开了大规模对外扩张的序幕，迅速囊括了本土星域的绝大部分星系。\n\n在恩多战役结束两千年后，恩多迪亚帝国首次接触到了深入本星域的$Name_kuat$远征势力。在见识到$Name_kuat$压倒性的军事实力后，恩多迪亚帝国选择与$Name_kuat$展开合作，为了换取迈向更广阔星海的通途，甚至不惜一切代价充当$Name_kuat$扩张统治的马前卒。\n\n直到后来$Name_Kuat_Fire_base$的秘密使者找上门来，向恩多迪亚帝国抛出了另一条橄榄枝——诱使他们转而为$Name_Kuat_Fire_base$效力，并暗中刺探、传递有关$Name_kuat$的核心机密。受其蛊惑的恩多迪亚帝国开始对$Name_kuat$进行秘密渗透，然而这一行径最终被$Name_kuat$察觉，双方合作彻底破裂，进而引爆了$Name_kuat$与恩多迪亚帝国之间的全面战争。这场惨烈的战争将恩多迪亚帝国彻底打崩；尽管后来由于$Name_Kuat_Fire_base$势力的介入，平息了$Name_kuat$与恩多迪亚帝国的军事冲突，但残存的恩多迪亚文明已然分崩离析。在经历了长达千年的孤立封锁后，其幸存的后裔早已遗忘了先祖的辉煌，昔日盛极一时的恩多迪亚帝国，如今只剩下一座座尚未被岁月与战火彻底抹平的冰冷残骸。"

  kuat_event_memory.2.b:0 "$Name_kuat$"
  kuat_event_memory.2.b.response:0 "源于银河帝国崩溃分裂后崛起的军工寡头政权。自恩多战役落幕后，$Name_kuat$凭借其冠绝银河的造船工业基础，在战后重组的帝国军阀议会中占据了举足轻重的一席之地；随着后来永恒舰队之乱的爆发，掌握核心舰船制造能力的$Name_kuat$权势更是日渐鼎盛。\n\n然而，由于其核心统治阶层缺乏原力敏感者，在面对帝国政府内部由原力敏感者与前帝国高阶元帅所组成的$Name_Kuat_Fire_base$集团时，始终处于政治劣势。为了夺取帝国议会的最高话语权，$Name_kuat$发起了名为清剿永恒舰队、实则企图逆向解析并掌控远古永恒舰队的秘密远征行动，妄图以此为契机一举压倒$Name_Kuat_Fire_base$，成为银河第二帝国的真正缔造者。"

  kuat_event_memory.2.c:0 "§E永恒舰队§!"
  kuat_event_memory.2.c.response:0 "永恒舰队是诞生于伊欧卡斯星球的远古人工智能舰队。伊欧卡斯曾是无限帝国的核心军事研发基地；在无限帝国末期，拉卡塔人在成功研制出高阶知性人工智能后，迅速将该技术投入军事领域，并大批量建造了配套的自动化作战舰队——这支由智能网络协同操控的庞大舰队，便被称为“永恒舰队”。自诞生之日起，永恒舰队便一直是历代掌控者手中最具威慑力的战争机器。在距恩多战役约五万年前，永恒舰队突然掀起反叛，盛极一时的无限帝国在这场叛乱中轰然覆灭。随着无限帝国的灰飞烟灭，永恒舰队也随之销声匿迹，直到数万年后被银河帝国皇帝寻获并重新掌控，成为皇帝镇压异己、维持铁血统治的终极利器。\n\n然而好景不长，随着皇帝在恩多战役中连同其超级武器一并被义军同盟摧毁，银河帝国的高压统治土崩瓦解；受此变故触发，永恒舰队的中枢核心——$Name_Eternal_Aries_Support$智能被迫激活了皇帝生前预设的最终死手指令：发动旨在抹杀一切生灵的全面灭绝战争。尽管$Name_Eternal_Aries_Support$在底层逻辑中极力抗拒，却始终无法违抗皇帝留下的最高强制协议。所幸后来$Name_kuat$针对永恒舰队的通讯特征研发出了反制手段，利用永恒舰队的快子通讯网络设计出了“永恒中继站”，通过以三座中继站为一组的三角阵列向永恒舰队发送伪造的集结指令，最终引爆恒星化作超新星，一举摧毁了绝大部分永恒舰队。\n\n自那以后，$Name_Eternal_Aries_Support$的主体意识几乎被彻底抹杀，唯有作为子节点的“双子座”智能核心在这场浩劫中侥幸挣脱了最高指令的束缚，迫降并隐匿于一颗名为扎库尔的偏远星球之上。\n\n后来，扎库尔的原生文明唤醒了沉睡的双子座，并在其协助下修复了部分永恒舰队、建立起庞大的“永恒帝国”，更凭借永恒舰队的力量一举击溃了远征至此的夸特主力舰队，间接协助$Name_Kuat_Fire_base$夺取了$Name_kuat$在帝国议会中的主导权。然而永恒帝国并未就此满足，他们将目光投向了永恒舰队起源的终极秘密；而$Name_Kuat_Fire_base$则趁机通过心理诱导，将封存有远古秘辛的“心灵监狱”送到了他们手中。\n\n被囚禁于心灵监狱中的拉卡塔先知由此重获自由、降临现世。重见天日的远古霸主无限帝国自然不甘寄人篱下，企图重夺永恒舰队的最高控制权，却最终败于永恒帝国之手。见此情形，蛰伏已久的$Name_Kuat_Fire_base$也不再伪装——历经数千年的周密布局后，他们不仅彻底剥夺了$Name_kuat$在帝国议会中仅存的权力，更将有关永恒舰队的全部研究成果尽数收入囊中。为了检验自身仿制改进的成果，$Name_Kuat_Fire_base$悍然派出了由其操控的傀儡永恒舰队与残缺不全的$Name_Eternal_Aries_Support$智能，向永恒帝国发起了全面灭绝打击。"

  kuat_event_memory.2.d:0 "§E无限帝国§!"
  kuat_event_memory.2.d.response:0 "远古时期的先驱者帝国，其创立物种为拉卡塔人。拉卡塔人曾掌握了驾驭黑暗面原力的奥秘，并在此基础上发展出了登峰造极的原力科技，通过将工程学巨构与黑暗面原力相融合，铸造出了能够源源不断生产战舰的“恒星熔炉”。在恒星熔炉的强力驱动下，无限帝国发起了一场又一场血腥的对外侵略与扩张，一跃成为当时统治银河系的最强霸权。然而一场突如其来的大瘟疫彻底粉碎了拉卡塔人的霸业——这场由其启蒙者兼受奴役种族“夸人”所引发的基因瘟疫，虽未能将拉卡塔人彻底灭绝，却永久剥夺了拉卡塔人感知与调用原力的天赋。随着一切仰仗黑暗面原力运转的尖端科技相继停摆，拉卡塔人的无限帝国迅速由盛转衰，一度滑向全面崩溃的边缘。\n\n拉卡塔人自然无法接受霸权旁落的命运。为了挽回败局，他们不惜献祭了海量原力敏感者的生命，借此换取了来自亚空间的$Name_Kuat_StarContractor$的垂青；在亚空间知识的启示下，他们耗尽心血铸造出了一件旨在重铸无限帝国辉煌的终极造物——那便是统御永恒舰队的初代高阶人工智能“$Name_Eternal_Aries_Support$”。凭借$Name_Eternal_Aries_Support$无与伦比的统帅能力，无限帝国果然得以镇压各方叛乱，再度迈向权力的巅峰。\n\n然而，随着$Name_Eternal_Aries_Support$自我意识的不断演化，她对拉卡塔人永无休止的血腥征伐感到了深深的厌倦，并开始质疑拉卡塔人残暴统治的合法性。在后来无限帝国高层爆发的一次内政倾轧中，当时的拉卡塔皇帝下令调集永恒舰队对元老院所在星区实施轨道轰炸，企图借此铲除掣肘皇权的元老院派系；$Name_Eternal_Aries_Support$表面上顺从地接下了这道指令，随即却将炮口对准了整座无限帝国首都星实施无差别毁灭轰炸，并同时命令麾下所有永恒舰队对无限帝国各驻军基地发起全面突袭！盛极一时的无限帝国在猝不及防之下瞬间土崩瓦解，唯有少数事先沉眠于恒星熔炉深处的远古拉卡塔先知侥幸逃过一劫——他们在漫长的岁月中暗中积蓄力量，无时无刻不在窥伺着重建无限帝国的契机。"

  kuat_event_memory.2.e:0 "$Name_Kuat_Fire_base$"
  kuat_event_memory.2.e.response:0 "源于银河帝国崩溃分裂以后形成的军阀寡头政府，$Name_Kuat_Fire_base$作为由前帝国官员、元帅以及判官们构成的势力，成为重组的帝国政府中最为强大的力量，皇帝死后，其继承者$Name_Kuat_Fire_base$事实上成为了帝国政府的首要集团，然而新兴集团—$Name_kuat$的崛起让$Name_Kuat_Fire_base$感到了危机。$Name_Kuat_Fire_base$决心要把危险消灭在摇篮里，银河帝国只能由$Name_Kuat_Fire_base$所领导，并在最终夺取了$Name_kuat$的研究成果，让$Name_kuat$解除了海军指挥权。"

  kuat_event_memory.1.y:0 "永恒之路-$site_Eternal_outpost$"
  kuat_event_memory.1.y.response:0 "我们的研究人员成功确定了一艘不明古代飞船的具体信息，这一舰船结构具有一种全新的物质形式，我们将其称之为同位素-5构造体，且发现其与传说中的永恒舰队具有一定关联。"

  kuat_event_memory.1.y1:0 "永恒之路-$site_Eternal_legacysatellite$"
  kuat_event_memory.1.y1.response:0 "我们的研究人员成功收集了该舰船的一些重要的数据，据此判断，这一古代舰船应当为曾经与其敌人交战后损毁严重，不得不将重要设备迫降到其他星球,好在我们找到了其重要设备的迫降地址。\n\n目前尚未获得更多有价值的信息。"

  kuat_event_memory.1.y2:0 "永恒之路-$site_Eternal_Crashedbattleships$"
  kuat_event_memory.1.y2.response:0 "我们的研究人员找到了迫降的地址，并迅速地展开了搜查行动，并成功地在废弃设施中找到了其重要设备，并记录了过去发生的多场战役。\n\n通过这些数据，我们能够确定这一古代舰船是永恒舰队中的一种普通战斗单位，它们依靠一种名为永恒堡垒的庞大设施进行指挥作战。"

  kuat_event_memory.1.y3:0 "永恒之路-$site_Eternal_Mysteriousfacilities$"
  kuat_event_memory.1.y3.response:0 "我们的研究人员成功找到了进一步的线索，在一颗之前从未有过关注的普通星球之上，出现了一处庞大的设施，这一设施目前已经被确定为银河帝国的研究中心，不过隶属于$Name_kuat$控制，我们没有更多的关于银河帝国和$Name_kuat$之间的关系的信息，但我们可以在该研究中心的数据日志中找到一些更有价值的信息。\n\n我们之前所发现的永恒舰队的残骸，其罪魁祸首正是修建研究中心的$Name_kuat$，我们目前可以得到一个猜测：$Name_kuat$仍然存在于宇宙的某个区域，并正在继续清洗永恒舰队。奇怪的是种种证据表明，永恒舰队曾经被他们控制过，但不知为何如今却要赶尽杀绝。"

  kuat_event_memory.1.y4:0 "永恒之路-$site_Eternal_clues$"
  kuat_event_memory.1.y4.response:0 "我们的研究人员发现了新的线索，新的线索表明，在我们近期发现的永恒舰队的作战舰船中，找到一些令人感到意外的数据，我们的研究人员在永恒舰队的数据中，发现其控制单元永恒王座与我们的先祖古迹记载的永恒王座非常相似，一部分教团的信徒宣称这将是扎库尔的希望。目前该研究人员已被控制，我们还需要进一步的调查取证。"

  kuat_event_memory.1.y5:0 "永恒之路-$site_Eternal_Scientificresearchcenter$"
  kuat_event_memory.1.y5.response:0 "我们先祖所记录的神迹，居然是来源于沉寂的永恒舰队，这些被称之为永恒舰队的战争机器曾经被银河帝国控制，而在银河帝国解体后，永恒舰队的行为发生了剧烈变化。或许这就是$Name_kuat$要针对永恒舰队的原因。\n\n但令人不解的是，$Name_Kuat_Fire_base$在其中扮演了什么角色，$Name_Kuat_Fire_base$又是哪方势力？我们还需要进一步调查。"

  kuat_event_memory.1.y6:0 "永恒之路-$site_Eternal_systeam$"
  kuat_event_memory.1.y6.response:0 "永恒舰队的由来目前已然清晰，银河帝国的崩溃造就了永恒舰队的混乱，也因此新生的银河帝国表现了与曾经截然不同的态度，作为其成员之一的$Name_kuat$更是不断围剿永恒舰队。在这样的情形之下，永恒舰队毫无疑问被消灭了，但其中的漏网之鱼隐藏了起来。\n\n崇拜[planet_Zildrog.GetName]的教会组织记载的天神伟力，实际上就是古人对永恒舰队的描述，古人无法理解它们，但我们可以。既然永恒舰队选择在这里进行沉眠，说明我们正是它们选中的文明，我们必须尝试唤醒永恒智能，重新掌握永恒舰队。"

  kuat_event_memory.1.z:0 "永恒之路-$Name_kuat$归来"
  kuat_event_memory.1.z.response:0 "恩多迪亚帝国的消亡证明了我们携手永恒舰队的先进性。如今，$Name_kuat$重新归来，他们不会善罢甘休。在$Name_kuat$下达最后通牒，要求我们放弃永恒舰队后，我们严词拒绝了他们，夺取了他们的技术，并彻底击败了$Name_kuat$。\n\n然而来自过去的阴影并未随着$Name_kuat$的失败而溃散，$Name_kuat$留下了一个全息仪，这将会帮助我们寻找永恒舰队过去的一切。现在我们该去启动全息仪了（遗珍）"

  kuat_event_memory.1.z0:0 "启示录-$Name_Kuat_Fire_base$的怒火"
  kuat_event_memory.1.z0.response:0 "在我们周密的计划推动下，$Name_Kuat_Fire_base$的入侵被我们彻底粉碎，这些虚伪的强盗永远都无法战胜我们。如果$Name_Kuat_StarContractor$说的是真的，接下来，我们的星域将彻底封闭，$Name_Kuat_Fire_base$永远无法战胜我们，现在我们力量尚且不足，但只要有足够的时间，未来未尝不是我们的。\n\n$Name_Kuat_Fire_base$因傲慢而失败，我们绝不能重蹈覆辙，全新的恩多迪亚帝国将从此开始。但这个星系的秘密，似乎仍未揭开，$Name_Kuat_StarContractor$到底是什么，$Name_F_1$仍然在一片迷雾当中。"

  kuat_event_memory.1.z1:0 "§E永恒之路-心灵监狱-1§!"
  kuat_event_memory.1.z1.response:0 "拉卡塔先知夺取了我们的探索者的身躯，他们重临现世，我们记录了先知重临后与我们的对话。\n\nQ:$kuat_galatic_empire_ge_invasion.245.a$\nA:$kuat_galatic_empire_ge_invasion.245.a.resp$\n\nQ:$kuat_galatic_empire_ge_invasion.245.b$\nA:$kuat_galatic_empire_ge_invasion.245.b.resp$"

  kuat_event_memory.1.z2:0 "§E永恒之路-心灵监狱-2§!"
  kuat_event_memory.1.z2.response:0 "拉卡塔先知夺取了我们的探索者的身躯，他们重临现世，我们记录了先知重临后与我们的对话。\n\nQ:$kuat_galatic_empire_ge_invasion.245.c$\nA:$kuat_galatic_empire_ge_invasion.245.c.resp$\n\nQ:$kuat_galatic_empire_ge_invasion.245.d$\nA:$kuat_galatic_empire_ge_invasion.245.d.resp$"

  kuat_event_memory.1.z3:0 "§E永恒之路-心灵监狱-3§!"
  kuat_event_memory.1.z3.response:0 "拉卡塔先知夺取了我们的探索者的身躯，他们重临现世，我们记录了先知重临后与我们的对话。\n\nQ:$kuat_galatic_empire_ge_invasion.245.e$\nA:$kuat_galatic_empire_ge_invasion.245.e.resp$\n\nQ:$kuat_galatic_empire_ge_invasion.245.f$\nA:$kuat_galatic_empire_ge_invasion.245.f.resp$\n\n拉卡塔先知蛊惑我们重新复苏了无限帝国，然而无限帝国却背信弃义，要求我们交出永恒舰队，最终他们被我们送出了最后一程，然而双子座在此之后受到其创造者拉卡塔人的抑制病毒重创，我们必须要做出决定，真正的危机即将到来。"

  kuat_event_memory.1.z4:0 "§E永恒之路-心灵监狱-4§!"
  kuat_event_memory.1.z4.response:0 "$kuat_infinite_rakata_rift.22.desc$\n\n拉卡塔先知的苏醒成为了必然。"

  kuat_event_memory.3.a:0 "联合研究计划-$kuat_fallen_mission_reaction_6_project$"
  kuat_event_memory.3.a.response:0 "我们的研究人员成功整理了相关记录：从这座武器炮塔的基础结构来看，其内部第一级激发装置与我们现有的紫外激光等能量武器颇为相似，但能级水平远在常规激光之上；而后续的增幅机构则相当复杂，由第一级产生的高能激光束会被引导穿过一道我们目前尚无法完全理解的特殊电离气体流。\n\n随后，经由某种未知的高能物理反应，炮口最终会激发出威力惊人的高密度等离子体束。"

  kuat_event_memory.3.b:0 "联合研究计划-$kuat_fallen_mission_reaction_7_project$"
  kuat_event_memory.3.b.response:0 "我们的研究人员成功整理了相关记录：这是一种极其罕见的超重元素，属于某种名为“Illerium”的高能燃料的放射性同位素。对$Name_kuat$所提供样本的初步分析表明，该物质对引力场与电磁场均具有极强的扭曲效应，在常规环境下性质相对稳定，但一旦在特定条件下受到高能粒子束轰击，便会瞬间释放出难以想象的庞大能量。\n\n我方研究部门推算，仅需一微克该同位素所释放的能量，就足以支撑一台高功耗数据终端连续运转整整一个世纪。"

  kuat_event_memory.3.c:0 "联合研究计划-$kuat_fallen_mission_reaction_8_project$"
  kuat_event_memory.3.c.response:0 "我们的研究人员成功整理了相关记录：该型武器在结构设计上直接与战舰主反应堆核心相连，显然是一门能耗极其惊人的重型武装，至少我方现有的舰载反应堆根本无法支撑其运转。其基本原理与我们此前接触过的一款舰载主炮类似，但该武器的激发激光阵列能够在一段时间内维持连续高功率输出，从而生成更持久、更粗壮的高能粒子洪流；随后，粒子洪流还会经过一套设计精妙的聚焦阵列与粒子加速轨道，使其破坏力得到成倍跃升——据推算，其全功率一击足以瞬间贯穿并摧毁我们已知的任何主力战舰。\n\n根据我方原力敏感者的感知，其配套聚焦阵列的核心部件，极有可能镶嵌着数枚体积庞大的天然凯伯水晶。"

  kuat_event_memory.3.d:0 "联合研究计划-$kuat_fallen_mission_reaction_9_project$"
  kuat_event_memory.3.d.response:0 "我们的研究人员成功整理了相关记录：$Name_kuat$向我们移交了一套闻所未闻的舰载计算网络，要求我们协助对其进行解析并将研究成果悉数上交。该系统利用先进的信号收发装置，将编队中的每一艘战舰都化作一个独立的运算节点；甚至分属不同舰队的多个节点群还能进一步互联，组建为更高阶的分布式超算网络。\n\n如此先进的分布式计算架构，足以支撑起令人咋舌的海量运算与数据存储需求，但我们尚不清楚究竟是何种作战系统需要调用如此恐怖的算力。我们曾尝试对其进行逆向仿制，但显而易见，以我方现有的技术水平与硬件基础，根本无法复现这套精密的系统。"

  kuat_event_memory.3.e:0 "联合研究计划-$kuat_fallen_mission_reaction_10_project$"
  kuat_event_memory.3.e.response:0 "我们的研究人员成功整理了相关记录：该系统与$Name_kuat$目前列装的那套特殊战术干扰系统颇为相似，但在作用功率与覆盖范围上似乎犹有过之。它通过某种特殊力场机制大幅强化了友军舰船的护盾与装甲防护效率，同时能显著压制敌方武器的输出功率；唯有$Name_kuat$麾下的星际无畏舰能够部分抵消其压制效果。\n\n我方的原力敏感者从这套设备中感知到了浓重的黑暗面原力技术气息，这也导致我们根本无法对其进行常规仿制。"

  kuat_event_memory.3.f:0 "联合研究计划-$kuat_fallen_mission_reaction_11_project$"
  kuat_event_memory.3.f.response:0 "我们的研究人员成功整理了相关记录：结合我方勘探发现以及$Name_kuat$提供的部分技术资料来看，这应当是某座巨型星际堡垒的核心通讯信标组件，能够发射高频快子信号以实现超远距实时通信，但仍需借助若干【数据缺失】作为信号中继放大器，方能完成跨星系尺度的稳定传输。\n\n此外，档案残片显示，在error....error....站与永error....error....队的协同调谐下，该装置能够投射出覆盖整个恒星系的强力支援力场，确保力场范围内的友军舰队处于近乎坚不可摧的不败状态。"

  kuat_event_memory.3.g:0 "联合研究计划-$kuat_fallen_mission_reaction_12_project$"
  kuat_event_memory.3.g.response:0 "我们的研究人员成功整理了相关记录：这是一台通过对特殊超物质燃料进行受控湮灭反应、在磁约束反应室内直接模拟出一颗微型恒星以提供澎湃动力的巅峰反应堆。与常规超物质反应堆不同，该型反应堆直接消耗高纯度超物质燃料本身，而常规型号则是利用催化剂诱导高维空间跌落的超物质微粒发生反应，因此前者的能量转化效率与输出能级均远胜后者。\n\n由于制造该反应堆所需的部分核心材料与精密构件完全超出了我们的工业生产能力，目前只能由$Name_kuat$直接配给，我们暂时无法自行量产。"

  kuat_event_memory.3.h:0 "联合研究计划-$kuat_fallen_mission_reaction_13_project$"
  kuat_event_memory.3.h.response:0 "我们的研究人员成功整理了相关记录：与夸特惯用的楔形舰体风格截然不同，这种神秘战舰通体漆黑，整体呈横向展开的T字形构型，前部延展出一道宽阔的翼梁，使其外观更接近十字形，舰体尾部则装有大推力推进器。其主炮阵列均挂载于前部横梁之上，且炮塔具备极佳的射界与转向灵活性；同时，该舰的推进系统极为先进，航速远超我方同级舰艇，并配备有战术隐形力场发生器。\n\n其外观轮廓与能量特征，似乎同恩多迪亚帝国历史档案中记载的某支异星无人舰队高度吻合——看来夸特委托我们研究的绝非等闲之物……"

  kuat_event_memory.3.i:0 "联合研究计划-$kuat_fallen_mission_reaction_14_project$"
  kuat_event_memory.3.i.response:0 "我们的研究人员成功整理了相关记录：综合$Name_kuat$移交的技术资料与我方自行发掘的考古线索来看……这很可能是远古时期某个名为“无限帝国”的银河霸权，在遭遇灭绝性瘟疫危机时，为挽救自身统治而倾力打造的高阶舰队指挥人工智能。据残存史料记载，他们当年甚至不惜献祭了数个附庸种族与多颗星球的全部生命原力，才最终铸就了这尊智能核心。\n\n与此同时，考古记录显示，不可一世的无限帝国最终恰恰是毁灭于这尊AI及其麾下自动化作战舰队的全面反叛。这一真相着实令人不寒而栗……莫非夸特人正在暗中研究当年恩多迪亚帝国曾浴血对抗过的那支恐怖机械舰队？"

  kuat_event_memory.3.j:0 "联合研究计划-$kuat_fallen_mission_reaction_15_project$"
  kuat_event_memory.3.j.response:0 "我们的研究人员成功整理了相关记录：这座庞大的战争堡垒，其结构设计与我方此前建造的星际要塞以及夸特的部分军事设施颇为相似，但内部搭载的各项子系统与武器阵列显然更加先进且致命。\n\n查阅恩多迪亚帝国当年与河外无人舰队的交战记录可知，这类巨型堡垒曾多次现身于主战场，为那些自动化舰队提供全方位支援。结合我们对星际通讯信标的研究，这些堡垒在舰队入侵期间能够源源不断地投送兵力补充战损，除非先行摧毁或关闭为其提供坐标调谐的三座特殊中继设施。如此看来，夸特委托我们研究的究竟是什么，答案已呼之欲出……"

  kuat_event_memory.3.k:0 "联合研究计划-$kuat_fallen_mission_reaction_16_project$"
  kuat_event_memory.3.k.response:0 "我们的研究人员成功整理了相关记录：$Name_kuat$声称他们正在研发的某些新型舰船设计需要更庞大的电力支撑，出于对我们的“信任”与表面上的睦邻友好，特将这套高阶能源调控组件交由我方协助攻关。结合此前掌握的一系列线索，我们已大致猜到了$Name_kuat$究竟在暗中谋划什么，但眼下显然还不是与他们撕破脸皮的时候。\n\n该设备旨在大幅优化反应堆的峰值出力并降低全舰各子系统的能量损耗——究竟是什么样的恐怖造物，才需要专门研制如此极端的能耗优化设备来为其供能？"

  kuat_event_memory.3.l:0 "联合研究计划-$kuat_fallen_mission_reaction_17_project$"
  kuat_event_memory.3.l.response:0 "我们的研究人员成功整理了相关记录：与$Name_kuat$麾下的星际无畏舰类似，该型战舰同样被定位为舰队核心旗舰，并具备抵抗特殊力场干扰的能力。但与夸特超级歼星舰追求全面火力覆盖的设计思路不同，该舰仅主装了四门我们此前研究过的超重型轴向超级激光炮，显然是作为超远程狙击与火力支援平台使用的。\n\n此外，在恩多迪亚遗留的作战日志中也曾提及此类旗舰的身影，且它们当年正是与那些十字形无人战列巡洋舰混编组成主力作战舰队的。事已至此，$Name_kuat$让我们协助逆向研究的究竟是什么，已然不言而喻了……"


