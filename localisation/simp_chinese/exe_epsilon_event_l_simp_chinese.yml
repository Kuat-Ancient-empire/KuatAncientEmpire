l_simp_chinese:
  #origin
  kuat_support_class_arrived_desc: "帝国总部空投的§H旗舰舰队§!已经到达$capital_planet|H$"
  origin_kuat_apocalyptic: "§E【夸特的黎明】启示录§!"
  origin_kuat_apocalyptic_desc: "$Name_Kuat_Fire_base$的光辉曾笼罩着我们的整个世界——祂既崇高，又傲慢至极。在那冷漠的光辉之下，我们苟延残喘，企图寻觅一隅属于自己的阴影，以躲避那残酷的烈光。如今，我们必须履行契约，方能换取真正的自由。"
  origin_tooltip_kuat_apocalyptic_effects: "§H这是一个简单的剧情起源，我们将探索隐藏在过去中的阴影，追寻星河帷幕之外的神秘，揭示我们真正的命运。§!\n将在§E孤立星团§!开局\n\n该起源属于《夸特的黎明》剧情正传。"
  origin_kuat_shadow:0 "§E【夸特的黎明】阴影之下§!"
  origin_kuat_shadow_desc:0 "$Name_kuat$的阴霾曾笼罩着我们的整个世界——祂既崇高，又傲慢至极。在冰冷的黑暗之下，我们苟延残喘，企图点亮一簇属于自己的微光，以抵御残酷的寒夜。如今，我们将亲手铸就属于自己的辉煌，我们的故事才刚刚开始。"
  origin_tooltip_kuat_shadow_effects:0 "§H这是一个简单的剧情起源，我们将探索隐藏在过去的阴影，追寻星河帷幕之外的神秘，揭示我们真正的命运。§!\n将以§E固定三星星系§!开局\n该开局星系内拥有$think_tank_ruined$、$dyson_sphere_ruined$与$matter_decompressor_ruined$§!\n§R我们将失去所有初始舰队§!\n\n该起源属于《夸特的黎明》剧情正传。"
  kuat_origin_system_NAME:0 "§E至高§!"
  kuat_origin_system_DESC:1 "一个处于罕见空间裂隙的先驱种族星系，曾经随处可见的维度乱流使得这里的空间极不稳定，但先驱者通过特殊手段建立起了一个稳定的星系环境，现在我们将从此开始我们的征途。"
  d_str_kuat_spring: "§E先驱之城§!"
  d_str_kuat_spring_desc: "先驱者铸造的庞大城市。"
  START_SCREEN_KUAT_ORIGIN:0 "我们的[GetSpeciesName]物种起源已无从考证，历史的长河出现了断层，先民们只能在废墟中艰难求生。如今，在$Name_Kuat_Fire_base$的扶持下，我们终于彻底统一了[GetHomeWorldName]。\n\n回首过往，$Name_Kuat_Fire_base$的光辉曾笼罩着我们的整个世界——祂既崇高，又傲慢至极。在那冷漠的光辉之下，我们苟延残喘，企图寻觅一隅属于自己的阴影，以躲避那残酷的烈光。如今，我们必须履行契约，方能换取真正的自由。"
  origin_kuat_trigger_first: "§E要求Ancient Empire和Kuat Ancient Empire同时开启。§!"
  tech_kuat_databank: "$building_kuat_databank$"
  tech_kuat_databank_desc: "储存了夸特船坞大大小小所有舰船设计图的资料库建造技术。尽管其中的核心舰船蓝图已然遗失，但先进的存储与计算设备依然能大幅提升我们的科研水平。"
  tech_kuat_resource_center: "$building_kuat_resource_center$"
  tech_kuat_resource_center_desc: "夸特可以通过跨次元传送来获取大量资源。而这项技术将对我们的资源获取有非常大的作用。"
  tech_kuat_shield: "$building_kuat_shield$"
  tech_kuat_shield_desc: "夸特的星球护盾技术，他们利用这种特制的护盾，可以抵抗几乎绝大部分的轨道轰炸。"
  tech_kuat_ground_yards: "$building_kuat_ground_yards$"
  tech_kuat_ground_yards_desc:0 "夸特不仅仅在太空造船的领域有相当高的建树，在地面造船厂方面也有一些强大和非常实用的科技，这样的技术将会给我们的舰船生产带来非常稳定的支持。"
  tech_kuat_command_center: "$building_kuat_command_center$"
  tech_kuat_command_center_desc: "夸特曾利用这项反重力技术建造了宏伟的空中指挥中心。只要完成这项研究，我们便可通过星球决策建造属于我们自己的空中指挥中心。"

  ########################
  #######decision#########
  ########################
  Firing_The_StarKiller: "§E$kuat_starkillerbase_1$开火"
  Firing_The_StarKiller_desc: "我们将启动我们的$kuat_starkillerbase_1$"
  Firing_The_StarKiller_tooltip: "$kuat_starkillerbase_1$将会启动"
  Building_The_Kuat_Command_Line: "§E建设$building_kuat_command_center$"
  Building_The_Kuat_Command_Line_desc: "我们将建设一座宏伟的星系中枢建筑！"
  Building_The_Kuat_Command_Line_Auto_planet: "§E建设自动化数据星港§!"
  Building_The_Kuat_Command_Line_Auto_planet_desc: "我们将建设一座宏伟的星系中枢星球！在分布式服务器阵列的支持下，整颗星球的居民都将在数据世界中高效地为国家效力，一切产业活动将完全由智能管理AI接管。"
  Building_The_Kuat_AI_Command_Line_Auto_planet: "§E升级自动化数据星港§!"
  Building_The_Kuat_AI_Command_Line_Auto_planet_desc: "$Building_The_Kuat_Command_Line_Auto_planet_desc$"
  Bulding_kuat_auto_planet_focus_target:0 "§E设置焦点"
  Bulding_kuat_auto_planet_focus_target_desc:0 "自动化数据星港储存了整个星球大大小小的信息，设置焦点中心将提高该星系中枢建筑的核心地位，使其可以接受来自其他数据中心的数据迁移。"
  building_kuat_command_center_target_desc:0 "设置该自动化数据星港为焦点数据中心"
  Bulding_kuat_auto_planet_focus_remove_target:0 "§E移除焦点"
  Bulding_kuat_auto_planet_focus_remove_target_desc:0 "自动化数据星港储存了整个星球大大小小的信息，取消焦点中心将使该数据中心不再接受其他数据中心的数据迁移。"
  building_kuat_command_center_remove_target_desc:0 "该自动化数据星港不再作为焦点数据中心。"
  Building_kuat_auto_planet_migrant_data:0 "§E迁移数据"
  Building_kuat_auto_planet_migrant_data_desc:0 "自动化数据星港储存了整个星球大大小小的信息，迁移数据可以让该星球的数据以极少的损失为代价传输到焦点数据中心。"
  Building_kuat_auto_planet_migrant_data_failed:0 "此时正在进行数据迁移，带宽无法支撑第二个星球进行数据迁移。"
  building_kuat_command_center_migrant_data_desc:0 "星球的人口产业数据将会完全迁移至焦点数据中心，星球殖民地将被放弃！"
  Building_The_Kuat_Shield: "§E激活$building_kuat_shield$§!"
  building_kuat_shield_tooltip: "§E这将激活$building_kuat_shield$,$building_kuat_shield$将会运行720天，运行期间星球不会遭受轰炸§!"
  Building_The_Kuat_Shield_desc: "$building_kuat_shield_tooltip$"
  Destroy_The_Kuat_Shield: "§E关闭$building_kuat_shield$§!"
  Destroy_The_Kuat_Shield_desc: "§E这将关闭$building_kuat_shield$§!"
  Destroy_The_Kuat_Shield_tooltip: "$Destroy_The_Kuat_Shield_desc$"
  we_can_not_get_support_now: "海军暂时抽调不出新的舰队，请一段时间后再来！"

  kuat_diplomatic.1.desc:0 "被遗忘的人们啊，你们十分荣幸地被选为我们在该星域的监视者。我们将为你们提供一切必要的支持，而你们则必须完成我们所交代的任务。\n\n你们的过去曾是一团迷雾，但如今终于迎来了云开雾散的契机——在履行职责的过程中，你们将逐步找回属于自己的历史。而这一切的开端，只需你们严密监视$Name_kuat$的动向，并挖掘出他们在这片星域深藏的秘密。\n\n这是你们身为监视者的使命，亦是你们应当履行的义务。只要你们能圆满完成任务，我们便会解除监视者契约，届时，这片星域的一切都将归你们所有。"
  kuat_diplomatic.1.a:0 "我们还有拒绝的余地吗？"
  kuat_diplomatic.1.a.res: "显然没有，我们会一直注视着你们的。我们将这片孤立星域，连同昔日属于$Name_kuat$的设施、一部分舰队以及帝国信用点一并留给了你们，现在它们都归你们支配了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.2.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.2.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。你们及时的报告证明我们没有看错你们。\n\n这些遗迹曾是恩多迪亚帝国的避难所。那曾是一个相当强盛的文明，过去我们与$Name_kuat$都曾与其有过接触。没想到岁月流转，如今竟已破败成了这副模样——正如你们所见，他们是被$Name_kuat$的歼星舰彻底毁灭的。"
  kuat_diplomatic.2.a:0 "为什么要毁灭这里？"
  kuat_diplomatic.2.a.res:0 "这谁能知道呢，或许只是战争无情，顺手毁灭了吧。这些帝国信用点，就归你们了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.3.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.3.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n“云城”同样曾是恩多迪亚帝国的避难所之一。那里的居民曾是抵抗$Name_kuat$侵略的中坚力量，在前线全面溃败后，他们不得不修筑这些隐蔽的避难所以图东山再起。只可惜，他们最终还是失败了。"
  kuat_diplomatic.3.a:0 "这场战争到底是怎么回事？"
  kuat_diplomatic.3.a.res:0 "战争？那只是利益的表现，而其中隐藏的秘密，就是你们需要去找到的，我们曾经说过，这是你们的宿命。既然如此，这些帝国信用点，就归你们了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.4.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.4.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n“海洋星球”曾是恩多迪亚帝国修建的秘密设施之一，只可惜这里并未留下什么有价值的情报，你们显然也没能从中找到令人感兴趣的东西。这些设施不过是当年恩多迪亚帝国残部苟延残喘的藏身处罢了。"
  kuat_diplomatic.4.a:0 "什么意思？没有价值？"
  kuat_diplomatic.4.a.res:0 "是的，你们尚未找到真正有价值的核心机密。不过念在你们态度积极的份上，这些帝国信用点就赏给你们了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.6.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.6.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n没想到你们居然发现了这个地方。这座设施是恩多迪亚帝国在与$Name_kuat$开战前夕秘密修建的，他们曾试图在此研究跳跃星门的加密系统，大概是想给$Name_kuat$来一次出其不意的突袭吧。\n\n令人遗憾的是，他们虽然攻克了技术难关，却没能挽回败局，最终这里也只能沦为一座封存过期数据的避难所。"
  kuat_diplomatic.6.a:0 "这些数据所记载的过往，为何与我们先祖建立文明前的那场浩劫如此相似？"
  kuat_diplomatic.6.a.res:0 "相似吗，你们或许真的与恩多迪亚帝国有某种关联。但无论如何，做好你的工作，我们一直在注视着你们。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.5.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.5.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n你们竟然找到了更多关于恩多迪亚帝国的情报。这片区域的线索进一步印证了：恩多迪亚帝国的覆灭，必然与$Name_kuat$深藏在这片星海中的秘密息息相关。我们期待你们的下一次汇报。"
  kuat_diplomatic.5.a:0 "是的，明白"
  kuat_diplomatic.5.a.res:0 "这些东西就给你了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.7.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.7.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n等等，这些信息是……无限帝国？那群早已被时代淘汰的垃圾怎么会在这里留下痕迹？难道说……总之，你们这次干得不错，但无限帝国绝非你们能够染指的存在，不必深究。"
  kuat_diplomatic.7.a:0 "是的，明白"
  kuat_diplomatic.7.a.res:0 "这些东西就给你了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.8.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.8.desc:0 "立即停止一切有关无限帝国的调查与汇报！你们的任务重心不在这里。\n\n那些东西背后的水太深，不是你们能够弄清楚的。"
  kuat_diplomatic.8.a:0 "是的，明白"
  kuat_diplomatic.8.a.res:0 "这些东西就给你了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.9.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.9.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n$Name_A_1$的陷落着实令人惋惜。这座要塞曾是恩多迪亚帝国与$Name_kuat$惨烈交锋的主战场之一，无数战舰沉眠于此，无论是$Name_kuat$还是恩多迪亚皆在那一战中元气大伤。在$Name_A_1$的废墟深处，或许还封存着远古恩多迪亚帝国的重要战略堡垒设计图——找到它，你们便能明白你们先祖口耳相传的那场浩劫究竟是怎么回事了。"
  kuat_diplomatic.9.a:0 "浩劫？难道恩多迪亚帝国真的就是我们的过去？"
  kuat_diplomatic.9.a.res:0 "是的，恩多迪亚帝国覆灭后残存的遗民分化出了多个支脉，而你们正是其中之一。我们选中你们作为此地的监视者，亦是你们注定的宿命。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.10.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.10.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n$Name_B_1$的情况与$Name_A_1$极为相似。当年在$Name_A_1$失守后，恩多迪亚帝国便将防御重心转移到了$Name_B_1$上。这座要塞不仅迟滞了$Name_kuat$的攻势，更隐藏着某些恩多迪亚人尚未完成的秘密研究——你们接下来的任务就是找出这些成果，并悉数上交给我们。"
  kuat_diplomatic.10.a:0 "是的，明白（为什么要交还给你呢）"
  kuat_diplomatic.10.a.res:0 "这是我们的要求，也是你们的义务，你没有资格提出异议，去做吧。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.11.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.11.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n$Name_C_1$……没想到他们果真还建有$Name_C_1$，难不成他们当年打算把26个字母都用上一遍吗？真不愧是底蕴深厚的恩多迪亚帝国，即便覆灭了也依然留下了如此丰厚的遗产。你们需要对这座设施展开地毯式搜查，并将找到的一切悉数上交给我们。"
  kuat_diplomatic.11.a:0 "是，是的。"
  kuat_diplomatic.11.a.res:0 "你们的办事效率比我们此前签约的其他监视者高得多。好好干，距离解除契约、重获自由的日子已经不远了。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.12.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.12.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n古老的恩多迪亚先知虽已认不出你们这些后裔，但你们的身世已然水落石出：当年正是$Name_kuat$亲手毁灭了恩多迪亚，只因恩多迪亚动了他们的奶酪。现在，我们需要你们做好迎战准备，让$Name_kuat$为昔日的所作所为付出代价。"
  kuat_diplomatic.12.a:0 "是的，明白。"
  kuat_diplomatic.12.a.res:0 "或许你们会觉得我们在利用你，但监视者协议也为你的发展带来了巨大的支持，做好自己的事情，我们不会亏待你的。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.13.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.13.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n原来恩多迪亚帝国还藏着这么一处隐秘基地，$Name_kuat$千算万算，居然漏掉了这里。更令人意外的是，$Name_D_1$的数据中竟还记录着我方一支失联驻守舰队的坐标。那支舰队的指挥官应该还不认识你们，你们可以持信物前去表明身份，他们会做出正确的选择的。"
  kuat_diplomatic.13.a:0 "正确的选择？"
  kuat_diplomatic.13.a.res:0 "非常正确的选择，去吧。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.14.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.14.desc:0 "该死，你们怎么找到了这地方。\n\n恩多迪亚帝国之中有不干净的东西。封锁$Name_F_1$，不要试图与祂们进行交流，这些魔鬼会给你们，甚至整个银河带来灾祸。\n\n考虑到未来的安全问题，我们会派遣部队接管这个星域。"
  kuat_diplomatic.14.a:0 "是，是吗"
  kuat_diplomatic.14.a.res:0 "你们必须停止任何与他们交流的想法，这里是最危险的地方。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.15.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.15.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n没想到你们如今已具备与$Name_kuat$正面交锋的实力，真是令人刮目相看。不过你们将$Name_kuat$逐出此地后，失去钳制的永恒舰队也将随之长驱直入。\n\n切勿放松警惕，$Name_kuat$远未被彻底击败，你们击退的不过是他们留守外围的几支普通驻军罢了，他们迟早还会卷土重来的。"
  kuat_diplomatic.15.a:0 "$Name_kuat$？还会回来？"
  kuat_diplomatic.15.a.res:0 "是的，$Name_kuat$还会回来，不过在此之前，你们先考虑下怎么应对即将抵达的永恒舰队吧。这些东西曾经是皇帝麾下的利刃，如今却只能以这个样子苟延残喘。"

  kuat_diplomatic.16.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.16.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n没想到你们竟连永恒舰队都能击败！既然如此，接下来面对$Name_kuat$主力舰队的反扑，想来你们也已有足够的实力应付了。$Name_kuat$与恩多迪亚帝国跨越千年的恩怨，或许就将在你们手中画上句号。你们传回的永恒舰队作战数据为我们提供了莫大的帮助，而$Name_kuat$在多个外围星区修筑前进基地的真实图谋也已水落石出。"
  kuat_diplomatic.16.a:0 "我们会赶走他们。"
  kuat_diplomatic.16.a.res:0 "不要忘了，你们始终是监视者，你们必须给我们找出$Name_kuat$在这里研究的秘密。我们需要更多有关永恒舰队的信息。"

  kuat_diplomatic.17.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.17.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n看来$Name_kuat$在此名为围剿永恒舰队，实则是妄图将其收归己用，真是狼子野心、昭然若揭！只可惜到头来还是我们技高一筹。既然$Name_kuat$在败退撤离前将所有技术与设施控制权都移交给了你们，你们理应将这一切悉数上交，$Name_Kuat_Fire_base$自会重新评估你们的功绩。放心，未来的新恩多迪亚帝国，必定属于你们。"
  kuat_diplomatic.17.a:0 "$Name_kuat$留下来的这些是让我们与永恒舰队作战的。"
  kuat_diplomatic.17.a.res:0 "说得也是，否则仅凭你们自身的实力，又如何抗衡永恒舰队的全面入侵？那些舰队可是$Name_kuat$梦寐以求的核心研究样本。正好，你们就先利用$Name_kuat$留下的遗产彻底击溃永恒舰队，随后再将一切悉数移交给我们。\n\n当前帝国信用点：[Root.eternal_bornus_var]"

  kuat_diplomatic.18.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.18.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n你们不仅击退了$Name_kuat$，更彻底战胜了永恒舰队。$Name_kuat$关于永恒舰队的研究数据已悉数上传至我方数据库中，你们的监视者使命已圆满完成。如今的你们与昔日的恩多迪亚帝国何其相似，甚至比他们当年更加强大——但我们绝不会允许恩多迪亚帝国真正从历史的坟墓中苏醒。一切都该结束了，所谓的“新恩多迪亚帝国”。\n\n当然，我们不会像$Name_kuat$那样赶尽杀绝，我们只是要收回当初赐予你们的一切罢了。"
  kuat_diplomatic.18.a:0 "什么意思，你要做什么"
  kuat_diplomatic.18.a.res:0 "再见了，我们的朋友，监视者协议即将解除，你们该享受这最后的自由了。"

  kuat_diplomatic.19.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.19.desc:0 "你们做得非常好，我们已经收到了你们近期活动的汇报。\n\n你们做出了一个令人意想不到的抉择——你们居然拒绝听从$Name_kuat$的安排，这着实出乎我们的意料。要知道，这是一条从未有人敢于踏足的险路。"
  kuat_diplomatic.19.a:0 "是吗？"
  kuat_diplomatic.19.a.res:0 "至少在我们的记载中，并未有多少文明选择这条道路，曾经选择这条道路的文明都失败了。而你们再一次地战胜了永恒舰队，证明了你们将开创一条全新的道路，我们期待你们在这条道路上的新发现，你的时间不多了。"

  kuat_diplomatic.20.title:0 "$Name_Kuat_Fire_base$"
  kuat_diplomatic.20.desc:0 "不要再来这里了，我们的舰队已经封锁了$Name_F_1$。\n\n你应该去做你该做的事情！"

  Name_G_1: "§E虚空禁域(G)§!"
  Name_H_1: "§E失落禁域(H)§!"
  misc_system_desc_8: "$Name_G_1$"
  misc_system_desc_9: "$Name_H_1$"
  kuat_legacy_key_world_8_desc:0 "一个怪异的星系，怪异的恒星，怪异的结构，仿佛脱离于这个世界的宇宙规则，我们无法确定这里隐藏着什么。$Name_Kuat_StarContractor$告诉我们，这个星系是曾经深渊的遗产，是从深渊脱落而下的碎片，其中隐藏着来自深渊之外的秘密。"
  kuat_legacy_key_world_9_desc: "一个被尘封，被遗忘的星系，曾经恩多迪亚帝国的辉煌，如今只剩下这些残垣断壁和躲藏在阴暗当中的设施，究竟还有多少是我们不知道的，$Name_Kuat_StarContractor$说，这里是恩多迪亚帝国抵抗派引爆亚空间能量封锁的区域，他们为什么要封锁，难道是因为和$Name_kuat$的战争吗，真相还需要我们去寻找。"
  exe_outer_gate_G_facility: "§E深渊节点§!"
  exe_outer_gate_G_facility_DESC: "未知的远古造物，疑似源自深渊的深空科研复合体。自深渊崩解剥落以来，它已在这片虚空中矗立了极为漫长的岁月。除庞大的科研设施外，其内部搭载的先进阵列在本超星系团内还具备超凡的天文观测能力，整体功效堪比一座完整的科学枢纽。"
  exe_outer_gate_G_facility_completed:0 "§E深渊节点§!"
  exe_outer_gate_G_facility_completed_DESC: "未知的远古造物，疑似源自深渊的深空科研复合体。自深渊崩解剥落以来，它已在这片虚空中矗立了极为漫长的岁月。除庞大的科研设施外，其内部搭载的先进阵列在本超星系团内还具备超凡的天文观测能力，整体功效堪比一座完整的科学枢纽。"
  exe_enable_the_F_system_line_stage_5:0 "§E追踪神秘的舰船§!"
  exe_enable_the_F_system_line_stage_5_DESC: "我们的团队在额外的帮助下，正在推进对神秘舰船踪迹的追踪，如果顺利地话，我们将获得其跃迁目的地的坐标，在获得以后，应该尝试前往这个坐标，查清这一切的源头。"
  exe_enable_the_F_system_line_stage_7:0 "§E$Name_Kuat_StarContractor$:上传数据§!"
  exe_enable_the_F_system_line_stage_7_DESC: "如果我们想继续推进探索，我们需要依照$Name_Kuat_StarContractor$所说的，将数据上传至$Name_Kuat_StarContractor$的数据库中。尚不清楚为何祂们需要这些数据。"
  exe_enable_the_F_system_line_stage_8:0 "§E$Name_Kuat_StarContractor$:上传数据§!"
  exe_enable_the_F_system_line_stage_8_DESC: "如果我们想继续推进探索，我们需要依照$Name_Kuat_StarContractor$所说的，将数据上传至$Name_Kuat_StarContractor$的数据库中。尚不清楚为何祂们需要这些数据。"
  exe_enable_the_F_system_line_stage_9:0 "§E修复深渊节点§!"
  exe_enable_the_F_system_line_stage_9_DESC: "根据从深渊节点中获得的数据和图纸，我们已经掌握了深渊节点的修缮方法，同时我们也发现了位于节点的尖塔顶部的超级武器的秘密，为了掌握这种可以改写战争规则的武器的力量，我们必须要修复并重启这座巨大的节点。"
  exe_enable_the_F_system_line_stage_10:0 "§E植入体安装试验§!"
  exe_enable_the_F_system_line_stage_10_DESC: "在强调专精的神经改造产业中，大脑增强植入体是少有的异类。它提供多重的功效；在接入大脑枕叶提升感知能力的同时，通过影响新皮层，增强了大脑对于信息的处理能力。在由多个植入体组成神经植入体网络后，可以发挥更高的性能。\n\n我们的科研人员敢为人先，让我们期待试验的结果。"
  exe_enable_the_F_system_line_stage_11:0 "§E植入体安装推广§!"
  exe_enable_the_F_system_line_stage_11_DESC: "在强调专精的神经改造产业中，大脑增强植入体是少有的异类。它提供多重的功效；在接入大脑枕叶提升感知能力的同时，通过影响新皮层，增强了大脑对于信息的处理能力。在由多个植入体组成神经植入体网络后，可以发挥更高的性能。\n\n试验的成功证明了植入体的安全性，现在我们可以进一步推进其应用范围。"
  exe_enable_the_F_system_line_stage_12:0 "§E解析残余数据§!"
  exe_enable_the_F_system_line_stage_12_DESC:0 "致敬[kuat_leader_save_planet.GetName]\n\n在遥远而迷雾重重的深渊深处，我们伟大的科学家——[kuat_leader_save_planet.GetName]不幸英勇牺牲。她以卓越的智慧与无畏的勇气，引领了我们对未知深空的探索。\n\n如今她虽已离我们而去，但我们必须铭记她的功勋，绝不能让这位伟大的科学家白白牺牲！她用生命换来的珍贵数据，将成为我们迈向辉煌、在未来危机中扭转乾坤的决定性砝码。"
  exe_enable_the_F_system_line_stage_13:0 "§E$Name_Kuat_StarContractor$:上传数据§!"
  exe_enable_the_F_system_line_stage_13_DESC:0 "将数据传输给$Name_Kuat_StarContractor$，他们会给予我们问题的答案，在亚空间封锁的背后，或许能找到更多有关过去恩多迪亚帝国的信息。"
  exe_enable_the_F_system_line_stage_14:0 "§E$Name_Kuat_StarContractor$:下载数据§!"
  exe_enable_the_F_system_line_stage_14_DESC:0 "$Name_Kuat_StarContractor$已经解答了亚空间封锁的问题，我们需要将后裔的数据进行转码，才能进行应用，接下来，就是我们努力的时候了。\n\n里面是否还存在恩多迪亚人？恩多迪亚帝国的过去究竟是怎样的？这些恩多迪亚帝国的秘密，终将被我们揭开。"
  exe_enable_the_F_system_line_stage_15:0 "§E恩多迪亚:数据分析§!"
  exe_enable_the_F_system_line_stage_15_DESC:0 "$Name_Kuat_StarContractor$已经将解决亚空间能量异常的方法告诉了我们，现在，是我们应用的时刻了，稳定这个遗落星环的状态，将这些淡紫色的亚空间暗流坍缩至稳定状态，挖掘出恩多迪亚帝国被遗忘的秘密。"

  kuat_origin.8.name: "§E永恒之战"
  kuat_origin.8.desc: "自我们与$Name_Kuat_Fire_base$签订监视者契约以来，他们的目光便始终笼罩着我们。如今，被$Name_kuat$寄予厚望的古老战争机器——永恒舰队即将降临，我们必须履行契约职责，查明$Name_kuat$隐藏在这些舰队背后的秘密。\n\n在我们完成对$StarForge$的修复后，$StarForge$释放的共鸣信号将与我方部署的中继站相互呼应，共同构成一座覆盖星域的信号阵列，迫使隐藏在暗处的永恒舰队暴露行踪。目前，永恒舰队主力距我方防线已近在咫尺。帝国高层的指令十分明确：我们必须不惜一切代价歼灭这群失控的战争机器并夺取其核心技术，否则将无法向$Name_Kuat_Fire_base$交差。\n\n各单位注意，立即进入一级战备状态！"
  kuat_origin.8.flag.desc: "我国科研人员倾注无数心血，终于成功突破了远古拉卡塔文明所遗留的$StarForge$封锁。这座恒星熔炉的特征与夸特档案中的记载完全吻合，其释放的快子信号共振频率与永恒舰队如出一辙——这意味着我们可以借助这座巨构将永恒舰队引诱至此，从而将其一网打尽。\n\n昔日曾有无数探险者与学者对$StarForge$痴迷不已，即便是不可一世的夸特人也未能免俗；他们被$StarForge$的力量所诱惑，最终却反被$StarForge$一步步拖入毁灭的深渊。事实证明，唯有我们才是这座超级要塞真正的主人！如今我们已彻底掌控了整座$StarForge$，必将更为从容地击溃来犯的永恒舰队。"
  kuat_origin.8.eternal.desc: "我国科研人员倾注无数心血，终于成功突破了远古拉卡塔文明所遗留的$StarForge$封锁。这座恒星熔炉的重启，标志着我们正式开始全面掌握拉卡塔先驱者的至高技术。\n\n昔日曾有无数探险者与学者对$StarForge$痴迷不已，即便是夸特人与拉卡塔人自身也未能免俗。\n\n他们被$StarForge$的力量所诱惑，最终却反被$StarForge$一步步拖入毁灭的深渊。事实证明，唯有我们才是这座超级要塞真正的主人！如今我们已彻底掌控了整座$StarForge$，必将所向披靡、轻松碾碎一切敌人。"
  kuat_origin.8.a: "为了未来"
  kuat_origin.9.title: "$Name_Kuat_Fire_base$"
  kuat_origin.9.desc: "正在连接......\n编号:114\n连接成功\n\n编号114战区监视者，系统确认正常，请问这次通讯有什么请求？\n$Name_Kuat_Fire_base$将尽可能地为各战区监视者提供支持。"
  kuat_origin.9.a: "我们需要支援。"
  kuat_origin.9.b: "我们的任务是什么？"
  kuat_origin.9.c: "我们需要永恒舰队的情报。"

  kuat_origin.10.desc: "编号:114 正在验证......\n验证成功，数据正常\n\n$Name_Kuat_Fire_base$根据您当前情况将提供以下几种舰队增援套餐，您需要提供足够的帝国信用点。请注意，$Name_Kuat_Fire_base$已经发出了任务要求，你必须及时完成我们的要求，一切力量都要投入到履行你们的义务当中去。\n\n当前帝国信用点：[Root.eternal_bornus_var]\n信用点只能在你们完成阶段汇报后获得。"

  kuat_origin.10.a: "炮击旗舰舰队"
  kuat_origin.10.a.fail: "我们当前的帝国信用点不高于30"
  kuat_origin.10.b: "导弹旗舰舰队"
  kuat_origin.10.b.fail: "我们当前的帝国信用点不高于30"
  kuat_origin.10.d: "航母旗舰舰队"
  kuat_origin.10.d.fail: "我们当前的帝国信用点不高于30"
  kuat_origin.10.c: "超级旗舰舰队"
  kuat_origin.10.c.fail: "我们当前的帝国信用点不高于90"

  kuat_origin.11.desc:0 "编号:114 正在验证......\n验证成功，数据正常\n\n$Name_Kuat_Fire_base$已接受您提供的情报，$Name_kuat$在帝国议会上一反常态，不仅不再尝试向我们索取地位，反而开始主动偏离主星域。这些行为是极度异常的，在我们的情报网络之下，我们发现了$Name_kuat$的意图，他们试图在你们所在的星系中挖掘或者研究某种古代遗产，并试图将其作为压迫我们的手段。\n\n$Name_Kuat_Fire_base$绝不会允许这种事情发生，我们选中了你们，你们必须为我们服务，做好你们作为监视者的工作，定期汇报任何关于$Name_kuat$在此的研究线索。而你们会在一切结束以后获得你们无法想象的利益。"
  kuat_origin.11.a: "我们需要$Name_kuat$的情报。"
  kuat_origin.11.b: "难道只有我们吗？"

  kuat_origin.12.desc: "编号:114 正在验证......\n验证成功，数据正常\n\n$Name_kuat$源于第一帝国崩溃分裂后崛起的军阀寡头政府，他们是一个非法的割据势力，皇帝驾崩以后，这些人拥兵自重，建立自己的势力和舰队，他们不仅拒绝帝国政府的管辖，还在试图夺取我们的话语权，这对$Name_Kuat_Fire_base$是不可接受的，一个由$Name_Kuat_Fire_base$控制的帝国政府才能给帝国带来秩序和繁荣，他们只会摧毁这一切。\n\n你们无需知道这么多，做好你们该做的事情，我们不会亏待你的。"
  kuat_origin.12.a: "....."
  kuat_origin.12.a.respon: "我们会持续关注你的。"

  kuat_origin.13.desc: "编号:114 正在验证......\n验证成功，数据正常\n\n你们不是第一个，也不会是最后一个，$Name_kuat$的探索舰队遍布多个未知星域，像你们这样的小星域比比皆是，$Name_kuat$存在的地方，就会有我们的监视者。"
  kuat_origin.13.a: "我们将会完成任务的。"
  kuat_origin.13.a.respon: "我们会持续关注你的，这些没用的垃圾，就送给你了。"

  kuat_origin.14.desc: "编号:114 正在验证......\n验证成功，数据正常\n\n永恒舰队是一支诞生于伊欧卡斯星球、完全由高阶智能网络操控的远古舰队。其创造者无限帝国早已湮灭于历史长河之中；后来我们的皇帝掌控了永恒王座，将永恒舰队纳入帝国麾下。由于永恒舰队拥有独特的分布式智能作战系统，帝国军方对其抱有极高的兴趣，我们与$Name_kuat$均对其展开过深入研究。在随后的技术改造中，军方将帝国的先进科技融入永恒舰队，并将其投入到镇压叛军的战场之上。\n\n果不其然，永恒舰队在讨伐地方军阀与叛军的战役中战果辉煌，一举击溃并歼灭了叛军的主力舰队。然而天有不测风云，随着皇帝陛下驾崩，永恒舰队骤然失控，开始无差别地摧毁沿途的一切——而这场大祸的根源，实则是$Name_kuat$的无能失职，他们麾下的舰船设计蓝图被叛军窃取，才最终酿成了这场惨剧。\n\n如今永恒舰队的失控已成定局，仍有相当数量的永恒舰队在星海中四处游荡。$Name_kuat$打着围剿永恒舰队的旗号，实则极有可能是在暗中圈养并试图掌控永恒舰队——他们这是在玩火自焚。"
  kuat_origin.14.a: "还有没有其他监视者的信息。"

  kuat_origin.15.desc:0 "编号:114 正在验证......\n验证成功，数据正常\n\n永恒舰队的建造者目前帝国境内无人知晓，帝国数据库无法查阅到相关信息，已故的皇帝或许会知道永恒舰队的来源，但我们就不得而知了，由于未知星域的隐蔽性和危险性以及当前军事形势，我们难以派出舰队探索未知星域。\n\n根据我们目前的研究得到的结果来看，永恒舰队可以抵御几乎任何武器的攻击，但是我们§R强大的§!星际无畏舰可以一定程度上降低永恒舰队的影响。因此，做好准备，你们必须阻止$Name_kuat$，摧毁永恒舰队，将其技术信息移交给我们，永恒舰队的技术成果绝不能落到$Name_kuat$手上。"

  kuat_origin.15.a: "我们想知道第110战区的状态"
  kuat_origin.area_1: "编号:114 正在验证......\n验证成功，数据正常\n\n根据协议，你们有权知晓其他监视者状况，编号:110区域的永恒舰队已经几乎清理完毕，该区域监视者任务失败，已被$Name_kuat$摧毁。"
  kuat_origin.15.b: "我们想知道第111战区的状态"
  kuat_origin.area_2: "编号:114 正在验证......\n验证成功，数据正常\n\n根据协议，你们有权知晓其他监视者状况，编号:111区域的永恒舰队正在肆虐，该区域监视者任务进行中，$Name_kuat$已撤退。"
  kuat_origin.15.c: "我们想知道第112战区的状态"
  kuat_origin.area_3: "编号:114 正在验证......\n验证成功，数据正常\n\n根据协议，你们有权知晓其他监视者状况，编号:112区域的永恒舰队尚未出现，该区域监视者任务进行中，$Name_kuat$开始清理该区域监视者，任务预计将失败。"
  kuat_origin.15.d: "我们想知道第113战区的状态"
  kuat_origin.area_4: "编号:114 正在验证......\n验证成功，数据正常\n\n根据协议，你们有权知晓其他监视者状况，编号:113区域的永恒舰队尚未出现，该区域监视者尚未选出，$Name_kuat$已撤退。"


