  TIMELINE_EVENT_SHADOW_COPORUATION_01_TOOLTIP: "从这一武器炮台的基本结构来看，其内部第一级结构很类似于我们现有的紫外激光等武器，但能量水平远高于它们。但其他机构较为复杂，具体信息有待调查。"
