  kuat_epsilon_other_building_unlock:0 "§E搜索未知星域档案库§!"
  kuat_epsilon_other_building_unlock_DESC:0 "在§H[kuat_ancient_epsilon_star.GetName]§!内发现的一处档案库几何中心上方，可以检测到一种微弱而奇特的快子信号，但信号过于微弱，使我们难以解析其中的内容。\n\n我们需要对该档案库展开搜查并尝试解析这一信号，但这需要耗费更多时间。"
  kuat_epsilon_unlock_shield_world:0 "§E启动快子信号干扰系统§!"
  kuat_epsilon_unlock_shield_world_DESC:0 "在§H[kuat_ancient_epsilon_star.GetName]§!内多处护盾环带的几何中心上方，均检测到了微弱而奇特的快子信号，但信号过于微弱，使我们难以解析其中的内容。\n\n我们需要建立快子信号干扰系统，解除环带护盾并对环带展开搜查，以探明这一信号的源头，但这需要耗费更多时间。\n\n§R由于护盾能量极不稳定，我们必须先行撤离停泊在该环带轨道上的所有舰船，否则可能引发极其严重的后果！§!"
  kuat_epsilon_ringworld_1_site:0 "§E研究成果§!"
  kuat_epsilon_ringworld_1_site_desc:0 "以前的研究者们将一部分它们对恒星熔炉的研究成果保存在了§H[From.Planet.GetName]§!上的奇特的数据库中，这些研究成果很可能能够对我们在§H[kuat_ancient_epsilon_star.GetName]§!的重启工作起到不小的帮助，不过它们拥有一定的保护措施，我们必须投入更多的人力和资源来解决这一问题。"

