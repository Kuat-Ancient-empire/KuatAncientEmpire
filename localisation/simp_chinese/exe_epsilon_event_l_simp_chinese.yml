  kuat_event_memory.1.l:0 "$ag_legacy_invasion_chain_title$-$kuat_legacy_kuat$-$kuat_lagacy_5$"
  kuat_event_memory.1.l.response:0 "在危机爆发之前，$Name_kuat$一直在与失控的永恒舰队进行旷日持久的对抗。彼时，恩多迪亚帝国正值国力鼎盛的巅峰时期，但在$Name_Kuat_Fire_base$的暗中挑唆与蛊惑下，他们贸然偷袭了$Name_kuat$的驻军，企图夺取夸特的先进技术。\n\n然而这一鲁莽举动不慎引来了永恒舰队的注意，而当时的恩多迪亚帝国根本没有足够的力量独自抗衡如此可怕的强敌。在付出了惨痛的代价后，恩多迪亚的科研人员发现夸特的星际无畏舰能够有效抵御永恒舰队的压制力场，并最终借此艰难击退了永恒舰队的进攻。\n\n但和平并未持续太久。腾出手来的$Name_kuat$迅速对恩多迪亚帝国展开了雷霆报复。由于此前的苦战已令恩多迪亚帝国元气大伤，他们根本无力招架$Name_kuat$主力舰队的猛烈攻势，战争最终以恩多迪亚帝国的全面溃败而告终。战败之后，恩多迪亚帝国被迫与$Name_kuat$签订了城下之盟，其种群虽得以苟延残喘，但昔日辉煌的国家机器已被彻底砸碎。\n\n恩多迪亚帝国的先知在遗迹中留下了一道警示，告诫后世切勿彻底摧毁$Name_kuat$，否则必将给整片星海招致灭顶之灾。这段箴言既是对过往历史的沉痛反思，亦是对遥远未来的严厉警告。"

