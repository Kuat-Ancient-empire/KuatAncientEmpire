  ###### 事件 ######
  kuat_epsilon.1.name:0 "§H破败的星域§!"
  kuat_epsilon.1.desc:0 "§H[Root.GetName]§!穿过超空间航道后，抵达了一片空旷死寂的星域。\n\n该星系的景象与我们此前在夸特星域所见的截然不同：这是一座星系尺度的宏伟设施，破碎的环带与孤悬于深空中的高耸方尖碑交相矗立，显得诡异而压抑。从舰载传感器的反馈来看，星系中央环带周围密布着强烈的快子信号磁场，使我方的远程探测举步维艰；不仅如此，整个星系还充斥着高强度的快子乱流，以及一种我们从未在夸特星团中探测到过的奇异能量干扰。\n\n据随舰科研人员报告，整片星域的巨构建筑风格绝非夸特造物，甚至那三座方尖碑与恒星中央中枢构造的材质和形制也截然不同。研究人员建议加大对该星系的科研投入，以揭开这座远古设施背后的真正秘密。\n\n由于当前我们缺乏关键技术信息以及旧主潜在的支援，破解工作将耗费更长时间，我们需要保持耐心！"
  kuat_epsilon.1.a:0 "真是奇怪...."
  kuat_epsilon.2.name:0 "§H新的进展§!"
  kuat_epsilon.2.desc:0 "科研部门在最新报告中指出：§H[kuat_ancient_epsilon_star.GetName]§!境内的几座环带中，有一座护盾环带突然发生了剧烈的能量波动，这是多年来我们在该星域观测到的最为强烈的一次能量反应。\n\n科研人员抓住这一宝贵契机，迅速锁定了环带上的多处护盾发生器节点，并基本摸清了护盾的运转模式与信号结构。在经历了数年的研究停滞后，科研团队终于迎来了破局的良机！现在是我们大显身手的时候了——只需对该星系的能量流向与信号结构进行逆向分析，便可精准干扰快子信号的共振平衡，使整座环带护盾的能量结构彻底崩解。"
  kuat_epsilon.5.name: "§H能量爆发§!"
  kuat_epsilon.5.desc: "笼罩在[root.GetName]上空的快子信号护盾已被成功解除！然而受混乱而狂暴的快子磁场影响，星球的底层能量源并未随之停摆，反而随着护盾的瓦解在星球轨道上引发了一场毁灭性的能量风暴。高频高能的狂暴乱流瞬间席卷了整片近地轨道，将轨道上的一切障碍物尽数撕碎，所幸环带主体结构并未受到严重损伤。\n\n§E能量风暴来得快去得也快。当轨道上的乱流逐渐平息后，[root.GetName]终于显露出了宜居的地表环境。现在，我们应当立即派遣殖民船登陆该环带，搜寻其中封存的高价值情报。§!"
  kuat_epsilon.2.a: "加派人手，尽快解开护盾。"
  kuat_epsilon.5.a: "马上开展登陆准备！"
  kuat_epsilon.6.name:0 "§H[Root.GetName]§!"
  kuat_epsilon.6.desc:0 "我们的殖民船已在§H[Root.GetName]§!崎岖地表上的一处开阔地带平稳着陆，顺利组建了§H[Root.GetName]§!临时殖民政府，并采取了必要措施以应对§H[Root.GetName]§!地表的极端环境，整体拓荒工作进展得相当顺利。\n\n殖民者在探索§H[Root.GetName]§!地表区域时，意外发现了一座掩埋于冰川之下的远古遗迹。年代测定表明，其落成时间与§H[kuat_ancient_epsilon_star.GetName]§!中央那座因未知原因停摆的恒星熔炉大体相近，很可能出自同一文明之手。据殖民地报告，这座遗迹虽已废弃多时，但主体建筑保存完好，极有可能封存着有助于我们深入研究§H[kuat_ancient_epsilon_star.GetName]§!的关键资料；不过在此之前，工程人员需要先将其从§H[Root.GetName]§!的厚重冰川中彻底发掘出来。"
  kuat_epsilon.6.a:0 "真是神奇"

  kuat_epsilon.7.name:0 "奇特的数据库"
  kuat_epsilon.7.desc:0 "我们已经完成了§H[Root.GetName]§!冰川中奇特的数据库的清理工作，我们的科研团队的初步研究结果表明这座建筑的中心部分是一座修建者的资料储存库和信号发射器，这一储存库与我们的数据库建筑极为类似，但根据帝国数据库的查询，这并非是我们的盟友所建造的，或许这里应该可以找到我们需要找到的东西，以前在§H[Root.GetName]§!上的研究者们围绕这座快子信号发射器建造了一系列用途暂不明确的设施。\n\n我们的科研团队的报告表明建筑中心的快子信号发射器并非源自§H[kuat_ancient_epsilon_star.GetName]§!，它与太空中三座奇怪的方尖碑一样，是此前的研究者们从其他位置运到§H[kuat_ancient_epsilon_star.GetName]§!的，我们的科研团队需要更多的时间来对这座奇特的数据库进行研究。"
  kuat_epsilon.7.a:0 "这座遗迹很有价值，我们需要更多人手来开展研究。"
  kuat_epsilon.7.b:0 "这座遗迹很明显有古怪，我们需要立刻拆掉它！"

  kuat_epsilon.8.name:0 "$kuat_epsilon.7.name$"
  kuat_epsilon.8.desc:0 "我们完成了对§H[Root.GetName]§!冰川中奇特的数据库的清理工作之后的一段时间里，我们的研究人员发现这里的遗迹与之前发现的遗迹一样，这是一座以古代快子信号发射器为核心的数据库设施，我们需要对它进一步的研究。"
  kuat_epsilon.8.a:0 "真是神奇"
  kuat_epsilon.8.b:0 "拆除这座建筑。"
  kuat_epsilon.12.name:0 "档案库探索工程"
  kuat_epsilon.12.desc:0 "经过一段时间的研究，我们的科研团队已经完成了奇特的数据库的周边的勘察，鉴于我们目前的状态，我们可以开始对档案库进行探索和搜查了。"
  kuat_epsilon.12.a:0 "真是神奇"
  kuat_epsilon.13.name:0 "$kuat_epsilon.12.name$"
  kuat_epsilon.13.desc:0 "我们已经完成了对§H[Root.GetName]§!上那座奇特数据库的改造工程，并对这座与我方数据中心颇为相似的远古设施进行了全面调查。目前，研究人员正着手还原此地当年发生过的往事；与此同时，我方部署的快子信号放大器已调试完毕，科研团队顺利解析出了奇特数据库内部快子信号的底层结构——那正是永恒舰队的快子信号共振广播模式！\n\n结合此前从遗迹中获取的其他线索，我们如今已掌握了重启整座恒星熔炉的关键钥匙，这座宏伟要塞必将成为我方舰队的强力后盾。科研团队确信，这些信号与昔日研究者们从方尖碑中提取的某种控制参数密切相关，且该快子信号结构被当年的研究者们标记为“§H下标识[GetKuatEpsilonCode1]§!”。"
  kuat_epsilon.13.a:0 "非常好"
  kuat_epsilon.13.a.tooltip:0 "[GetKuatEpsilonObelisk1]下标识：§H[GetKuatEpsilonCode1]§!"

  kuat_epsilon.14.name:0 "$kuat_epsilon.12.name$"
  kuat_epsilon.14.desc:0 "自§H[Root.GetName]§!上的奇特数据库从冰川中发掘出来后，我们的科研团队便一直在对其进行持续研究，但起初并未取得突破性进展；直到近期，科研团队终于有了一些令人振奋的发现。\n\n据§H[Root.GetName]§!科研团队报告，他们在远古数据库的几何中心上方检测到了某种微弱却稳定的特殊快子信号，呈现出特定的几何拓扑结构。由于该信号极其微弱，起初甚至一度被误判为仪器底噪，令研究人员难以直接解析其内容。为此，科研团队恳请§H[Root.GetName]§!殖民政府调拨专项资源，支持他们对这座奇特的数据库展开深入改造，通过在遗迹内增设快子信号放大器来辅助解析这一神秘信号。\n\n不过，改造§H[Root.GetName]§!奇特数据库的工程绝非易事，遗迹中央的远古快子信号发射器会对施工造成强烈干扰，科研团队需要投入更多资源方能攻克这一难关。"
  kuat_epsilon.14.a:0 "批准特殊计划。"

  kuat_epsilon.15.name:0 "$kuat_epsilon.12.name$"
  kuat_epsilon.15.a.desc:0 "自科研团队对§H[Root.GetName]§!上的奇特数据库展开深入发掘以来，我们获取了一批极具价值的远古档案。档案表明，这座数据库与当年被吸引至此的外来探险者密切相关：他们在恒星熔炉与黑暗面原力的双重蛊惑下，心中的野心与贪欲被无限放大，妄图独占整座要塞、乃至借此君临整个宇宙。\n\n当年，那些探险者深入星图上未曾记载的未知星域，结果被恒星熔炉释放的快子信号一路引导至此，最终沦为了滋养熔炉的祭品。自拉卡塔无限帝国崩溃后，整座恒星熔炉的自动维护系统便逐渐产生了独立意识；由于拉卡塔人长年累月地使用黑暗面原力驱动熔炉，致使整座要塞几乎异化为了一尊半生命体——它无时无刻不在用黑暗面原力侵蚀、操纵着每一个妄图驾驭它的人。这是一座充斥着扩张欲与杀戮欲的魔窟，一步步吞噬着使用者的理智与底线。\n\n当科学家们试图继续深入检索时，却发现该设施内的其余档案几乎均已损毁，无法再从中提取出更多有价值的情报。"
  kuat_epsilon.15.b.desc:0 "自科研团队对§H[Root.GetName]§!上的奇特数据库展开深入发掘以来，我们获取了一批极具价值的远古档案。科研人员在这座新发掘的设施中费尽周折，终于找回了在上一座设施中缺失的探险者研究手记。\n\n手记显示，当年的探险者们对这几处设施的研究极为深入，却也在恒星熔炉的蛊惑下步步滑向腐化的深渊。他们注意到，环绕熔炉的这几处数据库设施，与他们此前在弑星者基地所在星系见过的远古建筑如出一辙。\n\n然而探险者们已无暇深究其中的关联。他们从遗迹的已知模块入手，对内部的磁场共振与快子信号频率进行了测算，发现这些快子信号似乎对应着某种高阶智能网络的共振频率；尽管仪器可以清晰地捕捉到这些频率，但其结构极度稳定，根本无法从外部强行干扰。在意识到无法屏蔽这些快子信号后，鬼迷心窍的探险者们竟决定利用呈对角分布的几座设施，将这些信号反向注入恒星熔炉核心，以此强行唤醒整座要塞！\n\n正当研究人员试图查阅后续记录时，线索却在此处戛然而止，看来我们必须前往下一座设施继续搜寻。"
  kuat_epsilon.15.c.desc:0 "自科研团队对§H[Root.GetName]§!上的奇特数据库展开深入发掘以来，我们获取了一批极具价值的远古档案。在这最后一座奇特数据库设施中，调查工作进展得异常顺利，我们成功找齐了探险者们遗留的全部资料，也查明了他们最终的结局。\n\n当年，探险者们下定决心重启这座恒星熔炉；然而在黑暗面原力的诱惑与猜忌恐惧的驱使下，他们为独占恒星熔炉的控制权而爆发了惨烈的内讧，昔日的同伴开始自相残杀。这场突如其来的血腥火并超出了所有人的预料，而在混乱蔓延开来后，更多探险者为了活命与争夺力量也被迫卷入厮杀之中。\n\n令人唏嘘的是，那些探险者们机关算尽、使出浑身解数，到头来却只是为了争夺这座魔窟而自相残杀，最终无一人能活着走出这片星域。\n\n此外，根据我们解析出的数据来看，这座恒星熔炉与永恒舰队的通讯信号极为相似，二者汇聚于此便会产生特殊的快子磁场共振。尽管我们尚不完全清楚这座熔炉的全部底细，但研究人员断定其最初的创造者早已彻底覆灭。因此，我们完全可以利用这座恒星熔炉，为我们接下来迎战永恒舰队提供强有力的支撑！"
  kuat_epsilon.15.a:0 "无论永恒舰队还是恒星熔炉，他们将彻底由我们掌控。"

  kuat_epsilon.21.name:0 "前人的工作"
  kuat_epsilon.21.a.desc:0 "经过一段时间的考古工作，我们的科研团队找到了§H[Root.GetName]§!上的奇特的数据库内部分遗留的资料——此前在§H[Root.GetName]§!的研究者们对一座奇特的数据库的研究成果，这些成果在探险者们离开时被小心地存放在了奇特的数据库中，似乎它们曾经计划在将来的某个时候再返回§H[kuat_ancient_epsilon_star.GetName]§!继续它们没有完成的工作，不过那些研究者们最终也没有返回§H[kuat_ancient_epsilon_star.GetName]§!，它们最终被熔炉所诱惑而自相残杀，它们留下来的研究成果现在将会为我们提供有力帮助。\n\n不过根据科研团队的报告，以前的研究者们在这些资料周围设置了许多保护措施，以§H[Root.GetName]§!的殖民地政府的能力难以处理这样的情况，他们需要我们提供更多的人力和资源来突破这些保护措施继续进行研究。"
  kuat_epsilon.21.b.desc:0 "我们的科研团队在§H[Root.GetName]§!上的奇特的数据库找到了另一份前人遗留的研究成果，它们同样拥有一定的保护措施，我们需要更多的人力和资源来继续进行研究。"
  kuat_epsilon.21.a:0 "真是神奇"

  kuat_epsilon.22.name:0 "$kuat_epsilon.21.name$"
  kuat_epsilon.22.a.desc:0 "$kuat_epsilon.21.a.desc$"
  kuat_epsilon.22.b.desc:0 "$kuat_epsilon.21.b.desc$"
  kuat_epsilon.22.a:0 "真是神奇"

  kuat_epsilon.23.name:0 "$kuat_epsilon.21.name$"
  kuat_epsilon.23.a.desc:0 "$kuat_epsilon.21.a.desc$"
  kuat_epsilon.23.b.desc:0 "$kuat_epsilon.21.b.desc$"
  kuat_epsilon.23.a:0 "真是神奇"

  kuat_epsilon.25.name:0 "§E古代研究成果：I§!"
  kuat_epsilon.25.desc:0 "§H[Root.GetLeaderName]§!带领的科研团队在§H[From.Planet.GetName]§!上的奇特的数据库附近进行了必要的准备工作，考古工作所需的各种设备都已经准备就绪，我们的科研团队可以开始下一步行动了。"
  kuat_epsilon.25.a:0 "继续"

  kuat_epsilon.26.name:0 "§E古代研究成果：II§!"
  kuat_epsilon.26.a.desc:0 "经过一段时间的深入攻关，§H[Root.GetLeaderName]§!率领的科研团队已成功找到了破解安保系统的办法。根据目前已掌握的情报，科研团队确信，当年踏足§H[kuat_ancient_epsilon_star.GetName]§!的探险者们一直在全力研究那座被他们称为“恒星熔炉”的远古造物——即位于§H[kuat_ancient_epsilon_star.GetName]§!中央、庞大而诡异的超级空间站。\n\n科研团队报告称，昔日的探险者们认为这座空间站是一件威力无穷的自动化战争兵器，但当他们发现§H[kuat_ancient_epsilon_star.GetName]§!时，整座要塞便已处于停机状态。受这座黑暗要塞的蛊惑，探险者们决定利用周边的快子信号共振来重启整套要塞系统，并为此特地从其他星系运来了三座方尖碑状的远古巨构。目前科研团队尚不清楚这些方尖碑的具体运作机制，后续研究仍需耗费一定时间。"
  kuat_epsilon.26.b.desc:0 "经历了一段时间的研究，§H[Root.GetLeaderName]§!带领的科研团队已经找到了突破安保措施的方法，我们的科研团队正在分析获得的信息，预计要一段时间才能得出结果。"
  kuat_epsilon.26.a:0 "真是神奇"

  kuat_epsilon.27.name:0 "§E古代研究成果：III§!"
  kuat_epsilon.27.a.desc:0 "我方科研团队在§H[From.Planet.GetName]§!上的考古发掘已圆满结束。§H[Root.GetLeaderName]§!在报告中指出，矗立于§H[kuat_ancient_epsilon_star.GetName]§!内的三座巨型方尖碑名为“永恒星碑”。尽管尚不清楚前人是如何铸造出这些永恒星碑的，但它们内部均搭载有一套特殊的快子信号共振增幅系统，能够汲取恒星的能量输出以大幅强化快子共振磁场，并借此强行重启恒星熔炉。\n\n当年的探险者们其实已基本完成了对永恒星碑的架设与校准，却在最后关头因抵受不住黑暗面的蛊惑而自相残杀，致使功亏一篑。我方科研团队的研究表明，启动每座方尖碑均需输入被称为“§H上标识§!”与“§H下标识§!”的两组控制参数；而昔日的研究者们早已测算出该方尖碑的“§H上标识[GetKuatEpsilonCode0]§!”。站在前人的肩膀上，或许我们很快就能完成那群蠢货当年未能竟全功的伟业了。"
  kuat_epsilon.27.b.desc:0 "我们的科研团队在§H[From.Planet.GetName]§!上的考古工作已经圆满结束了，我们成功找到了对应方尖碑的§H上标识[GetKuatEpsilonCode0]§!。"
  kuat_epsilon.27.a:0 "非常好"
  kuat_epsilon.27.a.tooltip:0 "[GetKuatEpsilonObelisk0]上标识：§H[GetKuatEpsilonCode0]§!\n§Y<您现在可以通过升级对应的古代方尖碑打开它的设置界面。>§!"

  kuat_epsilon.31.name:0 "§E永恒星碑§!"
  kuat_epsilon.31.a.desc:0 "<初始化调试系统 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n\n<重置指令优先级 ... ... §Y4407§! ... §Y90§! ... §Y1§!>\n<发现未知访客：§Rc0117a36§!>\n\n<验证快子信号频率 ... ... §G123202-407-01: c0117a36§!>\n<系统权限 ... ... §YN1§!>\n\n<追加子系统 ... ... §Y c0117a36-1023§!>\n\n<重置指令优先级 ... ... §Y0117§! ... §Y90§! ... §Y1§!>\n\n<请求上标识 ... ... >\n<请求下标识 ... ... >\n"
  kuat_epsilon.31.b.desc:0 "<初始化调试系统 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n\n<重置指令优先级 ... ... §Y4407§! ... §Y90§! ... §Y2§!>\n<发现未知访客：§Rc0117a36§!>\n\n<验证快子信号频率 ... ... §G123202-407-02: c0117a36§!>\n<系统权限 ... ... §YN1§!>\n\n<追加子系统 ... ... §Y c0117a36-1023§!>\n\n<重置指令优先级 ... ... §Y0117§! ... §Y90§! ... §Y2§!>\n\n<请求上标识 ... ... >\n<请求下标识 ... ... >\n"
  kuat_epsilon.31.c.desc:0 "<初始化调试系统 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n\n<重置指令优先级 ... ... §Y4407§! ... §Y90§! ... §Y3§!>\n<发现未知访客：§Rc0117a36§!>\n\n<验证快子信号频率 ... ... §G123202-407-03: c0117a36§!>\n<系统权限 ... ... §YN1§!>\n\n<追加子系统 ... ... §Y c0117a36-1023§!>\n\n<重置指令优先级 ... ... §Y0117§! ... §Y90§! ... §Y3§!>\n\n<请求上标识 ... ... >\n<请求下标识 ... ... >\n"
  kuat_epsilon.31.a:0 "§E确认设置§!"

  kuat_epsilon.32.name:0 "研究成果"
  kuat_epsilon.32.desc:0 "结合目前对三座$pc_ringworld_habitable$生态区上的奇特的数据库的研究成果，我们的科研团队在包裹§H[kuat_ancient_epsilon_star.GetName]§!中心恒星熔炉附近找到了一处控制设施，以前的探险者们计划通过它来控制§H[kuat_ancient_epsilon_star.GetName]§!内的三座永恒星碑同时运行并向熔炉进行共振激活，我们的科研团队已经完成了对这处设施的改造工作，一旦我们调整三座永恒星碑的科研团队准备完毕，我们就可以通过这处控制设施启动永恒星碑对§H[kuat_ancient_epsilon_star.GetName]§!的快子信号磁场进行冲击，只要我们的数据和标识正确，熔炉将可能重新启动。"
  kuat_epsilon.32.a:0 "真是神奇"
  kuat_epsilon.32.a.tooltip:0 "§Y<您现在可以通过升级§!§H[kuat_ancient_epsilon_star.GetName]§!§Y中心的恒星熔炉来启动三座永恒星碑。>§!"

  kuat_epsilon.33.name:0 "起点"
  kuat_epsilon.33.desc:0 "我们已经启动了§H[kuat_ancient_epsilon_star.GetName]§!内的三座永恒星碑，它们的内部开始出现活跃的快子信号活动，这些方尖碑应该很快就会开始运转。"
  kuat_epsilon.33.a:0 "希望我们成功了……"

  kuat_epsilon.37.name:0 "进展"
  kuat_epsilon.37.desc:0 "§H[kuat_ancient_epsilon_star.GetName]§!内的三座永恒星碑已经开始运转，三束奇异的快子信号射流照射在星系中央的恒星上，发出明亮的橙色光芒，我们的科研团队检测到星系的快子信号共振强度正在迅速增长，应该很快就会提高到恒星熔炉重启的标准。"
  kuat_epsilon.37.a:0 "非常好，让我们继续等待。"

  kuat_epsilon.38.name:0 "警戒"
  kuat_epsilon.38.desc:0 "§H[kuat_ancient_epsilon_star.GetName]§!内的三座永恒星碑已经开始运转，但一切和我们的预期并不相符，星系的快子信号磁场共振强度并不如我们的多次模拟测试得到的信号强度水平，很显然我们的设置存在一些问题。"
  kuat_epsilon.38.a:0 "这看起来很不妙……"

  kuat_epsilon.39.name:0 "共振强化"
  kuat_epsilon.39.desc:0 "§H[kuat_ancient_epsilon_star.GetName]§!内的三座古代永恒星碑已经停止了运行，永恒星碑顶部的快子信号活动正逐渐平息，它们已经如我们预期那样完成了工作，恒星熔炉的控制系统正在慢慢地启动，目前它仍处于一种位于开启和关闭之间的变换状态，不过它和周围的快子信号共振已经达到我们预期的强度，以我们的科研部门以往对恒星熔炉和永恒舰队快子信号频率的研究经验，我们现在应该可以直接对恒星熔炉进行重启。"
  kuat_epsilon.39.a:0 "那就让我们开始吧。"



  #剧情回忆
  concept_kuat_mission_6_chain_add_on_1:0 "在与本MOD内任何单位进行战斗之前，应该确保舰队中具有旗舰，如有副旗舰可对旗舰进行增益，超旗无需副旗。"
  concept_kuat_mission_6_chain_add_on_1_desc:0 "$kuat_mission_6_chain_add_on_1$"
  concept_kuat_mission_6_chain_add_on_2:0 "在与本MOD内任何单位进行战斗时，均会启动动态修正系统。动态修正系统将保证双方交战平衡，其中补给区会大幅度提高己方动态修正的增益幅度，并减少己方承受的压制效果，因此请尽量在补给区内交战。"
  concept_kuat_mission_6_chain_add_on_2_desc:0 "$kuat_mission_6_chain_add_on_2$"
  concept_kuat_mission_6_chain_add_on_3:0 "一些特殊单位具备独立的作战功能，如无限帝国与流浪者均具备击杀后恢复一定数量被击杀舰船的功能。监护者巡洋舰具备对非本MOD内单位的敌舰效率抑制能力。夸特、监督者、流浪者系列：不要求旗舰舰队；无限帝国、永恒舰队要求必须存在旗舰舰队。"
  concept_kuat_mission_6_chain_add_on_3_desc:0 "$kuat_mission_6_chain_add_on_3$"
  concept_kuat_mission_6_chain_add_on_4:0 "本MOD内的任何独立作战单位，均具备自主保障系统，以保证事件链稳定运行。"
  concept_kuat_mission_6_chain_add_on_4_desc:0 "$kuat_mission_6_chain_add_on_4$"
  concept_kuat_mission_6_chain_add_on_5:0 "旗舰"
  concept_kuat_mission_6_chain_add_on_5_desc:0 "旗舰是所有受限制数量建造的星际无畏舰，包括$Name_boss_Venganza$、$Name_boss_Dominance$、$NAME_KUAT_Annihilator$、$Name_boss_eclipse$、$NAME_KUAT_COMPELLOR$、$NAME_KUAT_IMPELLOR$、$NAME_KUAT_EXECUTOR_1$、$NAME_KUAT_EXECUTOR$、$Name_boss_Dominance$、无限战巡、永恒旗舰、以及受支持的其他MOD旗舰"
  concept_kuat_mission_6_chain_add_on_6:0 "副旗舰/支援舰"
  concept_kuat_mission_6_chain_add_on_6_desc:0 "包括§Y战斗者$X308_Balletor$、泰坦级$X308_Balletor$、暴君级$X308_Balletor$以及受支持的其他MOD旗舰。"
  concept_kuat_mission_6_chain_add_on_7:0 "超级旗舰/超旗舰"
  concept_kuat_mission_6_chain_add_on_7_desc:0 "仅包括$NAME_KUAT_COMPELLOR$、$NAME_KUAT_IMPELLOR$星际无畏舰、$Name_boss_eclipse$星际无畏舰、无限母舰、流浪者航母、冬眠者旗舰以及受支持的其他MOD旗舰。"

