l_simp_chinese:
  ###############################
  Kuat_non_lagacy_1:0 "§E深空信号§!"
  Kuat_non_structure:0 "宇宙深处，一股神秘的信号悄然传来，它以一种独特的规律在浩瀚的宇宙中蔓延，仿佛在向无垠的星际宣告着某种未知力量的降临。科研团队经过精密的探测与分析，初步确定了信号的源头——一颗毫不起眼的盖亚星球。他们凭借先进的技术，成功地定位了这颗星球所在的星系坐标，揭开了这场宇宙之谜的神秘面纱的一角。"
  Kuat_non_lagacy_2:0 "§E永恒圣殿§!"
  Kuat_non_structure_2:0 "在完成初步的调查之后，我们的科研团队历经漫长岁月，于浩渺的宇宙信号频段中，探寻着那隐匿于黑暗中的微光。终于，一个隐蔽而微弱的频段被我们捕捉到，它如同宇宙深处传来的低语，带着神秘的韵律，悄然在星际间传递。\n\n经过团队成员们夜以继日的钻研与比对，我们发现这个频段与上一次在我们境内某个气态巨行星上发现的信号极为相似。那颗行星，宛如宇宙中的隐者，长久以来默默无闻，却在这一次的探索中，向我们展露出它不为人知的一面。\n\n而更令人震惊的是，这颗行星的坐标，竟与我们在永恒帝国传说文献中所见的其首都扎库尔星系的坐标，有着惊人的契合。这绝非巧合，它预示着一场巨大的历史变革即将拉开帷幕，或许，那古老传说中被遗忘的篇章，正等待着我们去重新书写。\n\n然而，团队中的科研人员在进一步的调查中发现，这颗行星的微弱信号，竟与神话中记载的原力有着难以言喻的相似之处。那是一种古老而强大的力量，曾被无数传说所传颂，却始终未曾真正被证实。如今，它仿佛在向我们招手，引领我们踏入一个全新的领域。\n\n或许，这正是命运赋予我们的机遇。我们将借此机会，深入探索这颗神秘的行星，揭开它隐藏的秘密，寻找那些古老传说中遗失的宝藏，以及那些或许能够改变我们未来的力量。"
  Kuat_non_legacy.1.name:0 "§E近地面调查§!"
  Kuat_non_legacy.1.desc:0 "我们的科研团队成功抵达了这颗星球的近地面轨道，如果我们早期探测的和推测的坐标与信号频段几乎完全一致。我们在距离星球近地面越来越近的过程中，那股微弱的快子信号共振相比我们远处探测的变强了非常多，这是一个好兆头，这预示着我们找对了地方。\n\n在我们的团队乘坐登陆舰船抵达该星球的表面的过程中，我们的科研人员发现这颗星球的表面被一种我们以往从未见过的某种物质形式所笼罩——这些物质能量的组织形式与我们帝国文献记载的原力非常相似，在传说的记载中这既非黑暗面原力，更不是光明面原力。刚进入大气层，我们的科研团队就感知到了那无处不在的、狂暴的原力乱流，云层之下甚至闪耀着天然的原力闪电，这使得进入大气层调查的行动危险系数陡增。此外混乱的原力环境甚至影响了周围能量形式严重干扰了科研船上的传感器，船上人员正在尽量提高传感器的功率，这需要一点时间。"
  Kuat_non_legacy.1.a:0 "§E令人不安的发现§!"
  Kuat_non_legacy.2.name:0 "§E消失的山脉§!"
  Kuat_non_legacy.2.desc:0 "我们的科研人员经过重重艰难，成功克服了星球大气中混乱的原力环境造成的对调查的恶劣的不利影响。我们的科研人员在抵达星球表面后迅速对大致处于降落点半径500公里内的区域利用搜查设备和侦察无人机进行收集和搜索地理资料调查。\n\n功夫不负有心人，我们的科研人员通过对地理数据建模进行分析后发现位于正常大陆板块的挤压处应该出现的连续山脉中脊出现了严重的不符合自然的山脉断裂情况，似乎就像是被某种力量切断了似的，在那里我们发现此前侦察到的快子信号共振处于最高的频率，我们应该花一些时间前往该处继续进行调查。"
  Kuat_non_legacy.2.a:0 "§E令人不安的发现§!"
  Kuat_non_legacy.3.name:0 "§E深入骨髓的寒冷§!"
  Kuat_non_legacy.3.desc:0 "我们科研人员前往该处断层点的时候，发现此处的自然环境状况受到了不明的原力或者人为机器或者力量的影响，与星球周围的自然环境区域产生了非常大的异常状况。这里地面无法生长出一些星球上特有的自然植被，整个断层谷地只有灰色的类石灰岩似的地面岩石。不仅如此还具有相当浓重的能量辐射反应。\n\n我们的科研人员根据仪器对此处的搜查并不是很顺利，由于该处无法用一些自然情况解释，并且与我们的帝国传说文献记载的奥德兰中央反应堆区域非常接近。根据这样的猜测和指引，我们的科研人员成功在谷底的隐蔽的凹处发现了一座不起眼的实质建筑，我们的仪器因为混乱的原力环境完全失去了作用。我们的科考进程还需要一点时间。"
  Kuat_non_legacy.3.a:0 "§E令人不安的发现"
  Kuat_non_legacy.4.name:0 "§E遗存的智能§!"
  Kuat_non_legacy.4.desc:0 "我们的科研团队由于无法使用仪器，不得已只能选择冒险进入建筑进行调查。在我们的科研团队的调查进程中发现，整座石质建筑的内部设施和设备相对保持得较为完善，通过我们对设备的观察和调查显示这些设备似乎是来自一个曾经位于巅峰的外星文明，我们甚至都无法通过对设备的初步调查得知其运用的技术，但应该与我们的技术相差无几。\n\n我们的科研团队正一筹莫展之际，似乎是某个成员激活了一个奇怪的设备，一场混乱以后，整个设施的设备奇迹般地重新运转了，在我们的科研团队正在思考退路的时候，一个奇特的智能系统对我们的[leader.GetName]提出了交流的申请，这些AI居然具有人的感性，这真是奇迹，人工智能从建筑的各个方位发出了它那机械化的声音。我们的科研人员发现智能AI所说的语言与我们的极为相似。"永恒舰队...帝国...我们..自由了...战争...结束....无限帝国..拉卡塔...议会.....毁灭........"\n\n由于整个遗迹和星球开始了剧烈的原力变化，我们的科研团队在听完最后的信息时来不及对AI所说的事情进行分析,就不得已离开该星球，但离开之前[leader.GetName]带回来了一颗奇特的星球上特有的自然产物，一种有着能量辐射的水晶。"
  Kuat_non_legacy.4.a:0 "安全第一"
  Kuat_non_legacy.5.name:0 "§E星球危机§!"
  Kuat_non_legacy.5.desc:0 "我们的科研人员在成功离开古代的设施以后，惊骇地发现整个星球的自然环境发生了剧烈的变化，他们的维生系统完全不再支持他们的继续活动，[leader.GetName]申请离开该星球，保证科研人员的安全以及开展对星球上的水晶样本的具体分析。"
  Kuat_non_legacy.5.a:0 "回来就好"
  Kuat_non_legacy.6.name:0 "§E研究突破§!"
  Kuat_non_legacy.6.desc:0 "我们的科研人员初步的研究获得了重大的突破，我们现在已经可以对这个水晶之中蕴含的特殊的辐射共振形式进行解析，相信我们很快就能挖掘出其中的秘密"
  Kuat_non_legacy.6.a:0 "一定要解出来"
  Kuat_non_legacy.7.name:0 "§E研究突破§!"
  Kuat_non_legacy.7.desc:0 "功夫不负有心人，在我们的科研部门的精英们彻夜的努力下，我们成功的通过共振形式的快子信号中转化编译成为我们所熟悉的坐标信息，这将引领我们前往一座古代遗存的设施。"
  Kuat_non_legacy.7.a:0 "好"
  Kuat_non_legacy.8.name:0 "§E气态行星轨道§!"
  Kuat_non_legacy.8.desc:0 "我们的科研团队根据快子信号解析的数据的指引，成功找到了一颗似乎平淡无奇的气态巨行星，这颗星球与我们所见过的一般气态巨行星并没有太大的差异，仅仅只是这颗行星大气层受到了气态行星的风暴的影响产生了严重的快子信号干扰，这阻碍了我们的星球扫描工作。在百般无奈之下，我们的科研人员只能转而试图寻找一处正常的区域涉险进入气态行星的表层搜索更具有价值的信息。\n\n我们的科研人员发现气态巨行星的大气层风暴呈现着一种规律性的运动，这和我们曾经见过的气态风暴有所不同，似乎是受到了某种奇特的作用力的影响，但我们要找到原因还需要一定时间。"
  Kuat_non_legacy.8.a:0 "令人不安的发现"
  Kuat_non_legacy.9.name:0 "§E行星建筑§!"
  Kuat_non_legacy.9.desc:0 "我们的科研人员通过对风暴的状态和规律的研究获得了非常大的突破，我们的科研团队发现位于星球大气的风暴虽然似乎杂乱无章又藏着某种奇特的规律，但我们是可以掌控和利用这个风暴的状况找到一些有价值的信息。我们的科研人员发现在行星风暴的杂乱背后的一处曾经的风暴眼位置有股微弱的快子信号发出，我们科研人员决心前往该处。追踪着信号源，我们来到了风暴中央，令我们的科研人员惊奇的是这座浮空的倒金字塔形建筑散播着某种似乎是我们文献记载中的原力的共振形式前。这种乱流的强度在这里达到了顶峰，扭曲混乱的狂暴漩涡在此交汇，哪怕是我们身经百战的精英成员也感受到了那深入骨髓的恐怖尖啸，仿佛面前那高耸的冰冷建筑就是地狱的大门。信号源仍在运作，继续向外发送着那枯燥的信号，吸引着不知死活的好事者。"
  Kuat_non_legacy.9.a:0 "令人不安"
  Kuat_non_legacy.10.name:0 "§E损毁的王座§!"
  Kuat_non_legacy.10.desc:0 "我们的科研人员决定进入这座诡异的倒金字塔建筑，在我们的历史中，倒金字塔意味着诡异和神秘，但我们必须调查清楚。顺着建筑的主通道一路向前，科考队来到了一处直径约二十米的圆形大厅，令人惊奇的是整座倒金字塔建筑内居然空间如此狭小，一个表面经历大量灰尘和历史带来的潮湿的植物覆盖的王座坐落于在大厅中央的基座上。我们的科研人员看到如此震撼的一幕，并没有愣在那里，科研团队在基座周围发现了一个奇特的方形类似全息仪的设备。\n\n我们的科研人员发现无法简单的激活全息仪，但[leader.GetName]发现利用王座周围的原力乱流对全息仪进行冲刷，在这么进行了尝试以后，全息仪仿佛受到了一股不知哪来的力的影响，从我们的科研人员的手中悬浮起来，全息仪即将要开启了！"
  Kuat_non_legacy.10.a:0 "好"
  Kuat_non_legacy.11.name:0 "§E往事种种§!"
  Kuat_non_legacy.11.desc:0 "随着全息仪缓缓升空，我们的科研人员目睹了全息仪投影出的一道模糊人影。由于全息仪年代久远，影像难以辨认，但他讲述的故事却清晰地回荡在我们的耳边。\n\n这是一个高度发达的文明——拉卡塔人，他们建立了跨越整个银河系的强大帝国——无限帝国。他们奴役了众多种族，毁灭了一个又一个文明，其繁荣却如昙花一现。一场神秘的腐化传染病毒爆发，让这个强大的帝国迅速分崩离析。被奴役的文明揭竿而起，试图给这个罪恶的帝国送上最后一击。然而，不甘心毁灭的拉卡塔人利用从$Name_Kuat_StarContractor$那里获得的技术，研制出了一批智能作战武器，其中$Name_Eternal_Aries_Support$与双子座永恒舰队成为他们最强大的战争机器。\n\n拉卡塔的皇帝重新建立了无限帝国，再次奴役了反对者，制造了一场又一场骇人听闻的银河大屠杀，然而知性智能AI对无限帝国的决策产生了不满，最终永恒舰队发动了毁灭性的袭击。在这场袭击中，无限帝国终究是走向了灭亡，也因此许多文明迎来了他们的自由，银河系从此进入了一个全新的时代。\n\n从此，永恒舰队再一次销声匿迹，这些疯狂机器或许仍然存在于世。"
  Kuat_non_legacy.11.tooltip:0 "§R永恒舰队将在未来重新出现，准备迎接新的威胁§!"
  Kuat_non_legacy.11.a:0 "真是知性文明的悲哀"
  Kuat_non_legacy.12.name:0 "§E生命复苏§!"
  Kuat_non_legacy.12.desc:0 "我们的科研人员在总结了全息仪所述的历史以后，决定继续调查这座倒金字塔建筑。在建筑的深处，我们的科研人员发现了一座巨大的能量核心，这个核心似乎是某种古老的星球改造装置的动力源。经过一番研究，我们的科研人员成功地重新激活了这个装置，启动了星球改造程序。\n\n随着装置的启动，整个星球开始发生剧烈的变化。原本荒芜的土地逐渐变得肥沃，空气中弥漫着生命的气息。整个星球仿佛焕发出了新的生命力。我们的科研人员目睹了这一切，这宛如神迹一般的变化震撼了我们的科研人员。\n\n我们的研究人员推测，这些设施的建造者掌握着先进的星球改造技术，这绝不是寂寂无名之辈能留下来的遗迹，这意味着我们的探索工作尚未完成。"
  Kuat_non_legacy.12.a:0 "继续调查。"
  Kuat_non_legacy.12.tooltip:0 "§E星球将被改造成为$pc_gaia$，解锁自动星港§!"
  Kuat_non_legacy.13.name:0 "§E旧日遗书§!"
  Kuat_non_legacy.13.desc:0 "我们的研究人员的推测是正确的，我们在继续调查这座倒金字塔建筑时，发现了一间隐藏的密室。在密室中，我们的科研人员发现了一台艰难运行的机械，好在其储存设备还能正常工作，我们成功地从中提取出了一些数据。\n\n经过我们的研究人员分析，发现这一设施的建造者源自于一个从未被历史记录的古老文明，他们称自己为扎库尔帝国，或者说永恒帝国。\n\n他们在数据中留下了大量文献记录，其中明确包括了，他们曾经控制了一种名为永恒舰队的战争机器，而这正是我们之前发现的那批智能作战武器，他们在背叛无限帝国以后，辗转几十万年的时光，最终被扎库尔人控制，他们以此建立了一个强大的帝国，并期待通向永恒，称之为永恒帝国。\n\n然而，扎库尔帝国的命运并未如他们所愿。永恒舰队被银河帝国察觉，尽管扎库尔击溃了多次进攻，但在拉卡塔残余的背叛中，腹背受敌，真正的永恒舰队由此走向覆灭，银河帝国掌控了永恒舰队的技术，将剩下的永恒舰队完全变成了傀儡舰队，至此，永恒帝国也被夺取最终成果的银河帝国所消灭。\n\n好在，这一设施修建在永恒帝国末期，他们在此留下了大量的传承遗产，或许是希望有一天能够东山再起，亦或者希望后世能有抵抗银河帝国制造的傀儡舰队的能力。"
  Kuat_non_legacy.13.a:0 "那些傀儡永恒舰队，还会回来吗？"
  Kuat_non_legacy.13.tooltip:0 "§E解锁：所有夸特帝国的舰船和科技§!"
  Kuat_non_legacy.13.b: "往事如过往云烟，再见了，过去。"

  Kuat_non_legacy.36.crisis.desc: "曾经肆虐整个星系的永恒舰队，如今已被彻底击败，化作宇宙尘埃。我们在这片星域中搜寻了无数次，却再也找不到任何漏网之鱼。它们的增援部队也永远无法再踏入我们的星系，曾经的威胁，如今已成过往云烟。\n\n我们的科研部门经过无数次的分析与模拟，根据永恒舰队的多次进攻以及这次进攻的损失，得出了一个令人振奋的结论：永恒舰队已经名存实亡。那曾经令人闻风丧胆的战争机器，如今已成历史。银河系的天空，再次变得宁静而祥和。\n\n此刻，欢呼和雀跃再次充满了整个银河。永恒舰队的终结，不仅仅是一个时代的结束，更是全新时代的开启。我们的研究部门从永恒舰队的残骸中解析出了全新的科技，这些科技将为我们的文明带来前所未有的发展机遇。\n\n然而，我们并没有被胜利冲昏头脑。曾经在遗迹中获得的警告，如今依然回响在我们的耳边。我们深知，宇宙中充满了未知与变数，或许这些古老的故事并非全是虚构。因此，我们必须密切注意星系中的变化，保持警惕，随时准备应对可能出现的新的威胁。\n\n曾经，我们以为永恒舰队是不可战胜的，但如今，我们用实际行动证明了，只要我们团结一心，没有什么是不可能的。这场胜利，属于我们每一个人，属于整个银河系。我们将永远铭记这一刻，铭记那些为了胜利而付出一切的英雄们。\n\n让我们携手共进，迎接属于我们的全新时代。"
  ### Non-Legacy Technologies ###
  tr_zakuul_defense_matrix:0 "扎库尔防御矩阵"
  tr_zakuul_defense_matrix_desc:0 "从扎库尔档案中发掘的古老防御网络，大幅降低星堡升级费用并扩展防御平台容量。"
  tr_zakuul_neural_hack:0 "扎库尔神经覆写协议"
  tr_zakuul_neural_hack_desc:0 "来自扎库尔联盟档案的机密神经干扰技术，专门针对永恒舰队的行为弱点进行攻击。"
  tr_eternal_fleet_weakness_analysis:0 "永恒舰队弱点分析"
  tr_eternal_fleet_weakness_analysis_desc:0 "通过对回收的永恒舰队残骸进行深入研究，我们已识别出能被能量武器和动能武器同时放大的结构薄弱点。"
  tr_eternal_fleet_adaptive_shields:0 "永恒舰队自适应护盾逆向工程"
  tr_eternal_fleet_adaptive_shields_desc:0 "通过逆向工程永恒舰队的自再生护盾技术，我方舰船现在能在战斗中快速恢复护盾完整度。"
  ### 对抗路线：.21-.23 ###
  Kuat_non_legacy.21.name:0 "§E战术解构§!"
  Kuat_non_legacy.21.desc:0 "我军情报部门已经完成了从永恒舰队战斗算法中回收的战术数据的全面分析。研究结果令人瞩目——舰队的协调模式揭示了毁灭性的优势和可利用的结构性弱点。\n\n其编队协议依赖于一个集中式指挥中继系统，一旦遭到破坏，就可能导致整个战斗群的系统性崩溃。我们的分析人员认为，这些知识可能是在全面永恒舰队入侵中生存——甚至击败敌人——的关键。\n\n问题是：我们如何应用这些发现？"
  Kuat_non_legacy.21.tooltip:0 "我们的逆向工程团队已经解锁了对永恒舰队作战架构的关键洞察。"
  Kuat_non_legacy.21.a:0 "立即开始反制措施研究"
  Kuat_non_legacy.21.a.tooltip:0 "将研究发现直接投入防御技术研究。"
  Kuat_non_legacy.21.b:0 "集中力量于舰队生产"
  Kuat_non_legacy.21.b.tooltip:0 "将战术数据转化为船坞生产优先级。"
  Kuat_non_legacy.22.name:0 "§E边境线上的幽灵信号§!"
  Kuat_non_legacy.22.desc:0 "边境哨站§H[Root.Capital.GetName]§!的远程传感器阵列探测到了异常接触——不，是一组接触信号。三艘未知配置的探测器被观测到正在我们的边境进行侦察扫描。\n\n它们的应答器信号与我们此前分析的永恒舰队有着令人不安的相似。这些是探测器——小巧、快速、正在试探我们的防御。如果不加阻止，它们将会把我们的部署情报回报给指挥永恒舰队的指挥架构。\n\n驻军指挥官等待命令。"
  Kuat_non_legacy.22.a:0 "立即消灭它们"
  Kuat_non_legacy.22.a.tooltip:0 "部署快速反应中队在探测器逃脱前将其摧毁。残骸可能提供更多情报。"
  Kuat_non_legacy.22.b:0 "尝试俘获一艘"
  Kuat_non_legacy.22.b.tooltip:0 "冒着更大的风险执行复杂的行动，瘫痪并登上一艘探测器。这对研究来说将是无价的——但探测器可能在行动期间逃脱。"
  Kuat_non_legacy.23.name:0 "§E残骸述说一切§!"
  Kuat_non_legacy.23.desc_capture:0 "登舰行动大获成功。我们的海军陆战队在其他探测器反应之前，成功瘫痪并俘获了一艘永恒舰队探测器。其内部令人不安——有机管道与水晶计算阵列的无缝融合，完全不同于我们工程档案中的任何东西。\n\n工程团队已经开始了全面的系统拆解。探测器的导航核心包含未知区域的加密星图，其武器系统揭示的设计原理挑战了我们对定向能量投射的基本理解。\n\n这份战利品将在未来几代人的时间里重塑我们的军事理论。我们已经尽可能做好了准备。"
  Kuat_non_legacy.23.desc_destroy:0 "交战迅速而果断。我们的巡逻舰队拦截了永恒舰队探测器并在它们撤退前将其消灭。残骸散布在跨越数个天文单位的碎片场中。\n\n打捞团队回收了探测器战术处理器的碎片和船体成分样本。虽然不如完整俘获那么全面，但这些数据更清晰地描绘了永恒舰队的能力——以及我们面对它们的准备程度。\n\n对于即将到来的一切，我们已经尽可能做好了准备。"
  Kuat_non_legacy.23.a:0 "我们已做好准备"
  Kuat_non_legacy.23.a.tooltip:0 "§G永久修正：对抗战备§!"
  Kuat_non_legacy.24.name:0 "§E风暴将至§!"
  Kuat_non_legacy.24.desc_archive:0 "古老档案中记载了一个循环——当永恒舰队觉醒时，一场巨大的毁灭浪潮将席卷整个银河系。现在，所有迹象都指向预言的再次应验。\n\n整个银河系的传感器网络正在深空中记录到前所未有的能量涌动。我们从档案中解码的快子信号特征完全吻合。永恒舰队正在集结。\n\n我们花了漫长的岁月做准备，以古人的智慧为指引。现在，我们必须凭借他们留下的知识来面对这场风暴。"
  Kuat_non_legacy.24.desc_alliance:0 "我们集结的盟友——扎库尔意识体、古代守护者——都报告了同样的不祥征兆。永恒舰队在苏醒。银河系的通讯频道充满了尚不理解即将降临之事的文明发出的绝望信号。\n\n我们的联盟就是为了这一刻而缔结的。我们分享了知识，协调了防御，整备了力量。现在考验来了。"
  Kuat_non_legacy.24.desc_confrontation:0 "我们的军事分析人员已经追踪这些迹象数周——未知空间中的舰队调动、不符合任何已知自然现象的能量尖峰，以及整个前哨站无声无息的消失。这种模式是不可否认的。\n\n永恒舰队来了。我们的军队严阵以待，被我们收集的情报和开发的反制措施所强化。我们准备已久的对决终于来临。"
  Kuat_non_legacy.24.a:0 "放马过来"
  Kuat_non_legacy.24.a.tooltip:0 "永恒舰队入侵迫在眉睫。所有准备工作必须完成。§Y银河系屏息以待§!"
  Kuat_non_legacy.25.name:0 "§G新黎明§!"
  Kuat_non_legacy.25.desc_archive:0 "风暴已过。曾经遮蔽群星的永恒舰队如今只剩下残骸和寂静。古老的档案是对的——循环可以被打破。\n\n当我们的舰队清除入侵力量的最后残余时，帝国各地的学者们已经开始以全新的视角重新解读扎库尔文献。古老的预言不仅讲述了毁灭，还讲述了新生。银河系历史的新篇章从今天开始——而我们就是书写者。\n\n通过世代细心研究而保存的知识获得了超越衡量的回报。古人的遗产通过我们延续。"
  Kuat_non_legacy.25.desc_alliance:0 "胜利。这个词在联盟网络的每一个通讯频道中回响。永恒舰队——那个困扰文明噩梦的远古恐惧——被选择合作而非孤立的力量联合击败了。\n\n扎库尔意识体传达了深切的感激。与我们并肩作战的守护者们敬重我们的勇气。这个在灭绝阴影下缔结的联盟已经证明，团结是对抗混沌的最强大武器。\n\n我们从黑暗中走出，不仅胜利了，而且蜕变了——成为文明联合所能成就之事的灯塔。"
  Kuat_non_legacy.25.desc_confrontation:0 "最后的永恒舰队旗舰在级联的火焰中炸裂，我们的舰队指挥官们在每一条频道上爆发出欢呼。我们做到了。我们坚守阵地，重拳出击，打碎了敌人的脊梁。\n\n我们从早期侦察交战中发展出的战术条令证明了毁灭性的效力。我们的军队适应、克服、最终统治了一个数千年来碾碎文明的敌人。\n\n这场胜利属于每一位为战争做出贡献的士兵、工程师、分析师。永恒舰队挑战了帝国的力量——而帝国给出了回答。"
  Kuat_non_legacy.25.a:0 "新纪元开启"
  Kuat_non_legacy.25.a.tooltip:0 "永恒入侵已被击败。永恒帝国的遗产归于我们。§G永久修正：永恒遗产承载者§!"
  kuat_confrontation_combat_ready:0 "§R对抗战备完成§!"
  kuat_confrontation_combat_ready_desc:0 "通过对永恒舰队残骸的深度分析和反复模拟，我军已发展出一套针对性极强的战术条令。我们的情报优势和军事准备使帝国在面对即将到来的威胁时立于不败之地。"
  kuat_eternal_legacy_bearer:0 "§E永恒遗产承载者§!"
  kuat_eternal_legacy_bearer_desc:0 "我们承载着永恒帝国的遗产前行，从扎库尔的覆灭中汲取教训，从他们的智慧中获取力量。我们不仅仅是银河系中的一个文明——我们是古往今来所有智慧结晶的传承者，是银河系复兴的灯塔。"
  ### Event .14 — 永恒回归觉醒入口 ###
  Kuat_non_legacy.14.name:0 "§E永恒回归§!"
  Kuat_non_legacy.14.desc:0 "来自扎库尔星球表面的全息仪数据已被我们的科研团队进行了初步的归类与整理。然而，在整理的进程中，我们的研究人员意外地发现这些数据深处隐含着一层此前未被注意到的加密子层——一个处于休眠状态的决策矩阵，它似乎在等待着某种特定的触发条件。\n\n当我们的[leader.GetName]将全息仪中残留的快子共振碎片注入该矩阵时，整个档案系统仿佛从漫长沉睡中苏醒，无数的数据流如星河般倾泻而出。加密层展开了三条截然不同的路径，每一条都通往不同的未来。\n\n扎库尔帝国——那个曾自诩永恒的文明——虽已湮灭在历史的尘埃中，但他们的遗产依然在黑暗中低语，等待着后来者做出抉择。"
  Kuat_non_legacy.14.a:0 "§E解密档案数据§!"
  Kuat_non_legacy.14.a.tooltip:0 "扎库尔档案中的加密数据层蕴含着难以估量的知识财富。派遣我们最优秀的密码学家，揭开尘封数十万年的秘密。§G启动特殊计划：解密扎库尔档案数据§!"
  Kuat_non_legacy.14.b:0 "§H研究扎库尔意识体§!"
  Kuat_non_legacy.14.b.tooltip:0 "档案中检测到了一种微弱的神经信号模式——这些是扎库尔帝国遗留的守护意识。研究他们或许是打开联盟之门的钥匙。§G启动局势：扎库尔意识体研究§!"
  Kuat_non_legacy.14.c:0 "§R准备战争§!"
  Kuat_non_legacy.14.c.tooltip:0 "扎库尔档案中对永恒舰队战争能力的描述令人毛骨悚然。既然冲突不可避免，我们必须抢在敌人之前做好一切准备。"
  ### Event .15 — 档案路线：缓存位置 ###
  Kuat_non_legacy.15.name:0 "§E缓存之所在§!"
  Kuat_non_legacy.15.desc:0 "经过数月艰苦卓绝的密码分析工作，我们终于突破了扎库尔加密层的最后一道防线。解密后的数据如同一幅尘封已久的星图缓缓展开在我们眼前，其精度之高令人叹为观止。\n\n数据揭示了扎库尔帝国在最终覆灭前夕所保留的战略武器缓存。然而，数十万年的岁月侵蚀使得缓存的状况成谜。组织研究人员进行探测和回收是当务之急。"
  Kuat_non_legacy.15.a:0 "很好。"
  Kuat_non_legacy.15.a.tooltip:0 "§G启动特殊计划：回收扎库尔武器缓存§!"
  ### Event .16 — 档案路线：扎库尔之心 ###
  Kuat_non_legacy.16.name:0 "§E扎库尔之心§!"
  Kuat_non_legacy.16.desc:0 "回收队不负众望。他们在贫瘠星球的深层岩床下发现了远超预期的宝藏——扎库尔人不仅仅留下了武器，更留下了一颗令所有研究人员瞠目结舌的水晶文物。\n\n这颗水晶的分子结构完全颠覆了我们对物质科学的认知。其内部以一种不可思议的方式层层嵌套着扎库尔文明的全部知识——从他们的历史、哲学、科技，到军事理论、星球改造技术，乃至他们对原力本质的终极理解。这绝非普通的储存设备，它是扎库尔帝国文明精华的结晶，是他们留给后世的最后遗产。"
  Kuat_non_legacy.16.a:0 "§H保护这份遗产§!"
  Kuat_non_legacy.16.a.tooltip:0 "扎库尔档案核心已被妥善保护并纳入帝国收藏。§G获得遗物：扎库尔档案核心§!"
  ### Event .17 — 档案路线：遗言 ###
  Kuat_non_legacy.17.name:0 "§E遗嘱§!"
  Kuat_non_legacy.17.desc:0 "在对扎库尔档案核心进行深度扫描的过程中，我们的研究人员在水晶最深层——一个近乎于量子态的储存层中——发现了一段被特别标注为"最后之言"的全息记录。\n\n影像缓缓浮现，一位身着华贵长袍的老者面容疲惫却目光如炬。他的声音在数十万年的时光洗礼后依然清晰——这是扎库尔帝国的祭司，一个在帝国灰飞烟灭前夕仍试图为后世留下火种的人。\n\n'致后来的发现者：当你读到这段话时，我们扎库尔帝国或许早已化为传说中的尘埃。但请听我说——永恒舰队的力量远超你们的想象，而拉卡塔残余与银河帝国的威胁也同样如此。不要重蹈我们的覆辙。我们曾傲慢地以为可以独占永恒舰队的力量，可以凭借一己之力屹立于银河之巅。这份傲慢便是我们覆灭的根源。'\n\n'你们不必成为第二个扎库尔。但你们必须记住：在银河深处，有些力量远远凌驾于一切文明之上。我们将毕生所悟凝聚在这颗水晶中——愿它能照亮你们前行的道路，而非成为你们的枷锁。"\n\n"帝国虽灭，智慧永存。这便是我们最后的馈赠。'"
  Kuat_non_legacy.17.a:0 "§E铭记他们的遗产§!"
  Kuat_non_legacy.17.a.tooltip:0 "扎库尔祭司的遗嘱将永远铭刻在我们的文明之中。§G获得永久修正：古人之智§!"
  ### Event .20 — 联盟路线：契约缔结 ###
  Kuat_non_legacy.20.name:0 "§E契约缔结§!"
  Kuat_non_legacy.20.desc_aggressive:0 "我们的神经覆写协议成功穿透了扎库尔意识体的防御矩阵。这场战斗是残酷的——意识体在崩溃的边缘爆发出了前所未有的抵抗，古老的精神力量如同狂风暴雨般冲击着我们的入侵者。然而，凭借从扎库尔档案中获得的密钥，我们最终将他们的神经模式完全解构。\n\n现在，扎库尔意识体的全部知识如潮水般涌入我们的研究数据库。数以万计的战术协议、科技蓝图、原力操纵技术——数十万年的文明积累在一瞬间成为我们的囊中之物。\n\n这不是联盟，这是征服。扎库尔意识体在我们的控制下低语着古老的痛苦，而我们将他们的恐惧转化为力量。这是否道德？或许不是。但在这个残酷的银河中，生存比道德更为重要。"
  Kuat_non_legacy.20.desc_cautious:0 "我们选择了最为审慎的道路——一步一步地接近扎库尔意识体，每一次接触都经过精心设计，每一步都在确保不会触犯他们的禁忌。这是一场漫长而耐心的博弈。\n\n数月的谨慎外交终于结出了硕果。扎库尔意识体——那些沉睡了数十万年的古老守护者——终于认可了我们的诚意。他们缓缓敞开了心防，分享了一部分古老的知识。这些知识虽不如激进路线那般全面，却胜在可靠且经过验证。\n\n这是一场以信任为基础的双向交易。扎库尔意识体获得了外界的信息与新的希望，而我们获得了他们最宝贵的智慧结晶。这便是耐心的回报——稳定的、可持续的利益。"
  Kuat_non_legacy.20.desc_cooperative:0 "我们的科研团队在扎库尔意识体研究中取得了突破性进展，但真正的转折点并非来自科技——而是来自真诚。\n\n一位年轻的语言学家在与意识体的日常交流中发现，这些古老的存在并非冰冷的数据集合，而是有着深沉情感的知性生命。他们渴望被理解，渴望在漫长的孤独中找到同伴。当我们将这一发现上报后，整个研究方向发生了根本性的转变——我们不再将扎库尔意识体视为研究对象，而是视为盟友。\n\n这份真诚感动了意识体的最深层记忆。他们做出了一个出乎所有人意料的承诺——当永恒舰队的阴影再度笼罩银河时，扎库尔的守护者将派遣他们残存的战斗单位前来支援我们的防御。\n\n这不是利益交换，这是两个文明跨越数十万年的共鸣。在这个充满背叛与毁灭的银河中，这份真诚的契约弥足珍贵。"
  Kuat_non_legacy.20.a:0 "§E缔结契约§!"
  Kuat_non_legacy.20.a.tooltip:0 "所选路线将决定帝国与扎库尔文明之间的未来关系。请谨慎选择。"
  ### 特殊计划 ###
  kuat_zakuul_archive_decrypt:0 "§E解密扎库尔档案数据§!"
  kuat_zakuul_archive_decrypt_desc:0 "从古代扎库尔设施中回收的加密数据层蕴含着难以估量的知识。这些数据的加密方式完全不同于我们已知的任何密码学体系——它似乎基于一种将快子共振频率作为密钥的量子态编码技术。\n\n部署帝国最优秀的密码分析团队，对这些尘封数十万年的秘密展开系统性解密工作。解开这些数据，或许就能找到扎库尔帝国隐藏战略储备的位置。"
  kuat_zakuul_cache_retrieval:0 "§E回收扎库尔武器缓存§!"
  kuat_zakuul_cache_retrieval_desc:0 "解密后的扎库尔档案数据指向一颗位于银河边缘的贫瘠星球——那里隐藏着扎库尔帝国在覆灭前夕建造的战略武器缓存。文献记载这些缓存包含大量先进的武器系统和舰船部件。\n\n派遣建设飞船前往该坐标，在贫瘠星球的深层岩床中进行系统性挖掘和回收工作。但请注意——数十万年的地壳运动和未知的守护系统可能使这项任务充满风险。"
  ### 局势 ###
  sit_zakuul_consciousness:0 "§H扎库尔意识体研究§!"
  sit_zakuul_consciousness_desc:0 "对古代扎库尔档案中检测到的休眠神经信号模式进行系统性研究。这些信号似乎源自扎库尔帝国覆灭时被封存的守护意识——它们在黑暗中沉睡了数十万年，等待着被唤醒的那一刻。\n\n理解这些意识体的神经模式结构、运行逻辑以及它们与原力的深层联系，或许能够打开通往联盟的大门。但研究过程充满未知——这些古老的意识究竟对我们怀有善意，还是将我们视为又一个需要被消灭的威胁？"
  ### 遗物 ###
  r_zakuul_archive_core:0 "§E扎库尔档案核心§!"
  r_zakuul_archive_core_desc:0 "一颗密度非凡的水晶数据存储设备，其分子结构以一种超越当代科学理解的方式层层嵌套，保存着扎库尔文明全部知识的精华。\n\n它的激活脉动着千年积累智慧的韵律，仿佛一个沉睡了数十万年的文明正在通过这颗水晶向外界低语。触碰它的人能感受到一种奇特的共鸣——那是无数代扎库尔学者智慧的回响，跨越时间的长河，只为等待一个值得聆听的人。"
  kuat_relic_zakuul_archive_core_triumph: "启动期间，获得$relic_zakuul_archive_core_active$修正"
  ### 修正 ###
  kuat_archive_path_wisdom:0 "§E古人之智§!"
  kuat_archive_path_wisdom_desc:0 "扎库尔祭司的遗嘱赋予了对宇宙本质的深刻洞察。这份跨越数十万年的智慧馈赠，如同在黑暗中点亮的一盏明灯，指引着我们文明的前行方向。"
  kuat_cautious_alliance_bonus:0 "§G谨慎联盟之益§!"
  kuat_cautious_alliance_bonus_desc:0 "与扎库尔意识体的细致外交接触带来了稳定可靠的利益。这份以信任为基石的关系，为我们提供了源源不断的古老智慧。"
  sit_zakuul_consciousness_type:0 "扎库尔意识体"
  sit_zakuul_consciousness_monthly_change_tooltip:0 "每月意识体研究进度取决于所选方案。"
  ### 局势方案 ###
  sit_zakuul_approach_aggressive:0 "激进提取"
  sit_zakuul_approach_cautious:0 "谨慎接触"
  sit_zakuul_approach_cooperative:0 "深度合作"
  sit_zakuul_consciousness_complete:0 "扎库尔意识体研究已经完成。结果取决于我们所选择的方案。"
  sit_zakuul_approach_aggressive_tooltip:0 "使用侵入性神经协议从扎库尔意识体中强行提取知识。高风险，高回报——但意识体将在过程中受到损伤。"
  sit_zakuul_approach_cautious_tooltip:0 "通过谨慎而有节制的对话与扎库尔意识体接触。缓慢但稳定——信任需要时间来建立。"
  sit_zakuul_approach_cooperative_tooltip:0 "通过真诚的共情和相互理解与扎库尔意识体建立深厚的纽带。最漫长的道路，但可能收获最大。"
  sit_zakuul_progress_hostile_reaction:0 "敌对反应——意识体抗拒我们的激进手段，进度减缓。"
  sit_zakuul_progress_friendly_reaction:0 "友善反应——意识体对我们的合作方式作出积极回应，进度加快。"
  stage_unknown_effects:0 "随着局势推进，更多效果将被揭示。"
  ### 局势事件：阶段进入 ###
  kuat_situation.100.name:0 "初次接触协议"
  kuat_situation.100.desc:0 "我们的神经接口团队已经与休眠的扎库尔意识体建立了第一条稳定的通讯通道。该实体的回应是碎片化的——断断续续的快子编码数据包，我们的外星语言学家正在昼夜不停地进行解码。\n\n初步读数表明，这个意识体并非单一智慧，而是一个集体——数千个独立的神经模式融合为一个庞大的分布式网络。它感到困惑、迷失方向，并对我们的存在保持着警惕。\n\n我们必须谨慎行事。这是未来一切互动的基石。"
  kuat_situation.100.A:0 "小心行事"
  ### 局势事件：第二阶段 ###
  kuat_situation.101.name:0 "神经对接"
  kuat_situation.101.desc:0 "突破。经过数周的耐心校准，我们的神经接口专家终于与扎库尔意识体建立了稳定的双向连接。\n\n这次体验……令人难以承受。参与初次对接的人员将其描述为站在一座充满低语的大教堂中央——每一声低语都是一段数千年前生活的碎片。记忆、情感、知识——所有的一切如洪流般涌来，几乎压垮了分析人员的认知过滤器。\n\n意识体现在察觉到了我们。不是作为入侵者，而是作为……某种别的存在。它正在评估我们，用一个早已灭亡的文明设定的标准来衡量我们的资格。"
  kuat_situation.101.A:0 "加深连接"
  ### 局势事件：第三阶段 ###
  kuat_situation.102.name:0 "最终协议"
  kuat_situation.102.desc:0 "意识体已经做出了决定。\n\n经过数月的谨慎互动，守护者集体——扎库尔意识体对自己的称呼——向我们敞开了最深层的档案。一层又一层的古老知识如水晶花瓣般绽放，每一层都揭示着挑战我们宇宙认知的技术和哲学。\n\n但这份礼物伴随着一个问题——一个集体向它接触过的每一个文明都提出过的问题：\"你们将如何使用这份力量？\"\n\n我们给出的答案将决定我们与扎库尔文明最后回响之间的关系性质。"
  kuat_situation.102.A:0 "我们已准备好作答"
  ### 局势事件：月度随机 ###
  kuat_situation.103.name:0 "敌对共振"
  kuat_situation.103.desc:0 "意识体对我们最新的探测尝试做出了消极反应。警告脉冲在神经接口中回荡，我们的外星灵能者报告称敌对的精神反馈急剧增加。\n\n实体的防御机制正在启动——并非出于恶意，而是出于自我保护。我们可能逼得太紧、太急了。"
  kuat_situation.103.A:0 "降低压力"
  kuat_situation.103.B:0 "继续加强"
  ### 局势事件：月度随机 ###
  kuat_situation.104.name:0 "校准交换"
  kuat_situation.104.desc:0 "我们有节制的方式继续取得成效。意识体又分享了一层档案知识——这次聚焦于扎库尔人数千年来发展出的农业和生态管理技术。\n\n我们的研究人员正在仔细整理这些数据，将其与现有的科学框架进行交叉验证。交流虽然缓慢，但每一条知识都经过验证，可靠而扎实。"
  kuat_situation.104.A:0 "继续对话"
  ### 局势事件：月度随机 ###
  kuat_situation.105.name:0 "共情共鸣"
  kuat_situation.105.desc:0 "在今天的神经接口会话中发生了意义深远的事情。一位年轻的研究人员在例行数据交换中无意间分享了一段个人记忆——母星殖民地在一场自然灾害中的毁灭。\n\n意识体回应的不是数据，而是悲伤。一股共情的悲痛涌过接口——集体想起了自己的损失，想起了自己文明的覆灭。在那短暂而非凡的一刻，两个文明通过知识之外的东西连接了起来——共同的苦难。\n\n纽带已无可估量地加深了。"
  kuat_situation.105.A:0 "拥抱这份联系"
  ### 局势事件：完成 ###
  kuat_situation.106.name:0 "知识夺取"
  kuat_situation.106.desc:0 "提取完成了。我们的神经覆写协议成功破解了扎库尔意识体最深层的数据，获得了大量战术方案、工程蓝图和战略条令。\n\n意识体已被……削弱了。它的传输信号，曾经温暖而好奇，如今已冷却为枯燥的数据流。它仍在运转，但生命的火花——一个文明集体记忆的灵魂——已被我们的侵入手段所磨灭。\n\n我们得到了想要的。代价是一段永远无法修复的历史。"
  kuat_situation.106.A:0 "知识值得这个代价"
  ### 局势事件：完成 ###
  kuat_situation.107.name:0 "联盟缔结"
  kuat_situation.107.desc:0 "耐心获得了超越预期的回报。扎库尔意识体在经过数月谨慎对话后对我们文明的评估终于完成，它向我们开放了持续获取其精选知识库的权限。\n\n这不是强行提取的爆炸式揭示，而是更可持续的东西——经过验证的知识流，按照我们的吸收能力精心校准，建立在相互尊重的关系之上。\n\n意识体表达了我们的外星语言学家解读为希望的东西——希望我们能在扎库尔失败的地方取得成功。"
  kuat_situation.107.A:0 "我们不会辜负这份信任"
  ### 局势事件：完成 ###
  kuat_situation.108.name:0 "守护者契约"
  kuat_situation.108.desc:0 "纽带已经完成。通过数月的真诚连接——分享的不仅仅是数据，还有经历、情感和理解——我们做到了扎库尔帝国覆灭以来没有任何文明能够做到的事。\n\n守护者集体已经接纳我们作为他们遗产的继承者。散布在银河系各处隐藏设施中的休眠永恒舰队的激活代码，已经传输到我们的舰队指挥系统。当黑暗再度降临时，守护者将与我们并肩作战。\n\n我们不仅仅是缔结了一份联盟。我们被一个等待了五万年的大家庭所欢迎。"
  kuat_situation.108.A:0 "我们深感荣幸"

  kuat_situation.100.B:0 "谨慎靠近，先观察再说。"
  kuat_situation.101.B:0 "维持信息屏障。"
  kuat_situation.104.B:0 "深入探索意识网络。"
  kuat_situation.105.B:0 "允许有限访问，研究其入侵方式。"

