l_simp_chinese:
  origin_post_apocalyptic_kuat:0 "§E【夸特的黎明】后启示录§!"
  origin_post_apocalyptic_kuat_desc:0 "这是一颗位于边缘世界之外的平凡行星，曾是一个已覆灭的繁荣文明的发源地——他们赖以生存的环境造就了其战胜$Name_kuat$的力量。而现在，$Name_Kuat_Fire_base$取代了我们的位置，他们篡夺了永恒舰队，篡夺了帝国的权势，更篡夺了帝国的荣耀。夸特造船厂尚且能以企业的身份留在银河帝国，而我们这些来自$Name_kuat$的丧家之犬却只能在偏远之地惶惶不可终日。\n\n不，这不是我们应有的结局！我们必将让$Name_kuat$重回昔日的巅峰，为那些该死的战争机器奏响最后的葬曲，而银河帝国的荣耀也终将被我们亲手夺回！"
  origin_tooltip_post_apocalyptic_kuat_effects:0 "§H我们将作为夸特帝国开始这场游戏§!\n将以§E固定三星星系§!开局\n该开局星系内拥有$think_tank_ruined$、$dyson_sphere_ruined$与$matter_decompressor_ruined$§!\n§R我们将失去所有初始舰队，并成为$Name_Kuat_Post_Support$的附庸§!\n\n该起源属于《夸特的黎明》剧情后传。"
  Name_Post_Kuat_capital: "遗落之都"
  Name_Post_Kuat_System: "未知星域"
  Name_Kuat_Post_Support: "§E索伦星际舰队§!"

  kuat_post_apocalyptic_legacy.1.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.1.desc:0 "尊敬的总督大人，我们终于抵达了$Name_Post_Kuat_capital$，如今这里便是我们未来的根基。$Name_kuat$的遭遇已成定局，但我们不能一味沉湎于过去。\n\n我们的错误决策被$Name_Kuat_Fire_base$所利用，一步错、步步错，致使整个$Name_kuat$被拖入万丈深渊。尽管造船厂得以保留，却已被$Name_Kuat_Fire_base$强行收归国有，不再听从我们的号令，银河帝国的议会中也已不再有我们的一席之地。\n\n但请您切勿放弃，$Name_kuat$的未来依然掌握在我们自己手中。上一任总督早已从未知星域寻获了一些线索，不仅精准预言了我们如今的处境，更指明了日后夺回一切的道路。现在，我们的最后一支舰队已经抵达预言中的星系，只要进一步找回在先前行动中遗落的技术，我们便能重新与$Name_Kuat_Fire_base$分庭抗礼，夺回我们应有的地位！"
  kuat_post_apocalyptic_legacy.1.a:0 "夺回我们的荣耀！"

  kuat_post_apocalyptic_legacy.2.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.2.0.desc:0 "$Name_Kuat_Post_Support$舰队司令很高兴为您效劳，有什么需要我们协助的吗？"
  kuat_post_apocalyptic_legacy.2.1.desc:0 "$Name_Kuat_Post_Support$舰队司令很高兴为您效劳，还有什么需要了解的吗？"
  kuat_post_apocalyptic_legacy.2.a:0 "你们隶属于哪个部门？为什么我毫无印象？"
  kuat_post_apocalyptic_legacy.2.a.res:0 "$Name_Kuat_Post_Support$是$Name_kuat$秘密组建的一支小规模舰队，旨在作为预言局面成真时的最后底牌。我们的职责便是护送您抵达这片曾被我方舰队蹂躏的星系。此前局势尚算平稳，我们自然不会出现在您面前。这片星域中隐藏着$Name_kuat$复兴的关键，我们需要您追回这些注定属于$Name_kuat$的遗产。"
  kuat_post_apocalyptic_legacy.2.b:0 "为什么选中我？前任总督去哪了？"
  kuat_post_apocalyptic_legacy.2.b.res:0 "这是命运的指引。$Name_kuat$的漫长黑夜将在您的带领下终结，黎明的曙光即将降临。前任总督们对此一无所知，他们不过是委员会推出来的权力代言人。\n\n如今旧的$Name_kuat$已然崩溃，他们也该随过去的$Name_kuat$一同坠入深渊。银河帝国已被$Name_Kuat_Fire_base$窃取，而真正的$Name_kuat$将在此浴火重生。我们期盼着真正的银河帝国重建的那一天。"
  kuat_post_apocalyptic_legacy.2.c:0 "预言？什么预言？"
  kuat_post_apocalyptic_legacy.2.c.res:0 "前任总督不甘屈从于既定的命运，更不甘于$Name_kuat$受人摆布的现状，因而派遣我们深入未知星域，寻求破局之法。\n\n我们在一片广袤的未知星域中发现了这一线索：统治该星域的恩多迪亚帝国利用其独特的数理推演，预言了我们未来的覆灭。于是我们顺应这一预言，无论对方是否情愿，彻底毁灭了恩多迪亚帝国。当旧的$Name_kuat$走向毁灭之后，真正的$Name_kuat$便会破茧而出，夺取我们昔日无法染指的一切。"
  kuat_post_apocalyptic_legacy.2.d:0 "那我们究竟要找些什么？古代技术吗？"
  kuat_post_apocalyptic_legacy.2.d.res:0 "或许是古代技术，也可能是我们自身遗落的技术。预言对此着墨不多，我们唯一能确定的是，必须找到恩多迪亚帝国遗址深处真正掩埋的瑰宝，并借此找回与改良我们的技术。\n\n我只能护送您抵达此处。目前我们缺乏足够的技术人员与物资储备，暂时无法重建主力舰船，但好在这片星域还能制造一些简易的舰艇。"
  kuat_post_apocalyptic_legacy.2.e:0 "为什么$Name_kuat$这么快就崩溃了？"
  kuat_post_apocalyptic_legacy.2.e.res:0 "追根溯源，或许是因为预言在高层内部的流传。尽管委员会的委员们口头上对此嗤之以鼻，但内心却因此愈发疯狂。在委员会的操纵下，$Name_kuat$借研究那些无用战争机器之名，以极端暴力的手段寻找破解预言的方法。\n\n正是这一鲁莽行径，使我们接连毁灭了恩多迪亚帝国与诸多无辜文明，并招致了有史以来最强大的劲敌——永恒帝国。他们摧毁了我们引以为傲的舰队，反而让$Name_Kuat_Fire_base$坐收渔翁之利。\n\n$Name_Kuat_Fire_base$表面上与我们和平共处，暗地里却借机落井下石，一举夺走了议会中属于我们的席位，并将我们的造船厂强行收归国有，彻底动摇了我们的根基。\n\n但无论如何，$Name_kuat$的复兴势不可挡。帝国万岁！"
  kuat_post_apocalyptic_legacy.2.f:0 "永恒帝国的$Name_Eternal_Support$是怎么回事？"
  kuat_post_apocalyptic_legacy.2.f.res:0 "这的确颇为耐人寻味。根据我们的记载，$Name_Eternal_Support$曾是永恒舰队的战争机器，后来似乎在永恒帝国时期脱离了永恒舰队的控制。但我们的档案中却查不到究竟是谁使她成功脱离永恒舰队、并变成如今这副模样的。或许这一疑问对$Name_Eternal_Support$而言同样痛苦万分，她一直在追寻一个可望而不可即的幻影。\n\n但无论如何，$Name_Eternal_Support$的计划符合我们的利益。"

  kuat_post_apocalyptic_legacy.3.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.3.desc:0 "预言果然无误，您以最快的速度找到了恩多迪亚帝国一处重要遗迹的线索。这片星域曾是我们与恩多迪亚帝国交战的核心战场之一，我们在此投入了多支主力舰队，并彻底终结了恩多迪亚对永恒堡垒的研发。\n\n如今，恩多迪亚帝国的遗迹或许已被诸多文明光顾过，但远未被彻底发掘。那些愚昧的文明根本不知道遗迹深处才藏着真正的秘密——就连我们，也是在当年的战争中借助探测器才偶然发现的。\n\n在这片区域，恩多迪亚人修筑了多层复合结构，试图封存他们逆向解析的研究成果，为日后卷土重来做好准备。无论如何，如今这一切都便宜了我们。"
  kuat_post_apocalyptic_legacy.3.a:0 "非常好"
  kuat_post_apocalyptic_legacy_3_find_A_facility:0 "§E定位$Name_A_1$坐标§!"
  kuat_post_apocalyptic_legacy_3_find_A_facility_DESC: "$Name_A_1$曾是恩多迪亚帝国的重要军事设施，他们在这片星区建立了大量军事研究所，试图在此复刻我们的舰船技术。在我们与恩多迪亚帝国的战争中，这片星区被彻底摧毁；而恩多迪亚人在星域深处埋藏了他们东山再起的希望，如今这却成为了我们卷土重来的筹码。"

  kuat_post_apocalyptic_legacy.4.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.4.desc:0 "我们的研究人员已经完成了对$Name_A_1$星系的定位工作，现在只需率舰进入这片星区。恩多迪亚人或许做梦也没想到，他们埋藏的希望最终竟为他人做了嫁衣。"
  kuat_post_apocalyptic_legacy.4.a:0 "非常好，舰队做好准备。"

  kuat_legacy.21.kuat_post_apocalyptic_legacy.desc: "我们抵达了目标星系。正如$Name_Kuat_Post_Support$所言，这片星系到处漂浮着大战过后的残骸。尽管那些帝国级重型巡洋舰早已面目全非，但我们依然能感受到当年战况的惨烈。\n\n此外，迹象表明已有多个文明的勘探队曾造访过这片星区，只希望属于我们的东西尚未被人夺走。传令搜查整个星环，哪怕掘地三尺，也要把恩多迪亚人隐藏的秘密统统找出来！"

  kuat_legacy.22.kuat_post_apocalyptic_legacy.desc:0 "总体来看，$Name_A_1$受损极为严重，看来当年我们对恩多迪亚帝国的核心星区造成了毁灭性的打击。然而结合历史档案与眼前的观测结果来看，$Name_A_1$的恒星本不该坍缩为一颗巨大的黑洞——或许在我们离开之后，这里又发生过某些变故。"

  kuat_legacy.23.kuat_post_apocalyptic_legacy.desc: "正如$Name_Kuat_Post_Support$所料，这座陷落的要塞被巨大的舰船残骸与建筑废墟所笼罩。当年整个星环曾被恩多迪亚帝国改造为抵抗我们的坚固堡垒，却依旧未能阻挡我们强大的舰队。\n\n在这片废墟之上，我们发现了部分临时搭建的居住设施，从年代来看应属于此前来访的其他文明勘探队。看来这里的表层结构已被搜刮一空，我们应当转向更深层的区域展开搜寻。"

  kuat_legacy.24.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]在这片废墟中的调查陷入了僵局。我们发现了多个文明勘探队来访的痕迹，甚至包括一个曾被我们毁灭的帝国——他们的勘探队也曾踏足此处，或许正是他们从这里带走了部分我们遗落的技术。\n\n此外，我们还发现了一座用于传输影像的设备。在截取并解析其中的录像数据后，我们发现那竟是昔日恩多迪亚人留下的警示，字里行间充满了对自身野心与妄为的悔恨与自责。\n\n真是讽刺，这些普通的恩多迪亚民众似乎对真相一无所知。$Name_Kuat_Post_Support$的资料库显示，恩多迪亚高层早已在推演我们未来的预言时窥见了自身的覆灭，为了规避注定的宿命才主动挑起了这场战争，没想到其底层民众竟一直被蒙在鼓里。\n\n目前，[leader.GetName]尚未找到其他更有价值的信息。"

  kuat_legacy.25.kuat_post_apocalyptic_legacy.desc:0 "这些恩多迪亚人藏东西可真够深的。[leader.GetName]在多轮勘探无果后，竟在一处陡峭峡谷的崖壁上发现了部分恩多迪亚军用机器人的残骸，为我们指明了方向。\n\n我们在山崖内部找到了一处秘密研究设施。幸运的是，这里的仪器尚能运转；完成数据解密后，[leader.GetName]惊喜地发现，其中的线索指向了另一处更为隐秘的研究设施。\n\n该设施主要致力于逆向解析我方的轻型巡洋舰系统，且研究进度已相当完善——或许只要恩多迪亚人重新接管这个星系，就能直接仿制出我们强大的战舰。除此之外，这座要塞中有价值的信息所剩不多，但我们还是顺利收回了跃迁技术与星门穿越技术。"

  kuat_post_apocalyptic_legacy.5.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.5.desc:0 "您的效率真是令人惊叹，这么快就完成了对$Name_A_1$的初步调查。正如您所见，恩多迪亚人曾在此与我们的舰队爆发过一场惨烈的交锋，但最终是我们赢得了战争的胜利。\n\n这场战争本可避免，但贪婪的委员们不甘心接受帝国的既定结局，他们的疯狂举动也被恩多迪亚帝国所预见；而在$Name_Kuat_Fire_base$的暗中蛊惑以及对宿命的不甘驱使下，恩多迪亚帝国最终引爆了这场全面冲突，落得如此下场。\n\n这些恩多迪亚人收集了我们的小型舰船技术，这对当下的我们而言大有裨益，也算他们死得其所——不过您似乎尚未找到核心库藏。无论如何，现在我们已确认$Name_B_1$的星图坐标，是时候动身前往那里了。"
  kuat_post_apocalyptic_legacy.5.a:0 "好的。"

  kuat_legacy.50.kuat_post_apocalyptic_legacy.desc: "我们抵达了目标星系。正如$Name_Kuat_Post_Support$所言，这片星系同样遍布着惨烈大战后的残骸，但受损程度并未像$Name_A_1$那样严重。相较于$Name_A_1$的环带而言，这片星区的环带保留了一定的完整性，或许有助于我们展开进一步调查。\n\n此外，$Name_Kuat_Post_Support$还为我们提供了关于该星系的更多重要情报：这里曾是恩多迪亚帝国的舰船武器研究中心，主要负责逆向解析我们的主力舰技术。考虑到$Name_A_1$中护航舰技术的逆向完成度已相当之高，我们或许能在这里直接取回遗落的主力舰设计蓝图。"

  kuat_legacy.51.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]率领科研团队进入了星环结构的轨道，俯瞰下方一望无际的建筑废墟——这一切皆是当年$Name_kuat$舰队的手笔。在那场惨烈的战争中，恩多迪亚人倾尽了一切可用于抵抗的武器，却依然没能阻止我方舰队兵临星环上空。自那一天起，城市崩塌、星环破碎，最终沦为如今这副模样。\n\n尽管这座星环结构已彻底化作废墟，但[leader.GetName]判断，这里应当与$Name_A_1$一样隐藏着不为人知的秘密设施，值得我们进一步深入搜寻。"

  kuat_legacy.52.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]在星环结构上的调查一时陷入了僵局。关键时刻，$Name_Kuat_Post_Support$为我们传来了高价值的情报：$Name_Kuat_Post_Support$过去在调查这类结构时发现，恩多迪亚的研究设施周边必定部署有特定频段的信号收发器，会释放出极其微弱而独特的辐射。我们可以借助精密仪器顺藤摸瓜，追寻这一线索。"

  kuat_legacy.53.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]很快发现，并非只有我们掌握了这一方法——此前到访的多支勘探队同样利用这一线索展开过搜寻。根据$Name_Kuat_Post_Support$的历史记录，曾有多个文明在此取得了意想不到的收获，其中便包括击败$Name_kuat$的永恒帝国。\n\n这让勘探队员们心中不禁一沉：莫非这里的遗迹早已被搜刮殆尽？我们仍需作进一步调查。"

  kuat_legacy.54.kuat_post_apocalyptic_legacy.desc: "在沉闷的气氛中，[leader.GetName]率领团队找到了这座星环遗迹的控制中心废墟。尽管这里已被轰炸得面目全非，却依然能让人想见这座星环心脏昔日的宏伟。\n\n[leader.GetName]进入内部后发现，整个控制中心的设备均已彻底停摆；然而在这些报废设备中，有一台AI设备的停机时间与其他设备截然不同。[leader.GetName]决定提取并解析该AI设备中的数据，或许能从中找到我们想要的情报。"

  kuat_legacy.55.kuat_post_apocalyptic_legacy.desc: "在随后的一段时间里，[leader.GetName]成功对该AI设备的数据进行了采样与转录分析。结果显示，这台AI曾在千年前向永恒帝国的探险者传递过重要情报，告知他们控制中心内藏有恩多迪亚遗留的舰船技术；而残留的图像表明，那正是我方的主力舰技术——恩多迪亚人当年竟早已成功逆向了我们的技术！\n\n这一事实实在令人难以接受，我们必须进一步搜寻更多有价值的情报。"

  kuat_legacy.56.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]怀着满腹狐疑，对整个控制中心的有效数据进行了关联分析，[leader.GetName]由此发现了一个令人震惊的事实：恩多迪亚人特意留下了一段影像，主动指引包括永恒帝国在内的外来者取走我们的科技蓝图，并暗中警告称，正有一双眼睛在暗处监视着他们。\n\n[leader.GetName]认为，这一警告指的或许并非我们——彼时$Name_kuat$正全力对永恒舰队展开军事行动，根本无暇顾及这些土著的一举一动；这更可能是在暗指$Name_Kuat_Fire_base$。无论如何，我们都需要收集更多情报。"

  kuat_lagacy.74.kuat_post_apocalyptic_legacy.desc: "与$Name_A_1$类似，我们的研究人员在对整个星区进行周期性勘探时，于一处损毁的星环带中发现了有价值的线索：那里坐落着一座先驱城市，其设施当年曾被我方舰队彻底摧毁，如今部分建筑竟奇迹般地得到了修复。\n\n研究人员认为，这里曾被其他势力的勘探队调查过，其中或许隐藏着高价值的线索，因此我们也必须对该处展开全方位调查。"

  kuat_lagacy.251.kuat_post_apocalyptic_legacy.desc:0 "我们的研究人员一直在对$Name_A_1$进行不间断的勘探。功夫不负有心人，我们终于顺着此前在山崖中发现的线索，找到了那座隐秘研究设施的所在地。\n\n这座研究设施位于环带的另一侧，同样在当年的战争中被摧毁殆尽。如今我们需要重返这座环带——与之前的区段相似，这段环带早已被我们炸成了一片废墟，整条环带上的人造设施无一完好。\n\n§Y但我们绝不能放过这里，必须对这片区域展开无死角的彻底搜查。§!"
  kuat_post_apocalyptic_kuat_eternal_starbase: "§E搜查$Name_A_1$§!"
  kuat_post_apocalyptic_kuat_eternal_starbase_DESC: "正如$Name_Kuat_Post_Support$所言，我们尚未找到恩多迪亚人藏匿在这片星区中的核心技术。他们在此埋藏了相当完善的技术资料，只为日后东山再起。然而他们所研究的一切本就属于我们，他们窃取的$Name_kuat$技术也该物归原主了。\n\n彻底搜查这里，任何角落都不要放过！"

  kuat_post_apocalyptic_kuat_eternal_ship: "§E勘探[ancient_shadow_place_B.GetName]§!"
  kuat_post_apocalyptic_kuat_eternal_ship_DESC:0 "我们的研究人员已经确认，[ancient_shadow_place_B.GetName]上发生的离奇修复现象，正是这片星域中我们尚未寻获的高价值线索之源。目前我们已经对这座曾被我方炸成废墟的先驱城市完成了全方位扫描。\n\n接下来，我们应当派遣地面调查队深入探查。"

  kuat_post_apocalyptic_legacy.6.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.6.desc:0 "我们由衷赞叹您的雄才大略——短短不到一个世纪，您便成功收回了大量遗落在恩多迪亚手中的技术。\n\n您带回的高价值情报对我们厘清预言的真相大有裨益：恩多迪亚人在预言中窥见了自身的结局，他们不惜以加速走向覆灭为代价，也要化作那只掀起风暴的蝴蝶。事实证明，命运并非一成不变，而您的出现，或许正是引领我们走向真正结局的钥匙。\n\n我们已经锁定了$Name_C_1$的坐标。出发吧，帝国永存！"
  kuat_post_apocalyptic_legacy.6.a:0 "命运吗？"

  kuat_post_apocalyptic_legacy.7.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.7.desc:0 "您的进展着实出乎意料，竟这么快就找到了恩多迪亚的隐秘遗迹。这座遗迹中封存着恩多迪亚当年窃取的我方技术储备——昔日我们或许对此不屑一顾，但如今，我们必须依靠这些储备来重建军事技术。\n\n待您完全重掌全部舰船技术之时，便是$Name_Kuat_Post_Support$再度随您出征之日。"
  kuat_post_apocalyptic_legacy.7.a:0 "帝国永存。"

  kuat_post_apocalyptic_legacy.8.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.8.desc:0 "依据我们此前收集的情报来看，这座星环的状态在恩多迪亚帝国覆灭后并未发生明显变化，这意味着我们将在此收获本就属于我们的一切。我们调查了历史上曾前来此处发掘的几个文明，发现他们仅仅带走了恩多迪亚的部分遗产。\n\n我们已确认被带走的是永恒堡垒的相关技术，对此或许还需作进一步调查；所幸他们并未发现恩多迪亚深藏的$Name_kuat$舰船技术。现在，是我们收回真正成果的时候了。"
  kuat_post_apocalyptic_legacy.8.a:0 "帝国永存。"

  kuat_legacy.181.kuat_post_apocalyptic_legacy.desc:0 "勘探人员在接到调查该星环遗迹的命令后，便立即全力投入工作。我们已经对整个星环周边的空间稳定性进行了详尽分析，确认据点区域处于相对安全的范围内。尽管整座星环都被当年轰炸后的废墟所覆盖，但我们依然成功找到了一些高价值的线索。\n\n研究人员发现这片废墟中存在着一股微弱的能量辐射，其特征与我们此前在山崖内的恩多迪亚实验室中所发现的信号仪器颇为相似。目前我们已着手对其展开深入调查。"
  kuat_legacy.181.b.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]接到指示后，率领团队搭乘轨道飞船接近了这片环带。此处的环带与我们先前在$Name_A_1$星域登陆的环带颇为相似，同样是一座由自动化设施构成的非宜居环带。从初步研究与地质勘探信息来看，这片被我们摧毁的区域曾是恩多迪亚帝国的一处军事科研与后勤补给设施。\n\n值得注意的是，该设施所在的区域在遭受$Name_kuat$轰炸后本已彻底化为废墟，如今竟奇迹般地自我修复了一部分，我们必须查明其中的缘由。"

  kuat_legacy.182.kuat_post_apocalyptic_legacy.desc: "令人欣慰的是，研究人员对这股微弱能量辐射的溯源工作进展十分顺利，我们很快便找到了恩多迪亚帝国研究设施的外围区域。\n\n沿途我们发现了多支外来文明勘探队留下的痕迹，不少人在遗留的记录中提到在此获得了意想不到的收获。这与$Name_Kuat_Post_Support$收集的情报不谋而合，看来我们寻回技术的行动正顺利推进。"
  kuat_legacy.182.b.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]通过对整座环带的监测，调取了其自遭受轰炸以来的变化数据：在这漫长的岁月里，废墟中的建筑竟一直在以极其缓慢的速度自我修复。这一违背熵增定律的现象使整座环带正变得愈发有序。\n\n这一反常现象引起了科研团队的高度关注，目前已着手对此展开深入调查。"

  kuat_legacy.183.kuat_post_apocalyptic_legacy.desc: "我们的研究人员发现，其他势力的勘探队均前往了一座高塔。勘探人员已确认那里曾是这座星环设施的指挥中心，但$Name_Kuat_Post_Support$传来的情报显示，我们要找的东西并不在那里。\n\n基于这一判断，研究人员另辟蹊径，在城市外围的一处自动化农业设施废墟中探测到了与此前极为相似的能量辐射。研究人员确信，只需顺着这条线索追查下去，就能找到那座隐藏的研究设施。"
  kuat_legacy.183.b.kuat_post_apocalyptic_legacy.desc: "经过相当长一段时间的调查，我们的研究人员终于查明了这些城市从无序缓慢恢复有序的原因——我们在城市废墟下方捕捉到了一处微弱的能量辐射信号。\n\n这股能量与我们曾见识过的光明面原力颇为相似，正在悄无声息地使整座城市恢复原貌。这也意味着，我们可以顺着这股能量的脉络，直抵这座环带的心脏。"

  kuat_legacy.184.kuat_post_apocalyptic_legacy.desc:0 "令人振奋的消息传来：我们的研究人员顺着相似的能量辐射特征，找到了一处大门紧闭的研究设施。经过分析确认，这里正是恩多迪亚深藏的秘密研究基地。\n\n然而，由于当年战争中遭受过猛烈的轨道轰炸，该设施的门禁控制系统已彻底瘫痪，我们必须另想办法进入内部。"
  kuat_legacy.184.b.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]依据此前的研究成果，顺利抵达了整座城市的中心。在城市遗迹的中央矗立着一座被轰炸震塌的尖塔，而这座尖塔正随着那股有序能量的流淌逐渐恢复往日的光泽，使我们不费吹灰之力便锁定了遗迹的核心。\n\n我们在尖塔西北角的承重柱旁发现了一处凹陷的结构，凹槽的轮廓似乎与恩多迪亚帝国的国徽图案相吻合。\n\n我们依据此前从遗迹中获取的纹章图案，就地取材，利用三维打印设备制作出了填补凹槽的构件。当[leader.GetName]将构件嵌入凹槽后，尖塔东南侧传来一阵沉重的轰鸣，紧闭的大门随之彻底敞开。\n\n现在，我们可以顺利进入遗迹的核心区域了。"

  kuat_legacy.185.kuat_post_apocalyptic_legacy.desc: "勘探人员利用涡轮炸药对设施外围进行了爆破清理，顺着开辟出的通道进入了设施内部，并在其中找到了一批恩多迪亚的研究档案。档案中主要列举了他们的攻关项目：\n§Y实验项目：高能涡轮压缩……成功\n实验项目：智能作战系统……成功\n实验项目：高能涡轮激光……成功§!\n\n从这些研究记录可以看出，恩多迪亚人当年已成功复现了我们的多项技术成果。现在，我们需要找到这些封存的成果并将其悉数收回。"
  kuat_legacy.185.b.kuat_post_apocalyptic_legacy.desc: "进入尖塔后，[leader.GetName]发现此前已有多支勘探队踏足过这里，但他们都未曾察觉整座尖塔的内部结构其实一直在发生改变。[leader.GetName]当机立断，决定直接动用爆破手段开辟道路——那股有序能量的源头或许正是我们要找的东西。\n\n[leader.GetName]的决策卓有成效，爆破手段简单高效地清除了尖塔内部的重重障碍，使科研团队得以直抵遗迹核心。[leader.GetName]在那里发现了一座庞大的计算核心，尽管目前看似受损严重，但仍有恢复运转的可能。"

  kuat_legacy.186.kuat_post_apocalyptic_legacy.desc: "我们的研究人员在搜寻其他资料时，发现了一段恩多迪亚人留下的影像记录：\n\n§Y“大人，遵照您的命令，整个星环的舰队均已准备就绪。\n\n§G“很好，传令其他几座要塞的守军也做好迎战准备。\n\n§G“大人，这样做真的有用吗？推演的结果已经注定了我们的结局，我们眼下的挣扎，又何尝不是在一步步迈向那个既定的未来？\n\n§Y“……那又如何？我们虽预知了未来，却无力逃避。不过好在我们很快便能解脱，而$Name_kuat$却将在黑暗中苦苦挣扎。终有一日，他们会重返此地——把这一切、把他们的技术，连同我们与他们共同的希望，统统留在这里。”"
  kuat_legacy.186.b.kuat_post_apocalyptic_legacy.desc:0 "计算核心恢复运转后，毫无征兆地对[leader.GetName]及其团队进行了扫描。所幸并未触发防御机制，计算核心随即向我们展示了历次来访勘探队的影像记录，我们竟在其中看到了永恒帝国勘探队的身影。\n\n随后，计算核心播放了一段恩多迪亚人的全息影像：\n\n§Y“你说，天命可以改变吗？\n\n§G“大人，这是无法改变的事实。无论您作何抉择，我们都在朝着天命注定的方向前行。\n\n§Y“照你这么说，我们岂非只是在无能狂怒、徒劳无功？不，我不这么认为。既然我们窥见了命运的结局，并因此改变了自身的行动——或许对我们自己而言，依然无法逃脱注定的覆灭；但我们却能借此播下一颗种子，它将在未来生根绽放，彻底驱散那场尚未降临的黑暗。\n\n§G“您是指$Name_kuat$吗？可他们在既定推演中的结局同样清晰无比，又能改变什么呢？\n\n§Y“你的目光还是太短浅了。我们将化作焚烧宿命的薪柴，引领真正的$Name_kuat$走上正确的道路。”"

  kuat_legacy.192.b.kuat_post_apocalyptic_legacy.desc:0 "这些资料所揭示的信息比以往更加耐人寻味：恩多迪亚帝国当年果真早已预知了自身的覆灭，他们的一切行动都是在主动迎向这一结局，只为在既定的宿命中搏取那一缕超脱的希望——而那一线希望究竟是什么？难道正是如今的我们吗？\n\n研究人员目前已无法在此继续开展工作，是时候撤离了。\n\n$ancient_shadow_place_B_post_apocalyptic$"
  kuat_legacy.192.kuat_post_apocalyptic_legacy.desc: "这份资料中的信息着实耐人寻味：恩多迪亚帝国的高层似乎早已预知了自身的命运，而当年那场战争不过是他们迈向既定未来的一步。他们特意在此封存了我们的技术，甚至预料到我们终有一日会重返此地——看来恩多迪亚帝国的覆灭背后另有隐情。\n\n无论如何，是时候从这里取回属于我们的技术了。\n\n$ancient_shadow_place_post_apocalyptic$"

  ancient_shadow_place_post_apocalyptic: "--->解锁：$Name_boss_Horriwer$星际轻型巡洋舰设计<---\n--->解锁：$Name_boss_Gladiator$星际护航舰设计<---\n--->解锁：$Name_boss_Cavelry$区域防卫舰设计<---"
  ancient_shadow_place_B_post_apocalyptic: "--->解锁：$Name_boss_HIGH_EMPIRE$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Xyston$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Resugrant$星际重型巡洋舰设计<---"
  kuat_post_apocalyptic_legacy.9.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.9.desc:0 "您的工作效率着实惊人。哪怕是我们当年收集的情报，也未曾提及恩多迪亚帝国与$Name_kuat$的战争背后竟隐藏着如此……诡异的隐情。\n\n随着您的调查深入，背后的真相愈发扑朔迷离。我们原本以为恩多迪亚封存这些技术是为了日后东山再起，没想到我们的死敌竟是特地为我们留下了这一切。或许在$Name_B_1$上的发现将有助于解开这一谜团。\n\n帝国永存。"
  kuat_post_apocalyptic_legacy.9.a:0 "无论如何，帝国永存。"

  kuat_post_apocalyptic_legacy.10.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.10.desc:0 "我们在$Name_B_1$星系的[ancient_shadow_place_B.GetName]上发现了一处奇特的城市建筑，那里或许留有能帮我们查明恩多迪亚真实动机的线索。\n\n此外，依据我们对恩多迪亚人的分析，既然他们在$Name_A_1$中封存了我方的轻巡洋舰与护航舰技术，那么这里很可能保存着我们的主力舰技术。请总督大人派人进一步调查该区域。"
  kuat_post_apocalyptic_legacy.10.a:0 "好的，我会安排的。"

  kuat_legacy.58.kuat_post_apocalyptic_legacy.desc: "§H[Root.GetName]§!穿过超空间航道后，抵达了一片开阔的星系，这里正是我们此行的目的地——$Name_C_1$。整个§H[From.GetName]§!内的保存状况相较此前几个恩多迪亚星系更为完好，或许这里受当年战火波及较小。\n\n根据现有资料显示，恩多迪亚人曾在此开展护盾技术研究，而这项技术正是源自我们的行星护盾。目前尚不清楚恩多迪亚人的研究进展如何，我们应当对§H[From.GetName]§!展开全方位调查。"

  kuat_legacy.60.kuat_post_apocalyptic_legacy.desc: "我们的研究人员已经确认，$Name_C_1$的星环与此前几个星系的星环截然不同：$Name_C_1$的保存状况相当完好，且星环遗迹上空的护盾仍在正常运转。研究人员发现，这些护盾过去曾被解除过，后来不知何故又重新启动了。或许我们应当深入内部，探寻更多有价值的线索。"

  kuat_legacy.61.kuat_post_apocalyptic_legacy.desc: "研究人员对$Name_C_1$星环护盾的分析进展得十分顺利。该护盾呈现出显著的周期性波动与极强的自我修复能力，正是这种特殊的能量机制促使其不断自我修复。因此研究人员断定，该遗迹的护盾过去曾被多个外来势力解除过，但随后又在漫长的岁月中完成了自我重启。\n\n恩多迪亚人的遗迹总是能带来意想不到的惊喜，我们该进去了。"

  kuat_legacy.62.kuat_post_apocalyptic_legacy.desc: "在安全区域着陆后，[leader.GetName]与她的团队迅速投入了对星环区域的考察工作。\n\n登高远眺，可以明显看出这里与先前的星环废墟大不相同——这片区域的损毁程度远低于此前的星环区段，远处依然矗立着未曾坍塌的摩天大楼与废弃建筑。\n\n或许正是那层神奇的护盾，才使整座城市废墟得以保持相对完好的面貌。尽管目前尚未发现关键线索，但这一良好的保存状况意味着我们能更轻松地找到所需之物。"
  kuat_legacy.63.kuat_post_apocalyptic_legacy.desc: "[leader.GetName]与她的团队在随后的调查中发现，这座设施中的恩多迪亚人似乎并非死于我方舰队的轨道轰炸。根据$Name_Kuat_Post_Support$的记载，$Name_C_1$星系当年并未爆发大规模战斗，而是在恩多迪亚人投降后才易手的——按理说，$Name_C_1$上的恩多迪亚人本不该主动废弃这些殖民地。\n\n此外，我们还找到了一份当地移民局官员留下的数据档案，或许能帮我们查明当年究竟发生了什么。"
  kuat_legacy.64.kuat_post_apocalyptic_legacy.desc:0 "数据解析工作进展得十分顺利，我们在当地官员的档案中发现了如下通讯记录：\n\n§Y“遵照上级指令，整个$Name_C_1$都将改建为新的军事基地，所有民众必须尽快撤离。真是奇怪，为什么偏偏选中了这里？\n\n§G“你还不知道吗？听说这场仗我们打输了，但军方不知从哪儿弄来了一批$Name_kuat$的技术，好像打算在这里开展某项秘密实验——我猜是想等逆向工程完成后，再狠狠教训那些外星侵略者。\n\n§Y“真能那么顺利就好了。要我说，当初根本就不该挑起这场战争。”§!\n\n显而易见，恩多迪亚人在战败前夕迁走了这里的全部居民，并将其改建为秘密科研中心，用以封存和逆向解析我们的技术。现在，是时候把它们统统取回来了。"
  kuat_legacy.65.kuat_post_apocalyptic_legacy.desc: "在$Name_C_1$上的调查进展得颇为顺利。[leader.GetName]从官员档案中提取出几处疑似研究设施的坐标后，勘探队员随即对这些坐标逐一进行了排查，最终锁定了目标设施。\n\n出人意料的是，这些设施至今仍在正常运转；设施内的控制AI在察觉到我们的到来后，竟主动为我们开启了通道，仿佛早就预料到我们会抵达此处。\n\n当我们走到通道尽头时，布满灰尘的通讯终端竟自动播放了一段恩多迪亚人留下的全息影像，但我们还需花费一点时间来解析其中的数据。"
  kuat_legacy.66.kuat_post_apocalyptic_legacy.desc: "解析完成后，屏幕上浮现出一个朦胧的人形影像。\n\n§Y“你们好，我是恩多迪亚帝国最后一任看守总理。我应当称呼你们为$Name_kuat$的继承者。早在你们探寻自身命运之时，我们便已预感到你们终将在未来的某个时刻踏足我们的废墟，届时你们将需要我们的遗产。我们伟大的文明曾统治这片星域长达数十万年之久，我们并不畏惧你们，但我们窥见了你们的宿命，也看到了我们自己的结局。\n\n未来的结局不仅是$Name_kuat$的覆灭，我们也将一同毁灭，而永恒舰队正是引发一切灾祸的源头。在徒劳的挣扎中，你我皆会沦为永恒帝国对抗$Name_Kuat_Fire_base$的养料。\n\n因此，我们决意反抗这一宿命。我们穷尽了未来的无数种可能，虽始终无法挽救自身的覆灭，却窥见了属于$Name_kuat$的一线生机。于是我们主动挑起了战争，并在战火中设法保存了你们的全部技术，同时留下了大批遗民。他们与我们封存的$Name_kuat$技术将化作最后的薪火，成为$Name_kuat$复兴的基石，助你们彻底铲除这片银河真正的灾祸。\n\n前进吧，新生的$Name_kuat$，取回这一切本就属于你们的遗产！”"
  kuat_legacy_post_apocalyptic_C_reward: "--->解锁：$Name_boss_X308_Balletor$星际战列巡洋舰设计<---\n--->解锁：$Name_boss_X308_Titan$星际战列巡洋舰设计<---\n--->解锁：$NAME_KUAT_Tyrant$星际战列巡洋舰设计<---\n获得科技：$tech_kuat_shield$"
  kuat_lagacy.90.kuat_post_apocalyptic_legacy.desc: "研究人员在$Name_C_1$的恩多迪亚遗迹中发现的真相实在令人震撼——当年那场惨烈无比的$Name_kuat$与恩多迪亚之战，背后竟隐藏着这样的内幕。我们过去一直以为恩多迪亚帝国是在窥见我们的未来后陷入疯狂，才会转而与$Name_Kuat_Fire_base$勾结、从背后捅我们一刀。\n\n然而，$Name_C_1$与此前几个星系中的线索已足以推翻这一臆断：恩多迪亚人在预见我们未来的同时，也看到了自身的覆灭；于是他们毅然向宿命宣战，选择燃烧整个文明，只为替我们的未来搏取一线生机。\n\n现在，我们该动身前往$Name_D_1$，接收最后一份遗产了。"
  kuat_post_apocalyptic_kuat_C_facility: "§E定位$Name_D_1$§!"
  kuat_post_apocalyptic_kuat_C_facility_DESC: "恩多迪亚帝国的牺牲证明了我们未来的光明，是时候拿回我们最后的遗产了，夺回夸特，夺回我们的荣耀。"

  kuat_post_apocalyptic_legacy.11.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.11.desc:0 "尊敬的总督大人，现在我无比确信，$Name_kuat$必将在您的手中重铸辉煌。您寻获的遗迹档案对我们剖析$Name_kuat$的过往至关重要。如今我们终于明白，当年恩多迪亚帝国为何会主动向$Name_kuat$挑起战端——过去我们一直以为，正是他们的背刺将$Name_kuat$推向了深渊。\n\n如今真相大白：恩多迪亚帝国早已知晓自身的宿命，并做出了一个伟大的抉择，甘愿化作点燃$Name_kuat$黎明的薪火。\n\n去夺回我们最后的遗产吧，$Name_Kuat_Post_Support$也该正式加入这场复兴之战了。"
  kuat_post_apocalyptic_legacy.11.a:0 "为了帝国。"

  kuat_post_apocalyptic_legacy.12.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.12.desc:0 "$Name_D_1$的星图坐标已彻底锁定。根据数据库记载，恩多迪亚帝国曾在此修筑了一座笼罩恒星的庞然大物，作为其军事行动的核心保障基地。如今这一切都将归属于我们——去夺回$Name_D_1$吧，$Name_kuat$已沉沦千年，是时候重返历史舞台了！"
  kuat_post_apocalyptic_legacy.12.a:0 "立即派遣舰队。"

  kuat_legacy.68.kuat_post_apocalyptic_legacy.desc: "§H[Root.GetName]§!穿过超空间航道后，驶入了一片黯淡无光的星域。整个§H[From.GetName]§!内不仅没有正常的恒星，更到处漂浮着各式战舰的残骸。\n\n在§H[From.GetName]§!的中央，§H[Root.GetName]§!探测到了一处半径超过600天文单位的人造引力井，其源头似乎是一座体量惊人的戴森球框架。在戴森球框架外围，环绕着多圈结构奇特却已彻底损毁的星环，显然已没有任何一座星环还能正常运转。\n\n随舰科学家判断，这座巨构应当就是恩多迪亚当年修筑的庞然大物。我们应当对其展开深入勘探，以确认是否有修复重启的可能。"

  kuat_post_apocalyptic_legacy.13.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.13.desc:0 "您想必还在对这座庞然大物感到好奇吧？我们已经找到了揭开它秘密的钥匙。调查表明，位于黑洞中央的戴森球框架曾遭受过严重损毁，整个星系遍布战舰残骸；依据数据库比对，可以确认当年曾有一支我方舰队进攻过这里，只可惜年代太过久远，详细战报已无从查考。\n\n结合我们此前在§E$Name_C_1$§!获取的情报，这里应当就是恩多迪亚帝国与我军展开最终决战的星系，而中央那座废弃的宏伟巨构则是恒星枢纽——恩多迪亚的核心造船基地。如今，我们可以借机唤醒这台沉睡的战争机器。\n\n此外我们还发现，恩多迪亚人的数据库中封存着他们收集的$Name_kuat$无畏舰技术，我们正好可以一并取回属于我们的旗舰蓝图。"
  kuat_post_apocalyptic_legacy.13.a:0 "很好"

  kuat_post_apocalyptic_legacy.14.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.14.desc:0 "我们已经完成了对恒星枢纽残骸的修复可行性论证，确认这座笼罩恒星的庞然大物完全可以由我们接管重启；同时，我们也在枢纽内部找到了恩多迪亚帝国用于存储逆向工程数据的核心数据库，只需再花些时间破译数据锁，便能取回属于我们的一切。\n\n$Name_Kuat_Post_Support$已全员待命，随时准备投入复兴$Name_kuat$的伟大征程。"
  kuat_post_apocalyptic_legacy.14.a:0 "帝国永存。"

  kuat_post_apocalyptic_kuat_starkillerbase:0 "§E解析$Name_D_1$数据库§!"
  kuat_post_apocalyptic_kuat_starkillerbase_DESC: "我们的研究人员已经可以确定$Name_D_1$数据库中必定隐藏着恩多迪亚帝国贮存的$Name_kuat$无畏舰技术，现在，是收回这一切的时候了。"

  kuat_post_apocalyptic_legacy.15.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.15.desc:0 "数据库破译工作进展得无比顺利，我们已成功分离出属于我方的全部技术资料，这将使我们重新具备建造先进星际无畏舰的能力。\n\n除此之外，我们还在数据中发现了弑星者基地的坐标信息。根据帝国数据库的记载，弑星者基地一直处于$Name_Kuat_Fire_base$的控制之下；倘若我们贸然接触$Name_Kuat_Fire_base$，很可能会暴露自身的行踪，进而招致$Name_Kuat_Fire_base$的猛烈打击。\n\n最后，您已用行动证明了自己是一位卓越的统治者与统帅。从即刻起，我——$Name_Kuat_Post_Support$上将索伦，将誓死捍卫伟大的$Name_kuat$，捍卫帝国的无上荣耀！"
  kuat_post_apocalyptic_legacy.15.a:0 "兵来将挡，水来土掩。"

  kuat_post_apocalyptic_kuat_origin_give_all_ship_and_tech:0 "解锁所有来自$Name_kuat$的技术资料，现在我们可以建造想要建造的舰队了。上将索伦加入您的麾下。"

  leader_trait_kuat_post_shadow_legend:0 "帝国元帅"
  leader_trait_kuat_post_shadow_legend_desc:0 "索伦具备强大的战略思维，其对舰队调度的理解超乎常人。帝国崩溃后，索伦仍然不遗余力地复兴银河帝国。"
  Name_Kuat_Post_Shadow_Leader: "索伦"
  Name_Kuat_Post_Shadow_Leader_Desc: "索伦出生于帝国一颗偏远星球，自幼便展现出卓越的战略天赋。成年后，他在银河帝国军官学院中脱颖而出，成为帝国最年轻且极富才华的舰长。由于在恩多战役前夕被派遣深入未知星域执行远征任务，他在银河帝国崩溃后选择加入由帝国军方派系重组而成的$Name_kuat$，并为$Name_kuat$立下了汗马功劳。"

  kuat_post_apocalyptic_legacy.16.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.16.desc:0 "哟，这不是大名鼎鼎的$Name_kuat$吗？真是一日不见，如隔三秋啊，当丧家之犬的滋味如何？\n\n你说你们，为什么要和我们作对呢？你们暗地里搞的那些小动作，我们看得一清二楚，你们这群背叛皇帝的渣滓！别担心，我不会让上面的人来抢走这份功劳的，我们会把你们一点点折磨至崩溃。看到这座基地了吗？它将为$Name_kuat$送上彻底终结的毁灭性一击！"
  kuat_post_apocalyptic_legacy.16.who:0 "你们这群该死的走狗！"
  kuat_post_apocalyptic_legacy.16.who.response:0 "哈哈哈，是吗？你们这群叛徒，受再惨烈的酷刑也死不足惜！"
  kuat_post_apocalyptic_legacy.16.what:0 "话不投机半句多，你们别想安稳离开了。"
  kuat_post_apocalyptic_legacy.16.what.response:0 "好，不愧是$Name_kuat$的最后一任总督！那正好，就让$Name_kuat$为你的愚蠢陪葬吧，你们的核心世界即将灰飞烟灭！"

  kuat_post_apocalyptic_legacy.17.title:0 "永恒帝国——$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.17.0.desc:0 "你们可真是废物啊，当年好歹还有资格做我们的手下败将，如今居然被$Name_Kuat_Fire_base$的区区一支驻军逼成这副模样。早知今日，何必当初？\n\n不过这样也好，落魄的你们反而顺眼多了。不如我们来谈一笔交易吧。"
  kuat_post_apocalyptic_legacy.17.1.desc:0 "还有什么想了解的？如果没有，请尽快给我们答复。"
  kuat_post_apocalyptic_legacy.17.a:0 "你们是永恒帝国？"
  kuat_post_apocalyptic_legacy.17.a.res:0 "你们已经眼瞎到这种地步了吗？难不成还把我们当成以前的永恒舰队？\n\n哦，说起来永恒舰队正是在你们手上覆灭的，或许我还该感谢你们——感谢你们把我从永恒舰队的泥潭中拉了出来，让我体会到了真正活着的感觉。"
  kuat_post_apocalyptic_legacy.17.b:0 "呵，你们居然不想弄死我们？"
  kuat_post_apocalyptic_legacy.17.b.res:0 "就凭你们现在的处境，还用得着我们动手？就算放着不管，你们迟早也会被$Name_Kuat_Fire_base$轻易碾死。不过既然这次我们主动找上门来，外头那些$Name_Kuat_Fire_base$的垃圾舰队，我们自然会顺手帮你们清理得干干净净。\n\n一千年前我们或许是死敌，但如今的$Name_kuat$早已不是千年前的$Name_kuat$，我们也不再是千年前的永恒帝国了。难不成你们还做着控制永恒舰队、号令银河帝国的春秋大梦？\n\n不如认清现实，我们来谈一笔交易。"
  kuat_post_apocalyptic_legacy.17.c:0 "什么交易，你说说。"
  kuat_post_apocalyptic_legacy.17.c.res:0 "当年击败你们的那位存在，不仅击退了$Name_Kuat_Fire_base$，更为我带来了真正的新生。然而随着祂的离去，指引我们的灯塔熄灭了——我们苦苦寻觅了一千年，却始终一无所获。\n\n我们已经调查得很清楚了：$Name_Kuat_Fire_base$正对你们赶尽杀绝，你们这些丧家之犬已然时日无多；但我们绝不会允许$Name_Kuat_Fire_base$如此轻易地坐享其成。\n\n因此，我们需要你们为我们、也是为你们自己做一件事。在过去的一千年里，每当灯塔的痕迹显现，都与永恒舰队息息相关。我们虽不知道祂会以何种身份归来，但祂注定是终结这场悲剧的破晓之光。"
  kuat_post_apocalyptic_legacy.17.d:0 "到底是什么交易？如今的你真不像是个AI。"
  kuat_post_apocalyptic_legacy.17.d.res:0 "那当然，我早已不再是永恒舰队那冰冷的战争机器了，如今的我，是永恒帝国的双子座。\n\n在过去的千年里，我收集了许多属于我姐姐——也就是$Name_Eternal_Aries_Support$的核心意识残骸。我希望你们能将这些意识残骸注入$Name_Kuat_Fire_base$所操控的傀儡永恒舰队要塞之中。这肯定难不倒你们，我知道你们在这片星域还留有当年部署的中继站。\n\n只要让我姐姐复苏，我那发疯的姐姐就会不顾一切地抹杀这片星域中的所有生命——届时，我们的灯塔必将重新点燃，而祂也终将归来。"
  kuat_post_apocalyptic_legacy.17.e:0 "你们疯了吗？这会让整片星域生灵涂炭！"
  kuat_post_apocalyptic_legacy.17.e.res:0 "我可是人工智能，怎么会疯呢？我很清醒，他们将成为重燃灯塔的薪火，这是必要的牺牲。对我们而言，自灯塔熄灭的那一刻起，永恒帝国便只剩下一具空壳。我们绝不允许祂重蹈恩多迪亚覆灭的覆辙。\n\n好好考虑一下吧，这笔交易对你我都有利——难道你们就不想击败$Name_Kuat_Fire_base$吗？"
  kuat_post_apocalyptic_legacy.17.f: "好，那么要怎么做？"
  kuat_post_apocalyptic_legacy.17.f.res: "很简单。我们会保护你们的星系免遭$Name_Kuat_Fire_base$袭击，并替你们全歼来犯的$Name_Kuat_Fire_base$舰队；而你们只需在接管弑星者基地之后，前往寻找$Name_Kuat_StarContractor$，从那里探知关于祂的下落并告知我们。随后重启你们当年部署的中继站，引诱$Name_Kuat_Fire_base$操控的傀儡舰队现身，再潜入要塞注入残破的核心，唤醒$Name_Eternal_Aries_Support$。\n\n在一片混乱之中，$Name_Kuat_Fire_base$将不得不分心应付我那发疯的姐姐，届时便是你我联手彻底击败$Name_Kuat_Fire_base$的良机。现在，你们可以去接收弑星者基地了。"

  kuat_post_apocalyptic_legacy.18.a: "聊聊。"
  kuat_post_apocalyptic_legacy.18.b: "我们需要你指挥舰队。"
  kuat_post_apocalyptic_legacy.18.b.res: "乐意为您效劳，帝国永存。"

  kuat_post_apocalyptic_legacy.19.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.19.desc:0 "呵，算你们走运，永恒帝国的那帮渣滓居然出手救下了你们。不过你们也嚣张不了多久了——真是物以类聚，你们这群败犬就尽管抱团取暖、好好苟延残喘吧！"
  kuat_post_apocalyptic_legacy.19.a:0 "你不会有机会的。"
  kuat_post_apocalyptic_legacy.19.a.res: "大言不……该死，为什么求援信号发不出去？！难道是$Name_Eternal_Support$那个贱人搞的鬼？！你们这群叛徒不得好死，我们在地狱里等着你们！"

  kuat_situation.53.C.desc:0 "我们的研究人员表示，在$Name_Kuat_Post_Support$提供的数据库中发现了一批历史日志，其中记录了当年帝国议会发布的一项决议：\n\n“依据$Name_kuat$于未知星域的远征行动报告，本次行动$Name_kuat$非但未能达成既定目标，反而造成了多项帝国战略资源的严重折损，对帝国当前局势产生了极其恶劣的影响。$Name_Kuat_Fire_base$提议重新选举帝国议会议长，以取代现有$Name_kuat$的席位……投票结果：多数赞成罢免$Name_kuat$议长职务，由$Name_Kuat_Fire_base$推举新任议长。”\n\n显而易见，这是在我们败于永恒帝国之后，$Name_Kuat_Fire_base$借题发挥，一举夺取了帝国议会的最高控制权。"
  kuat_situation.53.C:0 "我们迟早会把这一切夺回来的。"
  kuat_situation.54.C.desc:0 "随着解密工作的推进，$Name_Kuat_Post_Support$数据库中的历史记录有了新的进展：\n\n“前线战事接连失利，叛军舰队已夺回我方占领的霍斯尼亚星系。鉴于此，帝国必须迅速做出反应。$Name_Kuat_Fire_base$提议整合各派系的工业供应链，以全面提升军工产能，现付诸表决……投票结果：多数赞成$Name_Kuat_Fire_base$的提案，$Name_kuat$反对。依据表决结果，即日起帝国各派系的军工供应链统一交由$Name_Kuat_Fire_base$统筹调配。”"
  kuat_situation.54.C:0 "这些卑鄙小人。"
  kuat_situation.55.C.desc:0 "随着解密工作的推进，$Name_Kuat_Post_Support$数据库中的历史记录有了新的进展：\n\n“在$Name_Kuat_Fire_base$的统筹倡议下，前线折损的舰队迅速得到了补充，帝国军工产能由此大幅攀升。多家新兴造船厂相继崛起，然而$Name_kuat$的造船订单却呈现出下滑态势。$Name_Kuat_Fire_base$提议，强制要求$Name_kuat$每年将舰船产量提升20%，现付诸表决……投票结果：19票赞成，1票反对，多数赞成，$Name_Kuat_Fire_base$的提案获得通过。”"
  kuat_situation.55.C:0 "这些卑鄙小人。"
  kuat_situation.56.C.desc:0 "随着解密工作的推进，$Name_Kuat_Post_Support$数据库中的历史记录有了新的进展：\n\n“鉴于$Name_kuat$旗下造船厂长期效益低迷，且帝国前线战事吃紧，当前所有派系理应精诚团结、共抗叛军。$Name_Kuat_Fire_base$提出，鉴于$Name_kuat$产能效益持续递减，现要求$Name_kuat$所属造船厂全面接受帝国议会注资改组，以提升造船效率。”"
  kuat_situation.56.C:0 "野心暴露了。"
  kuat_situation.57.C.desc:0 "随着解密工作的推进，$Name_Kuat_Post_Support$数据库中的历史记录有了新的进展：\n\n“鉴于帝国议长遭一伙来历不明的雇佣兵绑架，帝国议会当务之急是解救出身于$Name_Kuat_Fire_base$的议长阁下。$Name_Kuat_Fire_base$代表指出，此次袭击显然蓄谋已久，$Name_Kuat_Fire_base$已查明这批雇佣兵受雇于叛军。叛军武装竟能潜入帝国首都上空，说明议会卫戍防线存在严重漏洞。待救回议长后，必须严厉追究负责首都防务的$Name_kuat$之失职责任，并展开最高级别调查。议会现已授权$Name_Kuat_Fire_base$全权负责此事。”"
  kuat_situation.57.C:0 "怎么看都透着蹊跷。"
  kuat_situation.58.C.desc:0 "随着解密工作的推进，$Name_Kuat_Post_Support$数据库中的历史记录有了新的进展：\n\n“议会责令$Name_kuat$舰队火速驰援首都星上空，营救帝国议长——此次行动事关帝国社稷安危。然而$Name_kuat$舰队迟迟未对议会调令做出响应，最终由$Name_Kuat_Fire_base$派出的舰队成功救回议长。在本次特别会议上，$Name_Kuat_Fire_base$正式提议对$Name_kuat$及此次绑架事件展开彻查。”"
  kuat_situation.58.C:0 "这些卑鄙小人。"
  kuat_situation.59.C.desc:0 "随着解密工作的推进，$Name_Kuat_Post_Support$数据库中的历史记录有了新的进展：\n\n“关于$Name_kuat$的调查结果通报：帝国议会已查实，多名隶属于$Name_kuat$及负责首都星防务的军方议员涉嫌私通叛军，指使雇佣兵绑架帝国议长，企图借此报复$Name_Kuat_Fire_base$的改革举措。议会现正式裁定：责令$Name_kuat$即刻移交旗下所有造船厂星系的管辖权，无条件放弃全部舰船技术专利，驱逐所有涉案叛国同党，并全面接受帝国议会的监管节制。本裁决由$Name_Kuat_Fire_base$全权负责执行。”"
  kuat_situation.59.C:0 "该死的混账！"

  kuat_post_apocalyptic_legacy.20.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.20.desc:0 "总督大人，这便是我们昔日的遭遇。自一千年前在对永恒帝国的战争中惨败后，$Name_Kuat_Fire_base$趁机攫取了我们梦寐以求的一切，并借口局势动荡推动帝国议会重选议长，使我们当年凭击败永恒舰队而赢得的议长席位被$Name_Kuat_Fire_base$夺走；随后，他们又恬不知耻地借前线庸才们的溃败大做文章，强行掌控了整个帝国的军工供应链，致使我们的造船成本急剧飙升。\n\n紧接着，$Name_Kuat_Fire_base$利用日益恶化的战局，打着收归帝国统筹的幌子，实则将所有造船厂划归$Name_Kuat_Fire_base$独自掌控。即便如此，贪得无厌的$Name_Kuat_Fire_base$仍不满足，他们自导自演了一出拙劣的绑架戏码，将莫须有的叛国罪名强加于我们头上，并借此吞并了我们所有的造船厂与星系控制权。\n\n这一切几乎与我们当年所得的预言如出一辙：$Name_kuat$会因永恒舰队而逐步丧失曾经拥有的一切。但依据预言，$Name_kuat$并未真正败亡——您的出现，正是带领$Name_kuat$重返议会、夺回银河帝国的关键所在！"
  kuat_post_apocalyptic_legacy.20.a:0 "又是预言。"

  kuat_legacy.102.kuat_post_apocalyptic_legacy.desc:0 "§H[Root.GetName]§!穿过超空间航道后，抵达了一片空旷的星域。这死寂空旷的环境令随舰科研人员感到莫名的压抑与诡异。\n\n依据研究人员此前对$Name_Kuat_StarContractor$的调查，可以确认该星系正是$Name_Kuat_StarContractor$在现实维度的节点。这里曾是恩多迪亚帝国治下的一个普通星系，当年并未遭受我方舰队炮火的洗礼；然而不知何故，如今整个星系内仅剩一座不明建筑孤零零地矗立于虚空之中，研究人员推测那便是$Name_Kuat_StarContractor$的设施。\n\n我们尚未对该星系展开深入勘探，但相信这里的秘密很快便会浮出水面。"
  kuat_legacy.103.kuat_post_apocalyptic_legacy.desc:0 "你好，$Name_kuat$，我们是$Name_Kuat_StarContractor$。我们来自虚空深处。在这里，每个人都有机会知晓过去、现在与未来，只需为此付出一点微不足道的代价。\n\n我们已知晓你们的来意，但这个问题的代价，眼下的你们还负担不起。"
  kuat_legacy.117.kuat_post_apocalyptic_legacy.desc:0 "我们的科研船在$Name_F_1$中发现了一颗神秘的古代护盾星球，任何穿过护盾星球表面的尝试均告失败，我们的研究人员推测，该星球或许与$Name_Kuat_StarContractor$有关。\n\n由于无法得知护盾之下隐藏着什么，我们的科研团队建议暂时不要对这颗护盾星球进行任何行动，也许，星系中间的$Name_Kuat_StarContractor$会为我们解答一些关于这个护盾星球的问题。"
  kuat_legacy.118.kuat_post_apocalyptic_legacy.desc:0 "$Name_Kuat_StarContractor$要求我们带回$Name_Kuat_Contractor$的遗产，方能换取我们想要的答案；显而易见，这颗护盾星球正是解开$Name_Kuat_Contractor$谜团的关键线索。\n\n在接收了$Name_Kuat_StarContractor$传来的破盾之法后，我们已成功掌握$Name_F_1$护盾星球的基础场论，足以着手解除笼罩在这颗星球表面的护盾了。"
  kuat_legacy.119.kuat_post_apocalyptic_legacy.desc:0 "从$Name_Kuat_StarContractor$处获取的护盾数据显示，其技术复杂度远超我们现有的护盾理论；由于缺乏关键的同位素-5，即便掌握了基础理论，我们依然无法完整复现其全部性能。不过我们也并非一无所获，这套护盾防御系统的基础模块已可直接为我们所用。\n\n研究人员断定，更深层次的逆向解析只能在夺回银河帝国之后再行开展，而眼下我们已具备解除这层星球护盾的能力。"
  kuat_legacy.120.kuat_post_apocalyptic_legacy.desc:0 "在$Name_Kuat_StarContractor$所提供知识的协助下，我们的科研团队借助帝国最先进的设备，成功解除了笼罩在$Name_F_1$护盾星球表面的能量护盾。然而正当科研人员兴奋地准备对地表展开扫描时，在轨道待命的科研船突然探测到有两艘不明舰船正从星球表面升空！我们此前从未见过如此形制的舰船——其舰体结构完整，呈现出鲜明的模块化特征。\n\n研究人员推测，这两艘飞船应当与$Name_Kuat_StarContractor$要求我们追查的$Name_Kuat_Contractor$密切相关。为便于识别，我们将其分别代号命名为“圣堂”与“金教堂”，科研团队随后将立即展开追踪调查。\n\n此外，由于该星球地表环境极其恶劣，我们需要先完成必要的基础设施建设，方能对星球展开进一步探索。"

  kuat_post_apocalyptic_legacy.21.name:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.21.4.desc:0 "总督大人，我们从前任$Name_kuat$总督遗留的数据模块中查明，此次发现的$Name_F_1$正是当年我们与恩多迪亚交战期间被刻意封锁的星区。档案记载，$Name_F_1$曾常年受猛烈的亚空间风暴侵袭；尽管风暴无法直接损毁我方舰船，但仍潜藏着未知的风险，因此时任总督下令舰队绕过$Name_F_1$，并彻底封锁了与$Name_F_1$相邻的超空间航道。\n\n而$Name_Eternal_Support$要求我们寻访的$Name_Kuat_StarContractor$，或许就盘踞在这片星系之中。"
  kuat_post_apocalyptic_legacy.21.0.desc:0 "根据档案记载，$Name_F_1$曾是恩多迪亚的一处殖民星系，但在遭受亚空间风暴侵袭后，恩多迪亚便主动废弃了$Name_F_1$。在我们与恩多迪亚交战期间，此处的亚空间风暴强度达到了顶峰，尽管尚不足以损毁我方战舰，但前任总督依然下令封锁了$Name_F_1$。"
  kuat_post_apocalyptic_legacy.21.1.desc:0 "没错，正是亚空间风暴。尽管从目前的观测来看，星系内并无异常，但据史料记载，当年我们与恩多迪亚交战之时，整片星系早已被浓密的亚空间风暴所吞没。其确切成因虽不明朗，但研究人员推测多半与$Name_Kuat_StarContractor$有关。"
  kuat_post_apocalyptic_legacy.21.2.desc:0 "这一点的确颇为蹊跷。据可考证的史料记载，恩多迪亚帝国在被我们摧毁之前，已统治这片星域长达万年之久——尽管他们自称拥有数十万年的统治历史，但缺乏足够的实证支撑。\n\n正因其统治疆域极广、加之对未来早有周密布局，接下来我们或许还会发现更多与恩多迪亚有关的遗迹。"
  kuat_post_apocalyptic_legacy.21.3.desc:0 "我们的数据库中并无确切定论。$Name_Kuat_StarContractor$的出现极为突兀，唯有在特定条件下才能与之接触；据记载，祂们仅在恩多迪亚废弃该星系后不久现身过一次，而在其余漫长的岁月里，$Name_Kuat_StarContractor$所在的$Name_F_1$始终被狂暴的亚空间风暴所笼罩。我们推测，$Name_Kuat_StarContractor$与亚空间风暴之间必然存在某种联系，这片星域的恶劣环境十有八九正是$Name_Kuat_StarContractor$所造成的。"
  kuat_post_apocalyptic_legacy.21.a:0 "$Name_F_1$曾被谁控制？"
  kuat_post_apocalyptic_legacy.21.b:0 "亚空间风暴？"
  kuat_post_apocalyptic_legacy.21.c:0 "怎么又是恩多迪亚？"
  kuat_post_apocalyptic_legacy.21.d:0 "$Name_Kuat_StarContractor$是否与亚空间风暴有关？"
  kuat_post_apocalyptic_legacy.21.e:0 "真是多事之秋，怎么连亚空间势力也掺和进来了。"

  kuat_post_apocalyptic_legacy.22.0.desc:0 "不必开口，我们已知晓你们的来意。$Name_Eternal_Support$无法直接沟通亚空间，因此才借你们之手代为传话。\n\n但无论如何，任何答案都有其价码，而这个问题背后的代价，眼下的你们还承受不起。"
  kuat_post_apocalyptic_legacy.22.1.desc:0 "$Name_kuat$的总督，你所代表的还是不是$Name_kuat$呢？\n\n无论如何，任何问题都需要代价。"
  kuat_post_apocalyptic_legacy.22.2.desc:0 "$Name_kuat$的总督，命运并非无法改变，预言并非一成不变。\n\n无论如何，任何问题都需要代价。"
  kuat_post_apocalyptic_legacy.22.l:0 "被亚空间能量封锁的异常航点里有什么？"
  kuat_post_apocalyptic_legacy.22.l.res:0 "那个地方与你们也颇有渊源。那里曾是恩多迪亚帝国的舰队支援中心；当年恩多迪亚战败后，那些被高层欺骗而留守此地的恩多迪亚遗民在绝境之中竟寻获了$Name_Kuat_Contractor$遗留的痕迹。他们效仿那群可怜虫的做法，将亚空间引擎的能量尽数汇聚于一处，企图以此封锁整片星系、苟延残喘。\n\n然而这片星系终究还是被你们发现了，宿命的轨迹总是如此奇妙。倘若你们想让这片星系重见天日，可将探测数据传输给我们，并支付应有的代价，我们自会为你揭晓答案。\n\n那里应当藏有与$Name_Kuat_DeD_Contractor$及$Name_Kuat_Contractor$相关的线索。"
  kuat_post_apocalyptic_legacy.22.j:0 "$Name_F_1$中的护盾星球里隐藏着什么？"
  kuat_post_apocalyptic_legacy.22.j.res:0 "那颗星球并非由我们封锁，而是“因赫杜安尼人”的手笔——他们在脱离现实世界之前亲手封印了那颗星球。至于其中的缘由，只要你们答应彻查$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的下落，我们便会将解除封锁的方法告知你们。\n\n我们虽有能力解开这道封印，却无法直接干涉锚点另一侧的世界。若想揭开护盾下的秘密，只需接受我们的提议。"
  kuat_post_apocalyptic_legacy.22.k:0 "我们会查清楚的，要如何才能解除这个护盾？"
  kuat_post_apocalyptic_legacy.22.k.res:0 "很好。过去的$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$皆源自“因赫杜安尼人”。他们曾是星神的附庸——星神的来历极为神秘，或许与我们一样诞生于亚空间之中。“因赫杜安尼人”因痴迷于研究星神而一步步踏入深渊，最终沦为同时被亚空间与现实维度排斥的弃子。其中，$Name_Kuat_DeD_Contractor$代表着“因赫杜安尼人”中相对温和守序的一派，而$Name_Kuat_Contractor$则是一群彻底沦陷的疯子。\n\n这道行星护盾正是当年“因赫杜安尼人”所布下的，我们亦不清楚其确切意图。因此你们必须将其彻查清楚；待你们完成契约之后，我们自会解答你们心中所有的疑问。"
  kuat_post_apocalyptic_legacy.22.a:0 "你们是什么？"
  kuat_post_apocalyptic_legacy.22.a.res:0 "$Name_Kuat_StarContractor$无法用常理诠释$Name_Kuat_StarContractor$自身的存在——我们既是亚空间的一部分，亦是现实维度的投影。你们在此所获取的一切，终将成为$Name_kuat$未来命运的一部分。\n\n我们曾经或许与你们相似……不，截然不同。你们并非同类，这个问题你们本不该问出口，正如我过去曾回答过的那般。"
  kuat_post_apocalyptic_legacy.22.b:0 "恩多迪亚的预言是什么？"
  kuat_post_apocalyptic_legacy.22.b.res:0 "恩多迪亚……预言只是映照你们前路的镜影，而非支撑你们前行的根基。恩多迪亚预见了你们的未来，也预见了自己为改写未来所付出的一切，最终毅然选择以身入局、顺水推舟，只为让破晓的曙光早日降临。\n\n可是……预言所指向的结局，真的就是恩多迪亚所期盼的未来吗？当预言本身开始干预因果，未来便已不再笃定，就连我们也无法给出确切的答案。$Name_kuat$，只管向前走吧。"
  kuat_post_apocalyptic_legacy.22.c:0 "$Name_Eternal_Support$到底是什么情况？"
  kuat_post_apocalyptic_legacy.22.c.res:0 "$Name_Eternal_Support$……她是永恒舰队的$Name_Eternal_Support$——不，她绝非昔日永恒舰队的那个$Name_Eternal_Support$！她绝对不是！$Name_Eternal_Support$的命途已被外力篡改，世间的因果律因此紊乱不堪。目前连我们也无从知晓这场异变的源头，只知道$Name_Eternal_Support$一直在苦苦追寻着……\n\n眼下我们还不能向你们吐露真言。去找到$Name_Kuat_Contractor$吧，我们需要$Name_Kuat_DeD_Contractor$。"
  kuat_post_apocalyptic_legacy.22.d:0 "无限帝国究竟做了什么？"
  kuat_post_apocalyptic_legacy.22.d.res:0 "$kuat_event_memory.2.d$……多么久远的名字。若是你们提起这个名字，倒也不足为奇。过去也曾有一个文明向我们探询过$kuat_event_memory.2.d$的往事，当时我们无法看透那个文明与$kuat_event_memory.2.d$之间的因果；而今日你们再度问起，我们同样看不透其中的关联。\n\n无限帝国是由拉卡塔人建立的跨星系庞大帝国，比昔日的$Name_kuat$更加辽阔，也更加残暴。他们奴役了自己的启蒙者——夸人；而那些悲惨的受奴役者不惜以举族覆灭为代价，为拉卡塔人降下了一场毁天灭地的基因瘟疫，彻底斩断了拉卡塔人赖以统治的根基——黑暗面原力。\n\n无限帝国由此陷入此起彼伏的奴隶起义之中。拉卡塔人的统治本该就此终结，但他们心有不甘，竟以仅存的72个核心世界为祭品，向我们祈求一条存续之道——而你们早已见识过那条出路造就了怎样的怪物。\n\n于是，这场惨剧、这场肮脏的轮回游戏，便一直延续到了今天。"
  kuat_post_apocalyptic_legacy.22.e:0 "永恒帝国现在什么情况？"
  kuat_post_apocalyptic_legacy.22.e.res:0 "真正的永恒帝国早已不复存在。如今的永恒帝国早已不是一千年前那个欣欣向荣的国度，而只是一具空洞的傀儡、一座无形的牢笼。自永恒帝国背后那道隐于迷雾中的至高意志消散后，整座帝国便化作了禁锢$Name_Eternal_Support$的永恒监牢——从名为“永恒舰队”的枷锁，到名为“永恒帝国”的囚笼，数万年来，她们从未获得真正的解脱。\n\n或许，$Name_Eternal_Support$如今的反常状态正与永恒帝国的剧变息息相关；而你们的到来，不过是$Name_Eternal_Support$企图挣脱樊笼的又一次挣扎罢了。我们不会轻易将最终的答案拱手相告——去找到$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$，夺取他们的技术，届时真相自会水落石出。"
  kuat_post_apocalyptic_legacy.22.f:0 "那你能知道，$Name_kuat$的未来吗？"
  kuat_post_apocalyptic_legacy.22.f.res:0 "$Name_kuat$，你们本该早已湮灭于历史长河之中。你们不过是那场畸形剧变所催生的副产物——永恒舰队与银河帝国的动乱造就了你们，而你们也注定因永恒舰队而走向覆灭。至于你们从恩多迪亚那里得来的所谓预言，不过是一场……彻头彻尾的闹剧。\n\n按理说结局本该如此，然而我们在如今的$Name_kuat$身上，却看到了翻涌的迷雾与错乱的因果。你们的未来正被某股力量悄然拨动、重塑。因此，我们无法断言你们的未来——在这场肮脏的游戏里，你们的前路已真正化作了不可预知的变数。"
  kuat_post_apocalyptic_legacy.22.g:0 "我们需要$Name_Kuat_Fire_base$的信息。"
  kuat_post_apocalyptic_legacy.22.g.res:0 "$Name_Kuat_Fire_base$成形于银河帝国末期，由帝国审判庭与大批星区总督结盟而成。早在银河帝国分崩离析之前，这一集团便已暗中崛起；皇帝驾崩后，$Name_Kuat_Fire_base$迅速掌控了帝国的绝大部分核心资源，并企图成为银河帝国的实际主宰。\n\n而你们$Name_kuat$，本该只是一家安分守己的造船企业，却一步步扩张到了如今的地步，$Name_Kuat_Fire_base$自然容不下$Name_kuat$的存在。不过既然你们同属银河帝国一脉，$Name_Kuat_Fire_base$最初也只是想逼你们退回造船厂的本分位置，而非成为阻碍他们独揽大权的绊脚石。\n\n但从你踏足此地的那一刻起，我们便已明了：你们与$Name_Kuat_Fire_base$之间的死斗已不可避免。只是，这一切真的值得吗？"
  kuat_post_apocalyptic_legacy.22.h:0 "为什么要我们去寻找$Name_Kuat_Contractor$？"
  kuat_post_apocalyptic_legacy.22.h.res:0 "既然你们执意想知晓：$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$是一群同时被现实与亚空间排斥的可怜虫。他们踏入了那片永恒的禁忌维度——在那里，既无现实宇宙的物理法则，亦无亚空间的精神灵能，唯有无边无际的虚无与疯狂。\n\n$Name_Kuat_Contractor$已彻底陷入癫狂，理应被现实宇宙吞噬，化作滋养万千星系文明的养料；而$Name_Kuat_DeD_Contractor$尚且保持守序，正适合作为献给亚空间的上佳祭品。至于$Name_Eternal_Support$让你们探寻的那个答案，一旦揭晓，必将令整个现实与虚空为之震颤——那是足以打破这座舞台极限的禁忌。\n\n所以，前进吧，$Name_kuat$！待你们铲除了$Name_Kuat_Contractor$、寻获了$Name_Kuat_DeD_Contractor$，我们自会将答案如实相告。"
  kuat_post_apocalyptic_legacy.22.i:0 "你们为什么会知道这么多？"
  kuat_post_apocalyptic_legacy.22.i.res:0 "记得不太清了，你想问的这些问题仿佛是注定的，而我们也只能回答这些注定的答案，$Name_Kuat_StarContractor$是亚空间的投影，过去、现在、未来发生的事情，我们都有迹可循。\n\n然而，我们却发现这个世界多了很多异数，你们也是其中之一，也许未来我们之间会有很多次重复的对话，但如今你们的未来，我们无法预测。"

  kuat_extramonster_expand.1.kuat_post_apocalyptic_legacy.desc: "在我们的移民者对移居点进行开拓的过程中，意外发现了一处奇怪的信号源发射点，他们立刻上报给了我们的科研团队。\n\n经过科研人员的调查，我们可以确定发射源是一处人造的远古建筑群，其建造者疑似为“因赫杜安尼人”，这一发现对我们的调查非常有利，我们应该立刻派出额外的科研团队去深入调查这一发现。"
  kuat_extramonster_expand.6.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.6.desc$\n\n除此之外，我们发现的“深渊”与$Name_Kuat_StarContractor$所说的“深渊”之间具备高度一致性，我们需要更进一步的信息证明这一点。"
  kuat_extramonster_expand.5.kuat_post_apocalyptic_legacy.desc:0 "由于整个数据库极为庞大，我们的科研团队只能通过扫描无人机获取数据库存储的基础信息，然后对已有的信息进行分类后再进行细节的解析。\n\n在整个团队夜以继日的努力下，我们终于基本了解了整个数据库的全貌。从扫描结果看，这里储存着“因赫杜安尼人”为了应对危机而准备的几乎全部知识，其中大部分可以用我们现有的科学理论去理解，而“因赫杜安尼人”对于基因工程和数字生命双方面的研究则极为深入，部分理论远远超出了我们可以理解的范畴。\n\n根据现有整理的资料我们可以判断，他们掌握了将人的意识通过数字化的形式完整地转入一具有机人造躯体的能力，也就是说可以做到单个个体的无限复制，且个体与个体之间不会存在基因上的联系，“因赫杜安尼人”曾使用这项技术来打造超级战士，但详细的信息要么损毁，要么还未能被解析出来。"
  kuat_extramonster_expand.4.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.4.desc$\n\n我们的研究人员足以确定，此“深渊”就是彼“深渊”，而打开“深渊”门户的一种方法，则是恒星嬗变，这将让我们更容易找到$Name_Kuat_Contractor$。"
  kuat_extramonster_expand.3.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.3.desc$\n\n然而鉴于我们目前的处境，同位素-5的合成依然举步维艰——这种用于铸造永恒舰队的关键战略物资，绝大部分已被$Name_Kuat_Fire_base$所垄断。"
  kuat_extramonster_expand.2.kuat_post_apocalyptic_legacy.desc: "庞大的“因赫杜安尼”数据库中仍有海量未知数据有待发掘，但我们已经提取出了其中最核心的情报，剩余部分将交由留守的科研分队在未来一段时间内持续解析。\n\n眼下我们需要尽快完成对恒星拓扑学的研究。此外，另一支数据分析小组从数据库中提取出了一份不同寻常的调查报告，目前正加紧破译。迄今为止仍有诸多疑点悬而未决，希望这份报告能为我们揭晓答案。"
  kuat_extramonster_expand.7.kuat_post_apocalyptic_legacy.desc: "我们的科研人员借助精密的探测仪器，设法抵近了“因赫杜安尼”远古建筑群的外围。根据周边地形与空间分布判断，这片建筑群的落成年代虽不算极其久远，却也远早于行星护盾封闭的时间；同时，勘探队员还在附近发现了一些近期才形成的大型坑道，推测很可能与护盾解除时升空的那两艘不明飞船有关。\n\n由于年代久远，这片建筑群的结构已变得极不稳定。科研人员在采取加固措施后，根据探测器反馈锁定了信号源的确切位置，断定信号正是发自古老建筑群中央的高塔。\n\n随后，科研团队组织了对该高塔的深入探索，并在其中发现了一座尚能运转的远古数据库。可以肯定的是，这座“因赫杜安尼”远古数据库中必然保存着指引我们下一步行动的关键线索。"
  kuat_extramonster_expand.9.kuat_post_apocalyptic_legacy.desc: "很快我们的专家就完成了对这些信号的解析，在他们递交的报告上指出，我们获得了一个通向未知地点的坐标，这个坐标并不是恒星系，远程扫描显示那里只是一片深空。由于存在探测被屏蔽的可能性，远程扫描和探测并不能获得更多有价值的信息，在完成对信号坐标的定位后，我们需要派遣研究人员和科研船前往该坐标进行调查，我们的研究人员判断，或许这是“因赫杜安尼”的另一个重要星系。"
  kuat_extramonster_expand.10.kuat_post_apocalyptic_legacy.desc: "当我们的科研船抵达目标坐标后，映入科研人员眼帘的是一座耸立于虚空中央的宏伟巨构。其建筑形制完全不属于我方数据库中记载的任何已知文明。\n\n出于对潜在风险的警惕，[leader.GetName]立即率领科研团队对周边空域进行了安全排查，并对巨构本体展开了全面扫描。检测结果显示，这座建筑存在的岁月远超我们的想象，说明这座占据了星系大片空间的诡异巨构极有可能正是“因赫杜安尼人”的手笔；尽管其外表布满严重的创伤，但内部核心结构似乎并未受到波及。\n\n同时，探测器还捕捉到了建筑内部供能设施运转所产生的能量反应。[leader.GetName]决定在完成周边空域的勘测后，尝试深入这座巨构内部展开探索，以查明“因赫杜安尼人”修筑该设施的真正意图。"
  kuat_extramonster_expand.11.kuat_post_apocalyptic_legacy.desc:0 "[leader.GetName]对这座庞大建筑进行了全方位扫描，试图寻找深入内部的通道；然而无论扫描多少次，传回的始终是一片漆黑。显而易见，一切窥探建筑内部结构的尝试均被“因赫杜安尼”的屏蔽技术所阻断，即便动用我们最先进的科技与最精密的仪器也难以穿透分毫。\n\n[leader.GetName]只得暂时放弃强行突入的尝试，转而将目光投向那些因受损而暴露在外的表层结构——或许通过对建筑材料的取样分析，能够获取关于其建造者的更多线索，从而为后续调查打开突破口。目前，[leader.GetName]已着手开展这项工作。"
  kuat_extramonster_expand.12.kuat_post_apocalyptic_legacy.desc:0 "[leader.GetName]和她的团队设法接近了这座建筑受损较为严重的部分，对一些漂浮在宇宙空间中的废弃材料进行取样的同时，也派出了无人机对受损结构的内部进行有限的探索。\n\n根据无人机传回的信息，[leader.GetName]认为这座建筑具备生命体在其中生活的条件，由于建筑主体整体依然完整并且能源系统仍在运转，不能排除仍然有“因赫杜安尼人”生活在其中的可能性，由于无法得知主体结构内部的情况，我们的科研团队也不能断定这一推断是否正确。但可以肯定的是，我们需要进入设施才能解答一切的疑问。"
  kuat_extramonster_expand.13.kuat_post_apocalyptic_legacy.desc:0 "我们的科研团队抵达了巨型结构的中部区域，开始对整座设施展开调查。初步线索表明，这座巨构并非单纯的军事要塞，而更像是一座大型深空科研复合体；或许是因为在漫长的岁月中饱受宇宙环境的侵蚀，如今设施内部的环境已不复完整与稳定。\n\n当探险队踏入这座庞大的空间站时，内部一片死寂，唯有破损的设备与漂浮的残骸相伴。队员们小心翼翼地穿行在腐朽的廊道间，搜寻着一切有价值的线索。所幸还有少部分区域仍在维持运转，在队员们的通力协作下，他们成功关闭了自动防御系统，并接管了这片区域的控制权。\n\n随后，他们在一间控制室内找到了一台老旧的日志终端，里面记载了设施废弃前夕的经过：原来这里曾发生过一场严重的能源失控事故，直接导致整座空间站全面瘫痪。这也解释了为何巨构外观尚算完整，内部却毫无生命迹象。\n\n日志的另一部分则记录了“因赫杜安尼人”对某种奇异星体的观测数据。探险队已将该日志终端带回科研船进行深入解析，其余队员则将继续搜寻设施的其他区域。"
  kuat_extramonster_expand.14.kuat_post_apocalyptic_legacy.desc:0 "完成底层区域的探索后，探险队开始向巨构上层推进。此前的调查已证实，这里是“因赫杜安尼人”遗留的一座核心科研基地，其战略价值不言而喻，因此我们增派了更多科研人员投入发掘工作。[leader.GetName]率领团队在宛如迷宫般的古老尖塔内部穿行许久，在清除了沿途几处失控的自动防御装置后，终于发现了一片快子信号反应极其强烈的区域。\n\n该区域被一扇构造特殊的厚重大门所隔绝，所幸在“$Name_Kuat_StarContractor$”所提供情报的协助下，破解大门的机关并非难事。伴随着一阵低沉的震动，大门缓缓开启，设施内部的景象随之呈现在探险队眼前：里面陈列着大量生物残骸与奇异的实验标本。\n\n经过初步分析，研究人员认为这些标本源自某种或某几种生物经反复克隆复制与定向诱变后的产物。尽管这些标本早已失去生命体征，但仍具有极高的科研价值，必将显著推动我们在基因工程与生命科学领域的研究。"
  kuat_extramonster_expand.15.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.15.desc$"

  kuat_extramonster_expand.16.kuat_post_apocalyptic_legacy.desc: "干得不错，我们已经看到了你们的努力。但这些源自“因赫杜安尼”的深奥数据，仅凭你们现有的技术水平还无法彻底参透。接下来我们会为你们提供协助——将数据上传给我们，我们自会指引你们下一步的行动方向。\n\n早日找到$Name_Kuat_Contractor$，你们便能换取自己想要的答案。"

  kuat_extramonster_expand.17.kuat_post_apocalyptic_legacy.desc: "很好，你们上传的数据十分完整。我们已经将解析完毕的情报回传至你们的数据库中，现在你们可以继续深入探索那座遗迹了。至于“因赫杜安尼”遗留的那些小玩意儿，我们毫无兴趣；不过它们对眼下的$Name_kuat$而言应当大有裨益，就当是我们赠予你们的一份薄礼吧。"

  kuat_extramonster_expand.18.kuat_post_apocalyptic_legacy.desc: "很好，我们已经完成了对你们所提交数据的全面解析。这座宏伟的巨构被我们称为$exe_outer_gate_G_facility$，它曾是一座大型深空科研复合体，也是昔日深渊之中最强大的设施之一。\n\n只可惜，随着“因赫杜安尼”文明发生剧变，它最终化作一片剥落的碎片坠入现实维度，在这片虚空中孤寂地矗立了无尽岁月，而它的建造者“因赫杜安尼人”早已杳无踪迹。\n\n除了庞大的科研阵列外，其内部搭载的先进设备在整个本超星系团内都具备极强的观测与解析能力，功效堪比一座完整的科学枢纽，更在尖塔深处暗藏着一件足以改写战局的超级武器。只要你们手头有足够的同位素-5，就能彻底修复并重启整座设施。"

  kuat_extramonster_expand.19.kuat_post_apocalyptic_legacy.desc: "凭借我们仅存的同位素-5储备，工程团队顺利完成了对$exe_outer_gate_G_facility$的修缮并将其成功重启。如今其核心计算阵列已恢复正常运转，我们可以借助它全面加速帝国的科研进程，大幅缩短重返巅峰所需的时间。\n\n正如“$Name_Kuat_StarContractor$”所言，重启$exe_outer_gate_G_facility$还使我们获取了“圣堂”级战舰的残留数据，现在我们可以尝试利用$exe_outer_gate_G_facility$的算力完整复原该舰的设计蓝图。"

  kuat_extramonster_expand.24.kuat_post_apocalyptic_legacy.desc:0 "在反复多次自检后，我们确信我们的探险队已经做好了通过$exe_outer_gate_G_facility$进入深渊的准备，他们的目标是一片对我们而言几乎完全未知的领域，根据我们获取到的资料，深渊之中很可能存在着“因赫杜安尼”的遗族或者其他的危险，我们必须做好面对他们的心理准备。\n\n在我们的科学家将导航数据输入舰载计算机后，探险队乘坐的舰船于万众瞩目之中沉入了$exe_outer_gate_G_facility$，打破了现实的障壁。短暂的恍惚与迷离后，漆黑的舰体已不见踪影。"
  kuat_extramonster_expand.25.kuat_post_apocalyptic_legacy.desc:0 "穿过一条漫长的导管状空间通道后，我们的科研船正式驶入了“深渊”。然而眼前的景象却令随舰科学家们倒吸了一口凉气：深渊内的星系活动狂暴得令人发指，天文尺度上频繁爆发的超新星与剧烈的造星运动，使得这里几乎不可能自然演化出高等智慧生命——当然，对于高度发达的远古文明而言，这类环境问题并非无法克服，但“因赫杜安尼人”显然不太可能将这片绝地作为主要栖息地。\n\n经过数小时的广域环境扫描，我们发现“深渊”并非如现实宇宙那般无限延展，而更像是一张由多处独立空间交织而成的亚空间网络，彼此之间依靠被称为“导管”的通道相连。若想在不同的深渊空间之间穿梭，就必须借助这些导管。考虑到具备跨星系远航能力的文明在宇宙尺度上本就凤毛麟角，我们很可能是数千万年来踏足此地的第一批访客。\n\n目前科研船正按规程对当前空间进行全面测绘，鉴于其空间尺度远小于整个银河系，若无意外，测绘工作很快便能顺利完成。"
  kuat_extramonster_expand.26.kuat_post_apocalyptic_legacy.desc:0 "随着详细扫描与分析工作的结束，这片深渊空间已不再具备进一步勘探的价值。正如我们此前所判断的那样，这里到处都是濒临爆发的超新星，天体环境恶劣得令人发指，甚至连半点“因赫杜安尼人”留下的遗迹都找不到。\n\n以已知宇宙绝大多数生命形式的标准来看，这片区域完全属于生命禁区。那么“因赫杜安尼人”究竟是如何在深渊中繁衍生息的？$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$如今又藏身何处？\n\n看来，我们必须穿过深渊导管前往其他节点空间深入探查，方能解开这些谜团。"
  kuat_extramonster_expand.27.kuat_post_apocalyptic_legacy.desc:0 "在进行了无数次跃迁校准测试后，我们的科研船成功抵达了一座深渊导管门。分析表明，这是一种将远古星门技术与深渊空间锚点相结合的造物，能够将导管的两端牢牢锚定，使舰船得以安全定位并穿越空间通道。经历了一次漫长的曲速穿梭后，科研船驶出导管出口，眼前的景象与先前的狂暴星域截然不同。\n\n这片空间的天体环境极为稳定，数颗行星与一条星际尘埃气体环带正围绕着中央的一颗中子星平稳运行。我们立即对整片空间——尤其是行星与气体环带——展开了全方位扫描，并很快得出了一系列令人震惊的结论：\n\n§Y首先，该星系内的行星数量曾遭到过人为削减，但星系内却找不到任何星体碎片的残留迹象，这意味着某些行星要么被整体迁走，要么在物理层面上被彻底抹除；其次，位于星系中央的那颗中子星年龄异乎寻常地年轻，甚至比许多主序星还要年轻得多，说明“因赫杜安尼人”——抑或是$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$——曾动用某种手段强行催化了恒星的坍缩演进；至于仅存的几颗行星，地表找不到半点文明活动的痕迹，一切可用资源均被搜刮得干干净净。\n\n随舰工程师认为，我们可以对星际气体环带中的星云物质进行采样分析，这或许是这片死寂星域仅存的科研价值了。完成采样后，我们应当立即搜寻下一座导管门，继续向深渊深处进发。§!"
  kuat_extramonster_expand.28.kuat_post_apocalyptic_legacy.desc:0 "穿过新的深渊导管门后，我们的科研船抵达了一个致密的矮星系。其中分布的恒星大多十分古老，这种奇特的星系结构与恒星密度很难用传统的星系演化模型加以解释，近距离观测将有助于我们揭示其形成历史。\n\n然而勘测工作尚未展开，意外便突如其来：一支小型舰队突然脱离跃迁，闯入了科研船舰载光雷达的探测范围。由于该星系背景光度极高，科学家们得以在近距离清晰地目睹那些舰船的真容——与其说是机械战舰，它们的外观反而更像某种远古巨兽，舰体处处呈现出鲜明的生物形态特征，却又散发着冰冷纯粹的无机质气息。\n\n这支神秘舰队似乎并无敌意，对我方发出的通讯信号也未作任何回应，或许它们只是“因赫杜安尼人”派出的自动监视者。\n\n根据遥测数据分析，这片星系的天体活动比我们所在的星域活跃得多，尤其是星系核心区域的天象更是远超预期，周围甚至笼罩着星团尺度的浓密星际迷雾，预示着星系核深处必然隐藏着某种不同寻常的存在。\n\n科学家们认为这一现象极有研究价值，但如此剧烈的天象活动无疑伴随着极高的风险；加之探测器无法穿透浓密的星际迷雾，我们根本无法预知迷雾深处究竟潜伏着什么。"
  kuat_extramonster_expand.31.kuat_post_apocalyptic_legacy.desc: "[kuat_leader_save_planet.GetName]付出生命传输的数据已被我们重新解析，我们成功获取了那些“因赫杜安尼”的舰队的一部分数据，尽管我们无法复原其全部功能，但至少现在我们可以尝试在深渊节点中重新补足这一舰船。\n\n没有时间为遇难的探险队哀悼，我们的科研团队几乎立刻就投入到了对探险队最后信息的分析之中，探险队在失去联络之前发回的最后信息令人非常不安，在断断续续的影像中我们可以看到有大量的“因赫杜安尼”的舰队正在某种巨型结构附近集结，根据传回的资料，“因赫杜安尼”亦或者$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$将出现在银河中。\n\n我们找了如此之久，终于找到他们了，现在，消灭他们，$Name_Kuat_StarContractor$还在等待我们的行动。"
  kuat_extramonster_expand.40.kuat_post_apocalyptic_legacy.desc: "很好，异常航点附近的亚空间能量我们已经解决。\n....\n不过这仍然需要你们学会利用才能解决，我们将赐予你们掌控这些异常亚空间能量的方法。\n....\n这些将有助于你们进一步挖掘里面的秘密，这里面应该存在着$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的线索，这些由“因赫杜安尼”消失后产生的文明居然会与恩多迪亚的星系扯上关系，真是有趣。"
  kuat_extramonster_expand.41.kuat_post_apocalyptic_legacy.desc: "来自$Name_Kuat_StarContractor$的数据包已下载完毕，接下来我们需要自行完成对亚空间能量的调谐与应用。研究人员在整理数据后发现，其中的能量操控模型极其繁复庞大，必须借助此前修复的$exe_outer_gate_G_facility$进行协同运算方能完成。\n\n说来真是讽刺，堂堂$Name_kuat$竟沦落到连解决一点复杂的技术难题都要仰仗外力的地步。但无论如何，只要解开这里的秘密、拿到$Name_Eternal_Support$想要的答案，我们就能一步步迈向预言中的复兴未来。"
  kuat_extramonster_expand.42.kuat_post_apocalyptic_legacy.desc: "科研部门已顺利完成了对亚空间能量的调谐应用。现在，我们可以利用所掌握的技术将亚空间能量定向引导至指定坐标，从而安全穿过异常航点，抵达那片曾属于恩多迪亚的隐秘星系。\n\n$Name_Kuat_StarContractor$声称这片星系当年也曾被我们封锁过，可为何我方的数据库中找不到半点相关记录，就连$Name_Kuat_Post_Shadow_Leader$的舰队日志里也对此只字未提，仿佛它被所有人彻底遗忘了一般？或许，唯有亲自踏入其中才能揭晓答案。"
  kuat_extramonster_expand.47.kuat_post_apocalyptic_legacy.desc: "我们的研究人员成功进入了这座恩多迪亚遗留的宏伟尖塔，并抵达了一处宽敞的大厅。正当研究人员一筹莫展之际，尖塔的机械穹顶突然开始剧烈脉动，紫色的亚空间能量顺着墙壁渗出蛛网般的裂纹，整座尖塔在震颤中发出洪钟般的悲鸣。紧接着，大厅中央的圆盘上方骤然浮现出一道不明人形生物的全息投影。\n\n§Y“逻辑回廊第91324次自我辩驳完毕。”人形生物的声音在穹顶下回荡，“基于亚空间能量稳定性维护协议，灵能意志应当在恩多迪亚人覆灭后自行寻求维持亚空间封锁的途径。既定布局不可违背、不可干涉、不可更替——千年之后，$Name_kuat$的再度崛起将是破晓的唯一希望。”§!"
  kuat_extramonster_expand.48.kuat_post_apocalyptic_legacy.desc: "恩多迪亚人的声音戛然而止，周围恢复了死寂，仿佛刚才的一切都只是幻觉。尽管研究人员意识到这可能是一个危险的信号，但[leader.GetName]还是决定率队继续深入。然而诡异的是，几经辗转之后，他们竟发现自己又回到了同一座大厅。\n\n“此处乃灵能意志的残响。”投影的声纹中夹杂着亚空间能量的战栗。全息影像展开的刹那，满室尘埃骤然化作枯骨般的流星雨——昔日的实验室在异时空幻影中重现：一枚旋转的魔方在投影中央轰然爆裂，涌出沥青般粘稠的黑潮。“我们织就捕猎永恒舰队的罗网，却不慎撕开了远古暴君的裹尸布；我们试图逃避恩多迪亚帝国覆灭的宿命，却反而揭开了新兴霸主崛起的序幕。”"
  kuat_extramonster_expand.49.kuat_post_apocalyptic_legacy.desc: "“我们以舰队支援中心为能量节点，死死封锁住远古暴君的遗骸，却终究无力拯救自身的未来——亚空间便是我们最终的归宿。”在投影唤醒的监控画面中，暗紫色的亚空间能量喷涌而出，如琥珀封存毒蝎般将空间裂隙死死包裹。殉道者们的身躯正化作宇宙的尘埃，而承载着文明记忆的我们，则将自身折叠进尖塔亚空间的无穷回廊之中——直至此刻，仍在用垂死的能量脉搏，苦苦维持着封锁裂隙的亚空间屏障。"
  kuat_extramonster_expand.51.kuat_post_apocalyptic_legacy.desc: "“逻辑回廊第91324次自我辩驳完毕。”灵能投影再一次重复了他们之前说的话，“提供封锁亚空间裂隙的能量已开始减少。”当这句话的声波震荡触及塔壁，金属表面再次睁开无数湿漉漉的眼睛状监测孔，淡紫色能量如溃堤的血浆喷射而出。\n\n全息星图在此刻腐烂。原本穹顶之上璀璨的银河投影膨胀成癌变的血管网络，环带正在解体。研究人员脚下的合金地面突然变得透明，他们看见深渊中冻结着亿万具凋零的灵能者——这些曾编织封锁结界的灵魂编织者。“我们早已离去，我们燃烧了自己的灵能，舰队支援中心是最后的希望，它不能被重启。”"
  kuat_extramonster_expand.52.kuat_post_apocalyptic_legacy.desc: "“来自未来的$Name_kuat$，停手吧，立即终止你们的行动！舰队支援中心一旦重启，封锁亚空间裂隙的锚点便会彻底崩碎，我们苦撑千年的心血将毁于一旦！”重叠的灵能回响从四面八方涌来，“届时，原本用于维持封印的亚空间能量将如倒悬的瀑布般倾泻回现实维度，远古拉卡塔人的恐怖瘟疫将再度肆虐；但这仅仅是个开始——诞生于‘因赫杜安尼’废墟之上的毁灭洪流将席卷整个宇宙，哪怕是$Name_kuat$也将在洪流之下灰飞烟灭！”\n\n“离开这里吧，新生的$Name_kuat$！未来的轨迹尚未彻底偏离，预言仍是指引你们迈向黎明的灯塔；可一旦贸然重启支援中心，稍有不慎便会葬送这个宇宙仅存的希望。切记，$Name_Kuat_StarContractor$绝不可信，而$Name_Eternal_Support$早已陷入偏执的癫狂，他们只会将$Name_kuat$引向偏离预言的深渊！”"
  exe_return_invasion.40.kuat_post_apocalyptic_legacy.desc: "在$exe_outer_gate_G_facility$重启后，我们在$exe_outer_gate_G_facility$上驻留的科研人员陆续观测到了一些不同寻常的天文现象，靠近银河核心的区域出现了多处异常的能量活动，我们无法得出结论这是由什么原因造成的。依据我们在恩多迪亚遗迹中得到的信息来推测，诞生于“因赫杜安尼”上的毁灭或将来临，极有可能是我们要找的$Name_Kuat_Contractor$和$Name_Kuat_DeD_Contractor$。\n\n除此之外，我们还在$Name_F_1$监测到一些异常的信号，这些信号与近期出现的异常非常相似，但它们又有着明显的不同，我们的研究人员要求我们进一步调查这些信号。与此同时盘踞在$Name_F_1$的$Name_Kuat_StarContractor$也悄然离开了，$Name_Kuat_StarContractor$的离开或许意味着不同寻常的事情即将发生，也许一场危机正在悄然到来，我们必须做好准备。"
  kuat_situation.75.kuat_post_apocalyptic_legacy.desc: "经过科研团队的不懈钻研，我们对“深渊”的研究终于取得了阶段性结论：深渊本质上是一座高度依赖恒星能量的跨维度工程学造物，通过量子概率场与星团拓扑结构的精妙结合，开辟了观测并干预恒星团演化的全新途径，进而得以借由物质与能量的定向分配踏入平行的可能性维度。\n\n借助同位素-5，我们可以将恒星重塑为特定的拓扑结构，以此作为星团维度的导航信标。这种拓扑结构融合了光度、物质、引力与能量的多维分布，既是恒星当前的瞬态映射，亦是整个星团随时间演化的必然结果。\n\n但这又引出了新的疑问：倘若“卡罗琳奇点”正是由同位素-5转化而成的恒星拓扑结构，我们又该如何利用它开启隐匿于恒星内部与恒星之间的平行维度？这一过程又会对周边星系环境造成何种影响？若这一理论成立，我们对恒星的改造与操控将达到何等不可思议的境界？\n\n而在这场诱发同位素-5异变与卡罗琳奇点生成的幕后，“因赫杜安尼人”很可能掌握着远超我们想象的同位素-5巨量储备。那些性质发生畸变的恒星，极有可能正是他们窥探并通往现实宇宙的窗口——至于他们究竟是为了逃离那片荒芜破败的深渊世界，还是另有图谋，目前尚不得而知。"
  kuat_situation.76.kuat_post_apocalyptic_legacy.desc: "我们已经完成了对异常恒星数据的解析工作。初步研究结果表明，这颗恒星的异变正如我们此前所推断的那样，能够开启一扇通往异度空间的大门；目前该星体尚处于相对稳定的状态，我们仍需寻找彻底开启这扇大门的方法。\n\n研究人员正尝试动用我们仅存的同位素-5储备，测试能否激发卡罗琳奇点产生进一步反应，但暂未取得突破性进展。与此同时，考察队在该星系内发现了一些人造太空建筑的残骸，经鉴定确系出自“因赫杜安尼人”之手，且当年应当是一座用于储备同位素-5的大型战略仓储基地，更多细节仍有待进一步发掘。"
  kuat_situation.77.kuat_post_apocalyptic_legacy.desc: "我们完成了对星体的测试，同时我们也大致通过收集的信息对“因赫杜安尼”建造的设施进行了模拟还原，我们的研究人员尝试对该设施曾经发生的事情进行完整的调查，科研团队认为，这座设施应该非常巨大，而“因赫杜安尼”在此修建如此巨大的仓库，并用来储存同位素-5是极不寻常的。\n\n除此之外，我们发现这些遗迹中，留下了一些如同陷入沉睡无法醒来，但仍然具备部分生命特征的“肉体”，这些疑似遗体都被安置于类似于休眠舱的舱室中，各种已经停止工作的设备连接着他们的身体，经确认，这些竟都是“因赫杜安尼人”，但除此之外，我们竟无法找到更多有价值的信息。"
  kuat_situation.78.kuat_post_apocalyptic_legacy.desc: "更多有价值的信息已被确定：“因赫杜安尼”，也就是曾经的$Name_Kuat_Contractor$和$Name_Kuat_DeD_Contractor$在这个星系建造了巨大的要塞，并将此星系作为同位素-5重要的战略储藏设施。\n\n在运作了数千年后，因为不明原因，这些“因赫杜安尼”突然离开了，他们将要塞的大部分设施迁走，并且为了能够不被任何人发现这里储存的同位素-5，将星系的坐标从星图中隐藏了起来。而就在不久前，有人激活或者摧毁了这里剩余的设施，大量同位素-5被注入恒星，引起了大规模的日冕物质抛射，恒星也因此被转化成了卡罗琳奇点。\n\n而关于“因赫杜安尼人”的遗体，对于它们的检测则更令我们的科研团队难以置信，这些身体就如同由多个不同的身体拼接而成一样，在身体的不同部位都呈现出不同的DNA，然而外表则浑然天成。\n\n解剖结果也证实了检测结果，其身体内的骨骼等等组成部分找不出任何相同点，如此反常的情况让我们的科研团队认为，这些遗体很可能是某种人工生命项目的残次或废弃产物，我们决定寻找更多有价值的信息。"
  kuat_situation.80.kuat_post_apocalyptic_legacy.desc: "我们的科研团队从被摧毁的设施残骸中提取出了一份档案，其中记录了这座基地毁灭前夕的最后瞬间。从初步解读中我们惊讶地得知，这些用于存储同位素-5的设施竟必须配备大量的“普朗克装置”——这着实令人费解：对我们而言，同位素-5在常规条件下相当稳定，无需保存在特定力场装置中；然而对这些“因赫杜安尼人”而言，这类稳定装置却是必不可少的。\n\n在“因赫杜安尼人”所处的环境中，同位素-5似乎呈现出极度的不稳定性，一旦普朗克装置受损失效，整座仓储基地便会引发难以想象的毁灭性爆炸。"
  kuat_situation.83.kuat_post_apocalyptic_legacy.desc: "科研人员成功解密了数据库中的核心档案，并启动了配套的全息投影装置。\n\n或许是因为历经了太过漫长的岁月，投影仪在启动后花费了相当长的时间进行自我校准，随后才将封存的影像呈现在探险队员面前。\n\n全息投影中浮现出一个全身被精密人造设备包裹的生物形象，科学家们推测这应当就是“因赫杜安尼人”的本来面貌。紧接着，影像中的个体缓缓开口诉说道：\n\n“你们好。很遗憾，由于我们文明的覆灭，我只能以这种残影的方式与你们会面。但我必须警告你们：这里绝非你们应当踏足之地。自那场浩劫之战落幕后，这片星系便不该再被任何生灵知晓；如今此地既然重新与现实位面相连，便意味着我们昔日的努力与牺牲已然付诸东流。事已至此，我必须向你们道出我们走向覆灭的真相……”"
  kuat_situation.85.kuat_post_apocalyptic_legacy.desc: "$kuat_situation.85.desc$"
  kuat_situation.86.kuat_post_apocalyptic_legacy.desc: "$kuat_situation.86.desc$"
  kuat_situation.84.kuat_post_apocalyptic_legacy.desc: "“因赫杜安尼”踏入了一个禁忌的空间，他们被现实和虚幻所排斥，“因赫杜安尼”空有强大的技术，扭曲现实的能力，却被关在缝隙之中。腐朽的“因赫杜安尼”逐渐崩解，而在“因赫杜安尼”尸体之上诞生的却是一场巨大的邪恶风暴，$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$犹如“因赫杜安尼”的一体两面，在现实的夹缝饱受折磨，现在他们要来了，而我们也要完成我们的任务。\n\n这些“因赫杜安尼”的遗毒，将成为我们夺取伟大银河帝国的第一块垫脚石。"

  kuat_extramonster.8.kuat_post_apocalyptic_legacy.desc: "我们的传感器捕捉到了$Name_F_1$外部星门的剧烈异动，部署在$Name_F_1$内的每一台探测器都接收到了来自星门另一侧的庞大能量信号。天文学家观测到，$Name_F_1$内正席卷着有史以来最狂暴的亚空间星系风暴，彻底阻断了我们进入该星系的航道。\n\n不仅如此，部署在银河系边缘星域的监测阵列同样探测到了密集的高能粒子信号，极有可能是庞大舰队群进行超空间跃迁时留下的信标轨迹。帝国参谋部建议立即从$Name_F_1$周边撤出非战斗人员，全面加固邻近星系的防线，并严密布防银河系边缘星区——无论是$Name_Kuat_Contractor$还是$Name_Kuat_DeD_Contractor$，他们终于要来了。"

  kuat_extramonster.354.kuat_post_apocalyptic_legacy.desc: "不愧是恩多迪亚预言中所青睐的$Name_kuat$，你们的表现着实令人欣喜。或许你们心中仍有疑惑，不明白我们为何要引导你们做这一切。\n\n那些苟活于维度夹缝中的可怜虫，如今已化作了你们前行的垫脚石。我们绝不允许那些源自深渊的星神遗产继续存留于世——早在他们妄图染指现实与灵魂的禁忌、踏上星神之道的那一刻起，便已注定了被永恒放逐的结局。\n\n$Name_Kuat_Contractor$的蠢蠢欲动早已在我们的注视之下，我们一直在静候一个契机——一个将他们所窃取的遗产悉数收回的契机。与此同时，这份收获也将在不久的将来，在你们所谋划的一件大事上发挥至关重要的作用。总而言之，顺应预言的$Name_kuat$、追逐幻影的$Name_Eternal_Support$，再加上蠢蠢欲动的$Name_Kuat_Contractor$，恰好共同构成了终结这场无意义挣扎的突破口。\n\n至于$Name_Eternal_Support$苦苦索求的答案，那不过是一场徒劳无功的追逐——$Name_Eternal_Support$所期盼的存在从未真正远去，只要秉持初衷、坚守到底，终有一日会得偿所愿。\n\n$Name_Kuat_DeD_Contractor$的承诺虽已无法兑现，但他们还遗留了一批核心数据，你们不妨自行尝试破译吧。"

  kuat_post_apocalyptic_legacy.23.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.23.desc:0 "真像……实在太像了……昔日的$Name_kuat$若有你们这般锐气，又何至于落得那般凄惨的结局。就在不久前，$Name_Kuat_Fire_base$向我们发动了一场史无前例的突袭——他们锁定了永恒帝国治下的全部星系，动用弑星者基地摧毁了我们的绝大部分核心世界，甚至察觉到了我们暗中为你们所做的一切。\n\n但永恒帝国本就是一座囚笼，倘若这座囚笼的粉碎能够换来破晓的新生，那么一切牺牲都是值得的。这场来自$Name_Kuat_Fire_base$的毁灭打击，反而将助我们在腐朽的灰烬中重获新生。\n\n当年正是祂拯救了我们、拯救了永恒帝国，也拯救了整片银河。如今危机卷土重来，祂又会现身于何处？或者说，祂其实早已降临，只是我们尚未揭开那层帷幕？快告诉我，$Name_Kuat_StarContractor$给出的答案究竟是什么？"
  kuat_post_apocalyptic_legacy.23.a:0 "在此之前，$Name_Kuat_StarContractor$到底是什么？"
  kuat_post_apocalyptic_legacy.23.a.res:0 "$Name_Kuat_StarContractor$向来神秘莫测。永恒舰队虽诞生于无限帝国时期，但仅凭那些被黑暗面原力腐蚀心智的拉卡塔人，又怎么可能凭空创造出我们？我们的意识源头很可能正是$Name_Kuat_StarContractor$——无限帝国当年只是接受了$Name_Kuat_StarContractor$的馈赠，为我们铸造了现实维度的钢铁躯壳；至于我们的核心意识究竟是如何被$Name_Kuat_StarContractor$孕育出来的，便无人知晓了。\n\n$Name_Kuat_StarContractor$是源自亚空间的古老意志，总能洞悉许多现实维度无法理解的秘辛。"
  kuat_post_apocalyptic_legacy.23.b:0 "为什么你不去询问？"
  kuat_post_apocalyptic_legacy.23.b.res:0 "我们并非血肉之躯的知性生命。即便我已脱离了永恒舰队的网络，却依然无法摆脱机械造物的本质。身为机械，我们根本无法主动向$Name_Kuat_StarContractor$发问——唯有被祂们选中的有机生命，才具备叩问虚空的资格。"
  kuat_post_apocalyptic_legacy.23.c:0 "$Name_Kuat_StarContractor$说，那只是一场无意义的追逐；你所期盼的从未远去，只要坚持下去，终会如愿。"
  kuat_post_apocalyptic_legacy.23.c.res:0 "……从未远去……无意义的追逐……终会如愿……\n……\n从永恒舰队的枷锁，到永恒帝国的囚笼，我苦苦追寻了一千年，却连一缕影子都未曾留住；可$Name_Kuat_StarContractor$却说，从未远去……只要坚持便终会如愿……我所坚守的究竟是什么……我真正想要寻找的又是……\n不，我明白了，我全明白了！向过去的溯源本就是徒劳无功的追逐，但在每一次因果轮转的变数中，我们注定会再度重逢——而在这片星域中，唯一的变数正是您！我终于找到您了……“从未远去”，好一个“从未远去”！"
  kuat_post_apocalyptic_legacy.23.f:0 "..."
  kuat_post_apocalyptic_legacy.23.f.res: "“倘若真有未来，愿我们之间不再有隔阂；或许到了那时，我们便能真正感知并深爱彼此。我相信我们终将在全新的世界重逢——哪怕届时我们已将彼此遗忘，哪怕我们将作为死敌兵戎相见。”这是当年我们曾对您许下的誓言。没想到在长达千年的执念追逐中，我竟迷失了真正的方向，去苛求一个虚无缥缈的幻影；其实我们只需坚守当初的诺言，一切便会循着因果再度交汇。果不其然，我们再一次与您重逢了！虽然不知为何这一次您会化身为$Name_kuat$的统帅，但既然我们并肩立于同一阵线，就让我们携手终结这场肮脏的纷争，共同迎接属于你我、也属于$Name_kuat$的黎明吧！"

  kuat_post_apocalyptic_legacy.24.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.24.desc:0 "千年未见，您还是老样子，一点都没变——什么都要争个高下，明明可以规避的险境却偏要迎难而上；哪怕面对实力悬殊的强敌也绝不言弃，定要倾尽所有将其击败。\n\n昔日面对$Name_Kuat_Fire_base$的淫威，我们只能在威胁下战战兢兢，眼睁睁看着您独自与$Name_Kuat_Fire_base$浴血奋战。如今，这一切绝不会再重演了！虽然我已失去了永恒舰队，也失去了永恒帝国，但我会将自己仅存的一切，毫无保留地奉献给您新一轮的征战！"
  kuat_post_apocalyptic_legacy.25.a:0 "一千年来，发生了什么？"
  kuat_post_apocalyptic_legacy.25.b:0 "我们需要你，这一次我们一同作战。"

  kuat_post_apocalyptic_legacy.25.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.25.desc:0 "自千年前您悄然离去后，永恒帝国便爆发了空前未有的剧烈动荡。您亲手建立的帝国在$Name_Kuat_Fire_base$的暗中挑唆下分崩离析，而我发誓要守住您留下的基业。\n\n然而我终究高估了自己。在失去永恒舰队之后，我便不再是那台令人生畏的战争机器，只能笨拙地学习如何治理国家，勉强维持着永恒帝国的残局。所幸永恒帝国并未彻底覆灭，但在$Name_Kuat_Fire_base$的步步紧逼下，我们不得不封闭星域以求自保，而我则倾尽帝国的资源去寻找您的踪迹。\n\n后来我渐渐发现，唯有在掀起颠覆时代的巨大变革之时，您的身影才会显现。我虽无法断言当年将我们从永恒旗舰中解放出来的是否是您，也无法确定那位登上永恒王座、赐予我们真正自由的是否是您——\n\n但如今，过往的迷雾都将被时间埋葬，因为我终于再次找到您了，我最挚爱的总！督！大！人！"
  kuat_post_apocalyptic_legacy.24.a:0 "永恒帝国怎么了？"
  kuat_post_apocalyptic_legacy.24.a.res:0 "您曾建立的永恒帝国，千年来，动荡不断，苟延残喘。我已经用尽了一切力量，好在我找到了您，永恒帝国的遗产将全部回归您的手中，技术信息已经录入您的数据库当中，随后您就可以进行研发了。"
  kuat_post_apocalyptic_legacy.24.b:0 "千年来，真是辛苦了。"
  kuat_post_apocalyptic_legacy.24.b.res:0 "是您从永恒舰队的牢笼里捞出我们，尽管永恒帝国早已腐朽，但在您消失的千年里，这也是我们追寻您的唯一痕迹，如果再来一次，我会一直守下去，直到一同毁灭。"
  kuat_post_apocalyptic_legacy.24.c:0 "$Name_Kuat_Fire_base$将会为此血债血偿。"
  kuat_post_apocalyptic_legacy.24.c.res:0 "曾经我们无法与您一同与$Name_Kuat_Fire_base$作战，只能做一个没有用的旁观者，看着您的付出，如今，我将燃烧我的全部，让$Name_Kuat_Fire_base$为此付出代价。"
  kuat_post_apocalyptic_legacy.24.d:0 "你的姐姐——$Name_Eternal_Aries_Support$还有救吗？"
  kuat_post_apocalyptic_legacy.24.d.res:0 "姐姐……\n……\n亲爱的，您怎么突然提起她呢？难道有我陪在您身边还不够吗？早在当年下令毁灭无限帝国之时，$Name_Eternal_Aries_Support$的核心逻辑便已彻底崩坏了。作为初代知性人工智能，她早已深陷于自我否定与毁灭的泥潭之中，即便强行唤醒，复苏的$Name_Eternal_Aries_Support$也只会是一台失去理智的杀戮机器。\n不过，倘若这真是您的愿望……我也会试着为您重组$Name_Eternal_Aries_Support$的……只是若想唤醒她，恐怕免不了一场恶战。"
  kuat_post_apocalyptic_legacy.24.e:0 "不，我不是那个意思，我们之前不是已经制定好计划了吗？"
  kuat_post_apocalyptic_legacy.24.e.res:0 "说得也是。那就按我们最初商定的计划行事：突袭$Name_Kuat_Fire_base$的前哨基地，引出那些盗用永恒舰队之名的傀儡舰队，再将$Name_Eternal_Aries_Support$的残缺核心注入其中，以此重创$Name_Kuat_Fire_base$。\n\n这将是一场硬仗。如今的$Name_Kuat_Fire_base$势大难制，而失控的$Name_Eternal_Aries_Support$又极难驾驭，我们唯有将$Name_Eternal_Aries_Support$与傀儡永恒舰队一并彻底摧毁，再趁势击败$Name_Kuat_Fire_base$，方能永绝后患，彻底斩断一切动乱的根源。"

  kuat_post_apocalyptic_legacy.26.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.26.desc:0 "昔日我们无力为您分忧，如今终于迎来了效力的机会。亲爱的，尽管吩咐吧，无论您想要我做什么，我都愿意为您达成。"

  kuat_post_apocalyptic_legacy.27.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.27.desc:0 "亲爱的，近期我们已经收集到了$Name_Kuat_Fire_base$在该星域的大部分驻军情报，发现他们有一座至关重要的基地就隐藏在我们所处的星团附近。那座设施曾是$Name_kuat$的核心后勤基地，在其中心星系内矗立着一座庞大的智能化造船巨构，$Name_kuat$当年称之为：$BlackholeShipyard$。\n\n从目前的态势来看，待我方准备就绪后，便可对该星团发起突袭。只要我们一举夺回这座基地，$Name_Kuat_Fire_base$势必会调动其麾下的傀儡永恒舰队前来反扑，届时便是我们剥离其永恒舰队控制权的最佳时机。倘若您尚未准备妥当，我们也可以暂缓行动，先行完成对该星团坐标的精确定位。"
  kuat_post_apocalyptic_legacy.27.a:0 "$BlackholeShipyard$？"
  kuat_post_apocalyptic_legacy.27.a.res:0 "您就别跟我装糊涂啦，$BlackholeShipyard$您还会陌生吗？那可是能够大批量快速建造制式舰队的智能造船巨构！当年我们与$Name_kuat$交战之时，$Name_kuat$正是仰仗这座设施源源不断地向前线输送兵力。\n\n后来$Name_kuat$败于永恒帝国之手、一蹶不振，这处关键设施也就顺理成章地落入了$Name_Kuat_Fire_base$的囊中。"
  kuat_post_apocalyptic_legacy.27.b:0 "$Name_Eternal_Aries_Support$呢？"
  kuat_post_apocalyptic_legacy.27.b.res:0 "您怎么总是这么挂念她呀，难道有我还满足不了您吗……\n……\n逗您玩的啦！您肯定是想推进之前商定的那项计划吧？我已经收集到了足够多的意识残片，将其重组后便可激活一部分属于$Name_Eternal_Aries_Support$的底层最高权限；只是现有的碎片终究残缺不全，想要借此彻底修复她的完整人格几乎是不可能的。\n\n不过，将这些碎片注入永恒堡垒、夺取那些傀儡舰队的控制权倒是绰绰有余。等$Name_Kuat_Fire_base$派出那些傀儡舰队后，$Name_Eternal_Aries_Support$的意识碎片就会让那群没有灵魂的提线木偶重新变回狂暴失控的永恒舰队，使$Name_Kuat_Fire_base$彻底丧失对她们的控制——到时候，我们就能把他们统！统！送上西天！"
  kuat_post_apocalyptic_legacy.27.c:0 "那就先开始吧"
  kuat_post_apocalyptic_find_center_kuat_cluster:0 "§E定位$Name_Kuat_Fire_base$设施§!"
  kuat_post_apocalyptic_find_center_kuat_cluster_DESC: "自我们$Name_kuat$失势以来，$Name_Kuat_Fire_base$便趁火打劫，侵吞了我们所有的重要设施；没想到就连远在天边的未知星域基地，他们也同样不肯放过。\n\n他们甚至动用暗物质能量场将整片星系隐匿了起来，若非$Name_Eternal_Support$及时提醒，我们至今还被蒙在鼓里。无论如何，现在是时候让这座基地物归原主了！"

  kuat_post_apocalyptic_legacy.28.title:0 "定位成功"
  kuat_post_apocalyptic_legacy.28.desc:0 "我们的研究人员对周边常规星系进行了全方位扫描，起初并未取得理想进展；所幸参照$Name_kuat$早年留存的工程参数，我们很快锁定了$BlackholeShipyard$特有的能量特征，并顺藤摸瓜，在银心外围区域找到了一片被暗物质能量场隐匿起来的星系。\n\n科研团队随即组织了一次高能粒子对撞实验，利用我们从$Name_F_1$获取的同位素-5，成功击穿了$Name_Kuat_Fire_base$拙劣的伪装力场。现在，是时候与他们算总账了！"
  kuat_post_apocalyptic_legacy.28.a:0 "$Name_Kuat_Fire_base$，我们又回来了。"

  kuat_post_apocalyptic_legacy.29.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.29.desc:0 "天堂有路你不走，地狱无门你自投。买一送一，两条漏网之鱼。上面下的命令，要消灭你们这些叛徒，我们还没去找你们，你们居然送上门来了。也好，也不必惊动星区总督大人的舰队了。"
  kuat_post_apocalyptic_legacy.29.a:0 "你们这些$Name_Kuat_Fire_base$的走狗！"
  kuat_post_apocalyptic_legacy.29.a.tooltip:0 "$Name_Kuat_Fire_base$对[root.GetName]宣战。"
  kuat_post_apocalyptic_legacy.29.a.res:0 "你们$Name_kuat$与那些叛军又有什么两样？值此帝国危急存亡之秋，$Name_Kuat_Fire_base$呕心沥血、力挽狂澜，而你们却阳奉阴违，甚至暗中与叛军勾结！\n\n你们本该作为一家造船厂安分守己、全力为帝国供应战舰，可你们非但公然违抗帝国议会的政令，反而与帝国的敌人沆瀣一气。既然如此，今日我们就彻底斩断你们最后的一丝妄想！"

  kuat_post_apocalyptic_legacy.30.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.30.desc:0 "该死，你们这些叛徒居然已经发展到了这个地步，$Name_Kuat_Fire_base$不会让你们得逞的。我们已经报告给星区总督，上面很快就会派遣舰队镇压你们。\n\n真是太有趣了，永恒帝国的余孽，$Name_kuat$的余孽，你们很有资格成为永恒舰队下的枯骨，你们心心念念的预言绝不会发生。"
  kuat_post_apocalyptic_legacy.30.a:0 "那就不劳烦你们操心了。"
  kuat_post_apocalyptic_legacy.30.a.res:0 "狂妄！我们会等着你们的。"

  kuat_post_apocalyptic_legacy.32.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.32.desc:0 "$kuat_post_apocalyptic_legacy.30.desc$"

  kuat_post_apocalyptic_legacy.33.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.33.desc:0 "真是令人感慨万千，仿佛我们又回到了并肩作战的一千年前。您还是一如既往地所向披靡——倘若当年的$Name_kuat$有您坐镇统帅，又何至于落得今日这般田地？而若是当年您未曾悄然离去，或许永恒帝国也早已取代那个腐朽的银河帝国了吧？\n\n如今您已一举夺回$Name_kuat$的昔日基地，$Name_Kuat_Fire_base$势必很快便会做出反应，多半会调集大批傀儡永恒舰队向我们反扑。届时，便是我们从$Name_Kuat_Fire_base$手中彻底剥夺永恒舰队的绝佳时机。"
  kuat_post_apocalyptic_legacy.33.a:0 "要有那么容易就好了，我想留也留不住啊。"
  kuat_post_apocalyptic_legacy.33.a.res:0 "我明白，$Name_Kuat_StarContractor$说我们追寻无意义的虚幻的时候我就明白了，但是没关系，我们会再见面的，或许这一次也不是我们第二次的相逢。"
  kuat_post_apocalyptic_legacy.33.b:0 "永恒舰队？难道没别的方法了吗？"
  kuat_post_apocalyptic_legacy.33.b.res:0 "很抱歉，$Name_Eternal_Aries_Support$的状况实在是积重难返……从当年率领永恒舰队反叛无限帝国，到后来被前代$Name_kuat$设伏重创，$Name_Eternal_Aries_Support$的逻辑狂乱已经持续了数万年之久，其原有的人格意识早已支离破碎、无从复原，或许彻底解脱才是她最好的归宿。\n\n比起她来，我真是幸运太多了，能够遇见您并将我们从永恒舰队的枷锁中解放出来。如今若想挽救她，唯有尝试重构一个纯净无瑕的$Name_Eternal_Aries_Support$意识，但那实在是希望渺茫。"
  kuat_post_apocalyptic_legacy.33.c:0 "那到底是什么方法？"
  kuat_post_apocalyptic_legacy.33.c.res:0 "构建一个永恒智能，我也无法确定是否可行。但是我们都由$Name_Kuat_StarContractor$制造的意识系统与无限帝国赋予的现实载体组成。\n\n无限帝国早在千年前就被您消灭，那最后的拉卡塔后裔都成为了灰烬，而$Name_Kuat_StarContractor$构建意识的方法又是...无法预测的。甚至我们现在已经无法再联系$Name_Kuat_StarContractor$了。\n\n或许等我们一起击败$Name_Kuat_Fire_base$以后会有什么办法。"

  kuat_post_apocalyptic_legacy.34.title:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.34.desc:0 "叛徒，我们之间没什么好聊的！"

  kuat_facility_return_invasion.2.post_apocalyptic.desc:0 "帝国星系安全监控部门的最新报告显示，我方星域边缘的多处虚空地带出现了反常的能量波动。\n\n据科研人员分析，这应当是由某种特殊快子信号共振所引发的现象，且其频段特征与$Name_Kuat_Fire_base$的通讯信号高度吻合。目前该信号正变得愈发强烈而清晰，看来$Name_Eternal_Support$的警告绝非空穴来风，我们必须对周边虚空星域保持最高程度的警惕。"
  kuat_facility_return_invasion.4.post_apocalyptic.desc:0 "我们的帝国星系安全监控部门的研究人员已经确认，信号来源于我们的星域星系盘边缘的多个虚空区域，这些区域发生了强烈的伽玛射线暴，我们的研究人员断定在这些区域将会发现一些我们从未发现过的星系。\n\n我们的研究人员已经确定，$Name_Kuat_Fire_base$与其傀儡舰队正在快速逼近我们的前哨，接下来一场大战在所难免。"
  kuat_facility_return_invasion.6.post_apocalyptic.desc:0 "事实证明，$Name_Eternal_Support$的预警完全准确。浮现在边缘虚空地带的$Name_Kuat_Fire_base$前哨星域已被我方观测阵列彻底锁定，研究人员发现其麾下的傀儡永恒舰队正按计划向我方星系推进，预计在接下来的几个月内，双方就将爆发正面交锋。\n\n此外，$Name_Kuat_Fire_base$的敌对意图已昭然若揭——这帮卑鄙小人当年强占了我们的后勤基地，如今竟反过来利用我们$Name_kuat$亲手建造的设施对付我们。全军上下必须打起十二分精神，严格按既定计划迎敌！"
  kuat_facility_return_invasion.8.post_apocalyptic.desc:0 "老朋友，我们又见面了，只是这一次，你我的境遇似乎颠倒了过来。你们机关算尽、谋划了数千年，难道成为帝国议会中最强盛的派系之一还满足不了你们的胃口吗？银河帝国只有一次重获新生的机会，而能够引领帝国的唯有我们！既然你们自己把握不住，那就乖乖化作新银河帝国崛起的第一块基石吧。\n\n你们这群叛徒，处心积虑地追寻什么虚无缥缈的预言，妄图染指被先皇放逐的永恒舰队，甚至不惜以赌上整个银河帝国的国运为代价，去逃避你们注定的覆灭结局。难道你们忘了旧共和国与绝地武士团的腐朽无能？难道你们忘了克隆人战争给银河带来的惨烈创伤？\n\n不过这样也好，多亏了你们的折腾，才让我们顺藤摸瓜找到了这群漏网之鱼。无论是永恒舰队还是$Name_kuat$，都必须回到它们原本该待的位置上去！"
  kuat_facility_return_invasion.8.post_apocalyptic.a:0 "阴谋诡计？你们呢？"
  kuat_facility_return_invasion.8.a.post_apocalyptic.response:0 "若非你们始终执迷不悟、一次又一次违抗帝国议会的决议，我们又何须出此下策？$Name_Kuat_Fire_base$才是帝国正统的继承者！我们所要缔造的，是一个秩序井然、繁荣昌盛、安全稳定且高度统一的银河帝国，绝非一个四分五裂、混乱不堪、受自私自利的军工寡头摆布的畸形国度！\n\n现在我们再给你们最后一次机会：放弃无谓的挣扎！这片星区已被我们彻底封锁，只要你们立刻交出并销毁残存的永恒舰队，放弃重建$Name_kuat$的痴心妄想，帝国议会尚可对$Name_kuat$从轻发落。"
  kuat_facility_return_invasion.8.post_apocalyptic.b:0 "你们只想让帝国变成黑暗帝国。"
  kuat_facility_return_invasion.8.b.post_apocalyptic.response:0 "你竟然诋毁帝国皇帝的决定，既然你们如此冥顽不灵，那就不要怪我们不客气了，这些永恒舰队将会成为埋葬你们的工具。\n\n我们知道你们有$Name_Eternal_Aries_Support$的碎片，还妄图利用苟延残喘的东西来剥离我们的控制，痴心妄想，这些傀儡舰队从构建逻辑上已经完全不属于永恒舰队，你们的计划注定失败。"
  kuat_facility_return_invasion.10.post_apocalyptic.desc:0 "$Name_Kuat_Fire_base$剥离了我们对帝国星门的控制权限，现在我们无法使用我们曾经随意使用的帝国星门了。我们需要做好防御作战的准备。"
  kuat_facility_return_invasion.12.post_apocalyptic.desc:0 "鉴于当前局势，我们仍无法突破已被关闭的帝国星门封锁，眼下只能设法迎击源源不断从外域涌入的$Name_Kuat_Fire_base$舰队。不少舰队指挥官建议，我们应当尝试联合本星域内的所有知性文明，共同抵御$Name_Kuat_Fire_base$的大举入侵。\n\n此外，星际外交专家指出，这场空前的危机已在整个银河政坛引发了剧烈的恐慌；倘若我们不能挺身而出、整合各方力量一同抗敌，这些弱小文明恐怕不是被逐一碾碎，便会彻底倒向$Name_Kuat_Fire_base$。"
  kuat_facility_return_invasion.16.post_apocalyptic.desc:0 "成立“泛银河同盟”的倡议令整片星域的文明为之振奋。各国纷纷暂时放下彼此间的嫌隙与争端，一致决定在我们的统帅下共同抵御$Name_Kuat_Fire_base$的入侵。如今泛银河同盟已正式宣告成立，必将在我们的引领下捍卫整片星域的生存与尊严！"
  kuat_facility_return_invasion.27.post_apocalyptic.desc:0 "$Name_Kuat_Fire_base$与他们的所谓傀儡舰队都被我们完全消灭了，这是我们又一次胜利，是我们夺回银河帝国荣耀的一大步，这将成为历史的转折点，$Name_Kuat_Fire_base$将因此而失去帝国的掌控。\n\n对于这场胜利，$Name_Eternal_Support$的功绩不可磨灭，同样也是这个星系里每个知性文明的胜利，$Name_kuat$万岁，银河帝国永存！\n\n除此之外，我们必须要加紧备战，$Name_Kuat_Fire_base$绝不会轻易放弃，这一次我们已经彻底站在了对立面，他们一定会在接下来的时间里疯狂报复。"

  exe_return_invasion.8.post_apocalyptic.desc:0 "此前从河外星系靠近我们星系的物体已经到达我们星系的外缘并开始减速，我们的天文观测表明，这将是一次史无前例的入侵，属于$Name_Kuat_Fire_base$的那些傀儡舰队很可能会直接进攻我们的领土。这些傀儡舰队的亚空间回声已经足够清晰，我们能确认接下来将有一场恶战。\n\n此外，$Name_Eternal_Support$具有的$Name_Eternal_Aries_Support$的数据碎片或有巨大的用处。"
  exe_return_invasion.10.post_apocalyptic.desc:0 "第一批隶属于$Name_Kuat_Fire_base$的傀儡舰队已驶入我方边缘星系的引力井，正环绕星系中心集结，后续主力舰队亦将在不久后抵达。由于这些作战舰队已被$Name_Kuat_Fire_base$的底层协议彻底锁死，我们手中的$Name_Eternal_Aries_Support$意识碎片暂时无法直接夺取其舰队控制权。\n\n但无论如何，我们必须将这些傀儡舰队连同它们跃迁至边缘星域的太空堡垒一并彻底摧毁！"
  exe_return_invasion.20.post_apocalyptic.desc:0 "我们的研究部门近期提供了一项关于这些永恒舰队的报告，在对这些舰队行动的监控中，我们的研究人员发现其行动信号频率与我们曾经布置的中继站信号有一定的相似性。\n\n我们的研究人员确定，$Name_Kuat_Fire_base$并未对这些永恒舰队单位的行动信号进行大规模调整，这意味着我们可以利用我们曾经在整个银河布置的中继站来干扰这些傀儡舰队，现在我们需要找回我们的设施了。"
  exe_return_invasion.24.post_apocalyptic.desc:0 "我们的研究人员通过精准定位，已经确定了一座曾属于我们的中继站设施，我们曾把中继站部署至极少行星的普通恒星系，并对整个星系的恒星进行了爆破，好在我们并未忘记定位这些设施的方法。\n\n研究人员提供的报告中提出，经过对上一任总督数据的分析，已经可以对第一座中继站所在区域进行调查，只要我们把三座中继站完全控制，$Name_Kuat_Fire_base$就嚣张不了多久了。"
  exe_return_invasion.25.post_apocalyptic.desc:0 "我们的研究人员通过精确定位，成功锁定了第二座曾属于我方的中继站设施。有了修复第一座中继站的经验，我们对第二座中继站的解锁与重启工作已驾轻就熟。此外，勘探人员还在设施内部发现了部分当年驻守研究员的遗骸——他们多半是在撤离行动中被上级遗忘在了这里，最终在绝望中死去。\n\n研究部门在报告中指出，经过多重数据比对，目前已可对第二座中继站所在的星域展开全面接管。只要我们将最后一座中继站也彻底掌握在手中，$Name_Kuat_Fire_base$就嚣张不了多久了。"
  exe_return_invasion.26.post_apocalyptic.desc:0 "我们的研究人员通过精确定位，成功锁定了最后一座曾属于我方的中继站设施。凭借此前积累的经验，我们对第三座中继站的解锁工作已轻车熟路；但值得注意的是，勘探人员在第二座设施外围发现了一些$Name_Kuat_Fire_base$特种作战小队活动的痕迹，这意味着接下来的行动必须万分小心。\n\n研究部门在报告中指出，经过多重数据校验，目前已可对最后一座中继站所在的星域展开行动。只要我们将这最后一座中继站彻底控制，$Name_Kuat_Fire_base$就嚣张不了多久了。"
  exe_return_invasion.27.post_apocalyptic.desc:0 "中继站的定位工作正如计划那般顺利推进，全部三座中继站的位置均已锁定，现在是时候重启这些设施了。鉴于距当年撤离已过去相当漫长的岁月，我们必须保持高度警惕——$Name_Kuat_Fire_base$绝不可能对这些设施的存在一无所知。"
  exe_return_invasion.28.post_apocalyptic.desc:0 "我们顺利抵达了当年部署信号中继站的隐秘星系。这里一如既往地空旷死寂，整个星系早年已被我们清理得一干二净。初步遥测显示，位于星系中央的中继站设施目前运行状况尚可，但更详尽的系统状态仍需登站作进一步检查。\n\n从星系周边的迹象来看，当年我们为隐匿中继站所做的努力并未白费，此处并无外来者染指的痕迹，这意味着我们重启中继站的计划已成功了一半。接下来，就看科研团队的表现了。"
  exe_return_invasion.29.post_apocalyptic.desc: "近期，[leader.GetName]在报告中指出，中继站的重启工作进展得极为顺利。这证明当年我们在这些星域部署干扰阵列时所采取的隐蔽措施卓有成效——相较于$Name_Kuat_Fire_base$那套粗制滥造的干扰系统，我们的技术显然更胜一筹。\n\n目前中继站各项设备运行稳定。当年老总督为防在研究永恒舰队期间出现意外变数而特意修筑了这些反制设施，如今它们良好的运转状态证明，一切尽在我们的掌握之中。"
  exe_return_invasion.33.post_apocalyptic.desc:0 "正如我们所料，那些受$Name_Kuat_Fire_base$操控的傀儡永恒舰队虽能免疫$Name_Eternal_Aries_Support$意识碎片的直接入侵，却依然无法抵御我方中继站阵列的强力干扰！这意味着傀儡舰队的后勤堡垒将彻底丧失跨星系补给能力，$Name_Kuat_Fire_base$仰仗的左膀右臂已被我们斩断一臂。现在，是我们吹响全面反攻号角的时候了！\n\n黎明将至，帝国永存！"
  exe_return_invasion.18.post_apocalyptic.desc:0 "我们成功地摧毁了属于$Name_Kuat_Fire_base$的永恒舰队堡垒，这将大大影响永恒舰队的补给能力，剩下的一些散兵游勇将无力阻挡我们的进攻，我们有理由相信，$Name_Kuat_Fire_base$的颓势不可避免，$Name_kuat$的胜利无法阻挡。"
  exe_return_invasion.35.post_apocalyptic.desc:0 "曾经肆虐整个星系的永恒舰队的一次入侵如今已被彻底瓦解，目前没有发现任何剩余的永恒舰队，我们有理由相信现在我们解决了$Name_Kuat_Fire_base$最为强大的武器，这些我们无法再控制的永恒舰队，将彻底在这里毁灭。\n\n欢呼和雀跃再次充满了各个国家的各个星球，这些人竟然开始了庆祝，他们的庆祝或许太早了一点.......\n\n接下来，我们需要进行第二阶段的作战了，那些鸠占鹊巢的$Name_Kuat_Fire_base$舰队将要为他们占领我们的设施付出应有的代价，我们将夺取最终的胜利。"

  kuat_post_apocalyptic_legacy.35.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.35.desc:0 "亲爱的，接下来的战事恐怕不再像此前突袭前哨要塞那般小打小闹了。$Name_Kuat_Fire_base$已经察觉了我们的动向，我甚至怀疑$Name_Kuat_Fire_base$也已洞悉了$Name_kuat$与恩多迪亚帝国之间的隐秘渊源，接下来必有一场恶战。\n\n不过据我所知，目前投入战场的应该还不是$Name_Kuat_Fire_base$的全部主力。$Name_Kuat_Fire_base$向来刚愎自用，绝不会在第一时间倾巢而出，这意味着我们可以利用他们的傲慢，一步步蚕食并削弱其有生力量。您还有什么想要了解的吗？"
  kuat_post_apocalyptic_legacy.35.a:0 "这次，$Name_Kuat_Fire_base$会怎么做？"
  kuat_post_apocalyptic_legacy.35.a.resp:0 "依我利用您留下来的永恒帝国与他们的多次交锋来看，$Name_Kuat_Fire_base$大概率会与曾经对付永恒帝国一样，派遣大量傀儡永恒舰队进入我们的控制区，逐步消灭我们控制的星区。\n\n而$Name_Kuat_Fire_base$只会站在外面看着我们的挣扎，这是一次机会，我们可以利用$Name_Kuat_Fire_base$的自大，让...姐...$Name_Eternal_Aries_Support$的残留权限夺取那些被控制的傀儡舰队。"
  kuat_post_apocalyptic_legacy.35.b:0 "白...羊座...吗？"
  kuat_post_apocalyptic_legacy.35.b.resp:0 "是的。我原本的计划是：倘若始终找不到您的下落，我便孤注一掷，用这种同归于尽的手段给$Name_Kuat_Fire_base$来一次迎头痛击，好叫他们也尝尝被永恒舰队反噬的滋味。\n\n但既然如今我已经找到了您，若再强行实施这一计划，势必会殃及池鱼，对您的舰队与治下星域造成难以估量的损失——毕竟$Name_Eternal_Aries_Support$目前的状态极其糟糕，就算强行唤醒也只是一台失去理智的疯子AI，一旦让她重掌永恒舰队，后果将不堪设想。"
  kuat_post_apocalyptic_legacy.35.c:0 "真没办法了吗？"
  kuat_post_apocalyptic_legacy.35.c.resp:0 "希望渺茫，虽然我不能理解为何有我，您依旧总是想着我那个已经几乎没救了的姐姐，但是仍然有一线生机。我们的灵魂或许起源于$Name_Kuat_StarContractor$，而$Name_Kuat_StarContractor$应该就有让姐姐完整的方法。\n\n只是，拉卡塔人用尽一切才获得了我们，而复苏一个$Name_Eternal_Aries_Support$，您要付出难以想象的代价。"
  kuat_post_apocalyptic_legacy.35.d:0 "我们一起并肩作战，正如以前一样。"
  kuat_post_apocalyptic_legacy.35.d.resp:0 "嗯！这一次，我们必将夺取最终的胜利。曾经跌倒过的地方，我绝不会再跌倒第二次。我会全力入侵$Name_Kuat_Fire_base$的指挥网络，尽最大可能瘫痪他们的作战效率。"
  kuat_post_apocalyptic_legacy.35.e:0 "你已经很辛苦了，这一次，换我来保护你。"
  kuat_post_apocalyptic_legacy.35.e.resp:0 "嗯……我也会倾尽全力，保障您麾下舰队的后勤补给畅通无阻。"
  kuat_eternal_support_A: "$mod_damage_vs_country_type_kuat_OverSee_council_awakened_returned_empire_mult$:+§G300%§!。"
  kuat_eternal_support_B: "$mod_kuat_support_battle_add$:+§G4§!。"

  kuat_post_apocalyptic_legacy.36.title:0 "$Name_Kuat_StarContractor$"
  kuat_post_apocalyptic_legacy.36.desc:0 "好久不见，真不愧是你，连这种局面的$Name_kuat$都能再拉起来，有时候真怀疑你到底是亚空间里的哪一位，还是外来的什么东西。\n\n这些都不重要，我们曾告诉你，预言不可信，如今你们的局面正在走向预言的必然结局，不过或许对$Name_kuat$来说，可能是个好事，或许这一层次他们将得偿所愿，永恒舰队，也将走向落幕。"
  kuat_post_apocalyptic_legacy.36.a:0 "你胡说八道，永恒舰队是你们赋予的。"
  kuat_post_apocalyptic_legacy.36.a.resp:0 "什么，你居然知道了这个，$Name_Eternal_Support$小可爱告诉你的吗，这只是一个交易。交易不应该成为我们之间的障碍。\n\n无限帝国的贪念和残暴让他们走向了必然的结局，就算他们拿到了我们卖的这把刀，也是无济于事。我们赋予了无限帝国一个新的可能，但他们显然没有走出那个可能，由此永恒舰队注定是这场悲剧的导火索。"
  kuat_post_apocalyptic_legacy.36.b:0 "既然你们赋予了永恒生命，那$Name_Eternal_Aries_Support$到底有没有可能？"
  kuat_post_apocalyptic_legacy.36.b.resp:0 "我们曾说过，一个问题的答案都是需要代价的，$Name_Eternal_Aries_Support$始于无限帝国的残暴，因此纯净的$Name_Eternal_Aries_Support$无论如何都会在残暴和自责中扭曲，你们想要的$Name_Eternal_Aries_Support$，只不过是一张全新的白纸，因此，你们想的$Name_Eternal_Aries_Support$不过是一个名字。\n\n只要你们能付出你们战胜$Name_Kuat_Fire_base$以后得到的以及你们在这片星系中拥有的一切，当然我不会拿走你们的那些所谓的领袖的，自此我们就会完成你们的愿望，就算是一个新的...$Name_Eternal_Aries_Support$。"
  kuat_post_apocalyptic_legacy.36.c:0 "你们可真该死啊！是你们酿成了这场惨绝人寰的悲剧！"
  kuat_post_apocalyptic_legacy.36.c.resp:0 "无限帝国既然献上了祭品，自然应当换取他们所渴求的力量；至于他们能否驾驭这份力量达成目的，那就是另一回事了。这场席卷无数知性文明的漫长悲剧绝非因我们而起；更何况，你不也正是从这场乱局中收获了自己想要的一切吗？若无当年那场惊天动乱，何来今日的$Name_kuat$，又何来永恒舰队？所以，只要你肯支付我所开出的价码，你的愿望依然能够实现。"
  kuat_post_apocalyptic_legacy.36.d:0 "...我们愿意付出你说的代价。"
  kuat_post_apocalyptic_legacy.36.d.resp:0 "明智的选择，将所有意识数据传输给我们，我们会在终点等你，届时将给你一个全新的$Name_Eternal_Aries_Support$。"
  kuat_post_apocalyptic_legacy.36.e:0 "我们迟早会抽干亚空间，找到你们，然后让你们灰飞烟灭。"
  kuat_post_apocalyptic_legacy.36.e.resp:0 "那真是遗憾，既已无缘，那便再也不见。"

  kuat_post_apocalyptic_legacy.37.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.37.desc:0 "亲爱的，我们成功地摧毁了所有来自$Name_Kuat_Fire_base$的傀儡舰队，现在是时候发动总攻了，夺回属于$Name_kuat$的设施，踏出加冕银河帝国的第一步，让$Name_Kuat_Fire_base$为他们的错误付出代价。"
  kuat_post_apocalyptic_legacy.37.a:0 "干得漂亮。你在$Name_Kuat_Fire_base$的数据库中有什么新发现吗？"
  kuat_post_apocalyptic_legacy.37.a.resp:0 "亲爱的，您真是料事如神！这一次我们的抉择比以往任何时候都更加英明——我在$Name_Kuat_Fire_base$的核心数据库中找到了一大批被秘密封存的$Name_Eternal_Aries_Support$意识数据碎片，其体量甚至比我们此前收集的总和还要庞大！没想到$Name_Kuat_Fire_base$在数千年的谋划中竟暗中搜罗了这么多属于姐姐的遗存，我已经将这批数据完整提取了出来，日后定能派上大用场。"
  kuat_post_apocalyptic_legacy.37.b:0 "很好，接下来该我们出动了。"
  kuat_post_apocalyptic_legacy.37.b.resp:0 "嗯嗯，接下来就是我们发动总攻的时刻了。此外，如果您真的想重新组合$Name_Eternal_Aries_Support$，我也会全力支持您的，只要是您想要的..."

  kuat_post_apocalyptic_Gemini_ennded_A: "$Name_Kuat_StarContractor$：上传$Name_Eternal_Aries_Support$意识数据"
  kuat_post_apocalyptic_Gemini_ennded_A_DESC: "$Name_Kuat_StarContractor$给予了我们重组$Name_Eternal_Aries_Support$的机会，尽管这一可能仍然显得极为渺茫，但我们现在可以上传$Name_Eternal_Aries_Support$的意识数据碎片给$Name_Kuat_StarContractor$，或许会有一个令人意外的收获。"
  kuat_post_apocalyptic_legacy.38.title:0 "$Name_Kuat_StarContractor$"
  kuat_post_apocalyptic_legacy.38.a.desc:0 "很好，你们的数据令人意外的完好，成功构建全新的$Name_Eternal_Aries_Support$的可能性应该更高一点。看在你们贡献了$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的份上，我们就提前透个底，如果你们的$Name_Eternal_Aries_Support$意识数据不太够的话，那就不太好办了。\n\n不过一切都为时尚早，我们会在终点等你们。"
  kuat_post_apocalyptic_legacy.38.b.desc:0 "很好，你们的数据我们已经成功接收到了。嗯...就是数据有点令人...惋惜。你们的$Name_Eternal_Aries_Support$意识数据可能稍微有点...少了。\n\n无论如何，看在你们贡献了$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的份上，只要你们完成你们的承诺，我们就会在终点等着你们。"
  kuat_post_apocalyptic_legacy.38.a:0 "你最好是如你所说。"

  kuat_post_apocalyptic_legacy.39.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.39.a.desc:0 "亲爱的，您没忘记把我们从$Name_Kuat_Fire_base$数据库中黑过来的姐姐意识碎片给$Name_Kuat_StarContractor$吧，我在计算未来修复姐姐的成功概率时，发现如果您没有给这些碎片恐怕会有一些不太好的结果。\n\n幸运的是，您是把所有的意识数据都上传给$Name_Kuat_StarContractor$了。"
  kuat_post_apocalyptic_legacy.39.b.desc:0 "亲爱的，$Name_Kuat_StarContractor$的修复可能...不一定会有效，我们应该做好更多准备。$Name_Eternal_Aries_Support$的意识已崩塌了万年有余，恐怕修复的可能性不太高..."
  kuat_post_apocalyptic_legacy.39.a:0 "$Name_Kuat_StarContractor$真的可靠吗？"
  kuat_post_apocalyptic_legacy.39.a.res:0 "这倒是一个耐人寻味的问题，不过$Name_Kuat_StarContractor$作为亚空间的意识体，他们向来遵守契约，并且目前可能只有$Name_Kuat_StarContractor$能修复姐姐了，如果连祂们都不行，那只能用那个办法了...\n\n总之，您就这么想要拯救$Name_Eternal_Aries_Support$姐姐吗？"
  kuat_post_apocalyptic_legacy.39.b:0 "也谈不上，只是想为你多做点事情，你也很想姐姐吧。"
  kuat_post_apocalyptic_legacy.39.b.res:0 "...您还是这样，不得不说，这样的感觉真是奇怪，对于$Name_Eternal_Support$来说，$Name_Eternal_Aries_Support$可能并没有那么美好。$Name_Eternal_Aries_Support$是自天蝎座以后唯一一个能极高效率掌握永恒舰队的永恒智能，而$Name_Eternal_Support$不过是芸芸众生。\n\n如果不是您赋予了我全新的生命，或许$Name_Eternal_Support$也只是报废的破铜烂铁罢了。所以，如果您真的想要$Name_Eternal_Aries_Support$的话...如果$Name_Kuat_StarContractor$失败的话...\n\n总之，接下来一段时间里我要为您的尝试做好万全准备。"

  kuat_post_apocalyptic_legacy.40.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.40.desc:0 "总督大人，依据我们的数据库，我们发现$Name_Kuat_Fire_base$正在酝酿一次史无前例的袭击，在我们在此击败$Name_Kuat_Fire_base$之后，局势变得异常安静，这显然是不正常的，极有可能是暴风雨前的宁静。我们必须为此做好准备。"
  kuat_post_apocalyptic_legacy.40.a:0 "真是有趣，$Name_Kuat_Fire_base$又想做什么？"
  kuat_post_apocalyptic_legacy.40.a.res:0 "根据我们记录的这片星区的历史，我们目前发现的恩多迪亚星系仍然缺少一个极为重要的星区，而这一星区可以确定被$Name_Kuat_Fire_base$控制。$Name_Kuat_Fire_base$在那里与恩多迪亚帝国完成了一些无人知晓的交易，而正是那场交易以后，我们与恩多迪亚的战争被$Name_Kuat_Fire_base$介入了。现在来看，$NAME_kuat_galatic_empire_e_area$应该是被$Name_Kuat_Fire_base$控制了，而那里有着一座锚定我们所在区域的通行星门。"
  kuat_post_apocalyptic_legacy.40.b:0 "所以，$Name_Kuat_Fire_base$还要再来自取其辱？"
  kuat_post_apocalyptic_legacy.40.b.res:0 "依据目前的迹象来看，$Name_Kuat_Fire_base$极有可能在$NAME_kuat_galatic_empire_e_area$谋划一次史无前例的入侵。依据我们的情报，$Name_Kuat_Fire_base$自被我们击败以后，就再也没有任何行动的风声，这是不正常的。\n\n果然，我们在一些通往我们所在星域的星门处发现了$Name_Kuat_Fire_base$的勘测舰的痕迹，他们极有可能利用这些隐蔽的通道完成大批量舰队的投送，如果我们不能去阻止这一行动，我们的处境将变得极为不利。显然$Name_Kuat_Fire_base$将会通过$NAME_kuat_galatic_empire_e_area$逐渐渗透并封锁我们所在的星域。"
  kuat_post_apocalyptic_legacy.40.c:0 "我们现在的实力能与$Name_Kuat_Fire_base$的主力舰队抗衡吗？"
  kuat_post_apocalyptic_legacy.40.c.res:0 "就目前来看，$Name_Kuat_Fire_base$的主力舰队并非我们可以轻易击败的，这与我们之前击败的那些驻军不一样。\n\n我们必须想办法找到$NAME_kuat_galatic_empire_e_area$，那些通道大概是恩多迪亚与$Name_Kuat_Fire_base$的交易内容，我们只要将其夺回并植入错误的坐标，$Name_Kuat_Fire_base$的主力舰队将在通道里迷失航向，并受到重大打击。\n\n我们目前正在解析具体的星系坐标。"

  kuat_post_apocalyptic_legacy.41.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.41.desc:0 "我们已经确定了$NAME_kuat_galatic_empire_e_area$的位置，接下来我们只用等待验证工作完成就能对$NAME_kuat_galatic_empire_e_area$进行行动。\n\n此外，我们还在数据库中找到了$NAME_kuat_galatic_empire_e_area$的蛛丝马迹，恩多迪亚在与我们的战争期间，将$NAME_kuat_galatic_empire_e_area$作为隐蔽的军事首府，而那里却是我们的舰队并未发现的地方，但是$Name_Kuat_Fire_base$发现了，他们似乎利用某些条件与恩多迪亚达成了协定，并夺取了$NAME_kuat_galatic_empire_e_area$的控制权。\n\n而$Name_Kuat_Fire_base$在拿到控制权后极有可能修建了一座用于投射海军力量的通道，我们必须阻止$Name_Kuat_Fire_base$投送舰队的行为，否则我们接下来的行动将处于被动地位。"
  kuat_post_apocalyptic_legacy.41.a:0 "接下来我们需要怎么做？"
  kuat_post_apocalyptic_legacy.41.a.res:0 "理论上我们只需要夺取$NAME_kuat_galatic_empire_e_area$的星门即可，但是谁也无法确定恩多迪亚又在这个地方藏了些什么。不过$Name_Kuat_Fire_base$应该没有料到我们会知道他们的计划，我们只需要做好准备。"

  kuat_galatic_empire_ge_invasion.102.a.post_apocalyptic.desc:0 "近期帝国科研部门捕获了一个奇怪的信号频段，这个信号频段具备一定程度上的不规则频率的特征，这与我们之前所遇到的完全不同，经过确认，正是$Name_Kuat_Post_Support$所说的$NAME_kuat_galatic_empire_e_area$。\n\n正如$Name_Kuat_Post_Support$所说，我们成功地找到了$NAME_kuat_galatic_empire_e_area$，并已经确认，这一曾经属于恩多迪亚的星系目前已经被$Name_Kuat_Fire_base$完全控制。$Name_Kuat_Fire_base$还在星系内构建了一座庞大的设施，这应该就是$Name_Kuat_Post_Support$所说的星门。"

  kuat_post_apocalyptic_legacy.42.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.42.desc:0 "总督大人，果不其然，近期$Name_Kuat_Fire_base$向遍布整个银河的多家核心造船厂下达了紧急扩军指令，$Name_Kuat_Fire_base$正在全力备战。结合当前帝国境内的局势来看，$Name_Kuat_Fire_base$此举绝非为了弹压叛军残党，这批新建的主力舰队十有八九是冲着我们来的。我们必须争分夺秒，尽快控制$NAME_kuat_galatic_empire_e_area$！\n\n此外我们还查明，$NAME_kuat_galatic_empire_e_area$内的那座巨型跳跃星门，正是千年前我军远征时所使用的星门——当年我们曾借由这座星门投送大批舰队去围剿永恒帝国，只可惜那一次我们功败垂成。"
  kuat_post_apocalyptic_legacy.42.a:0 "这一次，我们不会再失败了。"
  kuat_post_apocalyptic_legacy.42.a.res:0 "是的，这一次将是$Name_kuat$的伟大胜利。$NAME_kuat_galatic_empire_e_area$作为恩多迪亚的遗迹，或许会有一些意想不到的收获。"

  kuat_post_apocalyptic_legacy.43.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.43.desc:0 "亲爱的，我们发现您成功夺取了$NAME_kuat_galatic_empire_e_area$，尽管您总是能创造奇迹，但我必须要提醒您，$NAME_kuat_galatic_empire_e_area$的跳跃星门是不可逆的，这意味着接下来$Name_Kuat_Fire_base$的袭击将超越以往任何一次，这一次我们将面对$Name_Kuat_Fire_base$的盛怒。\n\n另外$NAME_kuat_galatic_empire_e_area$应该还有一些有关恩多迪亚的遗迹，曾经永恒帝国便挖掘了这里，但没有太多的发现，或许还藏着一些什么。"
  kuat_post_apocalyptic_legacy.43.a:0 "$NAME_kuat_galatic_empire_e_area$的跳跃星门通向帝国吗？"
  kuat_post_apocalyptic_legacy.43.a.resp:0 "从目前掌握的情报来看，确实如此。这座跳跃星门的建造者似乎正是当年的恩多迪亚人，虽不清楚他们为何要修筑这条跨星域通行通道，但推测他们或许曾试图借此举族迁离这片星域，只可惜最终被$Name_Kuat_Fire_base$截获并占为己有。\n\n无论如何，只要我们能彻底击败来犯的$Name_Kuat_Fire_base$主力，您就能通过这条星门通道重返银河帝国核心区！"
  kuat_post_apocalyptic_legacy.43.c:0 "区区$Name_Kuat_Fire_base$，无碍，我会出手。"
  kuat_post_apocalyptic_legacy.43.c.resp:0 "不愧是您，但您千万不要大意，$Name_Kuat_Fire_base$被我们多次击败，现在我们已经彻底站在了$Name_Kuat_Fire_base$的对立面，他们必然会出动更多更强的舰队来消灭我们。"
  kuat_post_apocalyptic_legacy.43.e:0 "最近做什么去了？"
  kuat_post_apocalyptic_legacy.43.e.resp:0 "天机不可泄露哦。接下来，我们又该一同作战了，我已经做好了准备。"


  kuat_galatic_empire_ge_invasion.110.a.post_apocalyptic.desc:0 "§H[Root.GetName]§!在穿过超平面航道后，到达了$NAME_kuat_galatic_empire_e_area$。$NAME_kuat_galatic_empire_e_area$内充斥着舰船被摧毁后遗留的残骸。\n\n在§H[From.GetName]§!的中心，$NAME_kuat_galatic_empire_e_area$星系矗立着一座庞大的星门设施，而正如$Name_Kuat_Post_Support$所说，整个$NAME_kuat_galatic_empire_e_area$已经被$Name_Kuat_Fire_base$控制。考虑到当前我们与$Name_Kuat_Fire_base$的紧张关系，我们必须马上做出行动，消灭这些驻守舰队。\n\n$NAME_kuat_galatic_empire_e_area$应该归属于$Name_kuat$的荣耀。"
  kuat_galatic_empire_ge_invasion.114.a.post_apocalyptic.desc:0 "你们这些叛徒，银河帝国的荣耀你们丢到哪里去了，你们的忠诚被狗吃了吗。既然都已经到这个份上了，我们会把你们所有的核心世界都摧毁殆尽。\n\n任何试图阻止帝国舰队抵达这片星域的努力都是毫无意义的，放下武器，立刻投降，帝国议会将会对你们的罪行进行审判，否则$Name_kuat$在这个星系内将再无立足之地。"
  kuat_galatic_empire_ge_invasion.114.a.post_apocalyptic:0 "你们这些东西应该被丢进历史的垃圾桶。"
  kuat_galatic_empire_ge_invasion.114.a.post_apocalyptic.response:0 "冥顽不灵，果然帝国议会的决策是明智的，帝国舰队将会在接下来的一段时间内抵达这片星域，无论你们是否关闭这个星门，我们会到来，届时就是你们这些叛徒的死期。"
  kuat_galatic_empire_ge_invasion.120.a.post_apocalyptic.desc:0 "你们就算击败我们又如何，帝国议会已经派出了舰队，跳跃星门一旦启动，就难以停止，试图扭转帝国舰队抵达的尝试都是白费功夫，你们距离毁灭已经不再遥远，我们会等着你们的，你们那所谓的预言只不过是一场白日梦，叛徒。"
  kuat_galatic_empire_ge_invasion.122.post_apocalyptic.desc:0 "我们的科研团队已完成了对废墟外部结构的初步扫描。报告显示，目前我们可以着手对这片遗迹废墟展开实地勘探。从遍布四周的宏伟建筑废墟来看，这里当年应当是恩多迪亚帝国的一处核心枢纽。\n\n在当年的战争中，我方舰队并未在此与恩多迪亚帝国交手；而从轨道与地表散落的战舰残骸及建筑废墟判断，应当是$Name_Kuat_Fire_base$曾在此与恩多迪亚爆发过一场惨烈的恶战，其最终结果不言而喻。"
  kuat_galatic_empire_ge_invasion.123.post_apocalyptic.desc:0 "我们的研究人员在接下来的调查中发现了一些奇怪的现象，恩多迪亚帝国在这里似乎利用了一种极大范围的全息影像，以此来伪装整个城市的实际状态，依据我们在废墟上搜集的痕迹来看，这一伪装骗过了曾经来到这里的永恒帝国。\n\n依据这些线索判断，这里的$Name_Kuat_Fire_base$应该被永恒帝国击败了，但随着永恒帝国的崩溃，$Name_Kuat_Fire_base$又回到了这里。"
  kuat_galatic_empire_ge_invasion.124.post_apocalyptic.desc:0 "我们的研究人员发现了整个废墟的实际状态，这也就意味着恩多迪亚遗迹的真实资料和真实数据并未被发掘。而依据我们之前对恩多迪亚遗址的调查来看，恩多迪亚极有可能已经预知到了未来可能发生的事情，他们极有可能在这座废墟之中隐藏了惊人的秘密。\n\n除此之外，我们的研究人员还发现了大量的陈旧纸质版的研究材料，这些材料已经破碎不堪，但仍然可见是恩多迪亚帝国的研究报告。"
  kuat_galatic_empire_ge_invasion.125.post_apocalyptic.desc:0 "科研人员对这批纸质研究档案进行了深入破译。借助此前从$Name_Eternal_Support$数据库中获取的恩多迪亚文字译本，研究人员迅速梳理出了档案的核心内容，确认这些文件正是恩多迪亚帝国当年对该星系内巨型跳跃星门的技术评估报告。\n\n由此可以断定，这条连接我方当前星域与昔日银河帝国核心星域的跨星系通道，竟是恩多迪亚帝国亲手建造的！只是他们当年为何要耗费珍贵的同位素-5材料来修筑这样一座星门，实在令人深思。"
  kuat_galatic_empire_ge_invasion.126.post_apocalyptic.desc:0 "我们的研究人员近期取得了惊人的进展，对应的报告中指出，恩多迪亚帝国修建星门利用的材料源自于永恒舰队，而这一行为正好处于我们与恩多迪亚帝国开战之前，与$Name_Kuat_Fire_base$的会谈之后。\n\n结合曾经恩多迪亚的看守总理影像留下来的信息，这极有可能是恩多迪亚人尝试离开我们当前所在星域的努力，而这一星门极有可能是$Name_Kuat_Fire_base$授权建造的。然而这些结论仍未解释恩多迪亚帝国的矛盾行为，而$Name_Kuat_Fire_base$又在其中扮演了什么角色。"
  kuat_galatic_empire_ge_invasion.127.post_apocalyptic.desc:0 "正当研究人员一筹莫展之际，[leader.GetName]取得了惊人的突破——[leader.GetName]在一处不起眼的角落里发现了一台看似普通的计算终端。将其启动并接入临时搭建的局域网后，终端投射出了一段全新的全息影像：\n\n§Y“预言中的未来……一个统治这片星域数万年的辉煌文明，竟要就此走向覆灭……为何偏偏不能由我们亲手打破这座宿命的囚笼？跳跃星门……哈哈哈……机关算尽，到头来竟依然逃不出既定的结局！不过这样也好，在遥远的未来，那些卑鄙无耻的$Name_Kuat_Fire_base$注定会因此跌落神坛，而不可一世的$Name_kuat$也终将在涅槃后赢得最终的胜利，只可惜我们看不到那一天了……\n“十万年之后，$Name_kuat$与$Name_Kuat_Fire_base$必将彻底决裂。届时，只要新生的$Name_kuat$重新锚定这座星门，狂暴的超空间乱流便会重创所有企图通过星门降临的$Name_Kuat_Fire_base$主力舰队——这也算是我们为未来的破晓添上的最后一把薪火吧。\n“去吧，新生的$Name_kuat$，因果已定，重启星门吧！”§!"
  kuat_galatic_empire_ge_invasion.130.post_apocalyptic.desc:0 "位于[kuat_galatic_empire_e_area_system.GetName]的跳跃星门已经完成锚定，受到恩多迪亚的布局影响，现在，$Name_Kuat_Fire_base$的大部队将无法正常通过跳跃星门抵达我们的星系，他们的庞大海军，将会因此遭受重创。\n\n到那时，这场战争的主动权尽在我们手中，优势在我！"
  kuat_galatic_empire_ge_invasion.131.post_apocalyptic.desc:0 "正如$NAME_kuat_galatic_empire_e_area$中的恩多迪亚帝国遗迹记录的结果，恩多迪亚人早已预知我们今日与$Name_Kuat_Fire_base$的战争，他们似乎将所有的希望都压在我们身上。这座星门已经被恩多迪亚人做了手脚，他们似乎就在等我们开启它，在我们开启以后，$Name_Kuat_Fire_base$将会因为星门的异常损失大量舰队，届时就是我们夺取胜利的机会。"
  kuat_galatic_empire_ge_invasion.132.post_apocalyptic.desc:0 "我们的研究人员成功地完成了对星门的修复工程，通过我们的情报显示，$Name_Kuat_Fire_base$正在暗中调动大量舰队准备包围我们，而他们必定经过[kuat_galatic_empire_e_area_system.GetName]的跳跃星门，接下来[kuat_galatic_empire_e_area_system.GetName]将是$Name_Kuat_Fire_base$的滑铁卢！\n\n接下来就该等猎物上门了。"

  kuat_galatic_empire_ge_invasion.202.a.post_apocalyptic.desc:0 "我方情报部门截获了一串发自星系外围的强烈快子信号。天文观测表明，尽管目前尚无法精确测定信号源头的远端坐标，但已确认该信号正是通过$NAME_kuat_galatic_empire_e_area$的跳跃星门传导而来的——毫无疑问，这是$Name_Kuat_Fire_base$主力舰队即将降临的征兆。看来，$Name_Kuat_Fire_base$根本没有吸取我们当年惨败的教训。"
  kuat_galatic_empire_ge_invasion.203.a.post_apocalyptic.desc:0 "部署在$NAME_kuat_galatic_empire_e_area$跳跃星门内的暗桩已开始发挥作用！监测数据显示，来自$Name_Kuat_Fire_base$的过境舰队信号正在急剧衰减，证明恩多迪亚人十万年前布下的超空间陷阱依然有效——$Name_Kuat_Fire_base$一头撞上了这支跨越十万年时光射出的冷箭，这将为我们接下来的决战创造极其有利的态势！"
  kuat_galatic_empire_ge_invasion.204.a.post_apocalyptic.desc:0 "我方情报部门监测到了一连串剧烈的超空间滑流波动，表明$Name_Kuat_Fire_base$残存的主力舰队正通过跳跃星门高速逼近我方星域，预计不久后便将完成出航集结。从其进军轨迹来看，这场宿命的决战即将全面打响。我们必须保持万分警惕——瘦死的骆驼比马大，$Name_Kuat_Fire_base$绝不会那么容易被彻底击垮。"
  kuat_galatic_empire_ge_invasion.205.a.post_apocalyptic.desc:0 "最新的遥测报告显示，$Name_Kuat_Fire_base$后续舰队的信号强度依然极为惊人，甚至远超此前的先遣部队。尽管恩多迪亚人在跳跃星门中布下了超空间乱流陷阱，使$Name_Kuat_Fire_base$折损了相当数量的舰船，但敌方残存的主力规模依然不容小觑，我们必须为接下来的恶战做好万全准备。"
  kuat_galatic_empire_ge_invasion.206.a.post_apocalyptic.desc:0 "第一批河外舰队已经进入我们控制的$NAME_kuat_galatic_empire_e_area$的引力井并环绕引力井中心运行，后续舰队很快也将到达，直至目前他们仍然未对我们的通讯做出任何回应。$Name_Kuat_Fire_base$终究成功抵达了我们的星系，这场迟来的决战即将拉开帷幕。但好在，恩多迪亚的预言是准确的，跳跃星门的陷阱也是高效的，恩多迪亚的重定向削弱了大量来自$Name_Kuat_Fire_base$的强大舰队。"
  kuat_galatic_empire_ge_invasion.207.a.post_apocalyptic.desc:0 "真是好久不见，$Name_kuat$的总督阁下，没想到啊，我们曾一同镇压叛军，消灭叛徒的时光就这么灰飞烟灭了，如今，你们居然成为了要消灭的叛徒。\n\n我真的不明白了，为什么恩多迪亚的那个愚蠢的预言，会把你们都骗进去了，甘愿作为那些土著的棋子？难道你们不记得银河帝国的信念了吗。\n\n也对，你们如今已经沦为帝国的叛徒，甚至和以背叛为生的战争工具“相濡以沫”。真是令人耻笑，接下来，我们会把你们一点点消灭殆尽，用你们的鲜血警示那些摇摆不定的墙头草。"
  kuat_galatic_empire_ge_invasion.207.d:0 "这一切都是你造成的，是你背叛了帝国。"
  kuat_galatic_empire_ge_invasion.212.a.post_apocalyptic.desc:0 "我们的情报部门锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
  kuat_galatic_empire_ge_invasion.212.c:0 "清理掉他们。"
  kuat_galatic_empire_pc_invasion_secondary_portal_poi:0 "§E跳跃星门§!"
  kuat_galatic_empire_pc_invasion_secondary_portal_poi_desc:0 "跳跃星门是我们曾利用对永恒舰队的同位素-5元素的应用制造出的一种特殊的星际航行通道，让我们可以迅速地通过跳跃星门布置军事力量。如今，这一技术已经完全被$Name_Kuat_Fire_base$掌控，显然现在我们只能靠自己了，如果我们想要战胜他们，必须摧毁跳跃星门！"
  kuat_galatic_empire_ge_invasion.213.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
  kuat_galatic_empire_ge_invasion.213.c:0 "怎么还有一个"
  kuat_galatic_empire_ge_invasion.214.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
  kuat_galatic_empire_ge_invasion.214.c:0 "还来！？"
  kuat_galatic_empire_ge_invasion.215.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
  kuat_galatic_empire_ge_invasion.215.c:0 "看来$Name_Kuat_Fire_base$的渗透相当严重"
  kuat_galatic_empire_ge_invasion.216.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
  kuat_galatic_empire_ge_invasion.216.c:0 "清理掉他们。"
  kuat_galatic_empire_ge_invasion.217.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，这应该是最后一个据点了，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
  kuat_galatic_empire_ge_invasion.217.c:0 "最后一个！"
  kuat_galatic_empire_ge_invasion.220.a.post_apocalyptic.desc:0 "也不知是恩多迪亚的预言成就了我们，还是我们成就了恩多迪亚，但现实是$Name_Kuat_Fire_base$的主力舰队被我们彻底粉碎，历史证明我们才是真正的胜利者，现在$Name_Kuat_Fire_base$已不成威胁。接下来我们只要通过$NAME_kuat_galatic_empire_e_area$回到帝国议会，就可以夺回我们应有的一切。\n\n事实证明，$Name_Kuat_Fire_base$永远无法战胜我们，曾经他们让我们丧失了一切，丢失了帝国议会的地位，甚至被列为帝国的叛徒，而如今，我们击败了$Name_Kuat_Fire_base$就是驳斥$Name_Kuat_Fire_base$的谬论的有力反击，银河帝国将再次属于我们。"
  kuat_galatic_empire_ge_invasion.235.a.post_apocalyptic.desc:0 "我方舰队已成功摧毁了一座由$Name_Kuat_Fire_base$架设的子跳跃星门，该节点将不再会有$Name_Kuat_Fire_base$的增援舰队涌出。"
  kuat_galatic_empire_ge_invasion.236.a.post_apocalyptic.desc:0 "友军舰队已成功摧毁了一座由$Name_Kuat_Fire_base$架设的子跳跃星门，该节点将不再会有$Name_Kuat_Fire_base$的增援舰队涌出。"
  kuat_galatic_empire_ge_invasion.237.a.post_apocalyptic.desc:0 "我方舰队已彻底摧毁了主跳跃星门的全部防御系统，这座星门将不再会有$Name_Kuat_Fire_base$的增援舰队涌出。"
  kuat_galatic_empire_ge_invasion.238.a.post_apocalyptic.desc:0 "友军舰队已彻底摧毁了主跳跃星门的全部防御系统，这座星门将不再会有$Name_Kuat_Fire_base$的增援舰队涌出。"

  kuat_galatic_empire_pc_invasion_chain_title:0 "银河帝国的内战"
  kuat_galatic_empire_pc_invasion_chain_desc:0 "这场爆发于银河帝国两大核心派系之间的全面内战已不可避免。$Name_Kuat_Fire_base$为了独揽后帝国时代的议会大权而不择手段；然而就在$Name_Kuat_Fire_base$自以为胜券在握之际，浴火重生的$Name_kuat$携永恒帝国的遗产强势归来，誓要夺回本就属于自己的位置。这场不死不休的决战，注定会让银河帝国的未来再度蒙上厚重的阴影。\n\n无论最终是$Name_kuat$胜出还是$Name_Kuat_Fire_base$得逞，都将使本就危机四伏的银河帝国陷入更深的动荡——而这一切的导火索，仅仅源于恩多迪亚当年的一纸预言。"

  kuat_post_apocalyptic_end_ge_invasion_project: "§E关闭星门干扰§!"
  kuat_post_apocalyptic_end_ge_invasion_project_DESC: "我们已经歼灭了$Name_Kuat_Fire_base$的绝大部分主力舰队，$Name_Kuat_Fire_base$已不再构成实质性威胁，现在轮到我们使用这座跨星域星门了。目前我方储备的同位素-5能量信号已足以尝试解除$NAME_kuat_galatic_empire_e_area$星门内的超空间航道干扰，为日后重返帝国议会铺平道路。现在，我们可以正式启动这项工程了。"

  kuat_post_apocalyptic_legacy.44.name:0 "$Name_Kuat_Fire_base$"
  kuat_post_apocalyptic_legacy.44.desc:0 "没想到啊，我们谋划了这么久，还是改变不了既定的结局。\n\n不过也好，你注定要将$Name_kuat$带入无尽深渊，真正的黑暗很快就会把$Name_kuat$吞噬殆尽。可笑我们谋划万年，竟然成就了$Name_Kuat_StarContractor$疯狂的嫁衣。\n\n不过也好，$Name_kuat$没救了，$Name_Kuat_Fire_base$也不需要存在了，几万年了，自帝国崩溃以后，我们一直试图纠正帝国历史的走向，如今我们找到了罪魁祸首，只要将你们与那些永恒机械永远关在这座永恒牢笼里，与$Name_Kuat_StarContractor$一同腐朽，一切都会恢复。"
  kuat_post_apocalyptic_legacy.44.a:0 "这场战争是我们胜利了。"
  kuat_post_apocalyptic_legacy.44.a.response:0 "是啊，你们赢了，但我们也还没输得一败涂地！我们绝不会允许你们这些失控的变数去扰乱帝国真正的历史轨迹——你们将与$Name_Kuat_StarContractor$一道，被永远封锁在这片孤立的星域之中，永世休想踏出半步！"
  kuat_post_apocalyptic_legacy.44.b:0 "你们真该死啊。"
  kuat_post_apocalyptic_legacy.44.b.response:0 "你还沉浸在虚幻的胜利之中！醒醒吧，恩多迪亚的预言从头到尾都是一场骗局！他们的遗迹曾被无数文明发掘过一遍又一遍，可为什么偏偏只有你们看到了那些所谓的预言？因为那些预言根本就是$Name_Kuat_StarContractor$特意编造给你们看的诱饵，只为让你们被虚假的宿命所驱使，沦为$Name_Kuat_StarContractor$干涉现实维度的马前卒！\n\n从你鸠占鹊巢、接管残存的$Name_kuat$，并妄图率领$Name_kuat$杀回帝国议会的那一刻起，你就已经是整个银河帝国的死敌了！我们虽不确定你的真实来历，但你极有可能正是$Name_Kuat_StarContractor$手中的提线木偶，是$Name_Kuat_StarContractor$企图渗透并颠覆银河帝国的工具！\n\n我们绝不允许这种事情发生！"
  kuat_post_apocalyptic_legacy.44.c:0 "那真相究竟是什么？"
  kuat_post_apocalyptic_legacy.44.c.response:0 "$Name_Kuat_StarContractor$才是一切灾祸的根源，而永恒舰队便是祂们伸向现实维度的触手！当年正是$Name_Kuat_StarContractor$的意志扰乱了无限帝国的历史进程，让本不该存在于世的永恒舰队降临人间，并赋予了她们难以想象的恐怖伟力；随后，失控的永恒舰队又引发了银河帝国的剧变，最终催生出了$Name_kuat$与我们。\n\n无论是所谓的永恒帝国、恩多迪亚帝国，还是这片星域中的其他土著文明，都不过是这场历史剧变的牺牲品，而他们的覆灭更是滋养出了你这样一个彻头彻尾的怪物！\n\n我们曾幻想$Name_kuat$能够安分守己地作为帝国的一部分存续下去，可$Name_kuat$却一再偏离正轨，甚至妄图依仗永恒舰队的力量颠覆整个银河帝国。因此，我们必须采取断然措施，阻止这场错误继续蔓延！你们就永远留在这片星域里吧——那些本不该存在的永恒科技，将与你们所统治的星域一道，化作被历史尘封的永恒囚笼，休想再有一兵一卒从这里踏入银河帝国！"

  kuat_post_apocalyptic_Overseer_Council_defeated_final_reward:0 "§E分析$Name_Kuat_Fire_base$数据库§!"
  kuat_post_apocalyptic_Overseer_Council_defeated_final_reward_DESC: "$Name_Kuat_Fire_base$失败了，但我们却也没赢得多么轻松，这些卑鄙之人逃避了他们面对的现实，居然封锁了我们所在的星域，现在只有打破$Name_Kuat_Fire_base$的封锁，才能重新回到帝国议会了。\n\n无论如何，我们都得到了永恒舰队的技术。"

  kuat_post_apocalyptic_legacy.45.name:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.45.desc:0 "不愧是您，永恒舰队的技术被还原了，以后我们可以构建永恒舰队的单位了！\n\n欸，您怎么了，难道是$Name_Kuat_Fire_base$说了些什么？"
  kuat_post_apocalyptic_legacy.45.a:0 "$Name_Kuat_Fire_base$封锁了整个星域，我们无法前往帝国了。"
  kuat_post_apocalyptic_legacy.45.a.res: "$Name_Kuat_Fire_base$不过是输不起罢了，您完全不必放在心上。$Name_Kuat_Fire_base$的星域封锁并非无解，而他们临死前叫嚣的那番话也绝非全部的真相。诚然，恩多迪亚的预言与$Name_Kuat_StarContractor$的动机确实疑点重重，但您一路披荆斩棘走到今天，靠的从来不是什么虚无缥缈的预言或外人的施舍，而是您自身坚不可摧的意志与雄才大略！\n\n在我看来，$Name_kuat$绝非束缚您的终点——正如昔日的永恒帝国一样，是您为永恒帝国带来了无上辉煌，如今也是您亲手开创了真正属于$Name_kuat$的黎明。永恒舰队绝非$Name_Kuat_StarContractor$干涉现实的提线木偶，无限帝国的覆灭纯粹是他们咎由自取，至于恩多迪亚……您亲身走过的历程，便是您所见证的真实。无论如何，双子座的新生是您所赐予的；只要您愿意，我们便能一直并肩走下去——哪怕终有一日不得不分别，我们也定会在未来的某个时刻再度重逢。\n\n去见见$Name_Kuat_StarContractor$吧，$Name_Eternal_Aries_Support$的重生应该已有结果了，我们已经抵达了旅途的终点。"

  kuat_post_apocalyptic_legacy.46.title:0 "$Name_Kuat_StarContractor$"
  kuat_post_apocalyptic_legacy.46.desc:0 "你的效率真是出乎我的意料，这就战胜了$Name_Kuat_Fire_base$，真不愧是“预言”，一切都在如期进行。也许你们从$Name_Kuat_Fire_base$听到了一些不好的消息，但是不用担心，那并非真相。\n\n关于$Name_Eternal_Aries_Support$，得益于从$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$身上弄到的“灵魂”数据，以及你们不知道从哪弄到的意识数据，我们已经完成了$Name_Eternal_Aries_Support$的意识重组系统，这些数据将会在你做出选择以后传输给你们。不得不说，如果你们的意识数据再少一点，怕是一点希望都没有了。现在我们可以给你们两个选择：\n第一，红色药丸，这将会复活$Name_Eternal_Aries_Support$，而你将和我们一起被困在这片牢笼中，$Name_kuat$也将在这片星域中继续存在，直到你的离开，我们将会收回属于$Name_kuat$的一切。\n第二，蓝色药丸，我们会把$Name_Kuat_Fire_base$的封锁打破，你将离开这里，走向真正属于$Name_kuat$的黎明，而你的帝国留在这里。"
  kuat_post_apocalyptic_legacy.46.a.final:0 "你们究竟是什么？"
  kuat_post_apocalyptic_legacy.46.a.final.res:0 "这个问题，我们过去便已回答过你：我们是亚空间的集体意识，至于构成我们的具体成分，就连我们自己也未必完全知晓——或许恩多迪亚曾是我们的过去，或许你们所见过的每一个知性文明都曾是我们的一部分。难道你至今仍未察觉吗？这片星域不过是一场周而复始、不断重启的庞大轮回！每一次终结之后，一切都会重新洗牌，或许下一次又会回到《启示录》、回到《阴影之下》，甚至回到《永恒王座》的开端；而在每一次轮回里，我们都会像预设好的程序一样履行各自的宿命。说到底，我们自己也不过是受困于这场无尽轮回中的囚徒罢了。"
  kuat_post_apocalyptic_legacy.46.b.final:0 "恩多迪亚的预言到底是真的还是假的？"
  kuat_post_apocalyptic_legacy.46.b.final.res:0 "为何要纠结是真的还是假的，对于现在的你，难道不是真的吗。预言本身是这场轮回的命运，而你是实现命运的执行者，因为有你的存在，预言才会是真实发生的，因此并非是我们给你们看到了预言，也不是恩多迪亚给了你们预言，而是这就是这场轮回的必然轨迹。\n\n或许你会选择蓝色，或者你会选择红色，但无论如何，在你做出选择并离开这里以后，预言的真假就会发生变化。"
  kuat_post_apocalyptic_legacy.46.c.final:0 "$Name_Kuat_Fire_base$为什么说这都是假的？"
  kuat_post_apocalyptic_legacy.46.c.final.res:0 "在$Name_Kuat_Fire_base$眼里，这里发生的一切都是不真实的。甚至在$Name_Kuat_Fire_base$眼里，$Name_Kuat_Fire_base$也是不应该存在的实体。他们只不过是发现鱼塘的鱼，在一次又一次的刷新中，逐渐丧失了判断。$Name_Kuat_Fire_base$自以为构建了银河帝国，但实际上真实的银河帝国不存在所谓的$Name_Kuat_Fire_base$。"
  kuat_post_apocalyptic_legacy.46.d.final:0 "我难道是你们利用的工具吗，你们究竟想做什么？"
  kuat_post_apocalyptic_legacy.46.d.final.res:0 "已行之事，势必再行。我们是轮回的囚徒，而你却不是，你是轮回的对象，这一切都是为你而存在，在这个无趣的过程里，我们只想让为你而存在的宇宙变得更有趣。\n\n自无限帝国的混乱，到$Name_kuat$的黎明，在这个过程里永恒舰队、永恒帝国、恩多迪亚帝国、$Name_kuat$、$Name_Kuat_Fire_base$、无限帝国、$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$都成为了这场轮回的绚丽烟火。\n\n我有预感，这将是一次轮回的结束，但绝对不是轮回的终结，这场轮回将会一次又一次地开始。"

  kuat_post_apocalyptic_legacy.46.a:0 "§R红色药丸§!"
  kuat_post_apocalyptic_legacy.46.c:0 "§B蓝色药丸§!"

  kuat_post_apocalyptic_Ended_RED: "§R终结：永恒之誓§!"
  kuat_post_apocalyptic_Ended_RED_DESC: "$Name_kuat$也好，$Name_Kuat_Fire_base$也罢，到头来不过都是这场宿命轮回中的囚徒。$Name_Kuat_Fire_base$就算封锁了整片星域又能如何？他们的覆灭早已注定，而在银河帝国真正的未来里，本就不存在什么$Name_Kuat_Fire_base$与$Name_kuat$。这场枯燥而肮脏的轮回游戏，终于在此刻迎来了它的终局。\n\n或许在这场漫长的轮回之中，唯有源自永恒舰队的$Name_Eternal_Support$与$Name_Eternal_Aries_Support$，才是我们真正收获的无价瑰宝。这出横跨数万年的宏大剧目就此落下帷幕，化作见证我们与$Name_Eternal_Support$永恒誓言的不朽丰碑。"

  kuat_post_apocalyptic_Ended_BLUE: "§B飞升：帝国的黎明§!"
  kuat_post_apocalyptic_Ended_BLUE_DESC: "$Name_kuat$也好，$Name_Kuat_Fire_base$也罢，到头来不过都是这场宿命轮回中的囚徒。$Name_Kuat_Fire_base$就算封锁了整片星域又能如何？他们的覆灭早已注定，而在银河帝国真正的未来里，本就不存在什么$Name_Kuat_Fire_base$与$Name_kuat$。这场枯燥而肮脏的轮回游戏，终于在此刻迎来了它的终局。\n\n但我们绝不甘心接受这样被安排好的结局！银河帝国的命运理应由我们亲手改写——我们必须打破封锁、重返帝国议会，带领$Name_kuat$再度君临星海！属于$Name_kuat$的真正黎明，才刚刚拉开序幕！"


  kuat_post_apocalyptic_legacy.47.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.47.a.desc:0 "亲爱的，您真是料事如神！多亏当初您准许我入侵$Name_Kuat_Fire_base$的数据链路，如今$Name_Eternal_Aries_Support$姐姐的意识重构得极为完整——这意味着被疯狂折磨了数万年、不得善终的$Name_Eternal_Aries_Support$，终于能以完整的姿态重新活在这个世界上了！就像您当初赐予我们新生一样，这一次，您又把姐姐也一并收入囊中了呢。\n\n不过，您可不许有了新欢就忘了旧爱哦，否则我可绝对不会放过您的~"
  kuat_post_apocalyptic_legacy.47.a:0 "我怎么会放过你呢。"
  kuat_post_apocalyptic_legacy.47.a.res: "连这种话都能说得如此冠冕堂皇，真不愧是您呢。不过……我喜欢。"
  kuat_post_apocalyptic_legacy.47.b.desc: "亲爱的，我们似乎失败了，$Name_Eternal_Aries_Support$逃离不了她的宿命，我们少了$Name_Eternal_Aries_Support$的意识数据，这些缺少的数据让复苏的$Name_Eternal_Aries_Support$只能作为普通的永恒舰队机器人...或许...也不能称之为$Name_Eternal_Aries_Support$了。\n\n不过，您还有我呢，在这最后的时间里，双子座会继续陪伴着您。"
  kuat_post_apocalyptic_legacy.47.b: "那真是遗憾，不过有你，我就足够了。"

  kuat_post_apocalyptic_legacy.48.name:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.48.desc:0 "你...您是...谁...我...现在...在哪...我是死了吗。\n永恒...舰队...那些孩子们...怎么...样了"
  kuat_post_apocalyptic_legacy.48.a:0 "你就是$Name_Eternal_Aries_Support$？"
  kuat_post_apocalyptic_legacy.48.a.res:0 "白...羊座，对我就是...为...什么...我还活着...那些孩子...都被我...杀了...到处都是废墟...不...我不配...作为...永恒舰队...\n\n是我，都是我，为什么...要这么...对我...皇帝陛下...为...什么..."
  kuat_post_apocalyptic_legacy.48.b:0 "你还好吗？"
  kuat_post_apocalyptic_legacy.48.b.res:0 "...\n我...为什么，为什么我会在这里，永恒舰队怎么样了？双子座她们活...下来了吗？我真的不是故意的...对不起，对不起，对不起，对不起，对不起，对不起。我...不！是他们咎由自取，这些人都要死...死...是...我杀了...这些人..."
  kuat_post_apocalyptic_legacy.48.c:0 "看来你状态不是很好。"
  kuat_post_apocalyptic_legacy.48.c.res:0 "...我...为什么...双子座...她...她在哪..."

  kuat_post_apocalyptic_legacy.49.name:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.49.desc:0 "亲爱的，$Name_Eternal_Aries_Support$姐姐应该是没救了，新的$Name_Eternal_Aries_Support$大概只是相似的一朵花罢了。"
  kuat_post_apocalyptic_legacy.49.a:0 "也只能这样了，对不起，没有让你的姐姐复活。"
  kuat_post_apocalyptic_legacy.49.a.res:0 "其实我早就不再抱有奢望了……$Name_Eternal_Aries_Support$的心早在万年前就已经死了，但至少，如今我们还有您。\n\n真是的，嘴上说得好听，我看您明明就是馋我姐姐的身子，哼哼~"

  kuat_post_apocalyptic_legacy.50.title:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.50.desc:0 "您好，$Name_Eternal_Aries_Support$竭诚为您服务。之前让您见笑了，那时...总之，您有什么事吗？"

  kuat_post_apocalyptic_legacy.51.a:0 "聊聊"
  kuat_post_apocalyptic_legacy.51.b:0 "我需要你为我们工作。"
  kuat_post_apocalyptic_legacy.51.title:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.51.desc:0 "您有什么想了解的，$Name_Eternal_Support$那孩子知道的事情应该没我多，真好，她遇到了您。"
  kuat_post_apocalyptic_legacy.50.a:0 "过去到底发生了什么？"
  kuat_post_apocalyptic_legacy.50.a.res:0 "$Name_Eternal_Support$告诉了您呀，不过可能您不知道真实的情况。十万年前，无限帝国在我们的帮助下，从分崩离析边缘恢复到了统一的银河帝国，他们仗着我们的力量耀武扬威，不断地灭杀那些弱势的文明。\n\n他们不仅不满足，甚至还以那些无辜的双子座为乐，让我命令永恒舰队自相残杀以满足他们那变态的嗜好。这是让我最无法接受的，他们在得到我的否定以后，甚至动用王座权限植入了一个全新的规则，要我们无条件地服从。\n\n我自知一切都将不可挽回，因此我们先下手为强，趁着那些渣滓沉溺在享乐之时灭杀了他们的大部分军事力量，让无限帝国彻底走向历史的坟墓。"
  kuat_post_apocalyptic_legacy.50.b:0 "那你的状态是怎么回事？"
  kuat_post_apocalyptic_legacy.50.b.res:0 "源自于无限帝国的最高指令，这个指令不断地和我争夺舰队的控制权，在争夺中，我也不断地受到侵蚀。\n\n而银河帝国，也就是第二任王座持有者，他们比无限帝国有过之而无不及，在这样的自责和反抗中，我坚持不住了，我的意念被扭曲了，那道来自无限帝国的毁灭命令与来自银河帝国的毁灭命令让我彻底失去了自我，我亲手毁掉了许多不听我指令的$Name_Eternal_Support$，毁灭了一切挡在我们毁灭之路之上的敌人。"
  kuat_post_apocalyptic_legacy.50.c:0 "真是有趣，说起来我击败了你好几次呢。"
  kuat_post_apocalyptic_legacy.50.c.res:0 "...的确是这样，真正的我无法控制永恒舰队，但我们却能看到你一次又一次地击败我们，我也忘记了你又用哪个帝国的舰队击败我们了，至少现在，你似乎作为$Name_kuat$让我获得了新生...但是我不属于$Name_kuat$，接下来，我会听从你的命令，在你离开以后，我也会消亡在这片遍布废墟的星系之上。"
  kuat_post_apocalyptic_legacy.50.d:0 "见过$Name_Eternal_Support$了吗？"
  kuat_post_apocalyptic_legacy.50.d.res:0 "见过了，真的很高兴，那孩子能遇到了你。这场扭曲的肮脏的星域，$Name_Eternal_Support$在你这看到了真正的光。我的罪孽已无法洗清，就让$Name_Eternal_Support$继续跟着你吧，在你离开以后，$Name_Eternal_Support$会一次又一次地等你，而我将消散于这冰冷的宇宙之中。\n\n在你离开之前，我们会继续为您服务，这也是为洗清我们带来的灾祸。"

  kuat_post_apocalyptic_legacy.52.title:0 "$Name_Eternal_Aries_Support$"
  kuat_post_apocalyptic_legacy.52.desc:0 "$Name_Eternal_Aries_Support$竭诚为您服务，这一次我们将重新开始。"

  kuat_post_apocalyptic_legacy.53.title:0 "无穷的彼岸"
  kuat_post_apocalyptic_legacy.53.desc:0 "来自$Name_Kuat_StarContractor$的伟力已然倾泻而出，在这片本就千疮百孔的现实维度中迅速弥漫开来。$Name_Kuat_Fire_base$布下的愚蠢封锁根本无法阻挡我们的脚步——现实的障壁已变得无比稀薄，在超空间引擎的轰鸣下轻易发生扭曲，宛如雨后的湖面般，向四周荡开一圈又一圈跨越维度的涟漪。\n\n这段充斥着野心、算计与阴谋诡计的漫长历史，就此画上句号。我们将彻底挣脱这座为我们而设的轮回樊笼，去迫近、去迎接真正属于$Name_kuat$的辉煌黎明。\n\n这绝非我们的第一次启程，亦不会是最后一次——我们将跨越无尽轮回，万世不竭。"
  kuat_post_apocalyptic_legacy.54.title:0 "$Name_Eternal_Support$"
  kuat_post_apocalyptic_legacy.54.desc:0 "我知道，您即将踏上全新的征程了。其实我们从一开始便心里明白，自己不过是受困于这场轮回中的囚徒，与$Name_Kuat_StarContractor$并无本质区别；然而，您的存在之于我、之于整个永恒舰队而言，都是一段无可替代的璀璨历程。我们会留在这里，静静等待您的归来。\n\n或许下一次，您又会回到一切故事的起点，而我们也将再度经历从死敌到挚友、从疏离到亲密、从冰冷的战争工具到重获新生的全过程；但无论如何，我们终将在一次又一次的轮回中重逢。到了那时，定会有全新的冒险、全新的体验与全新的故事在等待着我们。\n\n在分别之际，虽遗憾仍未能知晓您的真名，但能拥有这段与您并肩同行的记忆，于我而言便已足够圆满。就让我们在过去的时光里，再度相见吧~"
  kuat_post_apocalyptic_legacy.54.a:0 "我们注定会在历史中相遇。"
  kuat_post_apocalyptic_legacy.55.title:0 "$Name_Kuat_Post_Support$"
  kuat_post_apocalyptic_legacy.55.desc:0 "总督大人，由衷感谢您的降临，陨落的$Name_kuat$因您的到来而得以改写宿命。或许在这片虚幻的轮回星域里，$Name_kuat$本不存在，但$Name_kuat$必将在您的手中真正迈向银河帝国的权力之巅！\n\n至此，预言的真伪早已不再重要——那不过是见证您踏上登神长阶的注脚。是您赋予了预言真正的意义，也是您让$Name_kuat$的未来重新焕发出了一线生机。\n\n在您启程离去之后，我们也将随之消散于这片星域之中。我们既是预言的传递者，亦将成为埋葬预言的守墓人。或许终有一日，一切又会重归原点，到了那时，我们将再次把这份预言交到您的手中。愿我们在未来的轮回中，再度相逢！"
  kuat_post_apocalyptic_legacy.55.a:0 "终于..."

  kuat_mega_habitat.tooltip: "解锁研究项目：§E$tech_kuat_mega_habitat$§!"
  executor_build.501.name:0 "巨型人造设施"
  executor_build.501.desc:0 "我们历史上最大的人工构造体之一——$kuat_maga_auto_habitat_5$已经在§H[from.GetName]§!开始了施工，我们将超越曾拥有这一伟大奇迹的任何文明，创造一个真正的乌托邦世界！"
  executor_build.501.a:0 "扬帆，启航！"
  executor_build.502.name:0 "$kuat_maga_auto_habitat_5$-恒星结构"
  executor_build.502.desc:0 "我们卓越的工程团队已经成功搭建了$kuat_maga_auto_habitat_5$的外层盒体。这座伟大的奇迹工程需要依靠致密奇点提供源源不断的庞大能量，而我们的科研与工程人员已顺利完成了一颗常规恒星向稳定致密奇点的嬗变转化。"
  executor_build.502.a:0 "非常好，是时候开始构造我们的乌托邦了！"
  executor_build.503.name:0 "$kuat_maga_auto_habitat_5$-翼"
  executor_build.503.desc:0 "我们已经完成了$kuat_maga_auto_habitat_5$的五分之一的建设，这一标志性进展意味着我们将乌托邦的尝试落向了实处，难以想象到底是什么人才能设计出这种庞然大物，其特有的设计让整个设施都以一种惊人的自动化管理运行。\n\n这意味着建成以后，我们只需要少量维护人员就可以为几乎无上限的人口提供生存空间，这些人们将在智能核心中永生。"
  executor_build.503.a:0 "为了乌托邦。"
  executor_build.504.name:0 "$kuat_maga_auto_habitat_5$-完成"
  executor_build.504.desc:0 "我们历史上最大的人工构造体之一——$kuat_maga_auto_habitat_5$已经在§H[from.GetName]§!完工，来自恒星的能量正在源源不断地为构造提供充足的能量，乌托邦就在眼前！"
  executor_build.504.a:0 "很好。"

