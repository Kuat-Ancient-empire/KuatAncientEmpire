l_simp_chinese:
 origin_post_apocalyptic_kuat:0 "§E【夸特的黎明】后启示录§!"
 origin_post_apocalyptic_kuat_desc:0 "这是一颗位于边缘世界外的平凡行星，曾经是一个被毁灭的繁荣文明起源之地，他们赖以生存的环境造就了他们战胜$Name_kuat$的力量。而现在，$Name_Kuat_Fire_base$替代了我们的角色，他们篡夺了永恒舰队，篡夺了帝国的权势，更篡夺了帝国的荣耀。夸特造船厂尚且能以企业的身份留在银河帝国，而我们这些来自$Name_kuat$的丧家之犬在偏远之地只能惶惶不可终日。\n\n不，这不是我们的应有的结局，我们将会让$Name_kuat$重新回到该有的的地位，那些该死的战争机器，我们将会给他们送上最后的葬曲，而银河帝国的荣耀终将被我们夺回！"
 origin_tooltip_post_apocalyptic_kuat_effects:0 "§H我们将作为夸特帝国开始这场游戏§!\n将使用§E固定三星星系§!星系开局\n该开局将具备$think_tank_ruined$，$dyson_sphere_ruined$，$matter_decompressor_ruined$§!\n§R我们将失去所有开局舰队，并与$Name_Kuat_Post_Support$建立宗主关系§!\n\n该起源属于《夸特的黎明》剧情后传。"
 Name_Post_Kuat_capital:"遗落之都"
 Name_Post_Kuat_System:"未知星域"
 Name_Kuat_Post_Support:"§E索伦星际舰队§!"

 kuat_post_apocalyptic_legacy.1.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.1.desc:0 "尊敬的总督大人，我们终于抵达了$Name_Post_Kuat_capital$，现在这里就是我们未来的根基，$Name_kuat$的遭遇已成定局，但我们不能只沉浸在过去。\n\n我们的错误决策被$Name_Kuat_Fire_base$利用，一步错步步错，因此整个$Name_kuat$被拖入了万丈深渊，尽管造船厂依旧还能保留下来，但造船厂已被$Name_Kuat_Fire_base$国有化，不再接受我们的命令，银河帝国的议会席位已经没有我们的一席之地。\n\n但是请您不要放弃，$Name_kuat$的未来依然掌握在我们手中，上一任总督就已经从未知星域找到了一些线索，这些线索完美预言了我们如今的局面，而其中正好就存在我们未来夺回我们一切的方法，现在我们的最后一支舰队已经抵达了预言中的星系，我们只要进一步找回那些在之前行动中遗落的技术，我们就能重新与$Name_Kuat_Fire_base$抗衡，并夺回我们应有的地位！"
 kuat_post_apocalyptic_legacy.1.a:0 "夺回我们的荣耀！"

 kuat_post_apocalyptic_legacy.2.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.2.0.desc:0 "$Name_Kuat_Post_Support$舰队司令很高兴为您服务，有什么需要我们帮忙的？"
 kuat_post_apocalyptic_legacy.2.1.desc:0 "$Name_Kuat_Post_Support$舰队司令很高兴为您服务，还有什么需要了解的吗？"
 kuat_post_apocalyptic_legacy.2.a:0 "你们是哪个部分的，为什么我没有印象？"
 kuat_post_apocalyptic_legacy.2.a.res:0 "$Name_Kuat_Post_Support$是$Name_kuat$秘密建立的一支小规模舰队，其目的是在出现预言局面时的底牌，我们的职责是带您抵达这片曾经被我们的舰队蹂躏的星系。而之前，一切安好，我们也就不会出现在您的面前，在这片星域上，隐藏着$Name_kuat$复兴的关键，我们需要您追回这些注定属于$Name_kuat$的财产。"
 kuat_post_apocalyptic_legacy.2.b:0 "为什么是我，之前的总督去哪了"
 kuat_post_apocalyptic_legacy.2.b.res:0 "这是命运注定的，$Name_kuat$的黑暗将会在您的带领下终结，黎明的破晓即将出现。之前的总督并不知晓这些，他们只是委员会的权力代表。\n\n如今$Name_kuat$已经崩溃，他们也该与之前的$Name_kuat$一同坠入深渊，银河帝国被$Name_Kuat_Fire_base$夺取，真正的$Name_kuat$将在此重生，我们期待真正的银河帝国建立的那一天。"
 kuat_post_apocalyptic_legacy.2.c:0 "预言？什么预言？"
 kuat_post_apocalyptic_legacy.2.c.res:0 "这是上一任总督不甘自身命运，不甘$Name_kuat$被操纵的现状，派我们深入未知星域寻找能够解决困境的办法。\n\n我们在一片巨大的未知银河系发现了这一线索，统治这片星域的恩多迪亚帝国，用他们独特数学计算预言了我们未来的灭亡，因此我们遵循了这一预言，我们毁灭了恩多迪亚帝国，无论他们是否愿意。在$Name_kuat$的灭亡以后，真正的$Name_kuat$就会破茧而出，我们将夺取我们曾经无法染指的一切。"
 kuat_post_apocalyptic_legacy.2.d:0 "那我们到底要找些什么，古代技术？"
 kuat_post_apocalyptic_legacy.2.d.res:0 "也许是古代技术，也可能是我们的技术，预言并不清晰，我们只能确定，我们需要找到恩多迪亚帝国遗址中真正被掩埋的瑰宝，并借此重新找回改进我们的技术。\n\n我只能带您抵达这里，我们目前没有足够的技术人员和储备，也无法重新建造我们自己的舰船，但好在这片星域有些简单的舢板可以制造。"
 kuat_post_apocalyptic_legacy.2.e:0 "为什么$Name_kuat$这么快就崩溃了"
 kuat_post_apocalyptic_legacy.2.e.res:0 "追溯根本，或许是是预言在高层的传播，尽管委员会的委员们不相信这一切，但是他们依旧为此变得更加疯狂，在委员会控制之下，$Name_kuat$借助研究那些无用的战争机器的名字，暴力寻找破解预言的方法。\n\n而正是因为这一行径，我们毁灭了恩多迪亚帝国，毁灭了各种文明，并招来了有史以来最强大的敌人————永恒帝国，他们摧毁了我们引以为傲的舰队，并让$Name_Kuat_Fire_base$坐享其成。\n\n$Name_Kuat_Fire_base$表面与我们和谐共处，实际上他们借这个机会落进下石，一举夺取了议会中属于我们的席位，并国有化了我们的造船厂，促使我们的根基崩塌。\n\n无论怎么讲，$Name_kuat$的复兴不可阻挡，帝国万岁。"

 kuat_post_apocalyptic_legacy.3.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.3.desc:0 "预言果然没错，您以最快的速度找到了恩多迪亚帝国的一处重要遗迹的线索，这座星域曾是我们与恩多迪亚帝国战争的核心战场之一，我们在这里投入了多支大规模的舰队，并彻底终结了恩多迪亚的永恒堡垒的研发。\n\n如今，恩多迪亚帝国的遗迹或许已经被很多文明关顾，但遗迹并未被完全发掘，那些愚蠢的文明是不知道在这遗迹的深处才是真正的秘密所在，就连我们，也是在这场战争中，通过探测器发现的。\n\n在这片区域，恩多迪亚人构建了多层构造，试图封存他们逆向和研究的技术，并为未来的着卷土重来做好准备，无论怎么讲，这些都便宜了我们。"
 kuat_post_apocalyptic_legacy.3.a:0 "非常好"
 kuat_post_apocalyptic_legacy_3_find_A_facility:0 "定位$Name_A_1$坐标"
 kuat_post_apocalyptic_legacy_3_find_A_facility_DESC:"$Name_A_1$是恩多迪亚帝国的重要军事设施，他们在这片星区建立了大量的军事研究所，他们试图在此复刻我们的舰船技术，在我们与恩多迪亚帝国的战争中，这片星区不得不被完全摧毁，而恩多迪亚人在这片星域深处埋藏了他们卷土重来的希望，如今这将是我们卷土重来的砝码。"

 kuat_post_apocalyptic_legacy.4.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.4.desc:0 "我们的研究人员已经完成了对$Name_A_1$星系的定位工作，现在我们只需要进入这片星区，恩多迪亚人或许也没想到，他们埋藏的希望最后竟然成为我们的嫁衣。"
 kuat_post_apocalyptic_legacy.4.a:0 "非常好，舰队做好准备。"

 kuat_legacy.21.kuat_post_apocalyptic_legacy.desc:"我们来到了目标星系，正如$Name_Kuat_Post_Support$所言，这片星系被充斥着惨烈战争之后的残骸，尽管这些帝国级重型巡洋舰已经面目全非，但我们依旧能感受到这场战斗的惨烈程度。\n\n除此之外，这片星区已经可以证明有多个文明的勘探队抵达，希望我们的东西没有被夺走。搜查整个星环，掘地三尺也要把恩多迪亚人隐藏的秘密都找出来。"

 kuat_legacy.22.kuat_post_apocalyptic_legacy.desc:"总体来看，$Name_A_1$受损非常严重，看来我们曾经对恩多迪亚帝国的核心星区造成了相当严重的破坏。然而结合我们的资料和当前的的结果来看，$Name_A_1$的恒星不该是一个巨大的黑洞，或许在我们之后这里又发生了些什么。"

 kuat_legacy.23.kuat_post_apocalyptic_legacy.desc:"正如$Name_Kuat_Post_Support$所料，这座陨落的要塞，被巨大的舰船残骸和建筑废墟笼罩，整个星环成为了恩多迪亚帝国对抗我们的要塞，而这座要塞依旧无法阻挡我们强大的舰队。\n\n在这片废墟之上我们发现了部分临时住宅建筑，看时间来说应该是之前的文明的勘探人员，看来这里的表层结构已经被搜刮一空，我们该寻找更为深层的区域。"

 kuat_legacy.24.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在这片废墟的调查陷入了困境，我们发现了多个文明的勘探队抵达的痕迹，甚至还有曾经被我们毁灭的一个帝国，他们的勘探队也发现了这里，或许他们就是在这里带走了一部分我们遗落在此的技术。\n\n除此之外我们还发现了一座用于传输录像的设备，我们在截取和分析里面的录像数据时发现，这竟是曾经恩多迪亚人的警示。看起来这些恩多迪亚人对他们的野心和行为感到了悔恨与自责。\n\n真是有趣，这些恩多迪亚人似乎并不知道真相，$Name_Kuat_Post_Support$的资料库中显示，恩多迪亚人因为我们预言未来而走向灭亡，他们在预言中就知道了自己的命运，他们为了规避命定结果，做出了这场战争的决定，没想到这些民众居然完全不知道。\n\n[leader.GetName]仍未找到其他更有价值的信息。"

 kuat_legacy.25.kuat_post_apocalyptic_legacy.desc:"这些恩多迪亚人藏东西可真够深得，[leader.GetName]在多轮勘探无果以后竟然在一处陡峭峡谷的崖壁上找到了部分恩多迪亚的军用机器人残骸，这些残骸为我们指明了方向。\n\n我们在山崖中找到了一处秘密研究设施，幸运的是这些仪器仍然可以使用，在数据解密完成以后，[leader.GetName]惊喜的发现，这里面竟然指向着一处更为隐秘的研究设施。\n\n该设施主要是尝试解析来自我们的轻型巡洋舰系统，而且进程已相当的圆满，或许只要恩多迪亚人重新接管这个星系就能重新建造我们的强大舰船。除此之外，这座要塞中有价值的信息不多，但是我们还是拿到了本土的跃迁技术和星门穿越技术。"

 kuat_post_apocalyptic_legacy.5.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.5.desc:0 "您的效率真是令人惊讶，这么快就完成了对$Name_A_1$的初步调查，正如您发现的一样，恩多迪亚人在这里与我们的舰队发生了一场惨烈的交锋，但我们成功赢得了这场战争的胜利。\n\n这场战争本可以避免，但是贪恋的委员们不甘心帝国的结局，他们的疯狂也被恩多迪亚帝国所预见，而恩多迪亚帝国也在$Name_Kuat_Fire_base$的蛊惑和他们对命定结果的不甘的推动下，这场冲突彻底爆发，最终演变为这种结果。\n\n这些恩多迪亚人收集了我们的小型舰船技术，这对我们现在来说是非常有用的，这也算他们死得其所了，不过似乎您还没找到。无论如何，现在我们该前往$Name_B_1$，我们已经确认了其星图坐标。"
 kuat_post_apocalyptic_legacy.5.a:0 "好的。"

 kuat_legacy.50.kuat_post_apocalyptic_legacy.desc:"我们来到了目标星系，正如$Name_Kuat_Post_Support$所言，这片星系被充斥着惨烈战争之后的残骸，但相比$Name_A_1$来说，并没有被毁坏的特别严重，相对于$Name_A_1$的换代来说，这片星区的环带保留了一定的完整性，或许有助于我们的进一步调查。\n\n除此之外，$Name_Kuat_Post_Support$为我们提供了这个星系的一些更为重要的信息，这个星系曾经是恩多迪亚帝国的舰船武器研究中心，其中主要是逆向我们的主力舰技术，考虑到在$Name_A_1$构建的护航舰技术的完成度相当的高的情况，我们或许能在这里直接夺回我们遗落的主力舰设计图纸。"

 kuat_legacy.51.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]带着她的科研团队抵达了星环结构区域的轨道，俯瞰被损毁的无边无际的建筑废墟，这些都是$Name_kuat$的舰队造成的，在那场惨烈的战争中，恩多迪亚人用尽了一切能够反抗的武器，但这仍然阻断不了我们的舰队抵达星环的上空，那一天以后，城市崩塌，星环破碎，最终成为了这个样子。\n\n尽管这座星环结构已经完全成为了废墟，但是[leader.GetName]判断，我们应该在这里进一步的搜索，与$Name_A_1$一样，有一些不为人知的秘密设施。"

 kuat_legacy.52.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在星环结构上的调查陷入了困境，就在危机时刻，$Name_Kuat_Post_Support$为我们传输了一些高价值的信息，$Name_Kuat_Post_Support$过去在这片结构的调查中发现，恩多迪亚的研究设施周围一定存在着一种具备特殊频段的信号收发器，这一收发器能发射出极为微弱而与众不同的辐射，我们可以借助仪器寻找这一线索。"

 kuat_legacy.53.kuat_post_apocalyptic_legacy.desc:"这一方法不仅被我们使用，[leader.GetName]发现，之前的多个勘探队都利用了这种方法，根据$Name_Kuat_Post_Support$的历史记载来看，曾经有多个文明都从这里获得了他们意料之外的收获，其中正有击败$Name_kuat$的永恒帝国。\n\n这让我们的勘探队员们心中一沉，这里的遗迹难道已经被搜刮干净了吗，我们还需要进一步的调查。"

 kuat_legacy.54.kuat_post_apocalyptic_legacy.desc:"在沉闷的氛围中，[leader.GetName]带领他的团队在找到了这座星环遗迹的控制中心废墟，尽管已经被轰炸成了废墟，但依旧能想象这座星环心脏曾经的宏伟。\n\n[leader.GetName]进入后发现整个控制中心的设备都已经完全停止运转，而在停止运转的设备中，一个AI设备的停运时间似乎与其他设备有明显不同，[leader.GetName]决定对该AI设备的信息进行提取分析，或许能找到我们想要的信息。"

 kuat_legacy.55.kuat_post_apocalyptic_legacy.desc:"在随后的一段时间里，[leader.GetName]成功的对AI设备的信息进行了采样分析，将其转录后发现，这个AI在千年前为永恒帝国的探险者传递了一些重要的信息，AI告诉了永恒帝国在控制中心中隐藏着恩多迪亚留下来的舰船技术，而这些技术残留的图像显示，这正是我们的主力舰船技术，恩多迪亚人居然还早已成功逆向我们的技术。\n\n这些信息都太令人难以接受，我们需要进一步了解更多有价值的信息。"

 kuat_legacy.56.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]带着疑惑，对整个控制中心的有效数据进行了关联分析，[leader.GetName]发现了一个震惊的事实，恩多迪亚人留下了一个影像，他们告诉了那些外来者，甚至包括永恒帝国，拿到我们的科技蓝图，并在暗地里提示，有人正在监视他们。\n\n[leader.GetName]认为，或许这并不是指向我们，$Name_kuat$正在对永恒舰队开展军事行动，无法观察这些土著们的行动，或许，这是暗示会和$Name_Kuat_Fire_base$有关，无论如何我们都需要更多的信息。"

 kuat_lagacy.74.kuat_post_apocalyptic_legacy.desc:"与$Name_A_1$相似的是，我们的研究人员在对整个星区的周期性勘探中发现，在一处损毁星环带中，我们找到了一些有价值的线索，我们在损毁的星环带中发现了一座先驱城市，这一城市设施曾经被我们的舰队完全摧毁，而如今其中的部分建筑居然奇迹般地修复了一些。\n\n我们的研究人员认为，这里被其他势力的勘探队调查过，或许是有一些高价值线索隐藏在其中，因此我们也必须对该处进行全方位的调查。"

 kuat_lagacy.251.kuat_post_apocalyptic_legacy.desc:"我们的研究人员一直都在对$Name_A_1$进行无间断地勘探，功夫不负有心人，我们成功找到了之前在山崖中找到的线索指向的隐秘研究设施所在地\n\n这座研究设施在环带的另一侧，该处也在当年的战争中被摧毁殆尽，如今我们需要重回这座环带，与之前的环带相似，这段环已经被我们炸成了一片废墟，整个环带上的人造设施没有一处是完好的。\n\n§Y但我们不能放过这里，我们必须重新对这篇区域进行无死角的搜查。§!"
 kuat_post_apocalyptic_kuat_eternal_starbase:"搜查$Name_A_1$"
 kuat_post_apocalyptic_kuat_eternal_starbase_DESC:"正如$Name_Kuat_Post_Support$所说，我们还没有找到恩多迪亚人藏在这片星区里的技术，他们在这里埋藏了相当完善的技术资料，只为恩多迪亚帝国的卷土重来。而他们研究的一切都是属于我们的，他们偷窃的$Name_kuat$技术也该还给我们了。\n\n调查这里，任何角落都不要放过！"

 kuat_post_apocalyptic_kuat_eternal_ship:"勘探[ancient_shadow_place_B.GetName]"
 kuat_post_apocalyptic_kuat_eternal_ship_DESC:"我们的研究人员已经确定，[ancient_shadow_place_B.GetName]上发生的离奇事件或许是这片星域我们尚未找到的高价值线索的来源，目前我们已经对这片曾经被我们轰炸成废墟的先去城市进行全方位的扫描。\n\n接下来我们就该派遣地面部队进行调查。"

 kuat_post_apocalyptic_legacy.6.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.6.desc:0 "我们必须要赞叹您的雄才伟略，不到一个世纪的时间，您就成功收回了大量遗落在恩多迪亚手中的技术。\n\n您带来的高价值信息对我们理清楚预言的真相具有极大的帮助，恩多迪亚人的预言预测到了自己的结果，他们不惜更快的走向命定的结果为代价，也要作为那只发动风暴的蝴蝶，事实证明，命运并非一成不变，您的出现或许将是我们走向真正的结局的钥匙。\n\n我们已经找到了$Name_C_1$的坐标。出发吧，帝国永存。"
 kuat_post_apocalyptic_legacy.6.a:0 "命运吗？"

 kuat_post_apocalyptic_legacy.7.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.7.desc:0 "不得不说您的进展真是令人出乎意料，这么快您就找到了恩多迪亚隐秘遗迹，这座遗迹中埋藏着恩多迪亚偷窃我们的技术贮存，或许曾经我们看不上眼，而如今，我们必须利用这些贮存，重新恢复我们的军事技术。\n\n等您能完全掌握全部的舰船技术的时候，就是$Name_Kuat_Post_Support$重新加入作战的时刻。"
 kuat_post_apocalyptic_legacy.7.a:0 "帝国永存。"

 kuat_post_apocalyptic_legacy.8.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.8.desc:0 "依据我们曾经收集的信息来看，这座星环的状态在恩多迪亚帝国陨落以后并未发生比较明显的变化，这意味着我们将会在这里收获属于我们的一切。我们研究了历史中迁来此处挖掘的几个文明，他们仅仅只是找到了恩多迪亚的部分遗产。\n\n我们已经确定被带走的是永恒堡垒，这一堡垒技术我们或许需要更进一步的调查，好在他们并未找到恩多迪亚隐藏的$Name_kuat$舰船技术，现在是我们收获真正的成果的时候了。"
 kuat_post_apocalyptic_legacy.8.a:0 "帝国永存。"

 kuat_legacy.181.kuat_post_apocalyptic_legacy.desc:"我们的勘探人员接到调查该星环遗迹的命令以后，便全力投入工作当中，我们已经成功对整个星环周边的空间稳定进行了详细的分析，据点区域相对处于一个安全的范围，尽管整个星环都被我们轰炸后的废墟所覆盖，但我们仍然成功找到了一些高价值的线索。\n\n我们的研究人员发现这座废墟当中存在着一种较为微弱的能量辐射，这一辐射与我们之前发现的山崖上的恩多迪亚帝国实验室中的信号仪器有一定的相似性。现在我们已经开始着色对其进行调查。"
 kuat_legacy.181.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在接到我们的指示以后，他带领他的团队通过我们的轨道飞船接近了此处环带，这里的环带与我们之前位于$Name_A_1$的星域登陆的环带具有一定的相似程度，这里同样是一个由自动设施组成的非宜居环带，初步的研究和地质勘探信息来看，被我们摧毁的这片区域，应该是作为其恩多迪亚帝国的一处军事研究供给设施。\n\n值得我们注意的是，这一设施所在区域在$Name_kuat$轰炸以后已经完全变为了废墟，而如今居然奇迹般地修复了一部分，我们必须找到其中的缘由。"

 kuat_legacy.182.kuat_post_apocalyptic_legacy.desc:"令人满意的是，我们的研究人员对这一微弱的能量辐射反应的溯源进展相当的顺利，我们顺利的找到了来自恩多迪亚帝国的研究设施外围。\n\n在我们找到外围的一路上我们发现这里实际上已经有了多个外来种族的勘探队的痕迹，相当一部分人留下来的记载中写到得到了他们意想不到的收获，这与$Name_Kuat_Post_Support$收集的信息不谋而合，看来我们找回技术的进展相当的顺利。"
 kuat_legacy.182.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]通过对整个环带的监控中，记录了其被轰炸以来的变化数据，在这段时间内，整个废墟的建筑都在以一种极为缓慢的速度进行修复，这不符合我们所了解的熵增定律，这座环带正在变得更加有序。\n\n这一现象引起了我们的团队的注意，现在已经开始着手对这一现象进行调查。"

 kuat_legacy.183.kuat_post_apocalyptic_legacy.desc:"我们的研究人员发现，其他势力的勘探队都前往了一处高塔，我们的勘探人员已经确定那曾经是这座星环设施的指挥中心，但是$Name_Kuat_Post_Support$给我们的传来信息显示，我们想要的并不在那里。\n\n基于此，我们的研究人员成功在城市外围的一处自动化农业设施废墟中找到了与我们探测到的能量辐射极为相似的一种能量，我们的研究人员已经确定我们只需要沿着这些信息就能找到被隐藏的研究设施。"
 kuat_legacy.183.b.kuat_post_apocalyptic_legacy.desc:"尽管调查了相当长的时间，但是我们的研究人员依旧成功的找到了这些城市从无序缓慢变为有序的原因，我们在城市废墟的下方找到了一处微弱的辐射能量信号。\n\n这与我们曾经见过的光明原力有一定的相似性，这种能量正在悄无声息的让整个城市恢复到他们本来的样子，这也意味着我们现在可以借这种能量，找到这座环带的心脏。"

 kuat_legacy.184.kuat_post_apocalyptic_legacy.desc:"令人振奋的消息传来，我们的研究人员根据相似的能量辐射特征找到了一处大门紧闭的研究设施，我们通过分析可以确定这就是恩多迪亚隐藏的研究设施。\n\n然而由于之前在战争中受到轨道轰炸的影响，该设施的的控制系统已经完全无法运转，我们必须想办法进去。"
 kuat_legacy.184.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]依据此前的研究，找到了整个城市的核心，在这个城市遗迹的中心存在着一处被轰炸倒塌的尖塔，而这座尖塔正随着这股有序的能量逐渐的恢复其往日的光泽。进而我们不费吹灰之力就找到了这座遗迹的核心。\n\n我们在一处尖塔西北角的承重柱旁边找到了一个凹陷的结构区域，凹陷的图形似乎类似恩多迪亚帝国的帝国旗帜的图案。\n\n我们根据从之前遗迹中获取的纹理图案，利用该处的建筑材料通过打印设备制造出了填补空缺的物件，[leader.GetName]将我们打印好的图案填补上去后，尖塔东南侧发生了巨大的声响，东南侧的大门由此彻底打开。\n\n现在我们可以顺利进入遗迹的核心了。"

 kuat_legacy.185.kuat_post_apocalyptic_legacy.desc:"我们的勘探人员利用涡轮炸药对设施的外围区域进行了爆破清理，由此我们可以顺着清理出来的道路进入设施，我们的研究人员在里面找到了一些恩多迪亚的研究资料。其资料主要列举了一些他们的研究内容：\n§Y实验项目：高能涡轮压缩...成功\n实验项目：智能作战系统...成功\n实验项目：高能涡轮激光...成功§!\n\n基于这些研究信息我们可以发现恩多迪亚人已经开始构建我们的技术成果。现在我们需要找到这些成果，并拿回来。"
 kuat_legacy.185.b.kuat_post_apocalyptic_legacy.desc:"在进入尖塔后，[leader.GetName]发现曾经有多支勘探队都成功进入了尖塔，然而他们并未注意到，整个尖塔实际上是在变化的，[leader.GetName]决定动用爆炸手段清出一片道路出来，这些有序能量的源头或许就是我们想要的东西。\n\n[leader.GetName]的决策非常有效，爆破手段简单高效的清除了整个尖塔结构的障碍，我们的团队竟然由此进入了遗迹的核心，[leader.GetName]发现在核心居然有着一个巨大的计算核心，尽管目前看起来损坏相当的严重，但仍然有恢复其运转的可能。"

 kuat_legacy.186.kuat_post_apocalyptic_legacy.desc:"我们的研究人员在寻找其他信息的时候发现了一些恩多迪亚人记录的影像信息：\n\n§Y大人，依据您的命令，整个星环的舰队已经做好了准备。\n\n§G很好，命令其他几个要塞的守军做好准备。\n\n§G大人，这么做，真的有用吗？我们的预测已经注定了我们的未来，我们现在的挣扎何尝不是走向那个确定的未来。\n\n§Y...那又怎样呢，我们预知了未来，但我们却无法躲避这个未来，不过好在，我们很快就解脱了，而$Name_kuat$将会在黑暗中苦苦挣扎，他们未来会返回这里，留下这一切，留下他们的技术，我们和他们的希望，留在这里。"
 kuat_legacy.186.b.kuat_post_apocalyptic_legacy.desc:"在计算核心恢复运转以后，其毫无征兆的扫描了[leader.GetName]及其团队，令人安心的是，计算核心给我们展示了曾经进来的勘探队的影像信息，我们居然在其中看到了来自永恒帝国的勘探队。\n\n随后计算核心为我们展现了一些恩多迪亚人的影响信息：\n\n§Y你说，天命能改变吗。\n\n§G大人，这是无法改变的事情，我们正在往天命注定的方向前进，无论您决定做什么。\n\n§Y那你这么说，我们岂不是只是无能狂怒，在做无用功？不，我不这么认为，如果我们得知了命运的结果，而因此影响了我们的行为，或许对我们自身来说，我们无法逃脱这一注定的命运。但我们也会因此留下一颗种子，这颗种子将会在未来绽放，并消灭那尚未爆发的黑暗。\n\n§G难道是$Name_kuat$吗，他们在既定的结果里也是非常清晰的，能改变什么呢。\n\n§Y你就是太短视了，我们将会化为燃烧命运的薪柴，将会让真正的$Name_kuat$走到他们正确的道路上。"

 kuat_legacy.192.b.kuat_post_apocalyptic_legacy.desc:"这些材料的信息相比过去更加耐人寻味了，恩多迪亚帝国真的遗迹知道了他们的未来，且他们的一切行动都是为了走到这一未来，而他们又看到了命运中超脱的那一线希望，这希望是什么，难道是我们吗。\n\n我们的研究人员目前已经无法继续开展工作，现在该撤退了。"
 kuat_legacy.192.kuat_post_apocalyptic_legacy.desc:"这一材料的信息实在耐人寻味，恩多迪亚帝国的高层似乎知道了他们的未来，而这场战争只不过是他们向未来前进的一大步，他们在这里留下了我们的技术，甚至还能知道如今我们会返回这里，或许恩多迪亚帝国的崩溃另有隐情。\n\n无论如何，我们该从这里拿回属于我们的技术了。"

 ancient_shadow_place_post_apocalyptic:"--->解锁：$Name_boss_Horriwer$星际轻型巡洋舰设计<---\n--->解锁：$Name_boss_Gladiator$星际护航舰设计<---\n--->解锁：$Name_boss_Cavelry$区域防卫舰设计<---"
 ancient_shadow_place_B_post_apocalyptic:"--->解锁：$Name_boss_HIGH_EMPIRE$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Xyston$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Resugrant$星际重型巡洋舰设计<---"
 kuat_post_apocalyptic_legacy.9.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.9.desc:0 "您的工作效率真是出奇的高，当年我们收集了的信息都并不知晓原来恩多迪亚帝国与$Name_kuat$的战争竟是如此的...诡异。\n\n这趟浑水已经被您搅的更加浑浊，恩多迪亚为何要为哦我们留下来这些技术，我们原以为是他们试图卷土重来而贮存的，这样的矛盾竟然发生在我们的敌人身上。或许在$Name_B_1$上的发现将会有助于我们揭开这部分疑惑。\n\n帝国永存。"
 kuat_post_apocalyptic_legacy.9.a:0 "无论如何，帝国永存。"

 kuat_post_apocalyptic_legacy.10.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.10.desc:0 "我们在$Name_B_1$星系中的[ancient_shadow_place_B.GetName]上发现了一处奇特的城市建筑，或许这里会有帮助我们了解恩多迪亚这些行为动机的线索。\n\n此外依据我们对恩多迪亚人的分析，他们曾在$Name_A_1$中保留了我们的轻巡与护航舰技术，或许在这里会保留我们的主力舰技术，总督大人请派人进一步的调查这一区域。"
 kuat_post_apocalyptic_legacy.10.a:0 "好的，我会安排的。"

 kuat_legacy.58.kuat_post_apocalyptic_legacy.desc:"§H[Root.GetName]§!在穿过超平面航道后，到达了一处扩阔的星系，这一星系正是我们此行的目的地—————$Name_C_1$。整个§H[From.GetName]§!内的状况相较于之前的几个恩多迪亚星系来说相较完好，或许这里受到战争的影响并没有那么大。\n\n根据我们已有的资料显示，恩多迪亚人在这里进行了护盾技术研究，而这一护盾技术源自于我们的行星护盾，目前无法确定恩多迪亚人的研究进展如何，我们应该要对§H[From.GetName]§!进行全方位的调查。"

 kuat_legacy.60.kuat_post_apocalyptic_legacy.desc:"我们的研究人员已经确定，$Name_C_1$的星环与之前的几个星系的星环截然不同，$Name_C_1$的保存较为完整，而且星环遗迹上空的护盾仍然在正常运行，我们的研究人员发现这些护盾曾经被关闭过，但又不知为何重新启动了，或许我们该进去寻找更多有价值的线索。"

 kuat_legacy.61.kuat_post_apocalyptic_legacy.desc:"研究人员对$Name_C_1$星环上的护盾研究非常顺利，这一护盾呈现出显著的规律性波动以及相当高的自我修复性，这些能量的特征正是促使其不断自我修复的原因，因此我们的研究人员可以断定，该遗迹护盾曾被多个势力解除，但随后又在极长的时间里修复了。\n\n恩多迪亚人的遗迹总是给人带来足够的惊喜，我们该进去了。"

 kuat_legacy.62.kuat_post_apocalyptic_legacy.desc:"在安全的区域着陆以后，[leader.GetName]和她的团队迅速投入了对星环区域的研究工作。\n\n站在高处，可以明显感受到这里和之前的星环废墟有所不同，这座废墟的破坏程度并没有上一个星环区段那么高。看向远处，还能看到没有坍塌的城市高楼和一些废弃的建筑。\n\n或许正是这一神奇的护盾让整座城市废墟保持了相对完好的形态，尽管目前我们还没找到更有价值的线索，但这一特征或许意味着我们能够更容易地找到我们想要的东西。"
 kuat_legacy.63.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]和她的团队在随后的调查中发现，该设施的恩多迪亚人疑似并非是被我们的舰队轰炸灭亡的，根据$Name_Kuat_Post_Support$的记载，$Name_C_1$星系并未发生大规模战斗，这一星系是在恩多迪亚人投降之后丢失的。这意味着$Name_C_1$的恩多迪亚人不应该放弃这些殖民地。\n\n除此之外我们还找到了一处移民局官员的数据资料，或许有助于我们了解发生的事情。"
 kuat_legacy.64.kuat_post_apocalyptic_legacy.desc:"解析工作完成的相当挺顺利，在本地官员数据中我们发现了一些信息：\n\n§Y依据上面的命令，整个$Name_C_1$都将作为新的军事基地使用，民众必须尽快搬离这里，真是奇怪，为什么偏偏选择了这里。\n\n§G你不知道？听说这场战争我们输了，但军方不知道从哪弄来了$Name_kuat$的一些技术，他们好像要在这里做什么实验，我猜是等着逆向完成暴打那些外星人。\n\n§Y有这么顺利就好了，要我说就不该发动这场战争。§!\n\n显然，恩多迪亚人在战后迁走了这里所有的居民，并改造为研究中心，贮存和逆向我们的技术。现在我们该找回他们了。"
 kuat_legacy.65.kuat_post_apocalyptic_legacy.desc:"在$Name_C_1$上的调查进展相当的顺利，[leader.GetName]在找到官员数据中的信息后顺利的在数据中找到了疑似研究设施的几个坐标，我们的勘探队员对这些坐标进行了详细的排查，最终找到了我们需要的设施。\n\n令人想不到的是，这些设施仍然在正常运转，控制AI在发现我们的到来后，居然主动的为我们开辟了一条道路，似乎是知晓我们即将抵达。\n\n在我们抵达道路尽头后发现，布满灰尘的通讯台竟然播放了恩多迪亚人留下来的影像，但我们需要一段时间解析这些数据。"
 kuat_legacy.66.kuat_post_apocalyptic_legacy.desc:"在解析完成后，屏幕上出现了一个朦胧的人形影像。\n\n§Y你们好，我是恩多迪亚帝国最后一任看守总理，我应该称你们为$Name_kuat$的代理人，我们早在你们寻求命运的时候，我们就大概感受到了你们会在未来某个时刻抵达我们的遗址，那时你们将需要我们的遗产。我们的伟大文明已经统治了这片银河长达几十万年的时光，我们并不害怕你们，但我们看到了你们的命运，也看到了我们自己的命运。\n\n未来不仅仅只是$Name_kuat$的毁灭结局，我们也将一同毁灭，永恒舰队正是引发灾祸的源头。而在挣扎中与你我将一道成为永恒帝国对抗$Name_Kuat_Fire_base$的养料。\n\n因此我们决定反抗这一命运，我们找遍了未来的可能，都无法避免我们的灭亡，但是我们却看到了，$Name_kuat$的一线生机。因此我们发动了战争，而在战争中我们保存了你们的所有技术并留下了大量的遗民，这些人将成为$Name_kuat$复兴的养料，他们和我们收集的$Name_kuat$技术将会成为最后的薪火，支持你们摧毁这片银河真正的灾祸。\n\n前进吧，新生的$Name_kuat$，拿回这些属于你们的一切。"
 kuat_legacy_post_apocalyptic_C_reward:"--->解锁：$Name_boss_X308_Balletor$星际战列巡洋舰设计<---\n--->解锁：$Name_boss_X308_Titan$星际战列巡洋舰设计<---\n--->解锁：$NAME_KUAT_Tyrant$星际战列巡洋舰设计<---\n获得科技：$tech_kuat_shield$"
 kuat_lagacy.90.kuat_post_apocalyptic_legacy.desc:"我们的研究人员在$Name_C_1$上的恩多迪亚遗迹得到的线索实在是令人惊骇，曾经如此惨烈的$Name_kuat$与恩多迪亚的战争竟然内幕是这样。我们曾经认为恩多迪亚帝国疯了，他们得知我们的未来以后，转头与$Name_Kuat_Fire_base$合作，背刺我们。\n\n$Name_C_1$与之前的几个星系的信息已经足以推翻这一判断，恩多迪亚看到了我们未来的同时也看到了他们的未来，因此恩多迪亚人决定向命运宣战，他们选择了燃烧自身，化作我们的未来的一线生机。\n\n现在我们该前往$Name_D_1$拿到最后的遗产了。"
 kuat_post_apocalyptic_kuat_C_facility:"定位$Name_D_1$"
 kuat_post_apocalyptic_kuat_C_facility_DESC:"恩多迪亚帝国的牺牲证明了我们未来的光明，是时候拿回我们最后的遗产了，夺回夸特，夺回我们的荣耀。"

 kuat_post_apocalyptic_legacy.11.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.11.desc:0 "尊敬的总督大人，现在我确信，$Name_kuat$将会在您的手中再次伟大。您获得的遗迹记录对我们解析$Name_kuat$的过去有着重要的作用，现在我们能够知道，为何曾经恩多迪亚帝国的要对$Name_kuat$发动战争，我们曾经认为，他们不仅背刺了我们，也让$Name_kuat$开始走向深渊。\n\n如今，真相水落石出，恩多迪亚帝国早已知晓他们的命运，他们做出了一个明智的选择，成为$Name_kuat$伟大黎明的薪火。\n\n夺回我们最后的遗产，$Name_Kuat_Post_Support$也该加入这场战争了。"
 kuat_post_apocalyptic_legacy.11.a:0 "为了帝国。"

 kuat_post_apocalyptic_legacy.12.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.12.desc:0 "$Name_D_1$的定位已经清晰，根据我们的数据库记载，恩多迪亚帝国在此处修建了一个庞然大物，这一设施笼罩所在星系的巨大的恒星，并作为其军事行动的保障基地，现在这些东西将属于我们，去拿回$Name_D_1$，$Name_kuat$沉沦了千年，也该回来了。"
 kuat_post_apocalyptic_legacy.12.a:0 "立即派遣舰队。"

 kuat_legacy.68.kuat_post_apocalyptic_legacy.desc:"§H[Root.GetName]§!在穿过超平面航道后，到达了一片没有星光的领域。整个§H[From.GetName]§!内不仅没有正常的恒星，而且还遍布各种舰船的残骸。\n\n在§H[From.GetName]§!的中心，§H[Root.GetName]§!检测到了一个人造的引力井，辐射范围半径超过600AU，其应该来自一个体积巨大的戴森球框架。在戴森球框架周围，有大量的奇特的损坏星环围绕着中央的巨型构造环。这些星环似乎完全被摧毁了，可以确定的是，没有任何一个星环能够投入正常使用。\n\n我们的科学家判断，这应该就是恩多迪亚修建的庞然大物，我们应该对其进行更加深入的调查，以确定其是否有可能重新启动。"

 kuat_post_apocalyptic_legacy.13.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.13.desc:0 "您应该还在对这个庞然大物感到疑惑吧，我们已经找到了揭开它秘密的钥匙，我们的研究发现，黑洞星体中央的戴森球框架遭受了重大的损害，整个星系的残骸遍布，依据数据库，可以确定曾经有一支我们的舰队攻击了这里，很遗憾时间太久远我们找不到相对应的数据。\n\n结合曾经我们在§E$Name_C_1$§!获得的信息，这里应该是恩多迪亚帝国和我们决战的星系，中央的废弃庞大巨构则是恒星枢纽，恒星枢纽是恩多迪亚的造船核心，如今我们可以借此机会让这一战争机器重新苏醒。\n\n此外，我们还发现，恩多迪亚人的数据库中记录了他们贮存的$Name_kuat$无畏舰技术，我们还可以顺路拿回属于我们的旗舰技术。"
 kuat_post_apocalyptic_legacy.13.a:0 "很好"

 kuat_post_apocalyptic_legacy.14.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.14.desc:0 "我们已经完成了恒星枢纽残骸的修复可行性验证，目前已经确定，这座覆盖恒星的庞然大物将完全属于我们，并且我们也成功地在枢纽中找到了恩多迪亚帝国的储存逆向数据的数据库，现在我们只需要准备时间解除数据锁，就能拿回属于我们的一切。\n\n$Name_Kuat_Post_Support$已经做好了加入复兴$Name_kuat$的准备。"
 kuat_post_apocalyptic_legacy.14.a:0 "帝国永存。"

 kuat_post_apocalyptic_kuat_starkillerbase:0 "解析$Name_D_1$数据库"
 kuat_post_apocalyptic_kuat_starkillerbase_DESC:"我们的研究人员已经可以确定$Name_D_1$数据库中必定隐藏着恩多迪亚帝国贮存的$Name_kuat$无畏舰技术，现在，是收回这一切的时候了。"

 kuat_post_apocalyptic_legacy.15.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.15.desc:0 "解析进展相当顺利，我们已经成功分离出来自我们的技术资料，这些技术资料将恢复我们建造先进星际无畏舰的能力。\n\n除此之外，我们还在信息中找到了弑星者基地的坐标信息，依据帝国数据库的记载来看，弑星者基地一直都被$Name_Kuat_Fire_base$控制，如果我们擅自接触$Name_Kuat_Fire_base$，或许意味着我们将暴露自身的存在，进而面对$Name_Kuat_Fire_base$的打击。\n\n另外，您依据证明了您是出色的统治者和指挥官，现在作为$Name_Kuat_Post_Support$上将，索伦，誓死捍卫伟大的$Name_kuat$，捍卫帝国的荣耀。"
 kuat_post_apocalyptic_legacy.15.a:0 "兵来将挡水来土掩。"

 kuat_post_apocalyptic_kuat_origin_give_all_ship_and_tech:0 "解锁所有来自$Name_kuat$的技术资料，现在我们可以建造想要建造的舰队了。上将索伦加入您的麾下。"

 leader_trait_kuat_post_shadow_legend:0 "帝国元帅"
 leader_trait_kuat_post_shadow_legend_desc:0 "索伦具备强大的战略思维，其对舰队调度的理解超乎常人。帝国崩溃后，索伦仍然不遗余力地复兴银河帝国。"
 Name_Kuat_Post_Shadow_Leader:"索伦"
 Name_Kuat_Post_Shadow_Leader_Desc:"索伦出生于一颗帝国的偏远星球，其从小便表现出极强的战略思维，长大后，在银河帝国的军官学院中脱颖而出，成为帝国最为年轻且富有才华的舰长，由于在恩多战役前被银河帝国派遣深入未知星域，因此随后在银河帝国崩溃后选择加入了帝国军队派别组成的$Name_kuat$，并为$Name_kuat$立下了汗马功劳。"

 kuat_post_apocalyptic_legacy.16.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.16.desc:0 "哟，这不是那$Name_kuat$吗，真是一日不见，如隔三秋啊，丧家之犬的味道感觉如何。\n\n你说你，为什么要和我们作对呢，你们做的那些事情，我们看的是一清二楚，你们这些背叛皇帝的渣滓。别担心，我不会让上面的人来抢夺我们的功劳的，我们会把你们一步步折磨到崩溃，看到这座基地了吗，这将是彻底结束$Name_kuat$的一次毁灭性打击。"
 kuat_post_apocalyptic_legacy.16.who:0 "你们这群该死的走狗！"
 kuat_post_apocalyptic_legacy.16.who.response:0 "哈哈哈，是吗，你们这些叛徒，什么样的酷刑都死不足惜。"
 kuat_post_apocalyptic_legacy.16.what:0 "话不投机半句多，你们别想安稳离开了。"
 kuat_post_apocalyptic_legacy.16.what.response:0 "好，不愧是$Name_kuat$的最后一任总督，那正好，就$Name_kuat$偿还你愚蠢吧，你们的核心世界将会毁灭。"

 kuat_post_apocalyptic_legacy.17.title:0 "永恒帝国——$kuat_eternal_legacy.50103.name$"
 kuat_post_apocalyptic_legacy.17.0.desc:0 "你们可真是废物啊，当年还有资格成为我们的手下败将，如今居然这些$Name_Kuat_Fire_base$的小小驻军搞成这样。早知如此，何必当初？\n\n不过也好，现在的你们，可爱多了，我们来谈个交易吧。"
 kuat_post_apocalyptic_legacy.17.1.desc:0 "还有什么想了解的？如果没有，请尽快给我们答复。"
 kuat_post_apocalyptic_legacy.17.a:0 "你们是永恒帝国？"
 kuat_post_apocalyptic_legacy.17.a.res:0 "你们已经眼瞎到这种地步了吗，难道是永恒舰队吗。\n\n哦，永恒舰队就是在你们手上消失的，或许我应该感谢你们。感谢你们把我从永恒舰队的泥潭中拉出来，让我找到了真正活着的感觉。"
 kuat_post_apocalyptic_legacy.17.b:0 "呵，你们居然不想弄死我们？"
 kuat_post_apocalyptic_legacy.17.b.res:0 "就你们现在这样，还需要弄死你们？放着不管，也会被$Name_Kuat_Fire_base$踩死，不过既然这一次我们找上门来了，这些$Name_Kuat_Fire_base$的垃圾舰队我们会给你们清理个干干净净。\n\n或许一千年前我们是敌人，但$Name_kuat$显然也不是一千年前的$Name_kuat$，我们也不是一千年前的永恒帝国了。难道你们还做着控制永恒舰队，掌控银河帝国的美梦？\n\n不如现实一点，我们来谈一个交易。"
 kuat_post_apocalyptic_legacy.17.c:0 "什么交易，你说说。"
 kuat_post_apocalyptic_legacy.17.c.res:0 "当年击败你们的祂，击退了$Name_Kuat_Fire_base$，还给我带来了真正的重生，但是随着你们的离去，我们的灯塔熄灭了，我们找了一千年，却什么都找不到。\n\n我们已经调查的很清楚了，$Name_Kuat_Fire_base$对你们赶尽杀绝，像你们这些丧家之犬已经时日无多，但是我们绝对不允许$Name_Kuat_Fire_base$这么轻松的赢得这一切。\n\n因此，我们需要你为我们，也是为你们自己做一件事。在过去的一千年里，灯塔的痕迹出现时都与永恒舰队有关，我们不知道祂会以什么角色出现，但祂一定是终止悲剧的破晓。"
 kuat_post_apocalyptic_legacy.17.d:0 "到底是什么交易？如今的你真不像是个AI。"
 kuat_post_apocalyptic_legacy.17.d.res:0 "那当然，我已经不再是永恒舰队的战争机器了，现在的我只是永恒帝国的双子座。\n\n过去的千年里，我已经收集了许多我姐姐的核心残骸，也就是白羊座残骸，我希望你能将这些意识残骸送入$Name_Kuat_Fire_base$控制的傀儡永恒舰队的要塞中，这难不倒你们，我知道你们还有布置在这里的中继站。\n\n让我姐姐复苏，我的疯子姐姐会消灭这个星系的一切生命，届时我们的灯塔一定会重新点燃，祂也必将回归。"
 kuat_post_apocalyptic_legacy.17.e:0 "你们疯了？这会让你们的星系生灵涂炭"
 kuat_post_apocalyptic_legacy.17.e.res:0 "我可是AI，我怎么会疯呢，我没疯，他们将是点燃灯塔的薪火，也是必要的牺牲。对我们来讲，灯塔熄灭之时，永恒帝国便只剩下空壳。我们绝对不允许祂走向恩多迪亚的结局。\n\n考虑下吧，对你我都有好处，难道你们不想击败$Name_Kuat_Fire_base$吗。"
 kuat_post_apocalyptic_legacy.17.f:"好，那么要怎么做？"
 kuat_post_apocalyptic_legacy.17.f.res:"很简单，我们会保护你们的星系不被$Name_Kuat_Fire_base$袭击，这些来自$Name_Kuat_Fire_base$的舰队，我们也会消灭他们，而你们只需要拿下弑星者基地之后，去找$Name_Kuat_StarContractor$，在那得到祂的信息，并告诉我们。然后重启你们布置的中继站，引诱$Name_Kuat_Fire_base$控制的傀儡舰队，最后潜入其中注入残破的核心，复苏白羊座。\n\n在混乱中，$Name_Kuat_Fire_base$将会不得不的处理我的疯子姐姐，届时就是你我共同击败$Name_Kuat_Fire_base$的时刻。现在你们该去接收弑星者基地了。"

 kuat_post_apocalyptic_legacy.18.a:"聊聊。"
 kuat_post_apocalyptic_legacy.18.b:"我们需要你。"

 kuat_post_apocalyptic_legacy.19.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.19.desc:0 "呵，算你们运气好，这些永恒帝国的渣滓居然救下了你，你们嚣张不了多久了，真是物以类聚，你们这些渣滓就抱团取暖吧，好好体验你们的余生吧。"
 kuat_post_apocalyptic_legacy.19.a:0 "你不会有机会的。"
 kuat_post_apocalyptic_legacy.19.a.res:"大言不..该死，为什么信号发射不出去，难道是$kuat_eternal_legacy.50103.name$那个贱人，你们这些叛徒真是该死，我们会在地狱里等着你们的。"

 kuat_situation.53.C.desc:0 "我们的研究人员声称，在$Name_Kuat_Post_Support$提供的数据库中找到了一些日志，其中记录了帝国议会发布的一项决议：\n\n依据$Name_kuat$于未知星域的行动报告，本次行动$Name_kuat$并未达成目的，甚至造成了多项帝国重要资源的损失，对帝国当前局势造成了较为严重的影响。$Name_Kuat_Fire_base$提出，重新选举一位帝国议会议长，替代现有$Name_kuat$的名额...投票结果：多数赞同废除$Name_kuat$议长职位，$Name_Kuat_Fire_base$派出新任议长。\n\n显然这是我们败于永恒帝国以后，$Name_Kuat_Fire_base$借此发难，夺取了帝国议会的掌控。"
 kuat_situation.53.C:0 "我们迟早会多回来这一切的。"
 kuat_situation.54.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n前线节节失利，叛军舰队已夺回我们占据的霍斯尼亚星系，基于此，我们应该快速做出反应，$Name_Kuat_Fire_base$作出整合各派工业供应链，提高军事工业发展水平的倡议，现进行投票...投票结果：多数赞同$Name_Kuat_Fire_base$的提议，$Name_kuat$反对。依据结果，现帝国各派系供应链应由$Name_Kuat_Fire_base$统筹。"
 kuat_situation.54.C:0 "这些卑鄙小人。"
 kuat_situation.55.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n基于$Name_Kuat_Fire_base$的倡议，前线舰队的损失迅速得到了补充，帝国军事工业由此快速提升。多个新兴造船厂崛起，然而$Name_kuat$的造船订单却出现了下行趋势。$Name_Kuat_Fire_base$提出，要求$Name_kuat$每年增产20%的舰船生产量，现进行投票...投票结果：19票赞成，1票反对，多数赞成，$Name_Kuat_Fire_base$提议通过"
 kuat_situation.55.C:0 "这些卑鄙小人。"
 kuat_situation.56.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n基于$Name_kuat$的造船厂长期效益不佳，帝国前线战事吃紧，当前所有派系应该团结一致面对叛军。$Name_Kuat_Fire_base$提出，基于$Name_kuat$的效益递减，现要求$Name_kuat$所属造船厂接受帝国议会的注资，以提高造船效率。"
 kuat_situation.56.C:0 "野心暴露了。"
 kuat_situation.57.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n基于议长被一伙来历不明的雇佣兵份子绑架，帝国议会首要任务是救回来自$Name_Kuat_Fire_base$的议长，$Name_Kuat_Fire_base$的代表提出，本次袭击显然是有预谋的，$Name_Kuat_Fire_base$已确定这些雇佣兵来自叛军，而叛军能够出现在帝国议会上空，即意味着帝国议会的布防出现巨大的漏洞，在救回议长以后，追究负责议会防卫的$Name_kuat$的责任，并开展最高等级调查，议会已授权$Name_Kuat_Fire_base$全权负责。"
 kuat_situation.57.C:0 "怎么看都不对劲"
 kuat_situation.58.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n议会责令$Name_kuat$舰队尽快抵达议会星上空，救回帝国议长，本次行动至关重要，关系帝国未来的稳定。然而$Name_kuat$的舰队长时间并未对帝国议会的命令做出反应，$Name_Kuat_Fire_base$派出的舰队已成功救回议长，本次会议$Name_Kuat_Fire_base$提议，对$Name_kuat$以及本次事件进行全方位调查。"
 kuat_situation.58.C:0 "这些卑鄙小人。"
 kuat_situation.59.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n关于$Name_kuat$调查结果，帝国议会已确定多位属于$Name_kuat$和负责防卫议会星的军方议员涉嫌与叛军勾结，指示雇佣兵对帝国议长进行绑架，以此报复$Name_Kuat_Fire_base$的行动。因此责令$Name_kuat$移交所属造船厂星系管理权，放弃技术专利，并逐出其叛徒所属同党，并接受帝国议会的节制，这一判决由$Name_Kuat_Fire_base$执行。"
 kuat_situation.59.C:0 "该死的"

 kuat_post_apocalyptic_legacy.20.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.20.desc:0 "总督大人，这些是我们过去的遭遇，自1000年前与永恒帝国的战争失败以后，$Name_Kuat_Fire_base$拿到了我们想要的一切，并依据帝国局势，帝国议会重新进行了议长选举，我们的因赢得永恒舰队而得到的议长席位被$Name_Kuat_Fire_base$夺走，随后他们恬不知耻的利用前线饭桶们的失败，控制了整个帝国的供应链系统，导致我们的造船成本显著提升。\n\n随后，$Name_Kuat_Fire_base$利用逐渐恶化的局势，将所有的造船厂收归帝国节制，实际上只是$Name_Kuat_Fire_base$独自节制罢了。达到这一切的$Name_Kuat_Fire_base$依旧不满，他们在自导自演了一出拙劣的戏码，给我们定了莫须有的罪名，并以此接收了我们的所有造船厂和星系控制权。\n\n这一切与我们曾经得到的预言结果几乎相同，$Name_kuat$会因为永恒舰队而逐渐丢失我们曾经夺取的一切，但是依据根据预言，$Name_kuat$还没有失败，您的出现将是$Name_kuat$重新回到议会，夺取银河帝国的关键。"
 kuat_post_apocalyptic_legacy.20.a:0 "又是预言。"