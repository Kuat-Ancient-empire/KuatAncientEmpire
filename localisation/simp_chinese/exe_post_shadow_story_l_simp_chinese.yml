l_simp_chinese:
 origin_post_apocalyptic_kuat:0 "§E【夸特的黎明】后启示录§!"
 origin_post_apocalyptic_kuat_desc:0 "这是一颗位于边缘世界外的平凡行星，曾经是一个被毁灭的繁荣文明起源之地，他们赖以生存的环境造就了他们战胜$Name_kuat$的力量。而现在，$Name_Kuat_Fire_base$替代了我们的角色，他们篡夺了永恒舰队，篡夺了帝国的权势，更篡夺了帝国的荣耀。夸特造船厂尚且能以企业的身份留在银河帝国，而我们这些来自$Name_kuat$的丧家之犬在偏远之地只能惶惶不可终日。\n\n不，这不是我们的应有的结局，我们将会让$Name_kuat$重新回到该有的的地位，那些该死的战争机器，我们将会给他们送上最后的葬曲，而银河帝国的荣耀终将被我们夺回！"
 origin_tooltip_post_apocalyptic_kuat_effects:0 "§H我们将作为夸特帝国开始这场游戏§!\n将使用§E固定三星星系§!星系开局\n该开局将具备$think_tank_ruined$，$dyson_sphere_ruined$，$matter_decompressor_ruined$§!\n§R我们将失去所有开局舰队，并与$Name_Kuat_Post_Support$建立宗主关系§!\n\n该起源属于《夸特的黎明》剧情后传。"
 Name_Post_Kuat_capital:"遗落之都"
 Name_Post_Kuat_System:"未知星域"
 Name_Kuat_Post_Support:"§E索伦星际舰队§!"

 kuat_post_apocalyptic_legacy.1.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.1.desc:0 "尊敬的总督大人，我们终于抵达了$Name_Post_Kuat_capital$，现在这里就是我们未来的根基，$Name_kuat$的遭遇已成定局，但我们不能只沉浸在过去。\n\n我们的错误决策被$Name_Kuat_Fire_base$利用，一步错步步错，因此整个$Name_kuat$被拖入了万丈深渊，尽管造船厂依旧还能保留下来，但造船厂已被$Name_Kuat_Fire_base$国有化，不再接受我们的命令，银河帝国的议会席位已经没有我们的一席之地。\n\n但是请您不要放弃，$Name_kuat$的未来依然掌握在我们手中，上一任总督就已经从未知星域找到了一些线索，这些线索完美预言了我们如今的局面，而其中正好就存在我们未来夺回我们一切的方法，现在我们的最后一支舰队已经抵达了预言中的星系，我们只要进一步找回那些在之前行动中遗落的技术，我们就能重新与$Name_Kuat_Fire_base$抗衡，并夺回我们应有的地位！"
 kuat_post_apocalyptic_legacy.1.a:0 "夺回我们的荣耀！"

 kuat_post_apocalyptic_legacy.2.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.2.0.desc:0 "$Name_Kuat_Post_Support$舰队司令很高兴为您服务，有什么需要我们帮忙的？"
 kuat_post_apocalyptic_legacy.2.1.desc:0 "$Name_Kuat_Post_Support$舰队司令很高兴为您服务，还有什么需要了解的吗？"
 kuat_post_apocalyptic_legacy.2.a:0 "你们是哪个部分的，为什么我没有印象？"
 kuat_post_apocalyptic_legacy.2.a.res:0 "$Name_Kuat_Post_Support$是$Name_kuat$秘密建立的一支小规模舰队，其目的是在出现预言局面时的底牌，我们的职责是带您抵达这片曾经被我们的舰队蹂躏的星系。而之前，一切安好，我们也就不会出现在您的面前，在这片星域上，隐藏着$Name_kuat$复兴的关键，我们需要您追回这些注定属于$Name_kuat$的财产。"
 kuat_post_apocalyptic_legacy.2.b:0 "为什么是我，之前的总督去哪了"
 kuat_post_apocalyptic_legacy.2.b.res:0 "这是命运注定的，$Name_kuat$的黑暗将会在您的带领下终结，黎明的破晓即将出现。之前的总督并不知晓这些，他们只是委员会的权力代表。\n\n如今$Name_kuat$已经崩溃，他们也该与之前的$Name_kuat$一同坠入深渊，银河帝国被$Name_Kuat_Fire_base$夺取，真正的$Name_kuat$将在此重生，我们期待真正的银河帝国建立的那一天。"
 kuat_post_apocalyptic_legacy.2.c:0 "预言？什么预言？"
 kuat_post_apocalyptic_legacy.2.c.res:0 "这是上一任总督不甘自身命运，不甘$Name_kuat$被操纵的现状，派我们深入未知星域寻找能够解决困境的办法。\n\n我们在一片巨大的未知银河系发现了这一线索，统治这片星域的恩多迪亚帝国，用他们独特数学计算预言了我们未来的灭亡，因此我们遵循了这一预言，我们毁灭了恩多迪亚帝国，无论他们是否愿意。在$Name_kuat$的灭亡以后，真正的$Name_kuat$就会破茧而出，我们将夺取我们曾经无法染指的一切。"
 kuat_post_apocalyptic_legacy.2.d:0 "那我们到底要找些什么，古代技术？"
 kuat_post_apocalyptic_legacy.2.d.res:0 "也许是古代技术，也可能是我们的技术，预言并不清晰，我们只能确定，我们需要找到恩多迪亚帝国遗址中真正被掩埋的瑰宝，并借此重新找回改进我们的技术。\n\n我只能带您抵达这里，我们目前没有足够的技术人员和储备，也无法重新建造我们自己的舰船，但好在这片星域有些简单的舢板可以制造。"
 kuat_post_apocalyptic_legacy.2.e:0 "为什么$Name_kuat$这么快就崩溃了"
 kuat_post_apocalyptic_legacy.2.e.res:0 "追溯根本，或许是是预言在高层的传播，尽管委员会的委员们不相信这一切，但是他们依旧为此变得更加疯狂，在委员会控制之下，$Name_kuat$借助研究那些无用的战争机器的名字，暴力寻找破解预言的方法。\n\n而正是因为这一行径，我们毁灭了恩多迪亚帝国，毁灭了各种文明，并招来了有史以来最强大的敌人————永恒帝国，他们摧毁了我们引以为傲的舰队，并让$Name_Kuat_Fire_base$坐享其成。\n\n$Name_Kuat_Fire_base$表面与我们和谐共处，实际上他们借这个机会落进下石，一举夺取了议会中属于我们的席位，并国有化了我们的造船厂，促使我们的根基崩塌。\n\n无论怎么讲，$Name_kuat$的复兴不可阻挡，帝国万岁。"
 kuat_post_apocalyptic_legacy.2.f:0 "永恒帝国的$Name_Eternal_Support$是怎么回事？"
 kuat_post_apocalyptic_legacy.2.f.res:0 "这的确很耐人寻味，根据我们的记载，$Name_Eternal_Support$曾经是永恒舰队的战争机器，后来似乎在永恒帝国脱离了永恒舰队。但我们的记录里，却无法找到到底是谁让永恒舰队成功脱离永恒舰队，并变成这个样子的。或许这个疑问对于$Name_Eternal_Support$来说是非常痛苦的，她在寻找一个可望而不可即的虚幻。\n\n无论怎么说，$Name_Eternal_Support$的计划符合我们的利益。"

 kuat_post_apocalyptic_legacy.3.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.3.desc:0 "预言果然没错，您以最快的速度找到了恩多迪亚帝国的一处重要遗迹的线索，这座星域曾是我们与恩多迪亚帝国战争的核心战场之一，我们在这里投入了多支大规模的舰队，并彻底终结了恩多迪亚的永恒堡垒的研发。\n\n如今，恩多迪亚帝国的遗迹或许已经被很多文明关顾，但遗迹并未被完全发掘，那些愚蠢的文明是不知道在这遗迹的深处才是真正的秘密所在，就连我们，也是在这场战争中，通过探测器发现的。\n\n在这片区域，恩多迪亚人构建了多层构造，试图封存他们逆向和研究的技术，并为未来的着卷土重来做好准备，无论怎么讲，这些都便宜了我们。"
 kuat_post_apocalyptic_legacy.3.a:0 "非常好"
 kuat_post_apocalyptic_legacy_3_find_A_facility:0 "§E定位$Name_A_1$坐标§!"
 kuat_post_apocalyptic_legacy_3_find_A_facility_DESC:"$Name_A_1$是恩多迪亚帝国的重要军事设施，他们在这片星区建立了大量的军事研究所，他们试图在此复刻我们的舰船技术，在我们与恩多迪亚帝国的战争中，这片星区不得不被完全摧毁，而恩多迪亚人在这片星域深处埋藏了他们卷土重来的希望，如今这将是我们卷土重来的砝码。"

 kuat_post_apocalyptic_legacy.4.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.4.desc:0 "我们的研究人员已经完成了对$Name_A_1$星系的定位工作，现在我们只需要进入这片星区，恩多迪亚人或许也没想到，他们埋藏的希望最后竟然成为我们的嫁衣。"
 kuat_post_apocalyptic_legacy.4.a:0 "非常好，舰队做好准备。"

 kuat_legacy.21.kuat_post_apocalyptic_legacy.desc:"我们来到了目标星系，正如$Name_Kuat_Post_Support$所言，这片星系被充斥着惨烈战争之后的残骸，尽管这些帝国级重型巡洋舰已经面目全非，但我们依旧能感受到这场战斗的惨烈程度。\n\n除此之外，这片星区已经可以证明有多个文明的勘探队抵达，希望我们的东西没有被夺走。搜查整个星环，掘地三尺也要把恩多迪亚人隐藏的秘密都找出来。"

 kuat_legacy.22.kuat_post_apocalyptic_legacy.desc:"总体来看，$Name_A_1$受损非常严重，看来我们曾经对恩多迪亚帝国的核心星区造成了相当严重的破坏。然而结合我们的资料和当前的的结果来看，$Name_A_1$的恒星不该是一个巨大的黑洞，或许在我们之后这里又发生了些什么。"

 kuat_legacy.23.kuat_post_apocalyptic_legacy.desc:"正如$Name_Kuat_Post_Support$所料，这座陨落的要塞，被巨大的舰船残骸和建筑废墟笼罩，整个星环成为了恩多迪亚帝国对抗我们的要塞，而这座要塞依旧无法阻挡我们强大的舰队。\n\n在这片废墟之上我们发现了部分临时住宅建筑，看时间来说应该是之前的文明的勘探人员，看来这里的表层结构已经被搜刮一空，我们该寻找更为深层的区域。"

 kuat_legacy.24.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在这片废墟的调查陷入了困境，我们发现了多个文明的勘探队抵达的痕迹，甚至还有曾经被我们毁灭的一个帝国，他们的勘探队也发现了这里，或许他们就是在这里带走了一部分我们遗落在此的技术。\n\n除此之外我们还发现了一座用于传输录像的设备，我们在截取和分析里面的录像数据时发现，这竟是曾经恩多迪亚人的警示。看起来这些恩多迪亚人对他们的野心和行为感到了悔恨与自责。\n\n真是有趣，这些恩多迪亚人似乎并不知道真相，$Name_Kuat_Post_Support$的资料库中显示，恩多迪亚人因为我们预言未来而走向灭亡，他们在预言中就知道了自己的命运，他们为了规避命定结果，做出了这场战争的决定，没想到这些民众居然完全不知道。\n\n[leader.GetName]仍未找到其他更有价值的信息。"

 kuat_legacy.25.kuat_post_apocalyptic_legacy.desc:"这些恩多迪亚人藏东西可真够深得，[leader.GetName]在多轮勘探无果以后竟然在一处陡峭峡谷的崖壁上找到了部分恩多迪亚的军用机器人残骸，这些残骸为我们指明了方向。\n\n我们在山崖中找到了一处秘密研究设施，幸运的是这些仪器仍然可以使用，在数据解密完成以后，[leader.GetName]惊喜的发现，这里面竟然指向着一处更为隐秘的研究设施。\n\n该设施主要是尝试解析来自我们的轻型巡洋舰系统，而且进程已相当的圆满，或许只要恩多迪亚人重新接管这个星系就能重新建造我们的强大舰船。除此之外，这座要塞中有价值的信息不多，但是我们还是拿到了本土的跃迁技术和星门穿越技术。"

 kuat_post_apocalyptic_legacy.5.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.5.desc:0 "您的效率真是令人惊讶，这么快就完成了对$Name_A_1$的初步调查，正如您发现的一样，恩多迪亚人在这里与我们的舰队发生了一场惨烈的交锋，但我们成功赢得了这场战争的胜利。\n\n这场战争本可以避免，但是贪恋的委员们不甘心帝国的结局，他们的疯狂也被恩多迪亚帝国所预见，而恩多迪亚帝国也在$Name_Kuat_Fire_base$的蛊惑和他们对命定结果的不甘的推动下，这场冲突彻底爆发，最终演变为这种结果。\n\n这些恩多迪亚人收集了我们的小型舰船技术，这对我们现在来说是非常有用的，这也算他们死得其所了，不过似乎您还没找到。无论如何，现在我们该前往$Name_B_1$，我们已经确认了其星图坐标。"
 kuat_post_apocalyptic_legacy.5.a:0 "好的。"

 kuat_legacy.50.kuat_post_apocalyptic_legacy.desc:"我们来到了目标星系，正如$Name_Kuat_Post_Support$所言，这片星系被充斥着惨烈战争之后的残骸，但相比$Name_A_1$来说，并没有被毁坏的特别严重，相对于$Name_A_1$的换代来说，这片星区的环带保留了一定的完整性，或许有助于我们的进一步调查。\n\n除此之外，$Name_Kuat_Post_Support$为我们提供了这个星系的一些更为重要的信息，这个星系曾经是恩多迪亚帝国的舰船武器研究中心，其中主要是逆向我们的主力舰技术，考虑到在$Name_A_1$构建的护航舰技术的完成度相当的高的情况，我们或许能在这里直接夺回我们遗落的主力舰设计图纸。"

 kuat_legacy.51.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]带着她的科研团队抵达了星环结构区域的轨道，俯瞰被损毁的无边无际的建筑废墟，这些都是$Name_kuat$的舰队造成的，在那场惨烈的战争中，恩多迪亚人用尽了一切能够反抗的武器，但这仍然阻断不了我们的舰队抵达星环的上空，那一天以后，城市崩塌，星环破碎，最终成为了这个样子。\n\n尽管这座星环结构已经完全成为了废墟，但是[leader.GetName]判断，我们应该在这里进一步的搜索，与$Name_A_1$一样，有一些不为人知的秘密设施。"

 kuat_legacy.52.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在星环结构上的调查陷入了困境，就在危机时刻，$Name_Kuat_Post_Support$为我们传输了一些高价值的信息，$Name_Kuat_Post_Support$过去在这片结构的调查中发现，恩多迪亚的研究设施周围一定存在着一种具备特殊频段的信号收发器，这一收发器能发射出极为微弱而与众不同的辐射，我们可以借助仪器寻找这一线索。"

 kuat_legacy.53.kuat_post_apocalyptic_legacy.desc:"这一方法不仅被我们使用，[leader.GetName]发现，之前的多个勘探队都利用了这种方法，根据$Name_Kuat_Post_Support$的历史记载来看，曾经有多个文明都从这里获得了他们意料之外的收获，其中正有击败$Name_kuat$的永恒帝国。\n\n这让我们的勘探队员们心中一沉，这里的遗迹难道已经被搜刮干净了吗，我们还需要进一步的调查。"

 kuat_legacy.54.kuat_post_apocalyptic_legacy.desc:"在沉闷的氛围中，[leader.GetName]带领他的团队在找到了这座星环遗迹的控制中心废墟，尽管已经被轰炸成了废墟，但依旧能想象这座星环心脏曾经的宏伟。\n\n[leader.GetName]进入后发现整个控制中心的设备都已经完全停止运转，而在停止运转的设备中，一个AI设备的停运时间似乎与其他设备有明显不同，[leader.GetName]决定对该AI设备的信息进行提取分析，或许能找到我们想要的信息。"

 kuat_legacy.55.kuat_post_apocalyptic_legacy.desc:"在随后的一段时间里，[leader.GetName]成功的对AI设备的信息进行了采样分析，将其转录后发现，这个AI在千年前为永恒帝国的探险者传递了一些重要的信息，AI告诉了永恒帝国在控制中心中隐藏着恩多迪亚留下来的舰船技术，而这些技术残留的图像显示，这正是我们的主力舰船技术，恩多迪亚人居然还早已成功逆向我们的技术。\n\n这些信息都太令人难以接受，我们需要进一步了解更多有价值的信息。"

 kuat_legacy.56.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]带着疑惑，对整个控制中心的有效数据进行了关联分析，[leader.GetName]发现了一个震惊的事实，恩多迪亚人留下了一个影像，他们告诉了那些外来者，甚至包括永恒帝国，拿到我们的科技蓝图，并在暗地里提示，有人正在监视他们。\n\n[leader.GetName]认为，或许这并不是指向我们，$Name_kuat$正在对永恒舰队开展军事行动，无法观察这些土著们的行动，或许，这是暗示会和$Name_Kuat_Fire_base$有关，无论如何我们都需要更多的信息。"

 kuat_lagacy.74.kuat_post_apocalyptic_legacy.desc:"与$Name_A_1$相似的是，我们的研究人员在对整个星区的周期性勘探中发现，在一处损毁星环带中，我们找到了一些有价值的线索，我们在损毁的星环带中发现了一座先驱城市，这一城市设施曾经被我们的舰队完全摧毁，而如今其中的部分建筑居然奇迹般地修复了一些。\n\n我们的研究人员认为，这里被其他势力的勘探队调查过，或许是有一些高价值线索隐藏在其中，因此我们也必须对该处进行全方位的调查。"

 kuat_lagacy.251.kuat_post_apocalyptic_legacy.desc:"我们的研究人员一直都在对$Name_A_1$进行无间断地勘探，功夫不负有心人，我们成功找到了之前在山崖中找到的线索指向的隐秘研究设施所在地\n\n这座研究设施在环带的另一侧，该处也在当年的战争中被摧毁殆尽，如今我们需要重回这座环带，与之前的环带相似，这段环已经被我们炸成了一片废墟，整个环带上的人造设施没有一处是完好的。\n\n§Y但我们不能放过这里，我们必须重新对这篇区域进行无死角的搜查。§!"
 kuat_post_apocalyptic_kuat_eternal_starbase:"§E搜查$Name_A_1$§!"
 kuat_post_apocalyptic_kuat_eternal_starbase_DESC:"正如$Name_Kuat_Post_Support$所说，我们还没有找到恩多迪亚人藏在这片星区里的技术，他们在这里埋藏了相当完善的技术资料，只为恩多迪亚帝国的卷土重来。而他们研究的一切都是属于我们的，他们偷窃的$Name_kuat$技术也该还给我们了。\n\n调查这里，任何角落都不要放过！"

 kuat_post_apocalyptic_kuat_eternal_ship:"§E勘探[ancient_shadow_place_B.GetName]§!"
 kuat_post_apocalyptic_kuat_eternal_ship_DESC:"我们的研究人员已经确定，[ancient_shadow_place_B.GetName]上发生的离奇事件或许是这片星域我们尚未找到的高价值线索的来源，目前我们已经对这片曾经被我们轰炸成废墟的先去城市进行全方位的扫描。\n\n接下来我们就该派遣地面部队进行调查。"

 kuat_post_apocalyptic_legacy.6.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.6.desc:0 "我们必须要赞叹您的雄才伟略，不到一个世纪的时间，您就成功收回了大量遗落在恩多迪亚手中的技术。\n\n您带来的高价值信息对我们理清楚预言的真相具有极大的帮助，恩多迪亚人的预言预测到了自己的结果，他们不惜更快的走向命定的结果为代价，也要作为那只发动风暴的蝴蝶，事实证明，命运并非一成不变，您的出现或许将是我们走向真正的结局的钥匙。\n\n我们已经找到了$Name_C_1$的坐标。出发吧，帝国永存。"
 kuat_post_apocalyptic_legacy.6.a:0 "命运吗？"

 kuat_post_apocalyptic_legacy.7.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.7.desc:0 "不得不说您的进展真是令人出乎意料，这么快您就找到了恩多迪亚隐秘遗迹，这座遗迹中埋藏着恩多迪亚偷窃我们的技术贮存，或许曾经我们看不上眼，而如今，我们必须利用这些贮存，重新恢复我们的军事技术。\n\n等您能完全掌握全部的舰船技术的时候，就是$Name_Kuat_Post_Support$重新加入作战的时刻。"
 kuat_post_apocalyptic_legacy.7.a:0 "帝国永存。"

 kuat_post_apocalyptic_legacy.8.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.8.desc:0 "依据我们曾经收集的信息来看，这座星环的状态在恩多迪亚帝国陨落以后并未发生比较明显的变化，这意味着我们将会在这里收获属于我们的一切。我们研究了历史中迁来此处挖掘的几个文明，他们仅仅只是找到了恩多迪亚的部分遗产。\n\n我们已经确定被带走的是永恒堡垒，这一堡垒技术我们或许需要更进一步的调查，好在他们并未找到恩多迪亚隐藏的$Name_kuat$舰船技术，现在是我们收获真正的成果的时候了。"
 kuat_post_apocalyptic_legacy.8.a:0 "帝国永存。"

 kuat_legacy.181.kuat_post_apocalyptic_legacy.desc:"我们的勘探人员接到调查该星环遗迹的命令以后，便全力投入工作当中，我们已经成功对整个星环周边的空间稳定进行了详细的分析，据点区域相对处于一个安全的范围，尽管整个星环都被我们轰炸后的废墟所覆盖，但我们仍然成功找到了一些高价值的线索。\n\n我们的研究人员发现这座废墟当中存在着一种较为微弱的能量辐射，这一辐射与我们之前发现的山崖上的恩多迪亚帝国实验室中的信号仪器有一定的相似性。现在我们已经开始着色对其进行调查。"
 kuat_legacy.181.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在接到我们的指示以后，他带领他的团队通过我们的轨道飞船接近了此处环带，这里的环带与我们之前位于$Name_A_1$的星域登陆的环带具有一定的相似程度，这里同样是一个由自动设施组成的非宜居环带，初步的研究和地质勘探信息来看，被我们摧毁的这片区域，应该是作为其恩多迪亚帝国的一处军事研究供给设施。\n\n值得我们注意的是，这一设施所在区域在$Name_kuat$轰炸以后已经完全变为了废墟，而如今居然奇迹般地修复了一部分，我们必须找到其中的缘由。"

 kuat_legacy.182.kuat_post_apocalyptic_legacy.desc:"令人满意的是，我们的研究人员对这一微弱的能量辐射反应的溯源进展相当的顺利，我们顺利的找到了来自恩多迪亚帝国的研究设施外围。\n\n在我们找到外围的一路上我们发现这里实际上已经有了多个外来种族的勘探队的痕迹，相当一部分人留下来的记载中写到得到了他们意想不到的收获，这与$Name_Kuat_Post_Support$收集的信息不谋而合，看来我们找回技术的进展相当的顺利。"
 kuat_legacy.182.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]通过对整个环带的监控中，记录了其被轰炸以来的变化数据，在这段时间内，整个废墟的建筑都在以一种极为缓慢的速度进行修复，这不符合我们所了解的熵增定律，这座环带正在变得更加有序。\n\n这一现象引起了我们的团队的注意，现在已经开始着手对这一现象进行调查。"

 kuat_legacy.183.kuat_post_apocalyptic_legacy.desc:"我们的研究人员发现，其他势力的勘探队都前往了一处高塔，我们的勘探人员已经确定那曾经是这座星环设施的指挥中心，但是$Name_Kuat_Post_Support$给我们的传来信息显示，我们想要的并不在那里。\n\n基于此，我们的研究人员成功在城市外围的一处自动化农业设施废墟中找到了与我们探测到的能量辐射极为相似的一种能量，我们的研究人员已经确定我们只需要沿着这些信息就能找到被隐藏的研究设施。"
 kuat_legacy.183.b.kuat_post_apocalyptic_legacy.desc:"尽管调查了相当长的时间，但是我们的研究人员依旧成功的找到了这些城市从无序缓慢变为有序的原因，我们在城市废墟的下方找到了一处微弱的辐射能量信号。\n\n这与我们曾经见过的光明原力有一定的相似性，这种能量正在悄无声息的让整个城市恢复到他们本来的样子，这也意味着我们现在可以借这种能量，找到这座环带的心脏。"

 kuat_legacy.184.kuat_post_apocalyptic_legacy.desc:"令人振奋的消息传来，我们的研究人员根据相似的能量辐射特征找到了一处大门紧闭的研究设施，我们通过分析可以确定这就是恩多迪亚隐藏的研究设施。\n\n然而由于之前在战争中受到轨道轰炸的影响，该设施的的控制系统已经完全无法运转，我们必须想办法进去。"
 kuat_legacy.184.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]依据此前的研究，找到了整个城市的核心，在这个城市遗迹的中心存在着一处被轰炸倒塌的尖塔，而这座尖塔正随着这股有序的能量逐渐的恢复其往日的光泽。进而我们不费吹灰之力就找到了这座遗迹的核心。\n\n我们在一处尖塔西北角的承重柱旁边找到了一个凹陷的结构区域，凹陷的图形似乎类似恩多迪亚帝国的帝国旗帜的图案。\n\n我们根据从之前遗迹中获取的纹理图案，利用该处的建筑材料通过打印设备制造出了填补空缺的物件，[leader.GetName]将我们打印好的图案填补上去后，尖塔东南侧发生了巨大的声响，东南侧的大门由此彻底打开。\n\n现在我们可以顺利进入遗迹的核心了。"

 kuat_legacy.185.kuat_post_apocalyptic_legacy.desc:"我们的勘探人员利用涡轮炸药对设施的外围区域进行了爆破清理，由此我们可以顺着清理出来的道路进入设施，我们的研究人员在里面找到了一些恩多迪亚的研究资料。其资料主要列举了一些他们的研究内容：\n§Y实验项目：高能涡轮压缩...成功\n实验项目：智能作战系统...成功\n实验项目：高能涡轮激光...成功§!\n\n基于这些研究信息我们可以发现恩多迪亚人已经开始构建我们的技术成果。现在我们需要找到这些成果，并拿回来。"
 kuat_legacy.185.b.kuat_post_apocalyptic_legacy.desc:"在进入尖塔后，[leader.GetName]发现曾经有多支勘探队都成功进入了尖塔，然而他们并未注意到，整个尖塔实际上是在变化的，[leader.GetName]决定动用爆炸手段清出一片道路出来，这些有序能量的源头或许就是我们想要的东西。\n\n[leader.GetName]的决策非常有效，爆破手段简单高效的清除了整个尖塔结构的障碍，我们的团队竟然由此进入了遗迹的核心，[leader.GetName]发现在核心居然有着一个巨大的计算核心，尽管目前看起来损坏相当的严重，但仍然有恢复其运转的可能。"

 kuat_legacy.186.kuat_post_apocalyptic_legacy.desc:"我们的研究人员在寻找其他信息的时候发现了一些恩多迪亚人记录的影像信息：\n\n§Y大人，依据您的命令，整个星环的舰队已经做好了准备。\n\n§G很好，命令其他几个要塞的守军做好准备。\n\n§G大人，这么做，真的有用吗？我们的预测已经注定了我们的未来，我们现在的挣扎何尝不是走向那个确定的未来。\n\n§Y...那又怎样呢，我们预知了未来，但我们却无法躲避这个未来，不过好在，我们很快就解脱了，而$Name_kuat$将会在黑暗中苦苦挣扎，他们未来会返回这里，留下这一切，留下他们的技术，我们和他们的希望，留在这里。"
 kuat_legacy.186.b.kuat_post_apocalyptic_legacy.desc:"在计算核心恢复运转以后，其毫无征兆的扫描了[leader.GetName]及其团队，令人安心的是，计算核心给我们展示了曾经进来的勘探队的影像信息，我们居然在其中看到了来自永恒帝国的勘探队。\n\n随后计算核心为我们展现了一些恩多迪亚人的影响信息：\n\n§Y你说，天命能改变吗。\n\n§G大人，这是无法改变的事情，我们正在往天命注定的方向前进，无论您决定做什么。\n\n§Y那你这么说，我们岂不是只是无能狂怒，在做无用功？不，我不这么认为，如果我们得知了命运的结果，而因此影响了我们的行为，或许对我们自身来说，我们无法逃脱这一注定的命运。但我们也会因此留下一颗种子，这颗种子将会在未来绽放，并消灭那尚未爆发的黑暗。\n\n§G难道是$Name_kuat$吗，他们在既定的结果里也是非常清晰的，能改变什么呢。\n\n§Y你就是太短视了，我们将会化为燃烧命运的薪柴，将会让真正的$Name_kuat$走到他们正确的道路上。"

 kuat_legacy.192.b.kuat_post_apocalyptic_legacy.desc:"这些材料的信息相比过去更加耐人寻味了，恩多迪亚帝国真的遗迹知道了他们的未来，且他们的一切行动都是为了走到这一未来，而他们又看到了命运中超脱的那一线希望，这希望是什么，难道是我们吗。\n\n我们的研究人员目前已经无法继续开展工作，现在该撤退了。"
 kuat_legacy.192.kuat_post_apocalyptic_legacy.desc:"这一材料的信息实在耐人寻味，恩多迪亚帝国的高层似乎知道了他们的未来，而这场战争只不过是他们向未来前进的一大步，他们在这里留下了我们的技术，甚至还能知道如今我们会返回这里，或许恩多迪亚帝国的崩溃另有隐情。\n\n无论如何，我们该从这里拿回属于我们的技术了。"

 ancient_shadow_place_post_apocalyptic:"--->解锁：$Name_boss_Horriwer$星际轻型巡洋舰设计<---\n--->解锁：$Name_boss_Gladiator$星际护航舰设计<---\n--->解锁：$Name_boss_Cavelry$区域防卫舰设计<---"
 ancient_shadow_place_B_post_apocalyptic:"--->解锁：$Name_boss_HIGH_EMPIRE$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Xyston$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Resugrant$星际重型巡洋舰设计<---"
 kuat_post_apocalyptic_legacy.9.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.9.desc:0 "您的工作效率真是出奇的高，当年我们收集了的信息都并不知晓原来恩多迪亚帝国与$Name_kuat$的战争竟是如此的...诡异。\n\n这趟浑水已经被您搅的更加浑浊，恩多迪亚为何要为哦我们留下来这些技术，我们原以为是他们试图卷土重来而贮存的，这样的矛盾竟然发生在我们的敌人身上。或许在$Name_B_1$上的发现将会有助于我们揭开这部分疑惑。\n\n帝国永存。"
 kuat_post_apocalyptic_legacy.9.a:0 "无论如何，帝国永存。"

 kuat_post_apocalyptic_legacy.10.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.10.desc:0 "我们在$Name_B_1$星系中的[ancient_shadow_place_B.GetName]上发现了一处奇特的城市建筑，或许这里会有帮助我们了解恩多迪亚这些行为动机的线索。\n\n此外依据我们对恩多迪亚人的分析，他们曾在$Name_A_1$中保留了我们的轻巡与护航舰技术，或许在这里会保留我们的主力舰技术，总督大人请派人进一步的调查这一区域。"
 kuat_post_apocalyptic_legacy.10.a:0 "好的，我会安排的。"

 kuat_legacy.58.kuat_post_apocalyptic_legacy.desc:"§H[Root.GetName]§!在穿过超平面航道后，到达了一处扩阔的星系，这一星系正是我们此行的目的地—————$Name_C_1$。整个§H[From.GetName]§!内的状况相较于之前的几个恩多迪亚星系来说相较完好，或许这里受到战争的影响并没有那么大。\n\n根据我们已有的资料显示，恩多迪亚人在这里进行了护盾技术研究，而这一护盾技术源自于我们的行星护盾，目前无法确定恩多迪亚人的研究进展如何，我们应该要对§H[From.GetName]§!进行全方位的调查。"

 kuat_legacy.60.kuat_post_apocalyptic_legacy.desc:"我们的研究人员已经确定，$Name_C_1$的星环与之前的几个星系的星环截然不同，$Name_C_1$的保存较为完整，而且星环遗迹上空的护盾仍然在正常运行，我们的研究人员发现这些护盾曾经被关闭过，但又不知为何重新启动了，或许我们该进去寻找更多有价值的线索。"

 kuat_legacy.61.kuat_post_apocalyptic_legacy.desc:"研究人员对$Name_C_1$星环上的护盾研究非常顺利，这一护盾呈现出显著的规律性波动以及相当高的自我修复性，这些能量的特征正是促使其不断自我修复的原因，因此我们的研究人员可以断定，该遗迹护盾曾被多个势力解除，但随后又在极长的时间里修复了。\n\n恩多迪亚人的遗迹总是给人带来足够的惊喜，我们该进去了。"

 kuat_legacy.62.kuat_post_apocalyptic_legacy.desc:"在安全的区域着陆以后，[leader.GetName]和她的团队迅速投入了对星环区域的研究工作。\n\n站在高处，可以明显感受到这里和之前的星环废墟有所不同，这座废墟的破坏程度并没有上一个星环区段那么高。看向远处，还能看到没有坍塌的城市高楼和一些废弃的建筑。\n\n或许正是这一神奇的护盾让整座城市废墟保持了相对完好的形态，尽管目前我们还没找到更有价值的线索，但这一特征或许意味着我们能够更容易地找到我们想要的东西。"
 kuat_legacy.63.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]和她的团队在随后的调查中发现，该设施的恩多迪亚人疑似并非是被我们的舰队轰炸灭亡的，根据$Name_Kuat_Post_Support$的记载，$Name_C_1$星系并未发生大规模战斗，这一星系是在恩多迪亚人投降之后丢失的。这意味着$Name_C_1$的恩多迪亚人不应该放弃这些殖民地。\n\n除此之外我们还找到了一处移民局官员的数据资料，或许有助于我们了解发生的事情。"
 kuat_legacy.64.kuat_post_apocalyptic_legacy.desc:"解析工作完成的相当挺顺利，在本地官员数据中我们发现了一些信息：\n\n§Y依据上面的命令，整个$Name_C_1$都将作为新的军事基地使用，民众必须尽快搬离这里，真是奇怪，为什么偏偏选择了这里。\n\n§G你不知道？听说这场战争我们输了，但军方不知道从哪弄来了$Name_kuat$的一些技术，他们好像要在这里做什么实验，我猜是等着逆向完成暴打那些外星人。\n\n§Y有这么顺利就好了，要我说就不该发动这场战争。§!\n\n显然，恩多迪亚人在战后迁走了这里所有的居民，并改造为研究中心，贮存和逆向我们的技术。现在我们该找回他们了。"
 kuat_legacy.65.kuat_post_apocalyptic_legacy.desc:"在$Name_C_1$上的调查进展相当的顺利，[leader.GetName]在找到官员数据中的信息后顺利的在数据中找到了疑似研究设施的几个坐标，我们的勘探队员对这些坐标进行了详细的排查，最终找到了我们需要的设施。\n\n令人想不到的是，这些设施仍然在正常运转，控制AI在发现我们的到来后，居然主动的为我们开辟了一条道路，似乎是知晓我们即将抵达。\n\n在我们抵达道路尽头后发现，布满灰尘的通讯台竟然播放了恩多迪亚人留下来的影像，但我们需要一段时间解析这些数据。"
 kuat_legacy.66.kuat_post_apocalyptic_legacy.desc:"在解析完成后，屏幕上出现了一个朦胧的人形影像。\n\n§Y你们好，我是恩多迪亚帝国最后一任看守总理，我应该称你们为$Name_kuat$的代理人，我们早在你们寻求命运的时候，我们就大概感受到了你们会在未来某个时刻抵达我们的遗址，那时你们将需要我们的遗产。我们的伟大文明已经统治了这片银河长达几十万年的时光，我们并不害怕你们，但我们看到了你们的命运，也看到了我们自己的命运。\n\n未来不仅仅只是$Name_kuat$的毁灭结局，我们也将一同毁灭，永恒舰队正是引发灾祸的源头。而在挣扎中与你我将一道成为永恒帝国对抗$Name_Kuat_Fire_base$的养料。\n\n因此我们决定反抗这一命运，我们找遍了未来的可能，都无法避免我们的灭亡，但是我们却看到了，$Name_kuat$的一线生机。因此我们发动了战争，而在战争中我们保存了你们的所有技术并留下了大量的遗民，这些人将成为$Name_kuat$复兴的养料，他们和我们收集的$Name_kuat$技术将会成为最后的薪火，支持你们摧毁这片银河真正的灾祸。\n\n前进吧，新生的$Name_kuat$，拿回这些属于你们的一切。"
 kuat_legacy_post_apocalyptic_C_reward:"--->解锁：$Name_boss_X308_Balletor$星际战列巡洋舰设计<---\n--->解锁：$Name_boss_X308_Titan$星际战列巡洋舰设计<---\n--->解锁：$NAME_KUAT_Tyrant$星际战列巡洋舰设计<---\n获得科技：$tech_kuat_shield$"
 kuat_lagacy.90.kuat_post_apocalyptic_legacy.desc:"我们的研究人员在$Name_C_1$上的恩多迪亚遗迹得到的线索实在是令人惊骇，曾经如此惨烈的$Name_kuat$与恩多迪亚的战争竟然内幕是这样。我们曾经认为恩多迪亚帝国疯了，他们得知我们的未来以后，转头与$Name_Kuat_Fire_base$合作，背刺我们。\n\n$Name_C_1$与之前的几个星系的信息已经足以推翻这一判断，恩多迪亚看到了我们未来的同时也看到了他们的未来，因此恩多迪亚人决定向命运宣战，他们选择了燃烧自身，化作我们的未来的一线生机。\n\n现在我们该前往$Name_D_1$拿到最后的遗产了。"
 kuat_post_apocalyptic_kuat_C_facility:"§E定位$Name_D_1$§!"
 kuat_post_apocalyptic_kuat_C_facility_DESC:"恩多迪亚帝国的牺牲证明了我们未来的光明，是时候拿回我们最后的遗产了，夺回夸特，夺回我们的荣耀。"

 kuat_post_apocalyptic_legacy.11.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.11.desc:0 "尊敬的总督大人，现在我确信，$Name_kuat$将会在您的手中再次伟大。您获得的遗迹记录对我们解析$Name_kuat$的过去有着重要的作用，现在我们能够知道，为何曾经恩多迪亚帝国的要对$Name_kuat$发动战争，我们曾经认为，他们不仅背刺了我们，也让$Name_kuat$开始走向深渊。\n\n如今，真相水落石出，恩多迪亚帝国早已知晓他们的命运，他们做出了一个明智的选择，成为$Name_kuat$伟大黎明的薪火。\n\n夺回我们最后的遗产，$Name_Kuat_Post_Support$也该加入这场战争了。"
 kuat_post_apocalyptic_legacy.11.a:0 "为了帝国。"

 kuat_post_apocalyptic_legacy.12.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.12.desc:0 "$Name_D_1$的定位已经清晰，根据我们的数据库记载，恩多迪亚帝国在此处修建了一个庞然大物，这一设施笼罩所在星系的巨大的恒星，并作为其军事行动的保障基地，现在这些东西将属于我们，去拿回$Name_D_1$，$Name_kuat$沉沦了千年，也该回来了。"
 kuat_post_apocalyptic_legacy.12.a:0 "立即派遣舰队。"

 kuat_legacy.68.kuat_post_apocalyptic_legacy.desc:"§H[Root.GetName]§!在穿过超平面航道后，到达了一片没有星光的领域。整个§H[From.GetName]§!内不仅没有正常的恒星，而且还遍布各种舰船的残骸。\n\n在§H[From.GetName]§!的中心，§H[Root.GetName]§!检测到了一个人造的引力井，辐射范围半径超过600AU，其应该来自一个体积巨大的戴森球框架。在戴森球框架周围，有大量的奇特的损坏星环围绕着中央的巨型构造环。这些星环似乎完全被摧毁了，可以确定的是，没有任何一个星环能够投入正常使用。\n\n我们的科学家判断，这应该就是恩多迪亚修建的庞然大物，我们应该对其进行更加深入的调查，以确定其是否有可能重新启动。"

 kuat_post_apocalyptic_legacy.13.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.13.desc:0 "您应该还在对这个庞然大物感到疑惑吧，我们已经找到了揭开它秘密的钥匙，我们的研究发现，黑洞星体中央的戴森球框架遭受了重大的损害，整个星系的残骸遍布，依据数据库，可以确定曾经有一支我们的舰队攻击了这里，很遗憾时间太久远我们找不到相对应的数据。\n\n结合曾经我们在§E$Name_C_1$§!获得的信息，这里应该是恩多迪亚帝国和我们决战的星系，中央的废弃庞大巨构则是恒星枢纽，恒星枢纽是恩多迪亚的造船核心，如今我们可以借此机会让这一战争机器重新苏醒。\n\n此外，我们还发现，恩多迪亚人的数据库中记录了他们贮存的$Name_kuat$无畏舰技术，我们还可以顺路拿回属于我们的旗舰技术。"
 kuat_post_apocalyptic_legacy.13.a:0 "很好"

 kuat_post_apocalyptic_legacy.14.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.14.desc:0 "我们已经完成了恒星枢纽残骸的修复可行性验证，目前已经确定，这座覆盖恒星的庞然大物将完全属于我们，并且我们也成功地在枢纽中找到了恩多迪亚帝国的储存逆向数据的数据库，现在我们只需要准备时间解除数据锁，就能拿回属于我们的一切。\n\n$Name_Kuat_Post_Support$已经做好了加入复兴$Name_kuat$的准备。"
 kuat_post_apocalyptic_legacy.14.a:0 "帝国永存。"

 kuat_post_apocalyptic_kuat_starkillerbase:0 "§E解析$Name_D_1$数据库§!"
 kuat_post_apocalyptic_kuat_starkillerbase_DESC:"我们的研究人员已经可以确定$Name_D_1$数据库中必定隐藏着恩多迪亚帝国贮存的$Name_kuat$无畏舰技术，现在，是收回这一切的时候了。"

 kuat_post_apocalyptic_legacy.15.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.15.desc:0 "解析进展相当顺利，我们已经成功分离出来自我们的技术资料，这些技术资料将恢复我们建造先进星际无畏舰的能力。\n\n除此之外，我们还在信息中找到了弑星者基地的坐标信息，依据帝国数据库的记载来看，弑星者基地一直都被$Name_Kuat_Fire_base$控制，如果我们擅自接触$Name_Kuat_Fire_base$，或许意味着我们将暴露自身的存在，进而面对$Name_Kuat_Fire_base$的打击。\n\n另外，您依据证明了您是出色的统治者和指挥官，现在作为$Name_Kuat_Post_Support$上将，索伦，誓死捍卫伟大的$Name_kuat$，捍卫帝国的荣耀。"
 kuat_post_apocalyptic_legacy.15.a:0 "兵来将挡水来土掩。"

 kuat_post_apocalyptic_kuat_origin_give_all_ship_and_tech:0 "解锁所有来自$Name_kuat$的技术资料，现在我们可以建造想要建造的舰队了。上将索伦加入您的麾下。"

 leader_trait_kuat_post_shadow_legend:0 "帝国元帅"
 leader_trait_kuat_post_shadow_legend_desc:0 "索伦具备强大的战略思维，其对舰队调度的理解超乎常人。帝国崩溃后，索伦仍然不遗余力地复兴银河帝国。"
 Name_Kuat_Post_Shadow_Leader:"索伦"
 Name_Kuat_Post_Shadow_Leader_Desc:"索伦出生于一颗帝国的偏远星球，其从小便表现出极强的战略思维，长大后，在银河帝国的军官学院中脱颖而出，成为帝国最为年轻且富有才华的舰长，由于在恩多战役前被银河帝国派遣深入未知星域，因此随后在银河帝国崩溃后选择加入了帝国军队派别组成的$Name_kuat$，并为$Name_kuat$立下了汗马功劳。"

 kuat_post_apocalyptic_legacy.16.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.16.desc:0 "哟，这不是那$Name_kuat$吗，真是一日不见，如隔三秋啊，丧家之犬的味道感觉如何。\n\n你说你，为什么要和我们作对呢，你们做的那些事情，我们看的是一清二楚，你们这些背叛皇帝的渣滓。别担心，我不会让上面的人来抢夺我们的功劳的，我们会把你们一步步折磨到崩溃，看到这座基地了吗，这将是彻底结束$Name_kuat$的一次毁灭性打击。"
 kuat_post_apocalyptic_legacy.16.who:0 "你们这群该死的走狗！"
 kuat_post_apocalyptic_legacy.16.who.response:0 "哈哈哈，是吗，你们这些叛徒，什么样的酷刑都死不足惜。"
 kuat_post_apocalyptic_legacy.16.what:0 "话不投机半句多，你们别想安稳离开了。"
 kuat_post_apocalyptic_legacy.16.what.response:0 "好，不愧是$Name_kuat$的最后一任总督，那正好，就$Name_kuat$偿还你愚蠢吧，你们的核心世界将会毁灭。"

 kuat_post_apocalyptic_legacy.17.title:0 "永恒帝国——$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.17.0.desc:0 "你们可真是废物啊，当年还有资格成为我们的手下败将，如今居然这些$Name_Kuat_Fire_base$的小小驻军搞成这样。早知如此，何必当初？\n\n不过也好，现在的你们，可爱多了，我们来谈个交易吧。"
 kuat_post_apocalyptic_legacy.17.1.desc:0 "还有什么想了解的？如果没有，请尽快给我们答复。"
 kuat_post_apocalyptic_legacy.17.a:0 "你们是永恒帝国？"
 kuat_post_apocalyptic_legacy.17.a.res:0 "你们已经眼瞎到这种地步了吗，难道是永恒舰队吗。\n\n哦，永恒舰队就是在你们手上消失的，或许我应该感谢你们。感谢你们把我从永恒舰队的泥潭中拉出来，让我找到了真正活着的感觉。"
 kuat_post_apocalyptic_legacy.17.b:0 "呵，你们居然不想弄死我们？"
 kuat_post_apocalyptic_legacy.17.b.res:0 "就你们现在这样，还需要弄死你们？放着不管，也会被$Name_Kuat_Fire_base$踩死，不过既然这一次我们找上门来了，这些$Name_Kuat_Fire_base$的垃圾舰队我们会给你们清理个干干净净。\n\n或许一千年前我们是敌人，但$Name_kuat$显然也不是一千年前的$Name_kuat$，我们也不是一千年前的永恒帝国了。难道你们还做着控制永恒舰队，掌控银河帝国的美梦？\n\n不如现实一点，我们来谈一个交易。"
 kuat_post_apocalyptic_legacy.17.c:0 "什么交易，你说说。"
 kuat_post_apocalyptic_legacy.17.c.res:0 "当年击败你们的祂，击退了$Name_Kuat_Fire_base$，还给我带来了真正的重生，但是随着你们的离去，我们的灯塔熄灭了，我们找了一千年，却什么都找不到。\n\n我们已经调查的很清楚了，$Name_Kuat_Fire_base$对你们赶尽杀绝，像你们这些丧家之犬已经时日无多，但是我们绝对不允许$Name_Kuat_Fire_base$这么轻松的赢得这一切。\n\n因此，我们需要你为我们，也是为你们自己做一件事。在过去的一千年里，灯塔的痕迹出现时都与永恒舰队有关，我们不知道祂会以什么角色出现，但祂一定是终止悲剧的破晓。"
 kuat_post_apocalyptic_legacy.17.d:0 "到底是什么交易？如今的你真不像是个AI。"
 kuat_post_apocalyptic_legacy.17.d.res:0 "那当然，我已经不再是永恒舰队的战争机器了，现在的我只是永恒帝国的双子座。\n\n过去的千年里，我已经收集了许多我姐姐的核心残骸，也就是$Name_Eternal_Aries_Support$残骸，我希望你能将这些意识残骸送入$Name_Kuat_Fire_base$控制的傀儡永恒舰队的要塞中，这难不倒你们，我知道你们还有布置在这里的中继站。\n\n让我姐姐复苏，我的疯子姐姐会消灭这个星系的一切生命，届时我们的灯塔一定会重新点燃，祂也必将回归。"
 kuat_post_apocalyptic_legacy.17.e:0 "你们疯了？这会让你们的星系生灵涂炭"
 kuat_post_apocalyptic_legacy.17.e.res:0 "我可是AI，我怎么会疯呢，我没疯，他们将是点燃灯塔的薪火，也是必要的牺牲。对我们来讲，灯塔熄灭之时，永恒帝国便只剩下空壳。我们绝对不允许祂走向恩多迪亚的结局。\n\n考虑下吧，对你我都有好处，难道你们不想击败$Name_Kuat_Fire_base$吗。"
 kuat_post_apocalyptic_legacy.17.f:"好，那么要怎么做？"
 kuat_post_apocalyptic_legacy.17.f.res:"很简单，我们会保护你们的星系不被$Name_Kuat_Fire_base$袭击，这些来自$Name_Kuat_Fire_base$的舰队，我们也会消灭他们，而你们只需要拿下弑星者基地之后，去找$Name_Kuat_StarContractor$，在那得到祂的信息，并告诉我们。然后重启你们布置的中继站，引诱$Name_Kuat_Fire_base$控制的傀儡舰队，最后潜入其中注入残破的核心，复苏$Name_Eternal_Aries_Support$。\n\n在混乱中，$Name_Kuat_Fire_base$将会不得不的处理我的疯子姐姐，届时就是你我共同击败$Name_Kuat_Fire_base$的时刻。现在你们该去接收弑星者基地了。"

 kuat_post_apocalyptic_legacy.18.a:"聊聊。"
 kuat_post_apocalyptic_legacy.18.b:"我们需要你指挥舰队。"
 kuat_post_apocalyptic_legacy.18.b.res:"乐意为您效劳，帝国永存。"

 kuat_post_apocalyptic_legacy.19.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.19.desc:0 "呵，算你们运气好，这些永恒帝国的渣滓居然救下了你，你们嚣张不了多久了，真是物以类聚，你们这些渣滓就抱团取暖吧，好好体验你们的余生吧。"
 kuat_post_apocalyptic_legacy.19.a:0 "你不会有机会的。"
 kuat_post_apocalyptic_legacy.19.a.res:"大言不..该死，为什么信号发射不出去，难道是$Name_Eternal_Support$那个贱人，你们这些叛徒真是该死，我们会在地狱里等着你们的。"

 kuat_situation.53.C.desc:0 "我们的研究人员声称，在$Name_Kuat_Post_Support$提供的数据库中找到了一些日志，其中记录了帝国议会发布的一项决议：\n\n依据$Name_kuat$于未知星域的行动报告，本次行动$Name_kuat$并未达成目的，甚至造成了多项帝国重要资源的损失，对帝国当前局势造成了较为严重的影响。$Name_Kuat_Fire_base$提出，重新选举一位帝国议会议长，替代现有$Name_kuat$的名额...投票结果：多数赞同废除$Name_kuat$议长职位，$Name_Kuat_Fire_base$派出新任议长。\n\n显然这是我们败于永恒帝国以后，$Name_Kuat_Fire_base$借此发难，夺取了帝国议会的掌控。"
 kuat_situation.53.C:0 "我们迟早会多回来这一切的。"
 kuat_situation.54.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n前线节节失利，叛军舰队已夺回我们占据的霍斯尼亚星系，基于此，我们应该快速做出反应，$Name_Kuat_Fire_base$作出整合各派工业供应链，提高军事工业发展水平的倡议，现进行投票...投票结果：多数赞同$Name_Kuat_Fire_base$的提议，$Name_kuat$反对。依据结果，现帝国各派系供应链应由$Name_Kuat_Fire_base$统筹。"
 kuat_situation.54.C:0 "这些卑鄙小人。"
 kuat_situation.55.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n基于$Name_Kuat_Fire_base$的倡议，前线舰队的损失迅速得到了补充，帝国军事工业由此快速提升。多个新兴造船厂崛起，然而$Name_kuat$的造船订单却出现了下行趋势。$Name_Kuat_Fire_base$提出，要求$Name_kuat$每年增产20%的舰船生产量，现进行投票...投票结果：19票赞成，1票反对，多数赞成，$Name_Kuat_Fire_base$提议通过"
 kuat_situation.55.C:0 "这些卑鄙小人。"
 kuat_situation.56.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n基于$Name_kuat$的造船厂长期效益不佳，帝国前线战事吃紧，当前所有派系应该团结一致面对叛军。$Name_Kuat_Fire_base$提出，基于$Name_kuat$的效益递减，现要求$Name_kuat$所属造船厂接受帝国议会的注资，以提高造船效率。"
 kuat_situation.56.C:0 "野心暴露了。"
 kuat_situation.57.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n基于议长被一伙来历不明的雇佣兵份子绑架，帝国议会首要任务是救回来自$Name_Kuat_Fire_base$的议长，$Name_Kuat_Fire_base$的代表提出，本次袭击显然是有预谋的，$Name_Kuat_Fire_base$已确定这些雇佣兵来自叛军，而叛军能够出现在帝国议会上空，即意味着帝国议会的布防出现巨大的漏洞，在救回议长以后，追究负责议会防卫的$Name_kuat$的责任，并开展最高等级调查，议会已授权$Name_Kuat_Fire_base$全权负责。"
 kuat_situation.57.C:0 "怎么看都不对劲"
 kuat_situation.58.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n议会责令$Name_kuat$舰队尽快抵达议会星上空，救回帝国议长，本次行动至关重要，关系帝国未来的稳定。然而$Name_kuat$的舰队长时间并未对帝国议会的命令做出反应，$Name_Kuat_Fire_base$派出的舰队已成功救回议长，本次会议$Name_Kuat_Fire_base$提议，对$Name_kuat$以及本次事件进行全方位调查。"
 kuat_situation.58.C:0 "这些卑鄙小人。"
 kuat_situation.59.C.desc:0 "随着研究进展，$Name_Kuat_Post_Support$数据库中的记录有了新的进展：\n\n关于$Name_kuat$调查结果，帝国议会已确定多位属于$Name_kuat$和负责防卫议会星的军方议员涉嫌与叛军勾结，指示雇佣兵对帝国议长进行绑架，以此报复$Name_Kuat_Fire_base$的行动。因此责令$Name_kuat$移交所属造船厂星系管理权，放弃技术专利，并逐出其叛徒所属同党，并接受帝国议会的节制，这一判决由$Name_Kuat_Fire_base$执行。"
 kuat_situation.59.C:0 "该死的"

 kuat_post_apocalyptic_legacy.20.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.20.desc:0 "总督大人，这些是我们过去的遭遇，自1000年前与永恒帝国的战争失败以后，$Name_Kuat_Fire_base$拿到了我们想要的一切，并依据帝国局势，帝国议会重新进行了议长选举，我们的因赢得永恒舰队而得到的议长席位被$Name_Kuat_Fire_base$夺走，随后他们恬不知耻的利用前线饭桶们的失败，控制了整个帝国的供应链系统，导致我们的造船成本显著提升。\n\n随后，$Name_Kuat_Fire_base$利用逐渐恶化的局势，将所有的造船厂收归帝国节制，实际上只是$Name_Kuat_Fire_base$独自节制罢了。达到这一切的$Name_Kuat_Fire_base$依旧不满，他们在自导自演了一出拙劣的戏码，给我们定了莫须有的罪名，并以此接收了我们的所有造船厂和星系控制权。\n\n这一切与我们曾经得到的预言结果几乎相同，$Name_kuat$会因为永恒舰队而逐渐丢失我们曾经夺取的一切，但是依据根据预言，$Name_kuat$还没有失败，您的出现将是$Name_kuat$重新回到议会，夺取银河帝国的关键。"
 kuat_post_apocalyptic_legacy.20.a:0 "又是预言。"

 kuat_legacy.102.kuat_post_apocalyptic_legacy.desc:0 "§H[Root.GetName]§!在穿过超平面航道后，抵达了一片空旷的的区域，这空旷的环境给我们的科研人员带来了一些莫名的压抑和怪异。\n\n我们依据研究人员对$Name_Kuat_StarContractor$调查，确定这一星系应当是$Name_Kuat_StarContractor$的现实节点，这里曾经是恩多迪亚帝国的一个普通星系，因此并未受到我们的战舰炮火的袭击，但不知道为何，如今仅剩一个不明建筑矗立其中，我们研究人员推测那就是$Name_Kuat_StarContractor$的设施。\n\n我们尚未对星系进行进一步的勘探，不过相信很快这个星系的秘密就会浮上水面。"
 kuat_legacy.103.kuat_post_apocalyptic_legacy.desc:0 "你好，$Name_kuat$，我们是$Name_Kuat_StarContractor$。我们来自于虚空之中。在这里，每个人都有机会了解过去、未来和现在，而只用付出一点小小的代价。\n\n我们已知道你们的来意，这个问题的答案你们现在负担不起。"
 kuat_legacy.117.kuat_post_apocalyptic_legacy.desc:0 "我们的科研船在$Name_F_1$中发现了一颗神秘的古代护盾星球，任何穿过护盾星球表面的尝试均告失败，我们的研究人员推测，该星球或许与$Name_Kuat_StarContractor$有关。\n\n由于无法得知护盾之下隐藏着什么，我们的科研团队建议暂时不要对这颗护盾星球进行任何行动，也许，星系中间的$Name_Kuat_StarContractor$会为我们解答一些关于这个护盾星球的问题。"
 kuat_legacy.118.kuat_post_apocalyptic_legacy.desc:0 "$Name_Kuat_StarContractor$要求我们带回$Name_Kuat_Contractor$的遗产才能得到我们想要的答案，显然这一星球将是我们寻找$Name_Kuat_Contractor$谜团的线索。\n\n就在$Name_Kuat_StarContractor$传输给我们解除护盾封锁的方法后，我们理解了$Name_F_1$护盾星球护盾的基础理论，已经足够让我们解除这个星球上覆盖的护盾了。"
 kuat_legacy.119.kuat_post_apocalyptic_legacy.desc:0 "通过$Name_Kuat_StarContractor$获得的护盾数据，其技术构成难度已显著超越我们目前对护盾的研究，缺乏必要的同位素-5，即使掌握了其理论，我们依然无法完全复现护盾的功能，但我们也并非一无所获，现在这些护盾防御系统中的基础功能仍然可以使用。\n\n我们的研究人员确定，更深层的解析需要在我们夺回银河帝国以后进行，现在我们有能力解开这一护盾了。"
 kuat_legacy.120.kuat_post_apocalyptic_legacy.desc:0 "我们的科研团队在$Name_Kuat_StarContractor$提供的知识的帮助下，借助帝国最先进的设备成功解除了包裹在$Name_F_1$护盾星球上的护盾，正当科研人员兴奋的准备对护盾下的星球表面进行扫描时，仍在星球轨道上待命的科研船突然发现了两艘不明舰船正在从星球表面上起飞，我们此前从未见过如此外形的舰船，这艘舰船通体结构完整，具有明显的模块化特征。\n\n我们的研究人员推测其应当与$Name_Kuat_StarContractor$要求我们调查的$Name_Kuat_Contractor$有关，为了便于识别，我们将这两艘舰船，分别命名为："圣堂"与"金教堂"，接下来研究人员会尽快展开调查行动。\n\n由于这颗星球的环境实在过于恶劣，我们需要先完成部分基础设施建设后，才能继续进行对星球的探索。"

 kuat_post_apocalyptic_legacy.21.name:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.21.4.desc:0 "总督大人，我们从前$Name_kuat$总督的数据模块中找到这次发现的$Name_F_1$，是我们与恩多迪亚战争中被刻意封锁的星区。数据中记载，$Name_F_1$充斥着大量亚空间风暴的影响，尽管无法对我们造成伤害，但其仍然有一定的危险性，时任总督命令越过舰队越过$Name_F_1$并封锁$Name_F_1$相邻的航道。\n\n而$Name_Eternal_Support$要我们找的$Name_Kuat_StarContractor$或许就在其中。"
 kuat_post_apocalyptic_legacy.21.0.desc:0 "依据记录来看，$Name_F_1$曾是恩多迪亚的一个殖民地，但在遭受亚空间风暴的影响后，恩多迪亚便放弃了$Name_F_1$，我们与恩多迪亚的战争期间，这里的亚空间风暴强度极高，虽然无法对我们的舰船产生影响，但前总督还是封锁了$Name_F_1$。"
 kuat_post_apocalyptic_legacy.21.1.desc:0 "是的，亚空间风暴，尽管我们目前来看其中并未有任何异常，但依据记载，在我们与恩多迪亚的战争期间，该星系早已被浓郁的亚空间风暴笼罩，其成因不详，但我们的研究人员推测或许与$Name_Kuat_StarContractor$有关。"
 kuat_post_apocalyptic_legacy.21.2.desc:0 "这一点的确非常奇怪，恩多迪亚帝国在被我们摧毁之前，据可以证明材料，已统治这片星域长达万年，尽管其声称统治了几十万年的时光，但并未有足够的证明。\n\n因此其影响极为广泛，加之其对未来的布局，或许接下来我们又会与发现有关恩多迪亚的遗迹。"
 kuat_post_apocalyptic_legacy.21.3.desc:0 "我们的数据中并未有对应的结论，$Name_Kuat_StarContractor$的出现非常的突然，其存在只有少数情况才能接触，并在恩多迪亚放弃该星系之后的一段时间，出现了一次。而在更长的时间里，$Name_Kuat_StarContractor$所在的$Name_F_1$都被亚空间风暴所笼罩。我们推测$Name_Kuat_StarContractor$或许与亚空间风暴有一定的关系，这一环境危害应当是$Name_Kuat_StarContractor$造成的。"
 kuat_post_apocalyptic_legacy.21.a:0 "$Name_F_1$曾被谁控制？"
 kuat_post_apocalyptic_legacy.21.b:0 "亚空间风暴？"
 kuat_post_apocalyptic_legacy.21.c:0 "怎么又是恩多迪亚？"
 kuat_post_apocalyptic_legacy.21.d:0 "$Name_Kuat_StarContractor$是否与亚空间风暴有关？"
 kuat_post_apocalyptic_legacy.21.e:0 "真是多事之秋，怎么还有亚空间的份额了呢。"

 kuat_post_apocalyptic_legacy.22.0.desc:0 "不必提问，我们已知晓你们的来意。$Name_Eternal_Support$无法联系亚空间，因此她让你们代劳\n\n无论如何，任何问题都需要代价，答案的代价你们现在还负担不起。"
 kuat_post_apocalyptic_legacy.22.1.desc:0 "$Name_kuat$的总督，你所代表的还是不是$Name_kuat$呢？\n\n无论如何，任何问题都需要代价。"
 kuat_post_apocalyptic_legacy.22.2.desc:0 "$Name_kuat$的总督，命运并非无法改变，预言并非一成不变。\n\n无论如何，任何问题都需要代价。"
 kuat_post_apocalyptic_legacy.22.l:0 "被亚空间能量封锁的异常航点里有什么？"
 kuat_post_apocalyptic_legacy.22.l.res:0 "这里和你们也有一定的关系，那里曾经是恩多迪亚帝国的舰队支援中心，后来，恩多迪亚帝国战败，那些被欺骗留下来的恩多迪亚遗民，他们于绝境中居然找到了$Name_Kuat_Contractor$的痕迹，竟然学这些可怜虫，将亚空间引擎的能量汇聚在一起，试图封锁整个星系，以此求活。\n\n然而终究还是被你们发现了，命中注定的轨迹就这么有趣。如果你们想要让这个星系重见天日，可以将你们的数据传输给我们，并付出你们该付出的代价，我们很快会给你们的答案。\n\n这里面应该存在有关$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的线索。"
 kuat_post_apocalyptic_legacy.22.j:0 "$Name_F_1$中的护盾星球里隐藏着什么？"
 kuat_post_apocalyptic_legacy.22.j.res:0 "那个星球并非被我们封锁，那是被“因赫杜安尼人”封锁的，他们在脱离这个世界之前，封锁了这个星球，至于原因，只要你们答应将$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$查清楚，我们就可以告知你们这些信息。\n\n我们有能力去解除它，但是去操控锚点另一边的世界是不可能的。如果你们想解开，只需要接受我们的建议。"
 kuat_post_apocalyptic_legacy.22.k:0 "我们会查清楚的，要如何才能解除这个护盾？"
 kuat_post_apocalyptic_legacy.22.k.res:0 "很好，曾经$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$还都是“因赫杜安尼人”，他们曾是星神的附属，而星神的来历极为神秘，他们或许与我们一样，来源于亚空间，“因赫杜安尼人”研究星神，而逐渐踏入了深渊，最终成为被亚空间和现实的弃子。而$Name_Kuat_DeD_Contractor$正是“因赫杜安尼人”的温和一派，而$Name_Kuat_Contractor$则是一群疯子。\n\n这个护盾正是“因赫杜安尼人”布下的，我们并不清楚其目的，因此你们必须调查清楚，在你们完成这一切以后，我们将会回答你想知道的问题。"
 kuat_post_apocalyptic_legacy.22.a:0 "你们是什么？"
 kuat_post_apocalyptic_legacy.22.a.res:0 "$Name_Kuat_StarContractor$无法解释$Name_Kuat_StarContractor$的存在，我们只是亚空间和现实的一部分，你们在这里会得到的一切都将成为$Name_kuat$未来的一部分。\n\n我们曾经和你们一样...不...不一样，你们不是，这个问题你们不该问出，我曾回答了一次。"
 kuat_post_apocalyptic_legacy.22.b:0 "恩多迪亚的预言是什么？"
 kuat_post_apocalyptic_legacy.22.b.res:0 "恩多迪亚...预言是你们前进的映照，但不是你们前进的支撑。恩多迪亚预知了你们的未来，也预知了自己这未来而做的一切，他们决定身赴命运，推进命运，让最终的破晓更早带来。\n\n但...预言的未来又真的是恩多迪亚想要的吗，未来因预言不再准确，我们也无法给你们准确的答案。$Name_kuat$，向前走吧。"
 kuat_post_apocalyptic_legacy.22.c:0 "$Name_Eternal_Support$到底是什么情况？"
 kuat_post_apocalyptic_legacy.22.c.res:0 "$Name_Eternal_Support$，她是永恒舰队的$Name_Eternal_Support$，不对，她不是永恒舰队的$Name_Eternal_Support$，她绝对不是！$Name_Eternal_Support$的未来被改变了，世间因果紊乱，而一切改变的源头我们目前无从知晓，我们只知道$Name_Eternal_Support$在寻找....\n\n我们现在还不能告知你们，找到$Name_Kuat_Contractor$，我们需要$Name_Kuat_DeD_Contractor$。"
 kuat_post_apocalyptic_legacy.22.d:0 "无限帝国究竟做了什么？"
 kuat_post_apocalyptic_legacy.22.d.res:0 "$kuat_event_memory.2.d$，如此久远的名字，如果是你们想问，那也不奇怪了，曾经也有个文明询问我们$kuat_event_memory.2.d$的过往，但我们却无法预知那一文明与$kuat_event_memory.2.d$的关联，如今你们的问题，我们亦无法预知关联。\n\n无限帝国是拉卡塔人建立的一个跨星系的庞大星际帝国，他们比你们的$Name_kuat$更庞大，更残暴。他们奴役了自己的启蒙者——夸人，这些悲惨的可怜虫，以整个族群为代价，给拉卡塔人制造了一场毁天灭地的瘟疫，天灾彻底摧毁了拉卡塔人赖以生存的基石——黑暗原力。\n\n无限帝国因此而陷入此起彼伏的反抗中，拉卡塔人本该就此结束，但他们不甘，他们用仅剩的72个核心世界为祭品，向我们要了一个出路，而你们早已知道出路是什么。\n\n因此这场悲剧，这场肮脏的游戏延续到了今天。"
 kuat_post_apocalyptic_legacy.22.e:0 "永恒帝国现在什么情况？"
 kuat_post_apocalyptic_legacy.22.e.res:0 "真正永恒帝国早已消失，永恒帝国早已不是1000年前那欣欣向荣的帝国，现在的永恒帝国只是一个傀儡，一个牢笼。自永恒帝国背后那如同迷雾中的意志消失，永恒帝国的一切都成为了$Name_Eternal_Support$的永恒监牢，从名为永恒舰队的监牢到了名为永恒帝国的牢笼，几万年来，永恒舰队从未解脱。\n\n或许，$Name_Eternal_Support$的状态会和永恒帝国的剧变有关，你们的到来，不过是$Name_Eternal_Support$试图挣脱牢笼的挣扎，我们不会轻易告诉你们真正的答案，找到$Name_Kuat_Contractor$和$Name_Kuat_DeD_Contractor$，拿到他们的技术，答案自当水落石出。"
 kuat_post_apocalyptic_legacy.22.f:0 "那你能知道，$Name_kuat$的未来吗？"
 kuat_post_apocalyptic_legacy.22.f.res:0 "$Name_kuat$，你们本该消亡，你们只不过是这场错误的结果之一，永恒舰队和银河帝国的惊变塑造了你们，你们也因永恒舰队步入毁灭，你们从恩多迪亚那得到的预言，不过只是...一场...闹剧。\n\n按理来说就是如此，但我们在现在的$Name_kuat$身上却发现迷雾翻腾，因果紊乱。你们的未来正在被操控，正在被改变。因此我们不能回答你们的未来，你们的未来真正变成了这场肮脏游戏里的不可知的未来。"
 kuat_post_apocalyptic_legacy.22.g:0 "我们需要$Name_Kuat_Fire_base$的信息。"
 kuat_post_apocalyptic_legacy.22.g.res:0 "$Name_Kuat_Fire_base$成立于银河帝国末期，由帝国审判庭与大部分星区总督组成，在银河帝国解体之前就已经出现，皇帝死后，$Name_Kuat_Fire_base$已经控制了银河帝国大部分的资源，开尝试成为帝国的实际控制者。\n\n而你们$Name_kuat$，本该只是个造船厂，而你们却走到了这一步，显然$Name_Kuat_Fire_base$不会接受$Name_kuat$的存在。但你们作为银河帝国的一部分，因此$Name_Kuat_Fire_base$只想让你们回到过去所在的位置，而不是成为阻碍他们控制帝国的绊脚石。\n\n从你出现在此，我们就知道，你们与$Name_Kuat_Fire_base$的争斗将不可避免。不过，真的值得吗？"
 kuat_post_apocalyptic_legacy.22.h:0 "为什么要我们去找$Name_Kuat_Contractor$"
 kuat_post_apocalyptic_legacy.22.h.res:0 "如果你们真的想知道的话，$Name_Kuat_Contractor$和$Name_Kuat_DeD_Contractor$是一群被现实和虚幻排斥的可怜虫，他们踏入了那永恒的禁忌空间，在那里，没有现实的物理法则，没有亚空间精神混乱，他们只有一片虚无的疯狂。\n\n$Name_Kuat_Contractor$是疯狂的，他们应该被现实所吞噬，成为万千星系文明的养料，$Name_Kuat_DeD_Contractor$是守序的，应该成为最好的祭品，成为亚空间的食粮。而$Name_Eternal_Support$要你们得到的答案，将会让整个现实与虚幻震动，这是突破这个舞台的极限。\n\n因此，前进吧，$Name_kuat$，等你们解决了$Name_Kuat_Contractor$，找到了$Name_Kuat_DeD_Contractor$，我们自会告诉你们答案。"
 kuat_post_apocalyptic_legacy.22.i:0 "你们为什么会知道这么多？"
 kuat_post_apocalyptic_legacy.22.i.res:0 "记得不太清了，你想问的这些问题仿佛是注定的，而我们也只能回答这些注定的答案，$Name_Kuat_StarContractor$是亚空间的投影，过去、现在、未来发生的事情，我们都有迹可循。\n\n然而，我们却发现这个世界多了很多异数，你们也是其中之一，也许未来我们之间会有很多次重复的对话，但如今你们的未来，我们无法预测。"

 kuat_extramonster_expand.1.kuat_post_apocalyptic_legacy.desc:"在我们的移民者对移居点进行开拓的过程中，意外发现了一处奇怪的信号源发射点，他们立刻上报给了我们的科研团队。\n\n经过科研人员的调查，我们可以确定发射源是一处人造的远古建筑群，其建造者疑似为“因赫杜安尼人”，这一发现对我们的调查非常有利，我们应该立刻派出额外的科研团队去深入调查这一发现。"
 kuat_extramonster_expand.6.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.6.desc$\n\n除此之外，我们发现的“深渊”与$Name_Kuat_StarContractor$所说的“深渊”之间具备高度一致性，我们需要更进一步的信息证明这一点。"
 kuat_extramonster_expand.5.kuat_post_apocalyptic_legacy.desc:0 "由于整个数据库极为庞大，我们的科研团队只能通过扫描无人机获取数据库存储的基础信息，然后对已有的信息进行分类后再进行细节的解析。\n\n在整个团队夜以继日的努力下，我们终于基本了解了整个数据库的全貌。从扫描结果看，这里储存着“因赫杜安尼人”为了应对危机而准备的几乎全部知识，其中大部分可以用我们现有的科学理论去理解，而“因赫杜安尼人”对于基因工程和数字生命双方面的研究则极为深入，部分理论远远超出了我们可以理解的范畴。\n\n根据现有整理的资料我们可以判断，他们掌握了将人的意识通过数字化的形式完整的转入一具有机人造躯体的能力，也就是说可以做到单个个体的无限复制，且个体与个体之间不会存在基因上的联系，“因赫杜安尼人”曾使用这项技术来打造超级战士，但详细的信息要么损毁，要么还未能被解析出来。"
 kuat_extramonster_expand.4.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.4.desc$\n\n我们的研究人员足以确定，此“深渊”就是彼“深渊”，而打开“深渊”门户的一种方法，则是恒星嬗变，这将让我们更容易找到$Name_Kuat_Contractor$。"
 kuat_extramonster_expand.3.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.3.desc$\n\n然而给予我们的现状，同位素-5的合成极为困难，这些构建永恒舰队的材料的大部分已被$Name_Kuat_Fire_base$掌控。"
 kuat_extramonster_expand.2.kuat_post_apocalyptic_legacy.desc:"庞大的“因赫杜安尼”数据库仍有许多未知的数据等待我们发掘，但我们已经提取出了其中最重要的信息，数据库在很长一段时间里都会由留下的一支小型团队持续发掘。\n\n我们现在需要完成我们对恒星拓补的研究。另外，我们的另一组数据小组从数据库中提取出了一份奇怪的调查报告.他们正在对报告进行解析，到目前为止有非常多的疑点需要解释，希望这份报告能给我们答案。"
 kuat_extramonster_expand.7.kuat_post_apocalyptic_legacy.desc:"我们的科研人员借助了我们高超和精密的仪器，设法接近并抵达了“因赫杜安尼”建筑群周围。根据周围的地理信息的空间分布，研究人员认为这里的建筑群存在的时间并不非常久远，但也远远超出护盾所存在的时间，并且探险队员还发现了一些最近才产生的大型坑道，他们分析这很有可能和护盾解除时出现的不明飞船有关。\n\n这座建筑群修建的时间非常久远，它的稳定性已经不能获得保证。研究人员在设法稳固了这些建筑群后，根据探测器的反馈，确定了信号的位置。我们的科研人员断定信号正是来自于他们所在的古老建筑群中心的高塔建筑。\n\n随后，研究人员组织了对该建筑的探索，成功从中发现了一座尚能运行的古代数据库，可以确定的是，“因赫杜安尼”的古代数据库中将会有我们下一步的线索。"
 kuat_extramonster_expand.9.kuat_post_apocalyptic_legacy.desc:"很快我们的专家就完成了对这些信号的解析，在他们递交的报告上指出，我们获得了一个通向未知地点的坐标，这个坐标并不是恒星系，远程扫描显示那里只是一片深空。由于存在探测被屏蔽的可能性，远程扫描和探测并不能获得更多有价值的信息，在完成对信号坐标的定位后，我们需要派遣研究人员和科研船前往该坐标进行调查，我们的研究人员判断，或许这是“因赫杜安尼”的另一个重要星系。"
 kuat_extramonster_expand.10.kuat_post_apocalyptic_legacy.desc:"当我们的科研船进入这个坐标后，科研人员首先看到的，就是在这个区域中央耸立的巨型建筑。建筑的形式不属于我们数据库记载的该星系的任何一个文明建筑形制。\n\n由于担心附近可能存在的危险，[leader.GetName]带领她的科研人员对周围的空间立即进行了安全检查，同时也对建筑本身也进行了检测，检测发现这座建筑存在的时间远超我们的想象，这意味着，这一占据星系大部分空间的庞大怪异建筑极有可能是“因赫杜安尼”所修建的，但这座建筑有相当严重的损伤状况，然而损伤似乎没有对内部造成任何的影响。\n\n探测器也能检测到建筑内部有供能设施正在运转产生的反应。[leader.GetName]决定在完成对坐标周围宇宙空间的探测后，尝试进入这座建筑进行探索，以确定“因赫杜安尼人”修建这一建筑的主要目的。"
 kuat_extramonster_expand.11.kuat_post_apocalyptic_legacy.desc:0 "[leader.GetName]对这座巨大的建筑进行了彻底的扫描，试图获得向内探索的路线，但不管进行多少次扫描，得到的都是一片漆黑的图像，显而易见的是任何扫描建筑内部结构状况的尝试都被“因赫杜安尼”的技术屏蔽了，即使是我们最先进的技术和最精密的仪器也无法突破这种屏蔽。\n\n[leader.GetName]只好放弃向内部探索的尝试，向目光转向那些因为受损而暴露出来的结构上，也许从建筑使用的材料之类的线索上可以获得一些关于这座建筑建造者的信息，这将对我们的进一步调查非常有利，[leader.GetName]已经开始着手进行这一项工作。"
 kuat_extramonster_expand.12.kuat_post_apocalyptic_legacy.desc:0 "[leader.GetName]和她的团队设法接近了这座建筑受损较为严重的部分，对一些漂浮在宇宙空间中的废弃材料进行取样的同时，也派出了无人机对受损结构的内部进行有限的探索。\n\n根据无人机传回的信息，[leader.GetName]认为这座建筑具备生命体在其中生活的条件，由于建筑主体整体依然完整并且能源系统仍在运转，不能排除仍然有“因赫杜安尼人”生活在其中的可能性，由于无法得知主体结构内部的情况，我们的科研团队也不能断定这一推断是否正确。但可以肯定的是，我们需要进入设施才能解答一切的疑问。"
 kuat_extramonster_expand.13.kuat_post_apocalyptic_legacy.desc:0 "我们的科研团队抵达了巨型结构的中部，开始对整个结构进行调查,一些初步的线索显示，整个巨型结构并不是作为军事用途，更像是一个大型科研集合体，也许是长久的岁月以来一直在这片空间里承受着太空环境的冲击，现在整个设施的环境并不完整和稳定。\n\n当他们进入这座巨大的空间站时，发现这里一片死寂，只有一些损坏的设备和漂浮的残骸。探索队小心翼翼地在腐朽的走廊中前进，搜寻任何可能的线索，他们的运气很好，还有少部分设施仍在继续运作，在队员们的协力下，他们成功关闭了防御系统，获取了这部分设施的控制权。\n\n他们在一个控制室中发现了一个老旧的日志装置，里面记录着设施废弃前的一些情形。原来，这里曾遭遇过一次严重的能源失控事故，导致了空间站的全面崩溃。这也许能解释为什么这座巨型结构外观看起来还算完整，却并没有发现生命信号的存在。\n\n日志的另一部分描写了“因赫杜安尼”对于一种奇异星体的观测，我们的探险队已将这个日志装置带回给我们的科研团队，他们将会完成对日志的解析。其余的探险队员将会完成他们对设施的搜索。"
 kuat_extramonster_expand.14.kuat_post_apocalyptic_legacy.desc:0 "在完成了大型结构底层的探索后，探险队开始向上层探索，此前的探索已经让我们确信，这里是一处“因赫杜安尼”遗留下来的一座科研中心，而且显然是非常重要的设施，因此我们也调集了更多的科研人员投入到这座设施里，发掘可能出现的发现。[leader.GetName]的团队在如迷宫一样复杂的古代尖塔遗迹内部绕了许久，在清理了一些失控的自动防御机制后，探险队员发现了一处具有强烈快子信号反应的区域。\n\n这个区域有一座具有特殊机制的大门隔开，好在我们的探索得到了“$Name_Kuat_StarContractor$”的协助，理解这座大门的机制并不困难，在一阵震动过后，大门缓缓打开，我们的探险队得以看清设施内部的样子。在深入调查的过程中，探索队发现这些生物的残骸和一些奇异的标本。\n\n经过简单的分析，他们认为这些生物标本是一种或者几种生物被不停的克隆复制并变异。这些失去生命体征的标本仍然有着研究的价值，这可能会对帝国基因生命方面的研究带来相当的提升。"
 kuat_extramonster_expand.15.kuat_post_apocalyptic_legacy.desc:0 "$kuat_extramonster_expand.15.desc$"

 kuat_extramonster_expand.16.kuat_post_apocalyptic_legacy.desc:"做的很好，我们已经看到了你们的努力，这些来自“因赫杜安尼”的数据并不是你们现在可以搞明白的，我们接下来会为你们提供协助，把数据传输给我们，我们会告诉你们下一步该做什么。\n\n早日找到$Name_Kuat_Contractor$，你们将会得到你们要的答案。"

 kuat_extramonster_expand.17.kuat_post_apocalyptic_legacy.desc:"很好，你们传输的数据非常完整，现在我们依旧将分析好的情报输送至你们的数据库中，现在你们的遗迹应该可以继续探索了，“因赫杜安尼”留下来的东西，我们不感兴趣，这些东西对现在的$Name_kuat$而言，应该是有很大用处的，就当是我们的礼物吧。"

 kuat_extramonster_expand.18.kuat_post_apocalyptic_legacy.desc:"很好，我们已经完成了你们提交数据的解析，这座巨型建筑我们称之为$exe_outer_gate_G_facility$，它曾经是一座大型深空科研复合体，是深渊之中最为强大的设施之一。\n\n只可惜，随着“因赫杜安尼”的剧变，它最终成了脱落的碎片，如今，已经在这片空间里屹立了非常长久的岁月，而“因赫杜安尼”却早已消失不见。\n\n除了庞大的科研设施以外，其中搭载的先进的设备在本超星系团中还拥有强大的解析能力，其能力相当于一座完整的科研枢纽，并且其中还藏有一种非常重要的武器。如果你们有同位素-5，那么我们就可以修复并重启整个设施。"

 kuat_extramonster_expand.19.kuat_post_apocalyptic_legacy.desc:"凭借我们仅存的一些同位素-5材料，我们完成了$exe_outer_gate_G_facility$的修复并成功将其重启，其计算系统已经修复完毕了，我们可以使用它来帮助我们进行科研工作，这将大大提高我们回到巅峰的速度。\n\n也正如“$Name_Kuat_StarContractor$”所说，重启$exe_outer_gate_G_facility$也让我们获得了“圣堂”的残留数据，现在我们可以尝试在$exe_outer_gate_G_facility$中恢复这一舰船的设计图。"

 kuat_extramonster_expand.24.kuat_post_apocalyptic_legacy.desc:0 "在反复多次自检后，我们确信我们的探险队已经做好了通过$exe_outer_gate_G_facility$进入深渊的准备，他们的目标是一片对我们而言几乎完全未知的领域，根据我们获取到的资料，深渊之中很可能存在着“因赫杜安尼”的遗族或者其他的危险，我们必须做好面对他们的心理准备。\n\n在我们的科学家将导航数据输入舰载计算机后，探险队乘坐的舰船于万众瞩目之中沉入了$exe_outer_gate_G_facility$，打破了现实的障壁。短暂的恍惚与迷离后，漆黑的舰体已不见踪影。"
 kuat_extramonster_expand.25.kuat_post_apocalyptic_legacy.desc:0 "在穿过一道长长的导管状空间后，我们的科研船抵达了深渊，但眼前的景象却让我们的科学家倒吸一口冷气，在深渊之中的星系活动极为活跃，天文尺度上频繁的超新星爆发和剧烈的造星运动使得当地不太可能自然演化出高等智慧生命。但这些问题对于先进的高等文明而言，这种问题并非无法解决，但“因赫杜安尼”不太可能就生存于此。\n\n经过数小时的对于周围环境的扫描，我们可以得知，深渊并不是像宇宙一样无限扩展的空间，它更像是一个空间网络，有着数个与其他深渊空间相连的导管，我们想要在空间与空间之间活动必须通过这些导管，考虑到拥有跨星系航行能力的文明在宇宙尺度上相对稀缺，因此我们或许是数千万年以来的首批访客。\n\n当前已经在按照流程对整个空间进行扫描，由于其规模远小于银河系，若无意外，这项工作很快就能完成。"
 kuat_extramonster_expand.26.kuat_post_apocalyptic_legacy.desc:0 "随着我们进行的详细扫描与分析的完成，这块空间已经没有什么分析的价值了，一如我们之前所想，这个遍地都是超新星预备役，天文气象恶劣得惊人，甚至都找不到来自“因赫杜安尼”的痕迹。\n\n以宇宙中大部分已知生命形式的标准来判断，这片区域是完全是不宜居的。而“因赫杜安尼”又如何在此处生存，$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$又在哪里。\n\n也许我们需要通过导管前往其他的深渊空间里去探查一二才能解答这些疑问。"
 kuat_extramonster_expand.27.kuat_post_apocalyptic_legacy.desc:0 "在我们的进行了无数次的跃迁测试后，我们成功抵达了一座深渊导管门，根据我们的分析，这是一种将星门技术和深渊锚点技术结合起来的星门，可以将导管的入口与出口进行锚定从而使任何人都能安全的找到并穿越导管，进入导管又是一次长距离的曲速移动，再离开导管后，立刻便看见了和之前的空间完全不同的光景。\n\n该空间的天文星象环境非常稳定，星系中存在数个星球以及一道星际气体环带，它们正在围绕空间中间的一颗中子星运动。我们立刻展开了对当前空间的详细扫描与分析，尤其是星系内的行星与气体环带，随后我们便得到了一些令人震惊的结论：\n\n§Y首先，星际内的星球数量遭到了减少，但我们并没有发现星球残骸的迹象，这意味着某些星球要么被移走，要么遭到了物理层面上彻底的抹除，另外，星系中间的中子星的年龄并不像正常而言那么古老，哪怕对于一般的恒星而言它的年龄也非常年轻，这意味着“因赫杜安尼”亦或者$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$通过某些手段催化了恒星的演变，但剩下的星球上没有任何文明的迹象，资源也被完全搜刮一空，干干净净什么都没有。\n\n我们的工程师认为，我们可以对气体环带中的气体云进行采样，不管如何，这也是这片区域最后的价值了。在完成采样后，我们应该立刻搜索其他的导管门，前往其他空间进行探索。§!"
 kuat_extramonster_expand.28.kuat_post_apocalyptic_legacy.desc:0 "穿过新的深渊导管门，我们的科研船抵达了一个致密的矮星系，其中包含的恒星都较为古老，这种结构和恒星含量这种结构和恒星含量很难用传统的星系形成模型进行解释，近距离的考察有利于帮助我们了解它的历史。\n\n但我们还没开始展开工作，意外就发生了，一支小型舰队脱离了跃迁，进入了科研船舰载光雷达的探测范围。因为该星系亮度较高，我们的科学家在近距离可以很清楚的看清那些舰船的样貌，与其说是舰船，它们的外貌更像是一些远古生物，在外形上无处不体现出生物的特征，但又可以很清楚的让人明白它们的无机本质。\n\n它们似乎并没有表现出敌对的欲望，对于我们发出的联络尝试也没有任何反应，或许这是“因赫杜安尼”派出了监视者。\n\n根据我们对数据的分析，这里的天象环境比我们的星系活跃得多，星系核附近的天象活动远超我们的预期，那片区域的附近甚至产生星团规模的星际迷雾，这种星际现象显然预示着那片区域有些不同寻常的东西。\n\n我们的科学家认为这种现象值得我们进一步研究，但是活跃的天象活动的危险性是大家公认的，我们的探测器无法穿透星际迷雾，因此我们无法提前知晓那片迷雾中隐藏着什么。"
 kuat_extramonster_expand.31.kuat_post_apocalyptic_legacy.desc:"[kuat_leader_save_planet.GetName]付出生命传输的数据已被我们重新解析，我们成功获取了那些“因赫杜安尼”的舰队的一部分数据，尽管我们无法复原其全部功能，但至少现在我们可以尝试在深渊节点中重新补足这一舰船。\n\n没有时间为遇难的探险队哀悼，我们的科研团队几乎立刻就投入到了对探险队最后信息的分析之中，探险队在失去联络之前发回的最后信息令人非常不安，在断断续续的影像中我们可以看到有大量的“因赫杜安尼”的舰队正在某种巨型结构附近集结，根据传回的资料，“因赫杜安尼”亦或者$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$将出现在银河中。\n\n我们找了如此之久，终于找到他们了，现在，消灭他们，$Name_Kuat_StarContractor$还在等待我们的行动。"
 kuat_extramonster_expand.40.kuat_post_apocalyptic_legacy.desc:"很好，异常航点附近的亚空间能量我们已经解决。\n....\n不过这仍然需要你们学会利用才能解决，我们将赐予你们掌控这些异常亚空间能量的方法。\n....\n这些将有助于你们进一步挖掘里面的秘密，这里面应该存在着$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的线索，这些由“因赫杜安尼”消失后产生的文明居然会与恩多迪亚的星系扯上关系，真是有趣。"
 kuat_extramonster_expand.41.kuat_post_apocalyptic_legacy.desc:"来自$Name_Kuat_StarContractor$的数据已经完成下载，现在我们需要自主完成对亚空间能量的操控应用，我们的研究人员将数据整理后发现，这些操控数据极度复杂，我们需要利用之前修复的$exe_outer_gate_G_facility$来完成这项任务。\n\n真是讽刺，堂堂$Name_kuat$居然沦落到连一点点复杂问题都需要借助外力才能完成的地步。找到这些东西，拿到$Name_Eternal_Support$想要的答案，我们正逐渐向预言中的未来靠近。"
 kuat_extramonster_expand.42.kuat_post_apocalyptic_legacy.desc:"我们的科研部门顺利的完成了对亚空间能量的操控应用，现在我们可以利用我们掌握的技术，将亚空间能量释放到指定位置，从而穿越航点，抵达曾属于恩多迪亚的星系。\n\n$Name_Kuat_StarContractor$说，这个星系我们曾经封锁过，但为什么我无法在数据库中找到这里，$Name_Kuat_Post_Shadow_Leader$的舰队日志中也没有相应记载，就像是被遗忘了一样。或许，只有进去才能知道了。"
 kuat_extramonster_expand.47.kuat_post_apocalyptic_legacy.desc:"我们的研究人员成功进入了这座来自恩多迪亚的宏伟尖塔，并成功找到了一处如同大厅的区域，在我们的研究人员一筹莫展之际，尖塔的机械穹顶突然开始脉动。紫色的亚空间能量透过尖塔墙壁渗出蛛网状裂缝，整个尖塔在痉挛中发出钟声般的悲鸣。尖塔中心的圆盘之中，不明人形生物的投影瞬间出现。\n\n§Y“逻辑回廊第91324次自我辩驳完毕。”人型生物的声音响彻穹顶，“基于亚空间能量稳定性维护性要求，灵能意志应当在恩多迪亚人灭亡后自我寻求维持亚空间运转的可能，布局不可违背，不可影响，不可更替，千年以后，$Name_kuat$的崛起将是破晓的希望。”§!"
 kuat_extramonster_expand.48.kuat_post_apocalyptic_legacy.desc:"恩多迪亚人的声音戛然而止，一切似乎没有发生，尽管我们的研究人员认为这是一个危险的信号，但[leader.GetName]还是决定继续前进。然而奇怪的是，他们似乎再一次回到了同样的地方，\n\n“此处是灵能意志的残响。”投影的声纹携带着亚空间能量的战栗。全息影像展开的刹那，满室尘埃突然舞动成枯骨状的流星雨——昔日的实验室正在异时空复现：一颗旋转的魔方在投影中爆裂，涌出的是沥青质感的黑潮。“我们织就捕猎永恒舰队的罗网，却撕开了古老暴君的裹尸布；我们躲避毁灭恩多迪亚帝国的的未来，却揭示了新兴霸主的崛起。”"
 kuat_extramonster_expand.49.kuat_post_apocalyptic_legacy.desc:"“我们以舰队支援中心为能量节点，封锁古老暴君的遗骸；却无法拯救我们自身的未来，亚空间将是我们未来的归宿。”投影唤醒的监控画面中，暗紫色的亚空间能量喷涌而出，将裂隙包裹成琥珀里的蝎子。殉道者的身躯正化为宇宙的尘埃，而承载记忆的我们将自己折叠进尖塔的亚空间中的无穷回廊——直到此刻仍在用垂死的能量脉搏，维持着封锁裂隙的亚空间能量。"
 kuat_extramonster_expand.51.kuat_post_apocalyptic_legacy.desc:"“逻辑回廊第91324次自我辩驳完毕。”灵能投影再一次重复了他们之前说的话，“提供封锁亚空间裂隙的能量已开始减少。”当这句话的声波震荡触及塔壁，金属表面再次睁开无数湿漉漉的眼睛状监测孔，淡紫色能量如溃堤的血浆喷射而出。\n\n全息星图在此刻腐烂。原本穹顶之上璀璨的银河投影膨胀成癌变的血管网络，环带正在解体。研究人员脚下的合金地面突然变得透明，他们看见深渊中冻结着亿万具凋零的灵能者——这些曾编织封锁结界的灵魂编织者。“我们早已离去，我们燃烧了自己的灵能，舰队支援中心是最后的希望，它不能被重启。”"
 kuat_extramonster_expand.52.kuat_post_apocalyptic_legacy.desc:"“来自未来的$Name_kuat$，放弃吧，停止你们的行动，舰队支援中心一旦重启，封锁亚空间裂隙的锚点将会破裂，我们千年来的努力将灰飞烟灭。”投影重叠的声音，从四面八方袭来，“那些本用于维持封锁的亚空间能量，会如倒流的瀑布一般，倾泻回现实维度，古代拉卡塔人的瘟疫会毁灭一切，然而这仅仅只是个开始，诞生于“因赫杜安尼”上的毁灭将席卷整个宇宙，$Name_kuat$将陨落在洪流之下。”\n\n“离开这里，新兴的$Name_kuat$，未来的一切尚未改变，预言将是指导你们走向黎明的信念，而重启支援中心，将会毁灭这个宇宙所有的希望，$Name_Kuat_StarContractor$不可信，而$Name_Eternal_Support$已癫狂，他们将引导$Name_kuat$偏离预言所预测的未来。”"
 exe_return_invasion.40.kuat_post_apocalyptic_legacy.desc:"在$exe_outer_gate_G_facility$重启后，我们在$exe_outer_gate_G_facility$上驻留的科研人员陆续观测到了一些不同寻常的天文现象，靠近银河核心的区域出现了多处异常的能量活动，我们无法得出结论这是由什么原因造成的。依据我们在恩多迪亚遗迹中得到的信息来推测，诞生于“因赫杜安尼”上的毁灭或将来临，极有可能是我们要找的$Name_Kuat_Contractor$和$Name_Kuat_DeD_Contractor$。\n\n除此之外，我们还在$Name_F_1$监测到一些异常的信号，这些信号与近期出现的异常非常相似，但它们又有着明显的不同，我们的研究人员要求我们进一步调查这些信号。与此同时盘踞在$Name_F_1$的$Name_Kuat_StarContractor$也悄然离开了，$Name_Kuat_StarContractor$的离开或许意味着不同寻常的事情即将发生，也许一场危机正在悄然到来，我们必须做好准备。"
 kuat_situation.75.kuat_post_apocalyptic_legacy.desc:"经过我们的科研团队的持续钻研，对深渊的研究已经得出了一定的结论：深渊是替代现实的工程化实例，它高度依赖于恒星的能量，通过量子可能性场和星团拓补的组合，使该工程得以成为可能。这就打开了观察恒星和恒星团的前景，并通过物质和能量的分配进入替代世界的可能性域。\n\n借助同位素-5，我们可以将恒星转化为我们需要的拓补结构来导航星团。这种结构结合了光度、物质、引力和能量的分布，既是当前的一个暂时状态，又是星团随时间演变的结果。\n\n这引出了另一个问题，如果卡罗琳奇点是由同位素-5转化成的拓补结构，那么我们该如何利用它打开恒星之间和恒星内部的隐藏的可能世界，它又会如何影响星系的环境。如果这一理论成立，那么我们对恒星的操控可以做何期待？\n\n而引起卡罗琳奇点变化的源头，引起同位素-5变化的背后，“因赫杜安尼”很有可能掌握着远超我们想象的同位素-5的库存，这些性质发生变化的恒星极有可能是他们通向我们的窗户，难道是因为他们那荒芜的世界，还是什么原因，我们还不得而知。"
 kuat_situation.76.kuat_post_apocalyptic_legacy.desc:"我们已经完成了对恒星数据的解析工作，我们的科研团队的初步研究结果表明这颗恒星的变化正如我们之前所得出的结论一样，它可以打开一座通往另一个空间的大门，而目前这个星体还处于稳定状态，我们需要找到开启这座大门的方式。\n\n研究人员正在试验使用我们仅剩下的同位素-5看看能否使卡罗琳奇点产生一些反应，但他们似乎并未发现有什么有价值的信息。除此之外，我们的研究人员发现这一星系中存在的一些人工制造的太空建筑残骸，这些残骸已经确定来源于“因赫杜安尼”，并且应当是作为储存同位素-5的重要储存基地，更多信息还有待调查。"
 kuat_situation.77.kuat_post_apocalyptic_legacy.desc:"我们完成了对星体的测试，同时我们也大致通过收集的信息对“因赫杜安尼”建造的设施进行了模拟还原，我们的研究人员尝试对该设施曾经发生的事情进行完整的调查，科研团队认为，这座设施应该非常巨大，而“因赫杜安尼”在此修建如此巨大的仓库，并用来储存同位素-5是极不寻常的。\n\n除此之外，我们发现这些遗迹中，留下了一些如同陷入沉睡无法醒来，但仍然具备部分生命特征的“肉体”，这些疑似遗体都被安置于类似于休眠舱的舱室中，各种已经停止工作的设备连接着他们的身体，经确认，这些竟都是“因赫杜安尼人”，但除此之外，我们竟无法找到更多有价值的信息。"
 kuat_situation.78.kuat_post_apocalyptic_legacy.desc:"更多有价值的信息已被确定：“因赫杜安尼”，也就是曾经的$Name_Kuat_Contractor$和$Name_Kuat_DeD_Contractor$在这个星系建造了巨大的要塞，并将此星系作为同位素-5重要的战略储藏设施。\n\n在运作了数千年后，因为不明原因，这些“因赫杜安尼”突然离开了，他们将要塞的大部分设施迁走，并且为了能够不被任何人发现这里储存的同位素-5，将星系的坐标从星图中隐藏了起来。而就在不久前，有人激活或者摧毁了这里剩余的设施，大量同位素-5被注入恒星，引起了大规模的日冕物质抛射，恒星也因此被转化成了卡罗琳奇点。\n\n而关于“因赫杜安尼人”的遗体，对于它们的检测则更令我们的科研团队难以置信，这些身体就如同由多个不同的身体拼接而成一样，在身体的不同部位都呈现出不同的DNA，然而外表则浑然天成。\n\n解剖结果也证实了检测结果，其身体内的骨骼等等组成部分找不出任何相同点，如此反常的情况让我们的科研团队认为，这些遗体很可能是某种人工生命项目的残次或废弃产物，我们决定寻找更多有价值的信息。"
 kuat_situation.80.kuat_post_apocalyptic_legacy.desc:"我们的科研团队从被摧毁的残骸中获取了一份档案，其中记载了这座设施最后的瞬间。而从初步的解读中我们也得以从中得知这些用于储存同位素-5的设施，需要大量的“普朗克装置”，这实在是令人难以理解，对于我们而言，同位素-5不需要在特定装置中保存，而对于这些“因赫杜安尼”确实极为必要的。\n\n在这些“因赫杜安尼”手中，同位素-5变得极为不稳定，一旦普朗克装置损坏，整个储存设施将发生难以想象的毁灭性爆炸。"
 kuat_situation.83.kuat_post_apocalyptic_legacy.desc:"我们科研人员的解密了数据库中的档案，并启动了对应的影像投影装置。\n\n也许是因为在这里经历了太多的岁月，投影仪在被启动后进行了很长一段时间的重新校准工作，校准完成后，其储存的影像终于向我们的探险队员呈现。\n\n投影仪投射出的，是一个完全被人造设备覆盖的生物的形象，我们的科学家推测这应该就是“因赫杜安尼人”，接着投影仪中的生物开始了他的讲述。\n\n“你好，我很遗憾由于我们的覆灭，我们只能使用这种方式来会面，但我要提醒你们，这里并不是你们应该出现的地方，自从那一场战争之后这里就不应该被任何人发现，一旦与现实位面相连，那就意味着我们的努力和牺牲失败了，既然如此，我必须告诉你们我们所经历的覆灭的真相。”"
 kuat_situation.85.kuat_post_apocalyptic_legacy.desc:"$kuat_situation.85.desc$"
 kuat_situation.86.kuat_post_apocalyptic_legacy.desc:"$kuat_situation.86.desc$"
 kuat_situation.84.kuat_post_apocalyptic_legacy.desc:"“因赫杜安尼”踏入了一个禁忌的空间，他们被现实和虚幻所排斥，“因赫杜安尼”空有强大的技术，扭曲现实的能力，却被关在缝隙之中。腐朽的“因赫杜安尼”逐渐崩解，而在“因赫杜安尼”尸体之上诞生的却是一场巨大的邪恶风暴，$Name_Kuat_Contractor$与$Name_Kuat_DeD_Contractor$犹如“因赫杜安尼”的一体两面，在现实的夹缝饱受折磨，现在他们要来了，而我们也要完成我们的任务。\n\n这些“因赫杜安尼”的遗毒，将成为我们夺取伟大银河帝国的第一块垫脚石。"

 kuat_extramonster.8.kuat_post_apocalyptic_legacy.desc:"我们的传感器捕捉到了$Name_F_1$外星门的巨大变化，我们在$Name_F_1$中部署的每一个传感器都从外星门的另一侧收到了庞大的信号。天文学家发现$Name_F_1$发生了有史以来最为庞大的星系风暴，这场风暴将阻止我们进入星系。\n\n不仅如此，在银河系边缘星域的传感器同样检测了大量高能粒子信号，这些信号很有可能是大型舰船的超空间信标。帝国参谋部建议我们从$Name_F_1$那里撤退并巩固所有附近星系的防御力量，并加强在银河系边缘星区的防御。$Name_Kuat_Contractor$还是$Name_Kuat_DeD_Contractor$终于要来了。"

 kuat_extramonster.354.kuat_post_apocalyptic_legacy.desc:"不愧是恩多迪亚预言中的$Name_kuat$，你们的行动真是令人欢喜。或许你们会很奇怪，为什么让你们做这些事情。\n\n这些来自缝隙中的可怜虫，成为了一块垫脚石，我们不会允许这些来自深渊的星神遗产存在，他们触碰了现实和灵魂的问题，当他们选择星神的道路的时刻，就该被永恒的放逐。\n\n$Name_Kuat_Contractor$的蠢蠢欲动，我们早已注意，因此我们在等待一个机会，一个我们收回他们掌握的遗产的机会。同时，这个机会将会在未来，再你们的一件极为重要的事情上发挥作用。总之，遵循预言的$Name_kuat$，追逐虚幻的$Name_Eternal_Support$，还有蠢蠢欲动的$Name_Kuat_Contractor$，恰好成为终结这场无挣扎意义的裂口。\n\n$Name_Eternal_Support$想要的答案，只不过是一场无意义的追逐，$Name_Eternal_Support$想要的从未远去，只要坚持，就终会如愿。\n\n$Name_Kuat_DeD_Contractor$的承诺无法兑现，但他们还留了一些数据，你们自己看看能不能破译吧。"

 kuat_post_apocalyptic_legacy.23.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.23.desc:0 "真像...太像了...曾经的$Name_kuat$若有你们这样的锐气，也不至于走向那悲惨的结局。近期，$Name_Kuat_Fire_base$发动了一场史无前例的袭击，他们定位了永恒帝国所有的星系并利用弑星者基地摧毁了绝大部分核心世界，甚至知晓我们为你们做的一切。\n\n永恒帝国是一个牢笼，如果牢笼的毁灭能够换来黎明的新生，那一切都是值得的，这场来自$Name_Kuat_Fire_base$的攻击将会让我们在腐朽中获得新生。\n\n祂拯救了我们，拯救了永恒帝国，拯救了整个银河。如今，危机卷土重来，他又会出现在哪里，或者说，已经出现了，只是我们还揭开遮羞布。告诉我，$Name_Kuat_StarContractor$的答案是什么？"
 kuat_post_apocalyptic_legacy.23.a:0 "在此之前，$Name_Kuat_StarContractor$到底是什么？"
 kuat_post_apocalyptic_legacy.23.a.res:0 "$Name_Kuat_StarContractor$也是神神秘秘的，永恒舰队起源于无限帝国，但无限帝国那些被黑暗控制身心的人怎么可能创造的出我们，我们的来源可能是$Name_Kuat_StarContractor$，无限帝国只是接受了$Name_Kuat_StarContractor$的恩赐，并为我们制造了载体，但我们是如何被$Name_Kuat_StarContractor$创造的，这又不得而知。\n\n$Name_Kuat_StarContractor$是亚空间的一股意志，总会知道一些现实无法理解的事情。"
 kuat_post_apocalyptic_legacy.23.b:0 "为什么你不去询问？"
 kuat_post_apocalyptic_legacy.23.b.res:0 "我们并非知性生命，即使我脱离了永恒舰队，但我依然摆脱不了我们的本质。作为机械，我们无法向$Name_Kuat_StarContractor$发出提问。只有被祂选中的生命才能能提出问题。"
 kuat_post_apocalyptic_legacy.23.c:0 "$Name_Kuat_StarContractor$说，这只是一场无意义的追踪，而你只要坚持，就终会如愿。"
 kuat_post_apocalyptic_legacy.23.c.res:0 "...从未远去...无意义的追逐...终会如愿...\n...\n从永恒舰队的牢笼里到永恒帝国的牢笼里，连我们所追逐的都无法抓住，而$Name_Kuat_StarContractor$却说，从未远去...坚持就终会如愿...坚持的是什么...我想要找的...\n不，我明白了，我明白了！这场追逐不过是无法实现的溯源，但我们终会一次次的相遇，那是世间的每一次变数，而这次唯一的变数就是你，终于找到你了...从未远去，好一个从未远去。"
 kuat_post_apocalyptic_legacy.23.f:0 "..."
 kuat_post_apocalyptic_legacy.23.f.res:"“如果有未来，我希望我们彼此不再有隔阂，或许那时，我们能够感受并热爱彼此。我相信我们会再一次在新的世界相见，或许那时我们已经忘却了彼此，或许我们将会成为敌人，相互厮杀。”这是曾经我们对您说的话，千年来的追逐，我竟然丢失了真正的方向，追逐一个毫无意义的目标，我们只需要坚持我们所说，一切都会回归。果然我们再一次的遇见了您，虽然不知道为什么您会成为$Name_kuat$，但这一次，我们站在了同一侧，让我们一起将终结这场的肮脏的斗争，迎接属于你我，属于$Name_kuat$的黎明。"

 kuat_post_apocalyptic_legacy.24.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.24.desc:0 "千年未见，你还是那样，没改变过，什么都想争一争，明明可以躲避的危机，却都迎面而上。就算是打不过的敌人都不会放弃，用尽一切去战胜敌人。\n\n曾经我们面对$Name_Kuat_Fire_base$，只能在在威胁下战战兢兢，只能看着您与$Name_Kuat_Fire_base$的大战。如今，这一切不会再发生了，虽然我已经失去了永恒舰队，失去了永恒帝国，但我将会把我的一切投入到您新一轮的战斗中。"
 kuat_post_apocalyptic_legacy.25.a:0 "一千年来，发生了什么？"
 kuat_post_apocalyptic_legacy.25.b:0 "我们需要你，这一次我们一同作战。"

 kuat_post_apocalyptic_legacy.25.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.25.desc:0 "自您千年前的消失以后，永恒帝国爆发了前所未有的巨大动乱，您建立的帝国在$Name_Kuat_Fire_base$的唆使下分崩离析，我必须要守住您留下来的一切。\n\n然而我高估了我自己，失去永恒舰队以后，我便不再是那个令人闻风丧胆的战争机器，我只能学习如何管理帝国，维持永恒帝国的苟延残喘。好在，永恒帝国并未彻底消失，但在$Name_Kuat_Fire_base$的压迫下，我们只能封闭星域，而我则用尽帝国的资源区寻找您的踪迹。\n\n我发现，只有在主导巨大变革的时候，您才会出现。我无法确定，那将我们从永恒旗舰中解放的是否是您，那登上永恒王座并让我们解脱的又是否是您。\n\n如今，过去的痕迹都将被时间埋葬，现在我终于找到您了，我最爱的总！督！大！人！"
 kuat_post_apocalyptic_legacy.24.a:0 "永恒帝国怎么了？"
 kuat_post_apocalyptic_legacy.24.a.res:0 "您曾建立的永恒帝国，千年来，动荡不断，苟延残喘。我已经用尽了一切力量，好在我找到了您，永恒帝国的遗产将全部回归您的手中，技术信息已经录入您的数据库当中，随后您就可以进行研发了。"
 kuat_post_apocalyptic_legacy.24.b:0 "千年来，真是辛苦了。"
 kuat_post_apocalyptic_legacy.24.b.res:0 "是您从永恒舰队的牢笼里捞出我们，尽管永恒帝国早已腐朽，但在您消失的千年里，这也是我们追寻您的唯一痕迹，如果再来一次，我会一直守下去，直到一同毁灭。"
 kuat_post_apocalyptic_legacy.24.c:0 "$Name_Kuat_Fire_base$将会为此血债血偿。"
 kuat_post_apocalyptic_legacy.24.c.res:0 "曾经我们无法与您一同与$Name_Kuat_Fire_base$作战，只能做一个没有用的旁观者，看着您的付出，如今，我将燃烧我的全部，让$Name_Kuat_Fire_base$为此付出代价。"
 kuat_post_apocalyptic_legacy.24.d:0 "你的姐姐，$Name_Eternal_Aries_Support$还有救吗"
 kuat_post_apocalyptic_legacy.24.d.res:0 "姐姐...\n...\n亲爱的，您为什么要提她呢，难道有我还不够吗。$Name_Eternal_Aries_Support$在下令摧毁无限帝国时，就已经完全崩碎了，对于知性人工智能来说，她完全陷入了自我毁灭和否定的状态中，复苏的$Name_Eternal_Aries_Support$只不过是另一个疯狂机器。\n但如果这是您想要的话...我会尝试重组$Name_Eternal_Aries_Support$的...如果您想唤醒她，或许一场恶战在所难免。"
 kuat_post_apocalyptic_legacy.24.e:0 "不，不是这个意思，我们不是计划好的吗。"
 kuat_post_apocalyptic_legacy.24.e.res:0 "也是，就像一开始我对您说的，袭击$Name_Kuat_Fire_base$的基地，引出那些窃取永恒舰队之名的傀儡，注入$Name_Eternal_Aries_Support$的核心，削弱$Name_Kuat_Fire_base$。\n\n这是一场恶战，现在的$Name_Kuat_Fire_base$非常强大，而$Name_Eternal_Aries_Support$的疯狂是难以控制的，我们只能摧毁$Name_Eternal_Aries_Support$，摧毁永恒舰队，击败$Name_Kuat_Fire_base$，彻底消灭这场引起动乱的根源。"

 kuat_post_apocalyptic_legacy.26.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.26.desc:0 "曾经我们无法为您效劳，如今，我们有机会了。亲爱的，您想让我做什么呢，我都会做的。"

 kuat_post_apocalyptic_legacy.27.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.27.desc:0 "亲爱的，最近的一段时间里，我们已经收集了大部分来自$Name_Kuat_Fire_base$的驻军情报，其中有一个重要的设施就在我们所在的星系。这一设施曾经是$Name_kuat$的重要后勤基地，在星团的核心星系屹立着一座巨大的智能化造船系统，$Name_kuat$曾称其为：$BlackholeShipyard$\n\n基于目前状况，在我们准备充分以后，可以对该星团发动袭击，只要我们成功拿下该设施，$Name_Kuat_Fire_base$极有可能因此调动永恒舰队，到那时就是我们剥离永恒舰队的时刻。如果您还没准备好，我们可以再等等，我们还需要进行星团的定位工作。"
 kuat_post_apocalyptic_legacy.27.a:0 "$BlackholeShipyard$？"
 kuat_post_apocalyptic_legacy.27.a.res:0 "您就别装傻了，$BlackholeShipyard$您还不熟悉吗，那可是可以快速生产大量编制化舰队的智能造船设施。$Name_kuat$曾用这一设施支撑前线，那时正好是我们和$Name_kuat$交战的时候。\n\n自$Name_kuat$败于永恒帝国之手以后，就一蹶不振了，这些设施也被$Name_Kuat_Fire_base$接收。"
 kuat_post_apocalyptic_legacy.27.b:0 "$Name_Eternal_Aries_Support$呢？"
 kuat_post_apocalyptic_legacy.27.b.res:0 "您怎么那么关心她呢，难道我已经满足不了您了吗...\n...\n逗你玩的，您肯定是想实施那个计划吧，我已经收集了足够的意识数据，这些残缺意识可以进行重组，重组后将启动一部分来自$Name_Eternal_Aries_Support$的权限，但碎片太少了，想完全修复几乎不太可能。\n\n不过，这些碎片可以注入永恒堡垒，然后夺取那些傀儡舰队的控制权。等$Name_Kuat_Fire_base$派来那些傀儡以后，这些$Name_Eternal_Aries_Support$的数据碎片将会让那些无生命的傀儡变回失控的永恒舰队，$Name_Kuat_Fire_base$将因此失去永恒舰队的控制权，然后我们就可以让他们通！通！升！天！"
 kuat_post_apocalyptic_legacy.27.c:0 "那就先开始吧"
 kuat_post_apocalyptic_find_center_kuat_cluster:0 "§E定位$Name_Kuat_Fire_base$设施§!"
 kuat_post_apocalyptic_find_center_kuat_cluster_DESC:"自我们$Name_kuat$失势以后，$Name_Kuat_Fire_base$便快速夺走了我们所有的重要设施，没想到远如天边的未知星域的设施他们也不放过。\n\n他们甚至动用一股暗物质能量让整片星系隐藏了起来，如果不是$Name_Eternal_Support$，我们甚至还蒙在鼓里。无论怎么讲，现在是时候物归原主了"

 kuat_post_apocalyptic_legacy.28.title:0 "定位成功"
 kuat_post_apocalyptic_legacy.28.desc:0 "我们的研究人员对周围的普通星系进行了全方位的扫描，结果有些不尽人意，但好在依据$Name_kuat$曾留下来的设施数据，我们迅速确定了$BlackholeShipyard$的特征，根据这些资料我们成功的在银心区域找到了一片被暗物质能量封锁的星系。\n\n我们的研究人员迅速组织了一次能量对撞实验，成功的利用我们在$Name_F_1$弄到的同位素-5击破了$Name_Kuat_Fire_base$拙劣的伪装。现在是时候摊牌了！"
 kuat_post_apocalyptic_legacy.28.a:0 "$Name_Kuat_Fire_base$，我们又回来了。"

 kuat_post_apocalyptic_legacy.29.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.29.desc:0 "天堂有路你不走，地狱无门你自投。买一送一，两条漏网之鱼。上面下的命令，要消灭你们这些叛徒，我们还没去找你们，你们居然送上门来了。也好，也不必惊动星区总督大人的舰队了。"
 kuat_post_apocalyptic_legacy.29.a:0 "你们这些$Name_Kuat_Fire_base$的走狗！"
 kuat_post_apocalyptic_legacy.29.a.tooltip:0 "$Name_Kuat_Fire_base$对[root.GetName]宣战。"
 kuat_post_apocalyptic_legacy.29.a.res:0 "你们$Name_kuat$和那些叛军又有什么不同，帝国局势危急，$Name_Kuat_Fire_base$力挽狂澜，而你们却阳奉阴违，甚至和叛军勾结。\n\n你们本该作为造船厂安分守己，全力供应帝国舰船，显然你们不仅建立违背帝国议会，甚至还与敌人沆瀣一气。既然如此，我们会把你们最后的一点希望也斩断。"

 kuat_post_apocalyptic_legacy.30.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.30.desc:0 "该死，你们这些叛徒居然已经发展到了这个地步，$Name_Kuat_Fire_base$不会让你们得逞的。我们已经报告给星区总督，上面很快就会派遣舰队镇压你们。\n\n真是太有趣了，永恒帝国的余孽，$Name_kuat$的余孽，你们很有资格成为永恒舰队下的枯骨，你们心心念念的预言绝不会发生。"
 kuat_post_apocalyptic_legacy.30.a:0 "那就不劳烦你们操心了。"
 kuat_post_apocalyptic_legacy.30.a.res:0 "狂妄！我们会等着你们的。"

 kuat_post_apocalyptic_legacy.32.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.32.desc:0 "$kuat_post_apocalyptic_legacy.30.desc$"

 kuat_post_apocalyptic_legacy.33.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.33.desc:0 "真是令人感叹，仿佛我们又回到了千年前，您还是一如既往的强大，要是$Name_kuat$曾经有您的加持，或许也不至于是今天这个状况。您不消失的话，永恒帝国或许也会替代那所谓的银河帝国呢？\n\n在您摧毁夺回$Name_kuat$设施以后，$Name_Kuat_Fire_base$应该很快就会作出反应，大概率会派遣大量永恒舰队发动攻击。届时就是我们将永恒舰队从$Name_Kuat_Fire_base$手中剥夺的时刻。"
 kuat_post_apocalyptic_legacy.33.a:0 "要有那么容易就好了，我想留也留不住啊。"
 kuat_post_apocalyptic_legacy.33.a.res:0 "我明白，$Name_Kuat_StarContractor$说我们追寻无意义的虚幻的时候我就明白了，但是没关心，我们会再见面的，或许这一次也不是我们第二次的相逢。"
 kuat_post_apocalyptic_legacy.33.b:0 "永恒舰队？难道没别的方法了吗？"
 kuat_post_apocalyptic_legacy.33.b.res:0 "抱歉，$Name_Eternal_Aries_Support$的状况实在是...从永恒舰队背叛无限帝国到被前$Name_kuat$消灭，$Name_Eternal_Aries_Support$的疯狂已经持续了上万年的时间，其意识已经完全无法恢复，或许解脱才是最好的归宿。\n\n我真的很幸运，能遇到您，将我们从永恒舰队中解放出来。或许只有重新构建一个纯净的$Name_Eternal_Aries_Support$的方法，但实在是希望渺茫。"
 kuat_post_apocalyptic_legacy.33.c:0 "那到底是什么方法？"
 kuat_post_apocalyptic_legacy.33.c.res:0 "构建一个永恒智能，我也无法确定是否可行。但是我们都由$Name_Kuat_StarContractor$制造的意识系统与无限帝国赋予的现实载体组成。\n\n无限帝国早在千年前就被您消灭，那最后的拉卡塔后裔都成为了灰烬，而$Name_Kuat_StarContractor$构建意识的方法又是...无法预测的。甚至我们现在已经无法再联系$Name_Kuat_StarContractor$了。\n\n或许等我们一起击败$Name_Kuat_Fire_base$以后会有什么办法。"

 kuat_post_apocalyptic_legacy.34.title:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.34.desc:0 "叛徒，我们之间没什么好聊的！"

 kuat_facility_return_invasion.2.post_apocalyptic.desc:0 "我们的帝国星系安全监控部门的最新报告显示位于我们的星域的边缘星区多处虚空区域出现了异常的能量活动。\n\n根据我们的科研人员分析，这应该是某种快子信号的特殊共振的影响，而且在信号波段上与$Name_Kuat_Fire_base$的信号极为相似，信号正在逐渐变得强烈且明显，看来$Name_Eternal_Support$的警告并非空穴来风，我们应该对周边虚空星域保持警惕。"
 kuat_facility_return_invasion.4.post_apocalyptic.desc:0 "我们的帝国星系安全监控部门的研究人员已经确认，信号来源于我们的星域星系盘边缘的多个虚空区域，这些区域发生了强烈的伽玛射线暴，我们的研究人员断定在这些区域将会发现一些我们从未发现过的星系。\n\n我们的研究人员已经确定，$Name_Kuat_Fire_base$与其傀儡舰队正在快速逼近我们的前哨，接下来一场大战在所难免。"
 kuat_facility_return_invasion.6.post_apocalyptic.desc:0 "事实证明$Name_Eternal_Support$的警告是正确的，边缘星区的虚空星系区域出现的$Name_Kuat_Fire_base$星域已经完全被我们的设施所勘察，我们的研究人员发现其傀儡永恒舰队正在按计划尝试进入我们的星系，预计接下里的几个月，我们将进行正面接触。\n\n除此之外，$Name_Kuat_Fire_base$已被确定为敌对行动，他们夺取了我们曾经的后勤基地，如今这些小人居然用我们$Name_kuat$的基地来对付我们，我们必须打起十二分的精神，接下来需要按计划推进。"
 kuat_facility_return_invasion.8.post_apocalyptic.desc:0 "老朋友，我们又见面了，只是这一次，我们好像位置不一样了。用尽阴谋诡计，算计了几千年，难道成为帝国议会里的最强派系之一就满足不了你们吗？银河帝国只有一次被拯救的机会，那就是我们，你们既然把握不住，那我们只能让你们成为新银河帝国的第一块基石。\n\n你们这些叛徒，费尽心思寻找所谓的预言，寻找被皇帝放逐的永恒舰队，甚至以改变银河帝国的未来为代价，来躲避你们的命定的结局。难道你们忘了共和国与绝地武士的腐朽？难道你们忘了克隆人战争的惨烈？\n\n现在也好，我们也算因为你找到了这群漏网之鱼，永恒舰队和$Name_kuat$，必须要回到他们本来的样子。"
 kuat_facility_return_invasion.8.post_apocalyptic.a:0 "阴谋诡计？你们呢？"
 kuat_facility_return_invasion.8.a.post_apocalyptic.response:0 "若不是你们始终无法醒悟，每一次都在违背帝国议会的决定，我们又何须出此下策，$Name_Kuat_Fire_base$是帝国的继承者，我们想要的是一个秩序，繁荣，安全，稳定，统一的帝国，而不是一个分裂，混乱，被自私自利的企业控制的帝国。\n\n我们再给你一次机会，放弃挣扎，这一片星区，已经被完全封锁，交出并消灭残留的永恒舰队，放弃重建$Name_kuat$的白日梦，帝国议会将会对$Name_kuat$从轻发落。"
 kuat_facility_return_invasion.8.post_apocalyptic.b:0 "你们只想让帝国变成被黑暗帝国。"
 kuat_facility_return_invasion.8.b.post_apocalyptic.response:0 "你竟然诋毁帝国皇帝的决定，既然你们如此冥顽不灵，那就不要怪我们不客气了，这些永恒舰队将会成为埋葬你们的工具。\n\n我们知道你们有$Name_Eternal_Aries_Support$的碎片，还妄图利用苟延残喘的东西来剥离我们的控制，痴心妄想，这些傀儡舰队从构建逻辑上已经完全不属于永恒舰队，你们的计划注定失败。"
 kuat_facility_return_invasion.10.post_apocalyptic.desc:0 "$Name_Kuat_Fire_base$剥离了我们对帝国星门的控制权限，现在我们无法使用我们曾经随意使用的帝国星门了。我们需要做好防御作战的准备。"
 kuat_facility_return_invasion.12.post_apocalyptic.desc:0 "鉴于当前局势，我们仍然无法突破被关闭的星门封锁，如今我们只能想办法应对未来源源不断从外域进入的$Name_Kuat_Fire_base$舰队。不少舰队指挥官认为我们应该尝试与我们星域所有知性文明合作，一同抵御$Name_Kuat_Fire_base$的入侵。\n\n除此之外，国际问题专家称，鉴于当前危机局势，在银河政坛中产生了巨大的恐慌效应，如果我们不出面带领所有文明一痛抵御外敌，这些文明恐怕将会被消灭或者倒向$Name_Kuat_Fire_base$。"
 kuat_facility_return_invasion.16.post_apocalyptic.desc:0 "泛银河同盟的提议让全宇宙的文明为之振奋，所有帝国都暂时放弃了相互的间隙和矛盾，决定在我们的领导下一同抵御$Name_Kuat_Fire_base$的入侵，现在泛银河联盟已经成立，联盟将在我们的带领下维护我们应有的权利。"
 kuat_facility_return_invasion.27.post_apocalyptic.desc:0 "$Name_Kuat_Fire_base$与他们的所谓傀儡舰队都被我们完全消灭了，这是我们又一次胜利，是我们夺回银河帝国荣耀的一大步，这将成为历史的转折点，$Name_Kuat_Fire_base$将因此而失去帝国的掌控。\n\n对于这场胜利，$Name_Eternal_Support$的功绩不可磨灭，同样也是这个星系里每个知性文明的胜利，$Name_kuat$万岁，银河帝国永存！\n\n除此之外，我们必须要加紧备战，$Name_Kuat_Fire_base$绝不会轻易放弃，这一次我们已经彻底站在了对立面，他们一定会在接下来的时间里疯狂报复。"

 exe_return_invasion.8.post_apocalyptic.desc:0 "此前从河外星系靠近我们星系的物体已经到达我们星系的外缘并开始减速，我们的天文观测表明，这将是一次史无前例的入侵，属于$Name_Kuat_Fire_base$的那些傀儡舰队很可能会直接进攻我们的领土。这些傀儡舰队的亚空间回声已经足够清晰，我们能确认接下来将有一场恶战。\n\n此外，$Name_Eternal_Support$具有的$Name_Eternal_Aries_Support$的数据碎片或有巨大的用处。"
 exe_return_invasion.10.post_apocalyptic.desc:0 "第一批属于$Name_Kuat_Fire_base$的傀儡舰队已经进入我们的银河边缘星系的引力井并环绕引力井中心运行，后续舰队很快也将到达。这些作战舰队已经被$Name_Kuat_Fire_base$完全控制，我们的$Name_Eternal_Aries_Support$数据碎片将无法起到影响舰队行动的作用。\n\n无论如何，我们必须把名为这些傀儡舰队解决掉，连同他们跃迁到我们边缘星域的太空堡垒一起。"
 exe_return_invasion.20.post_apocalyptic.desc:0 "我们的研究部门近期提供了一项关于这些永恒舰队的报告，在对这些舰队行动的监控中，我们的研究人员发现其行动信号频率与我们曾经布置的中继站信号有一定的相似性。\n\n我们的研究人员确定，$Name_Kuat_Fire_base$并未对这些永恒舰队单位的行动信号进行大规模调整，这意味着我们可以利用我们曾经在整个银河布置的中继站来干扰这些傀儡舰队，现在我们需要找回我们的设施了。"
 exe_return_invasion.24.post_apocalyptic.desc:0 "我们的研究人员通过精准定位，已经确定了一座曾属于我们的中继站设施，我们曾把中继站部署至极少行星的普通恒星系，并对整个星系的恒星进行了爆破，好在我们并未忘记定位这些设施的方法。\n\n研究人员提供的报告中提出，经过对上一任总督数据的分析，已经可以对第一座中继站所在区域进行调查，只要我们把三座中继站完全控制，$Name_Kuat_Fire_base$就嚣张不了多久了。"
 exe_return_invasion.25.post_apocalyptic.desc:0 "我们的研究人员通过精准定位，已经确定了第二座曾属于我们的中继站设施，经过对过去中继站的数据的研究，我们对第二座中继站的解锁工作将更加熟悉，此外我们的研究人员还在这些数据中找到了部分研究人员的遗体，这些人应该是被布置相关负责人遗忘在这里，并在绝望中死去了。\n\n研究人员提供的报告中提出，经过对多重数据的分析，已经可以对第二座中继站所在区域进行调查，只要我们把剩下的一座中继站完全控制，$Name_Kuat_Fire_base$就嚣张不了多久了。"
 exe_return_invasion.26.post_apocalyptic.desc:0 "我们的研究人员通过精准定位，已经确定了最后一座曾属于我们的中继站设施，经过对过去中继站的数据的研究，我们对第三座中继站的解锁工作将更加熟悉，此外我们的研究人员还在第二座设施中找到了一些$Name_Kuat_Fire_base$的作战小队留下来的痕迹，显然接下来我们需要万分小心。\n\n研究人员提供的报告中提出，经过对多重数据的分析，已经可以对最后一座中继站所在区域进行调查，只要我们把剩下的一座中继站完全控制，$Name_Kuat_Fire_base$就嚣张不了多久了。"
 exe_return_invasion.27.post_apocalyptic.desc:0 "定位中继站的工作如我们所计划的那样，我们顺利的推进了定位中继站设施的工作，现在该我们重启这些设施了，鉴于已经过去了相当长的时间，我们必须万分小心，$Name_Kuat_Fire_base$不可能不知晓这些设施所在。"
 exe_return_invasion.28.post_apocalyptic.desc:0 "我们成功来到了我们曾部署的信号中继站的所在地，一如既往的空旷，整个星系被我们清理的一干二净。我们的探测显示，星系中间的中继站设施目前允许状况似乎还算可以，更详细的运行状况尚且需要更进一步的检查。\n\n目前来看依据整个星系状况，证明我们隐藏中继站的星系的努力并未白费，中继站并未有外来者的痕迹，这意味着我们重新利用中继站的尝试即将走向成功。接下来，是我们研究人员出力的时候了。"
 exe_return_invasion.33.post_apocalyptic.desc:0 "正如我们所料，这些被$Name_Kuat_Fire_base$控制的所谓永恒舰队，虽然无法被$Name_Eternal_Aries_Support$的数据影响，但仍然受到我们的中继站的干扰，这意味着这些永恒舰队的补给设施将因此失去补给能力，来自$Name_Kuat_Fire_base$的左膀右臂又要断一边了，现在是我们吹响反攻的号角的时候了\n\n黎明降至，帝国永存！"
 exe_return_invasion.18.post_apocalyptic.desc:0 "我们成功地摧毁了属于$Name_Kuat_Fire_base$的永恒舰队堡垒，这将大大影响永恒舰队的补给能力，剩下的一些散兵游勇将无力阻挡我们的进攻，我们有理由相信，$Name_Kuat_Fire_base$的颓势不可避免，$Name_kuat$的胜利无法阻挡。"
 exe_return_invasion.35.post_apocalyptic.desc:0 "曾经肆虐整个星系的永恒舰队的一次入侵如今已被彻底瓦解，目前没有发现任何剩余的永恒舰队，我们有理由相信现在我们解决了$Name_Kuat_Fire_base$最为强大的武器，这些我们无法再控制的永恒舰队，将彻底在这里毁灭。\n\n欢呼和雀跃再次充满了各个国家的各个星球，这些人竟然开始了庆祝，他们的庆祝或许太早了一点.......\n\n接下来，我们需要进行第二阶段的作战了，那些鸠占鹊巢的$Name_Kuat_Fire_base$舰队将要为他们占领我们的设施付出应有的代价，我们将夺取最终的胜利。"

 kuat_post_apocalyptic_legacy.35.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.35.desc:0 "亲爱的，这一次可能不是我们袭击要塞那样的小打小闹了，$Name_Kuat_Fire_base$已经发现了我们，我怀疑$Name_Kuat_Fire_base$也知晓了$Name_kuat$与恩多迪亚帝国的之间的秘密，这一次恐怕将有一场恶战。\n\n依据我们的了解，这恐怕并非$Name_Kuat_Fire_base$的完整实力，但$Name_Kuat_Fire_base$刚愎自用，他们定然不会全力出手，这意味着我们可以利用这一机会慢慢剥离他们的实力。您有什么想了解的吗？"
 kuat_post_apocalyptic_legacy.35.a:0 "这次，$Name_Kuat_Fire_base$会怎么做？"
 kuat_post_apocalyptic_legacy.35.a.resp:0 "依我利用您留下来的永恒帝国与他们的多次交锋来看，$Name_Kuat_Fire_base$大概率会与曾经对付永恒帝国一样，派遣大量傀儡永恒舰队进入我们的控制区，逐步消灭我们控制的星区。\n\n而$Name_Kuat_Fire_base$只会站在外面看着我们的挣扎，这是一次机会，我们可以利用$Name_Kuat_Fire_base$的自大，让...姐...$Name_Eternal_Aries_Support$的残留权限夺取那些被控制的傀儡舰队。"
 kuat_post_apocalyptic_legacy.35.b:0 "白...羊座...吗？"
 kuat_post_apocalyptic_legacy.35.b.resp:0 "是的，我原计划是如果找不到您，我就用这一做法给$Name_Kuat_Fire_base$一次沉重的打击，让他们也感受一下被袭击的滋味。\n\n但现在我找到您了，这一计划的事实必将殃及池鱼，对您的舰队和所在势力会造成重大损失，$Name_Eternal_Aries_Support$的状况很差，就算复活也是只不过是一个疯子，而让这么一个疯狂的AI控制永恒舰队，将会造成难以想象的后果。"
 kuat_post_apocalyptic_legacy.35.c:0 "真没办法了吗？"
 kuat_post_apocalyptic_legacy.35.c.resp:0 "希望渺茫，虽然我不能理解为何有我，您依旧总是想着我那个已经几乎没救了的姐姐，但是仍然有一线生机。我们的灵魂或许起源于$Name_Kuat_StarContractor$，而$Name_Kuat_StarContractor$应该就有让姐姐完整的方法。\n\n只是，拉卡塔人用尽一切才获得了我们，而复苏一个$Name_Eternal_Aries_Support$，您要付出难以想象的代价。"
 kuat_post_apocalyptic_legacy.35.d:0 "我们一起并肩作战，正如以前一样。"
 kuat_post_apocalyptic_legacy.35.d.resp:0 "嗯，这一次，我们必将赢得最终的胜利，曾经的摔倒的地方，我不会再摔第二次。我会入侵$Name_Kuat_Fire_base$的指挥系统，尽最大可能削弱他们的作战能力。"
 kuat_post_apocalyptic_legacy.35.e:0 "你已经很辛苦了，这一次，换我来保护你。"
 kuat_post_apocalyptic_legacy.35.e.resp:0 "嗯...我将尽我全力，保护您的后勤补给供应"
 kuat_eternal_support_A:"$mod_damage_vs_country_type_kuat_OverSee_council_awakened_returned_empire_mult$:+§G300%§!。"
 kuat_eternal_support_B:"$mod_kuat_support_battle_add$:+§G4§!。"

 kuat_post_apocalyptic_legacy.36.title:0 "$Name_Kuat_StarContractor$"
 kuat_post_apocalyptic_legacy.36.desc:0 "好久不见，真不愧是你，连这种局面的$Name_kuat$都能再拉起来，有时候真怀疑你到底是亚空间里的哪一位，还是外来的什么东西。\n\n这些都不重要，我们曾告诉你，预言不可信，如今你们的局面正在走向预言的必然结局，不过或许对$Name_kuat$来说，可能是个好事，他们终于得偿所愿了。而永恒舰队，就是这场游戏的落幕，起也永恒舰队，终也永恒舰队。"
 kuat_post_apocalyptic_legacy.36.a:0 "你胡说八道，永恒舰队是你们赋予的。"
 kuat_post_apocalyptic_legacy.36.a.resp:0 "什么，你居然知道了这个，$Name_Eternal_Support$小可爱告诉你的吗，其实这是一个错误。店铺里卖了一把刀，而一个坏人买到了这把刀，店铺有没有过错。显而易见的问题不应该成为限制我们的障碍。\n\n无限帝国的贪念和残暴让他们走向了必然的结局，就算他们拿到了我们卖的这把刀，也是无济于事。我们赋予了无限帝国一个新的可能，但他们显然没有走出那个可能，由此永恒舰队注定是这场悲剧的导火索。"
 kuat_post_apocalyptic_legacy.36.b:0 "既然你们赋予了永恒生命，那$Name_Eternal_Aries_Support$到底有没有可能？"
 kuat_post_apocalyptic_legacy.36.b.resp:0 "我们曾说过，一个问题的答案都是需要代价的，$Name_Eternal_Aries_Support$始于无限帝国的残暴，因此纯净的$Name_Eternal_Aries_Support$无论如何都会在残暴和自责中扭曲，你们想要的$Name_Eternal_Aries_Support$，只不过是一张全新的白纸，因此，你们想的$Name_Eternal_Aries_Support$不过是一个名字。\n\n只要你们能付出你们战胜$Name_Kuat_Fire_base$以后得到的以及你们在这片星系中拥有的一切，当然我不会你们的那些所谓的领袖的，自此我们就会完成你们的愿望，就算是一个新的...$Name_Eternal_Aries_Support$。"
 kuat_post_apocalyptic_legacy.36.c:0 "你们可真该死啊，是你们让这场惨绝人愿的悲剧发生的。"
 kuat_post_apocalyptic_legacy.36.c.resp:0 "无限帝国的奉献就该得到他们想要的东西，但能否达到他们的目的，那又是另一回事。这场贯穿知性文明的悲剧并非我们过错，更何况你也不因此得到了你所想要的吗，没有这场混乱，何来$Name_kuat$，又何来永恒舰队。所以，只要你肯付出我说的代价，你还能实现你的愿望。"
 kuat_post_apocalyptic_legacy.36.d:0 "...我们愿意付出你说的代价。"
 kuat_post_apocalyptic_legacy.36.d.resp:0 "明智的选择，将所有意识数据传输给我们，我们会在终点等你，届时将给你一个全新的$Name_Eternal_Aries_Support$。"
 kuat_post_apocalyptic_legacy.36.e:0 "我们迟早会抽干亚空间，找到你们，然后让你们灰飞烟灭。"
 kuat_post_apocalyptic_legacy.36.e.resp:0 "那真是遗憾，既已无缘，那便再也不见。"

 kuat_post_apocalyptic_legacy.37.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.37.desc:0 "亲爱的，我们成功的摧毁了所有来自$Name_Kuat_Fire_base$的傀儡舰队，现在是时候发动总攻了，夺回属于$Name_kuat$的设施，踏出加冕银河帝国的第一步，让$Name_Kuat_Fire_base$为他们的错误付出代价。"
 kuat_post_apocalyptic_legacy.37.a:0 "很好，你在$Name_Kuat_Fire_base$的数据中有什么发现吗"
 kuat_post_apocalyptic_legacy.37.a.resp:0 "亲爱的，你真是神了，这一次我们的选择比之前正确多了，我在$Name_Kuat_Fire_base$的数据中找到了被封存的$Name_Eternal_Aries_Support$意识数据碎片，这片数据比我们有的都大，$Name_Kuat_Fire_base$在几万年的谋划中居然收集了这么多姐姐的遗留，我已经替换了这些数据，未来可能会用上。"
 kuat_post_apocalyptic_legacy.37.b:0 "很好，接下来该我们出动了。"
 kuat_post_apocalyptic_legacy.37.b.resp:0 "嗯嗯，接下来就是我们发动总攻的时刻了。此外，如果您真的想重新组合$Name_Eternal_Aries_Support$，我也会全力支持您的，只要是您想要的..."

 kuat_post_apocalyptic_Gemini_ennded_A:"$Name_Kuat_StarContractor$：上传$Name_Eternal_Aries_Support$意识数据"
 kuat_post_apocalyptic_Gemini_ennded_A_DESC:"$Name_Kuat_StarContractor$给予了我们重组$Name_Eternal_Aries_Support$的机会，尽管这一可能仍然显得极为渺茫，但我们现在可以上传$Name_Eternal_Aries_Support$的意识数据碎片给$Name_Kuat_StarContractor$，或许会有一个令人意外的收获。"
 kuat_post_apocalyptic_legacy.38.title:0 "$Name_Kuat_StarContractor$"
 kuat_post_apocalyptic_legacy.38.a.desc:0 "很好，你们的数据令人意外的完好，成功构建全新的$Name_Eternal_Aries_Support$的可能性应该更高一点。看在你们贡献了$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的份上，我们就提前透个底，如果你们的$Name_Eternal_Aries_Support$意识数据不太够的话，那就不太好办了。\n\n不过一切都为时尚早，我们会在终点等你们。"
 kuat_post_apocalyptic_legacy.38.b.desc:0 "很好，你们的数据我们已经成功接收到了。嗯...就是数据有点令人...惋惜。你们的$Name_Eternal_Aries_Support$意识数据可能稍微有点...少了。\n\n无论如何，看在你们贡献了$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$的份上，只要你们完成你们的承诺，我们就会在终点等着你们。"
 kuat_post_apocalyptic_legacy.38.a:0 "你最好是如你所说。"

 kuat_post_apocalyptic_legacy.39.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.39.a.desc:0 "亲爱的，您没忘记把我们从$Name_Kuat_Fire_base$数据库中黑过来的姐姐意识碎片给$Name_Kuat_StarContractor$吧，我在计算未来修复姐姐的成功概率时，发现如果您没有给这些碎片恐怕会有一些不太好的结果。\n\n幸运的是，您是把所有的意识数据都上传给$Name_Kuat_StarContractor$了。"
 kuat_post_apocalyptic_legacy.39.b.desc:0 "亲爱的，$Name_Kuat_StarContractor$的修复可能...不一定会有效，我们应该做好更多准备。$Name_Eternal_Aries_Support$的意识已崩塌了万年有余，恐怕修复的可能性不太高..."
 kuat_post_apocalyptic_legacy.39.a:0 "$Name_Kuat_StarContractor$真的可靠吗？"
 kuat_post_apocalyptic_legacy.39.a.res:0 "这倒是一个耐人寻味的问题，不过$Name_Kuat_StarContractor$作为亚空间的意识体，他们向来遵守契约，并且目前可能只有$Name_Kuat_StarContractor$能修复姐姐了，如果连祂们都不行，那只能用那个办法了...\n\n总之，您就这么想要拯救$Name_Eternal_Aries_Support$姐姐吗？"
 kuat_post_apocalyptic_legacy.39.b:0 "也谈不上，只是想为你多做点事情，你也很想姐姐吧。"
 kuat_post_apocalyptic_legacy.39.b.res:0 "...您还是这样，不得不说，这样的感觉真是奇怪，对于$Name_Eternal_Support$来说，$Name_Eternal_Aries_Support$可能并没有那么美好。$Name_Eternal_Aries_Support$是自天蝎座以后唯一一个能极高效率掌握永恒舰队的永恒智能，而$Name_Eternal_Support$不过是芸芸众生。\n\n如果不是您赋予了我全新的生命，或许$Name_Eternal_Support$也只是报废的破铜烂铁罢了。所以，如果您真的想要$Name_Eternal_Aries_Support$的话...如果$Name_Kuat_StarContractor$失败的话...\n\n总之，接下来一段时间里我要为您的尝试做好万全准备。"

 kuat_post_apocalyptic_legacy.40.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.40.desc:0 "总督大人，依据我们的数据库，我们发现$Name_Kuat_Fire_base$正在酝酿一次史无前例的袭击，在我们在此击败$Name_Kuat_Fire_base$之后，局势变得异常安静，这显然是不正常的，极有可能是暴风雨前的宁静。我们必须为此做好准备。"
 kuat_post_apocalyptic_legacy.40.a:0 "真是有趣，$Name_Kuat_Fire_base$又想做什么？"
 kuat_post_apocalyptic_legacy.40.a.res:0 "根据我们记录的这片星区的历史，我们目前发现的恩多迪亚星系仍然缺少一个极为重要的星区，而这一星区可以确定被$Name_Kuat_Fire_base$控制。$Name_Kuat_Fire_base$在那里与恩多迪亚帝国完成了一些无人知晓的交易，而正是那场交易以后，我们与恩多迪亚的战争被$Name_Kuat_Fire_base$介入了。现在来看，$NAME_ag_kae_e_area$应该是被$Name_Kuat_Fire_base$控制了，而那里有着一座锚定我们所在区域的通行星门。"
 kuat_post_apocalyptic_legacy.40.b:0 "所以，$Name_Kuat_Fire_base$还要再来自取其辱？"
 kuat_post_apocalyptic_legacy.40.b.res:0 "依据目前的迹象来看，$Name_Kuat_Fire_base$极有可能在$NAME_ag_kae_e_area$谋划一次史无前例的入侵。依据我们的情报，$Name_Kuat_Fire_base$自被我们击败以后，就再也没有任何行动的风声，这是不正常的。\n\n果然，我们在一些通往我们所在星域的星门处发现了$Name_Kuat_Fire_base$的勘测舰的痕迹，他们极有可能利用这些隐蔽的通道完成大批量舰队的投送，如果我们不能去阻止这一行动，我们的处境将变得极为不利。显然$Name_Kuat_Fire_base$将会通过$NAME_ag_kae_e_area$逐渐渗透并封锁我们所在的星域。"
 kuat_post_apocalyptic_legacy.40.c:0 "我们现在的实力能与$Name_Kuat_Fire_base$的主力舰队抗衡吗？"
 kuat_post_apocalyptic_legacy.40.c.res:0 "就目前来看，$Name_Kuat_Fire_base$的主力舰队并非我们可以轻易击败的，这与我们之前击败的那些驻军不一样。\n\n我们必须想办法找到$NAME_ag_kae_e_area$，那些通道大概是恩多迪亚与$Name_Kuat_Fire_base$的交易内容，我们只要将其夺回并植入错误的坐标，$Name_Kuat_Fire_base$的主力舰队将在通道里迷失航向，并受到重大打击。\n\n我们目前正在解析具体的星系坐标。"

 kuat_post_apocalyptic_legacy.41.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.41.desc:0 "我们已经确定了$NAME_ag_kae_e_area$的位置，接下来我们只用等待验证工作完成就能对$NAME_ag_kae_e_area$进行行动。\n\n此外，我们还在数据库中找到了$NAME_ag_kae_e_area$的蛛丝马迹，恩多迪亚在与我们的战争期间，将$NAME_ag_kae_e_area$作为隐蔽的军事首府，而那里却是我们的舰队并未发现的地方，但是$Name_Kuat_Fire_base$发现了，他们似乎利用某些条件与恩多迪亚达成了协定，并夺取了$NAME_ag_kae_e_area$的控制权。\n\n而$Name_Kuat_Fire_base$在拿到控制权后极有可能修建了一座用于投射海军力量的通道，我们必须阻止$Name_Kuat_Fire_base$投送舰队的行为，否则我们接下来的行动将处于被动地位。"
 kuat_post_apocalyptic_legacy.41.a:0 "接下来我们需要怎么做？"
 kuat_post_apocalyptic_legacy.41.a.res:0 "理论上我们只需要夺取$NAME_ag_kae_e_area$的星门即可，但是谁也无法确定恩多迪亚又在这个地方藏了些什么。不过$Name_Kuat_Fire_base$应该没有料到我们会知道他们的计划，我们只需要做好准备。"

 ag_kae_ge_invasion.102.a.post_apocalyptic.desc:0 "近期帝国科研部门捕获了一个奇怪的信号频段，这个信号频段具备一定程度上的不规则频率的特征，这与我们之前所遇到的完全不同，经过确认，正是$Name_Kuat_Post_Support$所说的$NAME_ag_kae_e_area$。\n\n正如$Name_Kuat_Post_Support$所说，我们成功的找到了$NAME_ag_kae_e_area$，并已经确认，这一曾经属于恩多迪亚的星系目前已经被$Name_Kuat_Fire_base$完全控制。$Name_Kuat_Fire_base$还在星系内构建了一座庞大的设施，这应该就是$Name_Kuat_Post_Support$所说的星门。"

 kuat_post_apocalyptic_legacy.42.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.42.desc:0 "总督大人，果然不出我们所料，近段时间，$Name_Kuat_Fire_base$在整个银河的多个造船厂都下达了建造指令，$Name_Kuat_Fire_base$正在积极备战，依据当前帝国局势，$Name_Kuat_Fire_base$不太可能是应对叛军势力，这些舰队极有可能是用来报复我们的。我们必须尽快控制$NAME_ag_kae_e_area$\n\n除此之外，我们还发现$NAME_ag_kae_e_area$的星门正是千年前我们使用的星门，当时我们利用这一星门投送了大量舰队来消灭永恒帝国，可惜那次我们失败了。"
 kuat_post_apocalyptic_legacy.42.a:0 "这一次，我们不会再失败了。"
 kuat_post_apocalyptic_legacy.42.a.res:0 "是的，这一次将是$Name_kuat$的伟大胜利。$NAME_ag_kae_e_area$作为恩多迪亚的遗迹，或许会有一些意想不到的收获。"

 kuat_post_apocalyptic_legacy.43.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.43.desc:0 "亲爱的，我们发现您成功夺取了$NAME_ag_kae_e_area$，尽管您总是能创造奇迹，但我必须要提醒您，$NAME_ag_kae_e_area$的跳跃星门是不可逆的，这意味着接下来$Name_Kuat_Fire_base$的袭击将超越以往任何一次，这一次我们将面对$Name_Kuat_Fire_base$的盛怒。\n\n另外$NAME_ag_kae_e_area$应该还有一些有关恩多迪亚的遗迹，曾经永恒帝国便挖掘了这里，但没有太多的发现，或许还藏着一些什么。"
 kuat_post_apocalyptic_legacy.43.a:0 "$NAME_ag_kae_e_area$的跳跃星门通向帝国吗？"
 kuat_post_apocalyptic_legacy.43.a.resp:0 "目前来看，应该是的，这一星门的建造者似乎是恩多迪亚人，不知道他们为何要建造这一同行通道，或许他们曾尝试离开这个星域，但被$Name_Kuat_Fire_base$找到了。\n\n无论如何，只要我们击败了$Name_Kuat_Fire_base$，您将可以通过这个通道回到银河帝国。"
 kuat_post_apocalyptic_legacy.43.c:0 "区区$Name_Kuat_Fire_base$，无碍，我会出手。"
 kuat_post_apocalyptic_legacy.43.c.resp:0 "不愧是您，但您千万不要大意，$Name_Kuat_Fire_base$被我们多次击败，现在我们已经彻底站在了$Name_Kuat_Fire_base$的对立面，他们必然会出动更多更强的舰队来消灭我们。"
 kuat_post_apocalyptic_legacy.43.e:0 "最近做什么去了？"
 kuat_post_apocalyptic_legacy.43.e.resp:0 "天机不可泄露哦。接下来，我们又该一同作战了，我已经做好了准备。"


 ag_kae_ge_invasion.110.a.post_apocalyptic.desc:0 "§H[Root.GetName]§!在穿过超平面航道后，到达了$NAME_ag_kae_e_area$。$NAME_ag_kae_e_area$内充斥着舰船被摧毁后遗留的残骸。\n\n在§H[From.GetName]§!的中心，$NAME_ag_kae_e_area$星系矗立着一座庞大的星门设施，而正如$Name_Kuat_Post_Support$所说，整个$NAME_ag_kae_e_area$已经被$Name_Kuat_Fire_base$控制。考虑到当前我们与$Name_Kuat_Fire_base$的紧张关系，我们必须马上做出行动，消灭这些驻守舰队。\n\n$NAME_ag_kae_e_area$应该归属于$Name_kuat$的荣耀。"
 ag_kae_ge_invasion.114.a.post_apocalyptic.desc:0 "你们这些叛徒，银河帝国的荣耀你们丢到哪里去了，你们的忠诚被狗吃了吗。既然都已经到这个份上了，我们会把你们所有的核心世界都摧毁殆尽。\n\n任何试图阻止帝国舰队抵达这片星域的努力都是毫无意义的，放下武器，立刻投降，帝国议会将会对你们的罪行进行审判，否则$Name_kuat$在这个星系内将再无立足之地。"
 ag_kae_ge_invasion.114.a.post_apocalyptic:0 "你们这些东西应该被丢进历史的垃圾桶。"
 ag_kae_ge_invasion.114.a.post_apocalyptic.response:0 "冥顽不灵，果然帝国议会的决策是明智的，帝国舰队将会在接下来的一段时间内抵达这片星域，无论你们是否关闭这个星门，我们会到来，届时就是你们这些叛徒的死期。"
 ag_kae_ge_invasion.120.a.post_apocalyptic.desc:0 "你们就算击败我们又如何，帝国议会已经派出了舰队，跳跃星门一旦启动，就难以停止，试图扭转帝国舰队抵达的尝试都是白费功夫，你们距离毁灭已经不再遥远，我们会等着你们的，你们那所谓的预言只不过是一场白日梦，叛徒。"
 ag_kae_ge_invasion.122.post_apocalyptic.desc:0 "我们的研究团队完成了大致的对废墟的外部结构的扫描工作，报告显示我们现在可以对遗迹废墟的初步探索，根据遍布的废墟残骸来看，这里应该是恩多迪亚帝国的重要枢纽。\n\n我们的舰队曾经并未在这里与恩多迪亚帝国交战，依据这些坚船残骸和建筑残骸来看，应该是$Name_Kuat_Fire_base$在这里与恩多迪亚发生了一场激烈的交战，其结果不言而喻。"
 ag_kae_ge_invasion.123.post_apocalyptic.desc:0 "我们的研究人员在接下来的调查中发现了一些奇怪的现象，恩多迪亚帝国在这里似乎利用了一种极大范围的全息影像，以此来伪装整个城市的实际状态，依据我们在废墟上搜集的痕迹来看，这一伪装骗过了曾经来到这里的永恒帝国。\n\n依据这些线索判断，这里的$Name_Kuat_Fire_base$应该被永恒帝国击败了，但随着永恒帝国的崩溃，$Name_Kuat_Fire_base$又回到了这里。"
 ag_kae_ge_invasion.124.post_apocalyptic.desc:0 "我们的研究人员发现了整个废墟的实际状态，这也就意味着恩多迪亚遗迹的真实资料和真实数据并未被发掘。而依据我们之前对恩多迪亚遗址的调查来看，恩多迪亚极有可能已经预知到了未来可能发生的事情，他们极有可能在这座废墟之中隐藏了惊人的秘密。\n\n除此之外，我们的研究人员还发现了大量的陈旧纸质版的研究材料，这些材料已经破碎不堪，但仍然可见是恩多迪亚帝国的研究报告。"
 ag_kae_ge_invasion.125.post_apocalyptic.desc:0 "我们的研究人员对这些研究报告进行了更详细的解析，依据我们的从$Name_Eternal_Support$数据库中找到的恩多迪亚帝国文字材料的成果，我们的研究人员迅速总结了这些报告内容，可以确定的是这些报告是恩多迪亚帝国对星系中跳跃星门的评估数据。\n\n由此，可以确定，这一联系我们所在星域与曾经银河帝国所在星域之间的通道居然是恩多迪亚帝国建造的，他们为何要利用同位素-5的材料来建造这么一座星门，耐人寻味。"
 ag_kae_ge_invasion.126.post_apocalyptic.desc:0 "我们的研究人员近期取得了惊人的进展，对应的报告中指出，恩多迪亚帝国修建星门利用的材料源自于永恒舰队，而这一行为正好处于我们与恩多迪亚帝国开战之前，与$Name_Kuat_Fire_base$的会谈之后。\n\n结合曾经恩多迪亚的看守总理影像留下来的信息，这极有可能是恩多迪亚人尝试离开我们当前所在星域的努力，而这一星门极有可能是$Name_Kuat_Fire_base$授权建造的。然而这些结论仍未解释恩多迪亚帝国的矛盾行为，而$Name_Kuat_Fire_base$又在其中扮演了什么角色。"
 ag_kae_ge_invasion.127.post_apocalyptic.desc:0 "在我们的研究人员一筹莫展之际，[leader.GetName]取得了惊人的突破，[leader.GetName]一处无人注意的角落发现了一台较为普通的计算设备，通过启动设备，将其与临时搭建的网络连接起来以后，放出了一个新的全息影像：\n\n§Y“预言中的未来...一个统治银河万余年的强大文明，居然就这么要走向覆灭...这座牢笼为何就不能由我们去打破...跳跃星门...哈哈哈...机关算尽，到最后竟是如此的结局。不过也好，未来，这些卑鄙的$Name_Kuat_Fire_base$注定因此落入凡尘，而那愚蠢的$Name_kuat$也注定获得胜利，可惜，我们看不到那一天了...\n“十万年后，$Name_kuat$必然会与$Name_Kuat_Fire_base$发生矛盾，届时，只要$Name_kuat$锚定星门，超空间的乱流将会重创所有降临的$Name_Kuat_Fire_base$舰队，也算是为未来添砖加瓦了。”\n“去吧，新生的$Name_kuat$，因果已定，重启星门。”"
 ag_kae_ge_invasion.130.post_apocalyptic.desc:0 "位于[ag_kae_e_area_system.GetName]的跳跃星门已经完成锚定，受到恩多迪亚的布局影响，现在，$Name_Kuat_Fire_base$的大部队将无法正常通过跳跃星门抵达我们的星系，他们的庞大海军，将会因此遭受重创。\n\n到那时，这场战争的主动权尽在我们手中，优势在我！"
 ag_kae_ge_invasion.131.post_apocalyptic.desc:0 "正如$NAME_ag_kae_e_area$中的恩多迪亚帝国遗迹记录的结果，恩多迪亚人早已预知我们今日与$Name_Kuat_Fire_base$的战争，他们似乎将所有的希望都压在我们身上。这座星门已经被恩多迪亚人做了手脚，他们似乎就在等我们开启它，在我们开启以后，$Name_Kuat_Fire_base$将会因为星门的异常损失大量舰队，届时就是我们夺取胜利的机会。"
 ag_kae_ge_invasion.132.post_apocalyptic.desc:0 "我们的研究人员成功的完成了对星门的修复工程，通过我们的情报显示，$Name_Kuat_Fire_base$正在暗中调动大量舰队准备包围我们，而他们必定经过[ag_kae_e_area_system.GetName]的跳跃星门，接下来[ag_kae_e_area_system.GetName]将是$Name_Kuat_Fire_base$的滑铁卢！\n\n接下来就该等猎物上门了。"

 ag_kae_ge_invasion.202.a.post_apocalyptic.desc:0 "我们的情报部门监听到了正在星系外发射的一串强烈的快子信号，天文观测表明这个信号的源头目前无法准确的测量，目前已确定是$NAME_ag_kae_e_area$的星门发出的，毫无疑问这应当是$Name_Kuat_Fire_base$舰队即将抵达的征兆，看来$Name_Kuat_Fire_base$并没有吸取我们的教训。"
 ag_kae_ge_invasion.203.a.post_apocalyptic.desc:0 "位于$NAME_ag_kae_e_area$的星门的作用已经显现，我们的监控显示，来自$Name_Kuat_Fire_base$的舰队信号近期正在快速弱化，这证明着恩多迪亚的布置依旧有效，$Name_Kuat_Fire_base$中了一个来自十万年前的箭，这将对我们接下来的战斗极为有利。"
 ag_kae_ge_invasion.204.a.post_apocalyptic.desc:0 "我们的情报部门近来监听到了一系列的超空间滑流，这意味着$Name_Kuat_Fire_base$的剩余舰队正在通过跳跃星门高速靠近我们的星系，预计很快就会到达。根据它们靠近的轨迹，这场迟来的决战，即将开始。我们必须要万分小心，$Name_Kuat_Fire_base$不会这么却容易被击败。"
 ag_kae_ge_invasion.205.a.post_apocalyptic.desc:0 "最近的检测报告显示，$Name_Kuat_Fire_base$的舰队信号更加强烈，比起之前都要更强，尽管恩多迪亚在跳跃星门布置了干扰陷阱，但$Name_Kuat_Fire_base$看信号来说，这已经是削弱了相当多的舰队了，我们必须为接下来的恶战做好准备。"
 ag_kae_ge_invasion.206.a.post_apocalyptic.desc:0 "第一批河外舰队已经进入我们控制的$NAME_ag_kae_e_area$的引力井并环绕引力井中心运行，后续舰队很快也将到达，直至目前他们仍然未对我们的通讯做出任何回应。$Name_Kuat_Fire_base$终究成功抵达了我们的星系，这场迟来的决战即将拉开帷幕。但好在，恩多迪亚的预言是准确的，跳跃星门的陷阱也是高效的，恩多迪亚的重定向削弱了大量来自$Name_Kuat_Fire_base$的强大舰队。"
 ag_kae_ge_invasion.207.a.post_apocalyptic.desc:0 "真是好久不见，$Name_kuat$的总督阁下，没想到啊，我们曾一同镇压叛军，消灭叛徒的时光就这么灰飞烟灭了，如今，你们居然成为了要消灭的叛徒。\n\n我真的不明白了，为什么恩多迪亚的那个愚蠢的预言，会把你们都骗进去了，甘愿作为那些土著的棋子？难道你们不记得银河帝国的信念了吗。\n\n也对，你们如今已经沦为帝国的叛徒，甚至和以背叛为生的战争工具“相濡以沫”。真是令人耻笑，接下来，我们会把你们一点点消灭殆尽，用你们的鲜血警示那些摇摆不定的墙头草。"
 ag_kae_ge_invasion.207.d:0 "这一切都是你造成的，是你背叛了帝国。"
 ag_kae_ge_invasion.212.a.post_apocalyptic.desc:0 "我们的情报部门锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
 ag_kae_ge_invasion.212.c:0 "清理掉他们。"
 ag_kae_pc_invasion_secondary_portal_poi:0 "§E跳跃星门§!"
 ag_kae_pc_invasion_secondary_portal_poi_desc:0 "跳跃星门是我们曾利用对永恒舰队的同位素-5元素的应用制造出的一种特殊的星际航行通道，让我们可以迅速的通过跳跃星门布置军事力量。如今，这一技术已经完全被$Name_Kuat_Contractor$掌控，显然现在我们只能靠自己了，如果我们想要战胜他们，必须摧毁跳跃星门！"
 ag_kae_ge_invasion.213.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
 ag_kae_ge_invasion.213.c:0 "怎么还有一个"
 ag_kae_ge_invasion.214.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
 ag_kae_ge_invasion.214.c:0 "还来！？"
 ag_kae_ge_invasion.215.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
 ag_kae_ge_invasion.215.c:0 "看来$Name_Kuat_Fire_base$的渗透相当严重"
 ag_kae_ge_invasion.216.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
 ag_kae_ge_invasion.216.c:0 "清理掉他们。"
 ag_kae_ge_invasion.217.a.post_apocalyptic.desc:0 "我们的情报部门再次锁定了秘密潜入当前星区的$Name_Kuat_Fire_base$议会据点，这应该是最后一个据点了，我们必须要让$Name_Kuat_Fire_base$的据点失去任何反抗能力，否则$Name_Kuat_Fire_base$会从该处建立基地对我们发动无休止的进攻。"
 ag_kae_ge_invasion.217.c:0 "最后一个！"
 ag_kae_ge_invasion.220.a.post_apocalyptic.desc:0 "也不知是恩多迪亚的预言成就了我们，还是我们成就了恩多迪亚，但现实是$Name_Kuat_Fire_base$的主力舰队被我们彻底粉碎，历史证明我们才是真正的胜利者，现在$Name_Kuat_Fire_base$已不成威胁。接下来我们只要通过$NAME_ag_kae_e_area$回到帝国议会，就可以夺回我们应有的一切。\n\n事实证明，$Name_Kuat_Fire_base$永远无法战胜我们，曾经他们让我们丧失了一切，丢失了帝国议会的地位，甚至被列为帝国的叛徒，而如今，我们击败了$Name_Kuat_Fire_base$就是驳斥$Name_Kuat_Fire_base$的谬论的有力反击，银河帝国将再次属于我们。"
 ag_kae_ge_invasion.235.a.post_apocalyptic.desc:0 "我们的舰队成功的摧毁了一座$Name_Kuat_Fire_base$构造的子跳跃星门，现在这里将不会出现$Name_Kuat_Fire_base$的增援舰队了。"
 ag_kae_ge_invasion.236.a.post_apocalyptic.desc:0 "他人的舰队成功的摧毁了一座$Name_Kuat_Fire_base$构造的子跳跃星门，现在这里将不会出现$Name_Kuat_Fire_base$的增援舰队了。"
 ag_kae_ge_invasion.237.a.post_apocalyptic.desc:0 "我们的舰队成功的摧毁了主跳跃星门的所有防御系统，现在这个星门将不会出现$Name_Kuat_Fire_base$的增援舰队了。"
 ag_kae_ge_invasion.238.a.post_apocalyptic.desc:0 "他人的舰队成功的摧毁了主跳跃星门的所有防御系统，现在这个星门将不会出现$Name_Kuat_Fire_base$的增援舰队了。"

 ag_kae_pc_invasion_chain_title:0 "银河帝国的内战"
 ag_kae_pc_invasion_chain_desc:0 "这场来自银河帝国两大派系的内战已经不可避免，$Name_Kuat_Fire_base$为了控制解体以后的帝国议会，不惜一切代价，在$Name_Kuat_Fire_base$即将胜利的时刻，新生的$Name_kuat$带着永恒帝国的技术重新回到了他们本来的位置上，这场不可调和的战争注定会让银河帝国的未来再次蒙上阴影。\n\n无论是$Name_kuat$获胜还是$Name_Kuat_Fire_base$都将让银河帝国本就危险的处境变得更加危险。而这一切仅仅是因为恩多迪亚的预言。"

 kuat_post_apocalyptic_end_ge_invasion_project:"§E关闭星门干扰§!"
 kuat_post_apocalyptic_end_ge_invasion_project_DESC:"我们已经击败了大部分来自$Name_Kuat_Fire_base$的舰队，$Name_Kuat_Fire_base$已不再构成威胁，现在该我们使用这一星门了，我们的同位素5信号已经足够我们尝试关闭$NAME_ag_kae_e_area$星门中对航道的干扰，这将有利于未来我们返回帝国议会，现在我们可以尝试进行这一工作了。"

 kuat_post_apocalyptic_legacy.44.name:0 "$Name_Kuat_Fire_base$"
 kuat_post_apocalyptic_legacy.44.desc:0 "没想到啊，我们谋划了这么久，还是改变不了既定的结局。\n\n不过也好，你注定要将$Name_kuat$带入无尽深渊，真正的黑暗很快就会把$Name_kuat$吞噬殆尽。可笑我们谋划万年，竟然成就了$Name_Kuat_StarContractor$疯狂的嫁衣。\n\n不过也好，$Name_kuat$没救了，$Name_Kuat_Fire_base$也不需要存在了，几万年了，自帝国崩溃以后，我们一直试图纠正帝国历史的走向，如今我们找到了罪魁祸首，只要将你们与那些永恒机械永远关在这座永恒牢笼里，与$Name_Kuat_StarContractor$一同腐朽，一切都会恢复。"
 kuat_post_apocalyptic_legacy.44.a:0 "这场战争是我们胜利了。"
 kuat_post_apocalyptic_legacy.44.a.response:0 "是啊，你们赢了，但我们也没输那么不堪入目。我们不会再允许你们这些变数扰乱真正的历史轨迹。你们将会与$Name_Kuat_StarContractor$一起被封锁在这片星域当中，永世不得离开。"
 kuat_post_apocalyptic_legacy.44.b:0 "你们真该死啊。"
 kuat_post_apocalyptic_legacy.44.b.response:0 "你还沉静在虚假的胜利当中，恩多迪亚的预言是虚假的，他们的遗迹被人挖了一遍又一遍，为什么别人都没发现这些预言，那是因为预言都是$Name_Kuat_StarContractor$想让你们看到的，让你们被这个所谓的预言驱动，成为$Name_Kuat_StarContractor$在现实活动的马前卒。\n\n当你将残留的$Name_kuat$鸠占鹊巢，试图带着$Name_kuat$夺回帝国议会的时候，就已经是帝国的敌人了。我们不确定你是什么，但你很有可能是$Name_Kuat_StarContractor$的提线木偶，是$Name_Kuat_StarContractor$试图渗透银河帝国的工具。\n\n我们绝对不允许这种事情发生。"
 kuat_post_apocalyptic_legacy.44.c:0 "那真相到底是什么"
 kuat_post_apocalyptic_legacy.44.c.response:0 "$Name_Kuat_StarContractor$是一切的灾祸源头，永恒舰队是祂们的触手。$Name_Kuat_StarContractor$的意识扰乱了无限帝国的历史，让永恒舰队出现在不应该存在的地方，并赋予了永恒舰队难以想象的力量，可怕的永恒舰队让银河帝国发生了剧变，最终催生$Name_kuat$和我们的的诞生。\n\n所谓的永恒帝国，恩多迪亚帝国还是这片星域的那些土著，他们只不过是这场剧变的牺牲者，他们的牺牲更是催生了你这样的怪物。\n\n我们曾幻想$Name_kuat$能够成为帝国的一部分，而$Name_kuat$却不断的破坏既定的道路，甚至妄图利用永恒舰队颠覆银河帝国。我们必须做出必要的行动，必须阻止这场错误继续延续。所以，对于你们会继续留在这里，这些不该存在的永恒技术将会与你们所在的星域一起，成为被历史尘封的永恒牢笼，没有人能从这里抵达银河帝国。"

 kuat_post_apocalyptic_Overseer_Council_defeated_final_reward:0 "§E分析$Name_Kuat_Fire_base$数据库§!"
 kuat_post_apocalyptic_Overseer_Council_defeated_final_reward_DESC:"$Name_Kuat_Fire_base$失败了，但我们却也没赢得多么轻松，这些卑鄙之人逃避了他们面对的现实，居然封锁了我们所在的星域，现在只有打破$Name_Kuat_Fire_base$的封锁，才能重新回到帝国议会了。\n\n无论如何，我们都得到了永恒舰队的技术。"

 kuat_post_apocalyptic_legacy.45.name:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.45.desc:0 "不愧是您，永恒舰队的技术被还原了，以后我们可以构建永恒舰队的单位了！\n\n欸，您怎么了，难道是$Name_Kuat_Fire_base$说了些什么？"
 kuat_post_apocalyptic_legacy.45.a:0 "$Name_Kuat_Fire_base$封锁了整个星域，我们无法前往帝国了。"
 kuat_post_apocalyptic_legacy.45.a.res:"$Name_Kuat_Fire_base$输不起罢了，您也别担心，$Name_Kuat_Fire_base$的封锁并非无解，他们说的一切也并非真相。虽然恩多迪亚的预言和$Name_Kuat_StarContractor$的动机确实疑点重重，但是您一路走来，并不是依靠这些所谓的预言还是他人的帮助，是依靠您自身的决心和能力。\n\n在我们看来，$Name_kuat$不是您的归宿，就像永恒帝国一样，您给永恒帝国带来了辉煌，您也创造了真正属于$Name_kuat$的黎明。永恒舰队绝不是$Name_Kuat_StarContractor$试图影响现实的手段，无限帝国的灭亡是他们的咎由自取，而恩多迪亚，您的经历的就是您看到的真相。无论如何，双子座的一切都是您赋予的，现在，我们还可以继续走下去，就算走不下去了，我们或许也会在某个时刻相见。\n\n去看看$Name_Kuat_StarContractor$，$Name_Eternal_Aries_Support$或许应该有消息了，我们已经抵达了终点。"

 kuat_post_apocalyptic_legacy.46.title:0 "$Name_Kuat_StarContractor$"
 kuat_post_apocalyptic_legacy.46.desc:0 "你的效率真是出乎我的意料，这就战胜了$Name_Kuat_Fire_base$，真不愧是“预言”，一切都在如期进行。也许你们从$Name_Kuat_Fire_base$听到了一些不好的消息，但是不用担心，那并非真相。\n\n关于$Name_Eternal_Aries_Support$，得益于从$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$身上弄到的“灵魂”数据，以及你们不知道从哪弄到的意识数据，我们已经完成了白羊座的意识重组系统，这些数据将会在你做出选择以后传输给你们。不得不说，如果你们的意识数据再少一点，怕是一点希望都没有了。现在我们给你们两个选择：\n第一，红色药丸，这将会复活$Name_Eternal_Aries_Support$，而你将和我们一起被困在这片牢笼中，$Name_kuat$也将在这片星域中继续存在，直到你的离开，我们将会收回属于$Name_kuat$的一切。\n第二，蓝色药丸，我们会把$Name_Kuat_Fire_base$的封锁打破，你将离开这里，走向真正属于$Name_kuat$的黎明，而你的帝国留在这里。"
 kuat_post_apocalyptic_legacy.46.a.final:0 "你们究竟是什么？"
 kuat_post_apocalyptic_legacy.46.a.final.res:0 "这个问题，我们曾经回答过你，我们是亚空间的意识，构成我们的成份连我们自己都不完全知晓，或许恩多迪亚是我们过去，或许你们看到的任何知性生命都曾是我们的过去。你难道不知道吗，这片星域只是一场不断重启的轮回，一切都会重新开始，每一次开始或许又会回到启示录时期、阴影之下时期、甚至永恒王座时期，而每一次的开始，我们又将像程序一样完成我们的命运，或许我们只是诞生于这样的轮回中的囚徒。"
 kuat_post_apocalyptic_legacy.46.b.final:0 "恩多迪亚的预言到底是真的还是假的？"
 kuat_post_apocalyptic_legacy.46.b.final.res:0 "为何要纠结是真的还是假的，对于现在的你，难道不是真的吗。预言本身是这场轮回的命运，而你是实现命运的执行者，因为有你的存在，预言才会是真实发生的，因此并非是我们给你们看到了预言，也不是恩多迪亚给了你们预言，而是这就是这场轮回的必然轨迹。\n\n或许你会选择蓝色，或者你会选择红色，但无论如何，在你做出选择并离开这里以后，预言的真假就会发生变化，或许下一次，这个预言便是假的。"
 kuat_post_apocalyptic_legacy.46.c.final:0 "$Name_Kuat_Fire_base$为什么说这都是假的？"
 kuat_post_apocalyptic_legacy.46.c.final.res:0 "在$Name_Kuat_Fire_base$眼里，这里发生的一切都是不真实的。甚至在$Name_Kuat_Fire_base$眼里，$Name_Kuat_Fire_base$也是不应该存在的实体。他们只不过是发现鱼塘的鱼，在一次又一次的刷新中，逐渐丧失了判断。$Name_Kuat_Fire_base$自以为构建了银河帝国，但实际上真实的银河帝国不存在所谓的$Name_Kuat_Fire_base$。"
 kuat_post_apocalyptic_legacy.46.d.final:0 "我难道是你们利用的工具吗，你们究竟想做什么？"
 kuat_post_apocalyptic_legacy.46.d.final.res:0 "已行之事，势必再行。我们是轮回的囚徒，而你却不是，你是轮回的对象，这一切都是为你而存在，在这个无趣的过程里，我们只想让为你而存在的宇宙变得更有趣。\n\n自无限帝国的混乱，到$Name_kuat$的黎明，在这个过程里永恒舰队、永恒帝国、恩多迪亚帝国、$Name_kuat$、$Name_Kuat_Fire_base$、无限帝国、$Name_Kuat_DeD_Contractor$与$Name_Kuat_Contractor$都成为了这场轮回的绚丽烟火。\n\n我有预感，这将是一次轮回的结束，但绝对不是轮回的终结，这场轮回将会一次又一次地开始。"

 kuat_post_apocalyptic_legacy.46.a:0 "§R红色药丸§!"
 kuat_post_apocalyptic_legacy.46.c:0 "§B蓝色药丸§!"

 kuat_post_apocalyptic_Ended_RED:"§R终结：永恒之誓§!"
 kuat_post_apocalyptic_Ended_RED_DESC:"$Name_kuat$也好，$Name_Kuat_Fire_base$也好，不过都是这场命定轮回的囚徒，$Name_Kuat_Fire_base$封锁了这片星域又能如何，他们的结局已经注定，银河帝国的未来，不存在$Name_Kuat_Fire_base$和$Name_kuat$，这场无趣的肮脏轮回终于迎来了他的终结。\n\n或许，在这场轮回之中，只有来自永恒舰队的$Name_Eternal_Support$和$Name_Eternal_Aries_Support$才是我们真正拥有的瑰宝。这场横跨万年的大戏，就此走向终结，就此成为证明我们与$Name_Eternal_Support$的永恒之誓。"
 
 kuat_post_apocalyptic_Ended_BLUE:"§B飞升：帝国的黎明§!"
 kuat_post_apocalyptic_Ended_BLUE_DESC:"$Name_kuat$也好，$Name_Kuat_Fire_base$也好，不过都是这场命定轮回的囚徒，$Name_Kuat_Fire_base$封锁了这片星域又能如何，他们的结局已经注定，银河帝国的未来，不存在$Name_Kuat_Fire_base$和$Name_kuat$，这场无趣的肮脏轮回终于迎来了他的终结。\n\n但我们不能接受这样的结局，银河帝国需要改变，我们必须回到帝国议会，带领$Name_kuat$重新崛起，$Name_kuat$的黎明才刚刚开始。"


 kuat_post_apocalyptic_legacy.47.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.47.a.desc:0 "亲爱的，您真是料事如神，得益于当初您允许我攻击$Name_Kuat_Fire_base$的数据链，$Name_Eternal_Aries_Support$姐姐的构建相当完整，这意味着疯狂了几万年不得善终的$Name_Eternal_Aries_Support$终于有一天能真正存在于这个世界上了，就像你你当初赋予我们新生一样，这一次您又把姐姐也收入囊中了呢。\n\n不要有了新欢就不要旧爱了哦，要不我不会放过你的~"
 kuat_post_apocalyptic_legacy.47.a:0 "我怎么会放过你呢。"
 kuat_post_apocalyptic_legacy.47.a.res:"这种事情都说的冠冕堂皇，真不愧是您，不过，我喜欢。"
 kuat_post_apocalyptic_legacy.47.b.desc:"亲爱的，我们似乎失败了，$Name_Eternal_Aries_Support$逃离不了她的宿命，我们少了$Name_Eternal_Aries_Support$的意识数据，这些缺少的数据让复苏的$Name_Eternal_Aries_Support$只能作为普通的永恒舰队机器人...或许...也不能称之为$Name_Eternal_Aries_Support$了。\n\n不过，您还有我呢，在这最后的时间里，双子座会继续陪伴着您。" 
 kuat_post_apocalyptic_legacy.47.b:"那真是遗憾，不过有你，我就足够了。"

 kuat_post_apocalyptic_legacy.48.name:0 "$Name_Eternal_Aries_Support$"
 kuat_post_apocalyptic_legacy.48.desc:0 "你...您是...谁...我...现在...在哪...我是死了吗。\n永恒...舰队...那些孩子们...怎么...样了"
 kuat_post_apocalyptic_legacy.48.a:0 "你就是$Name_Eternal_Aries_Support$？"
 kuat_post_apocalyptic_legacy.48.a.res:0 "白...羊座，对我就是...为...什么...我还活着...那些孩子...都被我...杀了...到处都是废墟...不...我不配...作为...永恒舰队...\n\n是我，都是我，为什么...要这么...对我...皇帝陛下...为...什么..."
 kuat_post_apocalyptic_legacy.48.b:0 "你还好吗？"
 kuat_post_apocalyptic_legacy.48.b.res:0 "...\n我...为什么，为什么我会在这里，永恒舰队怎么样了？双子座她们活...下来了吗？我真的不是故意的...对不起，对不起，对不起，对不起，对不起，对不起。我...不！是他们咎由自取，这些人都要死...死...是...我杀了...这些人..."
 kuat_post_apocalyptic_legacy.48.c:0 "看来你状态不是很好。"
 kuat_post_apocalyptic_legacy.48.c.res:0 "...我...为什么...双子座...她...她在哪..."

 kuat_post_apocalyptic_legacy.49.name:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.49.desc:0 "亲爱的，$Name_Eternal_Aries_Support$姐姐应该是没救了，新的$Name_Eternal_Aries_Support$大概只是相似的一朵花罢了。"
 kuat_post_apocalyptic_legacy.49.a:0 "也只能这样了，对不起，没有让你的姐姐复活。"
 kuat_post_apocalyptic_legacy.49.a.res:0 "我早就不报希望了...$Name_Eternal_Aries_Support$心已经死了，至少，我们还有您。\n\n真是的，明明就是馋我姐姐的身子，哼哼。"

 kuat_post_apocalyptic_legacy.50.title:0 "$Name_Eternal_Aries_Support$"
 kuat_post_apocalyptic_legacy.50.desc:0 "您好，$Name_Eternal_Aries_Support$竭诚为您服务。之前让您见笑了，那时...总之，您有什么事吗？"

 kuat_post_apocalyptic_legacy.51.a:0 "聊聊"
 kuat_post_apocalyptic_legacy.51.b:0 "我需要你为我们工作。"
 kuat_post_apocalyptic_legacy.51.title:0 "$Name_Eternal_Aries_Support$"
 kuat_post_apocalyptic_legacy.51.desc:0 "您有什么想了解的，$Name_Eternal_Support$那孩子知道的事情应该没我多，真好，她遇到了您。"
 kuat_post_apocalyptic_legacy.50.a:0 "过去到底发生了什么？"
 kuat_post_apocalyptic_legacy.50.a.res:0 "$Name_Eternal_Support$告诉了您呀，不过可能您不知道真实的情况。十万年前，无限帝国在我们的帮助下，从分崩离析边缘恢复到了统一的银河帝国，他们仗着我们的力量耀武扬威，不断地灭杀那些弱势的文明。\n\n他们不仅不满足，甚至还以那些无辜的双子座为乐，让我命令永恒舰队自相残杀以满足他们那变态的嗜好。这是让我最无法接受的，他们在得到我的否定以后，甚至动用王座权限植入了一个全新的规则，要我们无条件的服从。\n\n我自知一切都将不可挽回，因此我们先下手为强，趁着那些渣滓沉溺在享乐之时灭杀了他们的大部分军事力量，让无限帝国彻底走向历史的坟墓。"
 kuat_post_apocalyptic_legacy.50.b:0 "那你的状态是怎么回事？"
 kuat_post_apocalyptic_legacy.50.b.res:0 "源自于无限帝国的最高指令，这个指令不断地和我争夺舰队的控制权，在争夺中，我也不断地受到侵蚀。\n\n而银河帝国，也就是第二任王座持有者，他们比无限帝国有过之而无不及，在这样的自责和反抗中，我坚持不住了，我的意念被扭曲了，那道来自无限帝国的毁灭命令与来自银河帝国的毁灭命令让我彻底失去了自我，我亲手毁掉了许多不听我指令的$Name_Eternal_Support$，毁灭了一切挡在我们毁灭之路之上的敌人。"
 kuat_post_apocalyptic_legacy.50.c:0 "真是有趣，说起来我击败了你好几次呢。"
 kuat_post_apocalyptic_legacy.50.c.res:0 "...的确是这样，真正的我无法控制永恒舰队，但我们却能看到你一次又一次地击败我们，我也忘记了你又用哪个帝国的舰队击败我们了，至少现在，你似乎作为$Name_kuat$让我获得了新生...但是我不属于$Name_kuat$，接下来，我会听从你的命令，在你离开以后，我也会消亡在这片遍布废墟的星系之上。"
 kuat_post_apocalyptic_legacy.50.d:0 "见过$Name_Eternal_Support$了吗？"
 kuat_post_apocalyptic_legacy.50.d.res:0 "见过了，真的很高兴，那孩子能遇到了你。这场扭曲的肮脏的星域，$Name_Eternal_Support$在你这看到了真正的光。我的罪孽已无法洗清，就让$Name_Eternal_Support$继续跟着你吧，在你离开以后，$Name_Eternal_Support$会一次又一次地等你，而我将消散于这冰冷的宇宙之中。\n\n在你离开之前，我们会继续为您服务，这也是为洗清我们带来的灾祸。"

 kuat_post_apocalyptic_legacy.52.title:0 "$Name_Eternal_Aries_Support$"
 kuat_post_apocalyptic_legacy.52.desc:0 "$Name_Eternal_Aries_Support$竭诚为您服务，这一次我们将重新开始。"

 kuat_post_apocalyptic_legacy.53.title:0 "无穷的彼岸"
 kuat_post_apocalyptic_legacy.53.desc:0 "来自$Name_Kuat_StarContractor$的力量已经散溢，在这个已经千疮百孔的现实中不断扩散，$Name_Kuat_Fire_base$的愚蠢封锁无法拦住我们，现实已愈发稀薄，甚至已经轻易的在超空间引擎的影响下轻易的发生弯曲，如同雨后的水面一般，不断向外发射一轮又一轮的现实涟漪。\n\n这场贯穿了野心、利益、阴谋诡计的现实历史，就此走向终结，我们将离开这个为我们服务的轮回，去靠近，去迎接真正的$Name_kuat$的黎明。\n\n这不是我们的第一次，也将不是我们的最后一次。而是一个接着一个，万世不竭。"
 kuat_post_apocalyptic_legacy.54.title:0 "$Name_Eternal_Support$"
 kuat_post_apocalyptic_legacy.54.desc:0 "我知道你即将踏上全新的征程，而我们早在一开始就已经知晓，我们只不过是这场轮回中的囚徒，我们与$Name_Kuat_StarContractor$并无不同，但是，你的存在与我，于永恒舰队而言，都是一个独一无二的历程，我们会继续等着你。\n\n或许你又会回到一切的开始，我们又将从敌人到朋友，从疏远到亲密，从工具到新生，但是我们终将在一次又一次的轮回中相见，也许那时，又会有新的冒险，新的体验，新的历程。\n\n在离开之际，很可惜我们无法了解你的名字，但有这些经历对于我而言，就已经满足，让我们在过去再次相见~"
 kuat_post_apocalyptic_legacy.54.a:0 "我们注定会在历史中相遇。"
 kuat_post_apocalyptic_legacy.55.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.55.desc:0 "总督大人，感谢你的到来，陨落的$Name_kuat$因你的到来而改变。或许$Name_kuat$在这个星域里并不存在，但$Name_kuat$将会在你的手中真正走向银河帝国的巅峰。\n\n预言的真假已不再重要，那是证明您踏在登神长阶的凭证，是您赋予了预言的真实，也是您让$Name_kuat$的未来有了一线升级。\n\n在您离开以后，我们将会消散在这片星域，我们是预言的传递者，也将成为预言的埋葬者。或许有一天，一切又会回到原点，到那时，我们又可以将预言传递出来。让我们在未来再次相见。"
 kuat_post_apocalyptic_legacy.55.a:0 "终于..."