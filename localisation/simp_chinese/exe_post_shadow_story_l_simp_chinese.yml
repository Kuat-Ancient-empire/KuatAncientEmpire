l_simp_chinese:
 origin_post_apocalyptic_kuat:0 "§E【夸特的黎明】后启示录§!"
 origin_post_apocalyptic_kuat_desc:0 "这是一颗位于边缘世界外的平凡行星，曾经是一个被毁灭的繁荣文明起源之地，他们赖以生存的环境造就了他们战胜$Name_Kuat$的力量。而现在，$Name_Kuat_Fire_base$替代了我们的角色，他们篡夺了永恒舰队，篡夺了帝国的权势，更篡夺了帝国的荣耀。夸特造船厂尚且能以企业的身份留在银河帝国，而我们这些来自$Name_kuat$的丧家之犬在偏远之地只能惶惶不可终日。\n\n不，这不是我们的应有的结局，我们将会让$Name_kuat$重新回到该有的的地位，那些该死的战争机器，我们将会给他们送上最后的葬曲，而银河帝国的荣耀终将被我们夺回！"
 origin_tooltip_post_apocalyptic_kuat_effects:0 "§H我们将作为夸特帝国开始这场游戏§!\n将使用§E固定三星星系§!星系开局\n该开局将具备$think_tank_ruined$，$dyson_sphere_ruined$，$matter_decompressor_ruined$§!\n§R我们将失去所有开局舰队，并与$Name_Kuat_Post_Support$建立宗主关系§!\n\n该起源属于《夸特的黎明》剧情后转。"
 Name_Post_Kuat_capital:"遗落之都"
 Name_Post_Kuat_System:"未知星域"
 Name_Kuat_Post_Support:"§E死亡舰队§!"

 kuat_post_apocalyptic_legacy.1.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.1.desc:0 "尊敬的总督大人，我们终于抵达了$Name_Post_Kuat_capital$，现在这里就是我们未来的根基，$Name_kuat$的遭遇已成定局，但我们不能只沉浸在过去。\n\n我们的错误决策被$Name_Kuat_Fire_base$利用，一步错步步错，因此整个$Name_kuat$被拖入了万丈深渊，尽管造船厂依旧还能保留下来，但造船厂已被$Name_Kuat_Fire_base$国有化，不再接受我们的命令，银河帝国的议会席位已经没有我们的一席之地。\n\n但是请您不要放弃，$Name_kuat$的未来依然掌握在我们手中，上一任总督就已经从未知星域找到了一些线索，这些线索完美预言了我们如今的局面，而其中正好就存在我们未来夺回我们一切的方法，现在我们的最后一支舰队已经抵达了预言中的星系，我们只要进一步找回那些在之前行动中遗落的技术，我们就能重新与$Name_Kuat_Fire_base$抗衡，并夺回我们应有的地位！"
 kuat_post_apocalyptic_legacy.1.a:0 "夺回我们的荣耀！"

 kuat_post_apocalyptic_legacy.2.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.2.0.desc:0 "尊敬的总督大人，$Name_Kuat_Post_Support$舰队司令很高兴为您服务，有什么需要我们帮忙的？"
 kuat_post_apocalyptic_legacy.2.1.desc:0 "尊敬的总督大人，$Name_Kuat_Post_Support$舰队司令很高兴为您服务，还有什么需要了解的吗？"
 kuat_post_apocalyptic_legacy.2.a:0 "你们是哪个部分的，为什么我没有印象？"
 kuat_post_apocalyptic_legacy.2.a.res:0 "尊敬的总督大人，$Name_Kuat_Post_Support$是$Name_kuat$秘密建立的一支小规模舰队，其目的是在出现预言局面时的底牌，我们的职责是带您抵达这片曾经被我们的舰队蹂躏的星系。而之前，一切安好，我们也就不会出现在您的面前，在这片星域上，隐藏着$Name_kuat$复兴的关键，我们需要您追回这些注定属于$Name_kuat$的财产。"
 kuat_post_apocalyptic_legacy.2.b:0 "为什么是我，之前的总督去哪了"
 kuat_post_apocalyptic_legacy.2.b.res:0 "尊敬的总督大人，这是命运注定的，$Name_kuat$的黑暗将会在您的带领下终结，黎明的破晓即将出现。之前的总督并不知晓这些，他们只是委员会的权力代表。\n\n如今$Name_kuat$已经崩溃，他们也该与之前的$Name_kuat$一同坠入深渊，银河帝国被$Name_Kuat_Fire_base$夺取，真正的$Name_kuat$将在此重生，我们期待真正的银河帝国建立的那一天。"
 kuat_post_apocalyptic_legacy.2.c:0 "预言？什么预言？"
 kuat_post_apocalyptic_legacy.2.c.res:0 "尊敬的总督大人，这是上一任总督不甘自身命运，不甘$Name_kuat$被操纵的现状，派我们深入未知星域寻找能够解决困境的办法。\n\n我们在一片巨大的未知银河系发现了这一线索，统治这片星域的恩多迪亚帝国，用他们独特数学计算预言了我们未来的灭亡，因此我们遵循了这一预言，我们毁灭了恩多迪亚帝国，无论他们是否愿意。在$Name_kuat$的灭亡以后，真正的$Name_kuat$就会破茧而出，我们将夺取我们曾经无法染指的一切。"
 kuat_post_apocalyptic_legacy.2.d:0 "那我们到底要找些什么，古代技术？"
 kuat_post_apocalyptic_legacy.2.d.res:0 "也许是古代技术，也可能是我们的技术，预言并不清晰，我们只能确定，我们需要找到恩多迪亚帝国遗址中真正被掩埋的瑰宝，并借此重新找回改进我们的技术。\n\n我只能带您抵达这里，我们目前没有足够的技术人员和储备，也无法重新建造我们自己的舰船，但好在这片星域有些简单的舢板可以制造。"
 kuat_post_apocalyptic_legacy.2.e:0 "为什么$Name_kuat$这么快就崩溃了"
 kuat_post_apocalyptic_legacy.2.e.res:0 "追溯根本，或许是是预言在高层的传播，尽管委员会的委员们不相信这一切，但是他们依旧为此变得更加疯狂，在委员会控制之下，$Name_kuat$借助研究那些无用的战争机器的名字，暴力寻找破解预言的方法。\n\n而正是因为这一行径，我们毁灭了恩多迪亚帝国，毁灭了各种文明，并招来了有史以来最强大的敌人————永恒帝国，他们摧毁了我们引以为傲的舰队，并让$Name_Kuat_Fire_base$坐享其成。\n\n$Name_Kuat_Fire_base$表面与我们和谐共处，实际上他们借这个机会落进下石，一举夺取了议会中属于我们的席位，并国有化了我们的造船厂，促使我们的根基崩塌。\n\n无论怎么讲，$Name_kuat$的复兴不可阻挡，帝国万岁。"

 kuat_post_apocalyptic_legacy.3.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.3.desc:0 "尊敬的总督大人，预言果然没错，您以最快的速度找到了恩多迪亚帝国的一处重要遗迹的线索，这座星域曾是我们与恩多迪亚帝国战争的核心战场之一，我们在这里投入了多支大规模的舰队，并彻底终结了恩多迪亚的永恒堡垒的研发。\n\n如今，恩多迪亚帝国的遗迹或许已经被很多文明关顾，但遗迹并未被完全发掘，那些愚蠢的文明是不知道在这遗迹的深处才是真正的秘密所在，就连我们，也是在这场战争中，通过探测器发现的。\n\n在这片区域，恩多迪亚人构建了多层构造，试图封存他们逆向和研究的技术，并为未来的着卷土重来做好准备，无论怎么讲，这些都便宜了我们。"
 kuat_post_apocalyptic_legacy.3.a:0 "非常好"
 kuat_post_apocalyptic_legacy_3_find_A_facility:0 "定位$Name_A_1$坐标"
 kuat_post_apocalyptic_legacy_3_find_A_facility_DESC:"$Name_A_1$是恩多迪亚帝国的重要军事设施，他们在这片星区建立了大量的军事研究所，他们试图在此复刻我们的舰船技术，在我们与恩多迪亚帝国的战争中，这片星区不得不被完全摧毁，而恩多迪亚人在这片星域深处埋藏了他们卷土重来的希望，如今这将是我们卷土重来的砝码。"

 kuat_post_apocalyptic_legacy.4.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.4.desc:0 "尊敬的总督大人，我们的研究人员已经完成了对$Name_A_1$星系的定位工作，现在我们只需要进入这片星区，恩多迪亚人或许也没想到，他们埋藏的希望最后竟然成为我们的嫁衣。"
 kuat_post_apocalyptic_legacy.4.a:0 "非常好，舰队做好准备。"

 kuat_legacy.21.kuat_post_apocalyptic_legacy.desc:"我们来到了目标星系，正如$Name_Kuat_Post_Support$所言，这片星系被充斥着惨烈战争之后的残骸，尽管这些帝国级重型巡洋舰已经面目全非，但我们依旧能感受到这场战斗的惨烈程度。\n\n除此之外，这片星区已经可以证明有多个文明的勘探队抵达，希望我们的东西没有被夺走。搜查整个星环，掘地三尺也要把恩多迪亚人隐藏的秘密都找出来。"

 kuat_legacy.22.kuat_post_apocalyptic_legacy.desc:"总体来看，$Name_A_1$受损非常严重，看来我们曾经对恩多迪亚帝国的核心星区造成了相当严重的破坏。然而结合我们的资料和当前的的结果来看，$Name_A_1$的恒星不该是一个巨大的黑洞，或许在我们之后这里又发生了些什么。"

 kuat_legacy.23.kuat_post_apocalyptic_legacy.desc:"正如$Name_Kuat_Post_Support$所料，这座陨落的要塞，被巨大的舰船残骸和建筑废墟笼罩，整个星环成为了恩多迪亚帝国对抗我们的要塞，而这座要塞依旧无法阻挡我们强大的舰队。\n\n在这片废墟之上我们发现了部分临时住宅建筑，看时间来说应该是之前的文明的勘探人员，看来这里的表层结构已经被搜刮一空，我们该寻找更为深层的区域。"

 kuat_legacy.24.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在这片废墟的调查陷入了困境，我们发现了多个文明的勘探队抵达的痕迹，甚至还有曾经被我们毁灭的一个帝国，他们的勘探队也发现了这里，或许他们就是在这里带走了一部分我们遗落在此的技术。\n\n除此之外我们还发现了一座用于传输录像的设备，我们在截取和分析里面的录像数据时发现，这竟是曾经恩多迪亚人的警示。看起来这些恩多迪亚人对他们的野心和行为感到了悔恨与自责。\n\n真是有趣，这些恩多迪亚人似乎并不知道真相，$Name_Kuat_Post_Support$的资料库中显示，恩多迪亚人因为我们预言未来而走向灭亡，他们在预言中就知道了自己的命运，他们为了规避命定结果，做出了这场战争的决定，没想到这些民众居然完全不知道。\n\n[leader.GetName]仍未找到其他更有价值的信息。"

 kuat_legacy.25.kuat_post_apocalyptic_legacy.desc:"这些恩多迪亚人藏东西可真够深得，[leader.GetName]在多轮勘探无果以后竟然在一处陡峭峡谷的崖壁上找到了部分恩多迪亚的军用机器人残骸，这些残骸为我们指明了方向。\n\n我们在山崖中找到了一处秘密研究设施，幸运的是这些仪器仍然可以使用，在数据解密完成以后，[leader.GetName]惊喜的发现，这里面竟然指向着一处更为隐秘的研究设施。\n\n该设施主要是尝试解析来自我们的轻型巡洋舰系统，而且进程已相当的圆满，或许只要恩多迪亚人重新接管这个星系就能重新建造我们的强大舰船。除此之外，这座要塞中有价值的信息不多，但是我们还是拿到了本土的跃迁技术和星门穿越技术。"

 kuat_post_apocalyptic_legacy.5.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.5.desc:0 "尊敬的总督大人，您的效率真是令人惊讶，这么快就完成了对$Name_A_1$的初步调查，正如您发现的一样，恩多迪亚人在这里与我们的舰队发生了一场惨烈的交锋，但我们成功赢得了这场战争的胜利。\n\n这场战争本可以避免，但是贪恋的委员们不甘心帝国的结局，他们的疯狂也被恩多迪亚帝国所预见，而恩多迪亚帝国也在$Name_Kuat_Fire_base$的蛊惑和他们对命定结果的不甘的推动下，这场冲突彻底爆发，最终演变为这种结果。\n\n这些恩多迪亚人收集了我们的小型舰船技术，这对我们现在来说是非常有用的，这也算他们死得其所了，不过似乎您还没找到。无论如何，现在我们该前往$Name_B_1$，我们已经确认了其星图坐标。"
 kuat_post_apocalyptic_legacy.5.a:0 "好的。"

 kuat_legacy.50.kuat_post_apocalyptic_legacy.desc:"我们来到了目标星系，正如$Name_Kuat_Post_Support$所言，这片星系被充斥着惨烈战争之后的残骸，但相比$Name_A_1$来说，并没有被毁坏的特别严重，相对于$Name_A_1$的换代来说，这片星区的环带保留了一定的完整性，或许有助于我们的进一步调查。\n\n除此之外，$Name_Kuat_Post_Support$为我们提供了这个星系的一些更为重要的信息，这个星系曾经是恩多迪亚帝国的舰船武器研究中心，其中主要是逆向我们的主力舰技术，考虑到在$Name_A_1$构建的护航舰技术的完成度相当的高的情况，我们或许能在这里直接夺回我们遗落的主力舰设计图纸。"

 kuat_legacy.51.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]带着她的科研团队抵达了星环结构区域的轨道，俯瞰被损毁的无边无际的建筑废墟，这些都是$Name_kuat$的舰队造成的，在那场惨烈的战争中，恩多迪亚人用尽了一切能够反抗的武器，但这仍然阻断不了我们的舰队抵达星环的上空，那一天以后，城市崩塌，星环破碎，最终成为了这个样子。\n\n尽管这座星环结构已经完全成为了废墟，但是[leader.GetName]判断，我们应该在这里进一步的搜索，与$Name_A_1$一样，有一些不为人知的秘密设施。"

 kuat_legacy.52.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在星环结构上的调查陷入了困境，就在危机时刻，$Name_Kuat_Post_Support$为我们传输了一些高价值的信息，$Name_Kuat_Post_Support$过去在这片结构的调查中发现，恩多迪亚的研究设施周围一定存在着一种具备特殊频段的信号收发器，这一收发器能发射出极为微弱而与众不同的辐射，我们可以借助仪器寻找这一线索。"

 kuat_legacy.53.kuat_post_apocalyptic_legacy.desc:"这一方法不仅被我们使用，[leader.GetName]发现，之前的多个勘探队都利用了这种方法，根据$Name_Kuat_Post_Support$的历史记载来看，曾经有多个文明都从这里获得了他们意料之外的收获，其中正有击败$Name_kuat$的永恒帝国。\n\n这让我们的勘探队员们心中一沉，这里的遗迹难道已经被搜刮干净了吗，我们还需要进一步的调查。"

 kuat_legacy.54.kuat_post_apocalyptic_legacy.desc:"在沉闷的氛围中，[leader.GetName]带领他的团队在找到了这座星环遗迹的控制中心废墟，尽管已经被轰炸成了废墟，但依旧能想象这座星环心脏曾经的宏伟。\n\n[leader.GetName]进入后发现整个控制中心的设备都已经完全停止运转，而在停止运转的设备中，一个AI设备的停运时间似乎与其他设备有明显不同，[leader.GetName]决定对该AI设备的信息进行提取分析，或许能找到我们想要的信息。"

 kuat_legacy.55.kuat_post_apocalyptic_legacy.desc:"在随后的一段时间里，[leader.GetName]成功的对AI设备的信息进行了采样分析，将其转录后发现，这个AI在千年前为永恒帝国的探险者传递了一些重要的信息，AI告诉了永恒帝国在控制中心中隐藏着恩多迪亚留下来的舰船技术，而这些技术残留的图像显示，这正是我们的主力舰船技术，恩多迪亚人居然还早已成功逆向我们的技术。\n\n这些信息都太令人难以接受，我们需要进一步了解更多有价值的信息。"

 kuat_legacy.56.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]带着疑惑，对整个控制中心的有效数据进行了关联分析，[leader.GetName]发现了一个震惊的事实，恩多迪亚人留下了一个影像，他们告诉了那些外来者，甚至包括永恒帝国，拿到我们的科技蓝图，并在暗地里提示，有人正在监视他们。\n\n[leader.GetName]认为，或许这并不是指向我们，$Name_kuat$正在对永恒舰队开展军事行动，无观察这些土著们的行动，或许，这是暗示会和$Name_Kuat_Fire_base$有关，无论如何我们都需要更多的信息。"

 kuat_lagacy.74.kuat_post_apocalyptic_legacy.desc:"与$Name_A_1$相似的是，我们的研究人员在对整个星区的周期性勘探中发现，在一处损毁星环带中，我们找到了一些有价值的线索，我们在损毁的星环带中发现了一座先驱城市，这一城市设施曾经被我们的舰队完全摧毁，而如今其中的部分建筑居然奇迹般地修复了一些。\n\n我们的研究人员认为，这里被其他势力的勘探队调查过，或许是有一些高价值线索隐藏在其中，因此我们也必须对该处进行全方位的调查。"

 kuat_lagacy.251.kuat_post_apocalyptic_legacy.desc:"我们的研究人员一直都在对$Name_A_1$进行无间断地勘探，功夫不负有心人，我们成功找到了之前在山崖中找到的线索指向的隐秘研究设施所在地\n\n这座研究设施在环带的另一侧，该处也在当年的战争中被摧毁殆尽，如今我们需要重回这座环带，与之前的环带相似，这段环已经被我们炸成了一片废墟，整个环带上的人造设施没有一处是完好的。\n\n§Y但我们不能放过这里，我们必须重新对这篇区域进行无死角的搜查。§!"
 kuat_post_apocalyptic_kuat_eternal_starbase:"搜查$Name_A_1$"
 kuat_post_apocalyptic_kuat_eternal_starbase_DESC:"正如$Name_Kuat_Post_Support$所说，我们还没有找到恩多迪亚人藏在这片星区里的技术，他们在这里埋藏了相当完善的技术资料，只为恩多迪亚帝国的卷土重来。而他们研究的一切都是属于我们的，他们偷窃的$Name_kuat$技术也该还给我们了。\n\n调查这里，任何角落都不要放过！"

 kuat_post_apocalyptic_kuat_eternal_ship:"勘探[ancient_shadow_place_B.GetName]"
 kuat_post_apocalyptic_kuat_eternal_ship_DESC:"我们的研究人员已经确定，[ancient_shadow_place_B.GetName]上发生的离奇事件或许是这片星域我们尚未找到的高价值线索的来源，目前我们已经对这片曾经被我们轰炸成废墟的先去城市进行全方位的扫描。\n\n接下来我们就该派遣地面部队进行调查。"

 kuat_post_apocalyptic_legacy.6.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.6.desc:0 "REPLACE_ME"
 kuat_post_apocalyptic_legacy.6.a:0 "REPLACE_ME"

 kuat_post_apocalyptic_legacy.7.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.7.desc:0 "尊敬的总督大人，不得不说您的进展真是令人出乎意料，这么快您就找到了恩多迪亚隐秘遗迹，这座遗迹中埋藏着恩多迪亚偷窃我们的技术贮存，或许曾经我们看不上眼，而如今，我们必须利用这些贮存，重新恢复我们的军事技术。\n\n等您能完全掌握全部的舰船技术的时候，就是$Name_Kuat_Post_Support$重新加入作战的时刻。"
 kuat_post_apocalyptic_legacy.7.a:0 "帝国永存。"

 kuat_post_apocalyptic_legacy.8.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.8.desc:0 "依据我们曾经收集的信息来看，这座星环的状态在恩多迪亚帝国陨落以后并未发生比较明显的变化，这意味着我们将会在这里收获属于我们的一切。我们研究了历史中迁来此处挖掘的几个文明，他们仅仅只是找到了恩多迪亚的部分遗产。\n\n我们已经确定被带走的是永恒堡垒，这一堡垒技术我们或许需要更进一步的调查，好在他们并未找到恩多迪亚隐藏的$Name_kuat$舰船技术，现在是我们收获真正的成果的时候了。"
 kuat_post_apocalyptic_legacy.8.a:0 "帝国永存。"

 kuat_legacy.181.kuat_post_apocalyptic_legacy.desc:"我们的勘探人员接到调查该星环遗迹的命令以后，便全力投入工作当中，我们已经成功对整个星环周边的空间稳定进行了详细的分析，据点区域相对处于一个安全的范围，尽管整个星环都被我们轰炸后的废墟所覆盖，但我们仍然成功找到了一些高价值的线索。\n\n我们的研究人员发现这座废墟当中存在着一种较为微弱的能量辐射，这一辐射与我们之前发现的山崖上的恩多迪亚帝国实验室中的信号仪器有一定的相似性。现在我们已经开始着色对其进行调查。"
 kuat_legacy.181.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]在接到我们的指示以后，他带领他的团队通过我们的轨道飞船接近了此处环带，这里的环带与我们之前位于$Name_A_1$的星域登陆的环带具有一定的相似程度，这里同样是一个由自动设施组成的非宜居环带，初步的研究和地质勘探信息来看，被我们摧毁的这片区域，应该是作为其恩多迪亚帝国的一处军事研究供给设施。\n\n值得我们注意的是，这一设施所在区域在$Name_kuat$轰炸以后已经完全变为了废墟，而如今居然奇迹般地修复了一部分，我们必须找到其中的缘由。"

 kuat_legacy.182.kuat_post_apocalyptic_legacy.desc:"令人满意的是，我们的研究人员对这一微弱的能量辐射反应的溯源进展相当的顺利，我们顺利的找到了来自恩多迪亚帝国的研究设施外围。\n\n在我们找到外围的一路上我们发现这里实际上已经有了多个外来种族的勘探队的痕迹，相当一部分人留下来的记载中写到得到了他们意想不到的收获，这与$Name_Kuat_Post_Support$收集的信息不谋而合，看来我们找回技术的进展相当的顺利。"
 kuat_legacy.182.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]通过对整个环带的监控中，记录了其被轰炸以来的变化数据，在这段时间内，整个废墟的建筑都在以一种极为缓慢的速度进行修复，这不符合我们所了解的熵增定律，这座环带正在变得更加有序。\n\n这一现象引起了我们的团队的注意，现在已经开始着手对这一现象进行调查。"

 kuat_legacy.183.kuat_post_apocalyptic_legacy.desc:"我们的研究人员发现，其他势力的勘探队都前往了一处高塔，我们的勘探人员已经确定那曾经是这座星环设施的指挥中心，但是$Name_Kuat_Post_Support$给我们的传来信息显示，我们想要的并不在那里。\n\n基于此，我们的研究人员成功在城市外围的一处自动化农业设施废墟中找到了与我们探测到的能量辐射极为相似的一种能量，我们的研究人员已经确定我们只需要沿着这些信息就能找到被隐藏的研究设施。"
 kuat_legacy.183.b.kuat_post_apocalyptic_legacy.desc:"尽管调查了相当长的时间，但是我们的研究人员依旧成功的找到了这些城市从无序缓慢变为有序的原因，我们在城市废墟的下方找到了一处微弱的辐射能量信号。\n\n这与我们曾经见过的光明原力有一定的相似性，这种能量正在悄无声息的让整个城市恢复到他们本来的样子，这也意味着我们现在可以借这种能量，找到这座环带的心脏。"

 kuat_legacy.184.kuat_post_apocalyptic_legacy.desc:"令人振奋的消息传来，我们的研究人员根据相似的能量辐射特征找到了一处大门紧闭的研究设施，我们通过分析可以确定这就是恩多迪亚隐藏的研究设施。\n\n然而由于之前在战争中受到轨道轰炸的影响，该设施的的控制系统已经完全无法运转，我们必须想办法进去。"
 kuat_legacy.184.b.kuat_post_apocalyptic_legacy.desc:"[leader.GetName]依据此前的研究，找到了整个城市的核心，在这个城市遗迹的中心存在着一处被轰炸倒塌的尖塔，而这座尖塔正随着这股有序的能量逐渐的恢复其往日的光泽。进而我们不费吹灰之力就找到了这座遗迹的核心。\n\n我们在一处尖塔西北角的承重柱旁边找到了一个凹陷的结构区域，凹陷的图形似乎类似恩多迪亚帝国的帝国旗帜的图案。\n\n我们根据从之前遗迹中获取的纹理图案，利用该处的建筑材料通过打印设备制造出了填补空缺的物件，[leader.GetName]将我们打印好的图案填补上去后，尖塔东南侧发生了巨大的声响，东南侧的大门由此彻底打开。\n\n现在我们可以顺利进入遗迹的核心了。"

 kuat_legacy.185.kuat_post_apocalyptic_legacy.desc:"我们的勘探人员利用涡轮炸药对设施的外围区域进行了爆破清理，由此我们可以顺着清理出来的道路进入设施，我们的研究人员在里面找到了一些恩多迪亚的研究资料。其资料主要列举了一些他们的研究内容：\n§Y实验项目：高能涡轮压缩...成功\n实验项目：智能作战系统...成功\n实验项目：高能涡轮激光...成功§!\n\n基于这些研究信息我们可以发现恩多迪亚人已经开始构建我们的技术成果。现在我们需要找到这些成果，并拿回来。"
 kuat_legacy.185.b.kuat_post_apocalyptic_legacy.desc:"在进入尖塔后，[leader.GetName]发现曾经有多支勘探队都成功进入了尖塔，然而他们并未注意到，整个尖塔实际上是在变化的，[leader.GetName]决定动用爆炸手段清出一片道路出来，这些有序能量的源头或许就是我们想要的东西。\n\n[leader.GetName]的决策非常有效，爆破手段简单高效的清除了整个尖塔结构的障碍，我们的团队竟然由此进入了遗迹的核心，[leader.GetName]发现在核心居然有着一个巨大的计算核心，尽管目前看起来损坏相当的严重，但仍然有恢复其运转的可能。"

 kuat_legacy.186.kuat_post_apocalyptic_legacy.desc:"我们的研究人员在寻找其他信息的时候发现了一些恩多迪亚人记录的影像信息：\n\n§Y大人，依据您的命令，整个星环的舰队已经做好了准备。\n\n§G很好，命令其他几个要塞的守军做好准备。\n\n§G陛下，这么做，真的有用吗？我们的预测已经注定了我们的未来，我们现在的挣扎何尝不是走向那个确定的未来。\n\n§Y...那又怎样呢，我们预知了未来，但我们却无法躲避这个未来，不过好在，我们很快就解脱了，而$Name_kuat$将会在黑暗中苦苦挣扎，他们未来会返回这里，留下这一切，留下他们的技术，我们和他们的希望，留在这里。"
 kuat_legacy.186.b.kuat_post_apocalyptic_legacy.desc:"在计算核心恢复运转以后，其毫无征兆的扫描了[leader.GetName]及其团队，令人安心的是，计算核心给我们展示了曾经进来的勘探队的影像信息，我们居然在其中看到了来自永恒帝国的勘探队。\n\n随后计算核心为我们展现了一些恩多迪亚人的影响信息：\n\n§Y你说，天命能改变吗。\n\n§G大人，这是无法改变的事情，我们正在往天命注定的方向前进，无论您决定做什么。\n\n§Y那你这么说，我们岂不是只是无能狂怒，在做无用功？不，我不这么认为，如果我们得知了命运的结果，而因此影响了我们的行为，或许对我们自身来说，我们无法逃脱这一注定的命运。但我们也会因此留下一颗种子，这颗种子将会在未来绽放，并消灭那尚未爆发的黑暗。\n\n§G难道是$Name_kuat$吗，他们在既定的结果里也是非常清晰的，能改变什么呢。\n\n§Y你就是太短视了，我们将会化为燃烧命运的薪柴，将会让真正的$Name_kuat$走到他们正确的道路上。"

 kuat_legacy.192.b.kuat_post_apocalyptic_legacy.desc:"这些材料的信息相比过去更加耐人寻味了，恩多迪亚帝国真的遗迹知道了他们的未来，且他们的一切行动都是为了走到这一未来，而他们又看到了命运中超脱的那一线希望，这希望是什么，难道是我们吗。\n\n我们的研究人员目前已经无法继续开展工作，现在该撤退了。"
 kuat_legacy.192.kuat_post_apocalyptic_legacy.desc:"这一材料的信息实在耐人寻味，恩多迪亚帝国的高层似乎知道了他们的未来，而这场战争只不过是他们向未来前进的一大步，他们在这里留下了我们的技术，甚至还能知道如今我们会返回这里，或许恩多迪亚帝国的崩溃另有隐情。\n\n无论如何，我们该从这里拿回属于我们的技术了。"

 ancient_shadow_place_post_apocalyptic:"--->解锁：$Name_boss_Horriwer$星际轻型巡洋舰设计<---\n--->解锁：$Name_boss_Gladiator$星际护航舰设计<---\n--->解锁：$Name_boss_Cavelry$区域防卫舰设计<---"
 ancient_shadow_place_B_post_apocalyptic:"--->解锁：$Name_boss_HIGH_EMPIRE$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Xyston$星际重型巡洋舰设计<---\n--->解锁：$Name_boss_Resugrant$星际重型巡洋舰设计<---"
 kuat_post_apocalyptic_legacy.9.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.9.desc:0 "尊敬的总督大人，您的工作效率真是出奇的高，当年我们收集了的信息都并不知晓原来恩多迪亚帝国与$Name_kuat$的战争竟是如此的...诡异。\n\n这趟浑水已经被您搅的更加浑浊，恩多迪亚为何要为哦我们留下来这些技术，我们原以为是他们试图卷土重来而贮存的，这样的矛盾竟然发生在我们的敌人身上。或许在$Name_B_1$上的发现将会有助于我们揭开这部分疑惑。\n\n帝国永存。"
 kuat_post_apocalyptic_legacy.9.a:0 "无论如何，帝国永存。"

 kuat_post_apocalyptic_legacy.10.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.10.desc:0 "我们在$Name_B_1$星系中的[ancient_shadow_place_B.GetName]上发现了一处奇特的城市建筑，或许这里会有帮助我们了解恩多迪亚这些行为动机的线索。\n\n此外依据我们对恩多迪亚人的分析，他们曾在$Name_A_1$中保留了我们的轻巡与护航舰技术，或许在这里会保留我们的主力舰技术，总督大人请派人进一步的调查这一区域。"
 kuat_post_apocalyptic_legacy.10.a:0 "好的，我会安排的。"

