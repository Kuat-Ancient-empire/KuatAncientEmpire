l_simp_chinese:
 origin_post_apocalyptic_kuat:0 "§E【夸特的黎明】后启示录§!"
 origin_post_apocalyptic_kuat_desc:0 "这是一颗位于边缘世界外的平凡行星，曾经是一个被毁灭的繁荣文明起源之地，他们赖以生存的环境造就了他们战胜$Name_Kuat$的力量。而现在，$Name_Kuat_Fire_base$替代了我们的角色，他们篡夺了永恒舰队，篡夺了帝国的权势，更篡夺了帝国的荣耀。夸特造船厂尚且能以企业的身份留在银河帝国，而我们这些来自$Name_kuat$的丧家之犬在偏远之地只能惶惶不可终日。\n\n不，这不是我们的应有的结局，我们将会让$Name_kuat$重新回到该有的的地位，那些该死的战争机器，我们将会给他们送上最后的葬曲，而银河帝国的荣耀终将被我们夺回！"
 origin_tooltip_post_apocalyptic_kuat_effects:0 "§H我们将作为夸特帝国开始这场游戏§!\n将使用§E固定三星星系§!星系开局\n该开局将具备$think_tank_ruined$，$dyson_sphere_ruined$，$matter_decompressor_ruined$§!\n§R我们将失去所有开局舰队，并与$Name_Kuat_Post_Support$建立宗主关系§!\n\n该起源属于《夸特的黎明》剧情后转。"
 Name_Post_Kuat_capital:"遗落之都"
 Name_Post_Kuat_System:"未知星域"
 Name_Kuat_Post_Support:"§E死亡舰队§!"

 kuat_post_apocalyptic_legacy.1.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.1.desc:0 "尊敬的总督大人，我们终于抵达了$Name_Post_Kuat_capital$，现在这里就是我们未来的根基，$Name_kuat$的遭遇已成定局，但我们不能只沉浸在过去。\n\n我们的错误决策被$Name_Kuat_Fire_base$利用，一步错步步错，因此整个$Name_kuat$被拖入了万丈深渊，尽管造船厂依旧还能保留下来，但造船厂已被$Name_Kuat_Fire_base$国有化，不再接受我们的命令，银河帝国的议会席位已经没有我们的一席之地。\n\n但是请您不要放弃，$Name_kuat$的未来依然掌握在我们手中，上一任总督就已经从未知星域找到了一些线索，这些线索完美预言了我们如今的局面，而其中正好就存在我们未来夺回我们一切的方法，现在我们的最后一支舰队已经抵达了预言中的星系，我们只要进一步找回那些在之前行动中遗落的技术，我们就能重新与$Name_Kuat_Fire_base$抗衡，并夺回我们应有的地位！"
 kuat_post_apocalyptic_legacy.1.a:0 "夺回我们的荣耀！"

 kuat_post_apocalyptic_legacy.2.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.2.0.desc:0 "尊敬的总督大人，$Name_Kuat_Post_Support$舰队司令很高兴为您服务，有什么需要我们帮忙的？"
 kuat_post_apocalyptic_legacy.2.1.desc:0 "尊敬的总督大人，$Name_Kuat_Post_Support$舰队司令很高兴为您服务，还有什么需要了解的吗？"
 kuat_post_apocalyptic_legacy.2.a:0 "你们是哪个部分的，为什么我没有印象？"
 kuat_post_apocalyptic_legacy.2.a.res:0 "尊敬的总督大人，$Name_Kuat_Post_Support$是$Name_kuat$秘密建立的一支小规模舰队，其目的是在出现预言局面时的底牌，我们的职责是带您抵达这片曾经被我们的舰队蹂躏的星系。而之前，一切安好，我们也就不会出现在您的面前，在这片星域上，隐藏着$Name_kuat$复兴的关键，我们需要您追回这些注定属于$Name_kuat$的财产。"
 kuat_post_apocalyptic_legacy.2.b:0 "为什么是我，之前的总督去哪了"
 kuat_post_apocalyptic_legacy.2.b.res:0 "尊敬的总督大人，这是命运注定的，$Name_kuat$的黑暗将会在您的带领下终结，黎明的破晓即将出现。之前的总督并不知晓这些，他们只是委员会的权力代表。\n\n如今$Name_kuat$已经崩溃，他们也该与之前的$Name_kuat$一同坠入深渊，银河帝国被$Name_Kuat_Fire_base$夺取，真正的$Name_kuat$将在此重生，我们期待真正的银河帝国建立的那一天。"
 kuat_post_apocalyptic_legacy.2.c:0 "预言？什么预言？"
 kuat_post_apocalyptic_legacy.2.c.res:0 "尊敬的总督大人，这是上一任总督不甘自身命运，不甘$Name_kuat$被操纵的现状，派我们深入未知星域寻找能够解决困境的办法。\n\n我们在一片巨大的未知银河系发现了这一线索，统治这片星域的恩多迪亚帝国，用他们独特数学计算预言了我们未来的灭亡，因此我们遵循了这一预言，我们毁灭了恩多迪亚帝国，无论他们是否愿意。在$Name_kuat$的灭亡以后，真正的$Name_kuat$就会破茧而出，我们将夺取我们曾经无法染指的一切。"
 kuat_post_apocalyptic_legacy.2.d:0 "那我们到底要找些什么，古代技术？"
 kuat_post_apocalyptic_legacy.2.d.res:0 "也许是古代技术，也可能是我们的技术，预言并不清晰，我们只能确定，我们需要找到恩多迪亚帝国遗址中真正被掩埋的瑰宝，并借此重新找回改进我们的技术。\n\n我只能带您抵达这里，我们目前没有足够的技术人员和储备，也无法重新建造我们自己的舰船，但好在这片星域有些简单的舢板可以制造。"
 kuat_post_apocalyptic_legacy.2.e:0 "为什么$Name_kuat$这么快就崩溃了"
 kuat_post_apocalyptic_legacy.2.e.res:0 "追溯根本，或许是是预言在高层的传播，尽管委员会的委员们不相信这一切，但是他们依旧为此变得更加疯狂，在委员会控制之下，$Name_kuat$借助研究那些无用的战争机器的名字，暴力寻找破解预言的方法。\n\n而正是因为这一行径，我们毁灭了恩多迪亚帝国，毁灭了各种文明，并招来了有史以来最强大的敌人————永恒帝国，他们摧毁了我们引以为傲的舰队，并让$Name_Kuat_Fire_base$坐享其成。\n\n$Name_Kuat_Fire_base$表面与我们和谐共处，实际上他们借这个机会落进下石，一举夺取了议会中属于我们的席位，并国有化了我们的造船厂，促使我们的根基崩塌。\n\n无论怎么讲，$Name_kuat$的复兴不可阻挡，帝国万岁。"

 kuat_post_apocalyptic_legacy.3.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.3.desc:0 "尊敬的总督大人，预言果然没错，您以最快的速度找到了恩多迪亚帝国的一处重要遗迹的线索，这座星域曾是我们与恩多迪亚帝国战争的核心战场之一，我们在这里投入了多支大规模的舰队，并彻底终结了恩多迪亚的永恒堡垒的研发。\n\n如今，恩多迪亚帝国的遗迹或许已经被很多文明关顾，但遗迹并未被完全发掘，那些愚蠢的文明是不知道在这遗迹的深处才是真正的秘密所在，就连我们，也是在这场战争中，通过探测器发现的。\n\n在这片区域，恩多迪亚人构建了多层构造，试图封存他们逆向和研究的技术，并为未来的着卷土重来做好准备，无论怎么讲，这些都便宜了我们。"
 kuat_post_apocalyptic_legacy.3.a:0 "非常好"
 kuat_post_apocalyptic_legacy_3_find_A_facility:0 "定位$Name_A_1$坐标"
 kuat_post_apocalyptic_legacy_3_find_A_facility_DESC:"$Name_A_1$是恩多迪亚帝国的重要军事设施，他们在这片星区建立了大量的军事研究所，他们试图在此复刻我们的舰船技术，在我们与恩多迪亚帝国的战争中，这片星区不得不被完全摧毁，而恩多迪亚人在这片星域深处埋藏了他们卷土重来的希望，如今这将是我们卷土重来的砝码。"

 kuat_post_apocalyptic_legacy.4.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.4.desc:0 "尊敬的总督大人，我们的研究人员已经完成了对$Name_A_1$星系的定位工作，现在我们只需要进入这片星区，恩多迪亚人或许也没想到，他们埋藏的希望最后竟然成为我们的嫁衣。"
 kuat_post_apocalyptic_legacy.4.a:0 "非常好，舰队做好准备。"

 kuat_legacy.21.kuat_post_apocalyptic_legacy.desc:"我们来到了目标星系，正如$Name_Kuat_Post_Support$所言，这片星系被充斥着惨烈战争之后的残骸，尽管这些帝国级重型巡洋舰已经面目全非，但我们依旧能感受到这场战斗的惨烈程度。\n\n除此之外，这片星区已经可以证明有多个文明的勘探队抵达，希望我们的东西没有被夺走。搜查整个星环，掘地三尺也要把恩多迪亚人隐藏的秘密都找出来。"
 kuat_legacy.22.kuat_post_apocalyptic_legacy.desc:"总体来看，$Name_A_1$受损非常严重，看来我们曾经对恩多迪亚帝国的核心星区造成了相当严重的破坏。然而结合我们的资料和当前的的结果来看，$Name_A_1$的恒星不该是一个巨大的黑洞，或许在我们之后这里又发生了些什么。"
 kuat_legacy.23.kuat_post_apocalyptic_legacy.desc:"正如$Name_Kuat_Post_Support$所料，这座陨落的要塞，被巨大的舰船残骸和建筑废墟笼罩，整个星环成为了恩多迪亚帝国对抗我们的要塞，而这座要塞依旧无法阻挡我们强大的舰队。\n\n在这片废墟之上我们发现了部分临时住宅建筑，看时间来说应该是之前的文明的勘探人员，看来这里的表层结构已经被搜刮一空，我们该寻找更为深层的区域。"
 kuat_legacy.24.kuat_post_apocalyptic_legacy.desc:"我们的研究人员在这片废墟的调查陷入了困境，我们发现了多个文明的勘探队抵达的痕迹，甚至还有曾经被我们毁灭的一个帝国，他们的勘探队也发现了这里，或许他们就是在这里带走了一部分我们遗落在此的技术。\n\n除此之外我们还发现了一座用于传输录像的设备，我们在截取和分析里面的录像数据时发现，这竟是曾经恩多迪亚人的警示。看起来这些恩多迪亚人对他们的野心和行为感到了悔恨与自责。\n\n真是有趣，这些恩多迪亚人似乎并不知道真相，$Name_Kuat_Post_Support$的资料库中显示，恩多迪亚人因为我们预言未来而走向灭亡，他们在预言中就知道了自己的命运，他们为了规避命定结果，做出了这场战争的决定，没想到这些民众居然完全不知道。\n\n我们的研究人员仍未找到其他更有价值的信息。"
 kuat_legacy.25.kuat_post_apocalyptic_legacy.desc:"这些恩多迪亚人藏东西可真够深得，我们的研究人员在多轮勘探无果以后竟然在一处陡峭峡谷的崖壁上找到了部分恩多迪亚的军用机器人残骸，这些残骸为我们指明了方向。\n\n我们在山崖中找到了一处秘密研究设施，幸运的是这些仪器仍然可以使用，在数据解密完成以后，我们的研究人员惊喜的发现，这里面竟然指向着一处更为隐秘的研究设施。\n\n该设施主要是尝试解析来自我们的轻型巡洋舰系统，而且进程已相当的圆满，或许只要恩多迪亚人重新接管这个星系就能重新建造我们的强大舰船。除此之外，这座要塞中有价值的信息不多，但是我们还是拿到了本土的跃迁技术和星门穿越技术。"

 kuat_post_apocalyptic_legacy.5.title:0 "$Name_Kuat_Post_Support$"
 kuat_post_apocalyptic_legacy.5.desc:0 "尊敬的总督大人，您的效率真是令人惊讶，这么快就完成了对$Name_A_1$的初步调查，正如您发现的一样，恩多迪亚人在这里与我们的舰队发生了一场惨烈的交锋，但我们成功赢得了这场战争的胜利。\n\n这场战争本可以避免，但是贪恋的委员们不甘心帝国的结局，他们的疯狂也被恩多迪亚帝国所预见，而恩多迪亚帝国也在$Name_Kuat_Fire_base$的蛊惑和他们对命定结果的不甘的推动下，这场冲突彻底爆发，最终演变为这种结果。\n\n这些恩多迪亚人收集了我们的小型舰船技术，这对我们现在来说是非常有用的，这也算他们死得其所了，不过似乎您还没找到。无论如何，现在我们该前往$Name_B_1$，我们已经确认了其星图坐标。"
 kuat_post_apocalyptic_legacy.5.a:0 "好的。"

 kuat_lagacy.251.kuat_post_apocalyptic_legacy.desc:"我们的研究人员一直都在对$Name_A_1$进行无间断地勘探，功夫不负有心人，我们成功找到了之前在山崖中找到的线索指向的隐秘研究设施所在地\n\n这座研究设施在环带的另一侧，该处也在当年的战争中被摧毁殆尽，如今我们需要重回这座环带，与之前的环带相似，这段环已经被我们炸成了一片废墟，整个环带上的人造设施没有一处是完好的。\n\n§Y但我们不能放过这里，我们必须重新对这篇区域进行无死角的搜查。§!"
 kuat_post_apocalyptic_kuat_eternal_starbase:"搜查$Name_A_1$"
 kuat_post_apocalyptic_kuat_eternal_starbase_DESC:"正如$Name_Kuat_Post_Support$所说，我们还没有找到恩多迪亚人藏在这片星区里的技术，他们在这里埋藏了相当完善的技术资料，只为恩多迪亚帝国的卷土重来。而他们研究的一切都是属于我们的，他们偷窃的$Name_kuat$技术也该还给我们了。\n\n调查这里，任何角落都不要放过！"

