  #################深渊裂缝####################
  astral_rift_infinite_rakata: "§E心灵监狱§!"
  kuat_relic_triumph_cooldown: "$relic_triumph_cooldown$\n\n获得舰船设计：$NAME_KUAT_LAGATOR$\n开启裂缝：$astral_rift_infinite_rakata$"

  kuat_infinite_rakata_rift.1.name:0 "§E心灵监狱§!"
  kuat_infinite_rakata_rift.1.desc:0 "心灵监狱是$Name_kuat$最高机密的禁忌项目，相传它能够囚禁任何智慧生命的思想与意志。它的真实面貌一直以来都是个谜，直到我们击败$Name_kuat$后，那枚全息仪引导我们寻觅至此，才让我们得以一探其中深藏的奥秘。\n\n[Leader.GetName]冒着生命危险乘坐飞船穿越了狂暴的维度风暴。须知，维度风暴是一种仅存在于高维裂隙中的恐怖现象，足以扭曲时空、吞噬万物；即便身处飞船护盾的庇护之下，[Leader.GetName]依然能感受到那股令人窒息的寒意。在风暴深处，[Leader.GetName]目睹了种种无法用言语形容的诡谲异象。\n\n历经重重磨难后，[Leader.GetName]终于抵达了维度裂隙的彼端。在那里，我们惊讶地发现一座被粗大锁链重重禁锢的巨大八面体正静静悬浮于虚空之中，散发着神秘而令人不寒而栗的危险气息。[Leader.GetName]立即对其展开勘测，发现其表面镌刻着繁复的符文与图腾，似乎属于某种失传已久的远古语言；但直觉告诉他——这就是传说中的心灵监狱。[Leader.GetName]随即尝试解读这些符文的含义，期盼能找到进入心灵监狱内部的方法。\n\n经过一番苦心孤诣的破译，[Leader.GetName]终于揭开了一个惊人的事实：心灵监狱本质上是一片纯精神维度的领域，其中封印着比$Name_kuat$还要古老得多的禁忌秘密。若要进入心灵监狱，就必须将自己的意识与心灵监狱的核心直接连接起来。这无疑是一场九死一生的豪赌，因为一旦意识沉入其中，便有可能永远迷失、无法返回现实；更何况心灵监狱内囚禁着未知的恐怖存在，谁也无法估量其中的凶险。\n\n如今，[Leader.GetName]面临着一个艰难的抉择：究竟是冒险进行精神接入，还是直接从外部破解并摧毁这座心灵监狱？无论作何选择，都可能带来难以预料的风险与代价。"
  kuat_infinite_rakata_rift.1.a:0 "精神接入"
  kuat_infinite_rakata_rift.2.name:0 "§E精神接入§!"
  kuat_infinite_rakata_rift.2.desc:0 "[Leader.GetName]冒着生命危险，将意识接入了$Name_kuat$的心灵监狱。我们尚不清楚这座远古造物的具体运作原理，但心灵监狱似乎拥有某种自我防卫意志，正本能地排斥着外来者的介入。\n\n果不其然，[Leader.GetName]刚一接入精神网络，便遭到了猛烈的精神反扑！心灵监狱试图反向控制并奴役[Leader.GetName]一行人，不断放大他们内心深处的恐惧与欲望，企图以此击溃并吞噬他们的意志。[Leader.GetName]一行人陷入了凶险万分的精神苦战，接连遭遇了无数逼真的幻象与心灵陷阱；心灵监狱正试图抹杀[Leader.GetName]，但它的防卫意志终究未能得逞——[Leader.GetName]凭借着坚不可摧的钢铁信念克服了重重险阻，最终成功突入了心灵监狱的核心领域，也就是所有被囚禁者灵魂的汇聚之地。\n\n在那里，他们目睹了一幕令人不寒而栗的凄惨景象：虚空中到处飘荡着被囚禁者扭曲破碎的意识与残魂，他们被剥夺了自由思考与感知的能力，只能在无尽的痛苦与绝望中永世徘徊。[Leader.GetName]震惊地发现，这些被囚禁的灵魂几乎已经与心灵监狱本身彻底融为了一体。"
  kuat_infinite_rakata_rift.2.a:0 "看住他们，一定要小心这些亡魂。"
  kuat_infinite_rakata_rift.21.name:0 "§E被封印的生灵§!"
  kuat_infinite_rakata_rift.21.desc:0 "尽管心灵监狱的内部精神空间浩瀚无垠，随行研究人员根本无力探明其全貌，但[Leader.GetName]凭借强大的精神意志顶住了黑暗力量的侵蚀，一举锁定了心灵监狱的中枢核心。\n\n在核心领域中，[Leader.GetName]迅速深入到了监狱最底层的禁忌监区——那里隐藏着一个惊人的远古秘密，一段被尘封了数万年的黑暗往事。正当众人一筹莫展之际，心灵监狱自身的防卫意志主动联系上了[Leader.GetName]，向我们吐露了实情，并恳求我们千万不要破坏这里的封印。\n\n原来，拉卡塔无限帝国最后的先知正被封印于此！拉卡塔人曾是这座心灵监狱最初的缔造者，因此心灵监狱的防卫意志对这位掌握着可怕黑暗原力、企图重返物质世界的拉卡塔先知充满了忌惮，尽管我们对他们的具体过往仍知之甚少。\n\n据心灵监狱的意志所述，这批拉卡塔遗民当年是被银河帝国的皇帝亲手镇压并关押于此的。根据先皇留下的最后一道敕令，这些拉卡塔人曾企图颠覆银河帝国的统治，其先知因此被打入心灵监狱最深处，永世不得超生。显而易见，后来的$Name_kuat$继承了这份遗产，并为了防止拉卡塔人东山再起威胁自身安全，又在原有基础上多次加固了心灵监狱的封印。\n\n然而即便历经万年镇压，[Leader.GetName]仍惊讶地察觉到，那位拉卡塔先知从未放弃过希望——他一直在黑暗中耐心地等待着一个破封而出的契机，妄图夺回昔日属于他们的一切。"
  kuat_infinite_rakata_rift.21.a:0 "谨慎处理。"
  kuat_infinite_rakata_rift.22.name:0 "§E古代遗存§!"
  kuat_infinite_rakata_rift.22.desc:0 "[Leader.GetName]仔细研判了当前的处境，决定谨慎尝试接触那位被囚禁的拉卡塔先知。然而就在研究人员着手准备建立精神连接之际，一股浩瀚的陌生精神力量突然侵入了研究人员的脑海；万幸的是，这股精神力量并无敌意，只是向我们传递了一段尘封于岁月深处的黑暗往事：\n\n§Y拉卡塔人是缔造无限帝国的主体物种，在数万年前曾是整个银河系唯一的霸主。他们残暴酷烈的统治令银河万族怨声载道，但仰仗着强大的黑暗原力，没有任何势力能够抗衡无限帝国；拉卡塔人更利用自己所掌控的原力科技，铸造了心灵监狱、恒星熔炉等诸多奇迹造物。\n\n直到夸人的出现改变了一切。夸人曾是受拉卡塔人启蒙的原生种族，却在启蒙之后沦为了拉卡塔人的奴隶。后来，夸人的后裔利用无限帝国统治体系的腐朽漏洞，暗中释放出了一种致命的基因病毒——没人知道这种病毒究竟从何而来，但它令拉卡塔人迅速丧失了对原力的感应能力，甚至成批死去，无限帝国的高压统治在瘟疫的冲击下顿时摇摇欲坠。正是在这一历史关头，备受奴役的各附庸种族纷纷揭竿而起，无限帝国在顷刻间四分五裂，整片银河彻底陷入动荡与战火之中。\n\n无限帝国本该就此彻底覆灭，但拉卡塔人并不甘心退出历史舞台。他们疯狂地献祭了所有受控星球上的亿万生灵，以此铸造出了‘双子座’与‘$Name_Eternal_Aries_Support$’两大永恒智能；最终，由双子座和$Name_Eternal_Aries_Support$统御的永恒舰队以铁血手段镇压了一切反抗浪潮，助无限帝国重新夺回了昔日的疆土。\n\n然而天命难违，无限帝国的覆灭早已注定——他们亲手创造出的这尊更为恐怖的钢铁怪物最终反噬了造物主，并在日后沦为了历代黑暗尊主的战争机器；而拉卡塔人最后的先知，则被永远囚禁在了这座心灵监牢之中。\n\n这段秘辛令[Leader.GetName]等人震惊不已，或许我们应当重新权衡是否要释放这位最后的拉卡塔先知。与此同时，心灵监狱自身的意志也向我们发出了呼唤，希望我们能够助祂一臂之力，继续镇压蠢蠢欲动的拉卡塔先知。"
  kuat_infinite_rakata_rift.22.a:0 "加固封印"
  kuat_infinite_rakata_rift.22.b:0 "解开封印"
  kuat_infinite_rakata_rift.23.name:0 "§E加固封印§!"
  kuat_infinite_rakata_rift.23.desc:0 "显而易见，面对当前波谲云诡的银河局势，我们绝不能放任任何潜在的威胁——来自远古时代的黑暗力量仍潜藏在迷雾深处，局势危如累卵，容不得半点闪失。我们必须立即加固封印，让这些属于旧时代的亡魂彻底湮灭在时间长河之中。\n\n[Leader.GetName]缓步走到心灵监狱核心的控制台前，伸手接入管理系统，全力协助心灵监狱的意志镇压拉卡塔先知。就在[Leader.GetName]接入系统的瞬间，整片心灵监狱空间发生了剧烈的震荡！虚空天穹之上骤然亮起紫色与金色的耀眼光芒，两股浩瀚的意志展开了惨烈的交锋；碰撞产生的冲击波令整片精神空间震颤不已，无数被监狱吞噬禁锢的残魂发出凄厉刺耳的哀嚎，仿佛深渊中的恶鬼正纷纷苏醒。\n\n当恐怖的能量余波在精神空间内肆虐良久之后，金色的光芒逐渐黯淡下来，拉卡塔先知的力量正不可遏制地迎来复苏。历经万年岁月的侵蚀，心灵监狱自身的意志早已如风烛残年，再也无力压制先知的破封；就在金色光芒即将彻底熄灭之际，[Leader.GetName]的身影被一股汹涌的紫色光芒瞬间吞没，剧烈的空间震荡随后才渐渐平息。此时心灵监狱的维度空间已开始走向崩塌，而[Leader.GetName]则因精神遭受重创而陷入昏迷，所幸随行研究团队及时架起伤员撤出了濒临崩溃的心灵监狱。"
  kuat_infinite_rakata_rift.23.a:0 "或许，拉卡塔先知的苏醒是必然的。"
  kuat_infinite_rakata_rift.3.name:0 "§E解开封印§!"
  kuat_infinite_rakata_rift.3.desc:0 "显而易见，我们应当释放这位被镇压的拉卡塔先知，从而自祂口中套取出所有尘封于远古时代的终极秘密。\n\n[Leader.GetName]缓步走到心灵监狱核心的控制台前，伸手接入管理系统，开始解除先知的封印。就在封印松动的瞬间，心灵监狱自身的防卫意志骤然迸发出强大的精神力量！整片监狱空间随之剧烈颤抖，无数被吞噬奴役的残魂在虚空中凄厉尖啸，这宛如无间地狱般的骇人景象令[Leader.GetName]一行人心惊胆战。在虚空天穹之上，代表监狱意志的金色光芒死死压制着自核心涌出的紫色光芒，两股庞大的力量激烈碰撞，狂暴的余波令整片精神空间震颤不已，连虚空本身都仿佛正在被寸寸撕裂。\n\n当恐怖的能量余波在精神空间内肆虐良久之后，金色的光芒逐渐黯淡下来，拉卡塔先知的力量正不可遏制地迎来复苏。历经万年岁月的侵蚀，心灵监狱自身的意志早已如风烛残年，再也无力压制先知的破封；就在金色光芒即将彻底熄灭之际，[Leader.GetName]的身影被一股汹涌的紫色光芒瞬间吞没，剧烈的空间震荡随后才渐渐平息。此时心灵监狱的维度空间已开始走向崩塌，而[Leader.GetName]则因精神遭受重创而陷入昏迷，所幸随行研究团队及时架起伤员撤出了濒临崩溃的心灵监狱。"
  kuat_infinite_rakata_rift.3.a:0 "§G或许，拉卡塔先知的苏醒是必然的。§!"
  kuat_infinite_rakata_rift.3.b:0 "§Y或许，拉卡塔先知的苏醒是必然的。§!"
  kuat_infinite_rakata_rift.3.c:0 "§R或许，拉卡塔先知的苏醒是必然的。§!"
