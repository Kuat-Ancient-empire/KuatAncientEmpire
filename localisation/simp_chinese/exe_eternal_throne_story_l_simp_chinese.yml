  kuat_galatic_empire_ge_invasion_portal_desc: "跳跃星门是$Name_kuat$基于对永恒舰队同位素-5元素的研究而开发出的一种特殊超空间航行巨构，他们可以借助跳跃星门跨星域迅速投送并部署庞大的军事力量。"
