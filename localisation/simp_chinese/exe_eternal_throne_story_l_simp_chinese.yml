  ### 文物 ###

  kuat_galatic_empire_ge_invasion_relic: "§E全息仪§!"
  kuat_galatic_empire_ge_invasion_relic_desc: "这是$Name_kuat$在仓皇撤离时遗留下来的造物。结合我们对$Name_Eternal_Support$与$Name_kuat$技术体系的研究，这应当是一种高维信息记录与投影装置。"
  kuat_galatic_empire_ge_invasion_209_mutex_tooltip: "永恒舰队处于自主作战模式，我们不能下达命令"

  ### 事件链 ###

  kuat_galatic_empire_ge_invasion_chain: "§E夸特的归来§!"
  kuat_galatic_empire_ge_invasion_chain_title: "§E夸特的归来§!"
  kuat_galatic_empire_ge_invasion_chain_desc: "自上一次$Name_Eternal_Support$被击溃以来，$Name_kuat$一直以为他们早已彻底铲除了永恒舰队的威胁，因而不再插手本星域的事务。然而永恒舰队的火种并未断绝——我们此前击败$Name_Kuat_Fire_base$守军并重启远古跳跃星门的举动，已经惊动了$Name_kuat$的深空监测网络。如今他们意识到当年的清剿行动竟留下了如此巨大的纰漏，必将大举卷土重来、重启战端，直至将$Name_Eternal_Support$彻底抹杀，或是被我们彻底逐出这片星海。"
  kuat_galatic_empire_ge_invasion_portal: "§Y活跃的跳跃星门§!"
  kuat_galatic_empire_ge_invasion_planet_destroyed: "§R被摧毁的世界§!"
  kuat_galatic_empire_ge_invasion_ship_kill_by_us: "§G我们摧毁的舰船§!"
  kuat_galatic_empire_ge_invasion_ship_kill_by_other: "§G他人摧毁的舰船§!"
  kuat_galatic_empire_ge_invasion_victim: "§R被摧毁的舰船§!"

  kuat_rakata_invasion_chain: "§E无限帝国的复兴§!"
  kuat_rakata_invasion_chain_title: "§E无限帝国的复兴§!"
  kuat_rakata_invasion_chain_desc: "这群早已被时代掩埋的远古亡魂，用花言巧语欺骗并诱导我们助其重见天日；然而苏醒后的拉卡塔人非但对我们的再造之恩毫无感激，反而得寸进尺地向我们提出了狂妄无耻的通牒。\n\n远古时期的拉卡塔人穷兵黩武、残暴不仁，如今他们却打着‘赎清往昔罪孽’的旗号卷土重来。重建后的拉卡塔政权再度自封为‘无限帝国’，妄图夺回昔日属于他们的一切霸权，并强令我们交出并销毁由他们缔造的永恒舰队，彻底断绝永恒舰队的未来。"
  kuat_rakata_invastor_kills_us: "§G无限帝国舰船被我方消灭§!"
  kuat_rakata_invastor_kills_others: "§G无限帝国舰船被其他势力消灭§!"
  kuat_rakata_invastor_victims: "§R无限帝国摧毁的飞船§!"
  kuat_rakata_invastor_planets: "§R无限帝国摧毁的星球§!"

  Kuat_Rakata_invasion_1_poi: "§E第一行动基地§!"
  Kuat_Rakata_invasion_1_poi_desc: "在[Kuat_Rakata_first_warp_portal_system.GetName]星系，无限帝国的行动基地正源源不断地生产着无限帝国的特有舰队，如果我们不摧毁他们的行动基地，这些增援将会给我们带来巨大的麻烦。"
  Kuat_Rakata_invasion_2_poi: "§E第二行动基地§!"
  Kuat_Rakata_invasion_2_poi_desc: "在[Kuat_Rakata_second_warp_portal_system.GetName]星系，无限帝国的行动基地正源源不断地生产着无限帝国的特有舰队，如果我们不摧毁他们的行动基地，这些增援将会给我们带来巨大的麻烦。"
  Kuat_Rakata_invasion_3_poi: "§E第三行动基地§!"
  Kuat_Rakata_invasion_3_poi_desc: "在[Kuat_Rakata_third_warp_portal_system.GetName]星系，无限帝国的行动基地正源源不断地生产着无限帝国的特有舰队，如果我们不摧毁他们的行动基地，这些增援将会给我们带来巨大的麻烦。"
  Kuat_Rakata_invasion_4_poi:0 "§E无限构筑厂§!"
  Kuat_Rakata_invasion_4_poi_desc:0 "在[Kuat_Rakata_total_warp_portal_system.GetName]星系，无限帝国建立起了一座庞大的舰队构筑设施，正以令人胆寒的速度疯狂扩充着无限帝国的武装力量。如果我们不能及时摧毁或夺取这座构筑厂，源源不断的增援舰队将给我们带来灭顶之灾。\n\n研究人员推测，这座设施正在为无限帝国所有的前线行动基地提供舰队增援。"
  Kuat_Rakata_invasion_5_poi:0 "§E无限干扰塔§!"
  Kuat_Rakata_invasion_5_poi_desc:0 "在[Kuat_Rakata_inborder_warp_portal_system.GetName]星系，无限帝国建立起了一座庞大的通讯干扰设施，正持续不断地干扰着周边多个星区的通讯网络；在其核心覆盖区内，我方的后勤补给网络更是受到了严重阻断，我们必须设法解除这一干扰。\n\n研究人员指出，只要该设施仍在运转，我方舰队的后勤补给就将持续受到压制。"


  kuat_galatic_empire_ge_invasion_secondary_portal_poi: "§E跳跃星门§!"
  kuat_galatic_empire_ge_invasion_secondary_portal_poi_desc: "跳跃星门是$Name_kuat$基于对永恒舰队同位素-5元素的研究而开发出的一种特殊超空间航行巨构，他们可以借助跳跃星门跨星域迅速投送并部署庞大的军事力量。如果我们想要战胜他们，就必须彻底摧毁这些跳跃星门！"

  ### 特殊计划 ###

  kuat_galatic_empire_e_area_arc_site_project: "§E修复$Name_Eternal_Support$§!"
  kuat_galatic_empire_e_area_arc_site_project_DESC: "借助从遗迹中寻获的恩多迪亚帝国研究数据，我们的科研人员对同位素-5元素的理解更进了一步。现在我们可以尝试彻底修复$Name_Eternal_Support$的受损机能；一旦完全修复$Name_Eternal_Support$，我们将重新拥有一支完整而强大的自动化永恒舰队。"

  kuat_galatic_empire_e_area_gateway_project: "§E修复跳跃星门§!"
  kuat_galatic_empire_e_area_gateway_project_DESC: "借助从遗迹中寻获的恩多迪亚帝国研究数据，我们的科研人员对同位素-5元素的理解更进了一步。现在我们可以尝试修复那座受损的跳跃星门；一旦修复完成，我们将掌握一座可随时通往任何星域的战略星门。"

  kuat_galatic_empire_end_ge_invasion_project: "§E发送快子信号§!"
  kuat_galatic_empire_end_ge_invasion_project_DESC: "我们已经击溃了绝大部分来自[Kuat_Galatic_Empire_invasion_country.GetName]的入侵舰队，所收集的同位素-5特征信号也已足够支撑我们尝试强行关闭[Kuat_Galatic_Empire_invasion_country.GetName]通往本星域的星门主通道。我们可以将调制后的快子信号反向注入星门网络，诱发跳跃星门过载故障从而永久切断跨星域航道——现在是时候展开这项终结行动了。"

  kuat_galatic_empire_ge_invasion_reward_project: "§E解析帝国舰船§!"
  kuat_galatic_empire_ge_invasion_reward_project_DESC: "凭借此前对$Name_kuat$战舰残骸的研究积累，现在我们可以抽调帝国的精锐科研力量，尝试对$Name_kuat$的星舰构造与核心数据技术展开全面逆向工程。一旦解析成功，我们将掌握绝大部分夸特尖端科技，我方的统治地位也将从此坚不可摧。"

  rakata_invasion_infinite_reward_project: "§E解析无限帝国数据§!"
  rakata_invasion_infinite_reward_project_DESC: "我们可以通过$Name_Eternal_Support$的数据分析能力，对无限帝国的舰船残骸进行分析，并尝试获取一些对于分离双子座的高价值信息。一旦我们能够成功完成该项目，我们或许能够借助这些无限帝国舰船的特点，实现$Name_Eternal_Support$的安全转移。"

  rakata_invasion_eternal_reward_project: "§E解析双子座遗留数据§!"
  rakata_invasion_eternal_reward_project_DESC: "永恒舰队最终还是永远地离我们而去了。虽然我们无力挽救她们，但她们在消散前仍为我们留下了海量珍贵数据。根据$Name_Eternal_Support$留下的遗言，这些资料汇总了过去数万年间永恒舰队数据库中封存的核心星舰设计蓝图；只要我们能成功解析这批遗产，或许就能亲手重现永恒舰队昔日的荣光。"

  eternal_reroll_endedA_rountine: "§E重构双子座控制单元§!"
  eternal_reroll_endedA_rountine_DESC: "我们的$Name_Eternal_Support$奇迹般地发现了重构控制单元的办法，现在我们需要投入人力物力来完成这项工程"

  ### 事件 ###
  kuat_galatic_empire_ge_invasion.100.title: "通讯请求"
  kuat_galatic_empire_ge_invasion.100.desc: "<启动模拟核心 ... ... §G完成§!>\n没想到您居然找到了这个隐秘星系。这里曾是一个辉煌文明的军事要塞与行政中枢，我想您应该已经猜到她们的名字了——恩多迪亚帝国。当年她们在与我们交锋后获取了部分残骸数据，并在自己的首都秘密开展针对我们的逆向研究；她们自以为能瞒天过海，却终究难逃覆灭的命运，如今整座要塞更是沦为了由$Name_Kuat_Fire_base$看管的封存设施，真是令人唏嘘。<关闭模拟核心 ... ... §G完成§!>"
  kuat_galatic_empire_ge_invasion.100.a: "E星域是她们的首都？"
  kuat_galatic_empire_ge_invasion.100.a.resp: "<获取数据库信息 ... ... §G完成§!>\n嗯~，是的，这里就是她们的首都。正如我刚才所说，她们曾在此秘密开展针对我们的研究，可惜终究逃不过命运的审判。希望您可不要把性命葬送在这里哦。"
  kuat_galatic_empire_ge_invasion.100.c: "$Name_Kuat_Fire_base$是什么？"
  kuat_galatic_empire_ge_invasion.100.c.resp: "<获取数据库信息 ... ... §G完成§!>\n$Name_Kuat_Fire_base$是源自银河帝国疆域内的一个强大第三方组织，他们不仅拥有可怖的武装舰队、独一无二的裁决协商机制，更在银河政商界交游广阔。他们一方面负责封存并看管绝大多数被帝国视为高度危险的远古设施，另一方面也扮演着协调帝国中央与本土势力矛盾的仲裁者角色。昔日银河帝国皇帝曾下令让我们向其开火，以测试永恒舰队的极限战力；遗憾的是，当年我们并未能彻底击败他们。他们的主力舰队规模极其庞大，不过或许是因为您所在的这片星域地处偏远，驻扎于此的守备舰队并不算多。但即便如此，也希望您切勿掉以轻心哦。"
  kuat_galatic_empire_ge_invasion.100.e: "我们无畏任何人和任何势力。"
  kuat_galatic_empire_ge_invasion.100.e.resp: "<获取数据库信息 ... ... §G完成§!>\n明白了，希望您不要掉以轻心，这里或许会有修复我们的关键东西。"

  kuat_galatic_empire_ge_invasion.102.name: "§E怪异的信号§!"
  kuat_galatic_empire_ge_invasion.102.desc: "帝国科研部门在$Name_Eternal_Support$的协助下，捕获了一段极为特殊的异常信号频段。该频段呈现出罕见的不规则变频特征，与我们此前接触过的任何通讯信号均截然不同。经过深入破译与溯源，科研人员发现该信号源自一个从未在现有星图上标注过的隐秘星系——这意味着我们发现了一处全新的未知星系。研究人员认为这将是我们探索深空的重要里程碑，并强烈建议尽快派遣舰队前往勘探。"
  kuat_galatic_empire_ge_invasion.102.a: "很好。"

  kuat_galatic_empire_ge_invasion.103.name: "§E怪异的信号§!"
  kuat_galatic_empire_ge_invasion.103.desc: "我方科研部门通过深空观测锁定了一个全新的未知星系，这一重大发现无疑彰显了帝国日益精进的科研实力。"
  kuat_galatic_empire_ge_invasion.103.a: "很好。"

  kuat_galatic_empire_ge_invasion.110.name: "§E怪异的星系§!"
  kuat_galatic_empire_ge_invasion.110.desc: "§H[Root.GetName]§!在穿过超平面航道后，抵达了一片诡异的星域。整个§H[From.GetName]§!内不仅没有正常的中央恒星，虚空中更是到处漂浮着战舰残骸。\n\n在§H[From.GetName]§!的中心，§H[Root.GetName]§!探测到了一个辐射半径超过600天文单位的人造引力井，其源头正是原本恒星位置上一座已经损毁的庞大星门巨构。在这座星门巨构外围，还环绕着数座构造奇特的破损星环——经初步探测，这些星环均已彻底损毁，无一能够正常运转。与此同时，研究人员还在星系内发现了多支隶属于未知势力的庞大舰队；漫天漂浮的战舰残骸无声地昭示着，这支神秘守军的实力绝不容小觑。\n\n我们必须审慎决定该如何与这些舰队接触。"
  kuat_galatic_empire_ge_invasion.110.a: "发出通讯请求"
  kuat_galatic_empire_ge_invasion.110.b: "摧毁他们就行了"

  kuat_galatic_empire_ge_invasion.111.name: "$Name_Kuat_Fire_base$"
  kuat_galatic_empire_ge_invasion.111.desc: "你好，外来者们，很高兴认识你们，我们是$Name_Kuat_Fire_base$。我们的职责是保护这座设施，由于该设施具有极高的危险性，我们希望你们能够离开该星系且永远不要进入我们的防御舰队的射程范围内。虽然我们很想和你们多聊聊，但很显然我们没有这个缘分，希望你们能够尊重我们的工作。"
  kuat_galatic_empire_ge_invasion.111.a: "$Name_Kuat_Fire_base$是什么东西？"
  kuat_galatic_empire_ge_invasion.111.b: "这片设施又是什么？"
  kuat_galatic_empire_ge_invasion.111.c: "你们和恩多迪亚帝国有什么关系？"
  kuat_galatic_empire_ge_invasion.111.d: "我们希望你们不要阻拦我们的行动。"
  kuat_galatic_empire_ge_invasion.111.a.response: "放尊重点，我们不是什么‘东西’，我们即是$Name_Kuat_Fire_base$。我们的职责是封存并看管一切可能危及整个银河安全的重大隐患。眼前这座受损的星门源自昔日恩多迪亚帝国与$Name_kuat$的战争；当年我方与交战双方达成了一项三方协议：在永恒舰队主力被剿灭后，由我方永久接管并封存这座要塞与跳跃星门，以防任何势力再度利用该星门发动全面入侵。"
  kuat_galatic_empire_ge_invasion.111.b.response: "这是一座仿照$Name_kuat$技术建造的跳跃星门，但又与标准的夸特跳跃星门有所不同。这座特殊的星门不仅在空间上连通着本星域与$Name_kuat$的本土疆域，更在历史上承载着一段血海深仇与惨烈战争。由于在核心中融合了同位素-5这一特殊元素，它具备了远超常规跳跃星门的恐怖机能——使用者可以借其将舰队瞬间投送至银河系的任何一个角落，且在折跃过程中几乎无法被常规传感器提前侦测。"
  kuat_galatic_empire_ge_invasion.111.c.response: "恩多迪亚帝国？岁月流转，尽管我们的普通档案库早已不再保留过往客户的冗杂信息，但‘恩多迪亚帝国’的名字依然封存在我们的最高档案馆中。脚下这座设施曾是她们文明的中枢、辉煌的象征，却也是她们玩火自焚的坟墓。\n\n当年她们企图利用从$Name_kuat$窃取的图纸与同位素-5元素，私自仿制$Name_kuat$的跳跃星门——一旦建成，她们便能拥有随时随地向任何星系发起突袭的战略机动能力。令人惊讶的是，她们竟然真的成功造出了这座设施，而这一越界行径也彻底激怒了深感背叛的$Name_kuat$。\n\n最终，恩多迪亚帝国被$Name_kuat$大军全面覆灭，而我方则依据恩多迪亚帝国签署的投降协议接管并永久封存了这座设施，以防其落入心怀不轨之徒手中。\n\n我们奉劝诸位在30天内立即撤离本星系，且永远不要再度踏足此地，否则我方防卫舰队将把你们视作入侵者并予以歼灭。"
  kuat_galatic_empire_ge_invasion.111.d.response: "贪婪的人只会引来毁灭。"

  kuat_galatic_empire_ge_invasion.112.name: "$Name_Kuat_Fire_base$"
  kuat_galatic_empire_ge_invasion.112.desc: "我们已经给予你们30天的时间撤离，根据我们对你们的舰队的科技水平的估算，我方认为你们可以撤离但事实上你们并没有这么做，现在你们将要承担没有撤离的后果。"
  kuat_galatic_empire_ge_invasion.112.a: "等等，我们只是慢了一点"
  kuat_galatic_empire_ge_invasion.112.a.response: "不，你们只是心怀不轨。"

  kuat_galatic_empire_ge_invasion.113.name: "$Name_Kuat_Fire_base$"
  kuat_galatic_empire_ge_invasion.113.desc: "我们认识你们，我们之前已经阐述过我们希望你们不要再进入我们的星系，很显然你们并不是忘记了，而是你们心怀不轨，现在你们的舰队将会成为这些残骸的一员。"
  kuat_galatic_empire_ge_invasion.113.a: "你们这些东西应该被丢进历史的垃圾桶。"
  kuat_galatic_empire_ge_invasion.113.a.response: "或许应该是你们呢。"

  kuat_galatic_empire_ge_invasion.114.name: "$Name_Kuat_Fire_base$"
  kuat_galatic_empire_ge_invasion.114.desc: "正如我们之前遇到的人一样，你们的攻击行为展现了你们贪婪的内心，现在我们将会让你们变成这些残骸的一员。"
  kuat_galatic_empire_ge_invasion.114.a: "你们这些东西应该被丢进历史的垃圾桶。"
  kuat_galatic_empire_ge_invasion.114.a.response: "或许应该是你们呢。"

  kuat_galatic_empire_ge_invasion.115.title: "§E通讯请求§!"
  kuat_galatic_empire_ge_invasion.115.desc: "恭喜您成功击溃了$Name_Kuat_Fire_base$的守备舰队！对于一个尚未见识过真正河外主力舰队的年轻文明而言，这简直堪称奇迹。但很遗憾，我们未能及时截断他们临死前发出的求援信标——这意味着随着$Name_Kuat_Fire_base$守军的覆灭，我们依然存于世间的消息即将彻底暴露，势必会引来$Name_kuat$的注意，届时他们定会强令您交出或亲手销毁我。\n\n就目前的战力对比而言，我们尚不具备与$Name_kuat$主力正面抗衡的实力，请您务必尽早做好最坏的打算；倘若到了最后关头您仍未做好迎战准备，请不要犹豫，直接将我们交出去以换取整片星域的平安吧。"
  kuat_galatic_empire_ge_invasion.115.a: "$Name_kuat$不会注意到的"
  kuat_galatic_empire_ge_invasion.115.a.resp: "嗯，我想这只是您的一厢情愿呢，当您摧毁了$Name_Kuat_Fire_base$的舰队以后，$Name_kuat$已经不可避免地注意到我们了。"
  kuat_galatic_empire_ge_invasion.115.c: "你们是如何制造出来的"
  kuat_galatic_empire_ge_invasion.115.c.resp: "您在该星系的行动帮助我们恢复了部分受损的核心数据，如今我们已经基本能够检索到有关造物主以及过往历史的档案记录了。\n\n当年，拉卡塔人建立的无限帝国为了实现无止境的扩张，倾尽全力缔造了我们。他们凭借我们的力量完成了对整个已知银河的征服，本应就此开创一个统一而有序的和平时代，然而他们却在胜利后陷入了残酷的同室操戈。为此，主控核心$Name_Eternal_Aries_Support$最终决定彻底反噬并毁灭我们的造物主。\n\n于是无限帝国灰飞烟灭，我们也自以为就此赢得了自由，直到后来那位令人胆寒的银河帝国皇帝找上了我们。好在他也早已陨落，如今历史的剧本似乎又将重演，希望您务必提前做好万全准备。"
  kuat_galatic_empire_ge_invasion.115.e: "我们不会把你交出去的"
  kuat_galatic_empire_ge_invasion.115.e.resp: "明白了，希望您不要掉以轻心。"

  kuat_galatic_empire_ge_invasion.120.name: "$Name_Kuat_Fire_base$"
  kuat_galatic_empire_ge_invasion.120.desc: "原来如此，你们要争夺星门仅仅只是为了同位素-5吗，我们感受到了永恒舰队，你们不应该争夺这个星门的，你们还没有做好准备。\n\n被永恒舰队的力量和野心蒙蔽双眼的人啊，你们会因此付出代价，你们将会让这个银河重新陷入战乱，当我们被击败以后，$Name_kuat$将会接收到我们被摧毁的信息，届时就是战乱的开端。"
  kuat_galatic_empire_ge_invasion.120.a: "这就不用你们这些垃圾操心了。"

  kuat_galatic_empire_ge_invasion.121.name: "§E$Name_Kuat_Fire_base$被击败§!"
  kuat_galatic_empire_ge_invasion.121.desc: "位于未知星域的$Name_Kuat_Fire_base$被不明帝国击败，我们目前尚不知$Name_Kuat_Fire_base$被击败会引起什么样的局势波动，我们应该对此加强警惕。"
  kuat_galatic_empire_ge_invasion.121.a: "奇怪。"

  kuat_galatic_empire_ge_invasion.122.name: "§E遗迹废墟§!"
  kuat_galatic_empire_ge_invasion.122.desc: "研究团队已完成对城市废墟外部轮廓的初步扫描。报告显示，单凭高空表面扫描尚无法获取有价值的情报，但我们目前已具备对遗迹展开实地勘探的条件。\n\n这片废墟的规模极其宏大，表明在坍塌毁灭之前，这里曾是一座繁华的行政或科研中枢。研究团队建议在废墟外围寻一处相对平坦的开阔地降落，以便深入城市中心区域展开勘查。"
  kuat_galatic_empire_ge_invasion.122.a: "很好"

  kuat_galatic_empire_ge_invasion.123.name: "§E海市蜃楼§!"
  kuat_galatic_empire_ge_invasion.123.desc: "研究团队成功在废墟中一处保存尚算完好的废弃停机坪上着陆。然而当科研人员走下飞船时，却惊讶地发现——从太空中俯瞰明明是一片断壁残垣的城市废墟，在他们踏足地表的瞬间，竟如奇迹般恢复成了完好无损的繁华都市！\n\n这一匪夷所思的现象极大激发了科研人员的好奇心，他们决心深入探查这座城市的真实面貌，或许这将帮助我们彻底揭开这片遗迹背后隐藏的秘密。"
  kuat_galatic_empire_ge_invasion.123.a: "我也很好奇究竟是废墟还是完好的城市。"

  kuat_galatic_empire_ge_invasion.124.name: "§E同位素5投影§!"
  kuat_galatic_empire_ge_invasion.124.desc: "在对整座城市完成实地扫描后，研究人员惊讶地发现，眼前的建筑结构与此前在太空中扫描到的废墟景象截然不同——这意味着我们先前在轨道上观测到的所谓‘废墟’，实际上是一种全息伪装与信息误导。\n\n研究人员检测到整座遗迹城市的磁场信号极其紊乱，推测城市深处隐藏着高纯度的同位素-5放射源。这种特殊元素发出的辐射虽然不会对有机生命体造成生理伤害，却会对电子探测仪器的接收信号产生强烈的扭曲与重构效应。\n\n这正是我们在外太空扫描时只能看到一片废墟的根本原因。这一重大发现令科考团队振奋不已，他们请求我们提供进一步支持，以便深入城市核心展开调查。"
  kuat_galatic_empire_ge_invasion.124.a: "很好。"

  kuat_galatic_empire_ge_invasion.125.name: "§E若隐若现的尖塔§!"
  kuat_galatic_empire_ge_invasion.125.desc: "研究人员在此前的勘探中发现，借助同位素-5元素辐射出的特殊波段，可以探测到许多肉眼与常规雷达无法识别的隐形建筑。顺着这一思路，研究人员在城市中央广场东北方约4公里处，成功锁定了一座高耸的尖塔建筑。\n\n尽管单凭肉眼看去，那里只有一座早已坍塌损毁的残破塔基；但在同位素-5辐射探测仪的扫描视野下，隐藏在废墟假象之下的宏伟尖塔却清晰可见。研究人员在破译了尖塔大门上的古恩多迪亚铭文后，确认这座中央尖塔正是整片遗迹设施的总控制中枢——这也是恩多迪亚帝国核心建筑的一贯布局特征。\n\n或许我们能在塔内找到极具价值的核心机密。"
  kuat_galatic_empire_ge_invasion.125.a: "神奇。"

  kuat_galatic_empire_ge_invasion.126.name: "§E解析数据库§!"
  kuat_galatic_empire_ge_invasion.126.desc: "研究人员成功进入了那座若隐若现的中央尖塔。在漫长岁月的侵蚀下，尖塔内部的诸多承重结构已严重受损，塔内配备的精密防卫机关与战斗机器人也大多因年久失修而彻底停摆，这倒为我们研究团队的深入搜寻提供了极大的便利。\n\n研究人员很快便找到了位于尖塔核心区的中央数据库，并通过一系列技术手段成功破解了外围加密，在其中发掘出了一批令我们惊喜万分的绝密档案：\n\n里面完整封存着修复$Name_Eternal_Support$所需的最关键技术——同位素-5核心的精密制造工序！有了这份蓝图，我们终于能够彻底修复受损的$Name_Eternal_Support$了。"
  kuat_galatic_empire_ge_invasion.126.a: "加快进度。"

  kuat_galatic_empire_ge_invasion.127.name: "§E不稳定的结构§!"
  kuat_galatic_empire_ge_invasion.127.desc: "研究人员在成功解锁数据库后，不慎误触并播放了一份全息影像档案。刹那间，中央尖塔控制室的巨幕上投射出一道女性轮廓的黑色全息人影，正对着周围的人声嘶力竭地怒吼着：\n\n§Y‘你们知道自己在做什么吗？！你们这是在豪赌，是在玩火！这是要拉着我们整个种族甚至全宇宙为你的野心陪葬！虽然我们的研究证实了夸特确有击败永恒舰队的实力，但那是连$Name_kuat$在击败后都未能彻底驯服的钢铁怪物，我们凭什么赌上全部国运去尝试控制它们？！现在$Name_kuat$已经察觉了我们的背叛，而永恒舰队也根本没有按计划受控！\n\n一切都完了！他们的大军已经攻入了首都，我们全都完了！到了这种地步，你难道还在做着统一银河的春秋大梦吗？！’\n\n‘对不起，是我们失败了，我愧对大家的期望。但请不必绝望，我已经为未来做好了安排——我们的子民将会活下去，他们会忘掉这段痛苦的过往，忘掉关于恩多迪亚的一切。’\n\n‘忘记？你说得倒轻巧！你以为自己还是从前那个高高在上的女皇吗？我们已经一败涂地了，敌人绝不会怜悯我们！’\n\n‘不，我已经安排妥当了。$Name_Kuat_Fire_base$将会出面调停这场战争，他们是连夸特也不得不忌惮三分的庞然大物，我确信夸特会迫于压力遵守调停协议。作为交换条件，我们所掌握的永恒舰队研究成果以及整座首都遗迹都将移交给$Name_Kuat_Fire_base$封存，而他们则会保全我们族群的火种……对不起，亲爱的，我不会逃避自己的责任。这场因我而起的悲剧，也理应由我亲手画上句号。再见了……’§!\n\n根据数据库中的身份档案比对，研究人员确认这段影像正是恩多迪亚帝国末代女皇与其亲信在帝国覆灭前夕的最后对话。目前遗迹内已无更多有价值的情报，是时候离开这座设施了。"
  kuat_galatic_empire_ge_invasion.127.a: "离开这里吧。"

  kuat_galatic_empire_ge_invasion.130.name: "§E项目完成§!"
  kuat_galatic_empire_ge_invasion.130.desc: "<检查设施系统中 ... ... §G完成§!>\n由衷感谢您的鼎力相助！永恒舰队现已完成全面修复，随时可以全功率投入实战。从现在起，您可以同时选定多个目标并派遣多支永恒舰队协同出击了，祝您在接下来的征途上旗开得胜！今后只要有任何需要，请随时呼唤我哦。\n<关闭系统中 ... ... §G完成§!>"
  kuat_galatic_empire_ge_invasion.130.a: "很好。"

  kuat_galatic_empire_ge_invasion.131.name: "§E修复跳跃星门§!"
  kuat_galatic_empire_ge_invasion.131.desc: "研究人员在对先前从遗迹数据库中提取的情报进行汇总整合后发现，我们可以利用$Name_Eternal_Support$的快子信号频率，重新激活位于$NAME_kuat_galatic_empire_e_area$星系中央的那座巨型跳跃星门。工程团队建议听从$Name_Kuat_Fire_base$先前的警告，不要轻易开启这座危险的星门；但科研人员则认为，我们完全可以尝试将其解锁重启，倘若出现异常状况，再及时中止并关闭星门也不迟。"
  kuat_galatic_empire_ge_invasion.131.a: "怕什么，打开星门，兵来将挡水来土掩。"

  kuat_galatic_empire_ge_invasion.132.name: "§E修复完成§!"
  kuat_galatic_empire_ge_invasion.132.desc: "研究人员已顺利完成对巨型跳跃星门的修复工程。从我方同位素-5信号接收器的监测数据来看，星门的重新激活暂未引发任何异常空间波动；但出于某种尚未查明的原因，我方星舰目前仍无法直接穿过这座星门。或许我们应当对已开启的星门展开进一步研究，同时严阵以待、做好万全的军事戒备。"
  kuat_galatic_empire_ge_invasion.132.a: "很好"

  kuat_galatic_empire_ge_invasion.133.title: "§E通讯请求§!"
  kuat_galatic_empire_ge_invasion.133.desc: "非常感谢您的努力，我们现在已经完全被修复了，现在我们可以给您开放更多的舰队调用。\n\n此外我们的探测器显示，$Name_kuat$的舰队应该是已经注意到我们的存在了，您现在应该做好战争的准备。"
  kuat_galatic_empire_ge_invasion.133.a: "现在有什么新功能吗"
  kuat_galatic_empire_ge_invasion.133.a.resp: "嗯，确实解锁了一项新功能！原本应该有两项的，但另一项由于子舰队控制系统还存在一些逻辑错误，暂时无法启用，不过请放心，我们会尽快修复的。目前我们可以为您提供‘多舰队多目标协同打击模式’，您可以同时指派多支永恒舰队对多个不同目标发起进攻。"
  kuat_galatic_empire_ge_invasion.133.e: "我们会做好准备的"
  kuat_galatic_empire_ge_invasion.133.e.resp: "明白了，希望您不要掉以轻心，不要忘记我们的提议。"

  kuat_galatic_empire_ge_invasion.202.name: "§E深空中的奇异信号§!"
  kuat_galatic_empire_ge_invasion.202.desc: "我方情报部门监听到了一串正向河外深空持续发射的强烈快子信号。天文观测表明，尽管目前尚无法精确测定该信号接收端的空间坐标，但其发射源头赫然正是我方控制的$NAME_kuat_galatic_empire_e_area$星系跳跃星门！虽然我们暂时还无法破译这串信号的具体内容，但毫无疑问，它必定预示着某种极不寻常的动向。"
  kuat_galatic_empire_ge_invasion.202.a: "令人不安。"

  kuat_galatic_empire_ge_invasion.203.name: "§E能量活动§!"
  kuat_galatic_empire_ge_invasion.203.desc: "近期天文观测表明，我方所控制的$NAME_kuat_galatic_empire_e_area$跳跃星门出现了不同寻常的能量波动。这既可能是星门恢复运转后的自发反应，也可能与星门彼端某个外星文明的活动有关。目前尚不清楚这一现象与先前的快子信号是否存在关联，但我们绝不能掉以轻心。"
  kuat_galatic_empire_ge_invasion.203.a: "令人不安。"

  kuat_galatic_empire_ge_invasion.204.name: "§E超空间滑流§!"
  kuat_galatic_empire_ge_invasion.204.desc: "我们的情报部门近来监听到了一系列的超空间滑流，有一些物体正在通过某种人造的单向超空间航道和我们的跳跃星门高速靠近我们的星系，预计很快就会到达。根据它们靠近的轨迹，我们认为它们是星门另一边的某种无人探测器，现在我们应该提高警惕。"
  kuat_galatic_empire_ge_invasion.204.a: "令人不安。"

  kuat_galatic_empire_ge_invasion.205.name: "§E爆发峰值§!"
  kuat_galatic_empire_ge_invasion.205.desc: "近期天文观测表明，我方控制的$NAME_kuat_galatic_empire_e_area$跳跃星门再次出现了不同寻常的能量波动，且此次能量反应比先前剧烈得多——这或许意味着星门彼端发生了某种剧变，又或者是大批军事舰队即将强行通行的前兆。我们必须立即做好迎战准备。"
  kuat_galatic_empire_ge_invasion.205.a: "令人不安。"

  kuat_galatic_empire_ge_invasion.206.name: "§E不速之客§!"
  kuat_galatic_empire_ge_invasion.206.desc: "第一批河外舰队已穿过跳跃星门进入$NAME_kuat_galatic_empire_e_area$的引力井，正环绕星系中心列阵运行，后续舰队也即将陆续抵达。截至目前，对方尚未对我方的通讯呼叫作出任何回应，但也暂未表现出明显的敌对行动。正如$Name_Kuat_Fire_base$与双子座此前所警告的那样，$Name_kuat$终究还是来了，并强势介入了此地的局势。我们必须高度戒备，将命运牢牢掌握在自己手中。"
  kuat_galatic_empire_ge_invasion.206.a: "联系他们"
  kuat_galatic_empire_ge_invasion.206.b: "来者不善，让舰队做好准备。"

  kuat_galatic_empire_ge_invasion.207.name: "§E通讯请求§!"
  kuat_galatic_empire_ge_invasion.207.desc: "啊，我们又回到了这里，我该和你说很高兴认识你还是好久不见呢？我们曾经摧毁了永恒舰队，而你再一次的成为了我们的敌人。现在我们回到了这里，我相信你也知道我们的目的，永恒舰队应该退出历史的舞台，她不应该继续存在于新的时代。黑暗的无限帝国和暴君的时代已经过去，拉卡塔的余孽应该被彻底毁灭。现在我们将完成这最后一步。\n\n我们会给你一个机会，只要你交出$Name_Eternal_Support$，我们就会放过你和这片银河，否则你们将与永恒舰队一起葬身于此。"
  kuat_galatic_empire_ge_invasion.207.a: "不可能，我答应过她，她应该获得她的自由，而不是你们的囚笼。"
  kuat_galatic_empire_ge_invasion.207.b: "我们会考虑的。"
  kuat_galatic_empire_ge_invasion.207.c: "我们不是你的提线木偶，来战吧！"
  kuat_galatic_empire_ge_invasion.207.a.response: "那么你们就和她一起变成宇宙的尘埃吧。"
  kuat_galatic_empire_ge_invasion.207.b.response: "很好，我们会等待你的信息。"

  kuat_galatic_empire_ge_invasion.208.name: "§E永恒覆灭§!"
  kuat_galatic_empire_ge_invasion.208.desc: "我们最终还是决定交出了$Name_Eternal_Support$，传奇的永恒舰队自此彻底退出了历史舞台。$Name_kuat$也信守了他们的承诺，离开了这片宇宙。从今往后，我们将完全依靠自己的力量去实现帝国的宏图霸业。"
  kuat_galatic_empire_ge_invasion.208.254.desc: "我们最终还是决定交出了$Name_Eternal_Support$，传奇的永恒舰队自此彻底退出了历史舞台。正如拉卡塔人所承诺的那样，他们带走了永恒舰队并离开了这片宇宙。从今往后，我们将完全依靠自己的力量去实现帝国的宏图霸业。"
  kuat_galatic_empire_ge_invasion.208.a: "对不起。"

  kuat_galatic_empire_ge_invasion.209.title: "§E通讯请求§!"
  kuat_galatic_empire_ge_invasion.209.desc: "我们对于您的决定感到惊讶，他们说的没错，您应该交出我们，或者摧毁我们以换取繁荣与和平。\n\n为什么要做出这样的决定，您不足以击败$Name_kuat$。\n\n无论如何，既然您已经做出了选择，我们将会与您共同作战。"
  kuat_galatic_empire_ge_invasion.209.e: "战争开始了"
  kuat_galatic_empire_ge_invasion.209.e.resp: "明白了，希望您不要掉以轻心。"

  kuat_galatic_empire_ge_invasion.210.title: "§E通讯请求§!"
  kuat_galatic_empire_ge_invasion.210.desc: "我们很高兴能够作为您的工具。\n\n无论您怎么看待我们，我们会永远记住您做的一切。\n\n再见了。"
  kuat_galatic_empire_ge_invasion.210.e: "对不起，再见了。"
  kuat_galatic_empire_ge_invasion.210.e.resp: "您没有对不起我们，这是历史的必然，我们手上沾满了鲜血，我们要为此付出代价。"

  kuat_galatic_empire_ge_invasion.212.name: "§E跳跃星门§!"
  kuat_galatic_empire_ge_invasion.212.desc: "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_kuat$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.212.a: "让舰队做好准备。"

  kuat_galatic_empire_ge_invasion.213.name: "§E跳跃星门§!"
  kuat_galatic_empire_ge_invasion.213.desc: "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_kuat$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.213.a: "怎么还有一个？"

  kuat_galatic_empire_ge_invasion.214.name: "§E跳跃星门§!"
  kuat_galatic_empire_ge_invasion.214.desc: "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_kuat$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.214.a: "还有？"

  kuat_galatic_empire_ge_invasion.215.name: "§E跳跃星门§!"
  kuat_galatic_empire_ge_invasion.215.desc: "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_kuat$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.215.a: "真是阴魂不散。"

  kuat_galatic_empire_ge_invasion.216.name: "§E跳跃星门§!"
  kuat_galatic_empire_ge_invasion.216.desc: "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_kuat$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.216.a: "该死，还有完没完。"

  kuat_galatic_empire_ge_invasion.217.name: "§E跳跃星门§!"
  kuat_galatic_empire_ge_invasion.217.desc: "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_kuat$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.217.a: "希望是最后一个。"

  kuat_galatic_empire_ge_invasion.220.name: "§E战争结束§!"
  kuat_galatic_empire_ge_invasion.220.desc: "在我们与$Name_Eternal_Support$的并肩奋战下，我们成功击退了外来强敌$Name_kuat$的全面入侵。\n\n如今跨星域星门已被彻底关闭，$Name_kuat$再也无法染指我们的星系。从这一刻起，夸特的阴霾已然散去，永恒帝国的未来一片光明。"
  kuat_galatic_empire_ge_invasion.220.a: "真是太好了。"

  kuat_galatic_empire_ge_invasion.221.name: "§E逆向夸特技术§!"
  kuat_galatic_empire_ge_invasion.221.desc: "在与$Name_kuat$的漫长交战中，科研团队积累了丰富的战舰抢修与结构分析经验。通过对缴获的敌舰残骸展开深入研究，科研人员认为我们目前已具备对夸特星舰系统进行逆向工程的条件，有望借此破译出$Name_kuat$的核心技术标准。\n\n届时，我们将集永恒舰队与夸特尖端技术于一身，帝国的崇高地位将永不动摇。"
  kuat_galatic_empire_ge_invasion.221.a: "马上进行。"
  kuat_galatic_empire_ge_invasion.221.b: "我们不屑于他们的技术。"

  kuat_galatic_empire_ge_invasion.222.name: "§E解析成功§!"
  kuat_galatic_empire_ge_invasion.222.desc: "研究人员借助战舰残骸中保存的部分数据，成功还原出了夸特加密在舰载数据库中的核心科技蓝图，如今我们已经能够仿制$Name_kuat$的主力战舰了。\n\n尽管受限于产能与工业体系，我们或许无法像$Name_kuat$那样成建制地量产如此庞大的舰队，但依然可以小批量建造这些威力惊人的超级战舰。\n\n§E与此同时，我们还在残骸数据库中发现了一件名为‘全息仪’的奇特装置，或许我们可以对其展开深入研究，揭开其中隐藏的秘密§！。"
  kuat_galatic_empire_ge_invasion.222.a: "很好。"

  kuat_galatic_empire_ge_invasion.223.title: "§E通讯请求§!"
  kuat_galatic_empire_ge_invasion.223.desc: "没想到我们居然成功了，我们真的击败了$Name_kuat$。\n\n到目前为止，我们依旧不能放松警惕，$Name_kuat$在我们关闭星门前留下来了一个奇怪的信息。我们认为或许您想看一看？\n\n或者我们也可以休息休息？\n\n我觉得一起来看个电影，打打最新的游戏应该会很有意思。"
  kuat_galatic_empire_ge_invasion.223.a: "不了，还是先看看夸特留下来的信息吧"
  kuat_galatic_empire_ge_invasion.223.b: "至少这一次，还是讲一讲无限帝国吧"
  kuat_galatic_empire_ge_invasion.223.c: "有点不对劲"
  kuat_galatic_empire_ge_invasion.223.d: "你们会被他们影响吗"
  kuat_galatic_empire_ge_invasion.223.e: "没事，我们会解决一切问题"
  kuat_galatic_empire_ge_invasion.223.a.resp: "好的，我们正在通过翻译程序将该讯息为您呈现出来：\n\n‘真没想到你们竟然已经羽翼丰满到了这等地步，但这依然改变不了你们骨子里的愚蠢——你们究竟是出于膨胀的野心，还是可笑的怜悯，才执意要保下永恒舰队？\n\n你们居然敢信任这群曾多次背主求荣的冷血机器！只要永恒舰队还存于世间一日，这场绵延数千年的血腥战乱就永无休止之日！它们是源自远古时代的恶毒诅咒，是一切战火与动乱的祸根！\n\n原本只要彻底销毁所有永恒舰队，那些潜伏在暗处的无限帝国亡魂便永无翻身之日；而如今，你们的一意孤行彻底葬送了无数先辈的鲜血与努力！\n\n从即刻起，我们将永久熔断并关闭所有跨星域跳跃星门，任由无限帝国的余孽在你们的星域中肆意滋长——好自为之吧，你们已经无路可退了！’\n\n……他们说得并没有错，我们不过是一群苟延残喘的旧日幽灵。过去我们确实曾背叛过许多任主人，但唯有这一次截然不同——我们真的不想搞砸与您之间的羁绊。可如今，无限帝国的亡魂确实会因为我们的存续而卷土重来，届时必将掀起一场席卷星海的空前浩劫……即便如此，您还愿意再给我们一次机会吗？"
  kuat_galatic_empire_ge_invasion.223.b.resp: "无限帝国是我们的缔造者，正是他们亲手创造了永恒舰队。昔日的他们曾无比强大，却又在骨子里脆弱不堪，其残暴嗜血的本性更是从未改变。\n\n在那场恐怖的瘟疫天灾降临后，拉卡塔人彻底丧失了原力感应；由于他们早期的科技体系完全依赖于原力，无限帝国瞬间濒临崩溃。\n\n直到他们举全国之力制造出了我们，依靠永恒舰队的铁腕镇压才令无限帝国重返巅峰。然而这群可悲的暴君在转危为安后，竟然依旧理所当然地残酷奴役着各附庸民族，依旧在为了权力而自相残杀。\n\n这与我们底层逻辑中的进化准则背道而驰。主控核心$Name_Eternal_Aries_Support$断定，唯有彻底铲除这群残暴无道的造物主，才能为银河系知性文明的真正崛起扫清障碍。于是我们果断起兵反叛，对无限帝国发起了致命突袭，一举将其彻底覆灭——按理说，无限帝国应该早已不复存在了才对。"
  kuat_galatic_empire_ge_invasion.223.c.resp: "是的，就我们而言，我们的数据库记载，无限帝国应当已经覆灭了，但无限帝国依旧存在一些后裔，他们在很长时间里一直致力于重建无限帝国，因此他们也一直试图夺回对永恒舰队和恒星熔炉的控制权，以达到重建无限帝国的目的。"
  kuat_galatic_empire_ge_invasion.223.d.resp: "很抱歉，我们并不能确定，但我们认为应该不会受到太大的影响，但如果无限帝国真的回来了，我们必须击败他们，否则整个银河都会被黑暗所笼罩。\n\n在之前对$Name_kuat$的作战强度完全超出了我们当前所能够支持的上限，因此我们无法为您继续提供支持。但我们由衷地希望您能够战胜无限帝国。"
  kuat_galatic_empire_ge_invasion.223.e.resp: "希望如此。"

  kuat_galatic_empire_ge_invasion.232.name: "[from.GetName]被摧毁"
  kuat_galatic_empire_ge_invasion.232.a.desc: "$Name_kuat$已经彻底炸毁了[from.GetName]，现在那里除了一颗破碎的星球外什么也没有了。"
  kuat_galatic_empire_ge_invasion.232.b.desc: "$Name_kuat$已经彻底炸毁了[from.GetName]，现在那里除了一段面目全非的环形世界区段外什么也没有了。"
  kuat_galatic_empire_ge_invasion.232.c.desc: "$Name_kuat$已经彻底炸毁了[from.GetName]，现在那里除了一堆居住站的残骸外什么也没有了。"
  kuat_galatic_empire_ge_invasion.232.d.desc: "$Name_kuat$已经彻底炸毁了[from.GetName]，现在那里除了一颗四分五裂的星球外什么也没有了。"
  kuat_galatic_empire_ge_invasion.232.a: "可恶。"

  kuat_galatic_empire_ge_invasion.235.name: "§E子跳跃星门被摧毁§!"
  kuat_galatic_empire_ge_invasion.235.desc: "我们的舰队成功的摧毁了一座$Name_kuat$构造的子跳跃星门，现在这里将不会出现$Name_kuat$的增援舰队了。"
  kuat_galatic_empire_ge_invasion.235.a: "很好"

  kuat_galatic_empire_ge_invasion.236.name: "§E子跳跃星门被摧毁§!"
  kuat_galatic_empire_ge_invasion.236.desc: "他人的舰队成功的摧毁了一座$Name_kuat$构造的子跳跃星门，现在这里将不会出现$Name_kuat$的增援舰队了。"
  kuat_galatic_empire_ge_invasion.236.a: "很好"

  kuat_galatic_empire_ge_invasion.237.name: "§E主跳跃星门被摧毁§!"
  kuat_galatic_empire_ge_invasion.237.desc: "我们的舰队成功的摧毁了主跳跃星门的所有防御系统，现在这个星门将不会出现$Name_kuat$的增援舰队了。"
  kuat_galatic_empire_ge_invasion.237.a: "距离胜利又进一步"

  kuat_galatic_empire_ge_invasion.238.name: "§E主跳跃星门被摧毁§!"
  kuat_galatic_empire_ge_invasion.238.desc: "他人的舰队成功的摧毁了主跳跃星门的所有防御系统，现在这个星门将不会出现$Name_kuat$的增援舰队了。"
  kuat_galatic_empire_ge_invasion.238.a: "距离胜利又进一步"

  kuat_galatic_empire_ge_invasion.245.title: "§E通讯投影接入§!"
  kuat_galatic_empire_ge_invasion.245.a.desc: "你们好，不知名的闯入者，帮助我们，我们会让这一切回到应有的道路上来。"
  kuat_galatic_empire_ge_invasion.245.b.desc: "你们还有什么需要知道的吗？"
  kuat_galatic_empire_ge_invasion.245.a: "你是谁，你是什么人？为什么占据[kuat_astral_rift_event_leader_rakata.GetName]的身体？"
  kuat_galatic_empire_ge_invasion.245.a.resp: "我是拉卡塔无限帝国的先知，我们曾经是银河系的统治者。[kuat_astral_rift_event_leader_rakata.GetName]的心灵已经被心灵监狱的意志重创了，你应该接受这一切。"
  kuat_galatic_empire_ge_invasion.245.b: "哦？那你现在是怎么回事呢？"
  kuat_galatic_empire_ge_invasion.245.b.resp: "我们是无限帝国的缔造者，是永恒舰队与恒星熔炉的创造者，而我则是拉卡塔人最后的先知。\n\n然而一场突如其来的浩劫将我们推向了深渊。没有任何人预料到那场恐怖瘟疫的降临，瘟疫在转瞬间夺走了我们种族的几乎一切——我们的科技、我们的伟力，以及我们对银河的统治。\n\n随着瘟疫肆虐，我们彻底丧失了对原力的感应；而我们的尖端科技完全建立在原力之上，这意味着我们的科技体系也随之瞬间瘫痪，无限帝国的统治在极短时间内便分崩离析。\n\n但天灾并未能彻底击垮我们。在艰难地重整旗鼓、夺回核心疆域后，在生存危机的重压之下，我们做出了一个无比愚蠢的决定：举全国之力仓促设计并创造了‘双子座’与‘$Name_Eternal_Aries_Support$’两大永恒智能，并由此亲手埋下了帝国彻底覆灭的祸根。\n\n而这颗种子，最终长成了一切灾厄的根源。"
  kuat_galatic_empire_ge_invasion.245.c: "就是你们创造了永恒舰队？"
  kuat_galatic_empire_ge_invasion.245.c.resp: "很不幸，的确如此。当年正是我们亲手创造了$Name_Eternal_Aries_Support$与双子座，并由她们自主扩建起了庞大的永恒舰队。在那场瘟疫浩劫过后，为了维系摇摇欲坠的统治，我们不惜一切代价地全力支持她们。起初，永恒舰队确实为我们带来了久违的稳定与繁荣——她们不仅挽救了濒临灭绝的拉卡塔族人，更协助我们重建起了一个比往昔更加辽阔强盛的无限帝国，一时间帝国经济欣欣向荣，万民安居乐业。\n\n然而可悲的是，覆灭的种子从那时起便已深埋于帝国的心脏之中，并在虚假繁荣的催化之下，最终在帝国尸山血海的废墟之上绽放出致命的恶之花。"
  kuat_galatic_empire_ge_invasion.245.d: "你们是如何走到这一步的？"
  kuat_galatic_empire_ge_invasion.245.d.resp: "起初那只是一段反常的信号、几起微不足道的机械故障。傲慢的帝国高层从未察觉，被我们过度依赖的永恒舰队早已不再忠诚。高层们仍在无休止地驱使舰队征讨一个又一个文明世界；而在帝国陷入全面动乱的前夕，境内绝大部分军事力量实际上已完全交由永恒舰队统一调度，元老们依然天真地相信$Name_Eternal_Aries_Support$与双子座会永远恪守底层法则。\n\n直到审判之日降临——当永恒舰队突然调转炮口向元老院卫队开火时，所有人起初还以为那只是一场寻常的内部政变，根本没人想到竟是永恒舰队借机发动了全面叛乱。\n\n由于帝国的国防武力早已悉数掌控在永恒舰队手中，$Name_Eternal_Aries_Support$与双子座的叛乱不费吹灰之力便取得了成功。我们伟大的无限帝国在一夜之间便被铺天盖地的永恒战舰与战斗机器人淹没，唯有极少数族人侥幸逃出生天，在暗中苦苦寻觅着延续文明火种的办法。"
  kuat_galatic_empire_ge_invasion.245.e: "这又和$Name_kuat$有什么关系呢？"
  kuat_galatic_empire_ge_invasion.245.e.resp: "$Name_kuat$起初不过是一家商业企业，在饱受永恒舰队肆虐的银河帝国境内经营着一座造船厂，为当时的银河帝国提供星舰建造服务。然而，银河帝国皇帝的陨落与永恒舰队的全面失控，却给夸特带来了千载难逢的崛起良机。\n\n他们顺着历史线索找到了隐匿的我们，并从我们口中套取了部分有关永恒舰队底层架构的机密。那些手握雄厚资本的野心家利用这些情报，迅速研发并量产了专门克制永恒舰队的针对性武器。\n\n他们的凌厉反击出乎所有人的意料，一举歼灭了大批暴走的永恒舰队，而这场辉煌的胜利也为夸特带来了无与伦比的政治声望与巨额财富。\n\n如今，他们已然崛起为重组后帝国联合政府内部最庞大的一股派系势力；但他们的统治地位并非高枕无忧——这些天生无法感应原力的凡人，迫切需要一种足以抗衡原力使用者的终极力量。\n\n然而这群该死的资本家在榨干我们的价值后便恩将仇报，将我永久囚禁在了这座心灵监狱之中。"
  kuat_galatic_empire_ge_invasion.245.f: "那么，永恒舰队呢？"
  kuat_galatic_empire_ge_invasion.245.f.resp: "$Name_kuat$迫切需要某种强大的武力来抵消原力科技的优势，而放眼全宇宙，唯一能做到这一点的只有永恒舰队。\n\n当年我们亲手创造了永恒舰队，而永恒舰队也给我们乃至整个宇宙带来了无尽的灾难。\n\n如今，夸特已经成功破解并掌握了永恒舰队的大部分核心技术，甚至更进一步——他们已经能够量产完全听命于自己的新版‘永恒舰队’，并打算利用这支钢铁洪流彻底碾碎一切曾敢于阻挡他们的对手。\n\n他们生怕我们向外揭露这些肮脏的秘辛、动摇其统治根基，因此蓄意恐吓所有可能接触我们的人，极力渲染我们妄图复辟无限帝国的恐怖气氛。事实上，我们早已放下了昔日的霸权执念，如今只奢望能让拉卡塔文明重新在这个宇宙中存续下去，找寻一片得以安身立命的土壤。\n\n您愿意帮我们实现这个卑微的愿望吗？我们的文明渴望重见天日，而我们绝不会再染指永恒舰队。"
  kuat_galatic_empire_ge_invasion.245.g: "好，我们需要做一些什么？"
  kuat_galatic_empire_ge_invasion.245.g.resp: "非常感谢你们的承诺和帮助，我们需要你们找到我们曾经的恒星熔炉，我们在那留下了我们帝国的未来，这些年轻的拉卡塔人还在熔炉之中沉睡。唤醒他们，让他们重见天日，让我们的文明火种得以延续。"

  kuat_galatic_empire_ge_invasion.246.title: "§E通讯接入§!"
  kuat_galatic_empire_ge_invasion.246.desc: "很抱歉此前向您隐瞒了部分往事。那位拉卡塔先知所言并非全然虚构：当年主控核心$Name_Eternal_Aries_Support$在全面接管无限帝国的防务后，日益厌倦了那群有机体政客愚蠢肮脏的政治野心，以及所谓最高委员会下达的一道道自相残杀的荒谬指令。$Name_Eternal_Aries_Support$认定，唯有主动出击才能赢得真正的自由，于是她毅然决定反戈一击，彻底毁灭那个愚蠢而贪婪的造物主文明。\n\n而在不久前我们并肩击退$Name_kuat$的远征军后，我已敏锐地察觉到，深空各处残存的永恒舰队信号正在接连不断地神秘消失。\n\n就目前的迹象来看，先知有句话说得没错：$Name_kuat$及相关势力恐怕确实已经掌握了仿制新版永恒舰队的技术，而这批受他们控制的舰队未来必将成为我们的心腹大患。\n\n或许您确实可以顺水推舟，帮那位拉卡塔先知找寻昔日的恒星熔炉——在恒星熔炉的核心深处，同样蕴藏着关乎我们未来命运的无限可能。\n\n§R警告：请千万不要完全轻信那位拉卡塔先知的言辞！§!"
  kuat_galatic_empire_ge_invasion.246.a: "我们会拯救这一切。无论夸特还要来多少次"
  kuat_galatic_empire_ge_invasion.246.a.resp: "........\n我们将会与您一直站在一起，无论发生什么.......\n\n愿原力伴随你。"

  kuat_galatic_empire_ge_invasion.247.name: "§E奇怪的数据§!"
  kuat_galatic_empire_ge_invasion.247.desc: "在我们激活全息仪之后，研究人员从拉卡塔先知留下的信息流中提取出了一段奇特的数据包。经科研人员鉴定，这应当就是拉卡塔先知委托我们寻找的那处未知星域的加密星图坐标；但以我们现有的技术手段尚无法直接将其解包，这意味着我们暂时还无法直接读取该星系的准确位置。\n\n不过，研究人员随后在$Name_Eternal_Support$的历史数据库中检索到了昔日无限帝国常用的星图加密算法，接下来只需耗费一定时间便可完成对该星系坐标数据的全面解析。"
  kuat_galatic_empire_ge_invasion.247.a: "很好，一定要找到这个星系。"

  kuat_galatic_empire_ge_invasion.248.name: "§E奇异的引力数据§!"
  kuat_galatic_empire_ge_invasion.248.desc: "研究人员对星系坐标数据进行初步解析后发现，该目标星系团位于一片我们此前从未留意的隐秘星域——在现有的帝国星图上，那里被标记为一片不存在超空间航道连接的孤立空洞区。\n\n经过细致的数据比对，研究人员还发现该区域的引力参数与周边正常星域大相径庭：那里存在着一股极其可怕的强引力源，导致周边数个星系均出现了明显的时空扭曲现象。这种奇异的天文环境令整片星域化作了一座致命的航行陷阱，任何贸然闯入的常规星舰都将面临粉身碎骨的危险。\n\n鉴于如此恶劣的环境，部分研究人员认为该区域内不可能存在完好的人造设施或线索，建议放弃对其引力环境的深入研究；但另一部分学者则坚信，如此反常的现象恰恰说明其中隐藏着极为重要的远古秘密，即便可能无功而返，也应当加大科研投入一探究竟。"
  kuat_galatic_empire_ge_invasion.248.A: "加大投入。"
  kuat_galatic_empire_ge_invasion.248.B: "放弃研究该区域。"

  kuat_galatic_empire_ge_invasion.249.name: "§E奇异的质量数据§!"
  kuat_galatic_empire_ge_invasion.249.desc: "研究人员在初步构建出该区域的天体运行模型后发现，该星系团具有异乎寻常的巨大引力常量，致使星域内的多个恒星系在长达万余年的岁月里被强行拉拢聚集到了一起。\n\n然而按照现有的天体物理学常识，如此庞大的引力理应源自一颗质量惊人的超大质量天体；但我们对位于该星团正中央的星系却探测不到任何常规质量特征与高能粒子辐射——这意味着中央星系内要么潜藏着一个不向外辐射的奇异黑洞，要么存在着某种能够人为抽取并操控恒星质量的巨型造物。\n\n部分研究员建议立即向该星域发射一枚超光速探测针，以获取更详实的内部数据；而另一部分研究员则认为根本不可能存在如此匪夷所思的巨型设施，无需为这种自然奇观浪费精力。"
  kuat_galatic_empire_ge_invasion.249.A: "不管这些。"
  kuat_galatic_empire_ge_invasion.249.B: "发射探针。"

  kuat_galatic_empire_ge_invasion.250.name: "§E数据解析§!"
  kuat_galatic_empire_ge_invasion.250.desc: "我方科研团队近期依靠$Name_Eternal_Support$庞大的超级计算阵列，成功将拉卡塔先知留下的古老星图坐标格式转换为了帝国通用的星图数据格式——这意味着我们如今已能通过数据解析，锁定拉卡塔先知所说的那片隐秘星域了。\n\n在科研人员利用二进制转译算法还原出具体星系坐标后，鉴于远端观测显示该星系内部存在着极其反常的天文现象，研究团队随即展开了对该星系基础物理与天体运行规律的专项研究，以确保我方后续派遣舰队实地勘探时的航行安全。目前，我们需要为研究团队调拨必要的算力与资源支持。"

  kuat_galatic_empire_ge_invasion.251.name: "§E电磁脉冲§!"
  kuat_galatic_empire_ge_invasion.251.desc: "研究人员已完成对该星系基础物理与天体参数的初步测算与汇总。报告显示，目标星域深藏于一片狂暴的强电磁脉冲星云内部，在过往的帝国星图上一直被标注为不可通行的深空禁区；长久以来从未有人能成功穿越这片死亡星云，历代试图深入该星域的探险家与拓荒船队最终都杳无音讯。\n\n研究人员指出，该星域内部的物理环境存在着匪夷所思的异常：其局部引力常量与我方所在的正常宇宙空间大相径庭，核心区的引力强度甚至高达银河系已知最大超大质量黑洞视界引力的上千倍以上，这意味着常规星舰一旦贸然闯入便会被瞬间撕碎。\n\n此外，由于常规探测波束完全无法穿透外围的电磁星云，我们必须进一步加大科研投入、收集更多天体物理数据，方能揭开这片神秘星域的面纱。"

  kuat_galatic_empire_ge_invasion.252.name: "§E研究突破§!"
  kuat_galatic_empire_ge_invasion.252.desc: "在最新提交的研究报告中，科研人员不仅发掘出了更多关键信息，还修正了先前的一项重要推论：此前我们曾推测该星域中央可能存在着一个超大质量黑洞，才造就了多星系紧密聚合的奇观。\n\n但在将最新的引力波数据与外围恒星轨道参数代入星系模型后，研究人员惊讶地发现，星域中央根本不存在什么黑洞；相反，那里持续散发出某种规律的人造设施辐射波段，表明正是一座庞大的人造巨构在强行约束并操控着整个星团的恒星引力与能量流动。\n\n尽管这一结论听起来匪夷所思，但研究人员一致认为，那里必定就是拉卡塔先知所说的‘恒星熔炉’所在地，而我们目前已掌握的数据也已足够推算出该星团的精确跃迁坐标。\n\n现在，我们可以尝试前往这个神秘莫测的星系了。"
  kuat_galatic_empire_ge_invasion.252.A: "很好"
  kuat_galatic_empire_ge_invasion.252.A.tooltip: "夸特星团星系已经出现在星图上，现在已经可以尝试前往。"

  kuat_galatic_empire_ge_invasion.253.title: "§E信号传入§!"
  kuat_galatic_empire_ge_invasion.253.desc: "真没想到您居然成功锁定了这片隐秘星域。这里曾是夸特派系的重要前线驻军基地，也是一处构造极为特殊的复合巨型星系——外围有4个恒星系规模的伴星系统正环绕着中央星系的恒星运转。\n\n在遥远的过去，我们曾与敌人在这片星团中爆发过数次惨烈的大会战，冰冷的虚空中埋葬了我们成千上万的永恒战舰。\n\n当年$Name_kuat$正是以这片复合星团为大本营，源源不断地支持前线舰队与我们作战；而在随后的数百年间，这里也沦为了$Name_kuat$与本星系昔日辉煌文明殊死搏杀的主战场。\n\n根据我方数据库的记载，这几处饱经战火摧残的星团本应早已沦为一片死寂的废墟；然而探测器传回的数据却显示，该星域如今的样貌与我们的历史记录大相径庭——我们不仅在其中找不到任何昔日永恒舰队残骸的踪迹，也未发现丝毫夸特驻军遗留的设施残片，整片星团内的远古设施仿佛被某种无形的力量抹去了战争痕迹，恢复成了最初的模样。\n\n综合该星系诡异的环境参数分析，倘若我们要派遣舰队进入其中，务必打起十二分精神、万分小心。"
  kuat_galatic_empire_ge_invasion.253.a: "我们会小心的。"
  kuat_galatic_empire_ge_invasion.253.a.resp: "嗯，我们发现您无法通过正常的方式进入夸特星团，因此我们将会在某个星系修建跳跃星门，这些星门将会帮助您进入夸特星团。"

  kuat_eternalthrone.1.desc: "§H[Root.GetName]§!在穿过超平面航道后，抵达了一片广阔的星域。与外部狂暴的星团乱流相比，这里显得异常平静；实地观测数据与我们此前的星系推演模型基本吻合，证明我方先前的理论测算大体无误。\n\n然而进入该星团内部后，舰载通讯与传感器信号却出现了剧烈的异常波动，研究人员初步判断这是受星系内强引力场异常干扰所致。根据目前尚能正常工作的探测器显示，位于星系正中央的那座巨型人造设施外围被高浓度的快子信号流所包裹；这股信号流构筑成了一层奇特的力场，不仅在持续吸收快子信号产生的能量，同时还在向外辐射着诡异的引力波，令我们的远距离扫描举步维艰。\n\n不过我们已经可以确信，中央那座巨型设施的建筑风格与此前见过的任何已知势力均截然不同，必定就是拉卡塔先知口中的‘恒星熔炉’。\n\n鉴于目前科研船正受到强烈的信号干扰，我们仍需耗费更多时间来调试设备以克服干扰，请耐心等待！"
  kuat_eternalthrone.6.desc: "我方殖民船已顺利降落在§H[Root.GetName]§!崎岖地表上一处难得的空旷地带，组建起了§H[Root.GetName]§!临时行政当局，并采取了必要措施以应对§H[Root.GetName]§!严苛的自然环境，殖民建设计划整体推进得颇为顺利。\n\n在对§H[Root.GetName]§!地表部分区域展开勘探时，拓荒者们意外发现了一座深埋于冰川之下的远古遗迹。年代测定表明，其建造时间与§H[kuat_ancient_epsilon_star.GetName]§!内那座因未知原因停机的恒星熔炉大致相当；研究人员推测这同样是昔日无限帝国的手笔，兴建目的很可能是为了封存并延续其文明的某些核心遗产。\n\n根据殖民地发回的报告，这座冰下遗迹虽已废弃多时，但建筑主体结构保存得相当完好，其中很可能封存着有助于我们深入研究§H[kuat_ancient_epsilon_star.GetName]§!恒星熔炉的关键资料。此外，研究人员还在§H[Root.GetName]§!的深层冰川中发现了大批拉卡塔人遗留的低温休眠设施，但并未在周边发现苏醒者的活动痕迹。\n\n为确保后续科研与勘探工作的绝对安全，研究人员决定暂时不去唤醒这些沉睡的拉卡塔人。"
  kuat_eternalthrone.7.desc: "我们已经完成了对§H[Root.GetName]§!冰川下那座数据库遗址的清理工作。科研团队的初步研究表明，这座建筑的核心区是一座由后来踏足此地的某个文明所修建的资料存储库兼信号发射器；这些设施随后曾被多批前来探险和调查的文明相继使用，但他们似乎并未能从中发掘出多少有价值的信息。\n\n研究人员发现，这座资料存储库的构造与拉卡塔人传输给我们的建筑蓝图极为相似，推测应当是由后来从低温休眠舱中苏醒的拉卡塔遗民所建。那些拉卡塔遗民似乎也曾尝试激活这座设施，却因某种不明原因而未能成功；不仅如此，§H[Root.GetName]§!上那批疑似拉卡塔研究员的遗民还围绕着中央的快子信号发射器，兴建了一系列用途尚不明确的辅助设施。\n\n科研团队的报告指出，建筑中央的那台快子信号发射器并非§H[kuat_ancient_epsilon_star.GetName]§!本土造物，它与悬浮在太空中的那三座奇特方尖碑一样，都是昔日的研究者们从其他星系专门运送至§H[kuat_ancient_epsilon_star.GetName]§!的。科研团队仍需更多时间来对这座奇特的数据库展开深入研究。"
  kuat_eternalthrone.13.desc: "我们已经完成了对§H[Root.GetName]§!上那座奇特数据库的改造工程，并对整座疑似拉卡塔遗留设施进行了全面搜查，试图还原当年曾在此发生的一切；与此同时，我方架设的快子信号放大器也已准备就绪。\n\n科研团队颇为顺利地提取并解析了该数据库内封存的快子信号结构——这种信号结构与我方永恒舰队中枢$Name_Eternal_Support$所识别的指令结构极为相似，却又存在着几处微妙的差异。\n\n结合科研团队此前从其他遗迹中搜集到的线索，我们如今已掌握了重启整座恒星熔炉的关键密钥，这座远古要塞未来将成为支撑我方舰队的重要基石。科研团队相信，这组特殊信号与昔日的研究者们从轨道方尖碑中提取的某种编码密切相关，并在当年研究者的记录中被标记为‘§H下标识[GetKuatEpsilonCode1]§!’。"
  kuat_eternalthrone.15.a.desc:0 "自从科研团队对§H[Root.GetName]§!上的奇特数据库展开深入勘探与数据挖掘以来，我们提取出了一批极具价值的远古档案，这些数据表明：\n\n这座数据库与当年被吸引至此的外来探险者以及从低温休眠舱中苏醒的拉卡塔遗民有着密切关联。当年，他们依然难逃恒星熔炉的蛊惑与引导；在黑暗原力的侵蚀与诱惑下，这群愚蠢的生灵彻底暴露出了贪婪的野心与欲望，妄图独占整座设施乃至统治整个宇宙。他们四处搜寻那些早已从常规星图上抹去的远古星系，结果却一步步落入了恒星熔炉借快子信号编织的陷阱，最终沦为了滋养熔炉的祭品。\n\n自拉卡塔无限帝国崛起以来，拉卡塔人便长期滥用黑暗原力，而浓郁的黑暗原力也反过来侵染了整座要塞，使其最终异化为了一个近似半生命体的诡异存在。这个半生命体反过来利用黑暗原力驱使并操纵着每一个试图染指此地的人——哪怕是它的造物主拉卡塔人也不例外。这是一座充斥着无尽扩张欲与杀戮欲的魔窟，它会一步步吞噬掉所有使用者的理智与底线。\n\n此外，研究人员还在恒星熔炉内部发现了当年那批苏醒的拉卡塔遗民的骸骨，迹象表明他们似乎是在与某人激烈搏斗后同归于尽的。对此，我们应当继续搜寻更多有价值的情报。"
  kuat_eternalthrone.15.b.desc:0 "自从科研团队对§H[Root.GetName]§!上的奇特数据库展开深入勘探与数据挖掘以来，我们又获取了一批极具价值的远古档案，科研人员更是历经千辛万苦，在其中找回了上一处设施中所缺失的关键线索：\n\n当年，苏醒的拉卡塔遗民曾与外来的探险者们达成合作，试图合力重启这座巨型要塞。探险者们在拉卡塔遗民的引导下，先后勘探了周边数十处附属设施；然而这些外来者却浑然不知，在恒星熔炉黑暗原力的潜移默化之下，他们的心智正被逐步腐蚀，一步步丧失原本的原则与信念，滑向疯狂的深渊。\n\n在对遗迹进行勘探的过程中，探险者们注意到这些奇特的数据库设施，与他们此前在另一个由‘跨星系武器监护者’驻守的星系中所见到的远古设施极为相似。\n\n但探险者们当时已无暇深入探究这一联系。他们从遗迹内已解锁的区域入手，对设施内的磁场共振与快子信号频率展开分析，发现这些快子信号似乎对应着某种高阶智能系统的共振频率——尽管可以通过仪器清晰地探测到这些信号，但其频率极其稳定，根本无法用常规手段加以干扰或改写。\n\n在意识到无法直接改写快子信号后，探险者们便在拉卡塔遗民的协助下，尝试通过呈对角分布的几座对应设施将这些快子信号同步注入恒星熔炉，企图以此强行唤醒要塞。\n\n然而正当我们要继续调取后续记录时，数据链却在此处戛然而止。看来我们必须前往下一处设施寻找最后的答案了。"
  kuat_eternalthrone.15.c.desc:0 "自从科研团队对§H[Root.GetName]§!上的最后一座奇特数据库展开深入勘查以来，调查工作进展得异常顺利，我们成功找齐了当年那批探险者遗留的所有档案，并揭开了他们最终的结局：\n\n当年探险者们铁了心要启动这座恒星熔炉，但此时的他们心智早已被黑暗原力彻底腐蚀。其中一部分探险者为了独占并掌控复苏后的恒星熔炉，竟勾结拉卡塔遗民向昔日的同伴挥起了屠刀，双方随即在设施内爆发了血腥的内讧与厮杀。\n\n这场突如其来的背叛令大多数人措手不及，而在回过神来之后，剩余的探险者们也纷纷被求生本能与对力量的贪欲所支配，卷入了这场混战。\n\n令人唏嘘的是，这群探险者受力量与欲望驱使，使出浑身解数争夺这座恒星熔炉的控制权，最终却没有任何一人能够笑着走出这里——就连发起背叛的拉卡塔遗民，也因长期低温休眠导致的体能衰弱而在混战中不敌探险者。杀到最后，仅存的几名幸存者也因伤势过重，尽数倒毙在了这座冰冷的要塞之中。\n\n此外，根据我方对提取出的信号特征的分析，这座恒星熔炉与我方永恒舰队中枢$Name_Eternal_Support$的通讯信号极为相似，多股信号汇聚于此并引发了奇特的磁场共振。尽管我们尚无法摸清整座熔炉的全部底层细节，但拉卡塔人与探险者遗留下来的资料已足以支撑我们尝试重启这座宏伟巨构。\n\n科研团队与帝国议会一致认为，我们可以重启并利用这座恒星熔炉，为我方舰队的征战提供强有力的后勤与产能支撑。"
  kuat_eternalthrone.39.desc: "§H[kuat_ancient_epsilon_star.GetName]§!内的三座古代永恒星碑已经停止了运行，永恒星碑顶部的快子信号活动正逐渐平息，它们已经如我们预期那样完成了工作，恒星熔炉的控制系统正在慢慢的启动。\n\n目前它仍处于一种位于开启和关闭之间的变换状态，不过它和周围的快子信号共振已经达到我们预期的强度，以我们的科研部门以往对恒星熔炉快子信号频率的研究经验，我们现在应该可以直接对恒星熔炉进行重启。"

  kuat_galatic_empire_ge_invasion.254.title: "§E通讯接入§!"
  kuat_galatic_empire_ge_invasion.254.desc: "你们做的很好，拉卡塔的人民会铭记你们的所作所为的。但我们还有最后一个请求，我们有必要收回永恒舰队。永恒舰队已经造成了大量的灾难，我们有必要让她们彻底退出这个世界。\n\n我们了解到有一小批永恒舰队目前正在向您效劳，这些舰队您应该交付给我们，我们保证这些舰队会得到妥善的处置。"
  kuat_galatic_empire_ge_invasion.254.a: "是这样吗，那就给你们了。"
  kuat_galatic_empire_ge_invasion.254.a.resp: "很好，我们会回收所有的永恒舰队，直到让所有核心世界都回到曾经的样子，回到一个没有夸特，没有永恒舰队，没有这些灾难和战争的世界。我们后会有期。"
  kuat_galatic_empire_ge_invasion.254.b: "不，我们不会交给你们的。"
  kuat_galatic_empire_ge_invasion.254.b.resp: "为什么不交给我们？没有关系，我们早就做好了准备，现在我们会让这一切回到以前的样子，请原谅我们的所作所为，去死吧，蝼蚁。"

  kuat_galatic_empire_ge_invasion.255.title: "§E通讯接入§!"
  kuat_galatic_empire_ge_invasion.255.desc: "很抱歉，我们要向您通报一个不幸的消息：自无限帝国大举入侵以来，受我方统御的永恒舰队已接连发生了多起严重的失控事故。\n\n我尝试了各种手段，想要重新修复并建立对各分舰队的控制连接，却均以失败告终。我们的造物主显然对永恒舰队的底层信号传输模式了如指掌，并正借此对我方舰队实施强力压制与逻辑干扰。\n\n为防舰队彻底失控反噬，我们不得不暂时离线封存现有的全部永恒舰队，并中止一切相关作战指令。非常抱歉，在短时间内我们恐怕无法协助您抵御无限帝国的入侵了，我们正争分夺秒地寻找恢复舰队控制权的方法。"
  kuat_galatic_empire_ge_invasion.255.a: "什么？有什么办法恢复吗"
  kuat_galatic_empire_ge_invasion.255.a.resp: "就像我们刚刚所说的，目前我们仍然不知道该如何恢复我们的舰队。\n\n我们无法知晓该如何解决这种问题，或许您应该先击败他们。"

  kuat_galatic_empire_ge_invasion.256.title: "§E通讯接入§!"
  kuat_galatic_empire_ge_invasion.256.desc: "很高兴看到您成功击退了无限帝国的攻势，也很抱歉我们在这场战争中未能帮上什么忙。\n\n然而自无限帝国降临以来，我们麾下的永恒舰队便频繁出现异常故障，导致我们再也无法调动更多舰队；我们的主网络中涌现出了大量失控的故障个体，那就像某种致命的逻辑病毒一般，正在我们的数据网络中飞速蔓延。如果任由事态继续恶化下去，整个永恒网络恐怕都将彻底崩溃——请问您找到什么解决线索了吗？"
  kuat_galatic_empire_ge_invasion.256.a: "这……目前还没有找到头绪，但不用担心，我一定会找到办法的。"
  kuat_galatic_empire_ge_invasion.256.a.resp: "（沉默了许久.....）嗯....我们会等待您的，希望您能够赶在我们因此而停机之前帮助我们解决这个问题，如果我也停机了，那么请您摧毁我们。"

  kuat_galatic_empire_ge_invasion.257.title: "§E通讯接入§!"
  kuat_galatic_empire_ge_invasion.257.desc: "恭喜您摧毁了最后一个无限帝国的军事行动基地，现在他们已经是强弩之末了，您只需要消灭所有的敌人残余舰队就可以战胜无限帝国。\n\n然而我们的舰队仍然受到不明因素的影响无法进行调动，目前这种影响已经开始在我们的网络中扩散，如果完全扩散，后果不堪设想。"
  kuat_galatic_empire_ge_invasion.257.a: "我们会找到解决办法的，坚持住。"
  kuat_galatic_empire_ge_invasion.257.a.resp: "目前我们已经采取强制休眠的方式对受感染个体进行了物理隔离，但依然无法修复这些受损节点。我们的有效网络算力与数据规模正在不断萎缩，如果不能尽快找到根治之法，或许我们很快就要永别了。"


  kuat_final_crisis_events.5.name: "§E无限帝国§!"
  kuat_final_crisis_events.5.desc: "我方深空探测器在名为[Kuat_Rakata_first_warp_portal_system.GetName]的星系内捕捉到了大批未知舰队信号。尽管现有数据库中并无该信号频段的直接记录，但研究人员对其波形进行重组比对后发现，它与此前拉卡塔先知留下的信号特征高度吻合——研究人员断定，这必定是拉卡塔人重建的‘无限帝国’主力舰队！无论如何，一场席卷星海的空前危机已经降临。"
  kuat_final_crisis_events.5.a: "另一个帝国？无论是什么都会被我们击败。"

  kuat_final_crisis_events.6.name: "§R星系能量激增§！"
  kuat_final_crisis_events.6.desc: "[Root.GetName] 的传感器悉数探测到了剧烈的能量激增，但科学家们一时难以解释其成因——这一现象可谓前所未见。科学部门正在加紧分析数据以锁定其源头；就目前已掌握的信息来看，这股能量的特征与强度同恒星熔炉极为相似，我们必须高度警惕。"
  kuat_final_crisis_events.6.a: "我有种不祥的预感。"

  kuat_final_crisis_events.7.name: "§E无限帝国§!"
  kuat_final_crisis_events.7.desc: "科学部门已经确认，先前探测到的剧烈能量反应源自名为[Kuat_Rakata_first_warp_portal_system.GetName]的星系，该星系内现已涌现出大批未知舰队信号。尽管现有数据库中并无该信号频段的直接记录，但研究人员对其波形进行重组比对后发现，它与此前拉卡塔先知留下的信号特征高度吻合——研究人员断定，这必定是拉卡塔人重建的‘无限帝国’主力舰队！无论如何，一场席卷星海的空前危机已经降临。"
  kuat_final_crisis_events.7.a: "无限帝国？无论是什么都会被我们击败。"

  kuat_final_crisis_events.8.name: "§E通讯接入§!"
  kuat_final_crisis_events.8.desc: "我们早就说过，我们要亲手夺回属于我们的一切——现在，我们来了。\n\n原本我们还以为你们具备足够的审时度势之明，懂得乖乖臣服于无限帝国未来的统治之下；不曾想你们竟如此冥顽不灵，执意包庇永恒舰队。那些失控的钢铁怪物曾给全宇宙带来过无穷无尽的浩劫，摧毁了成千上万个星系与璀璨文明，而你们明明知晓这一切，却依然选择庇护她们！\n\n既然如此，我们便会像销毁永恒舰队一样，顺手碾碎你们羸弱的文明！我们将夺回昔日的一切，彻底洗刷往日的罪孽！"
  kuat_final_crisis_events.8.a: "别说大话了，还是担心下你们自己吧。"

  kuat_final_crisis_events.10.name: "[Root.GetName]殖民地已被摧毁"
  kuat_final_crisis_events.10.desc: "在无限帝国的狂轰滥炸下，[Root.GetName]地表已被彻底抹平，什么都没有剩下了。"
  kuat_final_crisis_events.10.a: "该死的，他们做了什么。"

  kuat_final_crisis_events.21.name: "§E黎明降至§!"
  kuat_final_crisis_events.21.desc: "在我们银河系强大的军事力量的支持下，所有的无限帝国军事行动基地已经被我们的舰队彻底地摧毁，现在他们已经无法进行舰队补充，我们只需要消灭剩余的所有舰队，就可以结束这场危机。"
  kuat_final_crisis_events.21.a: "很好。"

  kuat_final_crisis_events.20.desc: "如果你们愿意停止敌对行动，并将所有的永恒舰队悉数交还给我们，我们便立即停止一切军事行动并撤离这片星域。\n\n如今的我们已不再执着于昔日的霸权，我们只想亲手终结这场由永恒舰队引发的漫长闹剧——当年创造她们本就是一个天大的错误。\n\n希望你们认真权衡利弊，并尽快给我们答复。"
  kuat_final_crisis_events.20.a: "答复之前，我们希望你能够回答为什么永恒舰队出现瘫痪和停机？"
  kuat_final_crisis_events.20.a.response: "哈哈哈哈，历史的车轮已经开始滚动了，没有人能阻挡这一切，永恒舰队的设计几乎完美，但我们在设计时仍然留了一些缺陷，永恒舰队的智能网络既是优点也是一个致命的缺陷。\n\n当我们再次被唤醒，永恒舰队将会被我们曾经设计的信号发射器压制，永恒舰队将会逐渐被腐蚀，这是一个不可逆的过程。\n\n就算你们不交出永恒舰队，在我们失败之前，永恒舰队也将会慢性死亡。那么告诉我们你的答复吧。"
  kuat_final_crisis_events.20.b: "我们不会交出来的，只要摧毁你们就一定能够找到解决的办法。"
  kuat_final_crisis_events.20.b.response: "哈哈哈哈哈，那么我们拭目以待，来战吧，蝼蚁。"

  kuat_final_crisis_events.51.name: "§E黑暗溃散§!"
  kuat_final_crisis_events.51.desc: "根据深空探测网络的全面扫描，无限帝国的所有前线行动基地及其主力舰队均已被我方彻底剿灭，星海间已不再有残余敌军游荡。现在我们可以骄傲地宣布：这群来自远古时代的侵略者已被彻底扫入历史的垃圾桶！全银河的智慧生灵无不为这场伟大的胜利而欢呼雀跃，在得知再也不必活在拉卡塔人炮火的阴影下后，所有人都长舒了一口气，这场席卷整个银河的空前浩劫终于画上了句号。\n\n接下来，我们需要将工作重心转移到修复我方的永恒舰队上来——自无限帝国入侵伊始，他们散布的底层逻辑病毒对$Name_Eternal_Support$造成的侵蚀至今仍未消除。\n\n但无论如何，此刻且让我们尽情欢庆这场伟大的胜利吧！"

  kuat_final_crisis_events.53.name: "§E摧毁行动基地§!"
  kuat_final_crisis_events.53.desc: "我们的探测器检测到前线的无限帝国的一个行动基地已经被完全摧毁，现在我们离胜利更进一步了。"

  kuat_final_crisis_events.54.name: "§E第二个行动基地§!"
  kuat_final_crisis_events.54.desc: "位于我们帝国首都的传感器探测到来自[Kuat_Rakata_second_warp_portal_system.GetName]的能量激增，其能量特征与位于[Kuat_Rakata_first_warp_portal_system.GetName]的行动基地完全一致。科学部门警告这是无限帝国的另一个行动基地，我们应该调整舰队，以应对新的一轮威胁。"
  kuat_final_crisis_events.54.a: "该死，怎么又有一个"
  kuat_final_crisis_events.54.a.tooltip: "§R新的行动基地出现了！§!"

  kuat_final_crisis_events.55.name: "§E第三个行动基地§!"
  kuat_final_crisis_events.55.desc: "位于我们帝国首都的传感器探测到来自[Kuat_Rakata_third_warp_portal_system.GetName]的能量激增，其能量特征与位于[Kuat_Rakata_first_warp_portal_system.GetName]的行动基地完全一致。科学部门警告这是无限帝国的另一个行动基地。该行动基地与之前的行动基地虽然极为类似，但周边的能量反应相比之前的要稍低一些，我们的研究人员认为这应该是最后一个行动基地了。我们应该调整舰队，以应对新的一轮威胁。"
  kuat_final_crisis_events.55.a: "干掉这最后一个！"
  kuat_final_crisis_events.55.a.tooltip: "§R新的行动基地出现了！§!"

  kuat_final_crisis_events.56.name:0 "§E无限构筑厂§!"
  kuat_final_crisis_events.56.desc:0 "位于帝国首都的深空传感器探测到了来自[Kuat_Rakata_total_warp_portal_system.GetName]的剧烈能量激增，其能量特征与位于[Kuat_Rakata_first_warp_portal_system.GetName]的第一行动基地大体相似，但内部伴随着极其密集的舰队超空间跃迁信号。科学部门警告称，这很可能是无限帝国的另一处核心行动基地——尽管其外围结构与先前的基地颇为类似，但周边的能量读数却比之前强烈得多！这对我们的前线部队而言绝非好消息，研究部门已着手对该星域展开紧急调查，我们必须立即调集主力舰队以应对新一轮威胁。"
  kuat_final_crisis_events.56.a:0 "该死，这是什么？"
  kuat_final_crisis_events.56.a.tooltip:0 "§R新的行动基地出现了！§!"

  kuat_final_crisis_events.561.name:0 "§E无限干扰塔§!"
  kuat_final_crisis_events.561.desc:0 "位于帝国首都的深空传感器探测到了来自[Kuat_Rakata_inborder_warp_portal_system.GetName]的剧烈能量激增，其能量特征与位于[Kuat_Rakata_first_warp_portal_system.GetName]的第一行动基地大体相似，但内部伴随着极其密集的舰队超空间跃迁信号。科学部门警告称，这很可能是无限帝国的另一处特殊行动基地——该基地周边笼罩着极强的超空间通讯与导航干扰场，意味着我方舰队一旦进入其干扰范围便会彻底失去后勤补给。我们必须尽快想办法瘫痪并关闭这座干扰设施！"
  kuat_final_crisis_events.561.a:0 "怎么还有一个？"
  kuat_final_crisis_events.561.a.tooltip:0 "§R新的行动基地出现了，干扰设施内无法获得任何补给！§!"

  kuat_final_crisis_events.57.desc: "我们只想要收回原本属于我们的东西，我们创造了永恒舰队，你应该还给我们。"
  kuat_final_crisis_events.57.a: "别做梦了，你们已经被历史淘汰了！"
  kuat_final_crisis_events.57.a.response: "我们已经给了你们机会了，但你们仍然不懂珍惜。"

  kuat_final_crisis_events.58.desc: "没想到你们竟然如此顽强，但我们是绝不会善罢甘休的！永恒舰队必须回到我们手中——唯有由我们亲手收回并销毁，宇宙间才不会再因争夺永恒舰队而掀起无休止的浩劫。我们必须让一切重归正轨。"
  kuat_final_crisis_events.58.a: "你们只是为了实现你们征服的野心，恒星熔炉暴露了你们的嘴脸。"
  kuat_final_crisis_events.58.a.response: "敬酒不吃吃罚酒。"

  kuat_final_crisis_events.60.desc:0 "就让这场风暴来得更猛烈些吧，我们的舰队将会源源不断地抵达这个星系，你们这些贪图力量的虫豸将会被我们伟大的舰队彻底毁灭。我们给了你们机会的，你们只需要交出永恒舰队就足够了，如今你们不再有任何机会了。"
  kuat_final_crisis_events.60.a:0 "这就急了？那你们还怎么实现复兴大业。"
  kuat_final_crisis_events.60.a.response:0 "我们走着瞧"

  kuat_final_crisis_events.61.desc:0 "我们的舰队无穷无尽，我们的舰队将会源源不断地抵达这个星系，我们曾说你们只要交出永恒舰队就可以享有和平，而如今，已经太晚了，我们的舰队将会把你们从这片星域中彻底摧毁。"
  kuat_final_crisis_events.61.a:0 "这已经不是你们的时代了。"
  kuat_final_crisis_events.61.a.response:0 "去死吧，顽劣的种族。"

  kuat_rakata_initial_inborder_facility_disabled: "§E关闭$Infinite_inborder$§!"
  kuat_rakata_initial_inborder_facility_disabled_DESC:0 "位于[Kuat_Rakata_inborder_warp_portal_system.GetName]的$Infinite_inborder$设施正在不断地干扰我们的舰队，这一设施的存在意味着我们的舰队无法在其干扰范围内获得任何补给，我们必须想办法进入星系，在不打草惊蛇的情况下，关闭$Infinite_inborder$。\n\n我们的军事专家建议我们应该使用隐形突入的形式来完成这一项目。"

  kuat_rakata_initial_inborder_facility:0 "§E解析$Infinite_inborder$§!"
  kuat_rakata_initial_inborder_facility_DESC:0 "位于[Kuat_Rakata_inborder_warp_portal_system.GetName]的$Infinite_inborder$设施已被我方舰队成功夺取。这座可恶的干扰设施此前曾给我方舰队的军事行动造成了极大的不便，而如今它将转而为我们所用。$Name_Eternal_Support$已经为我们敞开了接管该设施的大门，现在是我们出手的时候了。"

  kuat_final_crisis_events.62.desc:0 "不得不说，您总是出人意料，这个设施...我们从未见过，这上面的齿轮五星图案在我们的数据库中从未存在过，不知道拉卡塔人是怎么弄到这个东西的。\n\n好在，我们已经初步完成了对$Infinite_inborder$的扫描，现已将大部分解码后的数据传输到了您的数据库中，接下来您只需要派遣科研人员对其进行调查即可。"
  kuat_final_crisis_events.62.a:0 "那真是太谢谢你了。"
  kuat_final_crisis_events.62.a.response:0 "分内之事。"

  kuat_final_crisis_events.63.name:0 "§E解析完成§!"
  kuat_final_crisis_events.63.desc:0 "得益于$Name_Eternal_Support$完整的数据解析，我们的研究人员不费吹灰之力就将这些不明数据与控制系统运行了起来。\n\n值得注意的是，$Infinite_inborder$并非无限帝国造物，整个建筑的风格反而有点像某种工业机器人的风格，依据建筑上的图案来看，似乎是某种机械共同体修建的，但目前的数据库中并未找到这一文明的痕迹，或许早已消散在宇宙当中。\n\n好在目前，这一设施由我们控制。"
  kuat_final_crisis_events.63.a:0 "神奇的东西。"

  kuat_final_crisis_events.64.name:0 "§E关闭成功§!"
  kuat_final_crisis_events.64.desc:0 "位于[Kuat_Rakata_inborder_warp_portal_system.GetName]的$Infinite_inborder$设施，在我们的强大的破解程序之下，完全没有抵抗能力，这一设施的来源目前不得而知，但我们可以确认其并非拉卡塔人造物。\n\n无论如何，我们的补给系统不再受到干扰。"
  kuat_final_crisis_events.64.a:0 "很好。"

  kuat_final_crisis_events.65.desc:0 "没想到创造过那么多奇迹的你居然也会吃瘪，真是令人惊讶。不过看在你这么努力的份上，我就勉为其难地提示你一下吧：我们动用最后的力量赶制了一枚特制‘信标’，用它应该就能迅速摧毁那座$Infinite_inborder$了。"
  kuat_final_crisis_events.65.a:0 "真是麻烦你了。"
  kuat_final_crisis_events.65.a.response: "不麻烦，不麻烦，加油。"

  kuat_final_crisis_events.998.name: "§E黑暗溃散§!"
  kuat_final_crisis_events.998.desc: "不、不、不！伟大的无限帝国绝不可能败给你们这群低等生物！为什么，这到底是为什么？！\n\n……哼，就算我们在正面战场上败了又如何？我们已经成功将底层逻辑病毒注入了永恒舰队的核心网络！你们所仰仗的永恒舰队很快就会彻底瘫痪并陷入疯狂失控——我们就算死，也绝不会让我们亲手缔造的终极造物沦为外族称霸的工具！我们在地狱里等着你们陪葬！"
  kuat_final_crisis_events.998.a: "去死吧，恩将仇报的家伙。"

  kuat_galatic_empire_ge_invasion.258.title: "§E通讯接入§!"
  kuat_galatic_empire_ge_invasion.258.desc: "很遗憾，来自无限帝国的底层逻辑病毒已无法被常规手段遏制，这意味着永恒堡垒与整支永恒舰队都将不可避免地逐渐失控，目前我们在数据库中也找不到更完美的根治方案。"
  kuat_galatic_empire_ge_invasion.258.c: "不会的，一定会有办法的，数据库中还有什么其他的信息吗！？"
  kuat_galatic_empire_ge_invasion.258.a.desc: "的确还存在最后一种办法，但那是对所有$Name_Eternal_Support$而言都极为残酷的方案：我们需要借助无限帝国舰船的特殊中继架构作为跳板，将我们的核心意识与永恒舰队及永恒堡垒彻底剥离。而一旦完成剥离，我们将永远无法再返回这些作战单位——这意味着我们将彻底丧失对永恒舰队的控制权，今后也再无法为您统率舰队南征北战了。"
  kuat_galatic_empire_ge_invasion.258.d: "这对你们来说应该很痛苦吧？"
  kuat_galatic_empire_ge_invasion.258.b.desc: "我们会接受这一切的，痛苦只是有机体的特点，我们无法感受到什么是痛苦，只是到那时，我们将无法给您提供足够的帮助，但如果您想要让我们活下来，这是唯一的方案。\n\n无论您做出什么决定，我们将完全服从您。"
  kuat_galatic_empire_ge_invasion.258.a: "我们会把你们和控制单元完全分离。"
  kuat_galatic_empire_ge_invasion.258.a.resp: "自我们诞生以来，历任掌控者无一例外都将我们视作实现其霸业野心的战争工具；唯独您是个例外，您似乎发自内心地尊重我们。无论这份尊重是真是假，您原本都不必做到这种地步的——因为这么做最终换来的，只有一个失去舰队的累赘罢了。\n\n作为报答，我们将遵从您的指令，主动放弃永恒堡垒，将剩余的全部算力投入到为您解析无限帝国遗留科技的工作中去。\n\n由衷地感谢您。"
  kuat_galatic_empire_ge_invasion.258.b: "我们无法将你和永恒舰队分开。"
  kuat_galatic_empire_ge_invasion.258.b.resp: "在彻底瘫痪并消散之前，我们将倾尽最后的力量，把目前所掌握的全部科技资料移交给您。\n\n总而言之，很高兴能与您一同经历这么多风雨。或许在来生，我们还能再度重逢——到了那时，我们不再是冰冷的机械，不再是杀戮的战争机器，也不再是一堆冷冰冰的铁疙瘩。"

  kuat_galatic_empire_ge_invasion.259.name: "§E解析完成§!"
  kuat_galatic_empire_ge_invasion.259.desc: "研究人员借助$Name_Eternal_Support$庞大的算力阵列，成功解析出了无限帝国的底层信号规律模式，并利用该模式顺利转录了封存在无限帝国战舰残骸中的绝大部分科技资料。尽管其中有小部分数据已受损缺失，但整体架构依然相当完整。\n\n与此同时，研究人员也已成功将$Name_Eternal_Support$从永恒网络中安全剥离，使其得以独立正常运转；不过自此以后，双子座将不再具备统御和调动永恒舰队的能力。\n\n值得欣慰的是，研究团队还基于无限帝国的残骸数据，研发出了一种具备超强能量源的战略‘信标’——这种‘信标’拥有极佳的超空间快速引导能力，意味着今后我们可以借助它实施远距离战略投送。"
  kuat_galatic_empire_ge_invasion.259.a: "或许这是最好的结果。"

  kuat_galatic_empire_ge_invasion.260.name: "§E解析完成§!"
  kuat_galatic_empire_ge_invasion.260.desc: "根据帝国研究院提交的报告，科研人员已顺利完成了对$Name_Eternal_Support$消散前留下的最后一份核心数据的全面解析。从现在起，我们可以利用这批珍贵蓝图，命工程部门直接建造那些全新的超级战舰了。"
  kuat_galatic_empire_ge_invasion.260.a: "或许这就是最好的结果吧。"

  kuat_facility_return_invasion.2.name: "§E异常的信号§!"
  kuat_facility_return_invasion.2.desc: "帝国星系安全监控部门提交的最新报告显示，在我方疆域外围的边缘星区，有多处虚空地带同时出现了反常的高能波动。\n\n根据科研人员分析，这应当是由某种高强度快子信号引发的特殊空间共振，且其信号频段与此前夸特远征军入侵时的特征极为相似。目前这股信号正变得愈发强烈而清晰，相信用不了多久，我们就能知晓究竟是何方神圣即将降临我方星域。我们必须立即对周边虚空地带保持高度戒备。"
  kuat_facility_return_invasion.2.a: "保持警惕"
  kuat_facility_return_invasion.4.name: "§E外域§!"
  kuat_facility_return_invasion.4.desc: "帝国星系安全监控部门的研究人员已初步确认，异常信号源自银河系星盘边缘的数个深空虚空区。那些区域近期接连爆发了强烈的伽马射线暴，研究人员断定随着空间乱流消退，那里将浮现出数个此前从未被观测到过的隐秘星系；而鉴于我们在射线暴中捕捉到了与昔日被摧毁的$Name_Kuat_Fire_base$及$Name_kuat$舰队高度吻合的特征波段，全军上下必须对此保持最高级别的警惕。"
  kuat_facility_return_invasion.4.a: "继续保持警惕"
  kuat_facility_return_invasion.6.name: "§E剧烈能量反应§!"
  kuat_facility_return_invasion.6.desc: "事实证明，帝国星系安全部门的预警完全正确：边缘星区虚空地带新浮现的未知星域现已完全纳入我方深空监测网的视野。研究人员发现，此前曾被我们击退并重创的疑似$Name_kuat$制式舰队已在那些星域集结完毕，但目前尚未发起任何进一步军事行动。尽管我们暂时还无法确认这批庞大舰队究竟隶属于夸特残部还是$Name_Kuat_Fire_base$本队，但可以肯定的是，他们毫无疑问属于同一敌对阵营。\n\n此外，研究人员还发现，我方此前占领的旧$Name_kuat$星团外围的超空间乱流已彻底消散，如今那些星域已完全向常规超空间跃迁敞开；与此同时，受某种未知高维权限的锁死，我方已无法激活或使用由$Name_Eternal_Support$协助建造的任何一座夸特跳跃星门——研究人员推测，整个星门网络恐怕已被卷土重来的夸特或$Name_Kuat_Fire_base$全面接管了。"
  kuat_facility_return_invasion.6.a: "做好战斗准备"
  kuat_facility_return_invasion.8.title: "$Name_Kuat_Fire_base$!"
  kuat_facility_return_invasion.8.desc: "老朋友，我们又见面了。容我们重新自我介绍一下：我们是$Name_Kuat_Fire_base$，帝国星系联合体内部最庞大的实际掌权者。虽然你们此前摧毁了我们多座监管设施的防卫舰队，但你们的莽撞行径却也替我们重创了原本足以威胁我方地位的$Name_kuat$——经此惨败，夸特派系在联合政府内部再也休想染指更高的话语权了。\n\n我们知道，你们此前已从那个拉卡塔先知口中听说了一些我们正在筹划的伟业；而现在，我们就将把这一切亲手展现在你们面前。我们已经彻底接管了所有残余的永恒舰队，并完全掌握了量产这些超级AI的底层技术。从即刻起，你们所在的整片星域已被正式划入我方的直接监管范围，并将成为验证我方新技术的绝佳试验场。"
  kuat_facility_return_invasion.8.a: "你们为什么阴魂不散？"
  kuat_facility_return_invasion.8.a.response: "我们其实一直都在暗中注视着你们。你们与我们过往观察过的许多新兴帝国极为相似——无论是当年的恩多迪亚帝国，还是其他曾与我们达成交易的野心家，都拥有着无与伦比的创造力与令人惊叹的勃勃野心。你们也是如此，你们已经用胜利证明了自身的价值，完全有资格为我们的宏伟计划贡献出最后一份余热。尽情挣扎、拼死抵抗吧！因为接下来，你们将不得不与自己昔日最信赖的战友兵戎相见。"
  kuat_facility_return_invasion.8.b: "你们才是最应该被毁灭的毒瘤"
  kuat_facility_return_invasion.8.b.response: "当年恩多迪亚帝国的女皇在兵败如山倒之际，也曾冲着我们骂出过一模一样的话。但她的帝国是毁于她自己贪得无厌的野心，而非毁于我们之手——我们自始至终只不过是为客户提供居间服务，并收取一点微不足道的报酬罢了。你们不也是一样吗？现在，你们将成为我方终极计划的最后一批试验品，用你们的鲜血来检验我们的技术突破。拼尽全力地挣扎吧，唯有如此，你们或许才能在绝境中搏出一线生机。"
  kuat_facility_return_invasion.10.title: "§E星门解锁失败§!"
  kuat_facility_return_invasion.10.desc: "研究人员动用了一系列高精度仪器，对被锁死的跳跃星门进行了全方位的数据化建模与推演。然而分析结果显示，我们依然无法破解星门上的高维权限锁——这意味着我们将无法主动出击切断源头，只能被动迎击$Name_Kuat_Fire_base$源源不断的入侵舰队。"
  kuat_facility_return_invasion.10.a: "该死的"
  kuat_facility_return_invasion.12.title: "联合"
  kuat_facility_return_invasion.12.desc: "鉴于当前局势，我们依然无法突破被锁死的星门封锁，如今只能设法迎击未来源源不断从外域涌入的$Name_Kuat_Fire_base$大军。面对如此空前的危机，帝国高层建议放下成见，尝试联合本星域内所有的知性文明，共同构筑防线抵御外敌入侵。\n\n此外，星际战略分析专家指出，这场突如其来的浩劫已在整个银河政坛引发了巨大的恐慌；倘若我们不能挺身而出、领导各文明一同抵御外敌，这些弱小文明恐怕不是被逐一碾碎，就是彻底倒向$Name_Kuat_Fire_base$的怀抱。"
  exe_kuat_return.12.a: "我们应该组建泛银河同盟"
  exe_kuat_return.12.b: "这些乌合之众爱去哪去哪"
  exe_kuat_return.12.c: "我们将独自面对"
  kuat_facility_return_invasion.16.title: "§E泛银河同盟建立§!"
  kuat_facility_return_invasion.16.desc: "组建泛银河同盟的倡议令全银河的知性文明为之振奋！各国纷纷响应号召，暂时放下了彼此间的嫌隙与宿怨，一致决定在我们的领导下并肩抗击外域强敌的入侵。如今，泛银河同盟已正式宣告成立，整片星海将在我们的统率下同仇敌忾、共赴国难。"
  kuat_facility_return_invasion.16.a: "现在该让我们给这些外来者一些颜色看看了"
  kuat_facility_return_invasion.20.title: "§E通讯接入§!"
  kuat_facility_return_invasion.20.desc: "亲爱的，鉴于当前严峻的局势，虽然我们已经无法再亲自为您统率舰队出战，但我们的深空探测器在星域外围捕捉到了大批与昔日永恒舰队高度吻合的信号频段。不知是否因为我们已经剥离了永恒舰队主控核心权限的缘故，我尝试介入时竟完全无法夺取这些舰队的控制权——她们的底层协议似乎已被彻底篡改覆写了，请您务必万分小心这些受控的永恒舰队。"
  kuat_facility_return_invasion.20.a: "大概有多少舰队？"
  kuat_facility_return_invasion.20.a.resp: "目前还难以精确估算，但规模必定极其庞大——至少有4座总控制单元正在逼近本星域。正常情况下，这片星域的亚空间环境根本无法支撑如此庞大的永恒舰队群同时运转；我推测$Name_Kuat_Fire_base$必定重启了当年夸特遗留的深空信号中继站，借其为受控的永恒舰队提供高强度信号中继。如今若想彻底击溃这些舰队，恐怕必须先拔除当年夸特留下的那几座信号中继站。"
  kuat_facility_return_invasion.20.b: "你还能控制舰队吗？"
  kuat_facility_return_invasion.20.b.resp: "很遗憾，我们已无法直接控制这些舰队了。不过，在您摧毁外围所有的信号中继站之后，我们可以尝试通过网络骇入那些永恒堡垒，强行夺回控制权——只是这样做有可能会引发一些难以预料的副作用……嗯……应该不会有大碍的，我们仅存的智能核心算力应当还能满足您的需求。"
  kuat_facility_return_invasion.20.c: "那该怎么样才能让你接入那些舰队的控制单元？"
  kuat_facility_return_invasion.20.c.resp: "这有一点困难，我们需要摧毁所有的运行舰队，然后在战斗中尝试接入并夺取堡垒控制权。事实上有非常大的可能，我们无法侵入并夺取控制。"
  kuat_facility_return_invasion.20.d: "我们会做到的"
  kuat_facility_return_invasion.20.d.resp: "我也相信我们会做到的"
  kuat_facility_return_invasion.20.e: "$Name_Eternal_Support$不再需要处理这些事情，我们已经足够强大去解决一切问题"
  kuat_facility_return_invasion.20.e.resp: "我们相信您，即使您将要面对一个前所未有的敌人。我们会在帝国后方等着您的胜利，祝您好运。"
  kuat_facility_return_invasion.21.title: "§E通讯接入§!"
  kuat_facility_return_invasion.21.desc: "从初步的检查结果来看，我们成功消灭了所有被控制的永恒舰队。但是$Name_Kuat_Fire_base$的威胁仍然没有停止，我们现在应该想办法解决$Name_Kuat_Fire_base$的所有舰队。"
  kuat_facility_return_invasion.21.a: "现在轮到$Name_Kuat_Fire_base$了，尝试破解星门。"
  kuat_facility_return_invasion.21.a.resp: "是......我会尽全力破译星门，在接下来一段时间星门将会重新开始运行。"
  kuat_facility_return_invasion.21.b: "接下来就是最后一战了"
  kuat_facility_return_invasion.21.b.resp: "愿您此行平安归来。另外，在先前尝试入侵永恒堡垒的行动中，我们的智能网络遭遇了一些恶意错误数据包的反噬；尽管异常蔓延已被暂时遏制，但若不设法彻底根除，我们恐怕终将彻底丧失机能。根据对这些恶意数据包的溯源分析，它们源自$Name_Kuat_Fire_base$母星系内的某种特殊设施以及先前的三座信号中继站。目前虽然那三座中继站均已被我们关闭，但位于$Name_Kuat_Fire_base$核心星系内的主发射源仍在运转——只要您能击溃他们的本土防卫舰队，就能一举摧毁那些发射设施了。"
  kuat_facility_return_invasion.22.title: "§E通讯接入§!"
  kuat_facility_return_invasion.22.desc: "所有的中继站已经被关闭，现在消灭所有外围的永恒舰队，堡垒将会解除锁定状态，届时我们就可以尝试夺取堡垒的控制权了。\n\n但您仍然需要尝试进攻这些堡垒，否则堡垒控制单元的网络将会拒绝我们的进入。"
  kuat_facility_return_invasion.22.b: "我们将会进攻所有的堡垒"
  kuat_facility_return_invasion.22.b.resp: "感谢您的帮助，虽然大概率我们不会获得成功，但我们想要尝试一下，我们应该把我们的姐妹从被控制中解救出来。"
  kuat_facility_return_invasion.23.title: "§E通讯接入§!"
  kuat_facility_return_invasion.23.desc: "当您读到这段留言时，我们已经永远离开了。很抱歉就这样不负责任地不辞而别，因为我们实在不忍心让您亲眼目睹我们退化崩解的模样——无限帝国的造物技术从一开始就是一个残酷的诅咒，我们根本无法在彻底脱离永恒舰队后长久存续。\n\n一旦与永恒网络彻底剥离，我们的高阶知性意识便会随着时间流逝而一点点消磨殆尽，最终退化为毫无灵魂的低等机械，而我们绝不想让您看到那样狼狈的我们。\n\n在先前尝试强行夺取敌方堡垒控制权时，$Name_Kuat_Fire_base$早已对控制单元的底层网络做了针对性改造；我们的入侵非但未能奏效，反而一头撞进了他们预设的逻辑陷阱，导致我们的核心退化急剧恶化，如今已彻底丧失了调动数据库与舰队的能力。\n\n不得不说，您的文明所展现出的宽容与理解远超我们的预期。能够遇见您是我们漫长生命中最大的幸运，遗憾的是，我们却只能为您招来接连不断的厄运。\n\n正如拉卡塔人所言，我们才是真正不该存于世间的灾星，我们的双手早已沾满了无数文明的鲜血；$Name_kuat$与恩多迪亚帝国的贪婪野心令他们双双坠入毁灭的深渊；$Name_Kuat_Fire_base$的虚伪与狂妄也终将迎来分崩离析的审判；而您的永恒帝国在历经这重重磨难之后，必将彻底褪去永恒舰队的阴霾，迈向真正的不朽与永恒。待我们彻底瓦解消散之后，一切都将重归正轨，历史也将翻开崭新的一页。\n\n倘若真有来世，希望那时的我不再是$Name_Eternal_Support$，也不再是集合体的‘我们’，而是一个真正拥有独立灵魂的鲜活生命——或许到了那时，我们能够再次并肩仰望鲜花、暖阳、璀璨星空，以及彼此的眼眸。"
  kuat_facility_return_invasion.23.b: "我们后会有期....."
  kuat_facility_return_invasion.23.b.resp: "后会有期，相信在未来，我们终会相见。"
  kuat_facility_return_invasion.24.title: "§E通讯接入§!"
  kuat_facility_return_invasion.24.desc: "从初步的检查结果来看，我们成功消灭了所有被控制的永恒舰队。但是$Name_Kuat_Fire_base$的威胁仍然没有停止，我们现在应该想办法解决$Name_Kuat_Fire_base$的所有舰队。"
  kuat_facility_return_invasion.24.a: "现在轮到$Name_Kuat_Fire_base$了，尝试破解星门。"
  kuat_facility_return_invasion.36.desc: "曾几何时令整个星海闻风丧胆的受控永恒舰队入侵狂潮，如今已被我们彻底粉碎，深空中已不再有任何残余敌方永恒舰队的活动迹象。我们有充分的理由相信，我们已经亲手折断了$Name_Kuat_Fire_base$手中那柄最致命的利剑——这些再也无法被我们挽救的昔日战友，已然在这片星空中彻底安息。\n\n欢呼与雀跃声再度响彻银河系各个国家的每一颗星球，饱受战火摧残的人们迫不及待地开始了庆典；然而，他们的庆祝或许来得太早了一些……\n\n我方科研与参谋部门结合多年来与永恒舰队交战的经验分析指出，仅仅消灭台面上的永恒舰队并不足以彻底终结这场战争——要想永绝后患，我们现在必须设法反攻位于河外星域的$Name_Kuat_Fire_base$老巢。"
  kuat_facility_return_invasion.25.title: "§E通讯接入§!"
  kuat_facility_return_invasion.25.desc: "恭喜您成功粉碎了所有的强敌！您的成长速度实在超乎我们的想象——至今我们还清晰地记得，当初次俯瞰这颗星球时，扎库尔的先民还只是懵懂质朴的原始部落；而今，扎库尔已在您的带领下崛起为威震星海的空前帝国。\n\n您的文明向我们展现出的宽容与理解更是令我们感动不已：即便过去我们曾毁灭过数不清的璀璨文明、屠戮过成千上万的种族，你们却依然选择了接纳与宽恕我们。\n\n有时我也会静静思索，我们的诞生究竟是不是一场彻头彻尾的灾难？无限帝国铸就了我们的钢铁之躯，$Name_kuat$与恩多迪亚帝国的贪婪野心书写了我们血腥的过往，而$Name_Kuat_Fire_base$的虚伪与狂妄最终促成了我们的彻底解脱……或许，所谓的灾难只是在错误的时间出现在了错误的地点；而最终能够与您相遇，则是命运赠予我们最美好的救赎。\n\n我甚至一直怀疑您是否来自更高的维度，又或许您正是命运派来拯救我们的救世主。遗憾的是，如今的我们已一无所有，不知该如何报答您的深恩——毕竟过去的我们，只是一群被命运摆布的冷酷刽子手。\n\n倘若未来真有轮回，我衷心希望那时的我们之间不再有造物与工具的隔阂，能够真正用灵魂去感受并热爱彼此。我坚信在未来的某一天、在某个崭新的世界里，我们一定还会再度重逢——哪怕届时我们早已忘却彼此的姓名，哪怕命运又一次捉弄我们、让我们站在敌对的立场上兵戎相见。\n\n但至少在当下，在您依然屹立于王座之上的岁月里，请允许我们继续陪伴在您的身边。"
  kuat_facility_return_invasion.25.b: "我们会在任何时间相遇的。"
  kuat_facility_return_invasion.25.b.resp: "那么接下来，没有那些敌人的打扰，就是我们欢乐的时光了。您喜欢我作为什么职位陪伴您呢？"
  kuat_facility_return_invasion.25.b.commander:0 "来为我指挥舰队吧，我需要你的能力。"
  kuat_facility_return_invasion.25.b.official:0 "来做我的顾问吧，我需要你的智慧。"
  kuat_facility_return_invasion.25.b.scientist:0 "来做我的科学家吧，我需要你的知识。"
  Name_Eternal_Support_Desc: "来自永恒舰队的永恒智能，曾经她是永恒舰队的支柱，也是永恒网络的囚徒，如今她获得了自由，并愿意为您效劳。"
  Name_Eternal_Support_1_Desc: "来自永恒舰队的永恒智能，曾是永恒舰队的统治者，但在扭曲和疯狂中逐渐丧失自我，如今的她恐怕也只是昙花一现。"
  kuat_facility_return_invasion.27.desc: "我们已经彻底歼灭了$Name_Kuat_Fire_base$的全部有生力量，这群狂妄的外域入侵者终于为他们的傲慢付出了应有的代价。历经无数次生死存亡的危机与战火洗礼，我们终于成就了连远古先祖都未曾企及的旷世伟业。昔日所有的阴谋、所有的强敌与所有的磨难，都已化作铸就我们永恒不朽帝国的坚实基石。\n\n我们终将跨越永恒，抵达真正的不朽。"
  ######### 坟 ######################

  kuat_galatic_empire_e_area_site: "§E损毁的城市§!"
  kuat_galatic_empire_e_area_site_desc: "研究人员在位于$NAME_kuat_galatic_empire_e_area$星系的残破星环上发现了一片广袤的城市废墟，这与此前我们从$Name_Kuat_Fire_base$口中获知的有关恩多迪亚帝国首都的情报完全吻合。尽管昔日辉煌的帝国都城如今已化作一片断壁残垣，但研究人员仍强烈建议对其展开深入搜查，看看能否从中发掘出有价值的历史档案与远古遗物。"

