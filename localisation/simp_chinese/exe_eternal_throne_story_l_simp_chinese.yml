  col_kuat_commanderline_nexus_tt:0 "整个星球遍布自动化生产线，一切皆服务于最高效率的生产与发展。除必要的运营与维护工程师外，绝大多数人口已转化为数字生命形态保存；在数字永生的诱惑下，大部分居民放弃了繁衍需求，星球自然人口增长已完全停止。\n§Y按照星球大小提供产出，且享受对应岗位类型修正。§!"
  col_kuat_commanderline_nexus_desc:0 "整个星球遍布自动化生产线，一切皆服务于最高效率的生产与发展。除必要的运营与维护工程师外，绝大多数人口已转化为数字生命形态保存；在数字永生的诱惑下，大部分居民放弃了繁衍需求，星球自然人口增长已完全停止。\n§Y按照星球大小提供产出，且享受对应岗位类型修正。§!"
