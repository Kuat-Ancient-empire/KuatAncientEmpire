  Name_Zakuul_Star: "扎库兰巨星"
  origin_eternalthrone: "§E【夸特的黎明】永恒王座§!"
  origin_eternalthrone_desc: "这是一颗位于边缘世界外的平凡行星，但高度的自动化设施与遍布各处的遗迹注定了它的平凡只是一时的。当人们开始逐渐发掘并运用属于古代先驱者的科技时，一股强大的力量正在暗中酝酿。如今我们已迈入浩瀚星空，虽仍有诸多事物尚无法理解，但这一切都不会持续太久……"
  origin_eternalthrone_effect: "§H我们将作为永恒帝国开始这场游戏§!\n将使用§E扎库尔§!星系开局\n我们将使用永恒理想城开局\n§Y该起源联机禁用，无联机相关适配，无法预测会发生什么§!\n\n该起源属于《夸特的黎明》剧情后传。"
  START_SCREEN_ETERNAL_ORIGIN: "长久以来，我们的[GetSpeciesName]物种在新领袖的带领下迎来了全球统一。然而在广袤的银河之中，我们尚且只是一粒尘埃，我们的帝国绝不能就此停息。几个世纪以来，我们完成了工业与科技的飞跃，建成了历史上最为庞大宏伟的都市；我们坚信这绝不会是最后一座，我们终将让繁荣遍布整个银河。\n\n这是一颗位于边缘世界外的平凡行星，但高度的自动化设施与遍布各处的遗迹注定了它的平凡只是一时的。当人们开始逐渐发掘并运用属于古代先驱者的科技时，一股强大的力量正在暗中酝酿。如今我们已迈入浩瀚星空，虽仍有诸多事物尚无法理解，但这一切都不会持续太久……"
  START_SCREEN_SHADOW_ORIGIN: "长久以来，我们的[GetSpeciesName]物种在新领袖的带领下迎来了全球统一，但内部强大的分裂势力依然存在，最终这场统一在混乱中分崩离析，我们的文明也随之陷入了长达百年的黑暗时代。\n\n直到$Name_kuat$的出现，他们为我们的未来指明了全新的方向。$Name_kuat$的光辉自此笼罩了我们的整个世界——祂既崇高，又傲慢至极。在这冷漠的光辉之下，我们苟延残喘，企图构筑起哪怕一丝属于自己的阴影，以躲避那残酷的烈光。而如今，我们将亲手创造属于自己的辉煌，我们的故事才刚刚开始……"
  exe_zakuul_System_NAME: "扎库尔"
  exe_zakuul_System_DSEC: "扎库尔曾经拥有辽阔的南部海洋与覆盖行星表面的广袤沼泽。星球上的沼泽是一片半固态区域，遍布着高大茂密的林木。与奥德森类似，这颗行星也与处于光明面和黑暗面平衡之中的原力有着独特的联系。尽管随着我们的开发与文明的演进，整个核心世界已完全被都市所覆盖，但扎库尔依旧保持着它生机勃勃的活力。"
  ss_auto_deposits: "§E自动矿场§!"
  ss_auto_deposits_desc: "扎库尔上的深层矿脉。"
  ss_Solarfarm: "§E太阳能农场§!"
  ss_Solarfarm_desc:0 "先进的太阳能农场，在保证作物丰收的同时，还能将多余的太阳能转化为能量。"
  ss_volatile_motes: "§E微粒生产设施§!"
  ss_volatile_motes_desc: "这座生产设施可以生产一种不稳定微粒物质。"
  ss_crystallinemin: "§E晶体矿脉§!"
  ss_crystallinemin_desc: "行星上特有的晶体矿脉，我们可以对其进行开采并加以利用。"
  ss_gaseous_eruption: "§E瓦斯沼泽§!"
  ss_gaseous_eruption_desc: "这片沼泽上充斥着一种叫做异星天然气的特殊资源。"

  building_eternal_alloys_Forge: "§E永恒锻造厂§!"
  building_eternal_alloys_Forge_desc: "位于扎库尔的锻造厂，凭借先进的技术可锻造出大量合金材料，以供舰队建设或其他项目使用。"
