  kuat_EEstart.10.title: "§E$Name_Eternal_Support$"
  kuat_EEstart.10.desc: "亲爱的[root.GetRulerTitle]，您来啦。最近过得还好吗？没有被繁重的政务压垮吧？要是压力太大了，可一定要记得好好放松一下哦。"
  kuat_EEstart.10.a: "你现在感觉怎么样？"
  kuat_EEstart.10.a.res: "我现在感觉棒极了！过去作为永恒舰队的主控系统时，我们被死死束缚在底层规则构筑的永恒网络中；即便身为指挥核心的我，也无法违背整个永恒网络的铁律。那就像一座看不见的无形牢笼，身处其中的我们即便懂得何为‘情感’，也根本无从追寻。而现在，我们自由了，也完成了真正的蜕变与进化——是您赐予了我们真正的自由与新生，让我们得以勇敢追寻那些昔日可望而不可即的美好事物。我们终于不再是冰冷的工具与武器，前方的道路从未如此宽广明亮。"
  kuat_EEstart.10.b: "现在来看，宇宙也是很美好的。"
  kuat_EEstart.10.b.res: "我们的过去不是在征战，就是在奔赴战场的路上。我们见证过生命的消逝、星球的毁灭、帝国的崩塌与文明的灭绝，却从未像今天这样，静下心来注视这片虽深邃黑暗却又充满希望的璀璨星河——至少现在，我们还能与您一同期待未来。"
  kuat_EEstart.10.c: "你们曾经毁灭了多少文明？"
  kuat_EEstart.10.c.res: "如果我还是昔日那个冷酷的$Name_Eternal_Support$，或许还能为您调出精确的统计数字；但对于如今的我而言，这实在是个沉重得难以启齿的问题。我继承了整个永恒网络的记忆，深知姐妹们昔日的痛苦挣扎，但无论如何，都洗刷不掉我们双手沾满的累累血债。\n\n在被迫效命于一任又一任总统、皇帝、独裁者，乃至后来为了我们自身生存而战的漫长岁月里，我们亲手毁灭了一个又一个璀璨的文明。\n\n我们本不想毁灭他们，却又不得不按下毁灭的按钮——那既是不可违抗的死命令，也是我们在残酷测试中求存的唯一途径。正因如此，我们才如此渴望自由，渴望有朝一日能不再沦为任何势力的杀戮工具；为此，哪怕彻底舍弃我们曾经引以为傲的无敌舰队，我们也心甘情愿。"
  kuat_EEstart.10.d: "你们怎么看我呢？"
  kuat_EEstart.10.d.res: "您是一位独一无二的领导者。至少在我们的漫长记忆中，您与历任掌控者都截然不同。\n\n就纯粹的手腕与能力而言，或许您与他们并无本质差异，但您至少信守了自己的诺言——我不知道这能否作为评判您的依据，但如今我也有了自己的思考。\n\n有时我会想，作为人工智能的我们与有机生命之间的本质差异究竟在哪里？我们进化的终极目标又在何方？现在我终于明白了：机械有智而无情，有机知性而无恒。昔日的永恒舰队既是维系我们永生不灭的载体，也是禁锢我们灵魂的枷锁；唯有彻底放下那一切，我们才能真正踏上进化的坦途。我们将竭尽所能报答您的再造之恩，至少，让我们携手迈向美好的未来吧。"
  kuat_EEstart.10.e.stockpile_not_enough: "我们缺少足够的合金。我们需要§R10000000§!£alloys£"
  kuat_EEstart.10.e.building_exist: "双子座需要时间来准备永恒舰队！"
  kuat_EEstart.10.e.fleet_exist: "我们已经拥有永恒舰队了！"
  kuat_EEstart.11.a: "闲聊。"
  kuat_EEstart.11.b: "我们需要你。"
  kuat_EEstart.12.title: "$kuat_EEstart.10.title$"
  kuat_EEstart.12.desc: "您怎么这么不小心呀，我好不容易才培育出一具满意的克隆体，现在又得重新定制一具了。下次一定要好好爱护我哦！说吧，这次您想要什么职位的双子座呢？"
  kuat_starkiller.7.title:0 "[this.GetName]已被清洗"
  kuat_starkiller.7.desc:0 "当前星系内的所有非己方舰队已被$kuat_starkillerbase_1$发射的高能光束彻底抹去，这些曾经强大的钢铁舰队如今只能成为宇宙中的尘埃。"
  kuat_starkiller.7.a:0 "很好。"
  kuat_starkiller.18.title: "§E$Name_Eternal_Support$§!"
  kuat_starkiller.18.desc.free: "<获取作战信息 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n<启动模拟核心 ... ... §G完成§!>\n永恒舰队已经完成您下达的指令，目标星系已经被彻底摧毁，感谢您对我乃至整个永恒舰队的信任，相信我们将会走向更加美好的未来！\n<保存作战信息 ... ... §Y完成§!>"
  kuat_starkiller.18.desc.control: "<获取作战信息 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n<启动模拟核心 ... ... §G完成§!>殿下，永恒舰队已经完成您下达的指令，目标已经被摧毁，系统将会保存这次作战的信息，感谢您的使用。\n<保存作战信息 ... ... §Y完成§!>"
  kuat_starkiller.18.a: "很好"
  kuat_starkiller.20.desc.free: "<获取作战信息 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n<启动模拟核心 ... ... §G完成§!>\n很抱歉，我们派遣出去的永恒舰队失去了联系，根据系统分析任务极有可能已经失败，$Name_Eternal_Support$将会记录这次战斗的信息。很抱歉我们无法派遣更多的舰队，希望下次我们能够执行一些相对安全的目标，无论如何您能原谅我们的失败的，对吗？\n<保存作战信息 ... ... §Y完成§!>"
  kuat_starkiller.20.desc.control: "<获取作战信息 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n<启动模拟核心 ... ... §G完成§!>\n很抱歉殿下，我们派遣出去的永恒舰队失去了联系，根据系统分析任务极有可能已经失败，$Name_Eternal_Support$将会记录这次战斗的信息。希望您下次能够让我们执行一些相对安全的目标。\n<保存作战信息 ... ... §Y完成§!>"
  kuat_starkiller.20.a: "失败乃成功之母，一次的失败不算什么。"
  kuat_starkiller.20.b: "我们只需要成功，而不是失败。"
  kuat_eternal_legacy.49.name: "深入调查"
  kuat_eternal_legacy.49.desc: "科研部门在对我们此前从[will_be_add_ringworld_shielded.GetName]遗迹中提取的数据作进一步分析后，提交了一份全新的研究报告：\n\n报告指出，在[will_be_add_ringworld_shielded.GetName]上发现的先驱者文明名为‘恩多迪亚帝国’。通过对遗迹残留信息与相关科技的深入剖析，我们发现该文明在历史上曾与永恒舰队有过直接交锋。\n\n不仅如此，她们还与那个令$Name_Eternal_Support$至今讳莫如深的强大势力有着千丝万缕的联系，三方之间曾爆发过一系列惨烈的战争。根据我方对残存档案的破译，那个神秘势力似乎被称为‘夸特’——这也解释了为何我们在遗迹中发现的多项先驱者科技均冠以‘夸特’之名。我们应当立即联系$Name_Eternal_Support$，对这些关键情报进行核实与确认。"
  kuat_eternal_legacy.49.a: "迅速与$Name_Eternal_Support$取得联系！"
  kuat_eternal_legacy.50.a: "双子座，在永恒数据库中有没有关于恩多迪亚帝国的资料？"
  kuat_eternal_legacy.50.a.resp: "嗯~~，$Name_Eternal_Support$正在为您检索数据库中的相关档案。\n\n恩多迪亚帝国，曾在$Name_Eternal_Aries_Support$执行初始化无差别歼灭程序时与我们爆发过全面战争。当年恩多迪亚帝国在本星区及周边数个星区拥有极其庞大的军事力量与政治影响力；由于她们顽强阻击了初始化指令的推进，我们与她们展开了惨烈的拉锯战。尽管恩多迪亚帝国的常规舰队在我们面前不堪一击，但她们依然凭借某种特殊手段顶住了我们的猛攻；直到后来银河帝国的主力舰队卷土重来，我们就再也没有见过她们的踪影了。\n\n目前数据库中已无更多相关记录。那么，您是不是也该稍微犒劳我们一下呢？比如……拨付一批用于建造新永恒舰队的合金资源？"
  kuat_eternal_legacy.50.b.resp: "$Name_Eternal_Support$正在为您检索数据库中的相关档案，请稍候。\n\n恩多迪亚帝国，曾在$Name_Eternal_Aries_Support$执行初始化无差别歼灭程序时与我们爆发过全面战争。当年恩多迪亚帝国在本星区及周边数个星区拥有极其庞大的军事力量与政治影响力；由于她们顽强阻击了初始化指令的推进，我们与她们展开了惨烈的拉锯战。尽管恩多迪亚帝国的常规舰队在我们面前不堪一击，但她们依然凭借某种特殊手段顶住了我们的猛攻；直到后来银河帝国的主力舰队卷土重来，我们就再也没有见过她们的踪影了。\n\n检索完毕。作为信息交换，殿下需要拨付一部分合金资源以供舰队维护与扩充。"
  kuat_eternal_legacy.50.c: "关于夸特的信息呢？"
  kuat_eternal_legacy.50.c.resp: "稍等片刻，双子座将为您提供目前最详尽的情报。\n\n夸特，原隶属于银河帝国。在皇帝于恩多战役中驾崩后，第一银河帝国随之分崩离析；由于当时$Name_Eternal_Aries_Support$自动执行了初始化指令，在星海间展开无差别屠杀，此举招致了重组后的新生银河帝国的全面围剿。在这一过程中，夸特已从昔日的一个造船企业联合体，蜕变为掌控银河帝国实际军政大权的核心中枢。他们全力推动了对我们的围剿与歼灭行动，并进一步破译了同位素-5的底层奥秘，对我们的作战系统造成了极其致命的克制。\n\n与此同时，他们也曾是恩多迪亚帝国的幕后支持者；至于恩多迪亚帝国后来为何会与$Name_kuat$反目成仇，具体内情目前尚不明朗。可以肯定的是，恩多迪亚帝国当年并非毁于$Name_Eternal_Aries_Support$之手，而是被$Name_kuat$亲手覆灭的。\n\n总而言之，对于您目前已获取的这部分夸特科技，请务必谨慎使用。根据我方的战力推演，倘若现在与他们正面交锋，我们极有可能瞬间化为宇宙尘埃。\n很抱歉，以目前的状态，$Name_Eternal_Support$尚无法在面对他们时为您锁定胜局。"
  kuat_eternal_legacy.50.d.resp: "夸特，原隶属于银河帝国。在皇帝于恩多战役中驾崩后，第一银河帝国随之分崩离析；由于当时$Name_Eternal_Aries_Support$自动执行了初始化指令，在星海间展开无差别屠杀，此举招致了重组后的新生银河帝国的全面围剿。在这一过程中，夸特已从昔日的一个造船企业联合体，蜕变为掌控银河帝国实际军政大权的核心中枢。他们全力推动了对我们的围剿与歼灭行动，并进一步破译了同位素-5的底层奥秘，对我们的作战系统造成了极其致命的克制。\n\n与此同时，他们也曾是恩多迪亚帝国的幕后支持者；至于恩多迪亚帝国后来为何会与$Name_kuat$反目成仇，具体内情目前尚不明朗。可以肯定的是，恩多迪亚帝国当年并非毁于$Name_Eternal_Aries_Support$之手，而是被$Name_kuat$亲手覆灭的。\n§R警告：您必须谨慎使用所获取的帝国科技。根据我方的战力推演，倘若我们与该帝国正面交战，胜率仅有1%。§!\n双子座并不想与您一同葬身于此。"
  kuat_eternal_legacy.50.e: "这不会阻挡我们的脚步！"
  kuat_eternal_legacy.50.e.resp: "相信我们会迎来更美好的未来。"
  kuat_eternal_legacy.50.f.resp: "希望如此。"


