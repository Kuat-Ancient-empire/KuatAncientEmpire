  tr_eternal_building_research_center_2: "§E永恒科研中心§!"
  tr_eternal_building_research_center_2_desc: "一座用于研究与科技开发的大型复合中心，可容纳更多科研人员，同时也能为我们揭示更多关于先驱者的秘密。"

  building_eternal_volatile_focer: "§E永恒易爆微粒合成工厂§!"
  building_eternal_volatile_focer_desc: "姑且不论明显的安全隐患，人造易爆微粒本身就是一项极其精密且复杂的工作，而这种先进的合成工厂远比其他同类设施更加安全、高效且高度自动化。"
  tr_eternal_building_volatile: "§E永恒易爆微粒合成工厂§!"
  tr_eternal_building_volatile_desc: "姑且不论明显的安全隐患，人造易爆微粒本身就是一项极其精密且复杂的工作，而这种先进的合成工厂远比其他同类设施更加安全、高效且高度自动化。"

  building_eternal_exotic_focer: "§E永恒瓦斯精炼厂§!"
  building_eternal_exotic_focer_desc:0 "异星天然气虽然可以人工合成，但工序颇为繁琐，而这座瓦斯精炼厂能够高效地解决这些难题。"
  tr_eternal_building_exotic: "§E永恒瓦斯精炼厂§!"
