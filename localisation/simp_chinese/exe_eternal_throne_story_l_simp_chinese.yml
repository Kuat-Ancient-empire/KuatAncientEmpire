  situation_find_infinite_system: "§E解析坐标信息§!"
  situation_find_infinite_system_type:0 "$situation_find_infinite_system$"
  situation_find_infinite_system_desc:1 "我方科研团队近期依靠$Name_Eternal_Support$庞大的超级计算阵列，成功将拉卡塔先知留下的古老星图坐标格式转换为了帝国通用的星图数据格式——这意味着我们如今已能通过数据解析，锁定拉卡塔先知所说的那片隐秘星域了。\n\n根据从$Name_Eternal_Support$历史数据库中调取的相关记录显示，我们要寻找的目标星域曾是$Name_kuat$的重要驻军星团。但愿夸特驻军早已撤离了那片星域，否则我们将不得不为此付出更大的代价。\n\n总而言之，我们既可以追加科研投入以尽快锁定精确坐标，也可以按部就班地稳步推进解析。无论如何，现在是时候展开行动了。"

