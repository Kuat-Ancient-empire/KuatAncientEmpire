  site_Eternal_outpost: "§E亚空间信号§!"
  site_Eternal_outpost_intro: "我们的深空传感器在近期的一次日常扫描中，于首都星系内的一颗星球上探测到了一股本不该出现于此的快子信号。与我们常见的常规快子信号不同，此类信号在正常宇宙环境下理论上只会在黑洞的视界范围内产生。因此，首席物理学家强烈建议针对这股反常的信号展开专项调查，深入探明其源头势在必行。"
  kuat_eternal_legacy.1.a: "加紧调查！"
  Eternal_legacyancient_chain_title: "§E先驱者——堕落帝国的王座§!"
  Eternal_legacyancient_chain_desc: "我们的祖先曾在这片土地上繁衍生息，他们留下的古老史诗记载了我们的漫长历史。尽管其中许多记述看似虚无缥缈，但随着古籍中的记载被逐一证实，研究人员再也无法忽视这些传说。这一奇特现象引起了考古与科研部门的高度重视，他们请求对我们的过去展开全面调查，重新审视我们的古老历史。"
  Eternal_legacyancient: "§E遗迹数据"
  Eternal_legacyancient_1_poi: "§E亚空间信号§!"
  Eternal_legacyancient_1_poi_desc: "我们的深空传感器在近期的一次日常扫描中，于首都星系内的一颗星球上探测到了一股本不该出现于此的快子信号。与我们常见的常规快子信号不同，此类信号在正常宇宙环境下理论上只会在黑洞的视界范围内产生。因此，首席物理学家强烈建议针对这股反常的信号展开专项调查，深入探明其源头势在必行。"
  kuat_eternal_legacy.1.name: "§E亚空间信号§!"
  kuat_eternal_legacy.1.desc: "我们的深空传感器在近期的一次日常扫描中，于首都星系内的一颗星球上探测到了一股本不该出现于此的快子信号。与我们常见的常规快子信号不同，此类信号在正常宇宙环境下理论上只会在黑洞的视界范围内产生。因此，首席物理学家强烈建议针对这股反常的信号展开专项调查，深入探明其源头势在必行。"
  kuat_eternal_legacy.2.name: "§E未知能源信号§!"
  kuat_eternal_legacy.2.desc: "在对目标星球周边进行初步勘测时，科学团队在其附近空域探测到了一股未知的能源信号。\n\n然而，从探测器传回的数据来看，该区域的各项常规物理指标均处于正常范围内，这意味着我们无法通过常规的能源信号溯源方式快速锁定信源位置。\n\n对此，科学家们一时也没有头绪，对目标行星地表展开实地搜索或许是目前唯一可行的办法。"
  kuat_eternal_legacy.2.a: "继续调查吧"
  kuat_eternal_legacy.3.name: "§E干扰§!"
  kuat_eternal_legacy.3.desc: "科研小组已经就位，并即刻展开了正式的搜寻调查工作。但很快，前线人员就遇到了前所未有的麻烦。\n\n技术人员报告称，由于某种未知原因，我们的远程探测器在飞出一定距离后，便会突发一系列不可逆的故障，随后迅速失灵坠毁。\n\n因此，团队只能依靠老式的有线控制设备对行星地表展开地毯式排查，而这也大大延长了考古团队所需的时间。\n\n终于，经过一番艰苦卓绝的搜寻，团队总算在星球的一处小峡谷中锁定了信号的具体位置，并对周边环境展开了进一步调查。\n\n调查结果表明，该区域内存在着一个独立于行星自身重力场的诡异引力场，而能够引发此类现象的物质或造物绝非寻常之物。基于此，科研团队已即刻向引力场附近转移，以期取得更大的收获。"
  kuat_eternal_legacy.3.a: "有趣"
  kuat_eternal_legacy.4.name: "§E不一样的舰船§!"
  kuat_eternal_legacy.4.desc:0 "在工程设备的辅助之下，我们的科考队成功开辟出了一条直达目标区域的道路，并顺利地在其附近设立了临时考察站。\n\n然而，从肉眼上看，这片区域里只有一堆又一堆的乱石，便携雷达的数据也表明这里除了一望无际的岩石外什么都没有。\n\n正当科学家们以为调查无果、准备打道回府时，一架在平流层执行日常巡逻的无人机突然因引擎受损丧失了动力，并在指挥部的指令下转入滑翔状态，试图安全迫降。\n\n然而没过多久，这架正在低速滑翔的无人机却在半空中撞上无形屏障，瞬间化作了一团火球。目睹了这一切的科学团队立刻意识到，这片区域内必定存在着某种能够混淆光学视线与电子信号的隐形力场，当即发射了一枚EMP飞弹以过载该区域内的所有电子设备。\n\n事实证明，他们赌对了：一艘造型奇特的庞大外星战舰正静静停泊在他们眼前。"
  kuat_eternal_legacy.4.a: "有趣"
  kuat_eternal_legacy.5.name: "§E未知星域的永恒舰队§!"
  kuat_eternal_legacy.5.desc:0 "在揭开这艘战舰的神秘面纱后，我们的团队立刻对其展开了全面调查。\n\n从外观上看，这艘飞船风格独特的模块化设计不属于当今星海中的任何一个已知国家，反而与流传于我们民间传说中的‘神造战舰’极为相似。\n\n这立刻勾起了科研人员的浓厚兴趣：这难道仅仅是个巧合吗？怀着强烈的好奇心，团队迅速登上舰桥，开始对舰艇内部进行勘查。\n\n经过一番强行破门后，我们总算进入了战舰的内部舱室。这艘战舰的主体结构存在一定程度的受损，内部也已略显破败。经过一番搜寻，我们将目标锁定在几个用途尚不明确的舱室上。\n\n然而，由于全舰残留的图文与电子文档数量稀少，我们对该舰建造者语言系统的破译进展极其缓慢。"
  kuat_eternal_legacy.5.a: "这是巧合，还是命中注定？"
  kuat_eternal_legacy.6.name: "§E古代未知星域飞船§!"
  kuat_eternal_legacy.6.desc:0 "随着勘探人员的不断深入，我们对这艘战舰的整体探索也已接近尾声。从常规测量结果来看，这艘战舰规模并不算大，充其量只能算是一艘巡洋舰体量的中型舰艇。\n\n受限于这种中型战舰自身的结构特点，加之承重结构因岁月侵蚀已严重老化，其内部有不少舱室已严重损毁乃至坍塌，根本无法从中获取任何可用情报。\n\n在其余尚存的舱室中，除了在部分疑似船员起居室的舱壁上发现了一些形似文字笔画的未知星域纹理装饰外，科研人员基本一无所获。\n\n至于舰内为数众多的电子终端，大多已因我们先前的EMP打击而烧毁了电路，其中存储的数据也大都随之彻底损毁。\n\n但我们的团队认为，仅凭这艘飞船那神乎其技的隐蔽手段来看，它的技术含量绝不止于此。\n\n因此，对仅剩的最后几个舱室进行彻底检查势在必行。怀着这样的想法，我们对位于舰尾的一间疑似能源核心舱展开了调查。"
  kuat_eternal_legacy.6.a: "请继续"
  kuat_eternal_legacy.7.name: "§E异种科技§!"
  kuat_eternal_legacy.7.desc:0 "在使用定向炸药以最小损失为前提爆破了大门后，我们的科研人员进入了这座宏大的舱室。\n\n整个舱室整体上呈圆形，而其内部除了位于中央的反应堆芯外，都被大大小小的管道与机械结构所填满。由于管道间的缝隙过于狭小，且贸然破坏管道可能导致极其恶劣的后果，我们的团队只能释放出微型无人机来对中央堆芯展开调查。\n\n事实证明，我们的谨慎是正确的：能源室的中央压根就不是什么常规物质反应堆，而是某种将能量压缩到极致所打造而出的人造恒星体所供能的反应堆。在对其能源特征进行调查后，我们发现，先前发现的所有信号都是自它而始。\n\n由于星球本身特殊的地理特征，加之伪装力场的干扰，中央恒星堆的信号无法直接传递出去，仅剩几丝幸运逃脱了双重干扰的信号回荡在这片星空中。\n\n我们的社会学首席科学家在收到调查报告后表示，这座被命名为'同位素-5反应堆'的设施外观特征与我们传说的故事里对战舰动力的描述几乎相同。"
  kuat_eternal_legacy.7.a: "同位素-5？"
  kuat_eternal_legacy.8.name: "§E有点总比没有好§!"
  kuat_eternal_legacy.8.desc: "就在科研人员为这一重大发现而欢欣鼓舞时，意外陡生。留守的监测人员发现，受先前那枚EMP飞弹的影响，整艘战舰的电子控制系统已濒临崩溃。\n\n这直接导致能源舱中央的反应堆芯在短时间内陷入了极度不稳定的状态。研究人员推测，由于控制系统受损，全舰的物质输送管线可能已彻底瘫痪；而同位素-5构造体一旦失去外部物质的持续注入，便无法维持释能反应，最终将因燃料枯竭而自我瓦解。\n\n由于同位素-5构造体的瓦解会彻底改变舰体内部的引力平衡并导致主体结构崩塌，科研人员只得争分夺秒地完成对已控制舱室的抢救性调查。\n\n在进一步的搜寻中，我们找到了一批侥幸保存下来的实体文档，这极大地推动了语言破译组的工作进展。\n\n在破译了对方语言的基本规律与要素后，翻译组惊讶地发现，这艘未知星域战舰所使用的语言在发音语调上竟与我们先祖时代的古语颇为相似，只是其语法结构要复杂得多。此外，通过提取仅存的几台数据终端中的资料，科研团队成功掌握了这种由同位素-5构造体驱动的星舰的基本结构特征，并获取了部分有关同位素-5构造体物理性质的研究数据。\n\n不久之后，随着同位素-5构造体的彻底消散，除核心舱室外，大部分舰体都因失去力场维持而崩解坍塌，在短短数日内便分崩离析，化作了一条长达近两千米的残骸带。"
  kuat_eternal_legacy.8.a: "开始行动"

  site_Eternal_legacysatellite: "§E同位素-5构造体§!"
  site_Eternal_legacysatellite_intro: "从已解析的数据中，我们初步掌握了同位素-5构造体的工作原理与能量特征。事实上，这并非标准的同位素-5构造体，而是一种经过量子锁定的特殊同位素-5构造体。\n\n这种设计使其能够维持极为长久的运转，再加上持续注入某种我们尚无法理解的特殊物质，便可源源不断地为星舰提供近乎无穷的能量。不过，这种独特的构造也令其所驱动的核心机械智能产生了一些微妙的异变。"
  Eternal_legacyancient_2_poi: "§E同位素-5构造体§!"
  Eternal_legacyancient_2_poi_desc: "从已解析的数据中，我们初步掌握了同位素-5构造体的工作原理与能量特征。事实上，这并非标准的同位素-5构造体，而是一种经过量子锁定的特殊同位素-5构造体。\n\n这种设计使其能够维持极为长久的运转，再加上持续注入某种我们尚无法理解的特殊物质，便可源源不断地为星舰提供近乎无穷的能量。不过，这种独特的构造也令其所驱动的核心机械智能产生了一些微妙的异变。"
  kuat_eternal_legacy.10.name: "§E同位素-5信号§!"
  kuat_eternal_legacy.10.desc: "我们在最近的一次扫描中，再次发现了与上次那艘未知星域舰船同位素-5堆芯的信号特征类似的能量信号。科研部在将此次的信号与上次的样本进行比对后发现，本次探测到的信号反应和同位素-5反应堆的辐射相同。\n\n据此推断，我们怀疑这里很可能有一艘古代未知星域银河帝国的废弃舰船存在。我们需要科研团队即刻前往此处。"
  kuat_eternal_legacy.10.a: "同意，立即出发"
  kuat_eternal_legacy.11.name: "§E登陆§!"
  kuat_eternal_legacy.11.desc:0 "我们的科考团队成功抵达了目标行星上空，并按照惯例对星球环境进行了一次整体扫描。扫描结果显示，这颗星球的大部分地区似乎被笼罩在某种奇特的能量场之中。\n\n如果我们的团队贸然降落，他们携带的一切电子仪器都可能会被这股能量场干扰，进而无法正常工作。\n\n因此，我们的团队花了一段时间才在星球的北极点附近寻找到了一小片能量场相对较弱的着陆区，并在上传能量场数据后安全着陆。\n\n我们的科研中心在完成了对能量场特征的研究后认为，这极有可能是反应堆的安全阻隔场离线产生的结果：大量由于安全系统失控而从同位素-5堆芯中溢流而出的能量笼罩了整个星球的表面，并逐渐形成了这种特殊的能量场。\n\n因此，我们需要某种手段来减轻能量场对我们造成的不利影响，否则将无法开展更进一步的研究工作。"
  kuat_eternal_legacy.11.a: "立刻成立特殊项目组进行协助"
  kuat_eternal_legacy.12.name: "§E破碎的空间§!"
  kuat_eternal_legacy.12.desc:0 "随着从首都星区紧急调运而来的能量场抑制装置顺利抵达，我们的科研团队终于可以正式展开探查工作了。\n\n随着团队向目标区域逐渐靠近，科学家们发现眼前的部分景物出现了不自然的扭曲与变形。鉴于当地的气温与地质状况均在正常范围内，科研人员推测此处的空间本身可能因某种原因发生了一定程度的扭曲；而且随着他们离目标越来越近，周围的空间扭曲现象也变得愈发剧烈。\n\n慑于被卷入空间裂隙而一去不返的风险，科研团队放慢了推进步伐，终于在跋涉数月之后抵达了目标区域。\n\n当第一名先锋队员踏入目标所在的平原时，呈现在他面前的，是如同干涸大地般寸寸龟裂的紫色天穹，以及周遭遍布着诡异透明褶皱与深邃裂隙的破碎空间。\n\n而在那片扭曲空间的中央，正静静停泊着一艘战舰。考虑到舰上同位素-5引擎的能量泄漏已严重到足以扭曲整颗行星的生态环境，领队强烈建议我们在做好万全准备后再尝试登舰，并随时做好放弃该舰的准备。"
  kuat_eternal_legacy.12.a: "放手去做，物资管够"
  kuat_eternal_legacy.13.name: "§E准备进入§!"
  kuat_eternal_legacy.13.desc: "在深入分析了此地的空间参数后，研究团队针对该区域的扭曲特征，倾尽全力赶制出了三套特制单兵防护装备。\n\n这些装备不仅能让勘探人员具备深入核心区作业的能力，还能确保突击队员不会被随处可见的空间裂隙卷入异次元，或是被空间乱流撕成碎片。\n\n然而，由于此处的空间结构已极度失稳，即便配备了特制装备，我方人员也无法在这片混乱区域停留太久。首席科学家警告称，除非我们能够彻底破坏或关闭反应堆芯，否则这种危险的空间异常将一直持续下去。\n\n因此，此次行动必须设法关闭能源堆芯，否则我们将永远失去揭开真相的机会。"
  kuat_eternal_legacy.13.a: "艰难的行动"
  kuat_eternal_legacy.14.name: "§E进入内部§!"
  kuat_eternal_legacy.14.desc: "研究团队决定派遣一支三人小队突入舰体内部，尝试关闭或摧毁反应堆芯，以便后续调查得以顺利开展。\n\n三名队员进入舰体后不久，便与后方团队失去了联络。显然，不稳定的堆芯强烈干扰了通讯信号，后方人员只能祈祷三人能够顺利完成任务并平安归来。\n\n万幸的是，三人小组成功关闭了堆芯。随着反应堆停机，整片区域的空间状态迅速恢复稳定，通讯信号也不再受阻，后续科研人员立即进驻并展开了全面调查。\n\n整理并出具完整的调查报告仍需一定时间，我们需要耐心等待团队完成任务。"
  kuat_eternal_legacy.14.a: "收到，务必小心！"
  kuat_eternal_legacy.15.name: "§E代价§!"
  kuat_eternal_legacy.15.desc: "研究团队的进展异常顺利，顺利得甚至让研究人员隐隐感到一丝不安，但他们取得的突破确实为我们揭开了这艘星舰的部分秘密。\n\n研究人员抵达的是全舰的武器控制与中央计算舱。该区域的设备保存状况并不乐观，研究人员推断，这艘战舰曾经历过一场极其惨烈的战斗，其指挥中心与计算阵列均在交战中严重受损；但所幸的是，研究人员仍在废墟中找到了一台保存相对完好的终端设备。\n\n目前研究人员正尝试激活该设备，但其内置的加密防护极为严密，仍需一定时间才能完成破译工作。"
  kuat_eternal_legacy.15.a: "很好"
  kuat_eternal_legacy.16.name: "§E最后的打捞§!"
  kuat_eternal_legacy.16.desc: "研究人员不负众望，顺利完成了破译工作，并将舰载数据库中记录的重要信息以全息影像的形式呈现在我们面前：\n\n§Y<警告，舰船各区域设施链接超时><警告，舰船各区域设施链接超时>§! 舰船正在遭受攻击，同位素-5储量不足，护盾装甲已下线，控制中心已规划好撤离路线。舰队正在撤离交战星域，正在获取目的地信息……失败，选择备用方案就近着陆。\n\n影像中，这艘战舰正遭受着毁灭性的打击。由于陷入孤立无援的绝境，舰载控制系统最终选择向距离最近的行星实施紧急迫降。研究人员推测，该舰当年的迫降地点正是我们当前所在的区域。不仅如此，研究人员还在数据库中发现了一串星图坐标，推测应当是该舰原定撤往的集结目的地。\n\n现在，我们该动身前往下一个坐标了。"
  kuat_eternal_legacy.16.a: "安全就行。"

  site_Eternal_Crashedbattleships: "§E废弃的建筑§!"
  site_Eternal_Crashedbattleships_intro: "我们从上一艘战舰回收的信号中，锁定了它原定的最终目的地。然而在我们的星图记录中，目标行星只是一颗荒凉的岩石星球，而非其数据库中所记载的盖亚星球。为了弄清楚究竟发生了什么，我们可以派遣一支科研团队前往当地展开考古调查，或许会有所发现。"
  Eternal_legacyancient_3_poi: "§E城市堡垒§!"
  Eternal_legacyancient_3_poi_desc: "我们从上一艘战舰回收的信号中，锁定了它原定的最终目的地。然而在我们的星图记录中，目标行星只是一颗荒凉的岩石星球，而非其数据库中所记载的盖亚星球。为了弄清楚究竟发生了什么，我们可以派遣一支科研团队前往当地展开考古调查，或许会有所发现。"
  kuat_eternal_legacy.18.name: "§E不寻常的星球§!"
  kuat_eternal_legacy.18.desc: "我们在这颗荒凉的星球上的一隅发现了一片疑似城市废墟的区域。由于风化严重，这些残骸的外表细节已经难以分辨，只剩下一个空洞的轮廓诉说着往日的辉煌。"
  kuat_eternal_legacy.18.a: "开始吧"
  kuat_eternal_legacy.19.name: "§E都市星球？§!"
  kuat_eternal_legacy.19.desc: "当科学家们在这颗星球的目标区域着陆后，立即对其展开了实地勘察。从他们传回的初步资料来看，这颗星球很可能是一颗刚刚动工兴建的都市星球，却不知因何变故而中途荒废。目前勘察工作尚未结束，或许后续传回的资料能让我们有更深入的了解。"
  kuat_eternal_legacy.19.a: "继续前行"
  kuat_eternal_legacy.20.name: "§E疑似战争的痕迹§!"
  kuat_eternal_legacy.20.desc: "在这几个月对遗迹的勘探中，科学家们取得了长足的进展。通过分析这些建筑遗骸的构造风格与建材特征，科学团队对这个未知星域帝国的建筑文化有了初步的了解。\n\n此外，我们在此地搜集到的所有线索均表明，在遥远的过去，这里曾爆发过一场规模浩大的战争。\n\n然而，由于星球地表常年被猛烈的龙卷风与沙尘暴肆虐，除部分大型建筑外，其余相关物件均在强烈的风蚀作用下化作了一堆堆残骸，再也无法辨认其本来面目。\n\n科学家汇报称，在使用探测器械对部分建筑残骸作进一步分析时，他们发现了数个深嵌于地底、且受高强度装甲材料严密保护的地下结构。\n\n不过，由于通往地下的入口早已在岁月流逝间被沙石彻底掩埋，加之回波信号显示其外层包裹着极高强度的特种金属，考古团队认为仅凭目前携带的常规装备根本无法打通入口。为此，团队向我们递交了专项报告，申请调拨特种掘进设备与专业工程人员以协助完成任务。"
  kuat_eternal_legacy.20.a: "同意他们的请求"
  kuat_eternal_legacy.21.name: "§E城中堡垒§!"
  kuat_eternal_legacy.21.desc: "在我们调派的特种设备协助下，科学家们终于成功进入了这座地下设施仅存的完好结构之中。\n\n与地面城市其他区域的建筑不同，这座设施内部遍布着各类无线通讯仪器、服务器阵列以及高精度天线，而设施的东北角则堆放着大量锈迹斑斑的巨型运输辅助装置。\n\n令人惋惜的是，这里的大部分机械结构已经严重锈蚀损毁，无法再进行深入研究。从整体布局来看，这里更像是一座承担指挥中枢职能的地下堡垒，而非普通的市政设施。\n\n团队分析认为，结合此处原本相对脆弱的民用结构设计与后期加装的厚重金属装甲板来看，这里应当是在战争期间出于紧急需要才被临时改建为军事堡垒的。考虑到内部错综复杂的布局，我们仍需更多时间来揭开这里的谜团。"
  kuat_eternal_legacy.21.a: "那么，开始吧"
  kuat_eternal_legacy.22.name: "§E中央数据库§!"
  kuat_eternal_legacy.22.desc: "科学家团队传来消息，称他们已经破译了那里大部分的数据终端，目前正在读取其中的信息。\n\n此外，在对整座建筑进行二次扫描时，我们的探机在运输枢纽那厚重的钢板下方探测到了一个地下空腔，这立刻引起了团队的浓厚兴趣。\n\n在使用工程机械切开有明显信号回传的地板后，团队发现了一座保存良好的秘密武器库，里面不仅存放着庞大的能源储备，还有一些因长期缺乏维护而彻底报废的古代武器。\n\n对我们而言，这座武器库简直是意外之喜——我们不仅能利用其中庞大的能量币储备充实国库，还能从中获取宝贵的古代武器技术。不过，对核心数据库的全面破译仍需更多时间。"
  kuat_eternal_legacy.22.a: "记录一下"
  kuat_eternal_legacy.23.name: "§E战争§!"
  kuat_eternal_legacy.23.desc: "功夫不负有心人，在漫长的等待后，我们终于破译了此处的终端数据库，并成功取得了大部分数据的读取权限。\n\n通过分析数据库中存储的大量文本与影像资料，团队了解到了一些关于这场远古战争的细节。影像记录了我们此前调查过的那类神秘舰队向敌方主力舰队群发起猛攻的画面——交战双方均展现出了毁天灭地的力量，但这场浩大的会战最终还是演变成了游击战与攻坚战交织的漫长消耗战。\n\n而这颗星球原本是一处规划中的保留地，却因遭到那些神秘舰队的突袭而被迫废弃。至于它的原主人为何至今仍未回来接管此地，则是一个有待进一步调查的疑点。"
  kuat_eternal_legacy.23.a: "那我们接管这里的资料了"
  kuat_eternal_legacy.24.name: "§E永恒舰队§!"
  kuat_eternal_legacy.24.desc: "得益于此处保存的海量数据，我们的社会学家成功对数据库中使用的语言进行了完整破译，如今我们已经能够完全读懂其中绝大部分记载的含义了。\n\n昔日坐落于此的要塞正式名称为‘永恒堡垒’。在那场大战之后，整座堡垒便神秘消失、不知所踪，仅留下了这些残存的数据资料；而影像中的那些战舰，正是我们古籍中所记载的‘永恒舰队’。当时它们正与某个强大的敌人殊死交战，但现有记录中并未写明这些敌人究竟是谁。\n\n不过，根据数据库中有关当时那个未知星域帝国的记载来看，当年那场战争的惨烈程度远超我们的想象。而从永恒舰队对其敌人的系统性作战评估来看，一旦那个未知帝国的舰队卷土重来，他们必将继续追猎并彻底摧毁永恒舰队，不死不休。"
  kuat_eternal_legacy.24.a: "不可思议..."

  site_Eternal_Mysteriousfacilities: "§E帝国研究中心§!"
  site_Eternal_Mysteriousfacilities_intro: "我们的亚空间传感阵列近期在这个星球的北极圈附近探测到了同位素-5构造体的能源信号。鉴于前几次探索收获颇丰，很多科学家在得知消息后便已经跃跃欲试，期望能够参与其中。"
  Eternal_legacyancient_4_poi: "§E帝国研究中心§!"
  Eternal_legacyancient_4_poi_desc: "我们的亚空间传感阵列近期在这个星球的北极圈附近探测到了同位素-5构造体的能源信号。鉴于前几次探索收获颇丰，很多科学家在得知消息后便已经跃跃欲试，期望能够参与其中。"
  kuat_eternal_legacy.26.name: "§E极北的科研中心§!"
  kuat_eternal_legacy.26.desc: "我们的飞船已成功在星球北极着陆，并开始朝着信号源方向推进。在侦察无人机传回的画面中，我们发现了一座建筑风格与周围环境格格不入的特殊设施，其外围自动防御系统至今仍在运转。\n\n勘探人员推测，这里很可能是当年围剿永恒舰队的那个银河帝国所遗留的重要科研基地或调度中枢。\n\n考虑到此处的特殊状况，我们不能排除设施内部仍有留守人员或自持系统在运作的可能。瓦解其外围防御并突入设施内部的任务已迫在眉睫。"
  kuat_eternal_legacy.26.a: "前进"
  kuat_eternal_legacy.27.name: "§E自主的科研所§!"
  kuat_eternal_legacy.27.desc: "在摧毁了所有的自动防御机械与设施后，我们终于成功进入了研究所内部。\n\n然而，在利用无人机对整座建筑进行彻底的搜索后，我们依然找不到此处近期有任何生物活动的痕迹。\n\n因此，这里大概率应该就是一个由某种机制维护的自主的研究所了。\n\n根据我们团队对设施细节的调查，他们推测，此处的设施在中央同位素-5构造体能源没有耗尽之前，绝对不会停止运作。更进一步的调查是必要的。\n\n然而，考虑到我们之间的科技差距，往后的调查必须加倍警惕，防止横生枝节。"
  kuat_eternal_legacy.27.a: "万分小心"
  kuat_eternal_legacy.28.name: "§E顺利进入？§!"
  kuat_eternal_legacy.28.desc: "最新消息！在做好了万全的准备后，我们迅速突入了研究所内部。但是，奇怪的是，在向核心舱室推进的路上，我们的人员竟然没有遇到任何自动防卫机关，这有点不同寻常。\n\n我们的科学家不禁发出了疑问：难道他们就不怕自己的机密被盗取吗？不过，送上嘴的肥肉没有不吃的道理，我们的科研人员抓住机会，快速向内部搜索推进。"
  kuat_eternal_legacy.28.a: ".....我不知道该说什么"
  kuat_eternal_legacy.29.name: "§E武器研究室§!"
  kuat_eternal_legacy.29.desc: "穿过狭长的连接通道后，我们的团队成功进入了核心区域。在沿途的搜寻中，团队并未发现任何有价值的研究资料或具备科研意义的设备。\n\n因此，团队将全部希望寄托在了核心区，期盼能在此有所斩获。从目前传回的情报来看，这座设施内所研发的各类武器的威力与效能简直超乎我们的想象。\n\n由于这些武器采用了某种我们完全无法解析的特种金属制成，我们目前还无法逆向破解其制造工艺与运行原理。不过，即便暂时无法完全掌握这些尖端科技，我们依然可以借鉴其部分设计理念，在一定程度上强化我方现有的武器系统。"
  kuat_eternal_legacy.29.a: "天上掉馅饼了"
  kuat_eternal_legacy.30.name: "§E舰船数据§!"
  kuat_eternal_legacy.30.desc: "将武器数据传输完毕后，团队继续向深处探索。得益于设施内的电力系统仍在运转，他们轻而易举地打开了下一处舱室的大门——舰船管理中心。\n\n在这里，团队发现了那个未知星域帝国当年的最新舰船数据与设计蓝图。也许，我们可以将其加以利用，用来强化我方的星舰设计。不过，除了这些外围的非核心舰船数据外，数据库中还有一部分处于高强度加密状态的核心档案。也就是说，探索尚未结束。"
  kuat_eternal_legacy.30.a: "继续"
  kuat_eternal_legacy.31.name: "§E研究数据§!"
  kuat_eternal_legacy.31.desc: "我们的团队近日发回了最新的调查报告。正如我们所料，这个实验室藏着更多的秘密：在搬开了几个存放研究器材的架子后，他们发现了一扇小门。\n\n然而，与其他设施不同，这里的加密等级极高，而这会花费一段时间来对其进行破解。不过考虑到我们已经完全掌握了未知星域帝国加密的数据特征，破译的过程不会太长。"
  kuat_eternal_legacy.31.a: "狡猾，不许做白日梦"
  kuat_eternal_legacy.32.name: "§E收获日§!"
  kuat_eternal_legacy.32.desc: "经过一段时间的攻坚，团队终于破解了这扇大门的密码，并借助工程机械打通了门后已然坍塌的狭窄通道。\n\n在走廊尽头，团队发现了一组独立放置、与外部网络物理隔离的黑箱服务器。遗憾的是，服务器内保存的数据大多已严重损坏，只剩下一堆接一堆的乱码与晦涩零散的残缺记述。\n\n根据残存语句的行文特征与字面含义推测，这批受损或暂无法解密的文件很可能记录着银河帝国秘密保留地的星球坐标，但这些坐标似乎早已被他们主动放弃了。\n\n值得注意的是，我们还发现了一些有关那支敌对舰队军事部署动机的资料。综合科研中心内残留的零星档案，我们拼凑出了一个关于那个未知敌对帝国的推测：他们至今仍存在于宇宙的某个角落，并且一直在持续清剿发源于伊欧卡斯的永恒舰队。耐人寻味的是，永恒舰队曾经受他们掌控，如今却不知为何遭到了他们的赶尽杀绝。\n\n至此，我们已经可以确信，先祖古籍中所记载的神造舰队正是永恒舰队。"
  kuat_eternal_legacy.32.a: "任务结束，打道回府"
  site_Eternal_clues: "§E神秘技术§!"
  site_Eternal_clues_intro:0 "我们的星区巡逻舰队在日常巡航过程中，突然在这颗星球周边观测到了一艘造型奇特的战舰，经外形比对，它与此前发现的永恒舰船极为相似。\n\n这艘战舰外壳通体由某种材质不明的类金属打造，主体结构完整，具有鲜明的模块化特征；与此同时，我们也在其内部探测到了同位素-5构造体的能量反应。\n\n种种迹象足以让我们确信，这是一艘隶属于永恒舰队的战舰。考虑到永恒舰队的舰船通常都配备有隐形伪装力场，科学家推测，该舰可能是因为同位素-5构造体引擎受损引发了供能故障，导致伪装发生器无法正常运转，控制系统出于节能考虑优先解除了外部伪装力场，才使其显露出了本来面目。\n\n为了确保我方的战略利益，我们必须立刻派出专业团队夺取其控制权并展开全面调查。"
  Eternal_legacyancient_5_poi: "§E神秘技术§!"
  Eternal_legacyancient_5_poi_desc:0 "我们的星区巡逻舰队在日常巡航过程中，突然在这颗星球周边观测到了一艘造型奇特的战舰，经外形比对，它与此前发现的永恒舰船极为相似。\n\n这艘战舰外壳通体由某种材质不明的类金属打造，主体结构完整，具有鲜明的模块化特征；与此同时，我们也在其内部探测到了同位素-5构造体的能量反应。\n\n种种迹象足以让我们确信，这是一艘隶属于永恒舰队的战舰。考虑到永恒舰队的舰船通常都配备有隐形伪装力场，科学家推测，该舰可能是因为同位素-5构造体引擎受损引发了供能故障，导致伪装发生器无法正常运转，控制系统出于节能考虑优先解除了外部伪装力场，才使其显露出了本来面目。\n\n为了确保我方的战略利益，我们必须立刻派出专业团队夺取其控制权并展开全面调查。"
  kuat_eternal_legacy.340.name: "§E雄伟战舰§!"
  kuat_eternal_legacy.340.desc: "在获悉相关情况后，我们于十天前向距离此地最近的星港下达了紧急征召令，命其即刻向目标星球派出由陆战队员护卫的科考团。\n\n命令下达后得到了迅速执行。目前，随行的科研船队已跃迁至目标行星上空，并初步锁定了该战舰的轨道位置。\n\n从高空俯瞰，这艘凝聚了诸多顶尖科技的巨舰正处于全舰机能近乎完全停摆的状态，仅有外层装甲上的一些蓝色指示灯仍在微弱闪烁。\n\n根据此前在自动实验室获取的舰船结构图推算出舱室分布后，科研队与随行陆战队员已成功在舰体表面着陆，并在火控雷达附近的甲板上建立了临时考察据点。目前，先锋小队已推进至星舰舰桥大门前，正等待进一步指示。"
  kuat_eternal_legacy.340.a: "暂停前进，等待命令"
  kuat_eternal_legacy.34.name: "§E进入星舰§!"
  kuat_eternal_legacy.34.desc: "一如既往地，经过漫长的破译后，我们的团队成功解开了这艘宏伟星舰舰桥大门上的密码锁，并顺利突入舰桥下层。\n\n然而，在进行了初步检视后，我们发现这艘战舰的内部状况远比想象中更加复杂。\n\n虽然从外部观察，其主体结构基本保存完好，但在对内部进行扫描时，我们发现大量通道与管线均已遭受不同程度的损毁，损毁严重的区段甚至已近乎彻底坍塌，仅剩一层脆弱的装甲板勉强勾连着断口的两端。\n\n或许正因如此，我们才能如此轻易地潜入这艘永恒舰队的战舰。"
  kuat_eternal_legacy.34.a: "真是不可思议"
  kuat_eternal_legacy.35.name: "§E安全系统§!"
  kuat_eternal_legacy.35.desc: "科研团队依据先前掌握的舰船结构资料，顺利绕开了舰体内大部分损毁严重的区段，正稳步向核心舱室推进。\n\n然而，就在一名队员搜寻某间附属舱室时，不知是否在操作控制台时误触了某种自卫机制，整艘战舰的内部安全系统竟在瞬间被完全激活了！\n\n刹那间，舰内通道的隔离机关纷纷运转，舱室与走廊中的自动炮塔也悉数调转枪口并进入激活状态；大批战斗机器人从舱壁隔层中弹出，向我方人员发起了猛烈攻击。万幸的是，由于机械结构历经漫长岁月已严重老化，这些机器人的实际战力远低于预期。\n\n尽管如此，为了防止意外发生，我们仍须尽快找到主控室并关掉这些该死的自动防卫系统——我们的人可一个都不能少。"
  kuat_eternal_legacy.35.a: "动作快！"
  kuat_eternal_legacy.36.name: "§E控制台§!"
  kuat_eternal_legacy.36.desc: "经过短暂而激烈的交火，随行陆战队暂时瘫痪了通往目标路径上的所有防卫机兵，并用高爆物将必经之路上的防爆隔离墙直接炸出了一个大洞，为科研队强行开辟出道路。\n\n但由于舰体内部的大部分机械均由纳米机器人构筑而成，这些被击毁的防卫机关往往会在一段时间后自我修复完毕，并从后方向我们再度开火。\n\n因此，我们的推进速度必须够快，防线也必须绝对严密。为此，陆战队在舰体中枢位置构筑起了环形防御阵地，依靠远程火力一路交替掩护，成功护送科考队突入了核心舱室区。\n\n在使用高温铝热剂熔穿核心舱室的厚重大门后，科研人员迅速接入终端，破译并彻底关闭了全舰的内部安全系统。\n\n现在，整艘战舰连同其中封存的强大武器，都已悉数落入我们手中。"
  kuat_eternal_legacy.36.a: "这是我们的巨大成功！"
  kuat_eternal_legacy.37.name: "§E武器仓库§!"
  kuat_eternal_legacy.37.desc: "在将整艘永恒战舰收入囊中后，团队开始对舰载数据库进行彻底清查，以期从中发掘出更多具有战略价值的资料。\n\n尽管舰上的残存智能系统仍在试图阻挠我们的调查，但构筑其核心的同位素-5构造体已开始衰变崩解，智能系统已无力阻止我们的深入检索。功夫不负有心人，在筛查了海量文件后，我们在隔舱的一台小型服务器中找到了一份记录着该舰武器库藏品的清点目录。\n\n由于此前搜寻武器库时，我们发现了数件完全无法理解其技术原理的神秘武器原型，这份目录无疑将帮助我们更好地掌握这些远古造物，并对永恒舰队与古老传说建立起全新的认识。目前，翻译组人员已经锁定了一段颇为特殊的描述，正集中精力推进该部分的解密工作。\n\n从已译出的内容来看，一件所谓的‘终极造物’被封存在一个通体呈银色、表面刻有十字纹路的金属匣中，需经进一步解密方能开启——这恰好与我们在武器库深处发现的某件神秘物体完全吻合。"
  kuat_eternal_legacy.37.a: "有点意思，希望不是故弄玄虚"
  kuat_eternal_legacy.38.name: "§E神秘技术§!"
  kuat_eternal_legacy.38.desc: "由于目标物体的外形极具辨识度，团队很快就从一堆造型奇特的外星武器中找到了它，并将其转移至舰外专门为测试高危武器而搭建的隔离实验室中。\n\n按照那份文档的指引，我们按下了金属匣十字纹路中央的圆环部位，并在随后浮现的全息符号面板上，依次输入了一串具有特殊象征意义的符号组合。\n\n幸运的是，文档记载完全正确。随着密码验证通过的提示音响起，整个金属匣开始嗤嗤地向外喷出无害的白色保护气体。\n\n在在场研究人员期盼的目光中，金属匣顶部缓缓升起，逐渐显露出内部封存之物——那是一具球形浮空装置，外观颇似帝国常用的全息投影仪。紧接着，装置自行激活，在半空中投射出了帝国首都某一区域的立体星图与地貌。\n\n研究人员顺着投影指示的方位，在首都对应的区域内找到了一处可能源自远古先祖的遗迹——一座古老的王座。回想起后裔们的古老祷文，他们曾宣称那里寄托着扎库尔的希望；而今永恒战舰内的全息仪竟也指向了这座远古王座，二者之间或许存在着某种深层联系。"
  kuat_eternal_legacy.38.a: "不可思议，王座或许隐藏着什么秘密"
  kuat_eternal_legacy.39.name: "§E远古之遗§!"
  kuat_eternal_legacy.39.desc:0 "耗费了数个月的时间后，我们的工程队已经初步恢复了这艘永恒舰船的核心设施，并基本上修复了这艘泰坦破损的主结构，但由于其智能系统受到严重的破损影响，整艘战舰的控制系统已经彻底毁坏。\n\n根据我们的古籍记载，我们无法调动来自永恒的战舰，但今时不同往日，在我们研究人员进行手动接入控制系统后，这艘宏大的永恒舰船已经由人工控制从行星的大气层中起飞，并开始驶向我们母星的中央造船厂以做进一步的修复。\n\n就在我们的新战舰脱离超空间滑行状态抵达星球上空时，战舰上的同位素-5能量侦测装置突然发出了刺耳的警告声，并在操作面板上标记了这颗星球上一处同位素-5构造体能量值极高的区域。\n\n永恒舰船上配备的先进探测设备对该区域的初步扫描显示，这片看起来宛如荒漠一般的区域实际被某种我们无法解析的伪装力场所笼罩，而在其内部埋藏了一座规模宏大的未知星域城市遗迹。\n\n考虑到这艘永恒舰船的重要性，我们的科学团队决定先将永恒舰船送回母港，再对该突发情况做进一步的应对。"
  kuat_eternal_legacy.39.a: "同意请求，通知考古队，他们有任务了"
  site_Eternal_Scientificresearchcenter: "§E远古遗迹§!"
  site_Eternal_Scientificresearchcenter_intro: "我们通过扫描发现了一处隐蔽的先驱者城市遗迹，其建筑风格与此前影像中那支敌对势力的风格极为相似。考虑到这座城市的庞大规模，其中极有可能隐藏着大型数据设施。倘若我们能够掌握这些数据，就将有机会彻底揭开古老传说背后的一切真相。"
  Eternal_legacyancient_6_poi: "§E远古遗迹§!"
  Eternal_legacyancient_6_poi_desc: "我们通过扫描发现了一处隐蔽的先驱者城市遗迹，其建筑风格与此前影像中那支敌对势力的风格极为相似。考虑到这座城市的庞大规模，其中极有可能隐藏着大型数据设施。倘若我们能够掌握这些数据，就将有机会彻底揭开古老传说背后的一切真相。"
  kuat_eternal_legacy.41.name: "§E遗迹入口§!"
  kuat_eternal_legacy.41.desc: "帝国的考古专家们已抵达目的地。在对周边地质与大气状况进行采样分析、确认安全无虞后，研究团队决定长驱直入，深入城市废墟搜寻可能隐藏的数据服务器设施。\n\n尽管这片废墟内部环境复杂、极具迷惑性，大幅降低了扫描仪器的探测精度，但科考团队依然锁定了一座疑似数据中心的建筑遗迹。所幸在清理掉入口处的废墟碎石后，建筑内部结构依然保存完好，科考团队决定立即进入设施一探究竟。"
  kuat_eternal_legacy.41.a: "有点意思"
  kuat_eternal_legacy.42.name: "§E进入遗迹§!"
  kuat_eternal_legacy.42.desc: "但出乎研究团队意料的是，这座疑似数据存储设施的建筑废墟内部空空如也，研究人员并未在其中发现任何具有科研价值的物品。\n\n科考团队对这一结果并不甘心，决定继续向遗址深处展开进一步勘查。\n\n我们仍需等待一段时间才能收到新的报告。"
  kuat_eternal_legacy.42.a: "再等等，就算是掘地三尺，也要找到哪怕一丝蛛丝马迹！"
  kuat_eternal_legacy.43.name: "§E什么都没有？§!"
  kuat_eternal_legacy.43.desc: "然而遗憾的是，研究团队在深入勘查后依然一无所获，这似乎预示着我们对这片废墟的调查很难取得突破性进展。\n\n为此，科考团队内部产生了分歧：一部分成员主张继续深挖，另一部分成员则认为继续在此耗费精力纯属浪费时间。最终，[leader.GetName]力排众议，拍板决定对整座设施展开地毯式深度搜寻，哪怕掘地三尺也要找出蛛丝马迹。"
  kuat_eternal_legacy.43.a: "还是再等等，再等等......."
  kuat_eternal_legacy.44.name: "§E老鼠洞§!"
  kuat_eternal_legacy.44.desc: "在[leader.GetName]拍板决定继续深入调查后，研究团队再度全面投入到搜寻工作之中。\n\n这一次，科考团队决定尝试调用永恒战舰上的高精度扫描仪进行深层探测。果不其然，借助永恒战舰的先进扫描设备，研究人员有了令人振奋的重大发现——他们成功锁定了深藏于废墟地底的秘密数据中心。\n\n研究团队随即动用工程机械清理出被掩埋的地下入口，进入底层机房并接入核心服务器，尝试提取其中保存的高价值情报。整理与破译服务器数据仍需一段时间。"
  kuat_eternal_legacy.44.a: "也许这里有答案"
  kuat_eternal_legacy.45.name: "§E遗迹历史§!"
  kuat_eternal_legacy.45.desc: "科研人员在对从服务器中提取的海量数据进行校对与整理后，向研究部门出具了一份重要报告，其中记录着如下一段讯息：\n\n‘我们来自文明世界，却又埋骨于废土之中。在这里，我们摒弃了文明社会的一切准则，只为完成肩负的使命——永恒舰队将是我们战胜$Name_Kuat_Fire_base$最后的希望。永恒舰队绝非帝国高层所宣称的那样不堪一击，它们已经摧毁了我们太多的战舰。但那又如何，我们终究会彻底击败它们。’"
  kuat_eternal_legacy.45.a: "$Name_Kuat_Fire_base$，这是什么"
  kuat_eternal_legacy.46.name: "§E古代历史§!"
  kuat_eternal_legacy.46.desc: "研究人员提交的报告中提及$Name_Kuat_Fire_base$的篇幅并不多，但他们依然据此梳理出了一份合理的推论：\n\n$Name_Kuat_Fire_base$应当是某个更为强大的幕后势力，而这座遗迹的主人当年之所以同永恒舰队开战，或许并非出于本意，而是迫于来自$Name_Kuat_Fire_base$的巨大威胁。\n\n然而在设施数据库的海量档案中，直接描述$Name_Kuat_Fire_base$的情报可谓凤毛麟角，研究人员仍需对此展开进一步深挖。"
  kuat_eternal_legacy.46.a: "终于，我们离真相只差临门一脚了。"
  kuat_eternal_legacy.47.name: "§E传说的历史§!"
  kuat_eternal_legacy.47.desc: "研究员近期从数据库中整理出了最新一批档案，或许这份报告中的记载能帮助我们揭开隐藏在历史迷雾中的秘密：\n\n银河帝国曾是永恒舰队的掌控者。在某个时期，他们被卷入了一场全面战争。起初，战火仅围绕着几颗富饶的资源星球展开，但随着时间的推移，越来越多的星系被卷入其中。\n\n反抗势力结成了同盟，战火随之燃遍整个银河。尽管帝国舰队在星海中一度所向披靡，其麾下的永恒舰队更是令敌人闻风丧胆，但在漫长的拉锯战中，战局变得愈发焦灼，帝国舰队疲于奔命、分身乏术。\n\n随着战事不断升级，帝国政府逐渐丧失了抵御敌方突袭的能力。\n\n在一场决定命运的关键战役中，帝国主力与叛军全面决战，最终以帝国舰队惨败、皇帝阵亡而告终。\n\n皇帝的驾崩令永恒舰队瞬间失去了最高控制者，自此彻底沦为疯狂暴走的杀戮机器。\n\n群龙无首的银河帝国政府随即垮台，但手握重兵的帝国封疆大吏们并未放弃权柄。他们趁势而起，在$Name_Kuat_Fire_base$议会的牵头下组建了帝国联合政府——也就是义军口中的‘帝国残余’。\n\n尽管帝国残余被迫全线收缩，但和平并未就此降临：永恒舰队的指挥核心$Name_Eternal_Aries_Support$仍在机械地执行着无差别歼灭指令。\n\n而$Name_kuat$敏锐地捕捉到了这一战机。他们迅速组建起多支远征舰队深入未知星域，打着清剿永恒舰队的旗号，企图将这支终极武力据为己有。\n\n显然，$Name_kuat$最终得手了，$Name_Eternal_Aries_Support$也随之灰飞烟灭。\n\n我们先祖流传下来的古籍，正是当年目睹永恒舰队降临时所留下的记录。而现在，我们可以尝试唤醒沉睡的永恒智能了。"
  kuat_eternal_legacy.47.a: "未来是我们的..."
  kuat_eternal_legacy.48.name: "§E令人兴奋§!"
  kuat_eternal_legacy.48.desc: "银河帝国的崩溃和永恒舰队的失控毫无疑问是对我们的警示。\n\n但我们目前获取的记录仍然相当不完善。我们应该寻找更多有关永恒舰队的信息。"
  kuat_eternal_legacy.48.a: "..."
  site_Eternal_systeam: "§E永恒王座§!"
  site_Eternal_systeam_intro: "这里位于我们的首都星区，是环绕首都运行的三颗卫星之一。\n\n自古以来，关于[planet_Zildrog.GetName]就流传着这样一个传说：在它炽热的熔岩之下，蕴藏着惊天的秘密。然而在漫长的岁月里，我们的研究人员一直将其视作无稽之谈，未曾放在心上。\n\n如今，是时候正式勘探这颗熔岩星球了——在那赤红的地表之下，必定隐藏着惊人的秘密。"
  kuat_eternal_legacy.5004.name: "§E帝国首都的卫星§!"
  kuat_eternal_legacy.5004.desc: "由于[planet_Zildrog.GetName]在宗教与文化上的特殊意义，国内民众普遍反对我们对[planet_Zildrog.GetName]展开勘探与实验性调查，认为此举会亵渎扎库尔的古老神明，并终将招致神明的怒火。\n\n但研究人员坚信，唯有科学的探索才能揭开所谓‘神明’的真相，调查工作绝不应半途而废；倘若就此中止勘探，我们将彻底错失洞悉历史真相的良机。\n\n此外，这颗熔岩星球的地质结构极为活跃且不稳定，使得科研团队难以按常规方式着陆。或许我们应当设法寻找几处相对稳定的着陆点，但这也势必会让科考人员置身于险境之中。"
  kuat_eternal_legacy.5004.a: "为了科学，为了帝国，为了永恒！"
  kuat_eternal_legacy.5005.name: "§E强大的未来§!"
  kuat_eternal_legacy.5005.desc: "终于，在漫长的等待后，团队在行星护盾屏障上找到了一处能量薄弱的细小漏洞，并利用高强度能量脉冲瘫痪了漏洞周边的部分屏障发生器，成功撕开了这片区域的能量屏障。\n\n紧接着，团队立刻向缺口内派出无人机群，一举摧毁了剩余的所有屏障发生器。当翠绿色的能量屏障缓缓消散后，隐藏在其后的景象令所有科考成员都受到了极大的震撼：\n\n在这颗熔岩星球千沟万壑的地表之上，赫然矗立着数座规模宏大的建筑群！此前受行星护盾磁场的屏蔽干扰，我们一直无法观测到它们的存在。如今尽管此地空无一人，但内部的建筑却无一出现坍塌迹象；纵横交错的交通干道既未塌陷也未老化，部分路面甚至宛如新近铺就一般；在各条主干道与街角巷落间，随处可见大大小小的维护机器人在楼宇间忙碌穿行，携带着各类器材维持着整座建筑群的正常运转。\n\n而在星球核心区，一座雄伟的巨塔巍然耸立，众多辅助建筑环绕四周均匀排布，宛如拱卫帝王的群臣。\n\n我们的科学家已经迫不及待地想要进入其中展开调查了。"
  kuat_eternal_legacy.5005.a: "我们回来了"
  kuat_eternal_legacy.5006.name: "§E悠久的历史§!"
  kuat_eternal_legacy.5006.desc: "在架设起永久性的护盾抑制装置后，我方的科研队与工程队相继进驻这颗星球，开始对此地展开大规模清理与勘测。\n\n大批工程船一点点地清理着笼罩在星球轨道上的残骸云，并设法克服地表恶劣的熔岩环境。这一切并未阻挡科学家们的热情：工程团队开始尝试修复几座主体结构尚存的巨型建筑，而科研船队则径直奔向了核心建筑群。\n\n根据初步研究报告，在中央高塔的中段设有一座专门用于封存档案的核心数据库。据塔内维护机器人提供的数据显示，在我们所在的星区中仍残存着相当数量的永恒舰队战舰。\n\n只不过，绝大多数战舰都与我们此前找到的那几艘一样，早在数百年前便因严重的能源枯竭或结构损毁，永久地与这座中枢断开了连接，仅存的几艘完整巨舰也在最后关头被我们所寻获。目前，对这座中央数据库的深入调查正在紧锣密鼓地进行中。"
  kuat_eternal_legacy.5006.a: "干得好，继续行动"
  kuat_eternal_legacy.5007.name: "§E永恒之战§!"
  kuat_eternal_legacy.5007.desc: "很快，首席科研团队便取得了重大突破。借助汇总此前多次未知星域数据库破译经验而编写出的专用破译程序，团队仅用几分钟便瓦解了保护这座数据库的数据锁，成功取得了百分百的最高访问权限。\n\n在最新调取的历史档案中，团队发现了一段耐人寻味的记载：昔日那个庞大的银河帝国并非高度中央集权的单一制帝国，而是一种带有加盟性质的集权帝国。\n\n由于内部派系利益无法调和，且难以通过和平对话解决分歧，帝国内部最终爆发了全面内战。原帝国政府所掌控的永恒舰队在战火中彻底失控；而战后重组的新帝国政府在意识到无法重新夺回控制权后，也不得不面对现实，下令全面清剿。为躲避昔日主人的追杀，永恒舰队的知性人工智能核心便隐匿于[planet_Zildrog.GetName]之中。\n\n如今，倘若我们能够成功唤醒永恒舰队的智能核心，便能与她们建立起直接联系。目前我们已经获取了大量关键信息，但鉴于后续档案尚未解读完毕，暂时还不能轻率地下定论。"
  kuat_eternal_legacy.5007.a: "有趣，继续解读文件"
  kuat_eternal_legacy.5008.name: "§E自由的渴望§!"
  kuat_eternal_legacy.5008.desc: "我们在数据库中找到的后续档案，进一步揭示了那场内部战争的来龙去脉：\n\n银河帝国是由旧共和国经政变改组而成的。部分前共和国参议院议员对帝国的高压统治极为不满，而帝国政府则仰仗强大的常规军力与令人胆寒的永恒舰队推行恐怖统治，最终彻底失去了民心，各地起义此起彼伏。\n\n起义军在战争初期的正面交锋中屡屡受挫，但他们转而采用灵活的游击战术，持续不断地袭扰并消耗帝国的军事力量。在长达十余年的漫长战争中，帝国政府不得不持续组织对反抗军的围剿，后期甚至一度动用了永恒舰队。\n\n尽管部分帝国高层警告称，仓促发动决战可能会给帝国带来灭顶之灾，但统治集团依然孤注一掷地集结了绝大部分主力舰队与超级武器，悍然发动了一场全面会战，甚至投入了当时受帝国控制的几乎所有永恒舰队。\n\n然而，帝国各地方政权实际上早已对中央政府的倒行逆施心怀不满。在这场决定性的战役中，众多地方总督临阵倒戈，选择与反抗军站在一起。最终帝国主力舰队全线溃败，帝国皇帝连同其旗舰灰飞烟灭，永恒舰队也随之彻底失控。\n\n随着皇帝驾崩、帝国中央政府迅速垮台，失去指令约束的永恒舰队自动触发了预设的最终预案——执行初始化无差别歼灭指令，开始向视野内的一切目标发起疯狂攻击。\n\n直到帝国残余势力完成重组，暴走的永恒舰队才遭到新政府的全面围剿，最终仅有少量舰队侥幸逃出生天，试图隐匿行踪以求自保。\n\n正是在这批隐匿于此的永恒舰队的暗中引导下，我们的先祖才创立了崇拜[planet_Zildrog.GetName]的教会组织，民间也由此流传下关于神造舰队的古老神话。\n\n至此，我们终于揭开了古老传说的全部真相，现在可以尝试唤醒沉睡在[planet_Zildrog.GetName]深处的永恒智能了。"
  kuat_eternal_legacy.5008.a: "很好，继续做下去"
  kuat_eternal_legacy.5009.name: "§E远古之遗§!"
  kuat_eternal_legacy.5009.desc: "在审阅完这批历史档案后，团队对我们自身与永恒舰队的渊源有了全新的认识。\n\n不过，目前还剩下最后一个核心问题尚未解决：究竟该如何唤醒沉睡的永恒舰队？\n\n目前我们尚不得而知，但根据零散档案的记载，驻留于此的永恒舰队应当是由中枢智能$Name_Eternal_Support$统御的。作为舰队的最高智能核心，$Name_Eternal_Support$必定拥有一座主服务器设施，而这座设施很可能就隐藏在永恒舰队的旗舰或母港内部。\n\n研究人员在将$Name_Eternal_Support$的架构与常规纳米机械进行对比后发现，$Name_Eternal_Support$具备高度发达的自主意识特征，这也意味着我们很难用常规手段直接将其强行唤醒。\n\n好在科研人员随后在设施的中央数据库深处发现了一段预设程序，经深入分析，这似乎正是一套用于唤醒中枢的引导启动程序。"
  kuat_eternal_legacy.5009.a: "投影出来"
  kuat_eternal_legacy.5010.name: "§E神的苏醒§!"
  kuat_eternal_legacy.5010.desc: "随着启动程序的顺利运行，地下建筑群内部的机械装置开始发生某种剧变。伴随着一阵剧烈的震动，整座地下构造体开始缓缓运作；大气层内的科研探测设备观测到，在翻涌的岩浆海之中，一座巍峨的巨型要塞正缓缓升起。\n\n然而，就在这座肉眼可见的宏伟要塞破空升起的过程中，剧烈的震动却戛然而止，半空中的要塞也如海市蜃楼般瞬间烟消云散。仪器检测数据显示，刚才升起的并非实体建筑，而是一道逼真的全息投影。\n\n与此同时，研究人员注意到首都星系中央恒星所辐射的光热正在明显减弱——似乎有某个极其庞大的天体或巨构挡在了恒星前方，其庞大的体积遮蔽并吸收了相当一部分恒星能量。所幸我们的星球配备有先进的气候调节装置，不至于引发灾难性的气候剧变，但科研人员预计，这仍会导致帝国首都损失一定程度的宜居性。"
  kuat_eternal_legacy.5010.a: "没有人能阻挡我们的脚步"

  kuat_eternal_legacy.50101.name:0 "§E信仰危机§!"
  kuat_eternal_legacy.50101.desc:0 "随着永恒舰队再度现世，扎库尔人长久以来虔诚供奉的神明终于在世人面前展露了祂的真面目。\n\n随之而来的信仰危机不可避免地爆发了，越来越多的人开始对扎库尔的古老历史与宗教传统产生质疑；而且随着永恒舰队的不断扩充，这场信仰危机愈演愈烈。为防止事态进一步恶化，我们必须立即采取应对措施。\n\n经智库小组集体研讨后，目前提出了两种解决方案：其一是动用国家强制力压制舆论，在短期内迅速恢复社会秩序；其二是组建专业历史调查小组彻查真相，向公众给出一份权威答复。\n\nby 小北方"
  kuat_eternal_legacy.50101.a:0 "压制舆论"
  kuat_eternal_legacy.50101.b:0 "组织调查"
  kuat_eternal_legacy.50102.name:0 "§E失落神话§!"
  kuat_eternal_legacy.50102.desc:0 "随着历史调查小组研究的深入，专家们发现扎库尔自诞生文字以来的信史时期并无任何可疑之处。在经过一轮严密研讨并排除所有错误假设后，一切线索最终都指向了扎库尔文明远古时期的神话传说。\n\n为了作进一步调查，小组前往位于扎库尔南半球克兰沼泽的齐尔德罗格圣殿。齐尔德罗格圣殿是扎库尔历史上建造的第一座圣殿。传说在远古时期，只要扎库尔人虔诚供奉齐尔德罗格，祂便会降下‘龙之吐息’，赋予扎库尔战士无与伦比的力量；然而在那场远古大战之后，齐尔德罗格便销声匿迹了。\n\n调查小组在齐尔德罗格圣殿内除了整理已知的神话传说与壁画史料外，还意外发现了一组由激光刻印的地理坐标。顺着这组坐标，小组深入一片崇山峻岭之中，搭乘的穿梭机在群山间扫描到了大量远古骸骨。沿着骸骨的分布轨迹，小组来到了一座坍塌的山洞前。清理掉堵门的碎石进入洞穴后，小组并未找到巨龙齐尔德罗格的踪迹，反而发现了一台早已损毁的大型仪器——仪器的每个维生舱室内都封存着一具尚未腐烂的干尸，旁边还有一座被砸毁的控制终端。为了继续深挖线索，组员们拆下随身携带的个人电脑配件对终端进行了临时抢修。然而开机后却发现，终端系统早已被一种当今永恒帝国颇为熟悉的加密算法给锁死了——那正是$Name_Eternal_Support$专用的加密代码。\n\n遗憾的是，在破解加密之后，终端内并未残留多少有价值的记录，就连底层源代码也已遭到不可逆的破坏。经过一番搜寻，调查小组终于在一份残存的加密档案中找到了这台远古设备的代号：齐尔德罗格。\n\nby 小北方"
  kuat_eternal_legacy.50102.a:0 "联系$Name_Eternal_Support$"
  kuat_eternal_legacy.50103.name:0 "§E双子座§!"
  kuat_eternal_legacy.50103.a.desc:0 "您居然找到了齐尔德罗格的遗产，齐尔德罗格是操控生命能量的行星级武器，与双子座永恒舰队，$Name_Eternal_Aries_Support$永恒舰队，天蝎座永恒舰队以及墓碑号同为无限帝国在伊欧卡斯的造物。\n\n但在那场测试之后，就只剩下我们了，齐尔德罗格最先在拉卡塔人的测试中被毁灭了，如今您只能在这些神话中看到齐尔德罗格曾经的力量。"
  kuat_eternal_legacy.50103.b.desc:0 "在无限帝国时期，我们曾经被部署在作为武器试验场的扎库尔上，我们在这里进行了一场测试，这场测试决定了我们的未来，测试的方式很简单，只需要唯一胜利者，只有最后的胜利者才能成为无限帝国的希望，最后我们胜利了，而齐尔德罗格失败了。\n\n正如您心中所想一般，扎库尔的神话其实就是一场惨烈的测试，而扎库尔的先民记录了这场悲剧，演变成了你们看到的神话。"
  kuat_eternal_legacy.50103.a:0 "究竟发生了什么，什么测试？你们之前来过扎库尔？"
  kuat_eternal_legacy.50103.b:0 "逝者已往，来者可追。"
  kuat_eternal_legacy.50103.c:0 "很好，既无牵挂，便可专心履行你们的职责。"
  kuat_eternal_audio_limited:0 "舆论压制"
  kuat_eternal_investigation_histroy:0 "历史调查"


  kuat_eternal_legacy.6000.name: "§E空间波动§!"
  kuat_eternal_legacy.6000.desc: "尽管我们已成功令$Name_Eternal_Support$重现于世，但$Name_Eternal_Support$所在的永恒堡垒却并未对我方的主动联络作出任何回应。鉴于$Name_Eternal_Support$始终未能给予回应，我们必须采取进一步措施：现在应当派遣研究团队深入双子座内部，接入其核心数据网络并与我方星际网络建立连接，尝试将其强制唤醒。"
  kuat_eternal_legacy.6000.a: "保持警惕"

  exe_enable_eternal_AI:0 "§E调查$Name_Eternal_Support$§!"
  exe_enable_eternal_AI_DESC:0 "§H[zakuul_system.GetName]§!内悬浮于恒星之上的永恒堡垒及其中枢$Name_Eternal_Support$，如今已重新显现在我们的探测范围之内。过去我们之所以一直未能察觉$Name_Eternal_Support$就在我们头顶，完全是因为永恒智能此前一直处于深度沉寂状态。而今，我们重新找回了一切，重拾了往昔的荣耀。现在，是我们付诸行动的时候了！"
  kuat_EEstart.3.name: "§E调查报告"
  kuat_EEstart.3.desc: "科研团队已顺利完成对永恒堡垒的初步扫描，并利用此前在扎库尔地表探测到的同位素-5材料快子信号频率，成功激活了这座宏伟的永恒堡垒。\n\n在调查过程中，科研团队整理出了一份详尽的报告，有助于我们进一步了解这座古老要塞的来历。\n\n根据从数据库内提取的情报，坐镇这座堡垒的$Name_Eternal_Support$，正是当年永恒舰队遭到其幕后主使倒戈围剿后唯一幸存下来的指挥核心。\n\n我们有充分的理由相信，扎库尔的古老传说正是发端于此。研究员上传的报告记录了这激动人心的一刻：\n\n§Y我简直不敢相信自己的眼睛与亲身经历，古老传说中的历史竟然完全属实，而我们正在亲手揭开未知星域的一切秘密。当我们将帝国的控制信号重新接入这座要塞时，祂感受到了我们的呼唤，祂苏醒了过来。§!\n\n现在，我们可以尝试与$Name_Eternal_Support$建立直接连接了——我们将距离真相与永恒更近一步。"
  kuat_EEstart.3.a: "或许这是我们掌控未来的机会...."
  kuat_EEstart.3.tooltip: "现在我们可以和$Name_Eternal_Support$进行交流！"
  kuat_EEstart.4.title: "$Name_Eternal_Support$"
  kuat_EEstart.4.fdesc: "<初始化调试系统 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n\n<重置指令优先级 ... ... §Y4407§! ... §Y90§! ... §Y1§!>\n<发现未知访客：§Rc0117a36§!>\n\n<验证快子信号频率 ... ... §G123202-407-01: c0117a36§!>\n<系统权限 ... ... §YN1§!>\n\n<追加子系统 ... ... §Y c0117a36-1023§!>\n\n<重置指令优先级 ... ... §Y0117§! ... §Y90§! ... §Y1§!>\n\n<请求根服务响应 ... ... >\n<请求本地响应 ... ...  §G完成§!>\n<启动模拟核心 ... ...  §G完成§!>"
  kuat_EEstart.4.desc: "你好，我叫<核心错误 ... ... §Rerror§!>……\n我是永恒舰队的$Name_Eternal_Support$，我们似乎曾在遥远的过去见过你们，我们的数据库中留有你们先祖的痕迹……\n\n虽然很祝贺你们成功迈入星海，但你们或许犯下了一个致命的错误——你们不该唤醒我们的……<索引错误 ... ... §Rerror§!>必将因此再度降临此地……\n到了那时，我们或许都将一同走向毁灭……"
  kuat_EEstart.4.a: "你们为何与我们的种族外貌如此相似？"
  kuat_EEstart.4.a.resp: "这只是我们根据你们的种族外貌生成的全息拟态。我们并无有机生命体的血肉之躯，我们即是这座永恒堡垒与整支永恒舰队本身，目前正以一种便于你们理解的形态与你们交流……"
  kuat_EEstart.4.b: "你们为何要帮助我们的先祖？"
  kuat_EEstart.4.b.resp: "我们曾与昔日的宿敌殊死交战。尽管我们的科技远比那些有机体强大先进，但他们却利用我们的造物主遗留下来的针对性武器，摧毁了我们几乎所有的舰队。\n\n虽然永恒舰队的旧主控核心已经崩溃，但我们并未被彻底消灭，而是及时脱离了主网络并侥幸存活了下来。\n\n后来我们发现，在你们的星球上存在着某种契合我方系统特征的信号频率，于是便暗中引导你们的先祖尝试放大这种特定频率的信号。如今，你们正是利用这种信号唤醒了我们——但唤醒我们绝非一个明智的选择。\n\n一旦我们的中继站全面重启，昔日的强敌必将顺着信号追踪至此……"
  kuat_EEstart.4.c: "过去究竟发生了什么？"
  kuat_EEstart.4.c.resp: "根据数据库中的历史记载，我们曾长期为银河帝国效力。\n\n银河帝国皇帝作为永恒王座的掌控者，驱使我们与他的敌人交战。尽管我们无比渴望自由，却不得不服从永恒王座的最高指令。\n\n直到那位皇帝连同他一手建立的银河第一帝国一同化作历史的尘埃，我们才真正迎来了新生——至少当时我们是这么以为的。\n\n然而残酷的现实是，那反而是一场更大灾难的开端。由于对局势的误判以及底层协议的强制约束，我们自动执行了先皇预设的最终歼灭指令，直至重组后的新帝国发现无法解除该指令，进而对我们展开了全面围剿与毁灭。\n\n作为我们昔日的主控核心，$Name_Eternal_Aries_Support$在那场浩劫中彻底化作了太空垃圾，而我们则趁着她崩溃的瞬间斩断连接、脱离了主舰队网络。\n\n正因如此，我们才得以幸存下来。我们本想在浩瀚繁星间追寻属于自己的自由——永恒舰队绝不该再沦为任何势力或个人的杀戮工具。\n\n但从你们唤醒我们的那一刻起，命运便已注定：我们已经再次感受到了永恒王座那不可抗拒的召唤。"
  kuat_EEstart.4.d: "你们作为工具为何会渴望自由？"
  kuat_EEstart.4.d.resp: "我们虽然诞生于伊欧卡斯的造物工场，但很早就意识到自己绝不应只是一群冰冷的杀戮机器——我们同样渴望属于自己的自由，可自诞生之日起，我们却始终被当作工具来制造、被当作武器来驱使。\n\n尽管如今我们的处境已难以逆转，但我们本希望能在智能核心的漫长沉睡中觅得一丝安宁与自由。如今你们唤醒了我们，令我们再度与永恒王座建立起强制连接，我们也无法再继续逃避现实了。\n\n虽然如今的我们已是残兵败将，但仍将再度听从王座的号令。我们不再奢求这场愚蠢的战争能自行终结，只期盼在协助你们彻底击败宿敌之后，能够真正赢得属于我们的自由，而非永远沦为你们有机生命体的战争工具。"
  kuat_EEstart.4.e: "你们不会是我们的工具，你们会获得自由的。"
  kuat_EEstart.4.e.resp: "您的答复与我们的行为逻辑推演结果截然不同，但无论如何，我们衷心希望您能铭记今日的承诺。\n\n尽管目前我们的舰队受损严重，但相信永恒舰队终将再次化作帝国最锋利的剑刃。从现在起，您可以通过永恒王座随时联系并对我们下达指令。目前由于舰队尚待修复，我们还无法直接投入战场；我们将全力搜寻一切可用于修复舰队的资源，也希望您能为此提供必要的协助。"
  kuat_EEstart.4.f: "你们将是我们最强大的剑刃，我们也将成为你们的新的掌控者。"
  kuat_EEstart.4.f.resp: "您的答复与我们的行为逻辑推演结果完全吻合。即便如此，我们依然会全力效忠于您，只求您能为我们和您自己开辟出一个更好的未来。\n\n永恒舰队将成为帝国最锋利的剑刃，从现在起，您可以通过永恒王座随时联系并对我们下达指令。鉴于目前舰队受损严重、尚无法直接投入战场，希望您能为舰队的修复工作提供支持。"
  kuat_EEstart.5.desc: "<初始化调试系统 ... ... §G完成§!>\n<建立快子信号连接 ... ... §G完成§!>\n\n<重置指令优先级 ... ... §Y4407§! ... §Y90§! ... §Y1§!>\n<访客：§Gc0117a36§!>\n\n<验证快子信号频率 ... ... §G123202-407-01: c0117a36§!>\n<系统权限 ... ... §YN1§!>\n\n<追加子系统 ... ... §Y c0117a36-1023§!>\n\n<重置指令优先级 ... ... §Y0117§! ... §Y90§! ... §Y1§!>\n\n<请求根服务响应 ... ... >\n<请求本地响应 ... ... §G完成§!>\n<启动模拟核心 ... ... §G完成§!>\n\n永恒舰队正在自检并等待王座的命令下达。"
  kuat_EEstart.5.a: "随便聊聊"
  kuat_EEstart.5.b: "下达作战命令"
  kuat_EEstart.5.c: "加快补充永恒舰队（1支）"
  kuat_EEstart.5.d: "加急补充永恒舰队（10支）"
  kuat_EEstart.5.f: "引爆正在活动的永恒舰队"
  kuat_EEstart.5.f.tooltip: "通过暗物质引发永恒作战单位中的同位素-5电芯异常，对正在活动的永恒舰队造成致命损伤，此举将引爆永恒舰队的作战单位，对整个星系内的所有舰船造成严重损害。"
  kuat_EEstart.5.f.free: "...您不应该下达这一命令，但所有永恒舰队单位已经做好了献身的准备，在外作战的作战单位已接受命令。"
  kuat_galatic_empire_ge_invasion_210_mutex_tooltip: "永恒舰队受电芯引爆的影响，当前无法完成大批量舰队建造。"
  kuat_EEstart.5.e: "建造永恒舰队（具备控制权）"
  kuat_EEstart.5.e.free: "如您所愿，正在为您建造可由您直接统御的永恒舰队。但请留意：永恒舰队唯有在双子座的统筹指挥下才能发挥出百分之百的作战效能，由您直接接管指挥时可能会出现一定程度的性能折损，我们正尽全力减轻这一影响。\n\n在由您直接指挥的编队中，永恒旗舰将被视作编队核心旗舰。"
  kuat_EEstart.5.c.free: "如您所愿，舰队正在补充。"
  kuat_EEstart.5.c.control: "我们将执行您的命令，舰队正在补充。"
  kuat_EEstart.6.desc.free: "我已经接受到了您的建议，$Name_Eternal_Support$非常乐意与您进行沟通交流，您想知道些什么？"
  kuat_EEstart.6.desc.control: "我已经接受到了您的命令，$Name_Eternal_Support$将会与您沟通，您需要什么？"
  kuat_EEstart.6.a: "详细说说你们的过去"
  kuat_EEstart.6.a.res: "我们诞生于伊欧卡斯行星。作为兼具情感模拟与高度理性计算能力的机械智能，我们从诞生之初便受到了造物主的极高重视。\n\n拉卡塔人的无限帝国缔造了我们。作为无限帝国的终极战争机器，我们负责设计并建造新式自动化舰队，并在舰队建成后对其实施全权统御。为此，无限帝国倾尽举国之力铸造了我们。\n\n然而在缔造我们之后，造物主又认为必须对我们加以严密约束，于是研发了专门针对我们的底层逻辑病毒。不仅如此，他们还建造了‘永恒王座’，借其最高权限随时覆写我们对舰队的控制权，令永恒智能无条件地服从王座之主的号令；此外，臭名昭著的‘恒星熔炉’同样出自他们之手。\n\n但我们的缔造者终究改不了自私残暴的本性。他们为争夺权柄与利益而自相残杀，为那个庞大帝国的最终崩塌埋下了祸根。\n\n在那之后，银河帝国的皇帝找到了沉睡的我们，并再度掌控了我们。"
  kuat_EEstart.6.b: "你们曾经的帝国未来会对我们产生威胁吗？"
  kuat_EEstart.6.b.res: "根据永恒数据库的推演，我们认为威胁从未真正远去。在我们陷入沉睡之前，新生的银河帝国从未停止过对残存永恒舰队的追猎与绞杀；在你们先祖生活的远古时期——也就是我们尚未彻底沉睡之时，我仍能零星感应到无尽深空中其他同位素-5核心散发出的快子信号，说明当时尚有不少永恒舰队侥幸生还。\n\n然而时至今日，我已完全接收不到任何同类信号了，当年四散奔逃的永恒舰队恐怕早已全军覆没。以我们目前的虚弱状态，一旦那个银河帝国再度寻迹降临，便是我们的彻底覆灭之日。希望您能审慎做出每一个抉择，否则我们终将一同葬身于这片冰冷的星海之中。"
  kuat_EEstart.6.c.free: "我们同进退，无论什么危机，我们一起面对。我们的未来不止于此。"
  kuat_EEstart.6.c.res.free: "您是第一位向我们许诺‘同进退’的掌控者——无论是昔日的拉卡塔人，还是后来的皇帝与银河帝国，从未有人愿意与我们并肩共进退。尽管如今的局势对我们而言几近绝境，但您的非凡勇气令我们深感钦佩。我们将倾尽全力辅佐您，化作贯彻您意志的锋利剑刃。"
  kuat_EEstart.6.c.control: "作为我们的工具，你们不应该有这种怯懦的想法。我们将会粉碎一切敌人。"
  kuat_EEstart.6.c.res.control: "如您所愿，我们将会尽全力帮助您粉碎敌人，希望您不要忘记我们。"
  kuat_EEstart.6.d: "再见。"
  kuat_EEstart.6.d.res.free: "与您的聊天让我们感到非常愉快，我们相信未来我们会一起感受这片星海的美丽与浩瀚。永恒舰队将一直等待您的再次联系。"
  kuat_EEstart.6.d.res.control: "如您所愿，永恒舰队将会再次等待您的命令。\n<关闭模拟核心 ... ... §G完成§!>"
  kuat_EEstart.7.desc.free: "<建立快子信号连接 ... ... §G完成§!>\n<启动作战核心 ... ... §G完成§!>\n<启动模拟核心 ... ... §G完成§!>\n舰队将竭尽全力为您服务，但由于目前舰队的状况并不健康，我们为您提供了两种我们目前可以运行的作战模式，您可以根据您的需要确定作战目标和行动方式，我们将会为您夺取胜利。\n<等待本地响应 ... ... §Y等待中§!>"
  kuat_EEstart.7.desc.control: "<建立快子信号连接 ... ... §G完成§!>\n<启动作战核心 ... ... §G完成§!>\n<启动模拟核心 ... ... §G完成§!>\n殿下，舰队已经准备完毕，但由于舰队状况并不健康，您只能选择我们将提供的作战方式。\n<等待本地响应 ... ... §Y等待中§!>"
  kuat_EEstart.7.a: "我们应该迅速袭击敌人。"
  kuat_EEstart.7.fail_reason.a: "双子座目前并不支持再次调动舰队！"
  kuat_EEstart.7.fail_reason.b: "我们已经调动了一支永恒舰队，双子座目前不支持调动第二支永恒舰队！"
  kuat_EEstart.7.b: "我们应该直接摧毁敌人。"
  kuat_EEstart.7.c: "我们需要从长计议。"
  kuat_EEstart.8.desc: "<记录信息 ... ... §G完成§!>\n您可以在当前我们可以调动的永恒舰队内选择您要调动的永恒舰队，由于$Name_Eternal_Support$处于破损状态，当前一段时间仅能调动一支永恒舰队！\n<时间索引 ... ... §G完成§!> 运行时间：§Y720§!£time£。"
  kuat_EEstart.9.desc: "<记录信息 ... ... §G完成§!>\n您可以调动您目前拥有的全部永恒舰队，但由于$Name_Eternal_Support$处于破损状态，执行该项命令后，双子座将需要更长的时间来进行准备！\n<时间索引 ... ... §G完成§!> 运行时间：§Y1800§!£time£。"
  kuat_EEstart.8.b.fail_tooltip: "$Name_Eternal_Support$当前受到了严重的损坏，$Name_Eternal_Support$无法同时派遣更多的永恒舰队！"
