  kuat_EEstart.2.name: "巨大的人造结构已建成于 [Root.GetName]"
  kuat_EEstart.2.desc: "我们的工程团队已经完成了对 [Root.GetName] 的宏伟工程，并按照永恒理想城的设计方案完成了全面改造。尽管该项目耗费了海量资源，但这一切都是值得的——我们创造了奇迹，这颗行星也将成为帝国永恒繁荣的象征。"
  kuat_EEstart.2.ringworld.desc: "我们的工程团队已经完成了对 [Root.GetName] 的宏伟工程，并按照永恒环世界的设计方案完成了全面改造。尽管该项目耗费了海量资源，但这一切都是值得的——我们创造了奇迹，这颗行星也将成为帝国永恒繁荣的象征。"
  kuat_EEstart.2.a.desc: "我们的工程团队已经完成了对 [Root.GetName] 的宏伟工程，并按照自动化数据星球的设计方案完成了全面改造。尽管该项目耗费了海量资源，但这一切都是值得的——我们创造了奇迹，这颗行星也将成为帝国永恒繁荣的象征。"
  kuat_EEstart.2.a.ringworld.desc: "我们的工程团队已经完成了对 [Root.GetName] 的宏伟工程，并按照自动化数据环世界的设计方案完成了全面改造。尽管该项目耗费了海量资源，但这一切都是值得的——我们创造了奇迹，这颗行星也将成为帝国永恒繁荣的象征。"
  kuat_EEstart.2.a: "这一切都是值得的"
  kuat_EEstart.2.b: "好了，不要再通知我了"

  misc_system_desc_5: "$NAME_kuat_galatic_empire_e_area$"
  misc_system_desc_5_desc: "帝国科研部门捕获了一个全新的信号频段。经科研人员测定，该频段源自一个此前从未在星图上标注过的未知星系。研究人员认为，这将是我们探索深空的重要里程碑，并强烈建议尽快派遣舰队探索该星系。"
  misc_system_desc_5_desc_finished: "我们对$NAME_kuat_galatic_empire_e_area$的研究已告一段落，截至目前，科研人员发掘出了大量极具价值的情报。\n\n$misc_system_desc_5$竟然是恩多迪亚帝国故意从星图中抹去的隐秘星系。由于其恒星光芒极其微弱，恩多迪亚帝国便利用这一特性将其改造成了隐蔽的军事要塞，并在此集中了举国上下的军事力量与经济、技术人才。在她们与夸特战争的最后几年里，这里成为了恩多迪亚帝国最后的抵抗据点。\n\n科研人员对该星系的扫描结果显示，相比先前的设施区，这里漂浮着规模更为庞大的舰船残骸。显然，恩多迪亚帝国与$Name_kuat$曾在$misc_system_desc_5$爆发过一场空前惨烈的决战。据估算，折损于此的战舰数量早已超越了我们对常规军事力量的认知上限；然而在这场浩劫过后，如今只剩下漫天漂浮的残骸与损毁的巨型构造体。\n\n此外，我们在该星系的调查报告表明，恩多迪亚帝国的末代皇帝恩多迪亚一世正是在此与$Name_Kuat_Fire_base$达成了秘密交易。凭借这项协定，$Name_Kuat_Fire_base$出面阻止了夸特对恩多迪亚帝国赶尽杀绝；而作为代价，末代皇帝被押送至$Name_Kuat_Fire_base$的控制区，该国秘密开展的同位素-5研究资料也悉数落入$Name_Kuat_Fire_base$之手，因此$Name_Kuat_Fire_base$自此便一直驻守着这座要塞。目前尚不清楚此事会对永恒舰队产生何种影响，但我们绝不能掉以轻心。\n\n所幸在帝国领袖的英明领导下，我们一举摧毁了$Name_Kuat_Fire_base$的守卫舰队，重启了跳跃星门并夺取了同位素-5，我们的永恒舰队也因此得以完全修复。随后，在我方主力舰队与永恒舰队的协同作战下，卷土重来的$Name_kuat$被我们彻底击溃，如今他们再也无法趾高气扬了。\n\n总而言之，目前我们可以确认以下几点：\n1. $misc_system_desc_5$是恩多迪亚帝国真正的最后首都，也是她们秘密研究永恒舰队的核心基地。\n2. $Name_kuat$与恩多迪亚帝国的全面战争最终以恩多迪亚帝国的覆灭而告终，期间$Name_Kuat_Fire_base$介入并主导了终局。\n3. $Name_Kuat_Fire_base$以保全恩多迪亚遗民的种族延续为条件，换取了关于同位素-5的全部研究资料，目前尚不确定这会对永恒舰队造成何种影响。\n4. 我们已经彻底击退了入侵此地的$Name_kuat$舰队。\n\n然而当前局势依然扑朔迷离，我们仍需继续深入调查。"
  kuat_legacy_key_world_5_desc: "[kuat_legacy_key_world_5]"
