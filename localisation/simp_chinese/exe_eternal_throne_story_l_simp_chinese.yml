  building_eternal_pop_assembly:0 "§E永恒组装厂§!"
  building_eternal_pop_assembly_desc:0 "永恒组装厂将为永恒帝国源源不断地组装机器人和克隆人。"

  building_eternal_pop_assembly_organic_assembly:0 "永恒组装厂将采用全新的星球人口组装模式：当空余岗位或者人口数量低于50时，将以空余住房数量为标准计算人口增长数值，当空余人口或者岗位超过50时，以岗位空余计算人口增长。\n\n组装速度计算公式：组装速度 = max（星球区划数*3,星球空余住房）\n\n基础组装初始为1，每增加45人口基础增加1，最高为5"

