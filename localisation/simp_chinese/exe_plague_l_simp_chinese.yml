   ag_legacy_stroy_chain_title: "§E失落文明遗迹§!"
   ag_legacy_stroy_chain_desc: "我们的雷达探测到一些奇怪的信号，由于其极其罕见的信号传播模式，我们的研究人员推断是某种外星文明发射的信号波。研究部门建议我们尽快调查这些信号的来源。"
   ag_legacy_stroy.1: "§E奇怪的信号§!"
   ag_legacy_stroy.1.desc:0 "我们研究人员在[root.from.planet.GetName]上的调查已经告一段落。在这场调查中，研究人员成功与水晶建立了联系，并获得了一些尘封于废墟深处的线索——那些轰炸星球的舰队，我们似乎在哪里见过……\n\n无论如何，这些都是揭开不为人知的秘密的重要线索，接下来我们需要等待研究人员的进一步突破。"
   ag_legacy_stroy.2: "§E云城避难所§!"
   ag_legacy_stroy.2.desc: "我们研究人员在[root.from.planet.GetName]上的调查已经告一段落。在这场调查中，研究人员成功获取了更多信息：云城避难所中的影像充斥着绝望与哀嚎。通过对资料的整理，我们可以确定，这座设施的建造者曾是一个极为强大的文明，但他们遭遇了一个远比自己强大的强敌。在战争战败后，建造者文明分裂为妥协派与抵抗派，然而他们最终的归宿目前仍待查明。\n\n接下来我们需要等待研究人员的进一步突破。"
   ag_legacy_stroy.3: "§E海底基地§!"
   ag_legacy_stroy.3.desc: "我们研究人员在[root.from.planet.GetName]上的调查已经告一段落。尽管这座遗迹中的线索并不明显，研究人员还是从中整理出了一些头绪：这座海底基地源自遗迹文明的抵抗派，他们在海底建立了武器研发与人员训练中心，试图凭此与毁灭他们家园的强敌抗争到底。\n\n但奇怪的是，基地内并没有明显的交战痕迹，研究人员推测这里是被主动遗弃的，具体原因仍有待查明。接下来我们需要对水晶开展专项研究调查。"
   ag_legacy_stroy.4: "§E神秘的洞窟§!"
   ag_legacy_stroy.4.desc: "我们研究人员在[root.from.planet.GetName]上的调查已经告一段落。调查队发现冰层之下的设施中竟然隐藏着一座避难所，而避难所内的数据存储设施里几乎没有任何有价值的信息，所有数据均已被人为彻底清除。因此我们有理由确信这座避难所已被主动废弃，仍需进一步调查。接下来我们需要等待研究人员的进一步突破。"
   ag_legacy_stroy.5: "§E殊途避难所§!"
   ag_legacy_stroy.5.desc: "我们研究人员在[root.from.planet.GetName]上的调查已经告一段落。这座避难所最初是为了庇护民众免受战火波及而建，但我们可以确定，设施的所有者随后下达了撤离命令，要求民众弃守避难所，同时转移并封存了大批数据存储设备。研究人员推测，遗址建造者在意识到抵抗无望后，试图在设施内保存其历史档案与核心数据，为同胞后裔留下历史的真相。\n\n§Y无论如何，数据设施中留下了一些关键线索，我们应当去寻找并控制其中记载的特殊星门——研究人员认为那应当是一座夸特星门。§!"
   ag_legacy_stroy.6: "§E古代遗迹§!"
   ag_legacy_stroy.6.desc:0 "我们研究人员在[root.from.planet.GetName]上的调查已经告一段落，这座遗迹昔日应当是“无限帝国”的一处偏远殖民地。据文献记载，无限帝国是在数万年前、人类尚未诞生之时统治整个银河系的庞大帝国。我们如今已难以想象它当年是何等繁荣与强盛，但这样一个不可一世的帝国，却在极短的时间内迅速覆灭了。这座偏远的殖民地似乎也遭遇了同样的厄运，尽管现场没有留下任何能够直接揭示其覆灭原因的线索，但可以确定的是，当灾难降临时，这座偏远殖民地已彻底断绝了来自无限帝国政府与军队的救援。\n\n§Y无论如何，我们应当将这一事件记录在案，或许这些先驱者帝国的覆灭另有隐情。§!"
   ag_legacy_stroy.7:0 "§E古代遗迹§!"
   ag_legacy_stroy.7.desc:0 "名为$NAME_KALIWA$的星球上疑点重重，目前可以确定该星球曾是拉卡塔人的一座繁华都市，但在一场席卷整个无限帝国的浩劫爆发后，这座城市便迅速走向了衰败。\n\n此外，通过对遗迹数据的深入分析，研究人员推断这座遗迹曾是拉卡塔人躲避强敌的避难所，内部配备了相当完善的防卫设施与充足的食物水源，本足以维系整颗星球上拉卡塔人的生存。然而事实上，这一切并未能拯救他们——这些遗民与他们的无限帝国一同迅速消亡，避难所所在的星球也彻底沦为了死寂的荒芜之地。尽管仍有部分AI在孤独地运转，但这里早已失去了往日的辉煌。\n\n§Y究竟是什么力量才能让如此庞大的帝国分崩离析，是天灾，还是人祸？§!"

   ancient_shadow_place_B: "§R完成后获取$Name_boss_Venator$、$Name_boss_X308_Balletor$、$Name_boss_X308_Titan$、$Name_boss_Venator_II$建造权限，请在造船厂中查看，该型舰船不可设计。§!"
   ancient_shadow_place: "§R获得科技研究选项：$tech_kuat_starbase$，请在科技界面选中研究。§!"


   ag_legacy_stroy_recording_1_desc: "§G长官，171避难所建设工程正在按计划推进，但是前线舰队的情况似乎不容乐观，我们已经很久没有接收到殿后舰队的任何残留信息了。\n\n§Y嗯，避难所的建设正常推进就好。前线舰队恐怕支撑不了多久了，他们要来了。上头那边日子也不好过，反对派武装已经向他们投降，我们的局势愈发严峻。\n\n§G长官……我们这里恐怕藏不了多久了，我们已经失去了好几个避难所的通讯，反对派很可能已经把我们出卖了。\n\n§Y无论如何，我们已经无路可退，必须在三个太阳日前完成设施的最后封闭工程。这些机密数据绝不能落入任何人手中，必须彻底删除！没有人会知道我们蛰伏在何处，我们将在黑暗中静待黎明的到来。§!"
   ag_legacy_stroy_recording_2_desc:0 "§G长官，来自171设施的信号消失了！他们在最后的通报中称已启动应急预案，171设施的隐蔽计划似乎失败了，具体原因尚不清楚。\n\n§Y情况有些不对劲，你先把文件记录好。我们的首要任务是完成131设施，把171设施发来的紧急数据也一并封存起来，再有一个太阳日就能完工了。\n\n§G是，长官。\n\n§P警告：星球轨道附近出现大量敌对舰队信号，正在启动应急预案，DP-131登机窗口已开启。\n\n§Y这些该死的外来者！果然是那些叛徒泄露了我们的坐标！快让民众撤离，到了我们殊死一搏的时刻了！§!"
   ag_legacy_stroy_recording_3_desc:0 "§G你们说，这一趟我们能赚多少钱？干完这一单，咱们以后也是有钱人了！\n\n§Y你可安分点吧，这可是从古战场禁区里捞出来的东西，要是出了一点差错，咱们全都得死在太空里。\n\n§G大哥，你说得对。不过大哥，你那些货物里多一个少一个，他们应该察觉不到吧？到时候咱们私底下倒手卖出去，那可是一大笔钱，足够买一艘新飞船了。\n\n§Y嗯……或许可以试试。咱们快到了，客户要来了。\n\n§E很好，你们尽心尽责为我们办事，我们自然不会亏待你们。不过货物里似乎少了点什么——还有一颗水晶呢！？\n\n§Y总督大人，这已经是全部了啊，借我们一万个胆子也不敢欺瞒您啊！\n\n§P既然如此，交易愉快，一路走好。（等他们起飞后，直接摧毁他们的飞船。）§!"
   ag_legacy_stroy_recording_4_desc: "§G总监，我们已经失去了大部分避难所的通讯信号，$NAME_kuat_galatic_empire_e_area$向我们发来了最后的诏令，陛下让我们自行决定去留，目前议会里反对派已经占据了多数席位。\n\n§Y呸！这些该死的投降派，抛弃自己的家人，背叛自己的种族，这群害虫必将被历史唾弃！我们绝不能苟且偷生，避难所虽然安全，但储备的资源根本不足以支撑200个回归年。倘若所有后备计划都宣告失败，我们的后代就会被活活困死在避难所里。\n\n§G总监，这场战争，我们真的还能赢吗？\n\n§Y混账，你在胡说些什么！这是皇帝陛下的旨意！§!"
   ag_legacy_stroy_recording_5_desc: "§G将军，我们的兵力封存设施已接近竣工，海底基地的主体建设也已全部完成，目前只剩下外围防卫设施尚未完工。\n\n§Y很好，我们就在这里死死拖住这群该死的夸特人。\n\n§G将军，目前基地内部已经出现了质疑陛下决策的声音，而且人数不少。将在外，军令有所不受，还请将军三思啊！\n\n§Y怎么，连你也想投降了吗？罢了，兄弟们一路走来都不容易，实在不行，想走的人都走吧，我会独自坚守此地，直到最后一刻。\n\n§G将军……既然如此，对不住了，将军！兄弟们绝不能眼睁睁看着您留下来送死。来人，架着将军上船！\n\n§Y你！§!"
   ag_legacy_stroy_recording_6_desc:0 "我们研究人员在[root.from.planet.GetName]上的调查已经告一段落，这座遗迹昔日应当是“无限帝国”的一处偏远殖民地。\n\n据文献记载，无限帝国是在数万年前、人类尚未诞生之时统治整个银河系的庞大帝国。我们如今已难以想象它当年是何等繁荣与强盛，但这样一个不可一世的帝国，却在极短的时间内迅速覆灭了。这座偏远的殖民地似乎也遭遇了同样的厄运，现场没有留下任何能够直接揭示其覆灭原因的线索。\n\n但可以确定的是，当灾难降临时，这座偏远殖民地已彻底断绝了来自无限帝国政府与军队的救援。§Y无论如何，我们应当将这一事件记录在案，或许这些先驱者帝国的覆灭另有隐情。§!"
   ag_legacy_stroy_recording_7_desc: "名为$NAME_KALIWA$的星球上疑点重重，目前可以确定该星球曾是拉卡塔人的一座繁华都市，但在一场席卷整个无限帝国的浩劫爆发后，这座城市便迅速走向了衰败。\n\n此外，通过对遗迹数据的深入分析，研究人员推断这座遗迹曾是拉卡塔人躲避强敌的避难所，内部配备了相当完善的防卫设施与充足的食物水源，本足以维系整颗星球上拉卡塔人的生存。然而事实上，这一切并未能拯救他们——这些遗民与他们的无限帝国一同迅速消亡，避难所所在的星球也彻底沦为了死寂的荒芜之地。\n\n尽管仍有部分AI在孤独地运转，但这里早已失去了往日的辉煌。§Y究竟是什么力量才能让如此庞大的帝国分崩离析，是天灾，还是人祸？§!"
   ag_legacy_stroy_recording_8_desc: "$kuat_legacy_key_world_5_desc$"
   ag_legacy_stroy_recording_9_desc: "$kuat_legacy_key_world_1_desc$"
   ag_legacy_stroy_recording_10_desc: "$kuat_legacy_key_world_2_desc$"
   ag_legacy_stroy_recording_11_desc: "$kuat_legacy_key_world_3_desc$"
   ag_legacy_stroy_recording_12_desc: "$kuat_legacy_key_world_4_desc$"
   ag_legacy_stroy_recording_13_desc: "$kuat_legacy_key_world_6_desc$"
   ag_legacy_stroy_recording_14_desc: "$kuat_legacy_key_world_7_desc$"
   ag_legacy_stroy_recording_15_desc: "§G大哥，你说咱们的神话是不是真的？我爷爷以前跟我说过，扎库之龙不可亵渎。\n\n§Y那只是哄小孩的玩意儿，亏你也信。行了别唠叨了，上头派任务下来了，咱们发现了一艘从未见过的远古飞船，里头兴许能捞到不少值钱的宝贝。\n\n§G大哥，你看，这艘船外壳材料反馈的辐射读数好像有点不对劲，咱们可能撞见不得了的东西了。\n\n§Y你说得对，这是一种我们从未见过的诡异波段……不对，这个波段……快停下，别再往前走了，危险！该死，我们已经退不回去了，快给后面的人传话，千万不要进来！§!"
   ag_legacy_stroy_recording_16_desc: "§G博士，我成了，我成了！从那艘飞船上提取的物质简直有着不可思议的特性，这……这简直就是神迹！\n\n§Y……停，快停下！不要再继续了，该死，你疯了吗？！\n\n§G博士，我成了，我成了！神明在指引我们，我们过去的道路是错误的，哈哈哈，呜呜呜呜，哈哈哈哈哈！博士，让我们一起向神明赎罪吧！\n\n§Y该死的，你……快……快向舰队发出求救……§!"
   ag_legacy_stroy_recording_17_desc: "§G局长，近期我们已经接到了多起研究人员突然发狂袭击周围同事的报告，而他们都有一个共同点——过去都曾是齐尔德罗格教团的成员。我们是不是应该立刻采取行动？\n\n§Y是啊，你说得没错。但祂已经苏醒了，既然你已经察觉到了真相，那就加入我们吧，和我们一起迎接创世神的降临。\n\n§G难道……你、你也是教团余孽？！上头绝不会放过你们的！\n\n§Y哈哈哈哈，上头？他们才是最大的亵渎者，竟然妄图控制我们的神明！既然如此，就用你的鲜血作为我向祂献上的第一份祭品吧！§!"
   ag_legacy_stroy_recording_18_desc: "§G舰长，这批教团余孽似乎正在向新发现的挖掘场集结。\n\n§Y很好，接下来这群愚蠢的教团分子将会为我们带来令人满意的成果。传令各部门：等他们重启遗迹之后，立刻动手清理掉这群疯子。\n\n§G是，舰长！各小队注意，随时待命出击。§!"
   ag_legacy_stroy_recording_19_desc: "§G兄弟，咱们这回要发大财了！你看见没，这可是一艘保存完好的巨舰，只要能拿下这条船，咱们就是这片星域最强的海盗！\n\n§Y不对劲啊兄弟，这条船上完全没有生命反应，但动力系统却仍在正常运转，会不会是个陷阱？\n\n§G怎么可能！你到底去不去？还是说你怕了？你不去我自己去！\n\n§Y我不去，要去你自己去，我还想多活几年呢。\n\n§G哼，胆小鬼！等老子夺下了这条船，看你还敢不敢嘴硬……奇怪，这艘船怎么完全无法接管控制权？不对，这些防卫机器人怎么突然启动了？！不……§!"
   ag_legacy_stroy_recording_20_desc: "§E$Name_Kuat_Fire_base$越来越猖狂了，他们已经把手伸进议会里了。\n\n§G哼，那又有什么办法？你提出的那个愚蠢的研究计划，至今也没有半点起色。\n\n§E少在这里说风凉话！按你的计划行事，不就是直接跟$Name_Kuat_Fire_base$全面开战吗？帝国已经经不起再一次分崩离析了。\n\n§G非常时期，当用非常手段，$Name_Kuat_Fire_base$已经察觉到我们的动作了。\n\n§GS-1919810415411-114区域传来了好消息，那边已经掌握了永恒舰队的关键技术信息，这些不稳定的远古造物未来将转化为帝国的强大军事优势。计划必须成功，诸位各司其职，为了帝国！\n\n§G你确定还要继续推进吗？万一$Name_Kuat_Fire_base$直接撕破脸皮动手，我们现有的舰队可招架不住。\n\n§Y够了，计划照常执行！$Name_Kuat_Fire_base$还不敢公然挑起内战——就算他们真想吞掉我们，至少也得崩掉几颗牙！§!"

