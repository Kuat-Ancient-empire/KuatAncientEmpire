   kuat_species_trait_mechinical:0 "增强植入体"
   kuat_species_trait_mechinical_desc:0 "在强调专精的神经改造产业中，大脑增强植入体是少有的异类。它提供多重的功效；在接入大脑枕叶提升感知能力的同时，通过影响新皮层，增强了大脑对于信息的处理能力。在由多个植入体组成神经植入体网络后，可以发挥更高的性能。\n\n这项技术来自帝国对于古代文明神经改造技术的重现，经过了足够的测试以确保其在稳定环境下的安全。"
   leader_kuat_species_trait_mechinicals:0 "便捷性增强植入体"
   leader_kuat_species_trait_mechinicals_desc:0 "在强调专精的神经改造产业中，大脑增强植入体是少有的异类。它提供多重的功效；在接入大脑枕叶提升感知能力的同时，通过影响新皮层，增强了大脑对于信息的处理能力。在由多个植入体组成神经植入体网络后，可以发挥更高的性能。\n\n这项技术来自帝国对于古代文明神经改造技术的重现，经过了足够的测试以确保其在稳定环境下的安全。"
   leader_trait_eternal_learned_leader_legend: "永恒智能"
   leader_trait_eternal_learned_leader_legend_desc: "曾经作为永恒智能的一部分，尽管目前已经失去了大部分的数据库，但仍然具备强大的能力。当其作为舰队指挥官时，可以让单旗舰舰队能够发挥出多旗舰舰队的作用。"
