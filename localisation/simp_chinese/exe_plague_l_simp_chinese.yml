l_simp_chinese:
   Name_F_1: "§E虚空要塞(F)§!"
   Name_Kuat_Contractor: "§E流浪者§!"
   Name_Kuat_DeD_Contractor: "§B冬眠者§!"
   Name_Kuat_StarContractor: "§E后裔§!"
   misc_system_desc_6: "$Name_F_1$"
   misc_system_desc_6_desc: "帝国科研部门捕获了一个新的信号频段，我们的科研人员发现频段是由一个从未在星图上发现过的星系发出的。研究人员认为，这将是我们探索深空的里程碑。我们的科研部门要求我们尽快探索这个星系。"
   misc_system_desc_6_desc_finished: "我们对$misc_system_desc_6$的调查取得了新的进展。这次我们的科研人员收集到了大量来自$Name_Kuat_StarContractor$的资料，其内容之复杂和晦涩都超乎想象。经过初步破译，我们发现这批资料涉及到了$Name_Kuat_StarContractor$广泛的学术研究，包括天体物理学、量子力学、生物工程学、历史学、神学等奇怪的学科。\n\n另外，这批资料中还提到了大量我们仍然不可知的势力，我们仅仅了解了恩多迪亚帝国和$Name_kuat$的历史与它们之间的恩怨，但其他势力仍然处于迷雾当中，我们尚且还不知道具体的信息。\n\n恩多迪亚帝国已经崩溃，而阴影仍然笼罩在天穹之上，或许我们应该停下脚步，重新审视我们的未来，也许，恩多迪亚帝国是对的。\n\n总体来说，这次的发现打开了通往更广阔层面的大门，但前路何去何从，仍然笼罩在迷雾之中。我们会保持警惕，不惜一切代价守护我们辛辛苦苦获得的成果。\n\n衷心祈盼我们的文明能在您英明的领导下，开启属于我们的伟大征程。"
   kuat_legacy_key_world_6_desc: "[kuat_legacy_key_world_6]"

   kuat_plague.62.name:0 "§H[from.GetName]§!上的驻军危机。"
   kuat_plague.62.desc:0 "根据指挥中心的最后一条消息，幸存的政府在他们那设置了障碍，然而§P感染者§!闯入了城市，无数手无寸铁的居民来不及逃跑，在我们军队的眼皮底下被转化为了§R腐化原体§!，我们的军队对星球的控制权已经受到严重打击，情况紧急，我们需要支援。\n\n如果我们不增派援军，我们将失去残存的幸存者！甚至失去整个星球的控制权。"
   kuat_plague.62.0:0 "我们将不惜一切代价重新夺回对星球的控制权。"
   kuat_plague.62.1:0 "我们需要尽快拯救我们的公民！"
   kuat_plague.62.2:0 "烧了他们！"
   kuat_plague.62.3:0 "真是可怕！"
   kuat_plague.62.4:0 "我们需要解决这一切！"
   kuat_plague.62.62:0 "以后这将是我们的哀悼日。"
   kuat_plague.62.6:0 "让我们为他们的灵魂祈祷。"
   kuat_plague.62.7:0 "我们必须制定有效的对策。"
   kuat_plague.9.name:0 "瘟疫：报告"
   kuat_plague.9.desc.0:0 "我们的科学小组仔细研究了所有可用数据并分析了各种可行方案。他们发现：\n这种生物制剂极难被中和，但星球上§P诊所、医院、犯罪度£crime£、舒适度£amenities£§!的状况会直接影响人口的存活率。"
   kuat_plague.9.desc.1:0 "§P人工轨道结构§!的某些特点可以帮助预防感染。我们或许可以利用§P人工轨道结构§!。"
   kuat_plague.9.desc.2:0 "由于情况危急，我们的专家已经建立了多个相关的感染模型并对§H[kuat_plague_gaia.GetName]§!的人们进行了验证测试。他们的结论指出这种星球的自然环境改善了人们对病毒的抵抗力。或许更好的环境会帮助我们缓解这次危机。"
   kuat_plague.9.0:0 "需要准备向人民发出呼吁。"
   kuat_plague.9.0.tooltip:0 "给予§H$edict_kuat_plague_quarantine$§!的使用权。"
   kuat_plague.10.name:0 "呼吁"
   kuat_plague.10.desc.1.0:0 "在确认边境地区出现致命§P腐化§!疫情后，政府已决定暂停所有贸易、科学合作以及旅游活动。政府研究部门已展开新一轮临床医学攻关，这场灾难很快就会平息。\n"
   kuat_plague.10.desc.2.0:0 "同时也限制了来自隔离区的§P难民§!进入。\n"
   kuat_plague.10.desc.3.0:0 "从此以后，任何与外星人的联系都被认为是叛国。\n"
   kuat_plague.10.desc.4.0:0 "政府并不排斥§P军事干涉§!作为抵抗感染的最后手段。\n"
   kuat_plague.10.desc.4.1:0 "政府并不排斥§P军事干涉§!作为一种有效的抗感染措施。\n"
   kuat_plague.10.desc.4.2:0 "政府并不排斥§P军事干涉§!作为对感染的一种惩罚性措施。\n"
   kuat_plague.10.desc.4.3:0 "政府并不排斥§P军事干涉§!作为对感染的威慑。\n"
   kuat_plague.10.desc.1.1:0 "在其他种族的边疆地区确认致命§P腐化§!的情况后，政府下令限制所有与之相关的贸易和旅游联系。\n"
   kuat_plague.10.desc.3.1:0 "为了避免腐化的传播，我们不得不采取这样的措施。值得注意的是，通信渠道仍然开放，这将使我们的科学家能够与其他种族的代表交换数据，并共同努力解决问题。\n"
   kuat_plague.10.desc.1.2:0 "在确定了边境地区的致命§P腐化§!的病例后，政府已下令停止所有与潜在对手的贸易、科学和旅游联系。\n"
   kuat_plague.10.desc.3.2:0 "我们被迫采取这样的措施，以避免这种腐化的蔓延，以及威胁到我们的主权的可能性。边防部队已进入警戒状态。\n"
   kuat_plague.10.desc.1.3:0 "在确定了边境地区的致命§P腐化§!的病例后，政府已下令停止所有与邻国的贸易、科学和旅游联系。\n"
   kuat_plague.10.desc.3.3:0 "我们不得不采取这样的措施来避免腐化的传播。我们将向受影响的友好国家提供人道主义援助。\n"
   kuat_plague.10.desc.1.4:0 "这些不信神的罪人招致了造物主的愤怒：在与我们接壤的边疆地区发现了这种致命腐化的病例。政府已经下令停止所有与不洁者的贸易、科学和旅游联系。\n"
   kuat_plague.10.desc.3.4:0 "我们被迫采取这些措施以避免腐化的传播。我们将为他们早日康复而祈祷。\n"
   kuat_plague.10.desc.1.5:0 "在确认了致命的腐化之后！在边境地区，政府决定停止所有与这些无能傻瓜的贸易、科学和旅游联系。\n"
   kuat_plague.10.desc.3.5:0 "我们被迫采取这些措施以避免腐化的传播。我们最优秀的人才已经在研制疫苗。\n"
   kuat_plague.10.0:0 "我们必须站在一起。"
   kuat_plague.50.name:0 "银河传染病"
   kuat_plague.50.desc:0 "在我们与$Name_H_1$的遗迹中的古代AI进行沟通并得到祂们的警告与提示以后，我们的科学家从银河系各处发现了一些奇怪的痕迹，同时也听到一些§P疾病§!的谣言。虽然没有致命的病例，但对付这种疾病已经让大量民众感到恐慌。\n\n同样值得注意的是，这种疾病已经扩散到许多星球，并引起了我们疾病预防控制中心的关注。我们的研究部门认为我们应该重视来自古代AI的警告。"
   kuat_plague.50.0:0 "我们会注意的。"
   kuat_plague.50.1.0:0 "不幸的生物质。"
   kuat_plague.50.1.1:0 "可怜的有机体。"
   kuat_plague.50.1.2:0 "生物难题…"
   kuat_plague.50.2:0 "这对进化的更高形态来说不是什么问题。"
   kuat_plague.50.3:0 "行星生活方式的成本。"
   kuat_plague.50.4:0 "我们需要学习。"
   kuat_plague.50.4.tooltip:0 "真是神奇"
   kuat_plague.51.name:0 "银河大瘟疫"
   kuat_plague.51.desc.0.0:0 "来自古代AI的警告应验了。我们科学家的研究发现，一种§P疾病§!正以难以置信的速度演化得极具致命性，科学界将其命名为“腐化”。它已在整个银河系造成数百万人丧生，同时古代AI也再次向我们的科学家发出警告，声称这绝非寻常疾病，而是源自更高维度的致命传染性危机。研究人员认为，正是我们解除了恩多迪亚人留下的裂隙封印，才酿成了今日的惨状。虽然其具体传播机制尚不明确，但当务之急是尽快找到遏制腐化的办法。"
   kuat_plague.51.desc.1.0:0 "我们的帝国已经受到感染，我们的研究人员应该参与到研究瘟疫的项目中来。来自古代AI的警告是准确有效的，这场不明来源的危机已经蔓延到整个帝国，我们必须万众一心，战胜这一难关。"
   kuat_plague.51.desc.1.1:0 "我们的帝国仍未受到感染。但我们应该重视来自古代AI的信息，这场不明来源的危机已经开始潜伏在阴影之中了。"
   kuat_plague.51.0:0 "强大的力量正在考验我们的信念。"
   kuat_plague.51.1:0 "我们的计算并不令人振奋。"
   kuat_plague.52.name:0 "腐化原体瘟疫"
   kuat_plague.52.desc:0 "今天，在一颗受感染星球的幸存者撤离后不久，我们的一名异星生物学家向科学界提交了调查报告。\n\n他亲眼目睹了一具死者遗体如何重新恢复部分神经系统机能。不幸的是，所有复生的宿主都表现出极强的攻击性。这些感染者中绝大多数已丧失理智，但极少数个体竟展现出明显的智慧特征，研究人员暂将其称为“病毒原体”。这种感染似乎专门针对智慧生命的基因序列发起攻击，并在生物体层面以类似生物病毒的方式感染与扩散。我们必须设法化解这场危机，否则我们的种族将万劫不复。\n\n研究部门认为这些感染者具有一定的研究价值，但在当前局势下，我们必须全力应对危机。事实证明，古代AI的警告千真万确。\n\n这场疑似源自远古无限帝国的灾厄余孽，正在肆虐我们的帝国。"
   kuat_plague.52.0:0 "这是严重威胁！"
   kuat_plague.53.name:0 "传染病在§H[from.GetName]§!爆发！"
   kuat_plague.53.desc.0.0:0 "§H[from.GetName]§!上的管理部门向我们报告了当地人口受到§P感染§!的情况。由于情况紧急，目前检疫措施已在全球范围内部署，但腐化的蔓延速度仍在加快。"
   kuat_plague.53.desc.0.1:0 "§H[from.GetName]§!上的管理部门向我们报告当地发现了第一例腐化病毒的感染者案例，星球管理部门正在尽一切可能减轻负面影响，感染者已被净化。"
   kuat_plague.53.desc.0.2:0 "§H[from.GetName]§!上的§P腐化传染病§!已经进入最后阶段，我们的生物学家分析，这种腐化原体在某种意义上构成了一个特殊的生物群落，现在这颗星球有很大几率孵化出§R腐化原体群落§!，一旦爆发必将彻底摧毁整颗星球的文明。\n§R只要这颗星球上还有任何非免疫人口存在，腐化军团随时都可能生成！§!"
   kuat_plague.53.desc.1.0:0 "§H[from.GetName]§!是第一颗出现大面积§P感染§!病例的星球，但当地的人口统计表明我们的药物行之有效，截至目前死亡病例极少。\n出于防疫需要，当地管理部门已暂时封闭公共交通与空域，取消了所有集会和游行活动，并全面加强了预防检疫措施。\n星球上的聚居区根据感染程度被划分为绿区与黄区。在执法部门的协助下，配备生物检疫人员的检查站已开始逐区排查本地人口的健康状况。\n管理部门强烈建议，任何出现已知§P腐化§!症状的公民都应立即前往就近的医院或诊所就诊。\n\n我们必须严格执行隔离，尽一切可能维持秩序。"
   kuat_plague.53.desc.1.1:0 "星球§H[from.GetName]§!的管理部门向我们报告了大量§P具有致命后果的感染病例。§!\n因此当地戒严法已经出台，除非携带特殊证件通过专门前哨，否则禁止在定居点之间流动，相关行为将被视为进行生物恐怖主义行动。\n政府通过一项特别法令，决定将所有感染人口达到70%以上的黄色区域，重新指定为红色区域。从即日起，所有红色区域将与外界完全隔离，包括任何留在红色区域内的军队和医疗人员。在疫情结束前，不允许转移任何红色区域内人员。\n情报显示，有小型私人船只偷渡当地居民非法出境。\n\n我们必须尽一切手段保持检疫和维持秩序。"
   kuat_plague.53.desc.1.2:0 "在§H[from.GetName]§!上爆发了大量§P受感染者§!腐化的案例。\n因此导致了当地民众的巨大恐慌。有报告说，在黄色地区有军人逃兵以及大规模抢劫，并且似乎已经进入无政府状态。仅存的文明避难所是在行政当局附近设防的绿色区域，那里是剩余部队集中的地方。\n从红色区域传来的令人震惊的卫星图像显示，大批腐化原体大军正在向剩余的定居点移动。\n\n我们必须采取一切可能的方法保持检疫和维持秩序。"
   kuat_plague.53.desc.2.0:0 "分析人士认为，§H[fromfrom.solar_system.GetName]§!星系中的§H[fromfrom.GetName]§!是感染源。"
   kuat_plague.56.name:0 "§H[from.GetName]§!病亡增加"
   kuat_plague.56.desc.0:0 "另一波感染席卷了§H[from.GetName]，§!这里现在只留下空荡荡的城市！人们已经躲避在我们的军队保卫的设施当中，星球经济和工业活动已经完全停止，情况危急！"
   kuat_plague.57.name:0 "§Y[From.GetName]§!：越来越多的腐化原体"
   kuat_plague.56.desc.1:0 "我们越来越多的公民正在腐化，并随后补充壮大了腐化原体的队伍。当地政府正在向我们请求支援。我们应该想办法拯救我们的人民！"
   kuat_plague.56.0:0 "这真是可怕。"
   kuat_plague.56.1:0 "武装起来！"
   kuat_plague_block.tooltip:0 "点击禁用有关星球被感染的新闻。"
   kuat_plague.58.name:0 "幸存者"
   kuat_plague.58.desc:0 "我们收到了一个意料之外的信号，来自§H[from.GetName]§!。信号分析专家证实，这些信号不是预先录制的，也不是自动紧急广播，而是来自那些声称已经克服了感染的活生生的健康公民。\n\n在自愿的基础上，一群科学家被送到受感染的星球。在对幸存者进行检查时发现，他们的身体被多次咬伤和划伤，但是他们没有表现出§P腐化§!的任何症状。这将是一个令人振奋的信息，我们将迎来希望的曙光。"
   kuat_plague.58.0:0 "我们可以利用他们。"
   kuat_plague.61.name:0 "§H[from.GetName]§!没有响应"
   kuat_plague.61.desc:0 "尝试与§H[from.GetName]§!联系已经丢失。显然，没有人在星球感染后幸存下来，现在我们该完全放弃这颗星球了，这是帝国的至暗时刻。"
   kuat_plague.61.0:0 "悲哀的一天。"
   kuat_plague.152.name:0 "轰炸结束"
   kuat_plague.152.desc:0 "§H[from.leader.GetName]§!报告任务的完成情况。星球的生态环境几乎不会在短时间内恢复，星球上的一切都消失了，来自该星球的传染路径已经被完全消灭。"
   kuat_plague.152.0:0 "希望疫情尽快结束。"

   kuat_chain_plague_count_title:0 "§E感染报告§!"
   kuat_chain_plague_count_desc:0 "全银河正面对着所有知觉生命体被彻底毁灭的威胁！这场疑似来自古代无限帝国的腐化传染病，已经对全银河知觉文明造成了非常严重的打击，这是我们的专家根据瘟疫最终造成的破坏而列出的统计数据。"
   kuat_chain_plague_infested_planet:0 "受感染的行星数量"
   kuat_chain_plague_kill_pop_count:0 "人口被吞噬的数量"
   kuat_chain_plague_kill_planet_count:0 "行星被毁灭数量"
   kuat_chain_plague_infested_planet_total:0 "全银河被感染的行星数量"
   kuat_chain_plague_kill_pop_count_total:0 "全银河被吞噬的人口数量"
   kuat_chain_plague_kill_planet_count_total:0 "全银河被摧毁的行星数量"
   kuat_chain_plague_zombie_count_total:0 "发现的成群腐化原体总数"

   edict_kuat_plague_quarantine:0 "§E隔离§!"
   edict_kuat_plague_quarantine_desc:0 "彻底检查所有的货物和严格遵守检疫规则将有助于控制腐化传播。\n禁止在受感染的星球执行迁移。"

   kuat_decision_plague_psi_clear:0 "瘟疫：灵能净化"
   kuat_decision_plague_psi_clear_desc:0 "特殊仪式将使用虚境的力量来清除整个星球上所有瘟疫实体，瞬间治愈所有感染者。但请注意，瘟疫可以§P重新感染§!这个星球。"

   kuat_decision_plague_planet_bombardment:0 "瘟疫：清除感染"
   kuat_decision_plague_planet_bombardment_desc:0 "命令海军轰炸这个星球并毁灭这颗星球，届时所有生命都将被消灭，最终将瘟疫从星球上彻底清除。\n§R警告：这将会彻底摧毁这个星球上所有的人口，在其他帝国眼中也算是一种清洗。这个决定是不可逆转的！§!"

   kuat_plague_quarantine_fail:0 "§R你必须拥有一个感染星球才能使用这个法令！§!"
   bombardment_kuat_stance_plague_spread:0 "瘟疫散播"
   bombardment_kuat_stance_plague_spread_desc:0 "这个轰炸姿态在每次轰炸周期后都有机会在目标星球上散播腐化病毒。"

   kuat_plague_lvl_1:0 "腐化"
   kuat_plague_lvl_1_desc:0 "这颗星球被一种全新的致命腐化疾病所感染，所幸疾病已经被控制，其影响应该会很快消退。"
   kuat_plague_lvl_2:0 "大瘟疫"
   kuat_plague_lvl_2_desc:0 "感染已在全球传播，星球上的人口正在缓慢但稳定地减少。"
   kuat_plague_lvl_3:0 "§R腐化原体瘟疫§!"
   kuat_plague_lvl_3_desc:0 "这颗星球陷入恐慌。人口试图通过各种途径逃离这里。"
   kuat_unity:0 "国家启示"
   kuat_unity_desc:0 "国家启示。"
   kuat_plague_bombardment_planet:0 "轰炸的后果"
   kuat_plague_bombardment_planet_desc:0 "为了防止瘟疫进一步摧残我们的帝国，我们做出了一个艰难的决定——牺牲这颗星球上的所有生命来保全其他所有人的安全。"
   gateway_kuat_plague:0 "$kuat_plague_lvl_2$"
   kuat_plague.9.desc.3:0 "我们的§P灵能者§!得到了新的指示，现在可以有效地降低民众的发病率。这些灵能者通过通灵能力，试图向“古神”询问本次疫情的根源，但很显然他们并没有获得什么明确的线索，仅捕捉到了一些奇怪的只言片语：\n\n无限……灾祸……原力……崩塌……"
   kuat_plague.9.desc.4:0 "我们的科学家§P发现了一种特殊的仪式§!——用虚境的能量净化星球。尽管这不能避免新一波感染，但可以使部分人群产生免疫力。他们还听到了虚空中传来的一些诡异低语：\n\n免疫……未来……希望……永恒……"
   kuat_plague.9.desc.5:0 "\n非法移民和资源运输是其传播的主要因素。我们已经制定了§P一套措施§!能够减缓致病因子的扩散。\n致病因子的主要载体是活着的生物，因此预计在§P人口稠密的星球§!会有更快的传播速度。\n\n§H[root.ruler.GetName]，§!报告结束。"
   kuat_plague.63.name:0 "星球净化完成"
   kuat_plague.63.desc:0 "我们强大的军队降落在了§H[root.GetName]§!并将§R腐化原体群§!从其上根除。现在我们可以派遣殖民者而不必担心他们被感染了。\n\n应我们疾控中心的要求，为了避免污染，§P所有基础设施都将被封闭与拆除§!。"
   kuat_plague.63.0:0 "只要团结起来，我们就不可战胜！"
   kuat_plague.63.1:0 "给相关人员颁奖！"
   kuat_plague.63.2:0 "这不是我们名单上的最后一个。"
   kuat_plague.63.4:0 "加强周边防御！"
   kuat_plague.63.6:0 "荣耀归于造物主！"
   kuat_plague.170.name:0 "瘟疫解药被发明！"
   kuat_plague.170.desc.0:0 "通过对§R腐化原体群§!及感染病例生物数据的化验与抗原蛋白测试，我们的研究人员终于找到了彻底免疫这类疾病的方法，并提交了专项研究报告。\n\n报告显示，通过对病毒爆发源头的追溯，我们发现该病毒的本质与$Name_Kuat_StarContractor$接触通道中的亚空间能量极为相似，所谓的“腐化”实则是亚空间力量坍缩至物质世界所形成的产物。我们所遭遇的腐化正是从解封亚空间能量的星系中扩散开来的，而这些残留的瘟疫，正是当年导致远古拉卡塔人走向毁灭的元凶。\n\n简言之，这是源自祂们所在空间的一种特殊能量形态。它会对特定生物的基因造成剧烈冲击，在赋予宿主强大再生能力的同时，剥夺其大部分基于基因系统的原力特性。然而由于能量极不稳定，受感染个体会彻底丧失神智，沦为受原始吞噬本能驱使的怪物，并通过血液接触发起狂暴攻击，从而不断扩大传染范围。\n\n如今，我们的专家终于找到了根治之法：只需对我们的种族基因进行靶向改造，使其获得永久免疫，便能彻底摆脱疫情的威胁。此外，我们还应考虑人道主义援助事宜——是否向其他国家出口并分享我们研发的疫苗？"
   kuat_plague.170.desc.1:0 "众多参与疫苗开发的科学家认为，我们应该与不发达的国家分享解药数据。"
   kuat_plague.170.0:0 "将它分享给任何人"
   kuat_plague.170.1:0 "将它分享给我们的朋友"
   kuat_plague.170.1.tooltip:0 "包括联邦"
   kuat_plague.170.2:0 "只分享给我们的联邦盟友。"
   kuat_plague.170.3:0 "分享给异族？不。"
   kuat_plague.171.name:0 "获得瘟疫解药"
   kuat_plague.171.desc:0 "§H[from.GetName]§!的科学家们与我们分享了关于瘟疫解药的数据，现在我们拥有了解决这该死的疫情的解药，恢复生存环境指日可待。"
   kuat_plague.171.0:0 "非常好。"
   kuat_plague.173.name: "黎明"
   kuat_plague.173.desc:0 "根据疾控中心汇总的各方信息，肆虐全国的§R腐化§!传染病在帝国境内已丧失了所有已知的传播途径。如今，我们的任何一颗星球都已不再受这场危机威胁。不过，全宇宙范围内的疫情仍在蔓延，我们依然不能掉以轻心。但无论如何，我们总算安全了。\n\n这场源自远古拉卡塔人的残留瘟疫终于走向尾声，昔日的阴霾即将彻底消散，新的曙光正照耀着整片银河。\n\n然而，这场瘟疫究竟是如何跨越千万年的时光延续至今的？被恩多迪亚人封印的时空裂隙与亚空间又有着怎样的联系？这场危机背后仍然疑点重重。"
   kuat_plague.173.a: "非常好。"

   kuat_plague.174.name:0 "$PSIONIC_AURA$冲突"
   kuat_plague.174.desc:0 "§H[from.GetName]§!恒星系内我们的§H$PSIONIC_AURA$§!正在与来自附近§H[fromfrom.GetName]§!恒星系的§M拉卡塔瘟疫§!光环进行激烈斗争。我们的灵能[GetResearchers]曾对这种行为进行过建模，但这是我们第一次获得这种现象的一手资料。\n\n理论上来说，越强的光环——就是说投射的强度越大——将会逐渐驱散敌对力量，如果这种斗争导致一方完败，占主导地位的光环可能就会流入空出来的恒星系。\n\n这真是字面意义上的“灵魂的碰撞”。\n\n不幸的是，§H[fromfrom.GetName]§!内的$PSIONIC_AURA$过于强大了，我们的常规灵能对抗手段根本没有任何效果。"
   kuat_plague.174.a:0 "我们不能失败！"

   kuat_plague.175.name:0 "$shroud.4950.title$"
   kuat_plague.175.desc:0 "我们在§H[from.GetName]§!恒星系探测到了高浓度灵能能量。我们的[GetTelepathPlural]通过倾听§H亚空间§!中的回声，并结合我们在舰队支援中心的所作所为得知，这一现象是由造成古代拉卡塔人灭绝的瘟疫活动引起的，在我们解除舰队支援中心的限制之前，这一黑暗瘟疫活动被封印在亚空间裂隙中。\n\n它曾经让无限帝国丢失了引以为傲的黑暗原力，也让恩多迪亚帝国止步于亚空间之门户之前，这一活动与我们所知的灵能光环活动具备一定的相似性。因此其与$PSIONIC_AURA$一样，具备影响着可观测现实宇宙的能力，我们还可以确定的是瘟疫活动将在恒星系之间传播。\n\n我们的数据显示，该疫情有极强的负面影响。如果不加以应对，它将会快速传遍整个星系。"
   kuat_plague.175.a:0 "令人担忧。"

