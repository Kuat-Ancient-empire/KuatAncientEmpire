   kuat_tech_plague_immune:0 "瘟疫：免疫"
   kuat_tech_plague_immune_desc:0 "工程病毒会记住瘟疫的仿制模板，并将这些信息传递给宿主的免疫系统。"
   kuat_tech_plague_spread:0 "传播瘟疫"
   kuat_tech_plague_spread_desc:0 "我们也许不知道§P瘟疫§!如何工作的，但是我们可以把“感染”从我们的行星上驱逐，然后把它们带到我们需要的地方。"

   kuat_plague_zombie_army:0 "腐化原体部落"
   kuat_plague_zombie_army_plural:0 "腐化原体"
   kuat_plague_zombie_army_cap: "$kuat_plague_zombie_army$"
   kuat_plague_zombie_army_desc:0 "在传统意义上，很难把这些东西称为“军队”，因为这群腐化原体没有表现出任何与战术和战略相似的东西，他们只剩下疯狂和杀戮，以及啃食。然而，他们躲在大城市难以到达的地方的习惯使得清理工作变得困难和危险。"

   kuat_auto_planet_defender:0 "自动防卫无人机"
   kuat_auto_planet_defender_plural:0 "自动防卫无人机"
   kuat_auto_planet_defender_cap: "$kuat_auto_planet_defender$"
   kuat_auto_planet_defender_desc:0 "在传统意义上，很难把这些东西称为“军队”，因为这些机械仅仅是用于维护整个智能管理世界服务器群的劳工机器人，但是在敌人入侵时，这些机器人仍然要不知疲倦的加入战斗，这些机器人似乎是由服务器中的数据意识操纵的，每2个机器人阵亡就意味着星球损失了一位公民。"

