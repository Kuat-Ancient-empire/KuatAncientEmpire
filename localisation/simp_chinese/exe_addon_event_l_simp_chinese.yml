l_simp_chinese:

  kuat_galatic_empire_oc_invasion_chain_title:0 "$Name_Kuat_Fire_base$§E的怒火§!"
  kuat_galatic_empire_oc_invasion_chain_desc:0 "自$Name_Kuat_Fire_base$不可告人的秘密被戳破以后，他们丑陋的嘴脸便毫无保留地展现在了全星系面前。他们为了算计$Name_kuat$不惜一切代价，最终我们为其战略溃败送上了致命一击。\n\n虚伪的$Name_Kuat_Fire_base$绝不会善罢甘休，他们即将对我们的星系展开全面进攻。任何避免战争的可能都已彻底消失，现在该让我们送他们回老家了。"

  kuat_galatic_empire_e_area_arc_site_project_1: "§E重新锚定跳跃星门§!"
  kuat_galatic_empire_e_area_arc_site_project_1_DESC: "利用我们在恩多迪亚遗迹中获得的同位素5重新排列星门的导航地址。可以预见，这将极大削弱未来抵达我们星系的$Name_Kuat_Fire_base$舰队。届时，便是我们与$Name_Kuat_Fire_base$决一死战的时刻。"


  kuat_fallen_mission_reaction.24.desc:0 "好好好，你们真是令人意外。当初选中你们正是因为你们的过去——你们的先祖恩多迪亚帝国曾亡于$Name_kuat$之手，是我们让你们得以延续至今，而你们竟然背叛我们，反过来帮助$Name_kuat$。\n\n我们给予你们的支持本足以让你们重回巅峰，甚至超越你们的先祖。既然你们不珍惜这一切，那么我们会让你们明白，背叛监视者的下场是什么。"
  kuat_fallen_mission_reaction.24.accept:0 "我们只是不想做你们的提线木偶。"
  kuat_fallen_mission_reaction.24.accept.res:0 "这只是你们卑劣行径的借口，在利益面前，这些尊严都是可笑的东西。\n\n你们难道还在奢求$Name_kuat$会拯救你们？这场闹剧，是该结束了。"

  kuat_fallen_mission_reaction.25.title:0 "$Name_Kuat_StarContractor$"
  kuat_fallen_mission_reaction.25.desc:0 "好久不见啊，我们又见面了，这些无礼的人占据我们的地盘这么久，真是令人恼火，不过，刚刚清理了一下，舒服多了。\n\n你们的状态看起来不太妙，$Name_Kuat_Fire_base$很快会动用弑星者基地毁灭你们。你们运气很好，$Name_Kuat_StarContractor$对你很感兴趣，哦不，对“你”很感兴趣，因此只要你们肯付出一些代价，我们就能阻止这一切，这么划算的交易，可不多了。"
  kuat_fallen_mission_reaction.25.accept:0 "我们交易。"
  kuat_fallen_mission_reaction.25.accept.res:0 "真是美味，我们已经扭曲了这个星系，现在$Name_Kuat_Fire_base$的基地将无法锁定这里了。在这片星域，还藏着$Name_Kuat_Fire_base$的一个基地，解决它，或许还有一线生机。"

  kuat_fallen_mission_reaction.26.title:0 "$Name_Kuat_StarContractor$"
  kuat_fallen_mission_reaction.26.desc:0 "不错啊，不愧是你，这么快就找到了[kuat_galatic_empire_e_area_system.GetName]，这曾经可是一个辉煌的文明，还正好是你们的过去，不过已经太久远了，你们终究不是它。\n\n不过来都来了，只要你们能付出代价，我们就能给予你们更多生存的机会，这么划算的交易，可不多了。"
  kuat_fallen_mission_reaction.26.accept:0 "那我们该如何应对$Name_Kuat_Fire_base$呢？"
  kuat_fallen_mission_reaction.26.accept.res:0 "非常好，看到星域中央的跳跃星门了吗？这里的同位素5可以将其重新锚定。你们之前帮助的$Name_kuat$在离开前关闭了所有通往这里的通道，你们只需要重定向整个星系的跳跃星门，届时大部分$Name_Kuat_Fire_base$舰队都将无法找到你们的所在地，而一个被削弱的$Name_Kuat_Fire_base$就足以应付了。\n\n只要你们顺利执行，一切都会结束。不得不说，“你们”真的很有趣。"

  kuat_fallen_mission_reaction.27.title:0 "$Name_Kuat_StarContractor$"
  kuat_fallen_mission_reaction.27.desc:0 "“你们”真是让人感到不可思议，如此高的执行效率，真是闻所未闻！\n\n不过，$Name_Kuat_Fire_base$要来了，不要死了哦。好久没出现这么有意思的事情了。"
  kuat_fallen_mission_reaction.27.accept:0 "我们不会死的。"

  kuat_galatic_empire_ge_invasion.102.a.desc:0 "帝国科研部门捕获了一个奇怪的信号频段。该频段呈现出某种不规则的频率特征，与我们此前所见的截然不同。经过科研人员的深入分析，我们发现这一信号发自一个从未在星图上标记过的隐秘星系。\n\n正如$Name_Kuat_StarContractor$所料，我们找到了$Name_Kuat_Fire_base$的驻军星系。国防部官员声称，如果我们不能进行先发制人的打击，就会在接下来$Name_Kuat_Fire_base$的报复中处于被动境地。"

  kuat_galatic_empire_ge_invasion.110.a.desc:0 "§H[Root.GetName]§!在穿过超平面航道后，到达了一片怪异的领域。整个§H[From.GetName]§!内不仅没有正常的恒星，而且还遍布各种舰船的残骸。\n\n在§H[From.GetName]§!的中心，§H[Root.GetName]§!检测到了一个人造引力井，辐射半径超过600AU，其源头应当是位于星系中央那座庞大而残破的星门建筑。在星门周围，大量奇特的受损星环环绕着中央的巨型构造体。经过探测，这些星环已被彻底摧毁，似乎没有任何一座能够投入正常使用。同时，我们的侦察人员发现，集结于该星系的$Name_Kuat_Fire_base$舰队似乎尚未收到来自$Name_Kuat_Fire_base$本部的指令，暂时没有对我们发起攻击——这正是我们先发制人的绝佳良机。"

  kuat_galatic_empire_ge_invasion.114.a.desc:0 "你们这些蝼蚁，居然敢背叛我们！接下来你们该好好迎接我们的怒火了，我们会用舰队把你们的核心世界一个个炸成碎片，让你们的种族彻底沦为低等物种。"

  kuat_galatic_empire_ge_invasion.120.a.desc:0 "真是该死！你们这些土著为什么会有这样的舰队？不要以为有了那些商人的支持就能战胜我们！等跳跃星门重启的那一天，你们的星域、你们的帝国、你们的文明，都会被我们彻底抹除！"

  kuat_galatic_empire_ge_invasion.126.a.desc:0 "我们的研究人员在成功进入这座若隐若现的中央尖塔后，发现在岁月的侵蚀下，尖塔内部的结构已经严重损毁，包括塔内的一些精密防卫仪器与自动机器人均已无法正常运转，这为我们调查团队的行动提供了极大的便利。\n\n调查团队很快便找到了位于遗迹中央的数据库储存设施，并通过一系列技术手段成功破译了外围封锁，从中发现了令人惊讶的数据。\n\n在解开数据库的深层加密后，我们在其中找到了重新封闭跳跃星门的关键——利用残留的同位素5重新锚定星门地址，以此限制通过星门的海军吨位，从而尽可能地削减$Name_Kuat_Fire_base$抵达此地的舰队数量。"

  kuat_galatic_empire_ge_invasion.130.a.desc:0 "位于[kuat_galatic_empire_e_area_system.GetName]的跳跃星门已经完成锚定。现在，$Name_Kuat_Fire_base$的主力部队将无法正常通过跳跃星门向我们的星域投送庞大舰队。\n\n届时，这场战争的主动权将尽在掌握——本土作战，优势在我。"

  kuat_galatic_empire_ge_invasion.131.a.desc:0 "正如$Name_Kuat_StarContractor$所说，$Name_Kuat_Fire_base$的抵达是无法避免的，我们必须尽早解决来自$Name_Kuat_Fire_base$的威胁。这些蠢货还不知道我们已经完成了对跳跃星门的重定向，任何超过我们承受极限的舰队都无法进入我们的星系。\n\n重定向无法维持太长时间，眼下正是星门规则限制最强的时期，该让我们请君入瓮了。修复跳跃星门，送他们最后一程。"

  kuat_galatic_empire_ge_invasion.132.a.desc:0 "我们的研究人员成功地完成了对星门的修复工程。从同位素5信号接收器的反馈来看，星门的开启迅速引起了星门彼岸的注意。\n\n这意味着我们计划的第一步已经成功，接下来就只需静待猎物上门了。"

  kuat_galatic_empire_ge_invasion.202.a.desc:0 "我们的情报部门监听到了星系外传来的一串强烈快子信号。天文观测表明，虽然目前还无法精准测定其源头，但观测数据显示它似乎正是由我们的$NAME_kuat_galatic_empire_e_area$星系星门所发出。我们暂时还无法解读信号的具体内容，但毫无疑问，这应当是$Name_Kuat_Fire_base$舰队即将抵达的征兆。"

  kuat_galatic_empire_ge_invasion.203.a.desc:0 "我们最近的天文观测表明，我们所占领的$NAME_kuat_galatic_empire_e_area$的跳跃星门出现了不寻常的能量活动，$Name_Kuat_Fire_base$就要来了。"

  kuat_galatic_empire_ge_invasion.204.a.desc:0 "我们的情报部门近来监听到了一系列的超空间滑流，$Name_Kuat_Fire_base$的舰队正在通过某种人造的单向超空间航道和我们的跳跃星门高速靠近我们的星系，预计很快就会到达。根据它们靠近的轨迹，这场你死我活的战争大戏，即将开始。"

  kuat_galatic_empire_ge_invasion.205.a.desc:0 "我们最近的天文观测表明，我们控制的$NAME_kuat_galatic_empire_e_area$的跳跃星门出现了不寻常的能量活动，相比上次，$Name_Kuat_Fire_base$舰队搞出的动静更大了，我们的战士需要做好准备。"

  kuat_galatic_empire_ge_invasion.206.a.desc:0 "第一批河外舰队已经进入我们控制的$NAME_kuat_galatic_empire_e_area$引力井并环绕中心运行，后续舰队很快也将到达。截至目前，他们仍未对我们的通讯做出任何回应，也尚未表现出敌对行为。正如$Name_Kuat_StarContractor$所说，$Name_Kuat_Fire_base$终究成功抵达了我们的星系。但好在我们的计划进展顺利，跳跃星门的重定向阻挡了大批来自$Name_Kuat_Fire_base$的精锐主力，现在我们只需要清理掉这些漏网之鱼，就能一劳永逸地赶走他们。"

  kuat_galatic_empire_ge_invasion.207.a.desc:0 "你们这些该死的低等种族，居然敢算计我们！你们难道以为有了$Name_kuat$的暗中支持，就能战胜我们了？\n\n你们只不过是我们的提线木偶，胆敢反叛，就唯有死无葬身之地！\n\n不得不说，$Name_kuat$居然帮你们关闭了其他跳跃星门，但这又有什么用呢？他们将会因此受到最严厉的惩罚，而你们的下场，只有毁灭。"

  kuat_galatic_empire_ge_invasion.212.a.desc:0 "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_Kuat_Fire_base$应该会从该处建立基地对我们发动进攻。"

  kuat_galatic_empire_ge_invasion.212.b:0 "让舰队做好准备。"

  kuat_galatic_empire_oc_invasion_secondary_portal_poi:0 "§E跳跃星门§!"
  kuat_galatic_empire_oc_invasion_secondary_portal_poi_desc:0 "跳跃星门是$Name_kuat$利用对永恒舰队同位素5元素的研究制造出的一种特殊星际航行工具，他们可以迅速地通过跳跃星门部署军事力量。如今，这些星门被$Name_Kuat_Contractor$所操控，显然$Name_kuat$已无法阻止他们强取豪夺的行径。现在一切只能靠我们自己了，如果我们想要战胜他们，就必须摧毁跳跃星门！"

  kuat_galatic_empire_ge_invasion.213.a.desc:0 "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_Kuat_Fire_base$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.213.b:0 "怎么还有一个？"

  kuat_galatic_empire_ge_invasion.214.a.desc:0 "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_Kuat_Fire_base$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.214.b:0 "还有？该死的。"

  kuat_galatic_empire_ge_invasion.215.a.desc:0 "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_Kuat_Fire_base$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.215.b:0 "真是阴魂不散。"

  kuat_galatic_empire_ge_invasion.216.a.desc:0 "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_Kuat_Fire_base$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.216.b:0 "该死，还有完没完。"

  kuat_galatic_empire_ge_invasion.217.a.desc:0 "我们的科研部门通过天文观测发现了一个新的跳跃星门，我们应该迅速组织舰队调查该区域，$Name_Kuat_Fire_base$应该会从该处建立基地对我们发动进攻。"
  kuat_galatic_empire_ge_invasion.217.b:0 "希望是最后一个。"

  kuat_galatic_empire_ge_invasion.220.a.desc:0 "在我们周密计划的推动下，$Name_Kuat_Fire_base$的入侵被彻底粉碎，这些虚伪的强盗永远都无法战胜我们。如果$Name_Kuat_StarContractor$所言非虚，接下来我们的星域将彻底封闭，$Name_Kuat_Fire_base$再也无法染指此地。如今我们的力量虽尚显不足，但只要有足够的时间韬光养晦，未来终将属于我们。\n\n$Name_Kuat_Fire_base$因傲慢而败亡，我们绝不能重蹈覆辙，全新的恩多迪亚帝国将由此启航。"

  kuat_galatic_empire_ge_invasion.232.a.a.desc:0 "$Name_Kuat_Fire_base$已经彻底炸毁了[from.GetName]，现在那里除了一颗破碎的星球外什么也没有了。"
  kuat_galatic_empire_ge_invasion.232.b.a.desc:0 "$Name_Kuat_Fire_base$已经彻底炸毁了[from.GetName]，现在那里除了一段面目全非的环形世界区段外什么也没有了。"
  kuat_galatic_empire_ge_invasion.232.c.a.desc:0 "$Name_Kuat_Fire_base$已经彻底炸毁了[from.GetName]，现在那里除了一堆居住站的残骸外什么也没有了。"
  kuat_galatic_empire_ge_invasion.232.d.a.desc:0 "$Name_Kuat_Fire_base$已经彻底炸毁了[from.GetName]，现在那里除了一颗四分五裂的星球外什么也没有了。"

  kuat_galatic_empire_ge_invasion.235.a.desc:0 "我们的舰队成功地摧毁了一座$Name_Kuat_Fire_base$构造的子跳跃星门，现在这里将不会出现$Name_Kuat_Fire_base$的增援舰队了。"

  kuat_galatic_empire_ge_invasion.236.a.desc:0 "他人的舰队成功地摧毁了一座$Name_Kuat_Fire_base$构造的子跳跃星门，现在这里将不会出现$Name_Kuat_Fire_base$的增援舰队了。"

  kuat_galatic_empire_ge_invasion.237.a.desc:0 "我们的舰队成功地摧毁了主跳跃星门的所有防御系统，现在这个星门将不会出现$Name_Kuat_Fire_base$的增援舰队了。"

  kuat_galatic_empire_ge_invasion.238.a.desc:0 "他人的舰队成功地摧毁了主跳跃星门的所有防御系统，现在这个星门将不会出现$Name_Kuat_Fire_base$的增援舰队了。"
